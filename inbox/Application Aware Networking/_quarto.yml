# AAN series — Quarto project + the FEDERAL edition's agency facts.
#
# Two editions render from this one source (AAN_Series_Expansion_Plan §11, author
# decision: "SSA-first now; extract a Federal-agnostic edition in a later pass").
# This is that pass.
#
#   FEDERAL edition  — the default. `quarto render <book>.qmd` with no profile
#                      resolves the values below. Publishes to the site.
#   SSA edition      — Pandoc only:
#                        python expand_meta.py _agency-ssa.yml <book>.qmd out.qmd
#                        pandoc out.qmd ... (see render_all_docx.sh --edition ssa)
#
# WHY THE SSA EDITION IS NOT A QUARTO PROFILE. Quarto only reads
# `_quarto-<profile>.yml` from the PROJECT directory. Once the books move under
# docs/, a `_quarto-ssa.yml` would have to sit in the public repo — which is
# exactly what "the SSA edition lives segregated in inbox until a Moderate-boundary
# GitHub exists" forbids. Pandoc's --metadata-file takes any path, so the SSA facts
# can stay outside the published tree. The file is deliberately NOT named
# `_quarto-ssa.yml`, so `--profile ssa` cannot silently activate it.
#
# FEDERAL IS THE DEFAULT ON PURPOSE. A render with no edition selected produces the
# generic edition. Forgetting the flag can never leak agency facts.
project:
  type: default

agency:
  # BARE proper noun. The workhorse: it stands where "SSA" stood, so it must
  # compose -- "Agency-wide", "Agency's estate", "Agency employees". An article
  # here would produce "the Agency-wide", which is why short != name.
  short: "Agency"
  # Article-carrying form, for prose that read "the SSA CIO Office".
  name: "the Agency"
  # Formal name, bare -- the prose supplies the article
  # ("The {{< meta agency.full >}} operates four environments").
  full: "Agency"
  # Formal name WITH the acronym gloss on first use. Composing full + short by
  # hand yields "the Agency (Agency)" in this edition, which is why it is one key.
  formal: "Agency"
  domain: "agency.gov"
  tenant: "tenant.onmicrosoft.com"
  portal: "my.agency.gov"
  cio_office: "the Agency CIO office"
  security_office: "the Agency security office"
  # The enabling statute an agency cites for a PT-2 authority matrix. The federal
  # edition names none, because a generic agency cites its own.
  statute: "the agency's enabling statute"
