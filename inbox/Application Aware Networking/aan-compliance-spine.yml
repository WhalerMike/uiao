# =============================================================================
# aan-compliance-spine.yml
# The single source of truth for the Federal Application-Aware Networking
# series compliance mapping (NIST · FedRAMP 20x · CISA · EO/OMB · statute).
#
# Every book's "Authorities Closed Here" table is GENERATED from this file by
# render_authorities_table.py. Do not hand-edit those tables in the .qmd — edit
# this spine and regenerate. The drift gate (render_authorities_table.py --check)
# fails CI when a committed book partial diverges from what the spine produces.
#
# Scope parameter (hard): FedRAMP Moderate only. Never map to High.
# Status: SEED — authority + book registries complete; closures authored for the
# two new substrate books and the Book 00 doctrine anchors. Remaining per-book
# closures are added as each book is propagated (sequential, author-in-the-loop).
# Date Code: 2026-07-08 14:07 ET
# =============================================================================

meta:
  series: Federal Application-Aware Networking
  baseline: NIST SP 800-53 Rev 5 — FedRAMP Moderate (800-53B Moderate baseline)
  scope: FedRAMP Moderate only
  edition: SSA          # SSA-first; federal-agnostic edition extracted later
  date_code: "2026-07-09 15:13 ET"

# -----------------------------------------------------------------------------
# Volumes. The series is ONE program with ONE spine, presented as named volumes,
# each independently distributable. `books` order within a volume is the
# authoritative reorder sequence (volume-local numbering); the per-book
# target_slot below is now indicative only. This is the "joined, but different
# series" structure — cross-references and this SSOT stay unified.
# -----------------------------------------------------------------------------
# Book 00 (Executive Summary) covers all volumes and is the program keystone;
# it heads Volume 0 (Executive Summary & Program), which also carries the
# Product Inventory Questionnaire as a book.
keystone: book-00

volumes:
  - {id: vol-0, title: "Executive Summary & Program", books: [book-00, book-questionnaire, book-crosswalk]}
  - {id: vol-1, title: "Foundation & Transport", books: [book-vol1-intro, book-01, book-02, book-03, book-04, book-05, book-06, book-net-enforce]}
  - {id: vol-2, title: "Data Platform", books: [book-vol2-intro, book-07, book-08, book-09]}
  - {id: vol-3, title: "Security Operations", books: [book-vol3-intro, book-10, book-11, book-patch-sysmgmt, book-cloudnative-posture, book-12, book-13, book-evidence-fabric]}
  - {id: vol-4, title: "Governance & Assurance", books: [book-vol4-intro, book-14, book-15, book-16, book-17, book-18, book-19]}
  - {id: vol-5, title: "Training & Certification", books: [book-vol5-intro, book-vol5-compliance-track, book-vol5-implementation-track, book-vol5-assessment-cert, book-vol5-vendor-labs]}
  - {id: vol-6, title: "Implementation", books: [book-vol6-intro, book-impl-landingzone-iac, book-impl-identity-as-code, book-impl-detection, book-impl-soar, book-impl-dataprotection, book-impl-baselines, book-impl-evidence-pipeline, book-impl-validation]}
  - {id: vol-7, title: "ServiceNow Automation for Federal Control Compliance", books: [book-vol7-intro, book-sn-cmdb, book-sn-m365, book-sn-azure, book-sn-attestation, book-sn-app]}
  # Volume VIII is the multi-cloud DDI landing-zone automation book (the InfoBlox
  # DDI kit), merged in as a named series volume by author direction (2026-07-12).
  # It is intentionally BROADER than the GCC-Moderate scope of the rest of this
  # task: it spans Azure, AWS, GCP, OCI, and VMware. Its chapter content lives at
  # the repo-root `infoblox-ddi-book/` (independently distributable); the series
  # binds it via this spine + the Vol VIII overview + cross-references, without
  # relocating the 70-file kit.
  - {id: vol-8, title: "Multi-Cloud DDI Landing-Zone Automation", books: [book-ddi-intro, book-ddi-azure, book-ddi-aws, book-ddi-gcp, book-ddi-oci, book-ddi-vmware, book-ddi-xplat, book-ddi-servicenow, book-ddi-impl, book-ddi-appendix]}

