# SSA edition — the agency-specific facts, segregated.
#
# This file is the ONLY place SSA's identity lives in the corpus. Every book is
# authored generic; the SSA edition is produced by substituting these values in
# (expand_meta.py) before a Pandoc render.
#
# IT STAYS IN inbox/. When the books move under docs/ to publish, this file does
# NOT go with them — that is the whole point. inbox/ sits outside the Quarto
# project root, so nothing here can render to the public site by accident.
# Eventually it belongs in the Moderate-boundary repo; inbox/ is the staging
# ground until that exists.
#
# NOT named `_quarto-ssa.yml` deliberately: that name would make Quarto treat it
# as a profile and load it from a project directory. It must never be loadable
# that way.
#
# Usage:
#   python expand_meta.py _agency-ssa.yml <book>.qmd /tmp/out.qmd
#   ./render_all_docx.sh --edition ssa

agency:
  short: "SSA"
  name: "SSA"
  full: "Social Security Administration"
  formal: "Social Security Administration (SSA)"
  domain: "ssa.gov"
  tenant: "ssagov.onmicrosoft.com"
  portal: "myssa.ssa.gov"
  cio_office: "the SSA CIO Office"
  security_office: "the Office of Information Security (OIS)"
  statute: "the Social Security Act"
