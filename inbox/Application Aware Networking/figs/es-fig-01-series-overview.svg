  <text x="182" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#33414F">PAM · VulnMgmt · Purview</text>
  <text x="182" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#33414F">SIEM/XDR · Business Continuity</text>
  <text x="182" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#33414F">~55 controls closed or deepened</text>

  <!-- Parts 15-17 -->
  <rect x="345" y="476" width="285" height="112" rx="8" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="1.25"/>
  <text x="487" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#6B7A8D">PARTS 15–17</text>
  <text x="487" y="521" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#0D1B2E">Risk &amp; Program Governance</text>
  <text x="487" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#33414F">SCRM · PM governance</text>
  <text x="487" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#33414F">PII processing transparency</text>

  <!-- Part 18 -->
  <rect x="650" y="476" width="285" height="112" rx="8" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="1.25"/>
  <text x="792" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#6B7A8D">PART 18</text>
  <text x="792" y="521" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#0D1B2E">Training &amp; Awareness</text>
  <text x="792" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#33414F">Role-based curriculum</text>
  <text x="792" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#33414F">KSI-CED evidence</text>

  <!-- Part 19 -->
  <rect x="955" y="476" width="285" height="112" rx="8" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="1.25"/>
  <text x="1097" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#6B7A8D">PART 19</text>
  <text x="1097" y="521" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#0D1B2E">Authorization Package</text>
  <text x="1097" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#33414F">OSCAL bundle</text>
  <text x="1097" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#33414F">Continuous monitoring (CA-7)</text>

  <!-- ================= FOOTER BADGE (six original tracks) ================= -->
  <rect x="270" y="616" width="740" height="72" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <circle cx="306" cy="640" r="6" fill="#1E8C8C"/>
  <text x="322" y="645" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E">Six original tracks (Parts 1 and 5–9) close 34 distinct NIST SP 800-53 Rev 5 controls</text>
  <text x="322" y="668" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F">Marked with a teal dot above — all nineteen parts generate machine-readable KSI evidence for FedRAMP 20x</text>
</svg>
