<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-teal" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#0D1B2E">Federal Application-Aware Networking Series</text>
  <text x="640" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6B7A8D">Substrate, Modernization, Operations — One Compliance Architecture</text>

  <!-- ================= BAND 1: SUBSTRATE ================= -->
  <text x="40" y="104" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#5A5A5A">SUBSTRATE — NAMING, IDENTITY, AND TRUST FOUNDATIONS (PARTS 1–4)</text>

  <!-- Part 1 -->
  <rect x="40" y="112" width="285" height="118" rx="8" fill="#0D1B2E"/>
  <circle cx="309" cy="128" r="6" fill="#1E8C8C"/>
  <text x="182" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#EAF1FB">PART 1</text>
  <text x="182" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Landing Zone — IPAM / DDI / PKI</text>
  <text x="182" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#FFFFFF" fill-opacity="0.85">InfoBlox DDI · DNSSEC · RPZ · certificates</text>
  <text x="182" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">16 NIST controls closed</text>

  <!-- Part 2 -->
  <rect x="345" y="112" width="285" height="118" rx="8" fill="#0D1B2E"/>
  <text x="487" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#EAF1FB">PART 2</text>
  <text x="487" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Network Access Control</text>
  <text x="487" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#FFFFFF" fill-opacity="0.85">802.1X · RADIUS · device identity</text>
  <text x="487" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#FFFFFF" fill-opacity="0.85">at the port</text>

  <!-- Part 3 -->
  <rect x="650" y="112" width="285" height="118" rx="8" fill="#0D1B2E"/>
  <text x="792" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#EAF1FB">PART 3</text>
  <text x="792" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Certificates &amp; Tokens</text>
  <text x="792" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#FFFFFF" fill-opacity="0.85">Cryptographic identity · PKI lifecycle</text>
  <text x="792" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#FFFFFF" fill-opacity="0.85">token issuance</text>

  <!-- Part 4 -->
  <rect x="955" y="112" width="285" height="118" rx="8" fill="#0D1B2E"/>
  <text x="1097" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#EAF1FB">PART 4</text>
  <text x="1097" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">HRIT Identity &amp; Org SSOT</text>
  <text x="1097" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#FFFFFF" fill-opacity="0.85">HR system of record</text>
  <text x="1097" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#FFFFFF" fill-opacity="0.85">joiner-mover-leaver lifecycle</text>

