  <text x="233" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#6B7A8D">PART 5</text>
  <text x="233" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E">Network &amp; Identity Modernization</text>
  <text x="233" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F">Entra ID · ZTNA · access governance</text>
  <text x="233" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E">12 NIST controls closed</text>

  <!-- Part 6 -->
  <rect x="447" y="294" width="386" height="118" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <circle cx="817" cy="310" r="6" fill="#1E8C8C"/>
  <text x="640" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#6B7A8D">PART 6</text>
  <text x="640" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E">Telecommunications Modernization</text>
  <text x="640" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F">SD-WAN + SASE</text>
  <text x="640" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E">7 NIST controls closed</text>

  <!-- Parts 7-9 -->
  <rect x="854" y="294" width="386" height="118" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <circle cx="1224" cy="310" r="6" fill="#1E8C8C"/>
  <text x="1047" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#6B7A8D">PARTS 7–9</text>
  <text x="1047" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E">SQL Server &amp; Database Architecture</text>
  <text x="1047" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F">Azure Arc · Entra authentication · network physics</text>
  <text x="1047" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E">7 additional controls closed</text>

  <!-- Arrows band 2 -> band 3 -->
  <line x1="320" y1="420" x2="320" y2="444" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arw-teal)"/>
  <line x1="640" y1="420" x2="640" y2="444" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arw-teal)"/>
  <line x1="960" y1="420" x2="960" y2="444" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arw-teal)"/>

