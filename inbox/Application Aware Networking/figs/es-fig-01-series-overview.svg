  <rect x="40" y="476" width="285" height="112" rx="8" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="1.25"/>
  <text x="182" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#6B7A8D">PARTS 10–14</text>
