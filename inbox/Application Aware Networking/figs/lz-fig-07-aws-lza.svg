<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <defs>
    <linearGradient id="awsbg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FFE8C8"/>
    </linearGradient>
    <linearGradient id="awshdr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#C55A11"/>
    </linearGradient>
    <linearGradient id="ibblox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A8FD6"/>
      <stop offset="100%" stop-color="#1F3864"/>
    </linearGradient>
    <linearGradient id="govcldbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F0FF"/>
      <stop offset="100%" stop-color="#CCD8F0"/>
    </linearGradient>
    <filter id="sh7"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#00000022"/></filter>
    <marker id="a7" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#C55A11" opacity="0.8"/>
    </marker>
    <marker id="a7b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#1F3864" opacity="0.8"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#F8F8FC"/>
  <text x="600" y="36" text-anchor="middle" fill="#1F3864" font-size="22" font-weight="bold">AWS GovCloud × InfoBlox: BloxOne Runs ON AWS · LZA DNS Alignment</text>
  <text x="600" y="58" text-anchor="middle" fill="#C55A11" font-size="14">InfoBlox's own FedRAMP-authorized cloud service (CSO FR2017257053) is hosted in AWS GovCloud</text>

  <!-- AWS GovCloud outer container -->
  <rect x="24" y="74" width="740" height="530" rx="20" fill="url(#awsbg7)" stroke="#C55A11" stroke-width="2.5"/>

  <!-- AWS header -->
  <rect x="24" y="74" width="740" height="54" rx="20" fill="url(#awshdr)"/>
  <rect x="24" y="110" width="740" height="18" fill="url(#awshdr)"/>
  <!-- AWS logo-style curves -->
  <text x="56" y="108" fill="white" font-size="22" font-weight="bold">AWS</text>
  <text x="110" y="102" fill="white" font-size="16" font-weight="bold">GovCloud (US)</text>
  <text x="110" y="119" fill="white" font-size="12" opacity="0.9">FedRAMP High Authorized · us-gov-west-1 · us-gov-east-1</text>
  <text x="640" y="108" text-anchor="middle" fill="white" font-size="12" opacity="0.8">APN Advanced Technology Partner</text>

  <!-- BloxOne DDI on AWS (center-left) -->
  <g filter="url(#sh7)">
    <rect x="54" y="152" width="310" height="190" rx="14" fill="url(#ibblox)"/>
  </g>
  <circle cx="108" cy="210" r="28" fill="none" stroke="white" stroke-width="3" opacity="0.7"/>
  <circle cx="108" cy="210" r="10" fill="white" opacity="0.7"/>
  <circle cx="88" cy="236" r="8" fill="white" opacity="0.5"/>
  <circle cx="128" cy="236" r="8" fill="white" opacity="0.5"/>
  <line x1="108" y1="220" x2="90" y2="228" stroke="white" stroke-width="2.5" opacity="0.8"/>
  <line x1="108" y1="220" x2="126" y2="228" stroke="white" stroke-width="2.5" opacity="0.8"/>
  <line x1="90" y1="236" x2="126" y2="236" stroke="white" stroke-width="2" opacity="0.8"/>
  <text x="160" y="199" fill="white" font-size="15" font-weight="bold">Infoblox Government Cloud</text>
  <text x="160" y="217" fill="white" font-size="12" opacity="0.9">Hosted on AWS GovCloud</text>
  <text x="160" y="235" fill="white" font-size="11" opacity="0.8">CSO FR2017257053</text>
  <text x="160" y="253" fill="white" font-size="11" opacity="0.8">Verify scope/date on Marketplace</text>
  <line x1="68" y1="270" x2="350" y2="270" stroke="white" stroke-width="1" opacity="0.3"/>
  <text x="209" y="290" text-anchor="middle" fill="white" font-size="12" font-weight="bold">FedRAMP DDI SaaS Control Plane</text>
  <text x="209" y="308" text-anchor="middle" fill="white" font-size="11" opacity="0.9">Manages Grid Members in all 4 SSA environments</text>
  <text x="209" y="324" text-anchor="middle" fill="white" font-size="11" opacity="0.85">from a single cloud management portal</text>

  <!-- VPC / LZA elements -->
  <g filter="url(#sh7)">
    <rect x="54" y="364" width="310" height="180" rx="12" fill="url(#govcldbg)" stroke="#1F3864" stroke-width="1.5"/>
  </g>
  <text x="209" y="388" text-anchor="middle" fill="#1F3864" font-size="13" font-weight="bold">AWS Landing Zone Accelerator (LZA)</text>
  <text x="209" y="406" text-anchor="middle" fill="#555" font-size="11">FedRAMP IaC package · Open source (AWS)</text>
  <text x="70" y="428" fill="#1F3864" font-size="11">• SCP enforces encryption, GuardDuty, CloudTrail</text>
  <text x="70" y="445" fill="#1F3864" font-size="11">• InfoBlox Grid Member deployed in Transit VPC</text>
  <text x="70" y="462" fill="#1F3864" font-size="11">• VPC DHCP Options → Grid Member IP</text>
  <text x="70" y="479" fill="#1F3864" font-size="11">• Route 53 Resolver rules forward to Grid</text>
  <text x="70" y="496" fill="#1F3864" font-size="11">• RPZ replaces Route 53 DNS Firewall</text>
  <text x="70" y="513" fill="#375623" font-size="11" font-weight="bold">✓ FedRAMP 20x KSIs enforced via IaC</text>

  <!-- Right side: AWS integrations -->
  <g filter="url(#sh7)">
    <rect x="398" y="152" width="340" height="80" rx="12" fill="white" stroke="#C55A11" stroke-width="2"/>
