  <rect x="414" y="166" width="44" height="44" rx="8" fill="#C55A11"/>
  <text x="436" y="193" text-anchor="middle" fill="white" font-size="11" font-weight="bold">HUB</text>
  <text x="474" y="176" fill="#C55A11" font-size="13" font-weight="bold">AWS Security Hub Integration</text>
  <text x="474" y="193" fill="#333" font-size="11">InfoBlox RPZ block events → Security Hub findings</text>
  <text x="474" y="209" fill="#333" font-size="11">DNS threat events correlate with GuardDuty</text>

  <g filter="url(#sh7)">
    <rect x="398" y="248" width="340" height="80" rx="12" fill="white" stroke="#C55A11" stroke-width="2"/>
  </g>
  <rect x="414" y="262" width="44" height="44" rx="8" fill="#7030A0"/>
  <text x="436" y="289" text-anchor="middle" fill="white" font-size="11" font-weight="bold">ACM</text>
  <text x="474" y="272" fill="#7030A0" font-size="13" font-weight="bold">ACM Private CA Integration</text>
  <text x="474" y="289" fill="#333" font-size="11">DNS validation CNAMEs auto-created in Grid</text>
  <text x="474" y="305" fill="#333" font-size="11">ACM PCA cert expiry tracked in Cert Tracker</text>

  <g filter="url(#sh7)">
    <rect x="398" y="344" width="340" height="80" rx="12" fill="white" stroke="#375623" stroke-width="2"/>
  </g>
  <rect x="414" y="358" width="44" height="44" rx="8" fill="#375623"/>
  <text x="436" y="380" text-anchor="middle" fill="white" font-size="10" font-weight="bold">IPAM</text>
  <text x="474" y="368" fill="#375623" font-size="13" font-weight="bold">AWS IPAM Sync</text>
  <text x="474" y="385" fill="#333" font-size="11">AWS IPAM pool allocations imported to</text>
  <text x="474" y="401" fill="#333" font-size="11">InfoBlox AWS-GovCloud Network View</text>

  <g filter="url(#sh7)">
    <rect x="398" y="440" width="340" height="80" rx="12" fill="white" stroke="#0066B3" stroke-width="2"/>
  </g>
  <rect x="414" y="454" width="44" height="44" rx="8" fill="#0066B3"/>
  <text x="436" y="476" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Mkpl</text>
  <text x="474" y="464" fill="#0066B3" font-size="13" font-weight="bold">AWS GovCloud Marketplace</text>
  <text x="474" y="481" fill="#333" font-size="11">BloxOne procurable via existing GovCloud EA</text>
  <text x="474" y="497" fill="#333" font-size="11">No separate IDIQ needed</text>

  <!-- Connection lines from BloxOne to integrations -->
  <line x1="364" y1="230" x2="398" y2="192" stroke="#C55A11" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a7)"/>
  <line x1="364" y1="280" x2="398" y2="288" stroke="#7030A0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a7)"/>
  <line x1="364" y1="380" x2="398" y2="384" stroke="#375623" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a7)"/>
  <line x1="364" y1="430" x2="398" y2="480" stroke="#0066B3" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a7)"/>

