    <rect x="398" y="546" width="340" height="44" rx="10" fill="#1F3864"/>
  </g>
  <text x="568" y="573" text-anchor="middle" fill="white" font-size="13" font-weight="bold">SSA VPCs (Spoke accounts) → DHCP Options → Grid Member</text>

  <!-- External: SSA environment -->
  <rect x="790" y="74" width="386" height="530" rx="20" fill="#F8F8FC" stroke="#1F3864" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="983" y="104" text-anchor="middle" fill="#1F3864" font-size="14" font-weight="bold">SSA Environments (All Clouds)</text>

  <g filter="url(#sh7)">
    <rect x="808" y="118" width="350" height="58" rx="10" fill="white" stroke="#1F3864" stroke-width="1.5"/>
  </g>
  <text x="983" y="142" text-anchor="middle" fill="#1F3864" font-size="12" font-weight="bold">On-Premises VMware VCF</text>
  <text x="983" y="160" text-anchor="middle" fill="#555" font-size="11">InfoBlox Grid Master HA pair</text>

  <g filter="url(#sh7)">
    <rect x="808" y="190" width="350" height="58" rx="10" fill="white" stroke="#0066B3" stroke-width="1.5"/>
  </g>
  <text x="983" y="214" text-anchor="middle" fill="#0066B3" font-size="12" font-weight="bold">Azure Government GCC</text>
  <text x="983" y="232" text-anchor="middle" fill="#555" font-size="11">Grid Member in Hub VNet</text>

  <g filter="url(#sh7)">
    <rect x="808" y="262" width="350" height="58" rx="10" fill="white" stroke="#C55A11" stroke-width="1.5"/>
  </g>
  <text x="983" y="286" text-anchor="middle" fill="#C55A11" font-size="12" font-weight="bold">AWS GovCloud SSA VPCs</text>
  <text x="983" y="304" text-anchor="middle" fill="#555" font-size="11">Grid Member in Transit VPC · DHCP Options set</text>

  <g filter="url(#sh7)">
    <rect x="808" y="334" width="350" height="58" rx="10" fill="white" stroke="#8B1A1A" stroke-width="1.5"/>
  </g>
  <text x="983" y="358" text-anchor="middle" fill="#8B1A1A" font-size="12" font-weight="bold">OCI (OPM HRIT)</text>
  <text x="983" y="376" text-anchor="middle" fill="#555" font-size="11">Conditional forwarder from Grid</text>

  <!-- Key benefit badges -->
  <rect x="808" y="410" width="350" height="174" rx="12" fill="#1F3864"/>
  <text x="983" y="434" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Why AWS is the Right Foundation</text>
  <text x="824" y="456" fill="white" font-size="11" opacity="0.9">✓  BloxOne FedRAMP ATO inherited by SSA</text>
  <text x="824" y="474" fill="white" font-size="11" opacity="0.9">✓  Same infrastructure as BloxOne → low latency</text>
  <text x="824" y="492" fill="white" font-size="11" opacity="0.9">✓  GovCloud Marketplace = existing contract vehicle</text>
  <text x="824" y="510" fill="white" font-size="11" opacity="0.9">✓  Security Hub correlation with existing AWS tools</text>
  <text x="824" y="528" fill="white" font-size="11" opacity="0.9">✓  LZA IaC deploys InfoBlox DNS layer out of box</text>
  <text x="824" y="546" fill="white" font-size="11" opacity="0.9">✓  FedRAMP 20x KSIs auto-enforced via SCP + RPZ</text>
  <text x="824" y="564" fill="#FFD700" font-size="11" font-weight="bold">✓  One vendor relationship, four-environment coverage</text>

  <!-- Arrow from BloxOne to SSA environments -->
  <line x1="768" y1="248" x2="808" y2="248" stroke="#1F3864" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#a7b)"/>
  <text x="788" y="240" text-anchor="middle" fill="#1F3864" font-size="10">manages</text>
</svg>
