<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <defs>
    <linearGradient id="leftbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="rightbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
    <linearGradient id="ibhdr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A8FD6"/>
      <stop offset="100%" stop-color="#1F3864"/>
    </linearGradient>
    <filter id="sh2"><feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000025"/></filter>
  </defs>

  <rect width="1200" height="640" fill="#F8FAFB"/>

  <!-- LEFT PANEL — Traditional DHCP (before) -->
  <rect x="20" y="60" width="530" height="540" rx="16" fill="url(#leftbg)" stroke="#C55A11" stroke-width="2" opacity="0.9"/>
  <rect x="20" y="60" width="530" height="52" rx="16" fill="#C55A11"/>
  <rect x="20" y="96" width="530" height="16" rx="0" fill="#C55A11"/>
  <text x="285" y="93" text-anchor="middle" fill="white" font-size="18" font-weight="bold">TRADITIONAL DHCP (Before SDN)</text>
  <text x="285" y="126" text-anchor="middle" fill="#7B3000" font-size="13" font-weight="bold">Broadcast-dependent · Opaque across environments · Manual tracking</text>

  <!-- DHCP Server box -->
  <g filter="url(#sh2)">
    <rect x="185" y="155" width="200" height="70" rx="10" fill="white" stroke="#C55A11" stroke-width="2"/>
  </g>
  <!-- Server icon -->
  <rect x="198" y="166" width="28" height="20" rx="3" fill="#C55A11" opacity="0.7"/>
  <rect x="200" y="168" width="24" height="4" rx="1" fill="white" opacity="0.8"/>
  <rect x="200" y="174" width="24" height="4" rx="1" fill="white" opacity="0.5"/>
  <text x="240" y="183" fill="#7B3000" font-size="13" font-weight="bold">DHCP Server</text>
  <text x="240" y="199" fill="#7B3000" font-size="11">Windows Server / ISC</text>
  <text x="285" y="215" text-anchor="middle" fill="#555" font-size="11">Manual scope management</text>

  <!-- Broadcast bubble -->
  <ellipse cx="285" cy="290" rx="200" ry="55" fill="#FFCC80" stroke="#C55A11" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.7"/>
  <text x="285" y="282" text-anchor="middle" fill="#7B3000" font-size="13" font-weight="bold">Layer 2 Broadcast Domain</text>
  <text x="285" y="298" text-anchor="middle" fill="#7B3000" font-size="11">DHCPDISCOVER floods all ports</text>

  <!-- Devices -->
  <g fill="#555" font-size="11">
    <!-- device icons as rectangles -->
    <rect x="90" y="375" width="44" height="34" rx="4" fill="white" stroke="#C55A11" stroke-width="1.5"/>
    <text x="112" y="393" text-anchor="middle" fill="#7B3000" font-size="10">PC</text>
    <text x="112" y="425" text-anchor="middle" fill="#555" font-size="10">10.1.0.?</text>

    <rect x="175" y="375" width="44" height="34" rx="4" fill="white" stroke="#C55A11" stroke-width="1.5"/>
    <text x="197" y="393" text-anchor="middle" fill="#7B3000" font-size="10">VM</text>
    <text x="197" y="425" text-anchor="middle" fill="#555" font-size="10">10.1.0.?</text>

    <rect x="260" y="375" width="44" height="34" rx="4" fill="white" stroke="#C55A11" stroke-width="1.5"/>
    <text x="282" y="393" text-anchor="middle" fill="#7B3000" font-size="10">Server</text>
    <text x="282" y="425" text-anchor="middle" fill="#555" font-size="10">10.1.0.?</text>

    <rect x="345" y="375" width="44" height="34" rx="4" fill="white" stroke="#C55A11" stroke-width="1.5"/>
    <text x="367" y="393" text-anchor="middle" fill="#7B3000" font-size="10">IoT</text>
    <text x="367" y="425" text-anchor="middle" fill="#555" font-size="10">10.1.0.?</text>

    <rect x="430" y="375" width="44" height="34" rx="4" fill="white" stroke="#C55A11" stroke-width="1.5"/>
    <text x="452" y="393" text-anchor="middle" fill="#7B3000" font-size="10">Laptop</text>
    <text x="452" y="425" text-anchor="middle" fill="#555" font-size="10">10.1.0.?</text>
  </g>

  <!-- Lines from DHCP to broadcast -->
  <line x1="285" y1="225" x2="285" y2="235" stroke="#C55A11" stroke-width="2"/>

  <!-- Lines from broadcast to devices -->
  <line x1="200" y1="340" x2="112" y2="375" stroke="#C55A11" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="240" y1="345" x2="197" y2="375" stroke="#C55A11" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="285" y1="345" x2="282" y2="375" stroke="#C55A11" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="330" y1="345" x2="367" y2="375" stroke="#C55A11" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="370" y1="340" x2="452" y2="375" stroke="#C55A11" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Warning labels -->
  <rect x="60" y="453" width="440" height="110" rx="8" fill="#FFCDD2" stroke="#C00000" stroke-width="1.5"/>
  <text x="280" y="473" text-anchor="middle" fill="#C00000" font-size="13" font-weight="bold">⚠  Gaps in Traditional DHCP</text>
  <text x="80" y="494" fill="#7B0000" font-size="12">• No visibility across VLANs or cloud environments</text>
  <text x="80" y="511" fill="#7B0000" font-size="12">• IP tracking via spreadsheets — always stale</text>
  <text x="80" y="528" fill="#7B0000" font-size="12">• No DNSSEC, no RPZ, no certificate binding</text>
  <text x="80" y="545" fill="#7B0000" font-size="12">• DHCP broadcast breaks in NSX-T/Azure/AWS/OCI</text>

  <!-- DIVIDER arrow -->
  <rect x="562" y="290" width="76" height="60" rx="10" fill="#1F3864"/>
  <polygon points="562,315 638,320 562,325" fill="#2E75B6"/>
  <text x="600" y="308" text-anchor="middle" fill="white" font-size="11" font-weight="bold">SDN</text>
  <text x="600" y="323" text-anchor="middle" fill="white" font-size="11" font-weight="bold">+</text>
  <text x="600" y="338" text-anchor="middle" fill="white" font-size="11" font-weight="bold">InfoBlox</text>

  <!-- RIGHT PANEL — SDN + InfoBlox (after) -->
  <rect x="650" y="60" width="530" height="540" rx="16" fill="url(#rightbg)" stroke="#375623" stroke-width="2" opacity="0.9"/>
  <rect x="650" y="60" width="530" height="52" rx="16" fill="#375623"/>
  <rect x="650" y="96" width="530" height="16" rx="0" fill="#375623"/>
  <text x="915" y="93" text-anchor="middle" fill="white" font-size="18" font-weight="bold">SDN + InfoBlox DDI (After)</text>
  <text x="915" y="126" text-anchor="middle" fill="#1B4D1B" font-size="13" font-weight="bold">Fabric-native IP assignment · Unified IPAM · Cross-cloud visibility</text>

  <!-- InfoBlox center -->
  <g filter="url(#sh2)">
    <rect x="775" y="150" width="280" height="74" rx="12" fill="url(#ibhdr)"/>
  </g>
  <circle cx="800" cy="187" r="20" fill="none" stroke="white" stroke-width="2.5" opacity="0.8"/>
  <circle cx="800" cy="187" r="7" fill="white" opacity="0.7"/>
  <text x="840" y="181" fill="white" font-size="14" font-weight="bold">InfoBlox DDI</text>
  <text x="840" y="197" fill="white" font-size="11" opacity="0.9">IPAM · DNS · RPZ · Certs</text>
  <text x="840" y="211" fill="white" font-size="10" opacity="0.8">FedRAMP CSO FR2017257053</text>

  <!-- 4 SDN platform boxes -->
  <g filter="url(#sh2)">
    <rect x="666" y="268" width="220" height="70" rx="10" fill="white" stroke="#375623" stroke-width="1.5"/>
    <rect x="906" y="268" width="220" height="70" rx="10" fill="white" stroke="#0066B3" stroke-width="1.5"/>
    <rect x="666" y="360" width="220" height="70" rx="10" fill="white" stroke="#C55A11" stroke-width="1.5"/>
    <rect x="906" y="360" width="220" height="70" rx="10" fill="white" stroke="#8B1A1A" stroke-width="1.5"/>
  </g>
  <text x="776" y="291" text-anchor="middle" fill="#375623" font-size="12" font-weight="bold">VMware NSX-T</text>
  <text x="776" y="307" text-anchor="middle" fill="#555" font-size="11">T1 DHCP Server Profile</text>
  <text x="776" y="323" text-anchor="middle" fill="#375623" font-size="11">VCF 9.1 native IPAM plugin</text>

  <text x="1016" y="291" text-anchor="middle" fill="#0066B3" font-size="12" font-weight="bold">Azure Government</text>
  <text x="1016" y="307" text-anchor="middle" fill="#555" font-size="11">Fabric synthetic DHCP</text>
  <text x="1016" y="323" text-anchor="middle" fill="#0066B3" font-size="11">ARM API connector</text>

  <text x="776" y="383" text-anchor="middle" fill="#C55A11" font-size="12" font-weight="bold">AWS GovCloud</text>
  <text x="776" y="399" text-anchor="middle" fill="#555" font-size="11">VPC DHCP Options Set</text>
  <text x="776" y="415" text-anchor="middle" fill="#C55A11" font-size="11">Nitro hypervisor IP assign</text>

  <text x="1016" y="383" text-anchor="middle" fill="#8B1A1A" font-size="12" font-weight="bold">Oracle OCI</text>
  <text x="1016" y="399" text-anchor="middle" fill="#555" font-size="11">VNIC overlay / 169.254.x.x</text>
  <text x="1016" y="415" text-anchor="middle" fill="#8B1A1A" font-size="11">Conditional forwarder</text>

  <!-- Lines from InfoBlox to platforms -->
  <line x1="875" y1="224" x2="776" y2="268" stroke="#375623" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="955" y1="224" x2="1016" y2="268" stroke="#0066B3" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="875" y1="224" x2="776" y2="360" stroke="#C55A11" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="955" y1="224" x2="1016" y2="360" stroke="#8B1A1A" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Result labels -->
  <rect x="666" y="455" width="460" height="120" rx="8" fill="#C8E6C9" stroke="#375623" stroke-width="1.5"/>
  <text x="896" y="476" text-anchor="middle" fill="#1B4D1B" font-size="13" font-weight="bold">✓  InfoBlox DDI Bridges All Four Environments</text>
  <text x="680" y="497" fill="#1B4D1B" font-size="12">• API connectors capture every IP assignment in real time</text>
  <text x="680" y="514" fill="#1B4D1B" font-size="12">• Cross-cloud CIDR conflict detection before allocation</text>
  <text x="680" y="531" fill="#1B4D1B" font-size="12">• DNS A/PTR records created automatically on IP assignment</text>
  <text x="680" y="548" fill="#1B4D1B" font-size="12">• Single CM-8 inventory export for all four environments</text>
  <text x="680" y="565" fill="#1B4D1B" font-size="12">• DNSSEC + RPZ enforced uniformly — one policy, all clouds</text>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" fill="#1F3864" font-size="20" font-weight="bold">SDN Replaces Broadcast DHCP — InfoBlox Restores Enterprise Visibility</text>
</svg>
