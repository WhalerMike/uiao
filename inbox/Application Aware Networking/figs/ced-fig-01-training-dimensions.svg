<svg viewBox="0 0 1040 420" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;">
<rect width="1040" height="420" fill="#FFFFFF"/>

<!-- Title -->
<text x="520" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3864">Federal AAN Cybersecurity Training Program — KSI-CED-RAT</text>
<text x="520" y="43" text-anchor="middle" font-size="10" fill="#2E75B6">Four dimensions required by FedRAMP 20x for persistent cybersecurity awareness and training review (AT-2 / AT-3 / AT-4 / IR-2 / CP-3)</text>

<!-- Column headers -->
<rect x="20" y="55" width="245" height="68" rx="5" fill="#1F3864"/>
<rect x="270" y="55" width="245" height="68" rx="5" fill="#2E75B6"/>
<rect x="520" y="55" width="245" height="68" rx="5" fill="#375623"/>
<rect x="770" y="55" width="250" height="68" rx="5" fill="#7B2C2C"/>

