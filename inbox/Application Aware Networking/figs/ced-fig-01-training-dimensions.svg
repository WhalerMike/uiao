<text x="392" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#D9EEF9">DIMENSION 2</text>
<text x="392" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Role-Based Specialized</text>
<text x="392" y="106" text-anchor="middle" font-size="9" fill="#D9EEF9">AT-3 · AT-3(3) · AT-3(5)</text>

