<text x="142" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">General Awareness</text>
<text x="142" y="106" text-anchor="middle" font-size="9" fill="#BDD7EE">AT-2 · AT-2(1) · AT-2(2)</text>

