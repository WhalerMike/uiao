<text x="895" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">IR / DR Training</text>
<text x="895" y="106" text-anchor="middle" font-size="9" fill="#F4CCCC">IR-2 · CP-3</text>

<!-- Row 1: Audience (light gray band) -->
<rect x="10" y="128" width="1020" height="80" rx="4" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
<text x="15" y="144" font-size="9" font-weight="bold" fill="#999999">AUDIENCE</text>
<text x="142" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F3864">All employees</text>
<text x="142" y="173" text-anchor="middle" font-size="10" fill="#333333">All users, contractors,</text>
<text x="142" y="187" text-anchor="middle" font-size="10" fill="#333333">and privileged accounts</text>
<text x="392" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E75B6">Six high-risk role tiers</text>
<text x="392" y="173" text-anchor="middle" font-size="10" fill="#333333">Sysadmins · PAW users · Developers</text>
<text x="392" y="187" text-anchor="middle" font-size="10" fill="#333333">IR responders · Data stewards · Execs</text>
<text x="642" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#375623">Developers &amp; engineers</text>
<text x="642" y="173" text-anchor="middle" font-size="10" fill="#333333">DevSecOps personnel and</text>
<text x="642" y="187" text-anchor="middle" font-size="10" fill="#333333">all staff touching code pipelines</text>
<text x="895" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#7B2C2C">IR team &amp; recovery personnel</text>
<text x="895" y="173" text-anchor="middle" font-size="10" fill="#333333">SOC staff · DR coordinators</text>
<text x="895" y="187" text-anchor="middle" font-size="10" fill="#333333">CP-3 tabletop participants</text>

<!-- Row 2: Content (white band) -->
<rect x="10" y="213" width="1020" height="82" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
<text x="15" y="229" font-size="9" font-weight="bold" fill="#999999">CONTENT &amp; DELIVERY</text>
<text x="142" y="243" text-anchor="middle" font-size="10" fill="#333333">Annual security awareness</text>
<text x="142" y="257" text-anchor="middle" font-size="10" fill="#333333">+ phishing simulation (AT-2(2))</text>
<text x="142" y="271" text-anchor="middle" font-size="10" fill="#333333">+ insider threat module</text>
<text x="142" y="284" text-anchor="middle" font-size="9" fill="#666666">Microsoft Viva Learning / LMS</text>
<text x="392" y="243" text-anchor="middle" font-size="10" fill="#333333">Role curriculum per tier;</text>
<text x="392" y="257" text-anchor="middle" font-size="10" fill="#333333">OWASP/SAST labs (AT-3(3));</text>
<text x="392" y="271" text-anchor="middle" font-size="10" fill="#333333">CISA ransomware for execs (AT-3(5))</text>
<text x="392" y="284" text-anchor="middle" font-size="9" fill="#666666">Six separate LMS role tracks</text>
<text x="642" y="243" text-anchor="middle" font-size="10" fill="#333333">OWASP Top 10 · SAST/DAST labs</text>
<text x="642" y="257" text-anchor="middle" font-size="10" fill="#333333">Secure-coding standards training</text>
<text x="642" y="271" text-anchor="middle" font-size="10" fill="#333333">SA-16 developer documentation</text>
<text x="642" y="284" text-anchor="middle" font-size="9" fill="#666666">Cert transcript or course log</text>
<text x="895" y="243" text-anchor="middle" font-size="10" fill="#333333">Semi-annual IR tabletop drill</text>
<text x="895" y="257" text-anchor="middle" font-size="10" fill="#333333">(IR-2 scenario library — SOC)</text>
<text x="895" y="271" text-anchor="middle" font-size="10" fill="#333333">Annual contingency exercise (CP-3)</text>
<text x="895" y="284" text-anchor="middle" font-size="9" fill="#666666">Connects to Vol IV Book 01 tabletop calendar</text>

<!-- Row 3: Evidence (light blue band) -->
<rect x="10" y="300" width="1020" height="56" rx="4" fill="#EBF3FB" stroke="#BDD7EE" stroke-width="1"/>
<text x="15" y="316" font-size="9" font-weight="bold" fill="#2E75B6">MACHINE-READABLE EVIDENCE (AT-4)</text>
<text x="142" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3864">LMS completion record</text>
<text x="142" y="344" text-anchor="middle" font-size="9" fill="#555555">overall_completion_pct ≥ 95%</text>
<text x="392" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3864">LMS completion by role tier</text>
<text x="392" y="344" text-anchor="middle" font-size="9" fill="#555555">tier_completion_pct ≥ 95% per tier</text>
<text x="642" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3864">Certification transcript</text>
<text x="642" y="344" text-anchor="middle" font-size="9" fill="#555555">Viva Learning Graph API export</text>
<text x="895" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3864">Tabletop attendance + AAR</text>
<text x="895" y="344" text-anchor="middle" font-size="9" fill="#555555">ir2_drill_date · cp3_tabletop_date</text>

<!-- Footer -->
<rect x="10" y="362" width="1020" height="46" rx="4" fill="#1F3864" opacity="0.07"/>
<rect x="10" y="362" width="1020" height="46" rx="4" fill="none" stroke="#1F3864" stroke-width="1"/>
<text x="520" y="378" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3864">governance.training-effectiveness-record JSON Schema (AT-4 Evidence Contract)</text>
<text x="520" y="393" text-anchor="middle" font-size="9" fill="#1F3864">Exported via Microsoft Viva Learning Graph API → UIAO governance substrate</text>
<text x="520" y="406" text-anchor="middle" font-size="9" fill="#555555">KSI-CED-RAT satisfied when overall_completion_pct ≥ 95 and all six role_tiers present with evidence within the past 12 months</text>
