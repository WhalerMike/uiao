<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <text x="640" y="44" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#0D1B2E">Phased NAC Deployment — Twenty Weeks to Full Enforcement</text>
  <text x="640" y="72" text-anchor="middle" font-size="17" fill="#6B7A8D">Monitor first, then enforce wired, wireless, and IoT — never enforcement before inventory</text>

  <!-- Week axis -->
  <text x="250" y="104" text-anchor="end" font-size="15" fill="#6B7A8D">Week</text>
  <text x="358" y="104" text-anchor="middle" font-size="15" fill="#6B7A8D">2</text>
  <text x="456" y="104" text-anchor="middle" font-size="15" fill="#6B7A8D">4</text>
  <text x="554" y="104" text-anchor="middle" font-size="15" fill="#6B7A8D">6</text>
  <text x="652" y="104" text-anchor="middle" font-size="15" fill="#6B7A8D">8</text>
  <text x="750" y="104" text-anchor="middle" font-size="15" fill="#6B7A8D">10</text>
  <text x="848" y="104" text-anchor="middle" font-size="15" fill="#6B7A8D">12</text>
  <text x="946" y="104" text-anchor="middle" font-size="15" fill="#6B7A8D">14</text>
  <text x="1044" y="104" text-anchor="middle" font-size="15" fill="#6B7A8D">16</text>
  <text x="1142" y="104" text-anchor="middle" font-size="15" fill="#6B7A8D">18</text>
  <text x="1240" y="104" text-anchor="middle" font-size="15" fill="#6B7A8D">20</text>

  <line x1="260" y1="114" x2="260" y2="636" stroke="#6B7A8D" stroke-width="1.5"/>
  <line x1="358" y1="114" x2="358" y2="636" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="456" y1="114" x2="456" y2="636" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="554" y1="114" x2="554" y2="636" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="652" y1="114" x2="652" y2="636" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="750" y1="114" x2="750" y2="636" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="848" y1="114" x2="848" y2="636" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="946" y1="114" x2="946" y2="636" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="1044" y1="114" x2="1044" y2="636" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="1142" y1="114" x2="1142" y2="636" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="1240" y1="114" x2="1240" y2="636" stroke="#E3E8EF" stroke-width="1"/>

  <!-- Phase 1 -->
  <text x="30" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#0D1B2E">Phase 1</text>
  <text x="30" y="196" font-size="17" fill="#33414F">Monitor Mode</text>
  <text x="30" y="218" font-size="15" fill="#6B7A8D">Weeks 1–4</text>
  <rect x="260" y="152" width="196" height="40" rx="6" fill="#0D1B2E"/>
  <text x="358" y="177" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Weeks 1–4</text>
  <polygon points="464,164 472,172 464,180 456,172" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="480" y="177" font-size="15" fill="#33414F">Baseline report</text>
  <text x="260" y="216" font-size="16" fill="#33414F">802.1X enabled in open mode on all ports — all authentications succeed</text>
  <text x="260" y="238" font-size="16" fill="#33414F">regardless of result; RADIUS logs collected and analyzed</text>

  <!-- Phase 2 -->
  <text x="30" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#0D1B2E">Phase 2</text>
  <text x="30" y="314" font-size="17" fill="#33414F">Wired Enforcement</text>
  <text x="30" y="336" font-size="15" fill="#6B7A8D">Weeks 5–10</text>
  <rect x="456" y="270" width="294" height="40" rx="6" fill="#2E75B6"/>
  <text x="603" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Weeks 5–10</text>
  <polygon points="758,282 766,290 758,298 750,290" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="774" y="295" font-size="15" fill="#33414F">Wired enforcement live</text>
  <text x="456" y="334" font-size="16" fill="#33414F">Enforcement enabled for workstations and servers — non-compliant devices</text>
  <text x="456" y="356" font-size="16" fill="#33414F">moved to remediation VLAN; exception list for legacy devices; IoT on MAB</text>

  <!-- Phase 3 -->
  <text x="30" y="408" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#0D1B2E">Phase 3</text>
  <text x="30" y="432" font-size="17" fill="#33414F">Wireless Enforcement</text>
  <text x="30" y="454" font-size="15" fill="#6B7A8D">Weeks 11–14</text>
  <rect x="750" y="388" width="196" height="40" rx="6" fill="#1E8C8C"/>
  <text x="848" y="413" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Weeks 11–14</text>
  <polygon points="954,400 962,408 954,416 946,408" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="970" y="413" font-size="15" fill="#33414F">Legacy SSID retired</text>
  <text x="750" y="452" font-size="16" fill="#33414F">WPA3-Enterprise deployed on the managed SSID</text>
  <text x="750" y="474" font-size="16" fill="#33414F">Guest SSID separated</text>

  <!-- Phase 4 -->
  <text x="30" y="526" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#0D1B2E">Phase 4</text>
  <text x="30" y="550" font-size="17" fill="#33414F">IoT Segmentation</text>
  <text x="30" y="572" font-size="15" fill="#6B7A8D">Weeks 15–20</text>
  <rect x="946" y="506" width="294" height="40" rx="6" fill="#1E3A66"/>
  <text x="1093" y="531" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Weeks 15–20</text>
  <polygon points="1230,518 1238,526 1230,534 1222,526" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1240" y="500" text-anchor="end" font-size="15" fill="#33414F">Tabletop exercise complete</text>
  <text x="1240" y="570" text-anchor="end" font-size="16" fill="#33414F">MAB policy refined; IoT VLAN ACLs hardened;</text>
  <text x="1240" y="592" text-anchor="end" font-size="16" fill="#33414F">OT device exception process documented</text>

  <text x="640" y="676" text-anchor="middle" font-size="17" fill="#6B7A8D">Standard federal NAC deployment sequence — four phases across 90–180 days (twenty-week plan shown)</text>
</svg>
