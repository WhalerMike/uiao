<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1A9E8F"/></marker>
  </defs>

  <text x="800" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#1F3A5F">App Registration Governance (Vol IX Book 03)</text>
  <text x="800" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5A6B7B">App registrations as machine JML — request, consent, credential, rotate, attest</text>
  <rect x="49" y="205" width="270" height="320" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M59,205 h250 a10,10 0 0 1 10,10 v78 h-270 v-78 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="184.0" y="233" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 1</text>
  <text x="184.0" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="184.0" dy="0.0">Request</tspan>
  </text>
  <text x="184.0" y="331" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#2A2A2A">
  <tspan x="184.0" dy="0.0">Owner, purpose, and the</tspan>
  <tspan x="184.0" dy="23.4">specific scopes needed</tspan>
  <tspan x="184.0" dy="23.4">(AC-2)</tspan>
  </text>
  <line x1="319" y1="365.0" x2="357" y2="365.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <rect x="357" y="205" width="270" height="320" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M367,205 h250 a10,10 0 0 1 10,10 v78 h-270 v-78 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="492.0" y="233" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 2</text>
  <text x="492.0" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="492.0" dy="0.0">Consent</tspan>
  </text>
  <text x="492.0" y="331" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#2A2A2A">
  <tspan x="492.0" dy="0.0">Scoped admin consent;</tspan>
  <tspan x="492.0" dy="23.4">privileged scopes gated</tspan>
  <tspan x="492.0" dy="23.4">by a security approver</tspan>
  <tspan x="492.0" dy="23.4">(AC-6)</tspan>
  </text>
  <line x1="627" y1="365.0" x2="665" y2="365.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <rect x="658" y="198" width="284" height="334" rx="14" fill="none" stroke="#D4860B" stroke-width="3"/>
  <rect x="665" y="205" width="270" height="320" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M675,205 h250 a10,10 0 0 1 10,10 v78 h-270 v-78 a10,10 0 0 1 10,-10 z" fill="#1A9E8F"/>
  <text x="800.0" y="233" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 3</text>
  <text x="800.0" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="800.0" dy="0.0">Credential</tspan>
  </text>
  <text x="800.0" y="331" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#2A2A2A">
  <tspan x="800.0" dy="0.0">Short-lived cert (ACME)</tspan>
  <tspan x="800.0" dy="23.4">or secret with mandatory</tspan>
  <tspan x="800.0" dy="23.4">expiry — no long-lived</tspan>
  <tspan x="800.0" dy="23.4">secrets</tspan>
  </text>
  <line x1="935" y1="365.0" x2="973" y2="365.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <rect x="973" y="205" width="270" height="320" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M983,205 h250 a10,10 0 0 1 10,10 v78 h-270 v-78 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="1108.0" y="233" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 4</text>
  <text x="1108.0" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="1108.0" dy="0.0">Rotate</tspan>
  </text>
  <text x="1108.0" y="331" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#2A2A2A">
  <tspan x="1108.0" dy="0.0">Automated rotation</tspan>
  <tspan x="1108.0" dy="23.4">before expiry; never</tspan>
  <tspan x="1108.0" dy="23.4">depends on a human</tspan>
  <tspan x="1108.0" dy="23.4">remembering</tspan>
  </text>
  <line x1="1243" y1="365.0" x2="1281" y2="365.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <rect x="1281" y="205" width="270" height="320" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M1291,205 h250 a10,10 0 0 1 10,10 v78 h-270 v-78 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="1416.0" y="233" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 5</text>
  <text x="1416.0" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="1416.0" dy="0.0">Attest</tspan>
  </text>
  <text x="1416.0" y="331" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#2A2A2A">
  <tspan x="1416.0" dy="0.0">Ownership and scope</tspan>
  <tspan x="1416.0" dy="23.4">re-attested;</tspan>
  <tspan x="1416.0" dy="23.4">orphaned/expired flagged</tspan>
  <tspan x="1416.0" dy="23.4">(feeds CA-7)</tspan>
  </text>
  <text x="800.0" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#D4860B">short-lived — no long-lived secrets</text>
    <rect x="49" y="828" width="1502" height="54" rx="8" fill="#F4F7FA" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="800" y="861" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1F3A5F">No long-lived secrets in config — certificate-based, auto-rotated workload identity (IA-5(2) / SC-17). Moderate &amp; GCC Moderate.</text>
</svg>