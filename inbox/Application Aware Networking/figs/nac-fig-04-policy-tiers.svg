<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="mGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5A5A5A"/></marker>
    <marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1E8C8C"/></marker>
    <marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C0392B"/></marker>
    <marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D4A017"/></marker>
  </defs>

  <text x="640" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E">NAC Policy Tiers — From Port to VLAN Assignment</text>
  <text x="640" y="76" text-anchor="middle" font-size="18" fill="#6B7A8D">Two independent checks: certificate validity first, then Intune device compliance</text>

  <!-- Start -->
  <rect x="50" y="190" width="190" height="80" rx="8" fill="#0D1B2E"/>
  <text x="145" y="223" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Switch Port</text>
  <text x="145" y="249" text-anchor="middle" font-size="16" fill="#EAF1FB">802.1X link up</text>

  <line x1="240" y1="230" x2="296" y2="230" stroke="#5A5A5A" stroke-width="2.5" marker-end="url(#mGrey)"/>

  <!-- Decision 1 -->
  <polygon points="300,230 445,145 590,230 445,315" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="445" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Valid EAP-TLS</text>
  <text x="445" y="248" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">certificate?</text>

  <!-- No -> Quarantine -->
  <line x1="445" y1="315" x2="445" y2="426" stroke="#C0392B" stroke-width="2.5" marker-end="url(#mRed)"/>
  <text x="458" y="378" font-size="18" font-weight="bold" fill="#C0392B">No</text>

  <rect x="315" y="430" width="260" height="176" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="445" y="462" text-anchor="middle" font-size="19" font-weight="bold" fill="#C0392B">Quarantine VLAN</text>
  <text x="445" y="489" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#33414F">VLAN 999</text>
  <text x="445" y="517" text-anchor="middle" font-size="16" fill="#33414F">Internet access only</text>
  <text x="445" y="541" text-anchor="middle" font-size="16" fill="#33414F">No SSA resources</text>
  <text x="445" y="565" text-anchor="middle" font-size="16" fill="#33414F">DNS resolves to captive portal</text>

  <!-- Yes -> Decision 2 -->
  <line x1="590" y1="230" x2="646" y2="230" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#mTeal)"/>
  <text x="618" y="214" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E8C8C">Yes</text>

  <!-- Decision 2 -->
  <polygon points="650,230 800,140 950,230 800,320" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="800" y="214" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Device compliant</text>
  <text x="800" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">per Intune?</text>
  <text x="800" y="128" text-anchor="middle" font-size="16" fill="#6B7A8D">patch level current · AV active · encryption enabled</text>

  <!-- No -> Remediation -->
  <line x1="800" y1="320" x2="800" y2="426" stroke="#D4A017" stroke-width="2.5" marker-end="url(#mAmber)"/>
  <text x="813" y="380" font-size="18" font-weight="bold" fill="#D4A017">No</text>

  <rect x="670" y="430" width="260" height="176" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="800" y="462" text-anchor="middle" font-size="19" font-weight="bold" fill="#0D1B2E">Remediation VLAN</text>
  <text x="800" y="489" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#33414F">VLAN 200</text>
  <text x="800" y="517" text-anchor="middle" font-size="16" fill="#33414F">Intune, Windows Update,</text>
  <text x="800" y="541" text-anchor="middle" font-size="16" fill="#33414F">AV update endpoints only</text>
  <text x="800" y="565" text-anchor="middle" font-size="16" fill="#33414F">No SSA internal routing</text>

  <!-- Yes -> Production -->
  <line x1="950" y1="230" x2="1006" y2="230" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#mTeal)"/>
  <text x="978" y="214" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E8C8C">Yes</text>

  <rect x="1010" y="146" width="230" height="168" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1125" y="180" text-anchor="middle" font-size="19" font-weight="bold" fill="#0D1B2E">Production VLAN</text>
  <text x="1125" y="207" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#1E8C8C">VLAN 100</text>
  <text x="1125" y="233" text-anchor="middle" font-size="16" fill="#33414F">department-specific</text>
  <text x="1125" y="259" text-anchor="middle" font-size="16" fill="#33414F">Full SSA resource access</text>
  <text x="1125" y="283" text-anchor="middle" font-size="16" fill="#33414F">per network ACLs</text>

  <text x="640" y="668" text-anchor="middle" font-size="17" fill="#6B7A8D">Compliance is re-evaluated at every 8-hour re-authentication and on RADIUS Change of Authorization events</text>
</svg>
