<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrTeal" markerWidth="9" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrGrey" markerWidth="9" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#5A5A5A"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="640" y="42" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#0D1B2E" text-anchor="middle">PKI as a Naming-Plane Function</text>
  <text x="640" y="72" font-family="Arial, sans-serif" font-size="17" fill="#6B7A8D" text-anchor="middle">Issuance policy, proof of control, and revocation all execute against the authoritative zone</text>

  <!-- ===== Center: authoritative DDI zone ===== -->
  <rect x="480" y="250" width="320" height="210" rx="10" fill="#0D1B2E"/>
  <text x="640" y="284" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Authoritative DDI Zone</text>
  <text x="640" y="308" font-family="Arial, sans-serif" font-size="16" fill="#EAF1FB" text-anchor="middle">naming-plane source of truth</text>
  <rect x="505" y="324" width="270" height="34" rx="5" fill="#1E3A66"/>
  <text x="640" y="346" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF" text-anchor="middle">CAA 0 issue "agency-ca.gov"</text>
  <rect x="505" y="366" width="270" height="34" rx="5" fill="#1E3A66"/>
  <text x="640" y="388" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF" text-anchor="middle">_acme-challenge TXT</text>
  <rect x="505" y="408" width="270" height="34" rx="5" fill="#1E3A66"/>
  <text x="640" y="430" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF" text-anchor="middle">crl / ocsp responder hosts</text>

  <!-- ===== Flow 1: Issuance Policy (left) ===== -->
  <text x="200" y="132" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Flow 1 — Issuance Policy</text>
  <rect x="60" y="150" width="280" height="170" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Public CA</text>
  <text x="200" y="206" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#6B7A8D" text-anchor="middle">must honor CAA per the</text>
  <text x="200" y="228" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#6B7A8D" text-anchor="middle">Baseline Requirements</text>
  <path d="M84,254 l8,9 l15,-18" fill="none" stroke="#1E8C8C" stroke-width="4"/>
  <text x="116" y="264" font-family="Arial, sans-serif" font-size="16" fill="#33414F">queries CAA before issuance</text>
  <path d="M84,290 l8,9 l15,-18" fill="none" stroke="#1E8C8C" stroke-width="4"/>
  <text x="116" y="300" font-family="Arial, sans-serif" font-size="16" fill="#33414F">issues only if authorized</text>

  <line x1="480" y1="310" x2="348" y2="256" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrTeal)"/>
  <text x="412" y="208" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A" text-anchor="middle">CAA record (RFC 8659):</text>
  <text x="412" y="230" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A" text-anchor="middle">which CAs may issue</text>

  <!-- ===== Flow 2: Proof of Control (right) ===== -->
  <text x="1085" y="132" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Flow 2 — Proof of Control</text>
  <rect x="950" y="150" width="270" height="84" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1085" y="182" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">ACME Client</text>
  <text x="1085" y="208" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D" text-anchor="middle">(workload requesting a certificate)</text>

  <line x1="948" y1="234" x2="806" y2="300" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrTeal)"/>
  <text x="928" y="266" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A" text-anchor="middle">writes _acme-challenge TXT</text>
  <text x="928" y="288" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A" text-anchor="middle">via the DDI API</text>

  <rect x="950" y="330" width="270" height="126" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1085" y="360" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Certificate Authority</text>
  <text x="1085" y="386" font-family="Arial, sans-serif" font-size="16" fill="#33414F" text-anchor="middle">queries the TXT record before</text>
  <text x="1085" y="408" font-family="Arial, sans-serif" font-size="16" fill="#33414F" text-anchor="middle">issuing (DNS-01, RFC 8555)</text>
  <text x="1085" y="436" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E8C8C" text-anchor="middle">certificate issued</text>

  <line x1="800" y1="386" x2="942" y2="386" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrTeal)"/>
  <text x="872" y="374" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A" text-anchor="middle">TXT lookup</text>

  <!-- ===== Flow 3: Revocation Path (bottom) ===== -->
  <text x="200" y="524" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Flow 3 — Revocation Path</text>
  <rect x="60" y="542" width="280" height="112" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="200" y="572" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Validating Client</text>
  <text x="200" y="598" font-family="Arial, sans-serif" font-size="16" fill="#33414F" text-anchor="middle">checks certificate status, then</text>
  <text x="200" y="620" font-family="Arial, sans-serif" font-size="16" fill="#33414F" text-anchor="middle">completes path validation</text>

  <rect x="470" y="542" width="340" height="112" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="640" y="572" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">DNSSEC-Validating Resolvers</text>
  <text x="640" y="598" font-family="Arial, sans-serif" font-size="16" fill="#33414F" text-anchor="middle">resolve CRL / OCSP responder</text>
  <text x="640" y="620" font-family="Arial, sans-serif" font-size="16" fill="#33414F" text-anchor="middle">hostnames — signed answers only</text>

  <line x1="340" y1="598" x2="462" y2="598" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrTeal)"/>
  <text x="401" y="584" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A" text-anchor="middle">hostname query</text>

  <line x1="640" y1="538" x2="640" y2="468" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrTeal)"/>
  <text x="652" y="490" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A">authoritative,</text>
  <text x="652" y="512" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A">DNSSEC-signed</text>

  <!-- supporting note (bottom right) -->
  <rect x="880" y="542" width="350" height="112" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="1055" y="570" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D" text-anchor="middle">CRL distribution points and OCSP</text>
  <text x="1055" y="592" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D" text-anchor="middle">URLs are hostnames inside the</text>
  <text x="1055" y="614" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D" text-anchor="middle">certificate — every status check</text>
  <text x="1055" y="636" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D" text-anchor="middle">begins with DNS</text>
  <line x1="878" y1="598" x2="818" y2="598" stroke="#5A5A5A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrGrey)"/>

  <!-- caption -->
  <rect x="60" y="672" width="1160" height="38" rx="6" fill="#D7F2EE"/>
  <text x="640" y="697" font-family="Arial, sans-serif" font-size="19" font-style="italic" fill="#0D1B2E" text-anchor="middle">The CA verifies what DNS asserts — PKI is the naming plane exercising authority over keys.</text>
</svg>
