<svg viewBox="0 0 1040 400" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="400" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#999"/></marker><marker id="arww" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#fff"/></marker></defs><text x="520" y="26" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">Privileged Access Workstation (PAW) Trust Model</text><text x="520" y="44" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">Administrative access routed exclusively through hardened, purpose-built devices</text><rect x="40" y="70" width="290" height="280" rx="8" fill="#F2F2F2"/><text x="185" y="92" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#1F3864">Standard Workstation</text><line x1="60" y1="104" x2="310" y2="104" stroke="#DDDDDD" stroke-width="1"/><text x="54" y="122" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#666666">• Email / web browsing</text><text x="54" y="148" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#666666">• Office productivity</text><text x="54" y="174" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#666666">• No admin tools installed</text><text x="54" y="200" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#666666">• Cannot reach admin targets</text><text x="54" y="226" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#666666">• Standard user rights only</text><rect x="375" y="70" width="290" height="280" rx="8" fill="#C55A11"/><text x="520" y="92" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#1F3864">Privileged Access Workstation</text><line x1="395" y1="104" x2="645" y2="104" stroke="#DDDDDD" stroke-width="1"/><text x="389" y="122" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">• Admin tools only (no email, no browser)</text><text x="389" y="148" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">• BitLocker + Credential Guard</text><text x="389" y="174" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">• WDAC application allowlist</text><text x="389" y="200" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">• Intune compliance enforced</text><text x="389" y="226" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">• PIM activation required for roles</text><rect x="705" y="70" width="290" height="280" rx="8" fill="#1F3864"/><text x="850" y="92" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Admin Targets</text><line x1="725" y1="104" x2="975" y2="104" stroke="#FFFFFF" stroke-width="1"/><text x="719" y="122" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">✓ Domain controllers</text><text x="719" y="148" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">✓ Azure / Entra admin portals</text><text x="719" y="174" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">✓ SQL Server instances</text><text x="719" y="200" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">✓ Network devices</text><text x="719" y="226" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">✓ Only accepts PAW + PIM sessions</text><line x1="330" y1="210" x2="373" y2="210" stroke="#C00000" stroke-width="2" stroke-dasharray="4,3"/><text x="351" y="205" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#C00000">✗</text><line x1="665" y1="210" x2="703" y2="210" stroke="#375623" stroke-width="2" marker-end="url(#arw)"/><text x="683" y="204" text-anchor="middle" font-size="8" font-weight="bold" font-style="normal" fill="#375623">PIM</text><text x="520" y="374" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">Standard workstations cannot reach admin targets. Only PAW devices with active PIM roles can authenticate to privileged resources.</text><text x="520" y="390" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#666666">Satisfies: AC-5 Separation of Duties · AC-6 Least Privilege · AC-6(2) Non-privileged access for non-security functions</text></svg>
