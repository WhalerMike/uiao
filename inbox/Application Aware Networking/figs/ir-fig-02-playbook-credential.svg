<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="740" viewBox="0 0 900 740">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1F3864"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C00000"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#375623"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C55A11"/>
    </marker>
  </defs>

  <rect width="900" height="740" fill="#F2F2F2" rx="8"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="48" fill="#1F3864" rx="8"/>
  <rect x="0" y="30" width="900" height="18" fill="#1F3864"/>
  <text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#FFFFFF">Fig 2 — Credential Compromise Playbook Decision Tree (SSA-PB-CredentialCompromise)</text>

  <!-- TRIGGER box -->
  <rect x="300" y="58" width="300" height="50" rx="8" fill="#C55A11" stroke="#C55A11" stroke-width="1.5"/>
  <text x="450" y="79" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#FFFFFF">TRIGGER</text>
  <text x="450" y="97" text-anchor="middle" font-family="Arial" font-size="10" fill="#FFFFFF">Sentinel High-Severity Identity Alert</text>

  <!-- Arrow down -->
  <line x1="450" y1="108" x2="450" y2="130" stroke="#1F3864" stroke-width="2" marker-end="url(#arr)"/>

  <!-- SOAR auto-response box -->
  <rect x="260" y="130" width="380" height="46" rx="6" fill="#1F7391" stroke="#1F7391" stroke-width="1.5"/>
  <text x="450" y="149" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="bold" fill="#FFFFFF">SOAR AUTO-RESPONSE (Logic App fired)</text>
  <text x="450" y="167" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#FFFFFF">Disable account | Revoke tokens | Intune quarantine | Create ticket | Notify CSIRT</text>

  <!-- Arrow down -->
  <line x1="450" y1="176" x2="450" y2="200" stroke="#1F3864" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Decision 1: Account still active? -->
  <polygon points="450,200 620,248 450,296 280,248" fill="#DEEAF1" stroke="#2E75B6" stroke-width="2"/>
  <text x="450" y="242" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1F3864">Account still active?</text>
  <text x="450" y="258" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#1F3864">(post-SOAR check)</text>

  <!-- YES path left -->
  <line x1="280" y1="248" x2="180" y2="248" stroke="#C00000" stroke-width="2" marker-end="url(#arrr)"/>
  <text x="230" y="241" text-anchor="middle" font-family="Arial" font-size="10" fill="#C00000" font-weight="bold">YES</text>
  <rect x="60" y="222" width="120" height="52" rx="6" fill="#FDECEA" stroke="#C00000" stroke-width="1.5"/>
  <text x="120" y="243" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="bold" fill="#C00000">Manual Disable</text>
  <text x="120" y="258" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Confirm via</text>
  <text x="120" y="271" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Entra Admin</text>

  <!-- NO path right -->
  <line x1="620" y1="248" x2="720" y2="248" stroke="#375623" stroke-width="2" marker-end="url(#arrg)"/>
  <text x="670" y="241" text-anchor="middle" font-family="Arial" font-size="10" fill="#375623" font-weight="bold">NO</text>
  <rect x="720" y="222" width="140" height="52" rx="6" fill="#E2EFDA" stroke="#375623" stroke-width="1.5"/>
  <text x="790" y="243" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="bold" fill="#375623">Account Disabled</text>
  <text x="790" y="258" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Proceed to scope</text>
  <text x="790" y="271" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">assessment</text>

  <!-- Both paths converge down -->
  <line x1="120" y1="274" x2="120" y2="325" stroke="#1F3864" stroke-width="1.5"/>
  <line x1="120" y1="325" x2="449" y2="325" stroke="#1F3864" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="790" y1="274" x2="790" y2="325" stroke="#1F3864" stroke-width="1.5"/>
  <line x1="451" y1="325" x2="790" y2="325" stroke="#1F3864" stroke-width="1.5"/>

  <!-- Decision 2: Privileged account? -->
  <polygon points="450,326 640,374 450,422 260,374" fill="#FBE5D6" stroke="#C55A11" stroke-width="2"/>
  <text x="450" y="367" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1F3864">Privileged account?</text>
  <text x="450" y="383" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#1F3864">(Global Admin / Security Admin / PIM role?)</text>

  <!-- YES = P1 escalate -->
  <line x1="260" y1="374" x2="160" y2="374" stroke="#C00000" stroke-width="2" marker-end="url(#arrr)"/>
  <text x="210" y="367" text-anchor="middle" font-family="Arial" font-size="10" fill="#C00000" font-weight="bold">YES</text>
  <rect x="30" y="348" width="132" height="52" rx="6" fill="#C00000" stroke="#C00000" stroke-width="1.5"/>
  <text x="96" y="368" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="bold" fill="#FFFFFF">ESCALATE → P1</text>
  <text x="96" y="383" text-anchor="middle" font-family="Arial" font-size="9" fill="#FFFFFF">Notify IC + CISO</text>
  <text x="96" y="396" text-anchor="middle" font-family="Arial" font-size="9" fill="#FFFFFF">Start CISA clock</text>

  <!-- NO = P2 -->
  <line x1="640" y1="374" x2="740" y2="374" stroke="#375623" stroke-width="2" marker-end="url(#arrg)"/>
  <text x="690" y="367" text-anchor="middle" font-family="Arial" font-size="10" fill="#375623" font-weight="bold">NO</text>
  <rect x="740" y="348" width="130" height="52" rx="6" fill="#E2EFDA" stroke="#375623" stroke-width="1.5"/>
  <text x="805" y="368" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="bold" fill="#375623">Assign P2</text>
  <text x="805" y="383" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Notify IC</text>
  <text x="805" y="396" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">(1hr SLA)</text>

  <!-- Both converge -->
  <line x1="96" y1="400" x2="96" y2="452" stroke="#1F3864" stroke-width="1.5"/>
  <line x1="96" y1="452" x2="449" y2="452" stroke="#1F3864" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="805" y1="400" x2="805" y2="452" stroke="#1F3864" stroke-width="1.5"/>
  <line x1="451" y1="452" x2="805" y2="452" stroke="#1F3864" stroke-width="1.5"/>

  <!-- Decision 3: Lateral movement? -->
  <polygon points="450,452 640,500 450,548 260,500" fill="#FDECEA" stroke="#C00000" stroke-width="2"/>
  <text x="450" y="492" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1F3864">Lateral movement</text>
  <text x="450" y="508" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1F3864">confirmed?</text>

  <!-- YES lateral -->
  <line x1="260" y1="500" x2="160" y2="500" stroke="#C00000" stroke-width="2" marker-end="url(#arrr)"/>
  <text x="210" y="493" text-anchor="middle" font-family="Arial" font-size="10" fill="#C00000" font-weight="bold">YES</text>
  <rect x="30" y="472" width="132" height="56" rx="6" fill="#C00000" stroke="#C00000" stroke-width="1.5"/>
  <text x="96" y="491" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#FFFFFF">Expand Scope</text>
  <text x="96" y="506" text-anchor="middle" font-family="Arial" font-size="9" fill="#FFFFFF">Repeat steps</text>
  <text x="96" y="519" text-anchor="middle" font-family="Arial" font-size="9" fill="#FFFFFF">for each acct</text>

  <!-- NO lateral -->
  <line x1="640" y1="500" x2="740" y2="500" stroke="#375623" stroke-width="2" marker-end="url(#arrg)"/>
  <text x="690" y="493" text-anchor="middle" font-family="Arial" font-size="10" fill="#375623" font-weight="bold">NO</text>
  <rect x="740" y="472" width="130" height="56" rx="6" fill="#E2EFDA" stroke="#375623" stroke-width="1.5"/>
  <text x="805" y="491" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="bold" fill="#375623">Isolated incident</text>
  <text x="805" y="506" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Proceed to</text>
  <text x="805" y="519" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">remediation</text>

  <!-- Both converge to remediation -->
  <line x1="96" y1="528" x2="96" y2="580" stroke="#1F3864" stroke-width="1.5"/>
  <line x1="96" y1="580" x2="449" y2="580" stroke="#1F3864" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="805" y1="528" x2="805" y2="580" stroke="#1F3864" stroke-width="1.5"/>
  <line x1="451" y1="580" x2="805" y2="580" stroke="#1F3864" stroke-width="1.5"/>

  <!-- Remediation box -->
  <rect x="200" y="580" width="500" height="110" rx="8" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/>
  <text x="450" y="601" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF">REMEDIATION STEPS</text>
  <text x="220" y="622" font-family="Arial" font-size="10" fill="#FFFFFF">1. Reset password via Entra admin (not SSPR)</text>
  <text x="220" y="638" font-family="Arial" font-size="10" fill="#FFFFFF">2. Revoke all MFA methods → require re-enrollment (FIDO2 / Authenticator app)</text>
  <text x="220" y="654" font-family="Arial" font-size="10" fill="#FFFFFF">3. Review + revoke PIM eligible assignments (30-day lookback)</text>
  <text x="220" y="670" font-family="Arial" font-size="10" fill="#FFFFFF">4. Sign-in log review: all resources accessed 30 days prior</text>
  <text x="220" y="686" font-family="Arial" font-size="10" fill="#FFFFFF">5. PIR report due within 30 days of containment</text>

  <!-- Bottom legend -->
  <rect x="30" y="704" width="840" height="28" fill="#1F3864" rx="6" opacity="0.08"/>
  <rect x="40" y="711" width="14" height="14" fill="#1F7391" rx="2"/>
  <text x="60" y="722" font-family="Arial" font-size="9" fill="#595959">SOAR Automated</text>
  <rect x="170" y="711" width="14" height="14" fill="#C00000" rx="2"/>
  <text x="190" y="722" font-family="Arial" font-size="9" fill="#595959">P1 Critical Path</text>
  <rect x="300" y="711" width="14" height="14" fill="#375623" rx="2"/>
  <text x="320" y="722" font-family="Arial" font-size="9" fill="#595959">Standard Path</text>
  <text x="550" y="722" font-family="Arial" font-size="9" fill="#595959">Controls: IR-4 (Handling) | IR-6 (Reporting) | SOAR: SSA-PB-CredentialCompromise</text>
</svg>