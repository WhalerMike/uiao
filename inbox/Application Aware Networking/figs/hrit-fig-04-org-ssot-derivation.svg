<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1E8C8C"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#0D1B2E">The Organizational SSOT Derivation Chain</text>
  <text x="640" y="68" text-anchor="middle" font-size="16" fill="#6B7A8D">Worker record &#8594; stamped attributes &#8594; dynamic groups &#8594; entitlements: every access has a because</text>

  <!-- ===== Stage 1: Organizational SSOT ===== -->
  <rect x="40" y="130" width="198" height="430" rx="10" fill="#0D1B2E"/>
  <text x="139" y="160" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Organizational SSOT</text>
  <line x1="56" y1="176" x2="222" y2="176" stroke="#1E3A66" stroke-width="1.5"/>

  <!-- card: supervisory hierarchy -->
  <rect x="54" y="192" width="170" height="110" rx="6" fill="#EAF1FB"/>
  <text x="139" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">supervisory hierarchy</text>
  <rect x="127" y="228" width="24" height="14" fill="#0D1B2E"/>
  <line x1="139" y1="242" x2="139" y2="250" stroke="#5A5A5A" stroke-width="1.5"/>
  <line x1="103" y1="250" x2="175" y2="250" stroke="#5A5A5A" stroke-width="1.5"/>
  <line x1="103" y1="250" x2="103" y2="258" stroke="#5A5A5A" stroke-width="1.5"/>
  <line x1="175" y1="250" x2="175" y2="258" stroke="#5A5A5A" stroke-width="1.5"/>
  <rect x="91" y="258" width="24" height="14" fill="#1E3A66"/>
  <rect x="163" y="258" width="24" height="14" fill="#1E3A66"/>
  <text x="139" y="292" text-anchor="middle" font-size="13" fill="#6B7A8D">effective-dated reporting line</text>

  <!-- card: position records -->
  <rect x="54" y="314" width="170" height="110" rx="6" fill="#EAF1FB"/>
  <text x="139" y="337" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">position records</text>
  <rect x="66" y="350" width="42" height="28" rx="4" fill="#1E3A66"/>
  <rect x="118" y="350" width="42" height="28" rx="4" fill="#1E3A66"/>
  <rect x="170" y="350" width="42" height="28" rx="4" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="139" y="400" text-anchor="middle" font-size="14" fill="#C0392B">one seat vacant &#8212;</text>
  <text x="139" y="417" text-anchor="middle" font-size="14" fill="#C0392B">holds no access</text>

  <!-- card: cost centers -->
  <rect x="54" y="436" width="170" height="110" rx="6" fill="#EAF1FB"/>
  <text x="139" y="459" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">cost centers</text>
  <path d="M96,472 h64 v22 h-64 l-9,-11 z" fill="#1E3A66"/>
  <circle cx="94" cy="483" r="2.5" fill="#FFFFFF"/>
  <text x="130" y="488" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF">CC-2210</text>
  <path d="M120,504 h64 v22 h-64 l-9,-11 z" fill="#1E3A66"/>
  <circle cx="118" cy="515" r="2.5" fill="#FFFFFF"/>
  <text x="154" y="520" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF">CC-4415</text>

  <line x1="242" y1="345" x2="286" y2="345" stroke="#1E8C8C" stroke-width="3" marker-end="url(#mTeal)"/>

  <!-- ===== Stage 2: Stamped Attributes ===== -->
  <rect x="290" y="130" width="198" height="430" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="389" y="160" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Stamped Attributes</text>
  <line x1="306" y1="176" x2="472" y2="176" stroke="#E3E8EF" stroke-width="1.5"/>
  <rect x="306" y="192" width="166" height="56" rx="6" fill="#1E3A66"/>
  <text x="389" y="216" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">user object</text>
  <text x="389" y="238" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#EAF1FB">employeeId-anchored</text>
  <line x1="389" y1="250" x2="389" y2="272" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#mTeal)"/>
  <g fill="#EAF1FB" stroke="#1E3A66" stroke-width="1">
    <rect x="306" y="278" width="166" height="44" rx="6"/>
    <rect x="306" y="332" width="166" height="44" rx="6"/>
    <rect x="306" y="386" width="166" height="44" rx="6"/>
    <rect x="306" y="440" width="166" height="44" rx="6"/>
    <rect x="306" y="494" width="166" height="44" rx="6"/>
  </g>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#0D1B2E" text-anchor="middle">
    <text x="389" y="305">org code</text>
    <text x="389" y="359">position</text>
    <text x="389" y="413">worker type</text>
    <text x="389" y="467">supervisor</text>
    <text x="389" y="521">cost center</text>
  </g>

  <line x1="492" y1="345" x2="536" y2="345" stroke="#1E8C8C" stroke-width="3" marker-end="url(#mTeal)"/>

  <!-- ===== Stage 3: Dynamic Groups ===== -->
  <rect x="540" y="130" width="198" height="430" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="639" y="160" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Dynamic Groups</text>
  <line x1="556" y1="176" x2="722" y2="176" stroke="#E3E8EF" stroke-width="1.5"/>
  <ellipse cx="639" cy="264" rx="86" ry="66" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#0D1B2E" text-anchor="middle">
    <text x="639" y="248">rule:</text>
    <text x="639" y="270">org under S2X</text>
    <text x="639" y="292">type = employee</text>
  </g>
  <ellipse cx="639" cy="422" rx="86" ry="66" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#0D1B2E" text-anchor="middle">
    <text x="639" y="406">rule:</text>
    <text x="639" y="428">position = 4A10</text>
    <text x="639" y="450">location = HQ</text>
  </g>
  <text x="639" y="518" text-anchor="middle" font-size="15" font-style="italic" fill="#5A5A5A">membership is computed &#8212;</text>
  <text x="639" y="538" text-anchor="middle" font-size="15" font-style="italic" fill="#5A5A5A">nobody is added by hand</text>

  <line x1="742" y1="345" x2="786" y2="345" stroke="#1E8C8C" stroke-width="3" marker-end="url(#mTeal)"/>

  <!-- ===== Stage 4: Access Packages and Policy ===== -->
  <rect x="790" y="130" width="198" height="430" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="889" y="154" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Access Packages</text>
  <text x="889" y="176" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">and Policy</text>
  <line x1="806" y1="188" x2="972" y2="188" stroke="#E3E8EF" stroke-width="1.5"/>

  <rect x="806" y="200" width="166" height="96" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="889" y="224" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Access Package</text>
  <rect x="820" y="236" width="138" height="12" rx="2" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
  <rect x="820" y="254" width="138" height="12" rx="2" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
  <text x="889" y="286" text-anchor="middle" font-size="13" fill="#6B7A8D">eligibility + approval</text>

  <line x1="889" y1="298" x2="889" y2="326" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#mTeal)"/>

  <!-- supervisor-of-record node (org-tree glyph, top node highlighted) -->
  <rect x="871" y="330" width="36" height="18" rx="3" fill="#1E8C8C"/>
  <line x1="889" y1="348" x2="889" y2="356" stroke="#5A5A5A" stroke-width="1.5"/>
  <line x1="861" y1="356" x2="917" y2="356" stroke="#5A5A5A" stroke-width="1.5"/>
  <line x1="861" y1="356" x2="861" y2="362" stroke="#5A5A5A" stroke-width="1.5"/>
  <line x1="917" y1="356" x2="917" y2="362" stroke="#5A5A5A" stroke-width="1.5"/>
  <rect x="843" y="362" width="36" height="16" rx="3" fill="#6B7A8D"/>
  <rect x="899" y="362" width="36" height="16" rx="3" fill="#6B7A8D"/>
  <text x="889" y="404" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">approver =</text>
  <text x="889" y="424" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">supervisor of record</text>

  <!-- conditional access shield -->
  <path d="M889,442 L925,454 V482 Q925,510 889,524 Q853,510 853,482 V454 Z" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <path d="M877,482 l8,9 l16,-19" fill="none" stroke="#1E8C8C" stroke-width="3.5"/>
  <text x="889" y="542" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Conditional Access</text>
  <text x="889" y="556" text-anchor="middle" font-size="12.5" fill="#6B7A8D">same attributes as ABAC inputs</text>

  <line x1="992" y1="345" x2="1036" y2="345" stroke="#1E8C8C" stroke-width="3" marker-end="url(#mTeal)"/>

  <!-- ===== Stage 5: Entitlements ===== -->
  <rect x="1040" y="130" width="198" height="430" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="1139" y="160" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Entitlements</text>
  <line x1="1056" y1="176" x2="1222" y2="176" stroke="#E3E8EF" stroke-width="1.5"/>

  <g fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2">
    <rect x="1056" y="192" width="166" height="86" rx="8"/>
    <rect x="1056" y="292" width="166" height="86" rx="8"/>
    <rect x="1056" y="392" width="166" height="86" rx="8"/>
  </g>
  <g fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5">
    <circle cx="1139" cy="216" r="13"/>
    <circle cx="1139" cy="316" r="13"/>
    <circle cx="1139" cy="416" r="13"/>
  </g>
  <g fill="none" stroke="#1E8C8C" stroke-width="2.5">
    <path d="M1133,216 l4,5 l9,-10"/>
    <path d="M1133,316 l4,5 l9,-10"/>
    <path d="M1133,416 l4,5 l9,-10"/>
  </g>
  <g font-size="13" fill="#6B7A8D" text-anchor="middle">
    <text x="1139" y="246">application role</text>
    <text x="1139" y="346">application role</text>
    <text x="1139" y="446">application role</text>
  </g>
  <g font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">
    <text x="1139" y="266">case processing</text>
    <text x="1139" y="366">reporting</text>
    <text x="1139" y="466">records access</text>
  </g>
  <text x="1139" y="516" text-anchor="middle" font-size="15" font-style="italic" fill="#5A5A5A">every entitlement</text>
  <text x="1139" y="536" text-anchor="middle" font-size="15" font-style="italic" fill="#5A5A5A">has a because</text>

  <!-- crossed-out Visio-style drawing inset above caption -->
  <rect x="596" y="592" width="88" height="58" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="1.5"/>
  <rect x="626" y="600" width="28" height="12" fill="#6B7A8D"/>
  <line x1="640" y1="612" x2="640" y2="620" stroke="#6B7A8D" stroke-width="1.5"/>
  <line x1="616" y1="620" x2="664" y2="620" stroke="#6B7A8D" stroke-width="1.5"/>
  <line x1="616" y1="620" x2="616" y2="626" stroke="#6B7A8D" stroke-width="1.5"/>
  <line x1="664" y1="620" x2="664" y2="626" stroke="#6B7A8D" stroke-width="1.5"/>
  <rect x="604" y="626" width="24" height="11" fill="#6B7A8D"/>
  <rect x="652" y="626" width="24" height="11" fill="#6B7A8D"/>
  <line x1="590" y1="586" x2="690" y2="656" stroke="#C0392B" stroke-width="4"/>
  <line x1="590" y1="656" x2="690" y2="586" stroke="#C0392B" stroke-width="4"/>

  <text x="640" y="692" text-anchor="middle" font-size="20" font-style="italic" fill="#0D1B2E">The org chart stops being a drawing and becomes an API.</text>
</svg>
