<text x="450" y="392" text-anchor="middle" font-size="11" font-family="Arial" fill="#1F3864" font-weight="bold">FedRAMP 20x Consolidated Rules (June 2026): Machine-Readable KSI Evidence</text>
<text x="450" y="412" text-anchor="middle" font-size="10" font-family="Arial" fill="#1F3864">InfoBlox WAPI exports RPZ hit logs, DNSSEC status, and DNS audit events as structured JSON — satisfying FedRAMP 20x</text>
<text x="450" y="428" text-anchor="middle" font-size="10" font-family="Arial" fill="#1F3864">requirements for automated, machine-readable KSI evidence. Class B and C pipelines open August 31, 2026.</text>
<text x="450" y="448" text-anchor="middle" font-size="10" font-family="Arial" fill="#2E75B6" font-weight="bold">Boundary enforcement is continuous and automated — not assembled manually for annual assessments.</text>
