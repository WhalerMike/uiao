<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1E8C8C"/></marker>
    <marker id="mGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5A5A5A"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#0D1B2E">The Joiner&#8211;Mover&#8211;Leaver Event Flow</text>
  <text x="640" y="68" text-anchor="middle" font-size="16" fill="#6B7A8D">Effective-dated HR events become deterministic identity actions &#8212; each with a timestamped evidence record</text>

  <!-- ===== Lane 1: HR System of Record ===== -->
  <rect x="36" y="86" width="1208" height="106" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="50" y="112" font-size="19" font-weight="bold" fill="#0D1B2E">HR System of Record</text>
  <line x1="250" y1="168" x2="1200" y2="168" stroke="#5A5A5A" stroke-width="2" marker-end="url(#mGrey)"/>

  <!-- event markers: document icon + calendar stamp -->
  <g>
    <!-- Joiner -->
    <path d="M300,100 h30 l12,12 v42 h-42 z" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
    <path d="M330,100 v12 h12" fill="none" stroke="#0D1B2E" stroke-width="2"/>
    <line x1="307" y1="126" x2="335" y2="126" stroke="#E3E8EF" stroke-width="2"/>
    <line x1="307" y1="136" x2="335" y2="136" stroke="#E3E8EF" stroke-width="2"/>
    <rect x="326" y="138" width="30" height="22" rx="3" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <rect x="326" y="138" width="30" height="7" rx="3" fill="#1E8C8C"/>
    <circle cx="370" cy="168" r="5" fill="#1E8C8C"/>
    <text x="360" y="122" font-size="18" font-weight="bold" fill="#0D1B2E">Joiner &#8212; hire</text>
    <text x="360" y="146" font-size="16" fill="#5A5A5A">effective August 3</text>
    <!-- Mover -->
    <path d="M630,100 h30 l12,12 v42 h-42 z" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
    <path d="M660,100 v12 h12" fill="none" stroke="#0D1B2E" stroke-width="2"/>
    <line x1="637" y1="126" x2="665" y2="126" stroke="#E3E8EF" stroke-width="2"/>
    <line x1="637" y1="136" x2="665" y2="136" stroke="#E3E8EF" stroke-width="2"/>
    <rect x="656" y="138" width="30" height="22" rx="3" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <rect x="656" y="138" width="30" height="7" rx="3" fill="#1E8C8C"/>
    <circle cx="700" cy="168" r="5" fill="#1E8C8C"/>
    <text x="690" y="122" font-size="18" font-weight="bold" fill="#0D1B2E">Mover &#8212; transfer</text>
    <text x="690" y="146" font-size="16" fill="#5A5A5A">effective October 1</text>
    <!-- Leaver -->
    <path d="M960,100 h30 l12,12 v42 h-42 z" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
    <path d="M990,100 v12 h12" fill="none" stroke="#0D1B2E" stroke-width="2"/>
    <line x1="967" y1="126" x2="995" y2="126" stroke="#E3E8EF" stroke-width="2"/>
    <line x1="967" y1="136" x2="995" y2="136" stroke="#E3E8EF" stroke-width="2"/>
    <rect x="986" y="138" width="30" height="22" rx="3" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <rect x="986" y="138" width="30" height="7" rx="3" fill="#1E8C8C"/>
    <circle cx="1030" cy="168" r="5" fill="#1E8C8C"/>
    <text x="1020" y="122" font-size="18" font-weight="bold" fill="#0D1B2E">Leaver &#8212; separation</text>
    <text x="1020" y="146" font-size="16" fill="#5A5A5A">effective December 15</text>
  </g>

  <line x1="370" y1="176" x2="370" y2="206" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#mTeal)"/>
  <line x1="700" y1="176" x2="700" y2="206" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#mTeal)"/>
  <line x1="1030" y1="176" x2="1030" y2="206" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#mTeal)"/>

  <!-- ===== Lane 2: Integration Middleware ===== -->
  <rect x="36" y="202" width="1208" height="100" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="50" y="228" font-size="19" font-weight="bold" fill="#0D1B2E">Integration Middleware</text>
  <text x="50" y="252" font-size="15" fill="#6B7A8D">Graph bulkUpload,</text>
  <text x="50" y="272" font-size="15" fill="#6B7A8D">accepted HTTP 202</text>

  <g>
    <rect x="278" y="212" width="184" height="56" rx="5" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <path d="M278,212 L370,238 L462,212" fill="none" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="370" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">SCIM 2.0 payload</text>
    <rect x="410" y="264" width="132" height="26" rx="4" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="476" y="282" text-anchor="middle" font-size="14" fill="#1E8C8C">provenance record</text>

    <rect x="608" y="212" width="184" height="56" rx="5" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <path d="M608,212 L700,238 L792,212" fill="none" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="700" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">SCIM 2.0 payload</text>
    <rect x="740" y="264" width="132" height="26" rx="4" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="806" y="282" text-anchor="middle" font-size="14" fill="#1E8C8C">provenance record</text>

    <rect x="938" y="212" width="184" height="56" rx="5" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <path d="M938,212 L1030,238 L1122,212" fill="none" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="1030" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">SCIM 2.0 payload</text>
    <rect x="1070" y="264" width="132" height="26" rx="4" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="1136" y="282" text-anchor="middle" font-size="14" fill="#1E8C8C">provenance record</text>
  </g>

  <line x1="370" y1="292" x2="370" y2="336" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#mTeal)"/>
  <line x1="700" y1="292" x2="700" y2="336" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#mTeal)"/>
  <line x1="1030" y1="292" x2="1030" y2="336" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#mTeal)"/>

  <!-- ===== Lane 3: Entra ID Provisioning + Lifecycle Workflows ===== -->
  <rect x="36" y="312" width="1208" height="250" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="50" y="338" font-size="19" font-weight="bold" fill="#0D1B2E">Entra ID Provisioning +</text>
  <text x="50" y="362" font-size="19" font-weight="bold" fill="#0D1B2E">Lifecycle Workflows</text>

  <!-- joiner actions -->
  <g fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5">
    <rect x="245" y="346" width="250" height="40" rx="6"/>
    <rect x="245" y="398" width="250" height="40" rx="6"/>
    <rect x="245" y="450" width="250" height="40" rx="6"/>
    <rect x="245" y="502" width="250" height="40" rx="6"/>
  </g>
  <g font-size="16" fill="#0D1B2E" text-anchor="middle">
    <text x="370" y="371">create account</text>
    <text x="370" y="423">assign licenses</text>
    <text x="370" y="475">derive group memberships</text>
    <text x="370" y="527">queue credential enrollment</text>
  </g>
  <polyline points="245,366 235,366 235,522 245,522" fill="none" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="235" y1="418" x2="243" y2="418" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="235" y1="470" x2="243" y2="470" stroke="#1E8C8C" stroke-width="2"/>

  <!-- mover actions -->
  <g fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5">
    <rect x="575" y="346" width="250" height="40" rx="6"/>
    <rect x="575" y="398" width="250" height="40" rx="6"/>
    <rect x="575" y="450" width="250" height="40" rx="6"/>
  </g>
  <g font-size="16" fill="#0D1B2E" text-anchor="middle">
    <text x="700" y="371">re-stamp attributes</text>
    <text x="700" y="423">recompute dynamic groups</text>
    <text x="700" y="475">trigger access review</text>
  </g>
  <polyline points="575,366 565,366 565,470 575,470" fill="none" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="565" y1="418" x2="573" y2="418" stroke="#1E8C8C" stroke-width="2"/>

  <!-- leaver actions -->
  <g fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5">
    <rect x="890" y="346" width="280" height="40" rx="6"/>
    <rect x="890" y="398" width="280" height="40" rx="6"/>
    <rect x="890" y="450" width="280" height="40" rx="6"/>
    <rect x="890" y="502" width="280" height="40" rx="6"/>
  </g>
  <g font-size="16" fill="#0D1B2E" text-anchor="middle">
    <text x="1030" y="371">disable account</text>
    <text x="1030" y="423">revoke sessions and refresh tokens</text>
    <text x="1030" y="475">remove memberships</text>
    <text x="1030" y="527">revoke certificates</text>
  </g>
  <polyline points="890,366 880,366 880,522 890,522" fill="none" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="880" y1="418" x2="888" y2="418" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="880" y1="470" x2="888" y2="470" stroke="#1E8C8C" stroke-width="2"/>

  <!-- evidence connectors -->
  <g stroke="#5A5A5A" stroke-width="1.5" stroke-dasharray="5,4">
    <line x1="370" y1="546" x2="370" y2="584" marker-end="url(#mGrey)"/>
    <line x1="700" y1="494" x2="700" y2="584" marker-end="url(#mGrey)"/>
    <line x1="1030" y1="546" x2="1030" y2="584" marker-end="url(#mGrey)"/>
  </g>

  <!-- ===== Lane 4: Evidence ===== -->
  <rect x="36" y="572" width="1208" height="94" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="50" y="598" font-size="19" font-weight="bold" fill="#0D1B2E">Evidence</text>
  <text x="50" y="622" font-size="15" fill="#6B7A8D">one timestamped record</text>
  <text x="50" y="642" font-size="15" fill="#6B7A8D">per action</text>

  <!-- tiny evidence records: 4 / 3 / 4 -->
  <g fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5">
    <rect x="309" y="592" width="26" height="32" rx="3"/><rect x="341" y="592" width="26" height="32" rx="3"/><rect x="373" y="592" width="26" height="32" rx="3"/><rect x="405" y="592" width="26" height="32" rx="3"/>
    <rect x="655" y="592" width="26" height="32" rx="3"/><rect x="687" y="592" width="26" height="32" rx="3"/><rect x="719" y="592" width="26" height="32" rx="3"/>
    <rect x="969" y="592" width="26" height="32" rx="3"/><rect x="1001" y="592" width="26" height="32" rx="3"/><rect x="1033" y="592" width="26" height="32" rx="3"/><rect x="1065" y="592" width="26" height="32" rx="3"/>
  </g>
  <g stroke="#1E8C8C" stroke-width="1">
    <line x1="314" y1="602" x2="330" y2="602"/><line x1="314" y1="610" x2="330" y2="610"/><line x1="346" y1="602" x2="362" y2="602"/><line x1="346" y1="610" x2="362" y2="610"/><line x1="378" y1="602" x2="394" y2="602"/><line x1="378" y1="610" x2="394" y2="610"/><line x1="410" y1="602" x2="426" y2="602"/><line x1="410" y1="610" x2="426" y2="610"/>
    <line x1="660" y1="602" x2="676" y2="602"/><line x1="660" y1="610" x2="676" y2="610"/><line x1="692" y1="602" x2="708" y2="602"/><line x1="692" y1="610" x2="708" y2="610"/><line x1="724" y1="602" x2="740" y2="602"/><line x1="724" y1="610" x2="740" y2="610"/>
    <line x1="974" y1="602" x2="990" y2="602"/><line x1="974" y1="610" x2="990" y2="610"/><line x1="1006" y1="602" x2="1022" y2="602"/><line x1="1006" y1="610" x2="1022" y2="610"/><line x1="1038" y1="602" x2="1054" y2="602"/><line x1="1038" y1="610" x2="1054" y2="610"/><line x1="1070" y1="602" x2="1086" y2="602"/><line x1="1070" y1="610" x2="1086" y2="610"/>
  </g>

  <!-- rail to ConMon collector -->
  <g stroke="#1E8C8C" stroke-width="2" stroke-dasharray="6,5" fill="none">
    <line x1="370" y1="628" x2="370" y2="646"/>
    <line x1="700" y1="628" x2="700" y2="646"/>
    <line x1="1030" y1="628" x2="1030" y2="646"/>
    <polyline points="330,647 1126,647 1126,614"/>
    <line x1="1126" y1="614" x2="1142" y2="614" marker-end="url(#mTeal)"/>
  </g>
  <rect x="1146" y="584" width="88" height="60" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1190" y="608" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">ConMon</text>
  <text x="1190" y="630" text-anchor="middle" font-size="16" fill="#0D1B2E">collector</text>

  <text x="640" y="700" text-anchor="middle" font-size="19" font-style="italic" fill="#0D1B2E">The event causes the action &#8212; the ticket queue survives only for exceptions.</text>
</svg>
