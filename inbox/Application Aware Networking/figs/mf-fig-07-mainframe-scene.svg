<svg width="900" height="480" viewBox="0 0 900 480"
     xmlns="http://www.w3.org/2000/svg" style="background:#FFFFFF;font-family:Arial,sans-serif">

  <!-- Background -->
  <rect width="900" height="480" fill="#FFFFFF"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="48" fill="#1F3864"/>
  <text x="450" y="31" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="bold">The Mainframe Era: Brutal Elegance of Centralized Truth</text>

  <!-- Subtitle -->
  <text x="450" y="68" text-anchor="middle" fill="#1F3864" font-size="12">1940s&#x2013;1990s: One Source of Truth</text>

  <!-- ─── MAINFRAME BODY ─── -->
  <rect x="80" y="90" width="180" height="300" rx="10" fill="#1F3864" stroke="#2E75B6" stroke-width="3"/>
  <!-- Panel details -->
  <rect x="95" y="105" width="150" height="18" rx="3" fill="#2E75B6"/>
  <rect x="95" y="128" width="150" height="18" rx="3" fill="#2E75B6"/>
  <rect x="95" y="152" width="150" height="4" rx="2" fill="#C55A11"/>
  <!-- Tape drives -->
  <circle cx="120" cy="178" r="22" fill="#375623" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="120" cy="178" r="10" fill="#1F3864"/>
  <circle cx="200" cy="178" r="22" fill="#375623" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="200" cy="178" r="10" fill="#1F3864"/>
  <!-- Label on tape drives -->
  <text x="120" y="215" text-anchor="middle" fill="#FFFFFF" font-size="9">TAPE</text>
  <text x="200" y="215" text-anchor="middle" fill="#FFFFFF" font-size="9">TAPE</text>

  <!-- SSOT Database cylinder inside mainframe -->
  <ellipse cx="170" cy="265" rx="50" ry="14" fill="#C55A11"/>
  <rect x="120" y="265" width="100" height="55" fill="#C55A11"/>
  <ellipse cx="170" cy="320" rx="50" ry="14" fill="#C55A11" opacity="0.85"/>
  <!-- Golden glow -->
  <ellipse cx="170" cy="265" rx="50" ry="14" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.8"/>
  <text x="170" y="298" text-anchor="middle" fill="#FFFFFF" font-weight="bold" font-size="13">SSOT</text>

  <!-- IBM label -->
  <text x="170" y="368" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">IBM System/360</text>
  <rect x="88" y="375" width="144" height="12" rx="3" fill="#2E75B6"/>

  <!-- Terminals connected to mainframe -->
  <!-- Terminal 1: top -->
  <rect x="30" y="100" width="38" height="28" rx="3" fill="#375623" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="35" y="105" width="28" height="16" fill="#00CC00" opacity="0.8"/>
  <rect x="40" y="131" width="18" height="5" fill="#375623"/>
  <text x="49" y="146" text-anchor="middle" fill="#375623" font-size="8">Term 1</text>
  <line x1="68" y1="114" x2="80" y2="155" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Terminal 2: middle -->
  <rect x="22" y="210" width="38" height="28" rx="3" fill="#375623" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="27" y="215" width="28" height="16" fill="#00CC00" opacity="0.8"/>
  <rect x="32" y="241" width="18" height="5" fill="#375623"/>
  <text x="41" y="256" text-anchor="middle" fill="#375623" font-size="8">Term 2</text>
  <line x1="60" y1="224" x2="80" y2="230" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Terminal 3: bottom -->
  <rect x="30" y="330" width="38" height="28" rx="3" fill="#375623" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="35" y="335" width="28" height="16" fill="#00CC00" opacity="0.8"/>
  <rect x="40" y="361" width="18" height="5" fill="#375623"/>
  <text x="49" y="376" text-anchor="middle" fill="#375623" font-size="8">Term 3</text>
  <line x1="68" y1="344" x2="80" y2="320" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Divider -->
  <line x1="310" y1="58" x2="310" y2="470" stroke="#F2F2F2" stroke-width="2"/>

  <!-- Right panel: what it gave -->
  <text x="340" y="85" fill="#1F3864" font-size="13" font-weight="bold">What centralized architecture delivered:</text>

  <!-- Benefit bullets -->
  <circle cx="352" cy="122" r="8" fill="#375623"/>
  <text x="366" y="127" fill="#375623" font-size="8" font-weight="bold">&#x2713;</text>
  <text x="370" y="127" fill="#1F3864" font-size="12">One version of every record</text>

  <circle cx="352" cy="162" r="8" fill="#375623"/>
  <text x="366" y="167" fill="#375623" font-size="8" font-weight="bold">&#x2713;</text>
  <text x="370" y="167" fill="#1F3864" font-size="12">No regional discrepancies</text>

  <circle cx="352" cy="202" r="8" fill="#375623"/>
  <text x="366" y="207" fill="#375623" font-size="8" font-weight="bold">&#x2713;</text>
  <text x="370" y="207" fill="#1F3864" font-size="12">Physical security = network security</text>

  <circle cx="352" cy="242" r="8" fill="#375623"/>
  <text x="366" y="247" fill="#375623" font-size="8" font-weight="bold">&#x2713;</text>
  <text x="370" y="247" fill="#1F3864" font-size="12">Truth and enforcement in one box</text>

  <!-- Arrow and closing text -->
  <rect x="330" y="295" width="530" height="2" fill="#2E75B6"/>
  <polygon points="330,285 330,305 315,295" fill="#2E75B6"/>
  <text x="860" y="299" text-anchor="end" fill="#2E75B6" font-size="11" font-style="italic">The architecture that worked... until it did not.</text>

  <!-- Bottom callout -->
  <rect x="330" y="330" width="540" height="110" rx="8" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.5"/>
  <text x="600" y="354" text-anchor="middle" fill="#1F3864" font-weight="bold" font-size="12">Why the mainframe worked</text>
  <text x="345" y="376" fill="#1F3864" font-size="11">The mainframe was not merely a computer &#x2014; it was an architecture.</text>
  <text x="345" y="395" fill="#1F3864" font-size="11">Every terminal was a dumb endpoint. All logic, all data, all enforcement</text>
  <text x="345" y="414" fill="#1F3864" font-size="11">lived in one place. Governance was the hardware. Compliance was the room.</text>
  <text x="345" y="433" fill="#C55A11" font-size="11" font-weight="bold">This is what modern SSOT/control-plane architectures must restore.</text>

</svg>
