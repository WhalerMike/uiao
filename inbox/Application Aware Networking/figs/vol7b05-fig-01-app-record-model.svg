<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1A9E8F"/></marker>
  </defs>

  <text x="800" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#1F3A5F">The ServiceNow Compliance App — Record Model (Vol VII Book 05)</text>
  <text x="800" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5A6B7B">Scoped app x_ssa_fed_compliance: connectors, reconcile, gate, and the control map checked against the spine</text>
  <rect x="49" y="250" width="250" height="210" rx="9" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="2"/>
  <text x="174.0" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F">
  <tspan x="174.0" dy="0.0">Service Catalog / Flow</tspan>
  </text>
  <text x="174.0" y="317.85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="174.0" dy="0.0">Detect &amp; Route Control Drift</tspan>
  <tspan x="174.0" dy="21.8">flow; exception-review flow;</tspan>
  <tspan x="174.0" dy="21.8">attestation-emit job</tspan>
  </text>
  <rect x="340" y="170" width="700" height="470" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2.5"/>
  <text x="690" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F">Scoped app  x_ssa_fed_compliance</text>
  <rect x="365" y="222" width="650" height="112" rx="9" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="2"/>
  <text x="690.0" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F">
  <tspan x="690.0" dy="0.0">ComplianceIngest</tspan>
  </text>
  <text x="690.0" y="288.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="690.0" dy="0.0">Reads M365 (Graph/SCuBA/Purview) &amp; Azure (Resource Graph/Defender/Update Mgr)</tspan>
  <tspan x="690.0" dy="21.8">control state</tspan>
  </text>
  <rect x="365" y="350" width="650" height="112" rx="9" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="2"/>
  <text x="690.0" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F">
  <tspan x="690.0" dy="0.0">ComplianceReconcile</tspan>
  </text>
  <text x="690.0" y="416.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="690.0" dy="0.0">Matches each finding's asset to the IPAM/DDI CI (CM-8) before a task is raised</tspan>
  </text>
  <rect x="365" y="478" width="650" height="112" rx="9" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="2"/>
  <text x="690.0" y="508" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F">
  <tspan x="690.0" dy="0.0">ComplianceGate</tspan>
  </text>
  <text x="690.0" y="544.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="690.0" dy="0.0">Re-reads the native surface, confirms closure, stamps the re-test evidence</tspan>
  </text>

  <rect x="1085" y="200" width="465" height="120" rx="9" fill="#E6F5F2" stroke="#1A9E8F" stroke-width="2"/>
  <text x="1317.5" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F">
  <tspan x="1317.5" dy="0.0">MID Server — in-boundary</tspan>
  </text>
  <text x="1317.5" y="267.85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="1317.5" dy="0.0">Graph &amp; ARM REST via a credential alias;</tspan>
  <tspan x="1317.5" dy="21.8">credentials/execution never leave the ATO boundary</tspan>
  </text>
  <rect x="1085" y="340" width="220" height="110" rx="9" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <text x="1195.0" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F">
  <tspan x="1195.0" dy="0.0">M365</tspan>
  </text>
  <text x="1195.0" y="407.85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="1195.0" dy="0.0">SCuBA, CA, Purview, Entra</tspan>
  </text>
  <rect x="1330" y="340" width="220" height="110" rx="9" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <text x="1440.0" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F">
  <tspan x="1440.0" dy="0.0">Azure</tspan>
  </text>
  <text x="1440.0" y="407.85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="1440.0" dy="0.0">Policy, Defender, Update</tspan>
  <tspan x="1440.0" dy="21.8">Mgr</tspan>
  </text>
  <rect x="1085" y="470" width="465" height="100" rx="9" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="2"/>
  <text x="1317.5" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F">
  <tspan x="1317.5" dy="0.0">IPAM / DDI CMDB (CM-8)</tspan>
  </text>
  <text x="1317.5" y="537.85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="1317.5" dy="0.0">ComplianceReconcile binds every CI to the authoritative</tspan>
  <tspan x="1317.5" dy="21.8">identity</tspan>
  </text>
  <rect x="1085" y="585" width="465" height="95" rx="9" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="2"/>
  <text x="1317.5" y="615" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F">
  <tspan x="1317.5" dy="0.0">Tasks → IRM / Attestation</tspan>
  </text>
  <text x="1317.5" y="652.85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="1317.5" dy="0.0">Change / Incident / VR tasks feed Book 04</tspan>
  <tspan x="1317.5" dy="21.8">(CA-2/CA-5/CA-7)</tspan>
  </text>
  <line x1="299" y1="355" x2="340" y2="355" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arw-teal)"/>
  <line x1="1040" y1="260" x2="1085" y2="260" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arw-teal)"/>
  <line x1="1305" y1="395" x2="1330" y2="395" stroke="#1A9E8F" stroke-width="2" marker-end="url(#arw-teal)"/>
  <line x1="1040" y1="520" x2="1085" y2="520" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arw-teal)"/>
