  <rect x="340" y="712" width="700" height="70" rx="9" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="690" y="740" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1F3A5F">data/control-map.json  ·  ATF suites (test_mode)  ·  update set</text>
  <text x="690" y="763" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5A6B7B">the finding→task binding is a projection of the spine, CI-checked against it (regen-and-diff)</text>
    <rect x="49" y="828" width="1502" height="54" rx="8" fill="#F4F7FA" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="800" y="861" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1F3A5F">Least-privilege connectors: read + scoped, logged, individually-approved write — never standing tenant admin. FedRAMP Moderate &amp; GCC Moderate.</text>
