<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1A9E8F"/></marker>
  </defs>

  <text x="800" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#1F3A5F">The M365 &amp; Azure Compliance Loop (Vol VII Books 02–03)</text>
  <text x="800" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5A6B7B">One coordination pattern, two clouds — actuation stays platform-native</text>
  <rect x="49" y="200" width="270" height="320" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M59,200 h250 a10,10 0 0 1 10,10 v78 h-270 v-78 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="184.0" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 1</text>
  <text x="184.0" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="184.0" dy="0.0">Test</tspan>
  </text>
  <text x="184.0" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#2A2A2A">
  <tspan x="184.0" dy="0.0">Read the native control</tspan>
  <tspan x="184.0" dy="23.4">state (Graph, SCuBA,</tspan>
  <tspan x="184.0" dy="23.4">Azure Policy, Defender)</tspan>
  </text>
  <line x1="319" y1="360.0" x2="357" y2="360.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <rect x="357" y="200" width="270" height="320" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M367,200 h250 a10,10 0 0 1 10,10 v78 h-270 v-78 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="492.0" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 2</text>
  <text x="492.0" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="492.0" dy="0.0">Detect Drift</tspan>
  </text>
  <text x="492.0" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#2A2A2A">
  <tspan x="492.0" dy="0.0">Compare to the intended</tspan>
  <tspan x="492.0" dy="23.4">baseline; a deviation is</tspan>
  <tspan x="492.0" dy="23.4">a candidate finding</tspan>
  </text>
  <line x1="627" y1="360.0" x2="665" y2="360.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <rect x="665" y="200" width="270" height="320" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M675,200 h250 a10,10 0 0 1 10,10 v78 h-270 v-78 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="800.0" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 3</text>
  <text x="800.0" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="800.0" dy="0.0">Raise Task</tspan>
  </text>
  <text x="800.0" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#2A2A2A">
  <tspan x="800.0" dy="0.0">Typed Change / Incident</tspan>
  <tspan x="800.0" dy="23.4">/ Request against the</tspan>
  <tspan x="800.0" dy="23.4">reconciled CI, with</tspan>
  <tspan x="800.0" dy="23.4">control id, severity,</tspan>
  <tspan x="800.0" dy="23.4">SLA</tspan>
  </text>
  <line x1="935" y1="360.0" x2="966" y2="360.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <rect x="966" y="193" width="284" height="334" rx="14" fill="none" stroke="#D4860B" stroke-width="3"/>
  <rect x="973" y="200" width="270" height="320" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M983,200 h250 a10,10 0 0 1 10,10 v78 h-270 v-78 a10,10 0 0 1 10,-10 z" fill="#1A9E8F"/>
  <text x="1108.0" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 4</text>
  <text x="1108.0" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="1108.0" dy="0.0">Actuate (native)</tspan>
  </text>
  <text x="1108.0" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#2A2A2A">
  <tspan x="1108.0" dy="0.0">The owner fixes it on</tspan>
  <tspan x="1108.0" dy="23.4">the native surface —</tspan>
  <tspan x="1108.0" dy="23.4">ServiceNow does not flip</tspan>
  <tspan x="1108.0" dy="23.4">the setting</tspan>
  </text>
  <line x1="1243" y1="360.0" x2="1281" y2="360.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <rect x="1281" y="200" width="270" height="320" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M1291,200 h250 a10,10 0 0 1 10,10 v78 h-270 v-78 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="1416.0" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 5</text>
  <text x="1416.0" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="1416.0" dy="0.0">Close + Evidence</tspan>
  </text>
  <text x="1416.0" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#2A2A2A">
  <tspan x="1416.0" dy="0.0">Re-test confirms</tspan>
  <tspan x="1416.0" dy="23.4">closure; task, approval</tspan>
  <tspan x="1416.0" dy="23.4">trail, re-test become</tspan>
  <tspan x="1416.0" dy="23.4">the evidence record</tspan>
  </text>
  <text x="1108.0" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#D4860B">platform-native — not ServiceNow</text>
  <path d="M1416.0,520 V616 H184.0 V520" fill="none" stroke="#1A9E8F" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#arw-teal)"/>
  <text x="800" y="606" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5A6B7B">Continuous — the loop re-runs each cycle; results roll up to attestation (Book 04) and the KSI evidence pipeline</text>
    <rect x="49" y="828" width="1502" height="54" rx="8" fill="#F4F7FA" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="800" y="861" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1F3A5F">Scope: FedRAMP Moderate &amp; Microsoft GCC Moderate. ServiceNow coordinates owner, SLA, approval, and evidence; the platform actuates.</text>
</svg>