<svg viewBox="0 0 1040 500" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="500" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#999"/></marker><marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2E75B6"/></marker><marker id="arww" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#fff"/></marker></defs><text x="520" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3864">Cisco Catalyst SD-WAN — Four Functional Planes</text><text x="520" y="46" text-anchor="middle" font-size="11" fill="#2E75B6">Every WAN Edge device spans all four planes; only the data plane carries agency traffic</text><rect x="30" y="60" width="230" height="50" rx="6" fill="#1F3864"/><text x="145" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Management Plane</text><text x="145" y="100" text-anchor="middle" font-size="10" fill="#fff">PLANE 1</text><rect x="30" y="118" width="230" height="60" rx="4" fill="#1F3864" opacity="0.18"/><rect x="30" y="118" width="230" height="60" rx="4" fill="none" stroke="#1F3864" stroke-width="2"/><text x="145" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F3864">SD-WAN Manager</text><text x="145" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F3864">(vManage)</text><text x="145" y="190" text-anchor="middle" font-size="9" fill="#1F3864">Policy authoring · Template deployment</text><text x="145" y="204" text-anchor="middle" font-size="9" fill="#1F3864">Telemetry aggregation · Audit logging</text><text x="145" y="218" text-anchor="middle" font-size="9" fill="#1F3864">The authoritative governance surface</text><line x1="262" y1="145" x2="276" y2="145" stroke="#aaa" stroke-width="1.5" marker-end="url(#arw)"/><rect x="276" y="60" width="230" height="50" rx="6" fill="#2E75B6"/><text x="391" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Control Plane</text><text x="391" y="100" text-anchor="middle" font-size="10" fill="#fff">PLANE 2</text><rect x="276" y="118" width="230" height="60" rx="4" fill="#2E75B6" opacity="0.18"/><rect x="276" y="118" width="230" height="60" rx="4" fill="none" stroke="#2E75B6" stroke-width="2"/><text x="391" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E75B6">SD-WAN Controller</text><text x="391" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E75B6">(vSmart)</text><text x="391" y="190" text-anchor="middle" font-size="9" fill="#1F3864">Distributes routing policy via OMP</text><text x="391" y="204" text-anchor="middle" font-size="9" fill="#1F3864">Overlay Management Protocol</text><text x="391" y="218" text-anchor="middle" font-size="9" fill="#1F3864">BGP-equivalent for the SD-WAN fabric</text><line x1="508" y1="145" x2="522" y2="145" stroke="#aaa" stroke-width="1.5" marker-end="url(#arw)"/><rect x="522" y="60" width="230" height="50" rx="6" fill="#C55A11"/><text x="637" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Orchestration Plane</text><text x="637" y="100" text-anchor="middle" font-size="10" fill="#fff">PLANE 3</text><rect x="522" y="118" width="230" height="60" rx="4" fill="#C55A11" opacity="0.18"/><rect x="522" y="118" width="230" height="60" rx="4" fill="none" stroke="#C55A11" stroke-width="2"/><text x="637" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#C55A11">SD-WAN Validator</text><text x="637" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#C55A11">(vBond)</text><text x="637" y="190" text-anchor="middle" font-size="9" fill="#1F3864">Zero-touch provisioning</text><text x="637" y="204" text-anchor="middle" font-size="9" fill="#1F3864">Authenticates WAN Edge devices</text><text x="637" y="218" text-anchor="middle" font-size="9" fill="#1F3864">Single network-facing onboarding IP</text><line x1="754" y1="145" x2="768" y2="145" stroke="#aaa" stroke-width="1.5" marker-end="url(#arw)"/><rect x="768" y="60" width="230" height="50" rx="6" fill="#375623"/><text x="883" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Data Plane</text><text x="883" y="100" text-anchor="middle" font-size="10" fill="#fff">PLANE 4</text><rect x="768" y="118" width="230" height="60" rx="4" fill="#375623" opacity="0.18"/><rect x="768" y="118" width="230" height="60" rx="4" fill="none" stroke="#375623" stroke-width="2"/><text x="883" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#375623">WAN Edge</text><text x="883" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#375623">(cEdge / ISR / ASR)</text><text x="883" y="190" text-anchor="middle" font-size="9" fill="#1F3864">DPI · Path measurement · Traffic steering</text><text x="883" y="204" text-anchor="middle" font-size="9" fill="#1F3864">Applies policy to every user packet</text><text x="883" y="218" text-anchor="middle" font-size="9" fill="#1F3864">Only plane agency traffic traverses</text><rect x="30" y="380" width="980" height="28" rx="4" fill="#1F3864"/><text x="520" y="392" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">FedRAMP Boundary Implication:</text><text x="520" y="404" text-anchor="middle" font-size="9" fill="#fff">Only SD-WAN Manager (Management plane) is cloud-hosted in the cloud-delivered model. Data plane (cEdge) hardware stays inside the agency boundary. Each plane requires separate boundary documentation.</text></svg>