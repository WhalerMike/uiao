<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <defs>
    <linearGradient id="ssabg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF5FF"/>
      <stop offset="100%" stop-color="#D6E8F7"/>
    </linearGradient>
    <linearGradient id="opmbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F0FA"/>
      <stop offset="100%" stop-color="#E8DFF5"/>
    </linearGradient>
    <linearGradient id="ibmid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A8FD6"/>
      <stop offset="100%" stop-color="#1F3864"/>
    </linearGradient>
    <linearGradient id="ocibg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F0"/>
      <stop offset="100%" stop-color="#FFD7D7"/>
    </linearGradient>
    <filter id="sh6"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#00000022"/></filter>
    <marker id="a6" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#1F3864" opacity="0.8"/>
    </marker>
    <marker id="a6r" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto-start-reverse">
      <polygon points="10 0,0 3.5,10 7" fill="#1F3864" opacity="0.8"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="#F8F8FC"/>
  <text x="600" y="36" text-anchor="middle" fill="#1F3864" font-size="22" font-weight="bold">OPM HRIT on Oracle OCI — SSA Inter-Agency Integration via InfoBlox</text>
  <text x="600" y="58" text-anchor="middle" fill="#2E75B6" font-size="14">InfoBlox manages the DNS, IP documentation, and certificate monitoring SSA cannot see on OPM's side</text>

  <!-- SSA side (left) -->
  <rect x="24" y="76" width="350" height="520" rx="16" fill="url(#ssabg)" stroke="#2E75B6" stroke-width="2"/>
  <rect x="24" y="76" width="350" height="44" rx="16" fill="#1F3864"/>
  <rect x="24" y="104" width="350" height="16" fill="#1F3864"/>
  <text x="199" y="104" text-anchor="middle" fill="white" font-size="15" font-weight="bold">SSA Environment</text>
  <text x="199" y="130" text-anchor="middle" fill="#1B3A6B" font-size="12">SSA Controls This Side</text>

  <!-- SSA workloads -->
  <g filter="url(#sh6)">
    <rect x="44" y="150" width="310" height="50" rx="8" fill="white" stroke="#2E75B6" stroke-width="1.5"/>
  </g>
  <text x="199" y="170" text-anchor="middle" fill="#1F3864" font-size="12" font-weight="bold">Benefits Processing Systems</text>
  <text x="199" y="186" text-anchor="middle" fill="#555" font-size="11">API consumer of OPM HRIT data</text>

  <g filter="url(#sh6)">
    <rect x="44" y="214" width="310" height="50" rx="8" fill="white" stroke="#2E75B6" stroke-width="1.5"/>
  </g>
  <text x="199" y="234" text-anchor="middle" fill="#1F3864" font-size="12" font-weight="bold">SSA Trust Store (JKS / Windows)</text>
  <text x="199" y="250" text-anchor="middle" fill="#555" font-size="11">Holds OPM HRIT TLS cert (must be current)</text>

  <g filter="url(#sh6)">
    <rect x="44" y="278" width="310" height="50" rx="8" fill="white" stroke="#375623" stroke-width="1.5"/>
  </g>
  <text x="199" y="298" text-anchor="middle" fill="#375623" font-size="12" font-weight="bold">InfoBlox Conditional Forwarder</text>
  <text x="199" y="314" text-anchor="middle" fill="#555" font-size="11">*.opm.gov → OCI DNS endpoint</text>

  <g filter="url(#sh6)">
    <rect x="44" y="342" width="310" height="50" rx="8" fill="white" stroke="#7030A0" stroke-width="1.5"/>
  </g>
  <text x="199" y="362" text-anchor="middle" fill="#7030A0" font-size="12" font-weight="bold">InfoBlox Certificate Tracker</text>
  <text x="199" y="378" text-anchor="middle" fill="#555" font-size="11">Polls OPM HRIT HTTPS endpoint</text>

  <g filter="url(#sh6)">
    <rect x="44" y="406" width="310" height="50" rx="8" fill="white" stroke="#C55A11" stroke-width="1.5"/>
  </g>
  <text x="199" y="426" text-anchor="middle" fill="#C55A11" font-size="12" font-weight="bold">InfoBlox External Host Record</text>
  <text x="199" y="442" text-anchor="middle" fill="#555" font-size="11">OCI IPs documented → SA-9 auto-generated</text>

  <rect x="44" y="470" width="310" height="110" rx="10" fill="#1F3864"/>
  <text x="199" y="492" text-anchor="middle" fill="white" font-size="13" font-weight="bold">SSA Gets Advance Warning</text>
  <text x="60" y="512" fill="white" font-size="11" opacity="0.9">90 days: OPM HRIT cert expires soon</text>
  <text x="60" y="528" fill="white" font-size="11" opacity="0.9">30 days: Coordinate with OPM team</text>
  <text x="60" y="544" fill="white" font-size="11" opacity="0.9">7 days: Update SSA trust stores</text>
  <text x="60" y="562" fill="#FFD700" font-size="11" font-weight="bold">Zero downtime on cert rotation day</text>

  <!-- InfoBlox CENTER bridge -->
  <g filter="url(#sh6)">
    <rect x="432" y="200" width="336" height="320" rx="16" fill="url(#ibmid)"/>
  </g>
  <circle cx="600" cy="292" r="36" fill="none" stroke="white" stroke-width="3" opacity="0.6"/>
  <circle cx="600" cy="292" r="14" fill="white" opacity="0.7"/>
  <circle cx="575" cy="330" r="10" fill="white" opacity="0.5"/>
  <circle cx="625" cy="330" r="10" fill="white" opacity="0.5"/>
  <line x1="600" y1="306" x2="577" y2="322" stroke="white" stroke-width="2.5" opacity="0.8"/>
  <line x1="600" y1="306" x2="623" y2="322" stroke="white" stroke-width="2.5" opacity="0.8"/>
  <line x1="579" y1="330" x2="621" y2="330" stroke="white" stroke-width="2.5" opacity="0.8"/>

  <text x="600" y="370" text-anchor="middle" fill="white" font-size="18" font-weight="bold">InfoBlox DDI</text>
  <text x="600" y="392" text-anchor="middle" fill="white" font-size="12" opacity="0.9">The Bridge Layer SSA Controls</text>
  <line x1="470" y1="418" x2="730" y2="418" stroke="white" stroke-width="1" opacity="0.3"/>
  <text x="600" y="440" text-anchor="middle" fill="white" font-size="12" font-weight="bold">DNS Conditional Forwarder</text>
  <text x="600" y="458" text-anchor="middle" fill="white" font-size="11" opacity="0.9">*.opm.gov → OCI resolver</text>
  <text x="600" y="480" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Certificate Monitor</text>
  <text x="600" y="498" text-anchor="middle" fill="white" font-size="11" opacity="0.9">TLS thumbprint + expiry imported</text>

  <!-- OPM / OCI side (right) -->
  <rect x="826" y="76" width="350" height="520" rx="16" fill="url(#ocibg)" stroke="#8B1A1A" stroke-width="2"/>
  <rect x="826" y="76" width="350" height="44" rx="16" fill="#8B1A1A"/>
  <rect x="826" y="104" width="350" height="16" fill="#8B1A1A"/>
  <text x="1001" y="104" text-anchor="middle" fill="white" font-size="15" font-weight="bold">OPM HRIT on Oracle OCI</text>
  <text x="1001" y="130" text-anchor="middle" fill="#5A0000" font-size="12">OPM Controls This Side — SSA Cannot Access</text>

  <g filter="url(#sh6)">
    <rect x="846" y="150" width="310" height="50" rx="8" fill="white" stroke="#8B1A1A" stroke-width="1.5"/>
  </g>
  <text x="1001" y="170" text-anchor="middle" fill="#8B1A1A" font-size="12" font-weight="bold">Oracle HCM / ERP Cloud</text>
  <text x="1001" y="186" text-anchor="middle" fill="#555" font-size="11">OPM HRIT SaaS on OCI GovCloud</text>

  <g filter="url(#sh6)">
    <rect x="846" y="214" width="310" height="50" rx="8" fill="white" stroke="#8B1A1A" stroke-width="1.5"/>
  </g>
  <text x="1001" y="234" text-anchor="middle" fill="#8B1A1A" font-size="12" font-weight="bold">OCI Certificates Service</text>
  <text x="1001" y="250" text-anchor="middle" fill="#555" font-size="11">Issues TLS cert for HRIT API endpoint</text>

  <g filter="url(#sh6)">
    <rect x="846" y="278" width="310" height="50" rx="8" fill="white" stroke="#8B1A1A" stroke-width="1.5"/>
  </g>
  <text x="1001" y="298" text-anchor="middle" fill="#8B1A1A" font-size="12" font-weight="bold">OCI VCN DNS (169.254.169.254)</text>
  <text x="1001" y="314" text-anchor="middle" fill="#555" font-size="11">OPM's internal OCI resolver</text>

  <g filter="url(#sh6)">
    <rect x="846" y="342" width="310" height="50" rx="8" fill="white" stroke="#8B1A1A" stroke-width="1.5"/>
  </g>
  <text x="1001" y="362" text-anchor="middle" fill="#8B1A1A" font-size="12" font-weight="bold">OCI FastConnect</text>
  <text x="1001" y="378" text-anchor="middle" fill="#555" font-size="11">Private circuit to SSA on-prem / GovCloud</text>

  <!-- SSA CANNOT see box -->
  <rect x="846" y="406" width="310" height="174" rx="10" fill="#FFCDD2" stroke="#C00000" stroke-width="1.5"/>
  <text x="1001" y="430" text-anchor="middle" fill="#C00000" font-size="13" font-weight="bold">⚠ SSA Has No Visibility Into:</text>
  <text x="862" y="452" fill="#7B0000" font-size="11">• When OPM will rotate their TLS cert</text>
  <text x="862" y="469" fill="#7B0000" font-size="11">• Which OCI IP ranges OPM uses</text>
  <text x="862" y="486" fill="#7B0000" font-size="11">• OPM's OCI DNS configuration</text>
  <text x="862" y="503" fill="#7B0000" font-size="11">• OPM maintenance windows</text>
  <line x1="862" y1="520" x2="1140" y2="520" stroke="#C00000" stroke-width="1" opacity="0.4"/>
  <text x="1001" y="541" text-anchor="middle" fill="#1B4D1B" font-size="12" font-weight="bold">InfoBlox solves this from SSA's side</text>
  <text x="1001" y="558" text-anchor="middle" fill="#1B4D1B" font-size="11">by polling OPM's HTTPS endpoint</text>
  <text x="1001" y="574" text-anchor="middle" fill="#1B4D1B" font-size="11">and monitoring the presented cert</text>

  <!-- Connecting lines/arrows -->
  <!-- SSA → InfoBlox -->
  <line x1="374" y1="350" x2="432" y2="350" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#a6)"/>
  <line x1="374" y1="302" x2="432" y2="320" stroke="#375623" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#a6)"/>
  <!-- InfoBlox → OPM -->
  <line x1="768" y1="350" x2="826" y2="350" stroke="#8B1A1A" stroke-width="2.5" marker-end="url(#a6)"/>
  <text x="797" y="342" text-anchor="middle" fill="#1F3864" font-size="11" font-weight="bold">API call</text>
  <text x="797" y="356" text-anchor="middle" fill="#1F3864" font-size="11">+ cert pull</text>
</svg>
