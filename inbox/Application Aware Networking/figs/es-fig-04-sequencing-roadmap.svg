ight="20" rx="4" fill="#375623"/><text x="235.27272727272728" y="343" text-anchor="start" font-size="9" font-weight="normal" fill="#FFFFFF">Part 9 — DB Architecture (ongoing, concurrent)</text><line x1="561.8181818181818" y1="115" x2="561.8181818181818" y2="360" stroke="#C00000" stroke-width="1.5" stroke-dasharray="4,3"/><text x="520" y="385" text-anchor="middle" font-size="10" font-weight="normal" fill="#1F3864">All five tracks must be in active implementation — not planning — before the January 2027 mandatory date.</text></svg>
