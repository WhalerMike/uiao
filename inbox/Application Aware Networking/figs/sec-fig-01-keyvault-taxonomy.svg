<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" font-family="Segoe UI,Arial,sans-serif">
<rect width="900" height="560" fill="#F2F2F2"/>
<rect x="0" y="0" width="900" height="50" fill="#1F3864"/>
<text x="450" y="33" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">Azure Key Vault — Object Type Taxonomy</text>
<rect x="40" y="55" width="260" height="60" fill="#2E75B6" rx="4"/>
<text x="170" y="75" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">SECRETS</text>
<text x="170" y="89" text-anchor="middle" fill="#FFFFFF" font-size="9.5">API Keys · Connection Strings</text>
<text x="170" y="101" text-anchor="middle" fill="#FFFFFF" font-size="9.5">Passwords · OAuth Tokens</text>
<rect x="320" y="55" width="260" height="60" fill="#1F7391" rx="4"/>
<text x="450" y="75" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">KEYS</text>
<text x="450" y="89" text-anchor="middle" fill="#FFFFFF" font-size="9.5">RSA-HSM · EC-HSM</text>
<text x="450" y="101" text-anchor="middle" fill="#FFFFFF" font-size="9.5">AES-256 · Wrap/Unwrap</text>
<rect x="600" y="55" width="260" height="60" fill="#375623" rx="4"/>
<text x="730" y="75" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">CERTIFICATES</text>
<text x="730" y="89" text-anchor="middle" fill="#FFFFFF" font-size="9.5">X.509 · TLS Certs</text>
<text x="730" y="101" text-anchor="middle" fill="#FFFFFF" font-size="9.5">Code Signing · Client Auth</text>
<rect x="0" y="130" width="40" height="85" fill="#1F3864"/>
<text x="20" y="172" text-anchor="middle" fill="#FFFFFF" font-size="8.5" font-weight="bold" transform="rotate(-90,20,172)">Use Cases</text>
<rect x="0" y="230" width="40" height="85" fill="#1F3864"/>
<text x="20" y="272" text-anchor="middle" fill="#FFFFFF" font-size="8.5" font-weight="bold" transform="rotate(-90,20,272)">Access Pattern</text>
<rect x="0" y="330" width="40" height="85" fill="#1F3864"/>
<text x="20" y="372" text-anchor="middle" fill="#FFFFFF" font-size="8.5" font-weight="bold" transform="rotate(-90,20,372)">Rotation Mechanism</text>
<rect x="0" y="430" width="40" height="85" fill="#1F3864"/>
<text x="20" y="472" text-anchor="middle" fill="#FFFFFF" font-size="8.5" font-weight="bold" transform="rotate(-90,20,472)">RBAC Roles</text>
<rect x="40" y="130" width="260" height="85" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1" rx="2"/>
<text x="170" y="163" text-anchor="middle" fill="#595959" font-size="9">Application runtime</text>
<text x="170" y="177" text-anchor="middle" fill="#595959" font-size="9">credentials; DB passwords;</text>
<text x="170" y="191" text-anchor="middle" fill="#595959" font-size="9">external API keys</text>
<rect x="320" y="130" width="260" height="85" fill="#FFFFFF" stroke="#1F7391" stroke-width="1" rx="2"/>
<text x="450" y="163" text-anchor="middle" fill="#595959" font-size="9">Envelope encryption (DEK/KEK);</text>
<text x="450" y="177" text-anchor="middle" fill="#595959" font-size="9">data signing; BYOK for</text>
<text x="450" y="191" text-anchor="middle" fill="#595959" font-size="9">storage + SQL TDE</text>
<rect x="600" y="130" width="260" height="85" fill="#FFFFFF" stroke="#375623" stroke-width="1" rx="2"/>
<text x="730" y="163" text-anchor="middle" fill="#595959" font-size="9">TLS server certificates;</text>
<text x="730" y="177" text-anchor="middle" fill="#595959" font-size="9">client certs for app-to-app</text>
<text x="730" y="191" text-anchor="middle" fill="#595959" font-size="9">auth; code signing</text>
<rect x="40" y="230" width="260" height="85" fill="#EEF4FB" stroke="#2E75B6" stroke-width="1" rx="2"/>
<text x="170" y="263" text-anchor="middle" fill="#595959" font-size="9">GetSecret API or</text>
<text x="170" y="277" text-anchor="middle" fill="#595959" font-size="9">Key Vault Reference</text>
<text x="170" y="291" text-anchor="middle" fill="#595959" font-size="9">(transparent resolution)</text>
<rect x="320" y="230" width="260" height="85" fill="#EEF4FB" stroke="#1F7391" stroke-width="1" rx="2"/>
<text x="450" y="263" text-anchor="middle" fill="#595959" font-size="9">CryptographyClient:</text>
<text x="450" y="277" text-anchor="middle" fill="#595959" font-size="9">wrap/unwrap/sign/verify</text>
<text x="450" y="291" text-anchor="middle" fill="#595959" font-size="9">(key bytes never exported)</text>
<rect x="600" y="230" width="260" height="85" fill="#EEF4FB" stroke="#375623" stroke-width="1" rx="2"/>
<text x="730" y="263" text-anchor="middle" fill="#595959" font-size="9">CertificateClient;</text>
<text x="730" y="277" text-anchor="middle" fill="#595959" font-size="9">Secret backing for PFX</text>
<text x="730" y="291" text-anchor="middle" fill="#595959" font-size="9">(private key via SecretGet)</text>
<rect x="40" y="330" width="260" height="85" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1" rx="2"/>
<text x="170" y="363" text-anchor="middle" fill="#595959" font-size="9">Create new version;</text>
<text x="170" y="377" text-anchor="middle" fill="#595959" font-size="9">old version retained</text>
<text x="170" y="391" text-anchor="middle" fill="#595959" font-size="9">for grace period</text>
<rect x="320" y="330" width="260" height="85" fill="#FFFFFF" stroke="#1F7391" stroke-width="1" rx="2"/>
<text x="450" y="363" text-anchor="middle" fill="#595959" font-size="9">New key version created;</text>
<text x="450" y="377" text-anchor="middle" fill="#595959" font-size="9">ciphertext re-wrapped</text>
<text x="450" y="391" text-anchor="middle" fill="#595959" font-size="9">if rotation policy set</text>
<rect x="600" y="330" width="260" height="85" fill="#FFFFFF" stroke="#375623" stroke-width="1" rx="2"/>
<text x="730" y="356" text-anchor="middle" fill="#595959" font-size="9">Auto-renewal policy</text>
<text x="730" y="370" text-anchor="middle" fill="#595959" font-size="9">(e.g., at 80% lifetime);</text>
<text x="730" y="384" text-anchor="middle" fill="#595959" font-size="9">DigiCert/GlobalSign CA</text>
<text x="730" y="398" text-anchor="middle" fill="#595959" font-size="9">integration</text>
<rect x="40" y="430" width="260" height="85" fill="#EEF4FB" stroke="#2E75B6" stroke-width="1" rx="2"/>
<text x="170" y="463" text-anchor="middle" fill="#595959" font-size="9">Secrets User: read only</text>
<text x="170" y="477" text-anchor="middle" fill="#595959" font-size="9">Secrets Officer: full</text>
<text x="170" y="491" text-anchor="middle" fill="#595959" font-size="9">Reader: list, no read</text>
<rect x="320" y="430" width="260" height="85" fill="#EEF4FB" stroke="#1F7391" stroke-width="1" rx="2"/>
<text x="450" y="456" text-anchor="middle" fill="#595959" font-size="9">Crypto User: operations</text>
<text x="450" y="470" text-anchor="middle" fill="#595959" font-size="9">Crypto Officer: full</text>
<text x="450" y="484" text-anchor="middle" fill="#595959" font-size="9">Crypto Svc Enc User:</text>
<text x="450" y="498" text-anchor="middle" fill="#595959" font-size="9">wrap/unwrap only</text>
<rect x="600" y="430" width="260" height="85" fill="#EEF4FB" stroke="#375623" stroke-width="1" rx="2"/>
<text x="730" y="463" text-anchor="middle" fill="#595959" font-size="9">Certs Officer: full mgmt</text>
<text x="730" y="477" text-anchor="middle" fill="#595959" font-size="9">Secrets User: read PFX</text>
<text x="730" y="491" text-anchor="middle" fill="#595959" font-size="9">(via secret backing)</text>
<rect x="0" y="530" width="900" height="30" fill="#1F3864"/>
<text x="450" y="548" text-anchor="middle" fill="#FFFFFF" font-size="9">FedRAMP Moderate — All Key Vault objects require expiry date (Azure Policy deny effect) · HSM-protected keys required for SC-12 compliance</text>
</svg>