<svg width="900" height="480" viewBox="0 0 900 480"
     xmlns="http://www.w3.org/2000/svg" style="background:#FFFFFF;font-family:Arial,sans-serif">

  <rect width="900" height="480" fill="#FFFFFF"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="48" fill="#1F3864"/>
  <text x="450" y="22" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">Act 2 &#x2014; When Security Ate the Architecture: Stacked Defense Broke Sessions</text>
  <text x="450" y="40" text-anchor="middle" fill="#F2F2F2" font-size="10">Latency kills sessions by exceeding timeouts. Security devices designed to break sessions... do.</text>

  <!-- LEFT: Branch Office Laptop -->
  <rect x="30" y="180" width="70" height="50" rx="5" fill="#2E75B6" stroke="#1F3864" stroke-width="2"/>
  <rect x="37" y="187" width="56" height="34" fill="#F2F2F2"/>
  <rect x="22" y="230" width="86" height="6" rx="3" fill="#1F3864"/>
  <text x="65" y="256" text-anchor="middle" fill="#1F3864" font-size="9">Branch Office</text>
  <text x="65" y="268" text-anchor="middle" fill="#1F3864" font-size="9">Laptop</text>

  <!-- Request arrow -->
  <text x="65" y="160" text-anchor="middle" fill="#375623" font-size="11" font-weight="bold">Request</text>
  <line x1="65" y1="165" x2="65" y2="178" stroke="#375623" stroke-width="2"/>
  <polygon points="60,175 70,175 65,180" fill="#375623"/>

  <!-- Flow arrow going right -->
  <line x1="100" y1="205" x2="165" y2="205" stroke="#2E75B6" stroke-width="2"/>
  <polygon points="162,200 172,205 162,210" fill="#2E75B6"/>

  <!-- Security device stack - 5 devices vertical -->
  <!-- Device 1: Firewall -->
  <rect x="172" y="80" width="130" height="56" rx="6" fill="#1F3864" stroke="#2E75B6" stroke-width="2"/>
  <text x="237" y="103" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">Firewall</text>
  <text x="237" y="118" text-anchor="middle" fill="#F2F2F2" font-size="9">Brick wall inspection</text>
  <rect x="325" y="98" width="60" height="20" rx="4" fill="#C55A11"/>
  <text x="355" y="112" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">+15ms</text>

  <!-- Device 2: NAT -->
  <rect x="172" y="155" width="130" height="56" rx="6" fill="#1F3864" stroke="#2E75B6" stroke-width="2"/>
  <text x="237" y="178" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">NAT Box</text>
  <text x="237" y="193" text-anchor="middle" fill="#F2F2F2" font-size="9">Address translation</text>
  <rect x="325" y="173" width="60" height="20" rx="4" fill="#C55A11"/>
  <text x="355" y="187" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">+8ms</text>

  <!-- Device 3: IDS -->
  <rect x="172" y="230" width="130" height="56" rx="6" fill="#1F3864" stroke="#2E75B6" stroke-width="2"/>
  <text x="237" y="253" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">IDS Inline Probe</text>
  <text x="237" y="268" text-anchor="middle" fill="#F2F2F2" font-size="9">Deep packet inspection</text>
  <rect x="325" y="248" width="60" height="20" rx="4" fill="#C55A11"/>
  <text x="355" y="262" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">+12ms</text>

  <!-- Device 4: Proxy/DLP -->
  <rect x="172" y="305" width="130" height="56" rx="6" fill="#1F3864" stroke="#2E75B6" stroke-width="2"/>
  <text x="237" y="328" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">Proxy / DLP</text>
  <text x="237" y="343" text-anchor="middle" fill="#F2F2F2" font-size="9">Content scanning</text>
  <rect x="325" y="323" width="60" height="20" rx="4" fill="#C55A11"/>
  <text x="355" y="337" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">+20ms</text>

  <!-- Device 5: Compliance -->
  <rect x="172" y="380" width="130" height="56" rx="6" fill="#1F3864" stroke="#2E75B6" stroke-width="2"/>
  <text x="237" y="403" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">Compliance Scanner</text>
  <text x="237" y="418" text-anchor="middle" fill="#F2F2F2" font-size="9">Audit logging</text>
  <rect x="325" y="398" width="60" height="20" rx="4" fill="#C55A11"/>
  <text x="355" y="412" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">+25ms</text>

  <!-- Vertical connecting arrows through stack -->
  <line x1="237" y1="136" x2="237" y2="155" stroke="#C55A11" stroke-width="2"/>
  <polygon points="232,152 242,152 237,157" fill="#C55A11"/>
  <line x1="237" y1="211" x2="237" y2="230" stroke="#C55A11" stroke-width="2"/>
  <polygon points="232,227 242,227 237,232" fill="#C55A11"/>
  <line x1="237" y1="286" x2="237" y2="305" stroke="#C55A11" stroke-width="2"/>
  <polygon points="232,302 242,302 237,307" fill="#C55A11"/>
  <line x1="237" y1="361" x2="237" y2="380" stroke="#C55A11" stroke-width="2"/>
  <polygon points="232,377 242,377 237,382" fill="#C55A11"/>

  <!-- Total clock -->
  <rect x="440" y="160" width="210" height="120" rx="10" fill="#1F3864" stroke="#C55A11" stroke-width="3"/>
  <text x="545" y="188" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">Total Latency Added</text>
  <text x="545" y="218" text-anchor="middle" fill="#C55A11" font-size="26" font-weight="bold">80ms</text>
  <line x1="460" y1="232" x2="630" y2="232" stroke="#2E75B6" stroke-width="1"/>
  <text x="545" y="252" text-anchor="middle" fill="#F2F2F2" font-size="11">Kerberos timeout limit: 5ms</text>
  <text x="545" y="268" text-anchor="middle" fill="#C00000" font-size="11" font-weight="bold">16x OVER limit</text>

  <!-- Kerberos ticket breaking -->
  <rect x="680" y="168" width="180" height="90" rx="8" fill="#F2F2F2" stroke="#C00000" stroke-width="2"/>
  <text x="770" y="192" text-anchor="middle" fill="#C00000" font-size="11" font-weight="bold">Kerberos Ticket</text>
  <!-- Cracked icon -->
  <ellipse cx="770" cy="222" rx="28" ry="28" fill="#C00000" opacity="0.15" stroke="#C00000" stroke-width="1"/>
  <line x1="750" y1="208" x2="790" y2="240" stroke="#C00000" stroke-width="3"/>
  <line x1="758" y1="240" x2="785" y2="210" stroke="#C00000" stroke-width="2"/>
  <text x="770" y="248" text-anchor="middle" fill="#C00000" font-size="9">EXPIRED</text>

  <!-- Session broken bottom -->
  <rect x="440" y="360" width="420" height="70" rx="8" fill="#F2F2F2" stroke="#C00000" stroke-width="2"/>
  <text x="870" y="385" text-anchor="end" fill="#C00000" font-size="13" font-weight="bold">&#x2715;  Session Broken</text>
  <text x="460" y="406" fill="#1F3864" font-size="10">Kerberos assumed LAN-speed round trips. Every inline security device added</text>
  <text x="460" y="421" fill="#1F3864" font-size="10">latency the protocol was never designed to survive. The security stack itself</text>

</svg>
