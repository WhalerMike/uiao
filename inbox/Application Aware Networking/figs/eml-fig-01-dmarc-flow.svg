<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#595959"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFFFFF"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E75B6"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C00000"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#375623"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#FFFFFF"/>
  <rect x="0" y="0" width="900" height="40" fill="#1F3864" rx="4"/>
  <text x="450" y="26" font-family="Arial,sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">DMARC / DKIM / SPF Email Authentication Flow</text>
  <rect x="20" y="55" width="200" height="160" fill="#F2F2F2" rx="4" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="120" y="75" font-family="Arial,sans-serif" font-size="11" fill="#1F3864" text-anchor="middle" font-weight="bold">Sending Mail Server</text>
  <text x="120" y="95" font-family="Arial,sans-serif" font-size="10" fill="#595959" text-anchor="middle">outbound.agency.gov</text>
  <rect x="30" y="105" width="180" height="30" fill="#9DC3E6" rx="4"/>
  <text x="120" y="125" font-family="Arial,sans-serif" font-size="10" fill="#1F3864" text-anchor="middle">SPF: IP listed in DNS TXT</text>
  <rect x="30" y="140" width="180" height="30" fill="#9DC3E6" rx="4"/>
  <text x="120" y="160" font-family="Arial,sans-serif" font-size="10" fill="#1F3864" text-anchor="middle">DKIM: Sign with private key</text>
  <rect x="30" y="175" width="180" height="30" fill="#9DC3E6" rx="4"/>
  <text x="120" y="195" font-family="Arial,sans-serif" font-size="10" fill="#1F3864" text-anchor="middle">FROM: user@agency.gov</text>
  <rect x="280" y="55" width="340" height="160" fill="#F2F2F2" rx="4" stroke="#1F7391" stroke-width="1.5"/>
  <text x="450" y="75" font-family="Arial,sans-serif" font-size="11" fill="#1F3864" text-anchor="middle" font-weight="bold">DNS — Public Zone (agency.gov)</text>
  <rect x="290" y="90" width="320" height="28" fill="#D6E4F0" rx="4"/>
  <text x="450" y="109" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="middle">SPF TXT: v=spf1 include:protection.outlook.com -all</text>
  <rect x="290" y="123" width="320" height="28" fill="#D6E4F0" rx="4"/>
  <text x="450" y="142" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="middle">DKIM: selector1._domainkey  →  RSA-2048 public key</text>
  <rect x="290" y="156" width="320" height="28" fill="#D6E4F0" rx="4"/>
  <text x="450" y="175" font-family="Arial,sans-serif" font-size="8.5" fill="#595959" text-anchor="middle">_dmarc TXT: v=DMARC1; p=reject; rua=mailto:dmarc-rua@agency.gov</text>
  <rect x="290" y="189" width="320" height="20" fill="#E2EFDA" rx="4"/>
  <text x="450" y="203" font-family="Arial,sans-serif" font-size="9" fill="#375623" text-anchor="middle">All three records published and validated</text>
  <rect x="680" y="55" width="200" height="160" fill="#F2F2F2" rx="4" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="780" y="75" font-family="Arial,sans-serif" font-size="11" fill="#1F3864" text-anchor="middle" font-weight="bold">Receiving Server (EOP)</text>
  <rect x="690" y="90" width="180" height="28" fill="#D6E4F0" rx="4"/>
  <text x="780" y="109" font-family="Arial,sans-serif" font-size="10" fill="#1F3864" text-anchor="middle">① SPF Check: IP authorized?</text>
  <text x="780" y="122" font-family="Arial,sans-serif" font-size="9" fill="#375623" text-anchor="middle">PASS — IP in SPF record</text>
  <rect x="690" y="123" width="180" height="28" fill="#D6E4F0" rx="4"/>
  <text x="780" y="142" font-family="Arial,sans-serif" font-size="10" fill="#1F3864" text-anchor="middle">② DKIM Verify: Signature valid?</text>
  <text x="780" y="155" font-family="Arial,sans-serif" font-size="9" fill="#375623" text-anchor="middle">PASS — Public key matches</text>
  <rect x="690" y="156" width="180" height="28" fill="#D6E4F0" rx="4"/>
  <text x="780" y="175" font-family="Arial,sans-serif" font-size="10" fill="#1F3864" text-anchor="middle">③ DMARC Align: FROM matches?</text>
  <text x="780" y="188" font-family="Arial,sans-serif" font-size="9" fill="#375623" text-anchor="middle">PASS — Domain aligned</text>
  <rect x="690" y="189" width="180" height="20" fill="#E2EFDA" rx="4"/>
  <text x="780" y="203" font-family="Arial,sans-serif" font-size="9" fill="#375623" text-anchor="middle">Policy: p=reject enforced</text>
  <line x1="220" y1="100" x2="278" y2="100" stroke="#1F7391" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="249" y="93" font-family="Arial,sans-serif" font-size="9" fill="#1F7391" text-anchor="middle">lookup SPF</text>
  <line x1="220" y1="135" x2="278" y2="135" stroke="#1F7391" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="249" y="128" font-family="Arial,sans-serif" font-size="9" fill="#1F7391" text-anchor="middle">lookup DKIM</text>
  <line x1="622" y1="110" x2="678" y2="110" stroke="#1F7391" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="650" y="103" font-family="Arial,sans-serif" font-size="9" fill="#1F7391" text-anchor="middle">SPF record</text>
  <line x1="622" y1="140" x2="678" y2="140" stroke="#1F7391" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="650" y="133" font-family="Arial,sans-serif" font-size="9" fill="#1F7391" text-anchor="middle">DKIM pubkey</text>
  <line x1="622" y1="170" x2="678" y2="170" stroke="#1F7391" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="650" y="163" font-family="Arial,sans-serif" font-size="9" fill="#1F7391" text-anchor="middle">DMARC policy</text>
  <line x1="220" y1="160" x2="678" y2="160" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="449" y="153" font-family="Arial,sans-serif" font-size="9" fill="#1F3864" text-anchor="middle" font-style="italic">SMTP message delivery</text>
  <text x="450" y="240" font-family="Arial,sans-serif" font-size="12" fill="#1F3864" text-anchor="middle" font-weight="bold">DMARC Evaluation Outcomes</text>
  <rect x="30" y="255" width="240" height="100" fill="#E2EFDA" rx="4" stroke="#375623" stroke-width="1.5"/>
  <text x="150" y="275" font-family="Arial,sans-serif" font-size="13" fill="#375623" text-anchor="middle" font-weight="bold">PASS</text>
  <text x="150" y="295" font-family="Arial,sans-serif" font-size="10" fill="#595959" text-anchor="middle">SPF or DKIM aligns with FROM</text>
  <text x="150" y="313" font-family="Arial,sans-serif" font-size="10" fill="#375623" text-anchor="middle">→ Message delivered to Inbox</text>
  <text x="150" y="331" font-family="Arial,sans-serif" font-size="10" fill="#595959" text-anchor="middle">→ Counted in RUA aggregate report</text>
  <text x="150" y="349" font-family="Arial,sans-serif" font-size="10" fill="#595959" text-anchor="middle">→ No further action required</text>
  <rect x="330" y="255" width="240" height="100" fill="#FFF2CC" rx="4" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="450" y="275" font-family="Arial,sans-serif" font-size="11" fill="#BF8F00" text-anchor="middle" font-weight="bold">QUARANTINE (p=quarantine)</text>
  <text x="450" y="293" font-family="Arial,sans-serif" font-size="10" fill="#595959" text-anchor="middle">Neither SPF nor DKIM aligns</text>
  <text x="450" y="311" font-family="Arial,sans-serif" font-size="10" fill="#BF8F00" text-anchor="middle">→ Message routed to Spam/Junk</text>
  <text x="450" y="329" font-family="Arial,sans-serif" font-size="10" fill="#595959" text-anchor="middle">→ Failure logged in RUA report</text>
  <text x="450" y="347" font-family="Arial,sans-serif" font-size="10" fill="#595959" text-anchor="middle">→ Used during escalation phases 2–4</text>
  <rect x="630" y="255" width="240" height="100" fill="#FCE4EC" rx="4" stroke="#C00000" stroke-width="1.5"/>
  <text x="750" y="275" font-family="Arial,sans-serif" font-size="12" fill="#C00000" text-anchor="middle" font-weight="bold">REJECT (p=reject)</text>
  <text x="750" y="293" font-family="Arial,sans-serif" font-size="10" fill="#595959" text-anchor="middle">Neither SPF nor DKIM aligns</text>
  <text x="750" y="311" font-family="Arial,sans-serif" font-size="10" fill="#C00000" text-anchor="middle">→ 550 SMTP rejection at DATA stage</text>
  <text x="750" y="329" font-family="Arial,sans-serif" font-size="10" fill="#595959" text-anchor="middle">→ Message never reaches recipient</text>
  <text x="750" y="347" font-family="Arial,sans-serif" font-size="10" fill="#C00000" text-anchor="middle">→ BOD 18-01 / FedRAMP required state</text>
  <rect x="30" y="375" width="840" height="65" fill="#EBF5FB" rx="4" stroke="#1F7391" stroke-width="1.5"/>
  <text x="450" y="395" font-family="Arial,sans-serif" font-size="11" fill="#1F7391" text-anchor="middle" font-weight="bold">Aggregate Report (RUA) — Daily XML Report from Each Receiving Server</text>
  <text x="450" y="413" font-family="Arial,sans-serif" font-size="10" fill="#595959" text-anchor="middle">Contains: Source IP  |  SPF result (pass/fail)  |  DKIM result (pass/fail)  |  DMARC alignment result  |  Message count per source</text>
  <text x="450" y="430" font-family="Arial,sans-serif" font-size="9.5" fill="#595959" text-anchor="middle">Sent to: dmarc-rua@agency.gov  and  dmarc@reports.agencydmarc.gov  (CISA federal aggregate service)  —  reviewed monthly by ISSO</text>
  <line x1="680" y1="420" x2="222" y2="420" stroke="#1F7391" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="449" y="413" font-family="Arial,sans-serif" font-size="9" fill="#1F7391" text-anchor="middle"></text>
  <rect x="30" y="455" width="840" height="40" fill="#F2F2F2" rx="4" stroke="#595959" stroke-width="1.5"/>
  <text x="450" y="470" font-family="Arial,sans-serif" font-size="10" fill="#595959" text-anchor="middle" font-weight="bold">Forensic Report (RUF) — Per-Message Failure Report — fo=1: report on any mechanism failure</text>
  <text x="450" y="488" font-family="Arial,sans-serif" font-size="9.5" fill="#595959" text-anchor="middle">Sent to: dmarc-ruf@agency.gov  |  Used for investigation of active spoofing campaigns  |  adkim=s  aspf=s  (strict alignment required)</text>
  <rect x="0" y="510" width="900" height="50" fill="#1F3864" rx="4"/>
  <text x="450" y="530" font-family="Arial,sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">Agency GCC Moderate — Book 07 Email and Collaboration Security — Fig eml-fig-01</text>
  <text x="450" y="548" font-family="Arial,sans-serif" font-size="9" fill="#9DC3E6" text-anchor="middle">Controls: SC-8, SC-8(1)  |  BOD 18-01  |  FedRAMP 20x KSI-001</text>
</svg>
