ies · Sentinel analytics</text><line x1="215" y1="180" x2="560" y2="180" stroke="#DDDDDD" stroke-width="1"/><rect x="205" y="188" width="365" height="62" rx="4" fill="#F2F2F2"/><text x="387" y="206" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#1F3864">Archive tier (2 years)</text><text x="387" y="222" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#666666">Low-cost cold storage · Searchable</text><line x1="215" y1="250" x2="560" y2="250" stroke="#DDDDDD" stroke-width="1"/><rect x="205" y="258" width="365" height="62" rx="4" fill="#F2F2F2"/><text x="387" y="276" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#1F3864">Immutable WORM (3 years)</text><text x="387" y="292" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#666666">AU-11 retention · Legal hold</text><line x1="570" y1="250" x2="610" y2="250" stroke="#999" stroke-width="2" marker-end="url(#arw)"/><rect x="615" y="75" width="400" height="350" rx="8" fill="#4472C4"/><text x="815" y="102" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Microsoft Sentinel</text><line x1="630" y1="110" x2="1005" y2="110" stroke="#EBF3FB" stroke-width="1"/><rect x="625" y="118" width="380" height="68" rx="4" fill="#EBF3FB"/><text x="815" y="140" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#1F3864">Analytics Rules</text><text x="815" y="158" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#666666">KQL detections · UEBA · ML</text><rect x="625" y="194" width="380" height="68" rx="4" fill="#EBF3FB"/><text x="815" y="216" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#1F3864">Incident Queue</text><text x="815" y="234" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#666666">Triage · Assignment · SLA</text><rect x="625" 