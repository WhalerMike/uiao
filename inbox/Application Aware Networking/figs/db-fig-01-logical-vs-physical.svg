<svg viewBox="0 0 1040 338" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="338" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs><text x="520" y="28" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">Logical vs. Physical Centralization</text><text x="520" y="46" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">Logical centralization (one truth) is almost always correct. Physical centralization (one server) is sometimes constrained by physics.</text><rect x="30" y="68" width="460" height="256" rx="8" fill="#EBF3FB" stroke="#2E75B6" stroke-width="2"/><text x="260" y="90" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#2E75B6">LOGICAL CENTRALIZATION</text><text x="260" y="106" text-anchor="middle" font-size="11" font-weight="normal" font-style="italic" fill="#1F3864">One authoritative source of truth</text><text x="60" y="134" text-anchor="start" font-size="11" font-weight="normal" font-style="normal" fill="#375623">[v]  Eliminates reconciliation jobs</text><text x="60" y="162" text-anchor="start" font-size="11" font-weight="normal" font-style="normal" fill="#375623">[v]  Single answer: which value is correct?</text><text x="60" y="190" text-anchor="start" font-size="11" font-weight="normal" font-style="normal" fill="#375623">[v]  Drift cured: no unofficial local copies</text><text x="60" y="218" text-anchor="start" font-size="11" font-weight="normal" font-style="normal" fill="#375623">[v]  Read replicas are derived, rebuildable</text><text x="60" y="246" text-anchor="start" font-size="11" font-weight="normal" font-style="normal" fill="#375623">[v]  Consistent audit trail across all consumers</text><rect x="60" y="280" width="400" height="34" rx="6" fill="#2E75B6"/><text x="260" y="299" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#FFFFFF">Every claim has exactly one canonical source</text><rect x="550" y="68" width="460" height="256" rx="8" fill="#EBF3FB" stroke="#C55A11" stroke-width="2"/><text x="780" y="90" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#C55A11">PHYSICAL CENTRALIZATION</text><text x="780" y="106" text-anchor="middle" font-size="11" font-weight="normal" font-style="italic" fill="#1F3864">One server — sometimes constrained by physics</text><text x="570" y="134" text-anchor="start" font-size="11" font-weight="normal" font-style="normal" fill="#375623">[v]  Sub-ms intra-region: nearly free</text><text x="570" y="162" text-anchor="start" font-size="11" font-weight="normal" font-style="normal" fill="#C55A11">[!]  Cross-region strong consistency: latency cost</text><text x="570" y="190" text-anchor="start" font-size="11" font-weight="normal" font-style="normal" fill="#C55A11">[!]  Speed-of-light floor is non-negotiable</text><text x="570" y="218" text-anchor="start" font-size="11" font-weight="normal" font-style="normal" fill="#1F3864">[-]  Read replicas + async replication: use them</text><text x="570" y="246" text-anchor="start" font-size="11" font-weight="normal" font-style="normal" fill="#375623">[v]  Single-region writer + async DR: recommended</text><rect x="580" y="280" width="400" height="34" rx="6" fill="#C55A11"/><text x="780" y="299" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#FFFFFF">Single-region writer + async replication for DR</text></svg>
