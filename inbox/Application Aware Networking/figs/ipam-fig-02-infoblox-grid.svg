<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1000" height="700" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="0" y="0" width="1000" height="48" fill="#1F3864"/>
  <text x="500" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">InfoBlox DDI Grid Architecture — Multi-Cloud Federal Deployment</text>
  <text x="500" y="43" text-anchor="middle" font-size="10" fill="#D5E8F0">Grid Master HA · Grid Members · BloxOne SaaS · DHCP Failover · DNS SSOT</text>

  <!-- BloxOne SaaS (top cloud) -->
  <rect x="320" y="58" width="360" height="64" rx="12" fill="#2E75B6" opacity="0.1" stroke="#2E75B6" stroke-width="2" stroke-dasharray="7,3"/>
  <text x="500" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E75B6">InfoBlox BloxOne DDI — SaaS Portal</text>
  <text x="500" y="94" text-anchor="middle" font-size="10" fill="#2E75B6">Unified management · Policy authoring · Certificate tracker · Audit reporting</text>
  <text x="500" y="108" text-anchor="middle" font-size="9" fill="#595959">HTTPS API (FedRAMP Moderate ATO) · SOC 2 Type II · All grid syncs here</text>

  <!-- Grid Master HA (center-top) -->
  <rect x="330" y="142" width="340" height="110" rx="8" fill="#D5E8F0" stroke="#1F3864" stroke-width="2.5"/>
  <text x="500" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3864">Grid Master — High Availability Pair</text>
  <text x="500" y="175" text-anchor="middle" font-size="9" fill="#595959">Primary Data Center — Physical or VMware vSphere VM</text>
  <!-- GM Active -->
  <rect x="346" y="184" width="140" height="56" rx="5" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5"/>
  <text x="416" y="201" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3864">GM-ACTIVE</text>
  <text x="416" y="215" text-anchor="middle" font-size="8.5" fill="#375623">● Online — DB Master</text>
  <text x="416" y="228" text-anchor="middle" font-size="8" fill="#595959">All zone / DHCP / IPAM writes</text>
  <text x="416" y="238" text-anchor="middle" font-size="7.5" fill="#595959">IP: 10.0.0.10 · VIP: 10.0.0.9</text>
  <!-- GM Standby -->
  <rect x="514" y="184" width="140" height="56" rx="5" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5"/>
  <text x="584" y="201" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3864">GM-STANDBY</text>
  <text x="584" y="215" text-anchor="middle" font-size="8.5" fill="#C55A11">◑ Hot-standby — read-only</text>
  <text x="584" y="228" text-anchor="middle" font-size="8" fill="#595959">Sync lag &lt; 1 second</text>
  <text x="584" y="238" text-anchor="middle" font-size="7.5" fill="#595959">IP: 10.0.0.11 · Failover: auto</text>
  <!-- Active-standby arrow -->
  <line x1="486" y1="212" x2="514" y2="212" stroke="#1F3864" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="510,208 514,212 510,216" fill="#1F3864"/>

  <!-- BloxOne to GM arrow -->
  <line x1="500" y1="122" x2="500" y2="142" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="496,138 500,142 504,138" fill="#2E75B6"/>

  <!-- Grid Master Candidate (secondary DC) -->
  <rect x="30" y="142" width="270" height="82" rx="8" fill="#EBF3FF" stroke="#1F3864" stroke-width="1.8"/>
  <text x="165" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F3864">Grid Master Candidate</text>
  <text x="165" y="174" text-anchor="middle" font-size="9" fill="#595959">Secondary Data Center</text>
  <rect x="46" y="182" width="210" height="34" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1"/>
  <text x="151" y="197" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F3864">GMC — Takes over if GM fails</text>
  <text x="151" y="210" text-anchor="middle" font-size="8" fill="#595959">Full DB replica · Promotes in &lt;30 sec · IP: 10.1.0.10</text>
  <!-- GMC to GM arrow -->
  <line x1="300" y1="183" x2="330" y2="183" stroke="#1F3864" stroke-width="2"/>
  <polygon points="326,179 330,183 326,187" fill="#1F3864"/>
  <text x="315" y="178" text-anchor="middle" font-size="8" fill="#1F3864">Grid</text>
  <text x="315" y="190" text-anchor="middle" font-size="8" fill="#1F3864">sync</text>

  <!-- ── GRID MEMBERS ── 4 columns below -->

  <!-- Grid Member: On-Prem -->
  <rect x="30" y="295" width="210" height="220" rx="8" fill="#EBF3FF" stroke="#1F3864" stroke-width="2"/>
  <rect x="30" y="295" width="210" height="26" rx="8" fill="#1F3864"/>
  <text x="135" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Member: On-Premises DC</text>
  <rect x="42" y="328" width="186" height="36" rx="4" fill="#D5E8F0" stroke="#2E75B6" stroke-width="1"/>
  <text x="135" y="344" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F3864">DNS Service (authoritative)</text>
  <text x="135" y="356" text-anchor="middle" font-size="8" fill="#595959">agency.gov · reverse zones · DNSSEC</text>
  <rect x="42" y="372" width="186" height="36" rx="4" fill="#D5E8F0" stroke="#2E75B6" stroke-width="1"/>
  <text x="135" y="388" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F3864">DHCP Service (active)</text>
  <text x="135" y="400" text-anchor="middle" font-size="8" fill="#595959">10.0.0.0/16 client scope · fingerprinting</text>
  <rect x="42" y="416" width="186" height="36" rx="4" fill="#EBF3FF" stroke="#1F3864" stroke-width="1"/>
  <text x="135" y="432" text-anchor="middle" font-size="9" fill="#1F3864">Forwarders configured:</text>
  <text x="135" y="444" text-anchor="middle" font-size="7.5" fill="#595959">privatelink.* → Azure 172.16.0.10</text>
  <rect x="42" y="460" width="186" height="42" rx="4" fill="#E2EFDA" stroke="#375623" stroke-width="1"/>
  <text x="135" y="476" text-anchor="middle" font-size="8" fill="#375623">CM-8 Inventory feeds:</text>
  <text x="135" y="488" text-anchor="middle" font-size="7.5" fill="#375623">DHCP fingerprint → device type/OS</text>
  <text x="135" y="499" text-anchor="middle" font-size="7.5" fill="#375623">auto-exported to ServiceNow CMDB</text>

  <!-- Grid Member: Azure -->
  <rect x="265" y="295" width="210" height="220" rx="8" fill="#EBF3FF" stroke="#2E75B6" stroke-width="2"/>
  <rect x="265" y="295" width="210" height="26" rx="8" fill="#2E75B6"/>
  <text x="370" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Member: Azure Gov Hub VNet</text>
  <rect x="277" y="328" width="186" height="36" rx="4" fill="#D5E8F0" stroke="#2E75B6" stroke-width="1"/>
  <text x="370" y="344" text-anchor="middle" font-size="9" font-weight="bold" fill="#2E75B6">DNS Resolver (recursive)</text>
  <text x="370" y="356" text-anchor="middle" font-size="8" fill="#595959">172.16.0.10 · Private Link zones</text>
  <rect x="277" y="372" width="186" height="36" rx="4" fill="#EBF3FF" stroke="#2E75B6" stroke-width="1"/>
  <text x="370" y="388" text-anchor="middle" font-size="9" fill="#2E75B6">Azure DNS Private Resolver</text>
  <text x="370" y="400" text-anchor="middle" font-size="8" fill="#595959">Inbound EP: 172.16.0.4 (receives on-prem fwds)</text>
  <rect x="277" y="416" width="186" height="36" rx="4" fill="#EBF3FF" stroke="#2E75B6" stroke-width="1"/>
  <text x="370" y="432" text-anchor="middle" font-size="9" fill="#2E75B6">Azure IPAM API Connector</text>
  <text x="370" y="444" text-anchor="middle" font-size="8" fill="#595959">VM create event → IPAM record auto-update</text>
  <rect x="277" y="460" width="186" height="42" rx="4" fill="#FCE4D6" stroke="#C55A11" stroke-width="1"/>
  <text x="370" y="476" text-anchor="middle" font-size="8" fill="#C55A11">Key Vault + ADCS SCEP bridge</text>
  <text x="370" y="488" text-anchor="middle" font-size="7.5" fill="#595959">cert enrolled → IP bound → tracker updated</text>
  <text x="370" y="499" text-anchor="middle" font-size="7.5" fill="#595959">expiry alerting: 90/30/7 days</text>

  <!-- Grid Member: AWS -->
  <rect x="500" y="295" width="210" height="220" rx="8" fill="#FFF8F0" stroke="#C55A11" stroke-width="2"/>
  <rect x="500" y="295" width="210" height="26" rx="8" fill="#C55A11"/>
  <text x="605" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Member: AWS GovCloud Transit VPC</text>
  <rect x="512" y="328" width="186" height="36" rx="4" fill="#FCE4D6" stroke="#C55A11" stroke-width="1"/>
  <text x="605" y="344" text-anchor="middle" font-size="9" font-weight="bold" fill="#C55A11">DNS Resolver (recursive)</text>
  <text x="605" y="356" text-anchor="middle" font-size="8" fill="#595959">172.20.0.10 · EC2 name resolution</text>
  <rect x="512" y="372" width="186" height="36" rx="4" fill="#FFF8F0" stroke="#C55A11" stroke-width="1"/>
  <text x="605" y="388" text-anchor="middle" font-size="9" fill="#C55A11">Route 53 Resolver Rule</text>
  <text x="605" y="400" text-anchor="middle" font-size="8" fill="#595959">agency.gov → InfoBlox Member 172.20.0.10</text>
  <rect x="512" y="416" width="186" height="36" rx="4" fill="#FFF8F0" stroke="#C55A11" stroke-width="1"/>
  <text x="605" y="432" text-anchor="middle" font-size="9" fill="#C55A11">AWS IPAM Connector</text>
  <text x="605" y="444" text-anchor="middle" font-size="8" fill="#595959">EC2 launch → IPAM pool alloc → DNS A record</text>
  <rect x="512" y="460" width="186" height="42" rx="4" fill="#E2EFDA" stroke="#375623" stroke-width="1"/>
  <text x="605" y="476" text-anchor="middle" font-size="8" fill="#375623">CloudTrail + InfoBlox log merge</text>
  <text x="605" y="488" text-anchor="middle" font-size="7.5" fill="#375623">DNS query log + CloudTrail API events</text>
  <text x="605" y="499" text-anchor="middle" font-size="7.5" fill="#375623">→ Splunk / AWS Security Hub (AU-12)</text>

  <!-- Grid Member: OCI -->
  <rect x="735" y="295" width="230" height="220" rx="8" fill="#F5F0FA" stroke="#7030A0" stroke-width="2"/>
  <rect x="735" y="295" width="230" height="26" rx="8" fill="#7030A0"/>
  <text x="850" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Member/Forwarder: OCI Landing Zone</text>
  <rect x="747" y="328" width="206" height="36" rx="4" fill="#F5F0FA" stroke="#7030A0" stroke-width="1"/>
  <text x="850" y="344" text-anchor="middle" font-size="9" font-weight="bold" fill="#7030A0">DNS Forwarder (optional Grid member)</text>
  <text x="850" y="356" text-anchor="middle" font-size="8" fill="#595959">172.24.0.10 · OPM HRIT FQDNs → Grid Master</text>
  <rect x="747" y="372" width="206" height="36" rx="4" fill="#F5F0FA" stroke="#7030A0" stroke-width="1"/>
  <text x="850" y="388" text-anchor="middle" font-size="9" fill="#7030A0">OCI DNS Custom Resolver</text>
  <text x="850" y="400" text-anchor="middle" font-size="8" fill="#595959">DHCP option: resolver → 172.24.0.10</text>
  <rect x="747" y="416" width="206" height="36" rx="4" fill="#F5F0FA" stroke="#7030A0" stroke-width="1"/>
  <text x="850" y="432" text-anchor="middle" font-size="9" fill="#7030A0">External Host Records (OPM IPs)</text>
  <text x="850" y="444" text-anchor="middle" font-size="8" fill="#595959">OPM HRIT IPs tracked as external scope</text>
  <rect x="747" y="460" width="206" height="42" rx="4" fill="#C00000" opacity="0.85"/>
  <text x="850" y="476" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">OPM cert expiry monitoring</text>
  <text x="850" y="488" text-anchor="middle" font-size="7.5" fill="#FFFFFF">Thumbprint imported · renewal tracked</text>
  <text x="850" y="499" text-anchor="middle" font-size="7.5" fill="#FCE4D6">Agency alerted before OPM cert rotates</text>

  <!-- ── ARROWS from GM to Grid Members ── -->
  <!-- GM → On-Prem Member -->
  <line x1="370" y1="252" x2="135" y2="295" stroke="#1F3864" stroke-width="2"/>
  <polygon points="138,291 135,295 132,291" fill="#1F3864"/>
  <!-- GM → Azure Member -->
  <line x1="420" y1="252" x2="370" y2="295" stroke="#2E75B6" stroke-width="2"/>
  <polygon points="373,291 370,295 367,291" fill="#2E75B6"/>
  <!-- GM → AWS Member -->
  <line x1="560" y1="252" x2="605" y2="295" stroke="#C55A11" stroke-width="2"/>
  <polygon points="602,291 605,295 608,291" fill="#C55A11"/>
  <!-- GM → OCI Member -->
  <line x1="620" y1="252" x2="850" y2="295" stroke="#7030A0" stroke-width="2"/>
  <polygon points="847,291 850,295 853,291" fill="#7030A0"/>

  <!-- Sync labels -->
  <text x="240" y="272" text-anchor="middle" font-size="8" fill="#1F3864">Grid sync</text>
  <text x="390" y="272" text-anchor="middle" font-size="8" fill="#2E75B6">Grid sync</text>
  <text x="590" y="272" text-anchor="middle" font-size="8" fill="#C55A11">Grid sync</text>
  <text x="740" y="272" text-anchor="middle" font-size="8" fill="#7030A0">Grid sync</text>

  <!-- ── DHCP failover callout ── -->
  <rect x="30" y="532" width="210" height="52" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5"/>
  <text x="135" y="549" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F3864">DHCP Failover</text>
  <text x="135" y="563" text-anchor="middle" font-size="8" fill="#595959">On-prem member ↔ GMC secondary member</text>
  <text x="135" y="576" text-anchor="middle" font-size="8" fill="#595959">Active/standby · lease sync · sub-second detect</text>
  <line x1="135" y1="515" x2="135" y2="532" stroke="#1F3864" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- ── DNSSEC callout ── -->
  <rect x="265" y="532" width="210" height="52" rx="6" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="370" y="549" text-anchor="middle" font-size="9" font-weight="bold" fill="#2E75B6">DNSSEC Key Hierarchy</text>
  <text x="370" y="563" text-anchor="middle" font-size="8" fill="#595959">KSK: agency ISSO · HSM-protected</text>
  <text x="370" y="576" text-anchor="middle" font-size="8" fill="#595959">ZSK: Grid auto-rotates (30-day) · DS → .gov registrar</text>
  <line x1="370" y1="515" x2="370" y2="532" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- ── RPZ callout ── -->
  <rect x="500" y="532" width="210" height="52" rx="6" fill="#FFFFFF" stroke="#C00000" stroke-width="1.5"/>
  <text x="605" y="549" text-anchor="middle" font-size="9" font-weight="bold" fill="#C00000">Response Policy Zones (RPZ)</text>
  <text x="605" y="563" text-anchor="middle" font-size="8" fill="#595959">CISA Protective DNS feed · commercial TI</text>
  <text x="605" y="576" text-anchor="middle" font-size="8" fill="#595959">All Grid members enforce same RPZ policy</text>
  <line x1="605" y1="515" x2="605" y2="532" stroke="#C00000" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- ── SIEM callout ── -->
  <rect x="735" y="532" width="230" height="52" rx="6" fill="#FFFFFF" stroke="#375623" stroke-width="1.5"/>
  <text x="850" y="549" text-anchor="middle" font-size="9" font-weight="bold" fill="#375623">Audit Log Export (AU-2 / AU-12)</text>
  <text x="850" y="563" text-anchor="middle" font-size="8" fill="#595959">DNS query + DHCP lease → syslog → SIEM</text>
  <text x="850" y="576" text-anchor="middle" font-size="8" fill="#595959">Splunk / Azure Sentinel / AWS Security Hub</text>
  <line x1="850" y1="515" x2="850" y2="532" stroke="#375623" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- ── Legend ── -->
  <rect x="30" y="604" width="940" height="72" rx="6" fill="#F2F2F2" stroke="#CCCCCC" stroke-width="1"/>
  <text x="500" y="622" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3864">Architecture Notes</text>
  <text x="50" y="640" font-size="9" fill="#1F3864">• All Grid Members retrieve DNS zone data and DHCP scope config from the Grid Master — no local config drift possible</text>
  <text x="50" y="655" font-size="9" fill="#1F3864">• BloxOne SaaS portal provides a single pane for all DDI objects across on-prem, Azure, AWS, and OCI environments</text>
  <text x="50" y="670" font-size="9" fill="#1F3864">• Grid replication uses proprietary IBDB protocol over TCP 1194; all inter-member traffic is TLS-encrypted</text>

  <!-- Bottom strip -->
  <rect x="0" y="684" width="1000" height="16" fill="#1F3864"/>
  <text x="500" y="696" text-anchor="middle" font-size="8" fill="#FFFFFF">UNCLASSIFIED // FOUO — InfoBlox Grid Topology — FedRAMP Moderate</text>
</svg>
