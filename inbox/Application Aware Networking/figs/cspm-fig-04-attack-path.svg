<svg viewBox="0 0 1060 520" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;">
<rect width="1060" height="520" fill="#FFFFFF"/>

<!-- Title -->
<rect x="0" y="0" width="1060" height="40" fill="#1F3864"/>
<text x="530" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Cloud Security Explorer — Attack Path Analysis</text>
<text x="530" y="32" text-anchor="middle" font-size="9" fill="#BDD7EE">Query: Internet-exposed storage → sensitive data → anonymous access · Defender CSPM required · FedRAMP Moderate RA-5, PL-8</text>

<!-- Query builder panel (top left) -->
<rect x="10" y="50" width="310" height="160" rx="6" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.5"/>
<rect x="10" y="50" width="310" height="26" rx="6" fill="#1F3864"/>
<text x="165" y="67" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Cloud Security Explorer Query Builder</text>

<text x="20" y="92" font-size="8" font-weight="bold" fill="#1F3864">Find:</text>
<rect x="55" y="80" width="255" height="18" rx="3" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1"/>
<text x="67" y="93" font-size="8" fill="#2E75B6">Storage Accounts</text>

<text x="20" y="114" font-size="8" font-weight="bold" fill="#1F3864">Where:</text>
<rect x="60" y="102" width="250" height="18" rx="3" fill="#FFFFFF" stroke="#C00000" stroke-width="1"/>
<text x="72" y="115" font-size="8" fill="#C00000">Public network access = Enabled</text>

<text x="20" y="136" font-size="8" font-weight="bold" fill="#1F3864">And:</text>
<rect x="45" y="124" width="265" height="18" rx="3" fill="#FFFFFF" stroke="#C00000" stroke-width="1"/>
<text x="57" y="137" font-size="8" fill="#C00000">Data sensitivity = High or Critical (Purview)</text>

<text x="20" y="158" font-size="8" font-weight="bold" fill="#1F3864">And:</text>
<rect x="45" y="146" width="265" height="18" rx="3" fill="#FFFFFF" stroke="#C00000" stroke-width="1"/>
<text x="57" y="159" font-size="8" fill="#C00000">Authentication = Anonymous access allowed</text>

<rect x="85" y="172" width="150" height="28" rx="5" fill="#C00000"/>
<text x="160" y="190" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">Run Query →</text>

<!-- Results summary -->
<rect x="10" y="220" width="310" height="80" rx="6" fill="#FFFFFF" stroke="#C00000" stroke-width="2"/>
<rect x="10" y="220" width="310" height="26" rx="6" fill="#C00000"/>
<text x="165" y="237" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Query Results: 3 Attack Paths Found</text>
<text x="20" y="258" font-size="8" fill="#595959">Severity: CRITICAL · First detected: 2026-06-28 · Days open: 8</text>
<text x="20" y="272" font-size="8" fill="#C00000">● ssafiles01 — PII records exposed (847 blobs) — IMMEDIATE ACTION</text>
<text x="20" y="286" font-size="8" fill="#C55A11">● ssabackup03 — Financial data partially exposed (122 blobs)</text>
<text x="20" y="299" font-size="8" fill="#C55A11">● ssadata07 — Health records anonymous read (33 blobs)</text>

<!-- MAIN ATTACK PATH GRAPH -->
<!-- Internet node -->
<circle cx="440" cy="130" r="45" fill="#F2F2F2" stroke="#C00000" stroke-width="3"/>
<text x="440" y="123" text-anchor="middle" font-size="9" font-weight="bold" fill="#C00000">INTERNET</text>
<text x="440" y="138" text-anchor="middle" font-size="8" fill="#595959">0.0.0.0/0</text>
<text x="440" y="151" text-anchor="middle" font-size="7.5" fill="#595959">Public</text>

<!-- Arrow internet -> storage -->
<line x1="485" y1="130" x2="555" y2="130" stroke="#C00000" stroke-width="3" marker-end="url(#rarr)"/>
<text x="520" y="122" text-anchor="middle" font-size="7.5" fill="#C00000">TCP 443</text>
<text x="520" y="145" text-anchor="middle" font-size="7.5" fill="#C00000">No auth</text>

<!-- Storage Account node (main attack target) -->
<rect x="565" y="80" width="190" height="100" rx="8" fill="#FFF0F0" stroke="#C00000" stroke-width="3"/>
<text x="660" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#C00000">ssafiles01</text>
<text x="660" y="118" text-anchor="middle" font-size="8" fill="#595959">Azure Storage Account</text>
<!-- Badges -->
<rect x="573" y="126" width="90" height="16" rx="3" fill="#C00000"/>
<text x="618" y="138" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#FFFFFF">INTERNET-EXPOSED</text>
<rect x="670" y="126" width="77" height="16" rx="3" fill="#8B0000"/>
<text x="708" y="138" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#FFFFFF">ANON-ACCESS</text>
<rect x="573" y="148" width="170" height="16" rx="3" fill="#C55A11"/>
<text x="658" y="160" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#FFFFFF">DATA SENSITIVITY: HIGH (Purview)</text>

<!-- Arrow storage -> sensitive data -->
<line x1="755" y1="130" x2="820" y2="130" stroke="#C55A11" stroke-width="2.5" marker-end="url(#oarr)"/>
<text x="787" y="122" text-anchor="middle" font-size="7.5" fill="#C55A11">contains</text>

<!-- Sensitive data node -->
<rect x="828" y="90" width="190" height="80" rx="8" fill="#FFF3E0" stroke="#C55A11" stroke-width="2.5"/>
<text x="923" y="112" text-anchor="middle" font-size="9" font-weight="bold" fill="#C55A11">Sensitive Data</text>
<text x="923" y="128" text-anchor="middle" font-size="8" fill="#595959">847 blobs · PII Records</text>
<text x="923" y="143" text-anchor="middle" font-size="8" fill="#595959">Purview: Privacy Act data</text>
<text x="923" y="158" text-anchor="middle" font-size="7.5" fill="#C00000">Unencrypted at rest: YES</text>

<!-- Attack path result box -->
<rect x="430" y="230" width="430" height="70" rx="8" fill="#FFF0F0" stroke="#C00000" stroke-width="3"/>
<rect x="430" y="230" width="430" height="26" rx="8" fill="#C00000"/>
<text x="645" y="247" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">CRITICAL ATTACK PATH IDENTIFIED</text>
<text x="645" y="268" text-anchor="middle" font-size="9" fill="#C00000">Unauthenticated Read Access to 847 PII Records from the public internet</text>
<text x="645" y="284" text-anchor="middle" font-size="8" fill="#595959">Controls at risk: RA-5 (vulnerability not mitigated) · AC-3 (no access enforcement) · SC-28 (sensitive data exposed)</text>
<text x="645" y="298" text-anchor="middle" font-size="8" fill="#595959">FedRAMP finding severity: HIGH · POA&amp;M required within 30 days · Immediate mitigation recommended</text>

<!-- Remediation panel -->
<rect x="330" y="320" width="700" height="190" rx="6" fill="#F2F2F2" stroke="#375623" stroke-width="2"/>
<rect x="330" y="320" width="700" height="26" rx="6" fill="#375623"/>
<text x="680" y="337" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Remediation Actions — Eliminate Attack Path</text>

<!-- Action 1 -->
<rect x="340" y="356" width="320" height="144" rx="6" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.5"/>
<rect x="340" y="356" width="320" height="24" rx="6" fill="#2E75B6"/>
<text x="500" y="372" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">Action 1: Enable Storage Firewall (CM-6, SC-7)</text>
<text x="350" y="394" font-size="8" fill="#595959">az storage account update \</text>
<text x="350" y="408" font-size="8" fill="#595959">  --name ssafiles01 \</text>
<text x="350" y="422" font-size="8" fill="#595959">  --resource-group ssa-storage-rg \</text>
<text x="350" y="436" font-size="8" fill="#595959">  --default-action Deny \</text>
<text x="350" y="450" font-size="8" fill="#595959">  --bypass AzureServices</text>
<text x="350" y="468" font-size="7.5" fill="#375623">Effect: Removes INTERNET-EXPOSED badge</text>
<text x="350" y="482" font-size="7.5" fill="#375623">Azure Policy Deny effect prevents recurrence</text>
<text x="350" y="496" font-size="7.5" font-weight="bold" fill="#2E75B6">Controls closed: CM-6, SC-7, SC-8</text>

<!-- Action 2 -->
<rect x="680" y="356" width="340" height="144" rx="6" fill="#FFFFFF" stroke="#1F7391" stroke-width="1.5"/>
<rect x="680" y="356" width="340" height="24" rx="6" fill="#1F7391"/>
<text x="850" y="372" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">Action 2: Require Entra ID Auth (IA-2, AC-3)</text>
<text x="690" y="394" font-size="8" fill="#595959">az storage account update \</text>
<text x="690" y="408" font-size="8" fill="#595959">  --name ssafiles01 \</text>
<text x="690" y="422" font-size="8" fill="#595959">  --allow-shared-key-access false \</text>
<text x="690" y="436" font-size="8" fill="#595959">  --min-tls-version TLS1_2</text>
<text x="690" y="452" font-size="8" fill="#595959"># Assign RBAC: Storage Blob Data Reader to</text>
<text x="690" y="464" font-size="8" fill="#595959"># specific Entra ID group only</text>
<text x="690" y="480" font-size="7.5" fill="#375623">Effect: Removes ANON-ACCESS badge</text>
<text x="690" y="494" font-size="7.5" font-weight="bold" fill="#1F7391">Controls closed: IA-2, AC-3, SC-28</text>

<defs>
  <marker id="rarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#C00000"/>
  </marker>
  <marker id="oarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#C55A11"/>
  </marker>
</defs>
</svg>