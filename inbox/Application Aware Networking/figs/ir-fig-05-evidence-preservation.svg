<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1F3864"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#375623"/>
    </marker>
    <marker id="arrt" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1F7391"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#F2F2F2" rx="8"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="48" fill="#1F3864" rx="8"/>
  <rect x="0" y="30" width="900" height="18" fill="#1F3864"/>
  <text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#FFFFFF">Fig 5 — Evidence Preservation Workflow (Microsoft Purview / eDiscovery)</text>

  <!-- STEP 1: Incident Declared -->
  <rect x="340" y="58" width="220" height="46" rx="8" fill="#C55A11" stroke="#C55A11"/>
  <text x="450" y="77" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#FFFFFF">INCIDENT DECLARED (P1/P2)</text>
  <text x="450" y="95" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#FFFFFF">IC declares | ServiceNow ticket created</text>

  <line x1="450" y1="104" x2="450" y2="124" stroke="#1F3864" stroke-width="2" marker-end="url(#arr)"/>
  <text x="460" y="119" font-family="Arial" font-size="9" fill="#1F3864" font-style="italic">Immediate</text>

  <!-- STEP 2: Legal Hold Initiated -->
  <rect x="300" y="124" width="300" height="52" rx="8" fill="#1F7391" stroke="#1F7391"/>
  <text x="450" y="144" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#FFFFFF">Legal Hold Initiated in Purview</text>
  <text x="450" y="160" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#FFFFFF">Legal Counsel or ISSO authorizes | eDiscovery case created</text>
  <text x="450" y="174" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#FFFFFF">Case name: IR-[YYYYMMDD]-[Ticket]-[Type]</text>

  <line x1="450" y1="176" x2="450" y2="196" stroke="#1F3864" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STEP 3: Data Sources on Hold -->
  <rect x="30" y="196" width="820" height="26" rx="6" fill="#1F3864"/>
  <text x="450" y="213" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="bold" fill="#FFFFFF">Hold Applied to All Custodian Data Sources (Preservation-in-Place — Data Not Moved)</text>

  <!-- Four data source boxes -->
  <!-- Exchange -->
  <rect x="40" y="228" width="188" height="100" rx="6" fill="#DEEAF1" stroke="#2E75B6" stroke-width="2"/>
  <rect x="40" y="228" width="188" height="30" rx="6" fill="#2E75B6"/>
  <rect x="40" y="246" width="188" height="12" fill="#2E75B6"/>
  <text x="134" y="248" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF">Exchange Online</text>
  <text x="134" y="272" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Mailbox items</text>
  <text x="134" y="287" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Calendar / tasks</text>
  <text x="134" y="302" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Deleted items</text>
  <text x="134" y="317" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Recoverable items folder</text>

  <!-- OneDrive -->
  <rect x="240" y="228" width="188" height="100" rx="6" fill="#DEEAF1" stroke="#2E75B6" stroke-width="2"/>
  <rect x="240" y="228" width="188" height="30" rx="6" fill="#2E75B6"/>
  <rect x="240" y="246" width="188" height="12" fill="#2E75B6"/>
  <text x="334" y="248" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF">OneDrive for Business</text>
  <text x="334" y="272" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">All files and versions</text>
  <text x="334" y="287" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Version history preserved</text>
  <text x="334" y="302" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Deleted files (recycle bin)</text>
  <text x="334" y="317" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Shared with me content</text>

  <!-- Teams -->
  <rect x="440" y="228" width="188" height="100" rx="6" fill="#DEEAF1" stroke="#2E75B6" stroke-width="2"/>
  <rect x="440" y="228" width="188" height="30" rx="6" fill="#2E75B6"/>
  <rect x="440" y="246" width="188" height="12" fill="#2E75B6"/>
  <text x="534" y="248" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF">Microsoft Teams</text>
  <text x="534" y="272" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">1:1 and group chats</text>
  <text x="534" y="287" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Channel messages</text>
  <text x="534" y="302" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Attachments in chat</text>
  <text x="534" y="317" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Deleted messages</text>

  <!-- SharePoint -->
  <rect x="640" y="228" width="220" height="100" rx="6" fill="#DEEAF1" stroke="#2E75B6" stroke-width="2"/>
  <rect x="640" y="228" width="220" height="30" rx="6" fill="#2E75B6"/>
  <rect x="640" y="246" width="220" height="12" fill="#2E75B6"/>
  <text x="750" y="248" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF">SharePoint Sites</text>
  <text x="750" y="272" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">All sites custodian is member of</text>
  <text x="750" y="287" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Document libraries</text>
  <text x="750" y="302" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">List items</text>
  <text x="750" y="317" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Version history</text>

  <!-- Arrow to export -->
  <line x1="450" y1="330" x2="450" y2="356" stroke="#1F3864" stroke-width="2" marker-end="url(#arr)"/>
  <text x="460" y="350" font-family="Arial" font-size="9" fill="#1F3864" font-style="italic">SOC search + export</text>

  <!-- STEP 4: eDiscovery Export -->
  <rect x="200" y="356" width="500" height="60" rx="8" fill="#E2EFDA" stroke="#375623" stroke-width="2"/>
  <text x="450" y="377" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#375623">eDiscovery Export — Forensic Analysis Package</text>
  <text x="450" y="394" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#1F3864">Export scoped to incident date range + keywords | PST (email) or container (files)</text>
  <text x="450" y="410" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#1F3864">SHA-256 hash computed immediately on download → chain of custody anchor</text>

  <line x1="450" y1="416" x2="450" y2="436" stroke="#1F3864" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STEP 5: Chain of Custody -->
  <rect x="60" y="436" width="376" height="120" rx="8" fill="#1F3864" stroke="#1F3864"/>
  <text x="248" y="456" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="bold" fill="#FFFFFF">Chain of Custody Documentation</text>
  <text x="80" y="477" font-family="Arial" font-size="9" fill="#F2F2F2">Case Number:    IR-[date]-[ticket]</text>
  <text x="80" y="493" font-family="Arial" font-size="9" fill="#F2F2F2">Custodians:     [affected account names]</text>
  <text x="80" y="509" font-family="Arial" font-size="9" fill="#F2F2F2">Hold Applied:   [datetime UTC] by [name/title]</text>
  <text x="80" y="525" font-family="Arial" font-size="9" fill="#F2F2F2">Export Date:    [datetime UTC] by [name/title]</text>
  <text x="80" y="541" font-family="Arial" font-size="9" fill="#F2F2F2">SHA-256 Hash:   [hash of export package]</text>
  <text x="80" y="557" font-family="Arial" font-size="9" fill="#F2F2F2">Witness:        [name/title]</text>

  <!-- STEP 6: Retention -->
  <rect x="464" y="436" width="376" height="120" rx="8" fill="#E2EFDA" stroke="#375623" stroke-width="2"/>
  <text x="652" y="456" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="bold" fill="#375623">Retention Requirements (AU-11)</text>
  <text x="480" y="477" font-family="Arial" font-size="9" fill="#1F3864">Minimum:        3 years (federal incidents)</text>
  <text x="480" y="493" font-family="Arial" font-size="9" fill="#1F3864">PII incidents:  6 years (Privacy Act appeals)</text>
  <text x="480" y="509" font-family="Arial" font-size="9" fill="#1F3864">Law enforcement: Indefinite until Legal release</text>
  <text x="480" y="525" font-family="Arial" font-size="9" fill="#1F3864">Storage:        Forensic Evidence SharePoint site</text>
  <text x="480" y="541" font-family="Arial" font-size="9" fill="#1F3864">Label:          Highly Confidential — Legal Hold</text>
  <text x="480" y="557" font-family="Arial" font-size="9" fill="#1F3864">Access:         CSIRT + Legal Counsel only</text>

  <!-- Footer -->
  <rect x="30" y="570" width="840" height="50" rx="6" fill="#FFFFFF" stroke="#595959" stroke-width="0.5"/>
  <text x="450" y="590" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#1F3864">Key Principle: PRESERVE BEFORE REMEDIATE — No containment action may modify held data</text>
  <text x="450" y="608" text-anchor="middle" font-family="Arial" font-size="9" fill="#595959">Controls: AU-11 (Retention) | IR-4 (Evidence Handling) | Purview eDiscovery Premium | GCC Moderate Boundary</text>
</svg>