<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620">
<rect width="1000" height="620" fill="#F2F2F2"/>
<defs><marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1F3864"/></marker></defs>
<rect x="0" y="0" width="1000" height="50" fill="#1F3864"/>
<text x="500" y="32" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Arial">Split-Horizon DNS — Internal vs External Resolution</text>
<rect x="350" y="200" width="300" height="160" fill="#1F3864" rx="10"/>
<text x="500" y="230" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Arial">InfoBlox Grid</text>
<text x="500" y="250" font-size="11" fill="#FFFFFF" font-weight="normal" text-anchor="middle" font-family="Arial">DNS View Controller</text>
<rect x="360" y="268" width="125" height="44" fill="#1F7391" rx="5"/>
<text x="422" y="285" font-size="10" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Arial">Internal View</text>
<text x="422" y="302" font-size="9" fill="#FFFFFF" font-weight="normal" text-anchor="middle" font-family="Arial">ACL: 10.0.0.0/8</text>
<rect x="510" y="268" width="125" height="44" fill="#C55A11" rx="5"/>
<text x="572" y="285" font-size="10" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Arial">External View</text>
<text x="572" y="302" font-size="9" fill="#FFFFFF" font-weight="normal" text-anchor="middle" font-family="Arial">ACL: 0.0.0.0/0</text>
<rect x="30" y="195" width="200" height="80" fill="#1F7391" rx="8"/>
<text x="130" y="220" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Arial">Internal Client</text>
<text x="130" y="238" font-size="11" fill="#FFFFFF" font-weight="normal" text-anchor="middle" font-family="Arial">10.12.5.44</text>
<text x="130" y="256" font-size="9" fill="#FFFFFF" font-weight="normal" text-anchor="middle" font-family="Arial">SSA managed workstation</text>
<line x1="230" y1="235" x2="349" y2="295" stroke="#1F7391" stroke-width="2" marker-end="url(#arr)"/>
<rect x="20" y="380" width="280" height="200" fill="#1F7391" rx="8" opacity="0.15"/>
<rect x="20" y="380" width="280" height="200" fill="#1F7391" rx="8" stroke="#1F7391" stroke-width="1.5"/>
<text x="160" y="400" font-size="11" fill="#1F7391" font-weight="bold" text-anchor="middle" font-family="Arial">Internal Zones (RFC 1918)</text>
<text x="30" y="420" font-size="9" fill="#1F3864" font-weight="bold" text-anchor="start" font-family="Arial">myssa.ssa.gov</text>
<text x="30" y="434" font-size="9" fill="#595959" font-weight="normal" text-anchor="start" font-family="Arial">→  10.20.1.45  (Private Endpoint)</text>
<text x="30" y="450" font-size="9" fill="#1F3864" font-weight="bold" text-anchor="start" font-family="Arial">ssadb.database.windows.us</text>
<text x="30" y="464" font-size="9" fill="#595959" font-weight="normal" text-anchor="start" font-family="Arial">→  10.20.2.10  (Private Link SQL)</text>
<text x="30" y="480" font-size="9" fill="#1F3864" font-weight="bold" text-anchor="start" font-family="Arial">ssavault.vaultcore.usgovcloudapi.net</text>
<text x="30" y="494" font-size="9" fill="#595959" font-weight="normal" text-anchor="start" font-family="Arial">→  10.20.3.8   (Key Vault PE)</text>
<text x="30" y="510" font-size="9" fill="#1F3864" font-weight="bold" text-anchor="start" font-family="Arial">mgmt.ssa.gov</text>
<text x="30" y="524" font-size="9" fill="#595959" font-weight="normal" text-anchor="start" font-family="Arial">→  10.1.1.x    (Mgmt segment)</text>
<text x="30" y="540" font-size="9" fill="#1F3864" font-weight="bold" text-anchor="start" font-family="Arial">10.in-addr.arpa</text>
<text x="30" y="554" font-size="9" fill="#595959" font-weight="normal" text-anchor="start" font-family="Arial">→  Reverse PTR  (RFC 1918)</text>
<line x1="160" y1="363" x2="390" y2="312" stroke="#1F7391" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
<rect x="770" y="195" width="200" height="80" fill="#C55A11" rx="8"/>
<text x="870" y="220" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Arial">External Client</text>
<text x="870" y="238" font-size="11" fill="#FFFFFF" font-weight="normal" text-anchor="middle" font-family="Arial">203.x.x.x (Public IP)</text>
<text x="870" y="256" font-size="9" fill="#FFFFFF" font-weight="normal" text-anchor="middle" font-family="Arial">Citizen / partner browser</text>
<line x1="770" y1="235" x2="636" y2="295" stroke="#C55A11" stroke-width="2" marker-end="url(#arr)"/>
<rect x="700" y="380" width="280" height="200" fill="#C55A11" rx="8" opacity="0.12"/>
<rect x="700" y="380" width="280" height="200" fill="#C55A11" rx="8" stroke="#C55A11" stroke-width="1.5"/>
<text x="840" y="400" font-size="11" fill="#C55A11" font-weight="bold" text-anchor="middle" font-family="Arial">External Zones (Public IP)</text>
<text x="710" y="420" font-size="9" fill="#1F3864" font-weight="bold" text-anchor="start" font-family="Arial">myssa.ssa.gov</text>
<text x="710" y="434" font-size="9" fill="#595959" font-weight="normal" text-anchor="start" font-family="Arial">→  203.45.100.12  (Azure Front Door)</text>
<text x="710" y="450" font-size="9" fill="#1F3864" font-weight="bold" text-anchor="start" font-family="Arial">www.ssa.gov</text>
<text x="710" y="464" font-size="9" fill="#595959" font-weight="normal" text-anchor="start" font-family="Arial">→  203.45.100.1   (Public CDN)</text>
<text x="710" y="480" font-size="9" fill="#1F3864" font-weight="bold" text-anchor="start" font-family="Arial">mail.ssa.gov</text>
<text x="710" y="494" font-size="9" fill="#595959" font-weight="normal" text-anchor="start" font-family="Arial">→  MX → EOP / GCC Moderate</text>
<text x="710" y="510" font-size="9" fill="#1F3864" font-weight="bold" text-anchor="start" font-family="Arial">api.ssa.gov</text>
<text x="710" y="524" font-size="9" fill="#595959" font-weight="normal" text-anchor="start" font-family="Arial">→  203.45.100.20  (API Gateway)</text>
<text x="710" y="540" font-size="9" fill="#1F3864" font-weight="bold" text-anchor="start" font-family="Arial">(private zones)</text>
<text x="710" y="554" font-size="9" fill="#595959" font-weight="normal" text-anchor="start" font-family="Arial">→  NOT VISIBLE from external</text>
<line x1="840" y1="363" x2="610" y2="312" stroke="#C55A11" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
<rect x="320" y="500" width="360" height="80" fill="#1F3864" rx="8"/>
<text x="500" y="523" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Arial">Same FQDN — Different Answer</text>
<text x="500" y="543" font-size="10" fill="#1F7391" font-weight="normal" text-anchor="middle" font-family="Arial">myssa.ssa.gov from 10.x.x.x  →  10.20.1.45 (private)</text>
<text x="500" y="560" font-size="10" fill="#C55A11" font-weight="normal" text-anchor="middle" font-family="Arial">myssa.ssa.gov from 203.x.x.x →  203.45.100.12 (public)</text>
<text x="500" y="576" font-size="9" fill="#F2F2F2" font-weight="normal" text-anchor="middle" font-family="Arial">Azure Private DNS Zones linked to SSA VNet for privatelink.* zones</text>
</svg>