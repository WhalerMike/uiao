<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1F3864"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#375623"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" fill="#F2F2F2" rx="8"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="48" fill="#1F3864" rx="8"/>
  <rect x="0" y="30" width="900" height="18" fill="#1F3864"/>
  <text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#FFFFFF">Fig 1 — NIST SP 800-61r3 IR Lifecycle Adapted for SSA GCC Moderate</text>

  <!-- Center label -->
  <ellipse cx="450" cy="350" rx="80" ry="55" fill="#1F3864" opacity="0.12"/>
  <text x="450" y="343" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1F3864">CONTINUOUS</text>
  <text x="450" y="358" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1F3864">IMPROVEMENT</text>

  <!-- Phase 1 — PREPARATION (top-left) -->
  <rect x="30" y="68" width="330" height="210" rx="10" fill="#DEEAF1" stroke="#2E75B6" stroke-width="2.5"/>
  <rect x="30" y="68" width="330" height="36" rx="10" fill="#2E75B6"/>
  <rect x="30" y="92" width="330" height="12" fill="#2E75B6"/>
  <text x="195" y="92" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF">Phase 1 — PREPARATION</text>
  <text x="50" y="126" font-family="Arial" font-size="10.5" fill="#1F3864">• IR Policy (IR-1) and IR Plan (IR-8) in place</text>
  <text x="50" y="143" font-family="Arial" font-size="10.5" fill="#1F3864">• CSIRT team roster and 24/7 on-call rotation</text>
  <text x="50" y="160" font-family="Arial" font-size="10.5" fill="#1F3864">• Sentinel / Defender XDR connectors active</text>
  <text x="50" y="177" font-family="Arial" font-size="10.5" fill="#1F3864">• SOAR Logic Apps deployed and tested (90-day)</text>
  <text x="50" y="194" font-family="Arial" font-size="10.5" fill="#1F3864">• Purview eDiscovery case templates configured</text>
  <text x="50" y="211" font-family="Arial" font-size="10.5" fill="#1F3864">• Jump kit validated quarterly (Key Vault access)</text>
  <text x="50" y="228" font-family="Arial" font-size="10.5" fill="#1F3864">• Annual tabletop + functional exercise (IR-3)</text>
  <text x="50" y="245" font-family="Arial" font-size="10.5" fill="#1F3864">• Three-tier IR training program (IR-2)</text>
  <text x="50" y="262" font-family="Arial" font-size="10.5" fill="#1F3864">• Azure Backup immutable vaults verified</text>

  <!-- Phase 2 — DETECTION & ANALYSIS (top-right) -->
  <rect x="540" y="68" width="330" height="210" rx="10" fill="#FBE5D6" stroke="#C55A11" stroke-width="2.5"/>
  <rect x="540" y="68" width="330" height="36" rx="10" fill="#C55A11"/>
  <rect x="540" y="92" width="330" height="12" fill="#C55A11"/>
  <text x="705" y="92" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF">Phase 2 — DETECTION &amp; ANALYSIS</text>
  <text x="560" y="126" font-family="Arial" font-size="10.5" fill="#1F3864">• Sentinel analytic rules fire → SOC alert queue</text>
  <text x="560" y="143" font-family="Arial" font-size="10.5" fill="#1F3864">• Initial triage: 15-min SLA (P1), 30-min (P2)</text>
  <text x="560" y="160" font-family="Arial" font-size="10.5" fill="#1F3864">• Entra sign-in log query — 30 days lookback</text>
  <text x="560" y="177" font-family="Arial" font-size="10.5" fill="#1F3864">• Defender for Identity lateral movement check</text>
  <text x="560" y="194" font-family="Arial" font-size="10.5" fill="#1F3864">• Severity classification: P1 Critical → P4 Low</text>
  <text x="560" y="211" font-family="Arial" font-size="10.5" fill="#1F3864">• Incident declared → ServiceNow ticket created</text>
  <text x="560" y="228" font-family="Arial" font-size="10.5" fill="#1F3864">• Evidence preservation BEFORE containment</text>
  <text x="560" y="245" font-family="Arial" font-size="10.5" fill="#1F3864">• CISA notification clock starts at P1 declaration</text>
  <text x="560" y="262" font-family="Arial" font-size="10.5" fill="#1F3864">• IC notified; CSIRT mobilized if P1/P2</text>

  <!-- Phase 3 — CONTAINMENT/ERADICATION/RECOVERY (bottom-right) -->
  <rect x="540" y="402" width="330" height="230" rx="10" fill="#FDECEA" stroke="#C00000" stroke-width="2.5"/>
  <rect x="540" y="402" width="330" height="36" rx="10" fill="#C00000"/>
  <rect x="540" y="426" width="330" height="12" fill="#C00000"/>
  <text x="705" y="418" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">Phase 3 — CONTAINMENT / ERADICATION</text>
  <text x="705" y="432" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">/ RECOVERY</text>
  <text x="560" y="462" font-family="Arial" font-size="10.5" fill="#1F3864">• Short-term: disable account, revoke tokens (SOAR)</text>
  <text x="560" y="479" font-family="Arial" font-size="10.5" fill="#1F3864">• Intune quarantine tag → Conditional Access block</text>
  <text x="560" y="496" font-family="Arial" font-size="10.5" fill="#1F3864">• Network isolation: NSG + Azure Firewall rules</text>
  <text x="560" y="513" font-family="Arial" font-size="10.5" fill="#1F3864">• Long-term: forensic image BEFORE re-imaging</text>
  <text x="560" y="530" font-family="Arial" font-size="10.5" fill="#1F3864">• Eradication: malware removal, patch, re-image</text>
  <text x="560" y="547" font-family="Arial" font-size="10.5" fill="#1F3864">• Recovery: restore from immutable Azure Backup</text>
  <text x="560" y="564" font-family="Arial" font-size="10.5" fill="#1F3864">• M365 Backup restore (Exchange/OD/SharePoint)</text>
  <text x="560" y="581" font-family="Arial" font-size="10.5" fill="#1F3864">• MFA re-enroll before account re-enable</text>
  <text x="560" y="598" font-family="Arial" font-size="10.5" fill="#1F3864">• 30-day enhanced monitoring post-recovery</text>

  <!-- Phase 4 — POST-INCIDENT (bottom-left) -->
  <rect x="30" y="402" width="330" height="230" rx="10" fill="#E2EFDA" stroke="#375623" stroke-width="2.5"/>
  <rect x="30" y="402" width="330" height="36" rx="10" fill="#375623"/>
  <rect x="30" y="426" width="330" height="12" fill="#375623"/>
  <text x="195" y="425" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF">Phase 4 — POST-INCIDENT ACTIVITY</text>
  <text x="50" y="462" font-family="Arial" font-size="10.5" fill="#1F3864">• PIR report due: 30 days post-containment</text>
  <text x="50" y="479" font-family="Arial" font-size="10.5" fill="#1F3864">• Root cause analysis (technical + procedural)</text>
  <text x="50" y="496" font-family="Arial" font-size="10.5" fill="#1F3864">• Lessons learned → structured finding list</text>
  <text x="50" y="513" font-family="Arial" font-size="10.5" fill="#1F3864">• Control gap identification → POA&amp;M entries</text>
  <text x="50" y="530" font-family="Arial" font-size="10.5" fill="#1F3864">• Final CISA report submitted (update initial)</text>
  <text x="50" y="547" font-family="Arial" font-size="10.5" fill="#1F3864">• ISAC threat intel sharing (sanitized, 30 days)</text>
  <text x="50" y="564" font-family="Arial" font-size="10.5" fill="#1F3864">• Sentinel detection rules updated</text>
  <text x="50" y="581" font-family="Arial" font-size="10.5" fill="#1F3864">• SOAR playbooks updated if gaps found</text>
  <text x="50" y="598" font-family="Arial" font-size="10.5" fill="#1F3864">• Feeds back into Preparation (cyclic)</text>

  <!-- Arrows between phases -->
  <!-- Phase1 -> Phase2 (top, left to right) -->
  <line x1="362" y1="173" x2="538" y2="173" stroke="#1F3864" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- Phase2 -> Phase3 (right side, top to bottom) -->
  <line x1="705" y1="280" x2="705" y2="400" stroke="#1F3864" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- Phase3 -> Phase4 (bottom, right to left) -->
  <line x1="538" y1="517" x2="362" y2="517" stroke="#1F3864" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- Phase4 -> Phase1 (left side, bottom to top) -->
  <line x1="195" y1="400" x2="195" y2="280" stroke="#375623" stroke-width="2.5" marker-end="url(#arrg)"/>

  <!-- Arrow labels -->
  <rect x="380" y="158" width="118" height="18" fill="#FFFFFF" rx="3" opacity="0.85"/>
  <text x="439" y="171" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#1F3864" font-style="italic">Incident declared</text>

  <rect x="715" y="330" width="105" height="18" fill="#FFFFFF" rx="3" opacity="0.85"/>
  <text x="768" y="343" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#1F3864" font-style="italic">Contained</text>

  <rect x="378" y="502" width="118" height="18" fill="#FFFFFF" rx="3" opacity="0.85"/>
  <text x="437" y="515" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#1F3864" font-style="italic">Recovered</text>

  <rect x="72" y="330" width="118" height="18" fill="#FFFFFF" rx="3" opacity="0.85"/>
  <text x="131" y="343" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#375623" font-style="italic">Lessons → Plan update</text>

  <!-- Legend -->
  <rect x="30" y="644" width="840" height="28" fill="#1F3864" rx="6" opacity="0.08"/>
  <text x="450" y="662" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#595959">Controls satisfied: IR-1 (Policy) | IR-2 (Training) | IR-3 (Testing) | IR-4 (Handling) | IR-5 (Monitoring) | IR-6 (Reporting) | IR-7 (Assistance) | IR-8 (Plan) | IR-10 (Analysis) | AU-11 (Retention)</text>
</svg>