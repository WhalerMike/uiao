<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <text x="640" y="40" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="bold" fill="#0D1B2E">NIST SP 800-53 Rev 5 Control Closure — Network Access Control (Vol I Book 02)</text>

  <!-- Legend -->
  <rect x="380" y="56" width="22" height="16" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="410" y="69" font-size="15" fill="#33414F">Without NAC — uncontrolled</text>
  <rect x="650" y="56" width="22" height="16" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="680" y="69" font-size="15" fill="#33414F">With NAC — controlled</text>

  <!-- Column bands -->
  <rect x="384" y="126" width="376" height="528" fill="#F7E2DE"/>
  <rect x="760" y="126" width="376" height="528" fill="#D7F2EE"/>

  <!-- Header -->
  <rect x="40" y="88" width="1200" height="38" rx="4" fill="#0D1B2E"/>
  <text x="52" y="113" font-size="17" font-weight="bold" fill="#FFFFFF">Control</text>
  <text x="164" y="113" font-size="17" font-weight="bold" fill="#FFFFFF">Title</text>
  <text x="396" y="113" font-size="17" font-weight="bold" fill="#FFFFFF">State Without NAC</text>
  <text x="772" y="113" font-size="17" font-weight="bold" fill="#FFFFFF">State With NAC</text>
  <text x="1141" y="113" font-size="17" font-weight="bold" fill="#FFFFFF">Authority</text>

  <!-- Row separators -->
  <line x1="40" y1="174" x2="1240" y2="174" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="40" y1="222" x2="1240" y2="222" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="40" y1="270" x2="1240" y2="270" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="40" y1="318" x2="1240" y2="318" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="40" y1="366" x2="1240" y2="366" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="40" y1="414" x2="1240" y2="414" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="40" y1="462" x2="1240" y2="462" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="40" y1="510" x2="1240" y2="510" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="40" y1="558" x2="1240" y2="558" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="40" y1="606" x2="1240" y2="606" stroke="#E3E8EF" stroke-width="1"/>
  <rect x="40" y="126" width="1200" height="528" fill="none" stroke="#E3E8EF" stroke-width="1.5"/>

  <!-- Row 1: IA-3 -->
  <text x="52" y="150" font-size="17" font-weight="bold" fill="#0D1B2E">IA-3</text>
  <text x="164" y="146" font-size="15" fill="#33414F">Device Identification</text>
  <text x="164" y="164" font-size="15" fill="#33414F">and Authentication</text>
  <text x="396" y="146" font-size="15" fill="#33414F">Any device connects; no device</text>
  <text x="396" y="164" font-size="15" fill="#33414F">identity assertion required</text>
  <text x="772" y="146" font-size="15" fill="#33414F">Valid EAP-TLS machine certificate</text>
  <text x="772" y="164" font-size="15" fill="#33414F">required before network access</text>
  <text x="1141" y="146" font-size="14" fill="#6B7A8D">SP 800-53</text>
  <text x="1141" y="164" font-size="14" fill="#6B7A8D">Rev 5</text>

  <!-- Row 2: IA-3(1) -->
  <text x="52" y="198" font-size="17" font-weight="bold" fill="#0D1B2E">IA-3(1)</text>
  <text x="164" y="194" font-size="15" fill="#33414F">Cryptographic Bidirectional</text>
  <text x="164" y="212" font-size="15" fill="#33414F">Authentication</text>
  <text x="396" y="194" font-size="15" fill="#33414F">No device-layer mutual</text>
  <text x="396" y="212" font-size="15" fill="#33414F">authentication exists</text>
  <text x="772" y="194" font-size="15" fill="#33414F">Mutual EAP-TLS — server and device</text>
  <text x="772" y="212" font-size="15" fill="#33414F">certificates both verified</text>
  <text x="1141" y="194" font-size="14" fill="#6B7A8D">SP 800-53</text>
  <text x="1141" y="212" font-size="14" fill="#6B7A8D">Rev 5</text>

  <!-- Row 3: AC-3 -->
  <text x="52" y="246" font-size="17" font-weight="bold" fill="#0D1B2E">AC-3</text>
  <text x="164" y="250" font-size="15" fill="#33414F">Access Enforcement</text>
  <text x="396" y="242" font-size="15" fill="#33414F">Policy enforced only at the</text>
  <text x="396" y="260" font-size="15" fill="#33414F">IP / application layer</text>
  <text x="772" y="242" font-size="15" fill="#33414F">Enforced at the port before IP</text>
  <text x="772" y="260" font-size="15" fill="#33414F">connectivity is granted</text>
  <text x="1141" y="242" font-size="14" fill="#6B7A8D">SP 800-53</text>
  <text x="1141" y="260" font-size="14" fill="#6B7A8D">Rev 5</text>

  <!-- Row 4: AC-17 -->
  <text x="52" y="294" font-size="17" font-weight="bold" fill="#0D1B2E">AC-17</text>
  <text x="164" y="298" font-size="15" fill="#33414F">Remote Access</text>
  <text x="396" y="290" font-size="15" fill="#33414F">Device compliance checked only</text>
  <text x="396" y="308" font-size="15" fill="#33414F">by Conditional Access</text>
  <text x="772" y="290" font-size="15" fill="#33414F">Independent device identity check</text>
  <text x="772" y="308" font-size="15" fill="#33414F">at port and wireless association</text>
  <text x="1141" y="290" font-size="14" fill="#6B7A8D">SP 800-53</text>
  <text x="1141" y="308" font-size="14" fill="#6B7A8D">Rev 5</text>

  <!-- Row 5: AC-19 -->
  <text x="52" y="342" font-size="17" font-weight="bold" fill="#0D1B2E">AC-19</text>
  <text x="164" y="338" font-size="15" fill="#33414F">Access Control for</text>
  <text x="164" y="356" font-size="15" fill="#33414F">Mobile Devices</text>
  <text x="396" y="338" font-size="15" fill="#33414F">Personal devices reach the same</text>
  <text x="396" y="356" font-size="15" fill="#33414F">SSID as managed devices</text>
  <text x="772" y="338" font-size="15" fill="#33414F">Managed SSID restricted to enrolled</text>
  <text x="772" y="356" font-size="15" fill="#33414F">devices — WPA3-Enterprise EAP-TLS</text>
  <text x="1141" y="338" font-size="14" fill="#6B7A8D">SP 800-53</text>
  <text x="1141" y="356" font-size="14" fill="#6B7A8D">Rev 5</text>

  <!-- Row 6: AC-20 -->
  <text x="52" y="390" font-size="17" font-weight="bold" fill="#0D1B2E">AC-20</text>
  <text x="164" y="386" font-size="15" fill="#33414F">Use of External</text>
  <text x="164" y="404" font-size="15" fill="#33414F">Systems</text>
  <text x="396" y="386" font-size="15" fill="#33414F">Vendor devices treated identically</text>
  <text x="396" y="404" font-size="15" fill="#33414F">to managed SSA devices</text>
  <text x="772" y="386" font-size="15" fill="#33414F">Unknown devices quarantined;</text>
  <text x="772" y="404" font-size="15" fill="#33414F">documented exception process</text>
  <text x="1141" y="386" font-size="14" fill="#6B7A8D">SP 800-53</text>
  <text x="1141" y="404" font-size="14" fill="#6B7A8D">Rev 5</text>

  <!-- Row 7: SC-7(3) -->
  <text x="52" y="438" font-size="17" font-weight="bold" fill="#0D1B2E">SC-7(3)</text>
  <text x="164" y="434" font-size="15" fill="#33414F">Boundary Protection —</text>
  <text x="164" y="452" font-size="15" fill="#33414F">Access Points</text>
  <text x="396" y="434" font-size="15" fill="#33414F">Ports open to any physically</text>
  <text x="396" y="452" font-size="15" fill="#33414F">connected device</text>
  <text x="772" y="434" font-size="15" fill="#33414F">Every port and managed SSID is a</text>
  <text x="772" y="452" font-size="15" fill="#33414F">boundary enforcement point</text>
  <text x="1141" y="434" font-size="14" fill="#6B7A8D">SP 800-53</text>
  <text x="1141" y="452" font-size="14" fill="#6B7A8D">Rev 5</text>

  <!-- Row 8: SC-7(5) -->
  <text x="52" y="486" font-size="17" font-weight="bold" fill="#0D1B2E">SC-7(5)</text>
  <text x="164" y="482" font-size="15" fill="#33414F">Boundary Protection —</text>
  <text x="164" y="500" font-size="15" fill="#33414F">Deny by Default</text>
  <text x="396" y="482" font-size="15" fill="#33414F">Unauthenticated devices receive</text>
  <text x="396" y="500" font-size="15" fill="#33414F">full access — default open</text>
  <text x="772" y="482" font-size="15" fill="#33414F">Unauthenticated devices receive</text>
  <text x="772" y="500" font-size="15" fill="#33414F">VLAN 999 only — default deny</text>
  <text x="1141" y="482" font-size="14" fill="#6B7A8D">SP 800-53</text>
  <text x="1141" y="500" font-size="14" fill="#6B7A8D">Rev 5</text>

  <!-- Row 9: CM-6 -->
  <text x="52" y="534" font-size="17" font-weight="bold" fill="#0D1B2E">CM-6</text>
  <text x="164" y="538" font-size="15" fill="#33414F">Configuration Settings</text>
  <text x="396" y="530" font-size="15" fill="#33414F">Compliance assessed but not</text>
  <text x="396" y="548" font-size="15" fill="#33414F">enforced at network admission</text>
  <text x="772" y="530" font-size="15" fill="#33414F">Non-compliant devices moved to</text>
  <text x="772" y="548" font-size="15" fill="#33414F">Remediation VLAN within 20 min</text>
  <text x="1141" y="530" font-size="14" fill="#6B7A8D">SP 800-53</text>
  <text x="1141" y="548" font-size="14" fill="#6B7A8D">Rev 5</text>

  <!-- Row 10: CM-7 -->
  <text x="52" y="582" font-size="17" font-weight="bold" fill="#0D1B2E">CM-7</text>
  <text x="164" y="586" font-size="15" fill="#33414F">Least Functionality</text>
  <text x="396" y="578" font-size="15" fill="#33414F">IoT devices have unrestricted</text>
  <text x="396" y="596" font-size="15" fill="#33414F">lateral movement in the VLAN</text>
  <text x="772" y="578" font-size="15" fill="#33414F">IoT VLAN ACLs limit each device to</text>
  <text x="772" y="596" font-size="15" fill="#33414F">required ports and protocols</text>
  <text x="1141" y="578" font-size="14" fill="#6B7A8D">SP 800-53</text>
  <text x="1141" y="596" font-size="14" fill="#6B7A8D">Rev 5</text>

  <!-- Row 11: CM-8 -->
  <text x="52" y="630" font-size="17" font-weight="bold" fill="#0D1B2E">CM-8</text>
  <text x="164" y="626" font-size="15" fill="#33414F">System Component</text>
  <text x="164" y="644" font-size="15" fill="#33414F">Inventory</text>
  <text x="396" y="626" font-size="15" fill="#33414F">Unmanaged devices absent from</text>
  <text x="396" y="644" font-size="15" fill="#33414F">every authoritative inventory</text>
  <text x="772" y="626" font-size="15" fill="#33414F">Every connection logged — RADIUS</text>
  <text x="772" y="644" font-size="15" fill="#33414F">accounting + InfoBlox DHCP record</text>
  <text x="1141" y="626" font-size="14" fill="#6B7A8D">SP 800-53</text>
  <text x="1141" y="644" font-size="14" fill="#6B7A8D">Rev 5</text>

  <text x="640" y="690" text-anchor="middle" font-size="16" fill="#6B7A8D">Eleven controls move from open, assertion-based admission to certificate-verified enforcement at the port</text>
</svg>
