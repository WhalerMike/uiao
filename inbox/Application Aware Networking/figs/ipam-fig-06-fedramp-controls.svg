<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1000" height="760" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="0" y="0" width="1000" height="48" fill="#1F3864"/>
  <text x="500" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">InfoBlox DDI — FedRAMP Moderate Control Satisfaction Architecture</text>
  <text x="500" y="43" text-anchor="middle" font-size="10" fill="#D5E8F0">NIST SP 800-53 Rev 5 · SC-20 · SC-21 · SC-22 · CM-8 · SA-9 · IA-5(2) · AU-2 · AU-12 · IR-4</text>

  <!-- ── CENTER HUB ── -->
  <circle cx="500" cy="400" r="100" fill="#1F3864"/>
  <circle cx="500" cy="400" r="96" fill="none" stroke="#2E75B6" stroke-width="2"/>
  <text x="500" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">InfoBlox</text>
  <text x="500" y="403" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E75B6">DDI</text>
  <text x="500" y="422" text-anchor="middle" font-size="9" fill="#D5E8F0">Unified Control Plane</text>
  <text x="500" y="437" text-anchor="middle" font-size="8" fill="#D5E8F0">DNS · DHCP · IPAM</text>
  <text x="500" y="452" text-anchor="middle" font-size="8" fill="#D5E8F0">FedRAMP Moderate ATO</text>

  <!-- ── SPOKES (8 controls in a circle) ── -->
  <!-- Each spoke: line from hub edge to control box -->

  <!-- SC-20 (top, 12 o'clock) -->
  <line x1="500" y1="300" x2="500" y2="220" stroke="#1F3864" stroke-width="2"/>
  <polygon points="496,224 500,220 504,224" fill="#1F3864"/>
  <rect x="390" y="100" width="220" height="118" rx="8" fill="#EBF3FF" stroke="#1F3864" stroke-width="2"/>
  <rect x="390" y="100" width="220" height="26" rx="8" fill="#1F3864"/>
  <text x="500" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">SC-20 · Secure Name Resolution</text>
  <text x="500" y="141" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F3864">InfoBlox Implementation:</text>
  <text x="500" y="156" text-anchor="middle" font-size="8.5" fill="#595959">DNSSEC signing: agency.gov internal zones</text>
  <text x="500" y="170" text-anchor="middle" font-size="8.5" fill="#595959">Agency-controlled KSK (HSM or Grid key store)</text>
  <text x="500" y="184" text-anchor="middle" font-size="8.5" fill="#595959">DS record → .gov TLD registrar</text>
  <text x="500" y="199" text-anchor="middle" font-size="7.5" font-style="italic" fill="#375623">Evidence: DNSSEC key rotation log · DS record confirmation</text>

  <!-- SC-21 (upper-right, ~1:30 o'clock) -->
  <line x1="571" y1="329" x2="660" y2="240" stroke="#C00000" stroke-width="2"/>
  <polygon points="658,244 660,240 656,238" fill="#C00000"/>
  <rect x="658" y="108" width="220" height="128" rx="8" fill="#FCE4D6" stroke="#C00000" stroke-width="2"/>
  <rect x="658" y="108" width="220" height="26" rx="8" fill="#C00000"/>
  <text x="768" y="126" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">SC-21 · Recursive Query Security</text>
  <text x="768" y="149" text-anchor="middle" font-size="9" font-weight="bold" fill="#C00000">InfoBlox Implementation:</text>
  <text x="768" y="164" text-anchor="middle" font-size="8.5" fill="#595959">Response Policy Zones (RPZ)</text>
  <text x="768" y="178" text-anchor="middle" font-size="8.5" fill="#595959">CISA Protective DNS feed integration</text>
  <text x="768" y="192" text-anchor="middle" font-size="8.5" fill="#595959">Commercial threat intel (Infoblox TI)</text>
  <text x="768" y="206" text-anchor="middle" font-size="8.5" fill="#595959">RPZ-QNAME · RPZ-IP · RPZ-NSDNAME</text>
  <text x="768" y="220" text-anchor="middle" font-size="7.5" font-style="italic" fill="#375623">Evidence: RPZ hit log exported to SIEM · AU-2 events</text>

  <!-- CM-8 (right, 3 o'clock) -->
  <line x1="600" y1="400" x2="720" y2="400" stroke="#2E75B6" stroke-width="2"/>
  <polygon points="716,396 720,400 716,404" fill="#2E75B6"/>
  <rect x="720" y="330" width="258" height="140" rx="8" fill="#EBF3FF" stroke="#2E75B6" stroke-width="2"/>
  <rect x="720" y="330" width="258" height="26" rx="8" fill="#2E75B6"/>
  <text x="849" y="348" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">CM-8 · Component Inventory</text>
  <text x="849" y="372" text-anchor="middle" font-size="9" font-weight="bold" fill="#2E75B6">InfoBlox Implementation:</text>
  <text x="849" y="387" text-anchor="middle" font-size="8.5" fill="#595959">Every IP host record = CM-8 inventory item</text>
  <text x="849" y="401" text-anchor="middle" font-size="8.5" fill="#595959">DHCP fingerprinting: OS · device type · vendor</text>
  <text x="849" y="415" text-anchor="middle" font-size="8.5" fill="#595959">Azure / AWS / OCI VM records auto-synced</text>
  <text x="849" y="429" text-anchor="middle" font-size="8.5" fill="#595959">CSV/XML export to ServiceNow CMDB</text>
  <text x="849" y="452" text-anchor="middle" font-size="7.5" font-style="italic" fill="#375623">Evidence: InfoBlox IP host record export · CMDB reconciliation report</text>

  <!-- IA-5(2) (lower-right, ~4:30) -->
  <line x1="571" y1="471" x2="660" y2="560" stroke="#C55A11" stroke-width="2"/>
  <polygon points="657,556 660,560 656,562" fill="#C55A11"/>
  <rect x="658" y="558" width="310" height="130" rx="8" fill="#FCE4D6" stroke="#C55A11" stroke-width="2"/>
  <rect x="658" y="558" width="310" height="26" rx="8" fill="#C55A11"/>
  <text x="813" y="576" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">IA-5(2) · Certificate Authenticator Mgmt</text>
  <text x="813" y="599" text-anchor="middle" font-size="9" font-weight="bold" fill="#C55A11">InfoBlox Implementation:</text>
  <text x="813" y="614" text-anchor="middle" font-size="8.5" fill="#595959">Certificate Tracker: thumbprint · expiry · issuer · bound IP</text>
  <text x="813" y="628" text-anchor="middle" font-size="8.5" fill="#595959">SCEP/EST connector to ADCS: automated enrollment</text>
  <text x="813" y="642" text-anchor="middle" font-size="8.5" fill="#595959">OPM HRIT cert imported as external record</text>
  <text x="813" y="656" text-anchor="middle" font-size="8.5" fill="#595959">90 / 30 / 7-day expiry alerts → SOC tickets</text>
  <text x="813" y="677" text-anchor="middle" font-size="7.5" font-style="italic" fill="#375623">Evidence: Cert inventory report · Expiry alert email audit trail · IA-5(2) POA&amp;M closure</text>

  <!-- AU-2/AU-12 (bottom, 6 o'clock) -->
  <line x1="500" y1="500" x2="500" y2="572" stroke="#375623" stroke-width="2"/>
  <polygon points="496,568 500,572 504,568" fill="#375623"/>
  <rect x="340" y="572" width="320" height="128" rx="8" fill="#E2EFDA" stroke="#375623" stroke-width="2"/>
  <rect x="340" y="572" width="320" height="26" rx="8" fill="#375623"/>
  <text x="500" y="590" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">AU-2 / AU-12 · Audit Logging</text>
  <text x="500" y="613" text-anchor="middle" font-size="9" font-weight="bold" fill="#375623">InfoBlox Implementation:</text>
  <text x="500" y="628" text-anchor="middle" font-size="8.5" fill="#595959">DNS query/response logs: all Grid Members → syslog</text>
  <text x="500" y="642" text-anchor="middle" font-size="8.5" fill="#595959">DHCP lease grant/release/deny events logged</text>
  <text x="500" y="656" text-anchor="middle" font-size="8.5" fill="#595959">Single syslog stream → Splunk / Azure Sentinel / Security Hub</text>
  <text x="500" y="670" text-anchor="middle" font-size="8.5" fill="#595959">Log retention: 3 years (FedRAMP Moderate minimum)</text>
  <text x="500" y="690" text-anchor="middle" font-size="7.5" font-style="italic" fill="#375623">Evidence: SIEM dashboards · Log volume report · 3-year retention config screenshot</text>

  <!-- IR-4 (lower-left, ~7:30) -->
  <line x1="429" y1="471" x2="340" y2="560" stroke="#7030A0" stroke-width="2"/>
  <polygon points="342,556 340,560 344,562" fill="#7030A0"/>
  <rect x="30" y="558" width="308" height="130" rx="8" fill="#F5F0FA" stroke="#7030A0" stroke-width="2"/>
  <rect x="30" y="558" width="308" height="26" rx="8" fill="#7030A0"/>
  <text x="184" y="576" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">IR-4 · Incident Handling (DNS Threats)</text>
  <text x="184" y="599" text-anchor="middle" font-size="9" font-weight="bold" fill="#7030A0">InfoBlox Implementation:</text>
  <text x="184" y="614" text-anchor="middle" font-size="8.5" fill="#595959">Real-time DNSSEC validation failure → SIEM alert</text>
  <text x="184" y="628" text-anchor="middle" font-size="8.5" fill="#595959">RPZ block events → IR ticket auto-created</text>
  <text x="184" y="642" text-anchor="middle" font-size="8.5" fill="#595959">DNS exfiltration detection (query rate anomaly)</text>
  <text x="184" y="656" text-anchor="middle" font-size="8.5" fill="#595959">InfoBlox Threat Intelligence (Infoblox TI) feed</text>
  <text x="184" y="677" text-anchor="middle" font-size="7.5" font-style="italic" fill="#375623">Evidence: SIEM IR playbook · RPZ block rate dashboard · DNS exfil alert config</text>

  <!-- SA-9 (left, 9 o'clock) -->
  <line x1="400" y1="400" x2="280" y2="400" stroke="#595959" stroke-width="2"/>
  <polygon points="284,396 280,400 284,404" fill="#595959"/>
  <rect x="22" y="330" width="256" height="140" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="2"/>
  <rect x="22" y="330" width="256" height="26" rx="8" fill="#595959"/>
  <text x="150" y="348" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">SA-9 · External System Services</text>
  <text x="150" y="372" text-anchor="middle" font-size="9" font-weight="bold" fill="#595959">InfoBlox Implementation:</text>
  <text x="150" y="387" text-anchor="middle" font-size="8.5" fill="#595959">Azure / AWS / OCI DNS registered as</text>
  <text x="150" y="401" text-anchor="middle" font-size="8.5" fill="#595959">External DNS Servers in InfoBlox</text>
  <text x="150" y="415" text-anchor="middle" font-size="8.5" fill="#595959">All forwarded queries logged (forwarder ID)</text>
  <text x="150" y="429" text-anchor="middle" font-size="8.5" fill="#595959">OPM HRIT: external host records + SA-9 table</text>
  <text x="150" y="452" text-anchor="middle" font-size="7.5" font-style="italic" fill="#375623">Evidence: Forwarder config export · SSP SA-9 table row</text>

  <!-- SC-22 (upper-left, ~10:30) -->
  <line x1="429" y1="329" x2="340" y2="240" stroke="#2E75B6" stroke-width="2"/>
  <polygon points="343,244 340,240 336,242" fill="#2E75B6"/>
  <rect x="22" y="108" width="318" height="128" rx="8" fill="#EBF3FF" stroke="#2E75B6" stroke-width="2"/>
  <rect x="22" y="108" width="318" height="26" rx="8" fill="#2E75B6"/>
  <text x="181" y="126" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">SC-22 · DNS Architecture Documentation</text>
  <text x="181" y="149" text-anchor="middle" font-size="9" font-weight="bold" fill="#2E75B6">InfoBlox Implementation:</text>
  <text x="181" y="164" text-anchor="middle" font-size="8.5" fill="#595959">InfoBlox Network Insight: topology auto-generated</text>
  <text x="181" y="178" text-anchor="middle" font-size="8.5" fill="#595959">Grid topology diagram: Master + Members + BloxOne</text>
  <text x="181" y="192" text-anchor="middle" font-size="8.5" fill="#595959">Forwarder map: all conditional forwarders documented</text>
  <text x="181" y="206" text-anchor="middle" font-size="8.5" fill="#595959">SSP Appendix J attachment: InfoBlox topology export</text>
  <text x="181" y="228" text-anchor="middle" font-size="7.5" font-style="italic" fill="#375623">Evidence: InfoBlox Network Insight report · SSP Appendix J DNS section</text>

  <!-- ── LEGEND ── -->
  <rect x="22" y="700" width="956" height="46" rx="6" fill="#F2F2F2" stroke="#CCCCCC" stroke-width="1"/>
  <text x="500" y="718" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F3864">Control Satisfaction Model — InfoBlox DDI as Single Evidence Source</text>
  <text x="500" y="734" text-anchor="middle" font-size="8.5" fill="#595959">All eight control families above are satisfied by InfoBlox DDI evidence. Without a unified DDI platform, each control requires separate evidence artifacts</text>
  <text x="500" y="748" text-anchor="middle" font-size="8.5" fill="#595959">from Azure Monitor, CloudTrail, OCI Audit, and Windows Event Log — multiplying the SA&amp;A evidence burden by a factor of 4.</text>

  <!-- Bottom strip -->
  <rect x="0" y="744" width="1000" height="16" fill="#1F3864"/>
  <text x="500" y="756" text-anchor="middle" font-size="8" fill="#FFFFFF">UNCLASSIFIED // FOUO — InfoBlox DDI FedRAMP Moderate Control Architecture — NIST SP 800-53 Rev 5</text>
</svg>
