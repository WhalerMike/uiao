<svg viewBox="0 0 1040 460" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="460" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#999"/></marker><marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2E75B6"/></marker><marker id="arww" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#fff"/></marker></defs><text x="520" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3864">VEX Exploitability Assessment — Decision Flow for Each CVE in VDR</text><text x="520" y="46" text-anchor="middle" font-size="11" fill="#2E75B6">CycloneDX VEX / OpenVEX CLI — every CVE in the VDR receives one of four exploitability assertions</text><rect x="420" y="60" width="200" height="40" rx="5" fill="#1F3864"/><text x="520" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">CVE Identified in VDR Scan</text><text x="520" y="93" text-anchor="middle" font-size="9" fill="#fff">Grype + NVD / GHSA / KEV lookup</text><line x1="520" y1="100" x2="520" y2="135" stroke="#aaa" stroke-width="2" marker-end="url(#arw)"/><polygon points="520,135 620,165 520,195 420,165" fill="#2E75B6" opacity="0.15"/><polygon points="520,135 620,165 520,195 420,165" fill="none" stroke="#2E75B6" stroke-width="2"/><text x="520" y="163" text-anchor="middle" font-size="9" font-weight="bold" fill="#2E75B6">Vulnerable component</text><text x="520" y="177" text-anchor="middle" font-size="9" fill="#2E75B6">present in this build?</text><line x1="420" y1="165" x2="210" y2="165" stroke="#aaa" stroke-width="1.5" marker-end="url(#arw)"/><text x="315" y="158" text-anchor="middle" font-size="9" fill="#375623">NO</text><line x1="155" y1="165" x2="155" y2="285" stroke="#375623" stroke-width="1.5" marker-end="url(#arw)"/><rect x="55" y="285" width="200" height="50" rx="5" fill="#375623" opacity="0.2"/><rect x="55" y="285" width="200" height="50" rx="5" fill="none" stroke="#375623" stroke-width="2"/><text x="155" y="303" text-anchor="middle" font-size="10" font-weight="bold" fill="#375623">not_affected</text><text x="155" y="318" text-anchor="middle" font-size="8.5" fill="#1F3864">Component absent from SBOM</text><text x="155" y="330" text-anchor="middle" font-size="8.5" fill="#1F3864">No exposure; document reason</text><line x1="520" y1="195" x2="520" y2="240" stroke="#aaa" stroke-width="1.5" marker-end="url(#arw)"/><text x="535" y="222" text-anchor="start" font-size="9" fill="#C00000">YES</text><polygon points="520,240 630,268 520,296 410,268" fill="#2E75B6" opacity="0.15"/><polygon points="520,240 630,268 520,296 410,268" fill="none" stroke="#2E75B6" stroke-width="2"/><text x="520" y="264" text-anchor="middle" font-size="9" font-weight="bold" fill="#2E75B6">Vulnerable code path</text><text x="520" y="280" text-anchor="middle" font-size="9" fill="#2E75B6">reachable at runtime?</text><line x1="410" y1="268" x2="325" y2="268" stroke="#aaa" stroke-width="1.5" marker-end="url(#arw)"/><text x="368" y="260" text-anchor="middle" font-size="9" fill="#375623">NO</text><line x1="285" y1="268" x2="285" y2="285" stroke="#375623" stroke-width="1.5" marker-end="url(#arw)"/><rect x="185" y="285" width="200" height="50" rx="5" fill="#375623" opacity="0.2"/><rect x="185" y="285" width="200" height="50" rx="5" fill="none" stroke="#375623" stroke-width="2"/><text x="285" y="303" text-anchor="middle" font-size="10" font-weight="bold" fill="#375623">not_affected</text><text x="285" y="318" text-anchor="middle" font-size="8.5" fill="#1F3864">Code path not reachable</text><text x="285" y="330" text-anchor="middle" font-size="8.5" fill="#1F3864">Justify with call graph analysis</text><line x1="520" y1="296" x2="520" y2="340" stroke="#aaa" stroke-width="1.5" marker-end="url(#arw)"/><text x="535" y="322" text-anchor="start" font-size="9" fill="#C00000">YES</text><rect x="430" y="340" width="180" height="50" rx="5" fill="#C00000" opacity="0.15"/><rect x="430" y="340" width="180" height="50" rx="5" fill="none" stroke="#C00000" stroke-width="2"/><text x="520" y="358" text-anchor="middle" font-size="10" font-weight="bold" fill="#C00000">affected</text><text x="520" y="373" text-anchor="middle" font-size="8.5" fill="#1F3864">Exploitable — create POA&amp;M</text><text x="520" y="385" text-anchor="middle" font-size="8.5" fill="#1F3864">CVSS ≥ 9.0 → 15-day remediation</text><line x1="620" y1="165" x2="770" y2="165" stroke="#aaa" stroke-width="1.5" marker-end="url(#arw)"/><text x="695" y="158" text-anchor="middle" font-size="9" fill="#C55A11">ALT CHECK</text><polygon points="820,135 920,165 820,195 720,165" fill="#2E75B6" opacity="0.15"/><polygon points="820,135 920,165 820,195 720,165" fill="none" stroke="#2E75B6" stroke-width="2"/><text x="820" y="162" text-anchor="middle" font-size="9" font-weight="bold" fill="#2E75B6">Fix applied?</text><text x="820" y="178" text-anchor="middle" font-size="9" fill="#2E75B6">(patch / version bump)</text><line x1="820" y1="195" x2="820" y2="285" stroke="#375623" stroke-width="1.5" marker-end="url(#arw)"/><text x="835" y="240" text-anchor="start" font-size="9" fill="#375623">YES</text><rect x="720" y="285" width="200" height="50" rx="5" fill="#375623" opacity="0.2"/><rect x="720" y="285" width="200" height="50" rx="5" fill="none" stroke="#375623" stroke-width="2"/><text x="820" y="303" text-anchor="middle" font-size="10" font-weight="bold" fill="#375623">fixed</text><text x="820" y="318" text-anchor="middle" font-size="8.5" fill="#1F3864">Patch applied; version bumped</text><text x="820" y="330" text-anchor="middle" font-size="8.5" fill="#1F3864">Include remediation commit SHA</text><line x1="920" y1="165" x2="980" y2="165" stroke="#aaa" stroke-width="1.5" marker-end="url(#arw)"/><line x1="980" y1="165" x2="980" y2="285" stroke="#C55A11" stroke-width="1.5" marker-end="url(#arw)"/><text x="960" y="158" text-anchor="middle" font-size="9" fill="#C55A11">NO</text><rect x="895" y="285" width="130" height="62" rx="5" fill="#C55A11" opacity="0.15"/><rect x="895" y="285" width="130" height="62" rx="5" fill="none" stroke="#C55A11" stroke-width="2"/><text x="960" y="303" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#C55A11">under_</text><text x="960" y="317" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#C55A11">investigation</text><text x="960" y="332" text-anchor="middle" font-size="8" fill="#1F3864">30-day triage SLA</text><text x="960" y="344" text-anchor="middle" font-size="8" fill="#1F3864">Create tracking issue</text><text x="520" y="448" text-anchor="middle" font-size="9" fill="#1F3864">VEX document format: CycloneDX 1.6 VEX or OpenVEX · Filed to agency evidence repository · Satisfies: SR-6 · SR-8 · SA-11 · Tier 3 VEX (EO 14028 §4 / NIST SP 800-161)</text></svg>
