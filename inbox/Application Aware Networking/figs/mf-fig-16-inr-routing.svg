<svg viewBox="0 0 1040 460" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="460" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#999"/></marker><marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2E75B6"/></marker><marker id="arww" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#fff"/></marker></defs><text x="520" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3864">Microsoft Intelligent Network Routing — Local Breakout vs. Backhaul</text><text x="520" y="46" text-anchor="middle" font-size="11" fill="#2E75B6">The front-door entry point determines whether agency traffic rides Microsoft's private backbone</text><line x1="520" y1="50" x2="520" y2="420" stroke="#ddd" stroke-width="2" stroke-dasharray="6,4"/><text x="260" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#C00000">❌  Backhaul Path (Legacy)</text><rect x="30" y="80" width="120" height="40" rx="5" fill="#C55A11"/><text x="90" y="97" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Portland</text><text x="90" y="112" text-anchor="middle" font-size="9" fill="#fff">Field Office</text><line x1="150" y1="100" x2="210" y2="100" stroke="#C00000" stroke-width="2" marker-end="url(#arwb)"/><text x="180" y="93" text-anchor="middle" font-size="8" fill="#C00000">MPLS</text><rect x="210" y="80" width="120" height="40" rx="5" fill="#1F3864"/><text x="270" y="97" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Agency DC</text><text x="270" y="112" text-anchor="middle" font-size="9" fill="#fff">Washington DC</text><line x1="330" y1="100" x2="390" y2="100" stroke="#C00000" stroke-width="2" marker-end="url(#arwb)"/><text x="360" y="93" text-anchor="middle" font-size="8" fill="#C00000">Internet</text><rect x="390" y="80" width="120" height="40" rx="5" fill="#2E75B6"/><text x="450" y="97" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Microsoft PoP</text><text x="450" y="112" text-anchor="middle" font-size="9" fill="#fff">Ashburn (suboptimal)</text><rect x="100" y="140" width="360" height="24" rx="4" fill="#C00000" opacity="0.15"/><rect x="100" y="140" width="360" height="24" rx="4" fill="none" stroke="#C00000" stroke-width="1"/><text x="280" y="156" text-anchor="middle" font-size="10" fill="#C00000">Portland→DC backhaul 65ms + DC→Ashburn 15ms = 80ms+ one-way · backbone starts at Ashburn</text><rect x="390" y="175" width="120" height="35" rx="5" fill="#1F3864" opacity="0.4"/><text x="450" y="190" text-anchor="middle" font-size="9" fill="#fff">Microsoft Teams</text><text x="450" y="203" text-anchor="middle" font-size="9" fill="#fff">Infrastructure</text><line x1="450" y1="120" x2="450" y2="175" stroke="#1F3864" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arwb)"/><text x="470" y="152" text-anchor="start" font-size="8" fill="#1F3864">Suboptimal</text><text x="470" y="163" text-anchor="start" font-size="8" fill="#1F3864">backbone path</text><text x="780" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#375623">✓  Local Breakout (AAN + INR)</text><rect x="540" y="80" width="120" height="40" rx="5" fill="#C55A11"/><text x="600" y="97" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Portland</text><text x="600" y="112" text-anchor="middle" font-size="9" fill="#fff">Field Office (SD-WAN)</text><line x1="660" y1="100" x2="720" y2="100" stroke="#375623" stroke-width="2" marker-end="url(#arwb)"/><text x="690" y="93" text-anchor="middle" font-size="8" fill="#375623">DIA/5G</text><text x="690" y="110" text-anchor="middle" font-size="8" fill="#375623">local</text><rect x="720" y="80" width="130" height="40" rx="5" fill="#2E75B6"/><text x="785" y="97" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Microsoft PoP</text><text x="785" y="112" text-anchor="middle" font-size="9" fill="#fff">Seattle (optimal front door)</text><line x1="850" y1="100" x2="910" y2="100" stroke="#1F3864" stroke-width="3" marker-end="url(#arwb)"/><text x="880" y="93" text-anchor="middle" font-size="8" fill="#1F3864">Private</text><text x="880" y="110" text-anchor="middle" font-size="8" fill="#1F3864">Backbone</text><rect x="910" y="80" width="100" height="40" rx="5" fill="#1F3864"/><text x="960" y="97" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Microsoft</text><text x="960" y="112" text-anchor="middle" font-size="9" fill="#fff">Teams Infra</text><rect x="540" y="140" width="460" height="24" rx="4" fill="#375623" opacity="0.15"/><rect x="540" y="140" width="460" height="24" rx="4" fill="none" stroke="#375623" stroke-width="1"/><text x="770" y="156" text-anchor="middle" font-size="10" fill="#375623">Portland→Seattle 12ms + Microsoft backbone to Teams = 18ms total · 4× improvement</text><rect x="540" y="175" width="460" height="35" rx="4" fill="#1F3864" opacity="0.07"/><text x="770" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3864">Cisco Catalyst SD-WAN — Cloud OnRamp for SaaS</text><text x="770" y="204" text-anchor="middle" font-size="9" fill="#1F3864">Probes all transports → selects lowest-latency Microsoft front door per branch → re-evaluates continuously</text><rect x="30" y="230" width="980" height="28" rx="4" fill="#1F3864"/><text x="520" y="249" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Microsoft 365 Endpoint Categories — Traffic Treatment in Cisco Catalyst SD-WAN</text><rect x="30" y="268" width="980" height="48" rx="3" fill="#375623" opacity="0.09"/><rect x="30" y="268" width="980" height="48" rx="3" fill="none" stroke="#375623" stroke-width="1"/><rect x="30" y="268" width="120" height="48" rx="3" fill="#375623"/><text x="90" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Optimize</text><text x="90" y="306" text-anchor="middle" font-size="9" fill="#fff">category</text><text x="200" y="288" text-anchor="start" font-size="10" font-weight="bold" fill="#375623">Teams media · SharePoint Online</text><text x="200" y="304" text-anchor="start" font-size="9" fill="#1F3864">No proxy · No inspection · Maximum priority DIA/5G path · Direct to Microsoft front door</text><rect x="30" y="320" width="980" height="48" rx="3" fill="#2E75B6" opacity="0.09"/><rect x="30" y="320" width="980" height="48" rx="3" fill="none" stroke="#2E75B6" stroke-width="1"/><rect x="30" y="320" width="120" height="48" rx="3" fill="#2E75B6"/><text x="90" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Allow</text><text x="90" y="358" text-anchor="middle" font-size="9" fill="#fff">category</text><text x="200" y="340" text-anchor="start" font-size="10" font-weight="bold" fill="#2E75B6">General M365 services</text><text x="200" y="356" text-anchor="start" font-size="9" fill="#1F3864">Local breakout preferred · Proxy inspection allowed · Steered to best DIA path</text><rect x="30" y="372" width="980" height="48" rx="3" fill="#C55A11" opacity="0.09"/><rect x="30" y="372" width="980" height="48" rx="3" fill="none" stroke="#C55A11" stroke-width="1"/><rect x="30" y="372" width="120" height="48" rx="3" fill="#C55A11"/><text x="90" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Default</text><text x="90" y="410" text-anchor="middle" font-size="9" fill="#fff">category</text><text x="200" y="392" text-anchor="start" font-size="10" font-weight="bold" fill="#C55A11">Non-M365 internet traffic</text><text x="200" y="408" text-anchor="start" font-size="9" fill="#1F3864">Standard security stack applies · TICAP or Umbrella inspection · No special steering</text><text x="520" y="448" text-anchor="middle" font-size="9" fill="#1F3864">Satisfies: SC-8 Transmission Confidentiality · AC-4 Information Flow Enforcement · TIC 3.0 Use Case E (local breakout with branch security stack)</text></svg>