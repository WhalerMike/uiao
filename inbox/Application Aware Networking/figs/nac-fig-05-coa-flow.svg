<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="mNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0D1B2E"/></marker>
    <marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1E8C8C"/></marker>
    <marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C0392B"/></marker>
  </defs>

  <text x="640" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#0D1B2E">RADIUS Change of Authorization — Real-Time VLAN Reassignment</text>
  <text x="640" y="70" text-anchor="middle" font-size="17" fill="#6B7A8D">RFC 5176 CoA closes the window between compliance failure and network enforcement</text>

  <!-- Participant headers -->
  <rect x="80" y="100" width="220" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="190" y="136" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Intune</text>

  <rect x="400" y="100" width="220" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="510" y="126" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Azure Function</text>
  <text x="510" y="148" text-anchor="middle" font-size="14" fill="#33414F">CoA Agent</text>

  <rect x="720" y="100" width="220" height="60" rx="8" fill="#0D1B2E"/>
  <text x="830" y="126" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">NPS RADIUS</text>
  <text x="830" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Server</text>

  <rect x="1020" y="100" width="220" height="60" rx="8" fill="#1E3A66"/>
  <text x="1130" y="136" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Switch</text>

  <!-- Lifelines -->
  <line x1="190" y1="160" x2="190" y2="620" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="510" y1="160" x2="510" y2="620" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="830" y1="160" x2="830" y2="620" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="1130" y1="160" x2="1130" y2="620" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- 1 note at Intune -->
  <rect x="45" y="190" width="390" height="36" rx="6" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="240" y="213" text-anchor="middle" font-size="16" fill="#C0392B">1. Device marked non-compliant (patch overdue)</text>

  <!-- 2 AzFn -> Intune -->
  <line x1="510" y1="262" x2="196" y2="262" stroke="#1E8C8C" stroke-width="2" marker-end="url(#mTeal)"/>
  <text x="350" y="253" text-anchor="middle" font-size="17" fill="#33414F">2. Compliance poll (every 15 min) detects change</text>

  <!-- 3 AzFn -> NPS -->
  <line x1="510" y1="314" x2="824" y2="314" stroke="#0D1B2E" stroke-width="2" marker-end="url(#mNavy)"/>
  <text x="670" y="305" text-anchor="middle" font-size="17" fill="#33414F">3. RADIUS CoA Disconnect (RFC 5176)</text>

  <!-- 4 NPS -> Switch -->
  <line x1="830" y1="366" x2="1124" y2="366" stroke="#0D1B2E" stroke-width="2" marker-end="url(#mNavy)"/>
  <text x="977" y="357" text-anchor="middle" font-size="17" fill="#33414F">4. CoA to port for device MAC</text>

  <!-- 5 note at Switch -->
  <rect x="955" y="396" width="300" height="36" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="1105" y="419" text-anchor="middle" font-size="16" fill="#33414F">5. Force re-authentication on port</text>

  <!-- 6 Switch -> NPS -->
  <line x1="1130" y1="472" x2="836" y2="472" stroke="#1E8C8C" stroke-width="2" marker-end="url(#mTeal)"/>
  <text x="983" y="463" text-anchor="middle" font-size="17" fill="#33414F">6. Device re-authenticates — 802.1X EAP-TLS</text>

  <!-- 7 NPS -> Switch -->
  <line x1="830" y1="524" x2="1124" y2="524" stroke="#1E8C8C" stroke-width="2" marker-end="url(#mTeal)"/>
  <text x="977" y="515" text-anchor="middle" font-size="17" fill="#33414F">7. Access-Accept — VLAN 200 (Remediation)</text>

  <!-- 8 note at Switch -->
  <rect x="975" y="554" width="280" height="36" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="1115" y="577" text-anchor="middle" font-size="16" fill="#33414F">8. Port moved to VLAN 200</text>

  <!-- Elapsed time footer -->
  <rect x="190" y="644" width="900" height="48" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="674" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Total elapsed — Intune state change to VLAN reassignment: under 20 minutes</text>
</svg>
