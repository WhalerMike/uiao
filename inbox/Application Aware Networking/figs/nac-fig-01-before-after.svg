<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="mGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5A5A5A"/></marker>
    <marker id="mGreyR" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#5A5A5A"/></marker>
    <marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C0392B"/></marker>
    <marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1E8C8C"/></marker>
    <marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D4A017"/></marker>
  </defs>

  <text x="640" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E">Network Admission — Before and After 802.1X NAC</text>
  <text x="640" y="76" text-anchor="middle" font-size="18" fill="#6B7A8D">The authentication gate moves from the facility door to the switch port</text>

  <!-- ============ LEFT PANEL: BEFORE ============ -->
  <rect x="40" y="104" width="580" height="586" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="2"/>
  <rect x="40" y="104" width="580" height="46" rx="10" fill="#C0392B"/>
  <rect x="40" y="128" width="580" height="22" fill="#C0392B"/>
  <text x="330" y="134" text-anchor="middle" font-size="21" font-weight="bold" fill="#FFFFFF">BEFORE — No Authentication Gate</text>

  <!-- Laptop -->
  <rect x="230" y="172" width="200" height="70" rx="8" fill="#0D1B2E"/>
  <text x="330" y="201" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Laptop</text>
  <text x="330" y="225" text-anchor="middle" font-size="16" fill="#EAF1FB">no identity asserted</text>

  <line x1="330" y1="242" x2="330" y2="286" stroke="#5A5A5A" stroke-width="2" marker-end="url(#mGrey)"/>
  <text x="345" y="270" font-size="17" fill="#C0392B">link up — no challenge</text>

  <!-- Switch port -->
  <rect x="230" y="290" width="200" height="70" rx="8" fill="#1E3A66"/>
  <text x="330" y="319" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Switch Port</text>
  <text x="330" y="343" text-anchor="middle" font-size="16" fill="#EAF1FB">VLAN set by port config</text>

  <line x1="330" y1="360" x2="330" y2="426" stroke="#C0392B" stroke-width="2.5" marker-end="url(#mRed)"/>
  <text x="345" y="385" font-size="17" fill="#C0392B" font-weight="bold">DHCP lease + routing</text>
  <text x="345" y="407" font-size="17" fill="#C0392B">issued immediately</text>

  <!-- SSA resources -->
  <rect x="200" y="430" width="260" height="92" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="330" y="468" text-anchor="middle" font-size="19" font-weight="bold" fill="#0D1B2E">SSA Internal Resources</text>
  <text x="330" y="496" text-anchor="middle" font-size="16" fill="#33414F">full Layer 3 reachability</text>

  <!-- Gap annotation -->
  <rect x="90" y="560" width="480" height="98" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="330" y="592" text-anchor="middle" font-size="18" font-weight="bold" fill="#C0392B">No authentication gate</text>
  <text x="330" y="617" text-anchor="middle" font-size="16" fill="#C0392B">Physical facility access is the only control</text>
  <text x="330" y="639" text-anchor="middle" font-size="16" fill="#C0392B">on network admission</text>

  <!-- ============ RIGHT PANEL: AFTER ============ -->
  <rect x="660" y="104" width="580" height="586" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="2"/>
  <rect x="660" y="104" width="580" height="46" rx="10" fill="#1E8C8C"/>
  <rect x="660" y="128" width="580" height="22" fill="#1E8C8C"/>
  <text x="950" y="134" text-anchor="middle" font-size="21" font-weight="bold" fill="#FFFFFF">AFTER — 802.1X / EAP-TLS Admission</text>

  <!-- Laptop (supplicant) -->
  <rect x="770" y="168" width="180" height="64" rx="8" fill="#0D1B2E"/>
  <text x="860" y="194" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Laptop</text>
  <text x="860" y="216" text-anchor="middle" font-size="15" fill="#EAF1FB">802.1X supplicant</text>

  <!-- Entra device inventory -->
  <rect x="1030" y="168" width="195" height="64" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1127" y="194" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Entra ID Device</text>
  <text x="1127" y="216" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Inventory</text>

  <!-- EAPOL exchange -->
  <line x1="860" y1="238" x2="860" y2="284" stroke="#5A5A5A" stroke-width="2" marker-start="url(#mGreyR)" marker-end="url(#mGrey)"/>
  <text x="850" y="266" text-anchor="end" font-size="15" fill="#5A5A5A">EAPOL</text>

  <!-- Switch (authenticator) -->
  <rect x="760" y="288" width="200" height="72" rx="8" fill="#1E3A66"/>
  <text x="860" y="317" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Switch / WAP</text>
  <text x="860" y="341" text-anchor="middle" font-size="15" fill="#EAF1FB">authenticator</text>

  <!-- RADIUS -->
  <rect x="1030" y="288" width="195" height="80" rx="8" fill="#0D1B2E"/>
  <text x="1127" y="313" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">RADIUS Server</text>
  <text x="1127" y="335" text-anchor="middle" font-size="14" fill="#EAF1FB">validates machine</text>
  <text x="1127" y="354" text-anchor="middle" font-size="14" fill="#EAF1FB">certificate</text>

  <line x1="964" y1="326" x2="1026" y2="326" stroke="#5A5A5A" stroke-width="2" marker-start="url(#mGreyR)" marker-end="url(#mGrey)"/>
  <text x="995" y="316" text-anchor="middle" font-size="14" fill="#5A5A5A">EAP-TLS over</text>
  <text x="995" y="346" text-anchor="middle" font-size="14" fill="#5A5A5A">RADIUS</text>

  <line x1="1127" y1="284" x2="1127" y2="238" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#mTeal)"/>
  <text x="1237" y="262" text-anchor="end" font-size="13" fill="#1E8C8C">SAN + compliance</text>

  <!-- Fan to VLANs -->
  <line x1="790" y1="360" x2="762" y2="466" stroke="#1E8C8C" stroke-width="2" marker-end="url(#mTeal)"/>
  <line x1="860" y1="360" x2="950" y2="466" stroke="#D4A017" stroke-width="2" marker-end="url(#mAmber)"/>
  <line x1="930" y1="360" x2="1136" y2="466" stroke="#C0392B" stroke-width="2" marker-end="url(#mRed)"/>
  <text x="760" y="415" text-anchor="end" font-size="15" fill="#5A5A5A">VLAN assigned by RADIUS</text>

  <!-- Production VLAN -->
  <rect x="672" y="470" width="176" height="126" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="760" y="498" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Production VLAN</text>
  <text x="760" y="522" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1E8C8C">VLAN 100</text>
  <text x="760" y="546" text-anchor="middle" font-size="15" fill="#33414F">compliant device</text>
  <text x="760" y="570" text-anchor="middle" font-size="15" fill="#33414F">full access per ACL</text>

  <!-- Remediation VLAN -->
  <rect x="862" y="470" width="176" height="126" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="950" y="498" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Remediation VLAN</text>
  <text x="950" y="522" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#33414F">VLAN 200</text>
  <text x="950" y="546" text-anchor="middle" font-size="15" fill="#33414F">non-compliant device</text>
  <text x="950" y="570" text-anchor="middle" font-size="15" fill="#33414F">update endpoints only</text>

  <!-- Quarantine VLAN -->
  <rect x="1052" y="470" width="176" height="126" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="1140" y="498" text-anchor="middle" font-size="17" font-weight="bold" fill="#C0392B">Quarantine VLAN</text>
  <text x="1140" y="522" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#C0392B">VLAN 999</text>
  <text x="1140" y="546" text-anchor="middle" font-size="15" fill="#33414F">no valid certificate</text>
  <text x="1140" y="570" text-anchor="middle" font-size="15" fill="#33414F">Internet-only portal</text>

  <text x="950" y="644" text-anchor="middle" font-size="18" font-weight="bold" fill="#33414F">Routable IP address issued only after VLAN assignment</text>
</svg>
