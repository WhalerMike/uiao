<svg viewBox="0 0 1040 480" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;">
<rect width="1040" height="480" fill="#FFFFFF"/>
<defs>
  <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
    <path d="M0,0 L0,8 L10,4 z" fill="#C55A11"/>
  </marker>
</defs>

<!-- Title -->
<text x="520" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3864">DNS / DHCP / IPAM Modernization — Legacy State vs. FedRAMP 20x Target</text>
<text x="520" y="46" text-anchor="middle" font-size="11" fill="#2E75B6">Replacing manual, fragmented address management with a policy-driven DDI control plane</text>

<!-- ── LEGACY side (left) ── -->
<rect x="20" y="60" width="450" height="390" rx="8" fill="#FFF8F0" stroke="#C55A11" stroke-width="2"/>
<rect x="20" y="60" width="450" height="36" rx="8" fill="#C55A11"/>
<text x="245" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">LEGACY STATE</text>

<!-- Excel spreadsheet icon -->
<rect x="50" y="118" width="120" height="80" rx="4" fill="#FFFFFF" stroke="#CCC" stroke-width="1.5"/>
<rect x="50" y="118" width="120" height="20" rx="2" fill="#375623"/>
<text x="110" y="132" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">IPAM.xlsx</text>
<line x1="70" y1="148" x2="150" y2="148" stroke="#DDD" stroke-width="1"/>
<line x1="70" y1="162" x2="150" y2="162" stroke="#DDD" stroke-width="1"/>
<line x1="70" y1="176" x2="150" y2="176" stroke="#DDD" stroke-width="1"/>
<line x1="100" y1="138" x2="100" y2="188" stroke="#DDD" stroke-width="1"/>
<text x="85" y="146" font-size="7" fill="#666">IP</text>
<text x="128" y="146" font-size="7" fill="#666">Hostname</text>
<text x="110" y="157" text-anchor="middle" font-size="7" fill="#B71C1C">stale data</text>
<text x="110" y="195" text-anchor="middle" font-size="9" fill="#8B1A1A">Manual spreadsheet — no automation</text>

<!-- DNS icon (legacy) -->
<rect x="210" y="118" width="120" height="80" rx="4" fill="#FFFFFF" stroke="#CCC" stroke-width="1.5"/>
<rect x="210" y="118" width="120" height="20" rx="2" fill="#607D8B"/>
<text x="270" y="132" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">BIND / Windows DNS</text>
<text x="270" y="160" text-anchor="middle" font-size="24" fill="#607D8B">⚙</text>
<text x="270" y="185" text-anchor="middle" font-size="9" fill="#607D8B">Hand-edited zone files</text>
<text x="270" y="197" text-anchor="middle" font-size="9" fill="#B71C1C">no audit trail</text>

<!-- DHCP icon (legacy) -->
<rect x="350" y="118" width="100" height="80" rx="4" fill="#FFFFFF" stroke="#CCC" stroke-width="1.5"/>
<rect x="350" y="118" width="100" height="20" rx="2" fill="#607D8B"/>
<text x="400" y="132" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">DHCP Server</text>
<text x="400" y="160" text-anchor="middle" font-size="22" fill="#607D8B">📋</text>
<text x="400" y="185" text-anchor="middle" font-size="9" fill="#607D8B">Isolated scopes</text>
<text x="400" y="197" text-anchor="middle" font-size="9" fill="#B71C1C">no IPAM link</text>

<!-- Legacy Problems -->
<rect x="40" y="220" width="410" height="205" rx="6" fill="#FEE2E2" stroke="#C00000" stroke-width="1"/>
<text x="245" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#C00000">Compliance Gaps</text>
<text x="55" y="262" font-size="10" fill="#7F1D1D">✕  IP conflicts: no single source of truth for address allocation</text>
<text x="55" y="280" font-size="10" fill="#7F1D1D">✕  DNS drift: zone files diverge from DHCP leases within hours</text>
<text x="55" y="298" font-size="10" fill="#7F1D1D">✕  No CM-8 inventory: shadow assets with no DNS record</text>
<text x="55" y="316" font-size="10" fill="#7F1D1D">✕  No AU-12: manual DNS edits leave no audit log</text>
<text x="55" y="334" font-size="10" fill="#7F1D1D">✕  No SC-20: unsigned zones, no DNSSEC</text>
<text x="55" y="352" font-size="10" fill="#7F1D1D">✕  No CM-2: zone configs not in version control / IaC</text>
<text x="55" y="370" font-size="10" fill="#7F1D1D">✕  Multi-cloud blind: AWS / Azure / OCI IP spaces uncoordinated</text>
<text x="55" y="388" font-size="10" fill="#7F1D1D">✕  No Closure Necessity path: these gaps block FedRAMP 20x KSIs</text>
<text x="55" y="406" font-size="10" fill="#7F1D1D">✕  Cert-to-DNS binding absent: SCEP enrollment not linked to DNS A record</text>

<!-- ── CENTER ARROW ── -->
<text x="520" y="265" text-anchor="middle" font-size="11" fill="#C55A11" font-weight="bold">FedRAMP 20x</text>
<text x="520" y="283" text-anchor="middle" font-size="11" fill="#C55A11" font-weight="bold">Modernization</text>
<line x1="475" y1="272" x2="565" y2="272" stroke="#C55A11" stroke-width="3" marker-end="url(#arw)"/>

<!-- ── MODERN side (right) ── -->
<rect x="570" y="60" width="450" height="390" rx="8" fill="#EBF5FF" stroke="#2E75B6" stroke-width="2"/>
<rect x="570" y="60" width="450" height="36" rx="8" fill="#1F3864"/>
<text x="795" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">FedRAMP 20x TARGET STATE</text>

<!-- InfoBlox Grid Master box -->
<rect x="650" y="108" width="290" height="105" rx="6" fill="#1F3864"/>
<text x="795" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">InfoBlox NIOS Grid Master</text>
<text x="795" y="148" text-anchor="middle" font-size="10" fill="#9DC3E6">On-Premises VMware ESXi — Hub</text>
<text x="795" y="168" text-anchor="middle" font-size="10" fill="#BDD7EE">DNS · DHCP · IPAM — unified control plane</text>
<text x="795" y="186" text-anchor="middle" font-size="10" fill="#BDD7EE">IaC-managed via Terraform provider</text>
<text x="795" y="202" text-anchor="middle" font-size="9" fill="#9DC3E6">Grid replication to: AWS GovCloud · Azure Gov · OCI · on-prem spokes</text>

<!-- Modern Capabilities -->
<rect x="590" y="225" width="410" height="205" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
<text x="795" y="247" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">FedRAMP 20x Closure</text>
<text x="605" y="267" font-size="10" fill="#1B5E20">✓  CM-8: every IP allocation creates a DNS A/PTR + IPAM record automatically</text>
<text x="605" y="285" font-size="10" fill="#1B5E20">✓  AU-12: every DNS change logged with actor, timestamp, before/after (SIEM feed)</text>
<text x="605" y="303" font-size="10" fill="#1B5E20">✓  SC-20: DNSSEC signs all authoritative zones; chain of trust validated</text>
<text x="605" y="321" font-size="10" fill="#1B5E20">✓  CM-2: zone baseline stored in Git; Terraform drift detection on every change</text>
<text x="605" y="339" font-size="10" fill="#1B5E20">✓  SC-22: split-horizon views isolate public, cloud, and on-prem namespaces</text>
<text x="605" y="357" font-size="10" fill="#1B5E20">✓  SA-9: Grid Members in each cloud environment enforce namespace policy</text>
<text x="605" y="375" font-size="10" fill="#1B5E20">✓  FedRAMP ATO path: Path A (BloxOne DDI, inherited CSO) or Path B (NIOS, agency boundary)</text>
<text x="605" y="393" font-size="10" fill="#1B5E20">✓  Cert binding: SCEP enrollment triggered at DNS A record creation for workloads</text>
<text x="605" y="411" font-size="10" fill="#1B5E20">✓  Least-privilege zones: DNS / DHCP / SCEP delegated to owning CIO Component</text>
</svg>