<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#F2F2F2" rx="8"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="48" fill="#1F3864" rx="8"/>
  <rect x="0" y="30" width="900" height="18" fill="#1F3864"/>
  <text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#FFFFFF">Fig 3 — Federal Incident Notification Timeline (FISMA / CISA / OMB)</text>

  <!-- Timeline spine -->
  <line x1="60" y1="200" x2="860" y2="200" stroke="#1F3864" stroke-width="3"/>
  <!-- Arrow at end -->
  <polygon points="855,194 870,200 855,206" fill="#1F3864"/>

  <!-- Timeline milestones — positions and data -->
  <!-- T+0 -->
  <circle cx="90" cy="200" r="14" fill="#C55A11" stroke="#FFFFFF" stroke-width="2"/>
  <text x="90" y="205" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#FFFFFF">T+0</text>
  <rect x="30" y="220" width="120" height="80" rx="6" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.5"/>
  <text x="90" y="240" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#C55A11">DETECTION</text>
  <text x="90" y="257" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Incident detected</text>
  <text x="90" y="272" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Sentinel alert / user</text>
  <text x="90" y="287" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">report received</text>

  <!-- T+1hr -->
  <circle cx="220" cy="200" r="14" fill="#1F7391" stroke="#FFFFFF" stroke-width="2"/>
  <text x="220" y="197" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#FFFFFF">T+</text>
  <text x="220" y="208" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#FFFFFF">1hr</text>
  <rect x="30" y="100" width="120" height="80" rx="6" fill="#DEEAF1" stroke="#1F7391" stroke-width="1.5"/>
  <line x1="220" y1="186" x2="220" y2="180" stroke="#1F7391" stroke-width="1.5"/>
  <line x1="220" y1="180" x2="90" y2="180" stroke="#1F7391" stroke-width="1.5"/>
  <line x1="90" y1="180" x2="90" y2="180" stroke="#1F7391" stroke-width="1.5"/>
  <text x="160" y="175" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#1F7391">above timeline</text>
  <rect x="160" y="100" width="120" height="80" rx="6" fill="#DEEAF1" stroke="#1F7391" stroke-width="1.5"/>
  <text x="220" y="120" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#1F7391">INTERNAL</text>
  <text x="220" y="135" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#1F7391">ESCALATION</text>
  <text x="220" y="152" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">IC notified</text>
  <text x="220" y="167" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">CISO briefed (P1)</text>
  <line x1="220" y1="186" x2="220" y2="180" stroke="#1F7391" stroke-width="1.5"/>

  <!-- T+4hr -->
  <circle cx="380" cy="200" r="14" fill="#C00000" stroke="#FFFFFF" stroke-width="2"/>
  <text x="380" y="197" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#FFFFFF">T+</text>
  <text x="380" y="208" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#FFFFFF">4hr</text>
  <rect x="320" y="220" width="120" height="90" rx="6" fill="#FDECEA" stroke="#C00000" stroke-width="2"/>
  <text x="380" y="240" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="bold" fill="#C00000">CISA INITIAL</text>
  <text x="380" y="255" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="bold" fill="#C00000">NOTIFICATION</text>
  <text x="380" y="272" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">SSA target: 4hr</text>
  <text x="380" y="287" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">US-CERT portal</text>
  <text x="380" y="302" text-anchor="middle" font-family="Arial" font-size="8" fill="#C00000" font-style="italic">SSA internal target</text>
  <!-- MANDATORY badge -->
  <rect x="326" y="316" width="108" height="16" rx="4" fill="#C00000"/>
  <text x="380" y="328" text-anchor="middle" font-family="Arial" font-size="8.5" font-weight="bold" fill="#FFFFFF">MANDATORY (P1)</text>

  <!-- T+24hr -->
  <circle cx="520" cy="200" r="14" fill="#C55A11" stroke="#FFFFFF" stroke-width="2"/>
  <text x="520" y="197" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#FFFFFF">T+</text>
  <text x="520" y="208" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#FFFFFF">24hr</text>
  <rect x="460" y="100" width="120" height="90" rx="6" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.5"/>
  <text x="520" y="120" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="bold" fill="#C55A11">FBI NOTIFICATION</text>
  <text x="520" y="137" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">If criminal activity</text>
  <text x="520" y="152" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">suspected (nation-</text>
  <text x="520" y="167" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">state / financial fraud)</text>
  <text x="520" y="182" text-anchor="middle" font-family="Arial" font-size="8" fill="#C55A11" font-style="italic">FBI IC3 / Field Office</text>
  <line x1="520" y1="186" x2="520" y2="190" stroke="#C55A11" stroke-width="1.5"/>
  <!-- OPTIONAL badge -->
  <rect x="466" y="80" width="108" height="16" rx="4" fill="#C55A11"/>
  <text x="520" y="92" text-anchor="middle" font-family="Arial" font-size="8.5" font-weight="bold" fill="#FFFFFF">CONDITIONAL</text>

  <!-- T+72hr -->
  <circle cx="660" cy="200" r="14" fill="#C00000" stroke="#FFFFFF" stroke-width="3"/>
  <text x="660" y="197" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#FFFFFF">T+</text>
  <text x="660" y="208" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#FFFFFF">72hr</text>
  <rect x="600" y="220" width="120" height="100" rx="6" fill="#FDECEA" stroke="#C00000" stroke-width="2.5"/>
  <text x="660" y="240" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="bold" fill="#C00000">CISA MANDATORY</text>
  <text x="660" y="255" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="bold" fill="#C00000">REPORT DUE</text>
  <text x="660" y="272" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">FISMA statutory</text>
  <text x="660" y="287" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">deadline</text>
  <text x="660" y="302" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Full incident report</text>
  <text x="660" y="317" text-anchor="middle" font-family="Arial" font-size="8" fill="#C00000" font-style="italic">US-CERT portal</text>
  <rect x="606" y="330" width="108" height="16" rx="4" fill="#C00000"/>
  <text x="660" y="342" text-anchor="middle" font-family="Arial" font-size="8.5" font-weight="bold" fill="#FFFFFF">MANDATORY (ALL P1)</text>

  <!-- T+7d -->
  <circle cx="780" cy="200" r="14" fill="#1F3864" stroke="#FFFFFF" stroke-width="2"/>
  <text x="780" y="197" text-anchor="middle" font-family="Arial" font-size="7.5" font-weight="bold" fill="#FFFFFF">T+7d</text>
  <text x="780" y="208" text-anchor="middle" font-family="Arial" font-size="7.5" font-weight="bold" fill="#FFFFFF"></text>
  <rect x="720" y="100" width="140" height="90" rx="6" fill="#DEEAF1" stroke="#1F3864" stroke-width="1.5"/>
  <text x="790" y="119" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="bold" fill="#1F3864">OMB MAJOR</text>
  <text x="790" y="134" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="bold" fill="#1F3864">INCIDENT REPORT</text>
  <text x="790" y="151" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">If major incident</text>
  <text x="790" y="166" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">determined by CISO</text>
  <text x="790" y="181" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">Congressional notify</text>
  <line x1="780" y1="186" x2="780" y2="190" stroke="#1F3864" stroke-width="1.5"/>
  <rect x="726" y="80" width="128" height="16" rx="4" fill="#1F3864"/>
  <text x="790" y="92" text-anchor="middle" font-family="Arial" font-size="8.5" font-weight="bold" fill="#FFFFFF">CONDITIONAL (Major)</text>

  <!-- T+30d note at bottom -->
  <rect x="30" y="380" width="840" height="54" rx="6" fill="#E2EFDA" stroke="#375623" stroke-width="1.5"/>
  <text x="450" y="400" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#375623">T+30 days — Post-Incident Review (PIR) Completed</text>
  <text x="450" y="418" text-anchor="middle" font-family="Arial" font-size="10" fill="#1F3864">PIR report finalized | Final CISA update submitted | Lessons learned → POA&amp;M entries | ISAC threat intel shared (sanitized)</text>
  <text x="450" y="433" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#1F3864">Required for all P1 incidents and P2 incidents with mandatory CISA notification</text>

  <!-- Legend -->
  <rect x="30" y="444" width="840" height="28" fill="#FFFFFF" rx="6" stroke="#595959" stroke-width="0.5"/>
  <rect x="42" y="451" width="14" height="14" fill="#C00000" rx="2"/>
  <text x="62" y="462" font-family="Arial" font-size="9" fill="#595959">Mandatory (all P1)</text>
  <rect x="180" y="451" width="14" height="14" fill="#C55A11" rx="2"/>
  <text x="200" y="462" font-family="Arial" font-size="9" fill="#595959">Conditional (criminal/major)</text>
  <rect x="370" y="451" width="14" height="14" fill="#1F7391" rx="2"/>
  <text x="390" y="462" font-family="Arial" font-size="9" fill="#595959">Internal (always)</text>
  <rect x="500" y="451" width="14" height="14" fill="#375623" rx="2"/>
  <text x="520" y="462" font-family="Arial" font-size="9" fill="#595959">PIR (P1 + notified P2)</text>
  <text x="700" y="462" font-family="Arial" font-size="9" fill="#595959">IR-6 | FISMA §3553 | OMB M-20-04</text>
</svg>