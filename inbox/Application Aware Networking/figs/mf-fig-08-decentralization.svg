  <text x="450" y="185" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="bold">Late 1980s:</text>
  <text x="450" y="200" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="bold">PC Revolution</text>
  <polygon points="500,185 515,190 500,195" fill="#FFFFFF"/>

  <!-- AFTER: 12 scattered servers -->
