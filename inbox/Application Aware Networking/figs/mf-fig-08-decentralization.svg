<svg width="900" height="480" viewBox="0 0 900 480"
     xmlns="http://www.w3.org/2000/svg" style="background:#FFFFFF;font-family:Arial,sans-serif">

  <rect width="900" height="480" fill="#FFFFFF"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="48" fill="#1F3864"/>
  <text x="450" y="31" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="bold">Act 1 &#x2014; The Great Decentralization: One Became Twelve</text>

  <!-- LEFT panel label -->
  <rect x="10" y="54" width="380" height="26" rx="4" fill="#375623"/>
  <text x="200" y="72" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">1940s&#x2013;1988: Single Source of Truth</text>

  <!-- RIGHT panel label -->
  <rect x="510" y="54" width="380" height="26" rx="4" fill="#C00000"/>
  <text x="700" y="72" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">1988&#x2013;2000: Distributed Truth (Schema Drift)</text>

  <!-- BEFORE: single mainframe -->
  <rect x="155" y="110" width="90" height="150" rx="8" fill="#1F3864" stroke="#2E75B6" stroke-width="2"/>
  <text x="200" y="148" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">IBM</text>
  <text x="200" y="163" text-anchor="middle" fill="#FFFFFF" font-size="9">Mainframe</text>
  <!-- DB cylinder -->
  <ellipse cx="200" cy="220" rx="28" ry="8" fill="#C55A11"/>
