  <ellipse cx="200" cy="250" rx="28" ry="8" fill="#C55A11" opacity="0.8"/>
  <text x="200" y="239" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="bold">SSOT</text>

  <!-- Green glow around BEFORE -->
  <ellipse cx="200" cy="280" rx="60" ry="12" fill="none" stroke="#375623" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Terminals in BEFORE -->
  <rect x="90" y="145" width="30" height="20" rx="2" fill="#375623" stroke="#FFFFFF" stroke-width="1"/>
  <rect x="94" y="149" width="22" height="12" fill="#00CC00" opacity="0.7"/>
  <line x1="120" y1="155" x2="155" y2="175" stroke="#2E75B6" stroke-width="1.5"/>

  <rect x="90" y="220" width="30" height="20" rx="2" fill="#375623" stroke="#FFFFFF" stroke-width="1"/>
  <rect x="94" y="224" width="22" height="12" fill="#00CC00" opacity="0.7"/>
  <line x1="120" y1="230" x2="155" y2="210" stroke="#2E75B6" stroke-width="1.5"/>

  <rect x="280" y="145" width="30" height="20" rx="2" fill="#375623" stroke="#FFFFFF" stroke-width="1"/>
  <rect x="284" y="149" width="22" height="12" fill="#00CC00" opacity="0.7"/>
  <line x1="280" y1="155" x2="245" y2="175" stroke="#2E75B6" stroke-width="1.5"/>

  <rect x="280" y="220" width="30" height="20" rx="2" fill="#375623" stroke="#FFFFFF" stroke-width="1"/>
  <rect x="284" y="224" width="22" height="12" fill="#00CC00" opacity="0.7"/>
  <line x1="280" y1="230" x2="245" y2="210" stroke="#2E75B6" stroke-width="1.5"/>

  <text x="200" y="310" text-anchor="middle" fill="#375623" font-size="10" font-weight="bold">Unity. One truth.</text>

  <!-- CENTER ARROW -->
