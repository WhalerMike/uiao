  <!-- Dashed sync lines with ? -->
  <line x1="585" y1="131" x2="620" y2="131" stroke="#C00000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="670" y1="131" x2="705" y2="131" stroke="#C00000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="560" y1="161" x2="560" y2="205" stroke="#C00000" stroke-width="1.5" stroke-dasharray="4,3"/>
