  <text x="688" y="127" text-anchor="middle" fill="#C00000" font-size="12" font-weight="bold">?</text>

  <!-- Schema drift callout -->
  <rect x="540" y="398" width="340" height="50" rx="6" fill="#F2F2F2" stroke="#C00000" stroke-width="1.5"/>
  <text x="710" y="420" text-anchor="middle" fill="#C00000" font-size="11" font-weight="bold">Schema Drift &#x2014; The Original Sin</text>
