  <text x="879" y="105" font-family="Arial,sans-serif" font-size="8.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Human Resources</text>
  <rect x="588" y="145" width="64" height="18" fill="#FCE4EC" rx="3" stroke="#C00000" stroke-width="1.5"/>
  <text x="620" y="158" font-family="Arial,sans-serif" font-size="8.5" fill="#C00000" text-anchor="middle" font-weight="bold">BLOCKED (IB)</text>
  <text x="515" y="180" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">• New-InformationBarrierSegment — 5 segments defined</text>
  <text x="515" y="198" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">• New-InformationBarrierPolicy — Benefits ↔ Disability BLOCK</text>
  <text x="515" y="216" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">• Start-InformationBarrierPoliciesApplication — active</text>
  <text x="515" y="234" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">• Scope: Teams chat + channels + SharePoint + OneDrive</text>
  <text x="515" y="252" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">• Regulatory basis: SSA administrative law (pre-decisional)</text>
  <text x="25" y="335" font-family="Arial,sans-serif" font-size="9.5" fill="#C55A11" text-anchor="start" font-weight="bold">Policy Name:</text>
  <text x="150" y="335" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">SSA-Teams-DLP-PII (Purview Compliance)</text>
