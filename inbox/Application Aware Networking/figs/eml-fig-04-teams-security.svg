  <text x="25" y="465" font-family="Arial,sans-serif" font-size="9.5" fill="#C55A11" text-anchor="start" font-weight="bold">Policy Tip:</text>
  <text x="150" y="465" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">"This message contains PII. Use encrypted email instead."</text>
  <line x1="20" y1="473" x2="450" y2="473" stroke="#F2F2F2" stroke-width="1"/>
  <text x="25" y="491" font-family="Arial,sans-serif" font-size="9.5" fill="#C55A11" text-anchor="start" font-weight="bold">Incident Report:</text>
  <text x="150" y="491" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">SiteAdmin notified; includes all content for review</text>
  <line x1="20" y1="499" x2="450" y2="499" stroke="#F2F2F2" stroke-width="1"/>
  <text x="515" y="335" font-family="Arial,sans-serif" font-size="9.5" fill="#FFFFFF" text-anchor="start" font-weight="bold">Lobby Policy:</text>
  <text x="640" y="335" font-family="Arial,sans-serif" font-size="9" fill="#9DC3E6" text-anchor="start">External users held in lobby — organizer admits</text>
  <line x1="510" y1="343" x2="940" y2="343" stroke="#2E75B6" stroke-width="1"/>
  <text x="515" y="361" font-family="Arial,sans-serif" font-size="9.5" fill="#FFFFFF" text-anchor="start" font-weight="bold">Anonymous Users:</text>
  <text x="640" y="361" font-family="Arial,sans-serif" font-size="9" fill="#9DC3E6" text-anchor="start">Cannot start or dial out from meetings</text>
  <line x1="510" y1="369" x2="940" y2="369" stroke="#2E75B6" stroke-width="1"/>
