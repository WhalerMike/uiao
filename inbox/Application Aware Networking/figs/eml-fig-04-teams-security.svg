  <text x="640" y="387" font-family="Arial,sans-serif" font-size="9" fill="#9DC3E6" text-anchor="start">Available for 1:1 and small meetings (toggle)</text>
  <line x1="510" y1="395" x2="940" y2="395" stroke="#2E75B6" stroke-width="1"/>
  <text x="515" y="413" font-family="Arial,sans-serif" font-size="9.5" fill="#FFFFFF" text-anchor="start" font-weight="bold">Recording:</text>
  <text x="640" y="413" font-family="Arial,sans-serif" font-size="9" fill="#9DC3E6" text-anchor="start">Stored in OneDrive; inherits meeting sensitivity label</text>
