  <text x="130" y="90" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">hhs.gov | cms.gov | cdc.gov | treasury.gov | opm.gov</text>
  <rect x="20" y="106" width="100" height="18" fill="#D6E4F0" rx="3"/>
  <text x="70" y="118" font-family="Arial,sans-serif" font-size="9" fill="#1F7391" text-anchor="middle" font-weight="bold">Guest Federation:</text>
  <text x="130" y="118" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">Set-CsTenantFederationConfiguration — allowlist-only</text>
  <rect x="20" y="134" width="100" height="18" fill="#D6E4F0" rx="3"/>
  <text x="70" y="146" font-family="Arial,sans-serif" font-size="9" fill="#1F7391" text-anchor="middle" font-weight="bold">Conditional Access:</text>
  <text x="130" y="146" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">Guest MFA required; Compliant device preferred</text>
  <rect x="20" y="162" width="100" height="18" fill="#D6E4F0" rx="3"/>
  <text x="70" y="174" font-family="Arial,sans-serif" font-size="9" fill="#1F7391" text-anchor="middle" font-weight="bold">Guest Permissions:</text>
  <text x="130" y="174" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">No Teams creation, no app install, no org chart view</text>
  <rect x="20" y="190" width="100" height="18" fill="#D6E4F0" rx="3"/>
  <text x="70" y="202" font-family="Arial,sans-serif" font-size="9" fill="#1F7391" text-anchor="middle" font-weight="bold">Guest Expiration:</text>
  <text x="130" y="202" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">B2B Collaboration access reviewed every 90 days</text>
  <rect x="20" y="218" width="100" height="18" fill="#D6E4F0" rx="3"/>
  <text x="70" y="230" font-family="Arial,sans-serif" font-size="9" fill="#1F7391" text-anchor="middle" font-weight="bold">Lobby Policy:</text>
  <text x="130" y="230" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">AutoAdmittedUsers = EveryoneInCompanyExcludingGuests</text>
