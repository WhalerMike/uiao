  <text x="25" y="439" font-family="Arial,sans-serif" font-size="9.5" fill="#C55A11" text-anchor="start" font-weight="bold">Credit Card:</text>
  <text x="150" y="439" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">High-confidence CC → Block + incident report generated</text>
