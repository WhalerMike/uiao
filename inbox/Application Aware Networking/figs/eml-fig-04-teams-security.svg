  <text x="640" y="439" font-family="Arial,sans-serif" font-size="9" fill="#9DC3E6" text-anchor="start">Guests cannot request control of screen sharing</text>
  <line x1="510" y1="447" x2="940" y2="447" stroke="#2E75B6" stroke-width="1"/>
  <text x="515" y="465" font-family="Arial,sans-serif" font-size="9.5" fill="#FFFFFF" text-anchor="start" font-weight="bold">Meeting Chat:</text>
  <text x="640" y="465" font-family="Arial,sans-serif" font-size="9" fill="#9DC3E6" text-anchor="start">Scanned by Safe Links + DLP policy in real-time</text>
