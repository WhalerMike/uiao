  <text x="150" y="361" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">Teams chat + channels + SharePoint + OneDrive + Exchange</text>
  <line x1="20" y1="369" x2="450" y2="369" stroke="#F2F2F2" stroke-width="1"/>
  <text x="25" y="387" font-family="Arial,sans-serif" font-size="9.5" fill="#C55A11" text-anchor="start" font-weight="bold">SSN Pattern:</text>
  <text x="150" y="387" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">High-confidence SSN → Block + policy tip to sender</text>
  <line x1="20" y1="395" x2="450" y2="395" stroke="#F2F2F2" stroke-width="1"/>
  <text x="25" y="413" font-family="Arial,sans-serif" font-size="9.5" fill="#C55A11" text-anchor="start" font-weight="bold">Bank Account:</text>
  <text x="150" y="413" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">High-confidence bank account → Block + admin alert</text>
