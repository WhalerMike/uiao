<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="1080" height="480">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#595959"/>
    </marker>
    <marker id="arr_w" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FFFFFF"/>
    </marker>
    <marker id="arr_g" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#375623"/>
    </marker>
    <marker id="arr_r" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C00000"/>
    </marker>
    <marker id="arr_b" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2E75B6"/>
    </marker>
  </defs>

<rect width="1080" height="480" fill="#F2F2F2"/>
<rect x="0" y="0" width="1080" height="38" rx="0" fill="#1F3864" stroke="none" stroke-width="1.2"/>
<text x="540" y="25" font-family="Arial,sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle">Windows Defender Application Control (WDAC) — Policy Lifecycle</text>
<rect x="20" y="55" width="190" height="290" rx="6" fill="#2E75B6" stroke="#AAAAAA" stroke-width="1.2"/>
<text x="115" y="76" font-family="Arial,sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle">1  AUDIT MODE</text>
<rect x="30" y="86" width="170" height="50" rx="4" fill="#1A4F80" stroke="none" stroke-width="1.2"/>
<text x="115" y="102" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#9DC3E6" text-anchor="middle">Deploy via Intune</text>
<text x="115" y="118" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">Endpoint Security →</text>
<text x="115" y="131" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">App Control for Business</text>
<rect x="30" y="144" width="170" height="40" rx="4" fill="#1A4F80" stroke="none" stroke-width="1.2"/>
<text x="115" y="159" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#9DC3E6" text-anchor="middle">Policy Option 3 SET</text>
<text x="115" y="174" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">(AuditMode enabled)</text>
<rect x="30" y="192" width="170" height="40" rx="4" fill="#1A4F80" stroke="none" stroke-width="1.2"/>
<text x="115" y="207" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#70AD47" text-anchor="middle">No execution blocked</text>
<text x="115" y="222" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">Events logged only</text>
<rect x="30" y="240" width="170" height="40" rx="4" fill="#1A4F80" stroke="none" stroke-width="1.2"/>
<text x="115" y="255" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#9DC3E6" text-anchor="middle">Base: DefaultWindows</text>
<text x="115" y="270" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">+ Publisher rules</text>
<rect x="30" y="288" width="170" height="50" rx="4" fill="#1A4F80" stroke="none" stroke-width="1.2"/>
<text x="115" y="303" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">Duration: 30 days</text>
<text x="115" y="318" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">across device sample</text>
<text x="115" y="333" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#9DC3E6" text-anchor="middle">(5% of fleet)</text>
<line x1="210" y1="200" x2="244" y2="200" stroke="#595959" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="250" y="55" width="185" height="290" rx="6" fill="#1F7391" stroke="#AAAAAA" stroke-width="1.2"/>
<text x="342" y="76" font-family="Arial,sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle">2  LOG ANALYSIS</text>
<rect x="260" y="86" width="165" height="50" rx="4" fill="#155B69" stroke="none" stroke-width="1.2"/>
<text x="342" y="102" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#9DC3E6" text-anchor="middle">CodeIntegrity/Operational</text>
<text x="342" y="118" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">Event ID 3076 = Audit block</text>
<text x="342" y="131" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">Event ID 3077 = Enforce block</text>
<rect x="260" y="144" width="165" height="40" rx="4" fill="#155B69" stroke="none" stroke-width="1.2"/>
<text x="342" y="159" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#9DC3E6" text-anchor="middle">Fields Captured:</text>
<text x="342" y="174" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">FileName | SHA256 | Signer</text>
<rect x="260" y="192" width="165" height="40" rx="4" fill="#155B69" stroke="none" stroke-width="1.2"/>
<text x="342" y="207" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#9DC3E6" text-anchor="middle">Export-Csv analysis</text>
<text x="342" y="222" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">Pivot by publisher / hash</text>
<rect x="260" y="240" width="165" height="80" rx="4" fill="#155B69" stroke="none" stroke-width="1.2"/>
<text x="342" y="257" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">Categorize results:</text>
<text x="342" y="272" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#70AD47" text-anchor="middle">✓ Legitimate software</text>
<text x="342" y="287" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFCC00" text-anchor="middle">? Unknown — investigate</text>
<text x="342" y="302" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FF6666" text-anchor="middle">✗ Malicious — block</text>
<line x1="435" y1="200" x2="469" y2="200" stroke="#595959" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="475" y="55" width="185" height="290" rx="6" fill="#C55A11" stroke="#AAAAAA" stroke-width="1.2"/>
<text x="567" y="76" font-family="Arial,sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle">3  POLICY REFINEMENT</text>
<rect x="485" y="86" width="165" height="40" rx="4" fill="#A04A0E" stroke="none" stroke-width="1.2"/>
<text x="567" y="102" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#9DC3E6" text-anchor="middle">Add Publisher Rules</text>
<text x="567" y="118" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">for signed vendors</text>
<rect x="485" y="134" width="165" height="40" rx="4" fill="#A04A0E" stroke="none" stroke-width="1.2"/>
<text x="567" y="149" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#9DC3E6" text-anchor="middle">Add Hash Rules</text>
<text x="567" y="165" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">for specific unsigned binaries</text>
<rect x="485" y="182" width="165" height="40" rx="4" fill="#A04A0E" stroke="none" stroke-width="1.2"/>
<text x="567" y="197" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#9DC3E6" text-anchor="middle">Managed Installer Trust</text>
<text x="567" y="213" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">Intune → auto-trusted</text>
<rect x="485" y="230" width="165" height="40" rx="4" fill="#A04A0E" stroke="none" stroke-width="1.2"/>
<text x="567" y="247" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#9DC3E6" text-anchor="middle">Increment PolicyVersion</text>
<text x="567" y="263" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">Intune detects + redeploys</text>
<rect x="485" y="278" width="165" height="60" rx="4" fill="#A04A0E" stroke="none" stroke-width="1.2"/>
<text x="567" y="296" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">Merge-CIPolicy combines</text>
<text x="567" y="311" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">base + supplement policies</text>
<text x="567" y="326" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#9DC3E6" text-anchor="middle">into single .p7b binary</text>
<line x1="660" y1="200" x2="694" y2="200" stroke="#595959" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="700" y="55" width="185" height="290" rx="6" fill="#375623" stroke="#AAAAAA" stroke-width="1.2"/>
<text x="792" y="76" font-family="Arial,sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle">4  ENFORCE MODE</text>
<rect x="710" y="86" width="165" height="40" rx="4" fill="#2A4A1C" stroke="none" stroke-width="1.2"/>
<text x="792" y="102" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#70AD47" text-anchor="middle">Option 3 REMOVED</text>
<text x="792" y="118" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">Enforcement = default</text>
<rect x="710" y="134" width="165" height="40" rx="4" fill="#2A4A1C" stroke="none" stroke-width="1.2"/>
<text x="792" y="149" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#9DC3E6" text-anchor="middle">Deploy to pilot group</text>
<text x="792" y="165" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">10% of fleet first</text>
<rect x="710" y="182" width="165" height="40" rx="4" fill="#2A4A1C" stroke="none" stroke-width="1.2"/>
<text x="792" y="197" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#9DC3E6" text-anchor="middle">Monitor Event ID 3077</text>
<text x="792" y="213" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">Unexpected blocks → refine</text>
<rect x="710" y="230" width="165" height="40" rx="4" fill="#2A4A1C" stroke="none" stroke-width="1.2"/>
<text x="792" y="247" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#70AD47" text-anchor="middle">Broad deploy: 90% fleet</text>
<text x="792" y="263" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">After 2-week pilot clean</text>
<rect x="710" y="278" width="165" height="60" rx="4" fill="#2A4A1C" stroke="none" stroke-width="1.2"/>
<text x="792" y="295" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#FF6666" text-anchor="middle">Unsigned binaries BLOCKED</text>
<text x="792" y="312" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">at kernel before execution</text>
<text x="792" y="328" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#70AD47" text-anchor="middle">CM-7  |  CM-11 satisfied</text>
<line x1="885" y1="200" x2="919" y2="200" stroke="#595959" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="925" y="55" width="135" height="290" rx="6" fill="#1F3864" stroke="#AAAAAA" stroke-width="1.2"/>
<text x="992" y="76" font-family="Arial,sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle">5  MANAGED</text>
<text x="992" y="91" font-family="Arial,sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle">INSTALLER</text>
<rect x="935" y="104" width="115" height="50" rx="4" fill="#162B4A" stroke="none" stroke-width="1.2"/>
<text x="992" y="122" font-family="Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#9DC3E6" text-anchor="middle">Intune (MEM)</text>
<text x="992" y="137" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">designated as</text>
<text x="992" y="150" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">trusted installer</text>
<rect x="935" y="162" width="115" height="50" rx="4" fill="#162B4A" stroke="none" stroke-width="1.2"/>
<text x="992" y="178" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">Software deployed</text>
<text x="992" y="193" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">via Intune tagged:</text>
<text x="992" y="208" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#9DC3E6" text-anchor="middle">ManagedInstaller</text>
<rect x="935" y="220" width="115" height="50" rx="4" fill="#162B4A" stroke="none" stroke-width="1.2"/>
<text x="992" y="237" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">No explicit hash</text>
<text x="992" y="252" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">rule required per</text>
<text x="992" y="267" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#9DC3E6" text-anchor="middle">deployed app</text>
<rect x="935" y="278" width="115" height="60" rx="4" fill="#162B4A" stroke="none" stroke-width="1.2"/>
<text x="992" y="296" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">Requires AppLocker</text>
<text x="992" y="312" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="middle">CSP + reboot to</text>
<text x="992" y="327" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#9DC3E6" text-anchor="middle">activate</text>
<rect x="20" y="360" width="500" height="100" rx="4" fill="#C00000" stroke="#AAAAAA" stroke-width="1.2" opacity="0.15"/>
<rect x="20" y="360" width="500" height="100" rx="4" fill="#FFFFFF" stroke="#C00000" stroke-width="1.2"/>
<text x="270" y="382" font-family="Arial,sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#C00000" text-anchor="middle">BEFORE: Unsigned code execution</text>
<text x="270" y="402" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#595959" text-anchor="middle">Any user can download and run arbitrary .exe</text>
<text x="270" y="420" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#595959" text-anchor="middle">PowerShell scripts execute without restriction</text>
<text x="270" y="438" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#595959" text-anchor="middle">Malware installed via drive-by download runs immediately</text>
<rect x="560" y="360" width="500" height="100" rx="4" fill="#375623" stroke="#AAAAAA" stroke-width="1.2" opacity="0.15"/>
<rect x="560" y="360" width="500" height="100" rx="4" fill="#FFFFFF" stroke="#375623" stroke-width="1.2"/>
<text x="810" y="382" font-family="Arial,sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#375623" text-anchor="middle">AFTER: WDAC Enforce Mode active</text>
<text x="810" y="402" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#595959" text-anchor="middle">Unsigned executables blocked at kernel level</text>
<text x="810" y="420" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#595959" text-anchor="middle">Only Publisher-signed or Managed Installer software runs</text>
<text x="810" y="438" font-family="Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#595959" text-anchor="middle">Block event logged with SHA256 + file path + initiating process</text>
</svg>