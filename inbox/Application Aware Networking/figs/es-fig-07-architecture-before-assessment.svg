ont-weight="bold" fill="#33414F">5 · Validate</text><text x="928.0" y="428.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#33414F">confirmation only</text><text x="928.0" y="520" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C">SCuBA · ZTTT ·</text><text x="928.0" y="542" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C">Secure Score</text><path d="M1030,330 L1188,330 L1210,405.0 L1188,480 L1030,480 L1052,405.0 Z" fill="#2E75B6"/><rect x="1024" y="316" width="206" height="178" rx="10" fill="none" stroke="#D4A017" stroke-width="4"/><text x="1120.0" y="401.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF">6 · Authorize</text><text x="1120.0" y="428.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#FFFFFF">KSI-ready evidence</text><text x="1120.0" y="520" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E">OSCAL AP / AR /</text><text x="1120.0" y="542" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E">POA&amp;M bundle</text><rect x="64" y="600" width="1152" height="70" rx="10" fill="#DCEEE9"/><text x="96" y="634" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" fill="#0D1B2E">STEP 3 OF 3 — Authorize on evidence the architecture generates.</text><text x="96" y="660" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="normal" fill="#33414F">Assessment tools arrive at Phase 5 — as the final proof, not the starting point.</