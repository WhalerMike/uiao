<svg width="900" height="480" viewBox="0 0 900 480"
     xmlns="http://www.w3.org/2000/svg" style="background:#FFFFFF;font-family:Arial,sans-serif">

  <rect width="900" height="480" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="48" fill="#1F3864"/>
  <text x="450" y="22" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">Why Kerberos Breaks in the Cloud: The Session Contract Assumption</text>
  <text x="450" y="40" text-anchor="middle" fill="#F2F2F2" font-size="10">BOD 25-01 mandates elimination of NTLM. Token-based identity (OAuth 2.0/OIDC) is the replacement.</text>

  <!-- Panel headers -->
  <rect x="10" y="54" width="385" height="26" rx="4" fill="#375623"/>
  <text x="202" y="72" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">Kerberos (1988 Design) &#x2014; On-Premises</text>

  <rect x="505" y="54" width="385" height="26" rx="4" fill="#C00000"/>
  <text x="697" y="72" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">Kerberos in 2020+ Cloud World</text>

  <!-- CENTER arrow -->
  <rect x="398" y="180" width="104" height="40" rx="8" fill="#C55A11"/>
  <text x="450" y="196" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">Move to</text>
  <text x="450" y="210" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">cloud</text>
  <polygon points="498,197 510,200 498,203" fill="#FFFFFF"/>

  <!-- LEFT PANEL: On-prem -->
  <!-- AD DC server -->
  <rect x="80" y="105" width="70" height="90" rx="5" fill="#1F3864" stroke="#2E75B6" stroke-width="2"/>
  <rect x="88" y="113" width="54" height="8" rx="2" fill="#2E75B6"/>
  <rect x="88" y="125" width="54" height="8" rx="2" fill="#2E75B6"/>
  <rect x="88" y="137" width="54" height="8" rx="2" fill="#2E75B6"/>
  <circle cx="115" cy="165" r="12" fill="#2E75B6"/>
  <text x="115" y="169" text-anchor="middle" fill="#FFFFFF" font-size="7">DC</text>
  <text x="115" y="210" text-anchor="middle" fill="#1F3864" font-size="9" font-weight="bold">AD Domain</text>
  <text x="115" y="222" text-anchor="middle" fill="#1F3864" font-size="9" font-weight="bold">Controller</text>

  <!-- User at desk (left) -->
  <circle cx="300" cy="135" r="14" fill="#2E75B6"/>
  <rect x="278" y="150" width="44" height="36" rx="4" fill="#2E75B6"/>
  <!-- Laptop -->
  <rect x="265" y="180" width="70" height="40" rx="4" fill="#1F3864" stroke="#2E75B6" stroke-width="1.5"/>
  <rect x="270" y="185" width="60" height="28" fill="#F2F2F2"/>
  <rect x="258" y="220" width="84" height="6" rx="3" fill="#1F3864"/>
  <text x="300" y="245" text-anchor="middle" fill="#1F3864" font-size="9">User at Desk</text>

  <!-- Short arrow 5ms -->
  <line x1="150" y1="155" x2="265" y2="170" stroke="#375623" stroke-width="2.5"/>
  <polygon points="261,165 271,170 261,175" fill="#375623"/>
  <text x="208" y="150" text-anchor="middle" fill="#375623" font-size="10" font-weight="bold">5ms RTT</text>
  <text x="208" y="162" text-anchor="middle" fill="#375623" font-size="9">Same LAN</text>

  <!-- Kerberos ticket being issued -->
  <rect x="80" y="290" width="280" height="60" rx="6" fill="#F2F2F2" stroke="#375623" stroke-width="1.5"/>
  <text x="220" y="313" text-anchor="middle" fill="#375623" font-size="10" font-weight="bold">Kerberos Ticket Issued</text>
  <text x="220" y="330" text-anchor="middle" fill="#1F3864" font-size="9">Assumed: client and DC in same room</text>
  <path d="M146,340 l4,5 l8,-10" stroke="#375623" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="228" y="345" text-anchor="middle" fill="#375623" font-size="11" font-weight="bold">Authentication succeeds</text>

  <!-- RIGHT PANEL: Cloud world -->
  <!-- User with laptop (cloud) -->
  <circle cx="560" cy="120" r="14" fill="#2E75B6"/>
  <rect x="538" y="135" width="44" height="36" rx="4" fill="#2E75B6"/>
  <rect x="525" y="165" width="70" height="40" rx="4" fill="#1F3864" stroke="#2E75B6" stroke-width="1.5"/>
  <rect x="530" y="170" width="60" height="28" fill="#F2F2F2"/>
  <rect x="518" y="205" width="84" height="6" rx="3" fill="#1F3864"/>
  <text x="560" y="228" text-anchor="middle" fill="#1F3864" font-size="9">User in Cloud</text>

  <!-- AD DC still on-prem (right) -->
  <rect x="730" y="105" width="70" height="90" rx="5" fill="#1F3864" stroke="#2E75B6" stroke-width="2"/>
  <rect x="738" y="113" width="54" height="8" rx="2" fill="#2E75B6"/>
  <rect x="738" y="125" width="54" height="8" rx="2" fill="#2E75B6"/>
  <rect x="738" y="137" width="54" height="8" rx="2" fill="#2E75B6"/>
  <circle cx="765" cy="165" r="12" fill="#2E75B6"/>
  <text x="765" y="169" text-anchor="middle" fill="#FFFFFF" font-size="7">DC</text>
  <text x="765" y="210" text-anchor="middle" fill="#1F3864" font-size="9">On-Prem DC</text>
  <text x="765" y="222" text-anchor="middle" fill="#1F3864" font-size="9">(not in cloud)</text>

  <!-- Long curved path over WAN + proxies -->
  <path d="M 595 185 Q 620 140 650 130 Q 700 118 730 145" fill="none" stroke="#C00000" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- RTT clock -->
  <rect x="600" y="240" width="200" height="45" rx="6" fill="#C00000"/>
  <text x="700" y="260" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">WAN + inline proxies/NAT</text>
  <text x="700" y="277" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">session breaks &#xB7; 100&#x2013;150ms RTT</text>

  <!-- Broken ticket -->
  <rect x="510" y="290" width="280" height="50" rx="6" fill="#F2F2F2" stroke="#C00000" stroke-width="1.5"/>
  <path d="M537,304 l9,9 M546,304 l-9,9" stroke="#C00000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="658" y="312" text-anchor="middle" fill="#C00000" font-size="10" font-weight="bold">KDC unreachable &#x2014; ticket issuance fails</text>
  <text x="650" y="330" text-anchor="middle" fill="#1F3864" font-size="9">Windows silently falls back to NTLM &#x2014; unaudited, replayable</text>

  <!-- Token solution box -->
  <rect x="510" y="360" width="370" height="90" rx="8" fill="#F2F2F2" stroke="#375623" stroke-width="2"/>
  <text x="695" y="382" text-anchor="middle" fill="#375623" font-size="11" font-weight="bold">Token-Based Solution (Entra ID)</text>
  <text x="525" y="400" fill="#1F3864" font-size="10">Entra ID token travels via HTTPS &#x2014; no DC roundtrip.</text>
  <text x="525" y="416" fill="#1F3864" font-size="10">Works across any cloud, any WAN path, any latency.</text>
  <path d="M525,427 l4,5 l8,-10" stroke="#375623" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="542" y="432" fill="#375623" font-size="10" font-weight="bold">Authentication succeeds regardless of RTT.</text>

</svg>
