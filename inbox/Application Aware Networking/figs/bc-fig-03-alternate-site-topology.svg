<svg viewBox="0 0 1040 420" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="420" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#999"/></marker><marker id="arww" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#fff"/></marker></defs><text x="520" y="26" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">Alternate Processing Site Topology</text><text x="520" y="44" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">Active-passive architecture with automated failover across all infrastructure layers from this series</text><rect x="30" y="58" width="460" height="310" rx="8" fill="#1F3864"/><text x="260" y="78" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Primary Region</text><rect x="530" y="58" width="460" height="310" rx="8" fill="#4472C4"/><text x="760" y="78" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Secondary Region (DR)</text><rect x="60" y="100" width="160" height="55" rx="5" fill="#2E75B6"/><text x="140" y="118" text-anchor="middle" font-size="8" font-weight="bold" font-style="normal" fill="#FFFFFF">InfoBlox Grid Master</text><text x="140" y="136" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">(DNS authoritative)</text><rect x="60" y="175" width="160" height="55" rx="5" fill="#2E75B6"/><text x="140" y="193" text-anchor="middle" font-size="8" font-weight="bold" font-style="normal" fill="#FFFFFF">SQL Server Primary</text><text x="140" y="211" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">(AG Primary replica)</text><rect x="60" y="250" width="160" height="55" rx="5" fill="#2E75B6"/><text x="140" y="268" text-anchor="middle" font-size="8" font-weight="bold" font-style="normal" fill="#FFFFFF">SD-WAN Primary</text><text x="140" y="286" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">(MPLS + DIA)</text><rect x="60" y="325" width="160" height="55" rx="5" fill="#375623"/><text x="140" y="343" text-anchor="middle" font-size="8" font-weight="bold" font-style="normal" fill="#FFFFFF">Entra ID / Azure</text><text x="140" y="361" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">(globally HA)</text><rect x="560" y="100" width="160" height="55" rx="5" fill="#EBF3FB"/><text x="640" y="118" text-anchor="middle" font-size="8" font-weight="bold" font-style="normal" fill="#1F3864">InfoBlox Grid Member</text><text x="640" y="136" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#1F3864">(replicated zones)</text><rect x="560" y="175" width="160" height="55" rx="5" fill="#EBF3FB"/><text x="640" y="193" text-anchor="middle" font-size="8" font-weight="bold" font-style="normal" fill="#1F3864">SQL Server Secondary</text><text x="640" y="211" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#1F3864">(AG async replica)</text><rect x="560" y="250" width="160" height="55" rx="5" fill="#EBF3FB"/><text x="640" y="268" text-anchor="middle" font-size="8" font-weight="bold" font-style="normal" fill="#1F3864">SD-WAN Backup</text><text x="640" y="286" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#1F3864">(DIA only)</text><rect x="560" y="325" width="160" height="55" rx="5" fill="#EBF3FB"/><text x="640" y="343" text-anchor="middle" font-size="8" font-weight="bold" font-style="normal" fill="#1F3864">Entra ID / Azure</text><text x="640" y="361" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#1F3864">(secondary region)</text><line x1="222" y1="127" x2="558" y2="127" stroke="#C55A11" stroke-width="2" marker-end="url(#arw)"/><text x="390" y="121" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#C55A11">Zone replication</text><line x1="222" y1="202" x2="558" y2="202" stroke="#C55A11" stroke-width="2" marker-end="url(#arw)"/><text x="390" y="196" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#C55A11">Async log shipping</text><line x1="222" y1="277" x2="558" y2="277" stroke="#C55A11" stroke-width="2" marker-end="url(#arw)"/><text x="390" y="271" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#C55A11">Path failover &lt;30s</text><text x="352" y="345" text-anchor="middle" font-size="8" font-weight="normal" font-style="italic" fill="#375623">Globally HA — no failover required</text><text x="520" y="406" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">Satisfies: CP-6 Alternate Storage · CP-7 Alternate Processing Site · CP-8 Telecom Redundancy · CP-9/10 (from Parts 5/6)</text></svg>
