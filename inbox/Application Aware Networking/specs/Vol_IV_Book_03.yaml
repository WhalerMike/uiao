    vendor_sources: ["nist_800_37"]

  # 5 --- section -----------------------------------------------------------
  - type: section
    kicker: "PART TWO — PLAN & ACCOUNTABILITY"
    title: "The program plan and who is accountable"
    callout: "FedRAMP 20x requires named individuals in security leadership roles. Templates become evidence only when the brackets are filled with names."
    callout_accent: teal
    notes: >
      This section covers the first cluster of artifacts: the Information Security
      Program Plan that frames the program, the leadership RACI that assigns
      accountability, and the system-inventory framework that establishes what is in
      the boundary. The framing to set is that these are fillable templates whose value
      is realized only when an agency populates them — the ISPP section outlines, the
      RACI role rows, and the inventory columns are structured to guide authors, but a
      template with unfilled brackets is not evidence. Stress the accountability point
      the RACI encodes: FedRAMP 20x requires named individuals in security leadership
      roles, the Authorizing Official and CISO must be agency employees, the ISSO may
      be a contractor with documented oversight, and the third-party assessor must be
      FedRAMP-recognized. And stress the inventory point: PM-5 requires a current,
      complete, machine-readable inventory kept in sync with the deployed state, which
      the book satisfies with a three-layer automation approach spanning infrastructure,
      software, and identity. These three artifacts together answer the assessor's
      first three questions — what is the program trying to do, who is accountable for
      each part of it, and what exactly is inside the boundary — before any risk or
      supply-chain discussion can be meaningful.

  # 6 --- content: ISPP -----------------------------------------------------
  - type: content
    kicker: "THE GOVERNING DOCUMENT"
    title: "The ISPP frames everything the program does"
    layout: grid
    cards:
      - title: "Purpose and scope"
        body: "Names the system, its impact level, and the authorization boundary — which must match the PM-5 inventory and the package presented to the Authorizing Official."
        accent: navy
      - title: "Legal authority"
        body: "FISMA 2014, OMB A-130, NIST SP 800-53 Rev 5, the FedRAMP 20x framework, BOD 26-04, and EO 14028 — the mandate stack the program answers to."
        accent: teal
      - title: "Program objectives"
        body: "Risk-based and mission-aligned: protect citizen PII, sustain FedRAMP Moderate authorization, meet the KSI Authorize threshold, satisfy BOD 26-04."
        accent: amber
      - title: "Resources and ownership"
        body: "FTE, tooling, training, and 3PAO budget — and the named owner (CISO) and approver (AO). Reviewed annually or after any major system change."
        accent: red
    callout:
      text: "The ISPP is owned by the SAISO/CISO and approved by the AO. Its boundary statement must reconcile with the system inventory — a mismatch is a finding."
      accent: navy
    notes: >
      This slide gives the audience the shape of the Information Security Program Plan,
      the PM-1 artifact and the governing document for the cloud security program. The
      purpose-and-scope section names the system, states its FIPS 199 impact level, and
      defines the authorization boundary — and the boundary is not a throwaway line: it
      must match the PM-5 system inventory and the boundary diagram in the package
      presented to the Authorizing Official, because a boundary in the ISPP that
      disagrees with the inventory is exactly the inconsistency an assessor looks for.
      The legal-authority section anchors the program in its mandate stack: FISMA 2014,
      OMB Circular A-130, NIST SP 800-53 Rev 5, the FedRAMP 20x authorization framework,
      CISA BOD 26-04, and Executive Order 14028. The program-objectives section states
      risk-based, mission-aligned goals — protecting citizen PII and benefit-payment
      data, sustaining continuous FedRAMP Moderate authorization, achieving KSI scores
      at the 20x Authorize threshold, and satisfying the BOD 26-04 deadline. The
      resources section allocates FTE, tooling, training, and third-party-assessment
      budget, and names the document owner, the SAISO or CISO, and the approver, the
      Authorizing Official. The review cycle is annual or after any major system
      change. The message to land: the ISPP is where organizational intent is written
      down, and every technical control the prior books built is ultimately measured
      against the objectives stated here.
    vendor_sources: ["fisma", "omb_a130"]

  # 7 --- content: leadership RACI ------------------------------------------
  - type: content
    kicker: "ACCOUNTABILITY (PM-2)"
    title: "The leadership RACI names who owns each decision"
    layout: columns
    cards:
      - title: "Accountable"
        body: "AO owns the ATO decision and organizational risk acceptance. CISO is accountable for the assessment, POA&M oversight, KSI monitoring, and training."
        accent: navy
        status: "AO / CISO"
      - title: "Responsible"
        body: "ISSO runs day-to-day control operation and the POA&M; DevSecOps owns the SBOM pipeline and CI gates; SOC owns Sentinel monitoring and incident response."
        accent: teal
        status: "ISSO / DevSecOps / SOC"
      - title: "Constraints"
        body: "AO and CISO must be SSA employees; the ISSO may be a contractor with documented oversight; the 3PAO must be FedRAMP-recognized. Replace titles with names."
        accent: amber
        status: "Named individuals"
    callout:
      text: "A RACI with role titles is a template. A RACI with named individuals against each activity is the PM-2 evidence artifact."
      accent: navy
    notes: >
      This slide conveys how the leadership RACI assigns accountability, the PM-2
      artifact FedRAMP 20x requires. RACI stands for responsible, accountable,
      consulted, and informed, and the matrix maps those roles onto the key program
      activities — the ATO decision, the annual security assessment, POA&M management,
      incident response, the BOD 26-04 SBOM and VDR submission, KSI continuous
      monitoring, privacy impact assessment, and security training. The accountability
      pattern the audience should absorb: the Authorizing Official is accountable for
      the ATO decision and for accepting organizational risk, while the CISO is
      accountable for the assessment, POA&M oversight, KSI monitoring, and training
      program. Responsibility for execution sits lower: the ISSO runs day-to-day
      control operation and owns the POA&M, DevSecOps owns the SBOM pipeline and the CI
      security gates, and the SOC owns Sentinel monitoring and the front line of
      incident response. Three constraints are non-negotiable and worth stating aloud:
      the Authorizing Official and the CISO must be SSA employees, the ISSO may be a
      contractor but only with documented agency oversight, and the third-party
      assessment organization must be FedRAMP-recognized. The closing point ties back
      to the section theme: a RACI populated with role titles is a template, but a RACI
      with a named individual against each activity is the actual PM-2 evidence — the
      artifact only becomes evidence when the brackets are filled.

  # 8 --- content: system inventory -----------------------------------------
  - type: content
    kicker: "SYSTEM INVENTORY (PM-5)"
    title: "Three layers, kept in sync with the deployed state"
    layout: columns
    cards:
      - title: "Infrastructure"
        body: "Azure Resource Graph queries produce a real-time inventory of every resource in the boundary subscriptions; a Logic App exports structured JSON every 24 hours."
        accent: navy
        status: "Automated · daily"
      - title: "Software"
        body: "The Book 02 Syft SBOM is the machine-readable software-component inventory. Infra and SBOM inventories reconcile monthly; unresolved gaps become POA&M items."
        accent: teal
        status: "SBOM · per build"
      - title: "Identity"
        body: "Entra ID is the authoritative account inventory; the ISSO reviews privileged-account counts weekly, satisfying CM-8(1) automated updates for the identity plane."
        accent: amber
        status: "Entra · weekly"
    callout:
      text: "PM-5 under 20x demands a machine-readable inventory synced to deployment. Reconciliation across the three layers is where drift surfaces as a tracked finding."
      accent: navy
    notes: >
      This slide describes the three-layer system inventory that satisfies PM-5, which
      requires a current, complete inventory of all components in the authorization
      boundary, and which FedRAMP 20x additionally requires to be machine-readable and
      synchronized with the deployed state. Layer one is the infrastructure inventory:
      Azure Resource Graph queries return a real-time list of every Azure resource in
      the boundary subscriptions, and a scheduled Logic App exports that inventory to
      structured JSON every twenty-four hours, so the infrastructure picture is never
      more than a day stale. Layer two is the software inventory, and it reuses Book
      02 directly: every production container image generates a CycloneDX SBOM at build
      time via Syft, and the SBOM manifest is the machine-readable software-component
      inventory. The two layers are reconciled monthly by DevSecOps, and any
      discrepancy that is not resolved within thirty days becomes a POA&M item — the
      reconciliation is where inventory drift surfaces as a tracked finding rather than
      an invisible gap. Layer three is the personnel and account inventory: Entra ID is
      the authoritative account source, the ISSO reviews privileged-account counts
      weekly, which is the same evidence KSI-003 consumes, and the identity artifacts
      satisfy CM-8(1) automated inventory updates for the identity plane. The unifying
      message: a modern inventory is not a spreadsheet maintained by hand but three
      automated feeds whose reconciliation is itself a control activity.

  # 9 --- section -----------------------------------------------------------
  - type: section
    kicker: "PART THREE — RISK"
    title: "The risk strategy grounds every POA&M"
    callout: "Security is embedded at every lifecycle gate, and every risk gets a scored, owned, time-bounded response — accept, mitigate, transfer, or avoid."
    callout_accent: navy
    notes: >
      This section covers the risk-management strategy, PM-9, and the enterprise-
      architecture integration, PM-7, that together make risk a governed process rather
      than a reactive one. The framing to set: SSA's risk strategy follows NIST SP
      800-39 across three tiers — organizational risk framing at the top, mission and
      process-level risk assessment in the middle, and system-level risk response at
      the bottom — and the whole point of the strategy is that every POA&M item and
      every authorization decision references a documented risk-tolerance framework
      rather than an ad-hoc judgment. Preview the build sequence that follows as the
      concrete expression of PM-7: security is not bolted on at the end but embedded at
      five architecture-review gates from concept through operation, so a new
      application cannot reach production without having passed security categorization,
      threat modeling, SBOM binding, and an authorization check along the way. Then the
      risk-scoring slide shows how each identified risk is scored on a likelihood-times-
      impact matrix, assigned a response, given an owner, and time-bounded — with the
      remediation clock tightening as the score rises. The section theme: risk
      management is what connects the technical evidence from the prior books to
      organizational decisions about what the agency will and will not tolerate.
    vendor_sources: ["nist_800_39"]

  # 10 --- build-sequence: lifecycle security gates -------------------------
  - type: build-sequence
    kicker: "ARCHITECTURE REVIEW GATES (PM-7)"
    title: "Security embedded across the application lifecycle"
    notes: "Fallback notes if a gate omits its own."
    steps:
      - label: "Concept"
        sub: "Classify · bound · map data"
        accent: navy
        detail: >
          Before design begins, every new application completes a Privacy Threshold
          Analysis and a security categorization: its impact level is set, its
          authorization boundary is defined, and its data flows are mapped. Nothing
          proceeds without a classification.
        notes: >
          Gate one establishes what the system is and how sensitive it is before a
          single design decision is made. Every new application must complete a Privacy
          Threshold Analysis and a security categorization at the concept stage: the
          FIPS 199 impact level is assigned, the authorization boundary is drawn, and
          the data flows are mapped so the agency knows what data the system will touch
          and where it will go. This is the gate that prevents the most expensive kind
          of mistake — discovering at deployment that a system handling citizen PII was
          designed as if it handled public data. Because the boundary defined here must
          later reconcile with the PM-5 system inventory and the ISPP scope statement,
          getting it right at concept is what keeps those artifacts consistent
          downstream. The classification produced at this gate drives the entire
          control selection that follows: a Moderate-impact citizen-data system inherits
          a very different control baseline than an internal tool, and that decision is
          made here, deliberately, rather than defaulted into later.
      - label: "Design"
        sub: "Select controls · threat-model · bind SBOM"
        accent: teal
        detail: >
          Control selection, threat modeling, and the SBOM requirement are bound into
          the design. The threat model drives which controls are strengthened; the SBOM
          requirement is written into the design so supply-chain evidence is a build
          output, not an afterthought.
        notes: >
          Gate two turns the classification into an actual security design. Controls are
          selected against the impact level set at concept, a threat model is built to
          identify where the system is exposed and which controls therefore need
          strengthening, and — critically for continuity with Book 02 — the SBOM
          requirement is bound into the design here, so supply-chain evidence generation
          is architected in from the start rather than retrofitted. The threat model is
          the analytical heart of this gate: it is where the team reasons about how an
          adversary would attack the system and lets that reasoning drive control
          decisions, rather than applying a uniform baseline blindly. Binding the SBOM
          requirement at design time is what makes the Book 02 pipeline possible — if
          the obligation to emit a CycloneDX SBOM on every build is a design constraint,
          the CI pipeline is built to satisfy it, whereas if it is remembered only at
          deployment it becomes a scramble. This gate is where PM-7's promise that
          security controls are architectural primitives, not bolt-ons, is actually
          kept.
      - label: "Build"
        sub: "Security testing · SBOM · CI gates"
        accent: amber
        detail: >
          Security testing requirements are enforced in CI: the SBOM is generated, the
          Grype scan runs as a merge gate, and a new critical CVE blocks promotion. The
          design-time requirements become executable pipeline checks.
        notes: >
          Gate three is where the design-time security requirements become executable
          checks in the continuous-integration pipeline. Security testing requirements
          are enforced automatically: the SBOM is generated on every build, the Grype
          vulnerability scan runs as a merge gate, and a new critical CVE appearing in
          the SBOM blocks promotion to production. This is the point where governance
          and the Book 02 technical pipeline physically meet — the SBOM requirement
          bound at design becomes a running job, and the risk-based remediation SLAs
          become a pass/fail gate rather than a policy nobody enforces. The value of
          moving these checks into CI is that they scale and they cannot be skipped:
          every merge is validated, every deployment carries fresh supply-chain
          evidence, and the machine-readable artifacts the checks produce feed directly
          into the KSI-014 automated-validation evidence. A human is not asked to
          remember to scan; the pipeline refuses to promote code that fails. Build is
          where the program stops trusting intentions and starts trusting enforced
          gates.
      - label: "Deploy"
        sub: "ATO check · SBOM/VDR submit · KSI baseline"
        accent: navy
        detail: >
          Before go-live, the ATO or P-ATO status is checked, the SBOM and VDR are
          submitted, and the KSI baseline is captured. The system enters production with
          an authorization decision and a starting compliance posture on record.
        notes: >
          Gate four is the authorization checkpoint between a built system and a
          production one. Before go-live the team verifies the ATO or provisional-ATO
          status, submits the SBOM and VDR as required by BOD 26-04, and captures the
          initial KSI baseline so the system enters production with a documented
          starting compliance posture. This gate is where the risk strategy and the
          authorization decision converge: the Authorizing Official's acceptance of
          residual risk, grounded in the PM-9 framework, is what permits deployment, and
          the KSI baseline captured here becomes the reference point against which
          continuous monitoring later measures drift. Deploying without passing this
          gate is deploying an unauthorized system, which is itself a serious finding.
          The baseline matters as much as the authorization: continuous monitoring can
          only detect degradation if it knows the authorized starting state, so
          capturing the KSI baseline at deployment is what makes the operate phase
          meaningful. This is the last gate before the system is exposed to real users
          and real data.
      - label: "Operate"
        sub: "ConMon · annual assessment · POA&M"
        accent: teal
        detail: >
          In production the system is continuously monitored against its KSI baseline,
          formally assessed annually, and any gap is tracked as a scored, owned,
          time-bounded POA&M item. The gate never closes — operation is the longest
          phase.
        notes: >
          Gate five is the phase the system spends most of its life in, and it is where
          the risk strategy proves itself as a living process. In production the system
          is continuously monitored against the KSI baseline captured at deployment,
          formally assessed at least annually by the third-party assessor, and every
          identified gap is tracked as a POA&M item that carries a score, an owner, and
          a due date. This gate connects to the risk-scoring model directly: a finding's
          likelihood-times-impact score sets its remediation clock, from ninety days for
          moderate findings down to fifteen days for the most severe, escalating to the
          Authorizing Official. Operate is also where the continuous-monitoring program
          from the T&T&M plan runs — the Sentinel workbooks watching identity, network,
          endpoint, vulnerability, and SBOM-drift dimensions on cadences from real-time
          to per-commit. The point to leave the audience with: unlike the earlier gates,
          this one never closes. The lifecycle is a loop, operation feeds new risks back
          into the strategy, and the authorization is continuous rather than a one-time
          event — which is exactly the posture FedRAMP 20x is built around.

  # 11 --- content: risk scoring & response ---------------------------------
  - type: content
    kicker: "RISK SCORING & RESPONSE"
    title: "Every risk scored, owned, and time-bounded"
    layout: grid
    cards:
      - title: "The scoring model"
        body: "Score = likelihood (1 rare to 5 certain) × impact (1 negligible to 5 catastrophic). A single number that sets the remediation clock and the escalation path."
        accent: navy
      - title: "The remediation clock"
        body: "1–4 accept and monitor; 5–9 mitigate within 90 days; 10–15 mitigate within 30 days; 16–25 escalate to the AO with a POA&M within 15 days."
        accent: amber
      - title: "Four responses"
        body: "Mitigate (strengthen a control), transfer (shift to a CSP contractually), accept (with AO concurrence, time-bounded above score 4), or avoid (remove the component)."
        accent: teal
      - title: "The three tiers"
        body: "NIST SP 800-39: organizational risk framing, mission-level risk assessment, and system-level risk response — the register lives at the system tier, reviewed monthly."
        accent: red
    callout:
      text: "The register is reviewed monthly by the ISSO and quarterly by the CISO. A score above 4 cannot be accepted indefinitely — acceptance is always time-bounded."
      accent: navy
    notes: >
      This slide gives the audience the mechanics of how SSA scores and responds to
      risk, the operational core of PM-9. The scoring model is deliberately simple so
      it is actually used: score equals likelihood times impact, where likelihood runs
      from one (rare) to five (certain) and impact from one (negligible) to five
      (catastrophic), producing a single number between one and twenty-five that
      determines both the remediation urgency and the escalation path. The remediation
      clock is banded: scores one through four are accepted and monitored, five through
      nine require mitigation within ninety days, ten through fifteen require mitigation
      within thirty days, and sixteen through twenty-five escalate to the Authorizing
      Official with a POA&M required within fifteen days. For each risk the ISSO
      documents one of four responses: mitigate by implementing or strengthening a
      control, transfer by contractually shifting the risk to a cloud service provider,
      accept with Authorizing Official concurrence — and any acceptance above score four
      is explicitly time-bounded, never indefinite — or avoid by removing the component
      or functionality that generates the risk. The whole model sits inside the NIST SP
      800-39 three-tier structure: organizational risk framing sets tolerance at the
      top, mission-level assessment maintains the enterprise register in the middle, and
      system-level response operates the POA&M at the bottom. The register is reviewed
      monthly by the ISSO and quarterly by the CISO, so risk is a standing cadence, not
      an annual event.
