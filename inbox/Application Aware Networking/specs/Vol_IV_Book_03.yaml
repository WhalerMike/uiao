slides:
  # 1 --- title -------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for the governance book, the organizational capstone of Volume
      IV. The message to establish: FedRAMP 20x authorization requires organizational
      governance artifacts that exist entirely outside the technical control stack,
      and without them the technical evidence has no context. Program Management
      controls establish the organizational infrastructure — leadership
      accountabilities, program plans, metrics, and risk-management frameworks —
      inside which every technical control operates; without them there is no
      authoritative statement of what the security program is trying to achieve, and
      an assessor cannot judge technical evidence against organizational mission and
      risk posture. This book delivers seven artifacts: the Information Security
      Program Plan, the leadership RACI, the system-inventory framework, the risk-
      management strategy, the testing-training-and-monitoring plan, the security
      contact registry, and the Supply Chain Risk Management governance charter.
      Together they close nine NIST SP 800-53 Rev 5 PM-family controls and provide the
      PM-30 evidence that, combined with Book 02's technical SBOM/VDR/VEX pipeline,
      seeds KSI-SCR coverage. Walk the four-step journey — frame the program, assign
      accountability, manage risk, govern the supply chain — and note the draft
      disclaimer: pre-decisional CSI Team material with fillable templates, subject to
      SSA CIO Office review. Scope is FedRAMP Moderate; the RMF authorization models
      its continuous-monitoring evidence on the FedRAMP 20x KSI schema.
    vendor_sources: ["uiao repo: inbox/Application Aware Networking/Vol_IV_Book_03_FedAAN_Program_Management_Governance.qmd"]

  # 2 --- section -----------------------------------------------------------
  - type: section
    kicker: "PART ONE — WHY PM GATES"
    title: "PM controls gate the authorization"
    callout: "FedRAMP 20x evaluates outcomes, not checklists. PM controls are the organizational preconditions that decide whether technical controls can sustain outcomes."
    callout_accent: navy
    notes: >
      This section explains why organizational program-management controls, which
      produce no packets and enforce no traffic, nonetheless gate the authorization.
      The framing to establish is that FedRAMP 20x Key Security Indicators evaluate
      outcomes rather than checklist compliance, and PM controls are the
      organizational preconditions that determine whether technical controls can
      achieve sustainable outcomes at all. Three examples carry the argument. PM-1,
      the Information Security Program Plan, is the document that contextualizes every
      other control — without it there is no authoritative statement of what the
      security program is trying to achieve, so no technical evidence can be judged
      against intent. PM-9, the risk-management strategy, determines how the
      organization decides which risks to accept, mitigate, transfer, or avoid, and
      every POA&M item references that decision framework. PM-30, the SCRM strategy, is
      the organizational commitment that turns Book 02's SBOM/VDR/VEX pipeline from a
      technical experiment into a governance artifact by binding leadership to the
      supply-chain risk posture. Preview the honesty point the book makes: every PM
      control closes through a governance artifact signed by named officials, and none
      closes through the network substrate — no resolver, overlay, or enforcement
      point can author a risk-tolerance statement or a leadership accountability
      matrix. Conceding that PM governance is closed by documents, not technology, is
      exactly what makes the series' network-necessity claims credible elsewhere.
    vendor_sources: ["fisma", "omb_a130"]

  # 3 --- content: PM as preconditions --------------------------------------
  - type: content
    kicker: "ORGANIZATIONAL PRECONDITIONS"
    title: "Three artifacts that give technical evidence its meaning"
    layout: grid
    cards:
      - title: "PM-1 — the ISPP"
        body: "The governing document that contextualizes all other controls. Without it there is no authoritative statement of what the security program is trying to achieve."
        accent: navy
      - title: "PM-9 — risk strategy"
        body: "How the organization decides to accept, mitigate, transfer, or avoid risk. Every POA&M item and authorization decision references this framework."
        accent: teal
      - title: "PM-30 — SCRM strategy"
        body: "The commitment that makes Book 02's SBOM/VDR/VEX pipeline a governance artifact, not an experiment — binding leadership to the supply-chain posture."
        accent: amber
      - title: "The outcome test"
        body: "20x scores outcomes, not checklists. These preconditions decide whether technical controls sustain outcomes or degrade the moment attention moves elsewhere."
        accent: red
    callout:
      text: "None of these closes through the network substrate. No overlay or enforcement point authors an organizational risk-tolerance statement."
      accent: navy
    notes: >
      This slide makes concrete why three specific PM controls are load-bearing for
      the whole authorization. The Information Security Program Plan, PM-1, is the
      governing document that contextualizes all other controls; it is the
      authoritative statement of program objectives, and without it an assessor
      looking at a well-configured firewall rule has no way to know whether it serves
      the mission or contradicts it. The risk-management strategy, PM-9, is the
      decision framework the organization uses to accept, mitigate, transfer, or avoid
      each risk, and it is the reference every POA&M item and every authorization
      decision points back to — a POA&M without a risk strategy behind it is a to-do
      list, not a risk-managed program. The SCRM strategy, PM-30, is the organizational
      commitment that elevates Book 02's technical pipeline into a governance artifact:
      the SBOM and VEX pipeline can run flawlessly, but only leadership sign-off on the
      supply-chain risk posture makes it a program the agency is accountable for rather
      than a clever automation. The fourth card states the test the whole section
      turns on — FedRAMP 20x scores outcomes, not checklists, so the question is
      whether technical controls sustain their outcomes over time, and these
      organizational preconditions are what decide that. Close on the necessity-
      honesty point: none of these artifacts closes through the network substrate, no
      overlay or enforcement point can author an organizational risk-tolerance
      statement, and admitting that is what keeps the series' network claims credible.

