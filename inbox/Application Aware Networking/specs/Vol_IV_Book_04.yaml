deck:
  title: "PII Processing and Transparency"
  subtitle: "The Privacy (PT) control family as ATO-ready documentation — authority, purpose, notice, consent, and special categories for Agency GCC Moderate"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING"
  date_code: "2026-07-09 09:53 ET"
  journey:
    - "Collect"
    - "Process"
    - "Store"
    - "Share"
    - "Retain"
    - "Dispose"
  sources:
    omb_m0322: "https://obamawhitehouse.archives.gov/omb/memoranda_m03-22"
    omb_m1712: "https://www.whitehouse.gov/wp-content/uploads/legacy_drupal_files/omb/memoranda/2017/m-17-12_0.pdf"
    omb_a130: "https://www.whitehouse.gov/wp-content/uploads/legacy_drupal_files/omb/circulars/A130/a130revised.pdf"
    privacy_act: "https://www.justice.gov/opcl/privacy-act-1974"
    egov_act: "https://www.congress.gov/bill/107th-congress/house-bill/2458"
    nist_800_122: "https://csrc.nist.gov/pubs/sp/800/122/final"
    nist_800_53: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
    fedramp_20x: "https://www.fedramp.gov/20x/"
    ms_purview_datamap: "https://learn.microsoft.com/en-us/purview/data-map-concept"
    hipaa_privacy: "https://www.hhs.gov/hipaa/for-professionals/privacy/index.html"

slides:
  # --- 1. title -------------------------------------------------------------
  - type: title
    notes: |
      Opening frame for Volume IV, Book 04 — PII Processing and Transparency.
      Set the thesis immediately: a FedRAMP Moderate system that touches citizen
      data carries obligations beyond the security control baseline, and those
      obligations live in the NIST SP 800-53 Rev 5 Privacy (PT) control family.
      PT converts statutory privacy duties — why you collect PII, what authority
      permits it, how individuals are notified, and where special categories get
      heightened protection — into auditable, ATO-ready artifacts. Without that
      documentation layer, a privacy-sensitive ATO boundary cannot close without
      a significant POA&M gap. Walk the audience through the six-stage lifecycle
      on the title strip — collect, process, store, share, retain, dispose —
      because that lifecycle is the spine of the whole book: every PT control
      attaches to one or more of those stages. Preview the six controls this book
      closes: PT-1 Privacy Program Plan, PT-2 Authority to Process, PT-3 Purpose
      Specification, PT-4 Consent, PT-5 Privacy Notice, and PT-7 Special
      Categories. Stress the scope discipline up front: this is Agency GCC Moderate /
      FedRAMP Moderate exclusively — no High baseline claims anywhere. Voice the
      draft-proposal caveat: this is CSI Team pre-decisional material, not yet
      reviewed by the Agency CIO Office, OIS, or leadership, and all vendor
      selections and control mappings are subject to revision. The one framing to
      leave the room with before the first content slide: privacy transparency is
      closed by documentation, and the technical substrate the rest of the series
      builds enforces those documented policies but cannot substitute for them.
    vendor_sources: ["nist_800_53", "fedramp_20x"]

  # --- 2. section: why privacy needs its own layer -------------------------
  - type: section
    kicker: "PART ONE"
    title: "Privacy is a documentation layer, not a network control"
    callout: "A privacy-sensitive ATO cannot close a boundary without the PT artifacts — no classifier supplies statutory authority or published notice."
    callout_accent: navy
    notes: |
      This section motivates the entire book: why privacy obligations cannot be
      satisfied by the same infrastructure that closes the security baseline. Make
      the distinction concrete. Elsewhere in this series, controls close through
      configuration — a DNS resolver enforces SC-7, a Conditional Access policy
      enforces AC-3. The PT family is structurally different: it requires the
      agency to be able to demonstrate, in writing, the legal authority for each
      PII collection, the specific purpose, the notice provided to individuals,
      and the heightened protections applied to sensitive categories. That is a
      documentation deliverable, not a switch setting. Set up the through-line for
      the deck: PT is the layer that makes statutory privacy obligations
      auditable. The rest of the series supplies enforcement — Purview labeling
      and DLP from the Data Protection book enforce the purposes and categories
      that PT defines — but no classifier, resolver, or enforcement point can
      supply the statutory authority citation or the published SORN and privacy
      notice the Privacy Act requires. This is a Closure Necessity in the
      book's strongest sense, and it runs the opposite direction from most of the
      series: here the necessity is documentation, not technology. Nothing on this
      divider is a vendor claim, so no source line is required.

  # --- 3. content: what the PT family closes -------------------------------
  - type: content
    kicker: "THE DOCUMENTATION LAYER"
    title: "PT converts statute into auditable artifacts"
    layout: grid
    cards:
      - title: "Why — authority"
        body: "PT-2 links each PII category to a specific statute (the agency's enabling act, the Privacy Act) and its SORN — general mission authority is not sufficient."
        accent: navy
      - title: "What — purpose"
        body: "PT-3 documents the collection purpose per field and limits use to it; secondary use needs explicit authorization and a Purview attribute to enforce it."
        accent: teal
      - title: "Notice — transparency"
        body: "PT-5 provides OMB M-03-22 notice at or before collection; FedRAMP 20x adds a machine-accessible privacy-notice URL an assessor can validate."
        accent: amber
      - title: "Heightened — categories"
        body: "PT-7 applies heightened protection to SSN, PHI, financial, and biometric data — encryption, access tiering, and audit logging beyond general PII."
        accent: red
    callout:
      text: "Six PT controls (PT-1, PT-2, PT-3, PT-4, PT-5, PT-7) close the privacy-transparency gap for a GCC Moderate system that processes citizen data."
      accent: navy
    notes: |
      This slide gives the shape of the whole book before the lifecycle walk. Read
      the four cards as the four questions the PT family forces an agency to answer
      in writing. Authority (PT-2): every PII category must trace to a specific
      legal citation — the agency's enabling statute, the Privacy Act, the
      E-Government Act — not a vague appeal to mission need; and any system that
      retrieves PII by a personal identifier is a Privacy Act system of records
      requiring a published SORN. Purpose (PT-3): each field carries a documented
      collection purpose, use is limited to that purpose, and secondary use
      requires explicit authorization — mapped to a Microsoft Purview Data Map
      custom attribute so the limitation can be enforced automatically, not just
      asserted on paper. Notice (PT-5): individuals get an OMB M-03-22 privacy
      notice at or before collection, and FedRAMP 20x adds a stable,
      machine-accessible notice URL an independent assessor can reach without
      manual intervention. Categories (PT-7): SSN, PHI, financial, and biometric
      data get heightened protection — stronger encryption, tighter access, and
      richer audit logging than general PII. The callout names the six controls
      closed here — PT-1, PT-2, PT-3, PT-4, PT-5, PT-7 — and note deliberately
      that PT-6 (System of Records Notice) and PT-8 (computer matching) appear in
      the lifecycle figure but are not among the six this book closes. Purview is
      named here as the enforcement mechanism for PT-3 and PT-7; the vendor source
      is the Microsoft Purview Data Map documentation. Vendor sources: NIST
      SP 800-53 PT family and the Purview Data Map.
    vendor_sources: ["nist_800_53", "ms_purview_datamap"]

  # --- 4. content: PT-1 the privacy program plan ---------------------------
  - type: content
    kicker: "PT-1 — THE GOVERNANCE SPINE"
    title: "The Privacy Program Plan, co-signed and reviewed"
    layout: columns
    cards:
      - title: "Privacy parallel to PM-1"
        body: "PT-1 is the privacy complement of the ISPP (Program Management book). Co-signed by the SAOP and the SAISO/CISO on the same annual cadence."
        accent: navy
        status: "Co-signed"
      - title: "Accountable roles"
        body: "SAOP chairs the Privacy Council and approves PIAs and SORNs; the System Privacy Officer maintains PT artifacts; the ISSO integrates them into the assessment and POA&M."
        accent: teal
        status: "SAOP-owned"
      - title: "Program cadence"
        body: "Annual plan review, PIA at boundary and after major change, SORN review every three years, annual privacy control assessment aligned to the security assessment."
        accent: amber
        status: "Annual"
    callout:
      text: "PT-1 is the governance frame; the other five PT controls are the artifacts it commissions and reviews."
      accent: navy
    notes: |
      This slide covers PT-1, the Privacy Program Plan, which is the governance
      spine every other PT control hangs from. The key relationship to voice: PT-1
      is the privacy parallel to PM-1, the Information Security Program Plan
      established in the Program Management and Governance book. The two share the
      same leadership cadence and the same Authorizing Official approval chain,
      which is why the Privacy Program Plan must be co-signed by both the Senior
      Agency Official for Privacy (SAOP) and the SAISO/CISO and reviewed on the
      same annual schedule as the ISPP. Walk the accountable roles from the RACI:
      the SAOP chairs the Privacy Council and approves Privacy Impact Assessments
      and SORNs; the System Privacy Officer is the system-level representative who
      maintains the PT artifacts; the ISSO integrates privacy controls into the
      security assessment and owns the POA&M for privacy gaps; Legal Counsel
      validates the authority citations and SORN language. Then the cadence: the
      plan is reviewed annually with AO signature, a PIA is done at boundary
      establishment and after any major system change, SORNs are reviewed every
      three years or on significant change, and the privacy control assessment
      runs annually aligned to the security assessment — completed within 365 days
      of the prior one. Leave the audience with the framing: PT-1 does not itself
      protect any single record; it is the standing governance that commissions,
      reviews, and re-authorizes the other five PT artifacts. This is drawn from
      the NIST control catalog and the book's own RACI, not a vendor claim, so no
      external source line is needed.

  # --- 5. section: the PII lifecycle ---------------------------------------
  - type: section
    kicker: "PART TWO"
    title: "The PII lifecycle — where each control attaches"
    callout: "Collect, process, store, share, retain, dispose — every PT control governs one or more stages of the data's life."
    callout_accent: teal
    notes: |
      Pivot from governance to the operational spine of the book: the PII
      processing lifecycle. This is the horizontal lifecycle from the book's
      opening figure, and it is the organizing device for the rest of the deck.
      The point to make on the divider is that privacy controls are not a flat
      checklist — they attach to specific moments in the data's life. Collection
      is where PT-2 authority, PT-3 purpose, PT-5 notice, and PT-4 consent all
      fire at once. Processing is where PT-3 purpose limitation and PT-7
      de-identification apply, enforced by the Purview data map. Storage brings in
      the retention schedule and at-rest encryption controls. Sharing and
      disclosure invoke inter-agency agreements, routine-use matching, and
      recipient audit logging. Retention is bounded by the NARA schedule and audit
      log minimums. Disposal closes the loop with NIST SP 800-88 media
      sanitization and a disposal certificate, and an annual SORN review cycle
      loops back to the start. The next slide walks all six stages as a
      click-through build sequence — six moving parts, so it is a build, not a
      single dense diagram. No vendor claim on the divider.

  # --- 6. build-sequence: the PII lifecycle --------------------------------
  - type: build-sequence
    kicker: "THE PII LIFECYCLE"
    title: "Six stages, one privacy control chain"
    notes: "Fallback notes: the six-stage PII lifecycle — collect, process, store, share, retain, dispose — and the PT controls that attach at each stage."
    steps:
      - label: "Collect"
        sub: "PT-2 / PT-3 / PT-4 / PT-5"
        accent: navy
        detail: >
          At intake, four controls fire together: PT-2 authority (the statute and
          SORN that permit collection), PT-3 purpose (why this field), PT-5 notice
          (the OMB M-03-22 privacy statement shown before any PII is entered), and
          PT-4 consent where collection is voluntary.
        notes: |
          Step one: collection — the busiest privacy moment in the lifecycle. Four
          PT controls fire at the same instant a citizen submits data. PT-2
          Authority to Process establishes that a specific statute permits the
          collection and, for a Privacy Act system of records, that a SORN is
          published. PT-3 Purpose Specification records why each field is
          collected and limits later use to that purpose. PT-5 Privacy Notice
          requires that an OMB M-03-22 compliant privacy statement is displayed at
          or before the point of collection — identity of the collecting agency,
          legal authority, principal purpose, routine uses, whether disclosure is
          mandatory or voluntary, and the effects of non-disclosure. PT-4 Consent
          applies where the collection is voluntary rather than statutory — for
          example an optional email address for notifications — using an unchecked
          opt-in checkbox, never a pre-checked one. Emphasize for the presenter
          that this is where SSN auto-labeling triggers in Purview, and where the
          citizen portal, contact center, and cross-agency intake scenarios all
          begin. The design point: get collection right and the rest of the
          lifecycle inherits clean, authorized, documented data; get it wrong and
          every downstream stage carries an undocumented flow. Vendor sources:
          OMB M-03-22 web privacy notice requirements.
        vendor_sources: ["omb_m0322"]
      - label: "Process"
        sub: "PT-3 limit, PT-7 de-ID"
        accent: teal
        detail: >
          Use is confined to the documented purpose; secondary use requires
          explicit authorization. Purview custom attributes (pii_collection_purpose,
          pii_secondary_use_authorized) enforce the limit, and PT-7 de-identifies
          or masks where the full value is not operationally required.
        notes: |
          Step two: processing under purpose limitation. Once collected, PII may
          be used only for the documented purpose. PT-3 makes this auditable field
          by field, and the Microsoft Purview Data Map operationalizes it: the
          purpose is stored as the custom attribute pii_collection_purpose, a
          boolean pii_secondary_use_authorized flags any authorized secondary use,
          and pii_minimization_policy links to the sensitivity label. If data
          attempts to cross a boundary without the secondary-use flag, the DLP
          policy alerts. PT-7 de-identification and minimization apply here too —
          SSNs masked to the last four digits in the UI, full values stored
          encrypted only, and analytics run on de-identified data. Make the point
          that this is exactly where the technical substrate and the documentation
          layer meet: the PT-3 matrix defines the policy, and Purview enforces it
          automatically at the data-asset level. But stress the direction of
          dependency — the enforcement is only as good as the documented purpose
          behind it; Purview cannot invent a purpose the PT-3 matrix never
          recorded. This is the enforcement half of the Closure Necessity: the
          artifact defines, the platform enforces, and neither substitutes for the
          other. Vendor sources: the Microsoft Purview Data Map documentation.
        vendor_sources: ["ms_purview_datamap"]
      - label: "Store"
        sub: "retention + encryption"
        accent: amber
        detail: >
          Data at rest is held to its NARA retention schedule and protected by
          AES-256 with customer-managed keys for special categories, with an
          accessibility log — the storage-stage controls (SI-12, MP-6, SC-28) the
          Data Protection book supplies.
        notes: |
          Step three: storage. Once PII is at rest, two obligations govern it —
          how long it may be kept and how strongly it must be protected. Retention
          is bounded by the applicable NARA records schedule captured in the PT-2
          matrix; data may not be retained past its documented period. Protection
          at rest is AES-256, with customer-managed keys for special categories,
          drawn from the Data Protection and Purview book's SC-28, SC-12, and
          SC-13 controls, plus SI-12 information handling and retention and an
          accessibility audit log. The framing to voice: the storage stage is
          where the privacy documentation layer hands off to the technical data-
          protection substrate — PT names the retention period and the sensitivity
          of the category, and the encryption, key management, and access controls
          from the Data Protection book carry it out. Note that special categories
          get column-level or field-level encryption and separate key management,
          and that all reads and writes to the most sensitive fields are logged
          with multi-year retention. Keep the scope discipline: everything here is
          GCC Moderate encryption; where an underlying service holds a higher
          authorization it is referred to simply as FedRAMP-authorized. This is
          the NIST control catalog and cross-book architecture, not a new vendor
          claim, so the source line points to the control catalog. Vendor sources:
          NIST SP 800-53 storage and retention controls.
        vendor_sources: ["nist_800_53"]
      - label: "Share"
        sub: "ISA + routine use"
        accent: navy
        detail: >
          Disclosure outside the system runs on an inter-agency data-sharing
          agreement, a Privacy Act routine-use match verified against the sending
          agency's SORN, and a recipient audit log — the cross-agency scenarios to
          IRS, CMS, and OPM.
        notes: |
          Step four: sharing and disclosure — the highest-risk stage for a
          citizen-data system because it moves PII outside the originating
          boundary. Every external disclosure must rest on three things: a signed
          inter-agency data-sharing agreement (the legal instrument), a Privacy
          Act routine use that actually covers the receiving use case (verified
          against the relevant SORN), and a recipient audit log so the disclosure
          is accountable. Walk the book's cross-agency scenarios: annual tax
          statements to the IRS under statutory authority, Medicare
          Part B coordination with CMS carrying PHI, and workforce data to OPM and
          FEHB carriers. For inbound sharing, individuals are deemed notified
          through the sending agency's SORN, so the receiving agency must confirm
          that SORN includes a routine use covering the use — a step teams
          routinely miss. Cross-agency API calls must meet GCC Moderate standards:
          TLS 1.3 minimum, mutual TLS preferred. Note the HIPAA determination that
          rides on health-data flows — for each flow involving health information
          the agency must document whether Agency is a covered entity, a business
          associate, or neither, and confirm a Business Associate Agreement is on
          file where HIPAA applies. Vendor sources: HHS HIPAA Privacy Rule.
        vendor_sources: ["hipaa_privacy"]
      - label: "Retain"
        sub: "NARA schedule, AU-11"
        accent: teal
        detail: >
          Records are held only for the documented retention period; audit logs
          are kept to their own minimum (three years for general access, longer
          for special categories). An annual SORN review confirms the schedule
          still matches actual flows.
        notes: |
          Step five: retention. This stage enforces the discipline that PII is not
          kept forever — each category is held only for the period documented in
          the PT-2 matrix and its NARA records schedule, then it becomes eligible
          for disposal. The audit trail has its own retention floor under AU-11:
          general access logs kept at least three years, special-category access
          logs (SSN, PHI, financial) kept longer, up to six or seven years
          depending on the category. Voice the annual review loop from the
          lifecycle figure: at each annual privacy assessment the System Privacy
          Officer reviews SORNs against actual data flows using the data flow map,
          confirming the retention schedule still matches reality and that no new,
          undocumented flow has appeared. This is where the lifecycle bends back
          on itself — retention is not a passive wait, it is an actively reviewed
          state with a recurring compliance obligation. Make the point that a
          retention period that has drifted out of alignment with the SORN is
          itself a finding. This is drawn from the NARA schedule discipline and
          the NIST audit-retention control, not a vendor claim. Vendor sources:
          NIST SP 800-53 audit record retention.
        vendor_sources: ["nist_800_53"]
      - label: "Dispose"
        sub: "NIST 800-88 purge"
        accent: red
        detail: >
          At end of purpose, media is sanitized to NIST SP 800-88 and a disposal
          certificate is produced. The purpose that authorized collection has
          ended, so the data must not persist — closing the lifecycle the
          collection stage opened.
        notes: |
          Step six: disposal — closing the lifecycle the collection stage opened.
          When the retention period expires and the purpose that authorized
          collection has ended, the data must be destroyed, not merely archived.
          Disposal is performed to NIST SP 800-88 media sanitization standards —
          purge for most categories, secure destruction plus purge for the most
          sensitive — and each disposal produces a disposal certificate as the
          evidence artifact. The framing to leave the audience with: privacy is a
          full lifecycle obligation, and the end of that lifecycle is as auditable
          as the beginning. A system that collects citizen data with proper
          authority and notice but never disposes of it at end of purpose is out
          of compliance just as surely as one that collected without authority.
          This is also where the purpose-limitation principle of PT-3 reaches its
          logical end: purpose ends, so retention ends, so the data ends. Note the
          disposal method column runs through the entire PT-2 legal authority
          matrix — every PII category row names its disposal method alongside its
          retention period, so disposal is planned at collection, not improvised
          years later. This closes the six-stage build. Vendor sources: NIST
          SP 800-88 media sanitization guidelines and the SP 800-53 catalog.
        vendor_sources: ["nist_800_53"]

  # --- 7. section: authority, notice, consent ------------------------------
  - type: section
    kicker: "PART THREE"
    title: "Authority, notice, and consent — the collection controls"
    callout: "Federal agencies rarely rely on consent; they rely on statute plus notice. PT makes the distinction explicit and auditable."
    callout_accent: navy
    notes: |
      This section drills into the collection-stage controls the lifecycle
      previewed — PT-2 authority, PT-5 notice, and PT-4 consent — because they are
      the ones most often confused and most often gotten wrong in a federal
      context. The key principle to set up: federal agencies generally do not rely
      on individual consent as the legal basis for PII collection; when a statute
      authorizes collection, consent is not required — but notice always is. PT-4
      exists precisely to force the agency to distinguish the two cases in
      writing: statutory collection (notice only) versus voluntary collection
      (consent required). The next three slides give PT-2's legal authority
      matrix, PT-3's purpose specification and its Purview enforcement, and PT-4's
      consent-versus-statute matrix, before PT-5 nails down the notice elements.
      The reason this ordering matters for the audience is that authority,
      purpose, and consent are the questions Legal Counsel and the SAOP must
      answer before a single citizen record is collected — get them documented and
      notice becomes a fill-in-the-blank exercise; get them wrong and the notice
      itself is defective. No vendor claim on the divider.

  # --- 8. content: PT-2 authority to process -------------------------------
  - type: content
    kicker: "PT-2 — AUTHORITY TO PROCESS"
    title: "Every category traces to a statute and a SORN"
    layout: grid
    cards:
      - title: "Specific citation"
        body: "Each PII category needs a specific legal citation — SSN to [enabling statute §section], payment records to [§section]. 'General mission authority' is not sufficient."
        accent: navy
      - title: "Minimum necessary"
        body: "Collection is restricted to the minimum PII necessary for the identified purpose; do not collect SSN if the statute does not require it."
        accent: teal
      - title: "SORN when retrieved by identifier"
        body: "Any system that retrieves PII by name, SSN, or case number is a Privacy Act system of records and needs a published SORN before live collection."
        accent: amber
      - title: "Retention + disposal per row"
        body: "The authority matrix names the retention period and NIST 800-88 disposal method for every category — disposal is planned at collection, not later."
        accent: red
    callout:
      text: "No SORN yet? That is a POA&M item with a milestone no later than 30 days before go-live — published in the Federal Register."
      accent: amber
    notes: |
      This slide covers PT-2, Authority to Process, the control that anchors every
      PII collection to a specific legal basis. The load-bearing point is
      specificity: each PII category in the system must trace to a named statutory
      citation — SSN to the enabling statute's identifier section, payment records to
      its disclosure section, medical and disability records to its
      determination section — and a vague appeal to general mission
      authority does not satisfy the control. PT-2 also restricts collection to
      the minimum PII necessary for the identified purpose, which is why the book
      ties it to the OMB M-17-12 direction to eliminate unnecessary SSN use.
      Second key idea: any system that retrieves PII by a personal identifier —
      name, SSN, case number — is a system of records under the Privacy Act and
      requires a published System of Records Notice. Walk the SORN publication
      chain: draft reviewed by SAOP and Legal, submitted to OMB and Congress for a
      40-day comment period, published in the Federal Register at least 30 days
      before live PII collection begins, and updated whenever purpose, categories,
      or routine uses change materially. The amber callout is the operational
      consequence: if a required SORN does not yet exist, that is a POA&M item
      with a hard milestone no later than 30 days before go-live. Note the
      retention-and-disposal columns that make the matrix a full-lifecycle
      artifact. These are statutory and OMB citations, not a vendor claim. Vendor
      sources: the Privacy Act, OMB M-17-12, and OMB A-130.
    vendor_sources: ["privacy_act", "omb_m1712", "omb_a130"]

  # --- 9. content: PT-3 purpose + Purview ----------------------------------
  - type: content
    kicker: "PT-3 — PURPOSE SPECIFICATION"
    title: "Purpose limitation, enforced by Purview attributes"
    layout: columns
    cards:
      - title: "Purpose per field"
        body: "Each PII field carries a documented collection purpose; use is limited to it. Secondary use needs explicit authorization from statute or a routine use."
        accent: navy
        status: "Documented"
      - title: "Purview custom attributes"
        body: "PT-3 fields map to Purview Data Map attributes — pii_collection_purpose, pii_secondary_use_authorized, pii_minimization_policy, pii_legal_authority — enforcing the limit."
        accent: teal
        status: "Enforced"
      - title: "Annual review"
        body: "A yearly checklist reconciles the data dictionary, the PT-3 matrix, and the Purview attributes; SAOP signs before it enters the ATO package."
        accent: amber
        status: "SAOP-signed"
    callout:
      text: "The artifact defines the purpose; Purview enforces it — but the classifier cannot invent a purpose the matrix never recorded."
      accent: teal
    notes: |
      This slide covers PT-3, Purpose Specification, and the concrete integration
      with Microsoft Purview that turns purpose limitation from a paper assertion
      into an enforced control. Start with the principle: each PII field the system
      collects has a documented collection purpose, use is limited to that
      purpose, and any secondary use — cross-agency identity verification, fraud
      detection analytics — requires explicit authorization from the legal
      authority in PT-2 or a Privacy Act routine use. Uses not listed require a new
      PIA and, for Privacy Act systems, a SORN amendment. Then the enforcement:
      the PT-3 matrix fields map to Purview Data Map custom attributes established
      in the Data Protection and Purview book — pii_collection_purpose as a data
      asset tag and DLP condition, pii_secondary_use_authorized as a boolean that
      triggers an alert if data crosses a boundary without the flag,
      pii_minimization_policy linked to the information protection label, and
      pii_legal_authority as an audit-trail attribute populated from the PT-2
      matrix. The annual purpose-limitation review checklist reconciles three
      things: every field in the system data dictionary appears in the PT-3
      matrix, no field is used for an unlisted purpose, and the Purview attributes
      match the current matrix — with SAOP sign-off before it is filed in the ATO
      package. Voice the teal callout as the doctrine: the artifact defines the
      purpose and Purview enforces it, but the enforcement depends on the
      documentation — the classifier cannot manufacture a purpose the PT-3 matrix
      never recorded. Purview is the vendor claim here. Vendor sources: the
      Purview Data Map documentation and NIST SP 800-53 PT-3.
    vendor_sources: ["ms_purview_datamap", "nist_800_53"]

  # --- 10. content: PT-4 consent vs statutory authority --------------------
  - type: content
    kicker: "PT-4 — CONSENT REQUIREMENTS"
    title: "Statute plus notice, or voluntary plus consent"
    layout: grid
    cards:
      - title: "Statutory: notice only"
        body: "When a statute authorizes collection (benefit application PII), consent is not required — but the PT-5 notice still is."
        accent: navy
      - title: "Voluntary: consent"
        body: "Optional collection (email for alerts) needs an unchecked opt-in checkbox naming what is collected, how it is used, and that refusal carries no penalty."
        accent: teal
      - title: "Automated: notice at point"
        body: "Call recording under statutory authority uses a clear notice before collection begins; the caller may disconnect — no pre-checked boxes."
        accent: amber
      - title: "Inter-agency: the DSA governs"
        body: "PII received from another agency is governed by the data-sharing agreement; individuals are notified through the sending agency's SORN routine use."
        accent: red
    callout:
      text: "PT-4's job is to force the agency to distinguish, in writing, statutory collection from voluntary — the two demand different mechanisms."
      accent: navy
    notes: |
      This slide covers PT-4, Consent Requirements, and its central federal nuance:
      agencies generally do not rely on consent as the legal basis for PII
      collection. When a statute authorizes it, consent is not required — but
      notice under PT-5 always is. Consent applies in specific cases, and PT-4's
      real function is to force the agency to distinguish those cases explicitly.
      Walk the four patterns from the consent mechanism matrix. Statutory
      collection — a citizen filing a benefit application — is notice only; the
      Privacy Act statement is displayed and no consent checkbox is needed.
      Voluntary collection — an optional email address for account alerts — needs
      genuine opt-in consent: an unchecked checkbox (pre-checked boxes are not
      valid consent) that names what data is collected, how it will be used, and
      that participation is voluntary with no penalty for refusal, plus a
      withdrawal path in account settings. Automated collection where notice is
      required but consent is not — call recording under statutory authority in
      the Amazon Connect contact center — uses a clear automated voice notice
      before recording begins, and the caller may disconnect. Inter-agency inbound
      sharing is governed by the data-sharing agreement, and individuals are
      deemed notified through the sending agency's SORN routine use, not a new
      consent step. Note the tracking-technology case: analytics cookies have no
      statutory basis and require OMB M-10-22 consent via a banner with
      Do-Not-Track respected. Each interaction maps to a Purview sensitivity label
      from the Data Protection book. Vendor sources: OMB M-03-22 and OMB A-130
      privacy guidance.
    vendor_sources: ["omb_m0322", "omb_a130"]

  # --- 11. content: PT-5 privacy notice ------------------------------------
  - type: content
    kicker: "PT-5 — PRIVACY NOTICE"
    title: "Six required elements, at a machine-accessible URL"
    layout: columns
    cards:
      - title: "OMB M-03-22 elements"
        body: "Agency identity, legal authority, principal purpose, routine uses, mandatory-or-voluntary, and the effects of non-disclosure — all six, before collection."
        accent: navy
        status: "Six elements"
      - title: "Placement everywhere"
        body: "Full notice on the privacy page, a Privacy Act statement on each form, a cookie banner on first visit, and in-app notice on mobile — at every touchpoint."
        accent: teal
        status: "Every touchpoint"
      - title: "Machine-accessible URL"
        body: "FedRAMP 20x adds a stable privacy-notice URL returning HTTP 200 with the OMB elements, recorded in the SSP and validated at each annual assessment."
        accent: amber
        status: "Assessor-validated"
    callout:
      text: "The URL is the FedRAMP 20x twist — an independent assessor validates the notice without manual intervention."
      accent: amber
    notes: |
      This slide covers PT-5, Privacy Notice, which converts the abstract duty of
      transparency into a concrete, checkable artifact. Start with the six required
      elements from OMB M-03-22 and E-Gov Act section 208 that every federal
      web-based privacy notice must contain: the identity of the collecting
      agency, the legal authority for the collection, the principal purposes, the
      routine uses (disclosures permitted outside the originating system), whether
      providing the information is mandatory or voluntary, and the effects of
      non-disclosure. Notice must be provided at or before the time of collection —
      the model Privacy Act Statement in the book is a fill-in-the-blank template
      that Legal and the SAOP review before publication. Then placement: the full
      notice on the website privacy page linked from every footer, a Privacy Act
      statement or link above each online form, a cookie and tracking banner on
      first visit under OMB M-10-22, an in-app notice at first mobile launch, and
      a reference to the notice URL in email confirmations. The FedRAMP 20x
      addition is the machine-accessible requirement: a stable, publicly reachable
      privacy-notice URL that returns a valid HTTP 200 and contains the
      OMB-required elements, recorded in the SSP System Description under Privacy
      Posture, and validated as part of each annual privacy assessment. Voice the
      amber callout: this is the twist that makes the notice assessor-friendly — an
      independent assessor can validate the notice without manual intervention,
      which is exactly the FedRAMP 20x machine-readable-evidence philosophy applied
      to privacy. Vendor sources: OMB M-03-22, the E-Government Act of 2002
      (section 208), and the FedRAMP 20x program.
    vendor_sources: ["omb_m0322", "egov_act", "fedramp_20x"]

  # --- 12. section: special categories -------------------------------------
  - type: section
    kicker: "PART FOUR"
    title: "Special categories and making it auditable"
    callout: "SSN, PHI, financial, and biometric data earn heightened protection — and the whole estate becomes auditable through one data flow map."
    callout_accent: red
    notes: |
      This final section covers PT-7 Special Categories and the artifact that makes
      the entire PT family auditable — the PII data flow map — before closing on
      the control-closure spine and the KSI alignment. Set up PT-7 as the control
      that recognizes not all PII is equal: SSN, financial account numbers,
      medical and PHI records, biometrics, precise geolocation, citizenship
      status, and genetic information each carry authorities for heightened
      protection beyond the general PII baseline. Then set up the data flow map as
      the answer to a requirement PT-2 through PT-7 collectively impose: the agency
      must know where its PII is, and the data flow map is the single artifact that
      makes that knowledge auditable and reviewable at each annual assessment.
      Purview Data Map lineage provides automated discovery, but the flow map is
      the authoritative human-reviewed record the two are reconciled against. The
      next slides give the special-category control matrix, the data flow map, and
      the PT control-closure summary that ties every control to its closing
      artifact. No vendor claim on the divider.

  # --- 13. table: special category control matrix --------------------------
  - type: table
    kicker: "PT-7 — SPECIAL CATEGORIES"
    title: "Heightened protection by category"
    headers: ["Category", "Purview Label", "Encryption", "Access + Logging"]
    rows:
      - cells: ["SSN (full)", "Restricted-SSN", "AES-256 at rest, TLS 1.3, CMK-managed", "Least privilege, MFA, no service acct; 7-yr audit"]
        accent: red
      - cells: ["Financial account", "Restricted-Financial", "AES-256, CMK, never logged plaintext", "Payment roles only, dual-approval; anomaly alert"]
        accent: amber
      - cells: ["Medical / PHI", "Restricted-PHI", "AES-256, CMK, column-level for PHI fields", "Adjudicators scoped to cases; 6-yr HIPAA trail"]
      - cells: ["Biometric", "Restricted-Biometric", "AES-256, separate at-rest key", "Service account only; alert on any human read"]
        accent: red
      - cells: ["Citizenship / status", "Restricted-Sensitive", "AES-256, CMK-managed", "Need-to-know, no bulk export; alert on bulk export"]
      - cells: ["SSN (masked, last 4)", "Confidential-PII", "Standard GCC Moderate encryption", "Standard role-based; standard audit log"]
        accent: teal
    callout:
      text: "OMB M-17-12 drives SSN handling — mask to last four except where full SSN is operationally required and role-gated."
      accent: navy
    notes: |
      This is the PT-7 special-category control matrix — the heart of heightened
      protection, read category by category. Do not read every cell; read the
      pattern. Each special category gets three things beyond general PII: a
      dedicated Purview sensitivity label from the Data Protection book, an
      encryption posture, and an access-plus-logging tier. Full SSN is the most
      protected — Restricted-SSN label, AES-256 at rest with customer-managed keys
      and TLS 1.3 in transit, least-privilege role-based access with MFA and no
      service-account access, and all reads and writes logged to Sentinel with
      seven-year retention. Financial account numbers are Restricted-Financial,
      never logged in plaintext, limited to payment-processing roles with
      dual-approval for changes and anomaly alerting. Medical and PHI records are
      Restricted-PHI with column-level encryption for PHI fields, access scoped to
      adjudicators on assigned cases, and a HIPAA-compliant six-year audit trail.
      Biometric data is the strictest access model — service-account access only,
      with an alert on any human read of raw biometric data. Citizenship and
      immigration status is Restricted-Sensitive, need-to-know, no bulk export.
      Contrast the last row: masked SSN (last four only) drops to Confidential-PII
      with standard encryption — showing that minimization changes the protection
      tier. Voice the navy callout: OMB M-17-12 drives the SSN handling policy —
      display the last four except where full SSN is operationally required and
      role-gated, and eliminate unnecessary SSN use as a system identifier. Purview
      classifiers auto-label these categories and block external sharing. Vendor
      sources: OMB M-17-12, the HHS HIPAA Privacy Rule, NIST SP 800-122 (PII
      confidentiality guidance), and the Purview Data Map.
    vendor_sources: ["omb_m1712", "hipaa_privacy", "nist_800_122", "ms_purview_datamap"]

  # --- 14. content: the PII data flow map ----------------------------------
  - type: content
    kicker: "THE AUDITABLE ARTIFACT"
    title: "The data flow map — knowing where PII is"
    layout: grid
    cards:
      - title: "One row per flow"
        body: "Each discrete PII flow gets a Flow ID with source, categories, purpose, destination, cross-boundary flag, encryption, retention, and disposal."
        accent: navy
      - title: "Four required scenarios"
        body: "Citizen portal intake, Amazon Connect contact center, HR/workforce, and cross-agency API — all four documented before authorization."
        accent: teal
      - title: "Reconciled to Purview lineage"
        body: "A quarterly Purview lineage scan is compared to the manual registry; any flow in lineage but not the registry is investigated before the annual review."
        accent: amber
      - title: "Reviewed annually"
        body: "The map is maintained current and reviewed at each annual privacy assessment — undocumented flows would constitute unauthorized secondary use."
        accent: red
    callout:
      text: "PT-2 through PT-7 all require the agency to know where its PII is; the data flow map is the single artifact that makes that auditable."
      accent: navy
    notes: |
      This slide covers the PII data flow map, the artifact that makes the whole PT
      family auditable rather than merely asserted. The framing: PT-2 through PT-7
      collectively require the agency to know where its PII is, and the data flow
      map is the single document that makes that knowledge auditable and
      reviewable. Each discrete flow of PII from source to destination gets a
      unique Flow ID and a row capturing source system, PII categories, processing
      purpose, destination, whether it crosses a boundary, encryption in transit
      and at rest, retention period, and disposal method. Walk the four scenarios
      that must be documented before FedRAMP 20x authorization: citizen portal
      intake (confirm PT-5 notice displays before any PII is collected and SSN
      auto-labeling triggers), the Amazon Connect contact center (call routing,
      recording storage, CRM write, and screen-pop, with recording consent per
      PT-4), HR and workforce (payroll, benefits, OPM SORN coverage, FEHB carrier
      sharing under DSA), and cross-agency API sharing (a signed DSA on file, the
      sending agency's SORN covering the receiving use, and GCC Moderate
      encryption with mutual TLS preferred). Then the reconciliation loop: Purview
      Data Map lineage scans registered data sources quarterly and builds an
      automated lineage graph; that graph is compared against the manual registry,
      and any flow appearing in lineage but not the registry must be investigated,
      documented, or remediated before the next annual review. Voice the red card:
      an undocumented flow is not a paperwork gap, it is potential unauthorized
      secondary use. Vendor sources: the Microsoft Purview Data Map lineage
      documentation.
    vendor_sources: ["ms_purview_datamap"]

  # --- 15. table: PT control closure summary -------------------------------
  - type: table
    kicker: "CONTROL CLOSURE"
    title: "Six PT controls, six closing artifacts"
    headers: ["Control", "Title", "Closing Artifact"]
    rows:
      - cells: ["PT-1", "Policy and Procedures", "Privacy Program Plan (SAOP + CISO co-signed)"]
        accent: navy
      - cells: ["PT-2", "Authority to Process PII", "Legal Authority Matrix + SORN Registry"]
        accent: teal
      - cells: ["PT-3", "Personally Identifiable Information Processing Purposes", "Purpose Matrix + Purview attribute mapping"]
      - cells: ["PT-4", "Consent", "Consent Mechanism Matrix (statute vs voluntary)"]
        accent: amber
      - cells: ["PT-5", "Privacy Notice", "Model notice + placement + machine-accessible URL"]
      - cells: ["PT-7", "Specific Categories of PII", "Special-Category Control Matrix + SSN policy"]
        accent: red
    callout:
      text: "Closure Necessity — every PT control closes through a documentation artifact, not the network substrate. Purview enforces; it cannot supply statute or notice."
      accent: amber
    notes: |
      This is the control-closure spine for the book — six NIST SP 800-53 Rev 5
      Privacy controls, each mapped to the single artifact that closes it. Read
      the pattern: PT-1 closes through the Privacy Program Plan co-signed by the
      SAOP and CISO; PT-2 through the legal authority matrix and SORN registry;
      PT-3 through the purpose-specification matrix and its Purview attribute
      mapping; PT-4 through the consent-mechanism matrix that distinguishes
      statutory from voluntary collection; PT-5 through the model notice, its
      placement requirements, and the machine-accessible URL; and PT-7 through the
      special-category control matrix and SSN handling policy. The single most
      important thing to voice is the amber callout — the Closure Necessity for the
      whole family. Every one of these controls closes through a documentation
      artifact, not through the network substrate. This is the series' strongest
      class of claim used in the opposite direction from most books: the necessity
      here is documentation, and saying so plainly is exactly what preserves the
      credibility of the technology-necessity claims made elsewhere. Purview
      labeling and DLP from the Data Protection book enforce the purposes and
      categories these artifacts define, but no classifier, resolver, or
      enforcement point can supply the statutory authority or the published notice
      the Privacy Act requires. Note that these six are the controls this book
      closes; PT-6 and PT-8 appear in the lifecycle figure but are out of this
      book's closure scope. Keep the scope discipline: this is GCC Moderate /
      FedRAMP Moderate throughout, no High baseline claims. Vendor sources: the
      NIST SP 800-53 Rev 5 privacy control catalog.
    vendor_sources: ["nist_800_53"]

