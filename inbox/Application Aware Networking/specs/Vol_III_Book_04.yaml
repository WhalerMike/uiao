# AAN briefing-deck spec — Vol III Book 04: Cloud-Native Security Posture & Containers
# Distills inbox/Application Aware Networking/Vol_III_Book_04_FedAAN_Cloud_Native_Posture.qmd
# Schema: module docstring in src/uiao/generators/aan_deck.py
# Build:
#   uiao generate aan-deck \
#     --spec "inbox/Application Aware Networking/specs/Vol_III_Book_04.yaml" \
#     --out  "inbox/Application Aware Networking/Vol_III_Book_04_FedAAN_Cloud_Native_Posture.pptx" \
#     --date-code "2026-07-09 08:15 ET"
deck:
  title: "Cloud-Native Security Posture & Containers"
  subtitle: "CSPM, CNAPP, and Kubernetes — closing the misconfiguration, exposure, and runtime gaps host scanning misses"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOL III BOOK 04"
  date_code: "2026-07-09 08:15 ET"
  journey:
    - "Misconfig"
    - "Expose"
    - "Compose"
    - "Contain"
  sources:
    nist_800_218: "https://csrc.nist.gov/pubs/sp/800/218/final"
    cisa_scuba: "https://www.cisa.gov/scuba"
    cisa_kev: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
    ms_defender_cloud: "https://learn.microsoft.com/azure/defender-for-cloud/"
    prisma_cloud_fedramp: "https://www.paloaltonetworks.com/blog/prisma-cloud/fedramp-high-impact-ready/"
    wiz_gov_fedramp: "https://www.wiz.io/blog/wiz-achieves-fedramp-high-authorization"
    fedramp_marketplace: "https://marketplace.fedramp.gov/"

slides:
  # 1 --- title ---------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for Volume III, Book 04. The Vulnerability Management book
      finds missing patches on hosts; the Patch & Systems Management book applies
      them (SI-2) across platforms. Neither of those disciplines sees the risks
      that live in the cloud control plane and the container layer: a
      world-readable storage bucket, an over-permissive IAM role, an
      internet-exposed workload, an unscanned container image, a privileged pod.
      This book closes exactly that surface with three overlapping disciplines —
      cloud security posture management (CSPM), cloud-native application
      protection (CNAPP), and Kubernetes/container security — and it routes every
      finding into the same evidence fabric as every other source. Set expectation
      up front on scope: the series targets FedRAMP Moderate exclusively (SSA GCC
      Moderate baseline). One honest procurement flag runs through the whole deck
      and we will name it plainly — the most complete CNAPP products the agency
      prefers are FedRAMP High, while the natively-Moderate option is Microsoft
      Defender for Cloud. This is a draft CSI-team proposal, pre-decisional, not
      an approved SSA position. Walk the four-word journey strip — Misconfig,
      Expose, Compose, Contain — as the spine of the talk before diving in.

  # 2 --- section -------------------------------------------------------------
  - type: section
    kicker: "PART ONE"
    title: "The gap host scanning leaves"
    callout: "A host scanner answers 'what CVEs are on this VM.' It never answers 'is this bucket public,' 'can this workload reach the internet,' or 'does this role grant far more than it uses.'"
    callout_accent: navy
    notes: >
      This section motivates the whole book. A host vulnerability scanner is
      excellent at one question — what CVEs are on this VM — and structurally
      blind to the questions that actually start most cloud incidents. Is this
      storage bucket public? Can this workload reach the internet, and what can it
      reach in turn? Does this IAM role grant far more than it uses? Was this
      container image scanned before it ran? Those are cloud-control-plane and
      container-layer questions. On a multi-cloud estate — AWS GovCloud, Azure,
      OCI, plus Kubernetes across AKS, EKS, OKE, and OpenShift — misconfiguration,
      excessive entitlement, and exposure are where real cloud incidents begin,
      not an unpatched kernel. The presenter's job in this section is to make the
      audience feel the shape of the blind spot before we name the tools that
      close it. Everything that follows is organized around three disciplines that
      each address a different slice of that blind spot, and all three feed the
      one compliance picture rather than standing up yet another siloed dashboard.
      Ground the stakes with an example the audience will recognize: nearly every
      publicized cloud breach of the last decade — exposed storage, a leaked
      access key, an over-permissioned role pivoting to a data store — was a
      control-plane or identity failure, not a kernel CVE, and the host scanner
      would have reported that VM as perfectly clean. That is the entire argument
      for this book: the estate needs a second set of eyes trained on
      configuration, exposure, entitlement, and the container layer, and those
      eyes have to report into the same fabric so the compliance picture stays
      whole rather than fragmenting across yet more vendor consoles.

  # 3 --- content grid --------------------------------------------------------
  - type: content
    kicker: "WHAT THIS BOOK ADDRESSES"
    title: "Three overlapping disciplines close the cloud-plane & container surface"
    layout: grid
    cards:
      - title: "CSPM"
        body: "Continuous detection of cloud-resource MISCONFIGURATION against a secure baseline, across every CSP (CM-6)."
        accent: navy
      - title: "CNAPP"
        body: "One platform spanning workload vulnerability (CWPP), network exposure / attack-path, entitlements (CIEM), and shift-left IaC/code scanning."
        accent: teal
      - title: "K8s / Container"
        body: "Image scanning, admission control (CM-7), hardening, and runtime threat detection (SI-3) — the layer host tools do not reach."
        accent: amber
      - title: "Evidence fabric"
        body: "Every finding emits the unified evidence-record contract, keyed to asset identity, rolling up to CDM and FedRAMP 20x KSIs."
        accent: red
    callout:
      text: "Posture is not a standalone dashboard — it is one more source in the one compliance picture."
      accent: navy
    notes: >
      This is the map of the book. Four cards, three disciplines plus the common
      exhaust pipe. CSPM is continuous misconfiguration detection against a secure
      cloud baseline, expressed as a CM-6 control applied to cloud resources
      rather than OS images. CNAPP is the unified platform that pulls together
      what used to be four or five separate tools — workload vulnerability
      scanning (CWPP), network exposure and attack-path analysis, cloud
      entitlement management (CIEM), and shift-left scanning of infrastructure-as-
      code and application code before deploy. Kubernetes and container security
      is the third discipline: image scanning in the registry, admission control
      that denies non-compliant workloads at the gate, and behavioral runtime
      detection inside running containers. The fourth card is the through-line of
      the entire AAN series — none of these live as an island. Each finding, a
      CSPM misconfiguration verdict, a CWPP vulnerability, an attack-path alert,
      an admission denial, emits the same unified evidence-record contract into
      the fabric, keyed to authoritative asset identity, and rolls up to CISA CDM
      and the FedRAMP 20x KSI pipeline. Land the callout: the value is a single
      compliance picture, not another pane of glass.

  # 4 --- content grid --------------------------------------------------------
  - type: content
    kicker: "CSPM · CM-6"
    title: "Misconfiguration is the cloud's dominant risk"
    layout: grid
    cards:
      - title: "Storage exposure"
        body: "World-readable buckets and blobs — the classic cloud breach root cause."
        accent: navy
      - title: "Network / SG rules"
        body: "Over-broad security-group and firewall rules that open workloads to the internet."
        accent: teal
      - title: "Keys, secrets, logging"
        body: "Mishandled keys and secrets; missing or disabled control-plane logging."
        accent: amber
      - title: "IAM policy drift"
        body: "Entitlements that widen over time away from a least-privilege baseline."
        accent: red
    callout:
      text: "CSPM emits a baseline_conformance verdict into the fabric — the cloud-plane complement to the Patch book's OS-level CM-6. Same control, different layer."
      accent: teal
    notes: >
      CM-6 is Configuration Settings. Most people first meet it as OS hardening —
      CIS benchmarks on a VM image. CSPM applies the identical control one layer
      up, to cloud resources: storage exposure, network security-group rules,
      key and secret handling, logging gaps, and IAM policy drift. These four
      cards are the recurring misconfiguration families, and storage exposure —
      the world-readable bucket — remains the archetypal cloud breach. The point
      to hammer is that CSPM detects these continuously across every CSP and emits
      a baseline_conformance verdict into the evidence fabric's contract, exactly
      as a host scanner emits its findings. This is the cloud-plane complement to
      the Patch & Systems Management book's OS-level CM-6 — same control number,
      different layer, and both books contribute to closing it. Do not let the
      audience hear this as duplication; hear it as coverage. The host tooling and
      the cloud posture tooling report the same control from two vantage points,
      and the fabric reconciles them. Misconfiguration, not the unpatched kernel,
      is where the money is on a modern multi-cloud estate. One more operational
      point worth voicing: CSPM is continuous and agentless at the control-plane
      level — it reads the CSP's own configuration APIs rather than requiring an
      agent on every workload — so coverage does not depend on an install
      campaign and drift is caught within minutes of the change, not at the next
      scan window. That immediacy is what makes CM-6 at the cloud plane a live
      control rather than a periodic audit.

  # 5 --- section -------------------------------------------------------------
  - type: section
    kicker: "PART TWO"
    title: "CNAPP — one platform, four overlapping views"
    callout: "The distinctive CNAPP capability is not any single view — it is composing them into one prioritized finding no host scanner produces."
    callout_accent: teal
    notes: >
      Part Two is the heart of the book. A cloud-native application protection
      platform, CNAPP, unifies tools that grew up separately. The next slide lays
      out the four-to-five views as a reference table the audience should read,
      not be walked through. Then we walk through the one thing that makes CNAPP
      more than a bundle: the attack-path view, which composes misconfiguration,
      exposure, vulnerability, and entitlement into a single prioritized finding.
      Frame it here so the table lands as inventory and the build sequence lands
      as the payoff. Add the historical framing so the audience understands why
      the term CNAPP exists at all: five years ago an agency wanting this coverage
      bought CSPM from one vendor, workload scanning from another, entitlement
      analysis from a third, and code scanning from a fourth, then paid an
      integration team to correlate their outputs by hand. CNAPP is the market's
      answer to that pain — one platform that holds all the views, so correlation
      is a product feature instead of a services engagement. That consolidation
      is not just procurement convenience; it is the technical precondition for
      the attack-path composition we walk through next, which is impossible when
      the four signals live in four disconnected tools. Keep the FedRAMP Moderate
      scope in view — the platform-selection flag we raise in Part Four is about
      which CNAPP product carries
      which authorization, and it colors how the agency actually procures this
      capability. A useful way to set up the table on the next slide: the five
      views are not five products the agency has to integrate — that was the old
      world, where CSPM, workload scanning, entitlement analysis, and code
      scanning were four contracts and four consoles. CNAPP's premise is that
      one platform holds all of them, which is what makes the cross-view
      composition on the following slides even possible. Ask the audience to read
      the table as inventory, then watch the build sequence turn that inventory
      into a single, ranked, human-actionable result. That contrast — a pile of
      views versus one composed finding — is the whole reason the market
      consolidated on CNAPP.

  # 6 --- table --------------------------------------------------------------
  - type: table
    kicker: "THE CNAPP VIEWS"
    title: "Four overlapping views, one platform — plus shift-left"
    headers: ["CNAPP view", "Question it answers", "Control", "Where it closes"]
    rows:
      - cells: ["CSPM", "Is the cloud resource misconfigured?", "CM-6", "This book"]
        accent: navy
      - cells: ["CWPP", "Is the workload / image vulnerable?", "RA-5", "This book (assessment; SI-2 handoff to Patch)"]
        accent: teal
      - cells: ["Network / attack path", "Can this workload be reached — and what can it reach?", "SC-7", "This book (cloud-plane SC-7)"]
        accent: amber
      - cells: ["CIEM", "Does this identity have far more access than it uses?", "AC-6", "Cross-ref: Privileged Access Mgmt book"]
        accent: red
      - cells: ["Code / IaC (shift-left)", "Is the misconfig or vuln present BEFORE deploy?", "SA-11", "This book (SSDF, NIST SP 800-218)"]
        accent: navy
    callout:
      text: "Attack path (SC-7) is the distinctive view — cloud-plane closure, distinct from the customer-edge SC-7 the Network Enforcement book closes on gear."
      accent: amber
    notes: >
      This is a reference table — let the audience read it. Five rows map the
      CNAPP views to the question each answers, the NIST SP 800-53 Rev 5 control
      it satisfies, and where in this series it closes. CSPM answers 'is the cloud
      resource misconfigured' and closes CM-6 here. CWPP answers 'is the workload
      or image vulnerable' and closes RA-5 as an assessment, handing the actual
      remediation to the Patch & Systems Management book for SI-2. The network /
      attack-path view answers 'can this workload be reached, and what can it
      reach' and closes SC-7 at the cloud plane — explicitly distinct from the
      customer-edge SC-7 that the Network Enforcement Substrate book closes on
      physical gear. CIEM answers 'does this identity have far more access than it
      uses,' an AC-6 least-privilege question the deck cross-references to the
      Privileged Access Management book at the cloud-entitlement layer. And the
      shift-left code/IaC view answers 'is the misconfiguration or vulnerability
      present before deploy,' closing SA-11 developer testing against the Secure
      Software Development Framework, NIST SP 800-218. The callout names the star:
      attack path is the view no host scanner produces. Control mappings use the
      FedRAMP Moderate baseline.
    vendor_sources: ["nist_800_53", "nist_800_218", "nist_800_207"]

  # 7 --- build-sequence (5 steps) -------------------------------------------
  - type: build-sequence
    kicker: "THE ATTACK-PATH COMPOSITION"
    title: "How CNAPP turns four signals into one prioritized finding"
    notes: >
      Fallback notes: the attack-path view composes four independent signals into
      a single ranked finding that no single-signal tool produces.
    steps:
      - label: "Misconfiguration"
        sub: "CSPM · CM-6"
        accent: navy
        detail: >
          Start with a cloud-resource misconfiguration verdict — for example, a
          workload placed in a subnet whose security-group rules leave a path open.
          On its own, a misconfiguration is a finding, but not yet a priority.
        notes: >
          Step one of the attack-path composition. CSPM supplies the first signal:
          a cloud-resource misconfiguration verdict against the secure baseline —
          say, a workload whose security-group rules leave a network path open, or
          a role attached more broadly than policy intends. Emphasize that in
          isolation this is just one of thousands of CM-6 findings a large estate
          produces daily. The reason attack-path analysis matters is precisely
          that a raw misconfiguration list is un-triageable at scale. Hold this
          thought: the finding becomes actionable only when three more signals are
          layered onto it. This step establishes the substrate — the configuration
          state of the resource — that the next three steps will qualify. Present
          it calmly; the drama is in the composition, not any single signal. Give
          the audience a number to feel the scale problem: a mid-size cloud estate
          routinely carries tens of thousands of open CM-6 findings at any moment,
          and a security team that tries to work that list top-to-bottom will
          never reach the ones that matter. This is exactly the failure mode
          attack-path analysis exists to fix — it does not generate more findings,
          it ranks the ones you already have by real-world exploitability, and it
          starts from this configuration signal as the raw material.
      - label: "Exposure"
        sub: "Network / attack path · SC-7"
        accent: teal
        detail: >
          Overlay reachability. Is this workload actually internet-reachable, and
          what can it reach in turn? Exposure analysis turns a static config into a
          live network fact — the SC-7 cloud-plane view.
        notes: >
          Step two overlays exposure. The network / attack-path view asks whether
          the misconfigured workload from step one is actually reachable from the
          internet, and, just as important, what that workload can reach in turn —
          lateral movement toward data stores and privileged services. This is the
          SC-7 boundary-protection control expressed at the cloud plane, distinct
          from the customer-edge SC-7 the Network Enforcement Substrate book closes
          on physical gear. The key idea for the audience: exposure converts a
          static configuration fact into a live network fact. A misconfiguration
          that is not reachable is a lower priority than one that sits directly on
          an internet-facing path. We are now narrowing the un-triageable list from
          step one down to the subset that an attacker could actually touch. Make
          the reachability point tangible: two workloads can carry the identical
          misconfiguration, but if one sits behind a private subnet with no
          inbound path and the other is one hop from an internet-facing load
          balancer, they are not the same risk, and no configuration scanner alone
          can tell them apart. Exposure analysis models the actual network graph —
          security groups, routes, peering, public IPs — to answer the reachability
          question, which is why it belongs to SC-7 boundary protection at the
          cloud plane. This is the step that turns a spreadsheet of settings into a
          map of what an outside attacker can actually reach.
        vendor_sources: ["nist_800_207"]
      - label: "Vulnerability"
        sub: "CWPP · RA-5"
        accent: amber
        detail: >
          Add workload and image vulnerability. Agentless CWPP scanning finds a
          critical, exploitable CVE on the exposed workload — cross-referenced
          against the CISA KEV catalog for real-world exploitation.
        notes: >
          Step three adds the vulnerability signal. Agentless cloud-workload and
          container-image scanning — the CWPP view, closing RA-5 — determines
          whether the exposed, misconfigured workload also carries a critical,
          exploitable vulnerability. Cross-referencing against the CISA Known
          Exploited Vulnerabilities catalog, mandated by BOD 22-01, tells us
          whether that CVE is being exploited in the wild right now, not just
          whether it exists. Now the composition is getting sharp: we have a
          workload that is misconfigured, internet-reachable, and carrying a
          known-exploited critical vulnerability. That is already a small set. But
          the reason it deserves the top of the queue comes in the next step — what
          the attacker gains if they land on it. Remediation of the vulnerability
          itself is handed to the Patch & Systems Management book for SI-2; for
          containers it is a rebuild, not a host patch. Stress the KEV distinction
          because it is where most triage time is wasted: a CVSS score tells you
          how bad a vulnerability could theoretically be, while the CISA KEV
          catalog tells you which vulnerabilities are being weaponized by real
          adversaries today. Prioritizing by KEV membership rather than raw CVSS is
          the single highest-leverage move in vulnerability triage, and CNAPP does
          it automatically as one of the four composed signals rather than leaving
          it to an analyst to look up. A critical CVE that is not on KEV and is not
          reachable can wait; a KEV-listed CVE on a reachable, over-permissioned
          workload cannot.
        vendor_sources: ["cisa_kev"]
      - label: "Entitlement"
        sub: "CIEM · AC-6"
        accent: red
        detail: >
          Add the blast radius. CIEM shows the workload's identity holds an
          over-permissioned role reaching the sensitive data store — far more
          access than it ever uses. Least privilege (AC-6) violated.
        notes: >
          Step four adds blast radius. Cloud infrastructure entitlement management,
          CIEM, examines the identity attached to the exposed, vulnerable workload
          and asks the AC-6 least-privilege question: does this identity hold far
          more access than it ever uses? When the answer is that the workload's
          role can reach a sensitive data store it never touches in practice, the
          consequence of compromise jumps from 'one host' to 'the data.' This is
          the signal that most separates a real incident from a noisy finding, and
          it is the layer the deck cross-references to the Privileged Access
          Management book at the cloud-entitlement tier. With four signals now
          stacked — misconfigured, reachable, exploitable, over-permissioned — we
          have everything needed to rank this above the thousands of findings that
          share only one or two of those properties. The final step composes them.
          Underline why entitlement is the signal that flips a finding from
          annoying to urgent: an attacker who lands on a workload inherits that
          workload's identity and every permission it holds. If the identity is
          scoped tightly, a compromise is contained to the box; if it can read or
          write a sensitive data store it never legitimately touches, the same
          compromise is a data breach. CIEM measures the gap between permissions
          granted and permissions actually used, which is how it surfaces the
          over-provisioned roles that turn a foothold into a catastrophe — the
          AC-6 least-privilege violation made concrete and measurable.
      - label: "Prioritized finding"
        sub: "One ranked result"
        accent: teal
        detail: >
          Compose: 'this internet-reachable workload has a known-exploited critical
          vuln and an over-permissioned role to the data store.' One prioritized
          finding — no host scanner produces it. It emits to the evidence fabric.
        notes: >
          The payoff. CNAPP composes the four signals — misconfiguration plus
          exposure plus vulnerability plus entitlement — into a single sentence a
          human can act on: 'this internet-reachable workload has a critical,
          known-exploited vulnerability and an over-permissioned role to the data
          store.' That is one prioritized finding, at the top of a ranked queue,
          and no host vulnerability scanner produces it because no single tool sees
          all four planes at once. This is the distinctive CNAPP capability and the
          reason the platform is more than a bundle of its views. Close the
          sequence by connecting to the series spine: this composed finding is not
          a dead-end alert in a vendor console — it emits the same unified
          evidence-record contract into the fabric, keyed to authoritative asset
          identity, and rolls up to CISA CDM and the FedRAMP 20x KSI pipeline like
          every other source. The attack path is a cloud-plane SC-7 closure that
          feeds the one compliance picture. Land the business case in one line the
          audience will carry out of the room: the same four signals, viewed
          separately, produce four un-prioritized worklists that overwhelm a team;
          viewed together, they produce a short, ranked list of the handful of
          exposures that could actually become tomorrow's incident. That is the
          difference between security theater and security work, and it is why the
          agency should insist any CNAPP selection can demonstrate real attack-path
          composition — not just badge the four views as line items on a data
          sheet. This is the reference state (all steps complete) to export back
          into the Book as the attack-path figure.

  # 8 --- section -------------------------------------------------------------
  - type: section
    kicker: "PART THREE"
    title: "Kubernetes & container security (CM-7, SI-3)"
    callout: "Containers add a layer host tools do not reach: the registry, the admission gate, and the running pod."
    callout_accent: amber
    notes: >
      Part Three moves from the cloud control plane to the container layer.
      Containers add a layer that host tooling structurally cannot reach: images
      built and stored in a registry, workloads admitted through a Kubernetes
      admission gate, and processes executing inside running pods. Each of those
      three moments is a distinct control opportunity — build-time image scanning,
      deploy-time admission control, and runtime threat detection. The next slide
      lays out all three. Keep the framing that this is the container path the
      Patch & Systems Management book explicitly defers here: for containers,
      remediation is a rebuild of the image, not a patch applied to a running
      host, so the discipline and the tooling are genuinely different from
      OS-level patching even though the underlying controls rhyme. Why this
      deserves its own section rather than a footnote: the estate runs Kubernetes
      across AKS, EKS, OKE, and OpenShift, and a container that never appears as
      a persistent host in the CMDB is invisible to the entire host-scanning
      pipeline that Volume III's other books rely on. If the agency stands up
      cloud-native workloads without this layer, it has a growing population of
      production compute that no existing control touches. That is the gap this
      section closes, and it closes it at three well-defined moments rather than
      hoping to catch problems after the fact on a live system.

  # 9 --- content columns (3 cards w/ status) --------------------------------
  - type: content
    kicker: "THE CONTAINER LAYER"
    title: "Scan at build, deny at the gate, watch at runtime"
    layout: columns
    cards:
      - title: "Image scanning"
        body: "Vulnerabilities and secrets caught in the REGISTRY at build time (CWPP/RA-5). Remediation is a rebuild, not a host patch — the container path the Patch book defers here."
        accent: navy
        status: "Build time · RA-5"
      - title: "Admission control"
        body: "Kubernetes admission policy DENIES non-compliant workloads at deploy: no privileged pods, no unscanned images, no latest tags. Least functionality enforced at the gate."
        accent: teal
        status: "Deploy time · CM-7"
      - title: "Runtime detection"
        body: "Behavioral detection in RUNNING containers — unexpected process, drift from the image, lateral movement inside the pod."
        accent: amber
        status: "Runtime · SI-3"
    callout:
      text: "Three moments, three controls: build-time RA-5, deploy-time CM-7, runtime SI-3 — a continuum the running-host model never had."
      accent: navy
    notes: >
      Three cards, three moments in a container's life, three controls. First,
      image scanning: vulnerabilities and embedded secrets are caught in the
      registry at build time, closing RA-5 through the CWPP view. The crucial
      operational difference from host patching is that remediation is a rebuild
      of the image, not a patch applied to a running host — this is the container
      path the Patch & Systems Management book explicitly defers to this book.
      Second, admission control: Kubernetes admission policy denies non-compliant
      workloads at the moment of deploy — no privileged pods, no unscanned images,
      no floating latest tags. That is CM-7 least functionality enforced at the
      gate rather than audited after the fact. Third, runtime threat detection:
      behavioral monitoring inside running containers watches for an unexpected
      process, drift away from the original image, or lateral movement — closing
      SI-3 malicious-code protection at the container layer. The through-line in
      the callout is that containers give you a clean three-moment continuum —
      build, deploy, run — that the mutable running-host model never offered.
      Draw the contrast explicitly for the audience: on a long-lived VM,
      configuration drifts continuously and remediation means changing a running
      system in place, which is risky and often deferred. A container is
      immutable by design — you do not patch it, you rebuild the image and
      redeploy — so the admission gate can hard-deny anything that fails policy
      without breaking a running workload, and runtime detection has a crisp
      baseline (the image) to measure drift against. That immutability is exactly
      what makes deploy-time CM-7 enforcement practical here in a way it never was
      on hosts, and it is why the Patch book hands the container path to this one.

  # 10 --- section ------------------------------------------------------------
  - type: section
    kicker: "PART FOUR"
    title: "The Moderate decision — an honest procurement flag"
    callout: "The most complete CNAPP the agency prefers is FedRAMP High. The natively-Moderate option is Microsoft Defender for Cloud. We name the flag, we do not hide it."
    callout_accent: amber
    notes: >
      Part Four is the honest-flag section, and it must be presented plainly. The
      series targets FedRAMP Moderate exclusively — SSA's GCC Moderate boundary.
      That creates a real procurement tension the next slide lays out. Microsoft
      Defender for Cloud does multi-cloud CSPM and CWPP across AWS, GCP, and Azure
      and is available within GCC at FedRAMP Moderate — a clean fit for the
      Moderate-only boundary and, under the Microsoft-preference rule when a
      Microsoft product coordinates the multi-vendor surface at Moderate, the
      leading candidate. But the agency prefers Palo Alto Prisma Cloud, the most
      complete CNAPP on the market, and Prisma Cloud is FedRAMP High-only, as is
      Wiz for Government. Under the Moderate-exclusive scope rule this is a flag,
      not a disqualifier: High exceeds Moderate, so either product may be used if
      the boundary treatment is documented, or Defender for Cloud is selected to
      stay natively at Moderate. The point of this section is to record the
      decision transparently, not to pre-empt it — it is an explicit procurement
      and boundary decision that belongs in the Product Inventory Questionnaire's
      flag list, verified against the FedRAMP Marketplace at procurement. Say
