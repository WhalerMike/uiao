slides:
  # 1 --- title --------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for Volume VI, Book 07 — the deployable realization of the
      Volume III Multi-Cloud Evidence Fabric and the Volume IV continuous-
      monitoring and authorization-package architecture. Every other book in
      Volume VI emits deployment and operating evidence: a drift record from the
      baselines book, a detection firing, a revocation action, a key rotation.
      Scattered, that telemetry proves nothing. This book carries the pipeline
      that consumes it and turns it into machine-readable, control-bound
      continuous-monitoring evidence. Walk the journey strip, because it is the
      pipeline itself: Collect the normalized evidence-contract record every
      mechanism writes; Correlate records on authoritative asset identity and
      time; Bind each record to the NIST control and the FedRAMP 20x Key
      Security Indicator it satisfies; and Emit the machine-readable OSCAL
      authorization package. This is where we deploy the control becomes here is
      continuously-refreshed evidence, bound to the control, in the package an
      assessor reads. Keep FedRAMP scope at Moderate for this series, and
      note the draft disclaimer — developed by the Cloud Services Infrastructure
      team, not yet reviewed by the Agency CIO Office, OIS, or leadership, with all
      closure claims self-assessed pending SCA and PMO/AO review.

  # 2 --- section ------------------------------------------------------------
  - type: section
    kicker: "PART ONE"
    title: "The evidence contract"
    callout: "Evidence no pipeline emits does not exist to an assessor — the contract is the interface that makes it exist."
    callout_accent: navy
    notes: >
      This section introduces the single most important design decision in the
      book: the evidence contract. Before enumerating the pipeline stages, the
      audience needs to understand why a normalized record shape is the thing
      that makes continuous monitoring real. The Closure Necessity argument is
      direct: Volume III and Volume IV prove the evidence fabric is the mechanism
      that makes ConMon real, and this book deploys it. NIST SP 800-53 Rev 5
      CA-7 is satisfied by a pipeline that continuously refreshes control-bound
      evidence and emits the package — not by a claim that monitoring occurs.
      Remove the pipeline and every other Volume VI deployment is invisible to
      the authorization process: the controls operate, but they cannot be shown
      to operate. The contract is what keeps the pipeline engine-neutral — an
      open, normalized record that any conformant back-end can consume — so the
      series never binds continuous monitoring to a particular product. That
      engine-neutrality is a deliberate architectural stance, not an
      afterthought, and it is what lets this series treat back-ends as
      swappable deployed examples rather than mandated dependencies.

  # 3 --- content grid -------------------------------------------------------
  - type: content
    kicker: "THE NORMALIZED RECORD"
    title: "One record shape every deployed mechanism emits"
    layout: grid
    cards:
      - title: "source"
        body: "Which deployed mechanism wrote the record — e.g. vi-06/machine-config. Every book in the volume writes the same shape (AU-3 normalized record)."
        accent: navy
      - title: "assetId"
        body: "The authoritative IPAM/DDI identity from Book VI-01. Records from different surfaces correlate to the same asset (AU-12(1))."
        accent: teal
      - title: "control + ksi"
        body: "The NIST control(s) the record evidences and the FedRAMP 20x KSI theme(s) — what binds raw telemetry to the authorization package."
        accent: amber
      - title: "verdict + evidenceRef"
        body: "compliant / drift / remediated / exception, plus a pointer to the raw row in the lake so the claim is traceable to source."
        accent: red
    callout:
      text: "Two fields make the record load-bearing: assetId gives cross-surface correlation, and control/ksi bind telemetry to the package instead of leaving it as logs."
      accent: navy
    notes: >
      These four cards are the anatomy of the evidence-contract record, the
      normalized shape every Volume VI mechanism emits. The source field names
      which deployed mechanism wrote the record — the machine-config baseline,
      a detection rule, a revocation action — and the uniformity is the point:
      every book writes the same shape, which is the AU-3 normalized-record
      requirement realized. The two load-bearing fields are called out
      deliberately. The assetId is the authoritative IPAM/DDI identity from Book
      VI-01, so a record from the configuration surface and a record from the
      detection surface that concern the same host both carry the same key and
      can be joined — that is what makes the AU-12(1) system-wide time-correlated
      trail possible. The control and ksi fields are what elevate the record
      above undifferentiated logs: they bind the raw telemetry to specific NIST
      SP 800-53 Rev 5 controls and FedRAMP 20x KSI themes, so the OSCAL emitter
      can carry it into the authorization package rather than leaving it in the
      lake. The verdict and evidenceRef complete the record: a disposition an
      assessor can read, and a pointer back to the raw row so the claim is
      traceable to source. This record is the interface the entire pipeline is
      built on.

  # 4 --- content columns ---------------------------------------------------
  - type: content
    kicker: "ENGINE-NEUTRAL BY CONTRACT"
    title: "The interface is fixed; the back-end is a swappable example"
    layout: columns
    cards:
      - title: "Emitters by function"
        body: "Each mechanism's emitter is named by function. Deployed example: diagnostic settings and a data-collection rule to the workspace; native audit export to a lake substitutes."
        accent: navy
        status: "AU-3"
      - title: "Contract is the interface"
        body: "The evidence contract is open and normalized. Any conformant evidence engine can produce the package from it — the series binds to no particular back-end."
        accent: teal
        status: "Engine-neutral"
      - title: "OSCAL by any emitter"
        body: "The OSCAL generator is named by function too. Any OSCAL-conformant emitter over the contract produces the AP/AR/POA&M bundle."
        accent: amber
        status: "CA-7 / OSCAL"
    callout:
      text: "Engine-neutrality is a design stance, not a convenience — it keeps continuous monitoring from being hostage to one vendor's roadmap."
      accent: navy
    notes: >
      This slide makes the engine-neutrality argument explicit, because it is the
      property that keeps this series honest about vendor choice. Every
      component in the pipeline is named by function, not by product. The emitters
      that write evidence-contract records are named by function; the deployed
      example is Azure diagnostic settings plus a data-collection rule writing to
      a Log Analytics workspace, but a native audit export to any telemetry lake
      substitutes and preserves the AU-3 normalized-record function. The evidence
      contract itself is the interface — open, normalized, documented — so any
      conformant evidence engine can consume it and produce the package. The
      OSCAL generator is likewise named by function: any OSCAL-conformant emitter
      over the contract produces the Assessment Plan, Assessment Results, and
      POA&M bundle. The reason this matters is in the callout: engine-neutrality
      is a deliberate design stance, not a convenience. It keeps continuous
      monitoring from being hostage to a single vendor's roadmap or licensing,
      and it is why the series can name Microsoft as a deployed example where it
      genuinely coordinates the multi-vendor surface without ever implying it is
      the only path. For the Agency Moderate edition, that swappability is a
      procurement and resilience property as much as an architectural one.
    vendor_sources: ["azure_diagnostic_settings", "azure_monitor_dcr", "log_analytics", "oscal"]

  # 5 --- table -------------------------------------------------------------
  - type: table
    kicker: "DEPLOYABLE ARTIFACTS"
    title: "Four artifacts carry telemetry to the package"
    headers: ["Artifact", "Realizes", "Multi-CSP substitution"]
    rows:
      - cells: ["Evidence-contract emitters (per mechanism)", "AU-3 normalized record", "Native audit export to the lake"]
        accent: navy
      - cells: ["Cross-surface correlation (asset-id + time)", "AU-12(1) time-correlated trail", "Equivalent lake correlation"]
        accent: teal
      - cells: ["KSI binding layer", "FedRAMP 20x KSI attestation", "Same mapping over any lake"]
        accent: amber
      - cells: ["Machine-readable package emission", "CA-7 ConMon; OSCAL AP/AR/POA&M", "Any OSCAL-conformant emitter"]
        accent: red
    callout:
      text: "The deployed examples are named by function — every row substitutes to another back-end without changing the contract."
      accent: navy
    notes: >
      This table is the artifact inventory for the pipeline, each row realizing a
      specific NIST or FedRAMP requirement and each carrying a multi-CSP
      substitution. The per-mechanism emitters realize AU-3, the normalized
      audit-record generation, with the deployed example being diagnostic
      settings and a data-collection rule to the workspace and native audit
      export to any lake as the substitution. Cross-surface correlation on asset
      identity plus time realizes AU-12(1), the system-wide time-correlated
      trail, joining records across surfaces on the authoritative IPAM/DDI key.
      The KSI binding layer realizes FedRAMP 20x KSI attestation — the
      evidence-slot-to-KSI mapping as code — and it substitutes as the same
      mapping over any lake. The package-emission artifact realizes CA-7
      continuous monitoring by producing the OSCAL Assessment Plan, Assessment
      Results, and POA&M bundle, and it substitutes as any OSCAL-conformant
      emitter. The point to leave with the audience is in the callout: every row
      names a deployed example by function, so the whole pipeline is portable to
      another back-end without touching the contract. That is the difference
      between a ConMon deployment and a vendor lock-in.
    vendor_sources: ["azure_diagnostic_settings", "azure_monitor_dcr", "oscal", "fedramp_20x"]

  # 6 --- section -----------------------------------------------------------
  - type: section
    kicker: "PART TWO"
    title: "The pipeline that runs continuously"
    callout: "Collect, correlate, bind, emit — on a schedule, so the package is current rather than assembled at audit time."
    callout_accent: teal
    notes: >
      The second half of the book is the pipeline itself — four stages that run
      on a schedule so the authorization package is continuously current rather
      than reconstructed the week before an assessment. The next slide walks the
      four stages as a progressive build. The governing idea is that CA-7
      continuous monitoring is not a document that says monitoring happens; it is
      a running pipeline that refreshes control-bound evidence and re-emits the
      package on a cadence. Emphasize scheduling: a package assembled at audit
      time is a point-in-time snapshot dressed up as continuous monitoring,
      whereas a package the pipeline re-emits on a schedule is genuinely
      continuous. That distinction is the whole reason this book exists as a
      deployable layer rather than a reporting exercise. Walk the audience
      through the causal chain the four stages form: collection guarantees the
      raw records exist in-boundary, correlation assembles them into a coherent
      per-asset timeline, binding routes each record to the control and KSI it
      answers, and emission renders the whole thing as the OSCAL package an
      assessor consumes. Each stage depends on the one before it, so a weakness
      upstream — a missing emitter, a missing asset identity — propagates all the
      way to the package. That dependency is why the honest limits at the end of
      the book matter so much, and why Book VI-08's completeness harness sits
      alongside this pipeline as its guard. Present the four stages not as
      independent features but as one continuous machine that turns operating
      controls into visible, attestable evidence.

  # 7 --- build-sequence ----------------------------------------------------
  - type: build-sequence
    kicker: "THE PIPELINE"
    title: "How scattered telemetry becomes a continuous package"
    notes: "Fallback presenter notes; each step carries its own."
    steps:
      - label: "Collect"
        sub: "emitters write in-boundary"
        accent: navy
        detail: >
          Each mechanism's emitter writes evidence-contract records — via
          diagnostic settings and data-collection rules — to the telemetry lake,
          in-boundary. Collection is per-mechanism and uniform in shape, so the
          configuration surface, the detection surface, and the identity surface
          all deposit the same normalized record.
        notes: >
          Step one is collection. Each deployed mechanism's emitter writes
          evidence-contract records to the telemetry lake, and the critical
          adjective is in-boundary — the telemetry stays inside the authorization
          boundary, which is a SC-7 and data-residency requirement, not an
          incidental detail. The deployed example uses diagnostic settings and
          data-collection rules to route records to a Log Analytics workspace,
          but the function is what matters: every mechanism deposits the same
          normalized shape, so collection does not privilege one surface over
          another. This uniformity is what makes the later correlation and
          binding stages possible; if each mechanism emitted a bespoke format,
          the pipeline would be a collection of adapters instead of a contract.
          The honest limit to flag here is that the pipeline is only as complete
          as its emitters — a mechanism that deploys but does not emit is
          invisible, which is exactly what Book VI-08's telemetry-completeness
          workbook is built to catch. Emphasize the in-boundary requirement once
          more, because it is easy to under-value: routing evidence to a lake
          outside the authorization boundary would trade a monitoring convenience
          for a boundary and data-residency problem, so the deployed example
          keeps diagnostic settings and data-collection rules writing to an
          in-boundary workspace. The design goal of this stage is that adding a
          new mechanism to the volume is a matter of pointing its emitter at the
          contract, not of teaching the pipeline a new format — the contract
          absorbs new sources without new plumbing, which is what lets the
          evidence fabric scale as the deployment grows.
      - label: "Correlate"
        sub: "join on assetId + time"
        accent: teal
        detail: >
          Records are joined on assetId plus time, producing the system-wide
          time-correlated trail AU-12(1) expects. Because the assetId is the
          authoritative IPAM/DDI identity from Book VI-01, records from different
          surfaces about the same asset line up on one key.
        notes: >
          Step two is correlation. The records collected from every surface are
          joined on the assetId and time, producing the system-wide time-
          correlated audit trail that NIST SP 800-53 Rev 5 AU-12(1) requires.
          This is where the authoritative asset identity earns its keep: because
          every record carries the same IPAM/DDI key from Book VI-01, a
          configuration drift, a detection firing, and an identity event about
          the same host can be assembled into one timeline. The honest limit is
          the dependency this creates — correlation depends on the authoritative
          assetId, and where the IPAM/DDI identity is missing, records cannot be
          joined and the trail fragments. That is why Book VI-01's addressing and
          identity join key is upstream of this entire pipeline; without a
          trustworthy asset identity the correlation stage degrades into
          disconnected islands of telemetry. The payoff when identity is present
          is substantial: an assessor asking what happened to a given host gets a
          single correlated timeline drawn from every surface, rather than a
          manual reconciliation across separate logs, and that time-correlated
          trail is precisely what AU-12(1) exists to require. Time is the second
          join dimension and it is not incidental — ordering events across
          surfaces is what turns a set of facts into a sequence, and a sequence is
          what an incident reconstruction or a ConMon narrative is actually made
          of. This stage is where the raw records stop being a pile and become a
          system-wide account of the estate.
      - label: "Bind"
        sub: "control-tagged → evidence slot → KSI"
        accent: amber
        detail: >
          The KSI binding layer maps each control-tagged record to its evidence
          slot and FedRAMP 20x KSI theme. This is the step that turns a
          correlated trail into attestable evidence — the record now answers a
          specific KSI, not just a query.
        notes: >
          Step three is binding. The KSI binding layer takes each control-tagged
          record and maps it to its evidence slot and its FedRAMP 20x Key
          Security Indicator theme. This is the step that converts a correlated
          audit trail into attestable evidence: a record that carries CM-6 and a
          KSI theme is no longer just a log line that happens to be about
          configuration — it is a specific answer to a specific KSI the
          authorization scores. The binding is expressed as code, the evidence-
          slot-to-KSI mapping, which keeps it reviewable and versioned rather
          than living in an analyst's head. This is the seam where the pipeline
          connects to the FedRAMP 20x scoring model: the KSIs are the indicators
          the package is graded on, and the binding layer is what routes each
          piece of continuously-collected evidence to the indicator it
          substantiates. Without it the lake is full of true statements that
          nobody has connected to the questions the authorization asks.
          Expressing the mapping as code has a second benefit beyond
          reviewability: it makes the KSI coverage itself measurable, so the
          program can ask which KSIs currently have live evidence bound to them
          and which do not, and treat an unbound KSI as a visible gap rather than
          an unnoticed one. That is the difference between a pile of compliant
          records and an attestation an assessor can score. The binding layer is
          small in code and large in consequence — it is the component that makes
          the FedRAMP 20x KSI model operable against real, continuously-collected
          telemetry instead of against a static control narrative.
      - label: "Emit"
        sub: "OSCAL AP / AR / POA&M on a schedule"
        accent: red
        detail: >
          The OSCAL emitter produces the Assessment Plan, Assessment Results, and
          POA&M bundle on a schedule, so the package is continuously current
          rather than assembled at audit time. Unremediated drift and findings
          become POA&M items automatically (CA-5).
        notes: >
          Step four is emission. The OSCAL emitter produces the Assessment Plan,
          Assessment Results, and POA&M bundle from the bound evidence, and the
          decisive property is that it runs on a schedule. A package emitted on a
          cadence is continuously current; a package assembled the week before an
          assessment is a snapshot pretending to be continuous monitoring. This
          is CA-7 realized as a running system. It also realizes CA-5: any
          unremediated drift or finding carried in the evidence becomes a POA&M
          item automatically, so the plan of action reflects the actual current
          state of open work rather than a manually maintained list that drifts
          from reality. The honest limit to close on is that the package reflects
          the evidence present — it cannot attest a control whose mechanism emits
          nothing, which is why the completeness of the emitters and the vigilance
          of Book VI-08 are what ultimately bound the trustworthiness of the
          package. By the end of the four stages, scattered telemetry has become
          a continuously-refreshed, control-bound, machine-readable authorization
          package.

  # 8 --- table -------------------------------------------------------------
  - type: table
    kicker: "CONTROLS OPERATIONALIZED"
    title: "What this book deploys, mapped to NIST 800-53r5"
    headers: ["Control", "Title", "How this book deploys it"]
    rows:
      - cells: ["CA-7", "Continuous Monitoring", "Telemetry → evidence → KSI → package pipeline"]
        accent: navy
      - cells: ["AU-6(1)", "Automated Process Integration", "Automated aggregation and analysis across surfaces"]
      - cells: ["AU-12(1)", "System-Wide Time-Correlated Trail", "Asset-id plus time correlation across the lake"]
        accent: teal
      - cells: ["CA-5", "Plan of Action & Milestones", "POA&M items emitted from unremediated drift and findings"]
        accent: amber
    callout:
      text: "The package attests exactly the evidence present — the mapping is substantiated by what the emitters actually emit, not by assertion."
      accent: navy
    notes: >
      This is the control-to-deployment mapping for the pipeline. CA-7 continuous monitoring is the headline: the telemetry-to-evidence-
      to-KSI-to-package pipeline is CA-7 operating as a running system rather
      than a described intention. AU-6(1) automated process integration is
      satisfied by the automated aggregation and analysis across surfaces — the
      correlation and binding stages are exactly the automated audit-review
      integration the control calls for. AU-12(1), the system-wide time-
      correlated audit trail, is realized by the asset-id-plus-time correlation
      across the lake. CA-5, plan of action and milestones, is emitted rather
      than maintained: unremediated drift and findings become POA&M items
      automatically as part of the OSCAL bundle. The callout carries the honest
      framing that runs through the whole book — the package attests exactly the
      evidence present and no more, so this mapping is substantiated by what the
      emitters actually emit rather than by assertion. For the Agency Moderate
      edition every one of these closures is self-assessed pending security
      control assessment and AO review.
    vendor_sources: ["nist_800_53", "oscal"]

  # 9 --- content columns ---------------------------------------------------
  - type: content
    kicker: "HONEST LIMITS"
    title: "What the pipeline cannot do for you"
    layout: columns
    cards:
      - title: "Only as complete as its emitters"
        body: "A mechanism that deploys but does not emit a record is invisible. Book VI-08's telemetry-completeness workbook is the guard against silent emitter failure."
        accent: amber
        status: "→ Book VI-08"
      - title: "Correlation needs identity"
        body: "Where the authoritative IPAM/DDI assetId is missing, records cannot be joined and the time-correlated trail fragments."
        accent: red
        status: "Depends on VI-01"
      - title: "Attests only what exists"
        body: "The OSCAL package reflects the evidence present; it cannot attest a control whose mechanism emits nothing."
        accent: navy
        status: "No evidence, no claim"
    callout:
      text: "These limits are why the pipeline is paired with a completeness harness — a blind emitter is the failure mode that matters most."
      accent: navy
    notes: >
      The pipeline's honest limits all trace to a single truth: it can only carry
      evidence that exists. First, it is only as complete as its emitters — a
      mechanism that deploys but does not emit an evidence-contract record is
      invisible to the whole pipeline, which is precisely the failure Book VI-08's
      telemetry-completeness workbook is built to catch by alerting when a source
      goes dark. Second, correlation depends on the authoritative assetId; where
      the IPAM/DDI identity is missing, records cannot be joined and the time-
      correlated trail fragments into disconnected pieces, so the quality of the
      pipeline is downstream of the quality of Book VI-01's identity join. Third,
      the OSCAL package reflects the evidence present and cannot attest a control
      whose mechanism emits nothing — the pipeline never fabricates a claim, which
      is a strength for assessor trust and a limit on coverage. The callout ties
      it together: these limits are exactly why the pipeline is paired with a
      completeness harness, because a silently blind emitter is the failure mode
      that produces false confidence, and false confidence in an authorization is
      more dangerous than a known gap.

  # 10 --- closing ----------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "From scattered telemetry to a package an assessor reads"
    layout: columns
    cards:
      - title: "Consumes VI-01…06"
        body: "Every mechanism's evidence flows through one contract, so the whole volume becomes visible to the authorization process."
        accent: teal
        status: "VI-01…06"
      - title: "Deploys Vol III / IV"
        body: "The evidence fabric and ConMon architecture are now a running, scheduled pipeline emitting the OSCAL package."
        accent: navy
        status: "Vol III / IV realized"
      - title: "Guarded by VI-08"
        body: "Telemetry-completeness validation watches the emitters, so a blind source is caught before it becomes false confidence."
        accent: amber
        status: "→ Book VI-08"
    callout:
      text: "The controls operate in every other book; this book is what lets the authorization process see that they do."
      accent: navy
    notes: >
      Close on the through-line. This book is the seam that makes the rest of
      Volume VI visible to the authorization process. It takes the scattered
      telemetry every deployed mechanism emits — drift records, detection
      firings, revocations, rotations — and carries it through one normalized
      evidence contract: collected in-boundary, correlated on authoritative asset
      identity and time, bound to the NIST control and FedRAMP 20x KSI it
      satisfies, and emitted as a scheduled OSCAL authorization package. It
      consumes Books VI-01 through VI-06, it deploys the Volume III evidence
      fabric and the Volume IV ConMon architecture as a running system, and it is
      guarded by Book VI-08's telemetry-completeness validation so a blind emitter
      is caught before it becomes false confidence. Leave the audience with the
      Closure Necessity: the controls operate in every other book, but without
      this pipeline they operate invisibly, and a control the authorization
      process cannot see is a control it cannot credit. All closure claims are
      self-assessed at FedRAMP Moderate, pending SCA and PMO/AO review.
    vendor_sources: ["oscal", "fedramp_20x", "nist_800_53"]
