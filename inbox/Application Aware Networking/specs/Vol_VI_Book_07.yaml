deck:
  title: "Evidence & ConMon Pipeline"
  subtitle: "Wiring every deployed mechanism into the evidence contract, the KSI bindings, and the machine-readable authorization package"
  series_kicker: "Federal AAN — Volume VI: Implementation"
  date_code: "2026-07-09 17:00 ET"
  journey:
    - "Collect"
    - "Correlate"
    - "Bind"
    - "Emit"
  sources:
    log_analytics: "https://learn.microsoft.com/azure/azure-monitor/logs/log-analytics-overview"
    azure_diagnostic_settings: "https://learn.microsoft.com/azure/azure-monitor/essentials/diagnostic-settings"
    azure_monitor_dcr: "https://learn.microsoft.com/azure/azure-monitor/essentials/data-collection-rule-overview"
