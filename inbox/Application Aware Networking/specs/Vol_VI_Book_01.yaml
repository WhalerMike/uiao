      its inventory record are now one traceable chain because the naming and
      addressing plane is authoritative by being code — not because someone
      remembers how it was built. Keep scope honest: FedRAMP Moderate throughout,
      mechanism invariant across clouds.
    vendor_sources: ["nist_800_53", "azure_landing_zone"]
