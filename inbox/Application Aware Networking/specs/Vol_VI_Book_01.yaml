deck:
  title: "Landing Zone & Network as Code"
  subtitle: "Infrastructure-as-code for the landing zone, IPAM/DDI naming plane, and the distributed policy-enforcement edge"
  series_kicker: "Federal AAN — Volume VI: Implementation"
  date_code: "2026-07-09 17:00 ET"
  journey:
    - "Platform"
    - "Address"
    - "Name"
    - "Enforce"
  sources:
    terraform: "https://developer.hashicorp.com/terraform/docs"
    azure_landing_zone: "https://learn.microsoft.com/azure/cloud-adoption-framework/ready/landing-zone/"
    azure_firewall: "https://learn.microsoft.com/azure/firewall/overview"
    infoblox_ddi: "https://www.infoblox.com/products/ddi/"
    aws_control_tower: "https://docs.aws.amazon.com/controltower/latest/userguide/what-is-control-tower.html"
