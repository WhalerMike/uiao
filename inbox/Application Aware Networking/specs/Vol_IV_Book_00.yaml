deck:
  title: "Volume IV Overview — Governance & Assurance"
  subtitle: "Turning the technical evidence of Volumes I–III into a federal authorization"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOL IV · BOOK 00"
  date_code: "2026-07-09 09:54 ET"
  journey:
    - "Document"
    - "Sign"
    - "Test"
    - "Authorize"
  sources:
    fedramp_20x: "https://www.fedramp.gov/20x/"
    oscal: "https://pages.nist.gov/OSCAL/"
    cisa_bod_2604: "https://www.cisa.gov/news-events/directives/"

slides:
  # 1 -----------------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for Volume IV of the Federal Application-Aware Networking
      series — the volume overview, not a content book. Volume IV is the capstone.
      Volumes I through III produce capabilities and machine-readable evidence;
      Volume IV supplies the layer infrastructure alone cannot — the documents,
      signatures, processes, and the OSCAL package that an authorizing official
      and an assessor actually consume. Establish the framing up front: this is
      the volume that closes the control families satisfied by artifacts rather
      than by configuration — contingency planning, supply-chain risk, program
      management, privacy and PII processing, awareness and training, and
      assessment, authorization, and continuous monitoring. Walk the journey
      strip: document, sign, test, authorize. Keep FedRAMP scope at Moderate
      throughout. Note the draft disclaimer: this is pre-decisional CSI Team
      material, not an approved SSA position.

  # 2 -----------------------------------------------------------------------
  - type: content
    kicker: "VOLUME PURPOSE"
    title: "Volume IV manufactures the artifacts infrastructure cannot"
    layout: grid
    cards:
      - title: "The missing layer"
        body: "Infrastructure produces capability and evidence; Volume IV supplies the documents, signatures, processes, and OSCAL package an AO and assessor consume."
        accent: navy
      - title: "Artifact-satisfied families"
        body: "Closes the families satisfied by artifacts, not configuration: CP, SR, PM, PT, AT, and CA."
        accent: teal
      - title: "The sharpest governance point"
        body: "A perfectly configured control that cannot produce a signed, tested, machine-readable artifact is, from the assessor's chair, an open finding."
        accent: red
      - title: "In the assessor's idiom"
        body: "OSCAL, KSI, POA&M — the forms FedRAMP 20x and the authorizing official require, not just closed controls."
        accent: amber
    callout:
      text: "The infrastructure volumes prove the controls are closed; Volume IV proves it in the idiom the AO consumes."
      accent: navy
    notes: >
      This slide states the volume's purpose. Volume IV supplies what
      infrastructure alone cannot: the layer of documents, signatures, processes,
      and the OSCAL package that an authorizing official and an assessor actually
      read. It closes the control families that are satisfied by artifacts rather
      than by configuration — contingency planning under CP, supply-chain risk
      under SR, program management under PM, privacy and PII processing under PT,
      awareness and training under AT, and assessment, authorization, and
      continuous monitoring under CA. The recurring lesson, and the series'
      sharpest governance point, is on the red card: a perfectly configured
      control that cannot produce a signed, tested, machine-readable artifact is,
      from the assessor's chair, an open finding. That is why Volume IV exists —
      it manufactures the artifacts, in the OSCAL, KSI, and POA&M idiom that
      FedRAMP 20x and the authorizing official require.
    vendor_sources: ["oscal", "fedramp_20x"]

  # 3 -----------------------------------------------------------------------
  - type: table
    kicker: "BOOKS IN THIS VOLUME"
    title: "Six books close the artifact-satisfied control families"
    headers: ["Book", "Title", "Role"]
    rows:
      - cells: ["Book 01", "Business Continuity", "CP-2 contingency plan, BIA, DR validation — the plan the runbooks assume"]
        accent: navy
      - cells: ["Book 02", "Supply Chain Risk Management", "SBOM / VDR / VEX pipeline under BOD 26-04; SR-family closure"]
      - cells: ["Book 03", "Program Management & Governance", "ISPP, POA&M, SCRM charter, RACI — the PM-family governance artifacts"]
      - cells: ["Book 04", "PII Processing & Transparency", "Privacy program, authority-to-process, SORN/PIA — the PT family"]
      - cells: ["Book 05", "Cybersecurity Training & Awareness", "Role-based curriculum + machine-readable training-effectiveness evidence (AT)"]
      - cells: ["Book 06", "Authorization Package & ConMon", "The OSCAL AP/AR/POA&M bundle and the continuous-monitoring program (CA)"]
        accent: teal
    callout:
      text: "Books 01–05 generate the family artifacts; Book 06 assembles them into the OSCAL bundle that carries the ATO decision."
      accent: navy
    notes: >
      The reference table for the volume. Books 01 through 05 each generate the
      artifacts for one control family. Business Continuity produces the CP-2
      contingency plan, the business-impact analysis, and DR validation — the plan
      the operational runbooks throughout the series quietly assume exists. Supply
      Chain Risk Management stands up the SBOM, VDR, and VEX pipeline under BOD
      26-04 to close the SR family. Program Management and Governance produces the
      ISPP, the POA&M, the SCRM charter, and the RACI — the PM-family governance
      artifacts. PII Processing and Transparency builds the privacy program, the
      authority-to-process, and the SORN and PIA for the PT family. Cybersecurity
      Training and Awareness delivers the role-based curriculum plus
      machine-readable training-effectiveness evidence for AT. And Book 06, the
      Authorization Package and ConMon book, is where it all converges: it
      assembles the OSCAL AP, AR, and POA&M bundle and stands up the
      continuous-monitoring program for the CA family — the bundle that carries the
      whole program to an authorization decision.

  # 4 -----------------------------------------------------------------------
  - type: content
    kicker: "HOW THIS VOLUME FITS THE PROGRAM"
    title: "The capstone — consumes the evidence, assembles the package"
    layout: columns
    cards:
      - title: "Consumes the fabric"
        body: "Takes the correlated evidence stream from the Multi-Cloud Evidence Fabric (Vol III Book 07) plus its own continuity, supply-chain, and training evidence."
        accent: navy
        status: "← Vol III"
      - title: "Assembles the package"
        body: "The Authorization Package (Vol IV Book 06) carries the whole program to an authorization decision."
        accent: teal
        status: "Book 06"
      - title: "Proves it in the idiom"
        body: "Where Volumes I–III show the controls are closed, Volume IV demonstrates it in OSCAL, KSI, and POA&M — what FedRAMP 20x and the AO require."
        accent: amber
        status: "OSCAL / KSI"
    callout:
      text: "Volumes I–III demonstrate the controls are closed; Volume IV demonstrates it in the idiom the authorizing official requires."
      accent: navy
    notes: >
      This slide places Volume IV as the capstone of the program. It consumes the
      correlated evidence stream from the Multi-Cloud Evidence Fabric in Volume
      III, together with the continuity, supply-chain, and training evidence its
      own books generate, and assembles all of it into the authorization package
      in Book 06 that carries the whole program to an authorization decision. The
      distinction to voice clearly: where Volumes I through III demonstrate that
      the controls are technically closed, Volume IV demonstrates that closure in
      the idiom the authorizing official and the assessor actually consume —
      OSCAL machine-readable control implementation, KSI indicators for FedRAMP
      20x, and a maintained POA&M. Technical closure and demonstrated closure are
      not the same thing, and Volume IV is the volume that converts one into the
      other.

  # 5 -----------------------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "Document it, sign it, test it — then it is authorizable"
    layout: columns
    cards:
      - title: "Artifacts, not just config"
        body: "The families satisfied by documents — CP, SR, PM, PT, AT, CA — are closed with signed, tested artifacts."
        accent: teal
        status: "Established"
      - title: "One OSCAL bundle"
        body: "Book 06 freezes the correlated evidence into the AP/AR/POA&M package the AO consumes."
        accent: amber
        status: "Book 06"
      - title: "The whole program"
        body: "Volumes I–IV converge here — the substrate, the data tier, and security operations arrive as one authorization decision."
        accent: navy
        status: "ATO"
    callout:
      text: "A control you cannot evidence is an open finding. Volume IV is where the whole program becomes authorizable."
      accent: navy
    notes: >
      Close on the through-line for the volume and for the series. Volume IV
      closes the control families that documents and signatures satisfy rather
      than configuration — contingency planning, supply-chain risk, program
      management, privacy, training, and continuous monitoring — and it freezes the
      correlated evidence into one OSCAL AP, AR, and POA&M bundle in Book 06. The
      governance lesson to leave ringing: a control you cannot evidence, no matter
      how perfectly configured, is an open finding from the assessor's chair, so
      the manufacturing of signed, tested, machine-readable artifacts is not
      paperwork but the final control-closure step. This is where the whole
      program converges — the Volume I substrate, the Volume II data tier, and the
      Volume III security operations all arrive as a single authorization
      decision. Volume IV is what makes the program authorizable.
