slides:
  # 1 -----------------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for Response Automation — Volume VI Book 04, the response half
      of the detection engine and the deployable companion to Book VI-03. Frame
      the core claim: detection without response only shortens the investigation,
      not the exposure. The Volume III SIEM/XDR architecture ends at the alert;
      this book carries the automation that acts on it. It is the in-boundary
      substitute for the sub-second Continuous Access Evaluation revocation the
      commercial cloud provides and the boundary removes — and it is honest that
      the substitute lands at minutes, not sub-second, because a playbook
      triggered by a scheduled analytic cannot beat the analytic's cadence. Walk
      the journey strip — Detect, Gate, Contain, Record — because it is the shape
      of every playbook: a Book VI-03 firing, a confidence gate that decides
      whether to auto-act, a bounded containment action against the management
      plane, and an incident record plus an evidence emission. Introduce the one
      design rule that governs the whole library: confidence-gated action.
      High-confidence detections auto-contain, medium-confidence detections
      enrich and ticket for a human, and nothing low-confidence auto-acts,
      because auto-containment on a noisy rule is its own denial-of-service. Keep
      FedRAMP scope at Moderate. Note the draft disclaimer: CSI Team work, not yet
      reviewed by the SSA CIO Office or OIS, and the playbook pseudocode is an
      illustrative flow to adapt, not a drop-in runbook.

  # 2 -----------------------------------------------------------------------
  - type: section
    kicker: "PART ONE — THE DESIGN RULE"
    title: "Confidence-gated action, or auto-containment becomes the attack"
    callout: "High-confidence detections auto-contain; medium-confidence enrich and ticket; nothing low-confidence auto-acts. Auto-containment on a noisy rule is its own denial-of-service."
    callout_accent: navy
    notes: >
      This section establishes the single design rule that governs every playbook
      in the library, because getting it wrong turns the response system into the
      incident. The rule is confidence-gated action. A high-confidence detection —
      for example Book VI-03 rule 04, the session anomaly, with corroboration —
      auto-contains: it revokes sessions, confirms the user compromised, and
      forces re-authentication with no human in the loop. A medium-confidence
      detection does not act on the identity; it enriches with identity, device,
      and IP context, opens a ticket, and raises the risk state for a human to
      adjudicate. Nothing low-confidence auto-acts at all. The reason is
      operational, not bureaucratic: auto-containment wired to a noisy rule
      amplifies every false positive into an availability incident, so an untuned
      rule with an auto-contain playbook behind it is a self-inflicted
      denial-of-service. This is why the deployment discipline in this book is
      inseparable from the tuning discipline in Book VI-03 and the
      false-positive measurement in Book VI-08 — the gate is only as trustworthy
      as the rule's measured false-positive rate. Confidence gating is what lets
      the agency automate containment at all without automating its own outages.

  # 3 -----------------------------------------------------------------------
  - type: table
    kicker: "THE RESPONSE LADDER"
    title: "Three tiers, each substituting for a capability the boundary removed"
    headers: ["Confidence", "Action", "Substitutes for"]
    rows:
      - cells: ["High (rule 04 + corroboration)", "Revoke sessions, confirm-compromised, force re-auth — auto, no human", "CAE sub-second revocation (→ minutes)"]
        accent: teal
      - cells: ["Medium", "Enrich context, open ticket, raise risk — human in loop", "Vendor auto-remediation"]
      - cells: ["Standing control (config)", "Bound token lifetime to 60–90 min", "CAE exposure ceiling"]
        accent: amber
    callout:
      text: "The short-token-lifetime config is the exposure ceiling under which the playbooks operate — so even a missed detection cannot leave a stolen token valid indefinitely."
      accent: navy
    notes: >
      The response ladder is the library's organizing model, and every row maps a
      confidence tier to an action and to the commercial capability that action
      substitutes for. The high-confidence tier auto-contains — session
      revocation, confirm-compromised, and forced re-authentication with no human
      in the loop — and it is the in-boundary substitute for the sub-second
      Continuous Access Evaluation revocation the boundary removes, honestly
      landing at minutes rather than sub-second. The medium tier does not touch
      the identity; it enriches and tickets for a human, substituting for the
      vendor's auto-remediation with a human-adjudicated equivalent. The third row
      is not a playbook at all but a standing configuration: bounding token
      lifetime to sixty to ninety minutes is the exposure ceiling that makes the
      minutes-latency containment tolerable, because even a missed detection
      cannot leave a stolen token valid indefinitely under a short lifetime. That
      standing ceiling and the reactive playbooks work together — the config
      bounds the worst case, the playbooks shorten the typical case. This is the
      honest architecture of in-boundary response: it does not recover sub-second
      revocation, it bounds the window two ways instead.
    vendor_sources: ["ms_cae", "ms_token_lifetime", "nist_800_53"]

  # 4 -----------------------------------------------------------------------
  - type: table
    kicker: "DEPLOYABLE ARTIFACTS"
    title: "Four artifacts, each wired to a Book VI-03 trigger"
    headers: ["Playbook", "Trigger (Book VI-03)", "Action"]
    rows:
      - cells: ["revoke-session", "Token-theft / session anomaly (rule 04)", "Graph revokeSignInSessions + confirm-compromised"]
        accent: teal
      - cells: ["disable-principal", "High-confidence account compromise", "Disable account, block sign-in"]
      - cells: ["short-token-lifetime (config)", "Standing control", "Bound token lifetime to 60–90 min"]
        accent: amber
      - cells: ["enrich-and-ticket", "Medium-confidence detections", "Enrich identity/device/IP, open ticket (human-in-loop)"]
    callout:
      text: "The revocation identity should not also be able to create accounts — grant each automation identity only the Graph scopes its action needs."
      accent: navy
    notes: >
      These are the four deployable artifacts, each wired to a specific Book VI-03
      trigger so the response library and the detection library compose one to
      one. The revoke-session playbook is the containment path for rule 04, the
      token-theft session anomaly: it issues a Graph revokeSignInSessions call and
      a confirm-compromised call to raise the identity's risk state. The
      disable-principal playbook handles high-confidence account compromise by
      disabling the account and blocking sign-in — a heavier action reserved for
      the highest-confidence firings. The short-token-lifetime artifact is the
      standing configuration, not a reactive playbook. The enrich-and-ticket
      playbook is the medium-confidence path that gathers identity, device, and IP
      context and opens a ticket for a human rather than acting on the identity.
      Stress the least-privilege design running through all of them: each
      automation identity gets only the Graph scopes its action needs, and the
      callout makes the sharpest version of that rule — the revocation identity
      must not also be able to create accounts, because a compromised automation
      credential should not be a path to persistence. Least privilege on the
      automation plane is as important as least privilege on the human plane.
    vendor_sources: ["ms_graph_revoke", "ms_confirm_compromised"]

  # 5 -----------------------------------------------------------------------
  - type: build-sequence
    kicker: "THE REVOKE-SESSION PLAYBOOK"
    title: "How a high-confidence session anomaly is contained"
    notes: "Fallback notes; each step carries its own presenter prose."
    steps:
      - label: "Gate"
        sub: "confidence check"
        accent: navy
        detail: >
          The playbook fires on a Sentinel incident from rule 04 and first
          evaluates the confidence guard: severity High and a non-null Account
          entity. Anything below the gate stops here and routes to enrich-and-ticket.
        notes: >
          Step one is the confidence gate, and it is the most important line in
          the playbook. The flow triggers on a Sentinel incident from the
          token-theft session-anomaly rule, then evaluates a guard — incident
          severity High and a non-null Account entity — before it takes any
          action. If the guard fails, the playbook does not contain; it routes to
          the medium-confidence enrich-and-ticket path so a human decides. This is
          the confidence-gated-action rule made concrete, and it is why every
          auto-containment playbook starts life in alert-only mode: the gate's
          trustworthiness depends on the triggering rule's measured false-positive
          rate, which Book VI-08 establishes before the playbook is promoted to
          auto-action.
      - label: "Revoke"
        sub: "Graph revokeSignInSessions"
        accent: teal
        detail: >
          A Graph POST to revokeSignInSessions invalidates the account's refresh
          tokens — the AC-12 session-termination action, executed in-boundary
          against the management plane.
        notes: >
          Step two is the containment action itself: a Graph POST to
          revokeSignInSessions for the account entity, which invalidates the
          account's refresh tokens and forces re-authentication on the next access
          attempt. This is the AC-12 session-termination control operationalized,
          and it runs entirely in-boundary against the management plane — no
          telemetry leaves, no external service is called. This is the in-boundary
          substitute for CAE sub-second revocation, and the honest caveat belongs
          here: the containment latency equals the detection cadence, so this
          lands at minutes, not sub-second. The short-token-lifetime standing
          control is what keeps that minutes-latency tolerable.
      - label: "Raise risk"
        sub: "confirmCompromised"
        accent: amber
        detail: >
          A Graph PATCH to riskyUsers/confirmCompromised sets the identity's risk
          state high, so downstream Conditional Access and Identity Protection
          treat the account as compromised until an admin clears it.
        notes: >
          Step three raises the identity's risk state with a Graph
          confirmCompromised call against riskyUsers. This does more than the
          revocation alone: it marks the account compromised in the identity
          platform so that Conditional Access policies and any remaining
          Identity Protection signals treat every subsequent attempt as high-risk
          until an administrator explicitly clears the state. The revocation
          closes the current sessions; the risk-state change hardens the account
          against immediate re-compromise with the same stolen material. Together
          they are the containment, not just the interruption — a distinction an
          assessor evaluating IR-4 incident handling will look for.
      - label: "Record"
        sub: "IR-4 + evidence"
        accent: red
        detail: >
          The playbook creates an IR record linked to the Sentinel incident with
          full entity context, then emits the response action to the Book VI-07
          evidence contract — the whole run is itself logged as an incident action.
        notes: >
          Step four is what makes the response assessable. The playbook creates an
          incident-response record, links it to the originating Sentinel incident,
          and attaches the entity context, satisfying the IR-4 and IR-6 incident
          handling and reporting requirement that demands documented handling, not
          just detection. It then emits the response action to the Book VI-07
          evidence contract, so the containment itself becomes CA-7 continuous
          monitoring evidence. The whole run is logged as an incident action,
          which is the artifact an assessor actually asks for: not "do you have
          playbooks" but "show me a containment that ran and the record it
          produced." Without this step the automation would contain the threat but
          leave no provable trail, and an undocumented containment is
          operationally real but evidentially invisible.

  # 6 -----------------------------------------------------------------------
  - type: content
    kicker: "DEPLOYMENT"
    title: "Least privilege, alert-only first, standing ceiling always"
    layout: columns
    cards:
      - title: "Scoped identities"
        body: "Deploy playbooks through the Book VI-00 pipeline; grant each automation identity only the Graph scopes its action needs — least privilege on the automation plane."
        accent: navy
        status: "Book VI-00"
      - title: "Alert-only ramp"
        body: "Start every auto-containment playbook in alert-only mode; promote to auto-action only after the triggering rule's false-positive rate is measured."
        accent: teal
        status: "→ Book VI-08"
      - title: "Standing ceiling"
        body: "Set the token-lifetime bound in the Book VI-02 identity policy so even a missed detection cannot leave a stolen token valid indefinitely."
        accent: amber
        status: "Book VI-02"
    callout:
      text: "The confidence gate and the alert-only ramp are mandatory, not optional — they are what keep automation from amplifying a noisy rule into an availability incident."
      accent: navy
    notes: >
      Deployment is a three-part discipline. First, deploy the playbooks through
      the Book VI-00 change-controlled pipeline and grant each automation identity
      only the Graph scopes its action needs — the revocation identity should not
      also be able to create accounts, because least privilege on the automation
      plane bounds the blast radius of a compromised automation credential.
      Second, wire each Book VI-03 rule to its playbook through the SIEM
      automation rules, but start every auto-containment playbook in alert-only
      mode and promote it to auto-action only after the triggering rule's
      false-positive rate has been measured in Book VI-08. This ramp is not
      optional caution; it is the control that keeps the confidence gate honest,
      because a gate wired to an unmeasured rule is a guess. Third, set the
      standing token-lifetime bound in the Book VI-02 identity policy so the
      exposure ceiling is in place independent of any single detection — the
      config bounds the worst case while the playbooks shorten the typical case.
      Emphasize that the confidence gate and the alert-only ramp are mandatory:
      they are precisely what keep response automation from amplifying a noisy
      rule into a self-inflicted denial-of-service.
    vendor_sources: ["ms_logic_apps", "ms_automation_rules"]

  # 7 -----------------------------------------------------------------------
  - type: table
    kicker: "CONTROLS OPERATIONALIZED"
    title: "What each artifact proves, and the KSI that scores it"
    headers: ["Control", "How this book deploys it", "KSI"]
    rows:
      - cells: ["IR-4 / IR-6", "Automated containment + enriched, reported incident records", "KSI-INR"]
        accent: navy
      - cells: ["AC-12", "Session revocation + short standing token lifetime", "KSI-IAM"]
      - cells: ["AC-2(13)", "disable-principal on high-confidence compromise", "KSI-IAM"]
      - cells: ["CA-7", "Response actions emit to the Book VI-07 evidence contract", "KSI-MLA"]
    callout:
      text: "Closure Necessity: IR-4 requires incident handling, not just detection. Without the playbooks, the detection layer shortens time-to-know but not time-to-contain."
      accent: amber
    notes: >
      This mapping is the assessor-facing spine of the response library. IR-4 and
      IR-6 incident handling and reporting are the controls the book is built to
      satisfy: the playbooks convert a Book VI-03 firing into a bounded
      containment action and a documented, reported incident record — the exact
      artifact an assessor requests. That is the Closure Necessity argument: IR-4
      requires incident handling, not just detection, so without these playbooks
      the detection layer shortens time-to-know but not time-to-contain and the
      token-theft window stays open for the full token lifetime. AC-12 session
      termination is operationalized two ways — the reactive revocation and the
      standing short token lifetime. AC-2(13) disable-accounts-for-high-risk is
      operationalized by the disable-principal playbook on high-confidence
      compromise. CA-7 continuous monitoring is operationalized because every
      response action emits to the Book VI-07 evidence contract, turning the
      containment itself into monitoring evidence. In FedRAMP 20x terms these roll
      up to KSI-INR for incident response, KSI-IAM for the identity actions, and
      KSI-MLA where the evidence emission lands. All closures here are
      self-assessed at FedRAMP Moderate pending SCA and PMO/AO review.
    vendor_sources: ["nist_800_53", "fedramp_20x"]

  # 8 -----------------------------------------------------------------------
  - type: content
    kicker: "HONEST LIMITS"
    title: "Minutes, noise, and the edge of the tenant"
    layout: grid
    cards:
      - title: "Minutes, not sub-second"
        body: "Containment latency is bounded by the detection cadence; the short-token-lifetime config is the standing ceiling that makes that latency tolerable."
        accent: amber
      - title: "Noise amplifies"
        body: "Auto-containment turns a noisy rule into an availability incident; the confidence gate and alert-only ramp are mandatory, not optional."
        accent: red
      - title: "Own-tenant only"
        body: "The playbooks act only on the agency's own tenant; a compromised identity federated elsewhere is outside their reach."
        accent: amber
      - title: "Illustrative, not drop-in"
        body: "The playbook pseudocode is a flow to adapt, not a deployable runbook — validate scopes and API schemas against the current platform."
        accent: neutral
    callout:
      text: "The substitute lands at minutes and bounds the window two ways — it does not recover the sub-second revocation the boundary removed."
      accent: amber
    notes: >
      Carry these limits into any assessment. First, containment is minutes, not
      sub-second, because it is bounded by the detection cadence — a playbook
      triggered by a scheduled analytic cannot beat the analytic's schedule — and
      the short-token-lifetime standing config is what makes that latency
      tolerable by bounding the worst case independently. Second, auto-containment
      amplifies a noisy rule into an availability incident, which is why the
      confidence gate and the alert-only ramp are mandatory rather than
      best-practice suggestions; the response library inherits the detection
      library's tuning debt directly. Third, the playbooks act only on the
      agency's own tenant, so a compromised identity that is federated or
      replicated elsewhere is outside their reach — the containment is bounded by
      the same authorization boundary that shapes the detections. Fourth, the
      playbook pseudocode in this book is an illustrative flow to adapt, not a
      drop-in runbook: the Graph scopes, the confidence guard, and the API
      schemas must be validated against the current platform before deployment. Be
      candid that the substitute lands at minutes and bounds the exposure window
      two ways — it does not recover the sub-second CAE revocation the boundary
      removed, and claiming otherwise would be the kind of parity overstatement an
      assessment is built to catch.

  # 9 -----------------------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "From an alert to a bounded, documented containment"
    layout: columns
    cards:
      - title: "Acts on Book VI-03"
        body: "The playbooks respond to the detections Book VI-03 fires; the two libraries compose one trigger to one playbook."
        accent: teal
        status: "Book VI-03"
      - title: "Bounds with Book VI-02"
        body: "The token-lifetime standing control from Book VI-02 is the exposure ceiling under which the reactive playbooks operate."
        accent: navy
        status: "Book VI-02"
      - title: "Emits and measures"
        body: "Response actions emit to the Book VI-07 evidence contract; Book VI-08 measures the false-positive rate that gates auto-action."
        accent: amber
        status: "VI-07 / VI-08"
    callout:
      text: "A detection with no response is exposure, not control. These playbooks are what convert a firing into a bounded action and a provable incident record — at minutes, honestly, under a standing ceiling."
      accent: navy
    notes: >
      Close on the through-line. Response Automation is what converts the
      Book VI-03 detection layer from a faster investigation into an actual
      control — a detection with no response is exposure, not control, and IR-4
      demands handling, not just knowing. The playbooks compose one to one with
      the detections they respond to, operate under the Book VI-02
      token-lifetime standing ceiling that bounds the exposure window
      independently, emit every response action to the Book VI-07 evidence
      contract so the containment is provable, and are gated by the
      false-positive measurement Book VI-08 supplies. Leave the audience with the
      honest architecture: the in-boundary substitute for sub-second CAE
      revocation lands at minutes and bounds the window two ways — a short
      standing token lifetime and a fast reactive revocation — rather than
      pretending to recover a capability the boundary removed. The discipline is
      confidence-gated action deployed through change control, started in
      alert-only, and promoted only on measured evidence. Keep scope at FedRAMP
      Moderate; every closure claim here is self-assessed pending SCA and PMO/AO
      review.
    vendor_sources: ["fedramp_20x", "nist_800_53"]
