deck:
  title: "Response Automation"
  subtitle: "The SOAR playbook library that converts an in-boundary detection into a bounded, confidence-gated response"
  series_kicker: "Federal AAN — Volume VI: Implementation"
  date_code: "2026-07-09 17:00 ET"
  journey:
    - "Detect"
    - "Gate"
    - "Contain"
    - "Record"
  sources:
    ms_graph_revoke: "https://learn.microsoft.com/graph/api/user-revokesigninsessions"
    ms_confirm_compromised: "https://learn.microsoft.com/graph/api/riskyusers-confirmcompromised"
    ms_logic_apps: "https://learn.microsoft.com/azure/sentinel/automate-responses-with-playbooks"
    ms_automation_rules: "https://learn.microsoft.com/azure/sentinel/automate-incident-handling-with-automation-rules"
    ms_token_lifetime: "https://learn.microsoft.com/entra/identity/conditional-access/concept-token-protection"
