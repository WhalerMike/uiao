      a clean error — it is silent NTLM fallback. No amount of SPN hygiene, KDC
      placement, or clock discipline makes session-bound authentication
      path-independent; the token-based authentication these runbooks deploy is the
      only mechanism that closes IA-2 for SQL Server on modern transport. That is
