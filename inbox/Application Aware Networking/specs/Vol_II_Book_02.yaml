      text: "Order matters: fix and verify SPNs first, then block NTLMv1 — blocking before SPNs are clean turns silent fallback into hard authentication failures."
      accent: amber
    notes: >
      Book 06 is where the estate stops silently falling back to NTLM, and the guide
      is emphatic that this is root-cause work sequenced in a specific order.
      Missing SPN is the dominant cause: when a SQL Server service account has no
      correctly registered MSSQLSvc SPN, Kerberos cannot complete and the client
      falls back to NTLM without anyone noticing. The fix is to register the SPNs
      for the service account across all four variants — hostname and fully
      qualified name, each with and without the port — restart the service, and then
      prove the remediation by confirming the next connection's auth_scheme reads
      KERBEROS. Linked servers are the second cause: those using passthrough
      authentication (uses_self_credential set) are re-credentialed to an explicit
      Entra service-account mapping with token authentication and no stored
      password. The dedicated-service-account card is the prerequisite that makes
      SPN registration clean in the first place — every SQL service must run under a
      named domain account, never NETWORK SERVICE, LOCAL SYSTEM, or a shared
      account, because SPNs bind to the account identity. The callout carries the
      one sequencing rule a presenter must not skip: fix and verify the SPNs first,
      then block NTLMv1 by GPO. Blocking NTLM before the SPNs are clean does not
      improve security — it converts silent Kerberos-to-NTLM fallback into hard
      authentication failures across the estate, which is an outage, not a
      remediation.
