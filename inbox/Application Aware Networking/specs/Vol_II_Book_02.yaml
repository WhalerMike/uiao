        body: "GPO across all SQL hosts: LAN Manager authentication level = send NTLMv2 only, refuse LM and NTLM (LmCompatibilityLevel 5). Applied after SPNs verified."
        accent: amber
      - title: "Dedicated service accounts"
        body: "Every SQL service runs under a named domain account — never NETWORK SERVICE, LOCAL SYSTEM, or a shared account. The prerequisite for clean SPNs."
