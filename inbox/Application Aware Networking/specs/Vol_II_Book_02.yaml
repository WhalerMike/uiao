      authorization and access perimeter: a consistent Entra group naming
      convention for SQL authorization, dynamic group membership driven off
      HR-derived attributes, Conditional Access requiring a compliant device for all
      SQL access and MFA plus a tightened sign-in frequency for admins, and the
      application chain re-pointed from Integrated Security and SQL passwords to
      token-based connection strings and the Managed Identity path. The next two
      slides make the NTLM remediation and the CA perimeter concrete.

  # 13 --- content grid --------------------------------------------------------
  - type: content
    kicker: "NTLM REMEDIATION BY ROOT CAUSE · BOOK 06"
    title: "Close the fallback paths one cause at a time"
    layout: grid
    cards:
