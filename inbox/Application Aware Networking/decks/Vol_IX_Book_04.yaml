# AAN deck spec — Vol IX Book 04 (Teams Telephony Catalog & Teams SCuBA Drift).
# Scope: FedRAMP Moderate & Microsoft GCC Moderate only. Never cite High.
deck:
  title: "Teams Telephony Catalog & Teams SCuBA Drift"
  subtitle: "Vol IX Book 04 — number, calling-policy, and voice-routing changes as governed catalog items, and Teams secure-baseline drift as tracked work"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOLUME IX"
  date_code: "2026-07-14 11:56 ET"
  journey:
    - "Assign"
    - "Validate"
    - "Detect"
    - "Track"
  sources:
    ms_teamsvoice: "https://learn.microsoft.com/microsoftteams/cloud-voice-landing-page"
    cisa_scuba: "https://www.cisa.gov/scuba"

slides:
  - type: title
    notes: >
      Book 04 completes Volume IX with voice. The Teams telephony architecture is already established
      in Vol I Book 06 — Teams Phone, session border controllers, Direct Routing, Operator Connect,
      Calling Plans. This book adds the two things that make it operationally complete: a governed
      telephony catalog and Teams SCuBA drift wired into the Vol VII M365 loop. GCC Moderate throughout.
    vendor_sources: ["ms_teamsvoice"]

  - type: section
    kicker: "PART ONE"
    title: "Voice is a governed surface, not a phone system"
    callout: "Number and routing changes carry real safety and audit weight — emergency calling, toll fraud, lawful-access logging — and Teams has a SCuBA baseline that drifts like the rest of M365."
    callout_accent: navy
    notes: >
      Motivate the book. Teams telephony carries two kinds of ungoverned day-2 work: operator requests
      (number, calling policy, voice routing) and secure-configuration drift. This book governs the
      first as catalog items and folds the second into the existing compliance loop, so the telephony
      estate is both operable and continuously assessed.

  - type: content
    kicker: "PART ONE — THE TELEPHONY CATALOG"
    title: "Change-controlled voice operations"
    layout: grid
    cards:
      - title: "Number assign / release"
        body: "Reconciled to the number inventory; release returns the number to the pool (CM-3)."
        accent: navy
      - title: "Calling policy / dial plan"
        body: "Least-privilege calling scope — domestic-only by default (CM-3)."
        accent: teal
      - title: "E911 address validation"
        body: "Validated on assignment — a mis-mapped emergency address is a life-safety defect."
        accent: amber
      - title: "Voice-routing / SBC"
        body: "Boundary-affecting change; change-controlled and SoD-gated (CM-3)."
        accent: navy
    callout:
      text: "E911 is a gate, not a form field — a wrong registered address sends responders to the wrong place."
      accent: amber
    notes: >
      The four catalog items. Dwell on E911: it is the one telephony step where a silent error has
      physical consequences, so the catalog validates the emergency address at assignment time as a
      gate. All four are change-controlled and audited (CM-3 / AU-2).
    vendor_sources: ["ms_teamsvoice"]

  - type: content
    kicker: "PART TWO — TEAMS SCUBA DRIFT"
    title: "One loop, one more surface"
    layout: columns
    cards:
      - title: "Teams has a SCuBA baseline"
        body: "External access, meeting policies, app permissions, federation — a CISA SCuBA secure-config baseline like the rest of M365."
        accent: navy
        status: "CM-6"
      - title: "Reuse the Vol VII loop"
        body: "A new baseline fail becomes a typed ServiceNow Change/Incident against the Teams service CI — no new loop."
        accent: teal
        status: "Vol VII Book 02"
      - title: "Close with evidence"
        body: "Owner remediates on the native surface; re-test closes it with evidence."
        accent: navy
        status: "CM-6"
    callout:
      text: "This book does not build a new compliance loop for Teams — it extends the Vol VII Book 02 M365 loop to one more surface."
      accent: navy
    notes: >
      Make the reuse explicit: Teams is an M365 workload, so its secure-baseline drift folds into the
      existing M365 loop rather than a bespoke one. The SCuBA baseline reference is the canon SCuBA
      spec. CISA SCuBA / BOD 25-01.
    vendor_sources: ["cisa_scuba"]

  - type: table
    kicker: "AUTHORITIES CLOSED HERE"
    title: "The telephony closures"
    headers: ["Control", "Title", "Mechanism"]
    rows:
      - cells: ["CM-3", "Configuration Change Control", "Number/calling-policy/voice-routing changes with E911 validation"]
        accent: teal
      - cells: ["CM-6", "Configuration Settings", "Teams SCuBA drift into the Vol VII Book 02 M365 loop"]
      - cells: ["AU-2", "Event Logging", "Call-detail and telephony admin actions audited to the evidence contract"]
        accent: teal
    callout:
      text: "Telephony architecture is Vol I Book 06; this book governs its operation."
      accent: navy
    notes: >
      Mirror the generated rows. The distinction: Vol I Book 06 proves the telephony architecture; this
      book makes its operation governed — number and routing changes change-controlled with E911
      validation, and Teams secure-config drift tracked like any other M365 surface. FedRAMP Moderate.
    vendor_sources: ["uiao repo: inbox/Application Aware Networking/aan-compliance-spine.yml"]

  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "Volume IX closes here"
    layout: columns
    cards:
      - title: "Governed voice"
        body: "Number, calling-policy, and routing changes change-controlled with E911 validation."
        accent: teal
        status: "This book"
      - title: "Assessed"
        body: "Teams SCuBA drift tracked in the Vol VII loop — one loop, one more surface."
        accent: navy
        status: "CM-6"
      - title: "The whole arc"
        body: "Helpdesk, landing zone, app-reg, telephony — routine operations that evidence themselves."
        accent: navy
        status: "Volume IX"
    callout:
      text: "Day-2 operations, coordinated and evidenced — at FedRAMP Moderate & Microsoft GCC Moderate."
      accent: navy
    notes: >
      Close the volume. The honest limits: media-path confidentiality (SC-8) and SBC accreditation are
      Vol I Book 06 concerns; E911 validation is only as good as its address-to-location source. Leave
      the audience with the whole day-2 arc — four surfaces, one governed, evidenced discipline.
