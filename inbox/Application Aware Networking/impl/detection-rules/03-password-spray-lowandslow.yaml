id: fedaan-vi03-0003-password-spray-lowandslow
name: In-boundary password spray / low-and-slow (interactive + non-interactive)
description: |
  Detects password-spray and low-and-slow credential attacks by aggregating
  authentication failures by source across the FULL sign-in set — the usual blind
  spot is AADNonInteractiveUserSignInLogs, which carries the low-and-slow attempts
  interactive logs miss. Collection completeness, not detection logic, is the
  common failure here.
  Implements: AAN Vol III SIEM/XDR | Vol VI Book 03 | NIST SI-4, AC-7
severity: Medium
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
      - AADNonInteractiveUserSignInLogs
queryFrequency: PT1H
queryPeriod: PT6H
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110
query: |
  let window = 1h;
  let failCodes = dynamic([50126, 50053, 50055, 50056]);  // bad pw / locked / expired / invalid
  union
      (SigninLogs | where TimeGenerated > ago(window)),
      (AADNonInteractiveUserSignInLogs | where TimeGenerated > ago(window))
  | where ResultType in (failCodes)
  | summarize Targets = dcount(UserPrincipalName),
              Attempts = count(),
              FailedUsers = make_set(UserPrincipalName, 25),
              StartTime = min(TimeGenerated), EndTime = max(TimeGenerated)
          by IPAddress, ASN = tostring(AutonomousSystemNumber)
  // TUNE: >=10 distinct users AND >=50 attempts per source is a conservative spray floor
  | where Targets >= 10 and Attempts >= 50
  | project StartTime, EndTime, IPAddress, ASN, Targets, Attempts, FailedUsers
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
version: 1.0.0
kind: Scheduled
metadata:
  series: Federal Application-Aware Networking
  book: Vol VI Book 03 — Detection Engineering
  implements: Vol III SIEM/XDR
  reconstructs: identity-protection-spray
