<text x="450" y="463" text-anchor="middle" font-size="10" font-family="Arial" fill="#1F3864">FedRAMP 20x KSI: "Every workload has machine identity (cert)" — enforced automatically at IP provisioning. IA-9, IA-5(2), SC-8 evidence generated continuously.</text>
<text x="450" y="479" text-anchor="middle" font-size="10" font-family="Arial" fill="#2E75B6">Class A pipeline opens August 3, 2026. All three classes mandatory January 1, 2027.</text>
