<text x="450" y="293" text-anchor="middle" font-size="10" font-family="Arial" fill="#2E75B6">InfoBlox Tracker</text>
<circle cx="450.0" cy="110.0" r="18" fill="#1F3864"/>
<text x="450.0" y="55.0" text-anchor="middle" font-size="10" font-family="Arial" fill="#1F3864" font-weight="bold">1. Provision IP</text>
<text x="450.0" y="68.0" text-anchor="middle" font-size="9" font-family="Arial" fill="#2E75B6">Cross-cloud conflict</text>
<text x="450.0" y="79.0" text-anchor="middle" font-size="9" font-family="Arial" fill="#2E75B6">checked</text>
<circle cx="584.2" cy="187.5" r="18" fill="#2E75B6"/>
<text x="631.9" y="160.0" text-anchor="middle" font-size="10" font-family="Arial" fill="#1F3864" font-weight="bold">2. Create DNS A Record</text>
<text x="631.9" y="173.0" text-anchor="middle" font-size="9" font-family="Arial" fill="#2E75B6">A + PTR records</text>
<text x="631.9" y="184.0" text-anchor="middle" font-size="9" font-family="Arial" fill="#2E75B6">auto-created</text>
<circle cx="584.2" cy="342.5" r="18" fill="#2E75B6"/>
<text x="631.9" y="370.0" text-anchor="middle" font-size="10" font-family="Arial" fill="#1F3864" font-weight="bold">3. SCEP Enrollment</text>
<text x="631.9" y="383.0" text-anchor="middle" font-size="9" font-family="Arial" fill="#2E75B6">CA receives</text>
<text x="631.9" y="394.0" text-anchor="middle" font-size="9" font-family="Arial" fill="#2E75B6">SAN = DNS name</text>
<circle cx="450.0" cy="420.0" r="18" fill="#C55A11"/>
<text x="450.0" y="475.0" text-anchor="middle" font-size="10" font-family="Arial" fill="#1F3864" font-weight="bold">4. CA Signs Cert</text>
<text x="450.0" y="488.0" text-anchor="middle" font-size="9" font-family="Arial" fill="#2E75B6">ADCS / Key Vault /</text>
<text x="450.0" y="499.0" text-anchor="middle" font-size="9" font-family="Arial" fill="#2E75B6">ACM PCA</text>
<circle cx="315.8" cy="342.5" r="18" fill="#375623"/>
<text x="268.1" y="370.0" text-anchor="middle" font-size="10" font-family="Arial" fill="#1F3864" font-weight="bold">5. mTLS Active</text>
<text x="268.1" y="383.0" text-anchor="middle" font-size="9" font-family="Arial" fill="#2E75B6">Workload identity</text>
<text x="268.1" y="394.0" text-anchor="middle" font-size="9" font-family="Arial" fill="#2E75B6">established</text>
<circle cx="315.8" cy="187.5" r="18" fill="#C55A11"/>
<text x="268.1" y="160.0" text-anchor="middle" font-size="10" font-family="Arial" fill="#1F3864" font-weight="bold">6. 90/30/7-Day Alert</text>
<text x="268.1" y="173.0" text-anchor="middle" font-size="9" font-family="Arial" fill="#2E75B6">Timely renewal</text>
<text x="268.1" y="184.0" text-anchor="middle" font-size="9" font-family="Arial" fill="#2E75B6">or revocation</text>
