<svg viewBox="0 0 1040 368" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="368" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs><text x="520" y="28" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">Login Migration — Four-Phase Parallel Run Pattern</text><text x="520" y="46" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">Parallel run required — never disable legacy until Entra auth validated on every connection</text><rect x="15" y="68" width="210" height="200" rx="8" fill="#2E75B6"/><text x="120" y="90" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF">Phase 1</text><text x="120" y="106" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF">Create</text><text x="120" y="138" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">CREATE LOGIN FROM EXTERNAL</text><text x="120" y="156" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">PROVIDER (Entra type-E)</text><text x="120" y="174" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">alongside existing login</text><line x1="227" y1="168" x2="253" y2="168" stroke="#555" stroke-width="2" marker-end="url(#arw)"/><rect x="255" y="68" width="210" height="200" rx="8" fill="#C55A11"/><text x="360" y="90" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF">Phase 2</text><text x="360" y="106" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF">Validate</text><text x="360" y="138" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Test with real credential</text><text x="360" y="156" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Confirm Entra auth scheme</text><text x="360" y="174" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">on every connection path</text><line x1="467" y1="168" x2="493" y2="168" stroke="#555" stroke-width="2" marker-end="url(#arw)"/><rect x="495" y="68" width="210" height="200" rx="8" fill="#1F3864"/><text x="600" y="90" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF">Phase 3</text><text x="600" y="106" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF">Disable</text><text x="600" y="138" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">ALTER LOGIN DISABLE</text><text x="600" y="156" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">30-day observation period</text><text x="600" y="174" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Never DROP until clean</text><line x1="707" y1="168" x2="733" y2="168" stroke="#555" stroke-width="2" marker-end="url(#arw)"/><rect x="735" y="68" width="210" height="200" rx="8" fill="#375623"/><text x="840" y="90" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF">Phase 4</text><text x="840" y="106" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF">Drop</text><text x="840" y="138" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">DROP legacy login after</text><text x="840" y="156" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">30-day clean observation</text><text x="840" y="174" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">period is complete</text><rect x="60" y="284" width="880" height="70" rx="6" fill="#F2F2F2"/><text x="500" y="304" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#1F3864">Safety Rules</text><text x="140" y="320" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Never DROP until 30-day</text><text x="140" y="334" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">observation complete</text><text x="340" y="320" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Test in Arc-equivalent</text><text x="340" y="334" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">production environment</text><text x="540" y="320" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Entra login must have DB role</text><text x="540" y="334" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">before disabling legacy</text><text x="740" y="320" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">sa account: disable and</text><text x="740" y="334" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">rename — never leave active</text></svg>
