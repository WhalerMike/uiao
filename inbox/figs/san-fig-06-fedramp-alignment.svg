<svg viewBox="0 0 1040 390" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="390" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs><text x="520" y="28" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">SQL Server Modernization — FedRAMP 20x and Zero Trust Alignment</text><text x="520" y="46" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">Every migration milestone closes a federal compliance requirement</text><rect x="20" y="90" width="190" height="76" rx="6" fill="#1F3864"/><text x="115" y="110" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Eliminate Windows/SQL Auth</text><text x="115" y="128" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">→ Entra token-only</text><line x1="212" y1="128" x2="238" y2="128" stroke="#555" stroke-width="2" marker-end="url(#arw)"/><rect x="240" y="90" width="190" height="76" rx="6" fill="#EBF3FB" stroke="#2E75B6" stroke-width="1"/><text x="335" y="108" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">IA-2 (MFA), IA-5 (credential mgmt)</text><text x="335" y="126" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">CA-7 (continuous monitoring)</text><rect x="435" y="90" width="150" height="76" rx="6" fill="#F2F2F2" stroke="#1F3864" stroke-width="1"/><text x="510" y="112" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#1F3864">OMB M-22-09</text><text x="510" y="130" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#1F3864">BOD 25-01</text><rect x="570" y="90" width="190" height="76" rx="6" fill="#2E75B6"/><text x="665" y="110" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Arc Managed Identity</text><text x="665" y="128" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">→ no stored credential</text><line x1="762" y1="128" x2="788" y2="128" stroke="#555" stroke-width="2" marker-end="url(#arw)"/><rect x="790" y="90" width="190" height="76" rx="6" fill="#EBF3FB" stroke="#2E75B6" stroke-width="1"/><text x="885" y="108" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">IA-3 (device auth)</text><text x="885" y="126" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">SC-8 (transmission integrity)</text><rect x="985" y="90" width="150" height="76" rx="6" fill="#F2F2F2" stroke="#1F3864" stroke-width="1"/><text x="1060" y="112" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#1F3864">EO 14028</text><text x="1060" y="130" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#1F3864">NIST SP 800-207</text><rect x="20" y="186" width="190" height="76" rx="6" fill="#1F3864"/><text x="115" y="206" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Entra Conditional Access</text><text x="115" y="224" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">as SQL outer perimeter</text><line x1="212" y1="224" x2="238" y2="224" stroke="#555" stroke-width="2" marker-end="url(#arw)"/><rect x="240" y="186" width="190" height="76" rx="6" fill="#EBF3FB" stroke="#2E75B6" stroke-width="1"/><text x="335" y="204" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">AC-3 (access enforcement)</text><text x="335" y="222" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">AC-17 (remote access)</text><rect x="435" y="186" width="150" height="76" rx="6" fill="#F2F2F2" stroke="#1F3864" stroke-width="1"/><text x="510" y="208" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#1F3864">CISA ZTMM</text><text x="510" y="226" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#1F3864">Identity pillar</text><rect x="570" y="186" width="190" height="76" rx="6" fill="#2E75B6"/><text x="665" y="206" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">NTLM elimination</text><text x="665" y="224" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">(zero NTLM posture)</text><line x1="762" y1="224" x2="788" y2="224" stroke="#555" stroke-width="2" marker-end="url(#arw)"/><rect x="790" y="186" width="190" height="76" rx="6" fill="#EBF3FB" stroke="#2E75B6" stroke-width="1"/><text x="885" y="204" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">AU-2/12 (NTLM is audit-opaque)</text><text x="885" y="222" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">SI-4 (system monitoring)</text><rect x="985" y="186" width="150" height="76" rx="6" fill="#F2F2F2" stroke="#1F3864" stroke-width="1"/><text x="1060" y="208" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#1F3864">BOD 25-01</text><text x="1060" y="226" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#1F3864">OMB M-22-09 S3</text><rect x="20" y="282" width="190" height="76" rx="6" fill="#1F3864"/><text x="115" y="302" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Continuous monitoring</text><text x="115" y="320" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">CCM compliance record</text><line x1="212" y1="320" x2="238" y2="320" stroke="#555" stroke-width="2" marker-end="url(#arw)"/><rect x="240" y="282" width="190" height="76" rx="6" fill="#EBF3FB" stroke="#2E75B6" stroke-width="1"/><text x="335" y="300" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">CA-7 (continuous monitoring)</text><text x="335" y="318" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">FedRAMP 20x KSI evidence</text><rect x="435" y="282" width="150" height="76" rx="6" fill="#F2F2F2" stroke="#1F3864" stroke-width="1"/><text x="510" y="304" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#1F3864">FedRAMP 20x</text><text x="510" y="322" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#1F3864">Jan 1 2027</text><rect x="570" y="282" width="190" height="76" rx="6" fill="#2E75B6"/><text x="665" y="302" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Login migration parallel run</text><text x="665" y="320" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">validated and documented</text><line x1="762" y1="320" x2="788" y2="320" stroke="#555" stroke-width="2" marker-end="url(#arw)"/><rect x="790" y="282" width="190" height="76" rx="6" fill="#EBF3FB" stroke="#2E75B6" stroke-width="1"/><text x="885" y="300" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">CM-8 (component inventory)</text><text x="885" y="318" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">CM-2 (baseline configuration)</text><rect x="985" y="282" width="150" height="76" rx="6" fill="#F2F2F2" stroke="#1F3864" stroke-width="1"/><text x="1060" y="304" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#1F3864">NIST SP 800-53 Rev 5</text></svg>
