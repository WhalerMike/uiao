<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="860" height="480" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#999"/></marker><marker id="arww" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#fff"/></marker></defs><text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">Federal Data Classification Label Taxonomy</text><text x="430" y="44" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">Four sensitivity tiers — each level adds enforcement that the layer below lacks</text><rect x="200" y="80" width="460" height="68" rx="4" fill="#C00000"/><text x="430" y="98" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">CUI — Specified</text><text x="430" y="114" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">Label + encryption + domain-restricted + time-limited access + Purview Audit Premium</text><text x="430" y="130" text-anchor="middle" font-size="8" font-weight="normal" font-style="italic" fill="#FFFFFF">Examples: Privacy Act · Law enforcement · Export-controlled data</text><rect x="170" y="155" width="520" height="68" rx="4" fill="#C55A11"/><text x="430" y="173" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">CUI — Basic</text><text x="430" y="189" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">Label + AES-256 encryption + access restricted to agency Entra tenant</text><text x="430" y="205" text-anchor="middle" font-size="8" font-weight="normal" font-style="italic" fill="#FFFFFF">Examples: PII not covered by Privacy Act · Budget data · Pre-decisional</text><rect x="140" y="230" width="580" height="68" rx="4" fill="#2E75B6"/><text x="430" y="248" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Internal</text><text x="430" y="264" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">Sensitivity label applied — no encryption enforced · DLPU policy monitors</text><text x="430" y="280" text-anchor="middle" font-size="8" font-weight="normal" font-style="italic" fill="#FFFFFF">Examples: Internal communications · Draft documents · Work product</text><rect x="110" y="305" width="640" height="68" rx="4" fill="#F2F2F2"/><text x="430" y="323" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#1F3864">Public</text><text x="430" y="339" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#1F3864">No label required · DLP monitors for accidental CUI in public content</text><text x="430" y="355" text-anchor="middle" font-size="8" font-weight="normal" font-style="italic" fill="#1F3864">Examples: Press releases · Published reports · Public-facing web content</text><line x1="830" y1="305" x2="830" y2="82" stroke="#1F3864" stroke-width="2"/><line x1="830" y1="82" x2="830" y2="78" stroke="#1F3864" stroke-width="2" marker-end="url(#arw)"/><text x="844" y="200" text-anchor="start" font-size="8" font-weight="normal" font-style="normal" fill="#1F3864">Increasing
protection</text><text x="430" y="466" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">Satisfies: MP-2 Media Access · MP-3 Media Marking · SC-13 Cryptographic Protection · SC-28 (data-layer extension)</text></svg>
