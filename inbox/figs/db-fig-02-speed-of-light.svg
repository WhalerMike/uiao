<svg viewBox="0 0 1040 404" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="404" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs><text x="520" y="28" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">The Speed-of-Light Tax — Propagation Delay Is Non-Negotiable</text><text x="520" y="46" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">SD-WAN attacks the gap between observed latency and the physics floor — not the floor itself</text><rect x="60" y="60" width="180" height="18" rx="2" fill="#2E75B6"/><text x="250" y="72" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#2E75B6">Physics floor (propagation)</text><rect x="380" y="60" width="180" height="18" rx="2" fill="#C55A11"/><text x="570" y="72" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#C55A11">Addressable gap (SD-WAN closes this)</text><text x="280" y="112" text-anchor="end" font-size="10" font-weight="bold" font-style="normal" fill="#1F3864">Metro (50 km)</text><rect x="290" y="100" width="1" height="20" rx="2" fill="#2E75B6"/><rect x="291" y="100" width="0" height="20" rx="2" fill="#C55A11"/><text x="297" y="114" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">floor=0.5 ms  excess~0.2 ms</text><text x="280" y="170" text-anchor="end" font-size="10" font-weight="bold" font-style="normal" fill="#1F3864">Cross-region (1,000 km)</text><rect x="290" y="158" width="22" height="20" rx="2" fill="#2E75B6"/><rect x="312" y="158" width="8" height="20" rx="2" fill="#C55A11"/><text x="326" y="172" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">floor=10 ms  excess~4 ms</text><text x="280" y="228" text-anchor="end" font-size="10" font-weight="bold" font-style="normal" fill="#1F3864">NY to London (5,600 km)</text><rect x="290" y="216" width="124" height="20" rx="2" fill="#2E75B6"/><rect x="414" y="216" width="75" height="20" rx="2" fill="#C55A11"/><text x="495" y="230" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">floor=56 ms  excess~34 ms</text><text x="280" y="286" text-anchor="end" font-size="10" font-weight="bold" font-style="normal" fill="#1F3864">NY to Singapore (15,300 km)</text><rect x="290" y="274" width="340" height="20" rx="2" fill="#2E75B6"/><rect x="630" y="274" width="282" height="20" rx="2" fill="#C55A11"/><text x="918" y="288" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">floor=153 ms  excess~127 ms</text><rect x="60" y="340" width="880" height="48" rx="6" fill="#F2F2F2"/><text x="500" y="360" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#1F3864">SD-WAN closes the addressable gap: routing excess, jitter, tail latency, FEC for loss recovery</text><text x="500" y="374" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#C55A11">Strong cross-region consistency = spending round trips. That is a latency problem, not bandwidth.</text></svg>
