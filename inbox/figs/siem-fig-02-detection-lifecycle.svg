<svg viewBox="0 0 1040 320" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="320" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#999"/></marker><marker id="arww" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#fff"/></marker></defs><text x="520" y="26" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">Detection Engineering Lifecycle</text><text x="520" y="44" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">Treat analytics rules as code — author, test, deploy, tune, and retire on a managed cycle</text><rect x="50" y="80" width="130" height="100" rx="6" fill="#1F3864"/><text x="115" y="102" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Author</text><line x1="60" y1="112" x2="170" y2="112" stroke="#FFFFFF" stroke-width="1"/><text x="115" y="130" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">Hypothesis from</text><text x="115" y="148" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">threat intel / audit gap</text><line x1="182" y1="130" x2="200" y2="130" stroke="#999" stroke-width="2" marker-end="url(#arw)"/><rect x="202" y="80" width="130" height="100" rx="6" fill="#2E75B6"/><text x="267" y="102" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Test</text><line x1="212" y1="112" x2="322" y2="112" stroke="#FFFFFF" stroke-width="1"/><text x="267" y="130" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">Dev workspace with</text><text x="267" y="148" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">real or synthetic logs</text><line x1="334" y1="130" x2="352" y2="130" stroke="#999" stroke-width="2" marker-end="url(#arw)"/><rect x="354" y="80" width="130" height="100" rx="6" fill="#375623"/><text x="419" y="102" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Deploy</text><line x1="364" y1="112" x2="474" y2="112" stroke="#FFFFFF" stroke-width="1"/><text x="419" y="130" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">Prod workspace +</text><text x="419" y="148" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">alert threshold set</text><line x1="486" y1="130" x2="504" y2="130" stroke="#999" stroke-width="2" marker-end="url(#arw)"/><rect x="506" y="80" width="130" height="100" rx="6" fill="#C55A11"/><text x="571" y="102" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Monitor</text><line x1="516" y1="112" x2="626" y2="112" stroke="#FFFFFF" stroke-width="1"/><text x="571" y="130" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">Alert rate · FP ratio ·</text><text x="571" y="148" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">MTTD measurement</text><line x1="638" y1="130" x2="656" y2="130" stroke="#999" stroke-width="2" marker-end="url(#arw)"/><rect x="658" y="80" width="130" height="100" rx="6" fill="#2E75B6"/><text x="723" y="102" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Tune</text><line x1="668" y1="112" x2="778" y2="112" stroke="#FFFFFF" stroke-width="1"/><text x="723" y="130" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">Adjust threshold ·</text><text x="723" y="148" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">Add exceptions</text><line x1="790" y1="130" x2="808" y2="130" stroke="#999" stroke-width="2" marker-end="url(#arw)"/><rect x="810" y="80" width="130" height="100" rx="6" fill="#4472C4"/><text x="875" y="102" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Retire</text><line x1="820" y1="112" x2="930" y2="112" stroke="#FFFFFF" stroke-width="1"/><text x="875" y="130" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">Rule superseded or</text><text x="875" y="148" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#FFFFFF">threat eliminated</text><line x1="875" y1="190" x2="115" y2="190" stroke="#2E75B6" stroke-width="1" stroke-dasharray="5,3"/><line x1="115" y1="190" x2="113" y2="189" stroke="#2E75B6" stroke-width="2" marker-end="url(#arw)"/><text x="520" y="206" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#666666">Tune feedback loop — rules evolve as the environment and threats change</text><text x="520" y="306" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">Satisfies: AU-6(1) Automated Process Integration · SI-4(2) Automated Real-time Analysis</text></svg>
