<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="1200" height="660" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF3FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.18"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C00000"/>
    </marker>
    <marker id="arr_grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#375623"/>
    </marker>
  </defs>
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">The MPLS Hairpin vs. Local Breakout</text>
  <text x="600" y="68" text-anchor="middle" font-size="14" fill="#555">Why field office voice fails — and the fix</text>

  <!-- LEFT: BEFORE (Bad) -->
  <rect x="20" y="90" width="555" height="530" rx="12" fill="#FFF5F5" stroke="#C00000" stroke-width="2"/>
  <text x="297" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#C00000">BEFORE: MPLS Hairpin</text>
  <text x="297" y="138" text-anchor="middle" font-size="12" fill="#C00000">100–130 ms one-way · Over G.114 budget · Citizen hears degradation</text>

  <!-- Portland agent (left) -->
  <rect x="50" y="165" width="120" height="70" rx="8" fill="#1F3864" filter="url(#sh)"/>
  <text x="110" y="192" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Portland</text>
  <text x="110" y="208" text-anchor="middle" font-size="11" fill="#aaa">Field Office</text>
  <text x="110" y="224" text-anchor="middle" font-size="11" fill="#C55A11">Agent Desktop</text>

  <!-- MPLS cloud -->
  <ellipse cx="297" cy="295" rx="110" ry="60" fill="#F2F2F2" stroke="#888" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="297" y="285" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">MPLS</text>
  <text x="297" y="303" text-anchor="middle" font-size="12" fill="#555">Private Circuit</text>
  <text x="297" y="319" text-anchor="middle" font-size="11" fill="#888">Guaranteed BW, not low latency</text>

  <!-- Washington DC hub -->
  <rect x="200" y="390" width="200" height="65" rx="8" fill="#C55A11" filter="url(#sh)"/>
  <text x="300" y="416" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Washington DC</text>
  <text x="300" y="434" text-anchor="middle" font-size="11" fill="white">Security Inspection</text>
  <text x="300" y="450" text-anchor="middle" font-size="11" fill="#FFE0C0">+60–80 ms penalty</text>

  <!-- Internet cloud -->
  <ellipse cx="430" cy="530" rx="90" ry="42" fill="#EBF3FF" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="430" y="524" text-anchor="middle" font-size="12" fill="#2E75B6" font-weight="bold">Internet</text>
  <text x="430" y="540" text-anchor="middle" font-size="11" fill="#555">→ AWS .com</text>

  <!-- Hairpin path arrows (red) -->
  <path d="M170,200 Q200,250 210,260" stroke="#C00000" stroke-width="2.5" fill="none" marker-end="url(#arr_red)"/>
  <path d="M297,355 Q297,370 300,390" stroke="#C00000" stroke-width="2.5" fill="none" marker-end="url(#arr_red)"/>
  <path d="M390,455 Q420,490 410,510" stroke="#C00000" stroke-width="2.5" fill="none" marker-end="url(#arr_red)"/>

  <!-- MOS badge -->
  <circle cx="490" cy="190" r="48" fill="#C00000" filter="url(#sh)"/>
  <text x="490" y="182" text-anchor="middle" font-size="11" fill="white">MOS</text>
  <text x="490" y="202" text-anchor="middle" font-size="22" fill="white" font-weight="bold">2.9</text>
  <text x="490" y="218" text-anchor="middle" font-size="10" fill="#FFB0B0">Very Annoying</text>

  <!-- RIGHT: AFTER (Good) -->
  <rect x="625" y="90" width="555" height="530" rx="12" fill="#F0FFF0" stroke="#375623" stroke-width="2"/>
  <text x="902" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#375623">AFTER: SD-WAN Local Breakout</text>
  <text x="902" y="138" text-anchor="middle" font-size="12" fill="#375623">5–15 ms one-way · Well within G.114 · Excellent call quality</text>

  <!-- Portland agent (right) -->
  <rect x="650" y="165" width="130" height="70" rx="8" fill="#1F3864" filter="url(#sh)"/>
  <text x="715" y="192" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Portland</text>
  <text x="715" y="208" text-anchor="middle" font-size="11" fill="#aaa">Field Office</text>
  <text x="715" y="224" text-anchor="middle" font-size="11" fill="#C55A11">SD-WAN Edge</text>

  <!-- Local DIA -->
  <rect x="810" y="165" width="140" height="70" rx="8" fill="#2E75B6" filter="url(#sh)"/>
  <text x="880" y="192" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Local DIA</text>
  <text x="880" y="208" text-anchor="middle" font-size="11" fill="white">Direct Internet</text>
  <text x="880" y="224" text-anchor="middle" font-size="11" fill="#C0E0FF">DSCP EF steering</text>

  <!-- AWS us-west-2 -->
  <rect x="1020" y="340" width="140" height="70" rx="8" fill="#375623" filter="url(#sh)"/>
  <text x="1090" y="367" text-anchor="middle" font-size="12" fill="white" font-weight="bold">AWS us-west-2</text>
  <text x="1090" y="383" text-anchor="middle" font-size="11" fill="white">Amazon Connect</text>
  <text x="1090" y="399" text-anchor="middle" font-size="11" fill="#afc">.com endpoint</text>

  <!-- Clean path arrows (green) -->
  <line x1="780" y1="200" x2="810" y2="200" stroke="#375623" stroke-width="3" marker-end="url(#arr_grn)"/>
  <path d="M950,200 Q1000,200 1040,340" stroke="#375623" stroke-width="3" fill="none" marker-end="url(#arr_grn)"/>

  <!-- Physics label on clean path -->
  <rect x="960" y="220" width="160" height="50" rx="6" fill="#375623" opacity="0.9"/>
  <text x="1040" y="240" text-anchor="middle" font-size="12" fill="white" font-weight="bold">~5–15 ms</text>
  <text x="1040" y="256" text-anchor="middle" font-size="11" fill="white">Portland ↔ Oregon AWS</text>
  <text x="1040" y="270" text-anchor="middle" font-size="11" fill="#afc">physics minimum</text>

  <!-- MOS badge good -->
  <circle cx="1090" cy="490" r="48" fill="#375623" filter="url(#sh)"/>
  <text x="1090" y="482" text-anchor="middle" font-size="11" fill="white">MOS</text>
  <text x="1090" y="502" text-anchor="middle" font-size="22" fill="white" font-weight="bold">4.4</text>
  <text x="1090" y="518" text-anchor="middle" font-size="10" fill="#B0FFB0">Excellent</text>

  <!-- MPLS path still exists for data center traffic -->
  <rect x="640" y="390" width="175" height="55" rx="8" fill="#F2F2F2" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="727" y="413" text-anchor="middle" font-size="11" fill="#555">MPLS still carries</text>
  <text x="727" y="429" text-anchor="middle" font-size="11" fill="#555">VMware / on-prem traffic</text>

  <!-- Footer note -->
  <text x="600" y="636" text-anchor="middle" font-size="12" fill="#888">SD-WAN policy routes Amazon Connect and Teams Phone voice to local DIA · MPLS retained for on-premises workloads</text>
</svg>
