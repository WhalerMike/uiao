<svg viewBox="0 0 1040 320" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="320" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#999"/></marker><marker id="arww" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#fff"/></marker></defs><text x="520" y="26" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">PIM Role Activation Flow</text><text x="520" y="44" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">From eligible assignment to time-limited active role — every step logged</text><rect x="64" y="80" width="120" height="90" rx="6" fill="#1F3864"/><text x="124" y="102" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">User</text><text x="124" y="118" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">Request</text><text x="124" y="138" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">Request +</text><text x="124" y="151" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">Justification</text><line x1="186" y1="125" x2="196" y2="125" stroke="#999" stroke-width="2" marker-end="url(#arw)"/><rect x="196" y="80" width="120" height="90" rx="6" fill="#2E75B6"/><text x="256" y="102" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">MFA</text><text x="256" y="118" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">Challenge</text><text x="256" y="138" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">Phishing-</text><text x="256" y="151" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">resistant MFA</text><line x1="318" y1="125" x2="328" y2="125" stroke="#999" stroke-width="2" marker-end="url(#arw)"/><rect x="328" y="80" width="120" height="90" rx="6" fill="#C55A11"/><text x="388" y="102" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">Approver</text><text x="388" y="118" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">Notified</text><text x="388" y="138" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">Email alert +</text><text x="388" y="151" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">Entra portal</text><line x1="450" y1="125" x2="460" y2="125" stroke="#999" stroke-width="2" marker-end="url(#arw)"/><rect x="460" y="80" width="120" height="90" rx="6" fill="#375623"/><text x="520" y="102" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">Approval</text><text x="520" y="118" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">Granted</text><text x="520" y="138" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">Manual or</text><text x="520" y="151" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">auto-approve</text><line x1="582" y1="125" x2="592" y2="125" stroke="#999" stroke-width="2" marker-end="url(#arw)"/><rect x="592" y="80" width="120" height="90" rx="6" fill="#1F3864"/><text x="652" y="102" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">Role</text><text x="652" y="118" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">Active</text><text x="652" y="138" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">1–8 hour</text><text x="652" y="151" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">window</text><line x1="714" y1="125" x2="724" y2="125" stroke="#999" stroke-width="2" marker-end="url(#arw)"/><rect x="724" y="80" width="120" height="90" rx="6" fill="#4472C4"/><text x="784" y="102" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">Auto</text><text x="784" y="118" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">Expires</text><text x="784" y="138" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">No manual</text><text x="784" y="151" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">revocation needed</text><line x1="846" y1="125" x2="856" y2="125" stroke="#999" stroke-width="2" marker-end="url(#arw)"/><rect x="856" y="80" width="120" height="90" rx="6" fill="#7030A0"/><text x="916" y="102" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">Audit</text><text x="916" y="118" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">Logged</text><text x="916" y="138" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">Token-level</text><text x="916" y="151" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">record → SIEM</text><line x1="64" y1="190" x2="976" y2="190" stroke="#F2F2F2" stroke-width="1"/><text x="520" y="206" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#666666">Every activation tied to: user identity · MFA proof · approver decision · justification text · start/end timestamp</text><text x="520" y="306" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">Satisfies: IA-11 Re-authentication · AC-6(9) Log of privileged functions · CA-7 ConMon evidence</text></svg>
