<svg viewBox="0 0 1040 460" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="460" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs><text x="520" y="28" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">SD-WAN Traffic Classification — Lean vs. Fat</text><text x="520" y="46" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">SD-WAN selects per-class paths — protecting sync commits from competing with bulk transfers</text><rect x="70" y="68" width="400" height="288" rx="8" fill="#2E75B6"/><text x="270" y="90" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF">LEAN LANE</text><text x="270" y="106" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF">(low latency, low jitter)</text><rect x="110" y="128" width="320" height="32" rx="4" fill="#FFFFFF"/><text x="270" y="148" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Consensus heartbeats</text><rect x="110" y="168" width="320" height="32" rx="4" fill="#FFFFFF"/><text x="270" y="188" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Leader election</text><rect x="110" y="208" width="320" height="32" rx="4" fill="#FFFFFF"/><text x="270" y="228" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Sync-commit quorum ACKs</text><rect x="110" y="248" width="320" height="32" rx="4" fill="#FFFFFF"/><text x="270" y="268" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Clock synchronization</text><rect x="110" y="288" width="320" height="32" rx="4" fill="#FFFFFF"/><text x="270" y="308" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">CA token validation</text><rect x="570" y="68" width="400" height="288" rx="8" fill="#C55A11"/><text x="770" y="90" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF">FAT LANE</text><text x="770" y="106" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF">(throughput, bulk)</text><rect x="610" y="128" width="320" height="32" rx="4" fill="#FFFFFF"/><text x="770" y="148" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Base snapshots and backups</text><rect x="610" y="168" width="320" height="32" rx="4" fill="#FFFFFF"/><text x="770" y="188" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Async log shipping (DR)</text><rect x="610" y="208" width="320" height="32" rx="4" fill="#FFFFFF"/><text x="770" y="228" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Analytics replication</text><rect x="610" y="248" width="320" height="32" rx="4" fill="#FFFFFF"/><text x="770" y="268" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Read-replica sync</text><rect x="610" y="288" width="320" height="32" rx="4" fill="#FFFFFF"/><text x="770" y="308" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Telemetry and logging</text><line x1="472" y1="212" x2="530" y2="212" stroke="#2E75B6" stroke-width="2" marker-end="url(#arw)"/><line x1="472" y1="272" x2="530" y2="272" stroke="#C55A11" stroke-width="2" marker-end="url(#arw)"/><rect x="502" y="192" width="76" height="120" rx="6" fill="#F2F2F2" stroke="#1F3864" stroke-width="2"/><text x="540" y="246" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#1F3864">SD-
WAN</text><rect x="60" y="374" width="880" height="68" rx="6" fill="#EBF3FB" stroke="#1F3864" stroke-width="1"/><text x="500" y="394" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#1F3864">Three Things SD-WAN Buys for Database Architecture</text><text x="170" y="410" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Near-geodesic routing</text><text x="170" y="426" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">(floor*3 to floor*1.1)</text><text x="450" y="410" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">FEC + packet duplication</text><text x="450" y="426" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">(tail latency reduction)</text><text x="730" y="410" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Class separation</text><text x="730" y="426" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">(bulk cannot starve commit ACKs)</text></svg>
