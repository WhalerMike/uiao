<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="1200" height="620" fill="#FFFFFF"/>
  <defs>
    <filter id="sh"><feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.18"/></filter>
    <marker id="arr4r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C00000"/>
    </marker>
    <marker id="arr4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#375623"/>
    </marker>
    <marker id="arr4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2E75B6"/>
    </marker>
  </defs>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">Hybrid Agent: Dual Concurrent Voice Streams</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#555">Amazon Connect citizen call + Teams Phone internal call — simultaneous DSCP EF streams</text>

  <!-- Workstation center -->
  <rect x="430" y="230" width="340" height="180" rx="12" fill="#1F3864" filter="url(#sh)"/>
  <text x="600" y="260" text-anchor="middle" font-size="16" fill="white" font-weight="bold">Agent Workstation</text>
  <rect x="450" y="272" width="140" height="50" rx="6" fill="#C55A11"/>
  <text x="520" y="293" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Amazon Connect</text>
  <text x="520" y="311" text-anchor="middle" font-size="11" fill="white">Contact Control Panel</text>
  <rect x="610" y="272" width="140" height="50" rx="6" fill="#375623"/>
  <text x="680" y="293" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Teams Desktop</text>
  <text x="680" y="311" text-anchor="middle" font-size="11" fill="white">Phone + Meetings</text>

  <!-- Headset -->
  <ellipse cx="600" cy="370" rx="50" ry="30" fill="#2E75B6" opacity="0.8"/>
  <text x="600" y="366" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Headset</text>
  <text x="600" y="381" text-anchor="middle" font-size="10" fill="white">single USB</text>

  <!-- Stream 1: Connect to Citizen -->
  <rect x="60" y="230" width="200" height="80" rx="10" fill="#C55A11" filter="url(#sh)"/>
  <text x="160" y="258" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Citizen Call</text>
  <text x="160" y="276" text-anchor="middle" font-size="12" fill="white">Amazon Connect</text>
  <text x="160" y="294" text-anchor="middle" font-size="11" fill="#FFD0A0">N8NN · AWS .com</text>

  <rect x="60" y="320" width="200" height="55" rx="6" fill="#FFE8CC"/>
  <text x="160" y="341" text-anchor="middle" font-size="12" fill="#C55A11" font-weight="bold">DSCP EF · Stream 1</text>
  <text x="160" y="357" text-anchor="middle" font-size="11" fill="#555">~100 Kbps RTP/SRTP</text>
  <text x="160" y="371" text-anchor="middle" font-size="11" fill="#555">UDP to AWS .com</text>

  <!-- Stream 2: Teams to PSTN -->
  <rect x="940" y="230" width="200" height="80" rx="10" fill="#375623" filter="url(#sh)"/>
  <text x="1040" y="258" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Supervisor Call</text>
  <text x="1040" y="276" text-anchor="middle" font-size="12" fill="white">Teams Phone</text>
  <text x="1040" y="294" text-anchor="middle" font-size="11" fill="#afc">GCC Moderate</text>

  <rect x="940" y="320" width="200" height="55" rx="6" fill="#E0F0E0"/>
  <text x="1040" y="341" text-anchor="middle" font-size="12" fill="#375623" font-weight="bold">DSCP EF · Stream 2</text>
  <text x="1040" y="357" text-anchor="middle" font-size="11" fill="#555">~100 Kbps RTP/SRTP</text>
  <text x="1040" y="371" text-anchor="middle" font-size="11" fill="#555">UDP to MS GCC edge</text>

  <!-- SD-WAN below workstation -->
  <rect x="380" y="450" width="440" height="65" rx="10" fill="#2E75B6" filter="url(#sh)"/>
  <text x="600" y="475" text-anchor="middle" font-size="14" fill="white" font-weight="bold">SD-WAN Edge — Shared Lowest-Latency Path</text>
  <text x="600" y="495" text-anchor="middle" font-size="12" fill="white">(max hybrid agents) × 200 Kbps reserved DSCP EF capacity</text>

  <!-- Connect lines -->
  <line x1="260" y1="270" x2="430" y2="310" stroke="#C55A11" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arr4r)"/>
  <line x1="940" y1="270" x2="770" y2="310" stroke="#375623" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arr4g)"/>
  <line x1="600" y1="410" x2="600" y2="450" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#arr4b)"/>

  <!-- Bandwidth math box -->
  <rect x="300" y="100" width="600" height="60" rx="8" fill="#EBF3FF" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#1F3864" font-weight="bold">Capacity Planning Formula</text>
  <text x="600" y="148" text-anchor="middle" font-size="13" fill="#1F3864">(Max concurrent hybrid agents) × 200 Kbps = Reserved DSCP EF capacity on lowest-latency path</text>

  <text x="600" y="594" text-anchor="middle" font-size="12" fill="#888">Browser choice matters: Connect in Chrome (Chromium WebRTC) · Teams as desktop client — avoids browser compatibility edge cases</text>
</svg>
