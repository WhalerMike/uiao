<text x="270" y="142" text-anchor="middle" font-size="10" font-family="Arial" fill="#FFFFFF" font-weight="bold">Azure Gov</text>
<text x="270" y="156" text-anchor="middle" font-size="10" font-family="Arial" fill="#FFFFFF" font-weight="bold">GCC</text>
<text x="270" y="178" text-anchor="middle" font-size="18" font-family="Arial" fill="#FFFFFF">?</text>
<rect x="40" y="270" width="100" height="70" rx="6" fill="#2E75B6" opacity="0.8"/>
<text x="90" y="292" text-anchor="middle" font-size="10" font-family="Arial" fill="#FFFFFF" font-weight="bold">AWS</text>
<text x="90" y="306" text-anchor="middle" font-size="10" font-family="Arial" fill="#FFFFFF" font-weight="bold">GovCloud</text>
<text x="90" y="328" text-anchor="middle" font-size="18" font-family="Arial" fill="#FFFFFF">?</text>
<rect x="220" y="270" width="100" height="70" rx="6" fill="#C55A11" opacity="0.8"/>
<text x="270" y="292" text-anchor="middle" font-size="10" font-family="Arial" fill="#FFFFFF" font-weight="bold">Oracle OCI</text>
<text x="270" y="306" text-anchor="middle" font-size="10" font-family="Arial" fill="#FFFFFF" font-weight="bold">OPM HRIT</text>
<text x="270" y="328" text-anchor="middle" font-size="18" font-family="Arial" fill="#FFFFFF">?</text>
<text x="210" y="390" text-anchor="middle" font-size="10" font-family="Arial" fill="#C00000">No cross-environment IP visibility</text>
<text x="210" y="405" text-anchor="middle" font-size="10" font-family="Arial" fill="#C00000">No unified DNS security policy</text>
<text x="210" y="420" text-anchor="middle" font-size="10" font-family="Arial" fill="#C00000">No automated cert lifecycle</text>
<text x="210" y="435" text-anchor="middle" font-size="10" font-family="Arial" fill="#C00000">Four separate evidence sources</text>
