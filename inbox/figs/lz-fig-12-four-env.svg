<svg viewBox="0 0 900 500" width="900" height="500" xmlns="http://www.w3.org/2000/svg">
<rect width="900" height="500" fill="#FFFFFF"/>
<text x="450" y="30" text-anchor="middle" font-size="16" font-family="Arial" fill="#1F3864" font-weight="bold">Four Environments — Blind Islands vs. Unified Visibility</text>
<text x="450" y="50" text-anchor="middle" font-size="11" font-family="Arial" fill="#2E75B6">Without InfoBlox: four opaque IP spaces. With InfoBlox: single cross-environment control plane.</text>
<rect x="20" y="70" width="380" height="380" rx="8" fill="#F2F2F2" stroke="#C00000" stroke-width="2" stroke-dasharray="6,3"/>
<text x="210" y="95" text-anchor="middle" font-size="12" font-family="Arial" fill="#C00000" font-weight="bold">WITHOUT InfoBlox</text>
<text x="210" y="110" text-anchor="middle" font-size="10" font-family="Arial" fill="#1F3864">Four separate, opaque IP spaces</text>
<rect x="40" y="120" width="100" height="70" rx="6" fill="#1F3864" opacity="0.8"/>
<text x="90" y="142" text-anchor="middle" font-size="10" font-family="Arial" fill="#FFFFFF" font-weight="bold">VMware VCF</text>
<text x="90" y="156" text-anchor="middle" font-size="10" font-family="Arial" fill="#FFFFFF" font-weight="bold">On-Premises</text>
<text x="90" y="178" text-anchor="middle" font-size="18" font-family="Arial" fill="#FFFFFF">?</text>
