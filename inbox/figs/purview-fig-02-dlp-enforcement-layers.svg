<svg viewBox="0 0 1040 400" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="400" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#999"/></marker><marker id="arww" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#fff"/></marker></defs><text x="520" y="26" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">DLP Enforcement Layers</text><text x="520" y="44" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">Three independent enforcement surfaces — each catches what the others cannot</text><rect x="40" y="300" width="960" height="85" rx="6" fill="#1F3864"/><text x="520" y="320" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Layer 3 — CASB / Network Boundary</text><text x="80" y="338" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">• Reads Purview sensitivity label metadata</text><text x="80" y="358" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">• Enforces at network egress (from Part 2 SASE)</text><text x="540" y="338" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">• Blocks upload to non-approved cloud storage</text><text x="540" y="358" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">• GCC vs. commercial M365 enforcement</text><rect x="40" y="210" width="960" height="85" rx="6" fill="#2E75B6"/><text x="520" y="230" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Layer 2 — Endpoint DLP</text><text x="80" y="248" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">• Windows 10/11 via Defender for Endpoint</text><text x="80" y="268" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">• Blocks copy/paste of CUI to USB or personal apps</text><text x="540" y="248" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">• Print restriction for CUI-Specified</text><text x="540" y="268" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">• Audit trail of endpoint data actions</text><rect x="40" y="120" width="960" height="85" rx="6" fill="#C55A11"/><text x="520" y="140" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Layer 1 — Microsoft 365 Services</text><text x="80" y="158" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">• SharePoint · OneDrive · Exchange · Teams</text><text x="80" y="178" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">• Auto-labeling scans existing content</text><text x="540" y="158" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">• Blocks external sharing of labeled content</text><text x="540" y="178" text-anchor="start" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">• Purview Audit Premium logs every access</text><line x1="520" y1="386" x2="520" y2="386" stroke="#DDDDDD" stroke-width="0"/><text x="520" y="386" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">Satisfies: AC-4 Information Flow Enforcement (data layer) · MP-4 Media Storage · MP-5 Media Transport</text></svg>
