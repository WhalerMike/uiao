<svg width="900" height="480" viewBox="0 0 900 480"
     xmlns="http://www.w3.org/2000/svg" style="background:#FFFFFF;font-family:Arial,sans-serif">

  <rect width="900" height="480" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="48" fill="#1F3864"/>
  <text x="450" y="31" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="bold">Act 3 &#x2014; The Breaking Point: Same Employee, Four Different Records</text>

  <!-- Q1: VMware On-Prem AD -->
  <rect x="20" y="60" width="395" height="170" rx="8" fill="#F2F2F2" stroke="#1F3864" stroke-width="2"/>
  <rect x="20" y="60" width="395" height="32" rx="8" fill="#1F3864"/>
  <rect x="20" y="84" width="395" height="8" fill="#1F3864"/>
  <text x="217" y="81" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">VMware On-Prem Active Directory</text>
  <text x="35" y="115" fill="#1F3864" font-size="11" font-weight="bold">Name:</text>
  <text x="110" y="115" fill="#1F3864" font-size="11">Jane Smith</text>
  <text x="35" y="135" fill="#1F3864" font-size="11" font-weight="bold">Status:</text>
  <text x="110" y="135" fill="#375623" font-size="11">Active</text>
  <text x="35" y="155" fill="#1F3864" font-size="11" font-weight="bold">Dept:</text>
  <text x="110" y="155" fill="#1F3864" font-size="11">HR-Region-7</text>
  <text x="35" y="175" fill="#1F3864" font-size="11" font-weight="bold">Last Logon:</text>
  <text x="110" y="175" fill="#C55A11" font-size="11">3 days ago</text>
  <text x="35" y="200" fill="#1F3864" font-size="11" font-weight="bold">Employee ID:</text>
  <text x="120" y="200" fill="#1F3864" font-size="11">00421</text>
  <text x="35" y="220" fill="#1F3864" font-size="11" font-weight="bold">UPN:</text>
  <text x="110" y="220" fill="#1F3864" font-size="11">jsmith@agency.gov</text>

  <!-- Q2: Azure M365 GCC -->
  <rect x="485" y="60" width="395" height="170" rx="8" fill="#F2F2F2" stroke="#2E75B6" stroke-width="2"/>
  <rect x="485" y="60" width="395" height="32" rx="8" fill="#2E75B6"/>
  <rect x="485" y="84" width="395" height="8" fill="#2E75B6"/>
  <text x="682" y="81" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">Azure M365 GCC (Entra ID)</text>
  <text x="500" y="115" fill="#1F3864" font-size="11" font-weight="bold">Name:</text>
  <text x="575" y="115" fill="#1F3864" font-size="11">Jane E. Smith</text>
  <text x="500" y="135" fill="#1F3864" font-size="11" font-weight="bold">Status:</text>
  <text x="575" y="135" fill="#375623" font-size="11">Active</text>
  <text x="500" y="155" fill="#1F3864" font-size="11" font-weight="bold">Dept:</text>
  <text x="575" y="155" fill="#1F3864" font-size="11">HR</text>
  <text x="500" y="175" fill="#1F3864" font-size="11" font-weight="bold">Last Login:</text>
  <text x="575" y="175" fill="#375623" font-size="11">Today</text>
  <text x="500" y="200" fill="#1F3864" font-size="11" font-weight="bold">Employee ID:</text>
  <text x="585" y="200" fill="#1F3864" font-size="11">00421</text>
  <text x="500" y="220" fill="#1F3864" font-size="11" font-weight="bold">UPN:</text>
  <text x="575" y="220" fill="#1F3864" font-size="11">Jane.E.Smith@agency.gov</text>

  <!-- Q3: AWS GovCloud -->
  <rect x="20" y="255" width="395" height="170" rx="8" fill="#F2F2F2" stroke="#C55A11" stroke-width="2"/>
  <rect x="20" y="255" width="395" height="32" rx="8" fill="#C55A11"/>
  <rect x="20" y="279" width="395" height="8" fill="#C55A11"/>
  <text x="217" y="276" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">AWS GovCloud (IAM)</text>
  <text x="35" y="310" fill="#1F3864" font-size="11" font-weight="bold">User:</text>
  <text x="110" y="310" fill="#1F3864" font-size="11">jsmith</text>
  <text x="35" y="330" fill="#1F3864" font-size="11" font-weight="bold">Status:</text>
  <text x="110" y="330" fill="#C00000" font-size="11" font-weight="bold">DISABLED</text>
  <text x="35" y="350" fill="#1F3864" font-size="11" font-weight="bold">Role:</text>
  <text x="110" y="350" fill="#1F3864" font-size="11">hr_analyst</text>
  <text x="35" y="370" fill="#1F3864" font-size="11" font-weight="bold">Employee ID:</text>
  <text x="120" y="370" fill="#C00000" font-size="11" font-weight="bold">(not mapped)</text>
  <text x="35" y="395" fill="#C00000" font-size="10" font-style="italic">Status differs from all other systems!</text>

  <!-- Q4: Oracle OCI -->
  <rect x="485" y="255" width="395" height="170" rx="8" fill="#F2F2F2" stroke="#375623" stroke-width="2"/>
  <rect x="485" y="255" width="395" height="32" rx="8" fill="#375623"/>
  <rect x="485" y="279" width="395" height="8" fill="#375623"/>
  <text x="682" y="276" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">Oracle OCI &#x2014; OPM Benefits</text>
  <text x="500" y="310" fill="#1F3864" font-size="11" font-weight="bold">Name:</text>
  <text x="575" y="310" fill="#1F3864" font-size="11">Jane Smith</text>
  <text x="500" y="330" fill="#1F3864" font-size="11" font-weight="bold">SSN-ref:</text>
  <text x="575" y="330" fill="#1F3864" font-size="11">XXX-XX-0421</text>
  <text x="500" y="350" fill="#1F3864" font-size="11" font-weight="bold">Benefits:</text>
  <text x="575" y="350" fill="#375623" font-size="11">Active</text>
  <text x="500" y="370" fill="#1F3864" font-size="11" font-weight="bold">Dept code:</text>
  <text x="585" y="370" fill="#C00000" font-size="11">HR-007 (stale)</text>
  <text x="500" y="395" fill="#C00000" font-size="10" font-style="italic">Dept code does not match any active record</text>

  <!-- Center question mark -->
  <circle cx="450" cy="195" r="30" fill="#C00000" opacity="0.9"/>
  <text x="450" y="205" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="bold">?</text>
  <!-- Arrows from each quadrant to center -->
  <line x1="415" y1="155" x2="425" y2="185" stroke="#C00000" stroke-width="1.5"/>
  <line x1="485" y1="155" x2="473" y2="185" stroke="#C00000" stroke-width="1.5"/>
  <line x1="415" y1="295" x2="425" y2="215" stroke="#C00000" stroke-width="1.5"/>
  <line x1="485" y1="295" x2="473" y2="215" stroke="#C00000" stroke-width="1.5"/>
  <text x="450" y="168" text-anchor="middle" fill="#C00000" font-size="9" font-weight="bold">Which is</text>
  <text x="450" y="178" text-anchor="middle" fill="#C00000" font-size="9" font-weight="bold">authoritative?</text>

  <!-- Bottom callout -->
  <rect x="20" y="438" width="860" height="36" rx="6" fill="#1F3864"/>
  <text x="450" y="456" text-anchor="middle" fill="#FFFFFF" font-size="11">Duplicate payments. Benefit calculations against stale data. No reconciliation possible without SSOT.</text>

</svg>
