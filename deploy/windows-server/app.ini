; =============================================================================
; UIAO Gitea Configuration — app.ini  (canonical deployment artifact)
; Platform: Windows Server 2025 behind IIS Reverse Proxy
; Classification: Controlled | Boundary: GCC-Moderate
; Repository: https://github.com/WhalerMike/uiao
;
; Control mappings (NIST 800-53):
;   SC-13  FIPS-validated cryptography  -> [security] PASSWORD_HASH_ALGO +
;          FIPS-build / host-FIPS note below
;   AC-12  Session termination          -> [session] SESSION_LIFE_TIME,
;          [security] LOGIN_REMEMBER_DAYS = 0
;   AC-7   Unsuccessful logon attempts  -> [service] handled via Entra/AD
;   IA-5   Authenticator management      -> [security] password policy
;
; FIPS 140-3 NOTE (important, honest scoping):
;   app.ini cannot make non-FIPS crypto compliant on its own. FIPS 140-3
;   validated operation requires (1) a FIPS build of Gitea — Go built with
;   GOFIPS140 / a validated module — and (2) the host OS running in FIPS
;   mode (Windows "System cryptography: Use FIPS compliant algorithms",
;   applied by the host STIG/CIS baseline). With those in place, the
;   PASSWORD_HASH_ALGO below (PBKDF2, SP 800-132) and TLS via the OS
;   Schannel layer operate within the validated boundary. This file selects
;   the FIPS-approved options; the build and host mode are prerequisites.
; =============================================================================

; --- Application ---
APP_NAME = UIAO Governance OS
RUN_MODE = prod
RUN_USER = DOMAIN\svc-gitea

[server]
; Gitea listens on localhost only — IIS reverse proxy handles external HTTPS
PROTOCOL            = http
HTTP_ADDR           = 127.0.0.1
HTTP_PORT           = 3000
DOMAIN              = git.uiao.local
ROOT_URL            = https://git.uiao.local/
LOCAL_ROOT_URL      = http://localhost:3000/
DISABLE_SSH         = false
SSH_DOMAIN          = git.uiao.local
SSH_PORT            = 22
SSH_LISTEN_PORT     = 22
LFS_START_SERVER    = true
LFS_JWT_SECRET      = ; GENERATE: gitea generate secret JWT_SECRET
OFFLINE_MODE        = true
; Large push support (512 MB)
LFS_MAX_FILE_SIZE   = 536870912

[database]
; SQLite for lab/small deployment — PostgreSQL for production
DB_TYPE  = sqlite3
PATH     = D:/Gitea/data/gitea.db
LOG_SQL  = false
; --- Production PostgreSQL ---
; DB_TYPE  = postgres
; HOST     = localhost:5432
; NAME     = gitea
; USER     = gitea
; PASSWD   = USE_MANAGED_PASSWORD
; SSL_MODE = require

[repository]
ROOT                = D:/GitRepos
DEFAULT_BRANCH      = main
DEFAULT_PRIVATE     = private
FORCE_PRIVATE       = false
MAX_CREATION_LIMIT  = -1
PREFERRED_LICENSES  = Apache-2.0

[repository.upload]
; Support large governance artifacts
MAX_FILE_SIZE  = 52428800
MAX_FILES      = 10

[indexer]
ISSUE_INDEXER_TYPE   = bleve
ISSUE_INDEXER_PATH   = D:/Gitea/data/indexers/issues.bleve
REPO_INDEXER_ENABLED = true
REPO_INDEXER_PATH    = D:/Gitea/data/indexers/repos.bleve
REPO_INDEXER_INCLUDE =
REPO_INDEXER_EXCLUDE = resources/bin/**

[security]
INSTALL_LOCK                  = true
SECRET_KEY                    = ; GENERATE: gitea generate secret SECRET_KEY
INTERNAL_TOKEN                = ; GENERATE: gitea generate secret INTERNAL_TOKEN
MIN_PASSWORD_LENGTH           = 14
PASSWORD_COMPLEXITY           = lower,upper,digit,spec
PASSWORD_CHECK_PWN            = true
; FIPS-approved key-derivation for stored authenticators (SP 800-132).
; Requires a FIPS build + host FIPS mode (see header note) to be validated.
PASSWORD_HASH_ALGO            = pbkdf2
IMPORT_LOCAL_PATHS            = false
DISABLE_GIT_HOOKS             = false
; Disable user self-registration — all users via AD/Entra
DISABLE_REGISTRATION          = true
; AC-12: disable long-lived "remember me" cookies so sessions are bounded
; by SESSION_LIFE_TIME rather than persisting across browser restarts.
LOGIN_REMEMBER_DAYS           = 0

[service]
DISABLE_REGISTRATION              = true
REQUIRE_SIGNIN_VIEW               = true
ENABLE_NOTIFY_MAIL                = false
DEFAULT_ALLOW_CREATE_ORGANIZATION = false
DEFAULT_ORG_VISIBILITY            = private
DEFAULT_ORG_MEMBER_VISIBLE        = true
SHOW_REGISTRATION_BUTTON          = false
AUTO_WATCH_NEW_REPOS              = true
AUTO_WATCH_ON_CHANGES             = true

[session]
PROVIDER          = file
PROVIDER_CONFIG   = D:/Gitea/data/sessions
COOKIE_SECURE     = true
COOKIE_NAME       = uiao_gitea_session
GC_INTERVAL_TIME  = 86400
; AC-12: absolute session lifetime, 8 hours (28800s). Re-authentication is
; required after expiry; combined with LOGIN_REMEMBER_DAYS = 0 above.
SESSION_LIFE_TIME = 28800

[log]
ROOT_PATH = D:/Gitea/log
MODE      = file
LEVEL     = info
; Governance audit log — captures all operations
[log.file]
LOG_ROTATE   = true
MAX_DAYS     = 90
DAILY_ROTATE = true

[mailer]
ENABLED = false
; Configure when SMTP is available:
; ENABLED        = true
; SMTP_ADDR      = smtp.office365.com
; SMTP_PORT      = 587
; IS_TLS_ENABLED = true
; FROM           = gitea@uiao.local
; USER           = gitea@uiao.local
; PASSWD         = USE_MANAGED_PASSWORD

[cache]
ADAPTER  = memory
INTERVAL = 60
HOST     =

[picture]
AVATAR_UPLOAD_PATH            = D:/Gitea/data/avatars
REPOSITORY_AVATAR_UPLOAD_PATH = D:/Gitea/data/repo-avatars
DISABLE_GRAVATAR              = true
ENABLE_FEDERATED_AVATAR       = false

[attachment]
ENABLED   = true
PATH      = D:/Gitea/data/attachments
MAX_SIZE  = 50
MAX_FILES = 5

[time]
DEFAULT_UI_LOCATION = America/New_York

[webhook]
ALLOWED_HOST_LIST = *
DELIVER_TIMEOUT   = 30
; Never skip TLS verification on outbound webhooks (SC-8).
SKIP_TLS_VERIFY   = false

[api]
ENABLE_SWAGGER     = true
MAX_RESPONSE_ITEMS = 50
DEFAULT_PAGING_NUM = 30

[oauth2]
ENABLE     = true
JWT_SECRET = ; GENERATE: gitea generate secret JWT_SECRET

[openid]
ENABLE_OPENID_SIGNIN = false
ENABLE_OPENID_SIGNUP = true
WHITELISTED_URIS     = login.microsoftonline.com

[metrics]
ENABLED = false
; Enable for Prometheus monitoring:
; ENABLED = true
; TOKEN   = USE_SECURE_TOKEN

[markup.restructuredtext]
ENABLED = false

[other]
SHOW_FOOTER_BRANDING = false
SHOW_FOOTER_VERSION  = false
