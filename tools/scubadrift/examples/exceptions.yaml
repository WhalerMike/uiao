    justification: >-
      Two break-glass accounts are exempt from phishing-resistant MFA per the
      ISSO-approved emergency-access procedure. Compensating control: hardware
      FIDO2 keys stored in a sealed safe with a check-out log.
    approved_by: jane.isso@agency.gov
    approved_date: 2026-05-01
    expiry_date: 2026-12-31
    ticket: POAM-1042

  - policy_id: MS.AAD.5.4v1
    justification: Legacy password-expiration GPO pending retirement in the AD-to-Entra migration.
    approved_by: jane.isso@agency.gov
    approved_date: 2025-10-01
