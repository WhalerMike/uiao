# ScubaDrift risk-acceptance register (YAML form).
#
# Requires `pip install scubadrift[yaml]`. The JSON form
# (tests/fixtures/exceptions.json) is equivalent and needs no extra deps.
#
# Each acceptance documents a KNOWN, APPROVED, TIME-BOXED failure. ScubaDrift
# suppresses these from the actionable list while they are in date, flags them
# the day they lapse, and flags them as "retirable" once the policy passes.
acceptances:
