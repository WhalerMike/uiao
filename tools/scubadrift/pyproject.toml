[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scubadrift"
version = "0.1.0"
description = "Drift, exception-lifecycle, and conmon gating on top of CISA ScubaGear output."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["scubagear", "cisa", "scuba", "m365", "fedramp", "conmon", "drift", "compliance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
scubadrift = "scubadrift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
