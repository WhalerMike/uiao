<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="640" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#0D1B2E">The disposition gate</text>
<line x1="120" y1="78" x2="1160" y2="78" stroke="#1E8C8C" stroke-width="2"/>
<text x="640" y="102" text-anchor="middle" font-size="18" fill="#6B7A8D">Every failing policy resolves to exactly one of three dispositions</text>
<rect x="515" y="128" width="250" height="78" rx="10" fill="#0D1B2E" stroke="#0D1B2E" stroke-width="2"/>
<text x="640" y="161" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">Failing policy</text>
<text x="640" y="186" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">(Result = Fail)</text>
<rect x="505" y="250" width="270" height="74" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="640" y="292" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E">Risk-acceptance on file?</text>
<line x1="640" y1="206" x2="640" y2="239" stroke="#0D1B2E" stroke-width="2.5"/>
<polygon points="633,238 640,250 647,238" fill="#0D1B2E"/>
<line x1="505" y1="287" x2="289" y2="287" stroke="#C0392B" stroke-width="2.5"/>
<polygon points="288,280 300,287 288,294" fill="#C0392B"/>
<text x="400" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">no</text>
<rect x="40" y="250" width="260" height="90" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
<text x="170" y="288" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E">ACTIONABLE_NEW_DRIFT</text>
<text x="170" y="313" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#0D1B2E">no acceptance — act now</text>
<line x1="640" y1="324" x2="640" y2="389" stroke="#0D1B2E" stroke-width="2.5"/>
<polygon points="633,388 640,400 647,388" fill="#0D1B2E"/>
<text x="650" y="362" font-size="13" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0D1B2E">  yes</text>
<rect x="505" y="400" width="270" height="74" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="640" y="442" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E">expiry_date &lt; as_of ?</text>
<line x1="505" y1="437" x2="289" y2="437" stroke="#D4A017" stroke-width="2.5"/>
<polygon points="288,430 300,437 288,444" fill="#D4A017"/>
<text x="400" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">yes</text>
<rect x="40" y="400" width="260" height="90" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
<text x="170" y="438" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E">LAPSED_ACCEPTANCE</text>
<text x="170" y="463" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#0D1B2E">expired — re-review / act</text>
<line x1="775" y1="437" x2="969" y2="437" stroke="#1E8C8C" stroke-width="2.5"/>
<polygon points="968,430 980,437 968,444" fill="#1E8C8C"/>
<text x="880" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">no</text>
<rect x="980" y="400" width="260" height="90" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="1110" y="438" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E">GOVERNED_EXCEPTION</text>
<text x="1110" y="463" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#0D1B2E">in date — already governed</text>
<text x="640" y="560" text-anchor="middle" font-size="15" fill="#33414F">Left column is actionable (gate fails). Right box is governed (gate stays green).</text>
<text x="640" y="586" text-anchor="middle" font-size="14" fill="#6B7A8D">Only Fail counts by default; --include-warnings widens the set to Warning.</text>
<text x="640" y="694" text-anchor="middle" font-size="17" fill="#6B7A8D">Figure 2 — The core decision: is this failure already governed, or must I act?</text>
</svg>
