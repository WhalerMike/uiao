<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="640" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#0D1B2E">Risk-acceptance lifecycle</text>
<line x1="120" y1="78" x2="1160" y2="78" stroke="#1E8C8C" stroke-width="2"/>
<text x="640" y="102" text-anchor="middle" font-size="18" fill="#6B7A8D">Expiry is deterministic: in date through the expiry day, lapsed the next</text>
<line x1="120" y1="300" x2="1160" y2="300" stroke="#0D1B2E" stroke-width="3"/>
<polygon points="1160,292 1176,300 1160,308" fill="#0D1B2E"/>
<text x="1176" y="340" text-anchor="end" font-size="14" fill="#6B7A8D">time (as_of)</text>
<rect x="330" y="256" width="470" height="44" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="565" y="284" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">GOVERNED_EXCEPTION</text>
<rect x="800" y="256" width="330" height="44" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
<text x="965" y="284" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">LAPSED_ACCEPTANCE</text>
<circle cx="330" cy="300" r="9" fill="#0D1B2E"/>
<line x1="330" y1="300" x2="330" y2="334" stroke="#5A5A5A" stroke-width="1.5"/>
<text x="330" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">approved_date</text>
<text x="330" y="378" text-anchor="middle" font-size="14" fill="#6B7A8D">acceptance filed</text>
<circle cx="800" cy="300" r="9" fill="#0D1B2E"/>
<line x1="800" y1="300" x2="800" y2="334" stroke="#5A5A5A" stroke-width="1.5"/>
<text x="800" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">expiry_date</text>
<text x="800" y="378" text-anchor="middle" font-size="14" fill="#6B7A8D">in date through here</text>
<rect x="330" y="470" width="470" height="96" rx="10" fill="#EAF1FB" stroke="#2E75B6" stroke-width="2"/>
<text x="565" y="499" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E">policy now passes  ->  RETIRABLE</text>
<text x="565" y="524" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#0D1B2E">the acceptance is dead weight;</text>
<text x="565" y="547" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#0D1B2E">prune it from the register</text>
<line x1="565" y1="256" x2="565" y2="459" stroke="#2E75B6" stroke-width="2.5"/>
<polygon points="558,458 565,470 572,458" fill="#2E75B6"/>
<text x="640" y="150" text-anchor="middle" font-size="15" fill="#33414F">is_expired(as_of) = as_of &gt; expiry_date</text>
<text x="640" y="694" text-anchor="middle" font-size="17" fill="#6B7A8D">Figure 4 — An acceptance is a time-boxed decision; ScubaDrift flags it the day it lapses.</text>
</svg>
