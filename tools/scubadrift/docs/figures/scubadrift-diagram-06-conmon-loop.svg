<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="640" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#0D1B2E">The continuous-monitoring loop</text>
<line x1="120" y1="78" x2="1160" y2="78" stroke="#1E8C8C" stroke-width="2"/>
<text x="640" y="102" text-anchor="middle" font-size="18" fill="#6B7A8D">Assess -> record -> report -> act, on a defined cadence</text>
<rect x="40" y="200" width="250" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="165" y="242" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E">1. Assess</text>
<text x="165" y="267" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#0D1B2E">ScubaGear</text>
<text x="165" y="290" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#0D1B2E">point-in-time</text>
<rect x="350" y="200" width="270" height="120" rx="10" fill="#0D1B2E" stroke="#0D1B2E" stroke-width="2"/>
<text x="485" y="242" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">2. Record</text>
<text x="485" y="267" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">conmon-record</text>
<text x="485" y="290" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">append to ledger</text>
<rect x="680" y="200" width="270" height="120" rx="10" fill="#0D1B2E" stroke="#0D1B2E" stroke-width="2"/>
<text x="815" y="242" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">3. Report</text>
<text x="815" y="267" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">conmon-report</text>
<text x="815" y="290" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">trend + SLA aging</text>
<rect x="1010" y="200" width="230" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="1125" y="242" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E">4. Act</text>
<text x="1125" y="267" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#0D1B2E">remediate /</text>
<text x="1125" y="290" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#0D1B2E">renew acceptance</text>
<line x1="290" y1="260" x2="339" y2="260" stroke="#1E8C8C" stroke-width="2.5"/>
<polygon points="338,253 350,260 338,267" fill="#1E8C8C"/>
<line x1="620" y1="260" x2="669" y2="260" stroke="#1E8C8C" stroke-width="2.5"/>
<polygon points="668,253 680,260 668,267" fill="#1E8C8C"/>
<line x1="950" y1="260" x2="999" y2="260" stroke="#1E8C8C" stroke-width="2.5"/>
<polygon points="998,253 1010,260 998,267" fill="#1E8C8C"/>
<rect x="485" y="385" width="330" height="70" rx="8" fill="#EAF1FB" stroke="#2E75B6" stroke-width="2"/>
<text x="650" y="424" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E">conmon-ledger.jsonl  (history)</text>
<line x1="485" y1="320" x2="485" y2="374" stroke="#2E75B6" stroke-width="2.5"/>
<polygon points="478,373 485,385 492,373" fill="#2E75B6"/>
<line x1="815" y1="420" x2="815" y2="360" stroke="#2E75B6" stroke-width="2.5"/>
<polygon points="808,372 815,360 822,372" fill="#2E75B6"/>
<text x="470" y="360" text-anchor="end" font-size="13" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#5A5A5A">write</text>
<text x="835" y="400" font-size="13" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#5A5A5A">read</text>
<line x1="1125" y1="320" x2="1125" y2="520" stroke="#0D1B2E" stroke-width="2.5"/>
<line x1="1125" y1="520" x2="165" y2="520" stroke="#0D1B2E" stroke-width="2.5"/>
<line x1="165" y1="520" x2="165" y2="320" stroke="#0D1B2E" stroke-width="2.5"/>
<polygon points="158,332 165,320 172,332" fill="#0D1B2E"/>
<text x="645" y="512" text-anchor="middle" font-size="15" fill="#33414F">repeat on the monitoring cadence (e.g. monthly); --fail-on-breach gates on overdue findings</text>
<rect x="120" y="590" width="1040" height="52" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="640" y="622" text-anchor="middle" font-size="16" fill="#0D1B2E">supports  CISA BOD 25-01  -  NIST SP 800-137 (ISCM)  -  NIST 800-53 CA-7  -  FedRAMP ConMon (30 / 90 / 180)</text>
<text x="640" y="694" text-anchor="middle" font-size="17" fill="#6B7A8D">Figure 6 — ScubaDrift closes the loop ScubaGear opens: assessment becomes ongoing monitoring.</text>
</svg>
