<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect width="1280" height="720" fill="#FFFFFF"/>
<defs><linearGradient id="dusk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D7F2EE"/><stop offset="0.55" stop-color="#EAF1FB"/><stop offset="1" stop-color="#F3E3C6"/></linearGradient></defs>
<text x="640" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#0D1B2E">The expiry horizon</text>
<text x="640" y="92" text-anchor="middle" font-size="19" fill="#6B7A8D">An acceptance is a time-boxed decision — in date, then lapsed</text>
<rect x="120" y="150" width="1040" height="330" rx="8" fill="url(#dusk)"/>
<line x1="120" y1="480" x2="1160" y2="480" stroke="#0D1B2E" stroke-width="3"/>
<text x="440" y="230" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E8C8C">GOVERNED_EXCEPTION</text>
<text x="440" y="258" text-anchor="middle" font-size="15" fill="#33414F">in date  -  suppressed from the action list</text>
<text x="960" y="230" text-anchor="middle" font-size="20" font-weight="bold" fill="#D4A017">LAPSED_ACCEPTANCE</text>
<text x="960" y="258" text-anchor="middle" font-size="15" fill="#33414F">past expiry  -  back on the action list</text>
<circle cx="760" cy="480" r="52" fill="#D4A017" fill-opacity="0.85"/>
<line x1="760" y1="150" x2="760" y2="520" stroke="#0D1B2E" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="760" y="545" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">expiry_date</text>
<text x="760" y="568" text-anchor="middle" font-size="14" fill="#6B7A8D">in date through this day; lapses the next</text>
<text x="640" y="612" text-anchor="middle" font-size="15" fill="#2E75B6">and when the policy passes again, the acceptance becomes retirable.</text>
<text x="640" y="694" text-anchor="middle" font-size="17" fill="#6B7A8D">Because expiry is deterministic, you can gate a future date and renew before the sun sets.</text>
</svg>
