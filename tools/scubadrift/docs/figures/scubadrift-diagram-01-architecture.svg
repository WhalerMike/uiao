<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="640" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#0D1B2E">ScubaDrift architecture</text>
<line x1="120" y1="78" x2="1160" y2="78" stroke="#1E8C8C" stroke-width="2"/>
<text x="640" y="102" text-anchor="middle" font-size="18" fill="#6B7A8D">Stand on ScubaGear — one parser, a triage core, an independent diff, a thin gate</text>
<rect x="40" y="150" width="250" height="96" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="165" y="191" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E">ScubaGear results</text>
<text x="165" y="217" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#0D1B2E">ScubaResults.json</text>
<rect x="40" y="330" width="250" height="96" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="165" y="371" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E">Risk-acceptance</text>
<text x="165" y="397" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#0D1B2E">register (JSON / YAML)</text>
<rect x="360" y="190" width="230" height="210" rx="10" fill="#0D1B2E" stroke="#0D1B2E" stroke-width="2"/>
<text x="475" y="243" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">parser</text>
<text x="475" y="268" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">load_run()</text>
<text x="475" y="291" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">load_exceptions()</text>
<text x="475" y="314" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF"></text>
<text x="475" y="337" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">the only module</text>
<text x="475" y="360" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">that touches disk</text>
<line x1="290" y1="198" x2="349" y2="198" stroke="#0D1B2E" stroke-width="2.5"/>
<polygon points="348,191 360,198 348,205" fill="#0D1B2E"/>
<line x1="290" y1="378" x2="349" y2="378" stroke="#0D1B2E" stroke-width="2.5"/>
<polygon points="348,371 360,378 348,385" fill="#0D1B2E"/>
<rect x="680" y="150" width="250" height="120" rx="10" fill="#0D1B2E" stroke="#0D1B2E" stroke-width="2"/>
<text x="805" y="192" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">triage.triage</text>
<text x="805" y="217" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">-> TriageReport</text>
<text x="805" y="240" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">new / lapsed / governed</text>
<rect x="680" y="330" width="250" height="120" rx="10" fill="#0D1B2E" stroke="#0D1B2E" stroke-width="2"/>
<text x="805" y="372" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">drift.diff_runs</text>
<text x="805" y="397" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">-> DriftReport</text>
<text x="805" y="420" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">compare two runs</text>
<line x1="590" y1="250" x2="669" y2="250" stroke="#1E8C8C" stroke-width="2.5"/>
<polygon points="668,243 680,250 668,257" fill="#1E8C8C"/>
<text x="635" y="240" text-anchor="middle" font-size="13" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#5A5A5A">ScubaRun</text>
<line x1="590" y1="350" x2="669" y2="350" stroke="#1E8C8C" stroke-width="2.5"/>
<polygon points="668,343 680,350 668,357" fill="#1E8C8C"/>
<text x="635" y="340" text-anchor="middle" font-size="13" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#5A5A5A">Acceptance[]</text>
<rect x="990" y="150" width="250" height="120" rx="10" fill="#0D1B2E" stroke="#0D1B2E" stroke-width="2"/>
<text x="1115" y="192" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">gate.evaluate_gate</text>
<text x="1115" y="217" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">-> GateResult</text>
<text x="1115" y="240" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">thin wrapper on triage</text>
<line x1="930" y1="210" x2="979" y2="210" stroke="#1E8C8C" stroke-width="2.5"/>
<polygon points="978,203 990,210 978,217" fill="#1E8C8C"/>
<rect x="990" y="330" width="118" height="90" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="1049" y="368" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E">exit 0</text>
<text x="1049" y="393" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#0D1B2E">PASS</text>
<rect x="1122" y="330" width="118" height="90" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
<text x="1181" y="368" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E">exit 1</text>
<text x="1181" y="393" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#0D1B2E">ACT</text>
<line x1="1049" y1="270" x2="1049" y2="319" stroke="#1E8C8C" stroke-width="2.5"/>
<polygon points="1042,318 1049,330 1056,318" fill="#1E8C8C"/>
<line x1="1181" y1="270" x2="1181" y2="319" stroke="#C0392B" stroke-width="2.5"/>
<polygon points="1174,318 1181,330 1188,318" fill="#C0392B"/>
<text x="165" y="470" text-anchor="middle" font-size="14" fill="#6B7A8D">assessment (needs tenant creds)</text>
<text x="165" y="490" text-anchor="middle" font-size="14" fill="#6B7A8D">stays in ScubaGear</text>
<text x="640" y="694" text-anchor="middle" font-size="17" fill="#6B7A8D">Figure 1 — Files in, a governed decision out. ScubaDrift never touches the tenant.</text>
</svg>
