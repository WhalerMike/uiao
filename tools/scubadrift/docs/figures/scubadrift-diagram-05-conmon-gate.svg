<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="640" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#0D1B2E">Gating a conmon pipeline</text>
<line x1="120" y1="78" x2="1160" y2="78" stroke="#1E8C8C" stroke-width="2"/>
<text x="640" y="102" text-anchor="middle" font-size="18" fill="#6B7A8D">The gate fails on new drift or a lapsed acceptance — governed keeps it green</text>
<rect x="40" y="250" width="220" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="150" y="292" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E">ScubaGear run</text>
<text x="150" y="317" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#0D1B2E">(scheduled)</text>
<text x="150" y="340" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#0D1B2E">needs tenant creds</text>
<rect x="320" y="250" width="210" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="425" y="303" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E">ScubaResults</text>
<text x="425" y="329" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#0D1B2E">.json artifact</text>
<line x1="260" y1="310" x2="309" y2="310" stroke="#1E8C8C" stroke-width="2.5"/>
<polygon points="308,303 320,310 308,317" fill="#1E8C8C"/>
<rect x="600" y="250" width="250" height="120" rx="10" fill="#0D1B2E" stroke="#0D1B2E" stroke-width="2"/>
<text x="725" y="304" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">scubadrift gate</text>
<text x="725" y="329" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF">triage + exit code</text>
<line x1="530" y1="310" x2="589" y2="310" stroke="#1E8C8C" stroke-width="2.5"/>
<polygon points="588,303 600,310 588,317" fill="#1E8C8C"/>
<text x="565" y="300" text-anchor="middle" font-size="13" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#5A5A5A">--results</text>
<rect x="600" y="430" width="250" height="74" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="725" y="471" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E">risk-acceptance register</text>
<line x1="725" y1="430" x2="725" y2="361" stroke="#1E8C8C" stroke-width="2.5"/>
<polygon points="718,360 725,372 732,360" fill="#1E8C8C"/>
<text x="760" y="415" font-size="13" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#5A5A5A">--exceptions</text>
<rect x="940" y="175" width="300" height="96" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="1090" y="216" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E">PASS — exit 0</text>
<text x="1090" y="242" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#0D1B2E">build stays green</text>
<rect x="940" y="350" width="300" height="96" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
<text x="1090" y="391" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E">FAIL — exit 1</text>
<text x="1090" y="417" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#0D1B2E">new drift or lapsed acceptance</text>
<line x1="850" y1="250" x2="929" y2="250" stroke="#1E8C8C" stroke-width="2.5"/>
<polygon points="928,243 940,250 928,257" fill="#1E8C8C"/>
<text x="895" y="240" text-anchor="middle" font-size="13" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#5A5A5A">clean</text>
<line x1="850" y1="360" x2="929" y2="360" stroke="#C0392B" stroke-width="2.5"/>
<polygon points="928,353 940,360 928,367" fill="#C0392B"/>
<text x="895" y="350" text-anchor="middle" font-size="13" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#5A5A5A">actionable</text>
<text x="640" y="580" text-anchor="middle" font-size="15" fill="#33414F">Governed, in-date exceptions never break the build; input errors exit 2.</text>
<text x="640" y="694" text-anchor="middle" font-size="17" fill="#6B7A8D">Figure 5 — Assessment and gating are separate jobs; the gate is credential-free and runs anywhere.</text>
</svg>
