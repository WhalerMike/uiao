[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ztttdrift"
version = "0.1.0"
description = "Drift, exception-lifecycle, and conmon gating on top of Zero Trust maturity-stage assessments (ZTTT / CISA ZTMM)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["zero-trust", "ztmm", "zttt", "cisa", "maturity", "conmon", "drift", "compliance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
ztttdrift = "ztttdrift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
