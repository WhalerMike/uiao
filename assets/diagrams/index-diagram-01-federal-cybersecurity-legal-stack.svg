<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif;background:#FFFFFF;">
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <text x="640" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#0D1B2E">The Federal Cybersecurity Legal Stack</text>
  <text x="640" y="72" text-anchor="middle" font-size="15" fill="#6B7A8D">Each layer authorizes the one below it — not a competing priority ranking</text>

  <!-- Track eyebrows -->
  <text x="50" y="96" font-size="12" font-weight="bold" letter-spacing="1" fill="#1E8C8C">TRACK 1 — BINDS THE AGENCY</text>
  <text x="760" y="204" font-size="12" font-weight="bold" letter-spacing="1" fill="#2E75B6">TRACK 2 — BINDS THE CLOUD PROVIDER</text>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7A8D"/>
    </marker>
  </defs>

  <!-- Left stack connectors (teal) -->
  <g stroke="#1E8C8C" stroke-width="3.5" fill="none">
    <line x1="380" y1="194" x2="380" y2="214" marker-end="url(#arrow-teal)"/>
    <line x1="380" y1="304" x2="380" y2="324" marker-end="url(#arrow-teal)"/>
    <line x1="380" y1="414" x2="380" y2="434" marker-end="url(#arrow-teal)"/>
    <line x1="380" y1="524" x2="380" y2="544" marker-end="url(#arrow-teal)"/>
  </g>

  <!-- Cross-track connectors (grey dashed) -->
  <g stroke="#6B7A8D" stroke-width="2" fill="none" stroke-dasharray="5,4">
    <line x1="710" y1="259" x2="760" y2="259" marker-end="url(#arrow-grey)"/>
    <line x1="990" y1="304" x2="990" y2="434" marker-end="url(#arrow-grey)"/>
  </g>

  <!-- Box 1: FISMA (statute) -->
  <rect x="50" y="104" width="660" height="90" rx="10" fill="#0D1B2E"/>
  <text x="100" y="136" font-size="19" font-weight="bold" fill="#FFFFFF">STATUTE — FISMA</text>
  <text x="100" y="158" font-size="14" fill="#EAF1FB">44 U.S.C. § 3551 et seq. — requires every federal agency to</text>
  <text x="100" y="176" font-size="14" fill="#EAF1FB">run a risk-based information security program.</text>
  <circle cx="80" cy="104" r="16" fill="#0D1B2E" stroke="#FFFFFF" stroke-width="2"/>
  <text x="80" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">1</text>

  <!-- Box 2: NIST (standards) -->
  <rect x="50" y="214" width="660" height="90" rx="10" fill="#0D1B2E"/>
  <text x="100" y="246" font-size="19" font-weight="bold" fill="#FFFFFF">STANDARDS — NIST</text>
  <text x="100" y="268" font-size="14" fill="#EAF1FB">SP 800-53 Rev 5 (controls) · SP 800-37 (RMF) — NIST is FISMA's</text>
  <text x="100" y="286" font-size="14" fill="#EAF1FB">statutory delegate for writing agency security standards.</text>
  <circle cx="80" cy="214" r="16" fill="#0D1B2E" stroke="#FFFFFF" stroke-width="2"/>
  <text x="80" y="219" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">2</text>

  <!-- Box 3: Executive policy -->
  <rect x="50" y="324" width="660" height="90" rx="10" fill="#0D1B2E"/>
  <text x="100" y="356" font-size="19" font-weight="bold" fill="#FFFFFF">EXECUTIVE POLICY</text>
  <text x="100" y="378" font-size="14" fill="#EAF1FB">EO 14028 → current EO 14306, plus OMB M-22-09 / M-24-15 /</text>
  <text x="100" y="396" font-size="14" fill="#EAF1FB">M-25-21 — presidential and OMB direction to agencies.</text>
  <circle cx="80" cy="324" r="16" fill="#0D1B2E" stroke="#FFFFFF" stroke-width="2"/>
  <text x="80" y="329" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">3</text>

  <!-- Box 4: CISA BODs (highlighted — hard deadlines) -->
  <rect x="50" y="434" width="660" height="90" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2.5"/>
  <text x="100" y="466" font-size="19" font-weight="bold" fill="#0D1B2E">BINDING DIRECTIVE — CISA BODs</text>
  <text x="100" y="488" font-size="14" fill="#33414F">Issued under 44 U.S.C. § 3553(b)(2), delegated to the CISA Director.</text>
  <text x="100" y="506" font-size="14" fill="#33414F">BOD 25-01, 22-01, 23-01, 26-04 — the only layer with hard dates.</text>
  <circle cx="80" cy="434" r="16" fill="#0D1B2E" stroke="#FFFFFF" stroke-width="2"/>
  <text x="80" y="439" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">4</text>

  <!-- Box 5: SCuBA baseline (narrowest scope) -->
  <rect x="50" y="544" width="660" height="90" rx="10" fill="#2E75B6"/>
  <text x="100" y="576" font-size="19" font-weight="bold" fill="#FFFFFF">TECHNICAL BASELINE — SCuBA</text>
  <text x="100" y="598" font-size="14" fill="#EAF1FB">Secure Configuration Baselines, assessed by ScubaGear (M365) /</text>
  <text x="100" y="616" font-size="14" fill="#EAF1FB">ScubaGoggles (Workspace) — named by BOD 25-01. Narrowest scope here.</text>
  <circle cx="80" cy="544" r="16" fill="#2E75B6" stroke="#FFFFFF" stroke-width="2"/>
  <text x="80" y="549" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">5</text>

  <!-- Box F1: FedRAMP Authorization Act -->
  <rect x="760" y="214" width="460" height="90" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="790" y="246" font-size="18" font-weight="bold" fill="#0D1B2E">STATUTE — FedRAMP Authorization Act</text>
  <text x="790" y="268" font-size="13.5" fill="#33414F">44 U.S.C. § 3607 (FY23 NDAA) — binds the CLOUD</text>
  <text x="790" y="286" font-size="13.5" fill="#33414F">PROVIDER; requires agencies to reuse authorizations.</text>

  <!-- Box F2: CSP authorization -->
  <rect x="760" y="434" width="460" height="90" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="790" y="466" font-size="18" font-weight="bold" fill="#0D1B2E">CSP AUTHORIZATION</text>
  <text x="790" y="488" font-size="13.5" fill="#33414F">FedRAMP Moderate/High ATO — reusable across</text>
  <text x="790" y="506" font-size="13.5" fill="#33414F">agencies via the reciprocity presumption.</text>

  <!-- Bottom callout -->
  <rect x="50" y="650" width="1180" height="60" rx="10" fill="#D7F2EE"/>
  <text x="80" y="674" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#0D1B2E">No single "most important" layer — SCuBA is the narrowest slice, not the top.</text>
  <text x="80" y="696" font-size="14" fill="#33414F">FISMA is the statute everything sits under. BOD 25-01/SCuBA is the most time-boxed near-term obligation, not superior in legal weight to the law it derives from.</text>
</svg>
