# NOTE: This file is managed by deployment scripts.
# The modernization sidebar and navbar entries are canonical.

project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!scratch/"
    - "!docs/architecture/"
    - "!docs/documents/"
    - "!docs/meta/"
    - "!docs/onboarding/"
    - "!docs/adapters/"
    - "!docs/ci/"
    - "!docs/patterns/"

# Project-wide Lua filters.
# `appendix-script-docx` shrinks code blocks inside `::: {.appendix-script}`
# divs to 7pt monospace in DOCX output only (the HTML site shrinks the same
# blocks via docs/styles.css). It is a no-op for every non-docx format and
# every code block outside an `.appendix-script` div.
# `adr-canon-links` rewrites the relative links inside the verbatim-included
# canon ADR body (HTML, ADR wrapper pages only) so they resolve on the
# published site instead of 404ing; non-rendered targets get GitHub-blob links.
# Both are no-ops outside their scope, so applying them project-wide is safe.
filters:
  - filters/appendix-script-docx.lua
  - filters/adr-canon-links.lua

website:
  title: "UIAO"
  favicon: _assets/uiao-favicon.png
  site-url: https://whalermike.github.io/uiao/

  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true

  page-footer:
    left: "UIAO is under active development (v0.6.1). Much of this site describes target architecture — the canon is authoritative, but many components are not yet implemented, integrated, or operationally tested at scale. Per-page adoption state is declared in frontmatter (`lifecycle:` + `tiers_adopted:`) and rendered as a banner at the top of each page by the `{{< lifecycle-banner >}}` Quarto shortcode — see ADR-082 for the lifecycle policy. The Substrate Status page tracks per-component adoption at finer granularity than the page-level lifecycle field."

