            - section: "UIAO OrgPath (16-document reading sequence)"
              contents:
                # Per-Book_NN structure (split from the former 15 flat
                # single-file books). Each Book_NN.qmd is a clickable
                # section landing whose chapters nest beneath it, so
                # Quarto's automatic prev/next (page-navigation: true)
