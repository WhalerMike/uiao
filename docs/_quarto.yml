format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    other-formats: [pdf, docx]
    fig-responsive: true
    fig-align: center
    fig-width: 8
    fig-height: 5
    fig-format: retina
    embed-resources: false
    link-external-newwindow: true
    link-external-icon: true

  docx:
    # Microsoft-Learn-style reference template:
    #   - Tables: 1.5pt MS-brand-blue (#0078D4) top + bottom borders, bold
    #     header row with 1pt blue underline, 0.5pt light-gray (#D1D5DA)
    #     separators between body rows, no vertical borders.
    #   - Code blocks (SourceCode style): Consolas 9pt on light-grey/blue
    #     (#F6F8FA) background, thin grey border (#D1D5DA, 0.75pt) wrapping
    #     the block, contextualSpacing so consecutive lines render as a
    #     single contiguous box.
    # First wired repo-wide in #607 (was sample-only on uiao-governance-os-
    # whitepaper.qmd via PR #500).
    reference-doc: assets/reference-mslearn.docx
    toc: true
    toc-depth: 3
    fig-width: 6
    fig-height: 4
    fig-align: center

mermaid:
  theme: neutral
