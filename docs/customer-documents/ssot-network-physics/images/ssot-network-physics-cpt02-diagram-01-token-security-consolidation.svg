<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093) · navy #0D1B2E · teal #1E8C8C · red #C0392B · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="66" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">Token-Based Security as the Consolidation Enabler</text>
  <text x="60" y="96" font-size="18" fill="#5A5A5A">Identity is the new boundary — the trust boundary travels with the request, not in the network</text>

  <!-- LEFT PANEL: Perimeter model -->
  <text x="230" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#C0392B">Perimeter Model</text>
  <!-- Firewall outline -->
  <rect x="50" y="150" width="360" height="320" rx="12" fill="#FFF4F4" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="230" y="178" text-anchor="middle" font-size="14" fill="#C0392B">Network perimeter (trust inside = ambient)</text>
  <!-- Store A -->
  <rect x="80" y="195" width="130" height="56" rx="8" fill="#EAF1FB" stroke="#C0392B" stroke-width="1.5"/>
  <text x="145" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Domain A Store</text>
  <text x="145" y="240" text-anchor="middle" font-size="12" fill="#5A5A5A">shared secret</text>
  <!-- Store B -->
  <rect x="240" y="195" width="130" height="56" rx="8" fill="#EAF1FB" stroke="#C0392B" stroke-width="1.5"/>
  <text x="305" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Domain B Store</text>
  <text x="305" y="240" text-anchor="middle" font-size="12" fill="#5A5A5A">shared secret</text>
  <!-- Fragment note -->
  <text x="230" y="282" text-anchor="middle" font-size="13" fill="#C0392B">Must fragment — separate stores</text>
  <text x="230" y="300" text-anchor="middle" font-size="13" fill="#C0392B">behind separate boundaries</text>
  <!-- One leaked credential -->
  <rect x="80" y="320" width="300" height="60" rx="8" fill="#FFF0F0" stroke="#C0392B" stroke-width="1.5"/>
  <text x="230" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">Stored DB credential = highest-value secret</text>
  <text x="230" y="362" text-anchor="middle" font-size="12" fill="#C0392B">Steal once → full store exposed</text>
  <!-- Caller -->
  <rect x="100" y="410" width="120" height="46" rx="6" fill="#0D1B2E"/>
  <text x="160" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Caller</text>
  <text x="160" y="448" text-anchor="middle" font-size="12" fill="#9BB8CC">inside perimeter</text>
  <line x1="160" y1="408" x2="145" y2="253" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>

  <!-- VS divider -->
  <line x1="440" y1="130" x2="440" y2="590" stroke="#6B7A8D" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="440" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#6B7A8D">VS</text>

  <!-- RIGHT PANEL: Token model -->
  <text x="860" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1E8C8C">Token / Zero-Trust Model</text>

  <!-- Central shared store -->
  <rect x="720" y="200" width="280" height="130" rx="12" fill="#0D1B2E"/>
  <text x="860" y="248" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">One Shared Store</text>
  <text x="860" y="271" text-anchor="middle" font-size="14" fill="#1E8C8C">Tenant A namespace</text>
  <text x="860" y="292" text-anchor="middle" font-size="14" fill="#1E8C8C">Tenant B namespace</text>
  <text x="860" y="313" text-anchor="middle" font-size="13" fill="#9BB8CC">isolated in code, not in network</text>

  <!-- Tenants on left -->
  <rect x="490" y="205" width="130" height="50" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="555" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Tenant A</text>
  <text x="555" y="247" text-anchor="middle" font-size="12" fill="#1E8C8C">Entra token</text>

  <rect x="490" y="285" width="130" height="50" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="555" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Tenant B</text>
  <text x="555" y="327" text-anchor="middle" font-size="12" fill="#1E8C8C">Entra token</text>

  <!-- Token arrows inbound -->
  <line x1="620" y1="230" x2="718" y2="248" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="620" y1="310" x2="718" y2="290" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>

  <!-- Token labels on arrows -->
  <text x="660" y="228" text-anchor="middle" font-size="11" fill="#1E8C8C">tid claim</text>
  <text x="660" y="318" text-anchor="middle" font-size="11" fill="#1E8C8C">tid claim</text>

  <!-- Outbound passwordless -->
  <rect x="720" y="390" width="280" height="80" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="2"/>
  <text x="860" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">PostgreSQL Flexible Server</text>
  <text x="860" y="443" text-anchor="middle" font-size="13" fill="#1E8C8C">Entra managed identity auth</text>
  <text x="860" y="461" text-anchor="middle" font-size="12" fill="#5A5A5A">no long-lived DB password exists</text>

  <!-- Arrow from store to DB -->
  <line x1="860" y1="330" x2="860" y2="388" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <!-- Token label -->
  <rect x="880" y="348" width="100" height="28" rx="4" fill="#1E8C8C"/>
  <text x="930" y="367" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">short-lived token</text>

  <!-- No credential note -->
  <rect x="720" y="490" width="280" height="56" rx="8" fill="#F0FFF4" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="860" y="515" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">Highest-value secret: eliminated</text>
  <text x="860" y="535" text-anchor="middle" font-size="12" fill="#5A5A5A">Token minted on demand · no durable credential</text>

  <!-- Bottom rule -->
  <text x="60" y="630" font-size="15" fill="#0D1B2E" font-weight="bold">Result:</text>
  <text x="130" y="630" font-size="15" fill="#5A5A5A">Security becomes a centralization enabler — identity per request removes the reason to fragment by perimeter.</text>
  <text x="60" y="655" font-size="15" fill="#5A5A5A">One shared store is safe because trust lives in a verifiable claim, not in a network location.</text>
</svg>
