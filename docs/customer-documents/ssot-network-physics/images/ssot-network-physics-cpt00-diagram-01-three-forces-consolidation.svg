<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093) · navy #0D1B2E · teal #1E8C8C · red #C0392B · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="72" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#0D1B2E">Three Forces — and the Wall That Does Not Move</text>
  <text x="60" y="104" font-size="20" fill="#5A5A5A">Consolidate the truth · Distribute the copies</text>

  <!-- Defs: arrows -->
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- Force 1: Fat WAN -->
  <rect x="60" y="150" width="310" height="110" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="215" y="193" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Fat, Application-Aware WAN</text>
  <text x="215" y="217" text-anchor="middle" font-size="15" fill="#5A5A5A">Removes the latency penalty</text>
  <text x="215" y="237" text-anchor="middle" font-size="15" fill="#5A5A5A">that forced data near compute</text>

  <!-- Force 2: Token Security -->
  <rect x="60" y="295" width="310" height="110" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="215" y="338" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Token-Based Security</text>
  <text x="215" y="362" text-anchor="middle" font-size="15" fill="#5A5A5A">One store serves many trust</text>
  <text x="215" y="382" text-anchor="middle" font-size="15" fill="#5A5A5A">domains — no sharding for security</text>

  <!-- Force 3: SSOT Discipline -->
  <rect x="60" y="440" width="310" height="110" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="215" y="483" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">SSOT Discipline</text>
  <text x="215" y="507" text-anchor="middle" font-size="15" fill="#5A5A5A">Fewer authoritative copies =</text>
  <text x="215" y="527" text-anchor="middle" font-size="15" fill="#5A5A5A">less drift, lower reasoning cost</text>

  <!-- Arrows from forces to Logical Centralization -->
  <line x1="370" y1="205" x2="530" y2="330" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>
  <line x1="370" y1="350" x2="530" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>
  <line x1="370" y1="495" x2="530" y2="390" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>

  <!-- Central: Logical Centralization -->
  <rect x="530" y="280" width="280" height="160" rx="14" fill="#0D1B2E"/>
  <text x="670" y="346" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Logical</text>
  <text x="670" y="371" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Centralization</text>
  <text x="670" y="398" text-anchor="middle" font-size="15" fill="#1E8C8C">One source of truth</text>
  <text x="670" y="418" text-anchor="middle" font-size="15" fill="#1E8C8C">Derived copies subordinate</text>

  <!-- Arrow to Physical -->
  <line x1="810" y1="360" x2="920" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>

  <!-- Physical Centralization: allowed zone -->
  <rect x="920" y="260" width="200" height="100" rx="10" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1020" y="300" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Physical</text>
  <text x="1020" y="320" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Centralization</text>
  <text x="1020" y="342" text-anchor="middle" font-size="13" fill="#5A5A5A">…where physics allows</text>

  <!-- Physics wall -->
  <rect x="920" y="390" width="200" height="110" rx="10" fill="#FFF4F4" stroke="#C0392B" stroke-width="3"/>
  <text x="1020" y="426" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0392B">Speed-of-Light</text>
  <text x="1020" y="447" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0392B">Floor</text>
  <text x="1020" y="468" text-anchor="middle" font-size="13" fill="#C0392B">Immovable — no</text>
  <text x="1020" y="485" text-anchor="middle" font-size="13" fill="#C0392B">optimization touches it</text>

  <!-- Arrow from Physical down to wall -->
  <line x1="1020" y1="360" x2="1020" y2="387" stroke="#C0392B" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-red)"/>

  <!-- Legend note at bottom -->
  <text x="60" y="620" font-size="16" fill="#0D1B2E" font-weight="bold">Architectural rule:</text>
  <text x="60" y="643" font-size="15" fill="#5A5A5A">Centralize the truth (logical). Distribute copies explicitly as derived, subordinate, and disposable.</text>
  <text x="60" y="665" font-size="15" fill="#5A5A5A">Never allow a convenience copy to promote itself to a source of truth — that promotion is where drift is born.</text>
</svg>
