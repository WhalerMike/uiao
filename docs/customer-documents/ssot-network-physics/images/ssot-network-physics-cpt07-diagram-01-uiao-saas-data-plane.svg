<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093) · navy #0D1B2E · teal #1E8C8C · red #C0392B · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7A8D"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="58" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">UIAO SaaS Data Plane — Reference Architecture</text>
  <text x="60" y="86" font-size="17" fill="#5A5A5A">ADR-096 · ADR-116 · ADR-033 · Centralize the truth · Distribute the copies · Refuse to span the speed of light synchronously</text>

  <!-- INBOUND: Tenants on left -->
  <text x="120" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#5A5A5A">Inbound</text>

  <rect x="30" y="128" width="180" height="54" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="120" y="151" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Entra Tenant A</text>
  <text x="120" y="170" text-anchor="middle" font-size="12" fill="#1E8C8C">Entra access token (tid=A)</text>

  <rect x="30" y="196" width="180" height="54" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="120" y="219" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Entra Tenant B</text>
  <text x="120" y="238" text-anchor="middle" font-size="12" fill="#1E8C8C">Entra access token (tid=B)</text>

  <rect x="30" y="264" width="180" height="54" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="120" y="287" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Entra Tenant C</text>
  <text x="120" y="306" text-anchor="middle" font-size="12" fill="#1E8C8C">Entra access token (tid=C)</text>

  <!-- Arrows to UIAO service -->
  <line x1="210" y1="155" x2="328" y2="220" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="210" y1="223" x2="328" y2="248" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="210" y1="291" x2="328" y2="276" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>

  <!-- UIAO Service layer -->
  <rect x="330" y="175" width="260" height="160" rx="12" fill="#0D1B2E"/>
  <text x="460" y="208" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">UIAO Data Plane</text>
  <text x="460" y="228" text-anchor="middle" font-size="13" fill="#1E8C8C">TenantResolutionMiddleware</text>
  <text x="460" y="248" text-anchor="middle" font-size="12" fill="#9BB8CC">verify token signature (JWKS/RS256)</text>
  <text x="460" y="266" text-anchor="middle" font-size="12" fill="#9BB8CC">bind tenant context from tid claim</text>
  <text x="460" y="286" text-anchor="middle" font-size="12" fill="#9BB8CC">non-onboarded / non-active → 403</text>
  <text x="460" y="308" text-anchor="middle" font-size="12" fill="#9BB8CC">namespace: t-</text>
  <text x="530" y="308" font-size="12" fill="#9BB8CC" font-family="Consolas, monospace">{tenant-guid}</text>

  <!-- Outbound passwordless auth -->
  <text x="460" y="358" text-anchor="middle" font-size="13" fill="#5A5A5A">outbound auth</text>
  <line x1="460" y1="335" x2="460" y2="390" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <rect x="362" y="355" width="96" height="26" rx="4" fill="#1E8C8C"/>
  <text x="410" y="373" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">short-lived token</text>

  <!-- Central store -->
  <rect x="680" y="155" width="280" height="200" rx="14" fill="#0D1B2E"/>
  <text x="820" y="190" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">PostgreSQL</text>
  <text x="820" y="212" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Flexible Server</text>
  <text x="820" y="236" text-anchor="middle" font-size="13" fill="#1E8C8C">Single-region writer (ADR-096)</text>
  <text x="820" y="256" text-anchor="middle" font-size="13" fill="#9BB8CC">saas_tenants registry</text>
  <text x="820" y="274" text-anchor="middle" font-size="13" fill="#9BB8CC">per-tenant state</text>
  <text x="820" y="294" text-anchor="middle" font-size="12" fill="#9BB8CC">Managed Identity = DB admin</text>
  <text x="820" y="312" text-anchor="middle" font-size="12" fill="#1E8C8C">No long-lived DB password (ADR-116)</text>
  <text x="820" y="332" text-anchor="middle" font-size="11" fill="#9BB8CC" font-style="italic">centralize until measurably cannot</text>

  <!-- Arrow service → store -->
  <line x1="590" y1="255" x2="678" y2="255" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arr-teal)"/>

  <!-- DERIVED STORES (right) -->
  <text x="1060" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#5A5A5A">Derived Stores</text>

  <rect x="1000" y="128" width="220" height="70" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1110" y="153" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Blob Storage</text>
  <text x="1110" y="172" text-anchor="middle" font-size="12" fill="#5A5A5A">evidence bundles</text>
  <text x="1110" y="189" text-anchor="middle" font-size="11" fill="#1E8C8C">keyed: t-{tenant-guid}</text>

  <rect x="1000" y="218" width="220" height="70" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1110" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Key Vault</text>
  <text x="1110" y="262" text-anchor="middle" font-size="12" fill="#5A5A5A">per-tenant secrets</text>
  <text x="1110" y="279" text-anchor="middle" font-size="11" fill="#1E8C8C">keyed: t-{tenant-guid}</text>

  <!-- Arrows store → derived -->
  <line x1="960" y1="215" x2="998" y2="175" stroke="#6B7A8D" stroke-width="1.5" marker-end="url(#arr-grey)" stroke-dasharray="5,3"/>
  <line x1="960" y1="270" x2="998" y2="258" stroke="#6B7A8D" stroke-width="1.5" marker-end="url(#arr-grey)" stroke-dasharray="5,3"/>
  <text x="990" y="210" font-size="11" fill="#6B7A8D" font-style="italic">subordinate</text>

  <!-- Lifecycle state machine -->
  <rect x="680" y="380" width="280" height="100" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="820" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Tenant Lifecycle State Machine</text>
  <text x="820" y="424" text-anchor="middle" font-size="12" fill="#5A5A5A">PENDING</text>
  <line x1="860" y1="424" x2="874" y2="424" stroke="#1E8C8C" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <text x="900" y="424" font-size="12" fill="#5A5A5A">ACTIVE</text>
  <line x1="930" y1="424" x2="944" y2="424" stroke="#1E8C8C" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <text x="952" y="424" font-size="12" fill="#5A5A5A">SUSPENDED</text>
  <text x="820" y="448" text-anchor="middle" font-size="12" fill="#5A5A5A">illegal transitions rejected at model boundary</text>
  <text x="820" y="466" text-anchor="middle" font-size="11" fill="#1E8C8C">uiao.saas.tenant</text>

  <!-- Arrow service → lifecycle -->
  <line x1="460" y1="335" x2="690" y2="400" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-grey)"/>

  <!-- Compliance stamp (bottom) -->
  <rect x="330" y="440" width="300" height="120" rx="10" fill="#EAF1FB" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="480" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Compliance Stamp</text>
  <text x="480" y="486" text-anchor="middle" font-size="13" fill="#5A5A5A">ProvisioningService (dry-run by default)</text>
  <text x="480" y="506" text-anchor="middle" font-size="12" fill="#5A5A5A">dedicated DB schema + Blob prefix</text>
  <text x="480" y="524" text-anchor="middle" font-size="12" fill="#5A5A5A">+ Key Vault scope per hard-isolation tenant</text>
  <text x="480" y="544" text-anchor="middle" font-size="11" fill="#6B7A8D" font-style="italic">exception, not the default (ADR-096)</text>

  <!-- Arrow from service → stamp -->
  <line x1="460" y1="335" x2="460" y2="438" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-grey)"/>

  <!-- Critical risk callout -->
  <rect x="680" y="500" width="560" height="82" rx="10" fill="#FFF4F4" stroke="#C0392B" stroke-width="2"/>
  <text x="960" y="526" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">The one risk — where rigor must concentrate</text>
  <text x="960" y="548" text-anchor="middle" font-size="13" fill="#C0392B">Blast radius lives in the tenant-resolution / namespace-scoping path</text>
  <text x="960" y="567" text-anchor="middle" font-size="13" fill="#C0392B">A defect in tid → data_namespace mapping is a cross-tenant exposure, not a single-tenant fault</text>

  <!-- Bottom legend -->
  <line x1="60" y1="608" x2="1220" y2="608" stroke="#0D1B2E" stroke-width="1"/>
  <rect x="60" y="620" width="16" height="14" fill="#0D1B2E"/>
  <text x="82" y="633" font-size="13" fill="#0D1B2E">Core data plane (navy)</text>
  <rect x="260" y="620" width="16" height="14" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="282" y="633" font-size="13" fill="#0D1B2E">Derived / subordinate stores (ice)</text>
  <rect x="530" y="620" width="16" height="14" fill="#EAF1FB" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="5,2"/>
  <text x="552" y="633" font-size="13" fill="#5A5A5A">Deliberate exception (dashed)</text>
  <rect x="780" y="620" width="16" height="14" fill="#FFF4F4" stroke="#C0392B" stroke-width="1.5"/>
  <text x="802" y="633" font-size="13" fill="#C0392B">Risk concentration</text>

  <text x="60" y="660" font-size="13" fill="#5A5A5A">Single-region writer = deliberate refusal to span the speed of light synchronously</text>
  <text x="60" y="678" font-size="13" fill="#5A5A5A">Sovereign-cloud readiness: OSSRDBMS token audience branches per cloud (ADR-033, ADR-116)</text>
</svg>
