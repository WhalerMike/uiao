<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093) · navy #0D1B2E · teal #1E8C8C · red #C0392B · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arr-ice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7A8D"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="62" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">SD-WAN Differentiated Transport</text>
  <text x="60" y="92" font-size="18" fill="#5A5A5A">Two path classes · each carrying the traffic it was built for · floor unchanged, gap tamed</text>

  <!-- DATABASE (left) -->
  <rect x="40" y="200" width="220" height="340" rx="12" fill="#0D1B2E"/>
  <text x="150" y="234" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Database</text>
  <text x="150" y="254" text-anchor="middle" font-size="13" fill="#9BB8CC">traffic types</text>

  <!-- Latency-critical traffic items -->
  <rect x="60" y="268" width="180" height="42" rx="6" fill="#1E8C8C"/>
  <text x="150" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Consensus heartbeats</text>
  <text x="150" y="303" text-anchor="middle" font-size="12" fill="#CCEEE8">leader election · quorum acks</text>

  <rect x="60" y="318" width="180" height="42" rx="6" fill="#1E8C8C"/>
  <text x="150" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Synchronous commits</text>
  <text x="150" y="353" text-anchor="middle" font-size="12" fill="#CCEEE8">must ack before confirm</text>

  <rect x="60" y="368" width="180" height="36" rx="6" fill="#1E8C8C"/>
  <text x="150" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Clock sync</text>
  <text x="150" y="398" text-anchor="middle" font-size="12" fill="#CCEEE8">TrueTime / PTP</text>

  <!-- Bulk traffic items -->
  <rect x="60" y="416" width="180" height="36" rx="6" fill="#EAF1FB"/>
  <text x="150" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Base snapshots / backups</text>
  <text x="150" y="449" text-anchor="middle" font-size="12" fill="#5A5A5A">high volume · latency-tolerant</text>

  <rect x="60" y="460" width="180" height="36" rx="6" fill="#EAF1FB"/>
  <text x="150" y="476" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Async log shipping</text>
  <text x="150" y="493" text-anchor="middle" font-size="12" fill="#5A5A5A">DR replication · read replicas</text>

  <rect x="60" y="504" width="180" height="36" rx="6" fill="#EAF1FB"/>
  <text x="150" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Analytics replication</text>
  <text x="150" y="537" text-anchor="middle" font-size="12" fill="#5A5A5A">eventual · bulk</text>

  <!-- SD-WAN fabric (center) -->
  <rect x="370" y="220" width="260" height="320" rx="14" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="500" y="254" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">SD-WAN Fabric</text>
  <text x="500" y="276" text-anchor="middle" font-size="13" fill="#5A5A5A">application-aware path selection</text>

  <!-- Lean path -->
  <rect x="390" y="295" width="220" height="96" rx="8" fill="#0D1B2E"/>
  <text x="500" y="322" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Lean / Low-Latency Path</text>
  <text x="500" y="343" text-anchor="middle" font-size="12" fill="#1E8C8C">near-geodesic routing</text>
  <text x="500" y="360" text-anchor="middle" font-size="12" fill="#1E8C8C">FEC · packet duplication</text>
  <text x="500" y="377" text-anchor="middle" font-size="12" fill="#1E8C8C">jitter smoothing · tight tail</text>

  <!-- Bulk path -->
  <rect x="390" y="404" width="220" height="96" rx="8" fill="#6B7A8D"/>
  <text x="500" y="431" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Fat / Bulk Path</text>
  <text x="500" y="452" text-anchor="middle" font-size="12" fill="#EAF1FB">maximum throughput</text>
  <text x="500" y="469" text-anchor="middle" font-size="12" fill="#EAF1FB">cost-efficient underlay</text>
  <text x="500" y="486" text-anchor="middle" font-size="12" fill="#EAF1FB">latency-tolerant traffic</text>

  <!-- Arrows: latency-critical → lean path -->
  <line x1="240" y1="309" x2="388" y2="333" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <line x1="240" y1="339" x2="388" y2="345" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <line x1="240" y1="386" x2="388" y2="360" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>

  <!-- Arrows: bulk → bulk path -->
  <line x1="240" y1="434" x2="388" y2="440" stroke="#6B7A8D" stroke-width="2.5" marker-end="url(#arr-ice)"/>
  <line x1="240" y1="478" x2="388" y2="458" stroke="#6B7A8D" stroke-width="2.5" marker-end="url(#arr-ice)"/>
  <line x1="240" y1="522" x2="388" y2="475" stroke="#6B7A8D" stroke-width="2" marker-end="url(#arr-ice)"/>

  <!-- Result boxes (right) -->
  <rect x="740" y="220" width="480" height="320" rx="12" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="980" y="254" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">What SD-WAN Buys</text>

  <rect x="760" y="268" width="440" height="58" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="980" y="291" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Near-geodesic routing</text>
  <text x="980" y="312" text-anchor="middle" font-size="13" fill="#5A5A5A">Routing excess from 1.5x-3x floor collapses toward 1.1x</text>

  <rect x="760" y="336" width="440" height="68" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="980" y="359" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Tail-latency reduction (FEC + duplication)</text>
  <text x="980" y="378" text-anchor="middle" font-size="13" fill="#5A5A5A">Quorum commit is a p99 problem — SD-WAN is a p99 tool</text>
  <text x="980" y="396" text-anchor="middle" font-size="13" fill="#5A5A5A">Eliminates retransmit waits that inflate the commit tail</text>

  <rect x="760" y="414" width="440" height="58" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="980" y="437" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Bulk traffic isolated from sync traffic</text>
  <text x="980" y="457" text-anchor="middle" font-size="13" fill="#5A5A5A">Re-sync cannot starve quorum heartbeats during heavy transfers</text>

  <!-- Arrow from lean path to results -->
  <line x1="630" y1="343" x2="738" y2="343" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="630" y1="452" x2="738" y2="452" stroke="#6B7A8D" stroke-width="2" marker-end="url(#arr-ice)"/>

  <!-- Hard ceiling note -->
  <rect x="740" y="555" width="480" height="58" rx="8" fill="#FFF4F4" stroke="#C0392B" stroke-width="2"/>
  <text x="980" y="578" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">Hard ceiling: SD-WAN gets you to the floor — never below it</text>
  <text x="980" y="598" text-anchor="middle" font-size="13" fill="#C0392B">NY-London synchronous commit: 56 ms minimum, always. Physics does not negotiate.</text>

  <!-- Bottom note -->
  <text x="60" y="658" font-size="14" fill="#5A5A5A" font-style="italic">Architectural conclusion: align the data layer (strong vs. eventual) with the network layer (lean vs. bulk) · minimize synchronous crossings across regions</text>
</svg>
