<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093) · navy #0D1B2E · teal #1E8C8C · red #C0392B · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="62" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">Matching Consistency Classes to Network Classes</text>
  <text x="60" y="92" font-size="18" fill="#5A5A5A">One design rule: align the data layer with the transport layer — mismatch costs in both directions</text>

  <!-- Column headers -->
  <text x="310" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Data Need</text>
  <text x="570" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Consistency Model</text>
  <text x="810" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Network Class</text>
  <text x="1080" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Crosses Regions?</text>

  <!-- Header underline -->
  <line x1="60" y1="135" x2="1220" y2="135" stroke="#0D1B2E" stroke-width="2"/>

  <!-- ROW 1: Strong consistency — lean path, intra-region -->
  <rect x="60" y="142" width="1160" height="64" rx="0" fill="#0D1B2E"/>
  <text x="310" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Authoritative writes</text>
  <text x="310" y="188" text-anchor="middle" font-size="13" fill="#9BB8CC">source of truth</text>
  <text x="570" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8C8C">Strong / Serializable</text>
  <text x="810" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8C8C">Lean · Low-Latency</text>
  <text x="810" y="188" text-anchor="middle" font-size="12" fill="#9BB8CC">near-geodesic · FEC · tight tail</text>
  <text x="1080" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8C8C">No — intra-region only</text>

  <!-- ROW 2: Synchronous replication — lean, intra-region -->
  <rect x="60" y="206" width="1160" height="60" rx="0" fill="#1A3A52"/>
  <text x="310" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Quorum durability</text>
  <text x="310" y="248" text-anchor="middle" font-size="13" fill="#9BB8CC">nearby zones</text>
  <text x="570" y="238" text-anchor="middle" font-size="14" fill="#1E8C8C">Synchronous Replication</text>
  <text x="810" y="230" text-anchor="middle" font-size="14" fill="#1E8C8C">Lean · Low-Latency</text>
  <text x="810" y="248" text-anchor="middle" font-size="12" fill="#9BB8CC">same path as writes</text>
  <text x="1080" y="238" text-anchor="middle" font-size="14" fill="#1E8C8C">No — within a region</text>

  <!-- Divider: NO SYNCHRONOUS CROSS-REGION boundary -->
  <rect x="60" y="266" width="1160" height="28" rx="0" fill="#FFF4F4"/>
  <line x1="60" y1="266" x2="1220" y2="266" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="10,4"/>
  <line x1="60" y1="294" x2="1220" y2="294" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="10,4"/>
  <text x="640" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">— No synchronous cross-region path exists — physics prevents it from being cheap —</text>

  <!-- ROW 3: Async replication — bulk, cross-region -->
  <rect x="60" y="294" width="1160" height="60" rx="0" fill="#F4F8FB"/>
  <text x="310" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Cross-region DR</text>
  <text x="310" y="336" text-anchor="middle" font-size="13" fill="#5A5A5A">disaster recovery</text>
  <text x="570" y="328" text-anchor="middle" font-size="14" fill="#6B7A8D">Asynchronous Replication</text>
  <text x="810" y="318" text-anchor="middle" font-size="14" fill="#6B7A8D">Fat · Bulk</text>
  <text x="810" y="336" text-anchor="middle" font-size="12" fill="#5A5A5A">high throughput · latency-tolerant</text>
  <text x="1080" y="328" text-anchor="middle" font-size="14" fill="#6B7A8D">Yes — async by design</text>

  <!-- ROW 4: Bounded staleness -->
  <rect x="60" y="354" width="1160" height="60" rx="0" fill="#FFFFFF"/>
  <text x="310" y="378" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Read-mostly access</text>
  <text x="310" y="396" text-anchor="middle" font-size="13" fill="#5A5A5A">far from writer</text>
  <text x="570" y="386" text-anchor="middle" font-size="14" fill="#6B7A8D">Bounded Staleness</text>
  <text x="810" y="378" text-anchor="middle" font-size="14" fill="#6B7A8D">Fat · Bulk (refresh)</text>
  <text x="810" y="396" text-anchor="middle" font-size="12" fill="#5A5A5A">replica refresh on bulk path</text>
  <text x="1080" y="386" text-anchor="middle" font-size="14" fill="#6B7A8D">No — local read, bulk refresh</text>

  <!-- ROW 5: CRDT -->
  <rect x="60" y="414" width="1160" height="60" rx="0" fill="#F4F8FB"/>
  <text x="310" y="438" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Multi-writer collaborative</text>
  <text x="310" y="456" text-anchor="middle" font-size="13" fill="#5A5A5A">merge-friendly data</text>
  <text x="570" y="446" text-anchor="middle" font-size="14" fill="#6B7A8D">Causal / CRDT Merge</text>
  <text x="810" y="438" text-anchor="middle" font-size="14" fill="#6B7A8D">Fat · Bulk</text>
  <text x="810" y="456" text-anchor="middle" font-size="12" fill="#5A5A5A">merges, not round trips</text>
  <text x="1080" y="446" text-anchor="middle" font-size="14" fill="#6B7A8D">No — merges, not coordination</text>

  <!-- ROW 6: Eventual -->
  <rect x="60" y="474" width="1160" height="60" rx="0" fill="#FFFFFF"/>
  <text x="310" y="498" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Analytics / reporting</text>
  <text x="310" y="516" text-anchor="middle" font-size="13" fill="#5A5A5A">read-only workloads</text>
  <text x="570" y="506" text-anchor="middle" font-size="14" fill="#6B7A8D">Eventual</text>
  <text x="810" y="498" text-anchor="middle" font-size="14" fill="#6B7A8D">Fat · Bulk</text>
  <text x="810" y="516" text-anchor="middle" font-size="12" fill="#5A5A5A">no consistency overhead</text>
  <text x="1080" y="506" text-anchor="middle" font-size="14" fill="#6B7A8D">No</text>

  <!-- Bottom rule -->
  <line x1="60" y1="540" x2="1220" y2="540" stroke="#0D1B2E" stroke-width="1.5"/>

  <!-- Decision procedure -->
  <text x="60" y="572" font-size="15" font-weight="bold" fill="#0D1B2E">Decision procedure:</text>
  <text x="240" y="572" font-size="15" fill="#5A5A5A">1. Identify the one authoritative writer (SSOT)</text>
  <text x="240" y="594" font-size="15" fill="#5A5A5A">2. Determine the weakest consistency the business actually tolerates for each flow</text>
  <text x="240" y="616" font-size="15" fill="#5A5A5A">3. Route strong/synchronous flows on the lean path intra-region · everything cross-region is async on the bulk path</text>

  <!-- Lean legend -->
  <rect x="60" y="642" width="18" height="14" fill="#0D1B2E"/>
  <text x="84" y="655" font-size="14" fill="#0D1B2E">Lean / Low-Latency path (intra-region only)</text>
  <rect x="420" y="642" width="18" height="14" fill="#6B7A8D"/>
  <text x="444" y="655" font-size="14" fill="#5A5A5A">Fat / Bulk path (cross-region, latency-tolerant)</text>
  <rect x="800" y="642" width="18" height="14" fill="#C0392B"/>
  <text x="824" y="655" font-size="14" fill="#C0392B">Physics wall — no synchronous cross-region</text>
</svg>
