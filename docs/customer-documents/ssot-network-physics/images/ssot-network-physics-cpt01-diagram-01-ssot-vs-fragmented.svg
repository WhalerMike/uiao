<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093) · navy #0D1B2E · teal #1E8C8C · red #C0392B · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="66" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">Single Source of Truth vs. Fragmented Stores</text>
  <text x="60" y="96" font-size="18" fill="#5A5A5A">Hardware ate the scaling objection — vertical first, and one schema to reason about</text>

  <!-- LEFT: Fragmented -->
  <text x="180" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#C0392B">Many Small Stores</text>

  <rect x="60" y="160" width="160" height="70" rx="8" fill="#EAF1FB" stroke="#C0392B" stroke-width="2"/>
  <text x="140" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Service A DB</text>
  <text x="140" y="211" text-anchor="middle" font-size="13" fill="#5A5A5A">customers</text>

  <rect x="240" y="160" width="160" height="70" rx="8" fill="#EAF1FB" stroke="#C0392B" stroke-width="2"/>
  <text x="320" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Service B DB</text>
  <text x="320" y="211" text-anchor="middle" font-size="13" fill="#5A5A5A">customers copy</text>

  <rect x="60" y="270" width="160" height="70" rx="8" fill="#EAF1FB" stroke="#C0392B" stroke-width="2"/>
  <text x="140" y="301" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Service C DB</text>
  <text x="140" y="321" text-anchor="middle" font-size="13" fill="#5A5A5A">pricing</text>

  <rect x="240" y="270" width="160" height="70" rx="8" fill="#EAF1FB" stroke="#C0392B" stroke-width="2"/>
  <text x="320" y="301" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Service D DB</text>
  <text x="320" y="321" text-anchor="middle" font-size="13" fill="#5A5A5A">pricing copy</text>

  <!-- Drift arrows between fragmented stores -->
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/>
    </marker>
  </defs>
  <line x1="220" y1="195" x2="238" y2="195" stroke="#C0392B" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <line x1="220" y1="305" x2="238" y2="305" stroke="#C0392B" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <line x1="140" y1="230" x2="140" y2="268" stroke="#C0392B" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <line x1="320" y1="230" x2="320" y2="268" stroke="#C0392B" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>

  <!-- DRIFT label -->
  <rect x="150" y="220" width="120" height="36" rx="6" fill="#FFF4F4" stroke="#C0392B" stroke-width="1.5"/>
  <text x="210" y="244" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0392B">DRIFT</text>

  <!-- Incident callout -->
  <rect x="60" y="365" width="340" height="80" rx="8" fill="#FFF4F4" stroke="#C0392B" stroke-width="1.5"/>
  <text x="230" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">"Which system has the right number?"</text>
  <text x="230" y="413" text-anchor="middle" font-size="13" fill="#5A5A5A">Reconciliation jobs · Incident archaeology</text>
  <text x="230" y="432" text-anchor="middle" font-size="13" fill="#5A5A5A">N schemas · N sources of potential error</text>

  <!-- VS divider -->
  <line x1="440" y1="130" x2="440" y2="580" stroke="#6B7A8D" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="440" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#6B7A8D">VS</text>

  <!-- RIGHT: SSOT -->
  <text x="860" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1E8C8C">One Logical Source of Truth</text>

  <!-- Central SSOT -->
  <rect x="710" y="200" width="300" height="150" rx="14" fill="#0D1B2E"/>
  <text x="860" y="258" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Source of Truth</text>
  <text x="860" y="283" text-anchor="middle" font-size="15" fill="#1E8C8C">One authoritative writer</text>
  <text x="860" y="305" text-anchor="middle" font-size="13" fill="#9BB8CC">Real FK · real transactions</text>
  <text x="860" y="325" text-anchor="middle" font-size="13" fill="#9BB8CC">One schema · one answer</text>

  <!-- Derived copies -->
  <rect x="480" y="415" width="170" height="72" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="2"/>
  <text x="565" y="445" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Read Replica</text>
  <text x="565" y="466" text-anchor="middle" font-size="13" fill="#5A5A5A">derived · rebuildable</text>

  <rect x="680" y="415" width="170" height="72" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="2"/>
  <text x="765" y="445" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Cache</text>
  <text x="765" y="466" text-anchor="middle" font-size="13" fill="#5A5A5A">derived · disposable</text>

  <rect x="880" y="415" width="200" height="72" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="2"/>
  <text x="980" y="445" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Compliance Stamp</text>
  <text x="980" y="466" text-anchor="middle" font-size="13" fill="#5A5A5A">deliberate exception</text>

  <!-- Arrows from SSOT to derived -->
  <line x1="780" y1="350" x2="590" y2="413" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="860" y1="350" x2="790" y2="413" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="940" y1="350" x2="1000" y2="413" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>

  <!-- "Derived, subordinate" label -->
  <text x="740" y="540" text-anchor="middle" font-size="14" fill="#1E8C8C" font-style="italic">subordinate · explicitly not authoritative</text>

  <!-- Summary notes bottom -->
  <text x="60" y="620" font-size="15" fill="#0D1B2E" font-weight="bold">Key insight:</text>
  <text x="175" y="620" font-size="15" fill="#5A5A5A">Drift is born when an unofficial local copy quietly promotes itself to a source of truth.</text>
  <text x="60" y="645" font-size="15" fill="#5A5A5A">Small databases survive as disposable accelerators and compliance exceptions — not as competing sources of truth.</text>
</svg>
