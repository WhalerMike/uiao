<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093) · navy #0D1B2E · teal #1E8C8C · red #C0392B · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="62" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">The Governed Path — Token-Bound Transport (ADR-066, Proposed)</text>
  <text x="60" y="92" font-size="17" fill="#5A5A5A">Identity is the new boundary on both planes · the transport plane must be token-bound, not just the data plane</text>

  <!-- LEFT: Flat LAN (broken) -->
  <text x="220" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#C0392B">Flat LAN — Three Failures</text>

  <!-- Edge device -->
  <rect x="60" y="150" width="160" height="70" rx="8" fill="#0D1B2E"/>
  <text x="140" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Edge Device</text>
  <text x="140" y="200" text-anchor="middle" font-size="12" fill="#9BB8CC">identity · posture · app context</text>

  <!-- Flat LAN box -->
  <rect x="50" y="248" width="350" height="60" rx="8" fill="#FFF4F4" stroke="#C0392B" stroke-width="2"/>
  <text x="225" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">Flat Layer-3/4 LAN</text>
  <text x="225" y="297" text-anchor="middle" font-size="13" fill="#C0392B">throws identity signals away</text>

  <!-- Arrow down to LAN -->
  <line x1="140" y1="220" x2="140" y2="246" stroke="#C0392B" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- 3 failure boxes -->
  <rect x="60" y="330" width="320" height="46" rx="6" fill="#FFF4F4" stroke="#C0392B" stroke-width="1.5"/>
  <text x="220" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">1. No local breakout / Cloud OnRamp</text>
  <text x="220" y="368" text-anchor="middle" font-size="12" fill="#C0392B">traffic backhauled through retiring perimeter</text>

  <rect x="60" y="384" width="320" height="46" rx="6" fill="#FFF4F4" stroke="#C0392B" stroke-width="1.5"/>
  <text x="220" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">2. No Identity-Aware Routing (INR)</text>
  <text x="220" y="422" text-anchor="middle" font-size="12" fill="#C0392B">per-user / per-app path selection impossible</text>

  <rect x="60" y="438" width="320" height="46" rx="6" fill="#FFF4F4" stroke="#C0392B" stroke-width="1.5"/>
  <text x="220" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">3. Session-based trust (authorize once)</text>
  <text x="220" y="476" text-anchor="middle" font-size="12" fill="#C0392B">hijack session → inherit all trust for hours</text>

  <!-- DRIFT-TRANSPORT label -->
  <rect x="90" y="500" width="260" height="38" rx="8" fill="#FFF4F4" stroke="#C0392B" stroke-width="2"/>
  <text x="220" y="524" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">DRIFT-TRANSPORT generated</text>

  <!-- VS divider -->
  <line x1="450" y1="130" x2="450" y2="590" stroke="#6B7A8D" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="450" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#6B7A8D">VS</text>

  <!-- RIGHT: Application-Aware Overlay -->
  <text x="870" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#1E8C8C">Application-Aware Overlay (ADR-066)</text>

  <!-- Edge device right -->
  <rect x="490" y="150" width="160" height="70" rx="8" fill="#0D1B2E"/>
  <text x="570" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Edge Device</text>
  <text x="570" y="200" text-anchor="middle" font-size="12" fill="#9BB8CC">identity · posture · app context</text>

  <!-- Arrow to OverlayTunnel -->
  <line x1="650" y1="185" x2="760" y2="290" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arr-teal)"/>

  <!-- OverlayTunnel box -->
  <rect x="760" y="188" width="420" height="220" rx="12" fill="#0D1B2E"/>
  <text x="970" y="222" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">OverlayTunnel</text>
  <text x="970" y="244" text-anchor="middle" font-size="14" fill="#1E8C8C">leased · not opened · token-bounded</text>

  <!-- Tunnel attributes -->
  <text x="780" y="276" font-size="13" fill="#9BB8CC">identity</text>
  <text x="780" y="296" font-size="13" fill="#9BB8CC">application</text>
  <text x="780" y="316" font-size="13" fill="#9BB8CC">posture</text>
  <text x="780" y="336" font-size="13" fill="#9BB8CC">location (orgPath)</text>
  <text x="970" y="276" text-anchor="middle" font-size="13" fill="#1E8C8C">token (short-lived, audience-scoped)</text>
  <text x="970" y="296" text-anchor="middle" font-size="13" fill="#1E8C8C">lease (bounded by token lifetime)</text>
  <text x="970" y="316" text-anchor="middle" font-size="13" fill="#1E8C8C">certificate-chain</text>
  <text x="970" y="356" text-anchor="middle" font-size="12" fill="#9BB8CC" font-style="italic">A session ceases to be a canonical concept</text>
  <text x="970" y="374" text-anchor="middle" font-size="12" fill="#9BB8CC" font-style="italic">Authorization is a per-event, identity-bound act</text>
  <text x="970" y="392" text-anchor="middle" font-size="12" fill="#9BB8CC" font-style="italic">Canonical record provenance-anchored to SSOT</text>

  <!-- Benefits below -->
  <rect x="760" y="430" width="200" height="60" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="860" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Local breakout</text>
  <text x="860" y="473" text-anchor="middle" font-size="12" fill="#5A5A5A">Cloud OnRamp enabled</text>

  <rect x="980" y="430" width="200" height="60" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1080" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">INR routing</text>
  <text x="1080" y="473" text-anchor="middle" font-size="12" fill="#5A5A5A">identity drives path</text>

  <rect x="870" y="505" width="200" height="60" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="970" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Auditable evidence</text>
  <text x="970" y="548" text-anchor="middle" font-size="12" fill="#5A5A5A">path is governed, not invisible</text>

  <!-- Lane discipline note -->
  <rect x="480" y="580" width="760" height="44" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="860" y="601" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Lane discipline (ADR-066): UIAO observes, reconciles, and emits evidence</text>
  <text x="860" y="618" text-anchor="middle" font-size="13" fill="#5A5A5A">Transport adapters do NOT route packets · agency operates any SASE/SD-WAN fabric it chooses</text>

  <!-- Bottom note -->
  <text x="60" y="675" font-size="13" fill="#5A5A5A" font-style="italic">Status: ADR-066 Proposed · UIAO_122 / UIAO_123 / UIAO_124 are open verification items</text>
</svg>
