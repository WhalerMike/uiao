<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093) · navy #0D1B2E · teal #1E8C8C · red #C0392B · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="62" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">The Speed-of-Light Tax</text>
  <text x="60" y="92" font-size="18" fill="#5A5A5A">Propagation delay is immovable · everything else is addressable — but only the gap, never the floor</text>

  <!-- Y-axis label -->
  <text x="34" y="440" text-anchor="middle" font-size="14" fill="#5A5A5A" transform="rotate(-90, 34, 440)">Round-trip latency (ms)</text>

  <!-- Bars: 4 paths -->
  <!-- Bar geometry: base y=580, bar goes upward. Scale: 1ms = 2px, so 300ms = 600px -->
  <!-- Metro ~50km: floor 0.5ms, observed ~3ms → floor=1px, gap=5px → scale up: floor=2px, gap=10px ... use 1ms=3px -->
  <!-- Metro: floor=1.5px ≈ 2, obs~8 → floor bar h=2, gap bar h=22 -->
  <!-- use 1ms = 2.5px -->

  <!-- Bar 1: Metro (~50 km) -->
  <text x="200" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#0D1B2E">Metro</text>
  <text x="200" y="150" text-anchor="middle" font-size="13" fill="#5A5A5A">~50 km</text>
  <!-- Addressable gap (teal): floor=1ms, observed~8ms, gap=7ms → h=17.5 → 18 -->
  <rect x="140" y="420" width="120" height="140" rx="4" fill="#1E8C8C" opacity="0.85"/>
  <text x="200" y="496" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Addressable</text>
  <text x="200" y="512" text-anchor="middle" font-size="12" fill="#FFFFFF">gap ~7 ms</text>
  <!-- Floor (red): 1ms → h=2.5 → show as band -->
  <rect x="140" y="560" width="120" height="18" rx="0" fill="#C0392B"/>
  <text x="200" y="553" text-anchor="middle" font-size="11" fill="#C0392B">floor ~0.5 ms</text>

  <!-- Bar 2: Cross-region (~1000 km) -->
  <text x="440" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#0D1B2E">Cross-Region</text>
  <text x="440" y="150" text-anchor="middle" font-size="13" fill="#5A5A5A">~1,000 km, same continent</text>
  <!-- floor=10ms h=25; gap observed~45ms, gap=35ms h=87 -->
  <rect x="380" y="295" width="120" height="265" rx="4" fill="#1E8C8C" opacity="0.85"/>
  <text x="440" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Addressable</text>
  <text x="440" y="416" text-anchor="middle" font-size="12" fill="#FFFFFF">gap ~35 ms</text>
  <rect x="380" y="560" width="120" height="28" rx="0" fill="#C0392B"/>
  <text x="440" y="553" text-anchor="middle" font-size="11" fill="#C0392B">floor ~10 ms</text>

  <!-- Bar 3: NY to London (~5600 km) -->
  <text x="680" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#0D1B2E">NY to London</text>
  <text x="680" y="150" text-anchor="middle" font-size="13" fill="#5A5A5A">~5,600 km</text>
  <!-- floor=56ms h=140; gap observed~160ms, gap=104ms h=260 → cap gap at h=200 -->
  <rect x="620" y="220" width="120" height="200" rx="4" fill="#1E8C8C" opacity="0.85"/>
  <text x="680" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Addressable</text>
  <text x="680" y="324" text-anchor="middle" font-size="12" fill="#FFFFFF">gap ~100+ ms</text>
  <rect x="620" y="420" width="120" height="140" rx="0" fill="#C0392B"/>
  <text x="680" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#C0392B">floor ~56 ms</text>
  <text x="680" y="428" text-anchor="middle" font-size="11" fill="#FFFFFF">immovable</text>

  <!-- Bar 4: NY to Singapore (~15300 km) -->
  <text x="940" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#0D1B2E">NY to Singapore</text>
  <text x="940" y="150" text-anchor="middle" font-size="13" fill="#5A5A5A">~15,300 km</text>
  <!-- floor=153ms h=383 → cap at 330; gap observed~350ms, gap=197ms → show h=80 above floor -->
  <rect x="880" y="248" width="120" height="80" rx="4" fill="#1E8C8C" opacity="0.85"/>
  <text x="940" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">gap ~200 ms</text>
  <rect x="880" y="328" width="120" height="232" rx="0" fill="#C0392B"/>
  <text x="940" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#C0392B">floor ~153 ms</text>
  <text x="940" y="340" text-anchor="middle" font-size="11" fill="#FFFFFF">immovable</text>

  <!-- Baseline -->
  <line x1="100" y1="580" x2="1100" y2="580" stroke="#0D1B2E" stroke-width="2"/>

  <!-- Floor line annotation -->
  <line x1="100" y1="560" x2="1100" y2="560" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="10,5"/>
  <text x="1110" y="564" font-size="12" fill="#C0392B">Propagation floor</text>
  <text x="1110" y="580" font-size="12" fill="#C0392B">(never crossed)</text>

  <!-- Legend -->
  <rect x="60" y="608" width="22" height="16" fill="#C0392B"/>
  <text x="88" y="621" font-size="14" fill="#0D1B2E">Propagation delay — immovable (speed of light in fiber)</text>
  <rect x="60" y="632" width="22" height="16" fill="#1E8C8C" opacity="0.85"/>
  <text x="88" y="645" font-size="14" fill="#0D1B2E">Addressable gap — congestion, jitter, routing excess (SD-WAN operates here)</text>

  <!-- Key note -->
  <text x="60" y="678" font-size="14" fill="#5A5A5A" font-style="italic">Strong consistency spends round trips · NY-London floor = 56 ms per synchronous commit · no optimization changes this</text>
</svg>
