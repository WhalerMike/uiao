<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- index-image-01 — AD-to-Entra-ID modernization journey (ADR-093 house style).
       LEFT: legacy Active Directory (muted grey, end-of-life). RIGHT: Microsoft 365 /
       Entra ID cloud boundary (ice + navy). CENTER: three parallel transition arrows,
       the thick teal one "OrgPath governance preserved". White bg; navy/teal/grey. -->
  <defs>
    <marker id="navyArrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1E3A66"/>
    </marker>
    <marker id="tealArrowBig" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1E8C8C"/>

  <text x="640" y="70" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#0D1B2E">The Modernization Journey</text>
  <text x="640" y="108" text-anchor="middle" font-size="20" fill="#6B7A8D">Active Directory &#8594; Microsoft 365 / Entra ID</text>
  <line x1="40" y1="128" x2="1240" y2="128" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ===== LEFT: Legacy Active Directory (muted grey, end of life) ===== -->
  <rect x="40" y="150" width="440" height="500" rx="16" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="2"/>
  <text x="260" y="190" text-anchor="middle" font-size="24" font-weight="bold" fill="#5A5A5A">Legacy Active Directory</text>
  <text x="260" y="216" text-anchor="middle" font-size="15" fill="#6B7A8D">On-premises &#183; end of life</text>

  <!-- forest root + OU tree -->
  <rect x="160" y="242" width="200" height="44" rx="8" fill="#5A5A5A"/>
  <text x="260" y="264" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">AD Forest / Domain</text>
  <line x1="260" y1="286" x2="180" y2="320" stroke="#8A93A0" stroke-width="2"/>
  <line x1="260" y1="286" x2="360" y2="320" stroke="#8A93A0" stroke-width="2"/>
  <rect x="110" y="320" width="140" height="42" rx="8" fill="#FFFFFF" stroke="#8A93A0" stroke-width="2"/>
  <text x="180" y="341" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#5A5A5A">OU: Corp</text>
  <rect x="290" y="320" width="140" height="42" rx="8" fill="#FFFFFF" stroke="#8A93A0" stroke-width="2"/>
  <text x="360" y="341" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#5A5A5A">OU: Agency</text>

  <text x="260" y="398" text-anchor="middle" font-size="14" fill="#6B7A8D">Infrastructure services inherit from the OU</text>

  <!-- service pills (grey = retiring) -->
  <rect x="58"  y="412" width="94" height="38" rx="19" fill="#EEF0F2" stroke="#C9CFD6" stroke-width="1.5"/>
  <text x="105" y="431" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#5A5A5A">DNS</text>
  <rect x="162" y="412" width="94" height="38" rx="19" fill="#EEF0F2" stroke="#C9CFD6" stroke-width="1.5"/>
  <text x="209" y="431" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#5A5A5A">DHCP</text>
  <rect x="266" y="412" width="94" height="38" rx="19" fill="#EEF0F2" stroke="#C9CFD6" stroke-width="1.5"/>
  <text x="313" y="431" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#5A5A5A">PKI</text>
  <rect x="370" y="412" width="94" height="38" rx="19" fill="#EEF0F2" stroke="#C9CFD6" stroke-width="1.5"/>
  <text x="417" y="431" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#5A5A5A">RADIUS</text>
  <rect x="58"  y="460" width="130" height="38" rx="19" fill="#EEF0F2" stroke="#C9CFD6" stroke-width="1.5"/>
  <text x="123" y="479" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#5A5A5A">LDAP</text>
  <rect x="198" y="460" width="130" height="38" rx="19" fill="#EEF0F2" stroke="#C9CFD6" stroke-width="1.5"/>
  <text x="263" y="479" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#5A5A5A">Group Policy</text>
  <rect x="338" y="460" width="130" height="38" rx="19" fill="#EEF0F2" stroke="#C9CFD6" stroke-width="1.5"/>
  <text x="403" y="479" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#5A5A5A">File Services</text>

  <text x="260" y="556" text-anchor="middle" font-size="13" fill="#9AA3AE" font-style="italic">muted grey = retiring on-prem estate</text>

  <!-- ===== RIGHT: Microsoft 365 / Entra ID cloud boundary ===== -->
  <rect x="800" y="150" width="440" height="500" rx="24" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="1020" y="190" text-anchor="middle" font-size="24" font-weight="bold" fill="#0D1B2E">Microsoft 365 / Entra ID</text>
  <text x="1020" y="216" text-anchor="middle" font-size="15" fill="#6B7A8D">Cloud governance boundary</text>

  <rect x="828" y="250" width="180" height="96" rx="12" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="828" y="250" width="8" height="96" rx="4" fill="#1E8C8C"/>
  <text x="921" y="288" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">Administrative</text>
  <text x="921" y="312" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">Units</text>
  <rect x="1032" y="250" width="180" height="96" rx="12" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="1032" y="250" width="8" height="96" rx="4" fill="#1E8C8C"/>
  <text x="1125" y="288" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">Dynamic</text>
  <text x="1125" y="312" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">Groups</text>
  <rect x="828" y="372" width="180" height="96" rx="12" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="828" y="372" width="8" height="96" rx="4" fill="#1E8C8C"/>
  <text x="921" y="410" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">Conditional</text>
  <text x="921" y="434" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">Access</text>
  <rect x="1032" y="372" width="180" height="96" rx="12" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="1032" y="372" width="8" height="96" rx="4" fill="#1E8C8C"/>
  <text x="1125" y="410" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">Intune Device</text>
  <text x="1125" y="434" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">Policy</text>

  <line x1="850" y1="500" x2="1190" y2="500" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1020" y="524" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E8C8C">All read OrgPath facets</text>

  <!-- ===== CENTER: three parallel transition arrows ===== -->
  <text x="640" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A66">Identity Modernization (UIAO_xxx)</text>
  <line x1="492" y1="302" x2="792" y2="302" stroke="#1E3A66" stroke-width="3" marker-end="url(#navyArrow)"/>

  <text x="640" y="392" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E8C8C">OrgPath governance preserved</text>
  <line x1="488" y1="414" x2="796" y2="414" stroke="#1E8C8C" stroke-width="10" marker-end="url(#tealArrowBig)"/>

  <line x1="492" y1="520" x2="792" y2="520" stroke="#1E3A66" stroke-width="3" marker-end="url(#navyArrow)"/>
  <text x="640" y="548" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A66">Directory Migration (DM_xxx)</text>
</svg>
