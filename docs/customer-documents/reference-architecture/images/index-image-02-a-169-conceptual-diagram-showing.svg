<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- index-image-02 — Active Directory as the silent governance hub (ADR-093 house style).
       CENTER: an OU tree node with a faint teal glow. Eight spokes radiate to the
       infrastructure services that inherit delegation, policy and security boundary
       from the OU. White bg; navy / steel-grey, one teal accent on the central tree. -->
  <defs>
    <marker id="spokeArrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#6B7A8D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1E8C8C"/>

  <text x="640" y="62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#0D1B2E">Active Directory: The Silent Governance Hub</text>

  <!-- ===== spokes (drawn behind the chips) ===== -->
  <g stroke="#6B7A8D" stroke-width="2">
    <line x1="640" y1="390" x2="640"  y2="200" marker-end="url(#spokeArrow)"/>
    <line x1="640" y1="390" x2="965"  y2="256" marker-end="url(#spokeArrow)"/>
    <line x1="640" y1="390" x2="1100" y2="390" marker-end="url(#spokeArrow)"/>
    <line x1="640" y1="390" x2="965"  y2="524" marker-end="url(#spokeArrow)"/>
    <line x1="640" y1="390" x2="640"  y2="578" marker-end="url(#spokeArrow)"/>
    <line x1="640" y1="390" x2="315"  y2="524" marker-end="url(#spokeArrow)"/>
    <line x1="640" y1="390" x2="180"  y2="390" marker-end="url(#spokeArrow)"/>
    <line x1="640" y1="390" x2="315"  y2="256" marker-end="url(#spokeArrow)"/>
  </g>

  <!-- ===== central OU-tree node with faint teal glow ===== -->
  <circle cx="640" cy="390" r="120" fill="none" stroke="#1E8C8C" stroke-width="2" opacity="0.18"/>
  <circle cx="640" cy="390" r="98"  fill="none" stroke="#1E8C8C" stroke-width="3" opacity="0.32"/>
  <rect x="556" y="340" width="168" height="104" rx="14" fill="#0D1B2E" stroke="#1E8C8C" stroke-width="3"/>
  <!-- mini OU folder tree, white glyph -->
  <rect x="612" y="360" width="56" height="16" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="640" y1="376" x2="640" y2="392" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="608" y1="392" x2="672" y2="392" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="608" y1="392" x2="608" y2="402" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="672" y1="392" x2="672" y2="402" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="592" y="402" width="32" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="656" y="402" width="32" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="640" y="430" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">OU Tree</text>

  <!-- ===== service chips (each ends a spoke) ===== -->
  <!-- N -->
  <rect x="553" y="174" width="174" height="50" rx="10" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
  <text x="640" y="199" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#0D1B2E">Group Policy</text>
  <!-- NE -->
  <rect x="878" y="231" width="174" height="50" rx="10" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
  <text x="965" y="256" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#0D1B2E">PKI / Cert Services</text>
  <!-- E -->
  <rect x="1013" y="365" width="174" height="50" rx="10" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
  <text x="1100" y="390" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#0D1B2E">RADIUS / 802.1X</text>
  <!-- SE -->
  <rect x="878" y="499" width="174" height="50" rx="10" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
  <text x="965" y="524" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#0D1B2E">LDAP Authentication</text>
  <!-- S -->
  <rect x="553" y="553" width="174" height="50" rx="10" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
  <text x="640" y="578" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#0D1B2E">Cross-Domain Trust</text>
  <!-- SW -->
  <rect x="228" y="499" width="174" height="50" rx="10" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
  <text x="315" y="524" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#0D1B2E">File Services</text>
  <!-- W -->
  <rect x="93" y="365" width="174" height="50" rx="10" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
  <text x="180" y="390" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#0D1B2E">DHCP</text>
  <!-- NW -->
  <rect x="228" y="231" width="174" height="50" rx="10" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
  <text x="315" y="256" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#0D1B2E">DNS</text>

  <!-- ===== caption band ===== -->
  <rect x="40" y="648" width="1200" height="48" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="640" y="672" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">Every spoke inherits delegation, policy scope, and security boundary from the OU it points at.</text>
</svg>
