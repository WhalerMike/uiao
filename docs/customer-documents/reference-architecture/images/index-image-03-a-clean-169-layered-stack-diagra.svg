<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- index-image-03 — the four-layer OrgTree governance stack (ADR-093 house style).
       Bottom-to-top, widest-to-narrowest: Identity, Structure, Policy, Governance.
       A vertical teal arrow runs through all four: "Every artifact cites its layer."
       White bg; navy / teal / steel-grey, amber reserved for the escalation artifact. -->
  <defs>
    <marker id="upArrow" viewBox="0 0 12 12" refX="6" refY="3" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1,11 L6,1 L11,11 Z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1E8C8C"/>

  <text x="660" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#0D1B2E">The OrgTree Governance Stack</text>
  <text x="660" y="98" text-anchor="middle" font-size="19" fill="#6B7A8D">Four layers &#8212; every artifact cites the layer it belongs to</text>

  <!-- ===== vertical "cite your layer" arrow (left rail) ===== -->
  <line x1="74" y1="632" x2="74" y2="150" stroke="#1E8C8C" stroke-width="6" marker-end="url(#upArrow)"/>
  <text x="46" y="394" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E8C8C" transform="rotate(-90 46 394)">Every artifact cites its layer</text>

  <!-- ===== Governance (top, narrowest, darkest navy + amber escalation) ===== -->
  <rect x="330" y="146" width="640" height="112" rx="12" fill="#0D1B2E"/>
  <rect x="330" y="146" width="9" height="112" rx="4" fill="#D4A017"/>
  <text x="650" y="186" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#FFFFFF">Governance Layer</text>
  <text x="650" y="224" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#D7F2EE">Drift signal  &#183;  Escalation alert  &#183;  Provenance seal</text>

  <!-- ===== Policy (steel grey) ===== -->
  <rect x="265" y="274" width="770" height="112" rx="12" fill="#5A5A5A"/>
  <rect x="265" y="274" width="9" height="112" rx="4" fill="#1E8C8C"/>
  <text x="650" y="314" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#FFFFFF">Policy Layer</text>
  <text x="650" y="352" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#FFFFFF">Validation cmdlet  &#183;  Decision tree  &#183;  SLA gauge</text>

  <!-- ===== Structure (teal) ===== -->
  <rect x="200" y="402" width="900" height="112" rx="12" fill="#1E8C8C"/>
  <rect x="200" y="402" width="9" height="112" rx="4" fill="#0D1B2E"/>
  <text x="650" y="442" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#FFFFFF">Structure Layer</text>
  <text x="650" y="480" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#FFFFFF">Administrative Unit  &#183;  Runbook  &#183;  JSON schema</text>

  <!-- ===== Identity (bottom, widest, navy) ===== -->
  <rect x="135" y="530" width="1030" height="112" rx="12" fill="#1E3A66"/>
  <rect x="135" y="530" width="9" height="112" rx="4" fill="#1E8C8C"/>
  <text x="650" y="570" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#FFFFFF">Identity Layer</text>
  <text x="650" y="608" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#D7F2EE">OrgPath code  &#183;  Dynamic group  &#183;  Attribute</text>
</svg>
