<svg viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="56" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#0D1B2E">OrgPath Model C — fifteen facets, one derived path</text>
  <text x="56" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6B7A8D">Each facet occupies one Entra ID onPremisesExtensionAttribute slot. Only the three hierarchy facets compose the path.</text>

  <!-- ============ Hierarchy facets ============ -->
  <text x="56" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#12766B">HIERARCHY FACETS (SLOTS 1&#8211;3)</text>
  <rect x="52" y="134" width="296" height="306" rx="10" fill="#F5FBFA" stroke="#1E8C8C" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="68" y="150" width="264" height="76" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="84" y="176" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#12766B">extensionAttribute1</text>
  <text x="84" y="205" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0D1B2E">Region</text>

  <rect x="68" y="248" width="264" height="76" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="84" y="274" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#12766B">extensionAttribute2</text>
  <text x="84" y="303" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0D1B2E">Department</text>

  <rect x="68" y="346" width="264" height="76" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="84" y="372" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#12766B">extensionAttribute3</text>
  <text x="84" y="401" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0D1B2E">Division</text>

  <!-- ============ Governance facets ============ -->
  <text x="364" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#0D1B2E">GOVERNANCE FACETS &#8212; BOOLEAN COMPOSITION ONLY</text>
  <rect x="360" y="134" width="564" height="306" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>

  <rect x="372" y="148" width="264" height="46" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="386" y="167" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">extensionAttribute4</text>
  <text x="386" y="184" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0D1B2E">Role</text>

  <rect x="652" y="148" width="264" height="46" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="666" y="167" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">extensionAttribute5</text>
  <text x="666" y="184" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0D1B2E">CostCenter</text>

  <rect x="372" y="204" width="264" height="46" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="386" y="223" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">extensionAttribute6</text>
  <text x="386" y="240" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0D1B2E">Classification</text>

  <rect x="652" y="204" width="264" height="46" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="666" y="223" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">extensionAttribute7</text>
  <text x="666" y="240" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0D1B2E">HireDate &#8212; typed (ISO date)</text>

  <rect x="372" y="260" width="264" height="46" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="386" y="279" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">extensionAttribute8</text>
  <text x="386" y="296" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0D1B2E">TermDate &#8212; typed</text>

  <rect x="652" y="260" width="264" height="46" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="666" y="279" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">extensionAttribute9</text>
  <text x="666" y="296" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0D1B2E">ClearanceLevel</text>

  <rect x="372" y="316" width="264" height="46" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="386" y="335" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">extensionAttribute10</text>
  <text x="386" y="352" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0D1B2E">AccountType</text>

  <rect x="652" y="316" width="264" height="46" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="666" y="335" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">extensionAttribute11</text>
  <text x="666" y="352" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0D1B2E">AdminTier</text>

  <rect x="372" y="372" width="264" height="46" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="386" y="391" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">extensionAttribute12</text>
  <text x="386" y="408" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0D1B2E">DeviceType</text>

  <rect x="652" y="372" width="264" height="46" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="666" y="391" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">extensionAttribute13</text>
  <text x="666" y="408" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0D1B2E">Environment</text>

  <!-- ============ Reserved + note ============ -->
  <text x="940" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5A5A5A">RESERVED</text>
  <rect x="936" y="134" width="288" height="306" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>

  <rect x="950" y="150" width="260" height="76" rx="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="966" y="176" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B7A8D">extensionAttribute14</text>
  <text x="966" y="205" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#5A5A5A">Reserved</text>

  <text x="950" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F">The last tenant-claimable slot.</text>
  <text x="950" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F">Declare facet semantics via a</text>
  <text x="950" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F">governed PR before populating.</text>

  <text x="950" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F">Each slot is claimed by exactly</text>
  <text x="950" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F">one facet; the loader rejects a</text>
  <text x="950" y="376" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F">codebook that binds two facets</text>
  <text x="950" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F">to the same slot.</text>

  <!-- ============ Compose arrow ============ -->
  <line x1="200" y1="440" x2="200" y2="486" stroke="#1E8C8C" stroke-width="3" marker-end="url(#tealArrow)"/>
  <text x="216" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#12766B">composed in order</text>

  <!-- ============ Inheritance layer ============ -->
  <rect x="52" y="490" width="1172" height="112" rx="10" fill="#0D1B2E"/>
  <text x="72" y="518" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#A9C0DC">extensionAttribute15 &#8212; OrgPath (INHERITANCE LAYER: derived on every write, never hand-authored)</text>
  <text x="72" y="558" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="25" fill="#FFFFFF">Region=NCR|Department=IT|Division=CyberOps|</text>
  <text x="72" y="585" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#A9C0DC">Trailing delimiter always present, so a subtree prefix cannot match a longer sibling name.</text>

  <!-- ============ Footer rules ============ -->
  <text x="56" y="632" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F">Composition truncates at the first unpopulated hierarchy facet &#8212; a Division without a Department is governance-layer drift, not a path.</text>
  <text x="56" y="654" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F">A stored value that does not equal the recomputation is flagged DRIFT-SEMANTIC::derived-path.</text>
  <text x="56" y="694" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7A8D">ADR-078 fifteen-facet Model C &#183; ADR-127 Hybrid-C+Path derived slot &#183; ADR-137 tenant-extension facets on slots 11&#8211;13 &#183; canon UIAO_151</text>
</svg>
