<svg viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;">
<rect width="1180" height="760" fill="#FFFFFF"/>
<defs>
  <marker id="an" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1F3A5F"/></marker>
  <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1A9E8F"/></marker>
  <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#D4860B"/></marker>
</defs>

<text x="40" y="44" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#1F3A5F">UIAO as a Gated Reporting Actuator</text>
<text x="40" y="70" font-size="15" fill="#1A9E8F">Serving status is read-only and continuous; every outward submission is human-approved at L3. Raw telemetry stays native.</text>

<!-- UIAO core -->
<rect x="44" y="205" width="232" height="160" rx="10" fill="#1F3A5F"/>
<text x="160" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">UIAO evidence core</text>
<line x1="66" y1="250" x2="254" y2="250" stroke="#5B6B7C" stroke-width="1"/>
<g font-size="11.5" fill="#C9D4E0">
  <text x="66" y="274">OSCAL AR · POA&amp;M</text>
  <text x="66" y="298">KSI verdicts · SBOM</text>
  <text x="66" y="322">ScubaDrift dispositions</text>
  <text x="66" y="346">(generation — exists today)</text>
</g>

<!-- SERVE path (read-only, no gate) -->
<text x="470" y="150" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1A9E8F">READ-ONLY — no approval (L1–L2, continuous)</text>
<line x1="276" y1="235" x2="330" y2="200" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#at)"/>
<rect x="332" y="166" width="270" height="60" rx="8" fill="#E6F5F2" stroke="#1A9E8F" stroke-width="1.5"/>
<text x="467" y="192" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F3A5F">Serve KSI status (API / URL)</text>
<text x="467" y="212" text-anchor="middle" font-size="10.5" fill="#1E293B">writes nothing to production</text>
<line x1="602" y1="196" x2="700" y2="196" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#at)"/>
<rect x="702" y="166" width="200" height="60" rx="8" fill="#EDF3F9" stroke="#1F3A5F" stroke-width="1.2"/>
<text x="802" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F3A5F">FedRAMP 20x / agency</text>
<text x="802" y="211" text-anchor="middle" font-size="10.5" fill="#1E293B">latest status endpoint</text>

<!-- GATED submission path -->
<text x="470" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8A6210">OUTWARD SUBMISSION — gated at L3</text>
<line x1="276" y1="315" x2="330" y2="333" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="332" y="312" width="250" height="60" rx="8" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
<text x="457" y="337" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3A5F">Reporting-egress adapters</text>
<text x="457" y="356" text-anchor="middle" font-size="9.5" fill="#5B6B7C">cdm · cyberscope · fedramp-repo · cisa-sbom · cisa-incident</text>
<line x1="582" y1="342" x2="626" y2="342" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>

<!-- L3 GATE -->
<rect x="628" y="304" width="150" height="76" rx="8" fill="#FBF3E4" stroke="#D4860B" stroke-width="2.5"/>
<text x="703" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#8A6210">L3 GATE</text>
<text x="703" y="352" text-anchor="middle" font-size="10" fill="#8A6210">a human approves</text>
<text x="703" y="366" text-anchor="middle" font-size="10" fill="#8A6210">each submission</text>
<line x1="778" y1="342" x2="828" y2="342" stroke="#D4860B" stroke-width="2.5" marker-end="url(#am)"/>

<!-- destinations -->
<g font-size="11.5" font-weight="bold" fill="#1F3A5F">
  <rect x="830" y="256" width="308" height="34" rx="6" fill="#EDF3F9" stroke="#1F3A5F"/><text x="846" y="278">CDM Agency Dashboard  ·  push object data</text>
  <rect x="830" y="298" width="308" height="34" rx="6" fill="#EDF3F9" stroke="#1F3A5F"/><text x="846" y="320">CyberScope → OMB  ·  submit FISMA metrics</text>
  <rect x="830" y="340" width="308" height="34" rx="6" fill="#F9EAE8" stroke="#C0392B"/><text x="846" y="362" fill="#C0392B">CISA  ·  file incident (after SOC declares)</text>
  <rect x="830" y="382" width="308" height="34" rx="6" fill="#EDF3F9" stroke="#1F3A5F"/><text x="846" y="404">FedRAMP repo  ·  file monthly package</text>
  <rect x="830" y="424" width="308" height="34" rx="6" fill="#EDF3F9" stroke="#1F3A5F"/><text x="846" y="446">CISA SBOM inbox  ·  file CycloneDX + VEX</text>
</g>
<line x1="778" y1="360" x2="810" y2="405" stroke="#D4860B" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- CLAW exception -->
<rect x="332" y="392" width="470" height="52" rx="8" fill="#F9EAE8" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="567" y="414" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#C0392B">CLAW telemetry — attest only, NOT routed through UIAO</text>
<text x="567" y="432" text-anchor="middle" font-size="10.5" fill="#1E293B">high-volume log plumbing stays on the native cloud pipe (lane discipline)</text>

<!-- Server vs SaaS band -->
<line x1="40" y1="478" x2="1140" y2="478" stroke="#C9D4E0" stroke-width="1.5"/>
<text x="40" y="508" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#1F3A5F">Where it runs decides the accreditation lift</text>

<rect x="40" y="524" width="540" height="150" rx="10" fill="#EDF3F9" stroke="#1F3A5F" stroke-width="1.5"/>
<text x="64" y="552" font-size="14" font-weight="bold" fill="#1F3A5F">Platform Server  (in-boundary) — cleanest</text>
<g font-size="12" fill="#1E293B">
  <text x="64" y="578">• Runs inside the agency ATO boundary</text>
  <text x="64" y="600">• Holds the agency's submission credentials; files on its behalf</text>
  <text x="64" y="622">• Its own integrity (SA-family, audit, break-glass) enters scope</text>
  <text x="64" y="644">• Design the actuator before any submission op goes live (memo #4 R2)</text>
</g>

<rect x="600" y="524" width="540" height="150" rx="10" fill="#FBF3E4" stroke="#D4860B" stroke-width="1.5"/>
<text x="624" y="552" font-size="14" font-weight="bold" fill="#8A6210">SaaS  (UIAO-operated) — higher lift</text>
<g font-size="12" fill="#1E293B">
  <text x="624" y="578">• Fine for generate + serve (read-only) functions</text>
  <text x="624" y="600">• Agency ConMon evidence transits the SaaS to reach CISA</text>
  <text x="624" y="622">• So the SaaS must carry its OWN FedRAMP authorization (a CSO)</text>
  <text x="624" y="644">• Data-residency + boundary controls required first</text>
</g>

<text x="40" y="706" font-size="11.5" fill="#5B6B7C">All feeds: TLS 1.2+ over FIPS 140-validated modules · outward submissions are writes to external systems → gated at L3, never autonomous.</text>
</svg>
