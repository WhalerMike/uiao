<svg viewBox="0 0 1180 600" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;">
<rect width="1180" height="600" fill="#FFFFFF"/>
<defs>
  <marker id="an" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1F3A5F"/></marker>
  <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1A9E8F"/></marker>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#C0392B"/></marker>
</defs>

<text x="40" y="44" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#1F3A5F">Is UIAO the Correct Evidence Engine? — the decision gate</text>
<text x="40" y="70" font-size="15" fill="#1A9E8F">A reversible, merit-based selection. The OSCAL boundary keeps the OrgComp corpus untouched either way.</text>

<!-- flow row -->
<rect x="40" y="110" width="200" height="80" rx="8" fill="#1F3A5F"/>
<text x="140" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">OrgComp stands alone</text>
<text x="140" y="168" text-anchor="middle" font-size="11" fill="#C9D4E0">architecture corpus (L1)</text>

<line x1="240" y1="150" x2="284" y2="150" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>

<rect x="286" y="110" width="200" height="80" rx="8" fill="#E6F5F2" stroke="#1A9E8F" stroke-width="1.5"/>
<text x="386" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A9E8F">Evidence contract</text>
<text x="386" y="168" text-anchor="middle" font-size="11" fill="#1E293B">open OSCAL boundary</text>

<line x1="486" y1="150" x2="540" y2="150" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>

<!-- diamond -->
<polygon points="640,104 726,150 640,196 554,150" fill="#FBF3E4" stroke="#D4860B" stroke-width="2"/>
<text x="640" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#8A6210">UIAO?</text>
<text x="640" y="166" text-anchor="middle" font-size="10.5" fill="#8A6210">one candidate</text>

<!-- five gates -->
<text x="905" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#5B6B7C">FIVE GATES</text>
<g font-size="12" fill="#1E293B">
  <rect x="770" y="110" width="270" height="30" rx="5" fill="#FFFFFF" stroke="#C9D4E0"/><text x="784" y="130">1  Rule-count reconciled (29 vs 14)</text>
  <rect x="770" y="146" width="270" height="30" rx="5" fill="#FFFFFF" stroke="#C9D4E0"/><text x="784" y="166">2  15 zero-coverage indicators planned</text>
  <rect x="770" y="182" width="270" height="30" rx="5" fill="#FFFFFF" stroke="#C9D4E0"/><text x="784" y="202">3  In / out-of-boundary decided</text>
  <rect x="770" y="218" width="270" height="30" rx="5" fill="#FFFFFF" stroke="#C9D4E0"/><text x="784" y="238">4  Sustainment / ownership plan</text>
  <rect x="770" y="254" width="270" height="30" rx="5" fill="#FFFFFF" stroke="#C9D4E0"/><text x="784" y="274">5  UIAO_138 (3PAO iface) → Current</text>
</g>
<line x1="726" y1="150" x2="766" y2="150" stroke="#D4860B" stroke-width="2.5" marker-end="url(#an)"/>

<!-- pass branch -->
<line x1="640" y1="196" x2="640" y2="330" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#at)"/>
<text x="660" y="266" font-size="12" font-weight="bold" fill="#1A9E8F">gates met</text>
<rect x="410" y="332" width="460" height="86" rx="10" fill="#1A9E8F"/>
<text x="640" y="366" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Conditional adopt</text>
<text x="640" y="392" text-anchor="middle" font-size="12.5" fill="#E6F5F2">best-fit incumbent · continuous evidence at the L3 ceiling</text>
<text x="640" y="410" text-anchor="middle" font-size="12.5" fill="#E6F5F2">kept swappable by the OSCAL boundary</text>

<!-- fail branch -->
<line x1="554" y1="150" x2="150" y2="150" stroke="#C0392B" stroke-width="0" />
<path d="M554,175 C400,240 300,300 250,332" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<text x="330" y="250" font-size="12" font-weight="bold" fill="#C0392B">a gate fails</text>
<rect x="40" y="332" width="330" height="86" rx="10" fill="#F9EAE8" stroke="#C0392B" stroke-width="1.5"/>
<text x="205" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">Route to another engine</text>
<text x="205" y="392" text-anchor="middle" font-size="12" fill="#1E293B">COTS GRC or native OSCAL tooling —</text>
<text x="205" y="410" text-anchor="middle" font-size="12" fill="#1E293B">zero change to the OrgComp corpus</text>

<!-- what UIAO does not resolve -->
<rect x="40" y="450" width="1100" height="118" rx="10" fill="#F3F5F8" stroke="#C9D4E0" stroke-width="1.5"/>
<text x="64" y="478" font-size="14" font-weight="bold" fill="#1F3A5F">What adopting UIAO does NOT resolve — human governance, unchanged</text>
<g font-size="12" fill="#1E293B">
  <text x="64" y="504">• The AO authorization decision (CA-6)</text>
  <text x="64" y="528">• RA-3 risk acceptance</text>
  <text x="64" y="552">• The independent security control assessment</text>
  <text x="600" y="504">• AI-in-boundary scoping call</text>
  <text x="600" y="528">• Non-compensable GCC-Moderate boundary gaps</text>
  <text x="600" y="552">UIAO is the instrument, not the authority.</text>
</g>
</svg>
