<svg viewBox="0 0 1180 700" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;">
<rect width="1180" height="700" fill="#FFFFFF"/>
<defs>
  <marker id="an" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1F3A5F"/></marker>
  <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1A9E8F"/></marker>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#C0392B"/></marker>
</defs>

<text x="40" y="44" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#1F3A5F">Continuous Monitoring — OrgComp alone vs. OrgComp + UIAO</text>
<text x="40" y="70" font-size="15" fill="#1A9E8F">Book 06 defines the CA-7 program. The engine decides whether it is a document or a running loop.</text>

<!-- LEFT: OrgComp alone -->
<rect x="40" y="100" width="480" height="470" rx="12" fill="#F3F5F8" stroke="#C9D4E0" stroke-width="1.5"/>
<text x="280" y="134" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#1F3A5F">OrgComp alone</text>
<text x="280" y="157" text-anchor="middle" font-size="12.5" fill="#5B6B7C">the program, specified — evidence by hand, point-in-time</text>

<rect x="72" y="176" width="416" height="70" rx="8" fill="#1F3A5F"/>
<text x="280" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">CA-7 program on paper</text>
<text x="280" y="226" text-anchor="middle" font-size="11" fill="#C9D4E0">strategy · cadence · artifact list · RACI · closed controls</text>

<!-- point in time stamps -->
<g font-size="11.5">
  <rect x="72" y="264" width="128" height="70" rx="8" fill="#FFFFFF" stroke="#C9D4E0"/><text x="136" y="294" text-anchor="middle" font-weight="bold" fill="#1F3A5F">Scan</text><text x="136" y="314" text-anchor="middle" fill="#5B6B7C">what passes today</text>
  <rect x="216" y="264" width="128" height="70" rx="8" fill="#FFFFFF" stroke="#C9D4E0"/><text x="280" y="294" text-anchor="middle" font-weight="bold" fill="#1F3A5F">Assemble</text><text x="280" y="314" text-anchor="middle" fill="#5B6B7C">bundle by hand</text>
  <rect x="360" y="264" width="128" height="70" rx="8" fill="#FFFFFF" stroke="#C9D4E0"/><text x="424" y="294" text-anchor="middle" font-weight="bold" fill="#1F3A5F">Track POA&amp;M</text><text x="424" y="314" text-anchor="middle" fill="#5B6B7C">manually</text>
</g>
<line x1="200" y1="299" x2="214" y2="299" stroke="#1F3A5F" stroke-width="2" marker-end="url(#an)"/>
<line x1="344" y1="299" x2="358" y2="299" stroke="#1F3A5F" stroke-width="2" marker-end="url(#an)"/>

<!-- drift between cycles -->
<rect x="72" y="360" width="416" height="80" rx="8" fill="#F9EAE8" stroke="#C0392B" stroke-width="1.5"/>
<text x="280" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">Drift accumulates between cycles</text>
<text x="280" y="412" text-anchor="middle" font-size="11.5" fill="#1E293B">passes at a moment · re-produced each tick · no lifecycle</text>
<text x="280" y="430" text-anchor="middle" font-size="11.5" fill="#1E293B">on failing policies — governed or not</text>

<text x="280" y="482" text-anchor="middle" font-size="12" font-style="italic" fill="#5B6B7C">A defensible program design — but continuity is manual labor.</text>
<text x="280" y="530" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F3A5F">Controls closed. Continuity: by hand.</text>

<!-- transform arrow -->
<line x1="522" y1="335" x2="596" y2="335" stroke="#1A9E8F" stroke-width="3" marker-end="url(#at)"/>
<text x="559" y="323" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A9E8F">add the</text>
<text x="559" y="357" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A9E8F">engine</text>

<!-- RIGHT: OrgComp + UIAO -->
<rect x="600" y="100" width="540" height="470" rx="12" fill="#EDF3F9" stroke="#1F3A5F" stroke-width="1.5"/>
<text x="870" y="134" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#1F3A5F">OrgComp + UIAO</text>
<text x="870" y="157" text-anchor="middle" font-size="12.5" fill="#5B6B7C">the same program, run as a continuous loop</text>

<!-- monthly loop chips -->
<g font-size="11.5" font-weight="bold" fill="#FFFFFF">
  <rect x="628" y="180" width="150" height="52" rx="7" fill="#1A9E8F"/><text x="703" y="205" text-anchor="middle">ScuBAGear</text><text x="703" y="221" text-anchor="middle" font-size="9" font-weight="normal" fill="#E6F5F2">assess tenant</text>
  <rect x="795" y="180" width="150" height="52" rx="7" fill="#1A9E8F"/><text x="870" y="205" text-anchor="middle">ScubaDrift</text><text x="870" y="221" text-anchor="middle" font-size="9" font-weight="normal" fill="#E6F5F2">dispositions + expiry</text>
  <rect x="962" y="180" width="150" height="52" rx="7" fill="#1A9E8F"/><text x="1037" y="205" text-anchor="middle">uiao oscal</text><text x="1037" y="221" text-anchor="middle" font-size="9" font-weight="normal" fill="#E6F5F2">AP+AR+POA&amp;M</text>
</g>
<line x1="778" y1="206" x2="793" y2="206" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#at)"/>
<line x1="945" y1="206" x2="960" y2="206" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#at)"/>
<line x1="1037" y1="232" x2="1037" y2="270" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#at)"/>

<g font-size="11.5" font-weight="bold" fill="#FFFFFF">
  <rect x="962" y="272" width="150" height="52" rx="7" fill="#1F3A5F"/><text x="1037" y="297" text-anchor="middle">POA&amp;M</text><text x="1037" y="313" text-anchor="middle" font-size="9" font-weight="normal" fill="#C9D4E0">auto-populated</text>
  <rect x="795" y="272" width="150" height="52" rx="7" fill="#1F3A5F"/><text x="870" y="297" text-anchor="middle">Sentinel</text><text x="870" y="313" text-anchor="middle" font-size="9" font-weight="normal" fill="#C9D4E0">ConMon dashboard</text>
  <rect x="628" y="272" width="150" height="52" rx="7" fill="#1F3A5F"/><text x="703" y="297" text-anchor="middle">AO monthly brief</text><text x="703" y="313" text-anchor="middle" font-size="9" font-weight="normal" fill="#C9D4E0">generated</text>
</g>
<line x1="962" y1="298" x2="947" y2="298" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="795" y1="298" x2="780" y2="298" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>
<!-- loop back -->
<path d="M703,272 C703,250 703,240 703,234" fill="none" stroke="#5B6B7C" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#at)"/>
<text x="620" y="258" font-size="9.5" fill="#5B6B7C">monthly</text>

<!-- what it produces -->
<rect x="628" y="352" width="484" height="66" rx="8" fill="#E6F5F2" stroke="#1A9E8F" stroke-width="1.5"/>
<text x="870" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A9E8F">Deterministic · reproducible · drift-detected</text>
<text x="870" y="402" text-anchor="middle" font-size="11.5" fill="#1E293B">every failure dispositioned and aging · trend auto-flags a downward drop (CA-7(3))</text>

<text x="870" y="452" text-anchor="middle" font-size="12" font-style="italic" fill="#5B6B7C">The cadence still happens — humans review exceptions, not raw output.</text>
<text x="870" y="530" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F3A5F">Controls closed. Reporting continuous (L1–L2); fixes gated (L3).</text>

<!-- unchanged either way -->
<rect x="40" y="592" width="1100" height="86" rx="10" fill="#FBF3E4" stroke="#D4860B" stroke-width="1.5"/>
<text x="64" y="620" font-size="14" font-weight="bold" fill="#8A6210">Unchanged either way — human governance, not tooling</text>
<g font-size="12" fill="#1E293B">
  <text x="64" y="646">• AO authorization decision (CA-6)</text>
  <text x="360" y="646">• Independent security control assessment</text>
  <text x="720" y="646">• RA-3 risk acceptance</text>
  <text x="64" y="668">• Non-compensable GCC-Moderate boundary gaps (registered, not resolved)</text>
  <text x="720" y="668">• "29/29" must reconcile to CR26's 46 (companion #3)</text>
</g>
</svg>
