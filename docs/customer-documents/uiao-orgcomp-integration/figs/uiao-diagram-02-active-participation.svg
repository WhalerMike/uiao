<svg viewBox="0 0 1180 660" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;">
<rect width="1180" height="660" fill="#FFFFFF"/>
<defs>
  <marker id="an" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1F3A5F"/></marker>
  <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1A9E8F"/></marker>
</defs>

<text x="40" y="44" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#1F3A5F">UIAO as an Active Participant — governs the plane, never becomes it</text>
<text x="40" y="70" font-size="15" fill="#1A9E8F">Adapter + Mode + Rung. Identity-aware via OrgPath and LocPath. Actuation stops at the L3 ceiling.</text>

<!-- Governance zone (top) -->
<rect x="40" y="100" width="1100" height="250" rx="12" fill="#EDF3F9" stroke="#1F3A5F" stroke-width="1.5"/>
<text x="66" y="128" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1F3A5F">UIAO governance plane  (observe · reconcile · emit · propose)</text>

<!-- injection chips -->
<rect x="66" y="150" width="180" height="80" rx="8" fill="#1A9E8F"/>
<text x="156" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">OrgPath</text>
<text x="156" y="203" text-anchor="middle" font-size="10.5" fill="#E6F5F2">who — admission</text>
<text x="156" y="218" text-anchor="middle" font-size="10.5" fill="#E6F5F2">subject (adr-073)</text>

<rect x="66" y="240" width="180" height="80" rx="8" fill="#1A9E8F"/>
<text x="156" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">LocPath</text>
<text x="156" y="293" text-anchor="middle" font-size="10.5" fill="#E6F5F2">where — transport /</text>
<text x="156" y="308" text-anchor="middle" font-size="10.5" fill="#E6F5F2">TIC class (adr-102)</text>

<line x1="246" y1="235" x2="286" y2="235" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#at)"/>

<!-- adapter -->
<rect x="288" y="150" width="250" height="170" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
<text x="413" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">UIAO adapter</text>
<text x="413" y="196" text-anchor="middle" font-size="10.5" fill="#5B6B7C">sdwan-fabric · network-aaa ·</text>
<text x="413" y="211" text-anchor="middle" font-size="10.5" fill="#5B6B7C">sase-egress · flow-telemetry</text>
<g font-size="11.5" font-weight="bold">
  <rect x="308" y="226" width="210" height="24" rx="5" fill="#E6F5F2"/><text x="413" y="243" text-anchor="middle" fill="#1A9E8F">Observe → Reconcile → Emit</text>
  <rect x="308" y="256" width="210" height="24" rx="5" fill="#FBF3E4"/><text x="413" y="273" text-anchor="middle" fill="#8A6210">Gated-actuate  (L3, propose)</text>
</g>
<text x="413" y="303" text-anchor="middle" font-size="10.5" fill="#5B6B7C">emits drift + slot evidence → OSCAL</text>

<!-- L0-L4 ladder -->
<text x="700" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#5B6B7C">ACTUATION LADDER</text>
<g font-size="12">
  <rect x="590" y="156" width="220" height="26" rx="5" fill="#F3F5F8" stroke="#C9D4E0"/><text x="600" y="174" fill="#1E293B">L0  Record</text>
  <rect x="590" y="186" width="220" height="26" rx="5" fill="#F3F5F8" stroke="#C9D4E0"/><text x="600" y="204" fill="#1E293B">L1  Observe</text>
  <rect x="590" y="216" width="220" height="26" rx="5" fill="#E6F5F2" stroke="#1A9E8F"/><text x="600" y="234" fill="#1A9E8F">L2  Advise</text>
  <rect x="590" y="246" width="220" height="26" rx="5" fill="#FBF3E4" stroke="#D4860B" stroke-width="2"/><text x="600" y="264" font-weight="bold" fill="#8A6210">L3  Gated  ◄ federal ceiling</text>
  <rect x="590" y="276" width="220" height="26" rx="5" fill="#F9EAE8" stroke="#C0392B" stroke-dasharray="5 3"/><text x="600" y="294" fill="#C0392B">L4  Autonomous  (not at Moderate)</text>
</g>

<!-- OSCAL evidence sink -->
<rect x="860" y="176" width="250" height="120" rx="10" fill="#1F3A5F"/>
<text x="985" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">OSCAL AR + ConMon</text>
<text x="985" y="236" text-anchor="middle" font-size="11" fill="#C9D4E0">evidence re-emitted on the</text>
<text x="985" y="253" text-anchor="middle" font-size="11" fill="#C9D4E0">CA-7 cadence</text>
<text x="985" y="278" text-anchor="middle" font-size="11" fill="#C9D4E0">a human approves before enforce</text>
<line x1="538" y1="266" x2="588" y2="266" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#at)"/>
<line x1="810" y1="235" x2="858" y2="235" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#at)"/>

<!-- the line UIAO does not cross -->
<line x1="40" y1="382" x2="1140" y2="382" stroke="#C0392B" stroke-width="3" stroke-dasharray="12 7"/>
<rect x="430" y="366" width="320" height="32" rx="16" fill="#F9EAE8" stroke="#C0392B" stroke-width="1.5"/>
<text x="590" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">The line UIAO does not cross</text>

<!-- Data plane (bottom) -->
<rect x="40" y="414" width="1100" height="150" rx="12" fill="#F3F5F8" stroke="#C9D4E0" stroke-width="1.5"/>
<text x="66" y="442" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1F3A5F">OrgComp data plane  (enforces — UIAO never holds a packet)</text>
<g font-size="12.5" font-weight="bold" fill="#FFFFFF">
  <rect x="66" y="458" width="200" height="84" rx="8" fill="#1F3A5F"/><text x="166" y="496" text-anchor="middle">AAA / RADIUS server</text><text x="166" y="518" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#C9D4E0">terminates 802.1X</text>
  <rect x="286" y="458" width="200" height="84" rx="8" fill="#1F3A5F"/><text x="386" y="496" text-anchor="middle">SD-WAN fabric</text><text x="386" y="518" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#C9D4E0">routes / terminates tunnels</text>
  <rect x="506" y="458" width="200" height="84" rx="8" fill="#1F3A5F"/><text x="606" y="496" text-anchor="middle">SASE / PEP</text><text x="606" y="518" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#C9D4E0">inline inspection</text>
  <rect x="726" y="458" width="200" height="84" rx="8" fill="#1F3A5F"/><text x="826" y="496" text-anchor="middle">DDI resolver</text><text x="826" y="518" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#C9D4E0">authoritative DNS/IPAM</text>
  <rect x="946" y="458" width="170" height="84" rx="8" fill="#1F3A5F"/><text x="1031" y="496" text-anchor="middle">SIEM</text><text x="1031" y="518" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#C9D4E0">correlates feeds</text>
</g>
</svg>
