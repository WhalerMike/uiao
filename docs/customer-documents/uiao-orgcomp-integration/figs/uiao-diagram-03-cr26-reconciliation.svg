<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;">
<rect width="1180" height="640" fill="#FFFFFF"/>
<defs>
  <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5B6B7C"/></marker>
</defs>

<text x="40" y="44" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#1F3A5F">The KSI-Count Reconciliation (OrgComp open item #1)</text>
<text x="40" y="70" font-size="15" fill="#1A9E8F">Three numbers that do not yet agree — and the real coverage underneath them.</text>

<!-- three count columns -->
<rect x="40" y="100" width="350" height="150" rx="10" fill="#F3F5F8" stroke="#C9D4E0" stroke-width="1.5"/>
<text x="215" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">OrgComp roadmap (draft)</text>
<text x="215" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#C0392B">29</text>
<text x="215" y="216" text-anchor="middle" font-size="12.5" fill="#1E293B">rules — claims "29/29 satisfied"</text>
<text x="215" y="236" text-anchor="middle" font-size="11" fill="#5B6B7C">catalog guessed at ~56–63</text>

<rect x="415" y="100" width="350" height="150" rx="10" fill="#F3F5F8" stroke="#C9D4E0" stroke-width="1.5"/>
<text x="590" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">UIAO canon (current)</text>
<text x="590" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#1F3A5F">14</text>
<text x="590" y="216" text-anchor="middle" font-size="12.5" fill="#1E293B">local KSI rules (KSI-001…014)</text>
<text x="590" y="236" text-anchor="middle" font-size="11" fill="#5B6B7C">UIAO_137 forward/reverse map</text>

<rect x="790" y="100" width="350" height="150" rx="10" fill="#E6F5F2" stroke="#1A9E8F" stroke-width="2"/>
<text x="965" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A9E8F">CR26 official JSON</text>
<text x="965" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#1A9E8F">46</text>
<text x="965" y="216" text-anchor="middle" font-size="12.5" fill="#1E293B">KSI indicators, 10 themes</text>
<text x="965" y="236" text-anchor="middle" font-size="11" fill="#5B6B7C">version 2026.06.24.01 (verified)</text>

<text x="590" y="286" text-anchor="middle" font-size="13" font-style="italic" fill="#C0392B">"29/29 satisfied" is a claim about an internal rule set — not coverage of the 46-indicator surface.</text>

<!-- coverage bar -->
<text x="40" y="332" font-size="15" font-weight="bold" fill="#1F3A5F">Actual CR26 indicator coverage — 46 indicators</text>
<text x="40" y="354" font-size="12.5" fill="#5B6B7C">Covered = at least one local KSI rule contributes evidence (UIAO_137 §4)</text>

<!-- 46 cells: 21 teal covered, 25 red residual (15 zero-coverage in 5 themes) -->
<g>
  <!-- covered 21 -->
  <rect x="40" y="372" width="483" height="60" fill="#1A9E8F"/>
  <text x="281" y="400" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">21 covered  (~46%)</text>
  <text x="281" y="420" text-anchor="middle" font-size="11" fill="#E6F5F2">IAM 6/6 · CMT 4/4 scaffold · SVC 4/8 · CNA 2/8 · MLA 2/5</text>
  <!-- residual 25 -->
  <rect x="523" y="372" width="230" height="60" fill="#D4860B"/>
  <text x="638" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">10 partial-theme</text>
  <text x="638" y="418" text-anchor="middle" font-size="11" fill="#FBF3E4">CNA · MLA · SVC gaps</text>
  <rect x="753" y="372" width="345" height="60" fill="#C0392B"/>
  <text x="925" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">15 zero-coverage — 5 whole themes</text>
  <text x="925" y="418" text-anchor="middle" font-size="11" fill="#F9EAE8">CED · INR · PIY · RPL · SCR</text>
</g>
<text x="1108" y="408" font-size="13" font-weight="bold" fill="#1F3A5F"> </text>

<!-- residual bracket -->
<line x1="523" y1="444" x2="1098" y2="444" stroke="#5B6B7C" stroke-width="1.5"/>
<text x="810" y="462" text-anchor="middle" font-size="12" fill="#5B6B7C">25 residual indicators — the actual work to close open item #1</text>

<!-- what's already done vs residual -->
<rect x="40" y="484" width="530" height="120" rx="10" fill="#E6F5F2" stroke="#1A9E8F" stroke-width="1.5"/>
<text x="64" y="512" font-size="14" font-weight="bold" fill="#1A9E8F">Already resolved in UIAO canon</text>
<text x="64" y="536" font-size="12" fill="#1E293B">• Official 46-indicator catalog pinned (UIAO_207, ADR-126)</text>
<text x="64" y="558" font-size="12" fill="#1E293B">• Forward + reverse KSI map done (UIAO_137)</text>
<text x="64" y="580" font-size="12" fill="#1E293B">• 17-category FRR surface assessed; drift-gated</text>

<rect x="590" y="484" width="550" height="120" rx="10" fill="#F9EAE8" stroke="#C0392B" stroke-width="1.5"/>
<text x="614" y="512" font-size="14" font-weight="bold" fill="#C0392B">Residual — before any external "N/N satisfied"</text>
<text x="614" y="536" font-size="12" fill="#1E293B">• Reconcile the count itself (29 vs 14 rule files)</text>
<text x="614" y="558" font-size="12" fill="#1E293B">• Author the 15 zero-coverage indicators</text>
<text x="614" y="580" font-size="12" fill="#1E293B">• Close 6 FRR blockers due 2027-01-01</text>
</svg>
