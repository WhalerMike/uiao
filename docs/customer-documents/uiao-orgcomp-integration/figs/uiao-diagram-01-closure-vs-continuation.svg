<svg viewBox="0 0 1180 660" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;">
<rect width="1180" height="660" fill="#FFFFFF"/>
<defs>
  <marker id="an" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1F3A5F"/></marker>
  <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1A9E8F"/></marker>
  <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5B6B7C"/></marker>
</defs>

<text x="40" y="44" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#1F3A5F">Closure vs. Continuation</text>
<text x="40" y="70" font-size="15" fill="#1A9E8F">AAN closes a control once, by architecture. UIAO keeps it closed — on the drift loop, at a human-approved ceiling.</text>

<!-- LEFT: closure -->
<rect x="40" y="110" width="410" height="470" rx="12" fill="#F3F5F8" stroke="#C9D4E0" stroke-width="1.5"/>
<text x="245" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#1F3A5F">CLOSURE  (once)</text>
<text x="245" y="170" text-anchor="middle" font-size="12.5" fill="#5B6B7C">the AAN architecture supplies the mechanism</text>

<rect x="95" y="200" width="300" height="70" rx="8" fill="#1F3A5F"/>
<text x="245" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">AAN mechanism</text>
<text x="245" y="252" text-anchor="middle" font-size="11" fill="#C9D4E0">802.1X · DDI · SD-WAN · Purview · …</text>

<line x1="245" y1="270" x2="245" y2="312" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>

<rect x="95" y="314" width="300" height="66" rx="8" fill="#E6F5F2" stroke="#1A9E8F" stroke-width="1.5"/>
<text x="245" y="343" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A9E8F">Control satisfied</text>
<text x="245" y="364" text-anchor="middle" font-size="11" fill="#1E293B">proven once by a slot record</text>

<rect x="95" y="470" width="300" height="80" rx="8" fill="#F9EAE8" stroke="#C0392B" stroke-width="1.5"/>
<text x="245" y="500" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#C0392B">A point-in-time scan cannot</text>
<text x="245" y="520" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#C0392B">keep it closed —</text>
<text x="245" y="540" text-anchor="middle" font-size="11.5" fill="#1E293B">it measures drift, it can't author state</text>

<!-- hand-off arrow -->
<line x1="450" y1="345" x2="520" y2="345" stroke="#5B6B7C" stroke-width="3" marker-end="url(#am)"/>
<text x="485" y="333" text-anchor="middle" font-size="11" fill="#5B6B7C">hand-off</text>

<!-- RIGHT: continuation -->
<rect x="525" y="110" width="615" height="470" rx="12" fill="#EDF3F9" stroke="#1F3A5F" stroke-width="1.5"/>
<text x="832" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#1F3A5F">CONTINUATION  (forever)</text>
<text x="832" y="170" text-anchor="middle" font-size="12.5" fill="#5B6B7C">UIAO re-checks and re-attests on the drift loop</text>

<!-- six-phase loop as a row of chips -->
<g font-size="12.5" font-weight="bold">
  <rect x="555" y="200" width="132" height="54" rx="7" fill="#1A9E8F"/><text x="621" y="232" text-anchor="middle" fill="#FFFFFF">Snapshot</text>
  <rect x="705" y="200" width="132" height="54" rx="7" fill="#1A9E8F"/><text x="771" y="232" text-anchor="middle" fill="#FFFFFF">Compare</text>
  <rect x="855" y="200" width="132" height="54" rx="7" fill="#1A9E8F"/><text x="921" y="232" text-anchor="middle" fill="#FFFFFF">Classify</text>
</g>
<line x1="687" y1="227" x2="703" y2="227" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#at)"/>
<line x1="837" y1="227" x2="853" y2="227" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#at)"/>
<line x1="987" y1="227" x2="1050" y2="227" stroke="#1A9E8F" stroke-width="2.5"/>
<line x1="1050" y1="227" x2="1050" y2="290" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#at)"/>

<g font-size="12.5" font-weight="bold">
  <rect x="855" y="292" width="132" height="54" rx="7" fill="#1A9E8F"/><text x="921" y="324" text-anchor="middle" fill="#FFFFFF">Alert</text>
  <rect x="705" y="292" width="132" height="54" rx="7" fill="#D4860B"/><text x="771" y="318" text-anchor="middle" fill="#FFFFFF">Remediate</text>
  <rect x="555" y="292" width="132" height="54" rx="7" fill="#1A9E8F"/><text x="621" y="324" text-anchor="middle" fill="#FFFFFF">Verify</text>
</g>
<text x="771" y="336" text-anchor="middle" font-size="9" fill="#FBF3E4">(gated, L3)</text>
<line x1="855" y1="319" x2="839" y2="319" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#at)"/>
<line x1="705" y1="319" x2="689" y2="319" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#at)"/>
<line x1="621" y1="292" x2="621" y2="270" stroke="#5B6B7C" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="500" y="200" font-size="10" fill="#5B6B7C"> </text>

<!-- L3 ceiling bar -->
<rect x="555" y="378" width="550" height="42" rx="7" fill="#FBF3E4" stroke="#D4860B" stroke-width="1.5"/>
<text x="830" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A6210">Actuation held at the federal L3 ceiling — propose, a human disposes</text>

<!-- outputs -->
<line x1="621" y1="346" x2="621" y2="452" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="555" y="454" width="255" height="96" rx="8" fill="#1F3A5F"/>
<text x="682" y="486" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">OSCAL AR re-emitted</text>
<text x="682" y="508" text-anchor="middle" font-size="11.5" fill="#C9D4E0">uiao oscal bundle</text>
<text x="682" y="528" text-anchor="middle" font-size="11.5" fill="#C9D4E0">monthly / quarterly / annual</text>

<rect x="835" y="454" width="270" height="96" rx="8" fill="#E6F5F2" stroke="#1A9E8F" stroke-width="1.5"/>
<text x="970" y="486" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A9E8F">CA-7 ConMon program</text>
<text x="970" y="508" text-anchor="middle" font-size="11.5" fill="#1E293B">the monitoring output IS</text>
<text x="970" y="527" text-anchor="middle" font-size="11.5" fill="#1E293B">the evidence stream</text>

<text x="40" y="618" font-size="12" fill="#5B6B7C">For the five KSI themes with no local rule yet (CED · INR · PIY · RPL · SCR), continuation is static OSCAL emission — a named authoring backlog, not live drift detection.</text>
</svg>
