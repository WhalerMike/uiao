<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2a6c">KSI Framework -- RFC-0005 Categories and Example Indicators</text>

  <!-- Root node -->
  <rect x="305" y="42" width="250" height="50" rx="8" fill="#1a2a6c"/>
  <text x="430" y="62" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">RFC-0005</text>
  <text x="430" y="80" text-anchor="middle" font-size="11" fill="#ffffff">KSI Framework</text>

  <!-- Lines from root to categories -->
  <line x1="430" y1="92" x2="105" y2="165" stroke="#1a2a6c" stroke-width="1.5"/>
  <line x1="430" y1="92" x2="295" y2="165" stroke="#1a2a6c" stroke-width="1.5"/>
  <line x1="430" y1="92" x2="565" y2="165" stroke="#1a2a6c" stroke-width="1.5"/>
  <line x1="430" y1="92" x2="755" y2="165" stroke="#1a2a6c" stroke-width="1.5"/>

  <!-- Category 1: Identity and Access -->
  <rect x="30" y="165" width="150" height="48" rx="6" fill="#1a9e8f"/>
  <text x="105" y="185" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Identity and</text>
  <text x="105" y="200" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Access</text>

  <!-- Category 2: Data Protection -->
  <rect x="220" y="165" width="150" height="48" rx="6" fill="#1a9e8f"/>
  <text x="295" y="185" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Data</text>
  <text x="295" y="200" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Protection</text>

  <!-- Category 3: Vulnerability Mgmt -->
  <rect x="490" y="165" width="150" height="48" rx="6" fill="#1a9e8f"/>
  <text x="565" y="185" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Vulnerability</text>
  <text x="565" y="200" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Management</text>

  <!-- Category 4: Supply Chain -->
  <rect x="680" y="165" width="150" height="48" rx="6" fill="#1a9e8f"/>
  <text x="755" y="185" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Supply</text>
  <text x="755" y="200" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Chain</text>

  <!-- Lines from categories to KSIs row 1 -->
  <line x1="105" y1="213" x2="105" y2="295" stroke="#cccccc" stroke-width="1"/>
  <line x1="295" y1="213" x2="295" y2="295" stroke="#cccccc" stroke-width="1"/>
  <line x1="565" y1="213" x2="565" y2="295" stroke="#cccccc" stroke-width="1"/>
  <line x1="755" y1="213" x2="755" y2="295" stroke="#cccccc" stroke-width="1"/>

  <!-- KSI Row 1 -->
  <rect x="30" y="295" width="150" height="52" rx="5" fill="#ffffff" stroke="#1a2a6c" stroke-width="1.5"/>
  <text x="105" y="315" text-anchor="middle" font-size="11" fill="#1a2a6c">MFA Coverage</text>
  <text x="105" y="332" text-anchor="middle" font-size="10" fill="#555555">100% threshold</text>
  <rect x="148" y="296" width="30" height="18" rx="3" fill="#1a9e8f"/>
  <text x="163" y="309" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">PASS</text>

  <rect x="220" y="295" width="150" height="52" rx="5" fill="#ffffff" stroke="#1a2a6c" stroke-width="1.5"/>
  <text x="295" y="315" text-anchor="middle" font-size="11" fill="#1a2a6c">Encryption at Rest</text>
  <text x="295" y="332" text-anchor="middle" font-size="10" fill="#555555">100% threshold</text>
  <rect x="338" y="296" width="30" height="18" rx="3" fill="#1a9e8f"/>
  <text x="353" y="309" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">PASS</text>

  <rect x="490" y="295" width="150" height="52" rx="5" fill="#ffffff" stroke="#1a2a6c" stroke-width="1.5"/>
  <text x="565" y="315" text-anchor="middle" font-size="11" fill="#1a2a6c">CVE Patch Time</text>
  <text x="565" y="332" text-anchor="middle" font-size="10" fill="#555555">&lt;15 days threshold</text>
  <rect x="608" y="296" width="30" height="18" rx="3" fill="#1a9e8f"/>
  <text x="623" y="309" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">PASS</text>

  <rect x="680" y="295" width="150" height="52" rx="5" fill="#ffffff" stroke="#1a2a6c" stroke-width="1.5"/>
  <text x="755" y="315" text-anchor="middle" font-size="11" fill="#1a2a6c">SBOM Currency</text>
  <text x="755" y="332" text-anchor="middle" font-size="10" fill="#555555">30-day threshold</text>
  <rect x="798" y="296" width="30" height="18" rx="3" fill="#d4a017"/>
  <text x="813" y="309" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">FAIL</text>

  <!-- Lines to Row 2 -->
  <line x1="105" y1="347" x2="105" y2="415" stroke="#cccccc" stroke-width="1"/>
  <line x1="295" y1="347" x2="295" y2="415" stroke="#cccccc" stroke-width="1"/>
  <line x1="565" y1="347" x2="565" y2="415" stroke="#cccccc" stroke-width="1"/>
  <line x1="755" y1="347" x2="755" y2="415" stroke="#cccccc" stroke-width="1"/>

  <!-- KSI Row 2 -->
  <rect x="30" y="415" width="150" height="52" rx="5" fill="#ffffff" stroke="#1a2a6c" stroke-width="1.5"/>
  <text x="105" y="435" text-anchor="middle" font-size="11" fill="#1a2a6c">Inactive Accounts</text>
  <text x="105" y="452" text-anchor="middle" font-size="10" fill="#555555">&lt;2% threshold</text>
  <rect x="148" y="416" width="30" height="18" rx="3" fill="#1a9e8f"/>
  <text x="163" y="429" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">PASS</text>

  <rect x="220" y="415" width="150" height="52" rx="5" fill="#ffffff" stroke="#1a2a6c" stroke-width="1.5"/>
  <text x="295" y="435" text-anchor="middle" font-size="11" fill="#1a2a6c">TLS Compliance</text>
  <text x="295" y="452" text-anchor="middle" font-size="10" fill="#555555">100% threshold</text>
  <rect x="338" y="416" width="30" height="18" rx="3" fill="#d4a017"/>
  <text x="353" y="429" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">FAIL</text>

  <rect x="490" y="415" width="150" height="52" rx="5" fill="#ffffff" stroke="#1a2a6c" stroke-width="1.5"/>
  <text x="565" y="435" text-anchor="middle" font-size="11" fill="#1a2a6c">Scan Freshness</text>
  <text x="565" y="452" text-anchor="middle" font-size="10" fill="#555555">&lt;7 days threshold</text>
  <rect x="608" y="416" width="30" height="18" rx="3" fill="#1a9e8f"/>
  <text x="623" y="429" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">PASS</text>

  <rect x="680" y="415" width="150" height="52" rx="5" fill="#ffffff" stroke="#1a2a6c" stroke-width="1.5"/>
  <text x="755" y="435" text-anchor="middle" font-size="11" fill="#1a2a6c">Vendor Review</text>
  <text x="755" y="452" text-anchor="middle" font-size="10" fill="#555555">Annual threshold</text>
  <rect x="798" y="416" width="30" height="18" rx="3" fill="#1a9e8f"/>
  <text x="813" y="429" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">PASS</text>

  <text x="430" y="500" text-anchor="middle" font-size="11" fill="#888888">RFC-0005 defines pass thresholds; RFC-0014 requires machine generation; RFC-0024 defines OSCAL format</text>
</svg>
