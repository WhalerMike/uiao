<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- White background -->
  <rect width="900" height="500" fill="white"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a4a">Federal AI Machine-Identity Lifecycle</text>
  <text x="450" y="58" text-anchor="middle" font-size="11" fill="#444">OMB inventory development_stage → identity governance events</text>

  <!-- Stage lane headers -->
  <!-- PRE-DEPLOYMENT (grey) -->
  <rect x="30" y="75" width="185" height="46" rx="6" fill="#9ca3af"/>
  <text x="122" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="white">PRE-DEPLOYMENT</text>
  <text x="122" y="112" text-anchor="middle" font-size="10" fill="white">development_stage = pre-deployment</text>

  <!-- PILOT (amber) -->
  <rect x="240" y="75" width="185" height="46" rx="6" fill="#d97706"/>
  <text x="332" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="white">PILOT</text>
  <text x="332" y="112" text-anchor="middle" font-size="10" fill="white">development_stage = pilot</text>

  <!-- DEPLOYED (teal) -->
  <rect x="450" y="75" width="185" height="46" rx="6" fill="#0d7a7a"/>
  <text x="542" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="white">DEPLOYED</text>
  <text x="542" y="112" text-anchor="middle" font-size="10" fill="white">development_stage = deployed</text>

  <!-- RETIRED (navy) -->
  <rect x="660" y="75" width="185" height="46" rx="6" fill="#1a2a4a"/>
  <text x="752" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="white">RETIRED</text>
  <text x="752" y="112" text-anchor="middle" font-size="10" fill="white">development_stage = retired</text>

  <!-- Transition arrows between stages -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>
  <line x1="215" y1="98" x2="238" y2="98" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="425" y1="98" x2="448" y2="98" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="635" y1="98" x2="658" y2="98" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- JML labels above arrows -->
  <text x="226" y="92" text-anchor="middle" font-size="9" fill="#b45309">JOINER</text>
  <text x="436" y="92" text-anchor="middle" font-size="9" fill="#0d7a7a">MOVER</text>
  <text x="646" y="92" text-anchor="middle" font-size="9" fill="#c0392b">LEAVER</text>

  <!-- Identity event boxes per stage -->
  <!-- PRE-DEPLOYMENT events -->
  <rect x="35" y="140" width="175" height="130" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="122" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Identity Events</text>
  <text x="47" y="175" font-size="9.5" fill="#374151">• OrgPath record created</text>
  <text x="47" y="190" font-size="9.5" fill="#374151">• Owner assigned to bureau</text>
  <text x="47" y="205" font-size="9.5" fill="#374151">• Credential slot reserved</text>
  <text x="47" y="220" font-size="9.5" fill="#374151">• ATO-pending flag set</text>
  <text x="47" y="235" font-size="9.5" fill="#374151">• Shadow-AI scan baseline</text>
  <text x="47" y="252" font-size="9.5" fill="#9ca3af" font-style="italic">No active credential issued</text>

  <!-- PILOT events -->
  <rect x="245" y="140" width="175" height="130" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="332" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Identity Events</text>
  <text x="257" y="175" font-size="9.5" fill="#374151">• Provisional credential issued</text>
  <text x="257" y="190" font-size="9.5" fill="#374151">• Scope limited to pilot env</text>
  <text x="257" y="205" font-size="9.5" fill="#374151">• Time-bounded expiry set</text>
  <text x="257" y="220" font-size="9.5" fill="#374151">• ATO-provisional flag set</text>
  <text x="257" y="235" font-size="9.5" fill="#374151">• Access review scheduled</text>
  <text x="257" y="252" font-size="9.5" fill="#d97706" font-style="italic">Rotation clock starts</text>

  <!-- DEPLOYED events -->
  <rect x="455" y="140" width="175" height="130" rx="5" fill="#f0fdfa" stroke="#0d7a7a" stroke-width="1.5"/>
  <text x="542" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Identity Events</text>
  <text x="467" y="175" font-size="9.5" fill="#374151">• Full credential activated</text>
  <text x="467" y="190" font-size="9.5" fill="#374151">• Rotation on policy schedule</text>
  <text x="467" y="205" font-size="9.5" fill="#374151">• ATO renewal → MOVER</text>
  <text x="467" y="220" font-size="9.5" fill="#374151">• Bureau transfer → MOVER</text>
  <text x="467" y="235" font-size="9.5" fill="#374151">• Continuous drift monitoring</text>
  <text x="467" y="252" font-size="9.5" fill="#0d7a7a" font-style="italic">Periodic access reviews</text>

  <!-- RETIRED events -->
  <rect x="665" y="140" width="175" height="130" rx="5" fill="#f8fafc" stroke="#1a2a4a" stroke-width="1.5"/>
  <text x="752" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Identity Events</text>
  <text x="677" y="175" font-size="9.5" fill="#374151">• Credential revoked</text>
  <text x="677" y="190" font-size="9.5" fill="#374151">• Permissions removed</text>
  <text x="677" y="205" font-size="9.5" fill="#374151">• OrgPath record archived</text>
  <text x="677" y="220" font-size="9.5" fill="#374151">• Audit trail closed</text>
  <text x="677" y="235" font-size="9.5" fill="#374151">• Evidence bundle retained</text>
  <text x="677" y="252" font-size="9.5" fill="#c0392b" font-style="italic">7-year retention starts</text>

  <!-- OMB Inventory vintage diff row -->
  <rect x="30" y="295" width="840" height="52" rx="6" fill="#eef2f7" stroke="#1a2a4a" stroke-width="1.5"/>
  <text x="450" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a4a">OMB Inventory Annual Vintage Diff</text>
  <text x="450" y="332" text-anchor="middle" font-size="10" fill="#374151">New entry in vintage → JOINER event   |   Stage change across vintages → MOVER event   |   Entry removed from vintage → LEAVER event</text>

  <!-- Vertical connector lines from OMB box to stage boxes -->
  <line x1="122" y1="295" x2="122" y2="270" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="332" y1="295" x2="332" y2="270" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="542" y1="295" x2="542" y2="270" stroke="#0d7a7a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="752" y1="295" x2="752" y2="270" stroke="#1a2a4a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- SailPoint adapter box -->
  <rect x="220" y="375" width="460" height="80" rx="8" fill="#1a2a4a" stroke="#0d7a7a" stroke-width="2"/>
  <text x="450" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="white">sailpoint-machine-identity adapter</text>
  <text x="450" y="416" text-anchor="middle" font-size="10" fill="#93c5fd">Discovery feed: OMB inventory (annual)   |   Phase: phase-planning   |   Status: reserved</text>
  <text x="450" y="434" text-anchor="middle" font-size="10" fill="#93c5fd">Outputs: machine-identity-inventory.json · machine-identity-ownership-graph.json</text>
  <text x="450" y="450" text-anchor="middle" font-size="9" fill="#6ee7b7">JML event generation · Evidence bundle output · OrgPath stamp</text>

  <!-- Arrow from adapter box up to OMB row -->
  <defs>
    <marker id="arrowup" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 6, 4 0, 8 6" fill="#0d7a7a"/>
    </marker>
  </defs>
  <line x1="450" y1="375" x2="450" y2="349" stroke="#0d7a7a" stroke-width="2" marker-end="url(#arrowup)"/>

  <!-- ADR labels -->
  <text x="122" y="490" text-anchor="middle" font-size="8.5" fill="#6b7280">ADR-109 §2</text>
  <text x="332" y="490" text-anchor="middle" font-size="8.5" fill="#6b7280">ADR-109 §2</text>
  <text x="542" y="490" text-anchor="middle" font-size="8.5" fill="#6b7280">ADR-054 reciprocity</text>
  <text x="752" y="490" text-anchor="middle" font-size="8.5" fill="#6b7280">ADR-059 leaver</text>
</svg>
