<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a2a6c"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a9e8f"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="430" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2a6c">RTLS Observational Layer — Source Types and Governance Role</text>

  <!-- GOVERNED LAYER (bottom) -->
  <rect x="30" y="400" width="800" height="100" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="2.5" rx="6"/>
  <rect x="30" y="400" width="800" height="30" fill="#1a2a6c" rx="6"/>
  <rect x="30" y="418" width="800" height="12" fill="#1a2a6c"/>
  <text x="430" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">GOVERNED LAYER — Primary LocPath Node (System of Record)</text>

  <rect x="55" y="436" width="200" height="52" fill="#ffffff" stroke="#1a9e8f" stroke-width="1.5" rx="3"/>
  <text x="155" y="454" text-anchor="middle" font-size="10" fill="#1a2a6c">civicAddress + floorDesignation</text>
  <text x="155" y="468" text-anchor="middle" font-size="10" fill="#1a2a6c">locationDescription</text>
  <text x="155" y="482" text-anchor="middle" font-size="9" fill="#555">Populated by facilities governance</text>

  <rect x="290" y="436" width="180" height="52" fill="#ffffff" stroke="#1a9e8f" stroke-width="1.5" rx="3"/>
  <text x="380" y="454" text-anchor="middle" font-size="10" fill="#1a2a6c">e911 block</text>
  <text x="380" y="468" text-anchor="middle" font-size="10" fill="#1a9e8f">dispatchableLocationRequired: true</text>
  <text x="380" y="482" text-anchor="middle" font-size="9" fill="#555">PSAP-validated</text>

  <!-- Gold badge -->
  <rect x="498" y="440" width="170" height="28" fill="#d4a017" rx="3"/>
  <text x="583" y="459" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">⭐ 911 Transmission Source</text>

  <rect x="686" y="436" width="120" height="52" fill="#fff3f3" stroke="#c0392b" stroke-width="1.5" rx="3" stroke-dasharray="5,3"/>
  <text x="746" y="454" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">✗ Cannot be</text>
  <text x="746" y="468" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">replaced by</text>
  <text x="746" y="482" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">RTLS feeds</text>

  <!-- OBSERVATIONAL LAYER (middle) -->
  <rect x="30" y="195" width="800" height="185" fill="#f0fffc" stroke="#1a9e8f" stroke-width="2" rx="6"/>
  <rect x="30" y="195" width="800" height="30" fill="#1a9e8f" rx="6"/>
  <rect x="30" y="213" width="800" height="12" fill="#1a9e8f"/>
  <text x="430" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">OBSERVATIONAL LAYER — Dynamic Location Context</text>

  <!-- UWB -->
  <rect x="45" y="238" width="140" height="120" fill="#ffffff" stroke="#1a9e8f" stroke-width="1.5" rx="4"/>
  <rect x="45" y="238" width="140" height="26" fill="#1a2a6c" rx="4"/>
  <rect x="45" y="252" width="140" height="12" fill="#1a2a6c"/>
  <text x="115" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">UWB</text>
  <text x="115" y="278" text-anchor="middle" font-size="10" fill="#1a2a6c">Ultra-Wideband</text>
  <text x="115" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a9e8f">Precision: cm</text>
  <text x="115" y="310" text-anchor="middle" font-size="9" fill="#555">Time-of-flight anchors</text>
  <text x="115" y="324" text-anchor="middle" font-size="9" fill="#555">Dense install required</text>
  <text x="115" y="340" text-anchor="middle" font-size="9" fill="#555">Best for asset tracking</text>

  <!-- Active RFID -->
  <rect x="200" y="238" width="140" height="120" fill="#ffffff" stroke="#1a9e8f" stroke-width="1.5" rx="4"/>
  <rect x="200" y="238" width="140" height="26" fill="#1a2a6c" rx="4"/>
  <rect x="200" y="252" width="140" height="12" fill="#1a2a6c"/>
  <text x="270" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Active RFID</text>
  <text x="270" y="278" text-anchor="middle" font-size="10" fill="#1a2a6c">Battery-powered tags</text>
  <text x="270" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a9e8f">Precision: room/zone</text>
  <text x="270" y="310" text-anchor="middle" font-size="9" fill="#555">Zone boundary readers</text>
  <text x="270" y="324" text-anchor="middle" font-size="9" fill="#555">Last-zone known</text>
  <text x="270" y="340" text-anchor="middle" font-size="9" fill="#555">Low infra overhead</text>

  <!-- BLE 5.1 -->
  <rect x="355" y="238" width="155" height="120" fill="#ffffff" stroke="#1a9e8f" stroke-width="1.5" rx="4"/>
  <rect x="355" y="238" width="155" height="26" fill="#1a2a6c" rx="4"/>
  <rect x="355" y="252" width="155" height="12" fill="#1a2a6c"/>
  <text x="432" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">BLE 5.1 AoA/AoD</text>
  <text x="432" y="278" text-anchor="middle" font-size="10" fill="#1a2a6c">Angle-of-arrival beacons</text>
  <text x="432" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a9e8f">Precision: room-level</text>
  <text x="432" y="310" text-anchor="middle" font-size="9" fill="#555">Reuses BLE infra</text>
  <text x="432" y="324" text-anchor="middle" font-size="9" fill="#555">Antenna array anchors</text>
  <text x="432" y="340" text-anchor="middle" font-size="9" fill="#555">Practical federal path</text>

  <!-- Passive RFID -->
  <rect x="525" y="238" width="140" height="120" fill="#ffffff" stroke="#1a9e8f" stroke-width="1.5" rx="4"/>
  <rect x="525" y="238" width="140" height="26" fill="#1a2a6c" rx="4"/>
  <rect x="525" y="252" width="140" height="12" fill="#1a2a6c"/>
  <text x="595" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Passive RFID</text>
  <text x="595" y="278" text-anchor="middle" font-size="10" fill="#1a2a6c">No-battery checkpoint</text>
  <text x="595" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#d4a017">Precision: last-seen</text>
  <text x="595" y="310" text-anchor="middle" font-size="9" fill="#555">Door/hallway readers</text>
  <text x="595" y="324" text-anchor="middle" font-size="9" fill="#555">Widely deployed</text>
  <text x="595" y="340" text-anchor="middle" font-size="9" fill="#555">Not real-time position</text>

  <!-- LEO-PNT -->
  <rect x="680" y="238" width="135" height="120" fill="#ffffff" stroke="#d4a017" stroke-width="1.5" rx="4"/>
  <rect x="680" y="238" width="135" height="26" fill="#d4a017" rx="4"/>
  <rect x="680" y="252" width="135" height="12" fill="#d4a017"/>
  <text x="747" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">LEO-PNT</text>
  <text x="747" y="278" text-anchor="middle" font-size="10" fill="#1a2a6c">Starlink-class signals</text>
  <text x="747" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#d4a017">Precision: floor-level</text>
  <text x="747" y="310" text-anchor="middle" font-size="9" fill="#555">GPS-denied resilience</text>
  <text x="747" y="324" text-anchor="middle" font-size="9" fill="#555">Wide-area, no local infra</text>
  <text x="747" y="340" text-anchor="middle" font-size="9" fill="#555">Observational only</text>

  <!-- Enhances arrows down to governed layer -->
  <line x1="115" y1="358" x2="115" y2="396" stroke="#1a9e8f" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
  <line x1="270" y1="358" x2="270" y2="396" stroke="#1a9e8f" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
  <line x1="432" y1="358" x2="432" y2="396" stroke="#1a9e8f" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
  <line x1="595" y1="358" x2="595" y2="396" stroke="#1a9e8f" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
  <line x1="747" y1="358" x2="747" y2="396" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>

  <text x="430" y="390" text-anchor="middle" font-size="10" fill="#1a9e8f">Enhances ↓ (supplemental channel only)</text>

  <!-- SOURCE INFRASTRUCTURE note (top) -->
  <rect x="30" y="54" width="800" height="120" fill="#f8f8f8" stroke="#cccccc" stroke-width="1" rx="4"/>
  <text x="430" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a6c">Adapter Pattern: UIAO reads from RTLS middleware — does not own reader infrastructure</text>

  <!-- Adapter boxes -->
  <rect x="50" y="84" width="140" height="76" fill="#ffffff" stroke="#1a9e8f" stroke-width="1" rx="3"/>
  <text x="120" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">ArcGIS Indoors</text>
  <text x="120" y="118" text-anchor="middle" font-size="9" fill="#555">Esri indoor</text>
  <text x="120" y="132" text-anchor="middle" font-size="9" fill="#555">positioning</text>
  <text x="120" y="148" text-anchor="middle" font-size="9" fill="#1a9e8f">RTLS adapter →</text>

  <rect x="210" y="84" width="140" height="76" fill="#ffffff" stroke="#1a9e8f" stroke-width="1" rx="3"/>
  <text x="280" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">Aruba Meridian</text>
  <text x="280" y="118" text-anchor="middle" font-size="9" fill="#555">BLE / WiFi</text>
  <text x="280" y="132" text-anchor="middle" font-size="9" fill="#555">indoor maps</text>
  <text x="280" y="148" text-anchor="middle" font-size="9" fill="#1a9e8f">RTLS adapter →</text>

  <rect x="370" y="84" width="140" height="76" fill="#ffffff" stroke="#1a9e8f" stroke-width="1" rx="3"/>
  <text x="440" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">Cisco DNA Spaces</text>
  <text x="440" y="118" text-anchor="middle" font-size="9" fill="#555">WiFi / BLE</text>
  <text x="440" y="132" text-anchor="middle" font-size="9" fill="#555">location analytics</text>
  <text x="440" y="148" text-anchor="middle" font-size="9" fill="#1a9e8f">RTLS adapter →</text>

  <rect x="530" y="84" width="140" height="76" fill="#ffffff" stroke="#1a9e8f" stroke-width="1" rx="3"/>
  <text x="600" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">Custom Integration</text>
  <text x="600" y="118" text-anchor="middle" font-size="9" fill="#555">UWB / RFID</text>
  <text x="600" y="132" text-anchor="middle" font-size="9" fill="#555">middleware APIs</text>
  <text x="600" y="148" text-anchor="middle" font-size="9" fill="#1a9e8f">RTLS adapter →</text>

  <rect x="690" y="84" width="120" height="76" fill="#fff8e6" stroke="#d4a017" stroke-width="1" rx="3"/>
  <text x="750" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">LEO-PNT Signal</text>
  <text x="750" y="118" text-anchor="middle" font-size="9" fill="#555">Starlink /</text>
  <text x="750" y="132" text-anchor="middle" font-size="9" fill="#555">PNT receiver</text>
  <text x="750" y="148" text-anchor="middle" font-size="9" fill="#d4a017">PNT adapter →</text>

  <!-- Arrows from adapters down to observational layer -->
  <line x1="120" y1="160" x2="120" y2="193" stroke="#1a9e8f" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="280" y1="160" x2="280" y2="193" stroke="#1a9e8f" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="440" y1="160" x2="440" y2="193" stroke="#1a9e8f" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="600" y1="160" x2="600" y2="193" stroke="#1a9e8f" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="750" y1="160" x2="750" y2="193" stroke="#d4a017" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
</svg>
