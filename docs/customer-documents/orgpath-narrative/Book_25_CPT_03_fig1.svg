<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arr-navy" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a2a6c"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a9e8f"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2a6c">AWS and GCP Binding Profiles: Identity and Workload Planes</text>

  <!-- Codebook center top -->
  <rect x="300" y="48" width="260" height="52" rx="6" fill="#1a2a6c"/>
  <text x="430" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">UIAO_151 Codebook</text>
  <text x="430" y="88" text-anchor="middle" font-size="10" fill="#d4e4ff">Single authoritative source for all facet values</text>

  <!-- Arrow to AWS -->
  <line x1="360" y1="100" x2="210" y2="148" stroke="#1a2a6c" stroke-width="2" marker-end="url(#arr-navy)"/>
  <!-- Arrow to GCP -->
  <line x1="500" y1="100" x2="650" y2="148" stroke="#1a2a6c" stroke-width="2" marker-end="url(#arr-navy)"/>

  <!-- === AWS SIDE === -->
  <text x="210" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2a6c">aws profile</text>

  <!-- AWS Identity plane -->
  <rect x="42" y="158" width="336" height="140" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <rect x="42" y="158" width="336" height="28" rx="6" fill="#1a9e8f"/>
  <text x="210" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Identity Plane — IAM Identity Center</text>
  <text x="60" y="204" font-size="10" fill="#333333">Department  →  user attribute: Department</text>
  <text x="60" y="220" font-size="10" fill="#333333">Classification  →  user attribute: Classification</text>
  <text x="60" y="236" font-size="10" fill="#333333">CostCenter  →  user attribute: CostCenter</text>
  <text x="60" y="252" font-size="10" fill="#333333">AccountType  →  user attribute: AccountType</text>
  <text x="60" y="268" font-size="10" fill="#555555">Transport: SCIM 2.0 endpoint</text>
  <text x="60" y="284" font-size="10" fill="#1a9e8f">Available as aws:PrincipalTag/* in IAM ABAC</text>

  <!-- AWS Workload plane -->
  <rect x="42" y="318" width="336" height="140" rx="6" fill="#fff8e8" stroke="#d4a017" stroke-width="2"/>
  <rect x="42" y="318" width="336" height="28" rx="6" fill="#d4a017"/>
  <text x="210" y="337" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Workload Plane — Resource Tags</text>
  <text x="60" y="364" font-size="10" fill="#333333">Department  →  tag key: orgpath:department</text>
  <text x="60" y="380" font-size="10" fill="#333333">Classification  →  tag key: orgpath:classification</text>
  <text x="60" y="396" font-size="10" fill="#333333">CostCenter  →  tag key: orgpath:costcenter</text>
  <text x="60" y="412" font-size="10" fill="#333333">AccountType  →  tag key: orgpath:accounttype</text>
  <text x="60" y="428" font-size="10" fill="#555555">Applies to: EC2 · S3 · RDS · Lambda · EKS</text>
  <text x="60" y="444" font-size="10" fill="#d4a017">Drift validated by same engine as identity plane</text>

  <!-- === GCP SIDE === -->
  <text x="650" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2a6c">gcp profile</text>

  <!-- GCP Identity plane -->
  <rect x="482" y="158" width="336" height="140" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <rect x="482" y="158" width="336" height="28" rx="6" fill="#1a9e8f"/>
  <text x="650" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Identity Plane — Cloud Identity</text>
  <text x="500" y="204" font-size="10" fill="#333333">Department  →  schema: OrgPath.Department</text>
  <text x="500" y="220" font-size="10" fill="#333333">Classification  →  schema: OrgPath.Classification</text>
  <text x="500" y="236" font-size="10" fill="#333333">CostCenter  →  schema: OrgPath.CostCenter</text>
  <text x="500" y="252" font-size="10" fill="#333333">AccountType  →  schema: OrgPath.AccountType</text>
  <text x="500" y="268" font-size="10" fill="#555555">Transport: Directory API / SCIM</text>
  <text x="500" y="284" font-size="10" fill="#1a9e8f">Available in GCP IAM condition expressions</text>

  <!-- GCP Workload plane -->
  <rect x="482" y="318" width="336" height="140" rx="6" fill="#fff8e8" stroke="#d4a017" stroke-width="2"/>
  <rect x="482" y="318" width="336" height="28" rx="6" fill="#d4a017"/>
  <text x="650" y="337" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Workload Plane — Resource Labels</text>
  <text x="500" y="364" font-size="10" fill="#333333">Department  →  label key: orgpath-department</text>
  <text x="500" y="380" font-size="10" fill="#333333">Classification  →  label key: orgpath-classification</text>
  <text x="500" y="396" font-size="10" fill="#333333">CostCenter  →  label key: orgpath-costcenter</text>
  <text x="500" y="412" font-size="10" fill="#333333">AccountType  →  label key: orgpath-accounttype</text>
  <text x="500" y="428" font-size="10" fill="#555555">Applies to: Compute · GCS · BigQuery · GKE</text>
  <text x="500" y="444" font-size="10" fill="#555555">Note: label values normalized to lowercase-hyphen</text>

  <!-- Drift engine bottom center -->
  <rect x="270" y="476" width="320" height="34" rx="6" fill="#1a2a6c"/>
  <text x="430" y="498" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">DRIFT-IDENTITY engine validates both profiles, both planes</text>

  <!-- Arrows down to drift -->
  <line x1="210" y1="458" x2="340" y2="476" stroke="#1a9e8f" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <line x1="650" y1="458" x2="520" y2="476" stroke="#1a9e8f" stroke-width="1.5" marker-end="url(#arr-teal)"/>
</svg>
