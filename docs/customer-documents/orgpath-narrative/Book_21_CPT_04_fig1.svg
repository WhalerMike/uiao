<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <!-- White background -->
  <rect width="760" height="480" fill="white"/>

  <!-- Title -->
  <text x="380" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#0a1f44">AI Classification and the Actuation Ladder</text>

  <!-- === Left column: L0–L4 staircase === -->
  <!-- L0 step (bottom) -->
  <rect x="60" y="380" width="260" height="52" rx="4" fill="#0a1f44"/>
  <text x="80" y="411" font-size="13" font-weight="bold" fill="#ffffff">L0 — Observe</text>
  <text x="80" y="428" font-size="11" fill="#a8c4e0">Passive scanning, no action taken</text>

  <!-- L1 step -->
  <rect x="60" y="318" width="260" height="52" rx="4" fill="#0d2b5e"/>
  <text x="80" y="349" font-size="13" font-weight="bold" fill="#ffffff">L1 — Alert</text>
  <text x="80" y="366" font-size="11" fill="#a8c4e0">Findings surfaced; human decides</text>

  <!-- L2 step -->
  <rect x="60" y="256" width="260" height="52" rx="4" fill="#1a4080"/>
  <text x="80" y="287" font-size="13" font-weight="bold" fill="#ffffff">L2 — Recommend</text>
  <text x="80" y="304" font-size="11" fill="#a8c4e0">Proposed actions; human approves</text>

  <!-- L3 step -->
  <rect x="60" y="194" width="260" height="52" rx="4" fill="#1e5fa0"/>
  <text x="80" y="225" font-size="13" font-weight="bold" fill="#ffffff">L3 — Enforce</text>
  <text x="80" y="242" font-size="11" fill="#cde4f8">Policy applied automatically</text>

  <!-- L4 step (top) -->
  <rect x="60" y="132" width="260" height="52" rx="4" fill="#1a7ec2"/>
  <text x="80" y="163" font-size="13" font-weight="bold" fill="#ffffff">L4 — Autonomous</text>
  <text x="80" y="180" font-size="11" fill="#cde4f8">Independent cross-system action</text>

  <!-- Step arrows (left side connector) -->
  <line x1="190" y1="380" x2="190" y2="374" stroke="#6ab0d8" stroke-width="1.5"/>
  <line x1="190" y1="318" x2="190" y2="312" stroke="#6ab0d8" stroke-width="1.5"/>
  <line x1="190" y1="256" x2="190" y2="250" stroke="#6ab0d8" stroke-width="1.5"/>
  <line x1="190" y1="194" x2="190" y2="188" stroke="#6ab0d8" stroke-width="1.5"/>

  <!-- === Right column: AI class badges === -->
  <!-- NLP badge (L1) -->
  <rect x="370" y="318" width="185" height="52" rx="6" fill="#e8f4fb" stroke="#1e5fa0" stroke-width="1.5"/>
  <text x="462" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a1f44">NLP Systems</text>
  <text x="462" y="358" text-anchor="middle" font-size="10" fill="#1e5fa0">Document analysis, classifiers</text>
  <text x="462" y="371" text-anchor="middle" font-size="10" fill="#1e5fa0">Governed at L1 minimum</text>

  <!-- Classical ML badge (L1–L2) -->
  <rect x="370" y="256" width="185" height="52" rx="6" fill="#e8f4fb" stroke="#1a4080" stroke-width="1.5"/>
  <text x="462" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a1f44">Classical ML</text>
  <text x="462" y="296" text-anchor="middle" font-size="10" fill="#1a4080">Batch prediction, scoring models</text>
  <text x="462" y="309" text-anchor="middle" font-size="10" fill="#1a4080">Governed at L1–L2</text>

  <!-- Generative AI badge (L2–L3) -->
  <rect x="370" y="194" width="185" height="52" rx="6" fill="#e8f4fb" stroke="#1e5fa0" stroke-width="1.5"/>
  <text x="462" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a1f44">Generative AI</text>
  <text x="462" y="234" text-anchor="middle" font-size="10" fill="#1e5fa0">LLMs, content generation</text>
  <text x="462" y="247" text-anchor="middle" font-size="10" fill="#1e5fa0">Governed at L2–L3</text>

  <!-- Agentic AI badge (L3–L4) -->
  <rect x="370" y="132" width="185" height="52" rx="6" fill="#fff3f3" stroke="#c0392b" stroke-width="2"/>
  <text x="462" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b0000">Agentic AI</text>
  <text x="462" y="172" text-anchor="middle" font-size="10" fill="#c0392b">Autonomous cross-system actors</text>
  <text x="462" y="185" text-anchor="middle" font-size="10" fill="#c0392b">Governed at L3–L4; ATO required</text>

  <!-- Connector lines from steps to badges -->
  <!-- NLP → L1 -->
  <line x1="320" y1="344" x2="370" y2="344" stroke="#1e5fa0" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- Classical ML → L1/L2 boundary -->
  <line x1="320" y1="282" x2="370" y2="282" stroke="#1a4080" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- Generative → L2/L3 boundary -->
  <line x1="320" y1="220" x2="370" y2="220" stroke="#1e5fa0" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- Agentic → L3/L4 -->
  <line x1="320" y1="158" x2="370" y2="158" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- === HALT badge === -->
  <rect x="580" y="80" width="148" height="78" rx="8" fill="#c0392b"/>
  <text x="654" y="106" text-anchor="middle" font-size="22" font-weight="bold" fill="white">HALT</text>
  <text x="654" y="126" text-anchor="middle" font-size="11" fill="#ffd6d6">14 agentic systems</text>
  <text x="654" y="143" text-anchor="middle" font-size="11" fill="#ffd6d6">no ATO — P1 finding</text>

  <!-- Arrow from Agentic badge to HALT -->
  <line x1="654" y1="158" x2="654" y2="162" stroke="#c0392b" stroke-width="0" />
  <line x1="556" y1="158" x2="580" y2="119" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Bottom legend -->
  <rect x="60" y="452" width="14" height="14" rx="2" fill="#1a7ec2"/>
  <text x="80" y="464" font-size="10" fill="#0a1f44">ADR-092 Actuation Level</text>
  <rect x="220" y="452" width="14" height="14" rx="2" fill="#e8f4fb" stroke="#1a4080" stroke-width="1.5"/>
  <text x="240" y="464" font-size="10" fill="#0a1f44">AI Class (governed)</text>
  <rect x="380" y="452" width="14" height="14" rx="2" fill="#fff3f3" stroke="#c0392b" stroke-width="1.5"/>
  <text x="400" y="464" font-size="10" fill="#c0392b">Agentic (highest-risk)</text>
  <rect x="540" y="452" width="14" height="14" rx="2" fill="#c0392b"/>
  <text x="560" y="464" font-size="10" fill="#c0392b">Gate HALT condition</text>
</svg>
