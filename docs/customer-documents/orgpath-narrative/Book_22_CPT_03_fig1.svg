<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <text x="430" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a6c">Login.gov — UIAO Citizen Identity Activation (ADR-056)</text>

  <!-- Citizen -->
  <circle cx="80" cy="210" r="22" fill="#1a9e8f"/>
  <rect x="62" y="235" width="36" height="22" rx="4" fill="#1a9e8f"/>
  <text x="80" y="272" text-anchor="middle" font-size="10" fill="#1a9e8f" font-weight="bold">Citizen</text>
  <text x="80" y="285" text-anchor="middle" font-size="9" fill="#555">IAL1 or IAL2</text>

  <!-- Arrow: citizen → Login.gov -->
  <line x1="116" y1="218" x2="218" y2="218" stroke="#1a9e8f" stroke-width="2"/>
  <polygon points="218,218 207,212 207,224" fill="#1a9e8f"/>
  <text x="167" y="210" text-anchor="middle" font-size="9" fill="#1a9e8f">auth request</text>

  <!-- Login.gov box -->
  <rect x="218" y="140" width="230" height="168" rx="10" fill="#1a2a6c" stroke="#1a2a6c" stroke-width="2"/>
  <text x="333" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Login.gov</text>
  <text x="333" y="184" text-anchor="middle" font-size="10" fill="#a0b0e0">Operated by GSA</text>

  <!-- Proofing layer -->
  <rect x="234" y="194" width="198" height="44" rx="5" fill="#1a9e8f"/>
  <text x="333" y="213" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">IAL1 + IAL2 Proofing</text>
  <text x="333" y="228" text-anchor="middle" font-size="9" fill="#d0f0ec">Document validation · Biometric comparison</text>

  <!-- Federation layer -->
  <rect x="234" y="246" width="198" height="44" rx="5" fill="#1a9e8f"/>
  <text x="333" y="265" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">OIDC + SAML Federation</text>
  <text x="333" y="280" text-anchor="middle" font-size="9" fill="#d0f0ec">Signed assertions · FAL2 holder-of-key</text>

  <!-- Arrows: Login.gov → agencies -->
  <line x1="448" y1="200" x2="540" y2="168" stroke="#1a9e8f" stroke-width="1.8"/>
  <polygon points="540,168 527,166 531,176" fill="#1a9e8f"/>
  <text x="494" y="176" text-anchor="middle" font-size="8" fill="#1a9e8f">assertion</text>

  <line x1="448" y1="224" x2="540" y2="240" stroke="#1a9e8f" stroke-width="1.8"/>
  <polygon points="540,240 527,235 529,246" fill="#1a9e8f"/>

  <line x1="448" y1="270" x2="540" y2="310" stroke="#1a9e8f" stroke-width="1.8"/>
  <polygon points="540,310 528,302 532,313" fill="#1a9e8f"/>

  <!-- Agency boxes -->
  <!-- SSA -->
  <rect x="540" y="140" width="130" height="52" rx="6" fill="#1a2a6c"/>
  <text x="605" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SSA</text>
  <text x="605" y="178" text-anchor="middle" font-size="9" fill="#a0b0e0">Benefits portal · IAL2</text>

  <!-- SSA OrgPath node -->
  <rect x="540" y="198" width="130" height="34" rx="4" fill="#fff8e6" stroke="#d4a017" stroke-width="1.2"/>
  <text x="605" y="213" text-anchor="middle" font-size="9" font-weight="bold" fill="#d4a017">OrgPath Node</text>
  <text x="605" y="226" text-anchor="middle" font-size="8" fill="#888">IAL2 · AAL2 · FAL2</text>

  <!-- IRS -->
  <rect x="540" y="245" width="130" height="52" rx="6" fill="#1a2a6c"/>
  <text x="605" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">IRS</text>
  <text x="605" y="283" text-anchor="middle" font-size="9" fill="#a0b0e0">Taxpayer access · IAL2</text>

  <!-- IRS OrgPath node -->
  <rect x="540" y="303" width="130" height="34" rx="4" fill="#fff8e6" stroke="#d4a017" stroke-width="1.2"/>
  <text x="605" y="318" text-anchor="middle" font-size="9" font-weight="bold" fill="#d4a017">OrgPath Node</text>
  <text x="605" y="331" text-anchor="middle" font-size="8" fill="#888">IAL2 · AAL2 · FAL2</text>

  <!-- VA -->
  <rect x="540" y="350" width="130" height="52" rx="6" fill="#1a2a6c"/>
  <text x="605" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">VA</text>
  <text x="605" y="388" text-anchor="middle" font-size="9" fill="#a0b0e0">Veteran records · IAL2</text>

  <!-- VA OrgPath node -->
  <rect x="540" y="408" width="130" height="34" rx="4" fill="#fff8e6" stroke="#d4a017" stroke-width="1.2"/>
  <text x="605" y="423" text-anchor="middle" font-size="9" font-weight="bold" fill="#d4a017">OrgPath Node</text>
  <text x="605" y="436" text-anchor="middle" font-size="8" fill="#888">IAL2 · AAL2 · FAL2</text>

  <!-- ADR-056 activation contract banner -->
  <rect x="700" y="130" width="140" height="330" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="770" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">ADR-056</text>
  <text x="770" y="176" text-anchor="middle" font-size="10" fill="#c0392b">Activation</text>
  <text x="770" y="190" text-anchor="middle" font-size="10" fill="#c0392b">Contract</text>

  <!-- Checklist items -->
  <text x="712" y="218" font-size="9" fill="#333">✓ Application scope</text>
  <text x="712" y="234" font-size="9" fill="#333">✓ Required IAL</text>
  <text x="712" y="250" font-size="9" fill="#333">✓ Required AAL</text>
  <text x="712" y="266" font-size="9" fill="#333">✓ Required FAL</text>
  <text x="712" y="282" font-size="9" fill="#333">✓ Attribute scope</text>
  <text x="712" y="298" font-size="9" fill="#333">✓ Review cadence</text>

  <text x="770" y="340" text-anchor="middle" font-size="9" fill="#c0392b">All 6 declarations</text>
  <text x="770" y="354" text-anchor="middle" font-size="9" fill="#c0392b">in OrgPath node</text>
  <text x="770" y="368" text-anchor="middle" font-size="9" fill="#c0392b">before go-live</text>

  <!-- drift engine note -->
  <rect x="218" y="328" width="230" height="40" rx="6" fill="#fff8e6" stroke="#d4a017" stroke-width="1.2"/>
  <text x="333" y="345" text-anchor="middle" font-size="10" font-weight="bold" fill="#d4a017">UIAO Drift Engine</text>
  <text x="333" y="359" text-anchor="middle" font-size="9" fill="#555">Compares declared vs delivered assurance</text>

  <text x="430" y="494" text-anchor="middle" font-size="10" fill="#888">UIAO Book_22 · Ch 3 · ADR-056 · Login.gov · NIST SP 800-63-4</text>
</svg>
