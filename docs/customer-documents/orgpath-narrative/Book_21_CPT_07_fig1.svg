<svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- White background -->
  <rect width="820" height="480" fill="white"/>

  <!-- Title -->
  <text x="410" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2e4a">OrgPath: One Authorization Spine, Three Identity Surfaces</text>

  <!-- Column headers -->
  <text x="140" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2e4a">OrgPath Node</text>
  <text x="410" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a6b7a">Governed Surfaces</text>
  <text x="672" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#b86a00">Governance Outputs</text>

  <!-- ===== ROW 1: DOD:DISA ===== -->
  <!-- OrgPath node pill -->
  <rect x="30" y="95" width="220" height="44" rx="22" fill="#1a2e4a"/>
  <text x="140" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="white">DOD:DISA</text>

  <!-- Arrow row 1 -->
  <line x1="252" y1="117" x2="298" y2="117" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Three surface boxes row 1 -->
  <rect x="300" y="95" width="88" height="30" rx="5" fill="#1a7a6e"/>
  <text x="344" y="115" text-anchor="middle" font-size="12" fill="white">Human</text>
  <rect x="394" y="95" width="88" height="30" rx="5" fill="#1a7a6e"/>
  <text x="438" y="115" text-anchor="middle" font-size="12" fill="white">Device</text>
  <rect x="488" y="95" width="88" height="30" rx="5" fill="#1a7a6e"/>
  <text x="532" y="115" text-anchor="middle" font-size="12" fill="white">AI System</text>

  <!-- Arrow row 1 right -->
  <line x1="578" y1="117" x2="616" y2="117" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Governance output chips row 1 -->
  <rect x="620" y="95" width="170" height="30" rx="6" fill="#f0a830"/>
  <text x="705" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2e4a">Rotation: 90-day / P1</text>

  <!-- ===== ROW 2: HHS:CDC ===== -->
  <rect x="30" y="175" width="220" height="44" rx="22" fill="#1a2e4a"/>
  <text x="140" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="white">HHS:CDC</text>

  <line x1="252" y1="197" x2="298" y2="197" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="300" y="175" width="88" height="30" rx="5" fill="#1a7a6e"/>
  <text x="344" y="195" text-anchor="middle" font-size="12" fill="white">Human</text>
  <rect x="394" y="175" width="88" height="30" rx="5" fill="#1a7a6e"/>
  <text x="438" y="195" text-anchor="middle" font-size="12" fill="white">Device</text>
  <rect x="488" y="175" width="88" height="30" rx="5" fill="#1a7a6e"/>
  <text x="532" y="195" text-anchor="middle" font-size="12" fill="white">AI System</text>

  <line x1="578" y1="197" x2="616" y2="197" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="620" y="175" width="170" height="30" rx="6" fill="#f0a830"/>
  <text x="705" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2e4a">Access Tier: Standard</text>

  <!-- ===== ROW 3: DOJ:BOP ===== -->
  <rect x="30" y="255" width="220" height="44" rx="22" fill="#1a2e4a"/>
  <text x="140" y="282" text-anchor="middle" font-size="15" font-weight="bold" fill="white">DOJ:BOP</text>

  <line x1="252" y1="277" x2="298" y2="277" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="300" y="255" width="88" height="30" rx="5" fill="#1a7a6e"/>
  <text x="344" y="275" text-anchor="middle" font-size="12" fill="white">Human</text>
  <rect x="394" y="255" width="88" height="30" rx="5" fill="#1a7a6e"/>
  <text x="438" y="275" text-anchor="middle" font-size="12" fill="white">Device</text>
  <rect x="488" y="255" width="88" height="30" rx="5" fill="#1a7a6e"/>
  <text x="532" y="275" text-anchor="middle" font-size="12" fill="white">AI System</text>

  <line x1="578" y1="277" x2="616" y2="277" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="620" y="255" width="170" height="30" rx="6" fill="#f0a830"/>
  <text x="705" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2e4a">Blast Radius: Bureau</text>

  <!-- Additional output chips staggered below to show full set -->
  <rect x="620" y="135" width="170" height="30" rx="6" fill="#f0a830"/>
  <text x="705" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2e4a">Access Review: Annual</text>

  <rect x="620" y="215" width="170" height="30" rx="6" fill="#f0a830"/>
  <text x="705" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2e4a">Drift Routing: CIO</text>

  <rect x="620" y="295" width="170" height="30" rx="6" fill="#f0a830"/>
  <text x="705" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2e4a">Lifecycle: OrgPath-tied</text>

  <!-- Vertical brace / bracket for "All nodes produce same output structure" label -->
  <line x1="410" y1="340" x2="410" y2="380" stroke="#1a2e4a" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Bottom note -->
  <rect x="160" y="380" width="500" height="36" rx="8" fill="#eaf3f5" stroke="#1a7a6e" stroke-width="1.2"/>
  <text x="410" y="402" text-anchor="middle" font-size="12" fill="#1a2e4a">Every OrgPath node produces the same governance outputs for all three identity surfaces.</text>
  <text x="410" y="418" text-anchor="middle" font-size="12" fill="#1a2e4a">One authorization model — humans, devices, and AI governed identically.</text>

  <!-- Source note -->
  <text x="410" y="463" text-anchor="middle" font-size="10" fill="#666">Source: ADR-035, ADR-038, ADR-040, ADR-062, ADR-109 | UIAO OrgPath Narrative Book_21</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>
</svg>
