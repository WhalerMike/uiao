<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2d7d6b"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="760" height="320" fill="white"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2c5b">Production-readiness: fairness, evidence, and an honest readiness signal</text>

  <!-- inbound -->
  <rect x="30" y="80" width="90" height="40" rx="6" fill="#e8f0fc" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="75" y="105" text-anchor="middle" font-size="11" fill="#1a2c5b">request</text>
  <line x1="120" y1="100" x2="170" y2="100" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>

  <!-- rate limiter -->
  <rect x="170" y="76" width="150" height="48" rx="6" fill="#1a2c5b"/>
  <text x="245" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="white">per-plan rate limiter</text>
  <text x="245" y="113" text-anchor="middle" font-size="9" fill="#c0d0f0">window keyed by tenant</text>

  <!-- pass -->
  <line x1="320" y1="100" x2="380" y2="100" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>
  <text x="350" y="92" text-anchor="middle" font-size="9" fill="#2d7d6b">within budget</text>
  <rect x="380" y="78" width="150" height="44" rx="6" fill="#2d7d6b"/>
  <text x="455" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="white">governance engine</text>

  <!-- 429 -->
  <line x1="245" y1="124" x2="245" y2="168" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#r)"/>
  <rect x="170" y="168" width="150" height="40" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="245" y="186" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">429 Too Many Requests</text>
  <text x="245" y="200" text-anchor="middle" font-size="9" fill="#7a0000">Retry-After + RateLimit-*</text>

  <!-- control plane + audit -->
  <rect x="560" y="76" width="170" height="48" rx="6" fill="#1a2c5b"/>
  <text x="645" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="white">control plane</text>
  <text x="645" y="113" text-anchor="middle" font-size="9" fill="#c0d0f0">onboard / suspend / …</text>
  <line x1="645" y1="124" x2="645" y2="160" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>
  <rect x="560" y="160" width="170" height="46" rx="6" fill="#e8f0fc" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="645" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2c5b">append-only audit trail</text>
  <text x="645" y="196" text-anchor="middle" font-size="9" fill="#1a2c5b">who · what · when</text>

  <!-- readiness -->
  <rect x="170" y="250" width="360" height="46" rx="6" fill="#f4f8ff" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="350" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2c5b">/readyz — registry reachable?</text>
  <text x="350" y="286" text-anchor="middle" font-size="9" fill="#1a2c5b">degraded → instance withheld from the traffic pool</text>
  <line x1="60" y1="273" x2="170" y2="273" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>
  <text x="60" y="265" text-anchor="middle" font-size="9" fill="#2d7d6b">ingress</text>
</svg>
