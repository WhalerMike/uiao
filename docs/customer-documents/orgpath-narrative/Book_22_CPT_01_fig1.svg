<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- White background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a6c">The Three Identity Surfaces of Federal Governance</text>

  <!-- ===== BAND 1: Workforce Surface ===== -->
  <rect x="30" y="60" width="720" height="110" rx="8" fill="#eef1f8" stroke="#1a2a6c" stroke-width="1.5"/>
  <text x="50" y="82" font-size="13" font-weight="bold" fill="#1a2a6c">Workforce Surface</text>
  <text x="50" y="98" font-size="11" fill="#444">Employees · Contractors · Service Accounts</text>

  <!-- Employee icons (simple circles + lines) -->
  <circle cx="120" cy="130" r="14" fill="#1a2a6c"/>
  <rect x="108" y="147" width="24" height="16" rx="3" fill="#1a2a6c"/>
  <text x="120" y="174" text-anchor="middle" font-size="9" fill="#1a2a6c">Employee</text>

  <circle cx="200" cy="130" r="14" fill="#1a2a6c"/>
  <rect x="188" y="147" width="24" height="16" rx="3" fill="#1a2a6c"/>
  <text x="200" y="174" text-anchor="middle" font-size="9" fill="#1a2a6c">Contractor</text>

  <circle cx="280" cy="130" r="14" fill="#1a2a6c"/>
  <rect x="268" y="147" width="24" height="16" rx="3" fill="#1a2a6c"/>
  <text x="280" y="174" text-anchor="middle" font-size="9" fill="#1a2a6c">Svc Account</text>

  <!-- Arrow to OrgPath registry -->
  <line x1="310" y1="135" x2="490" y2="120" stroke="#1a2a6c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="490,120 478,115 480,125" fill="#1a2a6c"/>

  <!-- OrgPath registry node -->
  <rect x="490" y="100" width="140" height="50" rx="6" fill="#1a2a6c"/>
  <text x="560" y="121" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">OrgPath Registry</text>
  <text x="560" y="137" text-anchor="middle" font-size="9" fill="#a0b0e0">PIV · FICAM · Lifecycle</text>

  <!-- "GOVERNED" badge -->
  <rect x="650" y="108" width="82" height="26" rx="5" fill="#1a9e8f"/>
  <text x="691" y="126" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">GOVERNED</text>

  <!-- ===== BAND 2: Citizen-Facing Surface ===== -->
  <rect x="30" y="185" width="720" height="120" rx="8" fill="#eaf6f5" stroke="#1a9e8f" stroke-width="1.5"/>
  <text x="50" y="207" font-size="13" font-weight="bold" fill="#1a9e8f">Citizen-Facing Surface</text>
  <text x="50" y="223" font-size="11" fill="#444">Beneficiaries · Taxpayers · Petitioners · Veterans</text>

  <circle cx="110" cy="255" r="13" fill="#1a9e8f"/>
  <rect x="98" y="271" width="24" height="14" rx="3" fill="#1a9e8f"/>
  <text x="110" y="297" text-anchor="middle" font-size="9" fill="#1a9e8f">Beneficiary</text>

  <circle cx="195" cy="255" r="13" fill="#1a9e8f"/>
  <rect x="183" y="271" width="24" height="14" rx="3" fill="#1a9e8f"/>
  <text x="195" y="297" text-anchor="middle" font-size="9" fill="#1a9e8f">Taxpayer</text>

  <circle cx="280" cy="255" r="13" fill="#1a9e8f"/>
  <rect x="268" y="271" width="24" height="14" rx="3" fill="#1a9e8f"/>
  <text x="280" y="297" text-anchor="middle" font-size="9" fill="#1a9e8f">Petitioner</text>

  <circle cx="365" cy="255" r="13" fill="#1a9e8f"/>
  <rect x="353" y="271" width="24" height="14" rx="3" fill="#1a9e8f"/>
  <text x="365" y="297" text-anchor="middle" font-size="9" fill="#1a9e8f">Veteran</text>

  <!-- Arrows to agency portals -->
  <line x1="395" y1="258" x2="490" y2="240" stroke="#1a9e8f" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="490,240 479,235 481,245" fill="#1a9e8f"/>

  <!-- Agency portal box -->
  <rect x="490" y="220" width="140" height="50" rx="6" fill="#1a9e8f"/>
  <text x="560" y="242" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Agency Portals</text>
  <text x="560" y="257" text-anchor="middle" font-size="9" fill="#d0f0ec">SSA · IRS · USCIS · VA</text>

  <!-- "PARTIAL" badge -->
  <rect x="650" y="228" width="82" height="26" rx="5" fill="#d4a017"/>
  <text x="691" y="246" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">PARTIAL</text>

  <!-- ===== BAND 3: Cross-Agency Attribute Exchange ===== -->
  <rect x="30" y="320" width="720" height="130" rx="8" fill="#fdf8ec" stroke="#d4a017" stroke-width="1.5"/>
  <text x="50" y="342" font-size="13" font-weight="bold" fill="#d4a017">Cross-Agency Attribute Exchange</text>
  <text x="50" y="358" font-size="11" fill="#444">SSN · TIN · UEI · Immigration Status — agencies as SSOT vendors and consumers</text>

  <!-- SSA -->
  <rect x="60" y="368" width="100" height="48" rx="5" fill="#1a2a6c"/>
  <text x="110" y="388" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">SSA</text>
  <text x="110" y="403" text-anchor="middle" font-size="9" fill="#a0b0e0">SSOT: SSN</text>

  <!-- IRS -->
  <rect x="210" y="368" width="100" height="48" rx="5" fill="#1a2a6c"/>
  <text x="260" y="388" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">IRS</text>
  <text x="260" y="403" text-anchor="middle" font-size="9" fill="#a0b0e0">SSOT: TIN</text>

  <!-- GSA -->
  <rect x="360" y="368" width="100" height="48" rx="5" fill="#1a2a6c"/>
  <text x="410" y="388" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">GSA</text>
  <text x="410" y="403" text-anchor="middle" font-size="9" fill="#a0b0e0">SSOT: UEI</text>

  <!-- USCIS -->
  <rect x="510" y="368" width="120" height="48" rx="5" fill="#1a2a6c"/>
  <text x="570" y="388" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">USCIS</text>
  <text x="570" y="403" text-anchor="middle" font-size="9" fill="#a0b0e0">SSOT: Imm. Status</text>

  <!-- Arrows between agencies -->
  <line x1="160" y1="392" x2="210" y2="392" stroke="#d4a017" stroke-width="2"/>
  <polygon points="210,392 200,387 200,397" fill="#d4a017"/>

  <line x1="310" y1="392" x2="360" y2="392" stroke="#d4a017" stroke-width="2"/>
  <polygon points="360,392 350,387 350,397" fill="#d4a017"/>

  <line x1="460" y1="392" x2="510" y2="392" stroke="#d4a017" stroke-width="2"/>
  <polygon points="510,392 500,387 500,397" fill="#d4a017"/>

  <!-- "UNGOVERNED" badge -->
  <rect x="650" y="378" width="82" height="26" rx="5" fill="#c0392b"/>
  <text x="691" y="396" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">UNGOVERNED</text>

  <!-- KYC Protocol bracket -->
  <line x1="760" y1="185" x2="760" y2="450" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="752" y1="185" x2="760" y2="185" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="752" y1="450" x2="760" y2="450" stroke="#c0392b" stroke-width="2.5"/>
  <text x="800" y="310" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold" transform="rotate(90,800,310)">KYC Protocol Scope</text>

  <!-- Bottom legend -->
  <text x="430" y="492" text-anchor="middle" font-size="10" fill="#888">UIAO Book_22 · Customer Identity · ADR-055 · ADR-056 · UIAO_141 · UIAO_142</text>
</svg>
