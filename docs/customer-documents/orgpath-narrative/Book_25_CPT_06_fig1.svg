<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arr-navy" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a2a6c"/>
    </marker>
    <marker id="arr-teal" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a9e8f"/>
    </marker>
    <marker id="arr-amber" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d4a017"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2a6c">One Facet Predicate — Five Enforcement Surfaces</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#555555">Department = Finance AND Classification = Privileged resolves simultaneously across the full estate</text>

  <!-- Central predicate box -->
  <rect x="270" y="58" width="320" height="64" rx="8" fill="#1a2a6c"/>
  <text x="430" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">OrgPath Facet Predicate</text>
  <text x="430" y="98" text-anchor="middle" font-size="12" fill="#d4e4ff">Department = Finance</text>
  <text x="430" y="114" text-anchor="middle" font-size="12" fill="#d4e4ff">AND  Classification = Privileged</text>

  <!-- Arrow to Entra (top-left) -->
  <line x1="320" y1="122" x2="120" y2="186" stroke="#1a9e8f" stroke-width="2" marker-end="url(#arr-teal)"/>
  <!-- Arrow to AWS (left) -->
  <line x1="290" y1="122" x2="96" y2="278" stroke="#1a9e8f" stroke-width="2" marker-end="url(#arr-teal)"/>
  <!-- Arrow to GCP (bottom-left) -->
  <line x1="320" y1="122" x2="120" y2="368" stroke="#1a9e8f" stroke-width="2" marker-end="url(#arr-teal)"/>
  <!-- Arrow to NSX (top-right) -->
  <line x1="540" y1="122" x2="740" y2="186" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <!-- Arrow to Palo Alto (bottom-right) -->
  <line x1="540" y1="122" x2="740" y2="368" stroke="#d4a017" stroke-width="2" marker-end="url(#arr-amber)"/>

  <!-- ENTRA box -->
  <rect x="30" y="190" width="220" height="96" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <rect x="30" y="190" width="220" height="26" rx="6" fill="#1a9e8f"/>
  <text x="140" y="208" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">Entra Conditional Access</text>
  <text x="46" y="232" font-size="9" fill="#333333">Profile: microsoft-entra</text>
  <text x="46" y="246" font-size="9" fill="#333333">Action: Require MFA + compliant device</text>
  <text x="46" y="260" font-size="9" fill="#333333">Require Privileged Access Workstation</text>
  <text x="46" y="274" font-size="9" fill="#1a9e8f">Mechanism: Conditional Access policy</text>

  <!-- AWS box -->
  <rect x="30" y="306" width="220" height="96" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <rect x="30" y="306" width="220" height="26" rx="6" fill="#1a9e8f"/>
  <text x="140" y="324" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">AWS IAM Permission Boundary</text>
  <text x="46" y="348" font-size="9" fill="#333333">Profile: aws</text>
  <text x="46" y="362" font-size="9" fill="#333333">Action: Attach Finance-Privileged boundary</text>
  <text x="46" y="376" font-size="9" fill="#333333">Restrict to Finance-data-access roles</text>
  <text x="46" y="390" font-size="9" fill="#1a9e8f">Mechanism: aws:PrincipalTag ABAC</text>

  <!-- GCP box -->
  <rect x="30" y="420" width="220" height="80" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <rect x="30" y="420" width="220" height="26" rx="6" fill="#1a9e8f"/>
  <text x="140" y="438" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">GCP IAM Condition</text>
  <text x="46" y="462" font-size="9" fill="#333333">Profile: gcp</text>
  <text x="46" y="476" font-size="9" fill="#333333">Action: Condition on BigQuery Finance dataset</text>
  <text x="46" y="490" font-size="9" fill="#1a9e8f">Mechanism: IAM binding condition</text>

  <!-- NSX box -->
  <rect x="610" y="190" width="220" height="96" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="610" y="190" width="220" height="26" rx="6" fill="#c0392b"/>
  <text x="720" y="208" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">NSX Microsegmentation</text>
  <text x="626" y="232" font-size="9" fill="#333333">Profile: vmware (enforcement plane)</text>
  <text x="626" y="246" font-size="9" fill="#333333">Action: Add to Finance-Privileged sec group</text>
  <text x="626" y="260" font-size="9" fill="#333333">Apply high-trust segment DFW rules</text>
  <text x="626" y="274" font-size="9" fill="#c0392b">Mechanism: NSX dynamic security group</text>

  <!-- Palo Alto box -->
  <rect x="610" y="306" width="220" height="96" rx="6" fill="#fff8e8" stroke="#d4a017" stroke-width="2"/>
  <rect x="610" y="306" width="220" height="26" rx="6" fill="#d4a017"/>
  <text x="720" y="324" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">Palo Alto Dynamic Address Group</text>
  <text x="626" y="348" font-size="9" fill="#333333">Via: NSX service insertion</text>
  <text x="626" y="362" font-size="9" fill="#333333">Action: Add to Finance-Privileged DAG</text>
  <text x="626" y="376" font-size="9" fill="#333333">Apply Privileged-Finance permit policy</text>
  <text x="626" y="390" font-size="9" fill="#d4a017">Mechanism: PAN-OS DAG from OrgPath tag</text>

  <!-- Bottom summary bar -->
  <rect x="240" y="420" width="380" height="72" rx="6" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="1.5"/>
  <text x="430" y="442" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">Enforcement-Projection Model (UIAO_193)</text>
  <text x="430" y="460" text-anchor="middle" font-size="9" fill="#333333">One predicate declared once in the codebook.</text>
  <text x="430" y="474" text-anchor="middle" font-size="9" fill="#333333">Projection config maps it to each platform's enforcement mechanism.</text>
  <text x="430" y="488" text-anchor="middle" font-size="9" fill="#1a2a6c">Drift engine validates projection consistency on every cycle.</text>
</svg>
