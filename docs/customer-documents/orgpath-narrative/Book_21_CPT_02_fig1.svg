<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <!-- White background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2a6c">M-25-21 Inventory Fields Are IAM Fields</text>
  <line x1="60" y1="50" x2="800" y2="50" stroke="#1a2a6c" stroke-width="1.5"/>

  <!-- Column headers -->
  <text x="185" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2a6c">M-25-21 Inventory Field</text>
  <text x="655" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#1a9e8f">IAM Governance Meaning</text>

  <!-- ===== ROW 1 ===== -->
  <!-- Left pill: have_ato -->
  <rect x="40" y="92" width="290" height="48" rx="24" fill="#1a2a6c"/>
  <text x="185" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">have_ato</text>
  <text x="185" y="128" text-anchor="middle" font-size="11" fill="#c8d8ff">Authorization to Operate flag</text>
  <!-- Arrow -->
  <line x1="332" y1="116" x2="398" y2="116" stroke="#d4a017" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <!-- Right box -->
  <rect x="400" y="92" width="420" height="48" rx="6" fill="#e6f7f5" stroke="#1a9e8f" stroke-width="1.5"/>
  <text x="610" y="111" text-anchor="middle" font-size="12" font-weight="600" fill="#1a9e8f">Authorization Boundary Gate</text>
  <text x="610" y="128" text-anchor="middle" font-size="11" fill="#555">Credential issuance gated until ATO is granted</text>

  <!-- ===== ROW 2 ===== -->
  <!-- Left pill: contact_email -->
  <rect x="40" y="158" width="290" height="48" rx="24" fill="#1a2a6c"/>
  <text x="185" y="177" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">contact_email</text>
  <text x="185" y="194" text-anchor="middle" font-size="11" fill="#c8d8ff">Point-of-contact address</text>
  <!-- Arrow -->
  <line x1="332" y1="182" x2="398" y2="182" stroke="#d4a017" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <!-- Right box -->
  <rect x="400" y="158" width="420" height="48" rx="6" fill="#e6f7f5" stroke="#1a9e8f" stroke-width="1.5"/>
  <text x="610" y="177" text-anchor="middle" font-size="12" font-weight="600" fill="#1a9e8f">Owner Identity Anchor</text>
  <text x="610" y="194" text-anchor="middle" font-size="11" fill="#555">Binds the AI system to a responsible human identity</text>

  <!-- ===== ROW 3 ===== -->
  <!-- Left pill: agency_bureau -->
  <rect x="40" y="224" width="290" height="48" rx="24" fill="#1a2a6c"/>
  <text x="185" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">agency_bureau</text>
  <text x="185" y="260" text-anchor="middle" font-size="11" fill="#c8d8ff">Reporting bureau name</text>
  <!-- Arrow -->
  <line x1="332" y1="248" x2="398" y2="248" stroke="#d4a017" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <!-- Right box -->
  <rect x="400" y="224" width="420" height="48" rx="6" fill="#e6f7f5" stroke="#1a9e8f" stroke-width="1.5"/>
  <text x="610" y="243" text-anchor="middle" font-size="12" font-weight="600" fill="#1a9e8f">OrgTree Placement Node</text>
  <text x="610" y="260" text-anchor="middle" font-size="11" fill="#555">Maps directly to an OrgPath organizational position</text>

  <!-- ===== ROW 4 ===== -->
  <!-- Left pill: has_pii / pia_url -->
  <rect x="40" y="290" width="290" height="48" rx="24" fill="#1a2a6c"/>
  <text x="185" y="309" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">has_pii / pia_url</text>
  <text x="185" y="326" text-anchor="middle" font-size="11" fill="#c8d8ff">PII flag and PIA link</text>
  <!-- Arrow -->
  <line x1="332" y1="314" x2="398" y2="314" stroke="#d4a017" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <!-- Right box -->
  <rect x="400" y="290" width="420" height="48" rx="6" fill="#e6f7f5" stroke="#1a9e8f" stroke-width="1.5"/>
  <text x="610" y="309" text-anchor="middle" font-size="12" font-weight="600" fill="#1a9e8f">Credential Sensitivity Tier</text>
  <text x="610" y="326" text-anchor="middle" font-size="11" fill="#555">Determines rotation cadence and access review scope</text>

  <!-- ===== ROW 5 ===== -->
  <!-- Left pill: is_high_impact -->
  <rect x="40" y="356" width="290" height="48" rx="24" fill="#1a2a6c"/>
  <text x="185" y="375" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">is_high_impact</text>
  <text x="185" y="392" text-anchor="middle" font-size="11" fill="#c8d8ff">High-impact AI flag</text>
  <!-- Arrow -->
  <line x1="332" y1="380" x2="398" y2="380" stroke="#d4a017" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <!-- Right box -->
  <rect x="400" y="356" width="420" height="48" rx="6" fill="#e6f7f5" stroke="#1a9e8f" stroke-width="1.5"/>
  <text x="610" y="375" text-anchor="middle" font-size="12" font-weight="600" fill="#1a9e8f">Governance Posture Requirement</text>
  <text x="610" y="392" text-anchor="middle" font-size="11" fill="#555">Triggers full checklist: testing, review, failsafe, appeal</text>

  <!-- ===== ROW 6 ===== -->
  <!-- Left pill: development_stage -->
  <rect x="40" y="422" width="290" height="48" rx="24" fill="#1a2a6c"/>
  <text x="185" y="441" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">development_stage</text>
  <text x="185" y="458" text-anchor="middle" font-size="11" fill="#c8d8ff">Lifecycle status label</text>
  <!-- Arrow -->
  <line x1="332" y1="446" x2="398" y2="446" stroke="#d4a017" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <!-- Right box -->
  <rect x="400" y="422" width="420" height="48" rx="6" fill="#e6f7f5" stroke="#1a9e8f" stroke-width="1.5"/>
  <text x="610" y="441" text-anchor="middle" font-size="12" font-weight="600" fill="#1a9e8f">Credential Lifecycle State</text>
  <text x="610" y="458" text-anchor="middle" font-size="11" fill="#555">Retirement triggers credential revocation and OrgPath archive</text>

  <!-- Bottom caption -->
  <line x1="60" y1="486" x2="800" y2="486" stroke="#dddddd" stroke-width="1"/>
  <text x="430" y="505" text-anchor="middle" font-size="11" fill="#888888">Source: OMB M-25-21 §4(b) + inventory schema · ADR-109 §1 reframe · UIAO OrgPath Book 21</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d4a017"/>
    </marker>
  </defs>
</svg>
