<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a2a6c"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a9e8f"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d4a017"/>
    </marker>
  </defs>

  <text x="430" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2a6c">MLTS Scope: All Paths Lead to LocPath</text>

  <!-- LEFT COLUMN: System Types -->
  <text x="160" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2a6c">MLTS / UCaaS Type</text>

  <!-- IP-PBX -->
  <rect x="30" y="82" width="260" height="70" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="2" rx="4"/>
  <rect x="30" y="82" width="260" height="26" fill="#1a2a6c" rx="4"/>
  <rect x="30" y="96" width="260" height="12" fill="#1a2a6c"/>
  <text x="160" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">On-Premises IP-PBX</text>
  <text x="160" y="122" text-anchor="middle" font-size="10" fill="#555">Cisco CUCM · Avaya Aura</text>
  <text x="160" y="138" text-anchor="middle" font-size="10" fill="#555">Microsoft Lync / SFBO Survivable</text>

  <!-- Hosted UCaaS -->
  <rect x="30" y="168" width="260" height="70" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="2" rx="4"/>
  <rect x="30" y="168" width="260" height="26" fill="#1a2a6c" rx="4"/>
  <rect x="30" y="182" width="260" height="12" fill="#1a2a6c"/>
  <text x="160" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Hosted UCaaS Platform</text>
  <text x="160" y="208" text-anchor="middle" font-size="10" fill="#555">Teams Phone (Calling Plan / Direct Routing)</text>
  <text x="160" y="224" text-anchor="middle" font-size="10" fill="#555">Webex Calling · RingCentral</text>

  <!-- Hybrid -->
  <rect x="30" y="254" width="260" height="70" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="2" rx="4"/>
  <rect x="30" y="254" width="260" height="26" fill="#1a2a6c" rx="4"/>
  <rect x="30" y="268" width="260" height="12" fill="#1a2a6c"/>
  <text x="160" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Hybrid PBX / UCaaS</text>
  <text x="160" y="294" text-anchor="middle" font-size="10" fill="#555">On-prem PBX + cloud survivability</text>
  <text x="160" y="310" text-anchor="middle" font-size="10" fill="#555">Each path = separate E911 obligation</text>

  <!-- Key system -->
  <rect x="30" y="340" width="260" height="60" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="1.5" rx="4"/>
  <text x="160" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a6c">Key System (analog)</text>
  <text x="160" y="382" text-anchor="middle" font-size="10" fill="#555">Multi-extension analog · legacy sites</text>

  <!-- NOT MLTS -->
  <rect x="30" y="420" width="260" height="60" fill="#f8f8f8" stroke="#cccccc" stroke-width="1.5" rx="4" stroke-dasharray="5,3"/>
  <text x="160" y="444" text-anchor="middle" font-size="11" fill="#aaaaaa">Residential / Single-Line</text>
  <text x="160" y="462" text-anchor="middle" font-size="10" fill="#aaaaaa">Not MLTS — no obligation</text>
  <line x1="30" y1="420" x2="290" y2="480" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="290" y1="420" x2="30" y2="480" stroke="#c0392b" stroke-width="1.5"/>

  <!-- CENTER: E911 Obligation flags -->
  <text x="430" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4a017">E911 Obligation</text>

  <!-- Obligation arrows from each MLTS type -->
  <line x1="290" y1="117" x2="370" y2="205" stroke="#d4a017" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <line x1="290" y1="203" x2="370" y2="215" stroke="#d4a017" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <line x1="290" y1="289" x2="370" y2="225" stroke="#d4a017" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <line x1="290" y1="370" x2="370" y2="230" stroke="#d4a017" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <rect x="370" y="170" width="120" height="90" fill="#fff8e6" stroke="#d4a017" stroke-width="2" rx="4"/>
  <text x="430" y="195" text-anchor="middle" font-size="20" fill="#d4a017">⚑</text>
  <text x="430" y="215" text-anchor="middle" font-size="10" font-weight="bold" fill="#d4a017">dispatchable</text>
  <text x="430" y="229" text-anchor="middle" font-size="10" font-weight="bold" fill="#d4a017">Location</text>
  <text x="430" y="243" text-anchor="middle" font-size="10" font-weight="bold" fill="#d4a017">Required</text>

  <!-- Arrow to LocPath -->
  <line x1="490" y1="215" x2="570" y2="215" stroke="#1a9e8f" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- RIGHT COLUMN: LocPath hierarchy -->
  <text x="710" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2a6c">LocPath Node Hierarchy</text>

  <!-- Site -->
  <rect x="620" y="82" width="180" height="36" fill="#1a2a6c" rx="3"/>
  <text x="710" y="105" text-anchor="middle" font-size="11" fill="#ffffff">Site</text>
  <line x1="710" y1="118" x2="710" y2="140" stroke="#1a2a6c" stroke-width="1.5"/>

  <!-- Building -->
  <rect x="635" y="140" width="150" height="36" fill="#1a2a6c" rx="3"/>
  <text x="710" y="163" text-anchor="middle" font-size="11" fill="#ffffff">Building</text>
  <line x1="710" y1="176" x2="710" y2="198" stroke="#1a2a6c" stroke-width="1.5"/>

  <!-- Floor -->
  <rect x="645" y="198" width="130" height="44" fill="#1a9e8f" rx="3"/>
  <text x="710" y="217" text-anchor="middle" font-size="11" fill="#ffffff">Floor</text>
  <rect x="660" y="225" width="100" height="14" fill="#ffffff" rx="2"/>
  <text x="710" y="236" text-anchor="middle" font-size="9" fill="#1a9e8f">e911 block ⭐</text>
  <line x1="710" y1="242" x2="710" y2="264" stroke="#1a9e8f" stroke-width="1.5"/>

  <!-- Space -->
  <rect x="655" y="264" width="110" height="44" fill="#1a9e8f" rx="3"/>
  <text x="710" y="283" text-anchor="middle" font-size="11" fill="#ffffff">Space</text>
  <rect x="665" y="291" width="90" height="14" fill="#ffffff" rx="2"/>
  <text x="710" y="302" text-anchor="middle" font-size="9" fill="#1a9e8f">locationDescription</text>

  <!-- Inheritance annotation -->
  <rect x="600" y="328" width="220" height="55" fill="#f0fffc" stroke="#1a9e8f" stroke-width="1" rx="3"/>
  <text x="710" y="348" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">Civic Address Inheritance</text>
  <text x="710" y="364" text-anchor="middle" font-size="9" fill="#555">Site civicAddress inherited by</text>
  <text x="710" y="378" text-anchor="middle" font-size="9" fill="#555">Building → Floor → Space</text>

  <!-- Obligation stamps annotation -->
  <rect x="600" y="398" width="220" height="60" fill="#fff8e6" stroke="#d4a017" stroke-width="1" rx="3"/>
  <text x="710" y="418" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">Obligation Stamping</text>
  <text x="710" y="434" text-anchor="middle" font-size="9" fill="#555">Telephony adapter discovers</text>
  <text x="710" y="448" text-anchor="middle" font-size="9" fill="#555">extension registrations → stamps</text>
  <text x="710" y="462" text-anchor="middle" font-size="9" fill="#555">dispatchableLocationRequired: true</text>
</svg>
