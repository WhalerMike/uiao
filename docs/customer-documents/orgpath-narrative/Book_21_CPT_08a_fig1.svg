<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="500" fill="#FFFFFF"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1F3A5F">The Centralized Deployment Model — CDM for the AI Identity Surface</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#5A6B7B">One central scan to fifty-six agencies' substrate — deployment as the end-state, not the entry fee</text>

  <!-- Tier 0 -->
  <rect x="24" y="92" width="196" height="240" rx="10" fill="#F4F6F8" stroke="#B9C2CC" stroke-width="1.5"/>
  <rect x="24" y="92" width="196" height="44" rx="10" fill="#6B7A8A"/>
  <rect x="24" y="122" width="196" height="14" fill="#6B7A8A"/>
  <text x="122" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">TIER 0</text>
  <text x="122" y="129" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Central Scan</text>
  <text x="122" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#1F3A5F">OFCIO / CISA</text>
  <text x="38" y="188" font-size="11" fill="#243248">L1 scanner runs against the</text>
  <text x="38" y="205" font-size="11" fill="#243248">public OMB CSV — all 56</text>
  <text x="38" y="222" font-size="11" fill="#243248">agencies, 1,480 live systems,</text>
  <text x="38" y="239" font-size="11" fill="#243248">one run, under two minutes.</text>
  <text x="38" y="268" font-size="11" font-style="italic" fill="#5A6B7B">Requires of the agency:</text>
  <text x="38" y="285" font-size="12" font-weight="700" fill="#1A9E8F">nothing</text>

  <!-- arrow -->
  <path d="M222 212 L244 212" stroke="#1A9E8F" stroke-width="3" fill="none"/>
  <path d="M244 205 L256 212 L244 219 Z" fill="#1A9E8F"/>

  <!-- Tier 1 -->
  <rect x="252" y="92" width="196" height="240" rx="10" fill="#FDF6E7" stroke="#E8A020" stroke-width="1.5"/>
  <rect x="252" y="92" width="196" height="44" rx="10" fill="#E8A020"/>
  <rect x="252" y="122" width="196" height="14" fill="#E8A020"/>
  <text x="350" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">TIER 1</text>
  <text x="350" y="129" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">CISO Notification</text>
  <text x="350" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#1F3A5F">OFCIO → agency CISO</text>
  <text x="266" y="185" font-size="11" fill="#243248">Structured per-agency</text>
  <text x="266" y="201" font-size="11" fill="#243248">findings; 14 P1 agentic</text>
  <text x="266" y="217" font-size="11" fill="#243248">systems escalated within</text>
  <text x="266" y="233" font-size="11" fill="#243248">72 hours; scorecard for</text>
  <text x="266" y="249" font-size="11" fill="#243248">OMB leadership.</text>
  <text x="266" y="268" font-size="11" font-style="italic" fill="#5A6B7B">Requires of the agency:</text>
  <text x="266" y="285" font-size="12" font-weight="700" fill="#B27210">receipt and triage</text>

  <!-- arrow -->
  <path d="M450 212 L472 212" stroke="#1A9E8F" stroke-width="3" fill="none"/>
  <path d="M472 205 L484 212 L472 219 Z" fill="#1A9E8F"/>

  <!-- Tier 2 -->
  <rect x="480" y="92" width="196" height="240" rx="10" fill="#E2F4F1" stroke="#1A9E8F" stroke-width="1.5"/>
  <rect x="480" y="92" width="196" height="44" rx="10" fill="#1A9E8F"/>
  <rect x="480" y="122" width="196" height="14" fill="#1A9E8F"/>
  <text x="578" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">TIER 2</text>
  <text x="578" y="129" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Agency Remediation</text>
  <text x="578" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#1F3A5F">Agency</text>
  <text x="494" y="185" font-size="11" fill="#243248">Ownership asserted,</text>
  <text x="494" y="201" font-size="11" fill="#243248">credentials rotated,</text>
  <text x="494" y="217" font-size="11" fill="#243248">governance contacts and</text>
  <text x="494" y="233" font-size="11" fill="#243248">schema extensions in the</text>
  <text x="494" y="249" font-size="11" fill="#243248">next inventory submission.</text>
  <text x="494" y="268" font-size="11" font-style="italic" fill="#5A6B7B">Requires of the agency:</text>
  <text x="494" y="285" font-size="12" font-weight="700" fill="#1A9E8F">existing IGA tooling</text>

  <!-- arrow -->
  <path d="M678 212 L700 212" stroke="#1A9E8F" stroke-width="3" fill="none"/>
  <path d="M700 205 L712 212 L700 219 Z" fill="#1A9E8F"/>

  <!-- Tier 3 -->
  <rect x="708" y="92" width="168" height="240" rx="10" fill="#EDF2FA" stroke="#1F3A5F" stroke-width="1.5"/>
  <rect x="708" y="92" width="168" height="44" rx="10" fill="#1F3A5F"/>
  <rect x="708" y="122" width="168" height="14" fill="#1F3A5F"/>
  <text x="792" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">TIER 3</text>
  <text x="792" y="129" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Substrate Deployment</text>
  <text x="792" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#1F3A5F">Agency</text>
  <text x="722" y="188" font-size="11" fill="#243248">Full OrgPath binding,</text>
  <text x="722" y="205" font-size="11" fill="#243248">credential lifecycle</text>
  <text x="722" y="222" font-size="11" fill="#243248">automation, drift engine</text>
  <text x="722" y="239" font-size="11" fill="#243248">integration.</text>
  <text x="722" y="268" font-size="11" font-style="italic" fill="#5A6B7B">Requires of the agency:</text>
  <text x="722" y="285" font-size="12" font-weight="700" fill="#1F3A5F">UIAO deployment</text>

  <!-- annual loop annotation -->
  <path d="M578 332 C578 366, 122 366, 122 336" stroke="#B9C2CC" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <path d="M116 344 L122 332 L128 344 Z" fill="#B9C2CC"/>
  <text x="350" y="382" text-anchor="middle" font-size="11" font-style="italic" fill="#5A6B7B">Annual inventory vintage → the scan re-runs, findings age or close, the scorecard moves</text>

  <!-- CDM band -->
  <rect x="24" y="408" width="852" height="62" rx="8" fill="#EDF2FA"/>
  <text x="450" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#1F3A5F">The CDM pattern: central capability, agency remediation.</text>
  <text x="450" y="446" text-anchor="middle" font-size="11" fill="#243248">DHS/CISA ran the scanners and pushed findings to agency dashboards; agencies fixed the findings.</text>
  <text x="450" y="462" text-anchor="middle" font-size="11" fill="#243248">Discovery is centralized once — remediation stays with the owner.</text>
</svg>
