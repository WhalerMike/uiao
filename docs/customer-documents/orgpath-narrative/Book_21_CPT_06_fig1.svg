<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- White background -->
  <rect width="800" height="500" fill="white"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#0d2b5e">Shadow AI Detection: Registry vs Inventory</text>

  <!-- Left circle: UIAO Machine-Identity Registry (navy) -->
  <circle cx="290" cy="260" r="165" fill="#0d2b5e" fill-opacity="0.15" stroke="#0d2b5e" stroke-width="3"/>

  <!-- Right circle: OMB M-25-21 Inventory (teal) -->
  <circle cx="510" cy="260" r="165" fill="#0d8080" fill-opacity="0.15" stroke="#0d8080" stroke-width="3"/>

  <!-- Left-only zone label area (Shadow AI) — red fill patch -->
  <circle cx="290" cy="260" r="165" fill="none"/>
  <!-- Red highlight for left-only zone -->
  <clipPath id="leftOnly">
    <rect x="60" y="80" width="280" height="360"/>
  </clipPath>
  <circle cx="290" cy="260" r="165" fill="#c0392b" fill-opacity="0.18" clip-path="url(#leftOnly)"/>

  <!-- Amber highlight for right-only zone -->
  <clipPath id="rightOnly">
    <rect x="460" y="80" width="280" height="360"/>
  </clipPath>
  <circle cx="510" cy="260" r="165" fill="#d4860a" fill-opacity="0.18" clip-path="url(#rightOnly)"/>

  <!-- Overlap zone label -->
  <text x="400" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d2b5e">Governed</text>
  <text x="400" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d2b5e">ATO Verified</text>

  <!-- Left circle label -->
  <text x="205" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d2b5e">UIAO</text>
  <text x="205" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d2b5e">Machine-Identity</text>
  <text x="205" y="191" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d2b5e">Registry</text>

  <!-- Right circle label -->
  <text x="592" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d8080">OMB M-25-21</text>
  <text x="592" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d8080">Inventory</text>

  <!-- Left-only zone: Shadow AI -->
  <text x="168" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Shadow AI</text>
  <text x="168" y="303" text-anchor="middle" font-size="11" fill="#c0392b">P1 HALT</text>
  <text x="168" y="319" text-anchor="middle" font-size="10" fill="#c0392b">ungoverned —</text>
  <text x="168" y="334" text-anchor="middle" font-size="10" fill="#c0392b">no inventory record</text>

  <!-- Right-only zone: ATO Gap -->
  <text x="628" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4860a">ATO Gap</text>
  <text x="628" y="303" text-anchor="middle" font-size="11" fill="#d4860a">in inventory,</text>
  <text x="628" y="319" text-anchor="middle" font-size="11" fill="#d4860a">not in registry</text>

  <!-- P1 badge in left-only zone -->
  <rect x="110" y="345" width="110" height="28" rx="5" fill="#c0392b"/>
  <text x="165" y="363" text-anchor="middle" font-size="12" font-weight="bold" fill="white">DRIFT-IDENTITY P1</text>

  <!-- Legend -->
  <rect x="60" y="445" width="18" height="14" fill="#c0392b" fill-opacity="0.55" stroke="#c0392b" stroke-width="1"/>
  <text x="84" y="457" font-size="12" fill="#333">Shadow AI — registry only, no OMB record</text>
  <rect x="340" y="445" width="18" height="14" fill="#d4860a" fill-opacity="0.55" stroke="#d4860a" stroke-width="1"/>
  <text x="364" y="457" font-size="12" fill="#333">ATO Gap — inventory only, no registry record</text>
  <rect x="620" y="445" width="18" height="14" fill="#0d8080" fill-opacity="0.30" stroke="#0d2b5e" stroke-width="1"/>
  <text x="644" y="457" font-size="12" fill="#333">Governed</text>
</svg>
