<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <title>The Federal AI ATO Gap — 596 of 1,480 Live Systems</title>
  <desc>A funnel diagram showing 1,480 live federal AI systems filtered to the 596 with an ATO gap, then split into three outcome paths: 884 with ATO YES (green), and the 596 broken into ATO NO (red, largest) and ATO UNKNOWN (amber).</desc>

  <!-- Background -->
  <rect width="860" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2a6c">The Federal AI ATO Gap — 596 of 1,480 Live Systems</text>
  <text x="430" y="56" text-anchor="middle" font-size="11.5" fill="#555">40% of live federal AI systems operate without an Authorization to Operate</text>

  <!-- FUNNEL TOP: 1,480 live systems -->
  <polygon points="200,80 660,80 580,170 280,170" fill="#1a2a6c" opacity="0.9"/>
  <text x="430" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1,480 Live Federal AI Systems</text>
  <text x="430" y="130" text-anchor="middle" font-size="11" fill="#b0bcd8">OMB 2025 Inventory — Deployed or Active Pilot</text>
  <text x="430" y="152" text-anchor="middle" font-size="10.5" fill="#7ec8e3">ADR-054 · ADR-109 · UIAO_196 scanner</text>

  <!-- FUNNEL NECK -->
  <polygon points="280,170 580,170 530,240 330,240" fill="#c0392b" opacity="0.85"/>
  <text x="430" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">596 Systems — ATO Gap</text>
  <text x="430" y="218" text-anchor="middle" font-size="10.5" fill="#f5c6c6">have_ato ≠ YES  ·  40% of live estate</text>

  <!-- Connector lines from funnel to three boxes -->
  <!-- Left (green) -->
  <line x1="330" y1="240" x2="155" y2="340" stroke="#1a8a4a" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- Center right (red) -->
  <line x1="430" y1="240" x2="430" y2="340" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Right (amber) -->
  <line x1="530" y1="240" x2="700" y2="340" stroke="#d97706" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- BOX LEFT: ATO YES — 884 systems (NOT in the gap, shown for context) -->
  <rect x="30" y="340" width="250" height="130" rx="8" fill="#e8f5ec" stroke="#1a8a4a" stroke-width="2"/>
  <text x="155" y="367" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a5c2e">ATO YES</text>
  <text x="155" y="389" text-anchor="middle" font-size="22" font-weight="800" fill="#1a8a4a">884</text>
  <text x="155" y="410" text-anchor="middle" font-size="10.5" fill="#2d7a46">60% of live estate</text>
  <text x="155" y="428" text-anchor="middle" font-size="10" fill="#555">Authorization current</text>
  <text x="155" y="445" text-anchor="middle" font-size="10" fill="#555">Credential boundary defined</text>
  <text x="155" y="463" text-anchor="middle" font-size="9.5" fill="#888">Governed · scanner finding: PASS</text>

  <!-- BOX CENTER: ATO NO — largest slice of 596 -->
  <rect x="305" y="340" width="250" height="130" rx="8" fill="#fce8e6" stroke="#c0392b" stroke-width="2.5"/>
  <text x="430" y="367" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b1a1a">ATO NO</text>
  <text x="430" y="389" text-anchor="middle" font-size="22" font-weight="800" fill="#c0392b">~430</text>
  <text x="430" y="410" text-anchor="middle" font-size="10.5" fill="#b03020">Largest share of the gap</text>
  <text x="430" y="428" text-anchor="middle" font-size="10" fill="#555">No authorization boundary</text>
  <text x="430" y="445" text-anchor="middle" font-size="10" fill="#555">Credential scope unbounded</text>
  <text x="430" y="463" text-anchor="middle" font-size="9.5" fill="#c0392b">P2 finding · NEVER_AUTOFIX</text>

  <!-- BOX RIGHT: ATO UNKNOWN — amber -->
  <rect x="580" y="340" width="250" height="130" rx="8" fill="#fff8e6" stroke="#d97706" stroke-width="2"/>
  <text x="705" y="367" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c4a00">ATO UNKNOWN</text>
  <text x="705" y="389" text-anchor="middle" font-size="22" font-weight="800" fill="#d97706">~166</text>
  <text x="705" y="410" text-anchor="middle" font-size="10.5" fill="#b06000">Authorization unverifiable</text>
  <text x="705" y="428" text-anchor="middle" font-size="10" fill="#555">No confirmation ATO exists</text>
  <text x="705" y="445" text-anchor="middle" font-size="10" fill="#555">Agency has not reported status</text>
  <text x="705" y="463" text-anchor="middle" font-size="9.5" fill="#d97706">Treated as NO for risk scoring</text>

  <!-- ATOStatus enum label bar -->
  <rect x="100" y="492" width="660" height="30" rx="5" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="1"/>
  <text x="430" y="512" text-anchor="middle" font-size="10.5" fill="#1a2a6c">ATOStatus enum: <tspan font-weight="700" fill="#1a8a4a">YES</tspan>  ·  <tspan font-weight="700" fill="#c0392b">NO</tspan>  ·  <tspan font-weight="700" fill="#555">NOT_APPLICABLE</tspan>  ·  <tspan font-weight="700" fill="#d97706">UNKNOWN</tspan>   — join key: system_name_ato (ADR-054 · ADR-109)</text>

  <!-- Legend note -->
  <text x="430" y="548" text-anchor="middle" font-size="9.5" fill="#888">Approximate breakdown of 596 gap systems; exact split is scanner-reported per inventory snapshot. NOT_APPLICABLE systems excluded from gap count.</text>
</svg>
