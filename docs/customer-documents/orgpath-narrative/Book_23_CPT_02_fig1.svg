<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a2a6c"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a9e8f"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="430" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2a6c">LocPath Two-Layer Model for E911 Compliance</text>

  <!-- GOVERNED LAYER -->
  <rect x="40" y="60" width="520" height="185" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="2.5" rx="6"/>
  <rect x="40" y="60" width="520" height="32" fill="#1a2a6c" rx="6"/>
  <rect x="40" y="80" width="520" height="12" fill="#1a2a6c"/>
  <text x="290" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">GOVERNED LAYER — Primary LocPath Node</text>

  <!-- Gold badge -->
  <rect x="390" y="96" width="155" height="24" fill="#d4a017" rx="3"/>
  <text x="468" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">⭐ System of Record</text>

  <!-- Fields -->
  <rect x="55" y="100" width="320" height="130" fill="#ffffff" stroke="#1a9e8f" stroke-width="1.5" rx="4"/>
  <text x="215" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a6c">e911 Block Fields</text>
  <text x="75" y="140" font-size="10" fill="#1a2a6c">civicAddress</text>
  <text x="260" y="140" font-size="10" fill="#1a9e8f">123 Federal Ave, Washington DC 20001</text>
  <line x1="75" y1="148" x2="365" y2="148" stroke="#eeeeee" stroke-width="1"/>
  <text x="75" y="163" font-size="10" fill="#1a2a6c">floorDesignation</text>
  <text x="260" y="163" font-size="10" fill="#1a9e8f">"7"</text>
  <line x1="75" y1="171" x2="365" y2="171" stroke="#eeeeee" stroke-width="1"/>
  <text x="75" y="186" font-size="10" fill="#1a2a6c">locationDescription</text>
  <text x="260" y="186" font-size="10" fill="#1a9e8f">"North wing, Suite 700N"</text>
  <line x1="75" y1="194" x2="365" y2="194" stroke="#eeeeee" stroke-width="1"/>
  <text x="75" y="209" font-size="10" fill="#1a2a6c">dispatchableLocationRequired</text>
  <text x="260" y="209" font-size="10" fill="#1a9e8f">true</text>
  <line x1="75" y1="217" x2="365" y2="217" stroke="#eeeeee" stroke-width="1"/>
  <text x="75" y="232" font-size="10" fill="#1a2a6c">civicAddressValidated</text>
  <text x="260" y="232" font-size="10" fill="#1a9e8f">true · validated 2026-05-01</text>

  <!-- Arrow to PSAP -->
  <line x1="560" y1="155" x2="670" y2="155" stroke="#1a2a6c" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  <text x="612" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">Transmitted</text>
  <text x="612" y="158" text-anchor="middle" font-size="10" fill="#1a2a6c">with 911 Call</text>

  <!-- PSAP box -->
  <rect x="670" y="100" width="150" height="110" fill="#f0fff8" stroke="#1a9e8f" stroke-width="2" rx="4"/>
  <text x="745" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a6c">PSAP</text>
  <rect x="685" y="130" width="120" height="70" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="2"/>
  <text x="745" y="148" text-anchor="middle" font-size="9" fill="#1a2a6c">123 Federal Ave</text>
  <text x="745" y="162" text-anchor="middle" font-size="9" fill="#1a2a6c">Washington DC 20001</text>
  <text x="745" y="176" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a9e8f">Floor: 7</text>
  <text x="745" y="190" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a9e8f">Suite 700N</text>
  <circle cx="745" cy="208" r="10" fill="#1a9e8f"/>
  <text x="745" y="213" text-anchor="middle" font-size="12" fill="#ffffff">✓</text>

  <!-- OBSERVATIONAL LAYER -->
  <rect x="40" y="270" width="520" height="210" fill="#f0fffc" stroke="#1a9e8f" stroke-width="2" rx="6"/>
  <rect x="40" y="270" width="520" height="32" fill="#1a9e8f" rx="6"/>
  <rect x="40" y="290" width="520" height="12" fill="#1a9e8f"/>
  <text x="290" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">OBSERVATIONAL LAYER — Dynamic Location Context</text>

  <!-- Source boxes -->
  <rect x="55" y="310" width="100" height="50" fill="#ffffff" stroke="#1a9e8f" stroke-width="1.5" rx="3"/>
  <text x="105" y="332" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">GPS</text>
  <text x="105" y="348" text-anchor="middle" font-size="9" fill="#555">~5m outdoors</text>

  <rect x="170" y="310" width="100" height="50" fill="#ffffff" stroke="#1a9e8f" stroke-width="1.5" rx="3"/>
  <text x="220" y="332" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">WiFi</text>
  <text x="220" y="348" text-anchor="middle" font-size="9" fill="#555">zone-level</text>

  <rect x="285" y="310" width="100" height="50" fill="#ffffff" stroke="#1a9e8f" stroke-width="1.5" rx="3"/>
  <text x="335" y="332" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">BLE 5.1 AoA</text>
  <text x="335" y="348" text-anchor="middle" font-size="9" fill="#555">room-level</text>

  <rect x="400" y="310" width="100" height="50" fill="#ffffff" stroke="#1a9e8f" stroke-width="1.5" rx="3"/>
  <text x="450" y="332" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">UWB</text>
  <text x="450" y="348" text-anchor="middle" font-size="9" fill="#555">cm precision</text>

  <!-- Enhances arrows -->
  <line x1="105" y1="362" x2="105" y2="398" stroke="#1a9e8f" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
  <line x1="220" y1="362" x2="220" y2="398" stroke="#1a9e8f" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
  <line x1="335" y1="362" x2="335" y2="398" stroke="#1a9e8f" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
  <line x1="450" y1="362" x2="450" y2="398" stroke="#1a9e8f" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>

  <text x="290" y="392" text-anchor="middle" font-size="10" fill="#1a9e8f">Enhances ↓</text>

  <!-- Never substitutes label -->
  <rect x="55" y="405" width="460" height="60" fill="#fff3f3" stroke="#c0392b" stroke-width="1.5" rx="3" stroke-dasharray="5,3"/>
  <text x="285" y="427" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">✗  Never substitutes for the Governed Layer</text>
  <text x="285" y="447" text-anchor="middle" font-size="10" fill="#555">Observational feeds are enhancement only — not transmitted as the dispatchable location</text>

  <!-- Supplemental channel arrow to PSAP (dashed) -->
  <line x1="560" y1="380" x2="670" y2="240" stroke="#1a9e8f" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-teal)"/>
  <text x="630" y="310" text-anchor="middle" font-size="9" fill="#1a9e8f">Supplemental</text>
  <text x="630" y="323" text-anchor="middle" font-size="9" fill="#1a9e8f">ALI update</text>
</svg>
