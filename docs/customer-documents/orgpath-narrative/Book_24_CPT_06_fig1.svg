<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <text x="430" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2a6c">Unified Authorization Surface -- Human, Device, and AI KSI Emission</text>

  <!-- Lane 1: Human Identities -->
  <rect x="20" y="50" width="200" height="360" rx="8" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="1.5"/>
  <rect x="20" y="50" width="200" height="44" rx="8" fill="#1a2a6c"/>
  <rect x="20" y="74" width="200" height="20" fill="#1a2a6c"/>
  <text x="120" y="78" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">Human Identities</text>

  <!-- Person icons -->
  <circle cx="80" cy="135" r="10" fill="#1a2a6c"/>
  <path d="M60,160 Q80,150 100,160" stroke="#1a2a6c" stroke-width="2" fill="none"/>
  <circle cx="120" cy="135" r="10" fill="#1a2a6c"/>
  <path d="M100,160 Q120,150 140,160" stroke="#1a2a6c" stroke-width="2" fill="none"/>
  <circle cx="160" cy="135" r="10" fill="#1a2a6c"/>
  <path d="M140,160 Q160,150 180,160" stroke="#1a2a6c" stroke-width="2" fill="none"/>

  <!-- OrgPath label -->
  <rect x="35" y="220" width="170" height="28" rx="4" fill="#1a9e8f"/>
  <text x="120" y="238" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">DOD:DISA and HHS:CMS</text>

  <!-- KSI types -->
  <text x="120" y="280" text-anchor="middle" font-size="10" fill="#333333">MFA Coverage KSI</text>
  <text x="120" y="298" text-anchor="middle" font-size="10" fill="#333333">Access Review KSI</text>
  <text x="120" y="316" text-anchor="middle" font-size="10" fill="#333333">Inactive Account KSI</text>

  <!-- Signal arrow -->
  <line x1="220" y1="280" x2="560" y2="220" stroke="#1a2a6c" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="556,215 564,225 556,227" fill="#1a2a6c"/>

  <!-- Lane 2: Device Identities -->
  <rect x="240" y="50" width="200" height="360" rx="8" fill="#f0faf9" stroke="#1a9e8f" stroke-width="1.5"/>
  <rect x="240" y="50" width="200" height="44" rx="8" fill="#1a9e8f"/>
  <rect x="240" y="74" width="200" height="20" fill="#1a9e8f"/>
  <text x="340" y="78" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">Device Identities</text>

  <!-- Device icons -->
  <rect x="280" y="125" width="30" height="44" rx="3" fill="#1a9e8f" opacity="0.5"/>
  <rect x="322" y="125" width="30" height="44" rx="3" fill="#1a9e8f" opacity="0.5"/>
  <rect x="364" y="125" width="30" height="44" rx="3" fill="#1a9e8f" opacity="0.5"/>

  <!-- OrgPath label -->
  <rect x="255" y="220" width="170" height="28" rx="4" fill="#1a9e8f"/>
  <text x="340" y="238" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">DOD:DISA and GSA:FAS</text>

  <!-- KSI types -->
  <text x="340" y="280" text-anchor="middle" font-size="10" fill="#333333">Device Compliance KSI</text>
  <text x="340" y="298" text-anchor="middle" font-size="10" fill="#333333">Patch Currency KSI</text>
  <text x="340" y="316" text-anchor="middle" font-size="10" fill="#333333">Encryption KSI</text>

  <!-- Signal arrow -->
  <line x1="440" y1="280" x2="562" y2="240" stroke="#1a9e8f" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="558,235 566,245 558,247" fill="#1a9e8f"/>

  <!-- Lane 3: AI System Identities -->
  <rect x="460" y="50" width="200" height="360" rx="8" fill="#fffbf0" stroke="#d4a017" stroke-width="1.5"/>
  <rect x="460" y="50" width="200" height="44" rx="8" fill="#d4a017"/>
  <rect x="460" y="74" width="200" height="20" fill="#d4a017"/>
  <text x="560" y="78" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">AI System Identities</text>

  <!-- AI icons (hexagons) -->
  <polygon points="510,140 528,130 546,140 546,160 528,170 510,160" fill="#d4a017" opacity="0.5"/>
  <polygon points="548,140 566,130 584,140 584,160 566,170 548,160" fill="#d4a017" opacity="0.5"/>
  <polygon points="586,140 604,130 622,140 622,160 604,170 586,160" fill="#d4a017" opacity="0.5"/>

  <!-- OrgPath label -->
  <rect x="475" y="220" width="170" height="28" rx="4" fill="#d4a017"/>
  <text x="560" y="238" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">All Bureaus</text>

  <!-- KSI types -->
  <text x="560" y="280" text-anchor="middle" font-size="10" fill="#333333">ATO Coverage KSI</text>
  <text x="560" y="298" text-anchor="middle" font-size="10" fill="#333333">Credential Rotation KSI</text>
  <text x="560" y="316" text-anchor="middle" font-size="10" fill="#333333">OrgPath Coverage KSI</text>

  <!-- Signal arrow -->
  <line x1="660" y1="280" x2="700" y2="260" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="696,255 704,265 696,267" fill="#d4a017"/>

  <!-- Evidence bundle -->
  <rect x="690" y="140" width="150" height="180" rx="8" fill="#1a2a6c"/>
  <text x="765" y="168" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">OSCAL</text>
  <text x="765" y="185" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Evidence</text>
  <text x="765" y="202" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Bundle</text>
  <text x="765" y="230" text-anchor="middle" font-size="10" fill="#aaaaee">Human KSIs</text>
  <text x="765" y="248" text-anchor="middle" font-size="10" fill="#aaaaee">Device KSIs</text>
  <text x="765" y="266" text-anchor="middle" font-size="10" fill="#aaaaee">AI System KSIs</text>
  <text x="765" y="284" text-anchor="middle" font-size="10" fill="#aaaaee">OrgPath Scope</text>

  <!-- Arrow from bundle to CATO -->
  <line x1="765" y1="320" x2="765" y2="365" stroke="#1a9e8f" stroke-width="2"/>
  <polygon points="759,365 771,365 765,378" fill="#1a9e8f"/>

  <!-- CATO status -->
  <rect x="695" y="378" width="140" height="55" rx="8" fill="#1a9e8f"/>
  <text x="765" y="400" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">CATO</text>
  <text x="765" y="420" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">AUTHORIZED</text>

  <text x="430" y="468" text-anchor="middle" font-size="11" fill="#888888">OrgPath assigns bureau boundary to every identity subject -- human, device, or AI system</text>
  <text x="430" y="488" text-anchor="middle" font-size="11" fill="#888888">All three surfaces emit KSIs into the same OSCAL evidence bundle</text>
</svg>
