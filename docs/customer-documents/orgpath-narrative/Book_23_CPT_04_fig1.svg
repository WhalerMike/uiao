<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a2a6c"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d4a017"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a9e8f"/>
    </marker>
  </defs>

  <text x="430" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2a6c">E911 Completeness Check — Three Code Decision Tree</text>

  <!-- START NODE -->
  <rect x="310" y="52" width="240" height="42" fill="#1a2a6c" rx="4"/>
  <text x="430" y="68" text-anchor="middle" font-size="11" fill="#ffffff">LocPath Node</text>
  <text x="430" y="84" text-anchor="middle" font-size="10" fill="#aaddff">e911.dispatchableLocationRequired: true</text>

  <!-- Arrow down -->
  <line x1="430" y1="94" x2="430" y2="130" stroke="#1a2a6c" stroke-width="2" marker-end="url(#arrow-navy)"/>

  <!-- STAGE 1 DIAMOND -->
  <polygon points="430,130 560,168 430,206 300,168" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="2"/>
  <text x="430" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a6c">Civic Address</text>
  <text x="430" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a6c">Present?</text>

  <!-- NO branch left -->
  <line x1="300" y1="168" x2="130" y2="168" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="215" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">NO</text>

  <!-- GOV-LOCPATH-012 box -->
  <rect x="30" y="135" width="200" height="80" fill="#fff0f0" stroke="#c0392b" stroke-width="2.5" rx="4"/>
  <rect x="30" y="135" width="200" height="28" fill="#c0392b" rx="4"/>
  <rect x="30" y="151" width="200" height="12" fill="#c0392b"/>
  <text x="130" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">GOV-LOCPATH-012</text>
  <text x="130" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Priority 1</text>
  <text x="130" y="191" text-anchor="middle" font-size="10" fill="#555">No Civic Address</text>
  <text x="130" y="205" text-anchor="middle" font-size="10" fill="#c0392b">HALT — no further check</text>

  <!-- YES branch down from diamond -->
  <line x1="430" y1="206" x2="430" y2="248" stroke="#1a9e8f" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="448" y="232" font-size="10" font-weight="bold" fill="#1a9e8f">YES</text>

  <!-- PARALLEL STAGE 2 + 3 -->
  <!-- Split line -->
  <line x1="430" y1="248" x2="200" y2="284" stroke="#1a2a6c" stroke-width="1.5"/>
  <line x1="430" y1="248" x2="660" y2="284" stroke="#1a2a6c" stroke-width="1.5"/>
  <line x1="200" y1="248" x2="660" y2="248" stroke="#1a2a6c" stroke-width="1.5"/>

  <!-- STAGE 2 DIAMOND -->
  <polygon points="200,284 320,322 200,360 80,322" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="2"/>
  <text x="200" y="317" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">Sub-Address</text>
  <text x="200" y="331" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">Precision?</text>

  <!-- NO branch from stage 2 -->
  <line x1="80" y1="322" x2="30" y2="390" stroke="#d4a017" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="42" y="355" font-size="10" font-weight="bold" fill="#d4a017">NO</text>

  <rect x="20" y="390" width="190" height="80" fill="#fffbf0" stroke="#d4a017" stroke-width="2.5" rx="4"/>
  <rect x="20" y="390" width="190" height="28" fill="#d4a017" rx="4"/>
  <rect x="20" y="406" width="190" height="12" fill="#d4a017"/>
  <text x="115" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">GOV-LOCPATH-013</text>
  <text x="115" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#d4a017">Priority 2</text>
  <text x="115" y="446" text-anchor="middle" font-size="10" fill="#555">No Sub-Address Precision</text>
  <text x="115" y="462" text-anchor="middle" font-size="9" fill="#555">floor / suite / locationDescription</text>

  <!-- YES from stage 2 -->
  <line x1="200" y1="360" x2="200" y2="390" stroke="#1a9e8f" stroke-width="1.5"/>
  <circle cx="200" cy="400" r="10" fill="#1a9e8f"/>
  <text x="200" y="404" text-anchor="middle" font-size="12" fill="#ffffff">✓</text>

  <!-- STAGE 3 DIAMOND -->
  <polygon points="660,284 780,322 660,360 540,322" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="2"/>
  <text x="660" y="317" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">PSAP Validation</text>
  <text x="660" y="331" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">Current?</text>

  <!-- NO branch from stage 3 -->
  <line x1="780" y1="322" x2="830" y2="390" stroke="#d4a017" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="820" y="355" font-size="10" font-weight="bold" fill="#d4a017">NO</text>

  <rect x="650" y="390" width="200" height="80" fill="#fffbf0" stroke="#d4a017" stroke-width="2.5" rx="4"/>
  <rect x="650" y="390" width="200" height="28" fill="#d4a017" rx="4"/>
  <rect x="650" y="406" width="200" height="12" fill="#d4a017"/>
  <text x="750" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">GOV-LOCPATH-014</text>
  <text x="750" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#d4a017">Priority 2</text>
  <text x="750" y="446" text-anchor="middle" font-size="10" fill="#555">Address Not PSAP-Validated</text>
  <text x="750" y="462" text-anchor="middle" font-size="9" fill="#555">or validation expired (90 days)</text>

  <!-- YES from stage 3 -->
  <line x1="660" y1="360" x2="660" y2="390" stroke="#1a9e8f" stroke-width="1.5"/>
  <circle cx="660" cy="400" r="10" fill="#1a9e8f"/>
  <text x="660" y="404" text-anchor="middle" font-size="12" fill="#ffffff">✓</text>

  <!-- COMPLIANT box -->
  <rect x="340" y="435" width="180" height="60" fill="#f0fff8" stroke="#1a9e8f" stroke-width="2.5" rx="4"/>
  <text x="430" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a9e8f">✓ COMPLIANT</text>
  <text x="430" y="476" text-anchor="middle" font-size="10" fill="#555">Dispatchable location valid</text>
  <text x="430" y="490" text-anchor="middle" font-size="10" fill="#555">and PSAP-validated</text>

  <line x1="200" y1="410" x2="340" y2="462" stroke="#1a9e8f" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="660" y1="410" x2="520" y2="462" stroke="#1a9e8f" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- OrgPath routing annotation -->
  <rect x="210" y="215" width="170" height="30" fill="#f8f8f8" stroke="#cccccc" stroke-width="1" rx="3"/>
  <text x="295" y="228" text-anchor="middle" font-size="9" fill="#555">All findings route via OrgPath</text>
  <text x="295" y="241" text-anchor="middle" font-size="9" fill="#555">→ Bureau E911 Compliance Officer</text>
</svg>
