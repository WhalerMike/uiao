<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arr-navy" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a2a6c"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a9e8f"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d4a017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2a6c">The Binding-Profile Abstraction: Codebook → Profiles → Drift Engine</text>

  <!-- Layer 1: Codebook -->
  <rect x="240" y="50" width="380" height="90" rx="8" fill="#1a2a6c"/>
  <text x="430" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">UIAO_151 Codebook — Facet Semantics</text>
  <text x="430" y="93" text-anchor="middle" font-size="11" fill="#d4e4ff">Department · Division · Region · Role · CostCenter</text>
  <text x="430" y="110" text-anchor="middle" font-size="11" fill="#d4e4ff">Classification · HireDate · TermDate · ClearanceLevel · AccountType</text>
  <text x="430" y="128" text-anchor="middle" font-size="10" fill="#8899cc">Defines WHAT each facet means — vendor-neutral, never changes</text>

  <!-- Arrows codebook → profiles -->
  <line x1="290" y1="140" x2="120" y2="218" stroke="#1a2a6c" stroke-width="1.5" marker-end="url(#arr-navy)"/>
  <line x1="360" y1="140" x2="300" y2="218" stroke="#1a2a6c" stroke-width="1.5" marker-end="url(#arr-navy)"/>
  <line x1="430" y1="140" x2="430" y2="218" stroke="#1a2a6c" stroke-width="1.5" marker-end="url(#arr-navy)"/>
  <line x1="500" y1="140" x2="560" y2="218" stroke="#1a2a6c" stroke-width="1.5" marker-end="url(#arr-navy)"/>
  <line x1="570" y1="140" x2="740" y2="218" stroke="#1a2a6c" stroke-width="1.5" marker-end="url(#arr-navy)"/>

  <!-- Profile boxes -->
  <!-- microsoft-entra -->
  <rect x="42" y="222" width="156" height="112" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <text x="120" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a6c">microsoft-entra</text>
  <text x="120" y="258" text-anchor="middle" font-size="9" fill="#555555">Department →</text>
  <text x="120" y="270" text-anchor="middle" font-size="9" fill="#1a9e8f">extensionAttribute3</text>
  <text x="120" y="284" text-anchor="middle" font-size="9" fill="#555555">Classification →</text>
  <text x="120" y="296" text-anchor="middle" font-size="9" fill="#1a9e8f">extensionAttribute6</text>
  <text x="120" y="312" text-anchor="middle" font-size="9" fill="#888888">Transport: MS Graph API</text>
  <text x="120" y="326" text-anchor="middle" font-size="9" fill="#888888">Plane: identity + device</text>

  <!-- aws -->
  <rect x="222" y="222" width="156" height="112" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <text x="300" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a6c">aws</text>
  <text x="300" y="258" text-anchor="middle" font-size="9" fill="#555555">Department →</text>
  <text x="300" y="270" text-anchor="middle" font-size="9" fill="#1a9e8f">IAM IC attr: Department</text>
  <text x="300" y="284" text-anchor="middle" font-size="9" fill="#555555">Classification →</text>
  <text x="300" y="296" text-anchor="middle" font-size="9" fill="#1a9e8f">tag: orgpath:classification</text>
  <text x="300" y="312" text-anchor="middle" font-size="9" fill="#888888">Transport: SCIM + tag API</text>
  <text x="300" y="326" text-anchor="middle" font-size="9" fill="#888888">Plane: identity + workload</text>

  <!-- okta -->
  <rect x="352" y="222" width="156" height="112" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <text x="430" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a6c">okta</text>
  <text x="430" y="258" text-anchor="middle" font-size="9" fill="#555555">Department →</text>
  <text x="430" y="270" text-anchor="middle" font-size="9" fill="#1a9e8f">UD attr: Department</text>
  <text x="430" y="284" text-anchor="middle" font-size="9" fill="#555555">Classification →</text>
  <text x="430" y="296" text-anchor="middle" font-size="9" fill="#1a9e8f">UD attr: Classification</text>
  <text x="430" y="312" text-anchor="middle" font-size="9" fill="#888888">Transport: Okta Users API</text>
  <text x="430" y="326" text-anchor="middle" font-size="9" fill="#888888">Plane: identity</text>

  <!-- keycloak -->
  <rect x="482" y="222" width="156" height="112" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <text x="560" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a6c">keycloak</text>
  <text x="560" y="258" text-anchor="middle" font-size="9" fill="#555555">Department →</text>
  <text x="560" y="270" text-anchor="middle" font-size="9" fill="#1a9e8f">attr key: orgpath_department</text>
  <text x="560" y="284" text-anchor="middle" font-size="9" fill="#555555">Classification →</text>
  <text x="560" y="296" text-anchor="middle" font-size="9" fill="#1a9e8f">attr key: orgpath_classification</text>
  <text x="560" y="312" text-anchor="middle" font-size="9" fill="#888888">Transport: Keycloak Admin API</text>
  <text x="560" y="326" text-anchor="middle" font-size="9" fill="#888888">Plane: identity</text>

  <!-- (+ 5 more) placeholder -->
  <rect x="662" y="222" width="156" height="112" rx="6" fill="#f0f0f0" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="740" y="264" text-anchor="middle" font-size="11" fill="#999999">+ 5 more profiles</text>
  <text x="740" y="282" text-anchor="middle" font-size="10" fill="#aaaaaa">gcp · vmware · ldap</text>
  <text x="740" y="298" text-anchor="middle" font-size="10" fill="#aaaaaa">pingone · auth0</text>
  <text x="740" y="318" text-anchor="middle" font-size="9" fill="#bbbbbb">All follow same contract</text>

  <!-- Arrows profiles → drift engine -->
  <line x1="120" y1="334" x2="280" y2="408" stroke="#1a9e8f" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <line x1="300" y1="334" x2="360" y2="408" stroke="#1a9e8f" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <line x1="430" y1="334" x2="430" y2="408" stroke="#1a9e8f" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <line x1="560" y1="334" x2="500" y2="408" stroke="#1a9e8f" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <line x1="740" y1="334" x2="580" y2="408" stroke="#1a9e8f" stroke-width="1.5" marker-end="url(#arr-teal)"/>

  <!-- Layer 3: Drift engine -->
  <rect x="240" y="412" width="380" height="80" rx="8" fill="#d4a017"/>
  <text x="430" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">DRIFT-IDENTITY Engine</text>
  <text x="430" y="458" text-anchor="middle" font-size="11" fill="#fff8e0">Reads locator from binding profile → reads value from platform</text>
  <text x="430" y="476" text-anchor="middle" font-size="11" fill="#fff8e0">Validates value against codebook → raises finding on deviation</text>
  <text x="430" y="494" text-anchor="middle" font-size="10" fill="#fff3cc">Platform-neutral: same logic, nine storage locators</text>
</svg>
