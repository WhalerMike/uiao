        prompt: |
          A scheduled trigger (daily, plus registry-change and bulk-change triggers) starts a run that reads three inputs — the current OrgTree registry (valid paths), every live OrgPath value, and the provisioning records (expected values). A classifier sorts each identity into one of four lanes: invalid position, unpositioned, membership divergence, stale position. High-severity lanes (invalid, unpositioned) branch to automated alert + auto-remediation where the correct value is derivable; medium-severity lanes batch into the review cadence; low-severity findings are logged. The run commits a machine-readable report to the governance repository, and a longitudinal chart shows governance-quality over successive reports (valid fraction, introduction vs remediation rate). Engineering blueprint style, white background, federal navy (#1F3A5F) for inputs, teal (#1A9E8F) for the classifier, red (#C0392B) for high-severity lanes, amber (#D4A017) for the committed report and trend chart, monospace labels, no human figures, 16:9 landscape.
