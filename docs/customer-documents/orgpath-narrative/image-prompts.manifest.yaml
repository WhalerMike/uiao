  - file: "Book_14.qmd"
    series-order: "14"
    status: "Published"
    title: "Book_14 — OrgPath with Third-Party DDI Platforms"
    subtitle: "Infoblox and BlueCat as the Permanent DDI Control Plane"
    description: "The DDI control plane — DNS, DHCP, and IP address management — governed by OrgPath. Infoblox is the permanent authority for DHCP and IPAM, because Azure has no scope-based DHCP service and no authoritative hybrid IPAM; DNS authority is the one surface that can migrate to Azure native. Covers Extensible Attributes, tags, and User-Defined Fields as the OrgPath bridge, the permanent DHCP and IPAM authority, the MigrationPhase state machine for the DNS surface, parallel-phase reconciliation, and the boundary where DNS exits to Azure while DHCP and IPAM remain in Infoblox."
    canon-source: "src/uiao/canon/UIAO_153_Attribute_Mapping_Table.md"
