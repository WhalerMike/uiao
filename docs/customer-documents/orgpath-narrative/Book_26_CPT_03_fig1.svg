<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2d7d6b"/></marker>
  </defs>
  <rect width="760" height="300" fill="white"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2c5b">Passwordless Postgres on Azure — the identity is the credential</text>

  <!-- Container App -->
  <rect x="60" y="110" width="200" height="70" rx="7" fill="#e8f0fc" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="160" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2c5b">Azure Container App</text>
  <rect x="80" y="148" width="160" height="22" rx="11" fill="#2d7d6b"/>
  <text x="160" y="163" text-anchor="middle" font-size="9" font-weight="bold" fill="white">managed identity</text>

  <!-- Entra -->
  <rect x="320" y="70" width="150" height="50" rx="7" fill="#1a2c5b"/>
  <text x="395" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Microsoft Entra</text>
  <text x="395" y="108" text-anchor="middle" font-size="9" fill="#c0d0f0">token issuer</text>
  <line x1="245" y1="130" x2="320" y2="100" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>
  <text x="290" y="108" text-anchor="middle" font-size="9" fill="#2d7d6b">request</text>
  <line x1="320" y1="115" x2="248" y2="150" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>
  <text x="288" y="148" text-anchor="middle" font-size="9" fill="#2d7d6b">short-lived token</text>

  <!-- Postgres -->
  <rect x="520" y="110" width="190" height="70" rx="7" fill="#1a2c5b"/>
  <text x="615" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="white">PostgreSQL Flexible Server</text>
  <text x="615" y="156" text-anchor="middle" font-size="9" fill="#c0d0f0">identity = Entra administrator</text>
  <text x="615" y="170" text-anchor="middle" font-size="9" fill="#c0d0f0">password auth disabled</text>
  <line x1="260" y1="160" x2="520" y2="150" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>
  <text x="390" y="172" text-anchor="middle" font-size="10" fill="#2d7d6b">connect — token as password</text>

  <!-- no password -->
  <rect x="240" y="225" width="280" height="44" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="380" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">No stored database password</text>
  <text x="380" y="261" text-anchor="middle" font-size="9" fill="#7a0000">not in CI, the deployment, or the app secret store</text>
</svg>
