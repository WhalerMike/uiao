<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- White background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2a6c">ATO vs CATO: From Point-in-Time to Continuous Authorization</text>

  <!-- Divider -->
  <line x1="20" y1="255" x2="840" y2="255" stroke="#cccccc" stroke-width="1"/>

  <!-- === TOP HALF: Traditional ATO === -->
  <text x="24" y="75" font-size="13" font-weight="bold" fill="#1a2a6c">Traditional ATO (Point-in-Time)</text>

  <!-- Timeline line -->
  <line x1="120" y1="145" x2="800" y2="145" stroke="#1a2a6c" stroke-width="2"/>
  <!-- Arrow head -->
  <polygon points="800,140 800,150 812,145" fill="#1a2a6c"/>

  <!-- Assessment event -->
  <circle cx="170" cy="145" r="8" fill="#1a2a6c"/>
  <text x="170" y="168" text-anchor="middle" font-size="11" fill="#1a2a6c">3PAO</text>
  <text x="170" y="181" text-anchor="middle" font-size="11" fill="#1a2a6c">Assessment</text>

  <!-- ATO Letter event -->
  <circle cx="300" cy="145" r="8" fill="#1a2a6c"/>
  <text x="300" y="168" text-anchor="middle" font-size="11" fill="#1a2a6c">ATO Letter</text>
  <text x="300" y="181" text-anchor="middle" font-size="11" fill="#1a2a6c">Issued</text>

  <!-- Reassessment event -->
  <circle cx="700" cy="145" r="8" fill="#1a2a6c"/>
  <text x="700" y="168" text-anchor="middle" font-size="11" fill="#1a2a6c">Reassessment</text>

  <!-- Red gap zone -->
  <rect x="308" y="110" width="384" height="35" fill="#c0392b" opacity="0.15" rx="4"/>
  <rect x="308" y="110" width="384" height="35" fill="none" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="500" y="132" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">Posture Unknown -- ~3 Years</text>

  <!-- Label above gap -->
  <text x="500" y="98" text-anchor="middle" font-size="11" fill="#c0392b">Security posture may have drifted -- no real-time signal</text>

  <!-- === BOTTOM HALF: FedRAMP 20x CATO === -->
  <text x="24" y="292" font-size="13" font-weight="bold" fill="#1a9e8f">FedRAMP 20x -- Continuous Authorization to Operate (CATO)</text>

  <!-- Continuous wave signal path -->
  <path d="M120,380 C150,350 180,410 210,380 C240,350 270,410 300,380 C330,350 360,410 390,380 C420,350 450,410 480,380 C510,350 540,410 570,380 C600,350 630,410 660,380 C690,350 720,410 750,380 C770,362 790,380 800,375"
        stroke="#1a9e8f" stroke-width="3" fill="none"/>
  <!-- Arrow -->
  <polygon points="800,370 800,380 812,375" fill="#1a9e8f"/>

  <!-- KSI markers along wave -->
  <circle cx="165" cy="380" r="5" fill="#1a9e8f"/>
  <circle cx="255" cy="380" r="5" fill="#1a9e8f"/>
  <circle cx="345" cy="380" r="5" fill="#1a9e8f"/>
  <circle cx="435" cy="380" r="5" fill="#1a9e8f"/>
  <circle cx="525" cy="380" r="5" fill="#1a9e8f"/>
  <circle cx="615" cy="380" r="5" fill="#1a9e8f"/>
  <circle cx="705" cy="380" r="5" fill="#1a9e8f"/>

  <!-- KSI label -->
  <text x="430" y="340" text-anchor="middle" font-size="12" fill="#1a9e8f" font-weight="bold">Continuous KSI Stream -- Real-Time Authorization Status</text>

  <!-- AUTHORIZED badge -->
  <rect x="680" y="395" width="110" height="28" rx="5" fill="#1a9e8f"/>
  <text x="735" y="414" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">AUTHORIZED</text>

  <!-- Emission dots label -->
  <text x="430" y="470" text-anchor="middle" font-size="11" fill="#555555">Each marker = KSI evidence bundle emitted -- posture verified continuously</text>

  <!-- Timeline label -->
  <text x="460" y="500" text-anchor="middle" font-size="11" fill="#888888">Time</text>
</svg>
