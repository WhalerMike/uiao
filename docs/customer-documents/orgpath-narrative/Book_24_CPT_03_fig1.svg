<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <text x="430" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2a6c">UIAO Drift-to-Assertion Pipeline -- OSCAL Evidence for FedRAMP 20x</text>

  <!-- LEFT ZONE: UIAO Drift Engine -->
  <text x="110" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2a6c">UIAO Drift Engine</text>

  <rect x="30" y="72" width="160" height="65" rx="6" fill="#1a2a6c"/>
  <text x="110" y="99" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Identity Estate</text>
  <text x="110" y="116" text-anchor="middle" font-size="11" fill="#ffffff">Scanner</text>

  <!-- Arrow down -->
  <line x1="110" y1="137" x2="110" y2="195" stroke="#1a2a6c" stroke-width="1.5"/>
  <polygon points="105,195 115,195 110,207" fill="#1a2a6c"/>

  <rect x="30" y="207" width="160" height="65" rx="6" fill="#1a2a6c"/>
  <text x="110" y="234" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Drift Engine</text>
  <text x="110" y="251" text-anchor="middle" font-size="11" fill="#ffffff">(ADR-040)</text>

  <text x="110" y="290" text-anchor="middle" font-size="10" fill="#888888">Continuous scan cycle</text>

  <!-- Arrow right from drift engine -->
  <line x1="190" y1="240" x2="340" y2="240" stroke="#1a2a6c" stroke-width="1.5"/>
  <polygon points="340,235 340,245 352,240" fill="#1a2a6c"/>

  <!-- MIDDLE ZONE: Classification diamond -->
  <text x="430" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2a6c">Finding Classification</text>

  <!-- Diamond -->
  <polygon points="430,150 490,210 430,270 370,210" fill="#ffffff" stroke="#1a2a6c" stroke-width="2"/>
  <text x="430" y="205" text-anchor="middle" font-size="11" fill="#1a2a6c" font-weight="bold">Finding?</text>
  <text x="430" y="220" text-anchor="middle" font-size="10" fill="#555555">YES / NO</text>

  <!-- Arrow to FAIL path -->
  <line x1="480" y1="168" x2="570" y2="100" stroke="#c0392b" stroke-width="1.5"/>
  <polygon points="566,96 574,106 564,108" fill="#c0392b"/>
  <text x="540" y="132" text-anchor="middle" font-size="10" fill="#c0392b">YES</text>

  <!-- Arrow to PASS path -->
  <line x1="480" y1="252" x2="570" y2="320" stroke="#1a9e8f" stroke-width="1.5"/>
  <polygon points="566,324 574,314 564,312" fill="#1a9e8f"/>
  <text x="540" y="300" text-anchor="middle" font-size="10" fill="#1a9e8f">NO</text>

  <!-- FAIL box -->
  <rect x="570" y="58" width="175" height="70" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="657" y="82" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">DRIFT FINDING</text>
  <text x="657" y="98" text-anchor="middle" font-size="11" fill="#c0392b">KSI Failure Assertion</text>
  <text x="657" y="118" text-anchor="middle" font-size="10" fill="#888888">OSCAL finding entry</text>

  <!-- PASS box -->
  <rect x="570" y="320" width="175" height="70" rx="6" fill="#ffffff" stroke="#1a9e8f" stroke-width="2"/>
  <text x="657" y="344" text-anchor="middle" font-size="11" fill="#1a9e8f" font-weight="bold">PASSING STATE</text>
  <text x="657" y="360" text-anchor="middle" font-size="11" fill="#1a9e8f">KSI Pass Assertion</text>
  <text x="657" y="380" text-anchor="middle" font-size="10" fill="#888888">OSCAL observation entry</text>

  <!-- RIGHT ZONE: Evidence bundle -->
  <text x="775" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2a6c">Evidence Bundle</text>

  <!-- Arrows from FAIL/PASS to bundle -->
  <line x1="745" y1="93" x2="760" y2="150" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="745" y1="355" x2="760" y2="310" stroke="#1a9e8f" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- OSCAL bundle -->
  <rect x="720" y="140" width="120" height="180" rx="8" fill="#1a9e8f" opacity="0.15"/>
  <rect x="720" y="140" width="120" height="180" rx="8" fill="none" stroke="#1a9e8f" stroke-width="2"/>
  <text x="780" y="165" text-anchor="middle" font-size="11" fill="#1a2a6c" font-weight="bold">OSCAL</text>
  <text x="780" y="180" text-anchor="middle" font-size="11" fill="#1a2a6c" font-weight="bold">Evidence</text>
  <text x="780" y="195" text-anchor="middle" font-size="11" fill="#1a2a6c" font-weight="bold">Bundle</text>
  <text x="780" y="220" text-anchor="middle" font-size="10" fill="#333333">KSI Assertions</text>
  <text x="780" y="238" text-anchor="middle" font-size="10" fill="#333333">Open Findings</text>
  <text x="780" y="256" text-anchor="middle" font-size="10" fill="#333333">Scan Metadata</text>
  <text x="780" y="274" text-anchor="middle" font-size="10" fill="#333333">OrgPath Scope</text>

  <!-- Arrow from bundle to AO dashboard -->
  <line x1="780" y1="320" x2="780" y2="378" stroke="#1a2a6c" stroke-width="1.5"/>
  <polygon points="775,378 785,378 780,390" fill="#1a2a6c"/>

  <!-- AO Dashboard -->
  <rect x="700" y="390" width="160" height="55" rx="6" fill="#1a2a6c"/>
  <text x="780" y="412" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Authorizing Official</text>
  <text x="780" y="430" text-anchor="middle" font-size="11" fill="#ffffff">Dashboard</text>

  <text x="430" y="490" text-anchor="middle" font-size="11" fill="#888888">Continuous scan -- classification -- OSCAL emission -- live authorization status</text>
</svg>
