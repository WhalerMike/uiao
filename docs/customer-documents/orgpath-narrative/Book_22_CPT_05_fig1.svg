<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <text x="430" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a6c">KYC Reciprocity Protocol — Attribute Exchange Contract Lifecycle</text>

  <!-- Stage connector arrows -->
  <line x1="202" y1="220" x2="238" y2="220" stroke="#555" stroke-width="2"/>
  <polygon points="238,220 228,215 228,225" fill="#555"/>

  <line x1="418" y1="220" x2="454" y2="220" stroke="#555" stroke-width="2"/>
  <polygon points="454,220 444,215 444,225" fill="#555"/>

  <line x1="634" y1="220" x2="670" y2="220" stroke="#555" stroke-width="2"/>
  <polygon points="670,220 660,215 660,225" fill="#555"/>

  <!-- ===== STAGE 1: Declaration ===== -->
  <rect x="30" y="90" width="172" height="262" rx="8" fill="#eef1f8" stroke="#1a2a6c" stroke-width="1.8"/>
  <rect x="30" y="90" width="172" height="36" rx="8" fill="#1a2a6c"/>
  <text x="116" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1 — Declaration</text>

  <text x="116" y="148" text-anchor="middle" font-size="10" fill="#1a2a6c" font-weight="bold">Consuming Agency</text>
  <text x="116" y="162" text-anchor="middle" font-size="10" fill="#1a2a6c">OrgPath Node declares:</text>

  <rect x="44" y="172" width="144" height="18" rx="3" fill="#ffffff" stroke="#1a2a6c" stroke-width="0.8"/>
  <text x="116" y="185" text-anchor="middle" font-size="9" fill="#333">Attribute Trustee bureau</text>

  <rect x="44" y="196" width="144" height="18" rx="3" fill="#ffffff" stroke="#1a2a6c" stroke-width="0.8"/>
  <text x="116" y="209" text-anchor="middle" font-size="9" fill="#333">Consumed attribute (SSN, UEI…)</text>

  <rect x="44" y="220" width="144" height="18" rx="3" fill="#ffffff" stroke="#1a2a6c" stroke-width="0.8"/>
  <text x="116" y="233" text-anchor="middle" font-size="9" fill="#333">Legal authority (statute/reg)</text>

  <rect x="44" y="244" width="144" height="18" rx="3" fill="#ffffff" stroke="#1a2a6c" stroke-width="0.8"/>
  <text x="116" y="257" text-anchor="middle" font-size="9" fill="#333">SSOT proofing tier (IAL)</text>

  <rect x="44" y="268" width="144" height="18" rx="3" fill="#ffffff" stroke="#1a2a6c" stroke-width="0.8"/>
  <text x="116" y="281" text-anchor="middle" font-size="9" fill="#333">Required IAL (consuming agency)</text>

  <rect x="44" y="292" width="144" height="18" rx="3" fill="#ffffff" stroke="#1a2a6c" stroke-width="0.8"/>
  <text x="116" y="305" text-anchor="middle" font-size="9" fill="#333">Evidence requirement</text>

  <text x="116" y="338" text-anchor="middle" font-size="9" fill="#1a2a6c">6 fields · recorded in OrgPath</text>

  <!-- ===== STAGE 2: Contract Registration ===== -->
  <rect x="238" y="90" width="180" height="262" rx="8" fill="#eaf6f5" stroke="#1a9e8f" stroke-width="1.8"/>
  <rect x="238" y="90" width="180" height="36" rx="8" fill="#1a9e8f"/>
  <text x="328" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2 — Contract Registry</text>

  <text x="328" y="148" text-anchor="middle" font-size="10" fill="#1a9e8f" font-weight="bold">UIAO Registry</text>

  <!-- SSOT bureau box -->
  <rect x="252" y="162" width="152" height="38" rx="4" fill="#1a2a6c"/>
  <text x="328" y="178" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">Trustee Bureau Node</text>
  <text x="328" y="192" text-anchor="middle" font-size="9" fill="#a0b0e0">ssot_attributes · dependent_agencies</text>

  <!-- Double arrow -->
  <line x1="328" y1="200" x2="328" y2="224" stroke="#1a9e8f" stroke-width="1.5"/>
  <polygon points="328,224 323,214 333,214" fill="#1a9e8f"/>
  <line x1="328" y1="200" x2="328" y2="176" stroke="#1a9e8f" stroke-width="1.5"/>
  <polygon points="328,176 323,186 333,186" fill="#1a9e8f"/>

  <!-- Consuming agency box -->
  <rect x="252" y="224" width="152" height="38" rx="4" fill="#1a2a6c"/>
  <text x="328" y="240" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">Consuming Agency Node</text>
  <text x="328" y="254" text-anchor="middle" font-size="9" fill="#a0b0e0">attr_exchange_contracts[ ]</text>

  <!-- Contract record -->
  <rect x="252" y="274" width="152" height="52" rx="4" fill="#ffffff" stroke="#1a9e8f" stroke-width="1"/>
  <text x="328" y="292" text-anchor="middle" font-size="9" fill="#1a9e8f" font-weight="bold">Exchange Contract Record</text>
  <text x="328" y="306" text-anchor="middle" font-size="8" fill="#555">trustee · attribute · authority</text>
  <text x="328" y="318" text-anchor="middle" font-size="8" fill="#555">ssot_ial · required_ial · evidence</text>

  <text x="328" y="344" text-anchor="middle" font-size="9" fill="#1a9e8f">Bidirectional link</text>

  <!-- ===== STAGE 3: Drift Monitoring ===== -->
  <rect x="454" y="90" width="180" height="262" rx="8" fill="#fff8e6" stroke="#d4a017" stroke-width="1.8"/>
  <rect x="454" y="90" width="180" height="36" rx="8" fill="#d4a017"/>
  <text x="544" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3 — Drift Monitoring</text>

  <text x="544" y="148" text-anchor="middle" font-size="10" fill="#d4a017" font-weight="bold">UIAO Drift Engine</text>
  <text x="544" y="163" text-anchor="middle" font-size="9" fill="#555">Runs on schedule · compares declared vs actual</text>

  <!-- Comparison block -->
  <rect x="468" y="176" width="72" height="40" rx="4" fill="#1a2a6c"/>
  <text x="504" y="193" text-anchor="middle" font-size="9" fill="#ffffff">SSOT</text>
  <text x="504" y="207" text-anchor="middle" font-size="9" fill="#a0b0e0">proofing IAL</text>

  <rect x="554" y="176" width="72" height="40" rx="4" fill="#1a9e8f"/>
  <text x="590" y="193" text-anchor="middle" font-size="9" fill="#ffffff">Required</text>
  <text x="590" y="207" text-anchor="middle" font-size="9" fill="#d0f0ec">IAL (consuming)</text>

  <!-- vs label -->
  <text x="544" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4a017">vs</text>

  <!-- Match / Mismatch -->
  <rect x="468" y="228" width="72" height="30" rx="4" fill="#1a9e8f"/>
  <text x="504" y="248" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">MATCH</text>

  <rect x="554" y="228" width="72" height="30" rx="4" fill="#c0392b"/>
  <text x="590" y="248" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">MISMATCH</text>

  <text x="504" y="276" text-anchor="middle" font-size="8" fill="#555">Contract current</text>
  <text x="590" y="276" text-anchor="middle" font-size="8" fill="#c0392b">Finding generated</text>

  <!-- Check items -->
  <text x="468" y="302" font-size="9" fill="#555">Also checks:</text>
  <text x="468" y="316" font-size="9" fill="#555">• Authority gap</text>
  <text x="468" y="330" font-size="9" fill="#555">• Contract staleness</text>
  <text x="468" y="344" font-size="9" fill="#555">• Scope expansion</text>

  <!-- ===== STAGE 4: Finding Routing ===== -->
  <rect x="670" y="90" width="162" height="262" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <rect x="670" y="90" width="162" height="36" rx="8" fill="#c0392b"/>
  <text x="751" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">4 — Finding Routing</text>

  <!-- Finding card -->
  <rect x="684" y="138" width="134" height="96" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="751" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">FINDING</text>
  <text x="751" y="174" text-anchor="middle" font-size="9" fill="#333">Type: Assurance Mismatch</text>
  <text x="751" y="188" text-anchor="middle" font-size="9" fill="#333">Severity: High</text>
  <text x="751" y="202" text-anchor="middle" font-size="9" fill="#333">SSOT IAL: 1 · Required: 2</text>
  <text x="751" y="217" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="bold">ACTION REQUIRED</text>
  <text x="751" y="229" text-anchor="middle" font-size="8" fill="#888">Bureau Governance Contact</text>

  <line x1="751" y1="234" x2="751" y2="258" stroke="#c0392b" stroke-width="1.5"/>
  <polygon points="751,258 746,248 756,248" fill="#c0392b"/>

  <!-- Disposition options -->
  <rect x="684" y="260" width="134" height="30" rx="4" fill="#1a2a6c"/>
  <text x="751" y="280" text-anchor="middle" font-size="9" fill="#ffffff">Remediate: strengthen SSOT</text>

  <rect x="684" y="298" width="134" height="30" rx="4" fill="#d4a017"/>
  <text x="751" y="318" text-anchor="middle" font-size="9" fill="#ffffff">Accept risk: document + sign</text>

  <text x="751" y="348" text-anchor="middle" font-size="9" fill="#c0392b">Finding closed on disposition</text>

  <!-- Bottom note -->
  <rect x="30" y="400" width="800" height="40" rx="6" fill="#eef1f8" stroke="#1a2a6c" stroke-width="1"/>
  <text x="430" y="418" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">Reciprocity: bidirectional dependencies (SSA↔IRS) become two separate contracts — one per direction</text>
  <text x="430" y="433" text-anchor="middle" font-size="9" fill="#555">Asymmetric assurance levels and legal authorities are tracked independently; collapse obscures drift</text>

  <text x="430" y="492" text-anchor="middle" font-size="10" fill="#888">UIAO Book_22 · Ch 5 · UIAO_142 · ADR-055 · KYC Reciprocity Protocol</text>
</svg>
