<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <text x="430" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2a6c">OrgPath-Scoped KSI Emission -- Bureau Boundaries as Authorization Units</text>

  <!-- OrgTree label -->
  <text x="120" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2a6c">OrgTree</text>

  <!-- Root node -->
  <rect x="40" y="72" width="160" height="50" rx="6" fill="#1a2a6c"/>
  <text x="120" y="97" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">Federal Agency</text>
  <text x="120" y="113" text-anchor="middle" font-size="10" fill="#aaaaee">(Root)</text>

  <!-- Tree lines -->
  <line x1="120" y1="122" x2="120" y2="175" stroke="#1a2a6c" stroke-width="1.5"/>
  <line x1="120" y1="175" x2="120" y2="195" stroke="#1a2a6c" stroke-width="1.5"/>
  <line x1="120" y1="175" x2="120" y2="295" stroke="#1a2a6c" stroke-width="1.5"/>
  <line x1="120" y1="175" x2="120" y2="395" stroke="#1a2a6c" stroke-width="1.5"/>

  <!-- Bureau nodes -->
  <rect x="40" y="195" width="160" height="50" rx="6" fill="#1a9e8f"/>
  <text x="120" y="218" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">DOD:DISA</text>
  <text x="120" y="234" text-anchor="middle" font-size="10" fill="#ffffff">847 identities</text>

  <rect x="40" y="295" width="160" height="50" rx="6" fill="#1a9e8f"/>
  <text x="120" y="318" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">HHS:CMS</text>
  <text x="120" y="334" text-anchor="middle" font-size="10" fill="#ffffff">374 identities</text>

  <rect x="40" y="395" width="160" height="50" rx="6" fill="#1a9e8f"/>
  <text x="120" y="418" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">GSA:FAS</text>
  <text x="120" y="434" text-anchor="middle" font-size="10" fill="#ffffff">89 identities</text>

  <!-- Arrows from bureaus to KSI boxes -->
  <line x1="200" y1="220" x2="280" y2="220" stroke="#1a2a6c" stroke-width="1.5"/>
  <polygon points="280,215 280,225 292,220" fill="#1a2a6c"/>

  <line x1="200" y1="320" x2="280" y2="320" stroke="#1a2a6c" stroke-width="1.5"/>
  <polygon points="280,315 280,325 292,320" fill="#1a2a6c"/>

  <line x1="200" y1="420" x2="280" y2="420" stroke="#1a2a6c" stroke-width="1.5"/>
  <polygon points="280,415 280,425 292,420" fill="#1a2a6c"/>

  <!-- KSI Assertion boxes -->
  <!-- DOD:DISA -->
  <rect x="292" y="185" width="420" height="70" rx="6" fill="#ffffff" stroke="#1a9e8f" stroke-width="2"/>
  <text x="310" y="208" font-size="12" fill="#1a9e8f" font-weight="bold">DOD:DISA</text>
  <text x="310" y="228" font-size="10" fill="#333333">MFA: 100% (847/847) | Encryption: 100% | Scan Age: 2d</text>
  <text x="310" y="246" font-size="10" fill="#555555">Scanned: 2026-06-18T14:22Z -- UIAO Drift Engine v2.4</text>
  <rect x="658" y="193" width="48" height="24" rx="4" fill="#1a9e8f"/>
  <text x="682" y="209" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">PASS</text>

  <!-- HHS:CMS -->
  <rect x="292" y="285" width="420" height="70" rx="6" fill="#ffffff" stroke="#d4a017" stroke-width="2"/>
  <text x="310" y="308" font-size="12" fill="#1a9e8f" font-weight="bold">HHS:CMS</text>
  <text x="310" y="328" font-size="10" fill="#333333">MFA: 97.3% (363/374) | Encryption: 100% | Scan Age: 5d</text>
  <text x="310" y="346" font-size="10" fill="#c0392b">11 accounts without MFA enforcement -- remediation required</text>
  <rect x="640" y="293" width="66" height="24" rx="4" fill="#d4a017"/>
  <text x="673" y="309" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">COND.</text>

  <!-- GSA:FAS -->
  <rect x="292" y="385" width="420" height="70" rx="6" fill="#ffffff" stroke="#1a9e8f" stroke-width="2"/>
  <text x="310" y="408" font-size="12" fill="#1a9e8f" font-weight="bold">GSA:FAS</text>
  <text x="310" y="428" font-size="10" fill="#333333">MFA: 100% (89/89) | Encryption: 100% | Scan Age: 1d</text>
  <text x="310" y="446" font-size="10" fill="#555555">Scanned: 2026-06-18T08:00Z -- UIAO Drift Engine v2.4</text>
  <rect x="658" y="393" width="48" height="24" rx="4" fill="#1a9e8f"/>
  <text x="682" y="409" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">PASS</text>

  <!-- Convergence arrows to bundle -->
  <line x1="712" y1="220" x2="760" y2="340" stroke="#888888" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="712" y1="320" x2="760" y2="345" stroke="#888888" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="712" y1="420" x2="760" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Evidence bundle -->
  <rect x="750" y="305" width="90" height="80" rx="6" fill="#1a2a6c"/>
  <text x="795" y="330" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">OSCAL</text>
  <text x="795" y="345" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">Evidence</text>
  <text x="795" y="360" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">Bundle</text>
  <text x="795" y="375" text-anchor="middle" font-size="9" fill="#aaaaee">OrgPath-</text>
  <text x="795" y="387" text-anchor="middle" font-size="9" fill="#aaaaee">scoped</text>

  <text x="430" y="498" text-anchor="middle" font-size="11" fill="#888888">Each bureau boundary emits its own KSI assertions -- scoped, population-sized, timestamped</text>
</svg>
