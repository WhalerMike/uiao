<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arr-navy" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a2a6c"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a9e8f"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d4a017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2a6c">VMware: The Three-Plane Binding Profile</text>
  <text x="430" y="48" text-anchor="middle" font-size="11" fill="#555555">One codebook entry governs identity, workload, and network enforcement simultaneously</text>

  <!-- Codebook top center -->
  <rect x="300" y="60" width="260" height="56" rx="6" fill="#1a2a6c"/>
  <text x="430" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">UIAO_151 Codebook</text>
  <text x="430" y="98" text-anchor="middle" font-size="10" fill="#d4e4ff">Classification = Contractor</text>
  <text x="430" y="112" text-anchor="middle" font-size="10" fill="#d4e4ff">Department = Engineering</text>

  <!-- Arrows down to three planes -->
  <line x1="370" y1="116" x2="160" y2="168" stroke="#1a2a6c" stroke-width="2" marker-end="url(#arr-navy)"/>
  <line x1="430" y1="116" x2="430" y2="168" stroke="#1a2a6c" stroke-width="2" marker-end="url(#arr-navy)"/>
  <line x1="490" y1="116" x2="700" y2="168" stroke="#1a2a6c" stroke-width="2" marker-end="url(#arr-navy)"/>

  <!-- === PLANE 1: Identity — Workspace ONE === -->
  <rect x="42" y="172" width="236" height="200" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <rect x="42" y="172" width="236" height="30" rx="6" fill="#1a9e8f"/>
  <text x="160" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Plane 1 — Identity</text>
  <text x="160" y="206" text-anchor="middle" font-size="10" fill="#ffffff">Workspace ONE Access</text>
  <text x="58" y="230" font-size="10" fill="#333333">Classification →</text>
  <text x="58" y="244" font-size="10" fill="#1a9e8f">  orgpath_classification</text>
  <text x="58" y="262" font-size="10" fill="#333333">Department →</text>
  <text x="58" y="276" font-size="10" fill="#1a9e8f">  orgpath_department</text>
  <text x="58" y="296" font-size="10" fill="#555555">Transport: WS1 REST API</text>
  <text x="58" y="312" font-size="10" fill="#555555">Enforces: conditional access</text>
  <text x="58" y="328" font-size="10" fill="#555555">policies on vSphere console</text>
  <text x="58" y="348" font-size="10" fill="#1a9e8f">User stamped at provisioning</text>
  <text x="160" y="368" text-anchor="middle" font-size="10" font-style="italic" fill="#777777">Who can log in</text>

  <!-- === PLANE 2: Workload — vSphere === -->
  <rect x="312" y="172" width="236" height="200" rx="6" fill="#fff8e8" stroke="#d4a017" stroke-width="2"/>
  <rect x="312" y="172" width="236" height="30" rx="6" fill="#d4a017"/>
  <text x="430" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Plane 2 — Workload</text>
  <text x="430" y="206" text-anchor="middle" font-size="10" fill="#ffffff">vSphere / vCenter Tags</text>
  <text x="328" y="230" font-size="10" fill="#333333">Classification →</text>
  <text x="328" y="244" font-size="10" fill="#d4a017">  OrgPath:Classification</text>
  <text x="328" y="262" font-size="10" fill="#333333">Department →</text>
  <text x="328" y="276" font-size="10" fill="#d4a017">  OrgPath:Department</text>
  <text x="328" y="296" font-size="10" fill="#555555">Transport: vCenter REST API</text>
  <text x="328" y="312" font-size="10" fill="#555555">Tag categories enforced per</text>
  <text x="328" y="328" font-size="10" fill="#555555">binding profile spec</text>
  <text x="328" y="348" font-size="10" fill="#d4a017">VM tagged at provisioning</text>
  <text x="430" y="368" text-anchor="middle" font-size="10" font-style="italic" fill="#777777">Which VMs belong to whom</text>

  <!-- === PLANE 3: Enforcement — NSX === -->
  <rect x="582" y="172" width="236" height="200" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="582" y="172" width="236" height="30" rx="6" fill="#c0392b"/>
  <text x="700" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Plane 3 — Enforcement</text>
  <text x="700" y="206" text-anchor="middle" font-size="10" fill="#ffffff">NSX Security Tags + Groups</text>
  <text x="598" y="230" font-size="10" fill="#333333">Classification →</text>
  <text x="598" y="244" font-size="10" fill="#c0392b">  NSX tag: OrgPath:Classification</text>
  <text x="598" y="262" font-size="10" fill="#333333">Department →</text>
  <text x="598" y="276" font-size="10" fill="#c0392b">  NSX tag: OrgPath:Department</text>
  <text x="598" y="296" font-size="10" fill="#555555">Dynamic group: Classification</text>
  <text x="598" y="312" font-size="10" fill="#555555">= Contractor → Contractor-seg</text>
  <text x="598" y="332" font-size="10" fill="#555555">Distributed firewall rules ref</text>
  <text x="598" y="348" font-size="10" fill="#c0392b">groups, not IP addresses</text>
  <text x="700" y="368" text-anchor="middle" font-size="10" font-style="italic" fill="#777777">What traffic is allowed</text>

  <!-- Bottom: Predicate example -->
  <rect x="120" y="392" width="620" height="72" rx="6" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="1.5"/>
  <text x="430" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a6c">One Facet Predicate — Three Simultaneous Enforcement Actions</text>
  <text x="430" y="434" text-anchor="middle" font-size="10" fill="#333333">Classification = Contractor stamps Workspace ONE user (conditional access) +</text>
  <text x="430" y="450" text-anchor="middle" font-size="10" fill="#333333">tags vSphere VM (workload inventory) + adds VM to NSX Contractor security group (microsegmentation)</text>
  <text x="430" y="466" text-anchor="middle" font-size="10" fill="#1a2a6c">All three planes validated by one drift engine cycle</text>

  <!-- Arrows from planes down to predicate box -->
  <line x1="160" y1="372" x2="220" y2="392" stroke="#1a9e8f" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <line x1="430" y1="372" x2="430" y2="392" stroke="#d4a017" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <line x1="700" y1="372" x2="640" y2="392" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
</svg>
