<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a2a6c"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a9e8f"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d4a017"/>
    </marker>
  </defs>

  <text x="430" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2a6c">Governance Closure: OrgPath · LocPath · E911 Compliance Layer</text>

  <!-- COLUMN 1: OrgPath -->
  <rect x="30" y="55" width="230" height="380" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="2" rx="6"/>
  <rect x="30" y="55" width="230" height="32" fill="#1a2a6c" rx="6"/>
  <rect x="30" y="75" width="230" height="12" fill="#1a2a6c"/>
  <text x="145" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">OrgPath</text>

  <!-- Org hierarchy -->
  <rect x="55" y="100" width="180" height="32" fill="#1a2a6c" rx="3"/>
  <text x="145" y="121" text-anchor="middle" font-size="11" fill="#ffffff">Agency</text>

  <line x1="145" y1="132" x2="145" y2="148" stroke="#1a2a6c" stroke-width="1.5"/>

  <rect x="65" y="148" width="160" height="32" fill="#1a2a6c" rx="3"/>
  <text x="145" y="169" text-anchor="middle" font-size="11" fill="#ffffff">Bureau</text>

  <line x1="145" y1="180" x2="145" y2="196" stroke="#1a2a6c" stroke-width="1.5"/>

  <rect x="75" y="196" width="140" height="32" fill="#1a2a6c" rx="3"/>
  <text x="145" y="217" text-anchor="middle" font-size="11" fill="#ffffff">Division</text>

  <!-- Compliance officer badge -->
  <rect x="55" y="248" width="180" height="60" fill="#ffffff" stroke="#1a9e8f" stroke-width="1.5" rx="3"/>
  <text x="145" y="268" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">E911 Compliance Officer</text>
  <text x="145" y="284" text-anchor="middle" font-size="9" fill="#555">Designated organizational role</text>
  <text x="145" y="298" text-anchor="middle" font-size="9" fill="#555">Receives all GOV-LOCPATH findings</text>
  <circle cx="145" cy="322" r="16" fill="#1a2a6c"/>
  <text x="145" y="327" text-anchor="middle" font-size="14" fill="#ffffff">👤</text>

  <rect x="55" y="348" width="180" height="72" fill="#f8f8f8" stroke="#cccccc" stroke-width="1" rx="3"/>
  <text x="145" y="366" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a2a6c">Owns:</text>
  <text x="145" y="381" text-anchor="middle" font-size="9" fill="#555">· Bureau organization record</text>
  <text x="145" y="395" text-anchor="middle" font-size="9" fill="#555">· Finding routing paths</text>
  <text x="145" y="409" text-anchor="middle" font-size="9" fill="#555">· Escalation hierarchy</text>

  <!-- COLUMN 2: LocPath -->
  <rect x="315" y="55" width="230" height="380" fill="#f0fffc" stroke="#1a9e8f" stroke-width="2" rx="6"/>
  <rect x="315" y="55" width="230" height="32" fill="#1a9e8f" rx="6"/>
  <rect x="315" y="75" width="230" height="12" fill="#1a9e8f"/>
  <text x="430" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">LocPath</text>

  <!-- Location hierarchy -->
  <rect x="340" y="100" width="180" height="32" fill="#1a9e8f" rx="3"/>
  <text x="430" y="121" text-anchor="middle" font-size="11" fill="#ffffff">Site · civicAddress</text>

  <line x1="430" y1="132" x2="430" y2="148" stroke="#1a9e8f" stroke-width="1.5"/>

  <rect x="350" y="148" width="160" height="32" fill="#1a9e8f" rx="3"/>
  <text x="430" y="169" text-anchor="middle" font-size="11" fill="#ffffff">Building</text>

  <line x1="430" y1="180" x2="430" y2="196" stroke="#1a9e8f" stroke-width="1.5"/>

  <rect x="360" y="196" width="140" height="32" fill="#1a2a6c" rx="3"/>
  <text x="430" y="217" text-anchor="middle" font-size="11" fill="#ffffff">Floor 7 ⭐ e911</text>

  <line x1="430" y1="228" x2="430" y2="244" stroke="#1a2a6c" stroke-width="1.5"/>

  <rect x="370" y="244" width="120" height="32" fill="#1a2a6c" rx="3"/>
  <text x="430" y="265" text-anchor="middle" font-size="11" fill="#ffffff">Suite 700N</text>

  <!-- Validated badge -->
  <rect x="340" y="290" width="180" height="36" fill="#d4a017" rx="3"/>
  <text x="430" y="313" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">✓ PSAP Validated</text>

  <rect x="340" y="338" width="180" height="80" fill="#ffffff" stroke="#1a9e8f" stroke-width="1" rx="3"/>
  <text x="430" y="356" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a2a6c">Owns:</text>
  <text x="430" y="371" text-anchor="middle" font-size="9" fill="#555">· Dispatchable location of record</text>
  <text x="430" y="385" text-anchor="middle" font-size="9" fill="#555">· Civic address + sub-address</text>
  <text x="430" y="399" text-anchor="middle" font-size="9" fill="#555">· PSAP validation state</text>
  <text x="430" y="413" text-anchor="middle" font-size="9" fill="#555">· Dynamic Location Context</text>

  <!-- COLUMN 3: E911 Compliance Layer -->
  <rect x="600" y="55" width="230" height="380" fill="#fff8e6" stroke="#d4a017" stroke-width="2" rx="6"/>
  <rect x="600" y="55" width="230" height="32" fill="#d4a017" rx="6"/>
  <rect x="600" y="75" width="230" height="12" fill="#d4a017"/>
  <text x="715" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">E911 Compliance Layer</text>

  <!-- Three codes -->
  <rect x="620" y="100" width="190" height="36" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5" rx="3"/>
  <text x="715" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">GOV-LOCPATH-012 P1</text>
  <text x="715" y="130" text-anchor="middle" font-size="9" fill="#555">No civic address · HALT</text>

  <rect x="620" y="148" width="190" height="36" fill="#fffbf0" stroke="#d4a017" stroke-width="1.5" rx="3"/>
  <text x="715" y="166" text-anchor="middle" font-size="10" font-weight="bold" fill="#d4a017">GOV-LOCPATH-013 P2</text>
  <text x="715" y="178" text-anchor="middle" font-size="9" fill="#555">No sub-address precision</text>

  <rect x="620" y="196" width="190" height="36" fill="#fffbf0" stroke="#d4a017" stroke-width="1.5" rx="3"/>
  <text x="715" y="214" text-anchor="middle" font-size="10" font-weight="bold" fill="#d4a017">GOV-LOCPATH-014 P2</text>
  <text x="715" y="226" text-anchor="middle" font-size="9" fill="#555">Address not PSAP-validated</text>

  <!-- Continuous check cycle -->
  <rect x="620" y="248" width="190" height="60" fill="#ffffff" stroke="#d4a017" stroke-width="1.5" rx="3"/>
  <text x="715" y="268" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a6c">Continuous Check</text>
  <text x="715" y="283" text-anchor="middle" font-size="9" fill="#555">Runs every drift cycle</text>
  <text x="715" y="297" text-anchor="middle" font-size="9" fill="#555">Findings close automatically</text>

  <rect x="620" y="322" width="190" height="102" fill="#f8f8f8" stroke="#cccccc" stroke-width="1" rx="3"/>
  <text x="715" y="340" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a2a6c">Owns:</text>
  <text x="715" y="355" text-anchor="middle" font-size="9" fill="#555">· Completeness obligation definition</text>
  <text x="715" y="370" text-anchor="middle" font-size="9" fill="#555">· Three error codes + severities</text>
  <text x="715" y="385" text-anchor="middle" font-size="9" fill="#555">· Finding lifecycle + routing</text>
  <text x="715" y="400" text-anchor="middle" font-size="9" fill="#555">· Compliance dashboard</text>
  <text x="715" y="415" text-anchor="middle" font-size="9" fill="#555">· Attestation evidence</text>

  <!-- ARROWS between columns -->
  <line x1="260" y1="215" x2="312" y2="215" stroke="#1a2a6c" stroke-width="2" marker-end="url(#arrow-navy)"/>
  <text x="286" y="208" text-anchor="middle" font-size="9" fill="#1a2a6c">owns</text>

  <line x1="545" y1="215" x2="597" y2="215" stroke="#1a9e8f" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="571" y="208" text-anchor="middle" font-size="9" fill="#1a9e8f">tests</text>

  <!-- BOTTOM: 911 Call outcome -->
  <rect x="30" y="452" width="800" height="55" fill="#f0fff8" stroke="#1a9e8f" stroke-width="2" rx="5"/>
  <line x1="430" y1="435" x2="430" y2="450" stroke="#1a2a6c" stroke-width="2" marker-end="url(#arrow-navy)"/>

  <text x="430" y="472" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2a6c">911 Call Outcome: PSAP receives</text>
  <text x="430" y="491" text-anchor="middle" font-size="11" fill="#1a9e8f">123 Federal Ave · Washington DC 20001 · Floor 7 · Suite 700N — North wing, east of elevator lobby</text>

  <!-- Compliance loop arrow at bottom -->
  <path d="M 50 450 Q 50 510 430 510 Q 810 510 810 450" stroke="#d4a017" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow-amber)"/>
  <text x="430" y="508" text-anchor="middle" font-size="9" fill="#d4a017">Continuous Completeness Check Loop</text>
</svg>
