<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2d7d6b"/></marker>
  </defs>
  <rect width="760" height="320" fill="white"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2c5b">The same application on AWS — only the substrate changes</text>

  <!-- ALB -->
  <rect x="260" y="52" width="240" height="38" rx="6" fill="#1a2c5b"/>
  <text x="380" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Application Load Balancer (TLS)</text>
  <line x1="380" y1="90" x2="380" y2="114" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>

  <!-- Fargate -->
  <rect x="230" y="116" width="300" height="62" rx="8" fill="#e8f0fc" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="380" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2c5b">ECS Fargate — identical uiao.saas application</text>
  <rect x="300" y="148" width="160" height="22" rx="11" fill="#2d7d6b"/>
  <text x="380" y="163" text-anchor="middle" font-size="9" font-weight="bold" fill="white">IAM task role</text>

  <!-- three services -->
  <line x1="300" y1="178" x2="170" y2="218" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>
  <line x1="380" y1="178" x2="380" y2="218" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>
  <line x1="460" y1="178" x2="590" y2="218" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>

  <rect x="60" y="220" width="200" height="50" rx="6" fill="#1a2c5b"/>
  <text x="160" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="white">RDS PostgreSQL</text>
  <text x="160" y="258" text-anchor="middle" font-size="9" fill="#c0d0f0">IAM auth (token as password)</text>

  <rect x="280" y="220" width="200" height="50" rx="6" fill="#1a2c5b"/>
  <text x="380" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Secrets Manager</text>
  <text x="380" y="258" text-anchor="middle" font-size="9" fill="#c0d0f0">per-tenant scopes</text>

  <rect x="500" y="220" width="200" height="50" rx="6" fill="#1a2c5b"/>
  <text x="600" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="white">S3 evidence bucket</text>
  <text x="600" y="258" text-anchor="middle" font-size="9" fill="#c0d0f0">per-tenant key prefixes</text>

  <text x="380" y="300" text-anchor="middle" font-size="10" font-style="italic" fill="#2d7d6b">Cloud-specific surface: infrastructure (CDK), DB token source (RDS IAM), per-tenant stamps. Everything else is shared.</text>
</svg>
