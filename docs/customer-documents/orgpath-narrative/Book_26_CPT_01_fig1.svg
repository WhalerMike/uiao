<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2d7d6b"/></marker>
  </defs>
  <rect width="760" height="300" fill="white"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2c5b">From one runtime, one tenant — to one runtime, many tenants</text>

  <!-- Single tenant -->
  <rect x="40" y="90" width="150" height="60" rx="7" fill="#e8f0fc" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="115" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2c5b">Single-tenant</text>
  <text x="115" y="133" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2c5b">runtime</text>
  <rect x="70" y="180" width="90" height="34" rx="5" fill="#1a2c5b"/>
  <text x="115" y="202" text-anchor="middle" font-size="10" fill="white">one directory</text>
  <line x1="115" y1="150" x2="115" y2="180" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>

  <!-- Arrow across -->
  <line x1="200" y1="140" x2="290" y2="140" stroke="#2d7d6b" stroke-width="2.5" marker-end="url(#t)"/>
  <text x="245" y="130" text-anchor="middle" font-size="10" fill="#2d7d6b">additive,</text>
  <text x="245" y="156" text-anchor="middle" font-size="10" fill="#2d7d6b">not a fork</text>

  <!-- Multi-tenant -->
  <rect x="300" y="60" width="420" height="200" rx="9" fill="#f4f8ff" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="510" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2c5b">Multi-tenant SaaS — one shared engine</text>
  <rect x="430" y="96" width="160" height="36" rx="6" fill="#2d7d6b"/>
  <text x="510" y="119" text-anchor="middle" font-size="10" font-weight="bold" fill="white">tenant resolution</text>
  <rect x="430" y="146" width="160" height="36" rx="6" fill="#1a2c5b"/>
  <text x="510" y="169" text-anchor="middle" font-size="10" font-weight="bold" fill="white">one governance engine</text>
  <line x1="510" y1="132" x2="510" y2="146" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>
  <!-- three directories -->
  <rect x="330" y="210" width="110" height="32" rx="5" fill="#e8f0fc" stroke="#1a2c5b" stroke-width="1.2"/>
  <text x="385" y="230" text-anchor="middle" font-size="10" fill="#1a2c5b">tenant A</text>
  <rect x="455" y="210" width="110" height="32" rx="5" fill="#e8f0fc" stroke="#1a2c5b" stroke-width="1.2"/>
  <text x="510" y="230" text-anchor="middle" font-size="10" fill="#1a2c5b">tenant B</text>
  <rect x="580" y="210" width="110" height="32" rx="5" fill="#e8f0fc" stroke="#1a2c5b" stroke-width="1.2"/>
  <text x="635" y="230" text-anchor="middle" font-size="10" fill="#1a2c5b">tenant C</text>
  <line x1="430" y1="182" x2="385" y2="210" stroke="#2d7d6b" stroke-width="1.5" marker-end="url(#t)"/>
  <line x1="510" y1="182" x2="510" y2="210" stroke="#2d7d6b" stroke-width="1.5" marker-end="url(#t)"/>
  <line x1="590" y1="182" x2="635" y2="210" stroke="#2d7d6b" stroke-width="1.5" marker-end="url(#t)"/>
</svg>
