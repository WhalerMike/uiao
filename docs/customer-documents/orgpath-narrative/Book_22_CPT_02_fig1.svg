<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a6c">NIST SP 800-63 — Three Assurance Axes</text>
  <text x="430" y="54" text-anchor="middle" font-size="11" fill="#555">Each axis is an OrgPath attribute of the bureau that owns the citizen-facing workflow</text>

  <!-- ===== COLUMN 1: IAL ===== -->
  <text x="175" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2a6c">IAL</text>
  <text x="175" y="102" text-anchor="middle" font-size="10" fill="#555">Identity Assurance Level</text>
  <text x="175" y="114" text-anchor="middle" font-size="10" fill="#555">What was proven at enrollment?</text>

  <!-- IAL1 -->
  <rect x="60" y="124" width="230" height="80" rx="6" fill="#d0ede9" stroke="#1a9e8f" stroke-width="1"/>
  <text x="175" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a9e8f">IAL1</text>
  <text x="175" y="164" text-anchor="middle" font-size="10" fill="#333">Self-attested attributes</text>
  <text x="175" y="178" text-anchor="middle" font-size="10" fill="#333">No evidence required</text>
  <text x="175" y="192" text-anchor="middle" font-size="9" fill="#777">e.g. public comment, inquiry form</text>

  <!-- IAL2 -->
  <rect x="60" y="218" width="230" height="80" rx="6" fill="#1a9e8f" stroke="#1a9e8f" stroke-width="1"/>
  <text x="175" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">IAL2</text>
  <text x="175" y="258" text-anchor="middle" font-size="10" fill="#e0f5f3">Remote document proofing</text>
  <text x="175" y="272" text-anchor="middle" font-size="10" fill="#e0f5f3">Biometric comparison</text>
  <text x="175" y="286" text-anchor="middle" font-size="9" fill="#c0eae6">e.g. benefits access, tax filing</text>

  <!-- IAL3 -->
  <rect x="60" y="312" width="230" height="80" rx="6" fill="#1a2a6c" stroke="#1a2a6c" stroke-width="1"/>
  <text x="175" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">IAL3</text>
  <text x="175" y="352" text-anchor="middle" font-size="10" fill="#c0c8e0">In-person proofing</text>
  <text x="175" y="366" text-anchor="middle" font-size="10" fill="#c0c8e0">Trained operator · Biometric binding</text>
  <text x="175" y="380" text-anchor="middle" font-size="9" fill="#8898c8">e.g. immigration adjudication</text>

  <!-- ===== COLUMN 2: AAL ===== -->
  <text x="430" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2a6c">AAL</text>
  <text x="430" y="102" text-anchor="middle" font-size="10" fill="#555">Authenticator Assurance Level</text>
  <text x="430" y="114" text-anchor="middle" font-size="10" fill="#555">What is used to authenticate?</text>

  <!-- AAL1 -->
  <rect x="315" y="124" width="230" height="80" rx="6" fill="#d0ede9" stroke="#1a9e8f" stroke-width="1"/>
  <text x="430" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a9e8f">AAL1</text>
  <text x="430" y="164" text-anchor="middle" font-size="10" fill="#333">Single factor</text>
  <text x="430" y="178" text-anchor="middle" font-size="10" fill="#333">Password only</text>
  <text x="430" y="192" text-anchor="middle" font-size="9" fill="#777">IAL1 workflows only</text>

  <!-- AAL2 -->
  <rect x="315" y="218" width="230" height="80" rx="6" fill="#1a9e8f" stroke="#1a9e8f" stroke-width="1"/>
  <text x="430" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">AAL2</text>
  <text x="430" y="258" text-anchor="middle" font-size="10" fill="#e0f5f3">Multi-factor authentication</text>
  <text x="430" y="272" text-anchor="middle" font-size="10" fill="#e0f5f3">TOTP · Push · Hardware OTP</text>
  <text x="430" y="286" text-anchor="middle" font-size="9" fill="#c0eae6">Floor for verified-identity systems</text>

  <!-- AAL3 -->
  <rect x="315" y="312" width="230" height="80" rx="6" fill="#1a2a6c" stroke="#1a2a6c" stroke-width="1"/>
  <text x="430" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">AAL3</text>
  <text x="430" y="352" text-anchor="middle" font-size="10" fill="#c0c8e0">Hardware cryptographic key</text>
  <text x="430" y="366" text-anchor="middle" font-size="10" fill="#c0c8e0">FIDO2 · PIV-equivalent</text>
  <text x="430" y="380" text-anchor="middle" font-size="9" fill="#8898c8">High-stakes / sophisticated attacker</text>

  <!-- ===== COLUMN 3: FAL ===== -->
  <text x="685" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2a6c">FAL</text>
  <text x="685" y="102" text-anchor="middle" font-size="10" fill="#555">Federation Assurance Level</text>
  <text x="685" y="114" text-anchor="middle" font-size="10" fill="#555">How much can an IdP assertion be trusted?</text>

  <!-- FAL1 -->
  <rect x="570" y="124" width="230" height="80" rx="6" fill="#d0ede9" stroke="#1a9e8f" stroke-width="1"/>
  <text x="685" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a9e8f">FAL1</text>
  <text x="685" y="164" text-anchor="middle" font-size="10" fill="#333">Signed bearer assertion</text>
  <text x="685" y="178" text-anchor="middle" font-size="10" fill="#333">Replay possible if intercepted</text>
  <text x="685" y="192" text-anchor="middle" font-size="9" fill="#777">Low-stakes federated flows</text>

  <!-- FAL2 -->
  <rect x="570" y="218" width="230" height="80" rx="6" fill="#1a9e8f" stroke="#1a9e8f" stroke-width="1"/>
  <text x="685" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">FAL2</text>
  <text x="685" y="258" text-anchor="middle" font-size="10" fill="#e0f5f3">Holder-of-key binding</text>
  <text x="685" y="272" text-anchor="middle" font-size="10" fill="#e0f5f3">Replay-resistant assertion</text>
  <text x="685" y="286" text-anchor="middle" font-size="9" fill="#c0eae6">Login.gov minimum (ADR-056)</text>

  <!-- FAL3 -->
  <rect x="570" y="312" width="230" height="80" rx="6" fill="#1a2a6c" stroke="#1a2a6c" stroke-width="1"/>
  <text x="685" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">FAL3</text>
  <text x="685" y="352" text-anchor="middle" font-size="10" fill="#c0c8e0">Hardware holder-of-key</text>
  <text x="685" y="366" text-anchor="middle" font-size="10" fill="#c0c8e0">Cryptographic device binding</text>
  <text x="685" y="380" text-anchor="middle" font-size="9" fill="#8898c8">Rare; highest-assurance workflows</text>

  <!-- Horizontal "OrgPath attribute" band at bottom -->
  <rect x="30" y="412" width="800" height="46" rx="6" fill="#fff8e6" stroke="#d4a017" stroke-width="1.5"/>
  <text x="430" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4a017">Assurance Level = OrgPath Attribute of the Owning Bureau</text>
  <text x="430" y="449" text-anchor="middle" font-size="10" fill="#555">Declared in the OrgPath node · Enforced by drift detection · Auditable without examining application config</text>

  <!-- Legend bottom -->
  <text x="430" y="492" text-anchor="middle" font-size="10" fill="#888">UIAO Book_22 · Ch 2 · NIST SP 800-63-4 · ADR-055 · ADR-056</text>
</svg>
