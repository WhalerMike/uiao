<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- White background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="38" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2a6c">The E911 Governance Gap</text>

  <!-- Federal Building -->
  <rect x="40" y="70" width="160" height="340" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="2" rx="4"/>
  <text x="120" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2a6c">Federal Building</text>

  <!-- Floors -->
  <rect x="55" y="108" width="130" height="52" fill="#ffffff" stroke="#1a9e8f" stroke-width="1.5" rx="3"/>
  <text x="120" y="128" text-anchor="middle" font-size="11" fill="#1a2a6c">Floor 7</text>
  <text x="120" y="143" text-anchor="middle" font-size="10" fill="#555">Office 7C</text>
  <!-- caller icon -->
  <circle cx="158" cy="128" r="8" fill="#1a9e8f"/>
  <text x="158" y="132" text-anchor="middle" font-size="10" fill="#fff">☎</text>

  <rect x="55" y="170" width="130" height="52" fill="#f8f8f8" stroke="#cccccc" stroke-width="1" rx="3"/>
  <text x="120" y="190" text-anchor="middle" font-size="11" fill="#888">Floor 5</text>

  <rect x="55" y="232" width="130" height="52" fill="#f8f8f8" stroke="#cccccc" stroke-width="1" rx="3"/>
  <text x="120" y="252" text-anchor="middle" font-size="11" fill="#888">Floor 3</text>

  <rect x="55" y="294" width="130" height="52" fill="#f8f8f8" stroke="#cccccc" stroke-width="1" rx="3"/>
  <text x="120" y="314" text-anchor="middle" font-size="11" fill="#888">Floor 1</text>

  <!-- UCaaS box -->
  <rect x="55" y="362" width="130" height="38" fill="#1a2a6c" rx="3"/>
  <text x="120" y="378" text-anchor="middle" font-size="10" fill="#ffffff">IP-PBX / UCaaS</text>
  <text x="120" y="392" text-anchor="middle" font-size="9" fill="#aaccff">Teams Phone / Webex</text>

  <!-- 911 call arrow -->
  <line x1="200" y1="130" x2="310" y2="130" stroke="#1a2a6c" stroke-width="2" marker-end="url(#arrow-navy)"/>
  <text x="255" y="120" text-anchor="middle" font-size="10" fill="#1a2a6c">911 Call</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a2a6c"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a9e8f"/>
    </marker>
  </defs>

  <!-- Gap warning box -->
  <rect x="310" y="90" width="180" height="90" fill="#fff3f3" stroke="#c0392b" stroke-width="2" rx="4"/>
  <text x="400" y="115" text-anchor="middle" font-size="22" fill="#c0392b">⚠</text>
  <text x="400" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Building Address Only</text>
  <text x="400" y="154" text-anchor="middle" font-size="10" fill="#c0392b">No Floor · No Room</text>
  <text x="400" y="170" text-anchor="middle" font-size="10" fill="#c0392b">Not Compliant: 47 CFR §9.16</text>

  <!-- Arrow to PSAP -->
  <line x1="490" y1="130" x2="600" y2="130" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>

  <!-- PSAP box -->
  <rect x="600" y="80" width="200" height="110" fill="#fff8f0" stroke="#d4a017" stroke-width="2" rx="4"/>
  <text x="700" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2a6c">PSAP Dispatch</text>
  <rect x="625" y="115" width="150" height="55" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="2"/>
  <text x="700" y="135" text-anchor="middle" font-size="11" fill="#1a2a6c">123 Federal Ave</text>
  <text x="700" y="150" text-anchor="middle" font-size="11" fill="#1a2a6c">Washington DC 20001</text>
  <text x="700" y="165" text-anchor="middle" font-size="20" fill="#c0392b">?</text>

  <!-- LocPath solution section -->
  <rect x="40" y="430" width="760" height="75" fill="#f0fff8" stroke="#1a9e8f" stroke-width="2" rx="4"/>
  <text x="430" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2a6c">LocPath E911 Compliance Layer (ADR-104)</text>

  <!-- Node chain -->
  <rect x="60" y="462" width="70" height="28" fill="#1a2a6c" rx="2"/>
  <text x="95" y="480" text-anchor="middle" font-size="10" fill="#fff">Site</text>

  <line x1="130" y1="476" x2="155" y2="476" stroke="#1a9e8f" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <rect x="155" y="462" width="80" height="28" fill="#1a2a6c" rx="2"/>
  <text x="195" y="480" text-anchor="middle" font-size="10" fill="#fff">Building</text>

  <line x1="235" y1="476" x2="260" y2="476" stroke="#1a9e8f" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <rect x="260" y="462" width="70" height="28" fill="#1a2a6c" rx="2"/>
  <text x="295" y="480" text-anchor="middle" font-size="10" fill="#fff">Floor 7</text>

  <line x1="330" y1="476" x2="355" y2="476" stroke="#1a9e8f" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <rect x="355" y="462" width="80" height="28" fill="#1a9e8f" rx="2"/>
  <text x="395" y="480" text-anchor="middle" font-size="10" fill="#fff">Office 7C</text>

  <!-- e911 block indicator -->
  <rect x="450" y="458" width="120" height="36" fill="#ffffff" stroke="#1a9e8f" stroke-width="1.5" rx="2"/>
  <text x="510" y="473" text-anchor="middle" font-size="9" fill="#1a2a6c">e911 block ✓</text>
  <text x="510" y="487" text-anchor="middle" font-size="9" fill="#1a2a6c">civicAddress ✓ floor ✓ room ✓</text>

  <!-- Checkmark -->
  <circle cx="620" cy="476" r="18" fill="#1a9e8f"/>
  <text x="620" y="482" text-anchor="middle" font-size="14" fill="#fff">✓</text>
  <text x="660" y="470" font-size="10" font-weight="bold" fill="#1a2a6c">Dispatchable</text>
  <text x="660" y="484" font-size="10" font-weight="bold" fill="#1a2a6c">Location of Record</text>

  <!-- Up arrow from LocPath to PSAP suggestion -->
  <line x1="700" y1="425" x2="700" y2="195" stroke="#1a9e8f" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
  <text x="718" y="320" font-size="9" fill="#1a9e8f" transform="rotate(90,718,320)">Governed Location → 911 Call</text>
</svg>
