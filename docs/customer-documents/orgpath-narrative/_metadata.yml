# Per-section overrides for the OrgPath Narrative section. Quarto
# applies these on top of the repo-wide settings in `docs/_quarto.yml`.
#
# Override the repo-wide reference docx so the DOCX export of every
# book in this section carries a running header (Book title left,
# Chapter title right via STYLEREF Heading 1 / Heading 2 field codes)
# and a centered page-number footer (via PAGE field code).
#
# The base reference docx is a copy of `docs/assets/reference-mslearn.docx`
# (Microsoft-Learn styling for tables, code blocks, etc.) with header1.xml
# + footer1.xml added and section properties updated to reference them.
format:
  docx:
    reference-doc: _reference.docx
