<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2a6c">OrgPath Governance Reach: Microsoft Entra vs. the Full Estate</text>

  <!-- OrgPath codebook top center -->
  <rect x="320" y="56" width="220" height="52" rx="6" fill="#1a2a6c"/>
  <text x="430" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">OrgPath Codebook</text>
  <text x="430" y="96" text-anchor="middle" font-size="11" fill="#d4e4ff">UIAO_151 — 15 facets</text>

  <!-- Column headers -->
  <text x="140" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2a6c">Microsoft Entra</text>
  <text x="310" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#888888">AWS</text>
  <text x="450" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#888888">GCP</text>
  <text x="590" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#888888">VMware</text>
  <text x="730" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#888888">Okta</text>

  <!-- Solid arrow from codebook to Entra -->
  <line x1="340" y1="108" x2="185" y2="160" stroke="#1a9e8f" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- Dashed arrows from codebook to others -->
  <line x1="400" y1="108" x2="330" y2="160" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-grey)"/>
  <line x1="430" y1="108" x2="450" y2="160" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-grey)"/>
  <line x1="460" y1="108" x2="570" y2="160" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-grey)"/>
  <line x1="510" y1="108" x2="710" y2="160" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-grey)"/>

  <!-- Entra box — governed, colored -->
  <rect x="60" y="162" width="160" height="200" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <text x="140" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a6c">Users &amp; Devices</text>
  <rect x="76" y="192" width="128" height="24" rx="3" fill="#1a9e8f"/>
  <text x="140" y="209" text-anchor="middle" font-size="10" fill="#ffffff">Region = Northeast</text>
  <rect x="76" y="222" width="128" height="24" rx="3" fill="#1a2a6c"/>
  <text x="140" y="239" text-anchor="middle" font-size="10" fill="#ffffff">Department = Finance</text>
  <rect x="76" y="252" width="128" height="24" rx="3" fill="#d4a017"/>
  <text x="140" y="269" text-anchor="middle" font-size="10" fill="#ffffff">Classification = Ctrl</text>
  <rect x="76" y="282" width="128" height="24" rx="3" fill="#1a9e8f"/>
  <text x="140" y="299" text-anchor="middle" font-size="10" fill="#ffffff">AccountType = Human</text>
  <rect x="76" y="312" width="128" height="24" rx="3" fill="#1a2a6c"/>
  <text x="140" y="329" text-anchor="middle" font-size="10" fill="#ffffff">ClearanceLevel = TS</text>
  <text x="140" y="352" text-anchor="middle" font-size="10" fill="#1a9e8f">✓ Governed</text>

  <!-- AWS box — ungoverned grey -->
  <rect x="240" y="162" width="140" height="200" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.5"/>
  <text x="310" y="182" text-anchor="middle" font-size="11" fill="#999999">IAM Users</text>
  <ellipse cx="290" cy="230" rx="22" ry="22" fill="#dddddd"/>
  <ellipse cx="330" cy="230" rx="22" ry="22" fill="#dddddd"/>
  <ellipse cx="290" cy="290" rx="22" ry="22" fill="#dddddd"/>
  <ellipse cx="330" cy="290" rx="22" ry="22" fill="#dddddd"/>
  <text x="310" y="338" text-anchor="middle" font-size="10" fill="#c0392b">? No facets</text>

  <!-- GCP box — ungoverned grey -->
  <rect x="380" y="162" width="140" height="200" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.5"/>
  <text x="450" y="182" text-anchor="middle" font-size="11" fill="#999999">Cloud Identity</text>
  <ellipse cx="430" cy="230" rx="22" ry="22" fill="#dddddd"/>
  <ellipse cx="470" cy="230" rx="22" ry="22" fill="#dddddd"/>
  <ellipse cx="430" cy="290" rx="22" ry="22" fill="#dddddd"/>
  <ellipse cx="470" cy="290" rx="22" ry="22" fill="#dddddd"/>
  <text x="450" y="338" text-anchor="middle" font-size="10" fill="#c0392b">? No facets</text>

  <!-- VMware box — ungoverned grey -->
  <rect x="520" y="162" width="140" height="200" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.5"/>
  <text x="590" y="182" text-anchor="middle" font-size="11" fill="#999999">Workspace ONE</text>
  <ellipse cx="570" cy="230" rx="22" ry="22" fill="#dddddd"/>
  <ellipse cx="610" cy="230" rx="22" ry="22" fill="#dddddd"/>
  <ellipse cx="570" cy="290" rx="22" ry="22" fill="#dddddd"/>
  <ellipse cx="610" cy="290" rx="22" ry="22" fill="#dddddd"/>
  <text x="590" y="338" text-anchor="middle" font-size="10" fill="#c0392b">? No facets</text>

  <!-- Okta box — ungoverned grey -->
  <rect x="660" y="162" width="140" height="200" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.5"/>
  <text x="730" y="182" text-anchor="middle" font-size="11" fill="#999999">Universal Dir.</text>
  <ellipse cx="710" cy="230" rx="22" ry="22" fill="#dddddd"/>
  <ellipse cx="750" cy="230" rx="22" ry="22" fill="#dddddd"/>
  <ellipse cx="710" cy="290" rx="22" ry="22" fill="#dddddd"/>
  <ellipse cx="750" cy="290" rx="22" ry="22" fill="#dddddd"/>
  <text x="730" y="338" text-anchor="middle" font-size="10" fill="#c0392b">? No facets</text>

  <!-- Legend -->
  <rect x="60" y="390" width="740" height="100" rx="6" fill="#f8f8f8" stroke="#dddddd"/>
  <text x="430" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a6c">What ADR-098 and ADR-099 change</text>
  <line x1="80" y1="432" x2="130" y2="432" stroke="#1a9e8f" stroke-width="2.5"/>
  <text x="140" y="436" font-size="10" fill="#333333">Governed (binding profile active)</text>
  <line x1="340" y1="432" x2="390" y2="432" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="400" y="436" font-size="10" fill="#333333">Ungoverned (binding profile needed)</text>
  <text x="430" y="462" text-anchor="middle" font-size="10" fill="#555555">Binding profiles decouple facet semantics from storage locator — the same codebook governs every platform.</text>
  <text x="430" y="478" text-anchor="middle" font-size="10" fill="#555555">After ADR-098 + ADR-099: 9 first-class profiles, all 5 columns governed.</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a9e8f"/>
    </marker>
    <marker id="arrow-grey" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#bbbbbb"/>
    </marker>
  </defs>
</svg>
