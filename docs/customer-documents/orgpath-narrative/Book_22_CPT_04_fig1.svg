<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <text x="430" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a6c">Cross-Agency Attribute Exchange — Agencies as SSOT Vendors and Consumers</text>

  <!-- ===== LEFT COLUMN: Authoritative Sources ===== -->
  <text x="145" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2a6c">Attribute Trustees (SSOT Vendors)</text>

  <!-- SSA -->
  <rect x="30" y="80" width="230" height="60" rx="7" fill="#1a2a6c"/>
  <text x="145" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">SSA</text>
  <text x="145" y="122" text-anchor="middle" font-size="10" fill="#a0b0e0">Social Security Administration</text>
  <rect x="200" y="85" width="50" height="20" rx="4" fill="#d4a017"/>
  <text x="225" y="99" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">SSN</text>

  <!-- IRS -->
  <rect x="30" y="190" width="230" height="60" rx="7" fill="#1a2a6c"/>
  <text x="145" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">IRS</text>
  <text x="145" y="232" text-anchor="middle" font-size="10" fill="#a0b0e0">Internal Revenue Service</text>
  <rect x="200" y="195" width="50" height="20" rx="4" fill="#d4a017"/>
  <text x="225" y="209" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">TIN</text>

  <!-- GSA -->
  <rect x="30" y="300" width="230" height="60" rx="7" fill="#1a2a6c"/>
  <text x="145" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">GSA</text>
  <text x="145" y="342" text-anchor="middle" font-size="10" fill="#a0b0e0">General Services Administration</text>
  <rect x="200" y="305" width="50" height="20" rx="4" fill="#d4a017"/>
  <text x="225" y="319" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">UEI</text>

  <!-- USCIS -->
  <rect x="30" y="410" width="230" height="60" rx="7" fill="#1a2a6c"/>
  <text x="145" y="436" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">USCIS</text>
  <text x="145" y="452" text-anchor="middle" font-size="10" fill="#a0b0e0">Immigration &amp; Citizenship</text>
  <rect x="170" y="415" width="80" height="20" rx="4" fill="#d4a017"/>
  <text x="210" y="429" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">Imm. Status</text>

  <!-- ===== RIGHT COLUMN: Consumers ===== -->
  <text x="660" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a9e8f">Consuming Agencies (Customers)</text>

  <!-- SSA consumers -->
  <rect x="530" y="80" width="140" height="30" rx="5" fill="#1a9e8f"/>
  <text x="600" y="100" text-anchor="middle" font-size="10" fill="#ffffff">IRS (taxpayer ID)</text>

  <rect x="690" y="80" width="140" height="30" rx="5" fill="#1a9e8f"/>
  <text x="760" y="100" text-anchor="middle" font-size="10" fill="#ffffff">State DMVs</text>

  <rect x="530" y="122" width="140" height="30" rx="5" fill="#1a9e8f"/>
  <text x="600" y="142" text-anchor="middle" font-size="10" fill="#ffffff">Employers (payroll)</text>

  <rect x="690" y="122" width="140" height="30" rx="5" fill="#1a9e8f"/>
  <text x="760" y="142" text-anchor="middle" font-size="10" fill="#ffffff">Financial Institutions</text>

  <!-- IRS consumers -->
  <rect x="530" y="192" width="140" height="30" rx="5" fill="#1a9e8f"/>
  <text x="600" y="212" text-anchor="middle" font-size="10" fill="#ffffff">SSA (earnings)</text>

  <rect x="690" y="192" width="140" height="30" rx="5" fill="#1a9e8f"/>
  <text x="760" y="212" text-anchor="middle" font-size="10" fill="#ffffff">Lenders (income)</text>

  <rect x="530" y="232" width="300" height="30" rx="5" fill="#1a9e8f"/>
  <text x="680" y="252" text-anchor="middle" font-size="10" fill="#ffffff">State Tax Agencies</text>

  <!-- GSA consumers -->
  <rect x="530" y="302" width="140" height="30" rx="5" fill="#1a9e8f"/>
  <text x="600" y="322" text-anchor="middle" font-size="10" fill="#ffffff">DoD Contracting</text>

  <rect x="690" y="302" width="140" height="30" rx="5" fill="#1a9e8f"/>
  <text x="760" y="322" text-anchor="middle" font-size="10" fill="#ffffff">HHS Contracting</text>

  <rect x="530" y="342" width="300" height="30" rx="5" fill="#1a9e8f"/>
  <text x="680" y="362" text-anchor="middle" font-size="10" fill="#ffffff">All Contracting Agencies (~100)</text>

  <!-- USCIS consumers -->
  <rect x="530" y="410" width="140" height="30" rx="5" fill="#1a9e8f"/>
  <text x="600" y="430" text-anchor="middle" font-size="10" fill="#ffffff">E-Verify Employers</text>

  <rect x="690" y="410" width="140" height="30" rx="5" fill="#1a9e8f"/>
  <text x="760" y="430" text-anchor="middle" font-size="10" fill="#ffffff">DOL (labor cert.)</text>

  <rect x="530" y="450" width="300" height="30" rx="5" fill="#1a9e8f"/>
  <text x="680" y="470" text-anchor="middle" font-size="10" fill="#ffffff">State Benefits Agencies</text>

  <!-- Arrows SSA → consumers -->
  <line x1="260" y1="100" x2="528" y2="95" stroke="#d4a017" stroke-width="1.8"/>
  <polygon points="528,95 516,90 516,100" fill="#d4a017"/>
  <line x1="260" y1="110" x2="528" y2="137" stroke="#d4a017" stroke-width="1.4" stroke-dasharray="3,3"/>

  <!-- Arrows IRS → consumers -->
  <line x1="260" y1="210" x2="528" y2="207" stroke="#d4a017" stroke-width="1.8"/>
  <polygon points="528,207 516,202 516,212" fill="#d4a017"/>
  <line x1="260" y1="218" x2="528" y2="247" stroke="#d4a017" stroke-width="1.4" stroke-dasharray="3,3"/>

  <!-- Arrows GSA → consumers -->
  <line x1="260" y1="320" x2="528" y2="317" stroke="#d4a017" stroke-width="1.8"/>
  <polygon points="528,317 516,312 516,322" fill="#d4a017"/>
  <line x1="260" y1="332" x2="528" y2="357" stroke="#d4a017" stroke-width="1.4" stroke-dasharray="3,3"/>

  <!-- Arrows USCIS → consumers -->
  <line x1="260" y1="430" x2="528" y2="425" stroke="#d4a017" stroke-width="1.8"/>
  <polygon points="528,425 516,420 516,430" fill="#d4a017"/>
  <line x1="260" y1="440" x2="528" y2="465" stroke="#d4a017" stroke-width="1.4" stroke-dasharray="3,3"/>

  <!-- "consumed by" labels on arrows -->
  <text x="394" y="91" text-anchor="middle" font-size="8" fill="#d4a017" font-weight="bold">consumed by</text>
  <text x="394" y="201" text-anchor="middle" font-size="8" fill="#d4a017" font-weight="bold">consumed by</text>
  <text x="394" y="311" text-anchor="middle" font-size="8" fill="#d4a017" font-weight="bold">consumed by</text>
  <text x="394" y="421" text-anchor="middle" font-size="8" fill="#d4a017" font-weight="bold">consumed by</text>

  <!-- Legend -->
  <rect x="30" y="483" width="16" height="10" fill="#d4a017"/>
  <text x="52" y="492" font-size="9" fill="#555">Governed dependency (attribute exchange contract required)</text>
  <rect x="400" y="483" width="16" height="10" fill="#1a9e8f"/>
  <text x="422" y="492" font-size="9" fill="#555">Consuming agency (UIAO customer of the SSOT)</text>
  <text x="430" y="510" text-anchor="middle" font-size="9" fill="#888">UIAO Book_22 · Ch 4 · ADR-055 · UIAO_141 · UIAO_142</text>
</svg>
