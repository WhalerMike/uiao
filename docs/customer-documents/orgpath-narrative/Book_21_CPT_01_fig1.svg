<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <title>Federal Identity Governance: The Invisible AI Surface</title>
  <desc>Three horizontal identity layers. Human and Device layers are connected to a central OrgTree registry with OrgPath labels. The AI layer has no connections and shows a red ungoverned warning.</desc>

  <!-- Background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2a6c">Federal Identity Governance: The Invisible AI Surface</text>
  <text x="430" y="56" text-anchor="middle" font-size="11.5" fill="#555">1,480 live federal AI systems — 596 without ATO, 488 unowned, 14 agentic with no governance gate</text>

  <!-- CENTRAL ORGTREE REGISTRY -->
  <rect x="330" y="185" width="200" height="130" rx="8" fill="#1a2a6c"/>
  <text x="430" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">OrgTree Registry</text>
  <text x="430" y="228" text-anchor="middle" font-size="10" fill="#b0bcd8">Canonical org hierarchy</text>
  <rect x="345" y="238" width="170" height="18" rx="3" fill="#223380"/>
  <text x="355" y="251" font-size="9.5" fill="#7ec8e3">DOD:DISA</text>
  <text x="490" y="251" text-anchor="end" font-size="9" fill="#a0b0d0">OrgPath ✓</text>
  <rect x="345" y="260" width="170" height="18" rx="3" fill="#223380"/>
  <text x="355" y="273" font-size="9.5" fill="#7ec8e3">HHS:CDC</text>
  <text x="490" y="273" text-anchor="end" font-size="9" fill="#a0b0d0">OrgPath ✓</text>
  <rect x="345" y="282" width="170" height="18" rx="3" fill="#223380"/>
  <text x="355" y="295" font-size="9.5" fill="#7ec8e3">DOJ:OJP</text>
  <text x="490" y="295" text-anchor="end" font-size="9" fill="#a0b0d0">OrgPath ✓</text>

  <!-- LAYER 1: HUMAN IDENTITIES -->
  <rect x="30" y="90" width="260" height="110" rx="7" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="1.5"/>
  <text x="160" y="113" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a2a6c">Human Identities</text>
  <text x="160" y="129" text-anchor="middle" font-size="10" fill="#555">Workforce · Contractors · Non-employees</text>
  <rect x="45" y="137" width="110" height="20" rx="10" fill="#1a2a6c"/>
  <text x="100" y="151" text-anchor="middle" font-size="9.5" fill="#fff">OrgPath: HHS:CDC</text>
  <rect x="165" y="137" width="110" height="20" rx="10" fill="#1a2a6c"/>
  <text x="220" y="151" text-anchor="middle" font-size="9.5" fill="#fff">OrgPath: DOJ:OJP</text>
  <rect x="45" y="162" width="110" height="20" rx="10" fill="#1a2a6c"/>
  <text x="100" y="176" text-anchor="middle" font-size="9.5" fill="#fff">OrgPath: DOD:DISA</text>
  <rect x="165" y="162" width="90" height="20" rx="10" fill="#556080"/>
  <text x="210" y="176" text-anchor="middle" font-size="9" fill="#ccd">+ 1,200 more</text>
  <rect x="45" y="188" width="68" height="16" rx="3" fill="#27ae60"/>
  <text x="79" y="200" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">GOVERNED ✓</text>

  <!-- arrow human to registry -->
  <line x1="290" y1="175" x2="328" y2="230" stroke="#1a2a6c" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="325,226 332,234 318,232" fill="#1a2a6c"/>
  <rect x="292" y="196" width="46" height="14" rx="3" fill="#e8eeff"/>
  <text x="315" y="207" text-anchor="middle" font-size="8.5" fill="#1a2a6c">ADR-088</text>

  <!-- LAYER 2: DEVICE IDENTITIES -->
  <rect x="570" y="90" width="260" height="110" rx="7" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="1.5"/>
  <text x="700" y="113" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a2a6c">Device Identities</text>
  <text x="700" y="129" text-anchor="middle" font-size="10" fill="#555">Workstations · Servers · Network gear</text>
  <rect x="585" y="137" width="110" height="20" rx="10" fill="#1a2a6c"/>
  <text x="640" y="151" text-anchor="middle" font-size="9.5" fill="#fff">OrgPath: DOE:INL</text>
  <rect x="705" y="137" width="110" height="20" rx="10" fill="#1a2a6c"/>
  <text x="760" y="151" text-anchor="middle" font-size="9.5" fill="#fff">OrgPath: VA:OIT</text>
  <rect x="585" y="162" width="110" height="20" rx="10" fill="#1a2a6c"/>
  <text x="640" y="176" text-anchor="middle" font-size="9.5" fill="#fff">OrgPath: DHS:CISA</text>
  <rect x="705" y="162" width="90" height="20" rx="10" fill="#556080"/>
  <text x="750" y="176" text-anchor="middle" font-size="9" fill="#ccd">+ 900 more</text>
  <rect x="585" y="188" width="68" height="16" rx="3" fill="#27ae60"/>
  <text x="619" y="200" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">GOVERNED ✓</text>

  <!-- arrow device to registry -->
  <line x1="570" y1="175" x2="532" y2="230" stroke="#1a2a6c" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="535,226 528,234 542,232" fill="#1a2a6c"/>
  <rect x="522" y="196" width="46" height="14" rx="3" fill="#e8eeff"/>
  <text x="545" y="207" text-anchor="middle" font-size="8.5" fill="#1a2a6c">ADR-038</text>

  <!-- LAYER 3: AI SYSTEM IDENTITIES -->
  <rect x="30" y="360" width="800" height="130" rx="7" fill="#fff5f5" stroke="#c0392b" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="430" y="385" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b">AI System Identities</text>
  <text x="430" y="401" text-anchor="middle" font-size="10" fill="#888">1,480 live federal AI systems (OMB M-25-21 inventory, 2025)</text>

  <rect x="50" y="412" width="130" height="56" rx="5" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
  <text x="115" y="432" text-anchor="middle" font-size="9" fill="#555">DOJ: PATTERN</text>
  <text x="115" y="446" text-anchor="middle" font-size="8.5" fill="#c0392b">Agentic · No ATO</text>
  <text x="115" y="459" text-anchor="middle" font-size="8" fill="#aaa">Owner: ?  OrgPath: ?</text>

  <rect x="195" y="412" width="130" height="56" rx="5" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
  <text x="260" y="432" text-anchor="middle" font-size="9" fill="#555">NASA: Perseverance</text>
  <text x="260" y="446" text-anchor="middle" font-size="8.5" fill="#c0392b">Agentic · ATO unknown</text>
  <text x="260" y="459" text-anchor="middle" font-size="8" fill="#aaa">Owner: ?  OrgPath: ?</text>

  <rect x="340" y="412" width="130" height="56" rx="5" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
  <text x="405" y="432" text-anchor="middle" font-size="9" fill="#555">HHS/CDC: AI Scanner</text>
  <text x="405" y="446" text-anchor="middle" font-size="8.5" fill="#c0392b">Agentic · No ATO · PII</text>
  <text x="405" y="459" text-anchor="middle" font-size="8" fill="#aaa">Owner: ?  OrgPath: ?</text>

  <rect x="485" y="412" width="130" height="56" rx="5" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
  <text x="550" y="432" text-anchor="middle" font-size="9" fill="#555">DOT: Comment Analyzer</text>
  <text x="550" y="446" text-anchor="middle" font-size="8.5" fill="#e67e22">Agentic · ATO unknown</text>
  <text x="550" y="459" text-anchor="middle" font-size="8" fill="#aaa">Owner: ?  OrgPath: ?</text>

  <rect x="630" y="412" width="170" height="56" rx="5" fill="#eeeeee" stroke="#ccc" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="715" y="432" text-anchor="middle" font-size="9" fill="#777">+ 1,476 more systems</text>
  <text x="715" y="449" text-anchor="middle" font-size="8.5" fill="#c0392b">596 no ATO · 488 no owner</text>
  <text x="715" y="462" text-anchor="middle" font-size="8" fill="#aaa">248 PII / no PIA</text>

  <!-- broken connection indicator -->
  <line x1="430" y1="360" x2="430" y2="318" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,4" opacity="0.5"/>
  <text x="430" y="343" text-anchor="middle" font-size="20" fill="#c0392b" opacity="0.7">✕</text>

  <!-- badges -->
  <rect x="725" y="364" width="90" height="17" rx="3" fill="#c0392b"/>
  <text x="770" y="376" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">UNGOVERNED ✕</text>
  <rect x="620" y="364" width="98" height="17" rx="3" fill="#8b0000"/>
  <text x="669" y="376" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">GATE: HALT ⛔</text>

  <!-- Legend -->
  <rect x="30" y="500" width="12" height="12" rx="2" fill="#1a2a6c"/>
  <text x="48" y="511" font-size="9.5" fill="#333">OrgPath-governed identity</text>
  <rect x="180" y="500" width="12" height="12" rx="2" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
  <text x="198" y="511" font-size="9.5" fill="#333">Ungoverned AI system</text>
  <rect x="345" y="500" width="12" height="12" rx="2" fill="#c0392b"/>
  <text x="363" y="511" font-size="9.5" fill="#333">P1 finding (gate halt)</text>
  <rect x="490" y="500" width="12" height="12" rx="2" fill="#e67e22"/>
  <text x="508" y="511" font-size="9.5" fill="#333">P2 finding (remediate)</text>
  <text x="720" y="511" text-anchor="end" font-size="9" fill="#aaa">UIAO_196 / ADR-109 · OMB M-25-21 2025</text>
</svg>
