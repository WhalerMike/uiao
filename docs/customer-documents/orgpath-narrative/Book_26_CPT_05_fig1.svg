<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2d7d6b"/></marker>
  </defs>
  <rect width="760" height="330" fill="white"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2c5b">One runtime, many clouds — boundaries preserved, substrate reconciled</text>

  <!-- engine -->
  <rect x="270" y="60" width="220" height="58" rx="8" fill="#2d7d6b"/>
  <text x="380" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="white">One governance runtime</text>
  <text x="380" y="102" text-anchor="middle" font-size="9" fill="#d6efe7">one Codebook · one drift engine</text>

  <!-- three doors -->
  <line x1="320" y1="118" x2="160" y2="160" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>
  <line x1="380" y1="118" x2="380" y2="160" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>
  <line x1="440" y1="118" x2="600" y2="160" stroke="#2d7d6b" stroke-width="2" marker-end="url(#t)"/>

  <rect x="70" y="162" width="180" height="44" rx="6" fill="#1a2c5b"/>
  <text x="160" y="183" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Azure — commercial</text>
  <text x="160" y="198" text-anchor="middle" font-size="9" fill="#c0d0f0">(also GCC-Moderate)</text>

  <rect x="290" y="162" width="180" height="44" rx="6" fill="#1a2c5b"/>
  <text x="380" y="183" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Azure — government</text>
  <text x="380" y="198" text-anchor="middle" font-size="9" fill="#c0d0f0">GCC-High / DoD doors</text>

  <rect x="510" y="162" width="180" height="44" rx="6" fill="#1a2c5b"/>
  <text x="600" y="183" text-anchor="middle" font-size="11" font-weight="bold" fill="white">AWS</text>
  <text x="600" y="198" text-anchor="middle" font-size="9" fill="#c0d0f0">ECS / RDS substrate</text>

  <!-- tenants under each -->
  <g fill="#e8f0fc" stroke="#1a2c5b" stroke-width="1">
    <rect x="80" y="234" width="48" height="26" rx="4"/><rect x="135" y="234" width="48" height="26" rx="4"/><rect x="190" y="234" width="48" height="26" rx="4"/>
    <rect x="300" y="234" width="48" height="26" rx="4"/><rect x="355" y="234" width="48" height="26" rx="4"/><rect x="410" y="234" width="48" height="26" rx="4"/>
    <rect x="520" y="234" width="48" height="26" rx="4"/><rect x="575" y="234" width="48" height="26" rx="4"/><rect x="630" y="234" width="48" height="26" rx="4"/>
  </g>
  <text x="159" y="251" text-anchor="middle" font-size="8" fill="#1a2c5b">tenants</text>
  <text x="379" y="251" text-anchor="middle" font-size="8" fill="#1a2c5b">tenants</text>
  <text x="599" y="251" text-anchor="middle" font-size="8" fill="#1a2c5b">tenants</text>
  <line x1="160" y1="206" x2="160" y2="234" stroke="#2d7d6b" stroke-width="1.2" marker-end="url(#t)"/>
  <line x1="380" y1="206" x2="380" y2="234" stroke="#2d7d6b" stroke-width="1.2" marker-end="url(#t)"/>
  <line x1="600" y1="206" x2="600" y2="234" stroke="#2d7d6b" stroke-width="1.2" marker-end="url(#t)"/>

  <text x="380" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2c5b">Each tenant keeps its namespace · each cloud keeps its trust root · the engine is shared</text>
  <text x="380" y="314" text-anchor="middle" font-size="9" font-style="italic" fill="#2d7d6b">Reconciling across boundaries is not dissolving them.</text>
</svg>
