<svg viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <title>OMB Inventory → UIAO Identity Record</title>
  <desc>Schema mapping diagram showing OMB inventory CSV column names on the left connected by arrows to UIAO identity governance attributes on the right.</desc>

  <!-- Background -->
  <rect width="860" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2a6c">OMB Inventory → UIAO Identity Record</text>
  <text x="430" y="54" text-anchor="middle" font-size="11" fill="#555">Field-by-field mapping: UIAO_196 AISystemRecord (ADR-038 · ADR-040 · ADR-054 · ADR-059)</text>

  <!-- LEFT COLUMN HEADER -->
  <rect x="40" y="74" width="270" height="28" rx="5" fill="#0e7490"/>
  <text x="175" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">OMB Inventory CSV Columns</text>

  <!-- RIGHT COLUMN HEADER -->
  <rect x="550" y="74" width="270" height="28" rx="5" fill="#1a2a6c"/>
  <text x="685" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">UIAO Identity Governance Attributes</text>

  <!-- ROW POSITIONS: y centers at 140, 195, 250, 305, 360, 415 -->

  <!-- ROW 1: agency_bureau → OrgPath leaf -->
  <rect x="40" y="118" width="270" height="36" rx="18" fill="#0e7490"/>
  <text x="175" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">agency_bureau</text>

  <rect x="550" y="118" width="270" height="36" rx="5" fill="#1a2a6c"/>
  <text x="685" y="136" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">OrgPath leaf node</text>
  <text x="685" y="150" text-anchor="middle" font-size="9.5" fill="#b0bcd8">ADR-035–040 · OrgTree placement</text>

  <line x1="312" y1="136" x2="548" y2="136" stroke="#e67e22" stroke-width="2"/>
  <polygon points="544,131 552,136 544,141" fill="#e67e22"/>

  <!-- ROW 2: system_name_ato → ATO registry key -->
  <rect x="40" y="173" width="270" height="36" rx="18" fill="#0e7490"/>
  <text x="175" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">system_name_ato</text>

  <rect x="550" y="173" width="270" height="36" rx="5" fill="#1a2a6c"/>
  <text x="685" y="191" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">ATO registry key</text>
  <text x="685" y="205" text-anchor="middle" font-size="9.5" fill="#b0bcd8">ADR-054 · Single-ATO Reciprocity join key</text>

  <line x1="312" y1="191" x2="548" y2="191" stroke="#e67e22" stroke-width="2"/>
  <polygon points="544,186 552,191 544,196" fill="#e67e22"/>

  <!-- ROW 3: vendor_name → NERM surface -->
  <rect x="40" y="228" width="270" height="36" rx="18" fill="#0e7490"/>
  <text x="175" y="251" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">vendor_name</text>

  <rect x="550" y="228" width="270" height="36" rx="5" fill="#1a2a6c"/>
  <text x="685" y="246" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">NERM non-employee surface</text>
  <text x="685" y="260" text-anchor="middle" font-size="9.5" fill="#b0bcd8">ADR-059 · SailPoint NERM carve-out</text>

  <line x1="312" y1="246" x2="548" y2="246" stroke="#e67e22" stroke-width="2"/>
  <polygon points="544,241 552,246 544,251" fill="#e67e22"/>

  <!-- ROW 4: have_ato → ATO reciprocity -->
  <rect x="40" y="283" width="270" height="36" rx="18" fill="#0e7490"/>
  <text x="175" y="306" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">have_ato</text>

  <rect x="550" y="283" width="270" height="36" rx="5" fill="#1a2a6c"/>
  <text x="685" y="301" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">ATO reciprocity gate</text>
  <text x="685" y="315" text-anchor="middle" font-size="9.5" fill="#b0bcd8">ADR-054 · P1 finding on No / blank</text>

  <line x1="312" y1="301" x2="548" y2="301" stroke="#e67e22" stroke-width="2"/>
  <polygon points="544,296 552,301 544,306" fill="#e67e22"/>

  <!-- ROW 5: contact_email → Owner anchor -->
  <rect x="40" y="338" width="270" height="36" rx="18" fill="#0e7490"/>
  <text x="175" y="361" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">contact_email</text>

  <rect x="550" y="338" width="270" height="36" rx="5" fill="#1a2a6c"/>
  <text x="685" y="356" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Owner identity anchor</text>
  <text x="685" y="370" text-anchor="middle" font-size="9.5" fill="#b0bcd8">UIAO_196 · resolves to OrgPath user record</text>

  <line x1="312" y1="356" x2="548" y2="356" stroke="#e67e22" stroke-width="2"/>
  <polygon points="544,351 552,356 544,361" fill="#e67e22"/>

  <!-- ROW 6: has_pii → Privacy tier -->
  <rect x="40" y="393" width="270" height="36" rx="18" fill="#0e7490"/>
  <text x="175" y="416" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">has_pii</text>

  <rect x="550" y="393" width="270" height="36" rx="5" fill="#1a2a6c"/>
  <text x="685" y="411" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Privacy tier classification</text>
  <text x="685" y="425" text-anchor="middle" font-size="9.5" fill="#b0bcd8">UIAO_196 · PIA linkage + audit retention</text>

  <line x1="312" y1="411" x2="548" y2="411" stroke="#e67e22" stroke-width="2"/>
  <polygon points="544,406 552,411 544,416" fill="#e67e22"/>

  <!-- Middle label -->
  <rect x="370" y="265" width="120" height="22" rx="4" fill="#f0f4ff" stroke="#e67e22" stroke-width="1.5"/>
  <text x="430" y="280" text-anchor="middle" font-size="9.5" font-weight="700" fill="#e67e22">AISystemRecord</text>

  <!-- Legend -->
  <rect x="40" y="455" width="14" height="14" rx="7" fill="#0e7490"/>
  <text x="60" y="466" font-size="10" fill="#333">OMB inventory field (teal)</text>
  <rect x="220" y="455" width="14" height="14" rx="3" fill="#1a2a6c"/>
  <text x="240" y="466" font-size="10" fill="#333">UIAO governance attribute (navy)</text>
  <line x1="450" y1="462" x2="490" y2="462" stroke="#e67e22" stroke-width="2"/>
  <polygon points="486,457 494,462 486,467" fill="#e67e22"/>
  <text x="500" y="466" font-size="10" fill="#333">Schema mapping (amber)</text>
  <text x="820" y="466" text-anchor="end" font-size="9" fill="#aaa">UIAO_196 · ADR-054 · ADR-059</text>
</svg>
