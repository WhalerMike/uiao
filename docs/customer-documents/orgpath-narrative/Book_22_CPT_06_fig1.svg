  <!-- ===== LEFT: BEFORE ===== -->
  <text x="215" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">BEFORE — Ungoverned</text>

  <!-- Agency boxes (grey, ungoverned) -->
  <rect x="30" y="80" width="100" height="44" rx="5" fill="#bbbbbb"/>
  <text x="80" y="107" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">SSA</text>

  <rect x="160" y="80" width="100" height="44" rx="5" fill="#bbbbbb"/>
  <text x="210" y="107" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">IRS</text>

  <rect x="30" y="168" width="100" height="44" rx="5" fill="#bbbbbb"/>
  <text x="80" y="195" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">VA</text>

  <rect x="160" y="168" width="100" height="44" rx="5" fill="#bbbbbb"/>
  <text x="210" y="195" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">USCIS</text>

  <!-- Unlabeled arrows (ungoverned dependencies) -->
