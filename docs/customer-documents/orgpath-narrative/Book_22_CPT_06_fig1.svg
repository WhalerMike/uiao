  <polygon points="158,100 148,96 148,104" fill="#999"/>

  <line x1="130" y1="190" x2="158" y2="190" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="158,190 148,186 148,194" fill="#999"/>

  <line x1="80" y1="124" x2="80" y2="166" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="80,166 75,156 85,156" fill="#999"/>

  <line x1="210" y1="124" x2="210" y2="166" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="210,166 205,156 215,156" fill="#999"/>

  <!-- Question mark dependency tags -->
  <circle cx="144" cy="100" r="10" fill="#c0392b"/>
  <text x="144" y="104" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">?</text>

  <circle cx="144" cy="190" r="10" fill="#c0392b"/>
  <text x="144" y="194" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">?</text>

  <circle cx="80" cy="145" r="10" fill="#c0392b"/>
  <text x="80" y="149" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">?</text>

  <circle cx="210" cy="145" r="10" fill="#c0392b"/>
  <text x="210" y="149" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">?</text>

  <!-- No OrgPath note -->
  <rect x="30" y="240" width="230" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="145" y="260" text-anchor="middle" font-size="10" fill="#c0392b">No OrgPath nodes · No assurance declarations</text>

  <rect x="30" y="278" width="230" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="145" y="298" text-anchor="middle" font-size="10" fill="#c0392b">No attribute exchange contracts in registry</text>

  <rect x="30" y="316" width="230" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="145" y="336" text-anchor="middle" font-size="10" fill="#c0392b">No drift detection · MOUs only, invisible</text>

  <rect x="30" y="354" width="230" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="145" y="374" text-anchor="middle" font-size="10" fill="#c0392b">Assurance mismatches undetected indefinitely</text>

  <!-- Citizen icon (ungoverned) -->
  <circle cx="145" cy="430" r="18" fill="#bbbbbb"/>
  <rect x="130" y="450" width="30" height="18" rx="3" fill="#bbbbbb"/>
  <text x="145" y="484" text-anchor="middle" font-size="9" fill="#888">Citizen — ungoverned identity</text>

