<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <text x="430" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a6c">Closing the Customer Identity Gap — Before and After UIAO</text>

  <!-- Dividing line -->
