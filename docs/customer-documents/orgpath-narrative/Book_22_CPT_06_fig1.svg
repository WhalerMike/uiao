  <text x="498" y="155" text-anchor="middle" font-size="8" fill="#888">IAL2 · AAL2 · FAL2</text>

  <rect x="578" y="128" width="100" height="34" rx="4" fill="#fff8e6" stroke="#d4a017" stroke-width="1.2"/>
  <text x="628" y="143" text-anchor="middle" font-size="8" font-weight="bold" fill="#d4a017">OrgPath Node</text>
  <text x="628" y="155" text-anchor="middle" font-size="8" fill="#888">IAL2 · AAL2 · FAL2</text>

  <rect x="448" y="216" width="100" height="34" rx="4" fill="#fff8e6" stroke="#d4a017" stroke-width="1.2"/>
  <text x="498" y="231" text-anchor="middle" font-size="8" font-weight="bold" fill="#d4a017">OrgPath Node</text>
  <text x="498" y="243" text-anchor="middle" font-size="8" fill="#888">IAL2 · AAL2 · FAL2</text>

  <rect x="578" y="216" width="100" height="34" rx="4" fill="#fff8e6" stroke="#d4a017" stroke-width="1.2"/>
  <text x="628" y="231" text-anchor="middle" font-size="8" font-weight="bold" fill="#d4a017">OrgPath Node</text>
  <text x="628" y="243" text-anchor="middle" font-size="8" fill="#888">IAL3 · AAL2 · FAL2</text>

  <!-- Declared dependency arrows (teal, labeled) -->
  <line x1="548" y1="102" x2="576" y2="102" stroke="#1a9e8f" stroke-width="2"/>
  <polygon points="576,102 566,97 566,107" fill="#1a9e8f"/>
  <text x="562" y="96" text-anchor="middle" font-size="7" fill="#1a9e8f">declared</text>

  <line x1="548" y1="188" x2="576" y2="188" stroke="#1a9e8f" stroke-width="2"/>
  <polygon points="576,188 566,183 566,193" fill="#1a9e8f"/>
  <text x="562" y="183" text-anchor="middle" font-size="7" fill="#1a9e8f">declared</text>

  <!-- Login.gov box -->
  <rect x="700" y="88" width="138" height="72" rx="7" fill="#1a2a6c"/>
  <text x="769" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Login.gov</text>
  <text x="769" y="128" text-anchor="middle" font-size="9" fill="#a0b0e0">IAL1 + IAL2 proofing</text>
  <text x="769" y="142" text-anchor="middle" font-size="9" fill="#a0b0e0">OIDC/SAML · FAL2</text>
  <text x="769" y="156" text-anchor="middle" font-size="8" fill="#d4a017">ADR-056 contract</text>

  <!-- Login.gov arrows to agencies -->
  <line x1="700" y1="110" x2="680" y2="110" stroke="#1a9e8f" stroke-width="1.5"/>
  <polygon points="680,110 690,105 690,115" fill="#1a9e8f"/>
  <line x1="700" y1="148" x2="680" y2="148" stroke="#1a9e8f" stroke-width="1.5"/>
  <polygon points="680,148 690,143 690,153" fill="#1a9e8f"/>

  <!-- Drift engine box -->
  <rect x="448" y="278" width="390" height="60" rx="7" fill="#fff8e6" stroke="#d4a017" stroke-width="1.5"/>
  <text x="643" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4a017">UIAO Drift Engine — continuous monitoring</text>
  <text x="643" y="320" text-anchor="middle" font-size="9" fill="#555">IAL mismatch · contract staleness · authority gap · scope expansion · SSOT tier change</text>

  <!-- Governed benefits list -->
  <rect x="448" y="354" width="185" height="96" rx="5" fill="#eaf6f5" stroke="#1a9e8f" stroke-width="1"/>
  <text x="540" y="372" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a9e8f">Governance Capabilities</text>
  <text x="456" y="390" font-size="9" fill="#333">✓ Assurance level declared per workflow</text>
  <text x="456" y="406" font-size="9" fill="#333">✓ Attribute exchange contracts in registry</text>
  <text x="456" y="422" font-size="9" fill="#333">✓ Drift detection — automated, continuous</text>
  <text x="456" y="438" font-size="9" fill="#333">✓ Finding routing to bureau governance</text>

  <!-- Citizen icon (governed) -->
  <circle cx="720" cy="400" r="18" fill="#1a9e8f"/>
  <rect x="705" y="420" width="30" height="18" rx="3" fill="#1a9e8f"/>
  <text x="720" y="454" text-anchor="middle" font-size="9" fill="#1a9e8f">Citizen — governed identity</text>
  <text x="720" y="467" text-anchor="middle" font-size="8" fill="#555">IAL2 · Login.gov · OrgPath-scoped</text>

  <!-- Footer -->
  <text x="430" y="496" text-anchor="middle" font-size="10" fill="#888">UIAO Book_22 · Ch 6 · ADR-055 · ADR-056 · UIAO_141 · UIAO_142 · NIST SP 800-63-4</text>
