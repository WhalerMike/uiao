<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arr-navy" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a2a6c"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a9e8f"/>
    </marker>
    <marker id="arr-grey" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888888"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2a6c">Five Identity-Plane Profiles and the SailPoint Distinction</text>

  <!-- Codebook center -->
  <rect x="300" y="46" width="260" height="52" rx="6" fill="#1a2a6c"/>
  <text x="430" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">UIAO_151 Codebook</text>
  <text x="430" y="86" text-anchor="middle" font-size="10" fill="#d4e4ff">10 named facets — vendor-neutral semantics</text>
  <text x="430" y="100" text-anchor="middle" font-size="9" fill="#8899cc">Defines WHAT · Binding profiles define WHERE</text>

  <!-- Five spokes to profile boxes -->
  <!-- okta: top-left -->
  <line x1="360" y1="98" x2="140" y2="166" stroke="#1a9e8f" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <!-- ldap: left -->
  <line x1="320" y1="98" x2="84" y2="240" stroke="#1a9e8f" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <!-- pingone: bottom-left -->
  <line x1="360" y1="98" x2="140" y2="326" stroke="#1a9e8f" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <!-- keycloak: top-right -->
  <line x1="500" y1="98" x2="720" y2="166" stroke="#1a9e8f" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <!-- auth0: bottom-right -->
  <line x1="500" y1="98" x2="720" y2="326" stroke="#1a9e8f" stroke-width="1.8" marker-end="url(#arr-teal)"/>

  <!-- okta box -->
  <rect x="42" y="170" width="196" height="108" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <rect x="42" y="170" width="196" height="26" rx="6" fill="#1a9e8f"/>
  <text x="140" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">okta</text>
  <text x="58" y="212" font-size="9" fill="#333333">Storage: Universal Directory</text>
  <text x="58" y="226" font-size="9" fill="#333333">custom schema group: OrgPath</text>
  <text x="58" y="242" font-size="9" fill="#555555">Token: OIDC claims / SAML attrs</text>
  <text x="58" y="256" font-size="9" fill="#888888">Context: enterprise + inter-agency</text>
  <text x="58" y="270" font-size="9" fill="#1a9e8f">Transport: Okta Users API</text>

  <!-- ldap box -->
  <rect x="42" y="296" width="196" height="108" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <rect x="42" y="296" width="196" height="26" rx="6" fill="#1a9e8f"/>
  <text x="140" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">ldap</text>
  <text x="58" y="338" font-size="9" fill="#333333">Storage: schema-ext aux class</text>
  <text x="58" y="352" font-size="9" fill="#333333">orgpathAttributes or reserved attrs</text>
  <text x="58" y="368" font-size="9" fill="#555555">Token: LDAP bind query result</text>
  <text x="58" y="382" font-size="9" fill="#888888">Context: on-prem, generic dir</text>
  <text x="58" y="396" font-size="9" fill="#1a9e8f">Transport: LDAP v3 modify/search</text>

  <!-- pingone box -->
  <rect x="42" y="420" width="196" height="84" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <rect x="42" y="420" width="196" height="26" rx="6" fill="#1a9e8f"/>
  <text x="140" y="438" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">pingone</text>
  <text x="58" y="462" font-size="9" fill="#333333">Storage: PingOne custom user attrs</text>
  <text x="58" y="476" font-size="9" fill="#333333">+ PingFederate claim contract</text>
  <text x="58" y="492" font-size="9" fill="#888888">Context: federal PIV federation</text>

  <!-- keycloak box -->
  <rect x="622" y="170" width="196" height="108" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <rect x="622" y="170" width="196" height="26" rx="6" fill="#1a9e8f"/>
  <text x="720" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">keycloak</text>
  <text x="638" y="212" font-size="9" fill="#333333">Storage: custom key-value attrs</text>
  <text x="638" y="226" font-size="9" fill="#333333">prefix: orgpath_*</text>
  <text x="638" y="242" font-size="9" fill="#555555">Token: OIDC / SAML mappers</text>
  <text x="638" y="256" font-size="9" fill="#888888">Context: open-source, air-gapped</text>
  <text x="638" y="270" font-size="9" fill="#1a9e8f">Transport: Keycloak Admin API</text>

  <!-- auth0 box -->
  <rect x="622" y="296" width="196" height="108" rx="6" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <rect x="622" y="296" width="196" height="26" rx="6" fill="#1a9e8f"/>
  <text x="720" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">auth0</text>
  <text x="638" y="338" font-size="9" fill="#333333">Storage: app_metadata namespace</text>
  <text x="638" y="352" font-size="9" fill="#333333">key: app_metadata.orgpath.*</text>
  <text x="638" y="368" font-size="9" fill="#555555">Token: OIDC app_metadata claim</text>
  <text x="638" y="382" font-size="9" fill="#888888">Context: citizen-facing CIAM</text>
  <text x="638" y="396" font-size="9" fill="#1a9e8f">Transport: Auth0 Management API</text>

  <!-- SailPoint — NOT a binding profile -->
  <rect x="310" y="200" width="240" height="118" rx="6" fill="#f8f8f8" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="430" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#888888">SailPoint (ADR-059)</text>
  <text x="430" y="240" text-anchor="middle" font-size="10" fill="#aaaaaa">NOT a binding profile target</text>
  <line x1="350" y1="252" x2="510" y2="252" stroke="#c0392b" stroke-width="1.5"/>
  <text x="430" y="266" text-anchor="middle" font-size="9" fill="#c0392b">IGA governance CONSUMER</text>
  <text x="430" y="280" text-anchor="middle" font-size="9" fill="#888888">Reads facets from binding-profile targets</text>
  <text x="430" y="294" text-anchor="middle" font-size="9" fill="#888888">Does not store authoritative values</text>
  <text x="430" y="310" text-anchor="middle" font-size="9" fill="#555555">Governed by ADR-059 adapter family</text>

  <!-- Dashed line from codebook to SailPoint indicating consumer relationship -->
  <line x1="430" y1="98" x2="430" y2="200" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-grey)"/>
</svg>
