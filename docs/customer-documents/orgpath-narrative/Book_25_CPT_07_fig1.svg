<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arr-navy" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a2a6c"/>
    </marker>
    <marker id="arr-teal" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a9e8f"/>
    </marker>
    <marker id="arr-amber" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d4a017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2a6c">Binding Profile Onboarding Path — Four Stages</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#555555">Incremental, read-before-write: no disruption to existing profiles or the codebook</text>

  <!-- Stage boxes -->
  <!-- Stage 1 -->
  <rect x="30" y="64" width="185" height="320" rx="8" fill="#eef2fb" stroke="#1a2a6c" stroke-width="2"/>
  <rect x="30" y="64" width="185" height="36" rx="8" fill="#1a2a6c"/>
  <text x="122" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Stage 1</text>
  <text x="122" y="95" text-anchor="middle" font-size="10" fill="#d4e4ff">Declare the Target</text>
  <text x="46" y="124" font-size="9" fill="#333333">Author profile YAML</text>
  <text x="46" y="140" font-size="9" fill="#333333">• target identifier</text>
  <text x="46" y="154" font-size="9" fill="#333333">• planes covered</text>
  <text x="46" y="168" font-size="9" fill="#333333">• locator map (10 facets)</text>
  <text x="46" y="182" font-size="9" fill="#333333">• transport specification</text>
  <text x="46" y="196" font-size="9" fill="#333333">• overflow policy</text>
  <line x1="46" y1="208" x2="198" y2="208" stroke="#cccccc" stroke-width="1"/>
  <text x="46" y="224" font-size="9" fill="#555555">Register in UIAO profile</text>
  <text x="46" y="238" font-size="9" fill="#555555">registry</text>
  <line x1="46" y1="250" x2="198" y2="250" stroke="#cccccc" stroke-width="1"/>
  <text x="46" y="266" font-size="9" fill="#555555">ADR review if new</text>
  <text x="46" y="280" font-size="9" fill="#555555">platform type; change</text>
  <text x="46" y="294" font-size="9" fill="#555555">mgmt if new instance</text>
  <line x1="46" y1="308" x2="198" y2="308" stroke="#cccccc" stroke-width="1"/>
  <text x="46" y="324" font-size="9" fill="#1a2a6c">No provisioning yet.</text>
  <text x="46" y="338" font-size="9" fill="#1a2a6c">Declaration only.</text>
  <text x="122" y="370" text-anchor="middle" font-size="22" fill="#1a2a6c">📋</text>

  <!-- Arrow 1→2 -->
  <line x1="215" y1="224" x2="245" y2="224" stroke="#1a2a6c" stroke-width="2" marker-end="url(#arr-navy)"/>

  <!-- Stage 2 -->
  <rect x="248" y="64" width="185" height="320" rx="8" fill="#eef2fb" stroke="#1a2a6c" stroke-width="2"/>
  <rect x="248" y="64" width="185" height="36" rx="8" fill="#1a2a6c"/>
  <text x="340" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Stage 2</text>
  <text x="340" y="95" text-anchor="middle" font-size="10" fill="#d4e4ff">Wire the Transport</text>
  <text x="264" y="124" font-size="9" fill="#333333">Configure credentials</text>
  <text x="264" y="138" font-size="9" fill="#333333">• service account / API key</text>
  <text x="264" y="152" font-size="9" fill="#333333">• endpoint URL</text>
  <text x="264" y="166" font-size="9" fill="#333333">• API version params</text>
  <line x1="264" y1="178" x2="416" y2="178" stroke="#cccccc" stroke-width="1"/>
  <text x="264" y="194" font-size="9" fill="#555555">One-time schema setup</text>
  <text x="264" y="208" font-size="9" fill="#555555">where required:</text>
  <text x="264" y="222" font-size="9" fill="#555555">• GCP OrgPath schema</text>
  <text x="264" y="236" font-size="9" fill="#555555">• Okta schema group</text>
  <text x="264" y="250" font-size="9" fill="#555555">• PingOne attr defs</text>
  <line x1="264" y1="262" x2="416" y2="262" stroke="#cccccc" stroke-width="1"/>
  <text x="264" y="278" font-size="9" fill="#555555">Connectivity check:</text>
  <text x="264" y="292" font-size="9" fill="#555555">read sample objects,</text>
  <text x="264" y="306" font-size="9" fill="#555555">verify locator fields exist</text>
  <line x1="264" y1="318" x2="416" y2="318" stroke="#cccccc" stroke-width="1"/>
  <text x="264" y="334" font-size="9" fill="#1a2a6c">Fail here, not at Stage 3.</text>
  <text x="340" y="370" text-anchor="middle" font-size="22" fill="#1a2a6c">🔌</text>

  <!-- Arrow 2→3 -->
  <line x1="433" y1="224" x2="463" y2="224" stroke="#1a9e8f" stroke-width="2" marker-end="url(#arr-teal)"/>

  <!-- Stage 3 -->
  <rect x="466" y="64" width="185" height="320" rx="8" fill="#eaf4f2" stroke="#1a9e8f" stroke-width="2"/>
  <rect x="466" y="64" width="185" height="36" rx="8" fill="#1a9e8f"/>
  <text x="558" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Stage 3</text>
  <text x="558" y="95" text-anchor="middle" font-size="10" fill="#ffffff">Conformance Assessment</text>
  <text x="482" y="124" font-size="9" fill="#333333">READ-ONLY scan of target</text>
  <line x1="482" y1="136" x2="634" y2="136" stroke="#cccccc" stroke-width="1"/>
  <text x="482" y="152" font-size="9" fill="#333333">Coverage report:</text>
  <text x="482" y="168" font-size="9" fill="#1a9e8f">Covered — all 10 facets,</text>
  <text x="482" y="182" font-size="9" fill="#1a9e8f">  values in codebook ✓</text>
  <text x="482" y="198" font-size="9" fill="#d4a017">Partial — some facets or</text>
  <text x="482" y="212" font-size="9" fill="#d4a017">  out-of-codebook values</text>
  <text x="482" y="228" font-size="9" fill="#c0392b">Absent — no OrgPath</text>
  <text x="482" y="242" font-size="9" fill="#c0392b">  facets on object</text>
  <line x1="482" y1="254" x2="634" y2="254" stroke="#cccccc" stroke-width="1"/>
  <text x="482" y="270" font-size="9" fill="#555555">Platform owner reviews</text>
  <text x="482" y="284" font-size="9" fill="#555555">report; signs off before</text>
  <text x="482" y="298" font-size="9" fill="#555555">write-back is enabled</text>
  <line x1="482" y1="310" x2="634" y2="310" stroke="#cccccc" stroke-width="1"/>
  <text x="482" y="326" font-size="9" fill="#1a9e8f">No writes to platform.</text>
  <text x="482" y="340" font-size="9" fill="#1a9e8f">Evidence-backed decision.</text>
  <text x="558" y="370" text-anchor="middle" font-size="22" fill="#1a9e8f">🔍</text>

  <!-- Arrow 3→4 -->
  <line x1="651" y1="224" x2="681" y2="224" stroke="#d4a017" stroke-width="2" marker-end="url(#arr-amber)"/>

  <!-- Stage 4 -->
  <rect x="684" y="64" width="145" height="320" rx="8" fill="#fff8e8" stroke="#d4a017" stroke-width="2"/>
  <rect x="684" y="64" width="145" height="36" rx="8" fill="#d4a017"/>
  <text x="756" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Stage 4</text>
  <text x="756" y="95" text-anchor="middle" font-size="10" fill="#fff8e0">Full Governance</text>
  <text x="700" y="124" font-size="9" fill="#333333">Enable write-back</text>
  <text x="700" y="140" font-size="9" fill="#333333">First provisioning run:</text>
  <text x="700" y="154" font-size="9" fill="#555555">• stamp absent objects</text>
  <text x="700" y="168" font-size="9" fill="#555555">• remediate partial</text>
  <line x1="700" y1="180" x2="812" y2="180" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="196" font-size="9" fill="#333333">Standard drift cycle:</text>
  <text x="700" y="210" font-size="9" fill="#555555">• identity: 24h</text>
  <text x="700" y="224" font-size="9" fill="#555555">• workload: 4h</text>
  <line x1="700" y1="236" x2="812" y2="236" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="252" font-size="9" fill="#333333">Findings routed to</text>
  <text x="700" y="266" font-size="9" fill="#333333">unified governance</text>
  <text x="700" y="280" font-size="9" fill="#333333">inbox (platform field</text>
  <text x="700" y="294" font-size="9" fill="#333333">identifies profile)</text>
  <line x1="700" y1="306" x2="812" y2="306" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="322" font-size="9" fill="#d4a017">Profile active.</text>
  <text x="700" y="336" font-size="9" fill="#d4a017">Fully governed.</text>
  <text x="756" y="370" text-anchor="middle" font-size="22" fill="#d4a017">✅</text>

  <!-- Bottom summary -->
  <rect x="30" y="402" width="800" height="96" rx="6" fill="#f0f4ff" stroke="#1a2a6c" stroke-width="1.5"/>
  <text x="430" y="424" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a6c">When all 9 profiles complete Stage 4: One codebook · One drift engine · Nine substrates</text>
  <text x="430" y="444" text-anchor="middle" font-size="10" fill="#333333">microsoft-entra · aws · gcp · vmware · okta · ldap · pingone · keycloak · auth0</text>
  <text x="430" y="464" text-anchor="middle" font-size="10" fill="#333333">Every identity and workload object governed by the same 15 facets, validated against the same authoritative source,</text>
  <text x="430" y="480" text-anchor="middle" font-size="10" fill="#333333">enforceable through the same predicate language on every enforcement surface the estate runs.</text>
  <text x="430" y="496" text-anchor="middle" font-size="10" fill="#1a2a6c">Profiles are additive — adding a new profile never disturbs governance on existing ones.</text>
</svg>
