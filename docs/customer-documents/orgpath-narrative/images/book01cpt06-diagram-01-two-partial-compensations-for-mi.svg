<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Two partial compensations for missing OU</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">structure — each with its failure mode</text><text x="60" y="180" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="start">ADMINISTRATIVE UNITS</text><rect x="60" y="210" width="175" height="90" rx="8" fill="#0D1B2E"/><text x="147.5" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">West Region</text><rect x="255" y="210" width="175" height="90" rx="8" fill="#0D1B2E"/><text x="342.5" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">West Finance</text><rect x="450" y="210" width="175" height="90" rx="8" fill="#0D1B2E"/><text x="537.5" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">East Region</text><rect x="60" y="330" width="575" height="96" rx="0" fill="#F7E2DE"/><rect x="60" y="330" width="10" height="96" rx="0" fill="#C0392B"/><text x="90" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#C0392B" text-anchor="start">NO INHERITANCE BETWEEN AUs.</text><text x="90" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">Every level is assigned separately.</text><line x1="660" y1="170" x2="660" y2="470" stroke="#E3E8EF" stroke-width="1.4"/><text x="695" y="180" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="start">DYNAMIC GROUPS</text><rect x="695" y="210" width="230" height="90" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="810" y="247.65" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">User object</text><text x="810" y="262.35" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">attribute = 'west'</text><line x1="935" y1="255" x2="1000" y2="255" stroke="#0D1B2E" stroke-width="2.5" marker-end="url(#ar-navy)"/><rect x="1010" y="210" width="190" height="90" rx="8" fill="#1E8C8C"/><text x="1105" y="247.125" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Group</text><text x="1105" y="262.875" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">membership</text><rect x="695" y="330" width="505" height="96" rx="0" fill="#F7E2DE"/><rect x="695" y="330" width="10" height="96" rx="0" fill="#C0392B"/><text x="725" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#C0392B" text-anchor="start">Minutes-to-hours lag, no bounded latency.</text><text x="725" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="start">Cannot reference another dynamic group — no composition.</text><rect x="60" y="500" width="1140" height="70" rx="0" fill="#0D1B2E"/><text x="630" y="535" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Both approximate a hierarchy. Neither reproduces structural inheritance.</text>
</svg>
