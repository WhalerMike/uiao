<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">One Evidence Bundle, keyed by OrgPath</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">segment, aggregates all three surfaces</text>

<!-- LEFT: three teal source lanes -->
<text x="60" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.4" fill="#1E8C8C" text-anchor="start">SOURCE SURFACES</text>
<rect x="60" y="175" width="300" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="210" y="203" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">AD SPN inventory</text>
<text x="210" y="227" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">pre-migration baseline</text>
<rect x="60" y="285" width="300" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="210" y="313" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Purview collection</text>
<text x="210" y="337" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">+ uiao_orgpath tagging</text>
<rect x="60" y="395" width="300" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="210" y="423" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Fabric Domain</text>
<text x="210" y="447" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">+ OneLake mirroring</text>

<!-- arrows to center -->
<line x1="360" y1="215" x2="446" y2="290" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="360" y1="325" x2="446" y2="325" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="360" y1="435" x2="446" y2="360" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- CENTER: Evidence Bundle (navy) -->
<rect x="450" y="240" width="320" height="170" rx="10" fill="#0D1B2E"/>
<text x="610" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Evidence Bundle</text>
<text x="610" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">OSCAL and JSON Schema artifacts</text>
<text x="610" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">keyed by OrgPath segment</text>
<rect x="490" y="356" width="240" height="34" rx="6" fill="#1E3A66"/>
<text x="610" y="374" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">one artifact, three surfaces</text>

<!-- drift findings column (amber) -->
<rect x="450" y="430" width="320" height="34" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="610" y="448" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="bold" fill="#8A6D10" text-anchor="middle" dominant-baseline="central">DRIFT-IDENTITY · DRIFT-PROVENANCE · DRIFT-AUTHZ</text>
<text x="610" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="middle">drift findings carried in the bundle</text>

<!-- arrow to proof chips -->
<line x1="770" y1="325" x2="856" y2="325" stroke="#0D1B2E" stroke-width="2.2" marker-end="url(#ar-navy)"/>

<!-- RIGHT: four navy proof chips -->
<text x="870" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.4" fill="#1E3A66" text-anchor="start">PROOF THE ASSESSOR READS</text>
<rect x="860" y="175" width="360" height="56" rx="8" fill="#1E3A66"/>
<text x="1040" y="203" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Estate known at window start</text>
<rect x="860" y="245" width="360" height="56" rx="8" fill="#1E3A66"/>
<text x="1040" y="273" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Every instance attributed</text>
<rect x="860" y="315" width="360" height="56" rx="8" fill="#1E3A66"/>
<text x="1040" y="343" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">User + data planes share one hierarchy</text>
<rect x="860" y="385" width="360" height="56" rx="8" fill="#1E3A66"/>
<text x="1040" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Drift surfaced and resolved</text>

<text x="640" y="560" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">The assessor reads one artifact instead of reconstructing the picture from three Microsoft consoles.</text>
</svg>
