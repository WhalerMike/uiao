<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Retargeting by tag, not by editing assignments:</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">a tier change moves the baseline</text>

<!-- amber clock marker top-right -->
<rect x="940" y="140" width="300" height="44" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<circle cx="965" cy="162" r="11" fill="none" stroke="#D4A017" stroke-width="2"/>
<line x1="965" y1="162" x2="965" y2="155" stroke="#D4A017" stroke-width="2"/>
<line x1="965" y1="162" x2="970" y2="165" stroke="#D4A017" stroke-width="2"/>
<text x="990" y="167" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="start">Azure Policy evaluates every 24 hours</text>

<!-- OrgPath propagation pipeline (left) -->
<rect x="40" y="320" width="230" height="80" rx="8" fill="#0D1B2E"/>
<text x="155" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OrgPath propagation</text>
<text x="155" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">pipeline</text>

<!-- central machine card -->
<rect x="430" y="300" width="280" height="120" rx="8" fill="#0D1B2E"/>
<text x="570" y="328" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">machine</text>
<text x="448" y="356" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="start">name = srv-dc-07</text>
<text x="448" y="378" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="start">OrgPath = Region=NCR|Department=Operations|</text>
<text x="448" y="396" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="start">          /DataCenter</text>
<text x="448" y="414" font-family="Consolas, monospace" font-size="11" fill="#D4A017" text-anchor="start">OrgTier = 1</text>

<!-- pipeline -> machine arrow -->
<line x1="270" y1="360" x2="428" y2="360" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<text x="349" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#D4A017" text-anchor="middle">updates OrgTier 2 &#8594; 1</text>

<!-- two policy definition boxes above machine -->
<rect x="430" y="160" width="280" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="570" y="182" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">Tier2 definition</text>
<text x="570" y="200" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#C0392B" text-anchor="middle" dominant-baseline="central">condition no longer matches</text>
<rect x="430" y="226" width="280" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="570" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">Tier1 definition</text>
<text x="570" y="266" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">condition now matches</text>

<!-- Tier2 broken (red, dashed) connector to machine -->
<line x1="400" y1="188" x2="400" y2="300" stroke="#C0392B" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ar-red)"/>
<line x1="400" y1="188" x2="428" y2="188" stroke="#C0392B" stroke-width="2" stroke-dasharray="6,5"/>
<text x="380" y="244" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#C0392B" text-anchor="end">broken</text>

<!-- Tier1 solid teal connector to machine -->
<line x1="570" y1="282" x2="570" y2="298" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- Tier1 -> deployIfNotExists -> amber assignment -->
<line x1="710" y1="254" x2="830" y2="300" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<text x="785" y="270" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1E8C8C" text-anchor="middle">deployIfNotExists</text>
<rect x="820" y="310" width="260" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="950" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Tier1 Guest Configuration</text>
<text x="950" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">assignment</text>

<!-- assignment -> Arc agent -->
<line x1="950" y1="374" x2="950" y2="430" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<rect x="790" y="432" width="320" height="80" rx="8" fill="#0D1B2E"/>
<text x="950" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Arc agent applies stricter</text>
<text x="950" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Tier1 DSC baseline</text>

<text x="640" y="600" font-family="Arial, Helvetica, sans-serif" font-size="15" font-style="italic" fill="#6B7A8D" text-anchor="middle">The OrgTier tag is the steering wheel. Change the tag and the matching definition &#8212; not the assignment &#8212; selects the new baseline.</text>
</svg>
