<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
  <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
  <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>

<!-- Title -->
<text x="60" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Only one node may say yes</text>

<!-- ===================== LEFT PANEL: REJECTED ===================== -->
<rect x="60" y="100" width="540" height="430" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
<rect x="60" y="100" width="540" height="46" rx="0" fill="#C0392B"/>
<text x="78" y="123" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">REJECTED</text>
<text x="200" y="123" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FBEED2" text-anchor="start" dominant-baseline="central">two authorities, active-active</text>

<!-- two server boxes -->
<rect x="92" y="190" width="186" height="96" rx="4" fill="#0D1B2E"/>
<text x="185" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">AUTHORITY A</text>
<text x="185" y="252" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">says yes</text>
<rect x="382" y="190" width="186" height="96" rx="4" fill="#0D1B2E"/>
<text x="475" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">AUTHORITY B</text>
<text x="475" y="252" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">also says yes</text>

<!-- commit arrows into each -->
<line x1="185" y1="158" x2="185" y2="186" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="475" y1="158" x2="475" y2="186" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<text x="330" y="170" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">commits</text>

<!-- histories drifting into a red fork -->
<line x1="185" y1="290" x2="155" y2="430" stroke="#C0392B" stroke-width="2.5" marker-end="url(#ar-red)"/>
<line x1="475" y1="290" x2="505" y2="430" stroke="#C0392B" stroke-width="2.5" marker-end="url(#ar-red)"/>
<rect x="200" y="446" width="260" height="56" rx="4" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
<text x="330" y="465" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">DIVERGENT TRUTH</text>
<text x="330" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="central">two plausible histories</text>

<!-- ===================== RIGHT PANEL: CANON ===================== -->
<rect x="640" y="100" width="580" height="430" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
<rect x="640" y="100" width="580" height="46" rx="0" fill="#1E8C8C"/>
<text x="658" y="123" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">CANON</text>
<text x="746" y="123" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#D7F2EE" text-anchor="start" dominant-baseline="central">one authority, plus standby</text>

<!-- quorum witness above both -->
<rect x="838" y="166" width="184" height="58" rx="4" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
<text x="930" y="186" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#D4A017" text-anchor="middle" dominant-baseline="central">QUORUM WITNESS</text>
<text x="930" y="207" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">only the holder may bind commits</text>

<!-- AUTHORITY box -->
<rect x="676" y="300" width="200" height="106" rx="4" fill="#0D1B2E"/>
<text x="776" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">AUTHORITY</text>
<text x="776" y="362" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">the one that says yes</text>
<text x="776" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">active</text>

<!-- STANDBY box -->
<rect x="984" y="300" width="200" height="106" rx="4" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="1084" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">STANDBY</text>
<text x="1084" y="362" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">does not say yes</text>
<rect x="1014" y="376" width="140" height="22" rx="3" fill="#FBEED2" stroke="#D4A017" stroke-width="1"/>
<text x="1084" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#D4A017" text-anchor="middle" dominant-baseline="central">demoted node fenced</text>

<!-- commit arrows converging on AUTHORITY -->
<line x1="700" y1="262" x2="744" y2="296" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="776" y1="252" x2="776" y2="296" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="852" y1="262" x2="808" y2="296" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<text x="776" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">all commits converge</text>

<!-- witness governs authority -->
<line x1="930" y1="226" x2="846" y2="298" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>

<!-- dashed amber failover path -->
<line x1="878" y1="353" x2="982" y2="353" stroke="#D4A017" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ar-amber)"/>
<text x="930" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#D4A017" text-anchor="middle" dominant-baseline="central">automatic quorum-gated failover</text>
<text x="930" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">never active-active</text>

<!-- ===================== BOTTOM TEAL BAND: TARGET SURFACES ===================== -->
<rect x="60" y="560" width="1160" height="128" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="84" y="594" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="start" dominant-baseline="central">SCALE LIVES HERE</text>
<text x="84" y="616" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start" dominant-baseline="central">target surfaces fan out freely</text>

<!-- arrow from authority feeding the band -->
<line x1="776" y1="410" x2="640" y2="556" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>

<text x="300" y="586" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">TARGET SURFACES</text>

<rect x="320" y="610" width="170" height="52" rx="4" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="405" y="636" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Entra</text>

<rect x="520" y="610" width="170" height="52" rx="4" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="605" y="636" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Intune</text>

<rect x="720" y="610" width="190" height="52" rx="4" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="815" y="636" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure Arc</text>

<rect x="940" y="610" width="170" height="52" rx="4" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="1025" y="636" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">…and more</text>
</svg>
