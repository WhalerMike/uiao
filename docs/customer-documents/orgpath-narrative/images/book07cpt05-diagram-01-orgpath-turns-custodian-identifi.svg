<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E">OrgPath turns custodian identification into</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E">one prefix query for the exact population</text>

<!-- LEFT: red manual cluster (problem state) -->
<rect x="60" y="180" width="300" height="200" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="210" y="216" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">manual custodian list</text>
<text x="210" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">stakeholder recollection</text>
<text x="210" y="276" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">slow and biased</text>
<text x="210" y="328" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C0392B" text-anchor="middle" dominant-baseline="central">&#10007;  &#10007;  &#10007;</text>
<text x="210" y="356" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">names missed, names guessed</text>

<!-- wide navy arrow -->
<line x1="372" y1="280" x2="470" y2="280" stroke="#0D1B2E" stroke-width="6" marker-end="url(#ar-navy)"/>

<!-- RIGHT: teal OrgPath tree, /Root/Finance subtree highlighted -->
<rect x="500" y="160" width="720" height="300" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/>
<text x="520" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D">ORGPATH TREE</text>

<!-- Root -->
<rect x="560" y="206" width="150" height="44" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="635" y="228" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">/Root</text>

<!-- Finance subtree highlighted (query scope) -->
<rect x="540" y="290" width="280" height="150" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2.4"/>
<text x="680" y="316" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">/Root/Finance  (query scope)</text>
<!-- resolved custodians with amber legal-hold markers -->
<rect x="558" y="334" width="244" height="40" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.8"/>
<text x="640" y="354" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">mailbox  &#9679; legal hold applied</text>
<rect x="558" y="384" width="244" height="40" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.8"/>
<text x="640" y="404" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">OneDrive  &#9679; legal hold applied</text>

<!-- sibling branches plain navy, out of scope -->
<rect x="860" y="306" width="170" height="44" rx="8" fill="#0D1B2E"/>
<text x="945" y="328" font-family="Consolas, monospace" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">/Root/HR</text>
<rect x="860" y="380" width="170" height="44" rx="8" fill="#0D1B2E"/>
<text x="945" y="402" font-family="Consolas, monospace" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">/Root/Sales</text>
<text x="1115" y="328" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">out of scope</text>
<text x="1115" y="402" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">out of scope</text>

<!-- tree edges -->
<line x1="635" y1="250" x2="680" y2="288" stroke="#1E8C8C" stroke-width="1.8"/>
<line x1="700" y1="240" x2="900" y2="304" stroke="#5A5A5A" stroke-width="1.2"/>
<line x1="700" y1="248" x2="900" y2="378" stroke="#5A5A5A" stroke-width="1.2"/>

<!-- filter annotation -->
<rect x="540" y="256" width="280" height="24" rx="4" fill="#FBEED2"/>
<text x="680" y="268" font-family="Consolas, monospace" font-size="11.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">startsWith OrgPath, '/Root/Finance/'</text>

<!-- bottom navy band: chain of custody -->
<rect x="60" y="500" width="1160" height="70" rx="8" fill="#0D1B2E"/>
<text x="640" y="535" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">governance archive records the scope, timestamp, and directory state</text>
<text x="640" y="556" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">for chain of custody</text>

<text x="640" y="620" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">One prefix query resolves the exact investigation population — repeatably and defensibly.</text>
</svg>
