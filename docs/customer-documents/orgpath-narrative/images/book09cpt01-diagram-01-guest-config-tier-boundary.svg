<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">The management plane boundary: what Policy</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">observes vs. what Guest Configuration enforces</text>

<!-- Left margin OrgTier tags -->
<rect x="40" y="300" width="150" height="40" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="115" y="320" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgTier=Tier0</text>
<rect x="40" y="350" width="150" height="40" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="115" y="370" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgTier=Tier1</text>
<rect x="40" y="400" width="150" height="40" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="115" y="420" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgTier=Tier2</text>
<text x="115" y="460" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="middle">tier selects baseline</text>

<!-- Azure Policy definition box (center) -->
<rect x="430" y="320" width="300" height="100" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="580" y="350" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure Policy definition</text>
<text x="580" y="378" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">package URL</text>
<text x="580" y="398" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">SHA256 hash</text>

<!-- amber arrows from tags to policy definition -->
<line x1="190" y1="320" x2="428" y2="350" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="190" y1="370" x2="428" y2="370" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="190" y1="420" x2="428" y2="392" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>

<!-- Azure control plane band (top) -->
<rect x="430" y="150" width="790" height="120" rx="8" fill="#0D1B2E"/>
<text x="450" y="178" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Azure control plane &#8212; observable &amp; enforceable by Azure Policy</text>
<rect x="450" y="198" width="170" height="56" rx="6" fill="#1E3A66"/>
<text x="535" y="226" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">tags</text>
<rect x="635" y="198" width="170" height="56" rx="6" fill="#1E3A66"/>
<text x="720" y="226" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">subscription</text>
<rect x="820" y="198" width="190" height="56" rx="6" fill="#1E3A66"/>
<text x="915" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">diagnostic settings</text>
<rect x="1025" y="198" width="170" height="56" rx="6" fill="#1E3A66"/>
<text x="1110" y="226" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">extensions</text>

<!-- management plane boundary line -->
<line x1="430" y1="470" x2="1220" y2="470" stroke="#0D1B2E" stroke-width="3.5"/>
<text x="430" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="italic" fill="#0D1B2E" text-anchor="start">the management plane boundary</text>

<!-- guest OS box (bottom) -->
<rect x="430" y="490" width="520" height="190" rx="8" fill="#0D1B2E"/>
<text x="450" y="516" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="start">guest operating system &#8212; previously ungoverned</text>
<text x="455" y="548" font-family="Consolas, monospace" font-size="13" fill="#C0392B" text-anchor="start">&#10007; SMBv1 disabled</text>
<text x="455" y="576" font-family="Consolas, monospace" font-size="13" fill="#C0392B" text-anchor="start">&#10007; local Administrator inactive</text>
<text x="455" y="604" font-family="Consolas, monospace" font-size="13" fill="#C0392B" text-anchor="start">&#10007; BitLocker on fixed volumes</text>
<text x="455" y="632" font-family="Consolas, monospace" font-size="13" fill="#C0392B" text-anchor="start">&#10007; audit policy subcategories</text>
<text x="455" y="660" font-family="Consolas, monospace" font-size="13" fill="#C0392B" text-anchor="start">&#10007; SYSTEM scheduled tasks</text>

<!-- Guest Configuration extension teal pipe crossing the boundary -->
<rect x="985" y="430" width="100" height="120" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1035" y="478" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">Guest</text>
<text x="1035" y="494" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">Configuration</text>
<text x="1035" y="510" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">extension</text>

<!-- arrow from policy definition into pipe top -->
<path d="M730,360 L1035,360 L1035,428" fill="none" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<text x="900" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">apply DSC package</text>
<!-- arrow from pipe bottom into guest OS -->
<path d="M1010,552 L1010,600 L952,600" fill="none" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<text x="1020" y="588" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1E8C8C" text-anchor="start">into OS</text>

<!-- compliance dashboard box (right) -->
<rect x="1115" y="600" width="125" height="80" rx="8" fill="#0D1B2E"/>
<text x="1177" y="626" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">compliance</text>
<text x="1177" y="644" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">dashboard</text>
<text x="1177" y="662" font-family="Consolas, monospace" font-size="9" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Compliant / NonCompliant</text>

<!-- return arrow compliance state up to dashboard -->
<path d="M1085,520 L1177,520 L1177,598" fill="none" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<text x="1177" y="508" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">compliance state</text>
</svg>
