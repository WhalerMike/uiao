<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">One OrgPath value drives an entire</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Entitlement Management access package</text>

<!-- top: OrgTree registry node -->
<rect x="470" y="130" width="340" height="74" rx="8" fill="#0D1B2E"/>
<text x="640" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree registry</text>
<text x="640" y="183" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">ORG-IT-SEC  /Root/IT/Security</text>

<!-- arrow down to dynamic group -->
<line x1="640" y1="204" x2="640" y2="232" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- dynamic group -->
<rect x="455" y="234" width="370" height="72" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="640" y="259" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath dynamic group</text>
<text x="640" y="285" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgPath rule re-evaluated automatically</text>

<!-- four fan arrows from dynamic group to EM boxes -->
<line x1="510" y1="306" x2="180" y2="395" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="585" y1="306" x2="440" y2="395" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="695" y1="306" x2="700" y2="395" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="770" y1="306" x2="960" y2="395" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>

<!-- EM object box 1: Catalog -->
<rect x="60" y="397" width="240" height="110" rx="8" fill="#0D1B2E"/>
<text x="180" y="425" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Catalog</text>
<text x="180" y="458" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">scoped to</text>
<text x="180" y="480" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">ORG-IT-SEC resources</text>

<!-- EM object box 2: Access package -->
<rect x="320" y="397" width="240" height="110" rx="8" fill="#0D1B2E"/>
<text x="440" y="425" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Access package</text>
<text x="440" y="458" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">bundles group, app,</text>
<text x="440" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">and SharePoint roles</text>

<!-- EM object box 3: Assignment policy -->
<rect x="580" y="397" width="240" height="110" rx="8" fill="#0D1B2E"/>
<text x="700" y="425" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Assignment policy</text>
<text x="700" y="458" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">requestor scope =</text>
<text x="700" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">OrgPath dynamic group</text>

<!-- EM object box 4: Auto-assignment policy -->
<rect x="840" y="397" width="240" height="110" rx="8" fill="#0D1B2E"/>
<text x="960" y="425" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Auto-assignment</text>
<text x="960" y="447" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">policy</text>
<text x="960" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">grants to group, no ticket</text>

<!-- amber approval-routing loop from assignment policy up to manager-chain box -->
<path d="M873 397 C 873 360, 1000 350, 1080 332" fill="none" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<text x="940" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#9A7A12" text-anchor="middle">approval routing</text>
<rect x="1010" y="225" width="210" height="105" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="1115" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgTree manager chain</text>
<text x="1115" y="283" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">first- and second-stage</text>
<text x="1115" y="303" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">approvers from OrgPath</text>

<!-- red AD-past side-note card lower right -->
<rect x="840" y="555" width="380" height="110" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="1030" y="582" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">AD past</text>
<text x="1030" y="610" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">manual group nesting, ticket-driven,</text>
<text x="1030" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">no expiry, standing access</text>
</svg>
