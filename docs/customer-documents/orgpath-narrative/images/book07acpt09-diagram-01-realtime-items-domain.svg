<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E" text-anchor="start">Eventstreams, eventhouses, and KQL databases</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E" text-anchor="start">inherit domain and OrgPath like the batch estate</text>

<!-- Streaming source -->
<rect x="60" y="320" width="130" height="70" rx="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.5"/>
<text x="125" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">streaming</text>
<text x="125" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">source</text>

<!-- Fabric Domain band (navy) at top -->
<rect x="220" y="170" width="640" height="60" rx="8" fill="#0D1B2E"/>
<text x="540" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Fabric Domain</text>
<text x="540" y="214" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#D4A017" text-anchor="middle" dominant-baseline="central">/Root/Operations   (carried over from Chapter 5)</text>

<!-- Workspace rectangle holding the three streaming items -->
<rect x="220" y="290" width="640" height="180" rx="10" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.8"/>
<text x="240" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E3A66" text-anchor="start">workspace assigned to the domain</text>
<!-- three items -->
<rect x="245" y="330" width="180" height="110" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="335" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">eventstream</text>
<text x="335" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">ingest</text>
<rect x="450" y="330" width="180" height="110" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="540" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">eventhouse</text>
<text x="540" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">store</text>
<rect x="655" y="330" width="180" height="110" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="745" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">KQL database</text>
<text x="745" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">serve</text>
<!-- flow between items -->
<line x1="190" y1="355" x2="243" y2="370" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="425" y1="385" x2="448" y2="385" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="630" y1="385" x2="653" y2="385" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- amber inheritance connectors from domain to each item -->
<line x1="335" y1="230" x2="335" y2="328" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="540" y1="230" x2="540" y2="328" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="745" y1="230" x2="745" y2="328" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<text x="540" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#8A6D10" text-anchor="middle">organizational position + default sensitivity context inherited</text>

<!-- reconciliation/audit job (teal) -->
<rect x="900" y="290" width="320" height="180" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="1060" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">Reconciliation + audit job</text>
<text x="1060" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">enumerates the real-time items;</text>
<text x="1060" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">confirms each carries the domain</text>
<text x="1060" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">its workspace claims</text>
<line x1="860" y1="385" x2="898" y2="385" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- red DRIFT-PROVENANCE marker on the eventhouse -->
<rect x="450" y="490" width="380" height="56" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="640" y="512" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">DRIFT-PROVENANCE</text>
<text x="640" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#7B241C" text-anchor="middle" dominant-baseline="central">one unassigned eventhouse failed the check</text>
<line x1="540" y1="440" x2="600" y2="488" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar-red)"/>

<!-- navy note -->
<rect x="220" y="590" width="640" height="56" rx="8" fill="#1E3A66"/>
<text x="540" y="618" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Data-in-motion governed by the same key as data-at-rest</text>
</svg>
