<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
 <linearGradient id="skyGrad8" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#EAF1FB"/>
  <stop offset="45%" stop-color="#CFE0F2"/>
  <stop offset="82%" stop-color="#1E3A66"/>
  <stop offset="100%" stop-color="#0D1B2E"/>
 </linearGradient>
 <linearGradient id="plainGrad8" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#CFE0F2"/>
  <stop offset="100%" stop-color="#EAF1FB"/>
 </linearGradient>
 <linearGradient id="beamGrad8" gradientUnits="userSpaceOnUse" x1="206" y1="226" x2="1160" y2="560">
  <stop offset="0%" stop-color="#1E8C8C" stop-opacity="0.5"/>
  <stop offset="100%" stop-color="#1E8C8C" stop-opacity="0.07"/>
 </linearGradient>
 <radialGradient id="lanternGlow8" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0%" stop-color="#D7F2EE" stop-opacity="0.95"/>
  <stop offset="100%" stop-color="#D7F2EE" stop-opacity="0"/>
 </radialGradient>
</defs>
<!-- dusk sky deepening to a low navy band -->
<rect x="0" y="0" width="1280" height="488" fill="url(#skyGrad8)"/>
<!-- governed plain below -->
<rect x="0" y="488" width="1280" height="232" fill="url(#plainGrad8)"/>
<!-- headland -->
<path d="M 0 488 L 0 400 Q 60 372 130 366 L 250 366 Q 330 374 380 440 Q 400 470 410 488 Z" fill="#0D1B2E"/>
<!-- lantern glow -->
<circle cx="190" cy="218" r="62" fill="url(#lanternGlow8)"/>
<!-- lighthouse: tapered navy tower, ice gallery, navy roof -->
<path d="M 158 366 L 222 366 L 210 244 L 170 244 Z" fill="#0D1B2E"/>
<rect x="184" y="296" width="12" height="18" rx="2" fill="#EAF1FB"/>
<rect x="184" y="336" width="12" height="18" rx="2" fill="#EAF1FB"/>
<line x1="154" y1="244" x2="226" y2="244" stroke="#0D1B2E" stroke-width="4"/>
<rect x="160" y="212" width="60" height="30" rx="4" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2.5"/>
<circle cx="190" cy="227" r="8" fill="#1E8C8C"/>
<polygon points="158,212 222,212 190,184" fill="#0D1B2E"/>
<!-- faint earlier sweep -->
<polygon points="206,222 840,700 520,700" fill="#1E8C8C" opacity="0.07"/>
<!-- current beam, landing on the third site -->
<polygon points="206,216 1190,472 1190,700 206,236" fill="url(#beamGrad8)"/>
<!-- site one: quiet -->
<g opacity="0.85">
 <polygon points="522,566 598,566 560,540" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2.5"/>
 <rect x="528" y="566" width="64" height="42" rx="3" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2.5"/>
 <rect x="550" y="586" width="20" height="22" fill="#5A5A5A" opacity="0.5"/>
</g>
<!-- site two: quiet -->
<g opacity="0.85">
 <polygon points="762,556 838,556 800,530" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2.5"/>
 <rect x="768" y="556" width="64" height="42" rx="3" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2.5"/>
 <rect x="790" y="576" width="20" height="22" fill="#5A5A5A" opacity="0.5"/>
</g>
<!-- site three: caught in the beam, observed behavior contradicts its papers -->
<circle cx="1040" cy="560" r="58" fill="#C0392B" opacity="0.12"/>
<polygon points="1002,540 1078,540 1040,514" fill="#F7E2DE" stroke="#C0392B" stroke-width="3.5"/>
<rect x="1008" y="540" width="64" height="42" rx="3" fill="#F7E2DE" stroke="#C0392B" stroke-width="3.5"/>
<rect x="1030" y="560" width="20" height="22" fill="#C0392B" opacity="0.65"/>
<text x="1040" y="612" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#C0392B" text-anchor="middle">diaApproved: false</text>
</svg>
