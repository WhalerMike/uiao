<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>

<!-- Title -->
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">The host joins the system it describes</text>

<!-- Amber governance drift loop -->
<rect x="300" y="130" width="680" height="360" rx="180" fill="#FBEED2" stroke="#D4A017" stroke-width="3"/>
<text x="640" y="160" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#9A7610" text-anchor="middle" dominant-baseline="central">the same drift loop that watches the directory</text>

<!-- Directional flow arrows along the loop (clockwise, inside the ellipse) -->
<path d="M 545 235 A 150 95 0 0 1 760 235" fill="none" stroke="#D4A017" stroke-width="2.5" marker-end="url(#ar-amber)"/>
<path d="M 815 280 A 130 90 0 0 1 815 380" fill="none" stroke="#D4A017" stroke-width="2.5" marker-end="url(#ar-amber)"/>
<path d="M 760 470 A 150 90 0 0 1 545 470" fill="none" stroke="#D4A017" stroke-width="2.5" marker-end="url(#ar-amber)"/>
<path d="M 465 380 A 130 90 0 0 1 465 280" fill="none" stroke="#D4A017" stroke-width="2.5" marker-end="url(#ar-amber)"/>

<!-- Central server box: SUBSTRATE AUTHORITY -->
<rect x="500" y="245" width="280" height="130" rx="6" fill="#0D1B2E" stroke="#1E3A66" stroke-width="2"/>
<rect x="520" y="268" width="240" height="14" rx="2" fill="#1E3A66"/>
<rect x="520" y="290" width="240" height="14" rx="2" fill="#1E3A66"/>
<text x="640" y="335" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">SUBSTRATE</text>
<text x="640" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">AUTHORITY</text>

<!-- Waypoint: top -->
<rect x="500" y="183" width="280" height="34" rx="17" fill="#FFFFFF" stroke="#D4A017" stroke-width="2"/>
<text x="640" y="201" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="middle" dominant-baseline="central">carries OrgPath</text>

<!-- Waypoint: right -->
<rect x="800" y="320" width="270" height="34" rx="17" fill="#FFFFFF" stroke="#D4A017" stroke-width="2"/>
<text x="935" y="338" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="middle" dominant-baseline="central">inside an Administrative Unit</text>

<!-- Waypoint: bottom -->
<rect x="468" y="403" width="344" height="34" rx="17" fill="#FFFFFF" stroke="#D4A017" stroke-width="2"/>
<text x="640" y="421" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="middle" dominant-baseline="central">compliance evaluated on cadence</text>

<!-- Waypoint: left -->
<rect x="210" y="320" width="270" height="34" rx="17" fill="#FFFFFF" stroke="#D4A017" stroke-width="2"/>
<text x="345" y="338" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="middle" dominant-baseline="central">drift reported to the engine</text>

<!-- Caption: narrative ends / runbook begins -->
<text x="640" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">narrative ends &#183; runbook begins</text>

<!-- Two teal hand-off cards pointing rightward -->
<rect x="240" y="575" width="430" height="100" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
<rect x="240" y="575" width="10" height="100" rx="0" fill="#1E8C8C"/>
<text x="275" y="612" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1E8C8C" text-anchor="start" dominant-baseline="central">Build runbook</text>
<text x="275" y="640" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#33414F" text-anchor="start" dominant-baseline="central">UIAO_SBG_001</text>
<line x1="640" y1="625" x2="700" y2="625" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<rect x="730" y="575" width="430" height="100" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
<rect x="730" y="575" width="10" height="100" rx="0" fill="#1E8C8C"/>
<text x="765" y="612" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1E8C8C" text-anchor="start" dominant-baseline="central">Decision of record</text>
<text x="765" y="640" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#33414F" text-anchor="start" dominant-baseline="central">ADR-041</text>
<line x1="1130" y1="625" x2="1190" y2="625" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
</svg>
