<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Runbook, CLI, and assessment cadence</text>

<!-- operations runbook -->
<rect x="60" y="270" width="240" height="120" rx="8" fill="#0D1B2E"/>
<text x="180" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">operations runbook</text>
<text x="180" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">every procedure executable</text>
<text x="180" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">without tribal knowledge</text>

<line x1="300" y1="330" x2="360" y2="330" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- CLI and Operations Guide -->
<rect x="362" y="225" width="240" height="210" rx="8" fill="#0D1B2E"/>
<text x="482" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">CLI and Operations Guide</text>

<!-- seven parts tiles -->
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5">
<rect x="630" y="160" width="250" height="36" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="755" y="178" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Part I  Git CLI</text>
<rect x="630" y="204" width="250" height="36" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="755" y="222" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Part II  Gitea REST API</text>
<rect x="630" y="248" width="250" height="36" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="755" y="266" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Part III  Active Directory</text>
<rect x="630" y="292" width="250" height="36" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="755" y="310" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Part IV  Entra ID</text>
<rect x="630" y="336" width="250" height="36" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="755" y="354" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Part V  Intune</text>
<rect x="630" y="380" width="250" height="36" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="755" y="398" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Part VI  Azure Arc</text>
<rect x="630" y="424" width="250" height="36" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="755" y="442" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Part VII  conventions</text>
</g>
<line x1="602" y1="310" x2="628" y2="200" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="602" y1="320" x2="628" y2="310" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="602" y1="330" x2="628" y2="420" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>

<!-- assessment cadence loop (amber) -->
<text x="1075" y="160" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#D4A017" text-anchor="middle">assessment cadence</text>
<rect x="940" y="180" width="270" height="46" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/><text x="1075" y="203" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">monthly full assessment</text>
<rect x="940" y="240" width="270" height="46" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/><text x="1075" y="263" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">weekly delta assessment</text>
<rect x="940" y="300" width="270" height="46" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/><text x="1075" y="323" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">daily drift detection</text>
<line x1="1075" y1="226" x2="1075" y2="238" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="1075" y1="286" x2="1075" y2="298" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<!-- loop back -->
<path d="M 1210 323 C 1245 323 1245 203 1212 203" fill="none" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>

<!-- daily drift -> dashboard -->
<line x1="940" y1="323" x2="780" y2="500" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<rect x="500" y="500" width="320" height="90" rx="8" fill="#0D1B2E"/>
<text x="660" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Quarto governance dashboard</text>
<text x="660" y="560" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">daily compliance posture</text>

<!-- deviation marker (red) -->
<rect x="940" y="400" width="270" height="60" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="1075" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">deviation above threshold</text>
<text x="1075" y="445" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C0392B" text-anchor="middle" dominant-baseline="central">alerts on problems</text>
<line x1="1075" y1="346" x2="1075" y2="398" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>
</svg>
