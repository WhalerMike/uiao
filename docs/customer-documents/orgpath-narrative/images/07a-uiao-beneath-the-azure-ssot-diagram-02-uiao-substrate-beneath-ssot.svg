<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">UIAO as the identity substrate beneath the</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Azure SSOT stack</text>

<!-- TOP tier: Azure SSOT consumers (teal) -->
<rect x="60" y="130" width="1160" height="120" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="80" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.4" fill="#1E8C8C" text-anchor="start">AZURE SSOT CONSUMERS</text>
<rect x="90" y="172" width="262" height="64" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="221" y="204" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Power BI</text>
<rect x="372" y="172" width="262" height="64" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="503" y="204" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Microsoft Fabric</text>
<rect x="654" y="172" width="262" height="64" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="785" y="204" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OneLake</text>
<rect x="936" y="172" width="262" height="64" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="1067" y="204" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Microsoft Purview</text>

<!-- MIDDLE tier: UIAO identity substrate (navy) -->
<rect x="60" y="320" width="1160" height="120" rx="10" fill="#0D1B2E"/>
<text x="80" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.4" fill="#D7F2EE" text-anchor="start">UIAO IDENTITY SUBSTRATE</text>
<rect x="130" y="362" width="320" height="62" rx="8" fill="#1E3A66"/>
<text x="290" y="393" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree registry</text>
<rect x="480" y="362" width="320" height="62" rx="8" fill="#1E3A66"/>
<text x="640" y="393" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgPath attribute</text>
<rect x="830" y="362" width="320" height="62" rx="8" fill="#1E3A66"/>
<text x="990" y="393" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">governance pipeline</text>

<!-- BOTTOM tier: Cloud directory layer (slate-blue) -->
<rect x="60" y="510" width="1160" height="120" rx="10" fill="#6B7A8D"/>
<text x="80" y="536" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.4" fill="#FFFFFF" text-anchor="start">CLOUD DIRECTORY LAYER</text>
<rect x="130" y="552" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#33414F" stroke-width="1.4"/>
<text x="290" y="583" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Entra ID</text>
<rect x="480" y="552" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#33414F" stroke-width="1.4"/>
<text x="640" y="583" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure AD</text>
<rect x="830" y="552" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#33414F" stroke-width="1.4"/>
<text x="990" y="583" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">sync agents</text>

<!-- arrows UP from middle to each consumer (amber, labeled) -->
<line x1="221" y1="320" x2="221" y2="240" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<text x="221" y="295" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#8A6D10" text-anchor="middle">organizational position</text>
<line x1="503" y1="320" x2="503" y2="240" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<text x="503" y="295" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#8A6D10" text-anchor="middle">attribute lineage</text>
<line x1="785" y1="320" x2="785" y2="240" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<text x="785" y="295" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#8A6D10" text-anchor="middle">policy scope</text>
<line x1="1067" y1="320" x2="1067" y2="240" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<text x="1067" y="295" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#8A6D10" text-anchor="middle">audit context</text>

<!-- arrows UP from bottom into middle (identity primitives) -->
<line x1="290" y1="510" x2="290" y2="430" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="640" y1="510" x2="640" y2="430" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="990" y1="510" x2="990" y2="430" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="640" y="485" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#1E8C8C" text-anchor="middle" font-weight="bold">identity primitives</text>
</svg>
