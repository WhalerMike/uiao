<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">A hierarchical Active Directory tree versus a</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">flat Entra ID tenant</text><text x="60" y="180" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1E8C8C" text-anchor="start">ACTIVE DIRECTORY — POLICY INHERITS DOWN THE TREE</text><rect x="90" y="215" width="480" height="64" rx="7" fill="#0D1B2E"/><text x="330" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Domain  corp.local</text><line x1="124" y1="279" x2="124" y2="301" stroke="#5A5A5A" stroke-width="2.5" marker-end="url(#ar-grey)"/><rect x="124" y="307" width="440" height="64" rx="7" fill="#1E3A66"/><text x="344" y="339" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OU = Washington</text><line x1="158" y1="371" x2="158" y2="393" stroke="#5A5A5A" stroke-width="2.5" marker-end="url(#ar-grey)"/><rect x="158" y="399" width="400" height="64" rx="7" fill="#1E3A66"/><text x="358" y="431" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OU = Finance</text><line x1="192" y1="463" x2="192" y2="485" stroke="#5A5A5A" stroke-width="2.5" marker-end="url(#ar-grey)"/><rect x="192" y="491" width="360" height="64" rx="7" fill="#D7F2EE"/><text x="372" y="523" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">User — inherits policy automatically</text><text x="700" y="180" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#C0392B" text-anchor="start">ENTRA ID — ONE FLAT LEVEL, NO INHERITANCE</text><rect x="700" y="210" width="520" height="300" rx="10" fill="#FBFAF7" stroke="#0D1B2E" stroke-width="2"/><rect x="722" y="232" width="112" height="64" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/><text x="778" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">user</text><rect x="847" y="232" width="112" height="64" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/><text x="903" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">user</text><rect x="972" y="232" width="112" height="64" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/><text x="1028" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">group</text><rect x="1097" y="232" width="112" height="64" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/><text x="1153" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">device</text><rect x="722" y="318" width="112" height="64" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/><text x="778" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">user</text><rect x="847" y="318" width="112" height="64" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/><text x="903" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bol