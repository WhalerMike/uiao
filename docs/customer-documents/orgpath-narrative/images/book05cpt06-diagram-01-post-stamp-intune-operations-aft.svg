<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">Post-stamp Intune operations</text>

<!-- Trigger box -->
<rect x="60" y="200" width="220" height="120" rx="8" fill="#0D1B2E"/>
<text x="170" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ETL pipeline stamps</text>
<text x="170" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">new OrgPath</text>
<text x="170" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">only when the value</text>
<text x="170" y="306" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">changed</text>

<!-- step boxes -->
<rect x="320" y="210" width="200" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="420" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle">1</text>
<text x="420" y="264" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#0D1B2E" text-anchor="middle">Resolve managed device</text>
<text x="420" y="282" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">filter on</text>
<text x="420" y="298" font-family="Consolas, monospace" font-size="10.5" fill="#33414F" text-anchor="middle">azureADDeviceId</text>

<rect x="560" y="210" width="200" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="660" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle">2</text>
<text x="660" y="266" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">POST syncDevice</text>
<text x="660" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">immediate policy sync</text>

<rect x="800" y="210" width="200" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="900" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle">3</text>
<text x="900" y="264" font-family="Consolas, monospace" font-size="10.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">PATCH category</text>
<text x="900" y="282" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">deviceCategory-</text>
<text x="900" y="298" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">DisplayName, node-type map</text>

<rect x="1040" y="210" width="200" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1140" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle">4</text>
<text x="1140" y="266" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#0D1B2E" text-anchor="middle">Append a</text>
<text x="1140" y="284" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#0D1B2E" text-anchor="middle">JSONL audit entry</text>

<!-- chain arrows -->
<line x1="280" y1="260" x2="318" y2="260" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="520" y1="260" x2="558" y2="260" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="760" y1="260" x2="798" y2="260" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="1000" y1="260" x2="1038" y2="260" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- amber side notes on steps 2 and 3 -->
<rect x="565" y="120" width="190" height="44" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="660" y="138" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">non-fatal</text>
<text x="660" y="154" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle" dominant-baseline="central">continue on failure</text>
<line x1="660" y1="164" x2="660" y2="208" stroke="#D4A017" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="805" y="120" width="190" height="44" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="900" y="138" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">non-fatal</text>
<text x="900" y="154" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle" dominant-baseline="central">continue on failure</text>
<line x1="900" y1="164" x2="900" y2="208" stroke="#D4A017" stroke-width="1.4" stroke-dasharray="4 3"/>

<!-- red branch off step 1 -->
<rect x="320" y="420" width="320" height="74" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="480" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle">device not enrolled in Intune</text>
<text x="480" y="470" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">write skip audit entry and return</text>
<path d="M420,310 L420,390 L420,418" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar-red)"/>

<!-- audit cylinder -->
<g>
 <ellipse cx="1140" cy="430" rx="100" ry="22" fill="#0D1B2E"/>
 <rect x="1040" y="430" width="200" height="100" fill="#0D1B2E"/>
 <ellipse cx="1140" cy="530" rx="100" ry="22" fill="#0D1B2E"/>
 <ellipse cx="1140" cy="430" rx="100" ry="22" fill="none" stroke="#1E3A66" stroke-width="1"/>
</g>
<text x="1140" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">governance audit trail</text>
<text x="1140" y="492" font-family="Consolas, monospace" font-size="10.5" fill="#C7D4E6" text-anchor="middle">intune-post-stamp.jsonl</text>
<text x="1140" y="510" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">committed to Git</text>
<path d="M1140,310 L1140,406" fill="none" stroke="#0D1B2E" stroke-width="2.2" marker-end="url(#ar-navy)"/>
</svg>
