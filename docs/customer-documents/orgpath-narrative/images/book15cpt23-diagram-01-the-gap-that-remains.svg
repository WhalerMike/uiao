<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">The gap that remains and the path that closes it</text>

<!-- CURRENT CAPABILITY column -->
<rect x="60" y="130" width="280" height="510" rx="10" fill="#0D1B2E"/>
<text x="200" y="160" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">CURRENT CAPABILITY</text>
<text x="200" y="184" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">shipped, governed corpus</text>
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5">
<rect x="80" y="210" width="240" height="40" rx="5" fill="#1E3A66"/><text x="200" y="230" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">23 governed documents</text>
<rect x="80" y="262" width="240" height="40" rx="5" fill="#1E3A66"/><text x="200" y="282" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">16 of 20 NIST families</text>
<rect x="80" y="314" width="240" height="40" rx="5" fill="#1E3A66"/><text x="200" y="334" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">187 of 323 controls</text>
<rect x="80" y="366" width="240" height="40" rx="5" fill="#1E3A66"/><text x="200" y="386" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">render-validate pipeline</text>
<rect x="80" y="418" width="240" height="40" rx="5" fill="#1E3A66"/><text x="200" y="438" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">canon supremacy gate</text>
<rect x="80" y="470" width="240" height="40" rx="5" fill="#1E3A66"/><text x="200" y="490" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">52-week roadmap</text>
</g>

<!-- THE GAP band (amber) -->
<rect x="400" y="130" width="480" height="510" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="640" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">THE GAP THAT REMAINS</text>
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12">
<rect x="425" y="185" width="430" height="64" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.3"/>
<text x="640" y="208" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">four unmapped NIST 800-53</text>
<text x="640" y="228" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">control families</text>
<rect x="425" y="263" width="430" height="48" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.3"/>
<text x="640" y="287" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">87 controls awaiting documents</text>
<rect x="425" y="325" width="430" height="100" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.3"/>
<text x="640" y="348" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">three planned modules</text>
<text x="640" y="370" fill="#33414F" text-anchor="middle" dominant-baseline="central">UIAOIdentityAssessment</text>
<text x="640" y="388" fill="#33414F" text-anchor="middle" dominant-baseline="central">UIAOImportAdapters</text>
<text x="640" y="406" fill="#33414F" text-anchor="middle" dominant-baseline="central">UIAOPlanGenerators</text>
<rect x="425" y="439" width="430" height="64" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.3"/>
<text x="640" y="462" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">partially implemented OrgPath</text>
<text x="640" y="482" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">drift detection engine</text>
</g>
<!-- red marker on band -->
<rect x="425" y="525" width="430" height="48" rx="6" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.4"/>
<text x="640" y="549" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="central">named in the governance record — documented, not hidden</text>

<!-- TARGET STATE column -->
<rect x="940" y="130" width="280" height="510" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="1080" y="160" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">TARGET STATE</text>
<g font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5">
<rect x="960" y="210" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="1080" y="240" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">full compliance</text>
<text x="1080" y="262" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">mapping</text>
<rect x="960" y="318" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="1080" y="348" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">fully implemented</text>
<text x="1080" y="370" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">modules</text>
</g>

<!-- planned-work bridge arrows -->
<line x1="340" y1="240" x2="423" y2="217" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="857" y1="287" x2="958" y2="250" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="857" y1="375" x2="958" y2="358" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<text x="900" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#D4A017" text-anchor="middle">planned work</text>
</svg>
