<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Cross-product correlation on the OrgPath join key</text>

<!-- Top row: four product boxes -->
<rect x="60" y="140" width="265" height="95" rx="8" fill="#0D1B2E"/>
<text x="192" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Defender for Endpoint</text>
<text x="192" y="200" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">device signals</text>

<rect x="350" y="140" width="265" height="95" rx="8" fill="#1E3A66"/>
<text x="482" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Defender for Identity</text>
<text x="482" y="200" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">identity signals</text>

<rect x="640" y="140" width="265" height="95" rx="8" fill="#2E75B6"/>
<text x="772" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Defender for Cloud Apps</text>
<text x="772" y="200" font-family="Arial, sans-serif" font-size="11.5" fill="#E4EEF8" text-anchor="middle" dominant-baseline="central">SaaS signals</text>

<rect x="930" y="140" width="265" height="95" rx="8" fill="#1E8C8C"/>
<text x="1062" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Defender for Cloud</text>
<text x="1062" y="200" font-family="Arial, sans-serif" font-size="11.5" fill="#E0F2EF" text-anchor="middle" dominant-baseline="central">cloud workload signals</text>

<!-- arrows down to Sentinel -->
<line x1="192" y1="235" x2="192" y2="320" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="482" y1="235" x2="482" y2="320" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="772" y1="235" x2="772" y2="320" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="1062" y1="235" x2="1062" y2="320" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<text x="630" y="282" font-family="Arial, sans-serif" font-size="11.5" fill="#5A5A5A" text-anchor="middle">alert / event streams</text>

<!-- Sentinel correlation layer -->
<rect x="60" y="325" width="1135" height="95" rx="8" fill="#0D1B2E"/>
<text x="627" y="358" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Microsoft Sentinel correlation layer</text>
<text x="627" y="390" font-family="Consolas, monospace" font-size="14" fill="#7FD9D9" text-anchor="middle" dominant-baseline="central">Join key: OrgPath</text>

<line x1="627" y1="420" x2="627" y2="465" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Organizationally-grouped incident view -->
<rect x="340" y="470" width="575" height="200" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="627" y="500" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Organizationally-grouped incident view</text>

<!-- example incident card -->
<rect x="375" y="520" width="505" height="130" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.2"/>
<text x="395" y="548" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6B7A8D" text-anchor="start">Example incident card</text>
<text x="395" y="578" font-family="Consolas, monospace" font-size="13.5" fill="#33414F" text-anchor="start">OrgPath: /Finance/Washington</text>
<text x="395" y="606" font-family="Consolas, monospace" font-size="13.5" fill="#33414F" text-anchor="start">Cross-product signals: [device, identity, app]</text>
<text x="395" y="634" font-family="Consolas, monospace" font-size="13.5" fill="#C0392B" text-anchor="start">Risk: High</text>
</svg>
