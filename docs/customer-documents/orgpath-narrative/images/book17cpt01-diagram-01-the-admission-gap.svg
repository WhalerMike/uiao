<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">The admission gap — a device is routable</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">before any cloud governance evaluates</text>

<!-- amber callout pointing back to address step -->
<rect x="120" y="150" width="300" height="62" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="270" y="174" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">AD-era NPS decided this at the</text>
<text x="270" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">switchport, before address</text>
<line x1="270" y1="212" x2="270" y2="278" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>

<!-- DEVICE -->
<rect x="60" y="290" width="150" height="80" rx="8" fill="#0D1B2E"/>
<text x="135" y="330" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">DEVICE</text>

<!-- arrow device -> DHCP -->
<line x1="210" y1="330" x2="268" y2="330" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>

<!-- DHCP lease box -->
<rect x="270" y="290" width="230" height="80" rx="8" fill="#0D1B2E"/>
<text x="385" y="322" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">DHCP lease obtained</text>
<text x="385" y="344" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">device routable on VLAN</text>

<!-- dashed gridline separating pre/post address -->
<line x1="520" y1="150" x2="520" y2="560" stroke="#6B7A8D" stroke-width="1.4" stroke-dasharray="6 5"/>

<!-- Intune compliance -->
<rect x="640" y="290" width="240" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="760" y="330" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Intune compliance eval</text>

<!-- arrow Intune -> CA -->
<line x1="880" y1="330" x2="958" y2="330" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- Conditional Access -->
<rect x="960" y="290" width="240" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1080" y="330" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Conditional Access sign-in</text>

<!-- arrow DHCP -> Intune (teal, later in sequence) -->
<line x1="500" y1="330" x2="638" y2="330" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- red admission-gap band spanning the interval between address box and first teal box -->
<rect x="490" y="420" width="160" height="64" rx="6" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="570" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">the admission gap</text>
<text x="570" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C0392B" text-anchor="middle" dominant-baseline="central">device already on network</text>

<!-- connectors from gap band up to the timeline endpoints -->
<line x1="500" y1="420" x2="430" y2="380" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="4 4"/>
<line x1="640" y1="420" x2="700" y2="380" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="4 4"/>

<!-- time axis -->
<line x1="60" y1="560" x2="1200" y2="560" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-grey)"/>
<text x="1210" y="560" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-style="italic" fill="#5A5A5A" text-anchor="start" dominant-baseline="central">t</text>
<text x="60" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="start">pre-address region</text>
<text x="640" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="start">post-address region — cloud governance runs here, too late</text>
</svg>
