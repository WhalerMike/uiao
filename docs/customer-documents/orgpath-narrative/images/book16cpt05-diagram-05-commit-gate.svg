<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>

<!-- Title -->
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">The gate at the door: every rule enforced at the commit</text>

<!-- Identity feed (amber) — top -->
<rect x="430" y="120" width="560" height="58" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
<text x="710" y="143" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Entra group claims &#8594; Gitea teams (steward / write / read)</text>
<text x="710" y="164" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-style="italic" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">HR mover event &#8594; permission change in minutes</text>
<!-- amber drop into BRANCH-AUTHORITY bar -->
<line x1="610" y1="178" x2="610" y2="248" stroke="#D4A017" stroke-width="2.5" marker-end="url(#ar-amber)"/>

<!-- Workstation (left) -->
<rect x="60" y="340" width="200" height="120" rx="6" fill="#0D1B2E"/>
<text x="160" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">WORKSTATION</text>
<text x="160" y="416" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">developer commit</text>

<!-- git push arrow into the gate -->
<line x1="260" y1="400" x2="394" y2="400" stroke="#5A5A5A" stroke-width="2.5" marker-end="url(#ar-teal)"/>
<text x="327" y="386" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#33414F" text-anchor="middle" dominant-baseline="central">git push</text>

<!-- The gate: five stacked check bars -->
<rect x="400" y="240" width="420" height="320" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2.5"/>
<text x="610" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">SERVER-SIDE GATE &#183; pre-receive hook</text>

<!-- Bar 1 (BRANCH-AUTHORITY) - receives amber feed -->
<rect x="424" y="256" width="372" height="48" rx="4" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="610" y="280" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">BRANCH-AUTHORITY</text>
<!-- Bar 2 -->
<rect x="424" y="314" width="372" height="48" rx="4" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="610" y="338" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">FRONTMATTER-SCHEMA</text>
<!-- Bar 3 -->
<rect x="424" y="372" width="372" height="48" rx="4" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="610" y="396" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">FILENAME-CONVENTION</text>
<!-- Bar 4 -->
<rect x="424" y="430" width="372" height="48" rx="4" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="610" y="454" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NO-DISALLOWED-MARKINGS</text>
<!-- Bar 5 -->
<rect x="424" y="488" width="372" height="48" rx="4" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="610" y="512" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">SIGNED-SCRIPTS</text>

<!-- Accepted path: passes through all five into CANON (teal) -->
<line x1="820" y1="400" x2="954" y2="400" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<text x="887" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">passes all five</text>

<!-- CANON box -->
<rect x="960" y="340" width="260" height="120" rx="6" fill="#0D1B2E"/>
<text x="1090" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">CANON</text>
<text x="1090" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">commit becomes binding</text>

<!-- Rejected path: bounced at first failed bar (red) -->
<path d="M424,280 C360,280 340,560 470,560" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#ar-red)"/>
<text x="372" y="612" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="start" dominant-baseline="central">Non-conforming commit:</text>
<text x="372" y="636" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#C0392B" text-anchor="start" dominant-baseline="central">rejected at the door</text>

<!-- Footnote -->
<text x="610" y="688" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">None of this is advisory. The rule is the gate; the coordinate is the condition a commit must satisfy to become real.</text>
</svg>
