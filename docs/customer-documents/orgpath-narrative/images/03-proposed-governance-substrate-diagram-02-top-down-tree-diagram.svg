<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Node group vs branch group from one OrgPath</text>

<!-- root node -->
<rect x="390" y="110" width="500" height="80" rx="8" fill="#0D1B2E"/>
<text x="640" y="138" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree node</text>
<text x="640" y="166" font-family="Consolas, monospace" font-size="16" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ops/field-svc/region-west</text>

<!-- two branches down -->
<line x1="640" y1="190" x2="300" y2="240" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="640" y1="190" x2="980" y2="240" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- left child: Node Group -->
<rect x="80" y="242" width="440" height="110" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="300" y="274" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Node Group</text>
<text x="300" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">rule:</text>
<text x="300" y="330" font-family="Consolas, monospace" font-size="14" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">OrgPath -eq ops/field-svc/region-west</text>

<!-- right child: Branch Group -->
<rect x="760" y="242" width="440" height="110" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="980" y="274" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Branch Group</text>
<text x="980" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">rule:</text>
<text x="980" y="330" font-family="Consolas, monospace" font-size="13" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">OrgPath -startsWith ops/field-svc/region-west</text>

<!-- arrows down to policy outcome -->
<line x1="300" y1="352" x2="300" y2="400" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="980" y1="352" x2="980" y2="400" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- left policy outcome -->
<rect x="80" y="402" width="440" height="130" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="300" y="434" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Policy applies only at this unit</text>
<line x1="110" y1="456" x2="490" y2="456" stroke="#E3E8EF" stroke-width="1.2"/>
<text x="300" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">equivalent to a GPO with</text>
<text x="300" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">block-inheritance</text>

<!-- right policy outcome -->
<rect x="760" y="402" width="440" height="130" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="980" y="434" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Policy flows down the subtree</text>
<line x1="790" y1="456" x2="1170" y2="456" stroke="#E3E8EF" stroke-width="1.2"/>
<text x="980" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">equivalent to a GPO with</text>
<text x="980" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">inheritance</text>

<!-- dashed callout from branch group's subtree outcome -->
<rect x="760" y="566" width="440" height="110" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
<text x="980" y="598" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Membership extends automatically</text>
<text x="980" y="622" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">no group edit required</text>
<text x="980" y="652" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">trigger: new child node added to OrgTree</text>
<path d="M 980 532 L 980 564" fill="none" stroke="#D4A017" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-amber)"/>
<defs><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker></defs>
</svg>
