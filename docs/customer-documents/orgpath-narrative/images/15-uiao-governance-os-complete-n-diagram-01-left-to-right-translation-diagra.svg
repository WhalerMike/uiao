<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">From AD structure to Entra flat plus OrgPath</text>
<text x="60" y="98" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">overlay</text>

<!-- LEFT cluster: Active Directory -->
<rect x="50" y="200" width="280" height="380" rx="10" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="1.4"/>
<text x="190" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6B7A8D" text-anchor="middle">Active Directory (structural hierarchy)</text>
<rect x="70" y="245" width="240" height="60" rx="8" fill="#5A5A5A"/>
<text x="190" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OU container path</text>
<rect x="70" y="320" width="240" height="60" rx="8" fill="#5A5A5A"/>
<text x="190" y="350" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">GPO linked to OU</text>
<rect x="70" y="395" width="240" height="60" rx="8" fill="#5A5A5A"/>
<text x="190" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OU-based delegation</text>
<rect x="70" y="470" width="240" height="60" rx="8" fill="#5A5A5A"/>
<text x="190" y="500" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Nested group inheritance</text>

<!-- RIGHT cluster: Entra ID + OrgPath -->
<rect x="780" y="200" width="290" height="460" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="925" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Entra ID (flat) + OrgPath overlay</text>
<rect x="800" y="240" width="250" height="56" rx="8" fill="#0D1B2E"/>
<text x="925" y="262" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OrgPath</text>
<text x="925" y="280" font-family="Arial, sans-serif" font-size="10" fill="#C7D4E6" text-anchor="middle">schema attribute on user + device</text>
<rect x="800" y="312" width="250" height="48" rx="8" fill="#0D1B2E"/>
<text x="925" y="330" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Branch group</text>
<text x="925" y="347" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">OrgPath -startsWith</text>
<rect x="800" y="376" width="250" height="48" rx="8" fill="#0D1B2E"/>
<text x="925" y="394" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Node group</text>
<text x="925" y="411" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">OrgPath -eq</text>
<rect x="800" y="440" width="250" height="48" rx="8" fill="#0D1B2E"/>
<text x="925" y="458" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Administrative Unit</text>
<text x="925" y="475" font-family="Arial, sans-serif" font-size="10" fill="#C7D4E6" text-anchor="middle">same membership rule</text>
<rect x="800" y="504" width="250" height="48" rx="8" fill="#0D1B2E"/>
<text x="925" y="522" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Intune / Conditional Access</text>
<text x="925" y="539" font-family="Arial, sans-serif" font-size="10" fill="#C7D4E6" text-anchor="middle">assigned to groups</text>

<!-- translation arrows between clusters -->
<line x1="310" y1="275" x2="798" y2="266" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<text x="555" y="248" font-family="Arial, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">path becomes attribute value</text>
<line x1="310" y1="350" x2="798" y2="520" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<text x="555" y="430" font-family="Arial, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">replaced by group-scoped policy</text>
<line x1="310" y1="425" x2="798" y2="460" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<text x="540" y="455" font-family="Arial, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">becomes</text>
<line x1="310" y1="500" x2="798" y2="336" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<text x="540" y="500" font-family="Arial, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">becomes layered dynamic groups</text>

<!-- internal fan: OrgPath -> Branch + Node -> Intune/CA -->
<line x1="925" y1="296" x2="925" y2="310" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="925" y1="360" x2="925" y2="374" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="925" y1="488" x2="925" y2="502" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>

<!-- governance box top-right -->
<rect x="800" y="120" width="290" height="60" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="945" y="143" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">UIAO OrgTree Registry</text>
<text x="945" y="163" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">governs the meaning</text>
<line x1="870" y1="180" x2="900" y2="238" stroke="#D4A017" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar-amber)"/>
<text x="710" y="212" font-family="Arial, sans-serif" font-size="11" fill="#D4A017" text-anchor="middle">validates, normalizes,</text>
<text x="710" y="228" font-family="Arial, sans-serif" font-size="11" fill="#D4A017" text-anchor="middle">drift-detects</text>
</svg>
