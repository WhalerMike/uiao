<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Azure Arc as the hybrid control plane</text>

<!-- On-prem boundary (dashed Commercial-Cloud-exception) -->
<rect x="55" y="200" width="300" height="240" rx="10" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="205" y="222" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">Commercial-Cloud-exception</text>
<rect x="80" y="250" width="250" height="120" rx="8" fill="#0D1B2E"/>
<text x="205" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">on-prem-servers</text>
<text x="205" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">AD-managed</text>
<text x="205" y="328" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">srv-dc01  srv-app02</text>
<text x="205" y="348" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">srv-file03  srv-sql04</text>
<text x="205" y="418" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C0392B" text-anchor="middle" dominant-baseline="central">GCC-Moderate-boundary-not-yet</text>
<text x="205" y="432" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C0392B" text-anchor="middle" dominant-baseline="central">-available-for-Arc</text>

<!-- enrollment arrow -->
<line x1="355" y1="310" x2="455" y2="310" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<text x="405" y="296" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">arc-agent</text>
<text x="405" y="282" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">-enrollment</text>

<!-- ARM control plane -->
<rect x="458" y="240" width="220" height="150" rx="8" fill="#1E8C8C"/>
<text x="568" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Azure-Resource-</text>
<text x="568" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Manager-</text>
<text x="568" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">control-plane</text>

<!-- five governance lanes -->
<rect x="780" y="150" width="430" height="44" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="995" y="172" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">inventory-and-agent-health</text>
<rect x="780" y="204" width="430" height="44" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="995" y="226" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">security</text>
<rect x="780" y="258" width="430" height="44" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="995" y="280" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">compliance</text>
<rect x="780" y="312" width="430" height="44" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="995" y="334" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">monitoring</text>
<rect x="780" y="366" width="430" height="44" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="995" y="388" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">tagging-and-orgpath-enforcement</text>

<!-- fan from ARM to lanes -->
<line x1="678" y1="290" x2="778" y2="172" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="678" y1="300" x2="778" y2="226" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="678" y1="315" x2="778" y2="280" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="678" y1="330" x2="778" y2="334" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="678" y1="345" x2="778" y2="388" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>

<!-- OrgPath tags panel -->
<rect x="780" y="470" width="430" height="150" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="995" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath-tags</text>
<text x="995" y="528" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgPath</text>
<text x="995" y="552" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgNodeID</text>
<text x="995" y="576" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgTier</text>
<text x="995" y="600" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">MigrationPhase</text>

<!-- tags feed tagging lane -->
<line x1="995" y1="468" x2="995" y2="412" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<text x="1090" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">feeds tagging</text>
</svg>
