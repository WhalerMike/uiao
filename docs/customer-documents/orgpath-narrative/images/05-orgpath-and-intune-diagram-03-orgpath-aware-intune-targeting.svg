<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>
<text x="60" y="56" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">OrgPath-aware Intune targeting topology</text>

<!-- Tier labels -->
<text x="170" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D" text-anchor="middle">TIER 1 · SUBSTRATE</text>
<text x="450" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D" text-anchor="middle">TIER 2 · DYNAMIC GROUPS</text>
<text x="740" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D" text-anchor="middle">TIER 3 · ASSIGNMENT FILTERS</text>
<text x="1050" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D" text-anchor="middle">TIER 4 · POLICY SURFACES</text>

<!-- Tier 1 single box -->
<rect x="60" y="290" width="220" height="140" rx="8" fill="#0D1B2E"/>
<text x="170" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OrgPath attribute</text>
<text x="170" y="360" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle">on device object</text>
<text x="170" y="382" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">Entra extension schema</text>

<!-- Tier 2 cluster -->
<rect x="320" y="140" width="260" height="440" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/>
<rect x="338" y="160" width="224" height="92" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="450" y="196" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">ORG-NODE-{id}</text>
<text x="450" y="222" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">exact match</text>
<rect x="338" y="266" width="224" height="92" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="450" y="302" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">ORG-BRANCH-{id}</text>
<text x="450" y="328" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">prefix match</text>
<rect x="338" y="372" width="224" height="92" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="450" y="408" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">DEVICE-PLATFORM-{type}</text>
<text x="450" y="434" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">platform group</text>
<rect x="338" y="478" width="224" height="92" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="450" y="514" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">COMPLIANCE-STATE-{state}</text>
<text x="450" y="540" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">state group</text>

<line x1="280" y1="360" x2="318" y2="360" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Tier 3 cluster (amber overlays) -->
<rect x="620" y="200" width="240" height="320" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<rect x="638" y="222" width="204" height="80" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.4"/>
<text x="740" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OS-version filter</text>
<text x="740" y="278" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">refinement overlay</text>
<rect x="638" y="318" width="204" height="80" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.4"/>
<text x="740" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">device-make-model</text>
<text x="740" y="374" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">refinement overlay</text>
<rect x="638" y="414" width="204" height="80" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.4"/>
<text x="740" y="448" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">ownership-type filter</text>
<text x="740" y="470" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">refinement overlay</text>

<line x1="580" y1="360" x2="618" y2="360" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- Tier 4 cluster -->
<rect x="900" y="140" width="320" height="440" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<rect x="918" y="162" width="284" height="74" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="1060" y="203" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Configuration profiles</text>
<rect x="918" y="248" width="284" height="74" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="1060" y="289" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Compliance policies</text>
<rect x="918" y="334" width="284" height="74" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="1060" y="375" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Endpoint Security baselines</text>
<rect x="918" y="420" width="284" height="74" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="1060" y="461" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Update rings</text>
<rect x="918" y="506" width="284" height="60" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="1060" y="536" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">App assignments</text>

<line x1="860" y1="360" x2="898" y2="360" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
</svg>
