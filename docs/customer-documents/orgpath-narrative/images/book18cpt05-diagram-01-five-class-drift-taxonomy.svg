<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Book 18 Ch.5 — Five named classes of drift: typed, ranked, routed. ADR-093 blueprint register. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="c5-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="74" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">Five named classes of drift — typed, ranked, routed</text>

  <!-- engine -->
  <rect x="60" y="100" width="216" height="362" rx="12" fill="#0D1B2E"/>
  <text x="168" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#FFFFFF">Drift</text>
  <text x="168" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#FFFFFF">engine</text>
  <text x="168" y="226" text-anchor="middle" font-size="13" fill="#A9B8CA">detection is</text>
  <text x="168" y="246" text-anchor="middle" font-size="13" fill="#A9B8CA">always on</text>
  <line x1="168" y1="280" x2="168" y2="316" stroke="#1E8C8C" stroke-width="2"/>
  <text x="168" y="346" text-anchor="middle" font-size="13" fill="#A9B8CA">live state</text>
  <text x="168" y="366" text-anchor="middle" font-size="13" fill="#A9B8CA">vs canon,</text>
  <text x="168" y="386" text-anchor="middle" font-size="13" fill="#A9B8CA">per facet</text>
  <text x="168" y="428" text-anchor="middle" font-size="12" font-style="italic" fill="#D7F2EE">every divergence</text>
  <text x="168" y="446" text-anchor="middle" font-size="12" font-style="italic" fill="#D7F2EE">is typed</text>

  <line x1="276" y1="281" x2="300" y2="281" stroke="#1E8C8C" stroke-width="3" marker-end="url(#c5-teal)"/>

  <!-- five class rows -->
  <!-- Row 1: Format -->
  <rect x="300" y="100" width="912" height="66" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <rect x="314" y="109" width="48" height="48" rx="6" fill="#0D1B2E"/>
  <text x="338" y="141" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="378" y="130" font-size="18" font-weight="bold" fill="#0D1B2E">Format</text>
  <text x="378" y="153" font-size="13" fill="#5A5A5A">a typed facet fails its pattern — a US-format hire date where ISO is required</text>
  <rect x="1042" y="114" width="156" height="38" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="1120" y="139" text-anchor="middle" font-size="14" font-weight="bold" fill="#D4A017">HIGH · P1</text>

  <!-- Row 2: Value -->
  <rect x="300" y="174" width="912" height="66" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <rect x="314" y="183" width="48" height="48" rx="6" fill="#0D1B2E"/>
  <text x="338" y="215" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="378" y="204" font-size="18" font-weight="bold" fill="#0D1B2E">Value</text>
  <text x="378" y="227" font-size="13" fill="#5A5A5A">an enumerated facet carries a value not in its enumeration — a department that does not exist</text>
  <rect x="1042" y="188" width="156" height="38" rx="6" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="1.5"/>
  <text x="1120" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#6B7A8D">MEDIUM · P2</text>

  <!-- Row 3: Slot -->
  <rect x="300" y="248" width="912" height="66" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <rect x="314" y="257" width="48" height="48" rx="6" fill="#0D1B2E"/>
  <text x="338" y="289" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="378" y="278" font-size="18" font-weight="bold" fill="#0D1B2E">Slot</text>
  <text x="378" y="301" font-size="13" fill="#5A5A5A">codebook integrity — two facets share one slot, or a slot is rebound without a decision</text>
  <rect x="1042" y="262" width="156" height="38" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="1120" y="287" text-anchor="middle" font-size="14" font-weight="bold" fill="#D4A017">HIGH · P1</text>

  <!-- Row 4: Orphan -->
  <rect x="300" y="322" width="912" height="66" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <rect x="314" y="331" width="48" height="48" rx="6" fill="#0D1B2E"/>
  <text x="338" y="363" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="378" y="352" font-size="18" font-weight="bold" fill="#0D1B2E">Orphan</text>
  <text x="378" y="375" font-size="13" fill="#5A5A5A">an enumeration value with zero matching principals — a department nobody is in</text>
  <rect x="1042" y="336" width="156" height="38" rx="6" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.5"/>
  <text x="1120" y="361" text-anchor="middle" font-size="14" font-weight="bold" fill="#5A5A5A">LOW · P3</text>

  <!-- Row 5: Phantom -->
  <rect x="300" y="396" width="912" height="66" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <rect x="314" y="405" width="48" height="48" rx="6" fill="#0D1B2E"/>
  <text x="338" y="437" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="378" y="426" font-size="18" font-weight="bold" fill="#0D1B2E">Phantom</text>
  <text x="378" y="449" font-size="13" fill="#5A5A5A">a principal still carries a value the codebook has deprecated — reassign to its successor</text>
  <rect x="1042" y="410" width="156" height="38" rx="6" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.5"/>
  <text x="1120" y="435" text-anchor="middle" font-size="14" font-weight="bold" fill="#5A5A5A">LOW · P3</text>

  <!-- safe-to-run-continuously flow -->
  <rect x="60" y="494" width="1152" height="158" rx="12" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="84" y="528" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#0D1B2E">Safe to run continuously</text>
  <text x="84" y="552" font-size="13" fill="#5A5A5A">It shows its work before acting, and stops itself when the foundation is in doubt</text>

  <rect x="84" y="566" width="232" height="64" rx="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="200" y="595" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Detect</text>
  <text x="200" y="616" text-anchor="middle" font-size="12" fill="#33414F">always on</text>
  <line x1="316" y1="598" x2="346" y2="598" stroke="#1E8C8C" stroke-width="3" marker-end="url(#c5-teal)"/>

  <rect x="350" y="566" width="232" height="64" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="466" y="595" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Plan</text>
  <text x="466" y="616" text-anchor="middle" font-size="12" fill="#33414F">dry-run by default</text>
  <line x1="582" y1="598" x2="612" y2="598" stroke="#1E8C8C" stroke-width="3" marker-end="url(#c5-teal)"/>

  <rect x="616" y="566" width="232" height="64" rx="9" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="732" y="595" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Halt-on-critical</text>
  <text x="732" y="616" text-anchor="middle" font-size="12" fill="#33414F">stops on a Slot finding</text>
  <line x1="848" y1="598" x2="878" y2="598" stroke="#1E8C8C" stroke-width="3" marker-end="url(#c5-teal)"/>

  <rect x="882" y="566" width="300" height="64" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="1032" y="595" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Remediate</text>
  <text x="1032" y="616" text-anchor="middle" font-size="12" fill="#33414F">opt-in · self-halting</text>
</svg>
