<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath stamped identically across a server's</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">three surfaces, reconciled on divergence</text>

<!-- registry top -->
<rect x="490" y="120" width="300" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="640" y="144" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgTree registry derives</text>
<text x="640" y="168" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">ops/field-svc</text>

<!-- center server -->
<rect x="510" y="300" width="260" height="80" rx="8" fill="#0D1B2E"/>
<text x="640" y="330" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">One server</text>
<text x="640" y="356" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">one value, three carriers</text>

<!-- three surfaces -->
<rect x="60" y="240" width="320" height="100" rx="8" fill="#0D1B2E"/>
<text x="220" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">On-prem computer object</text>
<text x="220" y="292" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">extended attribute</text>
<text x="220" y="318" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ops/field-svc</text>

<rect x="900" y="240" width="320" height="100" rx="8" fill="#EAF1FB" stroke="#5B2D8E" stroke-width="1.8"/>
<text x="1060" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#5B2D8E" text-anchor="middle" dominant-baseline="central">Cloud device object</text>
<text x="1060" y="292" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">extended attribute</text>
<text x="1060" y="318" font-family="Consolas, monospace" font-size="14" fill="#5B2D8E" text-anchor="middle" dominant-baseline="central">ops/field-svc</text>

<rect x="480" y="430" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="640" y="458" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">Management-plane resource</text>
<text x="640" y="482" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">hybrid-management resource tag</text>
<text x="640" y="508" font-family="Consolas, monospace" font-size="14" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">ops/field-svc</text>

<!-- amber arrows from registry/server to surfaces -->
<line x1="540" y1="184" x2="260" y2="238" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<line x1="740" y1="184" x2="1020" y2="238" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<line x1="640" y1="380" x2="640" y2="428" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<line x1="640" y1="184" x2="640" y2="298" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>

<!-- drift probe + flag (right side) -->
<rect x="900" y="430" width="320" height="100" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="1060" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">Drift probe</text>
<text x="1060" y="480" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">reads all three surfaces; on mismatch</text>
<text x="1060" y="500" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">flags HIGH cross-surface inconsistency</text>
<text x="1060" y="520" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">re-applies authoritative value to all three</text>
<line x1="900" y1="320" x2="810" y2="430" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar-red)"/>

<!-- query box bottom -->
<rect x="180" y="600" width="920" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="640" y="630" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">query: all assets in ops/field-svc</text>
<text x="640" y="658" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="middle" dominant-baseline="central">returns users + devices + servers together</text>
<line x1="640" y1="530" x2="640" y2="598" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<defs><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker></defs>
</svg>
