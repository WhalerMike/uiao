<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath governance fans out to third-party DDI</text>
<text x="60" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E" text-anchor="start">while DNS migrates to Azure-native</text>

<!-- Registry + pipeline pair, top center -->
<rect x="430" y="100" width="200" height="58" rx="8" fill="#0D1B2E"/>
<text x="530" y="122" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree Registry</text>
<text x="530" y="142" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">DnsBoundary · NetworkCidr · MigrationPhase</text>
<line x1="630" y1="129" x2="666" y2="129" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<rect x="668" y="100" width="200" height="58" rx="8" fill="#0D1B2E"/>
<text x="768" y="122" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Governance pipeline</text>
<text x="768" y="142" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">orchestrator · per-platform adapters</text>

<!-- fan-down lines -->
<line x1="700" y1="158" x2="300" y2="210" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<line x1="836" y1="158" x2="1080" y2="210" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>

<!-- Left cluster: Third-party DDI -->
<rect x="50" y="212" width="730" height="170" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="70" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="start">Third-party DDI (unified hybrid management plane)</text>
<rect x="68" y="252" width="222" height="116" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="179" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Infoblox NIOS Grid</text>
<text x="179" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">Extensible Attributes</text>
<text x="179" y="334" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">WAPI · Basic auth</text>
<rect x="304" y="252" width="222" height="116" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="415" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Infoblox BloxOne DDI</text>
<text x="415" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">tags</text>
<text x="415" y="334" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">CSP API · Bearer token</text>
<rect x="540" y="252" width="222" height="116" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="651" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">BlueCat Address Manager</text>
<text x="651" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">User-Defined Fields</text>
<text x="651" y="334" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">REST v1 · session token</text>

<!-- Right cluster: Azure-native -->
<rect x="820" y="212" width="410" height="170" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="840" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">Azure-native (DNS target state)</text>
<rect x="855" y="258" width="340" height="104" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="1025" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure DNS Private Zones</text>
<text x="1025" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">+ Private Resolver</text>

<!-- State machine band -->
<rect x="50" y="430" width="1180" height="150" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="70" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">MigrationPhase state machine (DNS surface only, per zone)</text>
<rect x="70" y="478" width="250" height="62" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.5"/>
<text x="195" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Assessment</text>
<text x="195" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">DDI tagged, no Azure zone</text>
<rect x="368" y="478" width="250" height="62" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.5"/>
<text x="493" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Migration</text>
<text x="493" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">Azure zone created, idle</text>
<rect x="666" y="478" width="250" height="62" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.5"/>
<text x="791" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Parallel</text>
<text x="791" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">both serving live traffic</text>
<rect x="964" y="478" width="250" height="62" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1089" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Complete</text>
<text x="1089" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">Azure sole DNS authority</text>
<line x1="320" y1="509" x2="366" y2="509" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<line x1="618" y1="509" x2="664" y2="509" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<line x1="916" y1="509" x2="962" y2="509" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<text x="640" y="562" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#33414F" text-anchor="middle" dominant-baseline="central">DHCP and IPAM: no migration, Infoblox permanent (Ch 6 and 7)</text>

<!-- dashed webhook arrow from Parallel up to Azure Private Zones -->
<path d="M 791 478 C 791 420, 1025 420, 1025 364" fill="none" stroke="#1E8C8C" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ar-teal)"/>
<rect x="700" y="398" width="360" height="26" rx="5" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1"/>
<text x="880" y="411" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">webhook on record change (NIOS Outbound API / BAM events)</text>
</svg>
