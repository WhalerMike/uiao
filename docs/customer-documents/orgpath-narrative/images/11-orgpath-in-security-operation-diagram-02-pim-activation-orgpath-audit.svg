<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">PIM activation flow with OrgPath as a</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">first-class audit dimension</text>

<!-- Left column: 5 stages. Right column: detail insets -->
<!-- Stage 1 Request -->
<rect x="80" y="130" width="520" height="74" rx="8" fill="#0D1B2E"/>
<text x="100" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">1 · Request</text>
<text x="100" y="184" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6" text-anchor="start">alice@corp.com (/Engineering/Platform) → role Application Administrator</text>
<text x="615" y="167" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="start">submit request</text>
<line x1="340" y1="204" x2="340" y2="232" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Stage 2 Approval routing (teal - OrgPath scoped) -->
<rect x="80" y="234" width="520" height="74" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="100" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="start">2 · Approval routing — scoped by OrgPath</text>
<text x="100" y="288" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="start">approvers = managers in same/parent OrgPath (/Engineering)</text>
<text x="615" y="271" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="start">decision</text>
<line x1="340" y1="308" x2="340" y2="336" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Stage 3 Activation -->
<rect x="80" y="338" width="520" height="74" rx="8" fill="#0D1B2E"/>
<text x="100" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">3 · Activation</text>
<text x="100" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="start">role activated, JIT-bound · activation event written to audit log</text>
<text x="615" y="375" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="start">emit event</text>
<line x1="340" y1="412" x2="340" y2="440" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Stage 4 Audit record payload (amber overlay) -->
<rect x="80" y="442" width="520" height="74" rx="8" fill="#0D1B2E"/>
<text x="100" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">4 · Audit record payload</text>
<text x="100" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="start">structured JSON event written with OrgPath embedded</text>
<text x="615" y="479" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="start">stream to workspace</text>
<line x1="340" y1="516" x2="340" y2="544" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Stage 5 Sentinel ingestion -->
<rect x="80" y="546" width="520" height="74" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="100" y="574" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="start">5 · Sentinel ingestion</text>
<text x="100" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start">audit event flows into Sentinel · OrgPath becomes a queryable dimension</text>

<!-- Right inset: JSON payload (amber) tied to stage 4 -->
<rect x="700" y="130" width="520" height="290" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="720" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">Audit record payload  (stage 4)</text>
<text x="730" y="190" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">{</text>
<text x="746" y="214" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">"user": "alice@corp.com",</text>
<text x="746" y="238" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">"role": "Application Administrator",</text>
<text x="746" y="262" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#C0392B" text-anchor="start">"OrgPath": "/Engineering/Platform",</text>
<text x="746" y="286" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">"requested_at": "2026-06-04T14:22Z",</text>
<text x="746" y="310" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">"approved_by": "bob@corp.com",</text>
<text x="746" y="334" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#C0392B" text-anchor="start">"approver_OrgPath": "/Engineering",</text>
<text x="746" y="358" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">"justification": "release deploy"</text>
<text x="730" y="382" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">}</text>

<!-- connector from stage 4 to JSON inset -->
<line x1="600" y1="479" x2="700" y2="400" stroke="#D4A017" stroke-width="2.2" stroke-dasharray="6 4"/>

<!-- Right inset: KQL snippet tied to stage 5 -->
<rect x="700" y="500" width="520" height="120" rx="8" fill="#0D1B2E"/>
<text x="720" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="start">KQL — OrgPath as a queryable dimension</text>
<text x="730" y="562" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#D7F2EE" text-anchor="start">AuditLogs</text>
<text x="730" y="588" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#D7F2EE" text-anchor="start">| summarize count() by OrgPath, role</text>
<line x1="600" y1="583" x2="700" y2="560" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
</svg>
