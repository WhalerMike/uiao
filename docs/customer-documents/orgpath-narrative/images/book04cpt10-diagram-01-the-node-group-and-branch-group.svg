<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E">The node group and branch group pair for</text><text x="60" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E">every OrgTree node, and how they target policy</text>

<!-- Center OrgTree fragment -->
<rect x="540" y="200" width="200" height="60" rx="8" fill="#0D1B2E"/><text x="640" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Sales</text><text x="640" y="245" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">NCR / Sales</text>
<rect x="500" y="320" width="130" height="48" rx="8" fill="#1E3A66"/><text x="565" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Sales / Service</text><text x="565" y="358" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Division=Service|</text>
<rect x="650" y="320" width="130" height="48" rx="8" fill="#1E3A66"/><text x="715" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Sales / Data</text><text x="715" y="358" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Division=Data|</text>
<line x1="640" y1="260" x2="565" y2="318" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="640" y1="260" x2="715" y2="318" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- left group card: NODE -->
<rect x="50" y="180" width="380" height="170" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/><text x="70" y="208" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0D1B2E">ORG-NODE-SALES</text><text x="70" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F">membership rule:</text><rect x="70" y="244" width="340" height="40" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.2"/><text x="240" y="258" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">extensionAttribute15 -eq</text><text x="240" y="274" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">"Region=NCR|Department=Sales|"</text><text x="70" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1E8C8C">exact level only</text><text x="70" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D">highlights just the Sales department node</text>
<line x1="540" y1="222" x2="432" y2="250" stroke="#1E8C8C" stroke-width="2.2" marker-start="url(#ar-teal)"/>

<!-- right group card: BRANCH -->
<rect x="850" y="180" width="380" height="170" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/><text x="870" y="208" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0D1B2E">ORG-BRANCH-SALES</text><text x="870" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F">membership rule:</text><rect x="870" y="244" width="340" height="56" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.2"/><text x="1040" y="264" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle">extensionAttribute15 -startsWith</text><text x="1040" y="282" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle">"Region=NCR|Department=Sales|"</text><text x="870" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1E8C8C">node + every descendant</text><text x="870" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D">highlights Sales and every division beneath it</text>
<line x1="740" y1="222" x2="848" y2="250" stroke="#1E8C8C" stroke-width="2.2" marker-start="url(#ar-teal)"/>

<!-- policy-surface band -->
<rect x="240" y="460" width="800" height="100" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/><text x="640" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Policy surface</text><text x="640" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle">Intune &#183; Conditional Access &#183; Azure Policy &#183; Entitlement Management</text><text x="640" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#6B7A8D" text-anchor="middle">targets group membership, not attributes</text>

<line x1="240" y1="350" x2="440" y2="458" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<line x1="1040" y1="350" x2="840" y2="458" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>

<text x="640" y="610" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="middle">groups recorded in <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#33414F">registry/group-registry.yaml</tspan></text>
</svg>
