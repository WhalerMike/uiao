<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">Shared hierarchical substrate versus a flat</text>
<text x="60" y="98" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">directory with disconnected tools</text>

<!-- divider -->
<line x1="640" y1="130" x2="640" y2="690" stroke="#E3E8EF" stroke-width="2"/>

<!-- LEFT PANEL: AD-OU-SUBSTRATE -->
<text x="320" y="150" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">AD-OU-SUBSTRATE</text>
<!-- tree -->
<rect x="270" y="172" width="100" height="38" rx="8" fill="#0D1B2E"/>
<text x="320" y="191" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Root OU</text>
<line x1="320" y1="210" x2="200" y2="248" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="320" y1="210" x2="440" y2="248" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<text x="222" y="232" font-family="Consolas, monospace" font-size="10" fill="#1E8C8C" text-anchor="middle">group-policy</text>
<text x="425" y="232" font-family="Consolas, monospace" font-size="10" fill="#1E8C8C" text-anchor="middle">delegation</text>
<rect x="150" y="250" width="100" height="34" rx="8" fill="#0D1B2E"/>
<text x="200" y="267" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OU: Finance</text>
<rect x="390" y="250" width="100" height="34" rx="8" fill="#0D1B2E"/>
<text x="440" y="267" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OU: HR</text>
<line x1="200" y1="284" x2="200" y2="312" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="440" y1="284" x2="440" y2="312" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<rect x="150" y="314" width="100" height="34" rx="8" fill="#0D1B2E"/>
<text x="200" y="331" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Users</text>
<rect x="390" y="314" width="100" height="34" rx="8" fill="#0D1B2E"/>
<text x="440" y="331" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Users</text>
<!-- shared substrate band -->
<rect x="120" y="375" width="400" height="48" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="320" y="399" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">shared-hierarchical-substrate</text>
<line x1="200" y1="348" x2="270" y2="373" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ar-grey)"/>
<line x1="440" y1="348" x2="370" y2="373" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ar-grey)"/>
<!-- tool tags connect to band -->
<rect x="118" y="455" width="98" height="32" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="167" y="471" font-family="Consolas, monospace" font-size="9.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">conditional-access</text>
<rect x="222" y="455" width="70" height="32" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="257" y="471" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">intune</text>
<rect x="304" y="455" width="90" height="32" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="349" y="471" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">azure-arc</text>
<rect x="406" y="455" width="80" height="32" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="446" y="471" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">purview</text>
<line x1="165" y1="455" x2="220" y2="425" stroke="#1E8C8C" stroke-width="1.6"/>
<line x1="257" y1="455" x2="290" y2="425" stroke="#1E8C8C" stroke-width="1.6"/>
<line x1="349" y1="455" x2="350" y2="425" stroke="#1E8C8C" stroke-width="1.6"/>
<line x1="446" y1="455" x2="420" y2="425" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="320" y="520" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#1E8C8C" text-anchor="middle">One substrate carries inheritance for every tool.</text>

<!-- RIGHT PANEL: ENTRA-FLAT-DIRECTORY -->
<text x="960" y="150" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">ENTRA-FLAT-DIRECTORY</text>
<!-- flat row -->
<rect x="700" y="370" width="80" height="40" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="740" y="390" font-family="Arial, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">user</text>
<rect x="790" y="370" width="80" height="40" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="830" y="390" font-family="Arial, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">group</text>
<rect x="880" y="370" width="80" height="40" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="920" y="390" font-family="Arial, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">user</text>
<rect x="970" y="370" width="80" height="40" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="1010" y="390" font-family="Arial, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">group</text>
<rect x="1060" y="370" width="80" height="40" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="1100" y="390" font-family="Arial, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">user</text>
<text x="920" y="435" font-family="Arial, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="middle">no containers · no inheritance</text>

<!-- floating disconnected tool tags, each its own amber box -->
<rect x="700" y="180" width="100" height="50" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="750" y="200" font-family="Consolas, monospace" font-size="9.5" fill="#0D1B2E" text-anchor="middle">conditional-access</text>
<text x="750" y="216" font-family="Arial, sans-serif" font-size="9" fill="#6B7A8D" text-anchor="middle">own targeting box</text>
<rect x="820" y="180" width="100" height="50" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="870" y="200" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle">intune</text>
<text x="870" y="216" font-family="Arial, sans-serif" font-size="9" fill="#6B7A8D" text-anchor="middle">own targeting box</text>
<rect x="940" y="180" width="100" height="50" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="990" y="200" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle">azure-arc</text>
<text x="990" y="216" font-family="Arial, sans-serif" font-size="9" fill="#6B7A8D" text-anchor="middle">own targeting box</text>
<rect x="1060" y="180" width="100" height="50" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="1110" y="200" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle">purview</text>
<text x="1110" y="216" font-family="Arial, sans-serif" font-size="9" fill="#6B7A8D" text-anchor="middle">own targeting box</text>
<!-- broken red connectors -->
<line x1="750" y1="230" x2="760" y2="365" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#ar-red)"/>
<line x1="870" y1="230" x2="850" y2="365" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#ar-red)"/>
<line x1="990" y1="230" x2="1000" y2="365" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#ar-red)"/>
<line x1="1110" y1="230" x2="1090" y2="365" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#ar-red)"/>
<text x="920" y="300" font-family="Arial, sans-serif" font-size="13" fill="#C0392B" text-anchor="middle">no shared substrate to target</text>
<text x="920" y="520" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#C0392B" text-anchor="middle">fragile-organizational-awareness</text>
</svg>
