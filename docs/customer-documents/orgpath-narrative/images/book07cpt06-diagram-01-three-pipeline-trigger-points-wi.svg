<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E">Three pipeline trigger points wire Purview in</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E">&#8212; and a user move requires no action at all</text>

<!-- Source box on left -->
<rect x="60" y="270" width="280" height="180" rx="10" fill="#0D1B2E"/>
<text x="200" y="345" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree registry and</text>
<text x="200" y="370" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">governance pipeline</text>

<!-- Lane 1: node creation -->
<text x="430" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="start">Lane 1 &#183; node creation</text>
<line x1="340" y1="300" x2="640" y2="210" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="660" y="170" width="560" height="76" rx="8" fill="#0D1B2E"/>
<text x="940" y="198" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">create the full policy set for the node</text>
<text x="940" y="222" font-family="Consolas, monospace" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Adaptive Scope · label policy · retention policy · DLP policy</text>

<!-- Lane 2: node modification -->
<text x="430" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="start">Lane 2 &#183; node modification</text>
<line x1="340" y1="360" x2="640" y2="360" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="660" y="322" width="560" height="76" rx="8" fill="#0D1B2E"/>
<text x="940" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">sync the delta on the affected node</text>
<text x="940" y="374" font-family="Consolas, monospace" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">add labels · update duration · add SIT</text>

<!-- Lane 3: user OrgPath change -->
<text x="370" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="start">Lane 3 &#183; user OrgPath change</text>
<line x1="340" y1="420" x2="640" y2="510" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="660" y="474" width="560" height="96" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="940" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">no pipeline action</text>
<text x="940" y="526" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">the Purview Adaptive Scope engine re-evaluates</text>
<text x="940" y="544" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">on its next cycle</text>

<!-- amber marker for zero action -->
<rect x="660" y="592" width="300" height="38" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="810" y="611" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">zero compliance admin action</text>
</svg>
