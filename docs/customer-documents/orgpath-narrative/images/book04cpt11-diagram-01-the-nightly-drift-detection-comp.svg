<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E">The nightly drift-detection comparison and</text><text x="60" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E">its four finding categories</text>

<!-- Sources -->
<rect x="50" y="170" width="290" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/><text x="195" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OrgTree registry</text><text x="195" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">valid-path hash set</text><text x="195" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">+ group registry</text>
<rect x="50" y="300" width="290" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/><text x="195" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Live Entra ID</text><text x="195" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">every user/device OrgPath,</text><text x="195" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">OrgNodeId, group membership</text>

<!-- compare engine -->
<rect x="400" y="220" width="220" height="150" rx="10" fill="#0D1B2E"/><text x="510" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">compare</text><text x="510" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">path validity</text><text x="510" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">OrgNodeId consistency</text><text x="510" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">expected vs actual</text><text x="510" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">group membership</text>
<line x1="340" y1="215" x2="398" y2="260" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="340" y1="345" x2="398" y2="320" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- four finding cards -->
<rect x="680" y="160" width="320" height="58" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/><text x="700" y="184" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E">InvalidPath</text><text x="990" y="184" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="end">Critical</text><text x="700" y="204" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F">path not in the valid set</text>
<rect x="680" y="232" width="320" height="58" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/><text x="700" y="256" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E">Unpositioned</text><text x="990" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="end">High</text><text x="700" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F">null or absent OrgPath</text>
<rect x="680" y="304" width="320" height="58" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/><text x="700" y="328" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E">StalePosition</text><text x="990" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#D4A017" text-anchor="end">Medium</text><text x="700" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F">path references a Deprecated node</text>
<rect x="680" y="376" width="320" height="58" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/><text x="700" y="400" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E">MembershipLag</text><text x="990" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#D4A017" text-anchor="end">Low</text><text x="700" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F">valid path, group processing not caught up</text>

<line x1="620" y1="280" x2="678" y2="200" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="620" y1="290" x2="678" y2="260" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="620" y1="300" x2="678" y2="332" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="620" y1="310" x2="678" y2="404" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- routing -->
<rect x="1030" y="184" width="200" height="82" rx="8" fill="#C0392B"/><text x="1130" y="212" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Critical + High</text><text x="1130" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">on-call email</text><text x="1130" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">within five minutes</text>
<line x1="1000" y1="189" x2="1028" y2="210" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>
<line x1="1000" y1="261" x2="1028" y2="235" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>

<!-- all findings written -->
<rect x="400" y="510" width="600" height="70" rx="8" fill="#1E3A66"/><text x="700" y="538" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">All findings written to</text><text x="700" y="562" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle">drift-reports/{YYYY}/{MM}/</text>
<line x1="840" y1="434" x2="760" y2="508" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
</svg>
