<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="29" font-weight="bold" fill="#0D1B2E">Thirteen-phase dependency-ordered platform build</text>

<!-- helper note -->
<text x="60" y="92" font-family="Arial, sans-serif" font-size="13" fill="#6B7A8D">No phase advances until its validation suite passes (teal gate between each pair).</text>

<!-- phase boxes: 13, laid out 7 + 6 in two rows -->
<!-- Row 1 (phases 1-7) y=140 -->
<!-- each box w=150 h=70, gap with gate -->
<!-- We'll place gates as small teal check between boxes -->

<!-- Row 1 -->
<g font-family="Consolas, monospace" font-size="10.5">
<rect x="60" y="140" width="150" height="66" rx="8" fill="#0D1B2E"/>
<text x="135" y="166" fill="#FFFFFF" text-anchor="middle">1 Windows</text>
<text x="135" y="184" fill="#FFFFFF" text-anchor="middle">Server 2025 base</text>
<rect x="225" y="140" width="150" height="66" rx="8" fill="#0D1B2E"/>
<text x="300" y="176" fill="#FFFFFF" text-anchor="middle">2 IIS install</text>
<rect x="390" y="140" width="150" height="66" rx="8" fill="#0D1B2E"/>
<text x="465" y="166" fill="#FFFFFF" text-anchor="middle">3 TLS cert from</text>
<text x="465" y="184" fill="#FFFFFF" text-anchor="middle">enterprise CA</text>
<rect x="555" y="140" width="150" height="66" rx="8" fill="#0D1B2E"/>
<text x="630" y="176" fill="#FFFFFF" text-anchor="middle">4 Gitea install</text>
<rect x="720" y="140" width="150" height="66" rx="8" fill="#0D1B2E"/>
<text x="795" y="166" fill="#FFFFFF" text-anchor="middle">5 IIS reverse</text>
<text x="795" y="184" fill="#FFFFFF" text-anchor="middle">proxy with ARR</text>
<rect x="885" y="140" width="150" height="66" rx="8" fill="#0D1B2E"/>
<text x="960" y="166" fill="#FFFFFF" text-anchor="middle">6 AD LDAP</text>
<text x="960" y="184" fill="#FFFFFF" text-anchor="middle">auth</text>
<rect x="1050" y="140" width="150" height="66" rx="8" fill="#0D1B2E"/>
<text x="1125" y="166" fill="#FFFFFF" text-anchor="middle">7 Entra ID</text>
<text x="1125" y="184" fill="#FFFFFF" text-anchor="middle">OAuth2 OIDC</text>
</g>
<!-- gates row 1 -->
<g>
<circle cx="217" cy="173" r="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><path d="M213,173 l3,3 l5,-6" stroke="#1E8C8C" stroke-width="1.8" fill="none"/>
<circle cx="382" cy="173" r="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><path d="M378,173 l3,3 l5,-6" stroke="#1E8C8C" stroke-width="1.8" fill="none"/>
<circle cx="547" cy="173" r="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><path d="M543,173 l3,3 l5,-6" stroke="#1E8C8C" stroke-width="1.8" fill="none"/>
<circle cx="712" cy="173" r="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><path d="M708,173 l3,3 l5,-6" stroke="#1E8C8C" stroke-width="1.8" fill="none"/>
<circle cx="877" cy="173" r="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><path d="M873,173 l3,3 l5,-6" stroke="#1E8C8C" stroke-width="1.8" fill="none"/>
<circle cx="1042" cy="173" r="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><path d="M1038,173 l3,3 l5,-6" stroke="#1E8C8C" stroke-width="1.8" fill="none"/>
</g>
<!-- connect row1 -> row2 -->
<line x1="1125" y1="206" x2="1125" y2="240" stroke="#5A5A5A" stroke-width="2" />
<line x1="1125" y1="240" x2="135" y2="240" stroke="#5A5A5A" stroke-width="2" />
<line x1="135" y1="240" x2="135" y2="288" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- Row 2 (phases 8-13) y=290 -->
<g font-family="Consolas, monospace" font-size="10.5">
<rect x="60" y="290" width="150" height="66" rx="8" fill="#0D1B2E"/>
<text x="135" y="316" fill="#FFFFFF" text-anchor="middle">8 UIAO repo</text>
<text x="135" y="334" fill="#FFFFFF" text-anchor="middle">clone</text>
<rect x="225" y="290" width="150" height="66" rx="8" fill="#0D1B2E"/>
<text x="300" y="316" fill="#FFFFFF" text-anchor="middle">9 governance</text>
<text x="300" y="334" fill="#FFFFFF" text-anchor="middle">hook install</text>
<rect x="390" y="290" width="150" height="66" rx="8" fill="#0D1B2E"/>
<text x="465" y="316" fill="#FFFFFF" text-anchor="middle">10 Intune</text>
<text x="465" y="334" fill="#FFFFFF" text-anchor="middle">compliance</text>
<rect x="555" y="290" width="150" height="66" rx="8" fill="#0D1B2E"/>
<text x="630" y="316" fill="#FFFFFF" text-anchor="middle">11 Azure Arc</text>
<text x="630" y="334" fill="#FFFFFF" text-anchor="middle">enrollment</text>
<rect x="720" y="290" width="150" height="66" rx="8" fill="#0D1B2E"/>
<text x="795" y="316" fill="#FFFFFF" text-anchor="middle">12 backup +</text>
<text x="795" y="334" fill="#FFFFFF" text-anchor="middle">replication</text>
<rect x="885" y="290" width="150" height="66" rx="8" fill="#0D1B2E"/>
<text x="960" y="316" fill="#FFFFFF" text-anchor="middle">13 security</text>
<text x="960" y="334" fill="#FFFFFF" text-anchor="middle">hardening</text>
</g>
<!-- gates row 2 -->
<g>
<circle cx="217" cy="323" r="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><path d="M213,323 l3,3 l5,-6" stroke="#1E8C8C" stroke-width="1.8" fill="none"/>
<circle cx="382" cy="323" r="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><path d="M378,323 l3,3 l5,-6" stroke="#1E8C8C" stroke-width="1.8" fill="none"/>
<circle cx="547" cy="323" r="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><path d="M543,323 l3,3 l5,-6" stroke="#1E8C8C" stroke-width="1.8" fill="none"/>
<circle cx="712" cy="323" r="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><path d="M708,323 l3,3 l5,-6" stroke="#1E8C8C" stroke-width="1.8" fill="none"/>
<circle cx="877" cy="323" r="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><path d="M873,323 l3,3 l5,-6" stroke="#1E8C8C" stroke-width="1.8" fill="none"/>
</g>
<text x="640" y="386" font-family="Arial, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">validation suite passes at each gate</text>

<!-- service accounts feeding -->
<rect x="60" y="430" width="610" height="90" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/>
<text x="80" y="455" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C">Service accounts feed the relevant phases</text>
<rect x="80" y="468" width="160" height="38" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="160" y="487" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">gitea-svc</text>
<rect x="255" y="468" width="180" height="38" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="345" y="487" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">assessment-exec</text>
<rect x="450" y="468" width="180" height="38" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="540" y="487" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">backup-orch</text>

<!-- governance hooks panel -->
<rect x="710" y="430" width="510" height="190" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="965" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">governance hooks  (wrap the Gitea phase)</text>
<rect x="730" y="470" width="470" height="34" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.2"/>
<text x="965" y="487" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">pre-receive</text>
<rect x="730" y="510" width="470" height="34" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.2"/>
<text x="965" y="527" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">post-receive</text>
<rect x="730" y="550" width="470" height="34" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.2"/>
<text x="965" y="567" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">update</text>

<!-- red reject arrow -->
<rect x="710" y="635" width="510" height="50" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
<text x="965" y="660" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">non-compliant artifact rejected at pre-receive</text>
<line x1="965" y1="584" x2="965" y2="633" stroke="#C0392B" stroke-width="2" marker-end="url(#ar-red)"/>
</svg>
