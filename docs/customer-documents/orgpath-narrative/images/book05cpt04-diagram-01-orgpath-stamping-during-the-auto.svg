<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">OrgPath stamping during the Autopilot ESP</text>

<!-- Phase timeline boxes -->
<rect x="60" y="120" width="270" height="64" rx="8" fill="#0D1B2E"/>
<text x="195" y="144" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Device Setup</text>
<text x="195" y="164" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">registers in Entra, cert pre-provisioned</text>

<rect x="370" y="120" width="540" height="430" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="640" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Account Setup — provisioning user authenticated</text>

<rect x="950" y="120" width="270" height="64" rx="8" fill="#0D1B2E"/>
<text x="1085" y="152" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ESP complete</text>

<line x1="330" y1="152" x2="368" y2="152" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="910" y1="152" x2="948" y2="152" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Decision diamond 1 -->
<polygon points="500,175 600,210 500,245 400,210" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="500" y="205" font-family="Consolas, monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle">Serial in</text>
<text x="500" y="219" font-family="Consolas, monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle">orgpath-mapping.csv?</text>

<!-- YES box -->
<rect x="640" y="184" width="250" height="52" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="765" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Stamp mapped OrgPath</text>
<line x1="600" y1="210" x2="638" y2="210" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<text x="619" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#1E8C8C" text-anchor="middle">YES</text>

<!-- Decision diamond 2 (NO path) -->
<polygon points="500,270 600,305 500,340 400,305" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="500" y="300" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#0D1B2E" text-anchor="middle">Provisioning user</text>
<text x="500" y="314" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#0D1B2E" text-anchor="middle">has OrgPath?</text>
<line x1="500" y1="245" x2="500" y2="268" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<text x="520" y="262" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#5A5A5A" text-anchor="middle">NO</text>

<!-- YES of diamond 2: derive from user -->
<rect x="640" y="279" width="250" height="52" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="765" y="305" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Derive OrgPath from user</text>
<line x1="600" y1="305" x2="638" y2="305" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<text x="619" y="295" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#1E8C8C" text-anchor="middle">YES</text>

<!-- NO of diamond 2: amber unpositioned -->
<rect x="640" y="360" width="250" height="62" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="765" y="384" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Stamp /UNPOSITIONED</text>
<text x="765" y="404" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">and queue for review</text>
<line x1="500" y1="340" x2="500" y2="391" stroke="#5A5A5A" stroke-width="2"/>
<line x1="500" y1="391" x2="638" y2="391" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<text x="520" y="358" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#5A5A5A" text-anchor="middle">NO</text>

<!-- Converge box -->
<rect x="370" y="460" width="540" height="74" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="640" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OrgPath present on device object</text>
<text x="640" y="510" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">dynamic group evaluation → policies apply during ESP</text>

<!-- arrows from three outcomes to converge -->
<line x1="765" y1="236" x2="765" y2="280" stroke="#1E8C8C" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="900" y1="210" x2="930" y2="210" stroke="#1E8C8C" stroke-width="1.5"/>
<line x1="930" y1="210" x2="930" y2="497" stroke="#1E8C8C" stroke-width="1.5"/>
<line x1="930" y1="497" x2="912" y2="497" stroke="#1E8C8C" stroke-width="1.5" marker-end="url(#ar-teal)"/>
<line x1="765" y1="331" x2="765" y2="458" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="765" y1="422" x2="765" y2="458" stroke="#1E8C8C" stroke-width="1.6"/>

<!-- red failure annotation -->
<rect x="60" y="580" width="1160" height="58" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="640" y="602" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">Failure path: no stamp</text>
<text x="640" y="622" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">device leaves ESP ungoverned — in no group, evaluated by no compliance policy</text>
</svg>
