<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Three partner-level change events and their</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">pipeline fan-out across guests</text>

<!-- Center: partner registry entry -->
<rect x="50" y="290" width="240" height="120" rx="8" fill="#0D1B2E"/>
<text x="170" y="320" font-family="Arial" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">partner registry entry</text>
<text x="170" y="344" font-family="Consolas, monospace" font-size="12" fill="#C7D4E6" text-anchor="middle">contoso-partner.com</text>
<text x="170" y="370" font-family="Consolas, monospace" font-size="11" fill="#9FB3CE" text-anchor="middle">RiskTier</text>
<text x="170" y="386" font-family="Consolas, monospace" font-size="11" fill="#9FB3CE" text-anchor="middle">Domain</text>
<text x="170" y="402" font-family="Consolas, monospace" font-size="11" fill="#9FB3CE" text-anchor="middle">Stub</text>

<!-- Branch 1 (teal): reclassification -->
<rect x="380" y="130" width="290" height="64" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="525" y="156" font-family="Arial" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Partner reclassification</text>
<text x="525" y="178" font-family="Arial" font-size="11.5" fill="#33414F" text-anchor="middle">RiskTier Tier2 to Tier1, stub unchanged</text>
<path d="M290,320 L350,170 L378,170" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="700" y="120" width="240" height="34" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="820" y="142" font-family="Arial" font-size="11.5" fill="#0D1B2E" text-anchor="middle">Cross-Tenant Access Settings updated</text>
<rect x="700" y="160" width="240" height="34" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="820" y="182" font-family="Arial" font-size="11.5" fill="#0D1B2E" text-anchor="middle">Conditional Access group re-tiered</text>
<rect x="700" y="200" width="240" height="34" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="820" y="222" font-family="Arial" font-size="11.5" fill="#0D1B2E" text-anchor="middle">Sentinel WatchList RiskTier updated</text>
<line x1="670" y1="162" x2="698" y2="137" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="670" y1="170" x2="698" y2="177" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="670" y1="178" x2="698" y2="217" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<text x="975" y="180" font-family="Arial" font-size="11" font-style="italic" fill="#1E8C8C" text-anchor="start">committed as</text>
<text x="975" y="196" font-family="Arial" font-size="11" font-style="italic" fill="#1E8C8C" text-anchor="start">one atomic unit</text>

<!-- Branch 2 (amber): domain reassignment -->
<rect x="380" y="320" width="290" height="60" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
<text x="525" y="346" font-family="Arial" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Domain reassignment</text>
<text x="525" y="366" font-family="Arial" font-size="11.5" fill="#33414F" text-anchor="middle">old domain to new domain</text>
<line x1="290" y1="350" x2="378" y2="350" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<rect x="700" y="305" width="270" height="30" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.4"/>
<text x="835" y="325" font-family="Arial" font-size="11.5" fill="#0D1B2E" text-anchor="middle">new registry entry created</text>
<rect x="700" y="340" width="270" height="30" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.4"/>
<text x="835" y="360" font-family="Arial" font-size="11.5" fill="#0D1B2E" text-anchor="middle">guest re-stamp: old stub to new stub</text>
<rect x="700" y="375" width="270" height="30" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.4"/>
<text x="835" y="395" font-family="Arial" font-size="11.5" fill="#0D1B2E" text-anchor="middle">old entry deprecated after transition</text>
<line x1="670" y1="350" x2="698" y2="335" stroke="#D4A017" stroke-width="1.6" marker-end="url(#ar-amber)"/>
<line x1="670" y1="350" x2="698" y2="355" stroke="#D4A017" stroke-width="1.6" marker-end="url(#ar-amber)"/>
<line x1="670" y1="350" x2="698" y2="385" stroke="#D4A017" stroke-width="1.6" marker-end="url(#ar-amber)"/>

<!-- Branch 3 (red): offboarding -->
<rect x="380" y="430" width="290" height="60" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
<text x="525" y="464" font-family="Arial" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle">Partner offboarding</text>
<path d="M290,380 L350,460 L378,460" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>
<rect x="700" y="425" width="240" height="34" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.4"/>
<text x="820" y="440" font-family="Arial" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">Phase 1</text>
<text x="820" y="455" font-family="Arial" font-size="10.5" fill="#33414F" text-anchor="middle">stamp EXTERNAL/B2B/OFFBOARDED, disable</text>
<rect x="700" y="495" width="240" height="34" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.4"/>
<text x="820" y="510" font-family="Arial" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">Phase 2</text>
<text x="820" y="525" font-family="Arial" font-size="10.5" fill="#33414F" text-anchor="middle">delete guest objects, remove registry entry</text>
<line x1="670" y1="460" x2="698" y2="442" stroke="#C0392B" stroke-width="1.6" marker-end="url(#ar-red)"/>
<line x1="820" y1="459" x2="820" y2="493" stroke="#C0392B" stroke-width="2" marker-end="url(#ar-red)"/>
<text x="950" y="480" font-family="Arial" font-size="11" font-style="italic" fill="#C0392B" text-anchor="start">thirty-day</text>
<text x="950" y="496" font-family="Arial" font-size="11" font-style="italic" fill="#C0392B" text-anchor="start">window</text>

<!-- shared bottom label -->
<rect x="200" y="590" width="880" height="50" rx="8" fill="#0D1B2E"/>
<text x="640" y="620" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">re-stamp script patches OrgPath on every matching guest UPN</text>
</svg>
