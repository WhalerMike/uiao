<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E" text-anchor="start">Workspace roles and item grants reconciled</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E" text-anchor="start">from OrgPath, beneath the domain assignment</text>

<!-- LEFT: OrgPath-derived populations (amber) -->
<text x="60" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" letter-spacing="0.3" fill="#8A6D10" text-anchor="start">ORGPATH-DERIVED POPULATIONS</text>
<rect x="60" y="170" width="280" height="60" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="200" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Viewer population</text>
<text x="200" y="212" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">/Root/Finance/* read set</text>
<rect x="60" y="250" width="280" height="60" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="200" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Member / Contributor</text>
<text x="200" y="292" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">/Root/Finance build set</text>
<rect x="60" y="330" width="280" height="60" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="200" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Admin population</text>
<text x="200" y="372" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">/Root/Finance owners</text>
<rect x="60" y="430" width="280" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="200" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Cross-segment override</text>
<text x="200" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">shared semantic model · OrgPath justification</text>

<!-- CENTER: Workspace box -->
<rect x="430" y="150" width="430" height="350" rx="10" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.8"/>
<rect x="430" y="150" width="430" height="56" rx="10" fill="#0D1B2E"/>
<text x="645" y="172" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Fabric workspace</text>
<text x="645" y="192" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#D4A017" text-anchor="middle" dominant-baseline="central">domain: /Root/Finance</text>
<text x="645" y="225" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">governance container, not access control</text>
<!-- role bands -->
<rect x="455" y="240" width="380" height="40" rx="6" fill="#1E3A66"/>
<text x="645" y="261" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Admin</text>
<rect x="455" y="290" width="380" height="40" rx="6" fill="#1E3A66"/>
<text x="645" y="311" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Member</text>
<rect x="455" y="340" width="380" height="40" rx="6" fill="#1E3A66"/>
<text x="645" y="361" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Contributor</text>
<rect x="455" y="390" width="380" height="40" rx="6" fill="#1E3A66"/>
<text x="645" y="411" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Viewer</text>
<!-- item-level grant -->
<rect x="455" y="442" width="380" height="44" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="645" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">lakehouse item</text>
<text x="645" y="479" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">item-level grant, separate from workspace roles</text>

<!-- amber connectors from populations to bands -->
<line x1="340" y1="360" x2="453" y2="260" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="340" y1="280" x2="453" y2="310" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="340" y1="280" x2="453" y2="360" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="340" y1="200" x2="453" y2="410" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="340" y1="462" x2="453" y2="464" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>

<!-- red DRIFT-PROVENANCE marker on Viewer band -->
<rect x="850" y="392" width="36" height="36" rx="6" fill="#C0392B"/>
<text x="868" y="411" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">!</text>
<rect x="900" y="382" width="320" height="60" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="1060" y="404" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">DRIFT-PROVENANCE</text>
<text x="1060" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#7B241C" text-anchor="middle" dominant-baseline="central">grant with no OrgPath justification</text>
<line x1="886" y1="410" x2="898" y2="410" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ar-red)"/>

<!-- RIGHT: teal reconciliation job cylinder -->
<g>
<ellipse cx="1060" cy="178" rx="120" ry="20" fill="#1E8C8C"/>
<rect x="940" y="178" width="240" height="100" fill="#1E8C8C"/>
<ellipse cx="1060" cy="278" rx="120" ry="20" fill="#157070"/>
<ellipse cx="1060" cy="178" rx="120" ry="20" fill="#26A0A0"/>
</g>
<text x="1060" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree registry</text>
<text x="1060" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">reconciliation job reads it,</text>
<text x="1060" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">converges role bands</text>
<line x1="930" y1="318" x2="862" y2="330" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="1050" y="345" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#1E8C8C" text-anchor="middle">idempotent reconcile via Fabric Admin REST API</text>

<text x="430" y="560" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-style="italic" fill="#6B7A8D" text-anchor="start">Domain assignment makes the workspace governable; role reconciliation decides who may open it.</text>
</svg>
