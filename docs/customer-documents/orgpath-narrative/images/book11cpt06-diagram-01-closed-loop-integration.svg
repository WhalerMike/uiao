<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath closes the governance loop: one commit</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">propagates and returns as monitored state</text>

<!-- Registry commit -->
<rect x="60" y="290" width="200" height="120" rx="8" fill="#0D1B2E"/>
<text x="160" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree</text>
<text x="160" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">registry commit</text>

<!-- Pipeline -->
<rect x="300" y="290" width="170" height="120" rx="8" fill="#0D1B2E"/>
<text x="385" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">propagation</text>
<text x="385" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">pipeline</text>
<line x1="260" y1="350" x2="298" y2="350" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>

<!-- Four plane boxes -->
<rect x="540" y="140" width="380" height="92" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="730" y="166" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Identity plane</text>
<text x="730" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">dynamic groups + OrgPath attribute stamping</text>
<text x="730" y="212" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">key: OrgPath</text>

<rect x="540" y="248" width="380" height="92" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="730" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">PIM plane</text>
<text x="730" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">eligibility groups + schedules</text>
<text x="730" y="320" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">key: OrgPath</text>

<rect x="540" y="356" width="380" height="92" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="730" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Lifecycle Workflows plane</text>
<text x="730" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">mover realignment</text>
<text x="730" y="428" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">key: OrgPath</text>

<rect x="540" y="464" width="380" height="92" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="730" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure RBAC plane</text>
<text x="730" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">resource-scope role assignments</text>
<text x="730" y="536" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">key: OrgPath</text>

<!-- pipeline fans to four planes -->
<line x1="470" y1="345" x2="538" y2="186" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="470" y1="348" x2="538" y2="294" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="470" y1="352" x2="538" y2="402" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="470" y1="355" x2="538" y2="510" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- Sentinel monitoring plane (amber) -->
<rect x="990" y="290" width="230" height="120" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="1105" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Sentinel</text>
<text x="1105" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">monitoring plane</text>
<text x="1105" y="372" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">join AuditLogs +</text>
<text x="1105" y="390" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">AzureActivity on OrgPath</text>

<!-- four planes converge to Sentinel -->
<line x1="920" y1="186" x2="988" y2="330" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="920" y1="294" x2="988" y2="345" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="920" y1="402" x2="988" y2="360" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="920" y1="510" x2="988" y2="375" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- return arrow closing loop: Sentinel back to registry -->
<path d="M1105,410 C1105,640 160,640 160,412" fill="none" stroke="#0D1B2E" stroke-width="2.6" marker-end="url(#ar-navy)"/>
<text x="640" y="660" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">monitored, queryable state returns to the registry — loop closed</text>

<!-- red drift marker -->
<rect x="990" y="430" width="230" height="56" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.8"/>
<text x="1105" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">drift detected</text>
<text x="1105" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">by Query Three</text>
<line x1="1105" y1="410" x2="1105" y2="428" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>
</svg>
