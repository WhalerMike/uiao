<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Fragmented vocabularies versus one coherent</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">model</text><text x="60" y="140" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.3" fill="#C0392B" text-anchor="start">FRAGMENTED — brittle hand-maintained translation</text><rect x="60" y="160" width="280" height="56" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.3"/><text x="200" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">user ext: "Finance-West"</text><rect x="360" y="160" width="280" height="56" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.3"/><text x="500" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">device tag: FIN_W</text><rect x="660" y="160" width="280" height="56" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.3"/><text x="800" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">resource tag: fin.west</text><rect x="960" y="160" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.4"/><text x="1080" y="181.52" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">cross-surface query</text><text x="1080" y="194.48" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">3 tools, manual correlation</text><text x="490" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#C0392B" text-anchor="middle" dominant-baseline="central">translation tables must be hand-maintained, can drift   ·   assets missed</text><line x1="60" y1="290" x2="1220" y2="290" stroke="#E3E8EF" stroke-width="1.4"/><text x="60" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.3" fill="#1E8C8C" text-anchor="start">COHERENT — one registry, one vocabulary</text><rect x="490" y="350" width="300" height="56" rx="8" fill="#0D1B2E"/><text x="640" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Hierarchy Registry</text><rect x="60" y="440" width="280" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="200" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">user: /Org/Finance/West</text><line x1="640" y1="406" x2="200" y2="438" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/><rect x="360" y="440" width="280" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="500" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">device: /Org/Finance/West</text><line x1="640" y1="406" x2="500" y2="438" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/><rect x="660" y="440" width="280" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="800" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">server: /Org/Finance/West</text><line x1="640" y1="406" x2="800" y2="438" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/><rect x="960" y="440" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/><text x="1080" y="460.98" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">single query</text><text x="1080" y="475.02" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">✓ no translation layer</text><text x="490" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">one query cleanly returns users + devices + servers for a unit</text>
</svg>
