<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">What the complete OrgTree + OrgPath model</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">makes possible, on the unchanged platform</text>

<!-- TOP BAND: dividends -->
<rect x="60" y="120" width="930" height="160" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="80" y="146" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="0.4" fill="#0D1B2E" text-anchor="start">WHAT THE ORGANIZATION CAN NOW DO</text>
<rect x="80" y="160" width="285" height="50" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.2"/>
<text x="222" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">one-query cross-surface inventory</text>
<text x="222" y="196" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">users + devices + servers</text>
<rect x="375" y="160" width="285" height="50" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.2"/>
<text x="517" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">policy-coverage verification in seconds</text>
<rect x="670" y="160" width="300" height="50" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.2"/>
<text x="820" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath-organized decommissioning impact</text>
<rect x="80" y="220" width="430" height="50" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.2"/>
<text x="295" y="246" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">automated drift detection + proof</text>
<rect x="520" y="220" width="450" height="50" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.2"/>
<text x="745" y="246" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">version-controlled structural history</text>

<!-- side note -->
<rect x="1010" y="120" width="210" height="160" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1115" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">no platform</text>
<text x="1115" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">restructuring</text>
<text x="1115" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">no vendor</text>
<text x="1115" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">roadmap dependency</text>

<!-- MIDDLE BAND: governance substrate -->
<rect x="60" y="320" width="1160" height="140" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="80" y="346" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="0.4" fill="#1E8C8C" text-anchor="start">GOVERNANCE SUBSTRATE  (closed loop)</text>
<rect x="100" y="362" width="230" height="76" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="215" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Registry</text>
<rect x="380" y="362" width="230" height="76" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="495" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Attribute</text>
<rect x="660" y="362" width="230" height="76" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="775" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Pipeline</text>
<rect x="940" y="362" width="230" height="76" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="1055" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Repository</text>
<line x1="330" y1="400" x2="378" y2="400" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="610" y1="400" x2="658" y2="400" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="890" y1="400" x2="938" y2="400" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>

<!-- arrows between bands -->
<line x1="525" y1="320" x2="525" y2="282" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<text x="545" y="306" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5A5A5A" text-anchor="start">delivers dividends</text>

<!-- BOTTOM BAND: existing platform -->
<rect x="60" y="500" width="850" height="160" rx="10" fill="#0D1B2E"/>
<text x="80" y="526" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="0.4" fill="#FFFFFF" text-anchor="start">EXISTING PLATFORM CAPABILITIES (UNCHANGED)</text>
<rect x="80" y="542" width="380" height="48" rx="6" fill="#1E3A66"/>
<text x="270" y="566" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">directory schema-extension attributes</text>
<rect x="470" y="542" width="420" height="48" rx="6" fill="#1E3A66"/>
<text x="680" y="566" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">resource tags</text>
<rect x="80" y="600" width="380" height="48" rx="6" fill="#1E3A66"/>
<text x="270" y="624" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">dynamic group rules</text>
<rect x="470" y="600" width="420" height="48" rx="6" fill="#1E3A66"/>
<text x="680" y="624" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">version-controlled repositories</text>
<line x1="485" y1="500" x2="485" y2="462" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<text x="505" y="486" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5A5A5A" text-anchor="start">layered on</text>

<!-- maturity arrow (right) -->
<rect x="940" y="500" width="280" height="160" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1080" y="524" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Incremental adoption</text>
<rect x="962" y="544" width="100" height="40" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="1012" y="565" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">one division</text>
<line x1="1062" y1="564" x2="1100" y2="564" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<rect x="1102" y="544" width="100" height="40" rx="6" fill="#1E8C8C"/>
<text x="1152" y="565" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">broaden</text>
<text x="1080" y="608" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">it does not get more complex</text>
<text x="1080" y="628" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">as it grows &#8212; it gets more</text>
<text x="1080" y="648" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">populated</text>
</svg>
