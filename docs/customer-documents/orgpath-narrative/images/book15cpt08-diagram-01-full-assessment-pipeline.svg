<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="29" font-weight="bold" fill="#0D1B2E">Full Active Directory assessment pipeline</text>

<!-- LEFT: ten discovery domains -->
<rect x="50" y="100" width="230" height="500" rx="10" fill="#0D1B2E"/>
<text x="165" y="126" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ten discovery domains</text>
<g font-family="Consolas, monospace" font-size="11" fill="#C7D4E6">
<text x="70" y="160">forest-topology</text>
<text x="70" y="204">ou-hierarchy</text>
<text x="70" y="248">gpo-inventory</text>
<text x="70" y="292">dns-infrastructure</text>
<text x="70" y="336">certificate-services</text>
<text x="70" y="380">computer-objects</text>
<text x="70" y="424">user-objects</text>
<text x="70" y="468">group-membership</text>
<text x="70" y="512">trust-mapping</text>
<text x="70" y="556">metadata-layer</text>
</g>

<!-- CENTER: implemented modules teal band -->
<line x1="280" y1="200" x2="328" y2="240" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<rect x="330" y="130" width="270" height="160" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="465" y="154" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Implemented modules</text>
<rect x="346" y="166" width="238" height="32" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.1"/><text x="465" y="183" font-family="Consolas, monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">UIAOADAssessment (11 fns)</text>
<rect x="346" y="204" width="238" height="32" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.1"/><text x="465" y="221" font-family="Consolas, monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">UIAODNSAssessment (8 fns)</text>
<rect x="346" y="242" width="238" height="32" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.1"/><text x="465" y="259" font-family="Consolas, monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">UIAOPKIAssessment (5 fns)</text>

<!-- planned modules amber dashed -->
<rect x="330" y="320" width="270" height="200" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="465" y="344" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Planned modules · future release</text>
<g>
<rect x="346" y="356" width="238" height="32" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.1" stroke-dasharray="5 4"/><text x="465" y="373" font-family="Consolas, monospace" font-size="10.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">UIAOIdentityAssessment</text>
<rect x="346" y="394" width="238" height="32" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.1" stroke-dasharray="5 4"/><text x="465" y="411" font-family="Consolas, monospace" font-size="10.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">UIAOImportAdapters</text>
<rect x="346" y="432" width="238" height="32" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.1" stroke-dasharray="5 4"/><text x="465" y="449" font-family="Consolas, monospace" font-size="10.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">UIAOPlanGenerators</text>
<rect x="346" y="470" width="238" height="32" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.1" stroke-dasharray="5 4"/><text x="465" y="487" font-family="Consolas, monospace" font-size="10.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">UIAODriftDetection</text>
</g>

<!-- governance JSON box -->
<line x1="600" y1="210" x2="648" y2="280" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="600" y1="420" x2="648" y2="350" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<rect x="650" y="270" width="260" height="100" rx="10" fill="#0D1B2E"/>
<text x="780" y="298" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">governance-tagged JSON</text>
<text x="780" y="322" font-family="Arial, sans-serif" font-size="10" fill="#C7D4E6" text-anchor="middle">timestamp · module-version · environment-id</text>
<text x="780" y="340" font-family="Arial, sans-serif" font-size="10" fill="#C7D4E6" text-anchor="middle">domain-controller · executing-account</text>

<!-- to OrgPath ETL teal -->
<line x1="910" y1="300" x2="958" y2="240" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="960" y="170" width="270" height="80" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1095" y="198" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OrgPath ETL pipeline</text>
<text x="1095" y="222" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">cross-plane dependency graph</text>

<!-- to drift engine amber -->
<line x1="910" y1="340" x2="958" y2="400" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<rect x="960" y="390" width="270" height="80" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1095" y="418" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">drift detection engine</text>
<text x="1095" y="442" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">compares against committed baseline</text>

<!-- red divergence -->
<rect x="960" y="510" width="270" height="56" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
<text x="1095" y="532" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">drift flagged for</text>
<text x="1095" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">Canon Steward review</text>
<line x1="1095" y1="470" x2="1095" y2="508" stroke="#C0392B" stroke-width="2" marker-end="url(#ar-red)"/>
</svg>
