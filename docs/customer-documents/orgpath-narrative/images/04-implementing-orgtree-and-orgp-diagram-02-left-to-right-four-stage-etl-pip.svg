<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E">The four-stage OrgPath ETL pipeline:</text><text x="60" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E">Extract &#183; Transform &#183; Load &#183; Audit</text>

<!-- config box far left -->
<rect x="40" y="300" width="170" height="120" rx="8" fill="#1E3A66"/><text x="125" y="328" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">pipeline/</text><text x="125" y="346" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">config.json</text><text x="125" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#C7D4E6" text-anchor="middle">OrgTree path,</text><text x="125" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#C7D4E6" text-anchor="middle">ext-attr names,</text><text x="125" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#C7D4E6" text-anchor="middle">Graph creds</text>
<line x1="210" y1="360" x2="258" y2="360" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- Stage 1: Extract -->
<rect x="260" y="180" width="220" height="360" rx="10" fill="none" stroke="#0D1B2E" stroke-width="2"/>
<text x="370" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Extract</text>
<rect x="280" y="230" width="180" height="120" rx="8" fill="#0D1B2E"/><text x="370" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Read OrgTree YAML</text><text x="370" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">build path + OU</text><text x="370" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">mapping tables</text>
<rect x="280" y="370" width="180" height="150" rx="8" fill="#0D1B2E"/><text x="370" y="402" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GET /v1.0/users</text><text x="370" y="420" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">+ /devices</text><text x="370" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">with extension attrs</text><text x="370" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">paginated</text>
<line x1="480" y1="360" x2="498" y2="360" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- Stage 2: Transform -->
<rect x="500" y="180" width="220" height="360" rx="10" fill="none" stroke="#0D1B2E" stroke-width="2"/>
<text x="610" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Transform</text>
<rect x="520" y="230" width="180" height="120" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="610" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Per object:</text><text x="610" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">derive OrgPath from DN</text><text x="610" y="294" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">(sync) or department/</text><text x="610" y="310" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">company (cloud)</text>
<rect x="520" y="370" width="180" height="150" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="610" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Validate against</text><text x="610" y="432" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">registry</text><text x="610" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">reject if no</text><text x="610" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">mapped ancestor</text>
<line x1="720" y1="360" x2="738" y2="360" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- Stage 3: Load -->
<rect x="740" y="180" width="220" height="360" rx="10" fill="none" stroke="#0D1B2E" stroke-width="2"/>
<text x="850" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Load</text>
<rect x="760" y="230" width="180" height="120" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="850" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Diff</text><text x="850" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">skip confirmed</text><text x="850" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">assignments, queue</text><text x="850" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">new assignments</text>
<rect x="760" y="370" width="180" height="150" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="850" y="402" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">POST /v1.0/$batch</text><text x="850" y="432" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">20 PATCH per batch</text><text x="850" y="458" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">retry on 429</text>
<line x1="960" y1="360" x2="978" y2="360" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- Stage 4: Audit -->
<rect x="980" y="180" width="240" height="360" rx="10" fill="none" stroke="#1E8C8C" stroke-width="2"/>
<text x="1100" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Audit</text>
<rect x="1000" y="260" width="200" height="200" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="1100" y="300" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="bold" fill="#0D1B2E" text-anchor="middle">etl-report-{ts}.json</text><text x="1100" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">counts, unmapped</text><text x="1100" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">UPNs, errors</text><text x="1100" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6B7A8D" text-anchor="middle">committed to</text><text x="1100" y="410" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#1E8C8C" text-anchor="middle">pipeline-reports/etl/</text>
</svg>
