<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="29" font-weight="bold" fill="#0D1B2E">Assessment-derived order versus a remembered model</text>

<!-- divider -->
<line x1="640" y1="100" x2="640" y2="690" stroke="#E3E8EF" stroke-width="2"/>

<!-- LEFT: assessment-derived -->
<rect x="60" y="120" width="520" height="360" rx="10" fill="#0D1B2E"/>
<text x="320" y="148" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">assessment-derived dependency graph</text>
<!-- nodes -->
<rect x="90" y="180" width="150" height="40" rx="8" fill="#1E3A66"/><text x="165" y="200" font-family="Consolas, monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">domain controllers</text>
<rect x="400" y="180" width="150" height="40" rx="8" fill="#1E3A66"/><text x="475" y="200" font-family="Consolas, monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">DNS zones</text>
<rect x="90" y="250" width="150" height="40" rx="8" fill="#1E3A66"/><text x="165" y="270" font-family="Consolas, monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">service accounts</text>
<rect x="400" y="250" width="150" height="40" rx="8" fill="#1E3A66"/><text x="475" y="270" font-family="Consolas, monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">cert templates</text>
<rect x="245" y="315" width="150" height="40" rx="8" fill="#1E3A66"/><text x="320" y="335" font-family="Consolas, monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Group Policy Objects</text>
<!-- real dependency arrows -->
<line x1="240" y1="200" x2="400" y2="200" stroke="#C7D4E6" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="165" y1="220" x2="165" y2="250" stroke="#C7D4E6" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="475" y1="220" x2="475" y2="250" stroke="#C7D4E6" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="200" y1="290" x2="290" y2="315" stroke="#C7D4E6" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="440" y1="290" x2="350" y2="315" stroke="#C7D4E6" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<!-- committed band -->
<rect x="90" y="400" width="460" height="48" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="320" y="424" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">committed to governance repository (versioned)</text>
<!-- arrow to safe outcome -->
<rect x="160" y="540" width="320" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="320" y="568" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">safe ordered transition</text>
<line x1="320" y1="480" x2="320" y2="538" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="455" y="515" font-family="Arial, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">migration follows derived order</text>

<!-- RIGHT: remembered model -->
<rect x="700" y="120" width="520" height="360" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="960" y="148" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle">remembered model (from recollection)</text>
<rect x="730" y="180" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.3"/><text x="805" y="200" font-family="Consolas, monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">domain controllers</text>
<rect x="1040" y="180" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.3"/><text x="1115" y="200" font-family="Consolas, monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">DNS zones</text>
<rect x="730" y="250" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.3"/><text x="805" y="270" font-family="Consolas, monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">service accounts</text>
<rect x="1040" y="250" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.3"/><text x="1115" y="270" font-family="Consolas, monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">cert templates</text>
<!-- sparse incorrect arrow -->
<line x1="880" y1="200" x2="1040" y2="200" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="960" y="330" font-family="Arial, sans-serif" font-size="11" fill="#C0392B" text-anchor="middle">sparse, incorrect dependency graph</text>
<!-- failure boxes -->
<rect x="730" y="400" width="460" height="34" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.4"/>
<text x="960" y="417" font-family="Arial, sans-serif" font-size="11" fill="#C0392B" text-anchor="middle" dominant-baseline="central">DC decommissioned before service accounts migrated</text>
<rect x="730" y="442" width="460" height="34" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.4"/>
<text x="960" y="459" font-family="Arial, sans-serif" font-size="11" fill="#C0392B" text-anchor="middle" dominant-baseline="central">DNS zone retired before forwarders replicated</text>
<line x1="805" y1="290" x2="850" y2="398" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ar-red)"/>
<line x1="1115" y1="290" x2="1070" y2="398" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ar-red)"/>
<text x="960" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle">the failure class the principle eliminates</text>
</svg>
