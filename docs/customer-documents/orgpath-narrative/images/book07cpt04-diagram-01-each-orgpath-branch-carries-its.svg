<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Each OrgPath branch carries its own retention</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">schedule, read from OrgTree node metadata</text>

<!-- Callout (navy) -->
<rect x="360" y="128" width="560" height="44" rx="8" fill="#0D1B2E"/>
<text x="640" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">the RetentionPolicy object on the node drives the schedule</text>

<!-- 4 rows: OrgPath node (left) - amber connector - retention card (right) -->
<!-- Row 1 Finance -->
<rect x="200" y="206" width="320" height="66" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="360" y="239" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NCR / Finance</text>
<rect x="760" y="206" width="320" height="66" rx="8" fill="#0D1B2E"/>
<text x="920" y="232" font-family="Consolas, monospace" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">7yr KeepAndDelete</text>
<text x="920" y="256" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">retention card</text>
<line x1="520" y1="239" x2="758" y2="239" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>

<!-- Row 2 Legal -->
<rect x="200" y="298" width="320" height="66" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="360" y="331" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NCR / Legal</text>
<rect x="760" y="298" width="320" height="66" rx="8" fill="#0D1B2E"/>
<text x="920" y="324" font-family="Consolas, monospace" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">10yr Keep</text>
<text x="920" y="348" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">retention card</text>
<line x1="520" y1="331" x2="758" y2="331" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>

<!-- Row 3 Engineering -->
<rect x="200" y="390" width="320" height="66" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="360" y="423" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NCR / Engineering</text>
<rect x="760" y="390" width="320" height="66" rx="8" fill="#0D1B2E"/>
<text x="920" y="416" font-family="Consolas, monospace" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3yr KeepAndDelete</text>
<text x="920" y="440" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">retention card</text>
<line x1="520" y1="423" x2="758" y2="423" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>

<!-- Row 4 Operations -->
<rect x="200" y="482" width="320" height="66" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="360" y="515" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NCR / Operations</text>
<rect x="760" y="482" width="320" height="66" rx="8" fill="#0D1B2E"/>
<text x="920" y="508" font-family="Consolas, monospace" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">90d Delete</text>
<text x="920" y="532" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">retention card</text>
<line x1="520" y1="515" x2="758" y2="515" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>

<text x="640" y="606" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">Amber connector = an Adaptive Scope joining each node to its retention schedule.</text>
<text x="640" y="640" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">The schedule travels with the branch, not with any hand-maintained list.</text>
</svg>
