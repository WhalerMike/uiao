<!-- guardrail note -->
<rect x="60" y="640" width="1160" height="48" rx="8" fill="#0D1B2E"/>
<text x="640" y="665" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Oversharing remediation routed to the OrgPath owner</text>
