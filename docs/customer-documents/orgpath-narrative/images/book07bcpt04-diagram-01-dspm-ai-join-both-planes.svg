<text x="865" y="537" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">!</text>
<text x="775" y="566" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">threshold breach</text>
