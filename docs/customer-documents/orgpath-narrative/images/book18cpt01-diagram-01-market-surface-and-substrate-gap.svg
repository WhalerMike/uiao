<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Book 18 Ch.1 — The market is converged; the gap is underneath it. ADR-093 blueprint register. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="c1-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="74" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">The market is converged; the gap is underneath it</text>

  <!-- Top band: the converged IGA surface -->
  <rect x="60" y="112" width="1160" height="186" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="84" y="146" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#0D1B2E">The converged IGA market</text>
  <text x="84" y="172" font-size="15" fill="#5A5A5A">SailPoint · Saviynt · CyberArk · One Identity · Oracle · IBM · Microsoft Entra</text>

  <rect x="96"  y="198" width="252" height="78" rx="9" fill="#1E8C8C"/>
  <text x="222" y="232" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Request</text>
  <text x="222" y="256" text-anchor="middle" font-size="13" fill="#D7F2EE">access requests · approvals</text>

  <rect x="372" y="198" width="252" height="78" rx="9" fill="#1E8C8C"/>
  <text x="498" y="232" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Certify</text>
  <text x="498" y="256" text-anchor="middle" font-size="13" fill="#D7F2EE">reviews · recertification</text>

  <rect x="648" y="198" width="252" height="78" rx="9" fill="#1E8C8C"/>
  <text x="774" y="232" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Model</text>
  <text x="774" y="256" text-anchor="middle" font-size="13" fill="#D7F2EE">roles · entitlements · JML</text>

  <rect x="924" y="198" width="260" height="78" rx="9" fill="#1E8C8C"/>
  <text x="1054" y="232" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Separate</text>
  <text x="1054" y="256" text-anchor="middle" font-size="13" fill="#D7F2EE">segregation of duties</text>

  <text x="1196" y="146" text-anchor="end" font-size="15" font-style="italic" fill="#1E8C8C">Buy the best platform you can</text>

  <!-- The dividing line: the whole argument -->
  <line x1="60" y1="344" x2="1220" y2="344" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="640" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B" letter-spacing="0.5">— the gap is below this line —</text>

  <!-- Middle band: the organizational truth nobody owns -->
  <rect x="60" y="360" width="1160" height="64" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="640" y="389" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Organizational truth — who reports to whom, what department, which division, which boundary</text>
  <text x="640" y="411" text-anchor="middle" font-size="14" fill="#C0392B">Reached for by every workflow above · owned deterministically by none of them</text>

  <!-- composes-against arrows from substrate up into the market band -->
  <line x1="300" y1="560" x2="300" y2="426" stroke="#1E8C8C" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#c1-arrow-teal)"/>
  <line x1="980" y1="560" x2="980" y2="426" stroke="#1E8C8C" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#c1-arrow-teal)"/>
  <text x="640" y="452" text-anchor="middle" font-size="13" font-style="italic" fill="#1E8C8C">the workflows compose against it — they do not contain it</text>

  <!-- Bottom band: OrgPath substrate -->
  <rect x="60" y="476" width="1160" height="196" rx="12" fill="#0D1B2E"/>
  <text x="84" y="512" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#FFFFFF">OrgPath — the deterministic organizational substrate</text>
  <text x="84" y="538" font-size="15" fill="#A9B8CA">Complementary and differentiated: it makes every platform above it deterministic, and replaces none of them</text>

  <rect x="84"  y="560" width="212" height="92" rx="9" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="2"/>
  <text x="190" y="600" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">15-facet</text>
  <text x="190" y="622" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">substrate</text>

  <rect x="312" y="560" width="212" height="92" rx="9" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="2"/>
  <text x="418" y="600" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">governed</text>
  <text x="418" y="622" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">codebook</text>

  <rect x="540" y="560" width="212" height="92" rx="9" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="2"/>
  <text x="646" y="600" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">composable</text>
  <text x="646" y="622" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">hierarchy</text>

  <rect x="768" y="560" width="212" height="92" rx="9" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="2"/>
  <text x="874" y="600" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">typed drift</text>
  <text x="874" y="622" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">taxonomy</text>

  <rect x="996" y="560" width="200" height="92" rx="9" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1096" y="600" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">cross-boundary</text>
  <text x="1096" y="622" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">plane</text>
</svg>
