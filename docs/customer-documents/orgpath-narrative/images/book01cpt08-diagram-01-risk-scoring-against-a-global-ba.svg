<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Risk scored against a global baseline — blind</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">to organizational segments</text><rect x="340" y="150" width="600" height="100" rx="8" fill="#0D1B2E"/><text x="640" y="191.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">GLOBAL RISK BASELINE</text><text x="640" y="208.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">billions of sign-ins · one model · no org segments</text><rect x="60" y="300" width="560" height="300" rx="0" fill="#F7E2DE"/><rect x="60" y="300" width="10" height="300" rx="0" fill="#C0392B"/><text x="94" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#C0392B" text-anchor="start">FALSE POSITIVES</text><text x="94" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="start">High-tempo roles — travel, VPNs, shift</text><text x="94" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="start">hours, moving between facilities — look</text><text x="94" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="start">anomalous against the global average and</text><text x="94" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="start">get flagged, though nothing is wrong.</text><rect x="660" y="300" width="560" height="300" rx="0" fill="#F7E2DE"/><rect x="660" y="300" width="10" height="300" rx="0" fill="#C0392B"/><text x="694" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#C0392B" text-anchor="start">BLIND SPOTS</text><text x="694" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="start">A low-and-slow adversary that mimics the</text><text x="694" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="start">user's normal location, hours and device</text><text x="694" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="start">produces no meaningful signal at all —</text><text x="694" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="start">indistinguishable from the baseline.</text>
</svg>
