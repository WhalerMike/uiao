<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Dynamic group membership self-heals while PIM</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">eligibility drifts from organizational truth</text>

<!-- Source of truth: OrgTree registry -->
<rect x="400" y="130" width="480" height="86" rx="8" fill="#0D1B2E"/>
<text x="640" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree registry</text>
<text x="640" y="186" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">change event: division merge + node archival</text>

<!-- Left (teal) path -->
<line x1="540" y1="216" x2="290" y2="262" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<rect x="70" y="264" width="380" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="260" y="292" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Dynamic group membership</text>
<text x="260" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgPath rule re-evaluated automatically</text>
<line x1="260" y1="344" x2="260" y2="392" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<rect x="70" y="394" width="380" height="84" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="260" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Group membership stays aligned</text>
<text x="260" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">SELF-HEALING</text>

<!-- Right (red) path -->
<line x1="740" y1="216" x2="990" y2="262" stroke="#C0392B" stroke-width="2.4" marker-end="url(#ar-red)"/>
<rect x="830" y="264" width="400" height="80" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="1030" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">PIM eligibility schedule</text>
<text x="1030" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">bound to a principal at config time</text>
<text x="1030" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">no dynamic rule</text>

<line x1="1030" y1="344" x2="1030" y2="380" stroke="#C0392B" stroke-width="2.4" marker-end="url(#ar-red)"/>
<!-- three stacked red problem cards -->
<rect x="830" y="382" width="400" height="56" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="1030" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Missing eligibility for the new node</text>
<rect x="830" y="444" width="400" height="56" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="1030" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Stale eligibility for a departed user</text>
<rect x="830" y="506" width="400" height="56" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="1030" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Active eligibility for archived node, no members</text>

<!-- pipeline box and dashed amber arrow -->
<rect x="70" y="556" width="520" height="74" rx="8" fill="#0D1B2E"/>
<text x="330" y="582" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Set-PIMEligibleGroupsFromOrgPath.ps1</text>
<text x="330" y="610" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">creates missing · flags archived for review · never deletes silently</text>
<path d="M590,580 C720,580 720,460 828,460" fill="none" stroke="#D4A017" stroke-width="2.4" stroke-dasharray="8 5" marker-end="url(#ar-amber)"/>
<text x="700" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#D4A017" text-anchor="middle" dominant-baseline="central">remediates</text>
</svg>
