<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Access reviews scoped, routed, and paced by</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath and OrgTier</text>

<!-- Left column: Review Targets -->
<text x="60" y="142" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.4" fill="#5A5A5A" text-anchor="start">REVIEW TARGETS</text>
<rect x="60" y="155" width="240" height="46" rx="7" fill="#0D1B2E"/>
<text x="180" y="178" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">group memberships</text>
<rect x="60" y="209" width="240" height="46" rx="7" fill="#0D1B2E"/>
<text x="180" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">application and role assignments</text>
<rect x="60" y="263" width="240" height="46" rx="7" fill="#0D1B2E"/>
<text x="180" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">access-package assignments</text>
<rect x="60" y="317" width="240" height="46" rx="7" fill="#0D1B2E"/>
<text x="180" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">PIM eligible and active roles</text>
<rect x="60" y="371" width="240" height="46" rx="7" fill="#0D1B2E"/>
<text x="180" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">guest and B2B access</text>

<!-- arrows targets -> review definition -->
<line x1="300" y1="286" x2="360" y2="286" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- Center: Access Review Definition -->
<rect x="362" y="225" width="270" height="120" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="497" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Access Review Definition</text>
<text x="497" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">scoped by OrgPath node</text>
<text x="497" y="315" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">scope: /Root/Finance/Reporting</text>

<!-- resolve reviewer arrow up-right -->
<line x1="632" y1="255" x2="730" y2="205" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<text x="668" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#1E8C8C" text-anchor="middle">resolve</text>
<rect x="732" y="155" width="270" height="92" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="867" y="186" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Reviewer = OrgTree manager</text>
<text x="867" y="214" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">resolved from OrgPath</text>

<!-- set cadence arrow down-right -->
<line x1="632" y1="320" x2="730" y2="350" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<text x="675" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#1E8C8C" text-anchor="middle">set cadence</text>
<rect x="732" y="300" width="270" height="120" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="867" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Cadence keyed to OrgTier</text>
<text x="867" y="357" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Tier0  monthly</text>
<text x="867" y="382" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Tier1  quarterly</text>
<text x="867" y="407" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Tier2  annual</text>

<!-- decision box (centered lower) -->
<line x1="497" y1="345" x2="497" y2="475" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<rect x="362" y="478" width="270" height="100" rx="8" fill="#0D1B2E"/>
<text x="497" y="508" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Decision</text>
<text x="497" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A8E6DC" text-anchor="middle" dominant-baseline="central">Approve  -  keep access</text>
<text x="497" y="562" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#F2B8B0" text-anchor="middle" dominant-baseline="central">Deny  -  revoke</text>

<!-- deny path -> auto-apply -> decommission -->
<line x1="632" y1="540" x2="700" y2="540" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>
<text x="666" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#C0392B" text-anchor="middle">Deny</text>
<rect x="702" y="510" width="180" height="60" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="792" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Auto-apply</text>
<line x1="882" y1="540" x2="940" y2="540" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>
<rect x="942" y="500" width="200" height="80" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="1042" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">Decommission</text>
<text x="1042" y="554" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">removes the assignment</text>

<!-- dashed feedback to drift signal box at far right -->
<path d="M1042 500 C 1090 440, 1130 360, 1140 305" fill="none" stroke="#5A5A5A" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar-grey)"/>
<rect x="1042" y="225" width="178" height="78" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="1131" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Drift signal</text>
<text x="1131" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">feeds detection loop</text>
</svg>
