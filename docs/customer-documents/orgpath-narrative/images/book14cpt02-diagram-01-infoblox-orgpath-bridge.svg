<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath bridges the OrgTree registry into</text>
<text x="60" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E" text-anchor="start">the Infoblox DDI plane</text>

<!-- OrgTree registry -->
<rect x="50" y="290" width="210" height="160" rx="8" fill="#0D1B2E"/>
<text x="155" y="318" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree registry</text>
<text x="155" y="350" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Id</text>
<text x="155" y="374" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Path</text>
<text x="155" y="398" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Tier</text>
<text x="155" y="422" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">MigrationPhase</text>

<!-- Governance pipeline -->
<rect x="300" y="320" width="180" height="100" rx="8" fill="#0D1B2E"/>
<text x="390" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">governance</text>
<text x="390" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">pipeline</text>
<line x1="260" y1="370" x2="298" y2="370" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Upper branch: NIOS -->
<path d="M 480 350 C 540 350, 540 230, 600 230" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="510" y="178" width="320" height="24" rx="5" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1"/>
<text x="670" y="190" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">NIOS WAPI v2.12 · HTTP Basic</text>
<rect x="600" y="208" width="630" height="180" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="620" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">NIOS Grid Master</text>
<rect x="618" y="244" width="270" height="130" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="753" y="266" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">network · zone_auth</text>
<text x="753" y="290" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">extensible_attributes</text>
<text x="753" y="312" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">OrgPath · OrgNodeId</text>
<text x="753" y="334" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">OrgTier · MigrationPhase</text>
<text x="753" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">nested value pairs</text>
<rect x="900" y="244" width="316" height="130" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="1058" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">network and zone_auth objects</text>
<text x="1058" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">each stamped with a metadata</text>
<text x="1058" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">block of EA value pairs</text>

<!-- Lower branch: BloxOne -->
<path d="M 480 390 C 540 390, 540 510, 600 510" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="510" y="538" width="320" height="24" rx="5" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1"/>
<text x="670" y="550" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">BloxOne CSP · Bearer token</text>
<rect x="600" y="488" width="630" height="44" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="620" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">BloxOne DDI</text>
<rect x="600" y="568" width="500" height="74" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="850" y="590" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">subnet · auth_zone</text>
<text x="850" y="614" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">tags: OrgPath · OrgNodeId · OrgTier · MigrationPhase</text>
<text x="850" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">flat tags map</text>
<rect x="1110" y="568" width="120" height="74" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
<text x="1170" y="595" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#C0392B" text-anchor="middle" dominant-baseline="central">tag values</text>
<text x="1170" y="611" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#C0392B" text-anchor="middle" dominant-baseline="central">free-form,</text>
<text x="1170" y="627" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#C0392B" text-anchor="middle" dominant-baseline="central">validate in pipeline</text>

<!-- amber callout band -->
<rect x="600" y="400" width="630" height="48" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="915" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">inheritable EAs propagate from network container to child subnets</text>
</svg>
