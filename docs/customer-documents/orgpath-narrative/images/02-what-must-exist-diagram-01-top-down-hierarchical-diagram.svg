<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Six baseline requirements for AD-equivalent</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">governance</text><rect x="290" y="120" width="700" height="60" rx="8" fill="#1E3A66"/><text x="640" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Cloud stack inherits no governance substrate — flat directory, point tools, no shared model</text><line x1="640" y1="180" x2="640" y2="210" stroke="#5A5A5A" stroke-width="2.5" marker-end="url(#ar-grey)"/><rect x="390" y="212" width="500" height="56" rx="8" fill="#0D1B2E"/><text x="640" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Six baseline requirements</text><rect x="60" y="330" width="340" height="140" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><rect x="60" y="330" width="10" height="140" rx="0" fill="#1E8C8C"/><text x="640" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="middle" dominant-baseline="central"></text><text x="88" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="start">1. Representable</text><text x="245" y="416.74" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">structure encoded, not</text><text x="245" y="433.26" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">freeform strings</text><line x1="640" y1="268" x2="230" y2="324" stroke="#E3E8EF" stroke-width="1.4" marker-end="url(#ar-grey)"/><rect x="490" y="330" width="340" height="140" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><rect x="490" y="330" width="10" height="140" rx="0" fill="#1E8C8C"/><text x="640" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="middle" dominant-baseline="central"></text><text x="518" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="start">2. Derivable</text><text x="675" y="425" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">policy flows from position</text><line x1="640" y1="268" x2="660" y2="324" stroke="#E3E8EF" stroke-width="1.4" marker-end="url(#ar-grey)"/><rect x="920" y="330" width="340" height="140" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><rect x="920" y="330" width="10" height="140" rx="0" fill="#1E8C8C"/><text x="640" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="middle" dominant-baseline="central"></text><text x="948" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="start">3. Cross-surface</text><text x="1105" y="416.74" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">identity · device ·</text><text x="1105" y="433.26" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">server, one model</text><line x1="640" y1="268" x2="1090" y2="324" stroke="#E3E8EF" stroke-width="1.4" marker-end="url(#ar-grey)"/><rect x="60" y="500" width="340" height="140" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><rect x="60" y="500" width="10" height="140" rx="0" fill="#1E8C8C"/><text x="640" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="middle" dominant-baseline="central"></text><text x="88" y="544" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="start">4. Authoritative</text><text x="245" y="586.74" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">one governed registry of</text><text x="245" y="603.26" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">truth</text><line x1="640" y1="268" x2="230" y2="494" stroke="#E3E8EF" stroke-width="1.4" marker-end="url(#ar-grey)"/><rect x="490" y="500" width="340" height="140" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><rect x="490" y="500" width="10" height="140" rx="0" fill="#1E8C8C"/><text x="640" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="middle" dominant-baseline="central"></text><text x="518" y="544" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="start">5. Governable</text><text x="675" y="586.74" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">versioned, validated,</text><text x="675" y="603.26" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">auditable</text><line x1="640" y1="268" x2="660" y2="494" stroke="#E3E8EF" stroke-width="1.4" marker-end="url(#ar-grey)"/><rect x="920" y="500" width="340" height="140" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><rect x="920" y="500" width="10" height="140" rx="0" fill="#1E8C8C"/><text x="640" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="middle" dominant-baseline="central"></text><text x="948" y="544" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="start">6. Drift-detecting</text><text x="1105" y="595" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">continuous reconciliation</text><line x1="640" y1="268" x2="1090" y2="494" stroke="#E3E8EF" stroke-width="1.4" marker-end="url(#ar-grey)"/>
</svg>
