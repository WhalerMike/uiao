<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>

<text x="60" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Observed against governed — the three location drift classes</text>

<!-- Governed classification card (ice fill, navy border) -->
<rect x="80" y="130" width="420" height="170" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="290" y="166" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Governed classification</text>
<line x1="110" y1="188" x2="470" y2="188" stroke="#0D1B2E" stroke-width="1" opacity="0.35"/>
<text x="110" y="222" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#0D1B2E">diaApproved: false</text>
<text x="110" y="256" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#0D1B2E">telemetryBoundary: InternalOnly</text>

<!-- Observed site state card (white fill, grey outline) -->
<rect x="780" y="130" width="420" height="170" rx="10" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
<text x="990" y="166" font-size="20" font-weight="bold" fill="#33414F" text-anchor="middle" dominant-baseline="central">Observed site state</text>
<line x1="810" y1="188" x2="1170" y2="188" stroke="#5A5A5A" stroke-width="1" opacity="0.4"/>
<text x="810" y="222" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#33414F">internet egress: observed</text>
<text x="810" y="256" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#33414F">telemetry destination: external</text>

<!-- compare diamond (teal) -->
<path d="M640,158 L732,215 L640,272 L548,215 Z" fill="#1E8C8C"/>
<text x="640" y="215" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">compare</text>

<!-- arrows from cards into the diamond -->
<line x1="500" y1="215" x2="543" y2="215" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>
<line x1="780" y1="215" x2="737" y2="215" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-grey)"/>

<!-- three red arrows downward to the drift-class boxes -->
<line x1="610" y1="262" x2="248" y2="466" stroke="#C0392B" stroke-width="2.6" marker-end="url(#ar-red)"/>
<line x1="640" y1="272" x2="640" y2="466" stroke="#C0392B" stroke-width="2.6" marker-end="url(#ar-red)"/>
<line x1="670" y1="262" x2="1032" y2="466" stroke="#C0392B" stroke-width="1.4" marker-end="url(#ar-red)"/>

<!-- drift class boxes (red outline) -->
<rect x="60" y="470" width="360" height="90" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
<text x="240" y="503" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">DRIFT-AUTHZ::location-policy</text>
<text x="240" y="531" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#C0392B" text-anchor="middle" dominant-baseline="central">(P1)</text>

<rect x="460" y="470" width="360" height="90" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
<text x="640" y="503" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">DRIFT-BOUNDARY::location-boundary</text>
<text x="640" y="531" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#C0392B" text-anchor="middle" dominant-baseline="central">(P1)</text>

<rect x="860" y="470" width="360" height="90" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.4"/>
<text x="1040" y="515" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">DRIFT-IDENTITY::location-assignment</text>
<text x="1040" y="586" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">assignment cases arrive from the Mover</text>

<!-- grey note box: unregistered site -->
<rect x="60" y="624" width="620" height="62" rx="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.4"/>
<text x="84" y="648" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#5A5A5A">unregistered site observed: DRIFT-SEMANTIC,</text>
<text x="84" y="672" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#5A5A5A">registry gap, not a verdict</text>
</svg>
