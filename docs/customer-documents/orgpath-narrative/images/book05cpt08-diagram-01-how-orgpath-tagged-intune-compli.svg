<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">OrgPath compliance data to dashboards</text>

<!-- Managed device -->
<rect x="60" y="160" width="220" height="80" rx="8" fill="#0D1B2E"/>
<text x="170" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Managed device</text>
<text x="170" y="212" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">OrgPath attribute plus</text>
<text x="170" y="228" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">compliance state</text>

<!-- Intune diagnostic export -->
<rect x="60" y="290" width="220" height="80" rx="8" fill="#0D1B2E"/>
<text x="170" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Intune diagnostic export</text>
<text x="170" y="344" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">DeviceComplianceOrg</text>
<line x1="170" y1="240" x2="170" y2="288" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Log Analytics cylinder -->
<g>
 <ellipse cx="450" cy="300" rx="120" ry="24" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
 <path d="M330,300 L330,400 A120,24 0 0 0 570,400 L570,300" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
 <ellipse cx="450" cy="300" rx="120" ry="24" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
</g>
<text x="450" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Log Analytics workspace</text>
<text x="450" y="362" font-family="Consolas, monospace" font-size="10.5" fill="#33414F" text-anchor="middle">IntuneDeviceComplianceOrg</text>
<text x="450" y="378" font-family="Consolas, monospace" font-size="10.5" fill="#33414F" text-anchor="middle">table</text>
<line x1="280" y1="330" x2="328" y2="335" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- three query outputs -->
<rect x="720" y="120" width="500" height="90" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="970" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Q1  Workbook tile matrix</text>
<text x="970" y="174" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">Division by OrgPath</text>
<text x="970" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">compliance rate</text>

<rect x="720" y="240" width="500" height="90" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="970" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Q2  Sentinel analytics rule</text>
<text x="970" y="294" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">governance incident when</text>
<text x="970" y="312" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">count over zero</text>

<rect x="720" y="360" width="500" height="90" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="970" y="388" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Q3  Workbook time series</text>
<text x="970" y="414" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">30-day division drift with</text>
<text x="970" y="432" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">SLA reference line</text>

<!-- query arrows fan -->
<line x1="570" y1="340" x2="718" y2="180" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="570" y1="345" x2="718" y2="285" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="570" y1="350" x2="718" y2="405" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>

<!-- amber watchlist side box feeds Q2 -->
<rect x="420" y="500" width="300" height="90" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="570" y="528" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OrgTreeNodes Watchlist</text>
<text x="570" y="552" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">active node paths</text>
<text x="570" y="574" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#6B7A8D" text-anchor="middle">stale watchlist produces false positives</text>
<path d="M720,540 C780,540 850,400 850,332" fill="none" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
</svg>
