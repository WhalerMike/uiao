<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Group Policy inheritance and precedence</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">resolving down the OU tree</text><rect x="90" y="170" width="520" height="64" rx="7" fill="#0D1B2E"/><text x="350" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Site</text><line x1="350" y1="234" x2="350" y2="256" stroke="#5A5A5A" stroke-width="2.5" marker-end="url(#ar-grey)"/><rect x="90" y="262" width="520" height="64" rx="7" fill="#0D1B2E"/><text x="350" y="294" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Domain</text><line x1="350" y1="326" x2="350" y2="348" stroke="#5A5A5A" stroke-width="2.5" marker-end="url(#ar-grey)"/><rect x="90" y="354" width="520" height="64" rx="7" fill="#0D1B2E"/><text x="350" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Parent OU</text><line x1="350" y1="418" x2="350" y2="440" stroke="#5A5A5A" stroke-width="2.5" marker-end="url(#ar-grey)"/><rect x="90" y="446" width="520" height="64" rx="7" fill="#1E8C8C"/><text x="350" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Child OU  —  highest precedence</text><text x="90" y="560" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-style="italic" fill="#6B7A8D" text-anchor="start">GPOs accumulate as the client walks to the domain root</text><rect x="660" y="170" width="540" height="96" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/><text x="930" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">child OU wins on conflicting settings</text><rect x="660" y="300" width="260" height="96" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="790" y="340.65" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">WMI filter</text><text x="790" y="355.35" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">conditions on the machine</text><rect x="940" y="300" width="260" height="96" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="1070" y="340.65" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Security filter</text><text x="1070" y="355.35" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Apply Group Policy right</text><rect x="660" y="430" width="540" height="150" rx="0" fill="#F7E2DE"/><rect x="660" y="430" width="10" height="150" rx="0" fill="#C0392B"/><text x="690" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#C0392B" text-anchor="start">Domain-joined, on-prem only.</text><text x="690" y="505" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">No cloud engine computes effective policy from an object's</text><text x="690" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">position — and effective state needs gpresult on the machine.</text>
</svg>
