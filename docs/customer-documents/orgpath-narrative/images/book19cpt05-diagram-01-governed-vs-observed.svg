<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>

<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Two layers of location — governed and observed,</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">and the one rule between them</text>

<!-- Upper band: Primary LocPath (governed) -->
<rect x="60" y="140" width="700" height="130" rx="10" fill="#0D1B2E"/>
<text x="410" y="186" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">Primary LocPath — governed location of record</text>
<text x="410" y="228" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#C7D4E6">/USA/MD/ANNAPOLIS-HQ/BLDG-3 (from HR duty station)</text>

<!-- Teal arrows from governed band to three consumers -->
<line x1="760" y1="175" x2="876" y2="150" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<line x1="760" y1="205" x2="876" y2="222" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<line x1="760" y1="235" x2="876" y2="294" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- Three consumer boxes (ice fill, navy border) -->
<rect x="880" y="122" width="320" height="56" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="1040" y="150" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">E911 location of record</text>

<rect x="880" y="194" width="320" height="56" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="1040" y="222" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">Access reviews</text>

<rect x="880" y="266" width="320" height="56" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="1040" y="294" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">Matrix rules</text>

<!-- Red upward arrow, struck through: never overrides -->
<line x1="300" y1="430" x2="300" y2="288" stroke="#C0392B" stroke-width="4" marker-end="url(#ar-red)"/>
<line x1="272" y1="378" x2="328" y2="342" stroke="#C0392B" stroke-width="5"/>
<text x="344" y="360" dominant-baseline="central" font-size="20" font-weight="bold" fill="#C0392B">never overrides</text>

<!-- Lower band: Dynamic Location Context (observed) -->
<rect x="60" y="440" width="700" height="130" rx="10" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2.5"/>
<text x="410" y="486" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#33414F">Dynamic Location Context — observed</text>
<text x="410" y="528" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#5A5A5A">GPS / Wi-Fi / BLE / network + accuracy + confidence + timestamp</text>

<!-- Teal arrow from observed band to drift detection -->
<line x1="760" y1="505" x2="876" y2="505" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- Drift detection box (amber outline) -->
<rect x="880" y="466" width="320" height="78" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="2.5"/>
<text x="1040" y="494" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">Drift detection</text>
<text x="1040" y="520" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#5A5A5A">(persistent divergence)</text>

<!-- Layer captions -->
<text x="60" y="306" font-size="14" fill="#6B7A8D">governed layer — small, stable, authoritative</text>
<text x="60" y="606" font-size="14" fill="#6B7A8D">observed layer — rich, volatile, advisory</text>
</svg>
