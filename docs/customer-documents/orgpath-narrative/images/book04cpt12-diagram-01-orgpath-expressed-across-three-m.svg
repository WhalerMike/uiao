<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E">OrgPath expressed across three management</text><text x="60" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E">surfaces and reconciled into agreement</text>

<!-- center hybrid server -->
<rect x="540" y="320" width="200" height="90" rx="8" fill="#0D1B2E"/><text x="640" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Hybrid server</text><text x="640" y="382" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">/OPS/INFRA/SVCTIER1</text>

<!-- AD surface (left) -->
<rect x="60" y="170" width="320" height="100" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/><text x="220" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Active Directory computer object</text><text x="220" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">on-prem custom attribute</text><text x="220" y="248" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="middle">/OPS/INFRA/SVCTIER1</text>
<line x1="380" y1="230" x2="538" y2="335" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- Entra surface (top) -->
<rect x="480" y="160" width="320" height="100" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/><text x="640" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Entra ID device object</text><text x="640" y="212" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">directory schema extension attribute</text><text x="640" y="238" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="middle">/OPS/INFRA/SVCTIER1</text>
<line x1="640" y1="260" x2="640" y2="318" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- Arc surface (right, expanded) -->
<rect x="900" y="160" width="320" height="180" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/><text x="1060" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Azure Arc resource</text><text x="1060" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">resource tag</text>
<rect x="920" y="224" width="280" height="32" rx="5" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.2"/><text x="1060" y="240" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath = /OPS/INFRA/SVCTIER1</text>
<rect x="920" y="262" width="280" height="32" rx="5" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.2"/><text x="1060" y="278" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgNodeId = SVCTIER1</text>
<rect x="920" y="300" width="280" height="32" rx="5" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.2"/><text x="1060" y="316" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgTier = Tier0 / Tier1 / Tier2</text>
<line x1="900" y1="280" x2="742" y2="345" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- reconciliation check -->
<rect x="470" y="470" width="340" height="80" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/><text x="640" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">three-surface reconciliation</text><text x="640" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">compares all three values</text>
<line x1="640" y1="410" x2="640" y2="468" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>

<!-- divergence path -->
<rect x="850" y="468" width="380" height="84" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/><text x="1040" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle">High-severity finding</text><text x="1040" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">race condition, re-enrollment,</text><text x="1040" y="538" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">or recreated resource</text>
<line x1="810" y1="510" x2="848" y2="510" stroke="#C0392B" stroke-width="2.4" marker-end="url(#ar-red)"/><text x="830" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#C0392B" text-anchor="middle">divergence</text>
</svg>
