<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">OrgTree and OrgPath: the shared governance</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">substrate across every enterprise surface</text>

<!-- retired AD boundary -->
<rect x="44" y="150" width="150" height="430" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="119" y="350" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle" transform="rotate(-90 119 360)">Retired Active Directory perimeter</text>

<!-- propagation ring -->
<ellipse cx="640" cy="360" rx="290" ry="190" fill="none" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="3 4"/>
<rect x="372" y="262" width="160" height="24" rx="6" fill="#FFFFFF"/>
<text x="452" y="279" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">event-driven pipeline</text>

<!-- center hub -->
<rect x="500" y="295" width="280" height="64" rx="8" fill="#1F3A5F"/>
<text x="640" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OrgTree registry</text>
<text x="640" y="342" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">versioned governed JSON</text>
<rect x="500" y="363" width="280" height="60" rx="8" fill="#1E3A66"/>
<text x="640" y="386" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OrgPath positional attribute</text>
<text x="640" y="408" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">slash-delimited path</text>
<text x="640" y="448" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="middle">the single source of organizational truth</text>

<!-- 10 surface boxes around the perimeter -->
<!-- top row -->
<g font-family="Arial, sans-serif">
<rect x="230" y="150" width="180" height="56" rx="6" fill="#1E8C8C"/><text x="320" y="174" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Entra ID identity</text><text x="320" y="194" font-family="Consolas, monospace" font-size="9" fill="#EAF1FB" text-anchor="middle">user + device</text>
<rect x="430" y="150" width="180" height="56" rx="6" fill="#1E8C8C"/><text x="520" y="170" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Lifecycle Workflows</text><text x="520" y="190" font-size="11" fill="#EAF1FB" text-anchor="middle">+ Access Reviews</text>
<rect x="670" y="150" width="180" height="56" rx="6" fill="#1E8C8C"/><text x="760" y="174" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Privileged Identity</text><text x="760" y="194" font-size="11" fill="#EAF1FB" text-anchor="middle">Management</text>
<rect x="870" y="150" width="180" height="56" rx="6" fill="#1E8C8C"/><text x="960" y="174" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Microsoft Intune</text><text x="960" y="194" font-size="10" fill="#EAF1FB" text-anchor="middle">config + cert profiles</text>
</g>
<!-- right column -->
<g font-family="Arial, sans-serif">
<rect x="1060" y="240" width="180" height="56" rx="6" fill="#1E8C8C"/><text x="1150" y="274" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Azure RBAC</text>
<rect x="1060" y="332" width="180" height="56" rx="6" fill="#1E8C8C"/><text x="1150" y="366" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Microsoft Sentinel</text>
<rect x="1060" y="424" width="180" height="56" rx="6" fill="#1E8C8C"/><text x="1150" y="448" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Defender suite</text><text x="1150" y="467" font-size="9" fill="#EAF1FB" text-anchor="middle">Endpoint · Identity · Apps · Cloud</text>
</g>
<!-- bottom row -->
<g font-family="Arial, sans-serif">
<rect x="430" y="500" width="180" height="56" rx="6" fill="#1E8C8C"/><text x="520" y="524" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Azure Arc</text><text x="520" y="544" font-size="11" fill="#EAF1FB" text-anchor="middle">hybrid servers</text>
<rect x="670" y="500" width="180" height="56" rx="6" fill="#1E8C8C"/><text x="760" y="524" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Azure DNS</text><text x="760" y="544" font-size="10" fill="#EAF1FB" text-anchor="middle">zones + Private Resolver</text>
<rect x="870" y="500" width="180" height="56" rx="6" fill="#1E8C8C"/><text x="960" y="532" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Conditional Access</text>
</g>

<!-- fan-out arrows (representative) -->
<line x1="560" y1="295" x2="380" y2="208" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="600" y1="295" x2="540" y2="208" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="680" y1="295" x2="740" y2="208" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="720" y1="295" x2="940" y2="208" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="780" y1="320" x2="1058" y2="268" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="780" y1="360" x2="1058" y2="360" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="780" y1="400" x2="1058" y2="452" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="600" y1="423" x2="540" y2="498" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="680" y1="423" x2="760" y2="498" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="720" y1="423" x2="940" y2="498" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>

<!-- amber truth band -->
<rect x="44" y="600" width="1196" height="70" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="640" y="628" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Governed Git repository — the truth layer runs beneath all surfaces</text>
<text x="640" y="654" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle">commit markers: drift reports · decommissioning readiness scores</text>
</svg>
