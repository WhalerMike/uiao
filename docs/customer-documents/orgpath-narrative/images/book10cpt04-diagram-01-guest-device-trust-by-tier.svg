<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Closing the guest device-posture gap</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">by risk tier</text>

<!-- Guest identity -->
<rect x="50" y="200" width="230" height="90" rx="8" fill="#0D1B2E"/>
<text x="165" y="232" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GUEST IDENTITY</text>
<text x="165" y="262" font-family="Consolas, monospace" font-size="13" fill="#C7D4E6" text-anchor="middle">RiskTier</text>
<text x="165" y="280" font-family="Arial" font-size="11" fill="#9FB3CE" text-anchor="middle">from OrgPath stub</text>

<!-- Posture gap (red) -->
<rect x="50" y="320" width="230" height="80" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
<text x="165" y="350" font-family="Arial" font-size="12.5" font-weight="bold" fill="#C0392B" text-anchor="middle">NO HOST-TENANT</text>
<text x="165" y="370" font-family="Arial" font-size="12.5" font-weight="bold" fill="#C0392B" text-anchor="middle">INTUNE ENROLLMENT</text>
<text x="165" y="390" font-family="Arial" font-size="11" font-style="italic" fill="#C0392B" text-anchor="middle">the posture gap</text>

<!-- Decision diamond -->
<polygon points="490,210 640,300 490,390 340,300" fill="#0D1B2E"/>
<text x="490" y="288" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SELECT MECHANISM</text>
<text x="490" y="308" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BY OrgPath</text>
<text x="490" y="328" font-family="Consolas, monospace" font-size="12" fill="#C7D4E6" text-anchor="middle">RiskTier</text>

<!-- arrows into diamond -->
<line x1="280" y1="245" x2="345" y2="280" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="280" y1="360" x2="345" y2="320" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Lane 1 (teal) -->
<rect x="730" y="150" width="370" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="915" y="178" font-family="Arial" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Tier 1 high-trust</text>
<text x="915" y="202" font-family="Arial" font-size="12" fill="#33414F" text-anchor="middle">Inbound trust for device compliance</text>
<text x="915" y="222" font-family="Arial" font-size="12" fill="#33414F" text-anchor="middle">claims via Cross-Tenant Access Settings</text>

<!-- Lane 2 (teal) -->
<rect x="730" y="255" width="370" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="915" y="283" font-family="Arial" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Tier 1 high-trust</text>
<text x="915" y="307" font-family="Arial" font-size="12" fill="#33414F" text-anchor="middle">Inbound trust for hybrid-join</text>
<text x="915" y="327" font-family="Arial" font-size="12" fill="#33414F" text-anchor="middle">claims via Cross-Tenant Access Settings</text>

<!-- Lane 3 (amber) -->
<rect x="730" y="360" width="370" height="110" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
<text x="915" y="386" font-family="Arial" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Tier 2 standard and unregistered</text>
<text x="915" y="410" font-family="Arial" font-size="12" fill="#33414F" text-anchor="middle">Defender for Cloud Apps session policies</text>
<text x="915" y="428" font-family="Arial" font-size="12" fill="#33414F" text-anchor="middle">through the reverse proxy enforcing</text>
<text x="915" y="446" font-family="Arial" font-size="12" fill="#33414F" text-anchor="middle">download block, watermark, copy-paste restriction</text>

<!-- diamond to lanes -->
<path d="M640,290 L690,195 L728,195" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="640" y1="300" x2="728" y2="300" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<path d="M640,310 L690,415 L728,415" fill="none" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>

<!-- Convergence box -->
<rect x="380" y="560" width="520" height="80" rx="8" fill="#0D1B2E"/>
<text x="640" y="592" font-family="Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">HOST CONDITIONAL ACCESS</text>
<text x="640" y="616" font-family="Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GRANT SATISFIED</text>

<!-- lanes converge to box, dropping from the right edge to avoid crossing the lane boxes -->
<path d="M1100,415 L1150,415 L1150,520 L640,520 L640,558" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-navy)"/>
</svg>
