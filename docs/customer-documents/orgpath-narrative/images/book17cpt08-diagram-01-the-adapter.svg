<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">OrgTreePolicyTargetingAdapter dispatches</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">by transport to three sub-adapters</text>

<!-- parent box -->
<rect x="360" y="130" width="560" height="74" rx="8" fill="#0D1B2E"/>
<text x="640" y="158" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTreePolicyTargetingAdapter</text>
<text x="640" y="182" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#9FB2CC" text-anchor="middle" dominant-baseline="central">was EntraPolicyTargetingAdapter</text>

<!-- three child sub-adapters -->
<rect x="100" y="270" width="300" height="64" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="250" y="302" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">IntunePolicyTargeting</text>
<text x="250" y="320" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">SubAdapter</text>

<rect x="490" y="270" width="300" height="64" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="640" y="302" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">ArcPolicyTargeting</text>
<text x="640" y="320" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">SubAdapter</text>

<rect x="880" y="270" width="300" height="64" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2.4"/>
<text x="1030" y="302" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NacPolicyTargeting</text>
<text x="1030" y="320" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">SubAdapter</text>

<!-- vertical connectors parent -> children -->
<line x1="640" y1="204" x2="640" y2="234" stroke="#0D1B2E" stroke-width="2"/>
<line x1="250" y1="234" x2="1030" y2="234" stroke="#0D1B2E" stroke-width="2"/>
<line x1="250" y1="234" x2="250" y2="268" stroke="#0D1B2E" stroke-width="2" marker-end="url(#ar-navy)"/>
<line x1="640" y1="234" x2="640" y2="268" stroke="#0D1B2E" stroke-width="2" marker-end="url(#ar-navy)"/>
<line x1="1030" y1="234" x2="1030" y2="268" stroke="#0D1B2E" stroke-width="2" marker-end="url(#ar-navy)"/>

<!-- NAC fans to 4 leaves -->
<line x1="1030" y1="334" x2="1030" y2="380" stroke="#0D1B2E" stroke-width="2"/>
<line x1="195" y1="380" x2="1030" y2="380" stroke="#0D1B2E" stroke-width="2"/>
<line x1="195" y1="380" x2="195" y2="412" stroke="#0D1B2E" stroke-width="2" marker-end="url(#ar-navy)"/>
<line x1="445" y1="380" x2="445" y2="412" stroke="#0D1B2E" stroke-width="2" marker-end="url(#ar-navy)"/>
<line x1="695" y1="380" x2="695" y2="412" stroke="#0D1B2E" stroke-width="2" marker-end="url(#ar-navy)"/>
<line x1="945" y1="380" x2="945" y2="412" stroke="#0D1B2E" stroke-width="2" marker-end="url(#ar-navy)"/>

<!-- 4 leaf boxes -->
<rect x="100" y="414" width="190" height="70" rx="8" fill="#0D1B2E"/>
<text x="195" y="440" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">cisco-ise</text>
<text x="195" y="466" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#9FB2CC" text-anchor="middle" dominant-baseline="central">plan apply reconcile</text>

<rect x="350" y="414" width="190" height="70" rx="8" fill="#0D1B2E"/>
<text x="445" y="440" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">aruba-clearpass</text>
<text x="445" y="466" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#9FB2CC" text-anchor="middle" dominant-baseline="central">plan apply reconcile</text>

<rect x="600" y="414" width="190" height="70" rx="8" fill="#0D1B2E"/>
<text x="695" y="440" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">entra-radius</text>
<text x="695" y="466" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#9FB2CC" text-anchor="middle" dominant-baseline="central">plan apply reconcile</text>

<rect x="850" y="414" width="190" height="70" rx="8" fill="#0D1B2E"/>
<text x="945" y="440" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">nps</text>
<text x="945" y="466" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#9FB2CC" text-anchor="middle" dominant-baseline="central">plan apply reconcile</text>

<!-- path label under leaves -->
<text x="570" y="520" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">src/uiao/adapters/network-aaa/{aaa_server}/</text>

<!-- amber callout on the right pointing at NAC sub-adapter -->
<rect x="1080" y="380" width="180" height="80" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1170" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">missing and phantom</text>
<text x="1170" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">ops then governance</text>
<text x="1170" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">review, never auto</text>
<line x1="1180" y1="334" x2="1170" y2="378" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
</svg>
