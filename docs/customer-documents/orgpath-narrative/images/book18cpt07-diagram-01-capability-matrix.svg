<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Book 18 Ch.7 — The capability matrix, read honestly. ADR-093 blueprint register. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="60" y="74" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">The capability matrix, read honestly</text>

  <!-- header row -->
  <rect x="60" y="104" width="1160" height="56" rx="9" fill="#0D1B2E"/>
  <text x="84" y="138" font-size="16" font-weight="bold" fill="#FFFFFF">Differentiated capability</text>
  <text x="610" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">IGA platforms</text>
  <text x="830" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Microsoft primitives</text>
  <text x="1080" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#D7F2EE">OrgPath</text>

  <!-- column separators (light) over body -->
  <!-- OrgPath column highlight -->
  <rect x="940" y="166" width="280" height="320" rx="9" fill="#D7F2EE"/>

  <!-- rows -->
  <!-- helper: each row rect + capability text + marks -->
  <!-- Row 1 y166 -->
  <rect x="60" y="166" width="876" height="56" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.2"/>
  <text x="84" y="200" font-size="16" font-weight="bold" fill="#0D1B2E">Deterministic 15-facet substrate</text>
  <!-- Row 2 y230 -->
  <rect x="60" y="230" width="876" height="56" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.2"/>
  <text x="84" y="264" font-size="16" font-weight="bold" fill="#0D1B2E">Governed codebook · per-facet enumeration</text>
  <!-- Row 3 y294 -->
  <rect x="60" y="294" width="876" height="56" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.2"/>
  <text x="84" y="328" font-size="16" font-weight="bold" fill="#0D1B2E">Composable hierarchy · inherited targeting</text>
  <!-- Row 4 y358 -->
  <rect x="60" y="358" width="876" height="56" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.2"/>
  <text x="84" y="392" font-size="16" font-weight="bold" fill="#0D1B2E">Typed five-class drift taxonomy</text>
  <!-- Row 5 y422 -->
  <rect x="60" y="422" width="876" height="56" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.2"/>
  <text x="84" y="456" font-size="16" font-weight="bold" fill="#0D1B2E">Single reconciled cross-boundary plane</text>

  <!-- marks: X red for IGA(610) and MS(830); check teal for OrgPath(1080). Row centers:194,258,322,386,450 -->
  <!-- IGA column X -->
  <g stroke="#C0392B" stroke-width="4" stroke-linecap="round">
    <line x1="598" y1="182" x2="622" y2="206"/><line x1="622" y1="182" x2="598" y2="206"/>
    <line x1="598" y1="246" x2="622" y2="270"/><line x1="622" y1="246" x2="598" y2="270"/>
    <line x1="598" y1="310" x2="622" y2="334"/><line x1="622" y1="310" x2="598" y2="334"/>
    <line x1="598" y1="374" x2="622" y2="398"/><line x1="622" y1="374" x2="598" y2="398"/>
    <line x1="598" y1="438" x2="622" y2="462"/><line x1="622" y1="438" x2="598" y2="462"/>
  </g>
  <!-- MS column X -->
  <g stroke="#C0392B" stroke-width="4" stroke-linecap="round">
    <line x1="818" y1="182" x2="842" y2="206"/><line x1="842" y1="182" x2="818" y2="206"/>
    <line x1="818" y1="246" x2="842" y2="270"/><line x1="842" y1="246" x2="818" y2="270"/>
    <line x1="818" y1="310" x2="842" y2="334"/><line x1="842" y1="310" x2="818" y2="334"/>
    <line x1="818" y1="374" x2="842" y2="398"/><line x1="842" y1="374" x2="818" y2="398"/>
    <line x1="818" y1="438" x2="842" y2="462"/><line x1="842" y1="438" x2="818" y2="462"/>
  </g>
  <!-- OrgPath column checks -->
  <g stroke="#1E8C8C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M1066,194 l8,9 l16,-18"/>
    <path d="M1066,258 l8,9 l16,-18"/>
    <path d="M1066,322 l8,9 l16,-18"/>
    <path d="M1066,386 l8,9 l16,-18"/>
    <path d="M1066,450 l8,9 l16,-18"/>
  </g>

  <!-- buy above / build below -->
  <rect x="60" y="500" width="1160" height="50" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="640" y="531" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Above the line — buy the best IGA platform you can</text>

  <line x1="60" y1="562" x2="1220" y2="562" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="640" y="557" text-anchor="middle" font-size="12" font-weight="bold" fill="#C0392B">the dotted line is the whole argument</text>

  <rect x="60" y="574" width="1160" height="50" rx="9" fill="#0D1B2E"/>
  <text x="640" y="605" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Below the line — build the substrate (these five); there is nothing to buy</text>

  <text x="640" y="662" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1E8C8C">Buy the platform. Build the substrate — an addition, never a replacement.</text>
</svg>
