<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">OrgPath drives three parallel policy</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">transports keyed to one OrgTree group</text>

<!-- Central navy box -->
<rect x="80" y="280" width="300" height="120" rx="8" fill="#0D1B2E"/>
<text x="230" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree-* dynamic group</text>
<text x="230" y="360" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">UIAO_152</text>

<!-- Three teal branches -->
<!-- branch 1 -->
<line x1="380" y1="300" x2="678" y2="220" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<rect x="680" y="180" width="320" height="74" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="840" y="208" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Intune</text>
<text x="840" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">configuration transport</text>

<!-- branch 2 -->
<line x1="380" y1="340" x2="678" y2="340" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<rect x="680" y="303" width="320" height="74" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="840" y="331" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure Policy</text>
<text x="840" y="353" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">workload transport</text>

<!-- branch 3 highlighted -->
<line x1="380" y1="380" x2="678" y2="460" stroke="#1E8C8C" stroke-width="3.2" marker-end="url(#ar-teal)"/>
<rect x="680" y="426" width="320" height="74" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="3"/>
<text x="840" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NAC</text>
<text x="840" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">admission transport</text>

<!-- amber callout under third branch -->
<rect x="680" y="520" width="320" height="56" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="840" y="548" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">ADR-073 — dual to triple transport</text>

<!-- monospace inset: nac_assignments fields, lower right -->
<rect x="1030" y="426" width="210" height="150" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.6"/>
<text x="1045" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#6B7A8D" text-anchor="start">nac_assignments</text>
<text x="1045" y="476" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="start">aaa_server</text>
<text x="1045" y="498" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="start">policy_ref</text>
<text x="1045" y="520" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="start">target_group</text>
<text x="1045" y="542" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="start">enforcement</text>
<text x="1045" y="564" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="start">intent</text>
</svg>
