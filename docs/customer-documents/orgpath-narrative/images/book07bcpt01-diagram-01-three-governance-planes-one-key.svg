<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Three governance planes share one OrgPath join key</text>

<!-- Root registry -->
<rect x="440" y="108" width="400" height="62" rx="8" fill="#0D1B2E"/>
<text x="640" y="132" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Governed OrgTree registry</text>
<text x="640" y="153" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">/Root</text>

<!-- amber fan from root -->
<line x1="560" y1="170" x2="220" y2="222" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<line x1="640" y1="170" x2="640" y2="222" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<line x1="720" y1="170" x2="1060" y2="222" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<text x="640" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#9A7611" text-anchor="middle" dominant-baseline="central">OrgPath join key</text>

<!-- LEFT LANE: User policy plane -->
<rect x="60" y="228" width="320" height="380" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.6"/>
<rect x="60" y="228" width="320" height="40" rx="10" fill="#D7F2EE"/>
<rect x="60" y="248" width="320" height="20" fill="#D7F2EE"/>
<text x="220" y="249" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">User policy plane &#183; Book 07</text>
<rect x="84" y="296" width="272" height="118" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="220" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Adaptive policy scopes</text>
<text x="220" y="360" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">filter on OrgPath</text>
<rect x="84" y="438" width="272" height="148" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="220" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Sensitivity labels</text>
<text x="220" y="506" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">DLP</text>
<text x="220" y="528" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">retention</text>
<text x="220" y="550" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">eDiscovery</text>

<!-- CENTER LANE: Data plane -->
<rect x="480" y="228" width="320" height="380" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.6"/>
<rect x="480" y="228" width="320" height="40" rx="10" fill="#D7F2EE"/>
<rect x="480" y="248" width="320" height="20" fill="#D7F2EE"/>
<text x="640" y="249" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">Data plane &#183; Book 07a</text>
<rect x="504" y="296" width="272" height="118" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="640" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Fabric domain</text>
<text x="640" y="362" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">assignment by OrgPath</text>
<rect x="504" y="438" width="272" height="148" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="640" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OneLake lakehouse</text>
<text x="640" y="516" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">mirror inheritance</text>

<!-- RIGHT LANE: Risk and AI plane -->
<rect x="900" y="228" width="320" height="380" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.6"/>
<rect x="900" y="228" width="320" height="40" rx="10" fill="#FBEED2"/>
<rect x="900" y="248" width="320" height="20" fill="#FBEED2"/>
<text x="1060" y="249" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#9A7611" text-anchor="middle" dominant-baseline="central">Risk and AI plane &#183; Book 07b</text>
<rect x="924" y="288" width="272" height="86" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="1060" y="318" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Insider Risk Management</text>
<text x="1060" y="344" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">scope</text>
<rect x="924" y="386" width="272" height="86" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="1060" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Communication Compliance</text>
<text x="1060" y="442" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">supervision</text>
<rect x="924" y="484" width="272" height="100" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="1060" y="514" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">DSPM for AI</text>
<text x="1060" y="540" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">Copilot exposure</text>
<!-- red violation marker on right lane only -->
<circle cx="1196" cy="288" r="11" fill="#C0392B"/>
<text x="1196" y="289" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">&#215;</text>
<text x="1196" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="end" dominant-baseline="central">over-scoped policy blocked</text>

<!-- guardrail band -->
<rect x="60" y="628" width="1160" height="56" rx="8" fill="#0D1B2E"/>
<text x="640" y="656" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Least-privilege scoping &#183; privacy review required</text>
</svg>
