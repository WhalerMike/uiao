<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">Node groups versus branch groups</text>
<text x="60" y="92" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6B7A8D">Same OrgTree subtree, two membership rules</text>

<!-- Dashed branch boundary enclosing whole subtree -->
<rect x="70" y="150" width="470" height="490" rx="14" fill="none" stroke="#1E8C8C" stroke-width="1.6" stroke-dasharray="8 5"/>

<!-- OrgTree nodes -->
<rect x="170" y="170" width="270" height="56" rx="8" fill="#0D1B2E"/>
<text x="305" y="198" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">NCR / Finance</text>

<rect x="100" y="320" width="290" height="56" rx="8" fill="#0D1B2E"/>
<text x="245" y="348" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">NCR / Finance / GRC</text>

<rect x="420" y="320" width="200" height="56" rx="8" fill="#0D1B2E"/>
<text x="520" y="348" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">NCR / Finance / Service</text>

<rect x="100" y="490" width="320" height="56" rx="8" fill="#F2F4F7" stroke="#5A5A5A" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="260" y="510" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#33414F" text-anchor="middle" dominant-baseline="central">the path stops at Division</text>
<text x="260" y="528" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">finer tiers ride facets 11-14, not the path</text>

<!-- tree connectors -->
<line x1="305" y1="226" x2="245" y2="318" stroke="#5A5A5A" stroke-width="1.6"/>
<line x1="305" y1="226" x2="520" y2="318" stroke="#5A5A5A" stroke-width="1.6"/>
<line x1="245" y1="376" x2="260" y2="488" stroke="#5A5A5A" stroke-width="1.4" stroke-dasharray="6 4"/>

<!-- Right: two group boxes -->
<rect x="700" y="200" width="500" height="120" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="950" y="230" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">ORG-NODE-FINANCE</text>
<text x="950" y="262" font-family="Consolas, monospace" font-size="13" fill="#33414F" text-anchor="middle">extensionAttribute15 -eq "Region=NCR|Department=Finance|"</text>
<text x="950" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="middle">matches exactly one node</text>

<rect x="700" y="400" width="500" height="120" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="950" y="430" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">ORG-BRANCH-FINANCE</text>
<text x="950" y="462" font-family="Consolas, monospace" font-size="11.5" fill="#33414F" text-anchor="middle">extensionAttribute15 -startsWith "Region=NCR|Department=Finance|"</text>
<text x="950" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="middle">matches the whole subtree</text>

<!-- NODE group single connector to ONLY NCR / Finance -->
<line x1="700" y1="240" x2="442" y2="200" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- BRANCH group connectors to all four nodes -->
<line x1="700" y1="448" x2="442" y2="202" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="700" y1="460" x2="392" y2="348" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="700" y1="470" x2="622" y2="348" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>

<!-- amber note: trailing slash mandatory -->
<rect x="700" y="560" width="500" height="56" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="950" y="582" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">The trailing delimiter is mandatory</text>
<text x="950" y="602" font-family="Consolas, monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">Department=Finance| never matches Department=FinanceOps|</text><!-- orgpath-codebook-allow: FinanceOps is the collision illustration -->
</svg>
