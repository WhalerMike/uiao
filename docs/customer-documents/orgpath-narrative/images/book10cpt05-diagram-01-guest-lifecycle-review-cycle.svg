<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">OrgPath and GuestSponsorPath bind a guest</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">to its quarterly review cycle</text>

<!-- Top stage boxes -->
<rect x="60" y="140" width="240" height="64" rx="8" fill="#0D1B2E"/>
<text x="180" y="178" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF" text-anchor="middle">invitation</text>
<rect x="510" y="140" width="260" height="64" rx="8" fill="#0D1B2E"/>
<text x="640" y="178" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF" text-anchor="middle">active relationship</text>
<rect x="980" y="140" width="240" height="64" rx="8" fill="#0D1B2E"/>
<text x="1100" y="178" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF" text-anchor="middle">expiration</text>
<line x1="300" y1="172" x2="508" y2="172" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>
<line x1="770" y1="172" x2="978" y2="172" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>

<!-- invitation-time function -->
<rect x="60" y="250" width="240" height="60" rx="8" fill="#0D1B2E"/>
<text x="180" y="276" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">invitation-time function</text>
<text x="180" y="296" font-family="Arial" font-size="11" fill="#C7D4E6" text-anchor="middle">writes two attributes</text>
<line x1="180" y1="204" x2="180" y2="248" stroke="#0D1B2E" stroke-width="2.2" marker-end="url(#ar-navy)"/>

<!-- guest-object card (teal) -->
<rect x="60" y="350" width="240" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="180" y="378" font-family="Arial" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">guest-object card</text>
<text x="180" y="406" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="middle">OrgPath stub</text>
<text x="180" y="430" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="middle">GuestSponsorPath</text>
<line x1="180" y1="310" x2="180" y2="348" stroke="#0D1B2E" stroke-width="2.2" marker-end="url(#ar-navy)"/>

<!-- sponsor OrgPath node (amber) -->
<rect x="60" y="500" width="240" height="100" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
<text x="180" y="528" font-family="Arial" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">sponsor OrgPath node</text>
<text x="180" y="556" font-family="Arial" font-size="11.5" fill="#33414F" text-anchor="middle">queryable link to the</text>
<text x="180" y="574" font-family="Arial" font-size="11.5" fill="#33414F" text-anchor="middle">internal team that</text>
<text x="180" y="592" font-family="Arial" font-size="11.5" fill="#33414F" text-anchor="middle">initiated the relationship</text>
<line x1="180" y1="430" x2="180" y2="498" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<text x="300" y="468" font-family="Arial" font-size="11" font-style="italic" fill="#D4A017" text-anchor="start">GuestSponsorPath</text>

<!-- quarterly access review (teal) -->
<rect x="500" y="340" width="280" height="120" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="640" y="368" font-family="Arial" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">quarterly Access Review</text>
<text x="640" y="394" font-family="Arial" font-size="12" fill="#33414F" text-anchor="middle">fourteen-day window</text>
<text x="640" y="414" font-family="Arial" font-size="12" fill="#33414F" text-anchor="middle">scoped to partner dynamic group</text>
<text x="640" y="436" font-family="Arial" font-size="12" fill="#33414F" text-anchor="middle">sponsor group resolved as reviewers</text>
<line x1="640" y1="204" x2="640" y2="338" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- approve loop back to active relationship -->
<path d="M780,370 L860,370 L860,210" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="870" y="300" font-family="Arial" font-size="12" font-weight="bold" fill="#1E8C8C" text-anchor="start">approve</text>

<!-- deny to account disabled (red) -->
<rect x="980" y="400" width="240" height="100" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
<text x="1100" y="436" font-family="Arial" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle">account disabled</text>
<text x="1100" y="464" font-family="Arial" font-size="12" fill="#C0392B" text-anchor="middle">thirty-day retention</text>
<path d="M780,430 L880,450 L978,450" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>
<text x="830" y="478" font-family="Arial" font-size="11.5" font-weight="bold" fill="#C0392B" text-anchor="middle">default decision: deny</text>
<text x="830" y="494" font-family="Arial" font-size="11" font-style="italic" fill="#C0392B" text-anchor="middle">no reviewer action</text>

<!-- dashed return arrow to sponsor OrgPath node -->
<path d="M500,440 L400,560 L302,560" fill="none" stroke="#5A5A5A" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar-navy)"/>
<text x="430" y="520" font-family="Arial" font-size="11.5" font-style="italic" fill="#5A5A5A" text-anchor="middle">review routed to sponsor</text>
</svg>
