<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">The complete OrgTree-to-Defender</text>
<text x="60" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">end-to-end architecture</text>

<!-- Stage labels -->
<text x="160" y="148" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D" text-anchor="middle">STAGE 1 — DERIVATION</text>
<text x="640" y="148" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D" text-anchor="middle">STAGE 2 — DEFENDER LAYERS</text>
<text x="1095" y="148" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D" text-anchor="middle">STAGE 3 / 4</text>

<!-- Stage 1: OrgTree registry -->
<rect x="40" y="165" width="240" height="78" rx="8" fill="#0D1B2E"/>
<text x="160" y="192" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree registry</text>
<text x="160" y="216" font-family="Arial, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Git, versioned; tier + MDEBoundary</text>

<!-- ETL pipeline -->
<rect x="40" y="263" width="240" height="60" rx="8" fill="#0D1B2E"/>
<text x="160" y="293" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ETL pipeline derives OrgPath</text>
<line x1="160" y1="243" x2="160" y2="261" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- OrgPath targets fan -->
<rect x="40" y="343" width="240" height="56" rx="8" fill="#0D1B2E"/>
<text x="160" y="365" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgPath on users + devices</text>
<text x="160" y="383" font-family="Arial, sans-serif" font-size="10" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">(Entra extension attr)</text>

<rect x="40" y="409" width="240" height="50" rx="8" fill="#0D1B2E"/>
<text x="160" y="434" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgPath resource tag on Arc servers</text>
<line x1="160" y1="323" x2="160" y2="341" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- Dynamic group library -->
<rect x="40" y="490" width="240" height="78" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="160" y="516" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Dynamic group library</text>
<text x="160" y="540" font-family="Consolas, monospace" font-size="10.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">ORG-BRANCH-{NodeId}</text>
<text x="160" y="556" font-family="Arial, sans-serif" font-size="10" fill="#33414F" text-anchor="middle" dominant-baseline="central">leaf and branch groups</text>
<line x1="160" y1="459" x2="160" y2="488" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- Stage 2: four Defender layers -->
<rect x="430" y="165" width="420" height="62" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="640" y="188" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Defender for Endpoint</text>
<text x="640" y="208" font-family="Arial, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">device groups + RBAC</text>

<rect x="430" y="245" width="420" height="62" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="640" y="268" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Defender for Identity</text>
<text x="640" y="288" font-family="Arial, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">MDI profile + Sentinel rules</text>

<rect x="430" y="325" width="420" height="62" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="640" y="348" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Defender for Cloud Apps</text>
<text x="640" y="368" font-family="Arial, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">CA App Control by segment</text>

<rect x="430" y="405" width="420" height="62" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="640" y="428" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Defender for Cloud</text>
<text x="640" y="448" font-family="Arial, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">Azure Policy by OrgPath tag</text>

<!-- group library to defender layers -->
<line x1="280" y1="510" x2="428" y2="200" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="280" y1="515" x2="428" y2="280" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="280" y1="520" x2="428" y2="356" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="280" y1="525" x2="428" y2="436" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>

<!-- Stage 3: unified workbook -->
<rect x="930" y="240" width="320" height="95" rx="8" fill="#0D1B2E"/>
<text x="1090" y="268" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Unified Sentinel workbook</text>
<text x="1090" y="296" font-family="Arial, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">posture by OrgPath segment</text>
<text x="1090" y="316" font-family="Arial, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">(Stage 3)</text>

<line x1="850" y1="196" x2="928" y2="265" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="850" y1="276" x2="928" y2="280" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="850" y1="356" x2="928" y2="300" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="850" y1="436" x2="928" y2="320" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>

<!-- Stage 4: Logic App playbook -->
<rect x="930" y="400" width="320" height="95" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1090" y="428" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Logic App playbook</text>
<text x="1090" y="456" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">reads OrgPath, applies</text>
<text x="1090" y="474" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">governance response matrix (Stage 4)</text>

<line x1="1090" y1="335" x2="1090" y2="398" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- Feedback loop -->
<path d="M 1090 495 L 1090 620 L 160 620 L 160 460" fill="none" stroke="#D4A017" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar-amber)"/>
<text x="640" y="612" font-family="Arial, sans-serif" font-size="12.5" fill="#D4A017" text-anchor="middle">governance change via pull request</text>

<text x="60" y="678" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="start">One organizational hierarchy flows from registry to enriched alert, with governance changes closing the loop.</text>
</svg>
