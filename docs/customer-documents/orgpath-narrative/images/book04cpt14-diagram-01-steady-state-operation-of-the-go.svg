<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#0D1B2E">Steady-state operation: what runs itself, and</text><text x="60" y="93" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#0D1B2E">the human judgment that governs it</text>

<!-- Automated drift loop (left) -->
<rect x="50" y="130" width="280" height="80" rx="8" fill="#0D1B2E"/><text x="190" y="160" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Daily drift detection</text><text x="190" y="184" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6" text-anchor="middle">02:00 &#8594; report</text>
<rect x="50" y="270" width="280" height="160" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/><text x="190" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Morning drift-finding review</text><text x="190" y="318" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">on-call engineer</text><text x="190" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">Critical &#8594; investigate +</text><text x="190" y="364" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#0D1B2E" text-anchor="middle">Set-OrgPathManual.ps1</text><text x="190" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">High &#8594; run ETL against</text><text x="190" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">the object</text>
<line x1="190" y1="210" x2="190" y2="268" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<path d="M 330,350 C 380,350 380,180 332,170" fill="none" stroke="#5A5A5A" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar-grey)"/><text x="408" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6B7A8D" text-anchor="middle">findings inform</text><text x="408" y="277" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6B7A8D" text-anchor="middle">the model</text>

<!-- OrgTree change request branch (center/right) -->
<rect x="500" y="130" width="320" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/><text x="660" y="160" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OrgTree change request</text><text x="660" y="184" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle">PR against registry/orgtree.yaml</text>
<rect x="500" y="250" width="320" height="70" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/><text x="660" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Reviewed + merged</text><text x="660" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">by the governance lead</text>
<rect x="500" y="360" width="320" height="60" rx="8" fill="#0D1B2E"/><text x="660" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Gitea post-receive webhook fires</text><text x="660" y="404" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#C7D4E6" text-anchor="middle">Invoke-OrgPathPropagation.ps1</text>
<rect x="500" y="460" width="320" height="110" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="660" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Propagation</text><text x="660" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">writes updated OrgPath values</text><text x="660" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">updates the group library</text><text x="660" y="550" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">commits a propagation report</text>
<line x1="660" y1="210" x2="660" y2="248" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="660" y1="320" x2="660" y2="358" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="660" y1="420" x2="660" y2="458" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

