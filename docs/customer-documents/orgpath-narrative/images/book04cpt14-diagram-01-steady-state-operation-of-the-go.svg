<rect x="900" y="130" width="320" height="280" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.6"/><text x="1060" y="160" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Monthly infrastructure maintenance</text>
