<rect x="50" y="620" width="1170" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/><text x="635" y="656" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Every action committed to the repository = governance audit trail</text>
