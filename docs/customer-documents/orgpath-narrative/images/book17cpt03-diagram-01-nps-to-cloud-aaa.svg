<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">DM_030 migrates the AAA tier off AD-bound</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">NPS to NAC or cloud RADIUS targets</text>

<!-- LEFT: AD-bound NPS + Active Directory -->
<rect x="60" y="300" width="260" height="80" rx="8" fill="#0D1B2E" stroke="#C0392B" stroke-width="2.4"/>
<text x="190" y="340" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">AD-bound NPS RADIUS</text>

<line x1="190" y1="300" x2="190" y2="252" stroke="#0D1B2E" stroke-width="2.2" marker-end="url(#ar-navy)"/>
<rect x="60" y="180" width="260" height="70" rx="8" fill="#0D1B2E"/>
<text x="190" y="215" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Active Directory</text>

<!-- red retires mark -->
<rect x="60" y="410" width="260" height="56" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="190" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">retires with the domain</text>

<!-- CENTER amber band DM_030 -->
<rect x="480" y="160" width="120" height="420" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="540" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 540 350)">DM_030  AAA-tier migration</text>

<!-- migration arrow left to center -->
<line x1="320" y1="340" x2="478" y2="340" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-grey)"/>

<!-- RIGHT upper group: enterprise NAC -->
<rect x="700" y="180" width="520" height="160" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="720" y="208" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="start">enterprise NAC — wired plus wireless</text>
<rect x="730" y="232" width="220" height="84" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="840" y="274" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Cisco ISE</text>
<rect x="980" y="232" width="220" height="84" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1090" y="274" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Aruba ClearPass</text>

<!-- RIGHT lower group: cloud RADIUS -->
<rect x="700" y="400" width="520" height="160" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="720" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="start">cloud RADIUS — cert wireless</text>
<rect x="730" y="452" width="220" height="84" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="840" y="494" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Entra RADIUS Proxy</text>
<rect x="980" y="452" width="220" height="84" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1090" y="486" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Cloud RADIUS</text>
<text x="1090" y="508" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">SecureW2</text>

<!-- arrows center to right groups -->
<line x1="600" y1="260" x2="698" y2="260" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<line x1="600" y1="480" x2="698" y2="480" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
</svg>
