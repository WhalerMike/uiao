<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
 <radialGradient id="weaveglow" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#D7F2EE"/>
  <stop offset="0.7" stop-color="#D7F2EE" stop-opacity="0.45"/>
  <stop offset="1" stop-color="#D7F2EE" stop-opacity="0"/>
 </radialGradient>
</defs>
<!-- soft glow behind the densest weave -->
<circle cx="595" cy="350" r="250" fill="url(#weaveglow)"/>
<!-- thread-origin beams and axis labels -->
<rect x="390" y="112" width="400" height="16" rx="8" fill="#0D1B2E"/>
<text x="590" y="92" font-size="28" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OrgPath</text>
<rect x="346" y="182" width="16" height="326" rx="8" fill="#1E8C8C"/>
<text x="332" y="358" font-size="28" font-weight="bold" fill="#1E8C8C" text-anchor="end">LocPath</text>
<!-- vertical navy warp threads -->
<line x1="420" y1="120" x2="420" y2="592" stroke="#0D1B2E" stroke-width="8" stroke-linecap="round"/>
<line x1="490" y1="120" x2="490" y2="592" stroke="#0D1B2E" stroke-width="8" stroke-linecap="round"/>
<line x1="560" y1="120" x2="560" y2="592" stroke="#0D1B2E" stroke-width="8" stroke-linecap="round"/>
<line x1="630" y1="120" x2="630" y2="592" stroke="#0D1B2E" stroke-width="8" stroke-linecap="round"/>
<line x1="700" y1="120" x2="700" y2="592" stroke="#0D1B2E" stroke-width="8" stroke-linecap="round"/>
<line x1="770" y1="120" x2="770" y2="592" stroke="#0D1B2E" stroke-width="8" stroke-linecap="round"/>
<!-- horizontal teal weft threads -->
<line x1="354" y1="210" x2="830" y2="210" stroke="#1E8C8C" stroke-width="8" stroke-linecap="round"/>
<line x1="354" y1="280" x2="830" y2="280" stroke="#1E8C8C" stroke-width="8" stroke-linecap="round"/>
<line x1="354" y1="350" x2="830" y2="350" stroke="#1E8C8C" stroke-width="8" stroke-linecap="round"/>
<line x1="354" y1="420" x2="830" y2="420" stroke="#1E8C8C" stroke-width="8" stroke-linecap="round"/>
<line x1="354" y1="490" x2="830" y2="490" stroke="#1E8C8C" stroke-width="8" stroke-linecap="round"/>
<!-- alternating over-under interlacing: warp passes over weft at every other crossing -->
<rect x="416" y="197" width="8" height="26" fill="#0D1B2E"/>
<rect x="416" y="337" width="8" height="26" fill="#0D1B2E"/>
<rect x="416" y="477" width="8" height="26" fill="#0D1B2E"/>
<rect x="486" y="267" width="8" height="26" fill="#0D1B2E"/>
<rect x="486" y="407" width="8" height="26" fill="#0D1B2E"/>
<rect x="556" y="197" width="8" height="26" fill="#0D1B2E"/>
<rect x="556" y="337" width="8" height="26" fill="#0D1B2E"/>
<rect x="556" y="477" width="8" height="26" fill="#0D1B2E"/>
<rect x="626" y="267" width="8" height="26" fill="#0D1B2E"/>
<rect x="626" y="407" width="8" height="26" fill="#0D1B2E"/>
<rect x="696" y="197" width="8" height="26" fill="#0D1B2E"/>
<rect x="696" y="337" width="8" height="26" fill="#0D1B2E"/>
<rect x="696" y="477" width="8" height="26" fill="#0D1B2E"/>
<rect x="766" y="267" width="8" height="26" fill="#0D1B2E"/>
<rect x="766" y="407" width="8" height="26" fill="#0D1B2E"/>
<!-- three loose grey threads outside the weave, cleanly cut -->
<path d="M 826,240 C 900,246 950,265 975,296" fill="none" stroke="#6B7A8D" stroke-width="6" stroke-linecap="butt"/>
<line x1="968" y1="302" x2="982" y2="290" stroke="#5A5A5A" stroke-width="3"/>
<path d="M 826,355 C 905,360 950,380 980,410" fill="none" stroke="#6B7A8D" stroke-width="6" stroke-linecap="butt"/>
<line x1="973" y1="416" x2="987" y2="404" stroke="#5A5A5A" stroke-width="3"/>
<path d="M 826,462 C 900,468 945,492 970,520" fill="none" stroke="#6B7A8D" stroke-width="6" stroke-linecap="butt"/>
<line x1="963" y1="526" x2="977" y2="514" stroke="#5A5A5A" stroke-width="3"/>
<text x="988" y="282" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#5A5A5A">IWMS</text>
<text x="985" y="446" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#5A5A5A">network</text>
<text x="988" y="540" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#5A5A5A">911</text>
<!-- stylized shears near the cut ends -->
<path d="M 1089,355 L 996,320 Q 985,316 989,307 Q 993,300 1003,304 L 1093,343 Z" fill="#5A5A5A"/>
<path d="M 1089,365 L 996,400 Q 985,404 989,413 Q 993,420 1003,416 L 1093,377 Z" fill="#5A5A5A"/>
<line x1="1092" y1="355" x2="1118" y2="341" stroke="#5A5A5A" stroke-width="9" stroke-linecap="round"/>
<line x1="1092" y1="365" x2="1118" y2="379" stroke="#5A5A5A" stroke-width="9" stroke-linecap="round"/>
<circle cx="1087" cy="360" r="7" fill="#5A5A5A"/>
<circle cx="1132" cy="334" r="16" fill="none" stroke="#5A5A5A" stroke-width="7"/>
<circle cx="1132" cy="386" r="16" fill="none" stroke="#5A5A5A" stroke-width="7"/>
</svg>
