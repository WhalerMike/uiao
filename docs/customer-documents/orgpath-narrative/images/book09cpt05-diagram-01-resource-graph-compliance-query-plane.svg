<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">The OrgPath compliance query plane:</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">join, summarize, order Tier-0 first</text>

<!-- Source 1: PolicyResources -->
<rect x="40" y="180" width="280" height="100" rx="8" fill="#0D1B2E"/>
<text x="180" y="208" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PolicyResources</text>
<text x="180" y="226" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">policystates</text>
<text x="55" y="252" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="start">complianceState</text>
<text x="55" y="272" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="start">policyDefinitionName</text>

<!-- Source 2: Resources -->
<rect x="40" y="320" width="280" height="120" rx="8" fill="#0D1B2E"/>
<text x="180" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Resources</text>
<text x="180" y="366" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">hybridcompute machines</text>
<text x="55" y="392" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="start">OrgPath</text>
<text x="55" y="412" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="start">OrgTier</text>
<text x="55" y="432" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="start">OrgNodeId</text>

<!-- Join node -->
<rect x="400" y="265" width="220" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="510" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle">leftouter join</text>
<text x="510" y="322" font-family="Consolas, monospace" font-size="12" fill="#176E6E" text-anchor="middle">on ResourceId</text>

<line x1="320" y1="230" x2="398" y2="295" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="320" y1="380" x2="398" y2="325" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- Summarize box -->
<rect x="680" y="240" width="270" height="140" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="815" y="266" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle">summarize</text>
<text x="697" y="294" font-family="Consolas, monospace" font-size="11" fill="#176E6E" text-anchor="start">CompliantCount</text>
<text x="697" y="314" font-family="Consolas, monospace" font-size="11" fill="#176E6E" text-anchor="start">NonCompliantCount</text>
<text x="697" y="334" font-family="Consolas, monospace" font-size="11" fill="#176E6E" text-anchor="start">PendingCount</text>
<text x="697" y="354" font-family="Consolas, monospace" font-size="11" fill="#176E6E" text-anchor="start">CompliancePercent</text>
<text x="815" y="373" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">by OrgPath, OrgTier</text>

<line x1="620" y1="310" x2="678" y2="310" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- Per-segment summary table (amber) ordered Tier0 first -->
<rect x="1000" y="200" width="240" height="220" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="1120" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">per-segment summary</text>
<text x="1120" y="244" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">ordered Tier0 first</text>
<rect x="1015" y="256" width="210" height="42" rx="4" fill="#D4A017"/>
<text x="1025" y="272" font-family="Consolas, monospace" font-size="10" fill="#FFFFFF" text-anchor="start">/Root/Sec/CA  Tier0</text>
<text x="1025" y="290" font-family="Consolas, monospace" font-size="10" fill="#FFFFFF" text-anchor="start">98% &#8212; highest priority</text>
<text x="1025" y="320" font-family="Consolas, monospace" font-size="10" fill="#33414F" text-anchor="start">/Root/Ops/DC  Tier1  95%</text>
<text x="1025" y="346" font-family="Consolas, monospace" font-size="10" fill="#33414F" text-anchor="start">/Root/Apps    Tier1  91%</text>
<text x="1025" y="372" font-family="Consolas, monospace" font-size="10" fill="#33414F" text-anchor="start">/Root/Branch  Tier2  88%</text>
<text x="1025" y="398" font-family="Consolas, monospace" font-size="10" fill="#33414F" text-anchor="start">/Root/Field   Tier2  84%</text>

<line x1="950" y1="310" x2="998" y2="310" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>

<!-- daily governance drift report -->
<rect x="1000" y="490" width="240" height="56" rx="8" fill="#0D1B2E"/>
<text x="1120" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">daily governance</text>
<text x="1120" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">drift report</text>
<line x1="1120" y1="420" x2="1120" y2="488" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>

<text x="640" y="620" font-family="Arial, Helvetica, sans-serif" font-size="15" font-style="italic" fill="#6B7A8D" text-anchor="middle">Compliance state is recorded once; OrgPath is what makes it legible as organizational reporting, not a flat list of resource IDs.</text>
</svg>
