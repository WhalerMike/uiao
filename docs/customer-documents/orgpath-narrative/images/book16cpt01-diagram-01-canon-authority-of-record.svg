<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
  <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
  <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>

<!-- Title -->
<text x="60" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E">Canon is a corpus of versioned files —</text>
<text x="60" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E">and it lives on one authority of record</text>

<!-- ===== LEFT: file corpus ===== -->
<!-- file cards -->
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E">
  <rect x="80" y="190" width="252" height="34" rx="3" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="96" y="212">orgpath-codebook</text>
  <rect x="80" y="234" width="252" height="34" rx="3" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="96" y="256">dynamic-group-rules</text>
  <rect x="80" y="278" width="252" height="34" rx="3" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="96" y="300">delegation-matrix</text>
  <rect x="80" y="322" width="252" height="34" rx="3" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="96" y="344">transformation-plan</text>
  <rect x="80" y="366" width="252" height="34" rx="3" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="96" y="388">policy-library</text>
  <rect x="80" y="410" width="252" height="34" rx="3" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="96" y="432">adapter-manifest</text>
  <rect x="80" y="454" width="252" height="34" rx="3" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="96" y="476">drift-report</text>
</g>

<!-- teal binding bracket -->
<path d="M 350 190 q 14 0 14 14 v 130 q 0 14 14 14 q -14 0 -14 14 v 130 q 0 14 -14 14" fill="none" stroke="#1E8C8C" stroke-width="3"/>
<text x="206" y="520" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle">canon = a corpus of</text>
<text x="206" y="540" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle">versioned files</text>

<!-- amber arrow corpus -> server -->
<line x1="396" y1="346" x2="600" y2="346" stroke="#D4A017" stroke-width="4" marker-end="url(#ar-amber)"/>
<text x="498" y="328" font-size="13" font-weight="bold" fill="#D4A017" text-anchor="middle">a commit becomes canon</text>

<!-- ===== RIGHT: authority-of-record server ===== -->
<rect x="624" y="208" width="372" height="280" rx="6" fill="#1F3A5F" stroke="#0D1B2E" stroke-width="2"/>
<!-- server rack slits -->
<g stroke="#EAF1FB" stroke-width="2" opacity="0.55">
  <line x1="648" y1="244" x2="972" y2="244"/>
  <line x1="648" y1="266" x2="972" y2="266"/>
</g>
<circle cx="660" cy="232" r="5" fill="#1E8C8C"/>
<circle cx="678" cy="232" r="5" fill="#1E8C8C"/>
<text x="810" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AUTHORITY OF RECORD</text>
<text x="810" y="352" font-size="14" fill="#EAF1FB" text-anchor="middle" font-style="italic">the substrate beneath the substrate</text>

<!-- three governance tags (amber) -->
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold">
  <rect x="648" y="392" width="112" height="62" rx="4" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="704" y="418" fill="#D4A017" text-anchor="middle">OrgPath</text>
  <text x="704" y="436" fill="#7a5e0e" text-anchor="middle" font-weight="normal">coordinate</text>

  <rect x="772" y="392" width="120" height="62" rx="4" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="832" y="412" fill="#D4A017" text-anchor="middle">Administrative</text>
  <text x="832" y="428" fill="#D4A017" text-anchor="middle">Unit</text>
  <text x="832" y="446" fill="#7a5e0e" text-anchor="middle" font-weight="normal">scoped boundary</text>

  <rect x="904" y="392" width="84" height="62" rx="4" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="946" y="418" fill="#D4A017" text-anchor="middle">drift-</text>
  <text x="946" y="436" fill="#D4A017" text-anchor="middle">reported</text>
</g>

<!-- ===== drift engine + dashed loop ===== -->
<rect x="1052" y="290" width="172" height="116" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="2"/>
<!-- gear glyph -->
<g transform="translate(1138,330)" fill="#D4A017">
  <circle cx="0" cy="0" r="14"/>
  <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
  <g stroke="#D4A017" stroke-width="4">
    <line x1="0" y1="-20" x2="0" y2="-14"/>
    <line x1="0" y1="14" x2="0" y2="20"/>
    <line x1="-20" y1="0" x2="-14" y2="0"/>
    <line x1="14" y1="0" x2="20" y2="0"/>
    <line x1="-14" y1="-14" x2="-10" y2="-10"/>
    <line x1="10" y1="10" x2="14" y2="14"/>
    <line x1="14" y1="-14" x2="10" y2="-10"/>
    <line x1="-10" y1="10" x2="-14" y2="14"/>
  </g>
</g>
<text x="1138" y="372" font-size="13" font-weight="bold" fill="#D4A017" text-anchor="middle">drift engine</text>
<text x="1138" y="392" font-size="12" fill="#7a5e0e" text-anchor="middle">watches the host too</text>

<!-- dashed loop server -> engine -> back -->
<path d="M 996 360 H 1052" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-grey)"/>
<path d="M 1138 406 V 540 H 810 V 488" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-grey)"/>
<text x="974" y="568" font-size="12.5" fill="#5A5A5A" text-anchor="middle" font-style="italic">its state is evaluated by the same engine that watches the directory</text>

<!-- footnote -->
<text x="206" y="600" font-size="13" fill="#33414F" text-anchor="middle">Governance that cannot be diffed,</text>
<text x="206" y="620" font-size="13" fill="#33414F" text-anchor="middle">attributed, and replayed is folklore.</text>
</svg>
