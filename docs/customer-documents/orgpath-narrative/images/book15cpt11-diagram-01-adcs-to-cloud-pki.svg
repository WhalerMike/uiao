<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="29" font-weight="bold" fill="#0D1B2E">ADCS to Microsoft Cloud PKI modernization</text>

<!-- LEFT: enterprise ADCS CA + trust web -->
<rect x="60" y="120" width="180" height="56" rx="8" fill="#0D1B2E"/>
<text x="150" y="148" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">enterprise ADCS CA</text>
<text x="150" y="166" font-family="Arial, sans-serif" font-size="9.5" fill="#C7D4E6" text-anchor="middle">dependency web to inventory</text>
<!-- trust nodes -->
<g font-family="Consolas, monospace" font-size="10.5">
<rect x="40" y="220" width="120" height="32" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.2"/><text x="100" y="237" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">PKINIT</text>
<rect x="40" y="262" width="120" height="32" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.2"/><text x="100" y="279" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">LDAPS</text>
<rect x="40" y="304" width="120" height="32" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.2"/><text x="100" y="321" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Intune device certs</text>
<rect x="40" y="346" width="120" height="32" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.2"/><text x="100" y="363" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">smart card logon</text>
<rect x="180" y="262" width="120" height="32" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.2"/><text x="240" y="279" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">application TLS</text>
<rect x="180" y="304" width="120" height="32" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.2"/><text x="240" y="321" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">code signing</text>
<rect x="180" y="346" width="120" height="32" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.2"/><text x="240" y="363" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">S-MIME</text>
</g>
<line x1="150" y1="176" x2="100" y2="218" stroke="#5A5A5A" stroke-width="1.2"/>
<line x1="150" y1="176" x2="100" y2="260" stroke="#5A5A5A" stroke-width="1.2"/>
<line x1="150" y1="176" x2="100" y2="302" stroke="#5A5A5A" stroke-width="1.2"/>
<line x1="150" y1="176" x2="100" y2="344" stroke="#5A5A5A" stroke-width="1.2"/>
<line x1="150" y1="176" x2="240" y2="260" stroke="#5A5A5A" stroke-width="1.2"/>
<line x1="150" y1="176" x2="240" y2="302" stroke="#5A5A5A" stroke-width="1.2"/>
<line x1="150" y1="176" x2="240" y2="344" stroke="#5A5A5A" stroke-width="1.2"/>
<!-- red burst un-inventoried dependency -->
<circle cx="240" cy="346" r="22" fill="none" stroke="#C0392B" stroke-width="2.2"/>
<text x="170" y="420" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">one un-inventoried dependency</text>
<text x="170" y="438" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">= outage at decommissioning</text>

<!-- CENTER: six-stage pipeline amber -->
<text x="730" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Six-stage modernization pipeline</text>
<g>
<rect x="380" y="170" width="240" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
<text x="500" y="194" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">1  Assessment</text>
<text x="500" y="214" font-family="Arial, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">embedded ESC1 through ESC8 analysis</text>
<rect x="640" y="170" width="180" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
<text x="730" y="206" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">2-5  re-platform</text>
<rect x="840" y="170" width="180" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
<text x="930" y="206" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">6  deploy</text>
</g>
<line x1="620" y1="202" x2="638" y2="202" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="820" y1="202" x2="838" y2="202" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="300" y1="200" x2="378" y2="200" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- RIGHT: deployment fork teal -->
<text x="730" y="330" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Deployment-model fork</text>
<rect x="420" y="350" width="280" height="80" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="560" y="380" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Cloud Root CA</text>
<text x="560" y="402" font-family="Arial, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">new trust anchor</text>
<rect x="760" y="350" width="280" height="80" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="900" y="380" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Bring Your Own CA</text>
<text x="900" y="402" font-family="Arial, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">imported issuing CA</text>
<line x1="930" y1="234" x2="700" y2="348" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="930" y1="234" x2="900" y2="348" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>

<!-- teal callout strong mapping -->
<rect x="420" y="470" width="620" height="56" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="730" y="494" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Strong mapping (KB5014754)</text>
<text x="730" y="514" font-family="Arial, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">binds every new certificate to an Entra ID identity</text>
</svg>
