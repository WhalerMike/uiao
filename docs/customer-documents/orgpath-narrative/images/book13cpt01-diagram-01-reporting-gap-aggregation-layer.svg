<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">The reporting gap — six surfaces produce</text>
<text x="60" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">intelligence the decision-maker never sees</text>

<!-- Left column: six navy source boxes -->
<text x="60" y="138" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D" text-anchor="start">GOVERNANCE SOURCE SURFACES</text>
<rect x="60" y="150" width="250" height="62" rx="8" fill="#0D1B2E"/>
<text x="185" y="174" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Azure Policy</text>
<text x="185" y="192" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">compliance</text>
<rect x="60" y="222" width="250" height="62" rx="8" fill="#0D1B2E"/>
<text x="185" y="246" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Sentinel</text>
<text x="185" y="264" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">KQL workbooks</text>
<rect x="60" y="294" width="250" height="62" rx="8" fill="#0D1B2E"/>
<text x="185" y="318" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Intune</text>
<text x="185" y="336" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">compliance reports</text>
<rect x="60" y="366" width="250" height="62" rx="8" fill="#0D1B2E"/>
<text x="185" y="390" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Defender</text>
<text x="185" y="408" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">secure score</text>
<rect x="60" y="438" width="250" height="62" rx="8" fill="#0D1B2E"/>
<text x="185" y="462" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Purview</text>
<text x="185" y="480" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">DLP incidents</text>
<rect x="60" y="510" width="250" height="62" rx="8" fill="#0D1B2E"/>
<text x="185" y="534" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Arc</text>
<text x="185" y="552" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Guest Configuration</text>

<!-- Red gap band (vertical) blocking direct arrows -->
<rect x="470" y="150" width="70" height="220" rx="6" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
<line x1="470" y1="150" x2="540" y2="370" stroke="#C0392B" stroke-width="2"/>
<line x1="540" y1="150" x2="470" y2="370" stroke="#C0392B" stroke-width="2"/>
<text x="505" y="395" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle">THE REPORTING</text>
<text x="505" y="413" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle">GAP</text>

<!-- Blocked direct arrows from sources toward the gap -->
<line x1="310" y1="181" x2="466" y2="200" stroke="#C0392B" stroke-width="1.6" marker-end="url(#ar-red)"/>
<line x1="310" y1="253" x2="466" y2="245" stroke="#C0392B" stroke-width="1.6" marker-end="url(#ar-red)"/>
<line x1="310" y1="325" x2="466" y2="290" stroke="#C0392B" stroke-width="1.6" marker-end="url(#ar-red)"/>
<line x1="310" y1="397" x2="466" y2="320" stroke="#C0392B" stroke-width="1.6" marker-end="url(#ar-red)"/>

<!-- Far-right: division governance lead -->
<rect x="1010" y="150" width="210" height="120" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="1115" y="195" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Division</text>
<text x="1115" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">governance lead</text>
<text x="1115" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">the decision-maker</text>

<!-- No path from gap to lead (the failure) -->
<line x1="542" y1="260" x2="640" y2="260" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="600" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C0392B" text-anchor="middle">never arrives</text>

<!-- Aggregation layer (teal) below -->
<rect x="380" y="510" width="430" height="170" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="595" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">Power BI semantic model</text>
<text x="595" y="566" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">aggregates all six surfaces</text>
<!-- amber slicer chip inside aggregation layer -->
<rect x="430" y="592" width="330" height="62" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="595" y="615" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath hierarchy slicer</text>
<text x="595" y="635" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">via OrgTree dimension table</text>

<!-- Six arrows from sources into aggregation layer -->
<line x1="310" y1="535" x2="376" y2="585" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="310" y1="565" x2="376" y2="605" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<text x="200" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="middle">all six surfaces feed the model</text>

<!-- Clean teal arrow from aggregation layer up to the lead -->
<path d="M760 600 L900 600 L900 240 L1006 240" fill="none" stroke="#1E8C8C" stroke-width="2.6" marker-end="url(#ar-teal)"/>
<text x="935" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Per-division posture</text>
<text x="935" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">in one view</text>
</svg>
