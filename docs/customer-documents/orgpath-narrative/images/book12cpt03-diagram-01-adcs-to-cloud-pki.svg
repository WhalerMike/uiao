<text x="310" y="158" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LEGACY AD CS — DECOMMISSIONED</text>

<rect x="90" y="195" width="440" height="110" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.4"/>
<text x="310" y="225" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Certificate templates</text>
<text x="310" y="253" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle">published in the AD</text>
<text x="310" y="273" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle">Configuration partition</text>

<text x="160" y="338" font-family="Arial, sans-serif" font-size="11" fill="#C0392B" text-anchor="middle">LDAP template</text>
<text x="160" y="354" font-family="Arial, sans-serif" font-size="11" fill="#C0392B" text-anchor="middle">discovery</text>
<text x="460" y="338" font-family="Arial, sans-serif" font-size="11" fill="#C0392B" text-anchor="middle">OU + GPO</text>
<text x="460" y="354" font-family="Arial, sans-serif" font-size="11" fill="#C0392B" text-anchor="middle">auto-enrollment scope</text>
<line x1="200" y1="380" x2="270" y2="408" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ar-red)"/>
<line x1="420" y1="380" x2="350" y2="408" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ar-red)"/>

<rect x="160" y="410" width="300" height="100" rx="8" fill="#1F3A5F"/>
<text x="310" y="445" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CA hierarchy</text>
<text x="310" y="475" font-family="Arial, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle">issues device and</text>
<text x="310" y="493" font-family="Arial, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle">user certificates</text>

<!-- migration arrow -->
<line x1="572" y1="410" x2="650" y2="410" stroke="#5A5A5A" stroke-width="2.6" marker-end="url(#ar-grey)"/>

<!-- RIGHT: cloud-native -->
<rect x="650" y="135" width="580" height="380" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.2"/>
<text x="940" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E3A66" text-anchor="middle">CLOUD-NATIVE</text>

<rect x="675" y="178" width="250" height="90" rx="8" fill="#1F3A5F"/>
<text x="800" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OrgTree registry node</text>
<text x="800" y="235" font-family="Consolas, monospace" font-size="12" fill="#EAF1FB" text-anchor="middle">CertificateProfiles[ ]</text>
<text x="800" y="253" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">array</text>
<line x1="800" y1="268" x2="800" y2="288" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<rect x="675" y="290" width="250" height="80" rx="8" fill="#1E8C8C"/>
<text x="800" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Assignment pipeline</text>
<text x="800" y="346" font-family="Arial, sans-serif" font-size="11" fill="#EAF1FB" text-anchor="middle">maps profiles to group</text>
<line x1="925" y1="330" x2="975" y2="330" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<rect x="978" y="295" width="230" height="70" rx="8" fill="#1E8C8C"/>
<text x="1093" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Branch group</text>
<text x="1093" y="348" font-family="Consolas, monospace" font-size="12" fill="#EAF1FB" text-anchor="middle">ORG-BRANCH</text>

<rect x="675" y="395" width="160" height="100" rx="8" fill="#1E8C8C"/>
<text x="755" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Microsoft</text>
<text x="755" y="445" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Cloud PKI</text>
<text x="755" y="470" font-family="Arial, sans-serif" font-size="11" fill="#EAF1FB" text-anchor="middle">issuing CA</text>
<rect x="850" y="395" width="358" height="100" rx="8" fill="#1E8C8C"/>
<text x="1029" y="422" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Intune profile types</text>
<text x="1029" y="450" font-family="Consolas, monospace" font-size="12" fill="#EAF1FB" text-anchor="middle">TrustedRoot · SCEP · PKCS</text>
<text x="1029" y="475" font-family="Arial, sans-serif" font-size="11" fill="#EAF1FB" text-anchor="middle">deliver certs to managed devices and users</text>
<line x1="800" y1="370" x2="775" y2="393" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="1093" y1="365" x2="1029" y2="393" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- amber callout -->
<rect x="650" y="540" width="580" height="120" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="940" y="575" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Governing question</text>
<text x="940" y="605" font-family="Arial, sans-serif" font-size="13" fill="#33414F" text-anchor="middle">Which templates apply is answered by</text>
<text x="940" y="628" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OrgPath position, not OU membership.</text>
</svg>
