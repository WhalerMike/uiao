<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Service principal lifecycle with OrgPath</text>
<text x="60" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">stamping at each stage</text>

<!-- 6 stages, horizontal. width 1180 over 6 -> each ~178, gap 18 -->
<!-- Stage boxes: x positions -->
<!-- box width 178, start at 50, step 198 -->

<!-- Stage 1 -->
<rect x="50" y="170" width="178" height="150" rx="8" fill="#0D1B2E"/>
<text x="139" y="198" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Stage 1</text>
<text x="139" y="226" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">App registration</text>
<text x="139" y="250" font-family="Arial, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">developer creates</text>
<text x="139" y="266" font-family="Arial, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">registration</text>

<!-- Stage 2 -->
<rect x="248" y="170" width="178" height="150" rx="8" fill="#0D1B2E"/>
<text x="337" y="198" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Stage 2</text>
<text x="337" y="226" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Consent grant</text>
<text x="337" y="256" font-family="Arial, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">admin consents</text>

<!-- Stage 3 -->
<rect x="446" y="170" width="178" height="150" rx="8" fill="#0D1B2E"/>
<text x="535" y="198" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Stage 3</text>
<text x="535" y="222" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Service principal</text>
<text x="535" y="242" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">creation</text>
<text x="535" y="268" font-family="Arial, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">per-tenant SP</text>
<text x="535" y="284" font-family="Arial, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">instantiated</text>

<!-- Stage 4 -->
<rect x="644" y="170" width="178" height="150" rx="8" fill="#0D1B2E"/>
<text x="733" y="198" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Stage 4</text>
<text x="733" y="222" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Permission</text>
<text x="733" y="242" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">assignment</text>
<text x="733" y="268" font-family="Arial, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">Graph / Azure</text>
<text x="733" y="284" font-family="Arial, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">permissions assigned</text>

<!-- Stage 5 -->
<rect x="842" y="170" width="178" height="150" rx="8" fill="#0D1B2E"/>
<text x="931" y="198" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Stage 5</text>
<text x="931" y="226" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Access reviews</text>
<text x="931" y="256" font-family="Arial, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">periodic</text>

<!-- Stage 6 -->
<rect x="1040" y="170" width="178" height="150" rx="8" fill="#0D1B2E"/>
<text x="1129" y="198" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Stage 6</text>
<text x="1129" y="226" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Decommission</text>
<text x="1129" y="256" font-family="Arial, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">SP retired</text>

<!-- Arrows between stages -->
<line x1="228" y1="245" x2="246" y2="245" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="426" y1="245" x2="444" y2="245" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="624" y1="245" x2="642" y2="245" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="822" y1="245" x2="840" y2="245" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="1020" y1="245" x2="1038" y2="245" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- OrgPath operation labels below each stage (teal monospace) -->
<rect x="50" y="336" width="178" height="64" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="139" y="360" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">stamps</text>
<text x="139" y="382" font-family="Arial, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">from owning team</text>

<rect x="248" y="336" width="178" height="64" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="337" y="360" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">captures</text>
<text x="337" y="382" font-family="Arial, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">in consent audit record</text>

<rect x="446" y="336" width="178" height="64" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="535" y="360" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">copies</text>
<text x="535" y="382" font-family="Arial, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">from app registration</text>

<rect x="644" y="336" width="178" height="64" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="733" y="360" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">scopes</text>
<text x="733" y="382" font-family="Arial, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">eligible permissions</text>

<rect x="842" y="336" width="178" height="64" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="931" y="360" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">selects</text>
<text x="931" y="382" font-family="Arial, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">reviewers by subtree</text>

<rect x="1040" y="336" width="178" height="64" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="1129" y="360" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">queries</text>
<text x="1129" y="382" font-family="Arial, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">dependent services</text>

<!-- Connectors from stage box to op label -->
<line x1="139" y1="320" x2="139" y2="334" stroke="#1E8C8C" stroke-width="1.4"/>
<line x1="337" y1="320" x2="337" y2="334" stroke="#1E8C8C" stroke-width="1.4"/>
<line x1="535" y1="320" x2="535" y2="334" stroke="#1E8C8C" stroke-width="1.4"/>
<line x1="733" y1="320" x2="733" y2="334" stroke="#1E8C8C" stroke-width="1.4"/>
<line x1="931" y1="320" x2="931" y2="334" stroke="#1E8C8C" stroke-width="1.4"/>
<line x1="1129" y1="320" x2="1129" y2="334" stroke="#1E8C8C" stroke-width="1.4"/>

<!-- Amber registry bar spanning all stages -->
<rect x="50" y="520" width="1168" height="80" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="634" y="560" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OrgTree registry as authoritative source</text>
<text x="634" y="584" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">every stage references the registry</text>

<!-- Single upward arrow from registry bar into the timeline -->
<line x1="634" y1="518" x2="634" y2="404" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
</svg>
