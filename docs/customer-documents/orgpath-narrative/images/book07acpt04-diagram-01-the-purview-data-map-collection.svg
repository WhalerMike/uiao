<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">The Purview collection hierarchy mirrors</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath; every asset carries uiao_orgpath</text>

<!-- LEFT: OrgPath tree (teal) -->
<text x="60" y="160" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="0.4" fill="#1E8C8C" text-anchor="start">ORGPATH TREE</text>
<rect x="60" y="180" width="360" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="240" y="208" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NCR / Finance</text>
<rect x="120" y="270" width="300" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="270" y="298" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NCR / Finance / Data</text>
<line x1="100" y1="236" x2="100" y2="298" stroke="#1E8C8C" stroke-width="1.8"/>
<line x1="100" y1="298" x2="118" y2="298" stroke="#1E8C8C" stroke-width="1.8"/>

<!-- mirror connector (amber) -->
<line x1="420" y1="208" x2="476" y2="208" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<line x1="420" y1="298" x2="476" y2="298" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<text x="448" y="178" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#8A6D10" text-anchor="middle">mirror</text>

<!-- RIGHT: Purview collection tree (navy) -->
<text x="480" y="160" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="0.4" fill="#1E3A66" text-anchor="start">PURVIEW DATA-MAP COLLECTIONS</text>
<rect x="480" y="180" width="360" height="56" rx="8" fill="#0D1B2E"/>
<text x="660" y="208" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Finance</text>
<rect x="540" y="270" width="300" height="56" rx="8" fill="#0D1B2E"/>
<text x="690" y="298" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Finance / Accounting</text>
<line x1="520" y1="236" x2="520" y2="298" stroke="#1E3A66" stroke-width="1.8"/>
<line x1="520" y1="298" x2="538" y2="298" stroke="#1E3A66" stroke-width="1.8"/>

<!-- SQL instance card registering into Accounting -->
<rect x="900" y="250" width="320" height="120" rx="8" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.6"/>
<text x="1060" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Discovered SQL instance</text>
<text x="1060" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">registers into the Accounting collection</text>
<rect x="918" y="322" width="284" height="34" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="1060" y="340" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="bold" fill="#8A6D10" text-anchor="middle" dominant-baseline="central">uiao_orgpath = NCR / Finance / Data</text>
<line x1="840" y1="298" x2="896" y2="298" stroke="#1E3A66" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- bottom note (navy) -->
<rect x="60" y="450" width="1160" height="80" rx="8" fill="#1E3A66"/>
<text x="640" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Scan-driven sensitivity inherits the collection default</text>
<text x="640" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">from the OrgTree node metadata — the attribution travels with the asset.</text>
</svg>
