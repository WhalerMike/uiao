<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Insider Risk policy scoped by OrgPath,</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">reconciled from the OrgTree registry</text>

<!-- LEFT: OrgTree branch -->
<text x="60" y="140" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.5" fill="#1E8C8C" text-anchor="start">ORGTREE BRANCH</text>
<rect x="60" y="160" width="220" height="54" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="170" y="187" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NCR (region root)</text>
<line x1="120" y1="214" x2="120" y2="270" stroke="#1E8C8C" stroke-width="2"/>
<line x1="120" y1="270" x2="150" y2="270" stroke="#1E8C8C" stroke-width="2"/>
<line x1="120" y1="370" x2="150" y2="370" stroke="#1E8C8C" stroke-width="2"/>
<line x1="120" y1="214" x2="120" y2="370" stroke="#1E8C8C" stroke-width="2"/>
<!-- flagged child -->
<rect x="150" y="244" width="230" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="252" y="273" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NCR / Finance</text>
<rect x="150" y="306" width="230" height="26" rx="5" fill="#0D1B2E"/>
<text x="265" y="319" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">InsiderRiskScope=true</text>
<!-- sibling unflagged -->
<rect x="150" y="346" width="230" height="48" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="252" y="362" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">NCR (all departments)</text>
<text x="252" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">no flag — out of segment</text>

<!-- amber join connector to center -->
<line x1="385" y1="288" x2="470" y2="288" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<text x="423" y="269" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#9A7611" text-anchor="middle" dominant-baseline="central">join key</text>
<text x="423" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#9A7611" text-anchor="middle" dominant-baseline="central">on OrgPath</text>

<!-- CENTER: IRM policy -->
<rect x="472" y="232" width="346" height="150" rx="8" fill="#0D1B2E"/>
<text x="645" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">IRM policy: Finance</text>
<text x="645" y="294" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">heightened exfiltration indicators</text>
<text x="645" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">tighter thresholds</text>
<text x="645" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">departing-user triggers</text>

<!-- RIGHT: Reconciliation job -->
<rect x="900" y="150" width="320" height="160" rx="8" fill="#0D1B2E"/>
<text x="1060" y="180" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Reconciliation job</text>
<text x="1060" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">reads the OrgTree registry,</text>
<text x="1060" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">emits IRM membership via</text>
<rect x="950" y="248" width="220" height="44" rx="6" fill="#1E3A66"/>
<text x="1060" y="270" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Purview + Graph API</text>

<!-- amber emit job -> policy -->
<line x1="900" y1="290" x2="820" y2="305" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<text x="858" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#9A7611" text-anchor="middle" dominant-baseline="central">add/remove in-scope</text>
<text x="858" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#9A7611" text-anchor="middle" dominant-baseline="central">users idempotently</text>

<!-- red drift-provenance marker -->
<rect x="472" y="430" width="346" height="80" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<circle cx="500" cy="460" r="11" fill="#C0392B"/>
<text x="500" y="461" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">!</text>
<text x="524" y="456" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="start" dominant-baseline="central">DRIFT-PROVENANCE</text>
<text x="524" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start" dominant-baseline="central">membership entry diverges from</text>
<text x="524" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start" dominant-baseline="central">registry — stale user flagged</text>
<line x1="645" y1="430" x2="645" y2="382" stroke="#C0392B" stroke-width="2" marker-end="url(#ar-red)"/>

<!-- dashed navy job -> evidence -->
<line x1="1060" y1="310" x2="1060" y2="430" stroke="#0D1B2E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-navy)"/>
<rect x="930" y="432" width="260" height="78" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="1060" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Evidence Bundle</text>
<text x="1060" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">every membership change recorded</text>

<text x="640" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">A transfer or departure re-scopes the surveilled population as a side effect of the org change.</text>
</svg>
