<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#0D1B2E" text-anchor="start">One unified substrate on-prem becomes</text><text x="60" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#0D1B2E" text-anchor="start">six disconnected point tools in the cloud</text><text x="60" y="186" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1E8C8C" text-anchor="start">ON-PREM — ONE UNIFIED SUBSTRATE</text><rect x="60" y="206" width="500" height="128" rx="10" fill="#0D1B2E"/><text x="310" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ACTIVE DIRECTORY</text><text x="310" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">OU tree · GPO · Kerberos + DNS · AD CS · LDAP</text><line x1="310" y1="334" x2="310" y2="372" stroke="#5A5A5A" stroke-width="2.5" marker-end="url(#ar-grey)"/><rect x="60" y="388" width="240" height="78" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/><text x="180" y="427" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Organizational position</text><rect x="320" y="388" width="240" height="78" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/><text x="440" y="427" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Policy inheritance</text><rect x="60" y="484" width="240" height="78" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/><text x="180" y="523" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Delegated authority</text><rect x="320" y="484" width="240" height="78" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/><text x="440" y="523" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Dependency graph</text><line x1="575" y1="300" x2="690" y2="300" stroke="#C0392B" stroke-width="3" marker-end="url(#ar-red)"/><text x="632" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#C0392B" text-anchor="middle" dominant-baseline="central">migration</text><text x="632" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#C0392B" text-anchor="middle" dominant-baseline="central">decomposes into</text><text x="705" y="186" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#C0392B" text-anchor="start">CLOUD — SIX POINT TOOLS, NO SHARED SUBSTRATE</text><rect x="705" y="206" width="168" height="118" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="789" y="265" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Entra ID</text><rect x="883" y="206" width="168" height="118" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="967" y="265" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Intune</text><rect x="1061" y="206" width="168" height="118" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="1145" y="265" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure Arc</text><rect x="705" y="341" width="168" height="118" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="789" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure DNS</text><rect x="883" y="341" width="168" height="118" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="967" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Cloud PKI</text><rect x="1061" y="341" width="168" height="118" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="1145" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Defender</text><text x="972" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">no connecting lines — no shared model</text>
