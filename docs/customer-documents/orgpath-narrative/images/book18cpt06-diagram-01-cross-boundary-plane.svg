<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Book 18 Ch.6 — One substrate, boundary-aware transports. ADR-093 blueprint register. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="c6-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="74" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">One substrate, boundary-aware transports</text>

  <!-- single substrate -->
  <rect x="320" y="100" width="640" height="74" rx="12" fill="#0D1B2E"/>
  <text x="640" y="132" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">One substrate — identical facets, codebook, drift classes</text>
  <text x="640" y="158" text-anchor="middle" font-size="13" fill="#A9B8CA">the model does not change across boundaries</text>

  <line x1="640" y1="174" x2="640" y2="200" stroke="#1E8C8C" stroke-width="3" marker-end="url(#c6-teal)"/>

  <!-- transport band -->
  <rect x="140" y="204" width="1000" height="58" rx="10" fill="#1E8C8C"/>
  <text x="640" y="232" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Boundary-aware transport</text>
  <text x="640" y="252" text-anchor="middle" font-size="13" fill="#D7F2EE">selects the host and token audience per boundary — the write lands in the right cloud through the right door</text>

  <!-- arrows to columns -->
  <line x1="240" y1="262" x2="240" y2="296" stroke="#1E8C8C" stroke-width="3" marker-end="url(#c6-teal)"/>
  <line x1="640" y1="262" x2="640" y2="296" stroke="#1E8C8C" stroke-width="3" marker-end="url(#c6-teal)"/>
  <line x1="1040" y1="262" x2="1040" y2="296" stroke="#1E8C8C" stroke-width="3" marker-end="url(#c6-teal)"/>

  <!-- boundary columns -->
  <!-- Commercial -->
  <rect x="60" y="300" width="360" height="238" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="60" y="300" width="360" height="50" rx="12" fill="#1E3A66"/>
  <text x="240" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Commercial</text>
  <text x="84" y="386" font-size="13" fill="#6B7A8D">trust root</text>
  <text x="84" y="408" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">login.microsoftonline.com</text>
  <text x="84" y="446" font-size="13" fill="#6B7A8D">token audience</text>
  <text x="84" y="468" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">graph.microsoft.com</text>
  <text x="84" y="510" font-size="12" fill="#5A5A5A">also serves GCC-Moderate</text>

  <!-- GCC-High -->
  <rect x="440" y="300" width="360" height="238" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="440" y="300" width="360" height="50" rx="12" fill="#1E3A66"/>
  <text x="620" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">GCC-High</text>
  <text x="464" y="386" font-size="13" fill="#6B7A8D">trust root</text>
  <text x="464" y="408" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">login.microsoftonline.us</text>
  <text x="464" y="446" font-size="13" fill="#6B7A8D">token audience</text>
  <text x="464" y="468" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">graph.microsoft.us</text>
  <text x="464" y="510" font-size="12" fill="#5A5A5A">separate sovereign cloud</text>

  <!-- DoD -->
  <rect x="820" y="300" width="360" height="238" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="820" y="300" width="360" height="50" rx="12" fill="#1E3A66"/>
  <text x="1000" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">DoD</text>
  <text x="844" y="386" font-size="13" fill="#6B7A8D">trust root</text>
  <text x="844" y="408" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">login.microsoftonline.us</text>
  <text x="844" y="446" font-size="13" fill="#6B7A8D">token audience</text>
  <text x="844" y="468" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">dod-graph.microsoft.us</text>
  <text x="844" y="510" font-size="12" fill="#5A5A5A">highest isolation tier</text>

  <!-- no-cross-trust separators -->
  <line x1="430" y1="304" x2="430" y2="534" stroke="#C0392B" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="810" y1="304" x2="810" y2="534" stroke="#C0392B" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- claim band -->
  <rect x="60" y="558" width="1120" height="96" rx="12" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="84" y="592" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#0D1B2E">Why "one plane" is the claim Microsoft cannot make</text>
  <text x="84" y="620" font-size="14" fill="#33414F">Each boundary is a separate cloud that, by design, does not trust or even see the others. The substrate reconciles</text>
  <text x="84" y="642" font-size="14" fill="#33414F">across all three — validating every claim against the right trust root — and no native primitive composes across them at all.</text>
</svg>
