<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">One OrgPath, three carriers: DNS, certificate</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">SAN, and Arc resource tags</text>

<!-- registry top -->
<rect x="440" y="130" width="400" height="80" rx="8" fill="#1F3A5F"/>
<text x="640" y="162" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OrgTree registry</text>
<text x="640" y="188" font-family="Arial, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle">authoritative source</text>

<!-- center server -->
<rect x="540" y="300" width="200" height="100" rx="8" fill="#0D1B2E"/>
<text x="640" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">server</text>
<text x="640" y="365" font-family="Consolas, monospace" font-size="12" fill="#EAF1FB" text-anchor="middle">srv01.eng.corp.com</text>

<!-- arms to carriers -->
<line x1="540" y1="350" x2="360" y2="470" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="640" y1="400" x2="640" y2="470" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="740" y1="350" x2="920" y2="470" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- LEFT carrier: Azure Arc -->
<rect x="60" y="475" width="380" height="170" rx="8" fill="#1E8C8C"/>
<text x="250" y="505" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Azure Arc resource</text>
<rect x="80" y="525" width="340" height="100" rx="6" fill="#FFFFFF" opacity="0.94"/>
<text x="100" y="552" font-family="Arial, sans-serif" font-size="12" fill="#33414F">resource tags</text>
<text x="100" y="578" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E">OrgPath=<tspan fill="#9C7405" font-weight="bold">/Engineering/Platform/Build-Servers</tspan></text>
<text x="100" y="604" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E">Environment=Production</text>

<!-- CENTER carrier: Cloud PKI -->
<rect x="460" y="475" width="360" height="170" rx="8" fill="#1E8C8C"/>
<text x="640" y="505" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Microsoft Cloud PKI</text>
<rect x="478" y="525" width="324" height="100" rx="6" fill="#FFFFFF" opacity="0.94"/>
<text x="494" y="550" font-family="Arial, sans-serif" font-size="12" fill="#33414F">Subject Alternative Name</text>
<text x="494" y="575" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E">dNSName=srv01.eng.corp.com</text>
<text x="494" y="597" font-family="Consolas, monospace" font-size="10" fill="#0D1B2E">otherName:1.3.6.1.4.1.99999.1=</text>
<text x="494" y="615" font-family="Consolas, monospace" font-size="10" fill="#9C7405" font-weight="bold">OrgPath:/Engineering/Platform/Build-Servers</text>

<!-- RIGHT carrier: Azure DNS -->
<rect x="840" y="475" width="380" height="170" rx="8" fill="#1E8C8C"/>
<text x="1030" y="505" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Azure DNS</text>
<rect x="860" y="525" width="340" height="100" rx="6" fill="#FFFFFF" opacity="0.94"/>
<text x="880" y="552" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E">A / AAAA records</text>
<text x="880" y="578" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E">TXT record</text>
<text x="880" y="600" font-family="Consolas, monospace" font-size="10" fill="#9C7405" font-weight="bold">OrgPath=/Engineering/Platform/Build-Servers</text>

<!-- dashed arrows back to registry -->
<line x1="250" y1="475" x2="470" y2="208" stroke="#5A5A5A" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar-grey)"/>
<line x1="640" y1="475" x2="640" y2="406" stroke="#5A5A5A" stroke-width="1.4" stroke-dasharray="4 4"/>
<line x1="1030" y1="475" x2="810" y2="208" stroke="#5A5A5A" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar-grey)"/>

<!-- note bar -->
<rect x="240" y="668" width="800" height="40" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.2"/>
<text x="640" y="688" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Same OrgPath value across all three surfaces — one truth, three carriers.</text>
</svg>
