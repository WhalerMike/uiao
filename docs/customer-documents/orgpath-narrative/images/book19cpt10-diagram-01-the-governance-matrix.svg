<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

<!-- Title -->
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">The governance matrix &#8212; two axes, one question per cell</text>

<!-- Axis labels -->
<text x="670" y="102" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="middle">OrgPath axis &#8212; organizational predicate</text>
<text x="60" y="102" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="start">LocPath axis &#8212; place prefix</text>

<!-- Column header band (navy) -->
<rect x="370" y="112" width="600" height="48" rx="6" fill="#0D1B2E"/>
<line x1="570" y1="119" x2="570" y2="153" stroke="#FFFFFF" stroke-width="1" opacity="0.35"/>
<line x1="770" y1="119" x2="770" y2="153" stroke="#FFFFFF" stroke-width="1" opacity="0.35"/>
<text x="470" y="136" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Department: Finance</text>
<text x="670" y="136" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Department: IT</text>
<text x="870" y="136" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Role: Contractor</text>

<!-- Row headers (monospace, left) -->
<text x="355" y="212" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="end" dominant-baseline="central">/USA/MD/ANNAPOLIS-HQ</text>
<text x="355" y="308" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="end" dominant-baseline="central">/USA/MD/FIELD-12</text>
<text x="355" y="328" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#5A5A5A" text-anchor="end" dominant-baseline="central">(diaApproved: false)</text>
<text x="355" y="413" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="end" dominant-baseline="central">/USA</text>
<text x="355" y="433" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#5A5A5A" text-anchor="end" dominant-baseline="central">(anywhere)</text>

<!-- Grid cells: 3 columns x 3 rows, 200x105 each, origin 370,160 -->
<!-- Row 1: /USA/MD/ANNAPOLIS-HQ -->
<rect x="370" y="160" width="200" height="105" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="1"/>
<rect x="570" y="160" width="200" height="105" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="1"/>
<rect x="770" y="160" width="200" height="105" fill="#1E8C8C"/>
<text x="870" y="212" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">building access cert</text>

<!-- Row 2: /USA/MD/FIELD-12 -->
<rect x="370" y="265" width="200" height="105" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="1"/>
<rect x="570" y="265" width="200" height="105" fill="#1E8C8C"/>
<text x="670" y="317" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">backhaul CA policy</text>
<rect x="770" y="265" width="200" height="105" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="1"/>

<!-- Row 3: /USA (anywhere) -->
<rect x="370" y="370" width="200" height="105" fill="#1E8C8C"/>
<text x="470" y="422" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">step-up review</text>
<rect x="570" y="370" width="200" height="105" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="1"/>
<rect x="770" y="370" width="200" height="105" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="1"/>

<!-- Caption band (navy) below the grid -->
<rect x="60" y="525" width="910" height="54" rx="8" fill="#0D1B2E"/>
<text x="515" y="552" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">evaluated against governed values only &#8212; never the observational layer</text>

<!-- Out-of-scope corner: three grey boxes struck with red X -->
<rect x="1030" y="160" width="190" height="52" rx="6" fill="#EDEFF2" stroke="#5A5A5A" stroke-width="1.4"/>
<line x1="1038" y1="168" x2="1212" y2="204" stroke="#C0392B" stroke-width="2.5" opacity="0.6"/>
<line x1="1212" y1="168" x2="1038" y2="204" stroke="#C0392B" stroke-width="2.5" opacity="0.6"/>
<text paint-order="stroke" stroke="#FFFFFF" stroke-width="7" x="1125" y="186" font-size="14" font-weight="bold" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">IWMS</text>

<rect x="1030" y="250" width="190" height="52" rx="6" fill="#EDEFF2" stroke="#5A5A5A" stroke-width="1.4"/>
<line x1="1038" y1="258" x2="1212" y2="294" stroke="#C0392B" stroke-width="2.5" opacity="0.6"/>
<line x1="1212" y1="258" x2="1038" y2="294" stroke="#C0392B" stroke-width="2.5" opacity="0.6"/>
<text paint-order="stroke" stroke="#FFFFFF" stroke-width="7" x="1125" y="276" font-size="14" font-weight="bold" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">network orchestration</text>

<rect x="1030" y="340" width="190" height="52" rx="6" fill="#EDEFF2" stroke="#5A5A5A" stroke-width="1.4"/>
<line x1="1038" y1="348" x2="1212" y2="384" stroke="#C0392B" stroke-width="2.5" opacity="0.6"/>
<line x1="1212" y1="348" x2="1038" y2="384" stroke="#C0392B" stroke-width="2.5" opacity="0.6"/>
<text paint-order="stroke" stroke="#FFFFFF" stroke-width="7" x="1125" y="366" font-size="14" font-weight="bold" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">911 call path</text>

<text x="1125" y="428" font-size="14" font-style="italic" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">out of scope by doctrine</text>
</svg>
