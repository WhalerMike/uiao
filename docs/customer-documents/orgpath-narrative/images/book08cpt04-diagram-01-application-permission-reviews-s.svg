<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Permission reviews split by owning</text>
<text x="60" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">branch, each defaulting to Deny</text>

<!-- OrgPath tree (teal) -->
<rect x="60" y="280" width="180" height="64" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="150" y="306" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OrgPath tree</text>
<text x="150" y="328" font-family="Consolas, monospace" font-size="11.5" fill="#1E8C8C" text-anchor="middle">NCR (region root)</text>

<rect x="60" y="200" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="170" y="225" font-family="Consolas, monospace" font-size="14" fill="#1E8C8C" text-anchor="middle">NCR / Finance</text>

<rect x="60" y="374" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="170" y="399" font-family="Consolas, monospace" font-size="14" fill="#1E8C8C" text-anchor="middle">NCR / Engineering</text>

<line x1="150" y1="280" x2="150" y2="252" stroke="#1E8C8C" stroke-width="1.6"/>
<line x1="150" y1="225" x2="58" y2="225" stroke="#1E8C8C" stroke-width="1.6"/>
<path d="M150,252 L150,399 L58,399" fill="none" stroke="#1E8C8C" stroke-width="1.6"/>

<!-- Finance review card (navy) -->
<line x1="280" y1="225" x2="378" y2="225" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="380" y="178" width="420" height="96" rx="8" fill="#0D1B2E"/>
<text x="590" y="208" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Semi-annual review — Finance</text>
<text x="590" y="234" font-family="Arial, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle">scoped to that branch's service principals</text>
<text x="590" y="254" font-family="Arial, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle">assigned to that branch's review group</text>

<!-- Engineering review card (navy) -->
<line x1="280" y1="399" x2="378" y2="399" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="380" y="352" width="420" height="96" rx="8" fill="#0D1B2E"/>
<text x="590" y="382" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Semi-annual review — Engineering</text>
<text x="590" y="408" font-family="Arial, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle">scoped to that branch's service principals</text>
<text x="590" y="428" font-family="Arial, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle">assigned to that branch's review group</text>

<!-- Amber band across both cards -->
<rect x="380" y="478" width="420" height="76" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="590" y="506" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">defaultDecision Deny</text>
<text x="590" y="532" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">21-day window, decisions auto-applied</text>

<line x1="590" y1="448" x2="590" y2="476" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="590" y1="274" x2="590" y2="350" stroke="#E3E8EF" stroke-width="1.4"/>

<!-- Red high-risk permission chip on the side -->
<rect x="870" y="280" width="350" height="160" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="1045" y="316" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.3" fill="#C0392B" text-anchor="middle">HIGHEST-RISK GRANT</text>
<rect x="900" y="336" width="290" height="44" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.4"/>
<text x="1045" y="358" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#C0392B" text-anchor="middle">Mail.ReadWrite.All</text>
<text x="1045" y="402" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">tenant-wide application permission</text>
<text x="1045" y="422" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">requires explicit confirmation</text>

<line x1="800" y1="360" x2="868" y2="360" stroke="#C0392B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar-grey)"/>
</svg>
