<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">The identity governance plane derives from</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">the OrgPath substrate</text>

<!-- root substrate box -->
<rect x="60" y="280" width="230" height="160" rx="8" fill="#0D1B2E"/>
<text x="175" y="318" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgPath substrate</text>
<text x="175" y="358" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">OrgTree registry</text>
<text x="175" y="382" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">native extension</text>
<text x="175" y="404" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">attribute</text>

<!-- fan arrows from substrate to the four construct boxes -->
<line x1="290" y1="360" x2="470" y2="205" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="290" y1="360" x2="470" y2="320" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="290" y1="360" x2="470" y2="435" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="290" y1="360" x2="470" y2="565" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- in-boundary bounding frame -->
<rect x="455" y="150" width="430" height="345" rx="10" fill="none" stroke="#1E8C8C" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="470" y="173" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.4" fill="#1E8C8C" text-anchor="start">IN-BOUNDARY  M365 GCC-Moderate</text>

<!-- construct 1: entitlement management -->
<rect x="475" y="185" width="390" height="86" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="670" y="213" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Entitlement management</text>
<text x="670" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">access packages and catalogs scoped by OrgPath</text>

<!-- construct 2: lifecycle workflows -->
<rect x="475" y="288" width="390" height="78" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="670" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Lifecycle workflows</text>
<text x="670" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">joiner, mover, leaver triggered by OrgPath change</text>

<!-- construct 3: access reviews -->
<rect x="475" y="383" width="390" height="78" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="670" y="407" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Access reviews</text>
<text x="670" y="435" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">recertification routed to reviewer by org tier</text>

<!-- carve-out frame -->
<rect x="455" y="520" width="430" height="120" rx="10" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="470" y="543" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.4" fill="#C0392B" text-anchor="start">ADR-059  commercial-cloud carve-out</text>
<!-- construct 4: SailPoint NERM -->
<rect x="475" y="555" width="390" height="74" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="670" y="578" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">SailPoint NERM</text>
<text x="670" y="605" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">non-employee identity authority</text>

<!-- converge arrows to terminal -->
<line x1="865" y1="228" x2="1010" y2="345" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="865" y1="327" x2="1010" y2="358" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="865" y1="422" x2="1010" y2="372" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="865" y1="592" x2="1010" y2="392" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>

<!-- terminal audit record box -->
<rect x="1010" y="290" width="210" height="160" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="1115" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Closed-loop</text>
<text x="1115" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">governance record</text>
<text x="1115" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">audit and</text>
<text x="1115" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">compliance evidence</text>
</svg>
