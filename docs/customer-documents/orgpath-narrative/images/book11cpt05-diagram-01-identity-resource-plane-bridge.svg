<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Bridging the identity plane and the resource</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">plane with OrgPath tags</text>

<!-- Left: Identity plane panel -->
<rect x="60" y="140" width="430" height="320" rx="10" fill="#0D1B2E"/>
<text x="275" y="172" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Identity plane — Entra ID directory</text>
<rect x="90" y="200" width="370" height="64" rx="8" fill="#FFFFFF"/>
<text x="275" y="224" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">PIM eligibility</text>
<text x="275" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">carries OrgPath attribute</text>
<rect x="90" y="276" width="370" height="64" rx="8" fill="#FFFFFF"/>
<text x="275" y="300" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Lifecycle Workflows</text>
<text x="275" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">carries OrgPath attribute</text>
<rect x="90" y="352" width="370" height="64" rx="8" fill="#FFFFFF"/>
<text x="275" y="376" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">dynamic group membership</text>
<text x="275" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">carries OrgPath attribute</text>

<!-- Right: Resource plane panel -->
<rect x="790" y="140" width="430" height="320" rx="10" fill="#0D1B2E"/>
<text x="1005" y="172" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Resource plane — Azure Resource Manager</text>
<rect x="820" y="200" width="370" height="64" rx="8" fill="#FFFFFF"/>
<text x="1005" y="232" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Arc-enrolled server</text>
<rect x="820" y="276" width="370" height="64" rx="8" fill="#FFFFFF"/>
<text x="1005" y="308" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure resource group</text>
<rect x="820" y="352" width="370" height="64" rx="8" fill="#FFFFFF"/>
<text x="1005" y="384" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">RBAC role assignment</text>

<!-- Center bridge -->
<rect x="500" y="246" width="280" height="108" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="640" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">OrgPath tag bridge</text>
<text x="640" y="302" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgPath · OrgNodeId</text>
<text x="640" y="324" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgTier · MigrationPhase</text>
<line x1="490" y1="300" x2="498" y2="300" stroke="#1E8C8C" stroke-width="2.6" marker-end="url(#ar-teal)"/>
<line x1="782" y1="300" x2="818" y2="300" stroke="#1E8C8C" stroke-width="2.6" marker-end="url(#ar-teal)"/>

<!-- amber policy gate -->
<rect x="440" y="490" width="400" height="58" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="640" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure Policy deny</text>
<text x="640" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">missing tags blocked at Arc enrollment</text>
<line x1="640" y1="354" x2="640" y2="488" stroke="#D4A017" stroke-width="2.4" stroke-dasharray="7 4"/>

<!-- red crossed-out untagged path -->
<rect x="440" y="590" width="400" height="70" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="640" y="616" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">untagged server</text>
<text x="640" y="640" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">organizational position unknowable — ungoverned path replaced</text>
<line x1="448" y1="592" x2="832" y2="658" stroke="#C0392B" stroke-width="2.4"/>
<line x1="832" y1="592" x2="448" y2="658" stroke="#C0392B" stroke-width="2.4"/>
</svg>
