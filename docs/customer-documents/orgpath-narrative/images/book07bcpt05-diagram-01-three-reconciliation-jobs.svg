<line x1="752" y1="351" x2="832" y2="351" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<rect x="834" y="319" width="180" height="64" rx="8" fill="#1E3A66"/>
<text x="924" y="343" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Purview surface</text>
<text x="924" y="363" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">+ Graph API</text>
<!-- red marker on comm compliance lane -->
<circle cx="744" cy="327" r="11" fill="#C0392B"/>
<text x="744" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">!</text>

<!-- bottom lane: DSPM-for-AI rollup job -->
<line x1="450" y1="423" x2="530" y2="482" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<rect x="532" y="452" width="220" height="64" rx="8" fill="#0D1B2E"/>
<text x="642" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">DSPM-for-AI rollup job</text>
<line x1="752" y1="484" x2="832" y2="484" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<rect x="834" y="452" width="180" height="64" rx="8" fill="#1E3A66"/>
<text x="924" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Purview surface</text>
<text x="924" y="496" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">+ Graph API</text>

<!-- RIGHT: Evidence Bundle tall box -->
<rect x="1064" y="170" width="156" height="400" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="1142" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Evidence</text>
<text x="1142" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Bundle</text>
<rect x="1080" y="252" width="124" height="56" rx="5" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.2"/>
<text x="1142" y="274" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">DRIFT-</text>
<text x="1142" y="290" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">PROVENANCE</text>
<rect x="1080" y="320" width="124" height="56" rx="5" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.2"/>
<text x="1142" y="342" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">DRIFT-</text>
<text x="1142" y="358" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">SEGREGATION</text>
<rect x="1080" y="388" width="124" height="56" rx="5" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.2"/>
<text x="1142" y="410" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">AI-posture-</text>
<text x="1142" y="426" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">staleness</text>

<!-- dashed navy job -> evidence -->
<line x1="1014" y1="218" x2="1062" y2="280" stroke="#0D1B2E" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar-navy)"/>
<line x1="1014" y1="351" x2="1062" y2="348" stroke="#0D1B2E" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar-navy)"/>
<line x1="1014" y1="484" x2="1062" y2="416" stroke="#0D1B2E" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar-navy)"/>

<text x="640" y="612" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#9A7611" text-anchor="middle" dominant-baseline="central">read from registry &#183; write to surface &#183; emit findings</text>
<text x="640" y="650" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">Red marker: a DRIFT-SEGREGATION violation on the Comm Compliance lane (one identity in both sets).</text>
