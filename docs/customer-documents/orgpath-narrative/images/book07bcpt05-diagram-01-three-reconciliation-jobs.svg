<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Three new reconciliation jobs ride the existing</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">pipeline into one shared Evidence Bundle</text>

<!-- LEFT: lifecycle engine -->
<rect x="60" y="290" width="200" height="150" rx="8" fill="#0D1B2E"/>
<text x="160" y="318" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Lifecycle engine</text>
<rect x="82" y="338" width="156" height="26" rx="5" fill="#1E3A66"/>
<text x="160" y="351" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">join</text>
<rect x="82" y="370" width="156" height="26" rx="5" fill="#1E3A66"/>
<text x="160" y="383" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">mover</text>
<rect x="82" y="402" width="156" height="26" rx="5" fill="#1E3A66"/>
<text x="160" y="415" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">leaver</text>
<line x1="260" y1="365" x2="328" y2="365" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>

<!-- CENTER spine: OrgTree registry -->
<rect x="330" y="170" width="120" height="400" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="390" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">OrgTree</text>
<text x="390" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">registry</text>
<rect x="344" y="248" width="92" height="62" rx="5" fill="#0D1B2E"/>
<text x="390" y="270" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">InsiderRisk</text>
<text x="390" y="288" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Scope</text>
<rect x="344" y="320" width="92" height="62" rx="5" fill="#0D1B2E"/>
<text x="390" y="342" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">CommCompl</text>
<text x="390" y="360" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Scope</text>
<rect x="344" y="392" width="92" height="62" rx="5" fill="#0D1B2E"/>
<text x="390" y="414" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">DSPM-AI</text>
<text x="390" y="432" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">rollup</text>

<!-- THREE JOB LANES -->
<!-- top lane: IRM scope job -->
<line x1="450" y1="279" x2="530" y2="220" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<rect x="532" y="186" width="220" height="64" rx="8" fill="#0D1B2E"/>
