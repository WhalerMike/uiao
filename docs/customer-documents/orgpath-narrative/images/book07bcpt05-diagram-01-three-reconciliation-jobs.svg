<text x="924" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Purview surface</text>
<text x="924" y="230" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">+ Graph API</text>

<!-- middle lane: Comm Compliance job -->
<line x1="450" y1="351" x2="530" y2="351" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
