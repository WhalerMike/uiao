<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">A common organizational position across all</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">three server surfaces</text><rect x="360" y="140" width="560" height="64" rx="8" fill="#0D1B2E"/><text x="640" y="172" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Organizational Hierarchy Registry  →  /Org/Operations/FieldServices</text><rect x="60" y="330" width="340" height="150" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><rect x="60" y="330" width="340" height="10" rx="0" fill="#0D1B2E"/><text x="230" y="375" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">AD computer object</text><text x="230" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">OU path</text><text x="230" y="448" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">position = /Org/Operations/FieldServices</text><line x1="230" y1="206" x2="230" y2="328" stroke="#D4A017" stroke-width="2.6" marker-end="url(#ar-amber)"/><rect x="470" y="330" width="340" height="150" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><rect x="470" y="330" width="340" height="10" rx="0" fill="#5B2D8E"/><text x="640" y="375" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Entra ID device object</text><text x="640" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">extension attribute</text><text x="640" y="448" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#5B2D8E" text-anchor="middle" dominant-baseline="central">position = /Org/Operations/FieldServices</text><line x1="640" y1="206" x2="640" y2="328" stroke="#D4A017" stroke-width="2.6" marker-end="url(#ar-amber)"/><rect x="880" y="330" width="340" height="150" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><rect x="880" y="330" width="340" height="10" rx="0" fill="#1E8C8C"/><text x="1050" y="375" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure Arc resource</text><text x="1050" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">resource tag</text><text x="1050" y="448" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">position = /Org/Operations/FieldServices</text><line x1="1050" y1="206" x2="1050" y2="328" stroke="#D4A017" stroke-width="2.6" marker-end="url(#ar-amber)"/><rect x="160" y="520" width="960" height="70" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/><text x="640" y="555" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">one position value  →  returns this server across all three planes as a single governed asset</text>
