<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="bold" fill="#0D1B2E" text-anchor="start">The DAX measure library — the translation</text>
<text x="60" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="bold" fill="#0D1B2E" text-anchor="start">layer from fact data to governance KPIs</text>

<!-- Left: seven navy source/fact tables -->
<text x="60" y="148" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.4" fill="#6B7A8D" text-anchor="start">FACT TABLES</text>
<rect x="60" y="158" width="220" height="44" rx="7" fill="#0D1B2E"/>
<text x="170" y="180" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">IntuneCompliance</text>
<rect x="60" y="212" width="220" height="44" rx="7" fill="#0D1B2E"/>
<text x="170" y="234" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">SentinelDrift</text>
<rect x="60" y="266" width="220" height="44" rx="7" fill="#0D1B2E"/>
<text x="170" y="288" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">SentinelPIM</text>
<rect x="60" y="320" width="220" height="44" rx="7" fill="#0D1B2E"/>
<text x="170" y="342" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">DefenderPosture</text>
<rect x="60" y="374" width="220" height="44" rx="7" fill="#0D1B2E"/>
<text x="170" y="396" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">SentinelDLP</text>
<rect x="60" y="428" width="220" height="44" rx="7" fill="#0D1B2E"/>
<text x="170" y="450" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">GuestConfigCompliance</text>
<rect x="60" y="482" width="220" height="44" rx="7" fill="#0D1B2E"/>
<text x="170" y="504" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">GuestAccounts</text>

<!-- arrows into central measures table -->
<line x1="280" y1="180" x2="488" y2="320" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="280" y1="234" x2="488" y2="335" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="280" y1="288" x2="488" y2="350" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="280" y1="342" x2="488" y2="362" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="280" y1="396" x2="488" y2="375" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="280" y1="450" x2="488" y2="388" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="280" y1="504" x2="488" y2="402" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>

<!-- top amber slicer chip with downward arrow -->
<rect x="500" y="158" width="300" height="56" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="650" y="180" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath hierarchy selection</text>
<text x="650" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">slicer context</text>
<line x1="650" y1="214" x2="650" y2="288" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<text x="666" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="start">filter context propagates through</text>
<text x="666" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="start">active one-to-many relationships</text>

<!-- central teal measures table -->
<rect x="490" y="296" width="320" height="140" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="650" y="332" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#1E8C8C" text-anchor="middle">_Measures table</text>
<text x="650" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">calculated table, no rows</text>
<text x="650" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">container only</text>
<text x="650" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="middle">measures aggregate without referencing OrgPath directly</text>

<!-- Right: two amber output groups -->
<line x1="810" y1="340" x2="916" y2="270" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="810" y1="392" x2="916" y2="462" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<rect x="918" y="194" width="302" height="156" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1069" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Continuous KPIs</text>
<text x="1069" y="252" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle">Compliance Rate %</text>
<text x="1069" y="278" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle">Drift counts</text>
<text x="1069" y="304" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle">Health Rate</text>

<rect x="918" y="386" width="302" height="150" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1069" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">RAG status mapping</text>
<rect x="966" y="440" width="68" height="44" rx="6" fill="#1E8C8C"/>
<text x="1000" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Green</text>
<rect x="1042" y="440" width="68" height="44" rx="6" fill="#D4A017"/>
<text x="1076" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Amber</text>
<rect x="1118" y="440" width="68" height="44" rx="6" fill="#C0392B"/>
<text x="1152" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Red</text>
<text x="1069" y="514" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">executive scorecard status</text>

<!-- red threshold callout -->
<rect x="918" y="560" width="302" height="60" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="1069" y="584" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#C0392B" text-anchor="middle">Governance-defined thresholds</text>
<text x="1069" y="604" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">review with governance board</text>
<line x1="1069" y1="536" x2="1069" y2="558" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ar-red)" stroke-dasharray="4 3"/>
</svg>
