<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Six-phase drift detection loop — network</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">admission as the fifth governed plane</text>

<!-- ring center at (700,380), radius ~150. 6 nodes clockwise -->
<!-- Snapshot top -->
<rect x="620" y="180" width="160" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="700" y="208" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Snapshot</text>
<!-- Compare upper-left -->
<rect x="430" y="290" width="160" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="510" y="318" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Compare</text>
<!-- Classify lower-left -->
<rect x="430" y="430" width="160" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="510" y="458" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Classify</text>
<!-- Alert bottom -->
<rect x="620" y="540" width="160" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="700" y="568" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Alert</text>
<!-- Remediate lower-right -->
<rect x="810" y="430" width="160" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="890" y="458" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Remediate</text>
<!-- Verify upper-right -->
<rect x="810" y="290" width="160" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="890" y="318" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Verify</text>

<!-- clockwise ring arrows -->
<line x1="620" y1="215" x2="585" y2="295" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="510" y1="346" x2="510" y2="426" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="585" y1="480" x2="620" y2="558" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="780" y1="568" x2="845" y2="488" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="890" y1="426" x2="890" y2="348" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="845" y1="295" x2="780" y2="218" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- two navy input boxes feeding Compare from the left -->
<rect x="60" y="250" width="260" height="50" rx="8" fill="#0D1B2E"/>
<text x="190" y="275" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">canon nac_assignments — desired</text>
<rect x="60" y="320" width="260" height="50" rx="8" fill="#0D1B2E"/>
<text x="190" y="345" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">live AAA-server state — actual</text>
<line x1="320" y1="275" x2="428" y2="312" stroke="#0D1B2E" stroke-width="2" marker-end="url(#ar-navy)"/>
<line x1="320" y1="345" x2="428" y2="322" stroke="#0D1B2E" stroke-width="2" marker-end="url(#ar-navy)"/>

<!-- two branches out of Classify -->
<line x1="510" y1="486" x2="430" y2="560" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<rect x="100" y="540" width="320" height="56" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="260" y="562" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">create or update</text>
<text x="260" y="580" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">auto-remediable</text>

<line x1="500" y1="486" x2="400" y2="650" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>
<rect x="100" y="630" width="320" height="56" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="260" y="652" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">phantom or missing — governance review</text>
<text x="260" y="670" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C0392B" text-anchor="middle" dominant-baseline="central">filtered from write path</text>

<!-- red halt badge attached to ring -->
<rect x="940" y="180" width="280" height="56" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="1080" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">halt_on_critical — P1</text>
<text x="1080" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C0392B" text-anchor="middle" dominant-baseline="central">skip Remediate</text>
<line x1="940" y1="220" x2="892" y2="290" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="4 4"/>

<!-- amber callout lower right: posture delta -->
<rect x="940" y="540" width="300" height="80" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1090" y="566" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">posture delta</text>
<text x="1090" y="588" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Intune compliance vs</text>
<text x="1090" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">AAA enforcement</text>
</svg>
