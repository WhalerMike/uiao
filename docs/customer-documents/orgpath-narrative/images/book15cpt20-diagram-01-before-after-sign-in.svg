<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Before and after: the everyday sign-in</text>

<!-- divider -->
<line x1="640" y1="110" x2="640" y2="660" stroke="#6B7A8D" stroke-width="1.4"/>

<!-- BEFORE label -->
<text x="350" y="130" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#C0392B" text-anchor="middle">BEFORE</text>
<!-- AFTER label -->
<text x="930" y="130" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E8C8C" text-anchor="middle">AFTER</text>

<!-- BEFORE panel (red) -->
<rect x="80" y="160" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="200" y="187" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">WORKSTATION</text>
<text x="200" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">desktop workstation</text>
<rect x="80" y="245" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="200" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">password prompt</text>
<text x="200" y="295" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C0392B" text-anchor="middle" dominant-baseline="central">expires every 90 days</text>
<rect x="80" y="330" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="200" y="357" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">forgotten password</text>
<text x="200" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">help desk call</text>
<line x1="320" y1="365" x2="370" y2="365" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ar-red)"/>
<rect x="372" y="338" width="200" height="54" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.4"/>
<text x="472" y="365" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">help desk call</text>
<rect x="80" y="415" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="200" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">local C drive</text>
<text x="200" y="465" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">Desktop Documents Pictures</text>
<rect x="180" y="510" width="280" height="50" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="320" y="535" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">high friction</text>

<!-- AFTER panel -->
<rect x="700" y="160" width="240" height="70" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="820" y="183" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">WINDOWS HELLO</text>
<text x="820" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">biometric or PIN</text>
<rect x="960" y="160" width="240" height="70" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1080" y="183" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">FIDO2 security key</text>
<text x="1080" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">hardware-bound</text>
<rect x="700" y="245" width="240" height="70" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="820" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">MICROSOFT AUTHENTICATOR</text>
<text x="820" y="291" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">phone approval</text>
<rect x="960" y="245" width="240" height="70" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1080" y="263" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">CONDITIONAL ACCESS</text>
<text x="1080" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">verifies only when</text>
<text x="1080" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">context is unusual</text>
<rect x="700" y="330" width="240" height="70" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="820" y="353" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">ONEDRIVE</text>
<text x="820" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">Known Folder Move syncs</text>
<rect x="960" y="330" width="240" height="70" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1080" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">COMPANY PORTAL</text>
<text x="1080" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">self-service reset</text>
<rect x="820" y="415" width="280" height="50" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="960" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">low friction · context-aware</text>

<!-- modernization arrow across divider -->
<line x1="200" y1="610" x2="1080" y2="610" stroke="#D4A017" stroke-width="3" marker-end="url(#ar-amber)"/>
<rect x="540" y="588" width="200" height="44" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
<text x="640" y="610" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">MODERNIZATION</text>
</svg>
