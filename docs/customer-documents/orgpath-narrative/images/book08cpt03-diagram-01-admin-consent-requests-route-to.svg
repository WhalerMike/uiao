<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Consent requests route to the owning</text>
<text x="60" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath node's approver group</text>

<!-- user consent request -->
<rect x="60" y="320" width="230" height="90" rx="8" fill="#0D1B2E"/>
<text x="175" y="356" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Admin consent</text>
<text x="175" y="380" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">request workflow</text>

<line x1="290" y1="365" x2="358" y2="365" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-grey)"/>

<!-- decision diamond (amber) -->
<polygon points="490,260 620,365 490,470 360,365" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="490" y="346" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Read application's</text>
<text x="490" y="366" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">owner OrgPath,</text>
<text x="490" y="386" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">route by branch</text>

<!-- Engineering lane (teal) -->
<line x1="620" y1="320" x2="748" y2="262" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<text x="660" y="295" font-family="Consolas, monospace" font-size="12" fill="#1E8C8C" text-anchor="end">/Root/Engineering</text>
<rect x="750" y="208" width="430" height="110" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="965" y="240" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Engineering approver group</text>
<text x="965" y="270" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">pre-approved consent latitude</text>
<text x="965" y="290" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">within a defined permission envelope</text>

<!-- Finance lane (navy) -->
<line x1="620" y1="410" x2="748" y2="468" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>
<text x="660" y="435" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="end">/Root/Finance</text>
<rect x="750" y="414" width="430" height="110" rx="8" fill="#0D1B2E"/>
<text x="965" y="446" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Finance approver group</text>
<text x="965" y="476" font-family="Arial, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle">every request reviewed and</text>
<text x="965" y="496" font-family="Arial, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle">approved explicitly</text>

<!-- unrecognized application -> security review (red) -->
<line x1="490" y1="470" x2="490" y2="558" stroke="#C0392B" stroke-width="2.4" marker-end="url(#ar-red)"/>
<text x="320" y="520" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle">application not on WatchList</text>
<rect x="300" y="560" width="380" height="92" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.8"/>
<text x="490" y="594" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#C0392B" text-anchor="middle">Security review</text>
<text x="490" y="622" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">unrecognized application flagged</text>
</svg>
