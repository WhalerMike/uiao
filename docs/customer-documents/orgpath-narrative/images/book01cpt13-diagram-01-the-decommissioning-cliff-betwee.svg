<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">The decommissioning cliff between</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">AD-integrated DNS and Azure DNS</text><rect x="60" y="170" width="520" height="250" rx="10" fill="#0D1B2E"/><text x="320" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">AD-INTEGRATED DNS</text><text x="320" y="265" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">SRV service-locator records woven into</text><text x="320" y="299" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">the directory — _kerberos._tcp, _ldap._tcp</text><text x="320" y="333" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">— replicated with every domain controller.</text><line x1="560" y1="300" x2="740" y2="440" stroke="#C0392B" stroke-width="3" marker-end="url(#ar-red)"/><text x="560" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" font-style="italic" fill="#C0392B" text-anchor="middle" dominant-baseline="central">last DC decommissioned</text><rect x="740" y="430" width="460" height="120" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/><text x="970" y="481.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure DNS — no SRV, no KDC to locate.</text><text x="970" y="498.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Authentication against the old domain fails.</text><text x="640" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">A cliff, not a slope — every DNS consumer must move first, and no native tool maps them.</text>
</svg>
