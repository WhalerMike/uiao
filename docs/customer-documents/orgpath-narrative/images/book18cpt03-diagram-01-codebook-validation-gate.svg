<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Book 18 Ch.3 — The codebook is a governed contract, consulted at every write. ADR-093 blueprint register. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="c3-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="c3-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <text x="60" y="74" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">A governed contract, consulted at every write</text>

  <!-- Incoming values -->
  <rect x="60" y="128" width="300" height="312" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="84" y="160" font-size="16" font-weight="bold" fill="#0D1B2E">Values entering a slot</text>
  <rect x="84" y="184" width="252" height="62" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="210" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#0D1B2E">department = FIN</text>
  <text x="210" y="232" text-anchor="middle" font-size="12" fill="#6B7A8D">enumerated · known value</text>
  <rect x="84" y="258" width="252" height="62" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="210" y="284" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#C0392B">region = EMEAA</text>
  <text x="210" y="306" text-anchor="middle" font-size="12" fill="#C0392B">typo · not in the set</text>
  <rect x="84" y="332" width="252" height="62" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="210" y="358" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#0D1B2E">hire-date = 2019-03-04</text>
  <text x="210" y="380" text-anchor="middle" font-size="12" fill="#6B7A8D">typed pattern · matches</text>

  <line x1="360" y1="284" x2="426" y2="284" stroke="#1E8C8C" stroke-width="3" marker-end="url(#c3-teal)"/>

  <!-- The codebook gate -->
  <rect x="432" y="128" width="372" height="312" rx="12" fill="#0D1B2E"/>
  <text x="456" y="162" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#FFFFFF">Codebook gate</text>
  <text x="456" y="186" font-family="Consolas, monospace" font-size="13" fill="#A9B8CA">UIAO_151 · validated per facet</text>

  <rect x="456" y="204" width="324" height="62" rx="8" fill="#1E3A66"/>
  <text x="470" y="228" font-size="14" font-weight="bold" fill="#FFFFFF">Enumerated facet</text>
  <text x="470" y="250" font-family="Consolas, monospace" font-size="12" fill="#D7F2EE">region in { AMER, EMEA, APAC }</text>

  <rect x="456" y="276" width="324" height="62" rx="8" fill="#1E3A66"/>
  <text x="470" y="300" font-size="14" font-weight="bold" fill="#FFFFFF">Typed facet</text>
  <text x="470" y="322" font-family="Consolas, monospace" font-size="12" fill="#D7F2EE">hire-date matches ISO-8601 date</text>

  <rect x="456" y="348" width="324" height="62" rx="8" fill="#1E3A66"/>
  <text x="470" y="372" font-size="14" font-weight="bold" fill="#FFFFFF">Reserved slot</text>
  <text x="470" y="394" font-family="Consolas, monospace" font-size="12" fill="#A9B8CA">held for future use · rejects writes</text>

  <!-- valid path -->
  <line x1="804" y1="218" x2="872" y2="200" stroke="#1E8C8C" stroke-width="3" marker-end="url(#c3-teal)"/>
  <rect x="876" y="150" width="344" height="120" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1048" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Valid value</text>
  <text x="1048" y="220" text-anchor="middle" font-size="14" fill="#33414F">stamped onto the substrate,</text>
  <text x="1048" y="242" text-anchor="middle" font-size="14" fill="#33414F">readable identically everywhere</text>

  <!-- invalid path -->
  <line x1="804" y1="356" x2="872" y2="372" stroke="#C0392B" stroke-width="3" marker-end="url(#c3-red)"/>
  <rect x="876" y="312" width="344" height="120" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="1048" y="352" text-anchor="middle" font-size="18" font-weight="bold" fill="#C0392B">Invalid value</text>
  <text x="1048" y="382" text-anchor="middle" font-size="14" fill="#33414F">becomes a typed finding —</text>
  <text x="1048" y="404" text-anchor="middle" font-size="14" fill="#33414F">never a silently wrong group</text>

  <!-- governed-artifact strip -->
  <rect x="60" y="476" width="1160" height="156" rx="12" fill="#FFFFFF" stroke="#2E75B6" stroke-width="2"/>
  <text x="84" y="512" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#0D1B2E">A governed artifact, not a dropdown</text>
  <rect x="84"  y="532" width="352" height="80" rx="9" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="260" y="566" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Changed only by reviewed</text>
  <text x="260" y="588" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">pull request</text>
  <rect x="452" y="532" width="352" height="80" rx="9" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="628" y="566" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Bound to the narrative</text>
  <text x="628" y="588" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">that justifies it</text>
  <rect x="820" y="532" width="376" height="80" rx="9" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="1008" y="566" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Per-facet: one value retires</text>
  <text x="1008" y="588" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">without touching the others</text>
</svg>
