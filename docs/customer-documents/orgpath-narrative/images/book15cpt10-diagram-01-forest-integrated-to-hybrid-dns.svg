<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="29" font-weight="bold" fill="#0D1B2E">DNS modernization: forest-integrated to hybrid</text>

<!-- LEFT: AD-integrated DNS -->
<rect x="60" y="120" width="290" height="240" rx="10" fill="#0D1B2E"/>
<text x="205" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AD-integrated DNS</text>
<text x="205" y="170" font-family="Arial, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">load-bearing roles</text>
<g font-family="Consolas, monospace" font-size="11" fill="#C7D4E6">
<text x="82" y="200">domain controller location</text>
<text x="82" y="232">Kerberos ticket issuance</text>
<text x="82" y="264">Group Policy application</text>
<text x="82" y="296">client service location</text>
</g>
<rect x="60" y="375" width="290" height="48" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
<text x="205" y="399" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">no replacement = authentication outage</text>

<!-- CENTER: assessment registry -->
<rect x="420" y="150" width="280" height="120" rx="10" fill="#0D1B2E"/>
<text x="560" y="186" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Assessment registry</text>
<text x="560" y="212" font-family="Arial, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">every zone record inventoried,</text>
<text x="560" y="230" font-family="Arial, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">categorized, and assigned a target</text>
<text x="560" y="248" font-family="Arial, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">before any zone is touched</text>
<line x1="350" y1="210" x2="418" y2="210" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- private resolver amber -->
<rect x="420" y="310" width="280" height="90" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="560" y="336" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Azure DNS Private Resolver</text>
<text x="560" y="360" font-family="Arial, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">inbound + outbound endpoints · bidirectional</text>
<text x="560" y="378" font-family="Arial, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">forwarding rulesets replace conditional forwarders</text>

<!-- SRV special class -->
<rect x="420" y="440" width="280" height="60" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="560" y="464" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">SRV service-locator records</text>
<text x="560" y="484" font-family="Arial, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">tracked as a special class</text>

<!-- RIGHT: three teal targets -->
<rect x="780" y="130" width="430" height="74" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="995" y="160" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Azure DNS Private Zones</text>
<text x="995" y="182" font-family="Arial, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">internal names</text>
<rect x="780" y="220" width="430" height="74" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="995" y="250" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Azure DNS Public Zones</text>
<text x="995" y="272" font-family="Arial, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">internet-resolvable names</text>
<rect x="780" y="310" width="430" height="74" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="995" y="340" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Reverse lookup zones</text>
<text x="995" y="362" font-family="Arial, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">retained with PTR delegation</text>

<!-- arrows registry -> targets -->
<line x1="700" y1="180" x2="778" y2="167" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="700" y1="210" x2="778" y2="257" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="700" y1="240" x2="778" y2="347" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
</svg>
