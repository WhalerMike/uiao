<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Supervised and reviewer populations both from</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath — segregation enforced structurally</text>

<!-- LEFT: two separate OrgTree branches -->
<!-- Supervised branch -->
<rect x="60" y="150" width="270" height="120" rx="9" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<rect x="80" y="166" width="160" height="42" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="160" y="187" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">/Root</text>
<rect x="100" y="216" width="210" height="42" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="205" y="237" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">/Root/Trading</text>
<line x1="120" y1="208" x2="120" y2="237" stroke="#1E8C8C" stroke-width="1.6"/>
<line x1="120" y1="237" x2="100" y2="237" stroke="#1E8C8C" stroke-width="1.6"/>
<rect x="100" y="216" width="210" height="0"/>
<text x="195" y="287" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">supervised segment &#183; CommComplianceScope=true</text>

<!-- Reviewer branch -->
<rect x="60" y="370" width="270" height="86" rx="9" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<rect x="100" y="388" width="210" height="44" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="205" y="410" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">/Root/Compliance-Office</text>
<text x="195" y="473" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">oversight chain supplies reviewers &#183; no scope flag</text>

<!-- amber connectors to center -->
<line x1="330" y1="237" x2="500" y2="280" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<text x="408" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#9A7611" text-anchor="middle" dominant-baseline="central">supervised set on OrgPath</text>
<line x1="330" y1="410" x2="500" y2="340" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<text x="408" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#9A7611" text-anchor="middle" dominant-baseline="central">reviewer set from oversight</text>

<!-- CENTER: Comm Compliance policy -->
<rect x="502" y="258" width="320" height="104" rx="8" fill="#0D1B2E"/>
<text x="662" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Comm Compliance policy: Trading</text>
<text x="662" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">supervised = Trading</text>
<text x="662" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">reviewers = Compliance-Office</text>

<!-- RIGHT: Reconciliation job -->
<rect x="900" y="150" width="320" height="150" rx="8" fill="#0D1B2E"/>
<text x="1060" y="178" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Reconciliation job</text>
<text x="1060" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">drives supervised membership,</text>
<text x="1060" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">resolves reviewers from chain,</text>
<text x="1060" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">asserts the two sets are disjoint</text>
<rect x="950" y="262" width="220" height="26" rx="5" fill="#1E3A66"/>
<text x="1060" y="275" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">drive explicitly &#183; no Adaptive Scope</text>
<line x1="900" y1="300" x2="822" y2="312" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>

<!-- red DRIFT-SEGREGATION across boundary -->
<rect x="380" y="486" width="500" height="86" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<circle cx="412" cy="516" r="12" fill="#C0392B"/>
<text x="412" y="517" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">!</text>
<text x="438" y="512" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="start" dominant-baseline="central">DRIFT-SEGREGATION</text>
<text x="438" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start" dominant-baseline="central">reviewer must not appear in supervised scope —</text>
<text x="438" y="558" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start" dominant-baseline="central">one user found in both sets</text>
<!-- red line pointing to the overlap between the two branches -->
<line x1="380" y1="510" x2="205" y2="320" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar-red)"/>

<!-- dashed navy job -> evidence -->
<line x1="1060" y1="300" x2="1060" y2="486" stroke="#0D1B2E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-navy)"/>
<text x="1075" y="400" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">DRIFT-PROVENANCE</text>
<rect x="930" y="488" width="260" height="78" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="1060" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Evidence Bundle</text>
<text x="1060" y="544" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">every membership + reviewer change</text>

<text x="640" y="630" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">Both populations follow position; their disjointness is a checkable property, not a manual review.</text>
</svg>
