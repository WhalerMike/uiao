<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E">The OrgPath schema extension — registration,</text><text x="60" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E">value format, and the four attributes</text>

<!-- Left panel: Registration -->
<rect x="50" y="140" width="380" height="530" rx="10" fill="none" stroke="#0D1B2E" stroke-width="2"/>
<rect x="50" y="140" width="380" height="48" rx="10" fill="#0D1B2E"/><text x="240" y="170" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Registration</text>
<rect x="74" y="208" width="332" height="80" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="240" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Entra ID app registration</text><text x="240" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">acts as ownership anchor</text>
<rect x="74" y="306" width="332" height="80" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><text x="240" y="330" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#33414F" text-anchor="middle">POST /v1.0/applications/{id}/</text><text x="240" y="346" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#33414F" text-anchor="middle">extensionProperties</text><text x="240" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle">produces a registered name</text>
<rect x="74" y="404" width="332" height="44" rx="6" fill="#1E3A66"/><text x="240" y="426" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">extension_{appId}_OrgPath</text>
<rect x="74" y="478" width="332" height="80" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/><text x="240" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle">Never delete this app</text><text x="240" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">orphans all values</text>

<!-- Center panel: Format -->
<rect x="450" y="140" width="380" height="530" rx="10" fill="none" stroke="#0D1B2E" stroke-width="2"/>
<rect x="450" y="140" width="380" height="48" rx="10" fill="#0D1B2E"/><text x="640" y="170" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Format</text>
<rect x="474" y="208" width="332" height="56" rx="8" fill="#1E3A66"/><text x="640" y="240" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">NCR / Sales / Data</text>
<text x="640" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">uppercase 2&#8211;8-character node ids</text><text x="640" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">separated by forward slashes</text>
<rect x="474" y="340" width="332" height="58" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><text x="640" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#6B7A8D" text-anchor="middle">validation regex</text><text x="640" y="384" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="middle">^(/[A-Z0-9]{2,8})+$</text>
<rect x="474" y="416" width="332" height="44" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/><text x="640" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">leading slash mandatory</text>
<rect x="474" y="476" width="332" height="44" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/><text x="640" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">max 256 characters</text>

<!-- Right panel: The four attributes -->
<rect x="850" y="140" width="380" height="530" rx="10" fill="none" stroke="#1E8C8C" stroke-width="2"/>
<rect x="850" y="140" width="380" height="48" rx="10" fill="#1E8C8C"/><text x="1040" y="170" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">The four attributes</text>
<rect x="874" y="208" width="332" height="96" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="890" y="232" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E">OrgPath</text><text x="890" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">String &#183; full path</text><text x="890" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6B7A8D">targetObjects: User, Device</text>
<rect x="874" y="316" width="332" height="96" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="890" y="340" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E">OrgNodeId</text><text x="890" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">String &#183; leaf id for equality filter</text><text x="890" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6B7A8D">targetObjects: User, Device</text>
<rect x="874" y="424" width="332" height="96" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="890" y="448" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E">OrgDepth</text><text x="890" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">Integer &#183; segment count</text><text x="890" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6B7A8D">targetObjects: User, Device</text>
<rect x="874" y="532" width="332" height="116" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="890" y="556" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E">OrgLastValidated</text><text x="890" y="578" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">String &#183; ISO 8601 timestamp</text><text x="890" y="598" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">of last validation</text><text x="890" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6B7A8D">targetObjects: User, Device</text>
</svg>
