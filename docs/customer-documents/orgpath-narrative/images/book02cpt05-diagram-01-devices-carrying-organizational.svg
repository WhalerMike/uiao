<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Devices carrying organizational position</text><text x="60" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D" text-anchor="start">NATIVE DEVICE ATTRIBUTES</text><rect x="60" y="175" width="420" height="260" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><text x="90" y="215" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">· Hardware IDs</text><text x="90" y="253" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">· Device name</text><text x="90" y="291" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">· OS version</text><text x="90" y="329" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">· Compliance state</text><text x="90" y="367" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">· Device-category tags</text><text x="270" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#C0392B" text-anchor="middle" dominant-baseline="central">organizationally blind — no governed unit</text><line x1="490" y1="300" x2="640" y2="300" stroke="#0D1B2E" stroke-width="3" marker-end="url(#ar-navy)"/><text x="565" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">extend the</text><text x="565" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">position model</text><rect x="650" y="175" width="560" height="120" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/><text x="930" y="212" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Device object + position = /Org/Finance</text><text x="930" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">derived from the hierarchy registry — same</text><text x="930" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">vocabulary as the user attribute</text><line x1="930" y1="295" x2="930" y2="330" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><rect x="650" y="332" width="560" height="56" rx="8" fill="#0D1B2E"/><text x="930" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">dynamic group:  position startsWith "/Org/Finance"  → users + devices</text><line x1="930" y1="388" x2="930" y2="418" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><rect x="650" y="420" width="175" height="48" rx="8" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1.2"/><text x="737.5" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Configuration</text><rect x="840" y="420" width="175" height="48" rx="8" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1.2"/><text x="927.5" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Compliance</text><rect x="1030" y="420" width="175" height="48" rx="8" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1.2"/><text x="1117.5" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Endpoint security</text>
</svg>
