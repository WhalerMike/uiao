idth="2.2" marker-end="url(#ar-grey)"/><line x1="640" y1="242" x2="199" y2="300" stroke="#E3E8EF" stroke-width="1.4" marker-end="url(#ar-grey)"/><rect x="60" y="302" width="278" height="60" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.6"/><text x="199" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">stale path</text><line x1="640" y1="242" x2="497" y2="300" stroke="#E3E8EF" stroke-width="1.4" marker-end="url(#ar-grey)"/><rect x="358" y="302" width="278" height="60" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.6"/><text x="497" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">missing attribute</text><line x1="640" y1="242" x2="795" y2="300" stroke="#E3E8EF" stroke-width="1.4" marker-end="url(#ar-grey)"/><rect x="656" y="302" width="278" height="60" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/><text x="795" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">invalid syntax</text><line x1="640" y1="242" x2="1093" y2="300" stroke="#E3E8EF" stroke-width="1.4" marker-end="url(#ar-grey)"/><rect x="954" y="302" width="278" height="60" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/><text x="1093" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">membership mismatch</text><line x1="640" y1="362" x2="640" y2="400" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-grey)"/><rect x="360" y="402" width="560" height="70" rx="8" fill="#0D1B2E"/><text x="640" y="437" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFF