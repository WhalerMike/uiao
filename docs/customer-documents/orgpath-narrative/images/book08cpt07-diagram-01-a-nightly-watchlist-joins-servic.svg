<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">A nightly WatchList joins sign-in telemetry</text>
<text x="60" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">to each application's OrgPath owner</text>

<!-- LEFT: governance inventory (navy) -->
<rect x="60" y="200" width="250" height="110" rx="8" fill="#0D1B2E"/>
<text x="185" y="244" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Governance</text>
<text x="185" y="268" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OrgPath inventory</text>

<line x1="310" y1="255" x2="378" y2="255" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-grey)"/>
<text x="344" y="242" font-family="Arial, sans-serif" font-size="10.5" fill="#5A5A5A" text-anchor="middle">feeds</text>

<!-- WatchList (teal) -->
<rect x="380" y="190" width="290" height="130" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="525" y="222" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Sentinel WatchList</text>
<text x="525" y="248" font-family="Consolas, monospace" font-size="13" fill="#1E8C8C" text-anchor="middle">AppOrgPathWatchlist</text>
<text x="525" y="276" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">keyed by AppId</text>
<text x="525" y="296" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">refreshed nightly</text>

<!-- CENTER: sign-in logs stream (navy) -->
<rect x="380" y="400" width="290" height="100" rx="8" fill="#0D1B2E"/>
<text x="525" y="438" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Sign-in telemetry stream</text>
<text x="525" y="466" font-family="Consolas, monospace" font-size="12.5" fill="#C7D4E6" text-anchor="middle">ServicePrincipalSignInLogs</text>

<!-- join node -->
<line x1="525" y1="320" x2="525" y2="398" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-navy)"/>
<text x="595" y="360" font-family="Consolas, monospace" font-size="11.5" fill="#5A5A5A" text-anchor="start">join on AppId</text>

<line x1="670" y1="450" x2="760" y2="380" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- RIGHT: per-segment dashboard (teal) -->
<rect x="762" y="320" width="458" height="120" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="991" y="358" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Per-segment dashboard</text>
<text x="991" y="388" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">authentication activity organized</text>
<text x="991" y="408" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">by OrgPath owner</text>

<!-- Amber alert lane -> red UNOWNED finding -->
<rect x="762" y="490" width="458" height="56" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="991" y="512" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Alert lane: auth from an application</text>
<text x="991" y="532" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">missing from the WatchList</text>

<line x1="670" y1="475" x2="760" y2="515" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-grey)"/>

<rect x="762" y="576" width="458" height="76" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="991" y="606" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#C0392B" text-anchor="middle">UNOWNED finding</text>
<text x="991" y="632" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">routed to security operations</text>
<line x1="991" y1="546" x2="991" y2="574" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>
</svg>
