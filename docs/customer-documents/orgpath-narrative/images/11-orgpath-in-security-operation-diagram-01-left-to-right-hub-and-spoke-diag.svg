<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath substrate fans out to four operational</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">integrations and converges on one audit record</text>

<!-- Root substrate box (left) -->
<rect x="50" y="290" width="230" height="140" rx="8" fill="#0D1B2E"/>
<text x="165" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgPath substrate</text>
<text x="165" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">users · devices</text>
<text x="165" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">servers</text>

<!-- Cluster outline -->
<rect x="400" y="120" width="500" height="490" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.6"/>
<text x="420" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D" text-anchor="start">FOUR OPERATIONAL INTEGRATIONS</text>

<!-- Integration box 1 -->
<rect x="430" y="170" width="440" height="92" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="650" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">PIM eligibility groups</text>
<text x="650" y="228" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">ORG-BRANCH-{id} per node</text>

<!-- Integration box 2 -->
<rect x="430" y="276" width="440" height="92" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="650" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Lifecycle Workflow mover</text>
<text x="650" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgPath change to realign + review</text>

<!-- Integration box 3 -->
<rect x="430" y="382" width="440" height="92" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="650" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Sentinel KQL queries</text>
<text x="650" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">activations + drift by segment</text>

<!-- Integration box 4 -->
<rect x="430" y="488" width="440" height="92" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="650" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure RBAC via tag-based assignments</text>
<text x="650" y="546" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">resource plane</text>

<!-- Terminal record box (right) -->
<rect x="1000" y="280" width="230" height="160" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="1115" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Versioned</text>
<text x="1115" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">governance record</text>
<text x="1115" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">audit + compliance</text>
<text x="1115" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">evidence</text>

<!-- Arrows: substrate fans to four integration boxes -->
<line x1="280" y1="350" x2="428" y2="216" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="280" y1="355" x2="428" y2="322" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="280" y1="370" x2="428" y2="428" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="280" y1="375" x2="428" y2="534" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- Arrows: four integration boxes converge to terminal -->
<line x1="872" y1="216" x2="998" y2="330" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="872" y1="322" x2="998" y2="345" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="872" y1="428" x2="998" y2="365" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="872" y1="534" x2="998" y2="385" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<text x="640" y="660" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">One substrate · four integrations · one audit-grade governance record.</text>
</svg>
