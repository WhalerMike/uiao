<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">UIAO unifies the outputs of twelve disconnected</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Microsoft tools into one governed substrate</text>

<!-- twelve tool boxes, two rows -->
<!-- row 1 -->
<rect x="60" y="135" width="180" height="46" rx="6" fill="#0D1B2E"/><text x="150" y="158" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">MAP Toolkit</text>
<rect x="255" y="135" width="180" height="46" rx="6" fill="#0D1B2E"/><text x="345" y="158" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Azure Migrate</text>
<rect x="450" y="135" width="180" height="46" rx="6" fill="#0D1B2E"/><text x="540" y="158" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">GPO Analytics</text>
<rect x="645" y="135" width="180" height="46" rx="6" fill="#0D1B2E"/><text x="735" y="158" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Entra Connect</text>
<rect x="840" y="135" width="180" height="46" rx="6" fill="#0D1B2E"/><text x="930" y="158" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Cloud Sync</text>
<rect x="1035" y="135" width="180" height="46" rx="6" fill="#0D1B2E"/><text x="1125" y="151" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Defender for</text><text x="1125" y="166" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Identity</text>
<!-- row 2 -->
<rect x="60" y="195" width="180" height="46" rx="6" fill="#0D1B2E"/><text x="150" y="211" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Security Compliance</text><text x="150" y="226" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Toolkit</text>
<rect x="255" y="195" width="180" height="46" rx="6" fill="#0D1B2E"/><text x="345" y="218" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ADMT</text>
<rect x="450" y="195" width="180" height="46" rx="6" fill="#0D1B2E"/><text x="540" y="218" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">FastTrack</text>
<rect x="645" y="195" width="180" height="46" rx="6" fill="#0D1B2E"/><text x="735" y="218" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Connect Health</text>
<rect x="840" y="195" width="180" height="46" rx="6" fill="#0D1B2E"/><text x="930" y="218" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Azure Policy</text>
<rect x="1035" y="195" width="180" height="46" rx="6" fill="#0D1B2E"/><text x="1125" y="218" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">PowerShell + RSAT</text>

<!-- red siloed gaps note -->
<text x="640" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="central">siloed and non-interoperable  ·  approx 22 percent governance coverage</text>

<!-- consumption arrows into substrate -->
<line x1="150" y1="241" x2="150" y2="330" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="345" y1="241" x2="345" y2="330" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="540" y1="241" x2="540" y2="330" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="735" y1="241" x2="735" y2="330" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="930" y1="241" x2="930" y2="330" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="1125" y1="241" x2="1125" y2="330" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>

<!-- substrate bar -->
<rect x="60" y="335" width="1160" height="120" rx="10" fill="#1E8C8C"/>
<text x="80" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="start">UIAO governance substrate</text>
<!-- amber stage labels -->
<rect x="120" y="390" width="220" height="44" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/><text x="230" y="412" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">normalize</text>
<rect x="380" y="390" width="220" height="44" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/><text x="490" y="412" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">version</text>
<rect x="640" y="390" width="220" height="44" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/><text x="750" y="412" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">drift-detect</text>
<rect x="900" y="390" width="220" height="44" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/><text x="1010" y="412" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">compliance-map</text>
<line x1="340" y1="412" x2="378" y2="412" stroke="#FFFFFF" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="600" y1="412" x2="638" y2="412" stroke="#FFFFFF" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="860" y1="412" x2="898" y2="412" stroke="#FFFFFF" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- output box -->
<line x1="640" y1="455" x2="640" y2="500" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<rect x="360" y="502" width="560" height="64" rx="8" fill="#0D1B2E"/>
<text x="640" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">canonical record</text>
<text x="640" y="548" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">committed to versioned repository</text>

<!-- complementary layer callout -->
<rect x="60" y="610" width="420" height="60" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="270" y="634" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">complementary layer, not a replacement</text>
<text x="270" y="654" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">mirrors the ScubaGear analogy</text>
</svg>
