<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Entra ID Governance operates at the identity</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">layer — org context out of reach</text><rect x="200" y="150" width="880" height="92" rx="8" fill="#FBFAF7" stroke="#6B7A8D" stroke-width="1.6" stroke-dasharray="8 6"/><text x="640" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">ORGANIZATIONAL POSITION   ·   reporting chain · division · peer group · access tier</text><text x="640" y="216" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#C0392B" text-anchor="middle" dominant-baseline="central">not modeled — unavailable to any workflow</text><text x="203" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">✗</text><rect x="60" y="295" width="286" height="100" rx="8" fill="#0D1B2E"/><text x="203" y="336.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Access</text><text x="203" y="353.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Reviews</text><text x="503" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">✗</text><rect x="360" y="295" width="286" height="100" rx="8" fill="#0D1B2E"/><text x="503" y="336.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Entitlement</text><text x="503" y="353.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Management</text><text x="803" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">✗</text><rect x="660" y="295" width="286" height="100" rx="8" fill="#0D1B2E"/><text x="803" y="336.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Lifecycle</text><text x="803" y="353.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Workflows</text><text x="1103" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">✗</text><rect x="960" y="295" width="286" height="100" rx="8" fill="#0D1B2E"/><text x="1103" y="336.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Privileged Identity</text><text x="1103" y="353.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Management</text><rect x="60" y="440" width="1140" height="110" rx="0" fill="#EAF1FB"/><rect x="60" y="440" width="10" height="110" rx="0" fill="#1E8C8C"/><text x="90" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="start">IDENTITY + ASSIGNMENT LAYER.</text><text x="90" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="start">It governs whether an assignment exists — not whether it fits the organization.</text>
