<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">One hierarchy, two policy planes, joined by</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath</text>

<!-- Root -->
<rect x="440" y="120" width="400" height="62" rx="8" fill="#1E3A66"/>
<text x="640" y="143" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">UIAO OrgTree Registry</text>
<text x="640" y="166" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">governed identity namespace</text>

<!-- Fan to lanes -->
<line x1="540" y1="182" x2="320" y2="214" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="740" y1="182" x2="960" y2="214" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- LEFT lane: User Plane -->
<rect x="80" y="216" width="480" height="280" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="320" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="0.4" fill="#1E8C8C" text-anchor="middle">USER PLANE  (Part 7)</text>
<rect x="110" y="256" width="420" height="62" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="320" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath on every user</text>
<text x="320" y="300" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">extension attribute in Entra ID</text>
<rect x="110" y="346" width="420" height="62" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="320" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Purview Adaptive Policy Scopes</text>
<text x="320" y="390" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">OPATH filter on OrgPath</text>
<rect x="110" y="426" width="420" height="56" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="320" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Sensitivity Labels · DLP</text>
<text x="320" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Retention · eDiscovery</text>
<line x1="320" y1="318" x2="320" y2="344" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="320" y1="408" x2="320" y2="424" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- RIGHT lane: Data Plane -->
<rect x="720" y="216" width="480" height="280" rx="10" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.8"/>
<text x="960" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="0.4" fill="#8A6D10" text-anchor="middle">DATA PLANE  (Part 7a)</text>
<rect x="750" y="256" width="420" height="62" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="960" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath metadata on data assets</text>
<text x="960" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">Fabric Domain · OneLake security · Purview catalog</text>
<rect x="750" y="346" width="420" height="62" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="960" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Fabric Domain assignment</text>
<text x="960" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">workspace inheritance</text>
<rect x="750" y="426" width="420" height="56" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.4"/>
<text x="960" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Default sensitivity context</text>
<text x="960" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">lakehouse / mirror authorization</text>
<line x1="960" y1="318" x2="960" y2="344" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<line x1="960" y1="408" x2="960" y2="424" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>

<!-- Bottom evidence box -->
<rect x="300" y="540" width="680" height="74" rx="8" fill="#0D1B2E"/>
<text x="640" y="566" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Compliant lineage + audit evidence</text>
<text x="640" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">only meaningful if the identity namespace is governed</text>

<!-- Dashed arrows into evidence -->
<line x1="320" y1="482" x2="470" y2="538" stroke="#6B7A8D" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar-grey)"/>
<line x1="960" y1="482" x2="810" y2="538" stroke="#6B7A8D" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar-grey)"/>
<line x1="640" y1="182" x2="640" y2="538" stroke="#6B7A8D" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar-grey)"/>
<text x="700" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6B7A8D" text-anchor="start" transform="rotate(90 700 360)">join key on lineage + audit</text>
</svg>
