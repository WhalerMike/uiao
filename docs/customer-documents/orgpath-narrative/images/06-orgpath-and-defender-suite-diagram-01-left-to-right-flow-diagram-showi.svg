<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath unifies the siloed Defender suite</text>

<!-- OrgTree registry -->
<rect x="40" y="170" width="190" height="80" rx="8" fill="#0D1B2E"/>
<text x="135" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree Registry</text>
<text x="135" y="226" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">authoritative hierarchy</text>

<!-- OrgPath -->
<rect x="40" y="300" width="190" height="100" rx="8" fill="#0D1B2E"/>
<text x="135" y="332" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgPath</text>
<text x="135" y="358" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">on users, devices,</text>
<text x="135" y="376" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Arc tags</text>

<line x1="135" y1="250" x2="135" y2="298" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Defender suite cluster -->
<rect x="380" y="135" width="430" height="450" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="595" y="158" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.3" fill="#1E8C8C" text-anchor="middle">Defender suite (siloed signals without OrgPath)</text>

<!-- 4 product boxes -->
<rect x="405" y="175" width="380" height="88" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="595" y="202" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Defender for Endpoint</text>
<text x="595" y="226" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">device groups + RBAC scope</text>

<rect x="405" y="277" width="380" height="88" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="595" y="304" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Defender for Identity</text>
<text x="595" y="328" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">entity profiles + Sentinel rules</text>

<rect x="405" y="379" width="380" height="88" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="595" y="406" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Defender for Cloud Apps</text>
<text x="595" y="430" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">session controls + anomaly</text>

<rect x="405" y="481" width="380" height="88" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="595" y="508" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Defender for Cloud + Servers</text>
<text x="595" y="532" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">Azure Policy by OrgTier tag</text>

<!-- Arrows OrgPath -> each product, with binding labels -->
<line x1="230" y1="350" x2="403" y2="219" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<text x="305" y="262" font-family="Arial, sans-serif" font-size="10.5" fill="#1E8C8C" text-anchor="middle">dynamic group</text>
<text x="305" y="276" font-family="Arial, sans-serif" font-size="10.5" fill="#1E8C8C" text-anchor="middle">membership</text>

<line x1="230" y1="350" x2="403" y2="321" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<text x="312" y="318" font-family="Arial, sans-serif" font-size="10.5" fill="#1E8C8C" text-anchor="middle">identity org context</text>

<line x1="230" y1="350" x2="403" y2="423" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<text x="312" y="392" font-family="Arial, sans-serif" font-size="10.5" fill="#1E8C8C" text-anchor="middle">per-segment baselines</text>

<line x1="230" y1="350" x2="403" y2="525" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<text x="308" y="468" font-family="Arial, sans-serif" font-size="10.5" fill="#1E8C8C" text-anchor="middle">resource tag</text>
<text x="308" y="482" font-family="Arial, sans-serif" font-size="10.5" fill="#1E8C8C" text-anchor="middle">targeting</text>

<!-- Converge to XDR + Sentinel -->
<rect x="855" y="240" width="195" height="120" rx="8" fill="#0D1B2E"/>
<text x="952" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Defender XDR +</text>
<text x="952" y="302" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Microsoft Sentinel</text>
<text x="952" y="330" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">cross-product correlation</text>

<line x1="785" y1="219" x2="853" y2="280" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<line x1="785" y1="321" x2="853" y2="300" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<line x1="785" y1="423" x2="853" y2="320" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<line x1="785" y1="525" x2="853" y2="345" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>

<!-- Logic App playbooks -->
<rect x="1075" y="250" width="170" height="100" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1160" y="282" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Logic App</text>
<text x="1160" y="302" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">playbooks</text>
<text x="1160" y="328" font-family="Arial, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgPath-aware</text>
<text x="1160" y="342" font-family="Arial, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">response matrix</text>

<line x1="1050" y1="300" x2="1073" y2="300" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>

<text x="60" y="660" font-family="Arial, sans-serif" font-size="14.5" font-style="italic" fill="#6B7A8D" text-anchor="start">Each binding mechanism carries organizational context into a Defender product; signals reconverge for correlation and response.</text>
</svg>
