<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>

<text x="60" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">From HR duty station to Primary LocPath</text>
<text x="60" y="104" font-size="16" fill="#6B7A8D">The HR system of record assigns the person; the governed map and registry resolve the place</text>

<!-- 1. HR record (navy) -->
<rect x="40" y="250" width="240" height="120" rx="10" fill="#0D1B2E"/>
<text x="160" y="292" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#FFFFFF">HR record</text>
<text x="160" y="326" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#C7D4E6">locationCode: HQ-B3</text>

<!-- arrow 1 -->
<line x1="280" y1="310" x2="328" y2="310" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- 2. Duty-station map (ice fill, navy border) -->
<rect x="332" y="250" width="252" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="458" y="292" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#0D1B2E">Duty-station map</text>
<text x="458" y="326" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#33414F">(governed, Site-or-deeper)</text>

<!-- arrow 2 -->
<line x1="584" y1="310" x2="632" y2="310" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- 3. Location registry (ice fill, navy border) -->
<rect x="636" y="250" width="330" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="801" y="292" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#0D1B2E">Location registry</text>
<text x="801" y="326" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F">/USA/MD/ANNAPOLIS-HQ/BLDG-3</text>

<!-- arrow 3 -->
<line x1="966" y1="310" x2="1014" y2="310" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- 4. Primary LocPath (navy) -->
<rect x="1018" y="250" width="222" height="120" rx="10" fill="#0D1B2E"/>
<text x="1129" y="284" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Primary LocPath</text>
<text x="1129" y="312" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#C7D4E6">+ governing Site</text>
<text x="1129" y="338" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#C7D4E6">+ provenance</text>

<!-- red branch from below the map box to findings -->
<line x1="458" y1="370" x2="458" y2="466" stroke="#C0392B" stroke-width="3" marker-end="url(#ar-red)"/>
<text x="476" y="418" font-size="14" fill="#C0392B">does not resolve</text>

<!-- Findings box (red outline) -->
<rect x="258" y="470" width="400" height="170" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.4"/>
<text x="458" y="502" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#C0392B">Findings: GOV-LOCPATH-001..005</text>
<text x="458" y="534" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#5A5A5A">empty code</text>
<text x="458" y="558" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#5A5A5A">unmapped</text>
<text x="458" y="582" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#5A5A5A">unregistered</text>
<text x="458" y="606" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#5A5A5A">inactive</text>
<text x="458" y="630" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#5A5A5A">duplicate</text>
</svg>
