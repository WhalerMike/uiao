<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>

<!-- Title -->
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">The mirror ingests; authority never flows out</text>

<!-- ===== LEFT: Public Git mirror (outside boundary) ===== -->
<rect x="60" y="220" width="300" height="200" rx="22" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="210" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">PUBLIC GIT</text>
<text x="210" y="292" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="middle" dominant-baseline="central">mirror / ingest</text>
<text x="210" y="338" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">collaborate · read</text>
<text x="210" y="362" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">propose · reflect</text>

<!-- Internet source (top-left) -->
<rect x="60" y="120" width="240" height="64" rx="12" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
<text x="180" y="152" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">PUBLIC INTERNET</text>

<!-- ===== RIGHT: GCC-Moderate boundary ===== -->
<rect x="700" y="120" width="520" height="500" rx="14" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2.5" stroke-dasharray="10 6"/>
<text x="960" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">GCC-MODERATE BOUNDARY</text>

<!-- Authority server box -->
<rect x="760" y="260" width="400" height="240" rx="10" fill="#0D1B2E"/>
<text x="960" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">AUTHORITY-OF-RECORD</text>
<text x="960" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">on-premises · decides binding canon</text>

<!-- Amber governance tag -->
<rect x="800" y="372" width="320" height="96" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
<text x="960" y="398" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#D4A017" text-anchor="middle" dominant-baseline="central">binding history</text>
<text x="960" y="424" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#D4A017" text-anchor="middle" dominant-baseline="central">hooks enforced</text>
<text x="960" y="450" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#D4A017" text-anchor="middle" dominant-baseline="central">audit log</text>

<!-- ===== Solid teal arrow: pull-mirror INTO boundary ===== -->
<line x1="360" y1="300" x2="752" y2="300" stroke="#1E8C8C" stroke-width="4" marker-end="url(#ar-teal)"/>
<rect x="430" y="262" width="252" height="30" rx="6" fill="#FFFFFF"/>
<text x="556" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">pull-mirror, 15-min interval</text>

<!-- ===== Blocked red arrow: authority does NOT flow out ===== -->
<line x1="752" y1="392" x2="368" y2="392" stroke="#C0392B" stroke-width="4" marker-end="url(#ar-red)"/>
<!-- cross-out X over the blocked arrow -->
<line x1="540" y1="372" x2="580" y2="412" stroke="#C0392B" stroke-width="5"/>
<line x1="580" y1="372" x2="540" y2="412" stroke="#C0392B" stroke-width="5"/>
<rect x="368" y="424" width="312" height="30" rx="6" fill="#FFFFFF"/>
<text x="524" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">authority does not flow out</text>

<!-- ===== Blocked dashed red arrow: no public inbound (internet -> authority) ===== -->
<path d="M 300 152 L 540 152 L 540 240" fill="none" stroke="#C0392B" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#ar-red)"/>
<line x1="520" y1="180" x2="560" y2="220" stroke="#C0392B" stroke-width="5"/>
<line x1="560" y1="180" x2="520" y2="220" stroke="#C0392B" stroke-width="5"/>
<rect x="370" y="170" width="220" height="28" rx="6" fill="#FFFFFF"/>
<text x="480" y="185" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">no public inbound</text>

<!-- Legend bottom -->
<text x="60" y="560" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#33414F" text-anchor="start">A mirror is where canon is ingested. An authority is where canon is decided.</text>
<text x="60" y="588" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#5A5A5A" text-anchor="start">The mirror flows in; authority does not flow out.</text>
</svg>
