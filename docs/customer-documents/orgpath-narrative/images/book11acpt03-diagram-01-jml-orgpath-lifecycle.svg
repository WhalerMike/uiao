<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Joiner, mover, leaver workflows triggered by</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath state changes</text>

<!-- HR system -->
<rect x="120" y="125" width="220" height="56" rx="8" fill="#0D1B2E"/>
<text x="230" y="153" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">HR SYSTEM OF RECORD</text>
<line x1="340" y1="153" x2="430" y2="153" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- OrgTree change-request gate -->
<rect x="432" y="125" width="290" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="577" y="146" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgTree CHANGE-REQUEST GATE</text>
<text x="577" y="167" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">ADR-088</text>
<line x1="722" y1="153" x2="812" y2="153" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- OrgPath on entra object -->
<rect x="814" y="125" width="270" height="56" rx="8" fill="#0D1B2E"/>
<text x="949" y="146" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgPath on the Entra object</text>
<text x="949" y="167" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">native extension attribute</text>

<!-- three fan arrows down to columns -->
<line x1="949" y1="181" x2="230" y2="225" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="949" y1="181" x2="640" y2="225" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="949" y1="181" x2="1050" y2="225" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>

<!-- JOINER column -->
<rect x="60" y="227" width="340" height="56" rx="8" fill="#1E8C8C"/>
<text x="230" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">JOINER</text>
<text x="230" y="270" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">OrgPath set</text>
<rect x="60" y="291" width="340" height="245" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="82" y="322" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">enable account</text>
<text x="82" y="358" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">generate Temporary Access Pass</text>
<text x="82" y="394" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">add to groups</text>
<text x="82" y="430" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">request access packages</text>
<text x="82" y="466" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">send welcome</text>

<!-- MOVER column -->
<rect x="470" y="227" width="340" height="56" rx="8" fill="#1E8C8C"/>
<text x="640" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">MOVER</text>
<text x="640" y="270" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">OrgPath changed</text>
<rect x="470" y="291" width="340" height="245" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="492" y="322" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">recompute assignments</text>
<text x="492" y="358" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">remove old-node packages</text>
<text x="492" y="394" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">add new-node packages</text>
<text x="492" y="430" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">re-evaluate policy</text>
<!-- amber book 11 callout -->
<rect x="492" y="455" width="296" height="62" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
<text x="640" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">see Book 11 for PIM</text>
<text x="640" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">realignment</text>

<!-- LEAVER column -->
<rect x="880" y="227" width="340" height="56" rx="8" fill="#1E8C8C"/>
<text x="1050" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">LEAVER</text>
<text x="1050" y="270" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">OrgPath cleared</text>
<rect x="880" y="291" width="340" height="245" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="902" y="322" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">disable account</text>
<text x="902" y="358" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">remove from groups</text>
<text x="902" y="394" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">remove access packages</text>
<text x="902" y="430" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">revoke sessions</text>
<text x="902" y="466" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="start">reassign ownership</text>

<!-- red dependency band along bottom -->
<rect x="60" y="560" width="1160" height="54" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="640" y="587" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">No OrgTree gate means no lifecycle trigger</text>
</svg>
