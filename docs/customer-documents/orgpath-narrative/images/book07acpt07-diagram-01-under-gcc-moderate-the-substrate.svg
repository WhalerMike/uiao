<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E" text-anchor="start">The substrate cannot erase the Azure Commercial</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E" text-anchor="start">boundary — it makes it visible and monitored</text>

<!-- GCC Moderate region -->
<rect x="60" y="150" width="540" height="330" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="330" y="180" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="0.4" fill="#0D1B2E" text-anchor="middle">GCC MODERATE</text>
<rect x="100" y="210" width="460" height="90" rx="8" fill="#0D1B2E"/>
<text x="330" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Fabric + OneLake + Purview</text>
<text x="330" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">data-plane stack</text>
<rect x="100" y="320" width="460" height="70" rx="8" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
<text x="330" y="355" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Microsoft 365</text>

<!-- navy boundary line -->
<line x1="640" y1="140" x2="640" y2="500" stroke="#0D1B2E" stroke-width="4"/>
<text x="640" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">tenant / cloud boundary</text>

<!-- Azure Commercial region -->
<rect x="680" y="150" width="540" height="330" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="950" y="180" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="0.4" fill="#0D1B2E" text-anchor="middle">AZURE COMMERCIAL</text>
<rect x="720" y="230" width="460" height="90" rx="8" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
<text x="950" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Information-protection services</text>
<text x="950" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">that Purview signals resolve to</text>

<!-- amber crossing arrow -->
<line x1="560" y1="255" x2="718" y2="255" stroke="#D4A017" stroke-width="2.6" marker-end="url(#ar-amber)"/>
<text x="640" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#8A6D10" text-anchor="middle">Purview telemetry +</text>
<text x="640" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#8A6D10" text-anchor="middle">policy signals cross</text>

<!-- red structural-boundary marker on the crossing -->
<rect x="700" y="360" width="400" height="70" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="900" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">Structural boundary — not remediable</text>
<text x="900" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#7B241C" text-anchor="middle" dominant-baseline="central">the crossing is inherent to the architecture</text>
<line x1="640" y1="320" x2="780" y2="358" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar-red)"/>

<!-- teal Evidence Bundle box (bottom, spanning) -->
<rect x="200" y="540" width="880" height="100" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="640" y="572" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Evidence Bundle records the crossing as a first-class compliance finding</text>
<text x="640" y="602" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">with compensating controls — continuously verified by the drift mechanism</text>
<line x1="640" y1="500" x2="640" y2="538" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
</svg>
