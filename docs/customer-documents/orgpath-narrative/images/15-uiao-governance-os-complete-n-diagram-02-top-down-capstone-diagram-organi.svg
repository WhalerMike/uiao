<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="50" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#0D1B2E">The UIAO Governance OS — four layered bands</text>

<!-- BAND 1: Registry + OrgPath -->
<rect x="320" y="70" width="280" height="50" rx="8" fill="#0D1B2E"/>
<text x="460" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree Registry (governed, versioned)</text>
<rect x="680" y="70" width="280" height="50" rx="8" fill="#0D1B2E"/>
<text x="820" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgPath Attribute (users, devices, servers)</text>
<line x1="600" y1="95" x2="678" y2="95" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<text x="639" y="84" font-family="Arial, sans-serif" font-size="9.5" fill="#5A5A5A" text-anchor="middle">derive + validate</text>

<!-- BAND 2: Five Pillars -->
<rect x="50" y="150" width="1180" height="120" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="70" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E">Five Pillars</text>
<g>
<rect x="70" y="184" width="218" height="72" rx="8" fill="#0D1B2E"/><text x="179" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Identity</text><text x="179" y="230" font-family="Arial, sans-serif" font-size="9.5" fill="#C7D4E6" text-anchor="middle">users, groups, svc accts, PIM</text>
<rect x="298" y="184" width="218" height="72" rx="8" fill="#0D1B2E"/><text x="407" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DNS</text><text x="407" y="230" font-family="Arial, sans-serif" font-size="9.5" fill="#C7D4E6" text-anchor="middle">AD-integrated to Azure Private</text>
<rect x="526" y="184" width="218" height="72" rx="8" fill="#0D1B2E"/><text x="635" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PKI</text><text x="635" y="230" font-family="Arial, sans-serif" font-size="9.5" fill="#C7D4E6" text-anchor="middle">ADCS to Cloud PKI</text>
<rect x="754" y="184" width="218" height="72" rx="8" fill="#0D1B2E"/><text x="863" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Device</text><text x="863" y="230" font-family="Arial, sans-serif" font-size="9.5" fill="#C7D4E6" text-anchor="middle">GPO to Intune</text>
<rect x="982" y="184" width="228" height="72" rx="8" fill="#0D1B2E"/><text x="1096" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Server</text><text x="1096" y="230" font-family="Arial, sans-serif" font-size="9.5" fill="#C7D4E6" text-anchor="middle">Arc as hybrid plane</text>
</g>
<!-- OrgPath fans into pillars -->
<line x1="820" y1="120" x2="179" y2="182" stroke="#5A5A5A" stroke-width="1.2"/>
<line x1="820" y1="120" x2="407" y2="182" stroke="#5A5A5A" stroke-width="1.2"/>
<line x1="820" y1="120" x2="635" y2="182" stroke="#5A5A5A" stroke-width="1.2"/>
<line x1="820" y1="120" x2="863" y2="182" stroke="#5A5A5A" stroke-width="1.2"/>
<line x1="820" y1="120" x2="1096" y2="182" stroke="#5A5A5A" stroke-width="1.2"/>

<!-- BAND 3: Policy Architecture -->
<rect x="50" y="300" width="1180" height="110" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="70" y="322" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E8C8C">Policy Architecture</text>
<rect x="200" y="332" width="380" height="62" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="390" y="356" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Conditional Access</text>
<text x="390" y="376" font-family="Arial, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">OrgPath-scoped</text>
<rect x="700" y="332" width="380" height="62" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="890" y="356" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Azure Policy + Guest Config</text>
<text x="890" y="376" font-family="Arial, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">OrgTier-scoped</text>
<!-- Identity + Device -> CA ; Server -> Azure Policy -->
<line x1="179" y1="256" x2="370" y2="330" stroke="#5A5A5A" stroke-width="1.2" marker-end="url(#ar-grey)"/>
<line x1="863" y1="256" x2="410" y2="330" stroke="#5A5A5A" stroke-width="1.2" marker-end="url(#ar-grey)"/>
<line x1="1096" y1="256" x2="890" y2="330" stroke="#5A5A5A" stroke-width="1.2" marker-end="url(#ar-grey)"/>

<!-- BAND 4: Governance Fabric -->
<rect x="50" y="440" width="1180" height="130" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="70" y="462" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E">Governance Fabric</text>
<rect x="100" y="476" width="320" height="72" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.3"/>
<text x="260" y="516" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Versioned governance repository</text>
<rect x="480" y="476" width="320" height="72" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.3"/>
<text x="640" y="516" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Drift detection</text>
<rect x="860" y="476" width="320" height="72" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.3"/>
<text x="1020" y="508" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Compliance mapping</text>
<text x="1020" y="528" font-family="Arial, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">NIST / FedRAMP / BOD</text>

<!-- dashed governance arrows -->
<line x1="460" y1="120" x2="260" y2="474" stroke="#D4A017" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#ar-amber)"/>
<text x="300" y="600" font-family="Arial, sans-serif" font-size="9.5" fill="#D4A017">Registry → Repository</text>
<line x1="390" y1="394" x2="610" y2="474" stroke="#D4A017" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#ar-amber)"/>
<line x1="890" y1="394" x2="680" y2="474" stroke="#D4A017" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#ar-amber)"/>
<line x1="800" y1="512" x2="858" y2="512" stroke="#D4A017" stroke-width="1.4" marker-end="url(#ar-amber)"/>
<text x="640" y="612" font-family="Arial, sans-serif" font-size="9.5" fill="#D4A017" text-anchor="middle">both policy boxes → Drift detection → Compliance mapping</text>
<path d="M1020,548 q0,55 -700,55 q-220,0 -260,-50" fill="none" stroke="#D4A017" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#ar-amber)"/>
<text x="640" y="660" font-family="Arial, sans-serif" font-size="9.5" fill="#D4A017" text-anchor="middle">Compliance mapping → Repository (closes the audit loop)</text>
</svg>
