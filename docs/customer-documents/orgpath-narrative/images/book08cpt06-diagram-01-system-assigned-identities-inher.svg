<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">System-assigned identities inherit; user-</text>
<text x="60" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">assigned are tagged and policy-enforced</text>

<!-- LEFT: Arc-enrolled server with nested system-assigned MI -->
<rect x="60" y="180" width="500" height="180" rx="10" fill="#0D1B2E"/>
<text x="310" y="212" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Arc-enrolled server</text>
<rect x="84" y="232" width="270" height="44" rx="6" fill="#1E3A66"/>
<text x="219" y="254" font-family="Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">OrgPath resource tag</text>
<text x="219" y="270" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">tag carried on the resource</text>

<rect x="84" y="290" width="452" height="56" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="310" y="312" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">System-assigned managed identity</text>
<text x="310" y="332" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">inherits tag, lifecycle bound to the resource</text>

<!-- inherit arrow inside -->
<line x1="219" y1="276" x2="219" y2="288" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<text x="370" y="284" font-family="Arial, sans-serif" font-size="10.5" font-style="italic" fill="#C7D4E6" text-anchor="start">inherits OrgPath</text>

<!-- RIGHT: User-assigned MI -->
<rect x="720" y="180" width="500" height="180" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="970" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.3" fill="#1E8C8C" text-anchor="middle">INDEPENDENT RESOURCE</text>
<rect x="744" y="232" width="452" height="56" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="970" y="254" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">User-assigned managed identity</text>
<text x="970" y="274" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">standalone, persists independently</text>

<!-- Azure Policy gate (amber) -->
<rect x="744" y="300" width="452" height="48" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="970" y="318" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Azure Policy: deny create without</text>
<text x="970" y="336" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle">OrgPath, OrgNodeId, OrgTier, MigrationPhase tags</text>

<!-- Navy drift check below user-assigned MI -->
<rect x="744" y="412" width="452" height="80" rx="8" fill="#0D1B2E"/>
<text x="970" y="442" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Drift check</text>
<text x="970" y="468" font-family="Arial, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle">validates OrgPath against the OrgTree registry</text>
<line x1="970" y1="348" x2="970" y2="410" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-navy)"/>

<!-- Red orphaned role marker (left side) -->
<rect x="60" y="412" width="500" height="100" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="310" y="444" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.3" fill="#C0392B" text-anchor="middle">ORPHANED ROLE ASSIGNMENT</text>
<text x="310" y="472" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">left behind when a system-assigned identity's</text>
<text x="310" y="492" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">resource was deleted</text>
<line x1="310" y1="360" x2="310" y2="410" stroke="#C0392B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar-red)"/>
</svg>
