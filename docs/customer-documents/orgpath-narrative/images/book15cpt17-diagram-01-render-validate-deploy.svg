<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Documentation pipeline: render, validate, deploy</text>

<!-- qmd corpus -->
<rect x="60" y="160" width="230" height="100" rx="8" fill="#0D1B2E"/>
<text x="175" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">qmd corpus</text>
<text x="175" y="226" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">124 Quarto</text>
<text x="175" y="244" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Markdown files</text>

<line x1="290" y1="210" x2="350" y2="210" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- gitea hook -->
<rect x="352" y="160" width="240" height="100" rx="8" fill="#0D1B2E"/>
<text x="472" y="195" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Gitea post-receive hook</text>
<text x="472" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">triggers when any qmd changed</text>
<text x="472" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">on push to main</text>

<line x1="592" y1="210" x2="652" y2="210" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- quarto render -->
<rect x="654" y="160" width="240" height="100" rx="8" fill="#1E8C8C"/>
<text x="774" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Quarto render</text>
<text x="774" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">captures stdout and stderr</text>
<!-- idempotent loop -->
<path d="M 654 185 C 614 175 614 245 654 235" fill="none" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<text x="600" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#D4A017" text-anchor="middle" dominant-baseline="central">idempotent</text>
<text x="600" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#D4A017" text-anchor="middle" dominant-baseline="central">bit-identical output</text>

<!-- on success -->
<line x1="894" y1="210" x2="954" y2="210" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="924" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">success</text>

<!-- commit rendered HTML -->
<rect x="956" y="155" width="264" height="110" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="1088" y="195" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">commit rendered HTML</text>
<text x="1088" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">to</text>
<text x="1088" y="242" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">docs-rendered</text>

<!-- fan to two deploy targets -->
<line x1="1088" y1="265" x2="1088" y2="320" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<rect x="820" y="330" width="270" height="84" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="955" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">internal IIS site</text>
<text x="955" y="386" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">docs.uiao.local</text>
<rect x="1110" y="330" width="160" height="84" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="1190" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">GitHub Pages</text>
<text x="1190" y="380" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#33414F" text-anchor="middle" dominant-baseline="central">whalermike.github.io</text>
<text x="1190" y="394" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#33414F" text-anchor="middle" dominant-baseline="central">/uiao-docs</text>
<line x1="1010" y1="310" x2="955" y2="328" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="1130" y1="290" x2="1190" y2="328" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>

<!-- on failure -->
<line x1="774" y1="260" x2="774" y2="430" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>
<text x="700" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C0392B" text-anchor="middle" dominant-baseline="central">on failure</text>
<rect x="450" y="432" width="500" height="110" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="700" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">structured failure notice to</text>
<text x="700" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">governance audit log + platform</text>
<text x="700" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">monitoring dashboard</text>
<text x="700" y="530" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C0392B" text-anchor="middle" dominant-baseline="central">commit not blocked</text>
</svg>
