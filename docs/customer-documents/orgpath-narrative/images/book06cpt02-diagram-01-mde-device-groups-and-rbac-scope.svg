<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath drives MDE device groups and RBAC scope</text>

<!-- Stage 1: OrgTree registry -->
<rect x="48" y="150" width="250" height="110" rx="8" fill="#0D1B2E"/>
<text x="173" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree registry</text>
<text x="173" y="212" font-family="Arial, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">nodes flagged</text>
<text x="173" y="232" font-family="Consolas, monospace" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">MDEBoundary = true</text>

<!-- Stage 2: ETL pipeline -->
<rect x="48" y="300" width="250" height="90" rx="8" fill="#0D1B2E"/>
<text x="173" y="332" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ETL pipeline</text>
<text x="173" y="358" font-family="Arial, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">stamps OrgPath on device objects</text>

<line x1="173" y1="260" x2="173" y2="298" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Stage 3: Entra dynamic group -->
<rect x="360" y="295" width="290" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="505" y="324" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Entra ID dynamic group</text>
<text x="505" y="348" font-family="Consolas, monospace" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">ORG-BRANCH-{NodeId}</text>
<text x="505" y="370" font-family="Consolas, monospace" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">device.OrgPath -startsWith prefix</text>

<line x1="298" y1="345" x2="358" y2="345" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Stage 4: MDE device group -->
<rect x="710" y="295" width="270" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="845" y="332" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">MDE device group</text>
<text x="845" y="358" font-family="Consolas, monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">MDE-{NodeId}</text>

<line x1="650" y1="345" x2="708" y2="345" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="679" y="318" font-family="Arial, sans-serif" font-size="10.5" fill="#1E8C8C" text-anchor="middle">Entra group-</text>
<text x="679" y="304" font-family="Arial, sans-serif" font-size="10.5" fill="#1E8C8C" text-anchor="middle">backed</text>

<!-- Branch right: Policy assignment -->
<rect x="1010" y="190" width="230" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1125" y="218" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Policy assignment</text>
<text x="1125" y="244" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">AV, ASR, EDR, AIR</text>
<text x="1125" y="264" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">remediation level by tier</text>

<line x1="980" y1="320" x2="1008" y2="270" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- Branch right: RBAC role -->
<rect x="1010" y="400" width="230" height="110" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1125" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">MDE RBAC role</text>
<text x="1125" y="456" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">scoped to MDE-FINANCE</text>
<text x="1125" y="480" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">Finance SOC analyst sees</text>
<text x="1125" y="498" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">only Finance devices</text>

<line x1="980" y1="370" x2="1008" y2="430" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>

<!-- Blocked device groups -->
<rect x="360" y="470" width="300" height="120" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="510" y="500" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Other device groups</text>
<text x="510" y="526" font-family="Consolas, monospace" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">MDE-ENGINEERING</text>
<text x="510" y="548" font-family="Consolas, monospace" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">MDE-EXECUTIVE</text>
<text x="510" y="572" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#C0392B" text-anchor="middle" dominant-baseline="central">Finance analyst is blocked</text>

<line x1="1010" y1="495" x2="664" y2="520" stroke="#C0392B" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ar-red)"/>
<line x1="820" y1="500" x2="852" y2="528" stroke="#C0392B" stroke-width="3"/>
<line x1="852" y1="500" x2="820" y2="528" stroke="#C0392B" stroke-width="3"/>

<text x="60" y="660" font-family="Arial, sans-serif" font-size="14.5" font-style="italic" fill="#6B7A8D" text-anchor="start">Membership and analyst scope follow OrgPath automatically — no MDE-specific maintenance.</text>
</svg>
