<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

<!-- Title -->
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">The place substrate retires, and nothing inherits the job</text>

<!-- ===== LEFT HALF: AD Sites and Services hub and spokes ===== -->

<!-- region caption -->
<text x="340" y="138" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle">one model the whole estate agreed on</text>

<!-- dashed retiring boundary (red accent) -->
<rect x="80" y="158" width="520" height="452" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="9 7"/>
<text x="340" y="638" font-size="15" font-style="italic" font-weight="bold" fill="#C0392B" text-anchor="middle">retiring with the domain</text>

<!-- connector lines hub to spokes (drawn first, under boxes) -->
<line x1="340" y1="384" x2="200" y2="248" stroke="#0D1B2E" stroke-width="2.2"/>
<line x1="340" y1="384" x2="482" y2="248" stroke="#0D1B2E" stroke-width="2.2"/>
<line x1="340" y1="384" x2="200" y2="528" stroke="#0D1B2E" stroke-width="2.2"/>
<line x1="340" y1="384" x2="482" y2="528" stroke="#0D1B2E" stroke-width="2.2"/>

<!-- hub -->
<rect x="222" y="344" width="236" height="80" rx="10" fill="#0D1B2E"/>
<text x="340" y="384" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">AD Sites and Services</text>

<!-- spoke: DC affinity (top-left) -->
<rect x="108" y="186" width="176" height="62" rx="8" fill="#0D1B2E"/>
<text x="196" y="217" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">DC affinity</text>

<!-- spoke: Replication site links (top-right) -->
<rect x="392" y="186" width="180" height="62" rx="8" fill="#0D1B2E"/>
<text x="482" y="217" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
  <tspan x="482" dy="-8">Replication</tspan>
  <tspan x="482" dy="20">site links</tspan>
</text>

<!-- spoke: Site-linked GPO (bottom-left) -->
<rect x="108" y="498" width="176" height="62" rx="8" fill="#0D1B2E"/>
<text x="196" y="529" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Site-linked GPO</text>

<!-- spoke: DFS referrals (bottom-right) -->
<rect x="392" y="498" width="180" height="62" rx="8" fill="#0D1B2E"/>
<text x="482" y="529" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">DFS referrals</text>

<!-- ===== RIGHT HALF: the ungoverned copies ===== -->

<!-- region caption -->
<text x="950" y="138" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle">no copy reconciles with any other</text>

<!-- copy 1: HR duty-station codes -->
<rect x="710" y="170" width="480" height="74" rx="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
<text x="950" y="207" font-size="17" font-weight="bold" fill="#33414F" text-anchor="middle" dominant-baseline="central">HR duty-station codes</text>

<!-- gap 1: no reconciliation -->
<line x1="730" y1="277" x2="1030" y2="277" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="1044" y="277" font-size="13" font-style="italic" fill="#C0392B" text-anchor="start" dominant-baseline="central">no reconciliation</text>

<!-- copy 2: Facilities building list -->
<rect x="710" y="310" width="480" height="74" rx="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
<text x="950" y="347" font-size="17" font-weight="bold" fill="#33414F" text-anchor="middle" dominant-baseline="central">Facilities building list</text>

<!-- gap 2: no reconciliation -->
<line x1="730" y1="417" x2="1030" y2="417" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="1044" y="417" font-size="13" font-style="italic" fill="#C0392B" text-anchor="start" dominant-baseline="central">no reconciliation</text>

<!-- copy 3: SD-WAN site inventory -->
<rect x="710" y="450" width="480" height="74" rx="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
<text x="950" y="487" font-size="17" font-weight="bold" fill="#33414F" text-anchor="middle" dominant-baseline="central">SD-WAN site inventory</text>

<!-- gap 3: no reconciliation -->
<line x1="730" y1="557" x2="1030" y2="557" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="1044" y="557" font-size="13" font-style="italic" fill="#C0392B" text-anchor="start" dominant-baseline="central">no reconciliation</text>

<!-- copy 4: UCaaS emergency addresses -->
<rect x="710" y="590" width="480" height="74" rx="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
<text x="950" y="627" font-size="17" font-weight="bold" fill="#33414F" text-anchor="middle" dominant-baseline="central">UCaaS emergency addresses</text>
</svg>
