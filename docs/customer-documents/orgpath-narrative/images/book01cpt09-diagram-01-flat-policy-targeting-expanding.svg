<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Flat policy targeting expands combinatorially</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">across organizational segments</text><text x="60" y="175" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="start">ACTIVE DIRECTORY — STRUCTURAL TARGET</text><rect x="80" y="205" width="360" height="76" rx="8" fill="#0D1B2E"/><text x="260" y="243" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Link policy to an OU subtree</text><text x="80" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-style="italic" fill="#6B7A8D" text-anchor="start">→ applies to every nested unit,</text><text x="80" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-style="italic" fill="#6B7A8D" text-anchor="start">   with one rule</text><line x1="560" y1="160" x2="560" y2="600" stroke="#E3E8EF" stroke-width="1.4"/><text x="600" y="175" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#C0392B" text-anchor="start">CONDITIONAL ACCESS — EXPLICIT TARGETS</text><rect x="600" y="205" width="112" height="50" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/><text x="656" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">policy</text><rect x="724" y="205" width="112" height="50" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/><text x="780" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fi