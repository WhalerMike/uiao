<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Two OrgPath integration points for</text>
<text x="60" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">application identities</text>

<!-- Root registry -->
<rect x="40" y="300" width="150" height="120" rx="8" fill="#0D1B2E"/>
<text x="115" y="350" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree</text>
<text x="115" y="372" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Registry</text>

<!-- Two joining boxes -->
<rect x="240" y="230" width="220" height="78" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="350" y="258" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Owner OrgPath</text>
<text x="350" y="282" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">extension attribute</text>

<rect x="240" y="412" width="220" height="78" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="350" y="440" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Resource OrgPath tag</text>
<text x="350" y="464" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">inherited from Arc machine</text>

<line x1="190" y1="340" x2="238" y2="280" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="190" y1="380" x2="238" y2="440" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- Application identity types cluster -->
<rect x="500" y="150" width="300" height="440" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="650" y="174" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.4" fill="#1E8C8C" text-anchor="middle">APPLICATION IDENTITY TYPES</text>

<rect x="518" y="190" width="264" height="62" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="650" y="210" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">App Registration</text>
<text x="650" y="232" font-family="Arial, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle">tenant-owned app definition</text>

<rect x="518" y="262" width="264" height="62" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="650" y="282" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Home-tenant Service Principal</text>
<text x="650" y="304" font-family="Arial, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle">auto-created with app reg</text>

<rect x="518" y="334" width="264" height="62" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="650" y="354" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Enterprise App Service Principal</text>
<text x="650" y="376" font-family="Arial, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle">third-party / consented</text>

<rect x="518" y="406" width="264" height="62" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="650" y="426" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">System-assigned Managed Identity</text>
<text x="650" y="448" font-family="Arial, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle">tied to Azure resource</text>

<rect x="518" y="478" width="264" height="62" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="650" y="498" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">User-assigned Managed Identity</text>
<text x="650" y="520" font-family="Arial, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle">independent resource</text>

<!-- Owner OrgPath -> App Reg, Enterprise SP, User MI -->
<line x1="460" y1="262" x2="516" y2="218" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="460" y1="276" x2="516" y2="362" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="460" y1="288" x2="516" y2="502" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>

<!-- App Reg instantiates Home-tenant SP -->
<line x1="650" y1="252" x2="650" y2="260" stroke="#0D1B2E" stroke-width="1.8" marker-end="url(#ar-navy)"/>
<text x="664" y="258" font-family="Consolas, monospace" font-size="10.5" fill="#5A5A5A" text-anchor="start">instantiates</text>

<!-- Resource OrgPath -> System-assigned MI -->
<line x1="460" y1="450" x2="516" y2="438" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>

<!-- Governance machinery cluster -->
<rect x="850" y="150" width="390" height="440" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="1045" y="174" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.3" fill="#0D1B2E" text-anchor="middle">GOVERNANCE MACHINERY (next chapters)</text>

<rect x="868" y="194" width="354" height="82" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.3"/>
<text x="1045" y="222" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Admin consent workflow</text>
<text x="1045" y="248" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">per-segment approver group</text>

<rect x="868" y="288" width="354" height="82" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.3"/>
<text x="1045" y="316" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Semi-annual Access Reviews</text>
<text x="1045" y="342" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">default Deny</text>

<rect x="868" y="382" width="354" height="82" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.3"/>
<text x="1045" y="410" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Drift detection</text>
<text x="1045" y="436" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">unowned, stale, expired</text>

<rect x="868" y="476" width="354" height="82" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.3"/>
<text x="1045" y="504" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Sentinel WatchList</text>
<text x="1045" y="530" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">+ KQL queries</text>

<!-- Owner OrgPath fans into all four governance boxes (from identity cluster edge) -->
<line x1="800" y1="221" x2="866" y2="227" stroke="#5A5A5A" stroke-width="1.5" marker-end="url(#ar-grey)"/>
<line x1="800" y1="300" x2="866" y2="320" stroke="#5A5A5A" stroke-width="1.5" marker-end="url(#ar-grey)"/>
<line x1="800" y1="400" x2="866" y2="415" stroke="#5A5A5A" stroke-width="1.5" marker-end="url(#ar-grey)"/>
<line x1="800" y1="500" x2="866" y2="508" stroke="#5A5A5A" stroke-width="1.5" marker-end="url(#ar-grey)"/>

<!-- Resource OrgPath also feeds Drift detection -->
<line x1="350" y1="490" x2="430" y2="620" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<path d="M430,620 L865,620 L865,460" fill="none" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<text x="600" y="638" font-family="Arial, sans-serif" font-size="11.5" font-style="italic" fill="#6B7A8D" text-anchor="middle">Resource OrgPath also feeds drift detection</text>
</svg>
