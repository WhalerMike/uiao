<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="bold" fill="#0D1B2E" text-anchor="start">Two-channel distribution — one report,</text>
<text x="60" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="bold" fill="#0D1B2E" text-anchor="start">two audiences</text>

<!-- Center: Power BI Service workspace (navy) -->
<rect x="490" y="300" width="300" height="130" rx="10" fill="#0D1B2E"/>
<text x="640" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Power BI Service</text>
<text x="640" y="354" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">governance workspace</text>
<text x="640" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle">Per-Division Governance</text>
<text x="640" y="395" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle">Posture Dashboard</text>
<rect x="540" y="405" width="200" height="16" rx="4" fill="#D4A017"/>
<text x="640" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath hierarchy slicer</text>

<!-- ===== UPPER CHANNEL: Teams ===== -->
<path d="M490 340 L420 340 L420 200 L450 200" fill="none" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<rect x="452" y="160" width="300" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="602" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Microsoft Teams pinned tab</text>
<text x="602" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">Add a Tab &#8594; Power BI</text>
<text x="602" y="227" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">full interactive canvas</text>
<line x1="752" y1="200" x2="828" y2="200" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<rect x="830" y="158" width="320" height="84" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="990" y="184" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Operational governance teams</text>
<text x="990" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">Viewer role +</text>
<text x="990" y="223" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">row-level security by division</text>
<!-- amber RLS callout -->
<rect x="830" y="262" width="320" height="62" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="990" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Row-level security: DAX filter on OrgTree</text>
<text x="990" y="305" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#33414F" text-anchor="middle">OrgPath startsWith division prefix</text>
<line x1="990" y1="242" x2="990" y2="260" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<defs><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker></defs>

<!-- ===== LOWER CHANNEL: SharePoint ===== -->
<path d="M490 390 L420 390 L420 530 L450 530" fill="none" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-grey)"/>
<rect x="452" y="490" width="300" height="84" rx="8" fill="#0D1B2E"/>
<text x="602" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SharePoint governance portal</text>
<text x="602" y="539" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">Power BI web part, locked to</text>
<text x="602" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">Executive Summary page</text>
<line x1="752" y1="532" x2="828" y2="532" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-navy)"/>
<rect x="830" y="490" width="320" height="84" rx="8" fill="#0D1B2E"/>
<text x="990" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Executive board members</text>
<text x="990" y="539" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">no Power BI license</text>
<text x="990" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">read-only embed token</text>
<!-- timestamp note -->
<rect x="830" y="594" width="320" height="42" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="990" y="615" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Data as of refresh timestamp shown above web part</text>

<!-- red blocked connector: license-free exec blocked from editing -->
<line x1="602" y1="574" x2="602" y2="640" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="585" y1="635" x2="619" y2="645" stroke="#C0392B" stroke-width="2.4"/>
<line x1="619" y1="635" x2="585" y2="645" stroke="#C0392B" stroke-width="2.4"/>
<text x="602" y="670" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">no interactive editing · no saving copies</text>
</svg>
