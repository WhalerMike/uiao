<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#0D1B2E" text-anchor="start">Per-Division Governance Posture Dashboard</text>
<text x="60" y="88" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6B7A8D" text-anchor="start">Left rail slicer · three stacked zones on the main canvas</text>

<!-- Left rail: OrgTree hierarchy slicer (navy) -->
<rect x="60" y="110" width="240" height="560" rx="10" fill="#0D1B2E"/>
<text x="180" y="142" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OrgTree hierarchy slicer</text>
<text x="180" y="164" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle">Organizational Division</text>
<!-- tree -->
<text x="86" y="216" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF" text-anchor="start">&#9660; /</text>
<text x="108" y="252" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="start">&#9654; Finance</text>
<text x="108" y="288" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="start">&#9654; Operations</text>
<rect x="98" y="270" width="180" height="26" rx="4" fill="none" stroke="#D4A017" stroke-width="1.4"/>
<text x="180" y="640" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="middle">expand / collapse</text>
<text x="180" y="657" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="middle">~20% of page width</text>

<!-- Zone 1: six teal KPI cards -->
<text x="320" y="128" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.4" fill="#6B7A8D" text-anchor="start">ZONE 1 · KPI CARDS</text>
<g>
 <rect x="320" y="138" width="142" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
 <text x="391" y="172" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Compliance</text>
 <text x="391" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Rate</text>
 <rect x="442" y="142" width="14" height="14" rx="3" fill="#1E8C8C"/>
</g>
<g>
 <rect x="472" y="138" width="142" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
 <text x="543" y="172" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Drift Events</text>
 <text x="543" y="190" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle">7d</text>
 <rect x="594" y="142" width="14" height="14" rx="3" fill="#D4A017"/>
</g>
<g>
 <rect x="624" y="138" width="142" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
 <text x="695" y="172" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">PIM Activations</text>
 <text x="695" y="190" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle">24h</text>
 <rect x="746" y="142" width="14" height="14" rx="3" fill="#1E8C8C"/>
</g>
<g>
 <rect x="776" y="138" width="142" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
 <text x="847" y="166" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Defender</text>
 <text x="847" y="184" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Health Rate</text>
 <rect x="898" y="142" width="14" height="14" rx="3" fill="#1E8C8C"/>
</g>
<g>
 <rect x="928" y="138" width="142" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
 <text x="999" y="172" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">DLP Incidents</text>
 <text x="999" y="190" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle">7d</text>
 <rect x="1050" y="142" width="14" height="14" rx="3" fill="#C0392B"/>
</g>
<g>
 <rect x="1080" y="138" width="140" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
 <text x="1150" y="172" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Guest</text>
 <text x="1150" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Accounts</text>
 <rect x="1200" y="142" width="14" height="14" rx="3" fill="#1E8C8C"/>
</g>

<!-- Zone 2: two navy chart frames -->
<text x="320" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.4" fill="#6B7A8D" text-anchor="start">ZONE 2 · CHARTS</text>
<rect x="320" y="262" width="440" height="200" rx="8" fill="#0D1B2E"/>
<text x="540" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">30-day compliance trend</text>
<polyline points="345,430 400,410 455,418 510,395 565,400 620,375 675,360 730,350" fill="none" stroke="#6B7A8D" stroke-width="2"/>
<polyline points="345,420 400,415 455,408 510,402 565,392 620,384 675,374 730,366" fill="none" stroke="#1E8C8C" stroke-width="3"/>
<text x="540" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">heavier line = rolling-average overlay</text>
<rect x="780" y="262" width="440" height="200" rx="8" fill="#0D1B2E"/>
<text x="1000" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">drift events by category</text>
<rect x="900" y="316" width="190" height="20" rx="3" fill="#1E8C8C"/>
<rect x="900" y="348" width="280" height="20" rx="3" fill="#1E8C8C"/>
<rect x="900" y="380" width="130" height="20" rx="3" fill="#D4A017"/>
<rect x="900" y="412" width="230" height="20" rx="3" fill="#1E8C8C"/>
<text x="892" y="326" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#C7D4E6" text-anchor="end" dominant-baseline="central">stale</text>
<text x="892" y="358" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#C7D4E6" text-anchor="end" dominant-baseline="central">missing</text>
<text x="892" y="390" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#C7D4E6" text-anchor="end" dominant-baseline="central">invalid</text>
<text x="892" y="422" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#C7D4E6" text-anchor="end" dominant-baseline="central">mismatch</text>

<!-- Zone 3: wide table -->
<text x="320" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.4" fill="#6B7A8D" text-anchor="start">ZONE 3 · DETAIL TABLE</text>
<rect x="320" y="502" width="900" height="168" rx="8" fill="#0D1B2E"/>
<text x="340" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="start">non-compliant device detail</text>
<rect x="340" y="540" width="860" height="28" rx="4" fill="#1E3A66"/>
<text x="360" y="554" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">DeviceName</text>
<text x="600" y="554" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">OrgPath</text>
<text x="860" y="554" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">ComplianceState</text>
<text x="1060" y="554" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">LastSyncDate</text>
<line x1="340" y1="592" x2="1200" y2="592" stroke="#3A5375" stroke-width="1"/>
<line x1="340" y1="620" x2="1200" y2="620" stroke="#3A5375" stroke-width="1"/>
<line x1="340" y1="648" x2="1200" y2="648" stroke="#3A5375" stroke-width="1"/>
<rect x="346" y="578" width="10" height="76" rx="2" fill="#C0392B"/>
<text x="1188" y="582" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#FF8A7A" text-anchor="end" dominant-baseline="central">red marker = non-compliant rows</text>
</svg>
