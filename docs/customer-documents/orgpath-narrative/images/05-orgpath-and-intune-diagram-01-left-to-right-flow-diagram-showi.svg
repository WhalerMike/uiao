<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">OrgPath fans into Intune policy targeting</text>

<!-- Substrate stages, far left -->
<rect x="40" y="150" width="200" height="56" rx="8" fill="#0D1B2E"/>
<text x="140" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree Registry</text>
<text x="140" y="190" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Git, versioned</text>

<rect x="40" y="240" width="200" height="56" rx="8" fill="#0D1B2E"/>
<text x="140" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ETL Pipeline</text>
<text x="140" y="280" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">derives + stamps</text>

<rect x="40" y="330" width="200" height="64" rx="8" fill="#0D1B2E"/>
<text x="140" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Device OrgPath attr.</text>
<text x="140" y="372" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Entra extension schema</text>

<line x1="140" y1="206" x2="140" y2="238" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="140" y1="296" x2="140" y2="328" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- Dynamic groups cluster -->
<rect x="300" y="250" width="290" height="150" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="445" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Dynamic groups</text>
<rect x="318" y="296" width="254" height="44" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="445" y="312" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">ORG-NODE-{id}</text>
<text x="445" y="328" font-family="Consolas, monospace" font-size="10" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgPath -eq prefix</text>
<rect x="318" y="346" width="254" height="44" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="445" y="362" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">ORG-BRANCH-{id}</text>
<text x="445" y="378" font-family="Consolas, monospace" font-size="10" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgPath -startsWith prefix</text>

<line x1="240" y1="362" x2="298" y2="362" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Intune policy surfaces cluster -->
<rect x="650" y="120" width="320" height="430" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="810" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Intune policy surfaces</text>
<text x="810" y="164" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">all group-targeted</text>

<rect x="668" y="182" width="284" height="56" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="810" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Configuration profiles</text>
<rect x="668" y="250" width="284" height="56" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="810" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Compliance policies</text>
<rect x="668" y="318" width="284" height="56" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="810" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Endpoint Security</text>
<text x="810" y="358" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">AV, FW, ASR, EDR</text>
<rect x="668" y="386" width="284" height="56" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="810" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Update rings</text>
<rect x="668" y="454" width="284" height="56" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="810" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">App assignments</text>

<!-- Branch group fans into the cluster -->
<line x1="572" y1="368" x2="648" y2="280" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="572" y1="368" x2="648" y2="346" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="572" y1="368" x2="648" y2="414" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="572" y1="368" x2="648" y2="482" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- Node-only exceptions dashed arrow to Configuration profiles -->
<path d="M572,318 C610,260 630,225 666,210" fill="none" stroke="#5A5A5A" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar-grey)"/>
<text x="600" y="248" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="middle">node-only exceptions</text>

<!-- Conditional Access downstream -->
<rect x="1000" y="246" width="240" height="64" rx="8" fill="#0D1B2E"/>
<text x="1120" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Conditional Access</text>
<text x="1120" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">compliance signal</text>
<line x1="952" y1="278" x2="998" y2="278" stroke="#0D1B2E" stroke-width="2.2" marker-end="url(#ar-navy)"/>
<text x="975" y="265" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6B7A8D" text-anchor="middle">bridge</text>
</svg>
