<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Azure Policy enforces cleanly within ARM — but</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">can't span the other surfaces</text><text x="60" y="175" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="start">AZURE RESOURCE MANAGER  (billing / admin taxonomy)</text><rect x="80" y="205" width="470" height="56" rx="6" fill="#0D1B2E"/><text x="315" y="233" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Management group</text><line x1="108" y1="261" x2="108" y2="277" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><rect x="108" y="275" width="442" height="56" rx="6" fill="#0D1B2E"/><text x="329" y="303" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Subscription</text><line x1="136" y1="331" x2="136" y2="347" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><rect x="136" y="345" width="414" height="56" rx="6" fill="#0D1B2E"/><text x="343" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Resource group</text><line x1="164" y1="401" x2="164" y2="417" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><rect x="164" y="415" width="386" height="56" rx="6" fill="#0D1B2E"/><text x="357" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Resource</text><text x="80" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1E8C8C" text-anchor="start">✓ enforces here, cleanly</text><line x1="620" y1="160" x2="620" y2="580" stroke="#E3E8EF" stroke-width="1.4"/><text x="665" y="175" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#C0392B" text-anchor="start">CANNOT AGGREGATE ACROSS</text><rect x="665" y="205" width="270" height="72" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="800" y="241" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Entra ID objects</text><rect x="950" y="205" width="270" height="72" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="1085" y="241" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Intune-managed devices</text><rect x="665" y="297" width="270" height="72" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="800" y="333" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">AD-joined machines</text><rect x="950" y="297" width="270" height="72" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="1085" y="333" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">On-prem GPO state</text><rect x="665" y="400" width="540" height="150" rx="0" fill="#F7E2DE"/><rect x="665" y="400" width="10" height="150" rx="0" fill="#C0392B"/><text x="695" y="445" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="start">No native view unifies compliance across</text><text x="695" y="479" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="start">identity, device, on-prem and cloud — and</text><text x="695" y="513" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="start">ARM's tree is billing, not your organization.</text>
</svg>
