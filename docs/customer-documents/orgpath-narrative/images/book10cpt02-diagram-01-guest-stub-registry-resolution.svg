<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">The four-element Guest OrgPath Stub and</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">its registry resolution</text>

<!-- Invited guest email -->
<rect x="50" y="300" width="220" height="80" rx="8" fill="#0D1B2E"/>
<text x="160" y="328" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Invited guest email</text>
<text x="160" y="356" font-family="Consolas, monospace" font-size="12" fill="#C7D4E6" text-anchor="middle">alice@contoso-partner.com</text>

<!-- arrow to parser -->
<line x1="270" y1="340" x2="306" y2="340" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>

<!-- Parser box -->
<rect x="308" y="300" width="180" height="80" rx="8" fill="#0D1B2E"/>
<text x="398" y="334" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Extract partner</text>
<text x="398" y="352" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">domain</text>

<!-- arrow to diamond -->
<line x1="488" y1="340" x2="528" y2="340" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>

<!-- Decision diamond -->
<polygon points="650,280 760,340 650,400 540,340" fill="#1E8C8C"/>
<text x="650" y="328" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Look up domain</text>
<text x="650" y="346" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">in partner</text>
<text x="650" y="364" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">registry</text>

<!-- Match path (upper) -->
<path d="M650,280 L650,225 L798,225" fill="none" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<text x="700" y="200" font-family="Arial" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">match</text>

<!-- Stub assembly box (match) -->
<rect x="800" y="150" width="430" height="150" rx="8" fill="#0D1B2E"/>
<text x="1015" y="178" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Guest OrgPath Stub  (positional schema)</text>
<text x="1015" y="222" font-family="Consolas, monospace" font-size="22" fill="#FFFFFF" text-anchor="middle">/EXTERNAL /B2B /contoso-partner.com</text>
<text x="876" y="258" font-family="Arial" font-size="13" fill="#9FB3CE" text-anchor="middle">1</text>
<text x="982" y="258" font-family="Arial" font-size="13" fill="#9FB3CE" text-anchor="middle">2</text>
<text x="1135" y="258" font-family="Arial" font-size="13" fill="#9FB3CE" text-anchor="middle">3 + 4</text>
<text x="1015" y="284" font-family="Arial" font-size="11" font-style="italic" fill="#9FB3CE" text-anchor="middle">four positional segments</text>

<!-- Not found path (lower) -->
<path d="M650,400 L650,470 L820,470" fill="none" stroke="#C0392B" stroke-width="2.4" marker-end="url(#ar-red)"/>
<text x="710" y="462" font-family="Arial" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle">not found</text>

<!-- Not found box -->
<rect x="822" y="440" width="400" height="70" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
<text x="1022" y="468" font-family="Arial" font-size="12" fill="#C0392B" text-anchor="middle">Convergent value</text>
<text x="1022" y="492" font-family="Consolas, monospace" font-size="18" fill="#C0392B" text-anchor="middle">/EXTERNAL/B2B/UNREGISTERED</text>

<!-- Partner registry governance side panel -->
<rect x="50" y="450" width="430" height="210" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
<text x="265" y="480" font-family="Arial" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Partner registry governance</text>
<text x="78" y="512" font-family="Consolas, monospace" font-size="13" fill="#33414F">Domain</text>
<text x="78" y="536" font-family="Consolas, monospace" font-size="13" fill="#33414F">TenantId</text>
<text x="78" y="560" font-family="Consolas, monospace" font-size="13" fill="#33414F">OrgPathStub</text>
<text x="270" y="512" font-family="Consolas, monospace" font-size="13" fill="#33414F">RiskTier</text>
<text x="270" y="536" font-family="Consolas, monospace" font-size="13" fill="#33414F">SponsorGroupName</text>
<text x="270" y="560" font-family="Consolas, monospace" font-size="13" fill="#33414F">MaxReviewIntervalDays</text>

<!-- amber arrow into diamond (from registry, entering lower-left vertex) -->
<path d="M480,500 L595,500 L595,370" fill="none" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
</svg>
