<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Microsoft-native assessment toolset and</text><text x="60" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">the surface each instrument covers</text>

<!-- central spine -->
<rect x="540" y="150" width="200" height="430" rx="10" fill="#0D1B2E"/><text x="640" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Structured</text><text x="640" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">assessment</text><text x="640" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">archive</text><text x="640" y="412" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#C7D4E6" text-anchor="middle">JSON + CSV</text>

<!-- LEFT tools -->
<rect x="60" y="160" width="380" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/><text x="80" y="184" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E">Active Directory module</text><text x="80" y="205" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">forest / domain / OU / user / computer / group / trust</text>
<rect x="60" y="258" width="380" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/><text x="80" y="282" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E">Group Policy module (Get-GPOReport)</text><text x="80" y="303" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">GPO settings XML</text>
<rect x="60" y="356" width="380" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/><text x="80" y="380" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E">DCDiag / RepAdmin</text><text x="80" y="401" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">DC health and replication status</text>
<rect x="60" y="454" width="380" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/><text x="80" y="478" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E">MAP Toolkit</text><text x="80" y="499" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">agentless hardware and software inventory</text>

<!-- RIGHT tools -->
<rect x="840" y="160" width="380" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/><text x="860" y="184" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E">Group Policy Analytics (Intune)</text><text x="860" y="205" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">GPO-to-Settings-Catalog mapping</text>
<rect x="840" y="258" width="380" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/><text x="860" y="282" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E">Defender for Identity</text><text x="860" y="303" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">identity security-posture findings</text>
<rect x="840" y="356" width="380" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/><text x="860" y="380" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E">Azure Migrate</text><text x="860" y="401" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">server dependency and network-flow graph</text>
<rect x="840" y="454" width="380" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/><text x="860" y="478" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E">Entra Connect Health</text><text x="860" y="499" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">sync attribute-flow detail and sync errors</text>

<!-- arrows left -->
<line x1="440" y1="189" x2="538" y2="240" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="440" y1="287" x2="538" y2="290" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="440" y1="385" x2="538" y2="360" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="440" y1="483" x2="538" y2="420" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<!-- arrows right -->
<line x1="840" y1="189" x2="742" y2="240" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="840" y1="287" x2="742" y2="290" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="840" y1="385" x2="742" y2="360" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="840" y1="483" x2="742" y2="420" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>

<text x="640" y="630" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle">Each native instrument contributes one stream into a single structured archive.</text>
</svg>
