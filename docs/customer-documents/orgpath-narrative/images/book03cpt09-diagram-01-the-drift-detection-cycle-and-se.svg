<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">The drift detection cycle and remediation</text>

<!-- trigger -->
<rect x="60" y="120" width="200" height="90" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
<text x="160" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Scheduled trigger</text>
<text x="160" y="170" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">daily + registry-change</text>
<text x="160" y="188" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">+ bulk-change</text>

<!-- three inputs -->
<rect x="320" y="100" width="220" height="44" rx="8" fill="#0D1B2E"/>
<text x="430" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree registry (valid paths)</text>
<rect x="320" y="156" width="220" height="44" rx="8" fill="#0D1B2E"/>
<text x="430" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">every live OrgPath value</text>
<rect x="320" y="212" width="220" height="44" rx="8" fill="#0D1B2E"/>
<text x="430" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">provisioning (expected)</text>
<line x1="260" y1="165" x2="318" y2="122" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<line x1="260" y1="175" x2="318" y2="178" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<line x1="260" y1="185" x2="318" y2="234" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>

<!-- classifier -->
<rect x="600" y="140" width="180" height="76" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="690" y="168" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Classifier</text>
<text x="690" y="192" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">sorts into four lanes</text>
<line x1="540" y1="178" x2="598" y2="178" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>

<!-- four lanes -->
<rect x="840" y="100" width="380" height="56" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="858" y="122" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="start">HIGH &#183; invalid position</text>
<text x="858" y="142" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">alert + auto-remediation where derivable</text>
<rect x="840" y="166" width="380" height="56" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="858" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="start">HIGH &#183; unpositioned</text>
<text x="858" y="208" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">alert + auto-remediation where derivable</text>
<rect x="840" y="232" width="380" height="56" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
<text x="858" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="start">MEDIUM &#183; membership divergence</text>
<text x="858" y="274" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">batched into the review cadence</text>
<rect x="840" y="298" width="380" height="56" rx="8" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="1.5"/>
<text x="858" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#6B7A8D" text-anchor="start">LOW &#183; stale position</text>
<text x="858" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">logged for the record</text>

<line x1="780" y1="178" x2="838" y2="128" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ar-red)"/>
<line x1="780" y1="178" x2="838" y2="194" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ar-red)"/>
<line x1="780" y1="180" x2="838" y2="260" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<line x1="780" y1="182" x2="838" y2="326" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>

<!-- committed report -->
<rect x="320" y="410" width="500" height="90" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="570" y="440" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Machine-readable report committed</text>
<text x="570" y="468" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">to the governance repository each run</text>
<text x="570" y="490" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">&#128190; every run is a versioned commit</text>
<line x1="1030" y1="354" x2="822" y2="440" stroke="#D4A017" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar-amber)"/>

<!-- longitudinal chart -->
<rect x="60" y="540" width="1160" height="150" rx="10" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.6"/>
<text x="80" y="568" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">Governance-quality over successive reports</text>
<!-- axes -->
<line x1="120" y1="590" x2="120" y2="668" stroke="#5A5A5A" stroke-width="1.4"/>
<line x1="120" y1="668" x2="1180" y2="668" stroke="#5A5A5A" stroke-width="1.4"/>
<!-- valid fraction rising line (teal) -->
<polyline points="140,650 320,632 500,612 680,598 860,588 1040,578 1160,572" fill="none" stroke="#1E8C8C" stroke-width="2.6"/>
<!-- introduction rate (amber) declining -->
<polyline points="140,600 320,608 500,620 680,632 860,642 1040,650 1160,656" fill="none" stroke="#D4A017" stroke-width="2.4" stroke-dasharray="5 4"/>
<text x="1000" y="566" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1E8C8C" text-anchor="start">&#8212; valid fraction</text>
<text x="1000" y="586" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#D4A017" text-anchor="start">- - introduction vs remediation</text>
<text x="640" y="688" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B7A8D" text-anchor="middle">successive reports over time &#8594;</text>
</svg>
