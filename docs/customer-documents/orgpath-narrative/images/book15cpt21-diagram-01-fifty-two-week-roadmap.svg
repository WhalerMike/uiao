<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Fifty-two-week modernization roadmap</text>

<!-- timeline axis: week 1 at x=80, week 52 at x=1200 -> scale = (1200-80)/52 = 21.538 per week -->
<line x1="80" y1="600" x2="1200" y2="600" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<text x="80" y="630" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D" text-anchor="middle">week 1</text>
<text x="1200" y="630" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D" text-anchor="middle">week 52</text>

<!-- Phase bars. x(week)=80+(week-1)*21.538 -->
<!-- Phase 1: w1-12 -> x80..317 -->
<rect x="80" y="280" width="237" height="56" rx="6" fill="#0D1B2E"/>
<text x="198" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Phase 1 Assessment</text>
<text x="198" y="320" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">weeks 1-12</text>
<!-- Phase 2: w13-20 -> x338..511 -->
<rect x="338" y="280" width="173" height="56" rx="6" fill="#0D1B2E"/>
<text x="424" y="299" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Phase 2 Identity</text>
<text x="424" y="313" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Foundation</text>
<text x="424" y="328" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">weeks 13-20</text>
<!-- Phase 3: w21-28 -> x511..684 -->
<rect x="511" y="280" width="173" height="56" rx="6" fill="#0D1B2E"/>
<text x="597" y="299" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Phase 3 Device</text>
<text x="597" y="313" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Preparation</text>
<text x="597" y="328" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">weeks 21-28</text>
<!-- Phase 4: w29-36 -> x684..856 -->
<rect x="684" y="280" width="172" height="56" rx="6" fill="#0D1B2E"/>
<text x="770" y="299" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Phase 4 App and</text>
<text x="770" y="313" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Service Migration</text>
<text x="770" y="328" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">weeks 29-36</text>
<!-- Phase 5 & 6: w37-44 -> x856..1029, stacked -->
<rect x="856" y="252" width="173" height="40" rx="6" fill="#0D1B2E"/>
<text x="942" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Phase 5 Server Modernization</text>
<text x="942" y="282" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">weeks 37-44</text>
<rect x="856" y="296" width="173" height="40" rx="6" fill="#1E3A66"/>
<text x="942" y="310" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Phase 6 DNS and PKI Transition</text>
<text x="942" y="326" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">weeks 37-44</text>
<!-- Phase 7: w45-52 -> x1029..1200 -->
<rect x="1029" y="280" width="171" height="56" rx="6" fill="#0D1B2E"/>
<text x="1114" y="299" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Phase 7 Domain</text>
<text x="1114" y="313" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Retirement</text>
<text x="1114" y="328" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">weeks 45-52</text>

<!-- milestone diamonds (amber) above bars -->
<g fill="#D4A017">
<path d="M 160 225 l 8 8 l -8 8 l -8 -8 z"/>
<path d="M 240 225 l 8 8 l -8 8 l -8 -8 z"/>
<path d="M 420 225 l 8 8 l -8 8 l -8 -8 z"/>
<path d="M 590 225 l 8 8 l -8 8 l -8 -8 z"/>
<path d="M 760 225 l 8 8 l -8 8 l -8 -8 z"/>
<path d="M 940 215 l 8 8 l -8 8 l -8 -8 z"/>
<path d="M 1110 225 l 8 8 l -8 8 l -8 -8 z"/>
</g>
<text x="640" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#D4A017" text-anchor="middle">amber diamonds = 48 milestone gates</text>

<!-- teal review-gate markers at phase boundaries -->
<g stroke="#1E8C8C" stroke-width="2.4">
<line x1="327" y1="270" x2="327" y2="346"/>
<line x1="511" y1="270" x2="511" y2="346"/>
<line x1="684" y1="270" x2="684" y2="346"/>
<line x1="856" y1="270" x2="856" y2="346"/>
<line x1="1029" y1="270" x2="1029" y2="346"/>
</g>
<text x="640" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#1E8C8C" text-anchor="middle">teal review gates = Canon Steward approval at each phase boundary</text>

<!-- final red marker -->
<rect x="980" y="430" width="240" height="64" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="1100" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">zero AD dependencies</text>
<text x="1100" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C0392B" text-anchor="middle" dominant-baseline="central">confirmed before final cutover</text>
<line x1="1100" y1="494" x2="1130" y2="595" stroke="#C0392B" stroke-width="2" marker-end="url(#ar-red)"/>
</svg>
