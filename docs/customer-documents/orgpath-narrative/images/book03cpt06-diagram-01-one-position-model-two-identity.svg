<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">One position model, two identity types</text>

<!-- registry (top center) -->
<rect x="490" y="100" width="300" height="70" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="640" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgTree registry</text>
<text x="640" y="152" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">derives one path-encoded OrgPath</text>

<!-- user object -->
<rect x="120" y="220" width="380" height="110" rx="8" fill="#0D1B2E"/>
<text x="310" y="250" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">User object</text>
<text x="310" y="280" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgPath: ops/...</text>
<text x="310" y="306" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">derived from the person's assignment</text>

<!-- device object -->
<rect x="780" y="220" width="380" height="110" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="970" y="246" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Device object</text>
<text x="970" y="274" font-family="Consolas, monospace" font-size="14" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">OrgPath: ops/...</text>
<text x="970" y="298" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">corporate: derived from assigned user</text>
<text x="970" y="316" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">shared: from deployment location/function</text>

<!-- arrows registry -> user/device -->
<line x1="560" y1="170" x2="360" y2="218" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="720" y1="170" x2="920" y2="218" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>

<!-- single branch group (center) -->
<rect x="430" y="380" width="420" height="80" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="640" y="408" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Single branch group</text>
<text x="640" y="436" font-family="Consolas, monospace" font-size="15" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">OrgPath -startsWith ops</text>

<!-- selecting both -->
<line x1="310" y1="330" x2="500" y2="378" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<text x="360" y="356" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5A5A5A" text-anchor="middle">selects users</text>
<line x1="970" y1="330" x2="780" y2="378" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<text x="920" y="356" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5A5A5A" text-anchor="middle">selects devices</text>

<!-- two policy planes -->
<line x1="540" y1="460" x2="340" y2="508" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="740" y1="460" x2="940" y2="508" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<rect x="120" y="510" width="380" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="310" y="540" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Identity governance plane</text>
<text x="310" y="566" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">Conditional Access (users)</text>
<rect x="780" y="510" width="380" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="970" y="534" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Intune device plane</text>
<text x="970" y="560" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">configuration / compliance / app deployment</text>

<!-- side vignette (between the two planes) -->
<rect x="512" y="510" width="256" height="160" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="640" y="536" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Device changes hands</text>
<text x="640" y="566" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">new OrgPath derived</text>
<text x="640" y="588" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">membership re-evaluates</text>
<text x="640" y="610" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">coverage follows</text>
<text x="640" y="640" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">prior value &#8594; position history</text>
</svg>
