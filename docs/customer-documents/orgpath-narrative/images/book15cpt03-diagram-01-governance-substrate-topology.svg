<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<!-- banner -->
<rect x="0" y="0" width="1280" height="44" fill="#0D1B2E"/>
<text x="640" y="22" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ONE AUTHORITY — exactly one node binds commits at any instant</text>
<text x="60" y="84" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#0D1B2E">UIAO Governance OS high-availability topology</text>

<!-- witness top center -->
<rect x="490" y="120" width="300" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="640" y="142" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Witness and quorum</text>
<text x="640" y="163" font-family="Arial, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">only the quorum holder may bind commits</text>

<!-- primary node -->
<rect x="120" y="230" width="320" height="280" rx="10" fill="#0D1B2E"/>
<text x="280" y="254" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Primary Node · Windows Server 2025</text>
<rect x="140" y="270" width="280" height="40" rx="6" fill="#1E3A66"/>
<text x="280" y="290" font-family="Consolas, monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">IIS :443  TLS termination + reverse proxy</text>
<rect x="140" y="318" width="280" height="40" rx="6" fill="#1E3A66"/>
<text x="280" y="338" font-family="Consolas, monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Gitea  bound to localhost :3000</text>
<rect x="140" y="366" width="280" height="40" rx="6" fill="#1E3A66"/>
<text x="280" y="386" font-family="Consolas, monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">PostgreSQL  relational state</text>
<rect x="140" y="414" width="280" height="40" rx="6" fill="#1E3A66"/>
<text x="280" y="434" font-family="Consolas, monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">PowerShell pipeline + Quarto render</text>
<text x="280" y="480" font-family="Arial, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">active · binds commits</text>

<!-- hot-standby node -->
<rect x="500" y="230" width="320" height="280" rx="10" fill="#0D1B2E" opacity="0.78"/>
<text x="660" y="254" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Hot-Standby Node · warm, not writing</text>
<rect x="520" y="270" width="280" height="40" rx="6" fill="#1E3A66"/>
<text x="660" y="290" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">IIS :443  (standby)</text>
<rect x="520" y="318" width="280" height="40" rx="6" fill="#1E3A66"/>
<text x="660" y="338" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Gitea  (standby)</text>
<rect x="520" y="366" width="280" height="40" rx="6" fill="#1E3A66"/>
<text x="660" y="386" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">PostgreSQL  (replica)</text>
<rect x="520" y="414" width="280" height="40" rx="6" fill="#1E3A66"/>
<text x="660" y="434" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">PowerShell + Quarto (idle)</text>
<text x="660" y="480" font-family="Arial, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">fenced when demoted</text>

<!-- replication arrows -->
<line x1="440" y1="320" x2="500" y2="320" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<line x1="500" y1="356" x2="440" y2="356" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<text x="470" y="300" font-family="Arial, sans-serif" font-size="10" fill="#1E8C8C" text-anchor="middle">sync replication</text>
<text x="470" y="378" font-family="Arial, sans-serif" font-size="10" fill="#1E8C8C" text-anchor="middle">DB + repos w/ LFS</text>

<!-- witness lines to both nodes -->
<line x1="560" y1="184" x2="320" y2="228" stroke="#D4A017" stroke-width="1.4"/>
<line x1="720" y1="184" x2="700" y2="228" stroke="#D4A017" stroke-width="1.4"/>

<!-- virtual IP -->
<rect x="240" y="535" width="200" height="40" rx="20" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
<text x="340" y="555" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">virtual IP follows active</text>
<line x1="320" y1="535" x2="300" y2="512" stroke="#D4A017" stroke-width="1.4" marker-end="url(#ar-amber)"/>
<!-- client arrow -->
<rect x="120" y="620" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="220" y="642" font-family="Arial, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">external clients</text>
<line x1="320" y1="640" x2="340" y2="578" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<text x="430" y="615" font-family="Arial, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">Smart HTTPS + REST</text>

<!-- failover note -->
<rect x="470" y="535" width="350" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="645" y="557" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">automatic failover · single-digit-minute RTO</text>
<text x="645" y="578" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">demoted node fenced</text>

<!-- off-prem mirror -->
<rect x="980" y="290" width="260" height="80" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="1110" y="320" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">GitHub mirror</text>
<text x="1110" y="342" font-family="Consolas, monospace" font-size="10" fill="#33414F" text-anchor="middle">github.com/WhalerMike/uiao</text>
<line x1="838" y1="270" x2="978" y2="300" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<text x="910" y="262" font-family="Arial, sans-serif" font-size="11" fill="#D4A017" text-anchor="middle">mirror · ingest, never authority</text>

<!-- red dashed boundary around on-prem nodes + witness -->
<rect x="100" y="110" width="740" height="410" rx="14" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="9 6"/>
<text x="470" y="700" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle">full operation continues with no cloud reachable</text>
</svg>
