<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">GuestOrgPathWatchlist enriches Sentinel</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">queries for the external subtree</text>

<!-- governance pipeline -->
<rect x="50" y="300" width="200" height="80" rx="8" fill="#0D1B2E"/>
<text x="150" y="334" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">governance</text>
<text x="150" y="354" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">pipeline</text>

<!-- arrow to watchlist -->
<line x1="250" y1="300" x2="320" y2="260" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="150" y="408" font-family="Arial" font-size="10.5" fill="#5A5A5A" text-anchor="middle">updated on invitation,</text>
<text x="150" y="424" font-family="Arial" font-size="10.5" fill="#5A5A5A" text-anchor="middle">reclassification,</text>
<text x="150" y="440" font-family="Arial" font-size="10.5" fill="#5A5A5A" text-anchor="middle">UNREGISTERED resolution</text>
<path d="M150,380 L150,395" fill="none" stroke="#5A5A5A" stroke-width="1.4"/>

<!-- Watchlist cylinder (teal) -->
<g>
<path d="M320,170 a90,16 0 0 0 180,0 v140 a90,16 0 0 1 -180,0 z" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<ellipse cx="410" cy="170" rx="90" ry="16" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
</g>
<text x="410" y="160" font-family="Arial" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">GuestOrgPathWatchlist</text>
<text x="410" y="196" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle">UPN</text>
<text x="410" y="214" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle">OrgPath stub</text>
<text x="410" y="232" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle">PartnerDomain</text>
<text x="410" y="250" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle">RiskTier</text>
<text x="410" y="268" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle">SponsorOrgPath</text>

<!-- stale watchlist warning (red) -->
<rect x="300" y="330" width="220" height="56" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="410" y="354" font-family="Arial" font-size="11.5" font-weight="bold" fill="#C0392B" text-anchor="middle">stale Watchlist =</text>
<text x="410" y="372" font-family="Arial" font-size="11.5" font-weight="bold" fill="#C0392B" text-anchor="middle">UNKNOWN enrichment</text>
<line x1="410" y1="316" x2="410" y2="328" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="4 3"/>

<!-- log stores (navy) -->
<rect x="560" y="180" width="200" height="64" rx="8" fill="#0D1B2E"/>
<text x="660" y="217" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">SigninLogs</text>
<rect x="560" y="270" width="200" height="64" rx="8" fill="#0D1B2E"/>
<text x="660" y="307" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">OfficeActivity</text>

<!-- join node (teal) -->
<rect x="830" y="220" width="200" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="930" y="252" font-family="Arial" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OrgPath</text>
<text x="930" y="272" font-family="Arial" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">enrichment</text>
<text x="930" y="292" font-family="Arial" font-size="10.5" fill="#33414F" text-anchor="middle">Watchlist as join key</text>

<!-- store to join arrows (left outer join on UPN) -->
<path d="M760,212 L800,212 L800,250 L828,250" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<path d="M760,302 L800,302 L800,270 L828,270" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="795" y="170" font-family="Arial" font-size="11" font-style="italic" fill="#1E8C8C" text-anchor="middle">left outer join on UPN</text>

<!-- watchlist feeds join (join key) -->
<path d="M500,235 L545,235 L545,150 L930,150 L930,218" fill="none" stroke="#1E8C8C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar-teal)"/>

<!-- outputs (amber) -->
<rect x="1080" y="180" width="170" height="84" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
<text x="1165" y="208" font-family="Arial" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">cohort norm per</text>
<text x="1165" y="226" font-family="Arial" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">partner domain</text>
<text x="1165" y="248" font-family="Arial" font-size="10.5" fill="#33414F" text-anchor="middle">population monitoring</text>

<rect x="1080" y="282" width="170" height="84" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
<text x="1165" y="308" font-family="Arial" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">absolute threshold</text>
<text x="1165" y="326" font-family="Arial" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">rules</text>
<text x="1165" y="346" font-family="Arial" font-size="10.5" fill="#33414F" text-anchor="middle">risky sign-in,</text>
<text x="1165" y="360" font-family="Arial" font-size="10.5" fill="#33414F" text-anchor="middle">impossible travel</text>

<path d="M1030,250 L1055,222 L1078,222" fill="none" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<path d="M1030,270 L1055,322 L1078,322" fill="none" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
</svg>
