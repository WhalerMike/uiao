<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">From AD's structural byproducts to what the</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">substrate must derive</text><text x="60" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.5" fill="#0D1B2E" text-anchor="start">ACTIVE DIRECTORY</text><rect x="60" y="170" width="360" height="100" rx="8" fill="#0D1B2E"/><text x="82" y="212" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">OU tree</text><text x="82" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="start">organized identities into boundaries</text><rect x="60" y="290" width="360" height="100" rx="8" fill="#0D1B2E"/><text x="82" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">Group Policy</text><text x="82" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="start">inherited through the tree</text><rect x="60" y="410" width="360" height="100" rx="8" fill="#0D1B2E"/><text x="82" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">Delegation</text><text x="82" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="start">authority over tree branches</text><rect x="60" y="530" width="360" height="100" rx="8" fill="#0D1B2E"/><text x="82" y="572" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">Schema</text><text x="82" y="604" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="start">meaning embedded in the directory</text><text x="460" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D" text-anchor="start">CLOUD STACK — EXPLICIT ONLY</text><rect x="460" y="170" width="360" height="100" rx="8" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1.4"/><text x="482" y="212" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="start">Flat tenant + AUs</text><text x="482" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="start">flat container, no inheritance</text><rect x="460" y="290" width="360" height="100" rx="8" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1.4"/><text x="482" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="start">Explicit group membership</text><text x="482" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="start">per-tool assignment</text><rect x="460" y="410" width="360" height="100" rx="8" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1.4"/><text x="482" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="start">Per-object Azure RBAC</text><text x="482" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="start">assigned object by object</text><rect x="460" y="530" width="360" height="100" rx="8" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1.4"/><text x="482" y="572" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="start">App-specific stores</text><text x="482" y="604" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="start">no shared model</text><text x="860" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.5" fill="#1E8C8C" text-anchor="start">SUBSTRATE MUST DERIVE</text><rect x="860" y="170" width="360" height="100" rx="8" fill="#D7F2EE"/><text x="882" y="212" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="start">Path-encoded position</text><text x="882" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="start">structure in the directory</text><rect x="860" y="290" width="360" height="100" rx="8" fill="#D7F2EE"/><text x="882" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="start">Prefix-match inheritance</text><text x="882" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="start">policy flows from position</text><rect x="860" y="410" width="360" height="100" rx="8" fill="#D7F2EE"/><text x="882" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="start">Subtree delegation by path</text><text x="882" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="start">authority over a branch</text><rect x="860" y="530" width="360" height="100" rx="8" fill="#D7F2EE"/><text x="882" y="572" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="start">Schema-validated registry</text><text x="882" y="604" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="start">one governed truth</text><line x1="430" y1="220" x2="458" y2="220" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><line x1="430" y1="340" x2="458" y2="340" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><line x1="430" y1="460" x2="458" y2="460" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><line x1="430" y1="580" x2="458" y2="580" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><line x1="830" y1="220" x2="858" y2="220" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><line x1="830" y1="340" x2="858" y2="340" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><line x1="830" y1="460" x2="858" y2="460" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><line x1="830" y1="580" x2="858" y2="580" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
</svg>
