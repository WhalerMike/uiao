<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>

<text x="60" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">The location Mover — a cross-site move and the surfaces it stales</text>

<!-- Recorded state (navy) -->
<rect x="80" y="140" width="440" height="100" rx="10" fill="#0D1B2E"/>
<text x="300" y="172" font-size="15" font-weight="bold" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Recorded</text>
<text x="300" y="205" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">/USA/MD/ANNAPOLIS-HQ/BLDG-3</text>

<!-- Derived state (navy) -->
<rect x="760" y="140" width="440" height="100" rx="10" fill="#0D1B2E"/>
<text x="980" y="172" font-size="15" font-weight="bold" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Derived from HR</text>
<text x="980" y="205" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">/USA/MD/FIELD-12</text>

<!-- move arrow (teal) -->
<text x="639" y="168" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">move (cross-site)</text>
<line x1="522" y1="190" x2="756" y2="190" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- fan junction and thin teal connectors to impact surfaces -->
<line x1="640" y1="196" x2="640" y2="280" stroke="#1E8C8C" stroke-width="2"/>
<line x1="640" y1="280" x2="185" y2="416" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="640" y1="280" x2="440" y2="416" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="640" y1="280" x2="675" y2="416" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="640" y1="280" x2="940" y2="416" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>

<!-- impact surface boxes (ice fill, navy border) -->
<rect x="60" y="420" width="250" height="110" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="185" y="462" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">e911-dispatchable-location</text>
<text x="185" y="496" font-size="11" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">stale on every event kind</text>

<rect x="340" y="420" width="200" height="110" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="440" y="462" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">dynamic-groups</text>
<text x="440" y="496" font-size="11" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">cross-site, join, leave</text>

<rect x="570" y="420" width="210" height="110" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="675" y="462" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">administrative-units</text>
<text x="675" y="496" font-size="11" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">cross-site, join, leave</text>

<rect x="810" y="420" width="260" height="110" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="940" y="446" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">boundary transitions:</text>
<text x="940" y="470" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">telemetry, service-access,</text>
<text x="940" y="490" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">DIA</text>
<text x="940" y="514" font-size="11" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">differently classified sites</text>

<!-- drift finding (red-outlined) -->
<line x1="980" y1="242" x2="1010" y2="254" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ar-red)"/>
<rect x="900" y="258" width="340" height="112" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="1070" y="284" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">DRIFT-IDENTITY::location-assignment</text>
<text x="1070" y="306" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="central">(GOV-LOCPATH-006)</text>
<text x="1070" y="332" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">recorded state is stale</text>
<text x="1070" y="350" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">until surfaces reconcile</text>

<!-- footer -->
<text x="640" y="610" font-size="14" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">The Mover pass is read-only: it names what is now stale; the writes belong to the exposure surfaces and operator decisions.</text>
</svg>
