<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">OrgPath-scoped sensitivity labels and</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">DLP rule fan-out</text>

<!-- HUB -->
<rect x="60" y="180" width="300" height="360" rx="10" fill="#0D1B2E"/>
<text x="210" y="212" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Purview policy registry</text>
<rect x="90" y="248" width="240" height="56" rx="6" fill="#1E8C8C"/>
<text x="210" y="276" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Public</text>
<rect x="90" y="316" width="240" height="56" rx="6" fill="#2E75B6"/>
<text x="210" y="344" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Internal</text>
<rect x="90" y="384" width="240" height="56" rx="6" fill="#D4A017"/>
<text x="210" y="412" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Confidential</text>
<rect x="90" y="452" width="240" height="56" rx="6" fill="#C0392B"/>
<text x="210" y="480" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Restricted</text>

<!-- SPOKES: 4 branch leaves -->
<!-- Finance -->
<rect x="780" y="140" width="440" height="96" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="800" y="170" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="start">/Finance</text>
<text x="800" y="198" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">block egress of Restricted to non-corp domains;</text>
<text x="800" y="216" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">allow Confidential within Finance subtree</text>

<!-- HR -->
<rect x="780" y="260" width="440" height="96" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="800" y="290" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="start">/HR</text>
<text x="800" y="318" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">block external send of personnel records;</text>
<text x="800" y="336" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">allow Confidential within HR subtree</text>

<!-- Engineering -->
<rect x="780" y="380" width="440" height="96" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="800" y="410" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="start">/Engineering</text>
<text x="800" y="438" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">watermark Restricted source artifacts;</text>
<text x="800" y="456" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">allow Confidential within Engineering subtree</text>

<!-- Legal -->
<rect x="780" y="500" width="440" height="96" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="800" y="530" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="start">/Legal</text>
<text x="800" y="558" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">hold egress for review;</text>
<text x="800" y="576" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">allow Privileged within Legal subtree</text>

<!-- Connectors with amber scope labels -->
<line x1="360" y1="300" x2="778" y2="186" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<line x1="360" y1="340" x2="778" y2="306" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<line x1="360" y1="400" x2="778" y2="426" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<line x1="360" y1="460" x2="778" y2="546" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>

<rect x="470" y="206" width="230" height="22" rx="4" fill="#FBEED2"/>
<text x="585" y="218" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">scope: OrgPath startsWith /Finance/</text>
<rect x="478" y="320" width="215" height="22" rx="4" fill="#FBEED2"/>
<text x="585" y="332" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">scope: OrgPath startsWith /HR/</text>
<rect x="455" y="406" width="260" height="22" rx="4" fill="#FBEED2"/>
<text x="585" y="418" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">scope: OrgPath startsWith /Engineering/</text>
<rect x="475" y="496" width="220" height="22" rx="4" fill="#FBEED2"/>
<text x="585" y="508" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">scope: OrgPath startsWith /Legal/</text>
</svg>
