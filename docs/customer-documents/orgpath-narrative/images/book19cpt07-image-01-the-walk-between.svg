<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
 <linearGradient id="skyGrad7" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#EAF1FB"/>
  <stop offset="100%" stop-color="#CFE0F2"/>
 </linearGradient>
 <radialGradient id="glowGrad7" cx="0.5" cy="0.5" r="0.5">
