<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Why Entra ID's existing attributes can't carry</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">position</text><rect x="60" y="140" width="278" height="150" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.4"/><text x="199" y="180" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">display name</text><text x="199" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">✗</text><text x="199" y="254.33" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#C0392B" text-anchor="middle" dominant-baseline="central">freeform string, no</text><text x="199" y="269.67" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#C0392B" text-anchor="middle" dominant-baseline="central">schema</text><line x1="199" y1="290" x2="199" y2="375" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/><rect x="358" y="140" width="278" height="150" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.4"/><text x="497" y="180" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">department</text><text x="497" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">✗</text><text x="497" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#C0392B" text-anchor="middle" dominant-baseline="central">populated inconsistently</text><line x1="497" y1="290" x2="497" y2="375" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/><rect x="656" y="140" width="278" height="150" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.4"/><text x="795" y="180" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">manager</text><text x="795" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">✗</text><text x="795" y="254.33" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#C0392B" text-anchor="middle" dominant-baseline="central">points to a person, not</text><text x="795" y="269.67" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#C0392B" text-anchor="middle" dominant-baseline="central">a boundary</text><line x1="795" y1="290" x2="795" y2="375" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/><rect x="954" y="140" width="278" height="150" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.4"/><text x="1093" y="180" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">job title</text><text x="1093" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">✗</text><text x="1093" y="254.33" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#C0392B" text-anchor="middle" dominant-baseline="central">an HR role, not a</text><text x="1093" y="269.67" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#C0392B" text-anchor="middle" dominant-baseline="central">position</text><line x1="1093" y1="290" x2="1093" y2="375" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/><rect x="60" y="378" width="1140" height="60" rx="8" fill="#0D1B2E"/><text x="640" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">POLICY / GOVERNANCE ENGINE  —  needs a schema-validated, prefix-matchable boundary</text><rect x="280" y="478" width="720" height="110" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/><text x="640" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">✓   path-encoded position attribute</text><text x="640" y="548" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#33414F" text-anchor="middle" dominant-baseline="central">schema-validated · full lineage · prefix-matchable</text><line x1="640" y1="478" x2="640" y2="440" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>
