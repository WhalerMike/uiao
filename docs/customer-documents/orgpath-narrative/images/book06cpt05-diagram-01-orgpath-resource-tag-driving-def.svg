<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath resource tag selects the Servers plan</text>

<!-- Tagging pipeline -->
<rect x="40" y="160" width="250" height="120" rx="8" fill="#0D1B2E"/>
<text x="165" y="190" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Tagging pipeline</text>
<text x="165" y="216" font-family="Arial, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">applies the OrgPath resource</text>
<text x="165" y="232" font-family="Arial, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">tag to Arc-enrolled machines</text>
<text x="165" y="258" font-family="Consolas, monospace" font-size="11.5" fill="#7FD9D9" text-anchor="middle" dominant-baseline="central">tag key: OrgPath</text>

<!-- Azure Policy decision -->
<rect x="360" y="150" width="300" height="140" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="510" y="184" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure Policy</text>
<text x="510" y="206" font-family="Consolas, monospace" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">deployIfNotExists</text>
<text x="510" y="234" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">does the OrgPath tag start with</text>
<text x="510" y="256" font-family="Consolas, monospace" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">Region=NCR|Department=IT| ?</text>

<line x1="290" y1="220" x2="358" y2="220" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- YES branch: Plan 2 -->
<rect x="730" y="135" width="320" height="105" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="890" y="166" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Defender for Servers Plan 2</text>
<text x="890" y="194" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">FIM, JIT, adaptive controls,</text>
<text x="890" y="212" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">full vulnerability assessment</text>

<line x1="660" y1="200" x2="728" y2="188" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="694" y="178" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E8C8C" text-anchor="middle">YES</text>

<!-- NO branch: Plan 1 -->
<rect x="730" y="290" width="320" height="95" rx="8" fill="#0D1B2E"/>
<text x="890" y="322" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Plan 1 baseline</text>
<text x="890" y="350" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">MDE integration, basic VA</text>

<line x1="660" y1="250" x2="728" y2="320" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<text x="690" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#5A5A5A" text-anchor="middle">NO</text>

<!-- Resource Graph aggregation -->
<rect x="40" y="450" width="320" height="110" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="200" y="484" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure Resource Graph query</text>
<text x="200" y="512" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">join machines to</text>
<text x="200" y="530" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">security assessments</text>

<!-- Posture snapshot -->
<rect x="470" y="450" width="340" height="110" rx="8" fill="#0D1B2E"/>
<text x="640" y="484" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Infrastructure posture snapshot</text>
<text x="640" y="510" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">by OrgPath segment,</text>
<text x="640" y="528" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">committed to the governance repo</text>

<line x1="360" y1="505" x2="468" y2="505" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>

<!-- Critical/High marker -->
<rect x="900" y="455" width="300" height="100" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="1050" y="490" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">Critical / High findings</text>
<text x="1050" y="518" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">surfaced first</text>

<line x1="810" y1="505" x2="898" y2="505" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>

<text x="60" y="650" font-family="Arial, sans-serif" font-size="14.5" font-style="italic" fill="#6B7A8D" text-anchor="start">The OrgPath tag drives plan enforcement and organizes the posture view by organizational segment.</text>
</svg>
