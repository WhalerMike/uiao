<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E">The five-dimension Decommissioning Readiness Score</text>

<!-- target component -->
<rect x="50" y="280" width="180" height="120" rx="8" fill="#1F3A5F"/>
<text x="140" y="320" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">target component</text>
<text x="140" y="358" font-family="Consolas, monospace" font-size="16" fill="#EAF1FB" text-anchor="middle">DC01</text>

<!-- 5 dimension boxes -->
<!-- helper layout: x=290 width=420, y from 130 step 96 -->
<g>
<rect x="290" y="130" width="420" height="78" rx="8" fill="#1E8C8C"/>
<text x="306" y="158" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FFFFFF">Identity Migration</text>
<text x="306" y="178" font-family="Consolas, monospace" font-size="10" fill="#EAF1FB">Microsoft Graph OrgPath attribute</text>
<rect x="306" y="186" width="388" height="10" rx="5" fill="#0D1B2E" opacity="0.35"/>
<rect x="306" y="186" width="350" height="10" rx="5" fill="#FFFFFF"/>
</g>
<g>
<rect x="290" y="222" width="420" height="78" rx="8" fill="#1E8C8C"/>
<text x="306" y="250" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FFFFFF">Dependency Resolution</text>
<text x="306" y="270" font-family="Consolas, monospace" font-size="10" fill="#EAF1FB">dependency-map.json</text>
<rect x="306" y="278" width="388" height="10" rx="5" fill="#0D1B2E" opacity="0.35"/>
<rect x="306" y="278" width="300" height="10" rx="5" fill="#FFFFFF"/>
</g>
<g>
<rect x="290" y="314" width="420" height="78" rx="8" fill="#1E8C8C"/>
<text x="306" y="342" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FFFFFF">DNS Migration</text>
<text x="306" y="362" font-family="Consolas, monospace" font-size="10" fill="#EAF1FB">IPAM export</text>
<rect x="306" y="370" width="388" height="10" rx="5" fill="#0D1B2E" opacity="0.35"/>
<rect x="306" y="370" width="388" height="10" rx="5" fill="#FFFFFF"/>
</g>
<g>
<rect x="290" y="406" width="420" height="78" rx="8" fill="#1E8C8C"/>
<text x="306" y="434" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FFFFFF">Certificate Migration</text>
<text x="306" y="454" font-family="Consolas, monospace" font-size="10" fill="#EAF1FB">Cloud PKI enrollment</text>
<rect x="306" y="462" width="388" height="10" rx="5" fill="#0D1B2E" opacity="0.35"/>
<rect x="306" y="462" width="270" height="10" rx="5" fill="#FFFFFF"/>
</g>
<g>
<rect x="290" y="498" width="420" height="78" rx="8" fill="#1E8C8C"/>
<text x="306" y="526" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FFFFFF">GPO Migration</text>
<text x="306" y="546" font-family="Consolas, monospace" font-size="10" fill="#EAF1FB">migration-map.json</text>
<rect x="306" y="554" width="388" height="10" rx="5" fill="#0D1B2E" opacity="0.35"/>
<rect x="306" y="554" width="330" height="10" rx="5" fill="#FFFFFF"/>
</g>

<!-- target to dims -->
<line x1="230" y1="320" x2="288" y2="169" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ar-grey)"/>
<line x1="230" y1="340" x2="288" y2="535" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ar-grey)"/>
<line x1="230" y1="340" x2="288" y2="353" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ar-grey)"/>

<!-- averaging node -->
<rect x="770" y="290" width="170" height="120" rx="8" fill="#0D1B2E"/>
<text x="855" y="338" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">arithmetic</text>
<text x="855" y="360" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">mean</text>

<!-- dims into averaging -->
<line x1="710" y1="169" x2="768" y2="305" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="710" y1="261" x2="768" y2="320" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="710" y1="353" x2="768" y2="350" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="710" y1="445" x2="768" y2="380" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="710" y1="537" x2="768" y2="395" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>

<!-- outcome bands -->
<rect x="1000" y="170" width="240" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1120" y="196" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle">below 80%</text>
<text x="1120" y="218" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">not a candidate</text>
<rect x="1000" y="290" width="240" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1120" y="316" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">80% to 99%</text>
<text x="1120" y="338" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">detailed dependency review</text>
<rect x="1000" y="410" width="240" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1120" y="436" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle">100%</text>
<text x="1120" y="458" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">decommissioning approval</text>

<line x1="940" y1="330" x2="998" y2="202" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<line x1="940" y1="350" x2="998" y2="322" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<line x1="940" y1="370" x2="998" y2="442" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>

<!-- red warning flag -->
<rect x="290" y="610" width="640" height="56" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="610" y="636" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle">Warning: an empty baseline scored 100% logs a warning</text>
<text x="610" y="656" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">a dimension with no recorded items must not silently report ready</text>
<line x1="610" y1="608" x2="500" y2="480" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar-grey)"/>
</svg>
