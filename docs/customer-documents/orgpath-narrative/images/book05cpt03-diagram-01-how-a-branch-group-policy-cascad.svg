<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">Branch cascade versus node containment</text>

<!-- dashed teal boundary around whole sales subtree -->
<rect x="80" y="130" width="600" height="540" rx="14" fill="none" stroke="#1E8C8C" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="380" y="158" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#1E8C8C" text-anchor="middle">cascades to all descendants, including units created later</text>

<!-- OrgTree -->
<rect x="250" y="180" width="260" height="52" rx="8" fill="#0D1B2E"/>
<text x="380" y="206" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">NCR / Sales</text>

<rect x="110" y="320" width="240" height="52" rx="8" fill="#0D1B2E"/>
<text x="230" y="346" font-family="Consolas, monospace" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">NCR / Sales / Service</text>
<rect x="410" y="320" width="240" height="52" rx="8" fill="#0D1B2E"/>
<text x="530" y="346" font-family="Consolas, monospace" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">NCR / Sales / Data</text>

<rect x="100" y="470" width="240" height="52" rx="8" fill="#0D1B2E"/>
<text x="220" y="496" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Sales / Service · Workstation</text>
<rect x="120" y="560" width="240" height="52" rx="8" fill="#0D1B2E"/>
<text x="240" y="586" font-family="Consolas, monospace" font-size="10.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Sales / Data · Kiosk</text>
<rect x="420" y="470" width="240" height="52" rx="8" fill="#0D1B2E"/>
<text x="540" y="496" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Sales / Data · Workstation</text>

<!-- tree connectors -->
<line x1="380" y1="232" x2="230" y2="318" stroke="#5A5A5A" stroke-width="1.4"/>
<line x1="380" y1="232" x2="530" y2="318" stroke="#5A5A5A" stroke-width="1.4"/>
<line x1="230" y1="372" x2="220" y2="468" stroke="#5A5A5A" stroke-width="1.4"/>
<line x1="530" y1="372" x2="540" y2="468" stroke="#5A5A5A" stroke-width="1.4"/>
<line x1="530" y1="372" x2="240" y2="558" stroke="#5A5A5A" stroke-width="1.4"/>

<!-- Branch policy box -->
<rect x="760" y="180" width="460" height="96" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="990" y="216" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Config profile assigned to</text>
<text x="990" y="244" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">ORG-BRANCH-SALES</text>

<!-- branch arrows fan to every node -->
<line x1="760" y1="224" x2="512" y2="206" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="758" y1="240" x2="352" y2="346" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="758" y1="250" x2="652" y2="346" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="758" y1="262" x2="342" y2="496" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="758" y1="270" x2="662" y2="496" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>
<line x1="758" y1="280" x2="372" y2="580" stroke="#1E8C8C" stroke-width="1.4" marker-end="url(#ar-teal)"/>

<!-- Node policy box -->
<rect x="760" y="470" width="460" height="96" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="990" y="506" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Kiosk profile assigned to</text>
<text x="990" y="534" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">ORG-NODE-SALES-DATA-KIOSK</text>

<!-- node single arrow to ONE leaf -->
<line x1="760" y1="540" x2="362" y2="586" stroke="#D4A017" stroke-width="2.6" marker-end="url(#ar-amber)"/>
<text x="990" y="600" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6B7A8D" text-anchor="middle">no cascade — selected by device_type, not by path depth</text>
</svg>
