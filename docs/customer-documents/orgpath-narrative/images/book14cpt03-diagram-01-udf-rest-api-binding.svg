<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgTree nodes bind to BlueCat zones and</text>
<text x="60" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E" text-anchor="start">networks through User-Defined Fields</text>

<!-- OrgTree registry -->
<rect x="50" y="290" width="190" height="120" rx="8" fill="#0D1B2E"/>
<text x="145" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree registry</text>
<text x="145" y="354" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">/Eng/Platform</text>
<text x="145" y="378" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">node paths</text>

<!-- Sync script -->
<rect x="280" y="300" width="200" height="100" rx="8" fill="#0D1B2E"/>
<text x="380" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Sync-OrgPath</text>
<text x="380" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ToBlueCat script</text>
<line x1="240" y1="350" x2="278" y2="350" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- teal arrow into BAM -->
<line x1="480" y1="350" x2="558" y2="350" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<rect x="280" y="612" width="360" height="40" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="460" y="626" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">Sync transport</text>
<text x="460" y="642" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">BAM v1 REST session · BAMAuthToken header</text>

<!-- BAM container -->
<rect x="560" y="180" width="670" height="380" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="580" y="208" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="start">BlueCat Address Manager · Configuration</text>

<!-- upper branch: View -> Zone -->
<rect x="585" y="232" width="160" height="60" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="665" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">View</text>
<line x1="745" y1="262" x2="788" y2="262" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="790" y="232" width="160" height="60" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="870" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Zone</text>
<rect x="975" y="222" width="235" height="80" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="1092" y="248" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">OrgPath · OrgNodeId</text>
<text x="1092" y="276" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">OrgTier · MigrationPhase</text>
<line x1="950" y1="262" x2="973" y2="262" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<!-- red warning near zone -->
<rect x="790" y="306" width="420" height="42" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
<text x="1000" y="327" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C0392B" text-anchor="middle" dominant-baseline="central">updateObject replaces entire properties string — merge required</text>

<!-- lower branch: Block -> Network -->
<rect x="585" y="392" width="160" height="60" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="665" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Block</text>
<line x1="745" y1="422" x2="788" y2="422" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="790" y="392" width="160" height="60" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="870" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Network</text>
<rect x="975" y="382" width="235" height="80" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="1092" y="408" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">OrgPath · OrgNodeId</text>
<text x="1092" y="436" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">OrgTier · MigrationPhase</text>
<line x1="950" y1="422" x2="973" y2="422" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>

<!-- amber callout bottom -->
<rect x="585" y="490" width="625" height="50" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="897" y="515" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">UDFs pre-defined in BAM Administration — all Text type</text>
</svg>
