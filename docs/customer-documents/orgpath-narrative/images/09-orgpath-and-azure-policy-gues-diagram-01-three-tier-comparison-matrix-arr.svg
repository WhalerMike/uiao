<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Three tiers, three distinct baselines &#8212; calibrated</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">to the threat model, not dialed up or down</text>

<!-- Tier0 column (navy, most restrictive) -->
<rect x="60" y="140" width="380" height="540" rx="8" fill="#0D1B2E"/>
<text x="250" y="170" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Tier0 &#8212; Substrate</text>
<text x="250" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle">DCs, KMS, PKI, Entra Connect</text>
<line x1="80" y1="204" x2="420" y2="204" stroke="#1E3A66" stroke-width="1"/>
<text x="80" y="232" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">BitLocker (TPM + PIN)</text>
<text x="80" y="280" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">WDAC (enforcement mode)</text>
<text x="80" y="328" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">RDP off, WinRM only</text>
<text x="80" y="376" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">Credential Guard on</text>
<text x="80" y="424" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">Audit (maximum verbosity)</text>
<text x="80" y="472" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">LAPS (8 hour rotation)</text>
<text x="80" y="520" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">SMBv1 / LLMNR / NetBIOS off</text>
<text x="80" y="568" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">PS Constrained Language Mode</text>
<text x="80" y="616" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">OrgPath integrity check (6h)</text>

<!-- Tier1 column (teal) -->
<rect x="460" y="140" width="360" height="540" rx="8" fill="#1E8C8C"/>
<text x="640" y="170" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Tier1 &#8212; Production</text>
<text x="640" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#E6F5F2" text-anchor="middle">production workloads</text>
<line x1="480" y1="204" x2="800" y2="204" stroke="#176E6E" stroke-width="1"/>
<text x="480" y="244" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">BitLocker (TPM only)</text>
<text x="480" y="304" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">RDP restricted to admin group</text>
<text x="480" y="364" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">Audit (elevated &#8212; logon,</text>
<text x="480" y="384" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">account mgmt)</text>
<text x="480" y="444" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">LAPS (24 hour rotation)</text>
<text x="480" y="504" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">SMBv1 / LLMNR off</text>
<text x="480" y="564" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">OrgPath integrity check (24h)</text>

<!-- Tier2 column (light slate) -->
<rect x="840" y="140" width="380" height="540" rx="8" fill="#EAF1FB" stroke="#6B7A8D" stroke-width="1.4"/>
<text x="1030" y="170" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Tier2 &#8212; Standard</text>
<text x="1030" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">standard organizational</text>
<line x1="860" y1="204" x2="1200" y2="204" stroke="#C3D2E8" stroke-width="1"/>
<text x="860" y="244" font-family="Consolas, monospace" font-size="13" fill="#33414F" text-anchor="start">BitLocker (TPM only)</text>
<text x="860" y="304" font-family="Consolas, monospace" font-size="13" fill="#33414F" text-anchor="start">Defender real-time on</text>
<text x="860" y="364" font-family="Consolas, monospace" font-size="13" fill="#33414F" text-anchor="start">Audit (standard subcategories)</text>
<text x="860" y="424" font-family="Consolas, monospace" font-size="13" fill="#33414F" text-anchor="start">LAPS (72 hour rotation)</text>
<text x="860" y="484" font-family="Consolas, monospace" font-size="13" fill="#33414F" text-anchor="start">SMBv1 off</text>
<text x="860" y="544" font-family="Consolas, monospace" font-size="13" fill="#33414F" text-anchor="start">OrgPath integrity check (72h)</text>

<text x="640" y="708" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle">Each cell stands alone &#8212; no inheritance between columns. Saturation falls left to right with descending cost-on-compromise.</text>
</svg>
