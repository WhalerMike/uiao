<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">UIAO platform recovery posture</text>

<!-- LEFT: twelve protected components -->
<rect x="50" y="100" width="340" height="540" rx="10" fill="#0D1B2E"/>
<text x="220" y="128" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Twelve protected components</text>
<g font-family="Consolas, monospace" font-size="11.5" fill="#C7D4E6">
<text x="72" y="160">1  Gitea app server</text>
<text x="72" y="198">2  IIS reverse proxy + URL Rewrite</text>
<text x="72" y="236">3  bare Git repositories and hooks</text>
<text x="72" y="274">4  Gitea relational database</text>
<text x="72" y="312">5  AD assessment JSON store</text>
<text x="72" y="350">6  PKI and TLS certificate chain</text>
<text x="72" y="388">7  canon governance artifacts</text>
<text x="72" y="426">8  Quarto rendered output</text>
<text x="72" y="464">9  governance hooks</text>
<text x="72" y="502">10 PowerShell modules</text>
<text x="72" y="540">11 replication infrastructure</text>
<text x="72" y="578">12 audit logs</text>
</g>

<!-- CENTER: backup engine -->
<rect x="420" y="130" width="380" height="250" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="610" y="156" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Backup engine · Windows Scheduled Tasks</text>
<rect x="438" y="170" width="344" height="38" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="610" y="189" font-family="Arial, sans-serif" font-size="11.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">nightly Gitea backup</text>
<rect x="438" y="214" width="344" height="38" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="610" y="233" font-family="Arial, sans-serif" font-size="11.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">nightly D drive UIAO backup</text>
<rect x="438" y="258" width="344" height="38" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="610" y="277" font-family="Arial, sans-serif" font-size="11.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">nightly secondary-server mirror push</text>
<rect x="438" y="302" width="344" height="38" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="610" y="321" font-family="Arial, sans-serif" font-size="11.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">six-hourly GitHub mirror push</text>

<!-- versioned backup store -->
<rect x="420" y="410" width="380" height="80" rx="10" fill="#0D1B2E"/>
<text x="610" y="438" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">D drive UIAO Backups</text>
<text x="610" y="462" font-family="Arial, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">timestamped subdirectories + JSON manifest</text>

<!-- arrows components -> backup engine -->
<line x1="390" y1="250" x2="418" y2="250" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="610" y1="380" x2="610" y2="408" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- red backup integrity failure -->
<rect x="420" y="520" width="380" height="48" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
<text x="610" y="544" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">integrity verification failure → immediate alert</text>
<line x1="610" y1="490" x2="610" y2="518" stroke="#C0392B" stroke-width="2" marker-end="url(#ar-red)"/>

<!-- RIGHT: recovery objectives, two tiers -->
<rect x="830" y="130" width="400" height="200" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1030" y="158" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Tier one · high-availability failover</text>
<text x="850" y="190" font-family="Arial, sans-serif" font-size="12" fill="#33414F">RPO near-zero · RTO single-digit minutes</text>
<text x="850" y="214" font-family="Arial, sans-serif" font-size="12" fill="#33414F">automatic witness-gated promotion</text>
<text x="850" y="238" font-family="Arial, sans-serif" font-size="12" fill="#33414F">to the hot standby</text>
<line x1="850" y1="258" x2="1210" y2="258" stroke="#D4A017" stroke-width="1.2"/>
<text x="1030" y="284" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Tier two · disaster recovery restore</text>
<text x="850" y="312" font-family="Arial, sans-serif" font-size="12" fill="#33414F">RPO 4 hours · RTO 8 hours · cold restore</text>

<rect x="830" y="350" width="400" height="80" rx="10" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.4"/>
<text x="1030" y="378" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">Tier two covers total-site loss,</text>
<text x="1030" y="402" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">validated by quarterly drills.</text>

<line x1="800" y1="250" x2="828" y2="220" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
</svg>
