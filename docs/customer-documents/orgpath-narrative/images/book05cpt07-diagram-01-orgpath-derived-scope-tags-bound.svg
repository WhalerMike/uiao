<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">Scope tags bound administrative visibility</text>

<!-- Finance subtree dashed teal boundary -->
<rect x="80" y="130" width="360" height="230" rx="12" fill="none" stroke="#1E8C8C" stroke-width="1.8" stroke-dasharray="8 5"/>
<rect x="120" y="150" width="280" height="56" rx="8" fill="#0D1B2E"/>
<text x="260" y="172" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">NCR / Finance</text>
<text x="260" y="190" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">(ScopeTagEnabled)</text>
<rect x="140" y="250" width="110" height="40" rx="6" fill="#1E3A66"/>
<text x="195" y="270" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">devices</text>
<rect x="270" y="250" width="110" height="40" rx="6" fill="#1E3A66"/>
<text x="325" y="270" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">policies</text>
<rect x="150" y="305" width="200" height="40" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="250" y="325" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath-FINANCE</text>
<line x1="260" y1="206" x2="195" y2="248" stroke="#5A5A5A" stroke-width="1.4"/>
<line x1="260" y1="206" x2="325" y2="248" stroke="#5A5A5A" stroke-width="1.4"/>

<!-- Sales subtree dashed amber boundary -->
<rect x="80" y="400" width="360" height="230" rx="12" fill="none" stroke="#D4A017" stroke-width="1.8" stroke-dasharray="8 5"/>
<rect x="120" y="420" width="280" height="56" rx="8" fill="#0D1B2E"/>
<text x="260" y="442" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">NCR / Sales</text>
<text x="260" y="460" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">(ScopeTagEnabled)</text>
<rect x="140" y="520" width="110" height="40" rx="6" fill="#1E3A66"/>
<text x="195" y="540" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">devices</text>
<rect x="270" y="520" width="110" height="40" rx="6" fill="#1E3A66"/>
<text x="325" y="540" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">policies</text>
<rect x="150" y="575" width="200" height="40" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="250" y="595" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath-SALES</text>
<line x1="260" y1="476" x2="195" y2="518" stroke="#5A5A5A" stroke-width="1.4"/>
<line x1="260" y1="476" x2="325" y2="518" stroke="#5A5A5A" stroke-width="1.4"/>

<!-- Delegated admin roles, right -->
<rect x="780" y="180" width="420" height="86" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="990" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Finance IT admin role</text>
<text x="990" y="240" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle">scope OrgPath-FINANCE</text>

<rect x="780" y="470" width="420" height="86" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="990" y="504" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Sales IT admin role</text>
<text x="990" y="530" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle">scope OrgPath-SALES</text>

<!-- Finance admin reaches into teal boundary only -->
<path d="M780,210 C600,210 540,240 442,245" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<!-- Sales admin reaches into amber boundary only -->
<path d="M780,520 C600,520 540,500 442,500" fill="none" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>

<!-- red crossed-out connector: Finance admin blocked from Sales -->
<path d="M780,250 C620,330 540,440 442,490" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 4"/>
<g stroke="#C0392B" stroke-width="3.5">
 <line x1="595" y1="360" x2="625" y2="390"/>
 <line x1="625" y1="360" x2="595" y2="390"/>
</g>
<text x="700" y="375" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">blocked</text>
</svg>
