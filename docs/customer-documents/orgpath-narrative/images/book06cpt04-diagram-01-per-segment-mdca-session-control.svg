<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Per-segment MDCA session control by OrgPath</text>

<!-- Two user-segment boxes on left -->
<rect x="40" y="190" width="240" height="90" rx="8" fill="#0D1B2E"/>
<text x="160" y="222" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Data Analytics users</text>
<text x="160" y="250" font-family="Consolas, monospace" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">ORG-BRANCH-ENGINEERING-DATA</text>

<rect x="40" y="420" width="240" height="90" rx="8" fill="#0D1B2E"/>
<text x="160" y="452" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Legal users</text>
<text x="160" y="480" font-family="Consolas, monospace" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">ORG-BRANCH-LEGAL</text>

<!-- Center: Conditional Access App Control -->
<rect x="380" y="290" width="280" height="130" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="520" y="328" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Conditional Access</text>
<text x="520" y="350" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">App Control</text>
<text x="520" y="380" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">routes session traffic to</text>
<text x="520" y="398" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">the MDCA proxy</text>

<line x1="280" y1="235" x2="378" y2="320" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="280" y1="465" x2="378" y2="392" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- Two policy boxes -->
<rect x="710" y="160" width="300" height="105" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="860" y="190" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Data Analytics policy</text>
<text x="860" y="218" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">high download baseline</text>
<text x="860" y="238" font-family="Consolas, monospace" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">monitorOnly</text>

<rect x="710" y="320" width="300" height="120" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="860" y="350" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Legal policy</text>
<text x="860" y="378" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">low baseline,</text>
<text x="860" y="396" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">tight anomaly threshold</text>
<text x="860" y="416" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">4-hour reauth</text>

<line x1="660" y1="335" x2="708" y2="225" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="660" y1="370" x2="708" y2="380" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>

<!-- Sentinel workbook tile -->
<rect x="1040" y="240" width="200" height="130" rx="8" fill="#0D1B2E"/>
<text x="1140" y="276" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Sentinel</text>
<text x="1140" y="296" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">workbook tile</text>
<text x="1140" y="324" font-family="Arial, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">cloud-app risk by</text>
<text x="1140" y="342" font-family="Arial, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">OrgPath segment</text>

<line x1="1010" y1="212" x2="1038" y2="270" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="1010" y1="380" x2="1038" y2="335" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<text x="1024" y="400" font-family="Arial, sans-serif" font-size="10.5" fill="#D4A017" text-anchor="middle">per-segment</text>
<text x="1024" y="414" font-family="Arial, sans-serif" font-size="10.5" fill="#D4A017" text-anchor="middle">anomaly detections</text>

<!-- report-only marker -->
<rect x="380" y="490" width="630" height="56" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="695" y="518" font-family="Arial, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">All policies start in report-only mode — validate before enforcing.</text>

<text x="60" y="660" font-family="Arial, sans-serif" font-size="14.5" font-style="italic" fill="#6B7A8D" text-anchor="start">Session controls are calibrated to each segment's behavioral norms, not a single global threshold.</text>
</svg>
