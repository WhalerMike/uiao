<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">From assessment to steady-state: the OrgTree</text><text x="60" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">implementation pipeline</text>

<!-- Stage frames -->
<rect x="48" y="130" width="380" height="540" rx="10" fill="none" stroke="#0D1B2E" stroke-width="2"/>
<rect x="450" y="130" width="380" height="540" rx="10" fill="none" stroke="#0D1B2E" stroke-width="2"/>
<rect x="852" y="130" width="380" height="540" rx="10" fill="none" stroke="#0D1B2E" stroke-width="2"/>
<text x="238" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Stage 1 — Assessment</text>
<text x="640" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Stage 2 — Construction</text>
<text x="1042" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Stage 3 — Operations (steady state)</text>

<!-- Stage 1 inputs -->
<rect x="70" y="180" width="336" height="64" rx="8" fill="#0D1B2E"/><text x="238" y="205" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">AD forest + OU + GPO</text><text x="238" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">+ DNS + PKI inventory</text>
<rect x="70" y="258" width="336" height="64" rx="8" fill="#0D1B2E"/><text x="238" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Org chart from authoritative source</text>
<rect x="70" y="336" width="336" height="76" rx="8" fill="#0D1B2E"/><text x="238" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Dependency + ACL data</text><text x="238" y="384" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">BloodHound, ADRecon, PingCastle</text>

<!-- Stage 2 boxes -->
<rect x="472" y="180" width="336" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/><text x="640" y="203" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgTree registry</text><text x="640" y="223" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">YAML in Git</text>
<rect x="472" y="280" width="336" height="74" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/><text x="640" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Schema extensions</text><text x="640" y="328" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgPath, OrgNodeId, OrgDepth,</text><text x="640" y="344" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgLastValidated</text>
<rect x="472" y="394" width="336" height="74" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/><text x="640" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath stamped on</text><text x="640" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">users + devices + Arc tags</text>
<rect x="472" y="508" width="336" height="74" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/><text x="640" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Dynamic group library</text><text x="640" y="558" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">ORG-NODE-* / ORG-BRANCH-*</text>

<!-- Stage 3 boxes -->
<rect x="874" y="180" width="336" height="64" rx="8" fill="#0D1B2E"/><text x="1042" y="205" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Drift detection</text><text x="1042" y="225" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">scheduled + event-driven</text>
<rect x="874" y="262" width="336" height="64" rx="8" fill="#0D1B2E"/><text x="1042" y="287" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree change PR</text><text x="1042" y="307" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">&#8594; propagation</text>
<rect x="874" y="344" width="336" height="64" rx="8" fill="#0D1B2E"/><text x="1042" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Dependency map maintenance</text>
<rect x="874" y="500" width="336" height="74" rx="8" fill="#1E3A66"/><text x="1042" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Version-controlled</text><text x="1042" y="550" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">governance record</text>

<!-- Stage 1 -> registry convergence -->
<line x1="406" y1="212" x2="470" y2="206" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="406" y1="290" x2="470" y2="214" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="406" y1="374" x2="470" y2="222" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- Stage 2 internal flow -->
<line x1="640" y1="240" x2="640" y2="278" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="640" y1="354" x2="640" y2="392" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<path d="M 600,240 C 540,300 540,460 600,508" fill="none" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<text x="520" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle">registry &#8594; groups</text>

<!-- Stage 2 -> Stage 3 -->
<line x1="808" y1="431" x2="872" y2="240" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="808" y1="545" x2="872" y2="250" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<text x="840" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle">feeds drift detection</text>

<!-- Stage 3 PR loops back to Stage 2 -->
<path d="M 1042,326 C 1042,640 700,640 640,584" fill="none" stroke="#D4A017" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ar-amber)"/>
<text x="840" y="630" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#D4A017" text-anchor="middle">change PR loops back to update stamped attribute</text>

<!-- Drift + dependency terminate at governance record -->
<line x1="1042" y1="244" x2="1042" y2="498" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="1042" y1="408" x2="1042" y2="498" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
</svg>
