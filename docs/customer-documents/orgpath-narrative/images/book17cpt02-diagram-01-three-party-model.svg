<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">The IEEE 802.1X three-party model —</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">supplicant, authenticator, auth server</text>

<!-- Supplicant -->
<rect x="60" y="280" width="280" height="150" rx="8" fill="#0D1B2E"/>
<text x="200" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Supplicant</text>
<text x="200" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">endpoint</text>
<text x="200" y="384" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">laptop  workstation</text>
<text x="200" y="406" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">printer</text>

<!-- Authenticator -->
<rect x="500" y="280" width="280" height="150" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="640" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Authenticator</text>
<text x="640" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="middle" dominant-baseline="central">switch port or WAP</text>
<text x="640" y="392" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">network access device</text>

<!-- Authentication Server -->
<rect x="940" y="280" width="280" height="150" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="1080" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Authentication Server</text>
<text x="1080" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="middle" dominant-baseline="central">RADIUS  AAA</text>
<text x="1080" y="392" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">NPS or ISE</text>

<!-- EAPOL bidirectional supplicant <-> authenticator -->
<line x1="345" y1="355" x2="495" y2="355" stroke="#0D1B2E" stroke-width="2.4" marker-start="url(#ar-navy)" marker-end="url(#ar-navy)"/>
<text x="420" y="320" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">EAPOL carrying</text>
<text x="420" y="337" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">EAP-TLS</text>

<!-- RADIUS three stacked arrows authenticator <-> auth server -->
<line x1="785" y1="320" x2="935" y2="320" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="860" y="308" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">RADIUS Access-Request</text>
<line x1="935" y1="355" x2="785" y2="355" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="860" y="343" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">RADIUS Access-Challenge</text>
<line x1="935" y1="390" x2="785" y2="390" stroke="#1E8C8C" stroke-width="2.6" marker-end="url(#ar-teal)"/>
<text x="860" y="408" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">RADIUS Access-Accept</text>

<!-- navy note above authenticator -->
<rect x="490" y="170" width="300" height="64" rx="8" fill="#0D1B2E"/>
<text x="640" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">port blocks all traffic except EAP</text>
<text x="640" y="214" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">until success</text>
<line x1="640" y1="234" x2="640" y2="278" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>

<!-- amber callout on Access-Accept -->
<rect x="900" y="480" width="320" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1060" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">authorization decided here</text>
<text x="1060" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath must be present</text>
<line x1="940" y1="395" x2="1010" y2="478" stroke="#D4A017" stroke-width="1.6" stroke-dasharray="4 4"/>

<!-- red note near supplicant -->
<rect x="60" y="480" width="280" height="64" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="200" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">no passwords</text>
<text x="200" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">mutual certificate auth</text>
<line x1="200" y1="430" x2="200" y2="478" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="4 4"/>
</svg>
