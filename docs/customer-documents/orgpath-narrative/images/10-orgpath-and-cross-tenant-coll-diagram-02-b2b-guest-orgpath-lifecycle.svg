<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">B2B guest lifecycle under OrgPath</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">governance</text>

<!-- Stage boxes -->
<!-- Stage 1 -->
<rect x="50" y="170" width="180" height="150" rx="8" fill="#0D1B2E"/>
<text x="140" y="200" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1  Invitation</text>
<text x="140" y="240" font-family="Arial" font-size="12" fill="#C7D4E6" text-anchor="middle">Sponsoring BU admin</text>
<text x="140" y="258" font-family="Arial" font-size="12" fill="#C7D4E6" text-anchor="middle">sends invitation</text>
<text x="140" y="294" font-family="Arial" font-size="11" font-style="italic" fill="#9FB3CE" text-anchor="middle">Partner accepts</text>
<text x="140" y="310" font-family="Arial" font-size="11" font-style="italic" fill="#9FB3CE" text-anchor="middle">invitation</text>

<!-- Stage 2 -->
<rect x="248" y="170" width="180" height="150" rx="8" fill="#0D1B2E"/>
<text x="338" y="200" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2  Guest object</text>
<text x="338" y="218" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">created</text>
<text x="338" y="252" font-family="Arial" font-size="12" fill="#C7D4E6" text-anchor="middle">Entra B2B guest</text>
<text x="338" y="270" font-family="Arial" font-size="12" fill="#C7D4E6" text-anchor="middle">user record</text>
<text x="338" y="300" font-family="Arial" font-size="11" font-style="italic" fill="#9FB3CE" text-anchor="middle">Created in tenant</text>

<!-- Stage 3 -->
<rect x="446" y="170" width="180" height="150" rx="8" fill="#1E8C8C"/>
<text x="536" y="200" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3  OrgPath assigned</text>
<text x="536" y="230" font-family="Arial" font-size="12" fill="#EAF1FB" text-anchor="middle">guest-of-{sponsoring</text>
<text x="536" y="246" font-family="Arial" font-size="12" fill="#EAF1FB" text-anchor="middle">-business-unit}</text>
<text x="536" y="284" font-family="Consolas, monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle">/Guests/PartnerCorp/</text>
<text x="536" y="300" font-family="Consolas, monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle">Sponsored-by-Engineering</text>

<!-- Stage 4 -->
<rect x="644" y="170" width="180" height="150" rx="8" fill="#0D1B2E"/>
<text x="734" y="200" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4  Policy inheritance</text>
<text x="734" y="232" font-family="Arial" font-size="12" fill="#C7D4E6" text-anchor="middle">Conditional Access +</text>
<text x="734" y="250" font-family="Arial" font-size="12" fill="#C7D4E6" text-anchor="middle">Intune + access packages</text>
<text x="734" y="296" font-family="Arial" font-size="11" font-style="italic" fill="#9FB3CE" text-anchor="middle">Inherited from OrgPath</text>

<!-- Stage 5 -->
<rect x="842" y="170" width="180" height="150" rx="8" fill="#0D1B2E"/>
<text x="932" y="200" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5  Periodic access</text>
<text x="932" y="218" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">review</text>
<text x="932" y="252" font-family="Arial" font-size="12" fill="#C7D4E6" text-anchor="middle">Reviewer scoped to</text>
<text x="932" y="270" font-family="Arial" font-size="12" fill="#C7D4E6" text-anchor="middle">sponsoring subtree</text>
<text x="932" y="300" font-family="Arial" font-size="11" font-style="italic" fill="#9FB3CE" text-anchor="middle">Quarterly review</text>

<!-- Stage 6 -->
<rect x="1040" y="170" width="180" height="150" rx="8" fill="#0D1B2E"/>
<text x="1130" y="200" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6  Automated</text>
<text x="1130" y="218" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">offboarding</text>
<text x="1130" y="252" font-family="Arial" font-size="12" fill="#C7D4E6" text-anchor="middle">On OrgPath status</text>
<text x="1130" y="270" font-family="Arial" font-size="12" fill="#C7D4E6" text-anchor="middle">change or expiry</text>
<text x="1130" y="300" font-family="Arial" font-size="11" font-style="italic" fill="#9FB3CE" text-anchor="middle">Offboarded</text>

<!-- Horizontal arrows between stages -->
<line x1="230" y1="245" x2="246" y2="245" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>
<line x1="428" y1="245" x2="444" y2="245" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>
<line x1="626" y1="245" x2="642" y2="245" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>
<line x1="824" y1="245" x2="840" y2="245" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>
<line x1="1022" y1="245" x2="1038" y2="245" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>

<!-- Dashed connectors from governance bar to stages 3,4,5,6 -->
<line x1="536" y1="320" x2="536" y2="560" stroke="#D4A017" stroke-width="1.6" stroke-dasharray="6 5"/>
<line x1="734" y1="320" x2="734" y2="560" stroke="#D4A017" stroke-width="1.6" stroke-dasharray="6 5"/>
<line x1="932" y1="320" x2="932" y2="560" stroke="#D4A017" stroke-width="1.6" stroke-dasharray="6 5"/>
<line x1="1130" y1="320" x2="1130" y2="560" stroke="#D4A017" stroke-width="1.6" stroke-dasharray="6 5"/>

<!-- Governance bar -->
<rect x="50" y="560" width="1170" height="86" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
<text x="635" y="595" font-family="Arial" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OrgTree registry</text>
<text x="635" y="622" font-family="Arial" font-size="14" fill="#33414F" text-anchor="middle">sponsoring OrgPaths as governance source</text>
</svg>
