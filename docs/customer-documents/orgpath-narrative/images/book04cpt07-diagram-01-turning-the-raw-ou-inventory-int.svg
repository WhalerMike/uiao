<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E">Turning the raw OU inventory into governed</text><text x="60" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E">OrgTree nodes through stakeholder review</text>

<!-- Left: flat OU list -->
<rect x="50" y="270" width="280" height="200" rx="8" fill="#0D1B2E"/><text x="190" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Flat OU DistinguishedNames</text><text x="70" y="332" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6">OU=Marketing,DC=corp</text><text x="70" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9FB2CC">142 objects &#183; 3 GPOs</text><text x="70" y="382" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6">OU=ServiceAccts,DC=corp</text><text x="70" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9FB2CC">38 objects &#183; 1 GPO</text><text x="70" y="432" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6">OU=Operations,DC=corp</text><text x="70" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9FB2CC">210 objects &#183; 5 GPOs</text>

<!-- Center: stakeholder review gate -->
<rect x="400" y="300" width="200" height="140" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/><text x="500" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">stakeholder</text><text x="500" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">review</text>
<line x1="330" y1="370" x2="398" y2="370" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- two lanes -->
<rect x="660" y="200" width="300" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/><text x="810" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Governance boundary</text><text x="810" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">real division / department / unit</text>
<rect x="660" y="460" width="300" height="80" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/><text x="810" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Administrative container</text><text x="810" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">artifact / delegation scope / GPO host</text><text x="810" y="527" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">discard bin: noted, excluded</text>

<line x1="600" y1="340" x2="658" y2="252" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="600" y1="400" x2="658" y2="490" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>

<!-- Right: constructed OrgTree node record -->
<rect x="990" y="160" width="240" height="400" rx="8" fill="#0D1B2E"/><text x="1110" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OrgTree node</text>
<text x="1010" y="222" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#D4A017">id</text><text x="1010" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9FB2CC">stable, immutable</text>
<text x="1010" y="270" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6">name</text><text x="1010" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9FB2CC">mutable</text>
<text x="1010" y="318" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6">type</text>
<text x="1010" y="348" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6">parentId</text>
<text x="1010" y="378" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6">path</text><text x="1010" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9FB2CC">computed, leading-slash</text>
<text x="1010" y="426" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6">status</text><text x="1010" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#9FB2CC">Active/Pending/Deprecated/Archived</text>
<text x="1010" y="474" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6">owner</text><text x="1010" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9FB2CC">role</text>
<rect x="1006" y="510" width="218" height="40" rx="6" fill="#D4A017"/><text x="1115" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">id never changes once</text><text x="1115" y="544" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath is stamped</text>

<line x1="960" y1="240" x2="988" y2="280" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
</svg>
