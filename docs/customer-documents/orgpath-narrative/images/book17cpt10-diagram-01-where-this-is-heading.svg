<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Where this is heading — one-time admission</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">to per-call token-bound transport</text>

<!-- LEFT navy box: 802.1X / NAC -->
<rect x="80" y="240" width="380" height="150" rx="8" fill="#0D1B2E"/>
<text x="270" y="288" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">802.1X / NAC admission</text>
<text x="270" y="320" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">authorize ONCE at join</text>
<rect x="160" y="346" width="220" height="28" rx="4" fill="#1E3A66"/>
<text x="270" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">this book</text>

<!-- amber arrow ADR-066 -->
<line x1="460" y1="315" x2="638" y2="315" stroke="#D4A017" stroke-width="3" marker-end="url(#ar-amber)"/>
<text x="550" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#D4A017" text-anchor="middle" dominant-baseline="central">ADR-066</text>

<!-- RIGHT teal box -->
<rect x="640" y="240" width="400" height="150" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="840" y="290" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">per-call token-bound transport</text>
<text x="840" y="324" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">authorize EVERY call</text>

<!-- OverlayTunnel object below teal box -->
<line x1="840" y1="390" x2="840" y2="430" stroke="#0D1B2E" stroke-width="2" marker-end="url(#ar-navy)"/>
<rect x="600" y="434" width="480" height="120" rx="8" fill="#0D1B2E"/>
<text x="840" y="462" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OverlayTunnel</text>
<text x="840" y="490" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">identity  application  posture  location</text>
<text x="840" y="510" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">token  lease  cert-chain</text>
<rect x="710" y="522" width="260" height="24" rx="4" fill="#1E3A66"/>
<text x="840" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">leased, not opened</text>

<!-- red footer band -->
<rect x="80" y="610" width="1120" height="60" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="640" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">lane discipline — UIAO governs and reconciles,</text>
<text x="640" y="652" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">never routes packets or terminates tunnels</text>
</svg>
