<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">The weekly DNS and PKI governance loop:</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Monday run to commit-diff review</text>

<!-- top navy chain -->
<rect x="50" y="135" width="270" height="84" rx="8" fill="#1F3A5F"/>
<text x="185" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Monday pipeline run</text>
<text x="185" y="190" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">checks out governance repo</text>
<line x1="320" y1="177" x2="370" y2="177" stroke="#0D1B2E" stroke-width="2.2" marker-end="url(#ar-navy)"/>
<rect x="372" y="135" width="290" height="84" rx="8" fill="#1F3A5F"/>
<text x="517" y="165" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Sync-OrgPathDnsZones.ps1</text>
<text x="517" y="190" font-family="Arial, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">runs against OrgTree registry</text>
<line x1="662" y1="177" x2="712" y2="177" stroke="#0D1B2E" stroke-width="2.2" marker-end="url(#ar-navy)"/>
<rect x="714" y="135" width="270" height="84" rx="8" fill="#1F3A5F"/>
<text x="849" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Commit diff</text>
<text x="849" y="190" font-family="Arial, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">timestamp + change count</text>

<!-- down to review meeting -->
<line x1="849" y1="219" x2="600" y2="278" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- review meeting -->
<rect x="380" y="280" width="440" height="74" rx="8" fill="#1E8C8C"/>
<text x="600" y="310" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Weekly governance meeting</text>
<text x="600" y="336" font-family="Arial, sans-serif" font-size="12" fill="#EAF1FB" text-anchor="middle">reviews the commit diff</text>

<!-- 4 review items -->
<rect x="50" y="400" width="290" height="86" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="195" y="430" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">New zones</text>
<text x="195" y="454" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">map to approved</text>
<text x="195" y="472" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">change requests</text>
<rect x="355" y="400" width="290" height="86" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="500" y="430" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Zones that failed to tag</text>
<text x="500" y="454" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">reported in the script</text>
<text x="500" y="472" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">error count</text>
<rect x="660" y="400" width="290" height="86" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="805" y="430" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Forwarding rules removed</text>
<text x="805" y="454" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">recorded as</text>
<text x="805" y="472" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">migration progress</text>
<rect x="965" y="400" width="265" height="86" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="1097" y="430" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Zones still in Assessment</text>
<text x="1097" y="454" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">after thirty days</text>

<line x1="500" y1="354" x2="240" y2="398" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="560" y1="354" x2="500" y2="398" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="660" y1="354" x2="790" y2="398" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="720" y1="354" x2="1060" y2="398" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>

<!-- spot check -->
<rect x="965" y="280" width="265" height="74" rx="8" fill="#1E8C8C"/>
<text x="1097" y="308" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Forwarding Ruleset spot-check</text>
<text x="1097" y="332" font-family="Consolas, monospace" font-size="10" fill="#EAF1FB" text-anchor="middle">Resource Graph vs IPAM export</text>
<line x1="820" y1="317" x2="963" y2="317" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>

<!-- two red problem boxes -->
<rect x="200" y="540" width="380" height="70" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="390" y="568" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle">Zone with no approved change request</text>
<text x="390" y="592" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">flagged for investigation</text>
<rect x="610" y="540" width="380" height="70" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="800" y="568" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle">Manually added forwarding rule</text>
<text x="800" y="592" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">flagged for investigation</text>
<line x1="250" y1="486" x2="370" y2="538" stroke="#C0392B" stroke-width="1.6" marker-end="url(#ar-red)"/>
<line x1="1050" y1="354" x2="850" y2="538" stroke="#C0392B" stroke-width="1.6" marker-end="url(#ar-red)"/>

<!-- close the loop -->
<path d="M380 317 L185 317 L185 221" fill="none" stroke="#5A5A5A" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ar-grey)"/>
<text x="200" y="260" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D">loops to next Monday run</text>
</svg>
