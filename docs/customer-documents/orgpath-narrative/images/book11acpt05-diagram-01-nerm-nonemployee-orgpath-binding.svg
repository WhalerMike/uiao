<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E" text-anchor="start">SailPoint NERM supplies the missing lifecycle</text>
<text x="60" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E" text-anchor="start">source and binds non-employees to OrgPath</text>

<!-- vertical red dashed boundary line -->
<line x1="600" y1="125" x2="600" y2="470" stroke="#C0392B" stroke-width="2" stroke-dasharray="8 5"/>
<text x="600" y="142" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle">GCC-Moderate cloud boundary</text>

<!-- LEFT LANE: HR system (employees) -->
<rect x="80" y="165" width="240" height="64" rx="8" fill="#0D1B2E"/>
<text x="200" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">HR system</text>
<text x="200" y="212" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">employees only</text>
<line x1="200" y1="229" x2="200" y2="262" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="80" y="264" width="240" height="64" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="200" y="289" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgTree registry</text>
<text x="200" y="311" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">stamps OrgPath on employees</text>

<!-- RIGHT LANE: AWS GovCloud carve-out (amber) -->
<rect x="630" y="160" width="490" height="200" rx="10" fill="none" stroke="#D4A017" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="645" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#9A7A12" text-anchor="start">AWS GovCloud — commercial-exception carve-out ADR-059</text>
<!-- SailPoint NERM teal box -->
<rect x="648" y="198" width="200" height="58" rx="8" fill="#1E8C8C"/>
<text x="748" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">SailPoint NERM</text>
<text x="748" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">non-employee authority</text>
<!-- lifecycle stages monospace -->
<text x="648" y="288" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#33414F" text-anchor="start">non-employee lifecycle:</text>
<text x="648" y="312" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1E8C8C" text-anchor="start">sponsor onboarding -&gt; risk scoring -&gt;</text>
<text x="648" y="334" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1E8C8C" text-anchor="start">time-bound engagement -&gt; re-verification</text>
<text x="648" y="356" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1E8C8C" text-anchor="start">-&gt; offboarding</text>

<!-- teal arrow crossing boundary from NERM into Entra ID -->
<line x1="848" y1="227" x2="960" y2="227" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<text x="724" y="178" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="0" fill="#FFFFFF"> </text>

<!-- Entra ID box (right, in boundary side — ice) -->
<rect x="962" y="195" width="158" height="64" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="1041" y="219" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Entra ID</text>
<text x="1041" y="241" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">directory provisioning</text>
<!-- red crossing label -->
<text x="540" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">non-employee</text>
<text x="540" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">profile data</text>
<text x="540" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">crosses here</text>

<!-- arrows into shared governance plane -->
<line x1="200" y1="328" x2="430" y2="430" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="1041" y1="259" x2="850" y2="430" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- shared Entra ID Governance box -->
<rect x="360" y="432" width="560" height="120" rx="8" fill="#0D1B2E"/>
<text x="640" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Entra ID Governance</text>
<text x="450" y="505" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#A8E6DC" text-anchor="middle" dominant-baseline="central">entitlement packages</text>
<text x="640" y="505" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#A8E6DC" text-anchor="middle" dominant-baseline="central">lifecycle workflows</text>
<text x="830" y="505" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#A8E6DC" text-anchor="middle" dominant-baseline="central">access reviews</text>
<text x="640" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">employee lane and non-employee lane converge here</text>

<!-- bottom band -->
<rect x="80" y="600" width="1120" height="54" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="640" y="627" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Every identity carries OrgPath, governed by one OrgTree structure</text>
</svg>
