<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath-aware incident response playbook</text>

<!-- Trigger -->
<rect x="40" y="170" width="190" height="80" rx="8" fill="#0D1B2E"/>
<text x="135" y="200" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Sentinel</text>
<text x="135" y="222" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">incident created</text>

<!-- Read OrgPath -->
<rect x="40" y="290" width="190" height="100" rx="8" fill="#0D1B2E"/>
<text x="135" y="320" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Playbook reads</text>
<text x="135" y="340" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">affected identity,</text>
<text x="135" y="358" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">retrieves OrgPath</text>
<text x="135" y="376" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">via Microsoft Graph</text>

<line x1="135" y1="250" x2="135" y2="288" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Matrix match decision -->
<rect x="290" y="285" width="290" height="110" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="435" y="316" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Match OrgPath against</text>
<text x="435" y="338" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">response-matrix.json</text>
<text x="435" y="362" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">most-specific prefix first,</text>
<text x="435" y="380" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">loaded from governance repo</text>

<line x1="230" y1="340" x2="288" y2="340" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Three tier branches -->
<rect x="640" y="135" width="350" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="815" y="162" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">/Root/Infrastructure/Tier0</text>
<text x="815" y="186" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">auto-isolate, revoke PIM, P1</text>
<text x="815" y="204" font-family="Consolas, monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">SEC-TIER0-CRITICAL</text>

<rect x="640" y="295" width="350" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="815" y="322" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">/Root/Finance</text>
<text x="815" y="346" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">analyst-approval isolation, P2</text>
<text x="815" y="364" font-family="Consolas, monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">SEC-FINANCE-STANDARD</text>

<rect x="640" y="455" width="350" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="815" y="482" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">/Root (default)</text>
<text x="815" y="506" font-family="Arial, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">no auto-isolate, P3</text>
<text x="815" y="524" font-family="Consolas, monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">SEC-STANDARD</text>

<line x1="580" y1="320" x2="638" y2="190" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="580" y1="340" x2="638" y2="340" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="580" y1="360" x2="638" y2="490" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>

<!-- Tier0 red accent -->
<text x="615" y="172" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#C0392B" text-anchor="middle">&#9632;</text>

<!-- Action cluster -->
<rect x="1030" y="250" width="210" height="220" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1135" y="284" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Action cluster</text>
<text x="1135" y="324" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">annotate incident</text>
<text x="1135" y="354" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">route ITSM queue</text>
<text x="1135" y="384" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">notify escalation group</text>
<text x="1135" y="414" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">trigger access review</text>

<line x1="990" y1="180" x2="1040" y2="265" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<line x1="990" y1="340" x2="1028" y2="350" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<line x1="990" y1="500" x2="1040" y2="455" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>

<text x="60" y="630" font-family="Arial, sans-serif" font-size="14.5" font-style="italic" fill="#6B7A8D" text-anchor="start">Where the incident occurred in the organization determines the response — by kind, not just degree.</text>
</svg>
