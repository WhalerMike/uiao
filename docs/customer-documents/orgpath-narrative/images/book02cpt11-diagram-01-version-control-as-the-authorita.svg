<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Version control as the authoritative record</text><text x="60" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.4" fill="#0D1B2E" text-anchor="start">VERSION-CONTROLLED GOVERNANCE REPOSITORY</text><rect x="60" y="175" width="430" height="330" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><circle cx="92" cy="210" r="6" fill="#1E8C8C"/><line x1="92" y1="216" x2="92" y2="267" stroke="#E3E8EF" stroke-width="2"/><text x="115" y="215" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="start">registry changes</text><text x="115" y="235" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="start">who · what · when · why</text><circle cx="92" cy="268" r="6" fill="#1E8C8C"/><line x1="92" y1="274" x2="92" y2="325" stroke="#E3E8EF" stroke-width="2"/><text x="115" y="273" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="start">position-attribute updates</text><text x="115" y="293" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="start">who · what · when · why</text><circle cx="92" cy="326" r="6" fill="#1E8C8C"/><line x1="92" y1="332" x2="92" y2="383" stroke="#E3E8EF" stroke-width="2"/><text x="115" y="331" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="start">dynamic-group rule edits</text><text x="115" y="351" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="start">who · what · when · why</text><circle cx="92" cy="384" r="6" fill="#1E8C8C"/><line x1="92" y1="390" x2="92" y2="441" stroke="#E3E8EF" stroke-width="2"/><text x="115" y="389" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="start">drift reports</text><text x="115" y="409" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="start">who · what · when · why</text><circle cx="92" cy="442" r="6" fill="#1E8C8C"/><text x="115" y="447" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="start">dependency-map entries</text><text x="115" y="467" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="start">who · what · when · why</text><line x1="490" y1="300" x2="690" y2="300" stroke="#0D1B2E" stroke-width="3" marker-end="url(#ar-navy)"/><text x="510" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="start">apply (direction of authority)</text><rect x="700" y="230" width="360" height="140" rx="8" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1.5"/><text x="880" y="275" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Cloud directory</text><text x="880" y="308" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">(execution target)</text><line x1="700" y1="360" x2="490" y2="360" stroke="#C0392B" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#ar-red)"/><text x="595" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">directory is NOT the source of truth  ✗</text><rect x="60" y="525" width="1140" height="65" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.3"/><text x="635" y="557" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">"What is the state now?" → directory.    "What was it at any prior point, and how did it get here?" → the repository.</text>
</svg>
