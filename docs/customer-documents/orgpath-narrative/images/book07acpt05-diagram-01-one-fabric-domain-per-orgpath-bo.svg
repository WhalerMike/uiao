<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">One Fabric Domain per OrgPath boundary node;</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">workspaces and mirrors inherit the domain</text>

<!-- LEFT: OrgPath tree node -->
<text x="60" y="160" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="0.4" fill="#1E8C8C" text-anchor="start">ORGPATH TREE</text>
<rect x="60" y="200" width="320" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="220" y="232" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NCR / Finance</text>
<rect x="90" y="252" width="260" height="28" rx="5" fill="#FBEED2" stroke="#D4A017" stroke-width="1.3"/>
<text x="220" y="267" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="bold" fill="#8A6D10" text-anchor="middle" dominant-baseline="central">FabricDomainBoundary</text>

<!-- amber connector to Fabric Domain -->
<line x1="380" y1="245" x2="466" y2="245" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<text x="423" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#8A6D10" text-anchor="middle">join</text>

<!-- Fabric Domain (navy) -->
<rect x="470" y="200" width="320" height="90" rx="8" fill="#0D1B2E"/>
<text x="630" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Fabric Domain</text>
<text x="630" y="258" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#D4A017" text-anchor="middle" dominant-baseline="central">NCR / Finance</text>

<!-- Workspace box -->
<rect x="470" y="330" width="600" height="200" rx="10" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.8"/>
<text x="490" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E3A66" text-anchor="start">Fabric workspace — assigned to the domain</text>
<!-- OneLake mirror inside -->
<rect x="500" y="378" width="540" height="120" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="770" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OneLake mirrored database</text>
<text x="770" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">of an operational SQL instance —</text>
<text x="770" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">inherits the domain default sensitivity context</text>
<text x="770" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">operational SQL keeps running; the mirror makes it governable, not retired</text>
<!-- domain assignment arrow into workspace -->
<line x1="630" y1="290" x2="630" y2="328" stroke="#1E3A66" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- DRIFT-PROVENANCE check marker (amber) -->
<rect x="900" y="200" width="320" height="90" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="1060" y="228" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#8A6D10" text-anchor="middle" dominant-baseline="central">DRIFT-PROVENANCE</text>
<text x="1060" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">flags a workspace whose domain</text>
<text x="1060" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">does not match its OrgPath</text>
<line x1="900" y1="330" x2="900" y2="290" stroke="#D4A017" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar-amber)"/>

<text x="640" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">The idempotent assignment job converges each workspace to the domain its OrgPath claims.</text>
</svg>
