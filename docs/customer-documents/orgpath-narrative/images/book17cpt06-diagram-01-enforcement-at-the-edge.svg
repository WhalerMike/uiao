<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#0D1B2E">Enforcement at the edge — Access-Accept</text>

<!-- amber callout across top -->
<rect x="320" y="110" width="640" height="50" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="640" y="135" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">edge enforces before Conditional Access — closes the admission gap</text>

<!-- AAA server center -->
<rect x="120" y="280" width="280" height="120" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="260" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">AAA server</text>
<text x="260" y="356" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="middle" dominant-baseline="central">Access-Accept</text>

<!-- switchport and endpoint -->
<rect x="900" y="280" width="280" height="120" rx="8" fill="#0D1B2E"/>
<text x="1040" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">switchport</text>
<text x="1040" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">and endpoint</text>

<!-- four navy arrows fanning right with labels -->
<line x1="400" y1="300" x2="898" y2="290" stroke="#0D1B2E" stroke-width="2.2" marker-end="url(#ar-navy)"/>
<text x="650" y="278" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">VLAN assignment</text>
<line x1="400" y1="320" x2="898" y2="320" stroke="#0D1B2E" stroke-width="2.2" marker-end="url(#ar-navy)"/>
<text x="650" y="310" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">downloadable ACL</text>
<line x1="400" y1="350" x2="898" y2="350" stroke="#0D1B2E" stroke-width="2.2" marker-end="url(#ar-navy)"/>
<text x="650" y="368" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">TrustSec SGT</text>
<line x1="400" y1="380" x2="898" y2="390" stroke="#0D1B2E" stroke-width="2.2" marker-end="url(#ar-navy)"/>
<text x="650" y="402" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">posture profile</text>

<!-- teal back-arrow CoA from switchport to AAA -->
<path d="M 1040 280 L 1040 235 L 260 235 L 260 278" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="640" y="222" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">Change of Authorization — RFC 5176</text>

<!-- red branch to quarantine -->
<path d="M 260 400 L 260 510 L 358 510" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>
<text x="120" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="start">no Active OrgPath</text>
<text x="120" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="start">then quarantine VLAN</text>
<rect x="360" y="480" width="420" height="64" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="570" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">quarantine VLAN</text>
<text x="570" y="526" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="central">ORG-BRANCH-UNPOSITIONED</text>
</svg>
