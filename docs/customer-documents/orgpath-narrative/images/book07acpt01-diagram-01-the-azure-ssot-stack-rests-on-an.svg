<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">The SSOT stack rests on a namespace it does</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">not govern</text>

<!-- Upper SSOT block -->
<rect x="300" y="150" width="680" height="110" rx="8" fill="#0D1B2E"/>
<text x="640" y="180" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Fabric + OneLake + Purview</text>
<text x="640" y="208" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">catalog · lineage · sensitivity labels · data products</text>
<text x="640" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-style="italic" fill="#9FB2CC" text-anchor="middle" dominant-baseline="central">trust assertions about data assets</text>

<!-- Suspect markers inside stack -->
<rect x="360" y="270" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="460" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">sensitivity label</text>
<text x="460" y="305" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C0392B" text-anchor="middle" dominant-baseline="central">now suspect</text>
<rect x="720" y="270" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="820" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">lineage record</text>
<text x="820" y="305" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C0392B" text-anchor="middle" dominant-baseline="central">now suspect</text>

<!-- Dependency arrows downward -->
<line x1="400" y1="375" x2="400" y2="262" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<line x1="560" y1="375" x2="560" y2="262" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<line x1="720" y1="375" x2="720" y2="262" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<line x1="880" y1="375" x2="880" y2="262" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<text x="640" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#8A6D10" text-anchor="middle">OneLake access · Purview label eval · Fabric permissions · mirror authorization</text>

<!-- Foundation (Entra namespace) -->
<rect x="300" y="400" width="680" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="640" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Entra ID identity namespace</text>
<!-- Fracture line -->
<path d="M300,470 L420,462 L500,478 L620,460 L740,480 L860,462 L980,472" fill="none" stroke="#C0392B" stroke-width="3"/>
<text x="640" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">ungoverned post-migration drift</text>

<!-- Red propagation up from fracture -->
<line x1="460" y1="460" x2="460" y2="312" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar-red)"/>
<line x1="820" y1="460" x2="820" y2="312" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar-red)"/>

<!-- UIAO substrate band -->
<rect x="300" y="540" width="680" height="70" rx="8" fill="#1E3A66"/>
<text x="640" y="566" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">UIAO identity governance substrate</text>
<text x="640" y="590" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">keeps the namespace trustworthy</text>
<line x1="640" y1="540" x2="640" y2="502" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<text x="640" y="650" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">Drift below the foundation makes every trust assertion above it suspect.</text>
</svg>
