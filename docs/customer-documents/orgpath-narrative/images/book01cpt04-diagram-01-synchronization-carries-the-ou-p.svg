<text x="60" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#0D1B2E" text-anchor="start">Sync carries the OU path across as text —</text><text x="60" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#0D1B2E" text-anchor="start">but leaves its governance meaning behind</text><text x="60" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1E8C8C" text-anchor="start">ACTIVE DIRECTORY</text><rect x="80" y="215" width="330" height="52" rx="6" fill="#0D1B2E"/><text x="245" y="241" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OU = Washington</text><line x1="104" y1="267" x2="104" y2="285" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><rect x="108" y="287" width="302" height="52" rx="6" fill="#0D1B2E"/><text x="259" y="313" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OU = Finance</text><line x1="132" y1="339" x2="132" y2="357" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><rect x="136" y="359" width="274" height="52" rx="6" fill="#D7F2EE"/><text x="273" y="385" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">CN = User01</text><line x1="450" y1="300" x2="560" y2="300" stroke="#0D1B2E" stroke-width="2.5" marker-end="url(#ar-navy)"/><text x="505" y="252.65" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">sync copies</text><text x="505" y="267.35" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">attributes</text><rect x="585" y="210" width="635" height="240" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="610" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="start">ENTRA ID USER OBJECT</text><text x="610" y="295" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="start">onPremisesDistinguishedName</text><text x="610" y="330" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#33414F" text-anchor="start">"CN=User01,OU=Finance,OU=Washington,DC=corp"</text><rect x="610" y="365" width="585" height="62" rx="0" fill="#F7E2DE"/><text x="902" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" font-style="italic" fill="#C0392B" text-anchor="middle" dominant-baseline="central">inert string — no policy, delegation, or scope flows from it</text>
</svg>
