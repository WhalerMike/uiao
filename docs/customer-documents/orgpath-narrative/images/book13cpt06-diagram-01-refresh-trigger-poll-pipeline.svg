<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="bold" fill="#0D1B2E" text-anchor="start">Automated refresh — the orchestrator triggers</text>
<text x="60" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="bold" fill="#0D1B2E" text-anchor="start">and polls the semantic-model refresh</text>

<!-- 1. export orchestrator (navy) -->
<rect x="50" y="160" width="220" height="110" rx="8" fill="#0D1B2E"/>
<text x="160" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Export orchestrator</text>
<text x="160" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle">writes six export files,</text>
<text x="160" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle">updates -latest symlinks</text>

<!-- 2. acquire token (navy) -->
<line x1="270" y1="215" x2="306" y2="215" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<rect x="308" y="160" width="220" height="110" rx="8" fill="#0D1B2E"/>
<text x="418" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Acquire OAuth2 token</text>
<text x="418" y="222" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#C7D4E6" text-anchor="middle">scope analysis.windows.net</text>
<text x="418" y="240" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#C7D4E6" text-anchor="middle">powerbi api default</text>

<!-- 3. POST refreshes (teal) -->
<line x1="528" y1="215" x2="564" y2="215" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<rect x="566" y="150" width="250" height="130" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="691" y="182" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">POST refreshes</text>
<text x="691" y="208" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#33414F" text-anchor="middle">type: full</text>
<text x="691" y="226" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#33414F" text-anchor="middle">commitMode: transactional</text>
<text x="691" y="244" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#33414F" text-anchor="middle">maxParallelism: 4</text>
<text x="691" y="262" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#33414F" text-anchor="middle">retryCount: 2</text>

<!-- poll loop (teal) to decision diamond -->
<line x1="691" y1="280" x2="691" y2="330" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="705" y="308" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#1E8C8C" text-anchor="start">poll every 30s · GET refreshes</text>

<!-- decision diamond -->
<polygon points="691,330 781,400 691,470 601,400" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="691" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">status?</text>

<!-- self-loop arrow back -->
<path d="M601 400 C520 400 520 215 564 215" fill="none" stroke="#1E8C8C" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar-teal)"/>
<text x="505" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#1E8C8C" text-anchor="middle">InProgress</text>
<text x="505" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#1E8C8C" text-anchor="middle">keep polling</text>

<!-- branch 1: Completed (teal) -->
<line x1="781" y1="400" x2="900" y2="320" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="902" y="288" width="260" height="64" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1032" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Completed</text>
<text x="1032" y="332" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle">log duration</text>

<!-- branch 2: timeout (amber) -->
<line x1="781" y1="400" x2="900" y2="400" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>
<rect x="902" y="368" width="260" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1032" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Timeout</text>
<text x="1032" y="412" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle">after MaxPollSeconds · exit 2</text>

<!-- branch 3: Failed (red) -->
<line x1="781" y1="400" x2="900" y2="480" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>
<rect x="902" y="448" width="260" height="64" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="1032" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle">Failed</text>
<text x="1032" y="492" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#33414F" text-anchor="middle">write serviceExceptionJson · exit 1</text>

<!-- XMLA endpoint bypass at bottom -->
<rect x="308" y="560" width="290" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="453" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">XMLA endpoint</text>
<text x="453" y="616" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle">write direct via TMSL</text>
<text x="453" y="636" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">bypasses the gateway</text>
<!-- navy semantic model cylinder -->
<g>
 <ellipse cx="900" cy="572" rx="80" ry="16" fill="#0D1B2E"/>
 <rect x="820" y="572" width="160" height="66" fill="#0D1B2E"/>
 <ellipse cx="900" cy="638" rx="80" ry="16" fill="#0D1B2E"/>
 <ellipse cx="900" cy="572" rx="80" ry="16" fill="none" stroke="#1E3A66" stroke-width="1"/>
 <text x="900" y="612" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Semantic model</text>
</g>
<line x1="598" y1="605" x2="816" y2="605" stroke="#1E8C8C" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar-teal)"/>
</svg>
