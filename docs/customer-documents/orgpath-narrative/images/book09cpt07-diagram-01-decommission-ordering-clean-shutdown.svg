<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Decommission ordering is the control: close</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">the compliance state before deleting the machine</text>

<!-- WRONG ORDER row -->
<text x="60" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#C0392B" text-anchor="start">WRONG ORDER</text>
<rect x="60" y="178" width="260" height="76" rx="8" fill="#0D1B2E"/>
<text x="190" y="208" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Remove-AzResource</text>
<text x="190" y="230" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">arc machine</text>

<rect x="430" y="170" width="280" height="92" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="570" y="196" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle">orphaned record</text>
<text x="570" y="218" font-family="Consolas, monospace" font-size="10" fill="#C0392B" text-anchor="middle">guestConfigurationAssignments</text>
<text x="570" y="240" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C0392B" text-anchor="middle">final state: NonCompliant</text>

<rect x="820" y="170" width="290" height="92" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="965" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle">dashboard noise +</text>
<text x="965" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle">Sentinel false positive</text>

<line x1="320" y1="216" x2="428" y2="216" stroke="#C0392B" stroke-width="2.4" marker-end="url(#ar-red)"/>
<line x1="710" y1="216" x2="818" y2="216" stroke="#C0392B" stroke-width="2.4" marker-end="url(#ar-red)"/>

<!-- divider -->
<line x1="60" y1="300" x2="1220" y2="300" stroke="#E3E8EF" stroke-width="1.4"/>

<!-- CORRECT ORDER row -->
<text x="60" y="346" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1E8C8C" text-anchor="start">CORRECT ORDER</text>
<rect x="60" y="364" width="300" height="92" rx="8" fill="#0D1B2E"/>
<text x="210" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">step 1  Remove-AzResource</text>
<text x="210" y="412" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">guestConfigurationAssignments</text>
<text x="210" y="430" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">OrgPath-Tier0-Baseline</text>

<rect x="430" y="364" width="300" height="92" rx="8" fill="#0D1B2E"/>
<text x="580" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">step 2  Remove-AzResource</text>
<text x="580" y="414" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">Microsoft.HybridCompute</text>
<text x="580" y="430" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">/machines</text>

<rect x="800" y="372" width="270" height="76" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="935" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">compliance state</text>
<text x="935" y="426" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">cleanly closed</text>

<line x1="360" y1="410" x2="428" y2="410" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<line x1="730" y1="410" x2="798" y2="410" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- governance log (amber) receiving arrow from correct path -->
<rect x="820" y="510" width="270" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="955" y="534" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">governance log</text>
<text x="955" y="556" font-family="Consolas, monospace" font-size="11" fill="#33414F" text-anchor="middle">decommission-audit.jsonl</text>
<line x1="935" y1="448" x2="935" y2="508" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>

<!-- amber side note -->
<rect x="60" y="510" width="700" height="44" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="80" y="537" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="start">Use Remove-AzResource by full resource ID &#8212; not Remove-AzPolicyAssignment.</text>

<text x="640" y="640" font-family="Arial, Helvetica, sans-serif" font-size="15" font-style="italic" fill="#6B7A8D" text-anchor="middle">There is no cleanup step that can erase a NonCompliant record stamped against a resource that no longer exists.</text>
</svg>
