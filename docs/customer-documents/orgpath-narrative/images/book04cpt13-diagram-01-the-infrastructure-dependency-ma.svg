<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#0D1B2E">The infrastructure dependency map &#8212;</text><text x="60" y="93" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#0D1B2E">initialization, record schema, lifecycle</text>

<!-- Left panel: Initialization -->
<rect x="50" y="130" width="360" height="430" rx="10" fill="none" stroke="#1E8C8C" stroke-width="2"/>
<rect x="50" y="130" width="360" height="46" rx="10" fill="#1E8C8C"/><text x="230" y="159" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Initialization</text>
<rect x="74" y="200" width="312" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="230" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Azure Migrate</text><text x="230" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">network-flow dependencies</text>
<rect x="74" y="294" width="312" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="230" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">BloodHound / SharpHound</text><text x="230" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">identity and ACL relationships</text>
<rect x="74" y="388" width="312" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="230" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">AD service-account inventory</text><text x="230" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">identity-to-service mapping</text>
<text x="230" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6B7A8D" text-anchor="middle">three sources merge into the map</text>
<line x1="410" y1="340" x2="448" y2="340" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- Center panel: Dependency record -->
<rect x="450" y="130" width="380" height="430" rx="10" fill="none" stroke="#0D1B2E" stroke-width="2"/>
<rect x="450" y="130" width="380" height="46" rx="10" fill="#0D1B2E"/><text x="640" y="159" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Dependency record</text>
<rect x="474" y="196" width="332" height="46" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.2"/><text x="490" y="218" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold" fill="#0D1B2E">id</text><text x="490" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6B7A8D">e.g. INFRA-COMM-001</text>
<rect x="474" y="250" width="332" height="36" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.2"/><text x="490" y="272" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold" fill="#0D1B2E">provider OrgPath</text>
<rect x="474" y="294" width="332" height="36" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.2"/><text x="490" y="316" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold" fill="#0D1B2E">consumer OrgPath</text>
<rect x="474" y="338" width="332" height="48" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.2"/><text x="490" y="360" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold" fill="#0D1B2E">dependencyType</text><text x="490" y="377" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#6B7A8D">Protocol / Application / Infrastructure / Identity</text>
<rect x="474" y="394" width="332" height="48" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.2"/><text x="490" y="416" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold" fill="#0D1B2E">mechanism</text><text x="490" y="433" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#6B7A8D">Kerberos, LDAP, NTLM, DNS, ...</text>
<rect x="474" y="450" width="332" height="36" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.2"/><text x="490" y="472" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold" fill="#0D1B2E">status</text>
<text x="640" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6B7A8D" text-anchor="middle">six-field schema for one record</text>
<line x1="830" y1="340" x2="868" y2="340" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-grey)"/>

<!-- Right panel: Lifecycle -->
<rect x="870" y="130" width="360" height="430" rx="10" fill="none" stroke="#0D1B2E" stroke-width="2"/>
<rect x="870" y="130" width="360" height="46" rx="10" fill="#0D1B2E"/><text x="1050" y="159" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Lifecycle</text>
<rect x="900" y="210" width="300" height="52" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/><text x="1050" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Active</text>
<rect x="900" y="300" width="300" height="52" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/><text x="1050" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">InRemediation</text>
<rect x="900" y="390" width="300" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/><text x="1050" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Resolved</text><text x="1050" y="442" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#33414F" text-anchor="middle">+ resolvedDate, resolvedBy,</text><text x="1050" y="458" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#33414F" text-anchor="middle">migrationTarget</text>
<line x1="1050" y1="262" x2="1050" y2="298" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="1050" y1="352" x2="1050" y2="388" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<!-- weekly discovery loop -->
<path d="M 900,236 C 870,540 1090,540 1130,262" fill="none" stroke="#D4A017" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar-amber)"/>
<text x="1050" y="525" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#D4A017" text-anchor="middle">weekly discovery loops new flows back as draft Active records</text>
</svg>
