<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath's hierarchically composable format and</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">where it is stored on each surface</text>

<!-- LEFT PANEL: composable prefixes -->
<rect x="60" y="130" width="540" height="540" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="80" y="162" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="start">Composable, prefix-matchable</text>
<text x="330" y="222" font-family="Consolas, monospace" font-size="26" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">ops/field-svc/region-west</text>

<!-- prefix bracket 1 -->
<rect x="80" y="270" width="100" height="34" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="130" y="287" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">ops</text>
<text x="200" y="287" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">division</text>
<text x="200" y="307" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="start">a valid OrgPath; prefix-matchable</text>

<!-- prefix bracket 2 -->
<rect x="80" y="330" width="220" height="34" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="190" y="347" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">ops/field-svc</text>
<text x="320" y="347" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">department</text>
<text x="320" y="367" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="start">a valid OrgPath; prefix-matchable</text>

<!-- prefix bracket 3 -->
<rect x="80" y="390" width="340" height="34" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="250" y="407" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">ops/field-svc/region-west</text>
<text x="80" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">unit</text>
<text x="80" y="472" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="start">a valid OrgPath in its own right; prefix-matchable</text>

<text x="80" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="start">Each successive prefix names a real node in</text>
<text x="80" y="560" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="start">the tree &#8212; one delimited string carries the</text>
<text x="80" y="580" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="start">whole ancestry.</text>

<!-- registry source -->
<rect x="80" y="606" width="500" height="48" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
<text x="330" y="630" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">all values derived from one OrgTree registry</text>

<!-- RIGHT PANEL: three surfaces -->
<rect x="640" y="130" width="580" height="540" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="660" y="162" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="start">Same value stored across three surfaces</text>

<!-- surface 1: user -->
<rect x="660" y="186" width="540" height="100" rx="8" fill="#0D1B2E"/>
<text x="680" y="212" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">User object</text>
<text x="680" y="236" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="start">directory schema-extension attribute</text>
<text x="680" y="266" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF" text-anchor="start">ops/field-svc/region-west</text>

<!-- surface 2: device -->
<rect x="660" y="298" width="540" height="100" rx="8" fill="#0D1B2E"/>
<text x="680" y="324" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Device object</text>
<text x="680" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="start">same schema-extension attribute</text>
<text x="680" y="378" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF" text-anchor="start">ops/field-svc/region-west</text>

<!-- surface 3: server -->
<rect x="660" y="410" width="540" height="100" rx="8" fill="#0D1B2E"/>
<text x="680" y="436" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Server (hybrid-management record)</text>
<text x="680" y="460" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="start">resource tag</text>
<text x="680" y="490" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF" text-anchor="start">ops/field-svc/region-west</text>

<!-- note -->
<rect x="660" y="528" width="540" height="120" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="930" y="566" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">same value, same format, all surfaces</text>
<text x="930" y="600" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="middle" dominant-baseline="central">no per-surface interpretation logic</text>
<text x="930" y="624" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">a single query matches every surface</text>

<!-- registry arrow into right panel -->
<line x1="580" y1="630" x2="640" y2="500" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
</svg>
