<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E" text-anchor="start">Infoblox holds permanent DHCP authority;</text>
<text x="60" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E" text-anchor="start">Azure VNet addressing is platform-managed</text>

<!-- OrgTree registry + pipeline (top left, feeding the teal box) -->
<rect x="50" y="120" width="170" height="56" rx="8" fill="#0D1B2E"/>
<text x="135" y="148" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree-registry</text>
<line x1="220" y1="148" x2="258" y2="148" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<rect x="260" y="120" width="150" height="56" rx="8" fill="#0D1B2E"/>
<text x="335" y="148" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">pipeline</text>

<!-- WAPI arrow carrying EA block down -->
<rect x="430" y="112" width="220" height="74" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="540" y="130" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">extensible_attributes</text>
<text x="540" y="150" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">OrgPath · OrgNodeId</text>
<text x="540" y="168" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">OrgTier · MigrationPhase</text>
<line x1="410" y1="148" x2="428" y2="148" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<path d="M 360 260 L 360 235 L 270 235 L 270 235" fill="none" stroke="none"/>

<!-- Left: NIOS Grid DHCP authority -->
<rect x="60" y="220" width="500" height="320" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="310" y="248" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">NIOS-GRID-DHCP-AUTHORITY</text>
<rect x="90" y="272" width="440" height="40" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="310" y="292" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">range</text>
<rect x="90" y="320" width="440" height="40" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="310" y="340" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">fixedaddress</text>
<rect x="90" y="368" width="440" height="40" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="310" y="388" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">dhcpfailover</text>
<rect x="90" y="416" width="440" height="40" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="310" y="436" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">sharednetwork</text>
<rect x="90" y="478" width="440" height="44" rx="6" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="310" y="500" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">option-space · option-code</text>

<!-- EA arrow into the object rows -->
<line x1="540" y1="186" x2="540" y2="270" stroke="#1E8C8C" stroke-width="1.8" stroke-dasharray="6 4"/>
<line x1="540" y1="270" x2="530" y2="290" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<text x="600" y="232" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle">WAPI v2.12</text>

<!-- amber pillar band center -->
<rect x="600" y="220" width="80" height="320" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="640" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" transform="rotate(-90 640 380)">PERMANENT-DDI-PILLAR</text>

<!-- Right: Azure VNet addressing (non-administrable) -->
<rect x="720" y="220" width="500" height="200" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="970" y="248" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">AZURE-VNET-ADDRESSING</text>
<rect x="752" y="272" width="436" height="120" rx="6" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.2"/>
<text x="970" y="298" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">source 168.63.129.16</text>
<text x="970" y="322" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">no scopes · no reservations</text>
<text x="970" y="346" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">no option codes · no failover</text>
<!-- red crossed-out -->
<circle cx="970" cy="372" r="13" fill="none" stroke="#C0392B" stroke-width="2.4"/>
<line x1="961" y1="363" x2="979" y2="381" stroke="#C0392B" stroke-width="2.4"/>
<line x1="800" y1="372" x2="940" y2="372" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="850" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#C0392B" text-anchor="middle">non-administrable</text>

<!-- on-prem client icons connecting only to Infoblox side -->
<rect x="80" y="588" width="100" height="38" rx="6" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.2"/>
<text x="130" y="608" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">printer</text>
<rect x="200" y="588" width="100" height="38" rx="6" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.2"/>
<text x="250" y="608" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">phone</text>
<rect x="320" y="588" width="100" height="38" rx="6" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.2"/>
<text x="370" y="608" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">PXE-host</text>
<rect x="440" y="588" width="100" height="38" rx="6" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.2"/>
<text x="490" y="608" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">OT-segment</text>
<line x1="310" y1="588" x2="310" y2="542" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="310" y="652" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#33414F" text-anchor="middle">On-premises clients lease only from the Infoblox side</text>
</svg>
