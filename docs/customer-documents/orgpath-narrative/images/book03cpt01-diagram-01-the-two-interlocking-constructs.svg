<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-teal-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">The two interlocking constructs, stated plainly</text>

<!-- LEFT PANEL: OrgTree -->
<rect x="60" y="110" width="520" height="420" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="80" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgTree &#8212; the map</text>
<text x="80" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="start">governed, versioned hierarchy registry</text>
<!-- version + lock badges -->
<rect x="372" y="124" width="92" height="26" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.3"/>
<text x="418" y="138" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">v 2.4.0</text>
<rect x="474" y="124" width="86" height="26" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.3"/>
<text x="517" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">&#128274; locked</text>
<!-- tree -->
<rect x="250" y="196" width="140" height="44" rx="8" fill="#0D1B2E"/>
<text x="320" y="218" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">root</text>
<line x1="320" y1="240" x2="170" y2="288" stroke="#5A5A5A" stroke-width="1.8"/>
<line x1="320" y1="240" x2="470" y2="288" stroke="#5A5A5A" stroke-width="1.8"/>
<rect x="100" y="288" width="140" height="42" rx="8" fill="#1E3A66"/>
<text x="170" y="309" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">division</text>
<rect x="400" y="288" width="140" height="42" rx="8" fill="#1E3A66"/>
<text x="470" y="309" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">division</text>
<line x1="170" y1="330" x2="140" y2="378" stroke="#5A5A5A" stroke-width="1.8"/>
<line x1="170" y1="330" x2="300" y2="378" stroke="#5A5A5A" stroke-width="1.8"/>
<rect x="70" y="378" width="140" height="40" rx="8" fill="#2E75B6"/>
<text x="140" y="398" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">department</text>
<rect x="230" y="378" width="140" height="40" rx="8" fill="#2E75B6"/>
<text x="300" y="398" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">department</text>
<line x1="140" y1="418" x2="140" y2="458" stroke="#5A5A5A" stroke-width="1.8"/>
<rect x="70" y="458" width="140" height="40" rx="8" fill="#6B7A8D"/>
<text x="140" y="478" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">unit</text>
<text x="300" y="478" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">authoritative artifact</text>

<!-- RIGHT PANEL: OrgPath -->
<rect x="700" y="110" width="520" height="420" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="720" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath &#8212; the coordinate</text>
<text x="720" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7A8D" text-anchor="start">each asset stamped with its node path</text>
<!-- user -->
<rect x="720" y="196" width="480" height="84" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="742" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="start">User</text>
<text x="742" y="254" font-family="Consolas, monospace" font-size="14" fill="#1E8C8C" text-anchor="start">ops/field-svc/region-west</text>
<!-- device -->
<rect x="720" y="294" width="480" height="84" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="742" y="324" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="start">Device</text>
<text x="742" y="352" font-family="Consolas, monospace" font-size="14" fill="#1E8C8C" text-anchor="start">ops/field-svc/region-west</text>
<!-- server -->
<rect x="720" y="392" width="480" height="84" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="742" y="422" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="start">Server</text>
<text x="742" y="450" font-family="Consolas, monospace" font-size="14" fill="#1E8C8C" text-anchor="start">ops/field-svc</text>
<text x="960" y="498" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">path-encoded value points to exact node</text>

<!-- bidirectional bracket between panels -->
<line x1="600" y1="320" x2="680" y2="320" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)" marker-start="url(#ar-teal-s)"/>
<text x="640" y="296" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">registry</text>
<text x="640" y="310" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">defines</text>
<text x="640" y="344" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">attr</text>
<text x="640" y="358" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">carries</text>

<!-- footer band -->
<rect x="60" y="556" width="1160" height="120" rx="10" fill="#0D1B2E"/>
<text x="80" y="582" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.5" fill="#FFFFFF" text-anchor="start">REQUIREMENT FAMILIES ADDRESSED BY THE PAIR</text>
<text x="80" y="614" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="start">position</text>
<text x="240" y="614" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="start">policy inheritance</text>
<text x="470" y="614" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="start">cross-surface coherence</text>
<text x="790" y="614" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="start">authoritative hierarchy</text>
<text x="80" y="646" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="start">dependency mapping</text>
<text x="320" y="646" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="start">drift detection</text>
<text x="530" y="646" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="start">automation</text>
<text x="710" y="646" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="start">version control</text>
</svg>
