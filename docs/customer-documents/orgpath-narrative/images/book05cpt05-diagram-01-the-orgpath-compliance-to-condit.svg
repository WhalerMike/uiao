<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-teal2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">The OrgPath compliance-to-CA bridge</text>

<!-- Step 1 navy -->
<rect x="60" y="130" width="240" height="64" rx="8" fill="#0D1B2E"/>
<text x="180" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Device OrgPath</text>
<text x="180" y="176" font-family="Consolas, monospace" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">/Root/Finance</text>

<!-- Step 2 teal -->
<rect x="360" y="130" width="240" height="64" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="480" y="162" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">ORG-BRANCH-FINANCE</text>
<text x="480" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">membership</text>

<line x1="300" y1="162" x2="358" y2="162" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- Step 3: Finance compliance policy -->
<rect x="660" y="120" width="280" height="86" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="800" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Finance segment compliance</text>
<text x="800" y="162" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">BitLocker, TPM 2.0, Secure Boot,</text>
<text x="800" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">minimum build, 12-char PIN</text>
<line x1="600" y1="162" x2="658" y2="162" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- Org-wide baseline -->
<rect x="660" y="300" width="280" height="64" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="800" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Org-wide baseline</text>
<text x="800" y="346" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">compliance policy</text>

<!-- Intune evaluates (navy) -->
<rect x="660" y="420" width="280" height="70" rx="8" fill="#0D1B2E"/>
<text x="800" y="448" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Intune evaluates device</text>
<text x="800" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">compliant?</text>

<!-- both feed into evaluate, AND logic -->
<line x1="800" y1="206" x2="800" y2="418" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="800" y1="364" x2="800" y2="418" stroke="#1E8C8C" stroke-width="2"/>
<rect x="952" y="328" width="190" height="44" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="1047" y="345" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">AND logic</text>
<text x="1047" y="362" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">must satisfy BOTH</text>
<line x1="952" y1="350" x2="850" y2="350" stroke="#D4A017" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar-amber)"/>

<!-- amber compliance signal token to CA -->
<rect x="640" y="540" width="320" height="56" rx="28" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="800" y="568" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">device compliance signal</text>
<line x1="800" y1="490" x2="800" y2="538" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>

<!-- CA grant control (navy) -->
<rect x="60" y="530" width="500" height="76" rx="8" fill="#0D1B2E"/>
<text x="310" y="558" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Conditional Access grant control</text>
<text x="310" y="582" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle">require MFA and a compliant device</text>
<line x1="638" y1="568" x2="562" y2="568" stroke="#0D1B2E" stroke-width="2.2" marker-end="url(#ar-navy)"/>

<!-- terminal: granted / denied -->
<rect x="1000" y="430" width="220" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="1110" y="458" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Access granted</text>
<rect x="1000" y="520" width="220" height="76" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="1110" y="546" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle">Access denied</text>
<text x="1110" y="568" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">non-compliant or</text>
<text x="1110" y="584" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">unpositioned device</text>

<!-- granted: from CA box bottom, route under the pill -->
<path d="M310,606 L310,646 L1110,646 L1110,488" fill="none" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<!-- denied: from CA box bottom, slightly lower lane -->
<path d="M360,606 L360,666 L1150,666 L1150,598" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ar-red)"/>
</svg>
