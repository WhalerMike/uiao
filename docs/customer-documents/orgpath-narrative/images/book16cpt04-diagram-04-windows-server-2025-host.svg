<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
  <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
  <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>

<!-- Title -->
<text x="60" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E">The shape of the machine: one door at the edge</text>

<!-- ===== Inbound operator identities (far left) ===== -->
<rect x="50" y="250" width="172" height="64" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="136" y="277" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">Internal staff</text>
<text x="136" y="297" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">AD LDAPS</text>

<rect x="50" y="334" width="172" height="64" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="136" y="358" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">Tenant contributors</text>
<text x="136" y="380" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">Entra OIDC (group claims)</text>

<!-- converging arrows into IIS -->
<path d="M222,282 C262,282 262,330 300,343" fill="none" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<path d="M222,366 C262,366 262,348 300,347" fill="none" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>

<!-- ===== Host outline ===== -->
<rect x="304" y="118" width="916" height="566" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2.5"/>
<rect x="304" y="118" width="916" height="44" rx="0" fill="#0D1B2E"/>
<text x="328" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#FFFFFF" dominant-baseline="central">WINDOWS SERVER 2025</text>
<text x="1196" y="140" font-size="14" font-weight="bold" fill="#D4A017" text-anchor="end" dominant-baseline="central">Tier-0</text>

<!-- IIS edge block (left edge of host, public interface) -->
<rect x="316" y="300" width="116" height="96" rx="6" fill="#1E8C8C"/>
<text x="374" y="328" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">IIS</text>
<text x="374" y="352" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">TLS :443</text>
<text x="374" y="372" font-size="10.5" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">only public</text>
<text x="374" y="386" font-size="10.5" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">interface</text>

<!-- arrow IIS -> Gitea (loopback, crosses inward) -->
<path d="M432,348 L600,348" fill="none" stroke="#0D1B2E" stroke-width="2" marker-end="url(#ar-navy)"/>
<text x="516" y="334" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#5A5A5A" text-anchor="middle">reverse proxy</text>

<!-- Gitea block -->
<rect x="604" y="288" width="216" height="120" rx="6" fill="#0D1B2E"/>
<text x="712" y="318" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Gitea</text>
<text x="712" y="346" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">127.0.0.1:3000</text>
<text x="712" y="372" font-size="12.5" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">Git service</text>
<text x="712" y="390" font-size="11.5" fill="#9FB3C8" text-anchor="middle" dominant-baseline="central">loopback only</text>

<!-- gMSA identity badge attached to Gitea (top-right) -->
<rect x="838" y="200" width="356" height="74" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
<circle cx="872" cy="237" r="15" fill="#D4A017"/>
<text x="872" y="237" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ID</text>
<text x="900" y="224" font-size="14" font-weight="bold" fill="#0D1B2E">gMSA service account</text>
<text x="900" y="246" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F">svc-uiao-gitea$</text>
<text x="900" y="264" font-size="11.5" fill="#5A5A5A">directory-issued, rotated</text>
<path d="M812,288 C870,260 880,260 900,266" fill="none" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>

<!-- secret store vault feeds Gitea -->
<rect x="838" y="300" width="220" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
<rect x="854" y="316" width="32" height="32" rx="4" fill="#D4A017"/>
<circle cx="870" cy="332" r="6" fill="#FBEED2"/>
<rect x="868" y="332" width="4" height="9" fill="#FBEED2"/>
<text x="978" y="326" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Secret store</text>
<text x="978" y="346" font-size="11.5" fill="#5A5A5A" text-anchor="middle">never in config files</text>
<path d="M838,332 L820,332" fill="none" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>

<!-- ===== Storage cylinders (below Gitea) ===== -->
<!-- helper: cylinder via ellipse + rect -->
<!-- D:\GitRepos -->
<g>
  <path d="M340,470 a52,12 0 0 1 104,0 v66 a52,12 0 0 1 -104,0 z" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <ellipse cx="392" cy="470" rx="52" ry="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="392" y="504" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">D:\GitRepos</text>
  <text x="392" y="600" font-size="12.5" fill="#33414F" text-anchor="middle">bare object stores</text>
</g>

<!-- Git LFS -->
<g>
  <path d="M540,470 a52,12 0 0 1 104,0 v66 a52,12 0 0 1 -104,0 z" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <ellipse cx="592" cy="470" rx="52" ry="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="592" y="504" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Git LFS</text>
  <text x="592" y="600" font-size="12.5" fill="#33414F" text-anchor="middle">large artifacts</text>
</g>

<!-- Gitea -> repos / LFS arrows -->
<path d="M680,408 C620,430 480,440 392,458" fill="none" stroke="#0D1B2E" stroke-width="1.8" marker-end="url(#ar-navy)"/>
<path d="M704,408 L592,458" fill="none" stroke="#0D1B2E" stroke-width="1.8" marker-end="url(#ar-navy)"/>

<!-- PostgreSQL off-host cylinder (red dashed, separate host) -->
<g>
  <path d="M1052,468 a60,13 0 0 1 120,0 v70 a60,13 0 0 1 -120,0 z" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="6 4"/>
  <ellipse cx="1112" cy="468" rx="60" ry="13" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="1112" y="504" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
  <text x="1112" y="524" font-size="11" fill="#C0392B" text-anchor="middle" dominant-baseline="central">relational state</text>
  <text x="1112" y="600" font-size="12.5" fill="#C0392B" text-anchor="middle">separate host</text>
</g>
<path d="M820,400 C940,420 1000,440 1052,458" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ar-red)"/>
<text x="952" y="430" font-size="11.5" font-style="italic" fill="#C0392B" text-anchor="middle">off-host</text>

<!-- Legend / caption strip -->
<text x="328" y="664" font-size="12.5" fill="#6B7A8D">One door at the edge: IIS terminates TLS; Gitea answers only on loopback; identity is directory-issued.</text>
</svg>
