<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Active Directory as a single unified substrate</text><circle cx="640" cy="235" r="82" fill="#0D1B2E"/><text x="640" y="225.55" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">THE</text><text x="640" y="244.45" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">DIRECTORY</text><text x="640" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">one model — feeding every facet below</text><rect x="60" y="410" width="340" height="120" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/><rect x="60" y="410" width="9" height="120" rx="0" fill="#1E8C8C"/><text x="88" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="start">OU tree</text><text x="88" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#6B7A8D" text-anchor="start">Where every object sits</text><rect x="490" y="410" width="340" height="120" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/><rect x="490" y="410" width="9" height="120" rx="0" fill="#1E8C8C"/><text x="518" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="start">Group Policy</text><text x="518" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#6B7A8D" text-anchor="start">Inherited down the tree</text><rect x="920" y="410" width="340" height="120" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/><rect x="920" y="410" width="9" height="120" rx="0" fill="#1E8C8C"/><text x="948" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="start">Kerberos + DNS</text><text x="948" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#6B7A8D" text-anchor="start">One service-locator fabric</text><rect x="60" y="560" width="340" height="120" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/><rect x="60" y="560" width="9" height="120" rx="0" fill="#1E8C8C"/><text x="88" y="605" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="start">AD CS</text><text x="88" y="642" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#6B7A8D" text-anchor="start">Templates by directory identity</text><rect x="490" y="560" width="340" height="120" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/><rect x="490" y="560" width="9" height="120" rx="0" fill="#1E8C8C"/><text x="518" y="605" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="start">LDAP</text><text x="518" y="642" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#6B7A8D" text-anchor="start">One query for the whole graph</text><rect x="920" y="560" width="340" height="120" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/><rect x="920" y="560" width="9" height="120" rx="0" fill="#1E8C8C"/><text x="948" y="605" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="start">Delegation</text><text x="948" y="642" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#6B7A8D" text-anchor="start">Authority over a subtree</text>
</svg>
