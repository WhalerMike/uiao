<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Book_19 cover — illustrative register (ADR-095). One idea: people sit at
       governed points on a place grid; the grid, not the scatter, is the story. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF1FB"/>
      <stop offset="1" stop-color="#CFE0F2"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D7F2EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D7F2EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky and ground -->
  <rect x="0" y="0" width="1280" height="400" fill="url(#sky)"/>
  <rect x="0" y="400" width="1280" height="320" fill="#FFFFFF"/>
  <ellipse cx="640" cy="400" rx="260" ry="90" fill="url(#horizonGlow)"/>
  <line x1="0" y1="400" x2="1280" y2="400" stroke="#6B7A8D" stroke-width="1.5" opacity="0.6"/>

  <!-- governed grid: receding horizontals -->
  <g stroke="#1E8C8C" stroke-width="1.2">
    <line x1="0" y1="424" x2="1280" y2="424" opacity="0.18"/>
    <line x1="0" y1="456" x2="1280" y2="456" opacity="0.22"/>
    <line x1="0" y1="500" x2="1280" y2="500" opacity="0.26"/>
    <line x1="0" y1="558" x2="1280" y2="558" opacity="0.30"/>
    <line x1="0" y1="632" x2="1280" y2="632" opacity="0.34"/>
  </g>
  <!-- governed grid: lines converging on the vanishing point -->
  <g stroke="#1E8C8C" stroke-width="1.2" opacity="0.28">
    <line x1="640" y1="402" x2="40" y2="720"/>
    <line x1="640" y1="402" x2="280" y2="720"/>
    <line x1="640" y1="402" x2="500" y2="720"/>
    <line x1="640" y1="402" x2="780" y2="720"/>
    <line x1="640" y1="402" x2="1000" y2="720"/>
    <line x1="640" y1="402" x2="1240" y2="720"/>
  </g>

  <!-- the named path into the horizon -->
  <path d="M 560 720 L 600 720 L 642 404 L 638 404 Z" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1" opacity="0.9"/>
  <text x="620" y="702" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#0D1B2E" text-anchor="middle">/USA/MD/ANNAPOLIS-HQ</text>

  <!-- distant buildings on grid intersections -->
  <g>
    <g transform="translate(420 436)">
      <rect x="0" y="-26" width="34" height="26" fill="#0D1B2E"/>
      <rect x="5" y="-20" width="6" height="6" fill="#EAF1FB"/>
      <rect x="15" y="-20" width="6" height="6" fill="#EAF1FB"/>
      <rect x="5" y="-11" width="6" height="6" fill="#EAF1FB"/>
    </g>
    <g transform="translate(836 446)">
      <rect x="0" y="-34" width="42" height="34" fill="#0D1B2E"/>
      <rect x="6" y="-27" width="7" height="7" fill="#EAF1FB"/>
      <rect x="18" y="-27" width="7" height="7" fill="#EAF1FB"/>
      <rect x="6" y="-15" width="7" height="7" fill="#EAF1FB"/>
      <rect x="18" y="-15" width="7" height="7" fill="#EAF1FB"/>
    </g>
    <g transform="translate(252 482)">
      <rect x="0" y="-44" width="52" height="44" fill="#0D1B2E"/>
      <rect x="8" y="-36" width="9" height="9" fill="#EAF1FB"/>
      <rect x="22" y="-36" width="9" height="9" fill="#EAF1FB"/>
      <rect x="8" y="-21" width="9" height="9" fill="#EAF1FB"/>
      <rect x="22" y="-21" width="9" height="9" fill="#EAF1FB"/>
    </g>
    <g transform="translate(996 498)">
      <rect x="0" y="-52" width="58" height="52" fill="#0D1B2E"/>
      <rect x="9" y="-43" width="10" height="10" fill="#EAF1FB"/>
      <rect x="25" y="-43" width="10" height="10" fill="#EAF1FB"/>
      <rect x="9" y="-26" width="10" height="10" fill="#EAF1FB"/>
      <rect x="25" y="-26" width="10" height="10" fill="#EAF1FB"/>
    </g>
  </g>

  <!-- mid-ground muted seated figures -->
  <g fill="#A9B8CA">
    <g transform="translate(330 540) scale(0.7)">
      <rect x="-20" y="26" width="58" height="6" rx="3"/>
      <circle cx="0" cy="-16" r="9"/>
      <path d="M -9 -8 Q -12 14 -6 24 L 16 24 Q 14 12 8 -6 Q 0 -12 -9 -8 Z"/>
      <rect x="2" y="14" width="22" height="9" rx="4.5"/>
    </g>
    <g transform="translate(905 566) scale(0.8)">
      <rect x="-20" y="26" width="58" height="6" rx="3"/>
      <circle cx="0" cy="-16" r="9"/>
      <path d="M -9 -8 Q -12 14 -6 24 L 16 24 Q 14 12 8 -6 Q 0 -12 -9 -8 Z"/>
      <rect x="2" y="14" width="22" height="9" rx="4.5"/>
    </g>
  </g>

  <!-- foreground seated figures at governed points -->
  <g fill="#2E4B6B">
    <g transform="translate(180 636)">
      <rect x="-26" y="34" width="74" height="8" rx="4" fill="#6B7A8D"/>
      <circle cx="0" cy="-20" r="12"/>
      <path d="M -12 -10 Q -16 18 -8 31 L 20 31 Q 18 15 10 -8 Q 0 -15 -12 -10 Z"/>
      <rect x="3" y="18" width="28" height="12" rx="6"/>
    </g>
    <g transform="translate(760 648)">
      <rect x="-26" y="34" width="74" height="8" rx="4" fill="#6B7A8D"/>
      <circle cx="0" cy="-20" r="12"/>
      <path d="M -12 -10 Q -16 18 -8 31 L 20 31 Q 18 15 10 -8 Q 0 -15 -12 -10 Z"/>
      <rect x="3" y="18" width="28" height="12" rx="6"/>
    </g>
    <g transform="translate(1100 660)">
      <rect x="-26" y="34" width="74" height="8" rx="4" fill="#6B7A8D"/>
      <circle cx="0" cy="-20" r="12"/>
      <path d="M -12 -10 Q -16 18 -8 31 L 20 31 Q 18 15 10 -8 Q 0 -15 -12 -10 Z"/>
      <rect x="3" y="18" width="28" height="12" rx="6"/>
    </g>
  </g>

  <!-- teal anchor points beneath the seated figures: governed, not incidental -->
  <g fill="#1E8C8C">
    <circle cx="180" cy="681" r="5"/>
    <circle cx="760" cy="693" r="5"/>
    <circle cx="1100" cy="705" r="5"/>
  </g>
</svg>
