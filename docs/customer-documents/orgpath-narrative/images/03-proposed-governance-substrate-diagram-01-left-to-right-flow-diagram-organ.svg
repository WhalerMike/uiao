<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">The governance substrate, end to end</text>

<!-- lane headers -->
<text x="170" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D" text-anchor="middle">AUTHORITY</text>
<text x="555" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D" text-anchor="middle">MECHANISM</text>
<text x="1000" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D" text-anchor="middle">LIVE ENVIRONMENT</text>
<line x1="340" y1="140" x2="340" y2="500" stroke="#E3E8EF" stroke-width="1.4"/>
<line x1="770" y1="140" x2="770" y2="500" stroke="#E3E8EF" stroke-width="1.4"/>

<!-- Lane 1: Authority -->
<rect x="60" y="280" width="220" height="100" rx="8" fill="#0D1B2E"/>
<text x="170" y="312" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree Registry</text>
<text x="170" y="338" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">versioned, governed</text>
<text x="170" y="356" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">artifact</text>

<!-- Lane 2: Mechanism -->
<rect x="430" y="280" width="250" height="100" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="555" y="312" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Governance Pipeline</text>
<text x="555" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">derive &#183; validate &#183; stamp</text>

<!-- Lane 3: three stacked boxes -->
<rect x="830" y="170" width="390" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="1025" y="198" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath Attribute</text>
<text x="1025" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">on every user, device, server</text>
<rect x="830" y="270" width="390" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="1025" y="298" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Dynamic Groups</text>
<text x="1025" y="324" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">node + branch</text>
<rect x="830" y="370" width="390" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="1025" y="398" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Policy Coverage</text>
<text x="1025" y="424" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">scoped assignment</text>

<!-- solid flow arrows -->
<line x1="280" y1="330" x2="428" y2="330" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<text x="354" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1E8C8C" text-anchor="middle">defines valid paths</text>
<line x1="680" y1="310" x2="828" y2="210" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<text x="752" y="244" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1E8C8C" text-anchor="middle">stamps value</text>
<line x1="1025" y1="250" x2="1025" y2="268" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="1130" y="262" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1E8C8C" text-anchor="middle">prefix/exact match</text>
<line x1="1025" y1="350" x2="1025" y2="368" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="1130" y="362" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1E8C8C" text-anchor="middle">scoped assignment</text>

<!-- dashed feedback arrow: Policy Coverage -> Pipeline -->
<path d="M 830 410 L 555 480 L 555 382" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar-red)"/>
<text x="700" y="497" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C0392B" text-anchor="middle">drift findings feed back</text>

<!-- governance repository -->
<rect x="290" y="556" width="700" height="80" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="640" y="584" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Governance Repository</text>
<text x="640" y="610" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">every change committed</text>

<!-- dashed audit arrows down to repository -->
<path d="M 170 380 L 170 596 L 288 596" fill="none" stroke="#5A5A5A" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ar-grey)"/>
<text x="175" y="486" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5A5A5A" text-anchor="start">audit</text>
<path d="M 555 510 L 555 556" fill="none" stroke="#5A5A5A" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ar-grey)"/>

<!-- red marker def -->
<defs><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
</svg>
