<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">The governed DNS transition: AD-integrated</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">zones to Azure-native resolution</text>

<!-- LEFT: on-prem -->
<text x="80" y="138" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#6B7A8D">ON-PREMISES</text>
<rect x="60" y="150" width="300" height="150" rx="8" fill="#1F3A5F"/>
<text x="210" y="178" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AD-integrated DNS</text>
<text x="210" y="200" font-family="Arial, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">on domain controllers</text>
<text x="210" y="228" font-family="Consolas, monospace" font-size="11" fill="#EAF1FB" text-anchor="middle">Netlogon SRV registration</text>
<text x="210" y="248" font-family="Consolas, monospace" font-size="11" fill="#EAF1FB" text-anchor="middle">secure dynamic update</text>
<text x="210" y="268" font-family="Consolas, monospace" font-size="11" fill="#EAF1FB" text-anchor="middle">fwd and reverse lookup zones</text>
<rect x="60" y="312" width="145" height="80" rx="8" fill="#1F3A5F"/>
<text x="132" y="342" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Windows Server</text>
<text x="132" y="362" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">IPAM</text>
<text x="132" y="382" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">baseline export</text>
<rect x="215" y="312" width="145" height="80" rx="8" fill="#1F3A5F"/>
<text x="287" y="348" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Windows Server</text>
<text x="287" y="368" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DHCP</text>

<!-- CENTER: resolver -->
<text x="525" y="138" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#6B7A8D" text-anchor="middle">HUB VNET</text>
<rect x="430" y="170" width="240" height="200" rx="8" fill="#1E8C8C"/>
<text x="550" y="200" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Azure DNS</text>
<text x="550" y="220" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Private Resolver</text>
<rect x="450" y="240" width="200" height="48" rx="6" fill="#FFFFFF" opacity="0.92"/>
<text x="550" y="265" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle">inbound endpoint</text>
<text x="550" y="281" font-family="Consolas, monospace" font-size="10" fill="#33414F" text-anchor="middle">static IP</text>
<rect x="450" y="298" width="200" height="56" rx="6" fill="#FFFFFF" opacity="0.92"/>
<text x="550" y="320" font-family="Consolas, monospace" font-size="11" fill="#0D1B2E" text-anchor="middle">outbound endpoint</text>
<text x="550" y="338" font-family="Consolas, monospace" font-size="10" fill="#33414F" text-anchor="middle">paired to Forwarding Ruleset</text>

<!-- RIGHT: azure zones -->
<text x="1075" y="138" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#6B7A8D" text-anchor="middle">AZURE-NATIVE</text>
<rect x="920" y="150" width="300" height="120" rx="8" fill="#1E8C8C"/>
<text x="1070" y="178" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Azure DNS Private Zones</text>
<text x="1070" y="206" font-family="Consolas, monospace" font-size="11" fill="#EAF1FB" text-anchor="middle">tagged OrgPath, OrgNodeId,</text>
<text x="1070" y="226" font-family="Consolas, monospace" font-size="11" fill="#EAF1FB" text-anchor="middle">OrgTier, MigrationPhase</text>
<rect x="920" y="290" width="300" height="80" rx="8" fill="#1E8C8C"/>
<text x="1070" y="320" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Azure IPAM</text>
<text x="1070" y="346" font-family="Consolas, monospace" font-size="11" fill="#EAF1FB" text-anchor="middle">tracking VNet address space</text>

<!-- bridging arrows -->
<line x1="360" y1="230" x2="428" y2="245" stroke="#1E8C8C" stroke-width="2.4" marker-start="url(#ar-teal)" marker-end="url(#ar-teal)"/>
<line x1="670" y1="245" x2="918" y2="210" stroke="#1E8C8C" stroke-width="2.4" marker-start="url(#ar-teal)" marker-end="url(#ar-teal)"/>
<line x1="205" y1="352" x2="918" y2="330" stroke="#5A5A5A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar-grey)"/>

<!-- amber progress band -->
<rect x="60" y="500" width="1160" height="80" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="80" y="528" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E">MigrationPhase</text>
<rect x="290" y="510" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.2"/>
<text x="390" y="535" font-family="Consolas, monospace" font-size="13" fill="#0D1B2E" text-anchor="middle">Assessment</text>
<line x1="490" y1="530" x2="540" y2="530" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<rect x="545" y="510" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.2"/>
<text x="645" y="535" font-family="Consolas, monospace" font-size="13" fill="#0D1B2E" text-anchor="middle">Migration</text>
<line x1="745" y1="530" x2="795" y2="530" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<rect x="800" y="510" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.2"/>
<text x="900" y="535" font-family="Consolas, monospace" font-size="13" fill="#0D1B2E" text-anchor="middle">Complete</text>
<text x="640" y="570" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">decreasing forwarding-rule count as the migration signal</text>

<!-- red shield -->
<path d="M120 615 L210 615 L210 655 Q210 685 165 700 Q120 685 120 655 Z" fill="#C0392B"/>
<text x="165" y="648" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Azure Policy</text>
<text x="165" y="666" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DENY</text>
<text x="240" y="655" font-family="Arial, sans-serif" font-size="13" fill="#C0392B">deny on untagged Private DNS Zones</text>
</svg>
