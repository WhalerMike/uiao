<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">The mover accumulates privilege — OrgPath-triggered</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">realignment restores least privilege</text>

<!-- Three event headers -->
<rect x="60" y="130" width="350" height="50" rx="8" fill="#0D1B2E"/>
<text x="235" y="155" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">JOINER</text>
<rect x="465" y="130" width="350" height="50" rx="8" fill="#0D1B2E"/>
<text x="640" y="155" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">MOVER</text>
<rect x="870" y="130" width="350" height="50" rx="8" fill="#0D1B2E"/>
<text x="1045" y="155" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">LEAVER</text>

<!-- JOINER clean box -->
<line x1="235" y1="180" x2="235" y2="210" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="60" y="212" width="350" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="235" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath stamped</text>
<text x="235" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">dynamic groups populate</text>
<text x="235" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">PIM eligibility established</text>

<!-- LEAVER clean box -->
<line x1="1045" y1="180" x2="1045" y2="210" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="870" y="212" width="350" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1045" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">account disabled</text>
<text x="1045" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath cleared · groups evaporate</text>
<text x="1045" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">eligibilities unreachable</text>

<!-- MOVER red problem zone -->
<line x1="640" y1="180" x2="640" y2="210" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar-red)"/>
<rect x="465" y="212" width="350" height="46" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="640" y="235" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath changes but access persists</text>
<rect x="465" y="266" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="640" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OLD ROLE access retained</text>
<rect x="465" y="318" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="640" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NEW ROLE access added  =  combined standing privilege</text>

<!-- Trigger band -->
<line x1="640" y1="362" x2="640" y2="400" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<rect x="60" y="402" width="1160" height="150" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="80" y="432" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="0.5" fill="#1E8C8C" text-anchor="start">OrgPath change triggers Lifecycle Workflow</text>
<!-- amber trigger tag -->
<rect x="900" y="412" width="300" height="34" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="1050" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">attribute-change trigger</text>

<!-- four sequential steps -->
<rect x="80" y="462" width="250" height="74" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="205" y="490" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">remove old-node</text>
<text x="205" y="510" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">PIM eligibility</text>
<line x1="330" y1="499" x2="358" y2="499" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="360" y="462" width="250" height="74" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="485" y="490" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">create new-node</text>
<text x="485" y="510" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">PIM eligibility</text>
<line x1="610" y1="499" x2="638" y2="499" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="640" y="462" width="250" height="74" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="765" y="490" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">notify old and</text>
<text x="765" y="510" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">new managers</text>
<line x1="890" y1="499" x2="918" y2="499" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="920" y="462" width="280" height="74" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="1060" y="490" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">open 7-day</text>
<text x="1060" y="510" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">access review</text>

<!-- end state -->
<line x1="640" y1="552" x2="640" y2="590" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-grey)"/>
<rect x="440" y="592" width="400" height="64" rx="8" fill="#0D1B2E"/>
<text x="640" y="624" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">least privilege restored</text>
</svg>
