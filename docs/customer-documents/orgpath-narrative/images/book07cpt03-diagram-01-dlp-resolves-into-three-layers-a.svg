<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">DLP resolves into three layers: baseline,</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">restrictive overlays, permissive carve-outs</text>

<!-- BASELINE BAND full width -->
<rect x="60" y="130" width="1160" height="68" rx="8" fill="#0D1B2E"/>
<text x="640" y="154" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">baseline  (tenant-wide, no scope)</text>
<text x="640" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">block credit card, SSN, passport to external recipients</text>

<!-- OrgPath tree (center spine) -->
<rect x="555" y="248" width="170" height="48" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="640" y="272" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NCR (region root)</text>

<!-- Restrictive overlay cards (navy) -->
<rect x="80" y="320" width="320" height="98" rx="8" fill="#0D1B2E"/>
<text x="240" y="346" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">restrictive overlay</text>
<text x="240" y="368" font-family="Consolas, monospace" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">NCR / Finance</text>
<text x="240" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">lower confidence thresholds;</text>
<text x="240" y="406" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">manager approval before external send</text>

<rect x="80" y="448" width="320" height="98" rx="8" fill="#0D1B2E"/>
<text x="240" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">restrictive overlay</text>
<text x="240" y="496" font-family="Consolas, monospace" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">NCR / Legal</text>
<text x="240" y="518" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">lower confidence thresholds;</text>
<text x="240" y="534" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">manager approval before external send</text>

<!-- Permissive carve-out cards (amber-tint emphasis) -->
<rect x="880" y="320" width="320" height="98" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1040" y="346" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">permissive carve-out</text>
<text x="1040" y="368" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">NCR / Engineering / Data</text>
<text x="1040" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">raise bulk-download alert threshold;</text>
<text x="1040" y="406" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">allow pricing figures externally</text>

<rect x="880" y="448" width="320" height="98" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1040" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">permissive carve-out</text>
<text x="1040" y="496" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">NCR / Sales</text>
<text x="1040" y="518" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">raise bulk-download alert threshold;</text>
<text x="1040" y="534" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">allow pricing figures externally</text>

<!-- Amber Adaptive Scope connectors from NCR (region root) spine to each card -->
<line x1="555" y1="282" x2="402" y2="350" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<line x1="560" y1="290" x2="402" y2="478" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<line x1="725" y1="282" x2="878" y2="350" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<line x1="720" y1="290" x2="878" y2="478" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>

<!-- Red blocked-action marker: baseline still applies beneath every overlay -->
<rect x="500" y="600" width="280" height="70" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="640" y="624" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">&#10007; external share BLOCKED</text>
<text x="640" y="650" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">baseline applies beneath every overlay</text>

<line x1="240" y1="546" x2="500" y2="620" stroke="#5A5A5A" stroke-width="1.4"/>
<line x1="1040" y1="546" x2="780" y2="620" stroke="#5A5A5A" stroke-width="1.4"/>
</svg>
