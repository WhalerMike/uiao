<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="29" font-weight="bold" fill="#0D1B2E">Phase Zero: read-only discovery at standard privilege</text>

<!-- principal -->
<rect x="60" y="110" width="220" height="56" rx="8" fill="#0D1B2E"/>
<text x="170" y="138" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Authenticated Users</text>
<text x="170" y="156" font-family="Arial, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">principal</text>
<line x1="170" y1="166" x2="170" y2="196" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<rect x="60" y="200" width="220" height="56" rx="8" fill="#0D1B2E"/>
<text x="170" y="222" font-family="Consolas, monospace" font-size="11" fill="#FFFFFF" text-anchor="middle">UIAOReadOnly</text>
<text x="170" y="240" font-family="Consolas, monospace" font-size="11" fill="#FFFFFF" text-anchor="middle">Assessment module</text>

<!-- teal arrow to baseline -->
<line x1="280" y1="228" x2="370" y2="228" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="325" y="215" font-family="Arial, sans-serif" font-size="9.5" fill="#1E8C8C" text-anchor="middle">standard</text>
<text x="325" y="246" font-family="Arial, sans-serif" font-size="9.5" fill="#1E8C8C" text-anchor="middle">read</text>

<!-- baseline panel teal -->
<rect x="375" y="110" width="420" height="350" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="585" y="138" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Read-only baseline · ~75% coverage</text>
<g font-family="Consolas, monospace" font-size="11.5" fill="#0D1B2E">
<text x="398" y="172">forest topology</text>
<text x="398" y="200">domain structure</text>
<text x="398" y="228">domain controllers</text>
<text x="398" y="256">sites and site-links</text>
<text x="398" y="284">OU hierarchy</text>
<text x="398" y="312">group membership</text>
<text x="398" y="340">user attributes</text>
<text x="398" y="368">DNS zone names</text>
<text x="398" y="396">GPO names and linkage</text>
<text x="398" y="424">certificate services shape</text>
</g>

<!-- arrow down to pipeline -->
<line x1="585" y1="460" x2="585" y2="500" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="585" y="485" font-family="Arial, sans-serif" font-size="10.5" fill="#1E8C8C" text-anchor="middle">structured JSON · same schema</text>
<rect x="395" y="505" width="380" height="56" rx="8" fill="#0D1B2E"/>
<text x="585" y="533" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">UIAO governance pipeline</text>

<!-- RIGHT: remaining 25%, amber -->
<rect x="850" y="110" width="370" height="350" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="1035" y="138" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Remaining 25% · requires elevated access</text>
<g font-family="Consolas, monospace" font-size="11.5" fill="#33414F">
<text x="872" y="180">GPO settings decomposition</text>
<text x="872" y="216">ACL enumeration</text>
<text x="872" y="252">AdminSDHolder analysis</text>
<text x="872" y="288">replication and USN metadata</text>
<text x="872" y="324">certificate template ESC detection</text>
</g>
<!-- red bracket marking gap -->
<rect x="850" y="110" width="370" height="350" rx="10" fill="none" stroke="#C0392B" stroke-width="2.4" stroke-dasharray="8 6"/>
<text x="1035" y="400" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle">the gap</text>

<!-- scoped delegation request back to authorizing official -->
<rect x="850" y="585" width="370" height="60" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="1035" y="615" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">authorizing official</text>
<line x1="1035" y1="460" x2="1035" y2="583" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-red)"/>
<text x="1090" y="525" font-family="Arial, sans-serif" font-size="10.5" fill="#C0392B" text-anchor="start">scoped</text>
<text x="1090" y="540" font-family="Arial, sans-serif" font-size="10.5" fill="#C0392B" text-anchor="start">delegation</text>
<text x="1090" y="555" font-family="Arial, sans-serif" font-size="10.5" fill="#C0392B" text-anchor="start">request</text>
</svg>
