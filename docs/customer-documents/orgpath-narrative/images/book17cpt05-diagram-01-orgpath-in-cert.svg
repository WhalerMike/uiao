<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">OrgPath carried in-band inside an</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">EAP-TLS device certificate</text>

<!-- device certificate container -->
<rect x="60" y="170" width="520" height="360" rx="8" fill="#0D1B2E"/>
<text x="320" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">device certificate</text>

<!-- preferred carrier (teal) -->
<rect x="84" y="230" width="472" height="130" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="104" y="256" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">subjectAltName  OtherName</text>
<text x="104" y="284" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="start">OID 1.3.6.1.4.1  UIAO-PEN 1.1</text>
<text x="104" y="310" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#33414F" text-anchor="start">UTF8String  OrgPath value</text>
<rect x="380" y="328" width="156" height="24" rx="4" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="458" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">PREFERRED</text>

<!-- legacy carrier (red) -->
<rect x="84" y="380" width="472" height="130" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="104" y="406" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="start">subject DN  OU equals</text>
<text x="104" y="434" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C0392B" text-anchor="start">legacy AD CS only</text>
<text x="104" y="460" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="start">DRIFT-IDENTITY</text>

<!-- arrow cert -> AAA server -->
<line x1="580" y1="295" x2="688" y2="295" stroke="#1E8C8C" stroke-width="2.6" marker-end="url(#ar-teal)"/>

<!-- AAA server -->
<rect x="690" y="250" width="240" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="810" y="295" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">AAA server</text>

<!-- arrow AAA -> Entra device object -->
<line x1="930" y1="295" x2="998" y2="295" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>

<!-- Entra device object -->
<rect x="1000" y="240" width="220" height="110" rx="8" fill="#0D1B2E"/>
<text x="1110" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Entra device object</text>
<text x="1110" y="304" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">deviceId</text>
<text x="1110" y="326" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">OrgPath</text>

<!-- amber callout under AAA server -->
<rect x="640" y="420" width="500" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="890" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath read in-band at Access-Accept</text>
<text x="890" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">no Graph round-trip</text>
<line x1="810" y1="340" x2="850" y2="418" stroke="#D4A017" stroke-width="1.6" stroke-dasharray="4 4"/>
</svg>
