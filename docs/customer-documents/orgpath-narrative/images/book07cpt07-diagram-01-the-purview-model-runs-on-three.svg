<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E">The Purview model runs on three cadences,</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E">all anchored to one OrgPath coverage report</text>

<!-- Three cadence bands on the left -->
<text x="60" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D">CADENCES</text>

<rect x="60" y="178" width="520" height="100" rx="8" fill="#0D1B2E"/>
<text x="84" y="208" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Daily</text>
<text x="84" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="start">drift detection plus native</text>
<text x="84" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="start">Adaptive Scope re-evaluation</text>

<rect x="60" y="294" width="520" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="84" y="324" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="start">Quarterly</text>
<text x="84" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="start">label taxonomy review</text>
<text x="84" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="start">against the OrgTree</text>

<rect x="60" y="410" width="520" height="100" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="84" y="440" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="start">Annual</text>
<text x="84" y="468" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="start">retention schedule attestation</text>
<text x="84" y="488" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="start">with Legal and Compliance</text>

<!-- Coverage report card on the right -->
<rect x="700" y="178" width="380" height="226" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
<rect x="700" y="178" width="380" height="44" rx="10" fill="#0D1B2E"/>
<rect x="700" y="200" width="380" height="22" fill="#0D1B2E"/>
<text x="890" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgPath coverage report</text>
<text x="724" y="258" font-family="Consolas, monospace" font-size="14" fill="#33414F" text-anchor="start">scope name</text>
<text x="724" y="294" font-family="Consolas, monospace" font-size="14" fill="#33414F" text-anchor="start">filter expression</text>
<text x="724" y="330" font-family="Consolas, monospace" font-size="14" fill="#33414F" text-anchor="start">covered-user count</text>
<text x="724" y="366" font-family="Consolas, monospace" font-size="14" fill="#33414F" text-anchor="start">timestamp</text>
<line x1="724" y1="240" x2="1056" y2="240" stroke="#E3E8EF" stroke-width="1.2"/>
<line x1="724" y1="276" x2="1056" y2="276" stroke="#E3E8EF" stroke-width="1.2"/>
<line x1="724" y1="312" x2="1056" y2="312" stroke="#E3E8EF" stroke-width="1.2"/>
<line x1="724" y1="348" x2="1056" y2="348" stroke="#E3E8EF" stroke-width="1.2"/>

<!-- amber connector from report card to four evidence chips -->
<line x1="890" y1="404" x2="890" y2="470" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>

<rect x="640" y="500" width="240" height="56" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="760" y="528" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">completeness</text>
<rect x="900" y="500" width="240" height="56" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="1020" y="528" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">accuracy</text>
<rect x="640" y="572" width="240" height="56" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="760" y="600" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">timeliness</text>
<rect x="900" y="572" width="240" height="56" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="1020" y="600" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">change history</text>

<text x="760" y="660" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D" text-anchor="middle">AUDIT EVIDENCE</text>
</svg>
