<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
 <radialGradient id="sealGlow19c6" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#D7F2EE" stop-opacity="0.7"/>
  <stop offset="1" stop-color="#D7F2EE" stop-opacity="0"/>
 </radialGradient>
</defs>
<!-- booklet shadow -->
<ellipse cx="640" cy="642" rx="430" ry="26" fill="#0D1B2E" opacity="0.08"/>
<!-- passport navy cover -->
<path d="M640,150 C500,118 330,124 200,150 L200,612 C330,586 500,580 640,612 C780,580 950,586 1080,612 L1080,150 C950,124 780,118 640,150 Z" fill="#0D1B2E"/>
<!-- ice pages -->
<path d="M640,168 C512,140 352,146 224,168 L224,594 C352,572 512,566 640,592 Z" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<path d="M640,168 C768,140 928,146 1056,168 L1056,594 C928,572 768,566 640,592 Z" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<!-- spine gutter -->
<line x1="640" y1="170" x2="640" y2="590" stroke="#A9B8CA" stroke-width="3" opacity="0.6"/>
<!-- stylized building pictogram on the left page -->
<g stroke="#0D1B2E" stroke-width="5" stroke-linejoin="round" fill="#EAF1FB">
 <path d="M380,302 L450,262 L520,302 Z"/>
 <rect x="388" y="302" width="124" height="150"/>
</g>
<g fill="#0D1B2E">
 <rect x="404" y="320" width="22" height="22"/>
 <rect x="439" y="320" width="22" height="22"/>
 <rect x="474" y="320" width="22" height="22"/>
 <rect x="404" y="356" width="22" height="22"/>
 <rect x="439" y="356" width="22" height="22"/>
 <rect x="474" y="356" width="22" height="22"/>
 <rect x="432" y="402" width="36" height="50"/>
</g>
<!-- teal seal: E911 -->
<circle cx="840" cy="255" r="92" fill="url(#sealGlow19c6)"/>
<g transform="rotate(-14 840 255)" opacity="0.92">
 <circle cx="840" cy="255" r="78" fill="none" stroke="#1E8C8C" stroke-width="5"/>
 <circle cx="840" cy="255" r="58" fill="none" stroke="#1E8C8C" stroke-width="2.5"/>
 <text x="840" y="255" font-size="32" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">E911</text>
</g>
<!-- navy seal: TIC 3.0 -->
<circle cx="945" cy="462" r="98" fill="url(#sealGlow19c6)"/>
<g transform="rotate(12 945 462)" opacity="0.92">
 <circle cx="945" cy="462" r="84" fill="none" stroke="#0D1B2E" stroke-width="5"/>
 <circle cx="945" cy="462" r="63" fill="none" stroke="#0D1B2E" stroke-width="2.5"/>
 <text x="945" y="462" font-size="28" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">TIC 3.0</text>
</g>
<!-- grey seal: BOUNDARIES -->
<circle cx="320" cy="478" r="98" fill="url(#sealGlow19c6)"/>
<g transform="rotate(-8 320 478)" opacity="0.92">
 <circle cx="320" cy="478" r="84" fill="none" stroke="#5A5A5A" stroke-width="5"/>
 <circle cx="320" cy="478" r="64" fill="none" stroke="#5A5A5A" stroke-width="2.5"/>
 <text x="320" y="478" font-size="19" font-weight="bold" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">BOUNDARIES</text>
</g>
<!-- embossed canonical path at the page bottom -->
<text x="841" y="557" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="26" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">/USA/MD/ANNAPOLIS-HQ</text>
<text x="842" y="558.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="26" letter-spacing="2" fill="#6B7A8D" text-anchor="middle">/USA/MD/ANNAPOLIS-HQ</text>
</svg>
