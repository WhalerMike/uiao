<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">The unified OrgPath security posture workbook</text>

<!-- Three source boxes top -->
<rect x="120" y="120" width="290" height="70" rx="8" fill="#0D1B2E"/>
<text x="265" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">MDE alerts</text>
<text x="265" y="170" font-family="Consolas, monospace" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">SecurityAlert</text>

<rect x="495" y="120" width="290" height="70" rx="8" fill="#0D1B2E"/>
<text x="640" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">MDI alerts</text>
<text x="640" y="170" font-family="Consolas, monospace" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">SecurityAlert</text>

<rect x="870" y="120" width="290" height="70" rx="8" fill="#0D1B2E"/>
<text x="1015" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">MDCA anomalies</text>
<text x="1015" y="170" font-family="Consolas, monospace" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">CloudAppEvents</text>

<line x1="265" y1="190" x2="350" y2="225" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="640" y1="190" x2="640" y2="225" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="1015" y1="190" x2="930" y2="225" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- Sentinel query layer -->
<rect x="200" y="228" width="880" height="68" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="640" y="252" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Sentinel cross-product query</text>
<text x="640" y="278" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">join on OrgPath (user and device lookups from AuditLogs)</text>

<line x1="640" y1="296" x2="640" y2="328" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- Workbook frame with 4 rows -->
<rect x="180" y="332" width="920" height="318" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="640" y="356" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.3" fill="#0D1B2E" text-anchor="middle">Unified OrgPath posture workbook</text>

<!-- Row 1 -->
<rect x="205" y="370" width="870" height="58" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.2"/>
<text x="230" y="392" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="start">Row 1 — Executive summary tiles</text>
<text x="230" y="412" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">MDE / MDI / MDCA totals, segments with High / Critical</text>

<!-- Row 2 -->
<rect x="205" y="436" width="870" height="58" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.4"/>
<text x="230" y="458" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="start">Row 2 — OrgPath hierarchy grid</text>
<text x="230" y="478" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">one row per segment, threshold coloring: red over 20 / amber over 5 / green</text>

<!-- Row 3 -->
<rect x="205" y="502" width="870" height="58" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.2"/>
<text x="230" y="524" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="start">Row 3 — Segment detail</text>
<text x="230" y="544" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">rendered on drill-down</text>

<!-- Row 4 -->
<rect x="205" y="568" width="870" height="58" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.2"/>
<text x="230" y="590" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="start">Row 4 — Unpositioned assets</text>
<text x="230" y="610" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="start">governance debt</text>

<!-- Red accent marker on grid -->
<text x="1050" y="467" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#C0392B" text-anchor="end">&#9632;</text>

<text x="60" y="685" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="start">Organizational hierarchy is the primary axis of the entire posture view.</text>
</svg>
