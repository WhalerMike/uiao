<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E" text-anchor="start">Infoblox is the permanent IPAM system of</text>
<text x="60" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E" text-anchor="start">record carrying OrgPath into the hybrid IP plan</text>

<!-- Left: OrgTree registry cylinder -->
<g>
 <ellipse cx="150" cy="290" rx="80" ry="20" fill="#0D1B2E"/>
 <rect x="70" y="290" width="160" height="130" fill="#0D1B2E"/>
 <ellipse cx="150" cy="420" rx="80" ry="20" fill="#0D1B2E"/>
 <ellipse cx="150" cy="290" rx="80" ry="20" fill="none" stroke="#1E3A66" stroke-width="1.4"/>
</g>
<text x="150" y="360" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ORGTREE</text>
<text x="150" y="384" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">-REGISTRY</text>
<line x1="230" y1="355" x2="358" y2="355" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="294" y="340" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="bold" fill="#1E8C8C" text-anchor="middle">RECONCILE</text>

<!-- Center: NIOS IPAM authority with nested hierarchy -->
<rect x="360" y="150" width="500" height="470" rx="10" fill="#0D1B2E"/>
<text x="610" y="178" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">INFOBLOX-NIOS-IPAM-AUTHORITY</text>
<!-- networkview outer -->
<rect x="386" y="198" width="448" height="404" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="408" y="220" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="start">networkview</text>
<text x="824" y="220" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#1E8C8C" text-anchor="end">OrgPath tags</text>
<!-- networkcontainer -->
<rect x="406" y="234" width="408" height="180" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="426" y="256" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="start">networkcontainer 10.20.0.0 /16</text>
<text x="610" y="282" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">OrgPath · OrgNodeId · OrgTier · MigrationPhase</text>
<!-- two child networks -->
<rect x="426" y="300" width="178" height="96" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="515" y="322" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">network</text>
<text x="515" y="340" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">10.20.1.0 /24</text>
<text x="515" y="366" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="8.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">OrgPath · OrgNodeId</text>
<text x="515" y="380" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="8.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">OrgTier · MigrationPhase</text>
<rect x="616" y="300" width="178" height="96" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="705" y="322" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">network</text>
<text x="705" y="340" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">10.20.2.0 /24</text>
<text x="705" y="366" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="8.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">OrgPath · OrgNodeId</text>
<text x="705" y="380" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="8.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">OrgTier · MigrationPhase</text>
<!-- EA inheritance arrow -->
<line x1="515" y1="414" x2="515" y2="398" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)" marker-start="url(#ar-amber)"/>
<line x1="705" y1="414" x2="705" y2="398" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)" marker-start="url(#ar-amber)"/>
<rect x="446" y="430" width="328" height="34" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
<text x="610" y="448" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">EA-INHERITANCE — children inherit OrgPath</text>

<!-- Right: Azure VNet address space (mirror) -->
<rect x="900" y="200" width="330" height="170" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="1065" y="226" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">AZURE-VNET-ADDRESS-SPACE</text>
<rect x="924" y="248" width="282" height="44" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.2"/>
<text x="1065" y="270" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">subnet 10.20.1.0 /24</text>
<rect x="924" y="300" width="282" height="44" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.2"/>
<text x="1065" y="322" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">subnet 10.20.2.0 /24</text>
<!-- mirror connectors -->
<line x1="604" y1="348" x2="922" y2="270" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="794" y1="348" x2="922" y2="322" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<rect x="1000" y="352" width="160" height="26" rx="5" fill="#FBEED2" stroke="#D4A017" stroke-width="1.3"/>
<text x="1080" y="365" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">MIRROR-NOT-SOURCE</text>

<!-- Lower right: Azure VNM IPAM pools (cloud-only, not authoritative) -->
<rect x="900" y="470" width="330" height="120" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="7 4"/>
<text x="1065" y="500" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="bold" fill="#C0392B" text-anchor="middle">AZURE-VNM-IPAM-POOLS</text>
<text x="1065" y="522" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="bold" fill="#C0392B" text-anchor="middle">-CLOUD-ONLY</text>
<!-- red crossed-out connector to authority -->
<line x1="860" y1="540" x2="898" y2="530" stroke="#C0392B" stroke-width="2" marker-end="url(#ar-red)"/>
<line x1="868" y1="525" x2="888" y2="545" stroke="#C0392B" stroke-width="2.6"/>
<line x1="888" y1="525" x2="868" y2="545" stroke="#C0392B" stroke-width="2.6"/>
<text x="710" y="560" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">NOT-AUTHORITATIVE-FOR-ON-PREM</text>
</svg>
