<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Book 18 Ch.2 — From one brittle string to fifteen named slots. ADR-093 blueprint register. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="c2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="74" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">From one brittle string to fifteen named slots</text>

  <!-- LEFT: Model A — composite string -->
  <rect x="60" y="112" width="404" height="540" rx="12" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="84" y="150" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#0D1B2E">Model A — one composite string</text>
  <text x="84" y="176" font-size="14" fill="#C0392B">structured in appearance only</text>

  <rect x="84" y="210" width="356" height="92" rx="9" fill="#0D1B2E"/>
  <text x="262" y="252" text-anchor="middle" font-family="Consolas, monospace" font-size="21" font-weight="bold" fill="#FFFFFF">ORG-FIN-AP</text>
  <text x="262" y="280" text-anchor="middle" font-family="Consolas, monospace" font-size="21" font-weight="bold" fill="#FFFFFF">-EAST</text>

  <!-- break marker -->
  <line x1="262" y1="316" x2="262" y2="356" stroke="#C0392B" stroke-width="3" marker-end="url(#c2-arrow)"/>
  <rect x="84" y="360" width="356" height="120" rx="9" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="262" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">one typo or reordered field</text>
  <text x="262" y="416" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">silently breaks every consumer</text>
  <text x="262" y="452" text-anchor="middle" font-size="13" fill="#5A5A5A">no signal — just a wrong answer</text>

  <text x="84" y="520" font-size="14" fill="#33414F">Every system must re-parse the same</text>
  <text x="84" y="542" font-size="14" fill="#33414F">string by position; the convention is</text>
  <text x="84" y="564" font-size="14" fill="#33414F">the only contract, and conventions rot.</text>
  <text x="84" y="612" font-size="14" font-style="italic" fill="#C0392B">A substrate in appearance only.</text>

  <!-- arrow between panels -->
  <line x1="470" y1="382" x2="520" y2="382" stroke="#1E8C8C" stroke-width="3" marker-end="url(#c2-arrow)"/>

  <!-- RIGHT: Model C — fifteen facets -->
  <rect x="528" y="112" width="692" height="540" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="552" y="150" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#0D1B2E">Model C — fifteen independent facets</text>
  <text x="552" y="176" font-size="14" fill="#1E8C8C">ten named in extensionAttribute1..10 · five reserved (11..15)</text>

  <!-- 15 slots: 5 cols x 3 rows. Col x: 552,684,816,948,1080  width 124  Row y:196,300,404 -->
  <!-- Row 1: named 1-5 -->
  <rect x="552" y="196" width="124" height="92" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="614" y="221" text-anchor="middle" font-size="11" fill="#6B7A8D">region</text>
  <text x="614" y="251" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E">EMEA</text>

  <rect x="684" y="196" width="124" height="92" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="746" y="221" text-anchor="middle" font-size="11" fill="#6B7A8D">department</text>
  <text x="746" y="251" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E">FIN</text>

  <rect x="816" y="196" width="124" height="92" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="878" y="221" text-anchor="middle" font-size="11" fill="#6B7A8D">division</text>
  <text x="878" y="251" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E">AP</text>

  <rect x="948" y="196" width="124" height="92" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1010" y="221" text-anchor="middle" font-size="11" fill="#6B7A8D">role</text>
  <text x="1010" y="251" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E">MGR</text>

  <rect x="1080" y="196" width="124" height="92" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1142" y="221" text-anchor="middle" font-size="11" fill="#6B7A8D">cost center</text>
  <text x="1142" y="251" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#0D1B2E">CC4471</text>

  <!-- Row 2: named 6-10 -->
  <rect x="552" y="300" width="124" height="92" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="614" y="325" text-anchor="middle" font-size="11" fill="#6B7A8D">classification</text>
  <text x="614" y="355" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E">CUI</text>

  <rect x="684" y="300" width="124" height="92" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="746" y="325" text-anchor="middle" font-size="11" fill="#6B7A8D">hire date</text>
  <text x="746" y="355" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#0D1B2E">2019-03-04</text>

  <rect x="816" y="300" width="124" height="92" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="878" y="325" text-anchor="middle" font-size="11" fill="#6B7A8D">term date</text>
  <text x="878" y="355" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#6B7A8D">(empty)</text>

  <rect x="948" y="300" width="124" height="92" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1010" y="325" text-anchor="middle" font-size="11" fill="#6B7A8D">clearance</text>
  <text x="1010" y="355" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E">S3</text>

  <rect x="1080" y="300" width="124" height="92" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1142" y="325" text-anchor="middle" font-size="11" fill="#6B7A8D">account type</text>
  <text x="1142" y="355" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E">STD</text>

  <!-- Row 3: reserved 11-15 -->
  <rect x="552" y="404" width="124" height="92" rx="7" fill="#F0F2F5" stroke="#E3E8EF" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="614" y="446" text-anchor="middle" font-size="12" fill="#6B7A8D">slot 11</text>
  <text x="614" y="466" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7A8D">reserved</text>

  <rect x="684" y="404" width="124" height="92" rx="7" fill="#F0F2F5" stroke="#E3E8EF" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="746" y="446" text-anchor="middle" font-size="12" fill="#6B7A8D">slot 12</text>
  <text x="746" y="466" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7A8D">reserved</text>

  <rect x="816" y="404" width="124" height="92" rx="7" fill="#F0F2F5" stroke="#E3E8EF" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="878" y="446" text-anchor="middle" font-size="12" fill="#6B7A8D">slot 13</text>
  <text x="878" y="466" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7A8D">reserved</text>

  <rect x="948" y="404" width="124" height="92" rx="7" fill="#F0F2F5" stroke="#E3E8EF" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1010" y="446" text-anchor="middle" font-size="12" fill="#6B7A8D">slot 14</text>
  <text x="1010" y="466" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7A8D">reserved</text>

  <rect x="1080" y="404" width="124" height="92" rx="7" fill="#F0F2F5" stroke="#E3E8EF" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1142" y="446" text-anchor="middle" font-size="12" fill="#6B7A8D">slot 15</text>
  <text x="1142" y="466" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7A8D">reserved</text>

  <!-- right caption -->
  <rect x="552" y="520" width="652" height="108" rx="9" fill="#D7F2EE"/>
  <text x="572" y="552" font-size="15" font-weight="bold" fill="#0D1B2E">The end of the string — not a richer one.</text>
  <text x="572" y="580" font-size="14" fill="#33414F">A renamed division never disturbs the region slot. Each facet is read</text>
  <text x="572" y="602" font-size="14" fill="#33414F">identically by every system, validated where it is stamped. The substrate bends</text>
  <text x="572" y="624" font-size="14" fill="#33414F">without breaking — because there is nothing to re-parse.</text>
</svg>
