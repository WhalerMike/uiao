<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#0D1B2E">OrgTree governance state machine</text>

<!-- 5 states -->
<rect x="40" y="240" width="210" height="150" rx="8" fill="#0D1B2E"/><text x="145" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. OrgTree</text><text x="145" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">registry commit</text><text x="145" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">git push</text><text x="145" y="344" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">orgtree.yaml</text>

<rect x="300" y="240" width="210" height="150" rx="8" fill="#0D1B2E"/><text x="405" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. CI schema</text><text x="405" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">validation</text><text x="405" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">YAML schema +</text><text x="405" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">structural check</text>

<rect x="560" y="240" width="210" height="150" rx="8" fill="#0D1B2E"/><text x="665" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. Path encoding</text><text x="665" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">pipeline</text><text x="665" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">nodes &#8594; OrgPath strings</text><text x="665" y="346" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#C7D4E6" text-anchor="middle">/OPS/INFRA/SVCTIER1</text>

<rect x="820" y="240" width="210" height="150" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/><text x="925" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">4. Entra extension</text><text x="925" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">attribute provisioning</text><text x="925" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">written to user, device,</text><text x="925" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">service principal objects</text>

<rect x="1040" y="240" width="200" height="150" rx="8" fill="#0D1B2E"/><text x="1140" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5. Drift detection</text><text x="1140" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">cycle</text><text x="1140" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">registry baseline vs</text><text x="1140" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#C7D4E6" text-anchor="middle">live environment</text>

<!-- forward arrows -->
<line x1="250" y1="315" x2="298" y2="315" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-grey)"/>
<line x1="510" y1="315" x2="558" y2="315" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-grey)"/>
<line x1="770" y1="315" x2="818" y2="315" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-grey)"/>
<line x1="1030" y1="315" x2="1038" y2="315" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-grey)"/>

<!-- rejects loop: state 2 back to state 1 -->
<path d="M 340,240 C 330,170 220,170 200,238" fill="none" stroke="#D4A017" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ar-amber)"/>
<text x="270" y="160" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#D4A017" text-anchor="middle">rejects</text>

<!-- drift feedback loop: state 5 back to state 1 -->
<path d="M 1140,390 C 1140,560 200,560 145,392" fill="none" stroke="#D4A017" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#ar-amber)"/>
<text x="640" y="545" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#D4A017" text-anchor="middle">surfaces findings to &#8594; OrgTree registry commit</text>
</svg>
