<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">An OrgPath-annotated dependency graph &#8594;</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">an impact report by organizational position</text>

<!-- provider asset center-left -->
<rect x="70" y="280" width="220" height="100" rx="8" fill="#0D1B2E"/>
<text x="180" y="310" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Provider (server)</text>
<text x="180" y="338" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ops/field-svc</text>
<text x="180" y="362" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">decommission planned</text>

<!-- consumers -->
<rect x="380" y="150" width="240" height="58" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="500" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Users  (identity)</text>
<text x="500" y="192" font-family="Consolas, monospace" font-size="11.5" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">ops/field-svc/region-west</text>
<rect x="380" y="234" width="240" height="58" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="500" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Devices  (infrastructure)</text>
<text x="500" y="276" font-family="Consolas, monospace" font-size="11.5" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">ops/field-svc/region-east</text>
<rect x="380" y="318" width="240" height="58" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="500" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Applications  (protocol)</text>
<text x="500" y="360" font-family="Consolas, monospace" font-size="11.5" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">fin/billing</text>
<rect x="380" y="402" width="240" height="58" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="500" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Service accounts  (application)</text>
<text x="500" y="444" font-family="Consolas, monospace" font-size="11.5" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">ops/automation</text>

<!-- edges provider->consumers -->
<line x1="290" y1="320" x2="378" y2="180" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="290" y1="325" x2="378" y2="263" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="290" y1="335" x2="378" y2="347" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="290" y1="345" x2="378" y2="431" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>

<!-- impact report -->
<rect x="680" y="130" width="540" height="340" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="700" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="start">Impact report &#8212; grouped by position</text>
<text x="700" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="start">concentration: 3 divisions, 14 departments affected vs 1 unit</text>
<!-- record card -->
<rect x="700" y="204" width="500" height="232" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/>
<text x="716" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="start">Dependency record card</text>
<text x="716" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start">provider OrgPath:</text>
<text x="940" y="254" font-family="Consolas, monospace" font-size="12.5" fill="#1E8C8C" text-anchor="start">ops/field-svc</text>
<text x="716" y="278" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start">consumer OrgPath:</text>
<text x="940" y="278" font-family="Consolas, monospace" font-size="12.5" fill="#1E8C8C" text-anchor="start">ops/field-svc/region-west</text>
<text x="716" y="302" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start">type:</text>
<text x="940" y="302" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0D1B2E" text-anchor="start">protocol / application / infra / identity</text>
<text x="716" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start">mechanism:</text>
<text x="940" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0D1B2E" text-anchor="start">LDAP bind</text>
<text x="716" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start">discovery source:</text>
<text x="940" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0D1B2E" text-anchor="start">flow logs</text>
<text x="716" y="374" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start">first-seen date:</text>
<text x="940" y="374" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#0D1B2E" text-anchor="start">2025-12-03</text>
<text x="716" y="398" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start">migration status:</text>
<text x="940" y="398" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#C0392B" text-anchor="start">open</text>
<text x="1040" y="398" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#6B7A8D" text-anchor="start">/ in-progress / resolved</text>
<text x="716" y="422" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#6B7A8D" text-anchor="start">&#128190; committed snapshot &#8212; versioned in the governance repo</text>

<!-- arrow consumers -> report -->
<line x1="620" y1="300" x2="678" y2="300" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<text x="650" y="288" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#D4A017" text-anchor="middle">fan-out</text>

<!-- legend -->
<rect x="70" y="560" width="1150" height="80" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/>
<text x="90" y="586" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="start">Legend</text>
<rect x="90" y="602" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="116" y="611" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start">open dependency (blocks retirement)</text>
<rect x="400" y="602" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="426" y="611" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start">consumer (resolved / tracked)</text>
<rect x="700" y="602" width="18" height="18" rx="3" fill="#0D1B2E"/>
<text x="726" y="611" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start">provider asset</text>
<rect x="920" y="602" width="18" height="18" rx="3" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="946" y="611" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start">impact report / committed snapshot</text>
</svg>
