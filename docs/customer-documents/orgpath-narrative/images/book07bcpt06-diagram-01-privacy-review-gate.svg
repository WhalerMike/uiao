<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">A privacy review gate blocks un-reviewed scope</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">expansion before it reaches a Purview surface</text>

<!-- LEFT: reconciliation cadence -->
<rect x="60" y="220" width="230" height="150" rx="8" fill="#0D1B2E"/>
<text x="175" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Reconciliation cadence</text>
<text x="175" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">event-driven first,</text>
<text x="175" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">then scheduled sweep</text>
<rect x="82" y="322" width="186" height="32" rx="5" fill="#1E3A66"/>
<text x="175" y="338" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">lifecycle events from registry</text>

<!-- amber cadence -> gate -->
<line x1="290" y1="295" x2="468" y2="295" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>

<!-- CENTER: privacy review gate -->
<rect x="470" y="180" width="170" height="320" rx="8" fill="#0D1B2E"/>
<text x="555" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Privacy</text>
<text x="555" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">review gate</text>
<rect x="492" y="262" width="126" height="44" rx="5" fill="#1E3A66"/>
<text x="555" y="284" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">least scope</text>
<rect x="492" y="316" width="126" height="44" rx="5" fill="#1E3A66"/>
<text x="555" y="338" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">justification</text>
<rect x="492" y="370" width="126" height="44" rx="5" fill="#1E3A66"/>
<text x="555" y="392" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">expiry</text>

<!-- red stop blocking un-reviewed expansion -->
<line x1="370" y1="450" x2="466" y2="450" stroke="#C0392B" stroke-width="2.4" marker-end="url(#ar-red)"/>
<rect x="466" y="430" width="14" height="40" fill="#C0392B"/>
<text x="345" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">un-reviewed</text>
<text x="345" y="460" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">expansion blocked</text>

<!-- teal pass-through -> apply -->
<line x1="640" y1="270" x2="828" y2="270" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<text x="734" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">review recorded in registry</text>

<!-- apply to Purview surface -->
<rect x="830" y="200" width="220" height="160" rx="8" fill="#0D1B2E"/>
<text x="940" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Apply to Purview surface</text>
<rect x="852" y="248" width="176" height="28" rx="5" fill="#1E3A66"/>
<text x="940" y="262" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Insider Risk</text>
<rect x="852" y="282" width="176" height="28" rx="5" fill="#1E3A66"/>
<text x="940" y="296" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Communication Compliance</text>
<rect x="852" y="316" width="176" height="28" rx="5" fill="#1E3A66"/>
<text x="940" y="330" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">DSPM for AI</text>

<!-- amber apply -> report -->
<line x1="1050" y1="280" x2="1110" y2="280" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<rect x="1078" y="370" width="142" height="92" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="1149" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Evidence Bundle</text>
<text x="1149" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">+ compliance</text>
<text x="1149" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">report</text>
<!-- route amber from apply down to report -->
<line x1="1110" y1="290" x2="1140" y2="368" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>

<!-- dashed navy return loop report -> cadence -->
<path d="M 1078 440 L 175 520 L 175 372" fill="none" stroke="#0D1B2E" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar-navy)"/>
<text x="600" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">governance loop closes</text>

<!-- bottom teal audit panel -->
<rect x="370" y="560" width="850" height="120" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="390" y="588" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.4" fill="#1E8C8C" text-anchor="start">AUDIT QUESTIONS</text>
<text x="400" y="620" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="start">who is supervised</text>
<text x="700" y="620" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="start">by whom</text>
<text x="400" y="652" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="start">since when</text>
<text x="700" y="652" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="start">under which OrgPath</text>
</svg>
