<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Enriching MDI alerts with OrgPath</text>

<!-- MDI alert box -->
<rect x="40" y="280" width="250" height="150" rx="8" fill="#0D1B2E"/>
<text x="165" y="312" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Defender for Identity</text>
<text x="165" y="332" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">alert</text>
<text x="165" y="362" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Kerberoasting, DCSync,</text>
<text x="165" y="380" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">lateral movement</text>
<text x="165" y="404" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">source identity, technique,</text>
<text x="165" y="420" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">MITRE mapping</text>

<!-- Sentinel join box -->
<rect x="340" y="290" width="280" height="130" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="480" y="328" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Sentinel join</text>
<text x="480" y="356" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">source UPN maps to</text>
<text x="480" y="374" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">most-recent OrgPath</text>
<text x="480" y="392" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">from the Entra audit log</text>

<line x1="290" y1="355" x2="338" y2="355" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Rule 1 -->
<rect x="680" y="160" width="320" height="105" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="840" y="188" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Rule 1 — sensitive-segment match</text>
<text x="840" y="216" font-family="Consolas, monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">NCR / Executive, NCR / IT / InfraOps,</text>
<text x="840" y="234" font-family="Consolas, monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">NCR / Finance / Governance</text>

<!-- Rule 2 -->
<rect x="680" y="330" width="320" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="840" y="358" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Rule 2 — surge</text>
<text x="840" y="386" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">more than threshold alerts</text>
<text x="840" y="404" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">in one segment per hour</text>

<line x1="620" y1="345" x2="678" y2="225" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="620" y1="365" x2="678" y2="370" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>

<!-- Rule 1 output -->
<rect x="1040" y="160" width="200" height="105" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1140" y="196" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">High-severity</text>
<text x="1140" y="216" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">P1 incident</text>
<text x="1140" y="240" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">immediate escalation</text>

<line x1="1000" y1="212" x2="1038" y2="212" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>

<!-- Rule 2 output -->
<rect x="1040" y="330" width="200" height="90" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="1140" y="362" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Medium incident</text>
<text x="1140" y="388" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">elevated if the trend</text>
<text x="1140" y="404" font-family="Arial, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">continues</text>

<line x1="1000" y1="375" x2="1038" y2="375" stroke="#D4A017" stroke-width="2.2" marker-end="url(#ar-amber)"/>

<!-- UNKNOWN bin (dashed branch down) -->
<rect x="340" y="500" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="500" y="532" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">No OrgPath — binned UNKNOWN</text>
<text x="500" y="562" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">investigate as</text>
<text x="500" y="580" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">unmanaged account</text>

<line x1="480" y1="420" x2="490" y2="498" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-red)"/>

<text x="60" y="660" font-family="Arial, sans-serif" font-size="14.5" font-style="italic" fill="#6B7A8D" text-anchor="start">Organizational position turns one undifferentiated alert stream into severity-graded, segment-aware incidents.</text>
</svg>
