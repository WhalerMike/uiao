<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Top-down flow: OrgPath drives Purview's</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">three-layer policy architecture</text>

<!-- TOP ROW: source chain -->
<rect x="60" y="130" width="300" height="74" rx="8" fill="#0D1B2E"/>
<text x="210" y="158" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree Registry</text>
<text x="210" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">label boundary, segment labels, retention</text>

<rect x="490" y="130" width="280" height="74" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="630" y="158" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath on every user</text>
<text x="630" y="180" font-family="Consolas, monospace" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">extension_{AppId}_OrgPath</text>

<rect x="900" y="130" width="320" height="74" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="1060" y="156" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Purview Adaptive Policy Scopes</text>
<text x="1060" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">OPATH filter on OrgPath attribute</text>

<line x1="360" y1="167" x2="488" y2="167" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="770" y1="167" x2="898" y2="167" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- MIDDLE BAND: three-layer policy architecture -->
<text x="60" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D">THREE-LAYER POLICY ARCHITECTURE</text>

<rect x="60" y="252" width="350" height="98" rx="8" fill="#0D1B2E"/>
<text x="235" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Baseline layer</text>
<text x="235" y="304" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">tenant-wide, conservative thresholds</text>
<text x="235" y="324" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">CC, SSN, passport blocking</text>

<rect x="465" y="252" width="350" height="98" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="640" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Restrictive overlay layer</text>
<text x="640" y="304" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgPath-scoped tighter rules</text>
<text x="640" y="324" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">Finance, Legal, Executive, Security</text>

<rect x="870" y="252" width="350" height="98" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="1045" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Permissive carve-out layer</text>
<text x="1045" y="304" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgPath-scoped exceptions</text>
<text x="1045" y="324" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">Data analytics, Sales, Procurement</text>

<!-- Adaptive Scope feeds restrictive + permissive -->
<line x1="1060" y1="204" x2="660" y2="250" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="1060" y1="204" x2="1045" y2="250" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<text x="850" y="222" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">scope filter applies</text>

<!-- BOTTOM BAND: policy surfaces -->
<text x="60" y="392" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D">PURVIEW POLICY SURFACES</text>

<rect x="60" y="560" width="260" height="64" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="190" y="592" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Sensitivity Labels</text>
<rect x="345" y="560" width="260" height="64" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="475" y="592" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Data Loss Prevention</text>
<rect x="630" y="560" width="260" height="64" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="760" y="592" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Retention</text>
<rect x="915" y="560" width="260" height="64" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="1045" y="592" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">eDiscovery</text>

<!-- Baseline -> Labels + DLP -->
<line x1="200" y1="350" x2="190" y2="558" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<line x1="260" y1="350" x2="450" y2="558" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<!-- Restrictive -> Labels + DLP + Retention -->
<line x1="600" y1="350" x2="225" y2="558" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="640" y1="350" x2="490" y2="558" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="680" y1="350" x2="755" y2="558" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<!-- Permissive -> DLP -->
<line x1="1010" y1="350" x2="515" y2="558" stroke="#0D1B2E" stroke-width="1.6" marker-end="url(#ar-navy)"/>
<!-- Adaptive Scope direct -> eDiscovery (per-segment custodian scoping) -->
<line x1="1180" y1="204" x2="1100" y2="558" stroke="#0D1B2E" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar-navy)"/>
<text x="1175" y="430" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="end">per-segment</text>
<text x="1175" y="446" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="end">custodian scoping</text>

<text x="640" y="680" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">Membership in an OrgPath node implies coverage by the policies scoped to that node.</text>
</svg>
