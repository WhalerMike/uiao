<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">The four event classes of the governance</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">pipeline, each committing to the repository</text>

<!-- four input lanes -->
<!-- Registry events -->
<rect x="60" y="130" width="270" height="150" rx="8" fill="#0D1B2E"/>
<text x="195" y="156" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Registry events</text>
<text x="78" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="start">node add/remove/rename/move/archive</text>
<text x="78" y="206" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="start">&#8594; re-derive affected OrgPaths</text>
<text x="78" y="228" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="start">&#8594; rebuild node/branch group rules</text>
<text x="78" y="250" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="start">&#8594; targeted drift run</text>

<!-- Identity events -->
<rect x="350" y="130" width="270" height="150" rx="8" fill="#0D1B2E"/>
<text x="485" y="156" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Identity events</text>
<text x="368" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="start">provision / reassignment</text>
<text x="368" y="206" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="start">&#8594; derive + stamp OrgPath</text>
<text x="368" y="228" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="start">&#8594; re-evaluate group membership</text>
<text x="368" y="250" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="start">&#8594; single-identity drift check</text>

<!-- Decommissioning events -->
<rect x="640" y="130" width="270" height="150" rx="8" fill="#0D1B2E"/>
<text x="775" y="156" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Decommissioning events</text>
<text x="658" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="start">asset retirement</text>
<text x="658" y="206" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="start">&#8594; dependency-graph query</text>
<text x="658" y="228" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="start">&#8594; impact report</text>
<text x="658" y="250" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#F7E2DE" text-anchor="start">&#8594; compliance gate (see below)</text>

<!-- Scheduled events -->
<rect x="930" y="130" width="290" height="150" rx="8" fill="#0D1B2E"/>
<text x="1075" y="156" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Scheduled events</text>
<text x="948" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="start">fixed cadence</text>
<text x="948" y="206" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="start">&#8594; full-population drift detection</text>
<text x="948" y="228" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="start">&#8594; dependency-graph validation</text>
<text x="948" y="250" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="start">&#8594; governance report generation</text>

<!-- central pipeline -->
<rect x="240" y="350" width="800" height="70" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="640" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Governance pipeline (bounded operations)</text>
<text x="640" y="404" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">each event class runs only its defined steps</text>

<!-- arrows lanes -> pipeline -->
<line x1="195" y1="280" x2="380" y2="348" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<line x1="485" y1="280" x2="540" y2="348" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<line x1="775" y1="280" x2="740" y2="348" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<line x1="1075" y1="280" x2="900" y2="348" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>

<!-- compliance gate (red) -->
<rect x="640" y="450" width="270" height="100" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="775" y="478" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">Compliance gate</text>
<text x="775" y="504" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">BLOCKS retirement while</text>
<text x="775" y="524" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">open dependencies remain</text>
<line x1="775" y1="420" x2="775" y2="448" stroke="#C0392B" stroke-width="2" marker-end="url(#ar-red)"/>
<defs><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>

<!-- governance repository -->
<rect x="240" y="600" width="800" height="80" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="640" y="630" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Version-controlled governance repository</text>
<text x="640" y="658" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">every lane's outputs flow in as linked commits</text>
<line x1="500" y1="420" x2="500" y2="598" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
<line x1="775" y1="550" x2="775" y2="598" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>
</svg>
