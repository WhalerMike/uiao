<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Intune's group-based targeting — no policy</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">inheritance to a new org unit</text><text x="60" y="175" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" fill="#0D1B2E" text-anchor="start">POLICIES</text><rect x="60" y="200" width="300" height="62" rx="8" fill="#0D1B2E"/><text x="210" y="231" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Compliance policy</text><rect x="60" y="282" width="300" height="62" rx="8" fill="#0D1B2E"/><text x="210" y="313" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Configuration profile</text><rect x="60" y="364" width="300" height="62" rx="8" fill="#0D1B2E"/><text x="210" y="395" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Endpoint security</text><rect x="60" y="446" width="300" height="62" rx="8" fill="#0D1B2E"/><text x="210" y="477" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">App assignment</text><text x="430" y="175" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" fill="#1E8C8C" text-anchor="start">EXISTING GROUPS</text><rect x="430" y="210" width="330" height="68" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="595" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">West-Staff</text><rect x="430" y="302" width="330" height="68" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="595" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">West-Finance</text><rect x="430" y="394" width="330" height="68" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="595" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">East-Staff</text><line x1="362" y1="244" x2="428" y2="244" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><line x1="362" y1="336" x2="428" y2="336" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><line x1="362" y1="428" x2="428" y2="428" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><text x="430" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="start">every assignment created explicitly</text><text x="830" y="175" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" fill="#C0392B" text-anchor="start">NEW ORG UNIT</text><rect x="830" y="205" width="370" height="96" rx="8" fill="#FBFAF7" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="8 6"/><text x="1015" y="244.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">New group</text><text x="1015" y="261.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">(new division)</text><rect x="830" y="330" width="370" height="230" rx="0" fill="#F7E2DE"/><rect x="830" y="330" width="10" height="230" rx="0" fill="#C0392B"/><text x="860" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#C0392B" text-anchor="start">Receives nothing.</text><text x="860" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">No policy applies until an admin</text><text x="860" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">assigns each one by hand. Scope</text><text x="860" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">tags gate visibility — they don't</text><text x="860" y="508" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">create inheritance.</text>
</svg>
