<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">The hybrid migration window — two NAC</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">transports paired, then retired</text>

<!-- left twin box -->
<rect x="80" y="220" width="320" height="100" rx="8" fill="#0D1B2E"/>
<text x="240" y="256" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">nac_assignment</text>
<text x="240" y="284" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">aaa_server: nps</text>

<!-- right twin box -->
<rect x="480" y="220" width="380" height="100" rx="8" fill="#0D1B2E"/>
<text x="670" y="252" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">nac_assignment</text>
<text x="670" y="280" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">aaa_server: cisco-ise</text>
<text x="670" y="300" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">or entra-radius</text>

<!-- teal bracket joining the two -->
<path d="M 240 200 L 240 180 L 670 180 L 670 200" fill="none" stroke="#1E8C8C" stroke-width="2.2"/>
<text x="455" y="162" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">paired twin — same target_group plus same enforcement</text>

<!-- amber callout below left box -->
<rect x="80" y="360" width="320" height="56" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="240" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">loader rejects unpaired nps at PR CI</text>

<!-- DM_050 gate (right side) -->
<path d="M 920 220 L 1140 220 L 1180 270 L 1140 320 L 920 320 Z" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="1030" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">DM_050</text>
<text x="1030" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">Retirement Readiness</text>
<text x="1030" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">Checklist</text>

<!-- arrow twins -> gate -->
<line x1="860" y1="270" x2="918" y2="270" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- gate -> final box -->
<line x1="1030" y1="320" x2="1030" y2="420" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>
<rect x="850" y="424" width="360" height="80" rx="8" fill="#0D1B2E"/>
<text x="1030" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">single PR drops all nps entries</text>

<!-- red note at bottom -->
<rect x="80" y="560" width="1120" height="56" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="640" y="588" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">only place in OrgPath canon two transports coexist for one fact</text>
</svg>
