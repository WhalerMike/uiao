<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Migrating DNS and PKI under a single</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">governance overlay</text>

<!-- On-prem band -->
<rect x="40" y="130" width="800" height="190" rx="10" fill="#EDEFF2" stroke="#9AA7B5" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="60" y="154" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6B7A8D">On-prem (must be decommissioned cleanly)</text>
<rect x="60" y="170" width="240" height="130" rx="8" fill="#0D1B2E" opacity="0.55"/>
<text x="180" y="200" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AD-integrated DNS</text>
<text x="180" y="230" font-family="Consolas, monospace" font-size="12" fill="#C7D4E6" text-anchor="middle">SRV records in</text>
<text x="180" y="248" font-family="Consolas, monospace" font-size="12" fill="#C7D4E6" text-anchor="middle">directory partition</text>
<rect x="320" y="170" width="240" height="130" rx="8" fill="#0D1B2E" opacity="0.55"/>
<text x="440" y="200" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AD Certificate Services</text>
<text x="440" y="230" font-family="Consolas, monospace" font-size="12" fill="#C7D4E6" text-anchor="middle">templates in</text>
<text x="440" y="248" font-family="Consolas, monospace" font-size="12" fill="#C7D4E6" text-anchor="middle">Configuration NC</text>
<rect x="580" y="170" width="240" height="130" rx="8" fill="#0D1B2E" opacity="0.55"/>
<text x="700" y="200" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Windows Server IPAM</text>
<text x="700" y="230" font-family="Consolas, monospace" font-size="12" fill="#C7D4E6" text-anchor="middle">transition inventory</text>
<text x="700" y="248" font-family="Consolas, monospace" font-size="12" fill="#C7D4E6" text-anchor="middle">baseline</text>

<!-- Governance box top-right -->
<rect x="870" y="130" width="370" height="120" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="1055" y="160" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OrgTree Registry</text>
<text x="1055" y="188" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle">DnsBoundary,</text>
<text x="1055" y="206" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle">CertificateProfiles,</text>
<text x="1055" y="224" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle">MigrationPhase</text>

<!-- Azure-native band -->
<rect x="40" y="400" width="1200" height="190" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="60" y="424" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E3A66">Azure-native (target state)</text>
<rect x="60" y="440" width="270" height="130" rx="8" fill="#1F3A5F"/>
<text x="195" y="468" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Azure DNS Private Zones</text>
<text x="195" y="496" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">tagged OrgPath /</text>
<text x="195" y="513" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">OrgNodeId / OrgTier /</text>
<text x="195" y="530" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">MigrationPhase</text>
<rect x="345" y="440" width="270" height="130" rx="8" fill="#1F3A5F"/>
<text x="480" y="475" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Azure DNS</text>
<text x="480" y="496" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Private Resolver</text>
<text x="480" y="522" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">hybrid forwarding ruleset</text>
<rect x="630" y="440" width="270" height="130" rx="8" fill="#1F3A5F"/>
<text x="765" y="475" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Microsoft Cloud PKI</text>
<text x="765" y="503" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">SCEP, PKCS,</text>
<text x="765" y="520" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">Trusted Root profiles</text>
<rect x="915" y="440" width="305" height="130" rx="8" fill="#1F3A5F"/>
<text x="1067" y="468" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Intune certificate</text>
<text x="1067" y="488" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">deployment</text>
<text x="1067" y="514" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">strong-mapping</text>
<text x="1067" y="531" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">per KB5014754</text>

<!-- Migration arrows -->
<line x1="180" y1="300" x2="195" y2="438" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<text x="120" y="372" font-family="Arial, sans-serif" font-size="11" fill="#1E8C8C">zone-by-zone migration</text>
<line x1="700" y1="300" x2="230" y2="438" stroke="#5A5A5A" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar-grey)"/>
<text x="540" y="350" font-family="Arial, sans-serif" font-size="11" fill="#5A5A5A">baseline inventory</text>
<line x1="440" y1="300" x2="765" y2="438" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<text x="600" y="372" font-family="Arial, sans-serif" font-size="11" fill="#1E8C8C">template to profile mapping</text>
<line x1="900" y1="505" x2="913" y2="505" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<line x1="330" y1="505" x2="343" y2="505" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- Governance feeds -->
<line x1="1000" y1="250" x2="220" y2="438" stroke="#D4A017" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#ar-amber)"/>
<line x1="1055" y1="250" x2="790" y2="438" stroke="#D4A017" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#ar-amber)"/>

<!-- Policy box + gate -->
<rect x="430" y="618" width="380" height="74" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="620" y="645" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Azure Policy + drift detection</text>
<text x="620" y="670" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">tag compliance + cert-OrgPath alignment</text>
<line x1="480" y1="570" x2="540" y2="616" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<line x1="765" y1="570" x2="700" y2="616" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<rect x="850" y="618" width="390" height="74" rx="8" fill="#D4A017"/>
<text x="1045" y="645" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Decommissioning Readiness Score</text>
<text x="1045" y="670" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">five-dimension quantified gate</text>
<line x1="810" y1="655" x2="848" y2="655" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
</svg>
