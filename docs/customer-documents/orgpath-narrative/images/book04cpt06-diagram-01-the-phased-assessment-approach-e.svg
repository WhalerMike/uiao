<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E">The phased assessment approach, escalating</text><text x="60" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E">privilege only as output justifies it</text>

<!-- Phase Zero panel -->
<rect x="60" y="130" width="500" height="540" rx="10" fill="none" stroke="#0D1B2E" stroke-width="2"/>
<rect x="60" y="130" width="500" height="62" rx="10" fill="#0D1B2E"/><text x="310" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Phase Zero — read-only</text><text x="310" y="180" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle">standard Authenticated Users credential</text>
<rect x="84" y="212" width="452" height="50" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="310" y="237" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">PingCastle</text>
<rect x="84" y="276" width="452" height="80" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="310" y="300" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">read-only Get-AD* cmdlets</text><text x="310" y="324" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">Forest, Domain, OU, DC, Trust,</text><text x="310" y="340" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">ReplicationSite</text>
<rect x="84" y="370" width="452" height="50" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.4"/><text x="310" y="395" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">LDAPDomainDump</text>
<rect x="84" y="560" width="452" height="80" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><text x="310" y="586" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">output committed to</text><text x="310" y="608" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">assessment/phase-zero/</text><text x="310" y="628" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">timestamped baseline</text>

<!-- escalation arrow -->
<line x1="560" y1="360" x2="718" y2="360" stroke="#D4A017" stroke-width="3" marker-end="url(#ar-amber)"/><text x="639" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#D4A017" text-anchor="middle">output justifies</text><text x="639" y="353" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#D4A017" text-anchor="middle">elevated access</text>

<!-- Phase One panel -->
<rect x="720" y="130" width="500" height="540" rx="10" fill="none" stroke="#1E8C8C" stroke-width="2"/>
<rect x="720" y="130" width="500" height="62" rx="10" fill="#1E8C8C"/><text x="970" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Phase One — full elevated</text><text x="970" y="180" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#E6F5F2" text-anchor="middle">purpose-built assessment service account</text>
<!-- privilege boundary -->
<rect x="744" y="204" width="452" height="56" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/><text x="970" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">delegated Read-All-Properties at domain root</text><text x="970" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">explicitly NOT Domain Admin</text>

<rect x="744" y="274" width="452" height="78" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="970" y="298" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">full Get-ADUser/Computer/Group/Object</text><text x="970" y="318" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">-Properties * sweeps</text><text x="970" y="338" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">Get-GPOReport for every GPO</text>
<rect x="744" y="366" width="452" height="70" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="970" y="392" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">dcdiag /test:all &#183; repadmin</text><text x="970" y="414" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">ADRecon &#183; SharpHound</text>

<rect x="744" y="500" width="452" height="140" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><text x="970" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">output committed to</text><text x="970" y="550" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">assessment/phase-one/</text><text x="970" y="578" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">with provenance:</text><text x="970" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">account, DCs queried,</text><text x="970" y="618" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">timestamps, tool versions</text>
</svg>
