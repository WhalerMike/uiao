<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
 <linearGradient id="sky19c4" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#EAF1FB"/>
  <stop offset="1" stop-color="#CFE0F2"/>
 </linearGradient>
 <radialGradient id="pinGlow19c4" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#D7F2EE" stop-opacity="0.9"/>
  <stop offset="1" stop-color="#D7F2EE" stop-opacity="0"/>
 </radialGradient>
</defs>
<!-- sky gradient backdrop -->
<rect x="0" y="0" width="1280" height="720" fill="url(#sky19c4)"/>
<!-- queue of muted silhouettes near the ledger -->
<g fill="#A9B8CA">
 <circle cx="78" cy="498" r="16"/>
 <path d="M54,620 L54,548 A24,28 0 0 1 102,548 L102,620 Z"/>
 <circle cx="150" cy="490" r="17"/>
 <path d="M124,620 L124,542 A26,30 0 0 1 176,542 L176,620 Z"/>
 <circle cx="226" cy="482" r="18"/>
 <path d="M198,620 L198,536 A28,32 0 0 1 254,536 L254,620 Z"/>
</g>
<!-- ledger shadow -->
<ellipse cx="400" cy="516" rx="200" ry="18" fill="#0D1B2E" opacity="0.08"/>
<!-- ledger: navy cover -->
<path d="M400,318 C320,294 240,300 175,322 L175,492 C240,470 320,464 400,488 C480,464 560,470 625,492 L625,322 C560,300 480,294 400,318 Z" fill="#0D1B2E"/>
<!-- ledger: ice pages -->
<path d="M400,330 C328,308 254,313 192,333 L192,478 C254,458 328,453 400,475 Z" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<path d="M400,330 C472,308 546,313 608,333 L608,478 C546,458 472,453 400,475 Z" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<!-- faint ruled lines on the pages -->
<g stroke="#6B7A8D" stroke-width="1" fill="none" opacity="0.4">
 <path d="M212,362 C268,346 330,342 386,358"/>
 <path d="M212,388 C268,372 330,368 386,384"/>
 <path d="M212,414 C268,398 330,394 386,410"/>
 <path d="M212,440 C268,424 330,420 386,436"/>
 <path d="M414,358 C470,342 532,346 588,362"/>
 <path d="M414,384 C470,368 532,372 588,388"/>
 <path d="M414,410 C470,394 532,398 588,414"/>
 <path d="M414,436 C470,420 532,424 588,440"/>
</g>
<!-- spine label -->
<rect x="322" y="478" width="156" height="28" rx="8" fill="#0D1B2E"/>
<text x="400" y="492" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">system of record</text>
<!-- glowing teal thread from ledger to pin -->
<path d="M414,468 C580,330 820,262 1002,380" fill="none" stroke="#D7F2EE" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
<path d="M414,468 C580,330 820,262 1002,380" fill="none" stroke="#1E8C8C" stroke-width="3.5" stroke-linecap="round"/>
<!-- governed grid patch -->
<path d="M860,560 L1160,560 L1210,648 L818,648 Z" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<g stroke="#6B7A8D" stroke-width="1" opacity="0.5">
 <line x1="935" y1="560" x2="916" y2="648"/>
 <line x1="1010" y1="560" x2="1014" y2="648"/>
 <line x1="1085" y1="560" x2="1112" y2="648"/>
 <line x1="846" y1="589" x2="1177" y2="589"/>
 <line x1="832" y1="618" x2="1193" y2="618"/>
</g>
<!-- map pin planted in the patch -->
<ellipse cx="1010" cy="596" rx="26" ry="7" fill="#0D1B2E" opacity="0.15"/>
<circle cx="1010" cy="415" r="60" fill="url(#pinGlow19c4)"/>
<path d="M1010,592 C982,524 974,470 974,415 A36,36 0 1 1 1046,415 C1046,470 1038,524 1010,592 Z" fill="#1E8C8C" stroke="#0D1B2E" stroke-width="2"/>
<circle cx="1010" cy="415" r="14" fill="#FFFFFF"/>
</svg>
