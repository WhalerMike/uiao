<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>

<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Two membership modes from one governed substrate</text>

<!-- top: governed substrate (navy) -->
<rect x="430" y="92" width="420" height="80" rx="10" fill="#0D1B2E"/>
<text x="640" y="124" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Primary-LocPath assignment plan</text>
<text x="640" y="150" font-size="14" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">(governed substrate)</text>

<!-- teal branches down to the two modes -->
<line x1="555" y1="172" x2="340" y2="256" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<line x1="725" y1="172" x2="935" y2="256" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- left: assigned membership (ice) -->
<rect x="110" y="260" width="450" height="170" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="335" y="292" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Assigned membership (default)</text>
<text x="335" y="328" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#33414F" text-anchor="middle" dominant-baseline="central">members from prefix match</text>
<text x="335" y="356" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#33414F" text-anchor="middle" dominant-baseline="central">employee id -&gt; objectId map</text>
<text x="335" y="384" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#33414F" text-anchor="middle" dominant-baseline="central">fails closed on unresolved</text>

<!-- right: dynamic rule (ice) -->
<rect x="700" y="260" width="480" height="170" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="940" y="292" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Dynamic rule (opt-in)</text>
<text x="940" y="330" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="middle" dominant-baseline="central">(locator -startsWith /USA/MD/ANNAPOLIS-HQ)</text>
<rect x="780" y="358" width="320" height="36" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="940" y="376" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">locator = parameter, never canon</text>

<!-- teal convergence to the derived artifacts -->
<line x1="335" y1="430" x2="520" y2="516" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<line x1="940" y1="430" x2="760" y2="516" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- bottom: derived group + AU (navy) -->
<rect x="370" y="520" width="540" height="120" rx="10" fill="#0D1B2E"/>
<text x="640" y="552" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">LocPath-Site-ANNAPOLIS-HQ-Users</text>
<text x="640" y="582" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">AU-Site-ANNAPOLIS-HQ</text>
<text x="640" y="612" font-size="14" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">(restricted management)</text>

<!-- side: the slot that was never claimed (grey, struck through) -->
<rect x="985" y="528" width="230" height="66" rx="8" fill="#F2F2F2" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="1100" y="561" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">extensionAttribute slot</text>
<line x1="995" y1="534" x2="1205" y2="588" stroke="#C0392B" stroke-width="4"/>
<line x1="1205" y1="534" x2="995" y2="588" stroke="#C0392B" stroke-width="4"/>
<text x="1100" y="618" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">no slot claimed</text>
</svg>
