<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">The build-and-deploy pipeline: DSC config to</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">tier-scoped compliance signal</text>

<!-- Row 1: stages 1-5 -->
<!-- Stage 1 -->
<rect x="40" y="150" width="210" height="90" rx="8" fill="#0D1B2E"/>
<text x="145" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1  PowerShell DSC config</text>
<text x="145" y="206" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">OrgPath_TierN_</text>
<text x="145" y="222" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">Baseline.ps1</text>
<!-- Stage 2 -->
<rect x="300" y="150" width="210" height="90" rx="8" fill="#0D1B2E"/>
<text x="405" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2  Compiled MOF</text>
<text x="405" y="212" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">declarative state document</text>
<!-- Stage 3 -->
<rect x="560" y="150" width="210" height="90" rx="8" fill="#0D1B2E"/>
<text x="665" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3  Guest Config package</text>
<text x="665" y="212" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">.zip archive</text>
<!-- Stage 4 -->
<rect x="820" y="150" width="210" height="90" rx="8" fill="#0D1B2E"/>
<text x="925" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4  Azure Blob Storage</text>
<text x="925" y="212" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">stable URL + SHA256</text>
<!-- Stage 5 -->
<rect x="1040" y="150" width="200" height="90" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="1140" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">5  Azure Policy</text>
<text x="1140" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">definition</text>
<text x="1140" y="226" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">references URL + hash</text>

<!-- Row 1 arrows -->
<line x1="250" y1="195" x2="298" y2="195" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="274" y="186" font-family="Consolas, monospace" font-size="9" fill="#1E8C8C" text-anchor="middle">Configuration</text>
<line x1="510" y1="195" x2="558" y2="195" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="534" y="186" font-family="Consolas, monospace" font-size="8" fill="#1E8C8C" text-anchor="middle">package</text>
<line x1="770" y1="195" x2="818" y2="195" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="794" y="186" font-family="Consolas, monospace" font-size="9" fill="#1E8C8C" text-anchor="middle">upload</text>
<line x1="1030" y1="195" x2="1038" y2="195" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- wrap arrow from stage5 down to stage 6 -->
<path d="M1140,240 L1140,310 L145,310 L145,400" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="640" y="302" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">assigned at management group scope</text>

<!-- Row 2: stages 6-9 -->
<!-- Stage 6 -->
<rect x="40" y="402" width="210" height="90" rx="8" fill="#0D1B2E"/>
<text x="145" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6  Policy Assignment</text>
<text x="145" y="464" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">scoped by OrgTier tag</text>
<!-- Stage 7 -->
<rect x="350" y="402" width="240" height="90" rx="8" fill="#0D1B2E"/>
<text x="470" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7  Guest Config extension</text>
<text x="470" y="456" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">on each Arc-enrolled</text>
<text x="470" y="472" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">machine</text>
<!-- Stage 8 -->
<rect x="690" y="402" width="240" height="90" rx="8" fill="#1E8C8C"/>
<text x="810" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8  Compliance state</text>
<text x="810" y="456" font-family="Consolas, monospace" font-size="10" fill="#E6F5F2" text-anchor="middle">Compliant / NonCompliant</text>
<text x="810" y="472" font-family="Consolas, monospace" font-size="10" fill="#E6F5F2" text-anchor="middle">/ Pending</text>
<!-- Stage 9 -->
<rect x="1030" y="402" width="210" height="90" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="1135" y="430" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">9  Policy compliance +</text>
<text x="1135" y="450" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Resource Graph +</text>
<text x="1135" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Sentinel</text>

<!-- Row 2 arrows -->
<line x1="250" y1="447" x2="348" y2="447" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="299" y="438" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#1E8C8C" text-anchor="middle">OrgTier match</text>
<line x1="590" y1="447" x2="688" y2="447" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="639" y="436" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#1E8C8C" text-anchor="middle">applies DSC,</text>
<text x="639" y="448" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#1E8C8C" text-anchor="middle">reports back</text>
<line x1="930" y1="447" x2="1028" y2="447" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- footnote: full cmdlet name -->
<text x="405" y="268" font-family="Consolas, monospace" font-size="10" fill="#6B7A8D" text-anchor="middle">step 2&#8594;3 uses New-GuestConfigurationPackage</text>

<text x="640" y="560" font-family="Arial, Helvetica, sans-serif" font-size="15" font-style="italic" fill="#6B7A8D" text-anchor="middle">One declarative source compiles, packages, hashes, uploads, and is referenced by a tier-scoped policy that lands on every Arc machine.</text>
</svg>
