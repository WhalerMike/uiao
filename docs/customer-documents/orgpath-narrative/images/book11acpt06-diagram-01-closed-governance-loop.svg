<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">The closed governance loop — HR sets OrgPath,</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">drift returns to OrgTree</text>

<!-- HR system top -->
<rect x="480" y="120" width="320" height="56" rx="8" fill="#0D1B2E"/>
<text x="640" y="142" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">HR system</text>
<text x="640" y="163" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">authoritative source - ADR-088 change-request gate</text>
<line x1="640" y1="176" x2="640" y2="200" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- OrgTree registry -->
<rect x="490" y="202" width="300" height="48" rx="8" fill="#0D1B2E"/>
<text x="640" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree registry</text>
<line x1="640" y1="250" x2="640" y2="274" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- central OrgPath hub -->
<rect x="455" y="276" width="370" height="74" rx="8" fill="#1E8C8C"/>
<text x="640" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgPath</text>
<text x="640" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">org-hierarchy path, a native extension attribute</text>
<text x="640" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">on every identity</text>

<!-- five surface boxes across the middle -->
<!-- box geometry: y=400, h=92, w=215 -->
<!-- 1 Entitlement management -->
<rect x="60" y="400" width="215" height="92" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="167" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Entitlement mgmt</text>
<text x="167" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">access packages</text>
<text x="167" y="473" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">scoped by OrgPath subtree</text>
<!-- 2 Lifecycle workflows -->
<rect x="295" y="400" width="215" height="92" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="402" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Lifecycle workflows</text>
<text x="402" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">joiner mover leaver</text>
<text x="402" y="473" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">on OrgPath change</text>
<!-- 3 Access reviews -->
<rect x="533" y="400" width="215" height="92" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="640" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Access reviews</text>
<text x="640" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">recertification routed</text>
<text x="640" y="473" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">by organizational tier</text>
<!-- 4 SailPoint NERM (carve-out, red frame) -->
<rect x="763" y="392" width="231" height="108" rx="10" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="878" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#C0392B" text-anchor="middle">ADR-059 commercial carve-out</text>
<rect x="775" y="415" width="207" height="78" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="878" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">SailPoint NERM</text>
<text x="878" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">non-employees mapped to OrgPath</text>
<!-- 5 PIM and RBAC -->
<rect x="1005" y="400" width="215" height="92" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="1112" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">PIM and RBAC</text>
<text x="1112" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">privileged eligibility</text>
<text x="1112" y="473" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">realigned on OrgPath change</text>

<!-- fan from hub to five surfaces -->
<line x1="500" y1="350" x2="180" y2="398" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="560" y1="350" x2="402" y2="398" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="640" y1="350" x2="640" y2="398" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="720" y1="350" x2="878" y2="390" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="780" y1="350" x2="1100" y2="398" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>

<!-- five feed down into drift detection -->
<line x1="167" y1="492" x2="500" y2="560" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="402" y1="492" x2="580" y2="558" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="640" y1="492" x2="640" y2="558" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="878" y1="493" x2="700" y2="558" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="1112" y1="492" x2="780" y2="560" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>

<!-- drift detection amber box -->
<rect x="460" y="560" width="360" height="74" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="640" y="586" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Drift detection</text>
<text x="640" y="612" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">granted access compared against OrgPath</text>

<!-- red return arrow up the left side back to OrgTree registry -->
<path d="M460 597 C 160 600, 36 470, 36 320 C 36 245, 270 226, 488 226" fill="none" stroke="#C0392B" stroke-width="2.4" marker-end="url(#ar-red)"/>
<text x="150" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle">remediation re-enters</text>
<text x="150" y="318" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle">at the source of truth</text>
</svg>
