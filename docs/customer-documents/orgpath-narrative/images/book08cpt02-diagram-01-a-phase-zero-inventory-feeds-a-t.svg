<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Phase Zero inventory to a single</text>
<text x="60" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">validated owning OrgPath</text>

<!-- Phase Zero inventory -->
<rect x="50" y="240" width="260" height="170" rx="8" fill="#0D1B2E"/>
<text x="180" y="282" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Phase Zero inventory</text>
<text x="180" y="318" font-family="Arial, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle">every app registration with</text>
<text x="180" y="338" font-family="Arial, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle">its credential health and</text>
<text x="180" y="358" font-family="Arial, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle">current OrgPath status</text>

<!-- arrow to triage -->
<line x1="310" y1="325" x2="378" y2="325" stroke="#5A5A5A" stroke-width="2.6" marker-end="url(#ar-grey)"/>

<!-- Triage assignment -->
<rect x="380" y="240" width="260" height="170" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="510" y="282" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Triage assignment file</text>
<text x="510" y="318" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">pairing each app</text>
<text x="510" y="338" font-family="Consolas, monospace" font-size="12.5" fill="#1E8C8C" text-anchor="middle">ObjectId</text>
<text x="510" y="358" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle">with one owning OrgPath</text>

<!-- arrow to validation gate -->
<line x1="640" y1="325" x2="708" y2="325" stroke="#5A5A5A" stroke-width="2.6" marker-end="url(#ar-grey)"/>

<!-- Validation gate (amber diamond) -->
<polygon points="830,230 940,325 830,420 720,325" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="830" y="306" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OrgPath must</text>
<text x="830" y="326" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">match an active</text>
<text x="830" y="346" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OrgTree node</text>

<!-- valid path -> stamp (navy) -->
<line x1="940" y1="325" x2="1008" y2="325" stroke="#0D1B2E" stroke-width="2.6" marker-end="url(#ar-navy)"/>
<text x="974" y="312" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle">valid</text>
<rect x="1010" y="262" width="220" height="126" rx="8" fill="#0D1B2E"/>
<text x="1120" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Stamp the owner</text>
<text x="1120" y="322" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OrgPath attribute</text>
<text x="1120" y="350" font-family="Arial, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="middle">on the app object</text>

<!-- invalid path -> rejected (red, downward) -->
<line x1="830" y1="420" x2="830" y2="490" stroke="#C0392B" stroke-width="2.6" marker-end="url(#ar-red)"/>
<text x="880" y="460" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle">invalid</text>
<rect x="690" y="492" width="280" height="92" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.8"/>
<text x="830" y="524" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle">Rejected</text>
<text x="830" y="550" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">returned to triage</text>
<text x="830" y="568" font-family="Arial, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">for correction</text>

<!-- rejected loops back to triage -->
<path d="M690,538 L510,538 L510,412" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar-red)"/>

<!-- Inheritance note -->
<rect x="1010" y="492" width="220" height="92" rx="8" fill="#0D1B2E"/>
<text x="1120" y="522" font-family="Arial, sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="middle">The home-tenant service</text>
<text x="1120" y="540" font-family="Arial, sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="middle">principal inherits the</text>
<text x="1120" y="558" font-family="Arial, sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="middle">owner OrgPath from its</text>
<text x="1120" y="576" font-family="Arial, sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="middle">app registration</text>
<line x1="1120" y1="388" x2="1120" y2="490" stroke="#5A5A5A" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar-grey)"/>
</svg>
