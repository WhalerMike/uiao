<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">The software stack across the governance</text><text x="60" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">pipeline machines, grouped by host</text>

<!-- Left column: Repository Server -->
<rect x="60" y="130" width="360" height="430" rx="10" fill="none" stroke="#0D1B2E" stroke-width="2"/>
<text x="240" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Repository Server</text>
<rect x="84" y="180" width="312" height="64" rx="8" fill="#0D1B2E"/><text x="240" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Git 2.40+</text><text x="240" y="227" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">version control</text>
<rect x="84" y="258" width="312" height="86" rx="8" fill="#0D1B2E"/><text x="240" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Gitea</text><text x="240" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">HTTPS &#183; branch protection</text><text x="240" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">pre-receive YAML-validation hook</text>

<!-- Right column: Automation Server / Workstation -->
<rect x="460" y="130" width="760" height="430" rx="10" fill="none" stroke="#0D1B2E" stroke-width="2"/>
<text x="840" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Automation Server / Workstation</text>
<rect x="484" y="180" width="350" height="78" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/><text x="659" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Windows PowerShell 5.1</text><text x="659" y="230" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">runs RSAT Active Directory module</text>
<rect x="846" y="180" width="350" height="78" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/><text x="1021" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">PowerShell 7.4</text><text x="1021" y="230" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">runs orchestration</text>

<rect x="484" y="272" width="350" height="78" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/><text x="659" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">RSAT feature set</text><text x="659" y="322" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">AD DS, GPMC, DNS, ADCS</text>

<rect x="846" y="272" width="350" height="78" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/><text x="1021" y="294" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Microsoft Graph PowerShell SDK</text><text x="1021" y="316" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">Users, Groups, Applications,</text><text x="1021" y="332" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">DeviceManagement, Identity.DirectoryManagement</text>

<rect x="484" y="364" width="350" height="78" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/><text x="659" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Az modules</text><text x="659" y="414" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">ConnectedMachine, PolicyInsights, Resources</text>

<!-- one-time prerequisite callout -->
<rect x="846" y="364" width="350" height="78" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/><text x="1021" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">One-time prerequisite</text><text x="1021" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">schema-extension app registration</text><text x="1021" y="427" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">produces the four registered extension names</text>

<!-- footer note -->
<rect x="484" y="470" width="712" height="60" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><text x="840" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">AD module runs only under powershell.exe; Graph and Az under pwsh.exe</text>
</svg>
