<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">One base policy reaches everyone; overlays</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">ride OrgPath scopes to the right branches</text>

<!-- BASE POLICY BAND full width -->
<rect x="60" y="130" width="1160" height="62" rx="8" fill="#0D1B2E"/>
<text x="640" y="152" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">base label policy  (tenant-wide reach)</text>
<text x="640" y="174" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Public  ·  Internal  ·  Confidential  ·  Highly Confidential</text>

<!-- OrgPath tree on left -->
<text x="80" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#6B7A8D">ORGPATH TREE</text>
<rect x="80" y="260" width="320" height="64" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="240" y="292" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NCR / Finance</text>
<rect x="80" y="388" width="320" height="64" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="240" y="420" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NCR / Legal</text>
<rect x="80" y="516" width="320" height="64" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="240" y="548" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NCR / Executive</text>

<!-- Overlay cards on right -->
<rect x="740" y="252" width="480" height="80" rx="8" fill="#0D1B2E"/>
<text x="760" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="start">Finance segment labels</text>
<text x="760" y="306" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="start">Financial Records  ·  Regulatory Reporting</text>

<rect x="740" y="380" width="480" height="80" rx="8" fill="#0D1B2E"/>
<text x="760" y="406" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="start">Legal segment labels</text>
<text x="760" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="start">Privileged  ·  Attorney Work Product</text>

<rect x="740" y="508" width="480" height="80" rx="8" fill="#0D1B2E"/>
<text x="760" y="534" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="start">Executive segment labels</text>
<text x="760" y="562" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="start">Board Materials  ·  M&amp;A Confidential</text>

<!-- Adaptive Scope connectors (amber) branch -> overlay -->
<line x1="400" y1="292" x2="738" y2="292" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<line x1="400" y1="420" x2="738" y2="420" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<line x1="400" y1="548" x2="738" y2="548" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>

<rect x="455" y="252" width="228" height="34" rx="4" fill="#FBEED2"/>
<text x="569" y="262" font-family="Consolas, monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">extensionAttribute15 -startsWith</text><text x="569" y="278" font-family="Consolas, monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">"Region=NCR|Department=Finance|"</text>
<rect x="455" y="380" width="228" height="34" rx="4" fill="#FBEED2"/>
<text x="569" y="390" font-family="Consolas, monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">extensionAttribute15 -startsWith</text><text x="569" y="406" font-family="Consolas, monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">"Region=NCR|Department=Legal|"</text>
<rect x="448" y="508" width="242" height="34" rx="4" fill="#FBEED2"/>
<text x="569" y="518" font-family="Consolas, monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">extensionAttribute15 -startsWith</text><text x="569" y="534" font-family="Consolas, monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">"Region=NCR|Department=Executive|"</text>

<text x="569" y="660" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">Amber connector = an Adaptive Scope binding the overlay to exactly its branch.</text>
</svg>
