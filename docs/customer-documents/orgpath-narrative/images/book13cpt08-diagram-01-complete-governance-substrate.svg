<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="bold" fill="#0D1B2E" text-anchor="start">The complete OrgPath governance substrate</text>
<text x="60" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="bold" fill="#0D1B2E" text-anchor="start">across every Microsoft cloud surface</text>

<!-- OrgTree registry (navy) -->
<rect x="50" y="280" width="200" height="120" rx="8" fill="#0D1B2E"/>
<text x="150" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OrgTree registry</text>
<text x="150" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">versioned &amp; authoritative</text>
<text x="150" y="366" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#C7D4E6" text-anchor="middle">/Finance/Treasury</text>
<text x="150" y="382" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#C7D4E6" text-anchor="middle">/Ops/Logistics</text>

<!-- ETL pipeline (navy) -->
<line x1="250" y1="340" x2="286" y2="340" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<rect x="288" y="290" width="200" height="100" rx="8" fill="#0D1B2E"/>
<text x="388" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ETL pipeline</text>
<text x="388" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">stamps OrgPath on every</text>
<text x="388" y="369" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">governed object</text>

<!-- teal spine fans out to surface boxes -->
<line x1="488" y1="340" x2="560" y2="340" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<line x1="540" y1="340" x2="540" y2="120" stroke="#1E8C8C" stroke-width="2.4"/>
<line x1="540" y1="340" x2="540" y2="560" stroke="#1E8C8C" stroke-width="2.4"/>

<!-- 9 surface boxes in 3 columns x 3 rows (teal) -->
<!-- row 1 -->
<rect x="560" y="118" width="200" height="58" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="660" y="142" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Entra ID + Lifecycle</text>
<text x="660" y="160" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Workflows</text>
<rect x="772" y="118" width="200" height="58" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="872" y="151" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">PIM eligibility</text>
<rect x="984" y="118" width="220" height="58" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="1094" y="142" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Sentinel detection</text>
<text x="1094" y="160" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">+ enrichment</text>
<!-- row 2 -->
<rect x="560" y="196" width="200" height="58" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="660" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Azure RBAC</text>
<text x="660" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">+ Arc tags</text>
<rect x="772" y="196" width="200" height="58" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="872" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Intune compliance</text>
<text x="872" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">+ config</text>
<rect x="984" y="196" width="220" height="58" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="1094" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Defender for Endpoint,</text>
<text x="1094" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Identity + Cloud Apps</text>
<!-- row 3 -->
<rect x="560" y="274" width="200" height="58" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="660" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">DNS scoping</text>
<text x="660" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">+ Cloud PKI</text>
<rect x="772" y="274" width="200" height="58" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="872" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Purview DLP labels</text>
<text x="872" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">+ retention</text>
<rect x="984" y="274" width="220" height="58" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="1094" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Boundary identities:</text>
<text x="1094" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#33414F" text-anchor="middle">guests · MIs · workload principals</text>

<!-- spine connectors to each row -->
<line x1="540" y1="147" x2="556" y2="147" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="540" y1="225" x2="556" y2="225" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="540" y1="303" x2="556" y2="303" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>

<!-- Power BI governance dashboard (amber) far right -->
<rect x="984" y="396" width="220" height="100" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="1094" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Power BI governance</text>
<text x="1094" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">dashboard</text>
<text x="1094" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">aggregates every surface</text>
<!-- arrow from surfaces to dashboard -->
<line x1="1094" y1="332" x2="1094" y2="392" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<text x="1180" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="middle" transform="rotate(90 1180 450)">readable in 40 seconds</text>

<!-- amber feedback loop: drift detection back to registry -->
<rect x="288" y="500" width="230" height="80" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="403" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Drift detection</text>
<text x="403" y="550" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">committed to an</text>
<text x="403" y="567" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle">auditable record</text>
<!-- feedback arrow from surfaces down to drift box -->
<line x1="660" y1="332" x2="540" y2="540" stroke="#1E8C8C" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="540" y1="540" x2="520" y2="540" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<!-- amber loop back to registry -->
<path d="M288 540 L150 540 L150 404" fill="none" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<text x="160" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#D4A017" text-anchor="start">closes the loop</text>

<!-- red marker: object lacking OrgPath -->
<rect x="560" y="500" width="380" height="80" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="585" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#C0392B" text-anchor="middle">&#10007;</text>
<text x="750" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle">Any object lacking OrgPath</text>
<text x="750" y="552" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">is ungoverned and out of scope</text>
</svg>
