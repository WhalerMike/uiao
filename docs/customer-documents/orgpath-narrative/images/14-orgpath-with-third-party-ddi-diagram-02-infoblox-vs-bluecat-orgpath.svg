<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B2D8E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">One OrgPath value, two DDI carriers</text>

<!-- shared registry top center -->
<rect x="440" y="100" width="400" height="56" rx="8" fill="#0D1B2E"/>
<text x="640" y="128" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgTree registry (authoritative)</text>

<!-- sync orchestrator pill center -->
<rect x="510" y="196" width="260" height="48" rx="24" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="640" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Sync orchestrator</text>
<line x1="640" y1="196" x2="640" y2="158" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<!-- bidirectional arrows from pill to panels -->
<line x1="510" y1="220" x2="360" y2="220" stroke="#D4A017" stroke-width="2.2" marker-start="url(#ar-amber)" marker-end="url(#ar-amber)"/>
<line x1="770" y1="220" x2="920" y2="220" stroke="#D4A017" stroke-width="2.2" marker-start="url(#ar-amber)" marker-end="url(#ar-amber)"/>

<!-- Left panel: Infoblox -->
<rect x="60" y="270" width="540" height="350" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<rect x="60" y="270" width="540" height="46" rx="10" fill="#1E8C8C"/>
<rect x="60" y="296" width="540" height="20" fill="#1E8C8C"/>
<text x="330" y="294" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Infoblox NIOS</text>
<rect x="92" y="346" width="476" height="180" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="116" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#6B7A8D" text-anchor="start">RECORD DETAIL</text>
<line x1="116" y1="390" x2="544" y2="390" stroke="#E3E8EF" stroke-width="1.2"/>
<text x="116" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="start">Field name:</text>
<text x="240" y="420" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath</text>
<text x="116" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="start">Type: Extensible Attribute (EA)</text>
<text x="116" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="start">Value:</text>
<rect x="116" y="492" width="430" height="26" rx="4" fill="#EAF1FB"/>
<text x="124" y="505" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="start">/Engineering/Platform/Build-Servers</text>
<text x="330" y="560" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">REST API sync</text>
<line x1="330" y1="580" x2="330" y2="246" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar-teal)"/>

<!-- Right panel: BlueCat -->
<rect x="680" y="270" width="540" height="350" rx="10" fill="#F3EDFA" stroke="#5B2D8E" stroke-width="1.8"/>
<rect x="680" y="270" width="540" height="46" rx="10" fill="#5B2D8E"/>
<rect x="680" y="296" width="540" height="20" fill="#5B2D8E"/>
<text x="950" y="294" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">BlueCat Address Manager</text>
<rect x="712" y="346" width="476" height="180" rx="8" fill="#FFFFFF" stroke="#5B2D8E" stroke-width="1.4"/>
<text x="736" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#6B7A8D" text-anchor="start">RECORD DETAIL</text>
<line x1="736" y1="390" x2="1164" y2="390" stroke="#E3E8EF" stroke-width="1.2"/>
<text x="736" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="start">Field name:</text>
<text x="860" y="420" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath</text>
<text x="736" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="start">Type: User-Defined Field (UDF)</text>
<text x="736" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="start">Value:</text>
<rect x="736" y="492" width="430" height="26" rx="4" fill="#F3EDFA"/>
<text x="744" y="505" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="start">/Engineering/Platform/Build-Servers</text>
<text x="950" y="560" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#5B2D8E" text-anchor="middle" dominant-baseline="central">REST API sync</text>
<line x1="950" y1="580" x2="950" y2="246" stroke="#5B2D8E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar-purple)"/>

<!-- reconciliation dashed arrow between panels -->
<line x1="600" y1="450" x2="680" y2="450" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="430" y="640" width="420" height="44" rx="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.4"/>
<text x="640" y="662" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#33414F" text-anchor="middle" dominant-baseline="central">OrgPath value held identical across both DDI platforms</text>
</svg>
