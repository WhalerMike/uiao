<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Partner-registry-driven Conditional Access</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">tiering for B2B guests</text>

<!-- Top row: three sequential boxes -->
<rect x="50" y="130" width="270" height="78" rx="8" fill="#0D1B2E"/>
<text x="185" y="158" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Partner Registry</text>
<text x="185" y="182" font-family="Arial" font-size="12" fill="#C7D4E6" text-anchor="middle">JSON in governance repo,</text>
<text x="185" y="198" font-family="Arial" font-size="12" fill="#C7D4E6" text-anchor="middle">PR-gated</text>

<rect x="380" y="130" width="270" height="78" rx="8" fill="#0D1B2E"/>
<text x="515" y="158" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Invitation-time Function</text>
<text x="515" y="182" font-family="Arial" font-size="12" fill="#C7D4E6" text-anchor="middle">Azure Function: Event Grid</text>
<text x="515" y="198" font-family="Arial" font-size="12" fill="#C7D4E6" text-anchor="middle">+ Managed Identity</text>

<rect x="710" y="130" width="270" height="78" rx="8" fill="#1E8C8C"/>
<text x="845" y="158" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Guest OrgPath stub</text>
<text x="845" y="184" font-family="Consolas, monospace" font-size="11" fill="#EAF1FB" text-anchor="middle">/EXTERNAL/B2B/{domain}</text>
<text x="845" y="200" font-family="Consolas, monospace" font-size="11" fill="#EAF1FB" text-anchor="middle">or /UNREGISTERED</text>

<line x1="320" y1="169" x2="378" y2="169" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="650" y1="169" x2="708" y2="169" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>

<!-- Side box: Cross-Tenant Access Settings -->
<rect x="1010" y="120" width="220" height="98" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
<text x="1120" y="148" font-family="Arial" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Cross-Tenant Access</text>
<text x="1120" y="166" font-family="Arial" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Settings</text>
<text x="1120" y="192" font-family="Arial" font-size="11" fill="#33414F" text-anchor="middle">MFA + device claim</text>
<text x="1120" y="207" font-family="Arial" font-size="11" fill="#33414F" text-anchor="middle">trust by tier</text>
<path d="M1120,218 L1120,260 L185,260 L185,210" fill="none" stroke="#D4A017" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar-amber)"/>
<text x="640" y="252" font-family="Arial" font-size="12" font-style="italic" fill="#D4A017" text-anchor="middle">per-partner trust</text>

<!-- Middle band: dynamic group library -->
<rect x="50" y="290" width="930" height="120" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="70" y="316" font-family="Arial" font-size="14" font-weight="bold" fill="#1E8C8C">Dynamic group library  (external subtree)</text>
<rect x="70" y="328" width="280" height="66" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="210" y="356" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="middle">ORG-EXTERNAL-B2B-</text>
<text x="210" y="374" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="middle">UNREGISTERED</text>
<rect x="375" y="328" width="280" height="66" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.6"/>
<text x="515" y="356" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="middle">ORG-EXTERNAL-B2B-</text>
<text x="515" y="374" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="middle">{partner}  (Tier2)</text>
<rect x="680" y="328" width="280" height="66" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="820" y="356" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="middle">ORG-EXTERNAL-B2B-</text>
<text x="820" y="374" font-family="Consolas, monospace" font-size="12" fill="#0D1B2E" text-anchor="middle">{partner}  (Tier1)</text>

<!-- stub fans down to each group -->
<line x1="845" y1="208" x2="210" y2="326" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ar-grey)"/>
<line x1="845" y1="208" x2="515" y2="326" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ar-grey)"/>
<line x1="845" y1="208" x2="820" y2="326" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ar-grey)"/>

<!-- group to CA tier vertical arrows -->
<line x1="210" y1="394" x2="210" y2="452" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="515" y1="394" x2="515" y2="452" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<line x1="820" y1="394" x2="820" y2="452" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- Bottom band: Conditional Access tiers -->
<text x="1230" y="442" font-family="Arial" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="end">Conditional Access tiers</text>

<!-- Tier 3 (red, highest restriction) -->
<rect x="70" y="452" width="280" height="160" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
<text x="210" y="480" font-family="Arial" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle">Tier 3 — UNREGISTERED</text>
<text x="210" y="512" font-family="Arial" font-size="12.5" fill="#33414F" text-anchor="middle">MFA every time</text>
<text x="210" y="534" font-family="Arial" font-size="12.5" fill="#33414F" text-anchor="middle">+ compliant device</text>
<text x="210" y="556" font-family="Arial" font-size="12.5" fill="#33414F" text-anchor="middle">AND no persistent</text>
<text x="210" y="578" font-family="Arial" font-size="12.5" fill="#33414F" text-anchor="middle">browser</text>

<!-- Tier 2 (amber) -->
<rect x="375" y="452" width="280" height="160" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
<text x="515" y="480" font-family="Arial" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Tier 2 — Standard</text>
<text x="515" y="512" font-family="Arial" font-size="12.5" fill="#33414F" text-anchor="middle">Registered partner</text>
<text x="515" y="534" font-family="Arial" font-size="12.5" fill="#33414F" text-anchor="middle">MFA OR compliant device</text>
<text x="515" y="562" font-family="Arial" font-size="12.5" fill="#33414F" text-anchor="middle">8h sign-in frequency</text>

<!-- Tier 1 (teal) -->
<rect x="680" y="452" width="280" height="160" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="820" y="480" font-family="Arial" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Tier 1 — High-trust</text>
<text x="820" y="512" font-family="Arial" font-size="12.5" fill="#33414F" text-anchor="middle">Attested partner</text>
<text x="820" y="534" font-family="Arial" font-size="12.5" fill="#33414F" text-anchor="middle">MFA OR compliant OR</text>
<text x="820" y="556" font-family="Arial" font-size="12.5" fill="#33414F" text-anchor="middle">hybrid-joined</text>
<text x="820" y="582" font-family="Arial" font-size="12.5" fill="#33414F" text-anchor="middle">24h sign-in frequency</text>
</svg>
