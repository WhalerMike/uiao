<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E">Specialized instruments extend the native</text><text x="60" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E">toolset from enumeration to analysis</text>

<!-- Upper band: specialized analysis -->
<rect x="60" y="130" width="1160" height="290" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="80" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C">Specialized instruments — analysis (risk, attack paths, graph-depth relationships)</text>

<!-- 6 cards: 3 columns x 2 rows -->
<rect x="84" y="176" width="356" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="104" y="202" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E">PingCastle</text><text x="104" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">weighted AD risk score</text><text x="104" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#D4A017">StaleObjects, Trusts, Anomalies,</text><text x="104" y="263" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#D4A017">PrivilegedAccounts</text>

<rect x="462" y="176" width="356" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="482" y="202" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E">BloodHound / SharpHound</text><text x="482" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">attack-path and ACL graph</text><text x="482" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#D4A017">GenericAll, WriteDACL</text>

<rect x="840" y="176" width="356" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="860" y="202" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E">ADRecon</text><text x="860" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">post-processed Excel/CSV summaries</text>

<rect x="84" y="296" width="356" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="104" y="322" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E">Tenable Identity Exposure</text><text x="104" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">100+ indicators of exposure</text><text x="104" y="367" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#D4A017">including AD CS ESC1&#8211;ESC8</text>

<rect x="462" y="296" width="356" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="482" y="322" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E">Semperis DSP</text><text x="482" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">exportable object and relationship data</text>

<rect x="840" y="296" width="356" height="100" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="860" y="322" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0D1B2E">LDAPDomainDump</text><text x="860" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F">bulk LDAP JSON for very large domains</text>

<!-- Lower band: native enumeration -->
<rect x="60" y="490" width="1160" height="80" rx="10" fill="#0D1B2E"/><text x="640" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Native toolset — enumeration</text><text x="640" y="546" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle">lists every object, setting, replication state</text>

<!-- both bands feed archive -->
<rect x="490" y="630" width="300" height="64" rx="8" fill="#1E3A66"/><text x="640" y="662" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Structured assessment archive</text>
<line x1="640" y1="420" x2="640" y2="488" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<line x1="640" y1="570" x2="640" y2="628" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
</svg>
