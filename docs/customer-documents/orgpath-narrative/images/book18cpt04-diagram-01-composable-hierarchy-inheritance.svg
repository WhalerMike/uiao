<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Book 18 Ch.4 — A branch is a predicate; targeting inherits down the tree. ADR-093 blueprint register. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="c4-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="74" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">A branch is a predicate; targeting inherits down the tree</text>

  <!-- LEFT: predicate -> group -> inheritance tree -->
  <text x="60" y="120" font-size="14" fill="#5A5A5A">A branch of the org tree is a boolean predicate over validated facets</text>
  <rect x="60" y="132" width="404" height="60" rx="9" fill="#0D1B2E"/>
  <text x="262" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="17" font-weight="bold" fill="#FFFFFF">region = EMEA AND department = FIN</text>

  <line x1="262" y1="192" x2="262" y2="216" stroke="#1E8C8C" stroke-width="3" marker-end="url(#c4-teal)"/>
  <rect x="60" y="220" width="404" height="56" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="262" y="254" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">becomes a dynamic group — the EMEA · FIN branch</text>

  <line x1="262" y1="276" x2="262" y2="300" stroke="#1E8C8C" stroke-width="3" marker-end="url(#c4-teal)"/>

  <!-- inheritance tree -->
  <rect x="182" y="304" width="160" height="56" rx="8" fill="#1E8C8C"/>
  <text x="262" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">EMEA · FIN</text>
  <text x="262" y="348" text-anchor="middle" font-size="11" fill="#D7F2EE">policy attached here</text>

  <line x1="262" y1="360" x2="262" y2="380" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="140" y1="380" x2="384" y2="380" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="140" y1="380" x2="140" y2="400" stroke="#1E8C8C" stroke-width="2" marker-end="url(#c4-teal)"/>
  <line x1="384" y1="380" x2="384" y2="400" stroke="#1E8C8C" stroke-width="2" marker-end="url(#c4-teal)"/>

  <rect x="60" y="404" width="160" height="50" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="140" y="434" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">· OPS</text>
  <rect x="304" y="404" width="160" height="50" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="384" y="434" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">· PAY</text>

  <line x1="140" y1="454" x2="140" y2="474" stroke="#1E8C8C" stroke-width="2" marker-end="url(#c4-teal)"/>
  <line x1="384" y1="454" x2="384" y2="474" stroke="#1E8C8C" stroke-width="2" marker-end="url(#c4-teal)"/>
  <rect x="60" y="478" width="160" height="50" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="140" y="508" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">· OPS · A</text>
  <rect x="304" y="478" width="160" height="50" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="384" y="508" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">· PAY · B</text>

  <text x="262" y="560" text-anchor="middle" font-size="14" font-style="italic" fill="#1E8C8C">inheritance is automatic — the whole sub-tree, not per principal</text>

  <!-- RIGHT TOP: the IGA seam -->
  <rect x="500" y="112" width="720" height="300" rx="12" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="524" y="146" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#0D1B2E">The seam where IGA plugs in</text>
  <text x="524" y="172" font-size="14" fill="#5A5A5A">No workflow changes — the platform just targets a better set of groups</text>

  <rect x="524" y="192" width="320" height="44" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="684" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Conditional Access</text>
  <rect x="524" y="244" width="320" height="44" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="684" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Privileged Identity Management</text>
  <rect x="524" y="296" width="320" height="44" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="684" y="324" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Access packages</text>
  <rect x="524" y="348" width="320" height="44" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="684" y="376" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Certification campaigns</text>

  <rect x="884" y="220" width="312" height="144" rx="10" fill="#D7F2EE"/>
  <text x="1040" y="256" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">target the org-branch groups</text>
  <text x="1040" y="288" text-anchor="middle" font-size="14" fill="#33414F">deterministic · validated ·</text>
  <text x="1040" y="310" text-anchor="middle" font-size="14" fill="#33414F">drift-reconciled</text>
  <text x="1040" y="344" text-anchor="middle" font-size="14" font-style="italic" fill="#1E8C8C">that is the entire integration</text>
  <line x1="844" y1="292" x2="880" y2="292" stroke="#1E8C8C" stroke-width="3" marker-end="url(#c4-teal)"/>

  <!-- RIGHT BOTTOM: Administrative Units contrast -->
  <rect x="500" y="428" width="720" height="204" rx="12" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="524" y="462" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#0D1B2E">Why Administrative Units cannot stand in</text>
  <rect x="524" y="484" width="200" height="92" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="624" y="534" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">AU: EMEA</text>
  <rect x="748" y="484" width="200" height="92" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="848" y="534" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">AU: FIN</text>
  <rect x="972" y="484" width="200" height="92" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="1072" y="534" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">AU: OPS</text>
  <text x="524" y="606" font-size="15" font-weight="bold" fill="#C0392B">Flat — they do not nest and they do not inherit, so they cannot express a hierarchy.</text>
</svg>
