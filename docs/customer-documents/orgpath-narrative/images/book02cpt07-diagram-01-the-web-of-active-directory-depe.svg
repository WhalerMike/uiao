 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">The web of Active Directory dependencies</text><rect x="470" y="300" width="340" height="150" rx="10" fill="#0D1B2E"/><text x="640" y="345" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">AD infrastructure</text><text x="640" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">DCs · DNS/SRV · SYSVOL</text><text x="640" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">AD CS · Kerberos KDC</text><rect x="80" y="180" width="320" height="60" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="240" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Domain-joined computers</text><line x1="240" y1="240" x2="640" y2="330" stroke="#E3E8EF" stroke-width="1.4"/><rect x="470" y="150" width="320" height="60" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="630" y="180" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Kerberos / NTLM apps</text><line x1="630" y1="210" x2="640" y2="330" stroke="#E3E8EF" stroke-width="1.4"/><rect x="880" y="180" width="320" height="60" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="1040" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">LDAP-bound systems</text><line x1="1040" y1="240" x2="640" y2="330" stroke="#E3E8EF" stroke-width="1.4"/><rect x="80" y="560" width="320" height="60" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="240" y="590" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Certificate-enrolled machines</text><line x1="240" y1="560" x2="640" y2="420" stroke="#E3E8EF" stroke-width="1.4"/><rect x="470" y="580" width="320" height="60" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="630" y="610" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Service accounts / tasks</text><line x1="630" y1="580" x2="640" y2="420" stroke="#E3E8EF" stroke-width="1.4"/><rect x="880" y="560" width="320" height="60" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/><text x="1040" y="590" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">HR · ERP · monitoring · backup</text><line x1="1040" y1="560" x2="640" y2="420" stroke="#E3E8EF" stroke-width="1.4"/><line x1="40" y1="250" x2="1240" y2="270" stroke="#C0392B" stroke-width="3" stroke-dasharray="2 0"/><text x="60" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="start">decommission — failures may be silent</text><rect x="980" y="470" width="240" height="120" rx="8" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1.4"/><text x="1000" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">Dependency Map</text><text x="1000" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start">component → consumers</text><text x="1000" y="552" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start">consumer → dependencies</text><text x="1000" y="576" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="start">machine-readable, bidirectional</text>
</svg>
