<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Four cutover criteria gate the move of DNS</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">authority from Infoblox to Azure DNS</text>

<!-- Left: DDI control plane -->
<rect x="50" y="200" width="250" height="300" rx="8" fill="#0D1B2E"/>
<text x="175" y="232" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">DDI-CONTROL-PLANE</text>
<text x="175" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">NIOS Grid</text>
<text x="175" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">BlueCat Address Manager</text>
<rect x="74" y="330" width="202" height="60" rx="6" fill="#0D2E2E" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="175" y="352" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#7FD4D4" text-anchor="middle" dominant-baseline="central">INFOBLOX-PERMANENT</text>
<text x="175" y="372" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#7FD4D4" text-anchor="middle" dominant-baseline="central">-DHCP-IPAM</text>
<rect x="74" y="406" width="202" height="40" rx="6" fill="#FFFFFF"/>
<text x="175" y="426" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">STAYS-IN-INFOBLOX</text>

<!-- Center: 4 gate bars -->
<rect x="420" y="180" width="440" height="360" rx="10" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="640" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#6B7A8D" text-anchor="middle">CUTOVER GATE — all four required</text>
<rect x="445" y="226" width="390" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="640" y="254" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">CRITERION-1-DNS-ZONE-COMPLETE</text>
<rect x="445" y="290" width="390" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="640" y="318" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">CRITERION-2-DHCP-IPAM-REMAIN</text>
<rect x="445" y="354" width="390" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="640" y="382" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">CRITERION-3-FORWARDERS-REMOVED</text>
<rect x="445" y="418" width="390" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="640" y="440" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">CRITERION-4-FINAL-DNS</text>
<text x="640" y="460" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">-RECONCILE-ZERO-DELTA</text>
<!-- readiness-score arrow flowing upward -->
<line x1="640" y1="525" x2="640" y2="484" stroke="#D4A017" stroke-width="2.6" marker-end="url(#ar-amber)"/>
<text x="640" y="552" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="bold" fill="#D4A017" text-anchor="middle" dominant-baseline="central">READINESS-SCORE</text>

<!-- Right: Azure DNS authority -->
<rect x="980" y="200" width="250" height="180" rx="8" fill="#0D1B2E"/>
<text x="1105" y="230" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">AZURE-DNS-AUTHORITY</text>
<rect x="1004" y="252" width="202" height="48" rx="6" fill="#1E3A66"/>
<text x="1105" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Azure DNS Private Zones</text>
<text x="1105" y="288" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">OrgPath tags</text>
<rect x="1004" y="312" width="202" height="48" rx="6" fill="#1E3A66"/>
<text x="1105" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Private Resolver ruleset</text>
<text x="1105" y="348" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">OrgPath tags</text>

<!-- DNS-CUTOVER teal arrow crossing gate -->
<line x1="860" y1="290" x2="978" y2="290" stroke="#1E8C8C" stroke-width="2.6" marker-end="url(#ar-teal)"/>
<text x="918" y="276" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle">DNS-CUTOVER</text>

<!-- DHCP/IPAM loops back into Infoblox -->
<path d="M 300 470 C 360 470, 360 560, 280 560 L 175 560 L 175 502" fill="none" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<text x="350" y="588" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle">DHCP and IPAM loop back to Infoblox</text>

<!-- red crossed-out blocker at the bottom of the gate -->
<line x1="445" y1="660" x2="835" y2="660" stroke="#C0392B" stroke-width="2.4"/>
<line x1="618" y1="646" x2="662" y2="674" stroke="#C0392B" stroke-width="3"/>
<line x1="662" y1="646" x2="618" y2="674" stroke="#C0392B" stroke-width="3"/>
<text x="640" y="700" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle">Any single unmet criterion blocks the DNS-cutover arrow from reaching Azure</text>
</svg>
