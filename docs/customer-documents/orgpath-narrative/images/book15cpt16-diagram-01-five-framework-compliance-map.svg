<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">UIAO corpus mapped to five federal frameworks</text>

<!-- center corpus box -->
<rect x="60" y="300" width="240" height="110" rx="8" fill="#0D1B2E"/>
<text x="180" y="345" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">UIAO corpus</text>
<text x="180" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">23 documents</text>

<!-- five framework boxes -->
<rect x="400" y="120" width="380" height="56" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="590" y="140" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">NIST SP 800-53 Rev 5</text>
<text x="590" y="160" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">FedRAMP Moderate baseline</text>
<rect x="400" y="190" width="380" height="56" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="590" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">FedRAMP Rev 5 Moderate</text>
<text x="590" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">323 controls · 18 families</text>
<rect x="400" y="332" width="380" height="46" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="590" y="355" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">FedRAMP 20x · automation-first authorization</text>
<rect x="400" y="392" width="380" height="46" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="590" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">CISA BOD 26-04 · 23-01 · 25-01</text>
<rect x="400" y="452" width="380" height="46" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="590" y="475" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OMB M-22-09 · Federal Zero Trust</text>

<!-- teal connectors -->
<line x1="300" y1="340" x2="398" y2="148" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="300" y1="345" x2="398" y2="218" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="300" y1="355" x2="398" y2="355" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="300" y1="365" x2="398" y2="415" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="300" y1="375" x2="398" y2="475" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>

<!-- NIST coverage bar -->
<text x="820" y="135" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="start">NIST control families: 16 of 20 covered</text>
<rect x="820" y="150" width="320" height="34" rx="4" fill="#1E8C8C"/>
<rect x="1076" y="150" width="64" height="34" rx="0" fill="#C0392B"/>
<text x="980" y="167" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">16 covered</text>
<text x="1108" y="167" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
<text x="820" y="208" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C0392B" text-anchor="start">4 uncovered: Awareness and Training,</text>
<text x="820" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C0392B" text-anchor="start">Media Protection, Physical and Environmental</text>
<text x="820" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#C0392B" text-anchor="start">Protection, Personnel Security</text>

<!-- FedRAMP control bar -->
<text x="820" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="start">FedRAMP controls: 187 of 323 met (~58%)</text>
<rect x="820" y="335" width="186" height="34" rx="4" fill="#1E8C8C"/>
<rect x="1006" y="335" width="100" height="34" rx="0" fill="#D4A017"/>
<rect x="1106" y="335" width="34" height="34" rx="0" fill="#C0392B"/>
<text x="913" y="352" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">187 met</text>
<text x="1056" y="352" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">49</text>
<text x="1123" y="352" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">87</text>
<!-- legend -->
<rect x="820" y="392" width="16" height="16" rx="3" fill="#1E8C8C"/><text x="844" y="401" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start" dominant-baseline="central">187 met</text>
<rect x="820" y="418" width="16" height="16" rx="3" fill="#D4A017"/><text x="844" y="427" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start" dominant-baseline="central">49 inherited / procedural</text>
<rect x="820" y="444" width="16" height="16" rx="3" fill="#C0392B"/><text x="844" y="453" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start" dominant-baseline="central">87 genuine gaps</text>
</svg>
