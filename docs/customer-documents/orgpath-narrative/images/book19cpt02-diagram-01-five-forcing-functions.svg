<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>

<!-- Title -->
<text x="60" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#0D1B2E">Five forcing functions, one governed answer</text>

<!-- Forcing function 1: E911 -->
<rect x="60" y="130" width="360" height="84" rx="10" fill="#0D1B2E"/>
<text x="240" y="162" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">
  <tspan x="240" dy="0">E911 dispatchable location</tspan>
  <tspan x="240" dy="24">(47 CFR Part 9)</tspan>
</text>

<!-- Forcing function 2: TIC 3.0 -->
<rect x="60" y="238" width="360" height="84" rx="10" fill="#0D1B2E"/>
<text x="240" y="280" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">TIC 3.0 Direct Internet Access</text>

<!-- Forcing function 3: EIS / SD-WAN -->
<rect x="60" y="346" width="360" height="84" rx="10" fill="#0D1B2E"/>
<text x="240" y="388" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">EIS / SD-WAN transition</text>

<!-- Forcing function 4: M365 informed network routing -->
<rect x="60" y="454" width="360" height="84" rx="10" fill="#0D1B2E"/>
<text x="240" y="496" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">M365 informed network routing</text>

<!-- Forcing function 5: telemetry -->
<rect x="60" y="562" width="360" height="84" rx="10" fill="#0D1B2E"/>
<text x="240" y="604" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Location-scoped telemetry</text>

<!-- Red annotation near the spokes' origins -->
<text x="452" y="118" font-size="16" font-style="italic" font-weight="bold" fill="#C0392B" text-anchor="start">today: five ungoverned copies</text>
<line x1="442" y1="134" x2="442" y2="646" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="6 5"/>

<!-- Teal converging arrows -->
<line x1="424" y1="172" x2="834" y2="350" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<line x1="424" y1="280" x2="834" y2="370" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<line x1="424" y1="388" x2="834" y2="390" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<line x1="424" y1="496" x2="834" y2="410" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<line x1="424" y1="604" x2="834" y2="430" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- Governed location model (LocPath) -->
<rect x="840" y="310" width="380" height="160" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2.5"/>
<text x="1030" y="376" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">
  <tspan x="1030" dy="0">Governed location model</tspan>
  <tspan x="1030" dy="28">(LocPath)</tspan>
</text>
</svg>
