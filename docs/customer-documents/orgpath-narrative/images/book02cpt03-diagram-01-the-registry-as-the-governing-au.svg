<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">The registry as the governing authority</text><rect x="70" y="210" width="400" height="200" rx="10" fill="#0D1B2E"/><text x="270" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Organizational Hierarchy</text><text x="270" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Registry</text><text x="270" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">versioned · schema-validated</text><text x="270" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">the set of valid nodes + relations</text><line x1="470" y1="280" x2="610" y2="280" stroke="#D4A017" stroke-width="3" marker-end="url(#ar-amber)"/><text x="490" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#D4A017" text-anchor="start">derives + validates</text><rect x="620" y="210" width="280" height="66" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="760" y="243" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">/Org/Finance</text><rect x="920" y="210" width="280" height="66" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="1060" y="243" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">/Org/Finance/West</text><rect x="620" y="296" width="280" height="66" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="760" y="329" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">/Org/Ops</text><rect x="920" y="296" width="280" height="66" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="1060" y="329" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">/Org/Ops/Field</text><rect x="620" y="382" width="280" height="66" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="760" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">/Org/HR</text><rect x="920" y="382" width="280" height="66" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="1060" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">/Org/IT</text><line x1="900" y1="470" x2="470" y2="470" stroke="#C0392B" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#ar-red)"/><text x="685" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">individual object edits are NOT authoritative</text><text x="685" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">✗</text><rect x="70" y="520" width="1130" height="70" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/><text x="635" y="555" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">A restructuring event (node renamed / merged / moved) triggers a propagation wave that re-derives every affected identity.</text>
</svg>
