<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">An event-driven governance pipeline</text><text x="60" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#0D1B2E" text-anchor="start">EVENT SOURCES</text><rect x="60" y="175" width="250" height="60" rx="8" fill="#0D1B2E"/><text x="185" y="205" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Registry change</text><line x1="310" y1="205" x2="360" y2="300" stroke="#E3E8EF" stroke-width="1.4" marker-end="url(#ar-grey)"/><rect x="60" y="253" width="250" height="60" rx="8" fill="#0D1B2E"/><text x="185" y="283" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Identity enrollment</text><line x1="310" y1="283" x2="360" y2="300" stroke="#E3E8EF" stroke-width="1.4" marker-end="url(#ar-grey)"/><rect x="60" y="331" width="250" height="60" rx="8" fill="#0D1B2E"/><text x="185" y="361" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">HR restructuring</text><line x1="310" y1="361" x2="360" y2="300" stroke="#E3E8EF" stroke-width="1.4" marker-end="url(#ar-grey)"/><rect x="60" y="409" width="250" height="60" rx="8" fill="#0D1B2E"/><text x="185" y="439" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Arc onboarding</text><line x1="310" y1="439" x2="360" y2="300" stroke="#E3E8EF" stroke-width="1.4" marker-end="url(#ar-grey)"/><rect x="60" y="487" width="250" height="60" rx="8" fill="#0D1B2E"/><text x="185" y="517" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Scheduled cron</text><line x1="310" y1="517" x2="360" y2="300" stroke="#E3E8EF" stroke-width="1.4" marker-end="url(#ar-grey)"/><rect x="360" y="175" width="560" height="300" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/><text x="640" y="205" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="1" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">GOVERNANCE PIPELINE</text><rect x="390" y="232" width="500" height="38" rx="6" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.1"/><text x="640" y="251" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Attribute derivation</text><rect x="390" y="278" width="500" height="38" rx="6" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.1"/><text x="640" y="297" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Dynamic-group maintenance</text><rect x="390" y="324" width="500" height="38" rx="6" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.1"/><text x="640" y="343" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Dependency-map update</text><rect x="390" y="370" width="500" height="38" rx="6" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.1"/><text x="640" y="389" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Drift detection</text><rect x="390" y="416" width="500" height="38" rx="6" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.1"/><text x="640" y="435" font-family="Arial, 'Helveti