<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Document lifecycle and canon supremacy</text>

<!-- lifecycle track -->
<text x="640" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#6B7A8D" text-anchor="middle">lifecycle track</text>
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12">
<rect x="120" y="170" width="150" height="48" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="195" y="194" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">DRAFT</text>
<rect x="305" y="170" width="150" height="48" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="380" y="194" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">IN_REVIEW</text>
<rect x="490" y="170" width="150" height="48" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="565" y="194" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">APPROVED</text>
<rect x="675" y="170" width="150" height="48" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="750" y="194" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">CURRENT</text>
<rect x="860" y="170" width="150" height="48" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="935" y="194" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">DEPRECATED</text>
<rect x="1045" y="170" width="150" height="48" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/><text x="1120" y="194" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">ARCHIVED</text>
</g>
<line x1="270" y1="194" x2="303" y2="194" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="455" y1="194" x2="488" y2="194" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="640" y1="194" x2="673" y2="194" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="825" y1="194" x2="858" y2="194" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<line x1="1010" y1="194" x2="1043" y2="194" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>

<!-- canon steward gate (amber) between IN_REVIEW and APPROVED -->
<rect x="320" y="250" width="320" height="44" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
<text x="480" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Canon Steward human review gate</text>
<line x1="470" y1="250" x2="430" y2="220" stroke="#D4A017" stroke-width="1.6"/>

<!-- pre-receive gate -->
<rect x="80" y="380" width="240" height="90" rx="8" fill="#0D1B2E"/>
<text x="200" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Git pre-receive hook</text>
<text x="200" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">validates mandatory</text>
<text x="200" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">YAML frontmatter</text>

<!-- APPROVED -> canon -->
<line x1="565" y1="218" x2="565" y2="370" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/>
<text x="610" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="start">APPROVED</text>

<!-- canon directory -->
<rect x="400" y="372" width="320" height="110" rx="8" fill="#2E75B6"/>
<text x="560" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">canon directory</text>
<text x="560" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">single authoritative source of truth</text>
<text x="560" y="452" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">UIAO-NNN  + semantic version</text>
<line x1="320" y1="425" x2="398" y2="425" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- rejected doc (red) -->
<rect x="80" y="510" width="300" height="80" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="230" y="538" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">unauthorized classification value</text>
<text x="230" y="562" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C0392B" text-anchor="middle" dominant-baseline="central">rejected at the hook gate</text>
<line x1="230" y1="510" x2="210" y2="472" stroke="#C0392B" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#ar-red)"/>
<line x1="280" y1="500" x2="320" y2="490" stroke="#C0392B" stroke-width="2" /><line x1="290" y1="490" x2="310" y2="500" stroke="#C0392B" stroke-width="2"/>

<!-- derived artifacts (provenance fan) -->
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12">
<rect x="800" y="372" width="190" height="50" rx="8" fill="#0D1B2E"/><text x="895" y="397" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">rendered HTML</text>
<rect x="1010" y="372" width="190" height="50" rx="8" fill="#0D1B2E"/><text x="1105" y="397" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">compliance dashboard</text>
<rect x="800" y="440" width="190" height="50" rx="8" fill="#0D1B2E"/><text x="895" y="465" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">OrgPath calculation</text>
<rect x="1010" y="440" width="190" height="50" rx="8" fill="#0D1B2E"/><text x="1105" y="465" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">migration plan</text>
</g>
<line x1="720" y1="410" x2="798" y2="397" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<line x1="720" y1="415" x2="1008" y2="397" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<line x1="720" y1="445" x2="798" y2="460" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<line x1="720" y1="450" x2="1008" y2="460" stroke="#5A5A5A" stroke-width="1.8" marker-end="url(#ar-grey)"/>
<text x="760" y="385" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle">provenance</text>
</svg>
