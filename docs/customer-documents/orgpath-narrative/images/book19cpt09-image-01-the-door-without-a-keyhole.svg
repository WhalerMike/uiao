<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#EAF1FB"/>
  <stop offset="1" stop-color="#CFE0F2"/>
 </linearGradient>
 <radialGradient id="hall" cx="0.5" cy="0.45" r="0.8">
  <stop offset="0" stop-color="#FFFFFF"/>
  <stop offset="0.55" stop-color="#D7F2EE"/>
  <stop offset="1" stop-color="#CFE0F2"/>
 </radialGradient>
 <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#D7F2EE"/>
  <stop offset="1" stop-color="#D7F2EE" stop-opacity="0"/>
 </linearGradient>
</defs>
<!-- sky and floor -->
<rect x="0" y="0" width="1280" height="600" fill="url(#sky)"/>
<rect x="0" y="600" width="1280" height="120" fill="#EAF1FB"/>
<line x1="0" y1="600" x2="1280" y2="600" stroke="#A9B8CA" stroke-width="2"/>
<!-- door frame -->
<rect x="550" y="100" width="380" height="500" fill="#1E3A66" stroke="#0D1B2E" stroke-width="4"/>
<!-- warmly lit hall seen through the opening -->
<rect x="575" y="125" width="330" height="475" fill="url(#hall)"/>
<!-- right leaf: closed, smooth navy, no keyhole -->
<rect x="740" y="125" width="165" height="475" fill="#0D1B2E"/>
<line x1="752" y1="138" x2="752" y2="588" stroke="#1E3A66" stroke-width="3" opacity="0.8"/>
<rect x="748" y="345" width="9" height="50" rx="4.5" fill="#A9B8CA"/>
<!-- left leaf: swung ajar toward the viewer -->
<polygon points="700,148 714,154 714,650 700,645" fill="#1E3A66"/>
<polygon points="575,125 700,148 700,645 575,600" fill="#0D1B2E"/>
<rect x="678" y="355" width="9" height="52" rx="4.5" fill="#A9B8CA"/>
<!-- hinges on the frame -->
<rect x="566" y="190" width="12" height="26" rx="3" fill="#6B7A8D"/>
<rect x="566" y="430" width="12" height="26" rx="3" fill="#6B7A8D"/>
<!-- glow spilling through the gap onto the floor -->
<polygon points="714,648 740,600 850,720 620,720" fill="url(#spill)" opacity="0.9"/>
<!-- plaque: keyhole pictogram struck through -->
<line x1="1015" y1="415" x2="1015" y2="648" stroke="#6B7A8D" stroke-width="6"/>
<rect x="955" y="265" width="120" height="150" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="3"/>
<circle cx="1015" cy="318" r="17" fill="#5A5A5A"/>
<polygon points="1008,330 1022,330 1030,368 1000,368" fill="#5A5A5A"/>
<line x1="982" y1="288" x2="1048" y2="392" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
<line x1="1048" y1="288" x2="982" y2="392" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
<!-- doorkeeper silhouette (stylized, never photographic) -->
<circle cx="348" cy="348" r="34" fill="#2E4B6B"/>
<path d="M 295,690 L 295,475 Q 295,390 348,390 Q 401,390 401,475 L 401,690 Z" fill="#2E4B6B"/>
<rect x="390" y="465" width="75" height="24" rx="12" fill="#2E4B6B"/>
<!-- teal thread from the ledger to the upper hinge -->
<path d="M 590,476 C 705,440 705,295 580,212" fill="none" stroke="#D7F2EE" stroke-width="10" stroke-linecap="round"/>
<path d="M 590,476 C 705,440 705,295 580,212" fill="none" stroke="#1E8C8C" stroke-width="3.5" stroke-linecap="round"/>
<!-- the open ledger -->
<path d="M 515,452 Q 472,438 442,450 L 442,512 Q 472,500 515,514 Z" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="3" stroke-linejoin="round"/>
<path d="M 515,452 Q 558,438 588,450 L 588,512 Q 558,500 515,514 Z" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="3" stroke-linejoin="round"/>
<line x1="515" y1="452" x2="515" y2="514" stroke="#0D1B2E" stroke-width="2"/>
<text x="515" y="486" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">assignment plan</text>
</svg>
