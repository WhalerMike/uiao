<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Governance-as-code: the pipeline it produces</text>

<!-- governance repository -->
<rect x="60" y="150" width="270" height="300" rx="8" fill="#0D1B2E"/>
<text x="195" y="178" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">governance repository</text>
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11">
<rect x="80" y="195" width="230" height="36" rx="5" fill="#1E3A66"/><text x="95" y="213" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">policy</text><text x="300" y="213" fill="#C7D4E6" text-anchor="end" dominant-baseline="central">a1b2c3</text>
<rect x="80" y="237" width="230" height="36" rx="5" fill="#1E3A66"/><text x="95" y="255" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">standard</text><text x="300" y="255" fill="#C7D4E6" text-anchor="end" dominant-baseline="central">d4e5f6</text>
<rect x="80" y="279" width="230" height="36" rx="5" fill="#1E3A66"/><text x="95" y="297" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">control-mapping</text><text x="300" y="297" fill="#C7D4E6" text-anchor="end" dominant-baseline="central">7a8b9c</text>
<rect x="80" y="321" width="230" height="36" rx="5" fill="#1E3A66"/><text x="95" y="339" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">drift-threshold</text><text x="300" y="339" fill="#C7D4E6" text-anchor="end" dominant-baseline="central">0d1e2f</text>
<rect x="80" y="363" width="230" height="36" rx="5" fill="#1E3A66"/><text x="95" y="381" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">review-cadence</text><text x="300" y="381" fill="#C7D4E6" text-anchor="end" dominant-baseline="central">3a4b5c</text>
<rect x="80" y="405" width="230" height="36" rx="5" fill="#1E3A66"/><text x="95" y="423" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">exception-w-rationale</text><text x="300" y="423" fill="#C7D4E6" text-anchor="end" dominant-baseline="central">6d7e8f</text>
</g>

<!-- commit history arrow -->
<line x1="330" y1="280" x2="430" y2="280" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>
<text x="380" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle">commit history</text>

<!-- deterministic compliance state (teal) -->
<rect x="432" y="225" width="270" height="110" rx="8" fill="#1E8C8C"/>
<text x="567" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">deterministic</text>
<text x="567" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">compliance state</text>
<text x="567" y="310" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">computed from two inputs</text>

<!-- two merging inputs -->
<rect x="360" y="110" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="450" y="132" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">assessment output</text>
<rect x="560" y="110" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="650" y="132" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">governance record</text>
<line x1="450" y1="154" x2="540" y2="223" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="650" y1="154" x2="595" y2="223" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>

<!-- machine-readable evidence -> dashboard -->
<line x1="702" y1="280" x2="800" y2="280" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<text x="751" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#1E8C8C" text-anchor="middle">machine-readable</text>
<text x="751" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#1E8C8C" text-anchor="middle">evidence</text>

<rect x="802" y="220" width="300" height="120" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="952" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Quarto compliance dashboard</text>
<!-- gauge -->
<path d="M 902 320 A 50 50 0 0 1 1002 320" fill="none" stroke="#5A5A5A" stroke-width="6"/>
<path d="M 902 320 A 50 50 0 0 1 990 290" fill="none" stroke="#1E8C8C" stroke-width="6"/>
<line x1="952" y1="320" x2="985" y2="295" stroke="#0D1B2E" stroke-width="2.5"/>
<circle cx="952" cy="320" r="4" fill="#0D1B2E"/>
<text x="952" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#33414F" text-anchor="middle">authorization official reads directly</text>

<!-- tamper-evident git history timeline -->
<text x="60" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#D4A017" text-anchor="start">tamper-evident Git history</text>
<line x1="60" y1="540" x2="700" y2="540" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<g fill="#D4A017"><circle cx="120" cy="540" r="6"/><circle cx="260" cy="540" r="6"/><circle cx="400" cy="540" r="6"/><circle cx="540" cy="540" r="6"/></g>
<text x="380" y="572" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">timestamp-anchored commits feed the drift detection engine</text>

<!-- drift detection engine -->
<rect x="740" y="500" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="880" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">drift detection engine</text>
<text x="880" y="552" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">governance record vs</text>
<text x="880" y="570" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33414F" text-anchor="middle" dominant-baseline="central">current assessment output</text>
<line x1="700" y1="540" x2="738" y2="540" stroke="#D4A017" stroke-width="2" marker-end="url(#ar-amber)"/>

<!-- drift marker (red) -->
<rect x="1040" y="510" width="180" height="70" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="1130" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">drift</text>
<text x="1130" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#C0392B" text-anchor="middle" dominant-baseline="central">caught before it becomes</text>
<text x="1130" y="571" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#C0392B" text-anchor="middle" dominant-baseline="central">a security gap</text>
<line x1="1020" y1="545" x2="1038" y2="545" stroke="#C0392B" stroke-width="2" marker-end="url(#ar-red)"/>
</svg>
