<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">The three infrastructure roles and the</text><text x="60" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">network paths between them</text>

<!-- Role boxes -->
<rect x="60" y="180" width="300" height="180" rx="8" fill="#0D1B2E"/><text x="210" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Governance Repository Server</text><text x="210" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle">Git / Gitea store</text><text x="210" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle">4 vCPU / 16 GB / 200 GB SSD</text><text x="210" y="285" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle">two volumes</text><rect x="100" y="312" width="220" height="30" rx="5" fill="#C0392B"/><text x="210" y="327" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">NOT domain-joined</text>

<rect x="490" y="180" width="300" height="180" rx="8" fill="#0D1B2E"/><text x="640" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Automation Execution</text><text x="640" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Environment</text><text x="640" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle">Windows Server 2022 / 2025</text><text x="640" y="277" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle">PowerShell ETL + drift jobs</text><text x="640" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle">4 vCPU / 8 GB</text><rect x="540" y="312" width="200" height="30" rx="5" fill="#D4A017"/><text x="640" y="327" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">domain-joined</text>

<rect x="920" y="180" width="300" height="180" rx="8" fill="#0D1B2E"/><text x="1070" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Assessment Workstation</text><text x="1070" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle">Windows 11</text><text x="1070" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#C7D4E6" text-anchor="middle">RSAT + interactive AD tools</text><rect x="970" y="312" width="200" height="30" rx="5" fill="#D4A017"/><text x="1070" y="327" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">domain-joined</text>

<!-- Domain Controllers -->
<rect x="490" y="470" width="300" height="80" rx="8" fill="#1E3A66"/><text x="640" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Domain Controllers</text><text x="640" y="526" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6" text-anchor="middle">LDAP 389 &#183; LDAPS 636 &#183; Kerberos 88</text>

<!-- Cloud band -->
<rect x="60" y="600" width="730" height="90" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/><text x="80" y="624" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C">Cloud endpoints (outbound HTTPS 443)</text><text x="80" y="652" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E">graph.microsoft.com</text><text x="320" y="652" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E">management.azure.com</text><text x="570" y="652" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E">login.microsoftonline.com</text>

<!-- Arrows: automation <-> repo over HTTPS 443 -->
<line x1="490" y1="250" x2="362" y2="250" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)" marker-start="url(#ar-grey)"/><text x="426" y="240" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5A5A5A" text-anchor="middle">HTTPS 443</text>

<!-- automation -> DCs -->
<line x1="640" y1="360" x2="640" y2="468" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><text x="730" y="418" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5A5A5A" text-anchor="middle">389 / 636 / 88</text>

<!-- automation -> cloud band 443 -->
<path d="M 560,360 C 420,420 380,540 420,598" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/><text x="360" y="470" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1E8C8C" text-anchor="middle">HTTPS 443</text>

<!-- workstation -> DCs only -->
<path d="M 1000,360 C 900,420 820,448 792,490" fill="none" stroke="#5A5A5A" stroke-width="2.2" marker-end="url(#ar-grey)"/><text x="980" y="440" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5A5A5A" text-anchor="middle">DCs only</text>
</svg>
