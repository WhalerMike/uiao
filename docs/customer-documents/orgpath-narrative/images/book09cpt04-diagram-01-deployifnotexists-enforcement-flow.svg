<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">The deployIfNotExists enforcement flow:</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">two resources, one self-healing loop</text>

<!-- Left: policy definition + assignment -->
<rect x="40" y="150" width="250" height="64" rx="8" fill="#0D1B2E"/>
<text x="165" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">policy definition</text>
<text x="165" y="196" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">orgpath-guestconfig-tier0-enforce</text>
<rect x="40" y="226" width="250" height="64" rx="8" fill="#0D1B2E"/>
<text x="165" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">policy assignment</text>
<text x="165" y="272" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">MG scope: mg-governance-root</text>

<!-- amber connector fanning to 3 subscriptions -->
<text x="165" y="318" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#D4A017" text-anchor="middle">management group scope</text>
<rect x="40" y="330" width="76" height="44" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="78" y="352" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">sub A</text>
<rect x="127" y="330" width="76" height="44" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="165" y="352" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">sub B</text>
<rect x="214" y="330" width="76" height="44" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="252" y="352" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">sub C</text>
<line x1="165" y1="290" x2="78" y2="328" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<line x1="165" y1="290" x2="165" y2="328" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>
<line x1="165" y1="290" x2="252" y2="328" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>

<!-- Center: Arc machine box -->
<rect x="40" y="440" width="250" height="120" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.6"/>
<text x="165" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Arc-enrolled machine</text>
<text x="55" y="494" font-family="Consolas, monospace" font-size="11" fill="#33414F" text-anchor="start">type = Microsoft.HybridCompute</text>
<text x="55" y="514" font-family="Consolas, monospace" font-size="11" fill="#33414F" text-anchor="start">       /machines</text>
<text x="55" y="538" font-family="Consolas, monospace" font-size="11" fill="#33414F" text-anchor="start">OrgTier = 0   osType = Windows</text>

<!-- teal diamond deployIfNotExists -->
<polygon points="540,360 660,300 780,360 660,420" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="660" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">deployIfNotExists</text>
<text x="660" y="372" font-family="Consolas, monospace" font-size="10" fill="#176E6E" text-anchor="middle">existenceCondition</text>

<!-- machine into diamond -->
<line x1="290" y1="460" x2="560" y2="385" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="420" y="438" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1E8C8C" text-anchor="middle">machine matches condition</text>

<!-- branch 1: compliant exists -> Compliant -->
<line x1="780" y1="345" x2="900" y2="320" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="838" y="312" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1E8C8C" text-anchor="middle">compliant assignment exists</text>
<rect x="905" y="296" width="200" height="56" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="1005" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">&#10003; Compliant</text>
<text x="1005" y="338" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#176E6E" text-anchor="middle">no action</text>

<!-- branch 2: no compliant -> ARM template -->
<line x1="780" y1="385" x2="560" y2="500" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="610" y="455" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1E8C8C" text-anchor="middle">no compliant assignment</text>
<rect x="340" y="500" width="230" height="80" rx="8" fill="#0D1B2E"/>
<text x="455" y="524" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ARM deployment template</text>
<text x="455" y="548" font-family="Consolas, monospace" font-size="9" fill="#C7D4E6" text-anchor="middle">creates Microsoft.GuestConfiguration</text>
<text x="455" y="564" font-family="Consolas, monospace" font-size="9" fill="#C7D4E6" text-anchor="middle">/guestConfigurationAssignments</text>

<!-- right: GC extension on Arc agent -->
<rect x="905" y="430" width="335" height="150" rx="8" fill="#0D1B2E"/>
<text x="1072" y="456" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Guest Configuration extension on Arc agent</text>
<text x="925" y="486" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="start">1. download package from blob URL</text>
<text x="925" y="512" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="start">2. apply DSC configuration</text>
<text x="925" y="538" font-family="Consolas, monospace" font-size="11" fill="#C7D4E6" text-anchor="start">3. report compliance</text>

<!-- ARM template -> GC extension -->
<line x1="570" y1="540" x2="903" y2="500" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="740" y="500" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1E8C8C" text-anchor="middle">assignment resource created</text>

<!-- loop reported compliance back to diamond -->
<path d="M905,455 L840,455 L840,360 L782,360" fill="none" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<text x="845" y="430" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1E8C8C" text-anchor="middle">reported compliance</text>

<!-- red drifted marker -->
<rect x="600" y="620" width="320" height="44" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.6"/>
<text x="760" y="642" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C0392B" text-anchor="middle" dominant-baseline="central">drifted machine flagged: NonCompliant</text>
<text x="760" y="657" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C0392B" text-anchor="middle" dominant-baseline="central">pending redeployment</text>
<line x1="660" y1="420" x2="700" y2="618" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ar-red)"/>
</svg>
