<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

<!-- Title -->
<text x="640" y="62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#0D1B2E">One governed Site node, three classification blocks</text>

<!-- Central Site card -->
<rect x="80" y="100" width="1120" height="456" rx="14" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="3"/>
<text x="640" y="146" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#0D1B2E">/USA/MD/ANNAPOLIS-HQ (Site)</text>
<line x1="116" y1="172" x2="1164" y2="172" stroke="#6B7A8D" stroke-width="1" stroke-dasharray="5 5"/>

<!-- Panel 1: E911 dispatchable location -->
<rect x="116" y="196" width="332" height="324" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="282" y="232" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">E911 dispatchable location</text>
<line x1="140" y1="252" x2="424" y2="252" stroke="#0D1B2E" stroke-width="1.2"/>
<text x="140" y="292" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#0D1B2E">civicAddress</text>
<text x="140" y="328" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#0D1B2E">floor / room</text>
<text x="140" y="364" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#0D1B2E">geo coordinates</text>
<text x="282" y="496" text-anchor="middle" font-size="13" font-style="italic" fill="#5A5A5A">what rides with a 911 call</text>

<!-- Panel 2: Network / TIC 3.0 -->
<rect x="474" y="196" width="332" height="324" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="640" y="232" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Network / TIC 3.0</text>
<line x1="498" y1="252" x2="782" y2="252" stroke="#0D1B2E" stroke-width="1.2"/>
<text x="498" y="292" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#0D1B2E">diaApproved: true</text>
<text x="498" y="328" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#0D1B2E">sdwanBreakoutType: Local</text>
<text x="498" y="364" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#0D1B2E">ticCapabilityTier: Tier-1</text>
<text x="518" y="392" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#5A5A5A">(agency-defined)</text>
<text x="498" y="428" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#0D1B2E">legacyMplsStatus: Decommissioning</text>
<text x="640" y="496" text-anchor="middle" font-size="13" font-style="italic" fill="#5A5A5A">the DIA decision, recorded</text>

<!-- Panel 3: Telemetry / service boundaries -->
<rect x="832" y="196" width="332" height="324" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="998" y="232" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Telemetry / service boundaries</text>
<line x1="856" y1="252" x2="1140" y2="252" stroke="#0D1B2E" stroke-width="1.2"/>
<text x="856" y="292" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#0D1B2E">telemetryBoundary: GCCAllowed</text>
<text x="856" y="328" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#0D1B2E">allowedTelemetryDestinations</text>
<text x="856" y="364" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#0D1B2E">serviceAccessBoundary: Full</text>
<text x="998" y="496" text-anchor="middle" font-size="13" font-style="italic" fill="#5A5A5A">what may originate and egress here</text>

<!-- Teal caption band -->
<rect x="80" y="588" width="1120" height="58" rx="10" fill="#1E8C8C"/>
<text x="640" y="617" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="bold" fill="#FFFFFF">every change is a governed, provenance-anchored canon change</text>
</svg>
