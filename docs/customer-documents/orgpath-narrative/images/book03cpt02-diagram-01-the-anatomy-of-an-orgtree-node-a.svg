<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">The anatomy of an OrgTree node and its path to root</text>

<!-- ancestor chain (left top) -->
<text x="80" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#6B7A8D" text-anchor="start">ancestor chain &#8594; root</text>
<rect x="80" y="146" width="200" height="40" rx="8" fill="#0D1B2E"/>
<text x="180" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">root (ops)</text>
<line x1="180" y1="186" x2="180" y2="216" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<rect x="80" y="218" width="200" height="40" rx="8" fill="#1E3A66"/>
<text x="180" y="238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">department (field-svc)</text>
<line x1="180" y1="258" x2="180" y2="288" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
<rect x="80" y="290" width="200" height="40" rx="8" fill="#2E75B6"/>
<text x="180" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">unit (region-west)</text>

<!-- center node card -->
<rect x="350" y="120" width="430" height="380" rx="10" fill="#0D1B2E"/>
<text x="370" y="150" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start">OrgTree node &#8212; governed properties</text>
<rect x="370" y="168" width="390" height="44" rx="6" fill="#1E3A66"/>
<text x="384" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="start">stable identifier (unchanged across renames)</text>
<text x="384" y="200" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">node-7f3a</text>
<rect x="370" y="220" width="390" height="40" rx="6" fill="#1E3A66"/>
<text x="384" y="234" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="start">human-readable name</text>
<text x="384" y="251" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="start">Region West</text>
<rect x="370" y="268" width="390" height="40" rx="6" fill="#1E3A66"/>
<text x="384" y="282" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="start">type</text>
<text x="384" y="299" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="start">division / department / unit / team / site / function</text>
<rect x="370" y="316" width="390" height="40" rx="6" fill="#1E3A66"/>
<text x="384" y="330" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="start">parent reference</text>
<text x="384" y="347" font-family="Consolas, monospace" font-size="13" fill="#FFFFFF" text-anchor="start">&#8594; field-svc</text>
<rect x="370" y="364" width="390" height="120" rx="6" fill="#1E3A66"/>
<text x="384" y="384" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#C7D4E6" text-anchor="start">governance metadata</text>
<text x="384" y="408" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="start">effective date: 2026-01-15</text>
<text x="384" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="start">review status: approved</text>
<text x="384" y="456" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="start">responsible role: Ops Director</text>

<!-- arrow chain to node -->
<line x1="280" y1="310" x2="348" y2="310" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- path bridge (bottom center) -->
<rect x="350" y="528" width="430" height="120" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="565" y="556" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">concatenated identifiers form the path</text>
<text x="565" y="588" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">ops/field-svc/region-west</text>
<text x="565" y="622" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">the bridge to OrgPath</text>
<line x1="565" y1="500" x2="565" y2="526" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>

<!-- version control timeline (right) -->
<rect x="820" y="120" width="400" height="528" rx="10" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.6"/>
<text x="840" y="150" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="start">Version-control timeline</text>
<text x="840" y="172" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#6B7A8D" text-anchor="start">each commit: who / why / effective-date</text>
<line x1="858" y1="200" x2="858" y2="612" stroke="#D4A017" stroke-width="2.4"/>
<!-- commit nodes -->
<circle cx="858" cy="222" r="7" fill="#D4A017"/>
<text x="884" y="216" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">add</text>
<text x="884" y="236" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="start">node created &#183; 2025-09-01</text>
<circle cx="858" cy="322" r="7" fill="#D4A017"/>
<text x="884" y="316" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">rename</text>
<text x="884" y="336" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="start">West &#8594; Region West &#183; 2025-11-10</text>
<circle cx="858" cy="422" r="7" fill="#D4A017"/>
<text x="884" y="416" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">move</text>
<text x="884" y="436" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="start">reparented to field-svc &#183; 2026-01-15</text>
<circle cx="858" cy="522" r="7" fill="#D4A017"/>
<text x="884" y="516" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start">archive</text>
<text x="884" y="536" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7A8D" text-anchor="start">retired when superseded (future)</text>
<text x="840" y="600" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6B7A8D" text-anchor="start">stable identifier survives every event</text>
</svg>
