<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Conditional Access — successor to the GPO logon boundary</text>

<!-- LEFT: legacy boundary -->
<rect x="60" y="150" width="430" height="340" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="275" y="178" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">legacy boundary</text>
<rect x="95" y="210" width="360" height="90" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
<text x="275" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">network firewall perimeter</text>
<text x="275" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">trust = inside the network</text>
<rect x="95" y="320" width="360" height="120" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
<text x="275" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">GPO logon-restriction gate</text>
<text x="275" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">evaluated once at session start</text>
<text x="275" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" text-anchor="middle" dominant-baseline="central">against a static rule set</text>
<text x="275" y="424" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C0392B" text-anchor="middle" dominant-baseline="central">refresh-cycle stale</text>

<!-- RIGHT: CA engine -->
<rect x="790" y="150" width="430" height="340" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="1005" y="178" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Entra ID Conditional Access</text>
<text x="1005" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">policy engine</text>
<rect x="850" y="225" width="310" height="200" rx="8" fill="#0D1B2E"/>
<text x="1005" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">evaluates every</text>
<text x="1005" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">authentication event</text>
<line x1="1005" y1="296" x2="1005" y2="312" stroke="#6B7A8D" stroke-width="1"/>
<text x="1005" y="332" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">device-compliance</text>
<text x="1005" y="352" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">user-risk · sign-in-risk</text>
<text x="1005" y="372" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">network-location</text>
<text x="1005" y="392" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">app-sensitivity</text>

<!-- input chips feeding engine -->
<rect x="560" y="160" width="200" height="34" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="660" y="177" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">device-compliance</text>
<rect x="560" y="200" width="200" height="34" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="660" y="217" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">user-risk</text>
<rect x="560" y="240" width="200" height="34" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="660" y="257" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">sign-in-risk</text>
<rect x="560" y="280" width="200" height="34" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="660" y="297" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">network-location</text>
<rect x="560" y="320" width="200" height="34" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="660" y="337" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">app-sensitivity</text>
<line x1="760" y1="177" x2="848" y2="250" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="760" y1="217" x2="848" y2="280" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="760" y1="297" x2="848" y2="310" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="760" y1="337" x2="848" y2="350" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>
<line x1="760" y1="297" x2="848" y2="340" stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#ar-teal)"/>

<!-- outcomes -->
<line x1="950" y1="425" x2="900" y2="468" stroke="#0D1B2E" stroke-width="2.4" marker-end="url(#ar-navy)"/>
<rect x="800" y="466" width="120" height="40" rx="8" fill="#0D1B2E"/>
<text x="860" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">grant</text>
<line x1="1060" y1="425" x2="1110" y2="468" stroke="#C0392B" stroke-width="2.4" marker-end="url(#ar-red)"/>
<rect x="1090" y="466" width="120" height="40" rx="8" fill="#C0392B"/>
<text x="1150" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">deny</text>

<!-- amber dividing band -->
<rect x="60" y="560" width="1160" height="80" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="640" y="588" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">the dividing line</text>
<text x="320" y="618" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#C0392B" text-anchor="middle" dominant-baseline="central">session-time</text>
<line x1="640" y1="566" x2="640" y2="634" stroke="#D4A017" stroke-width="1.6"/>
<text x="960" y="618" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">authentication-time</text>
</svg>
