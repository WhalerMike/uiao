<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, serif" font-size="29" font-weight="bold" fill="#0D1B2E">A legacy GPO setting dispositioned for Intune</text>

<!-- GPO in scope -->
<rect x="60" y="120" width="180" height="56" rx="8" fill="#0D1B2E"/>
<text x="150" y="148" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GPO setting</text>
<text x="150" y="166" font-family="Arial, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle">in scope</text>
<!-- decision diamond -->
<polygon points="370,148 460,108 550,148 460,188" fill="#0D1B2E"/>
<text x="460" y="142" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">migration</text>
<text x="460" y="158" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">disposition</text>
<line x1="240" y1="148" x2="368" y2="148" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>

<!-- four outcome boxes -->
<rect x="660" y="100" width="320" height="44" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="820" y="116" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Direct Equivalent</text>
<text x="820" y="133" font-family="Arial, sans-serif" font-size="9.5" fill="#33414F" text-anchor="middle">one-to-one to an Intune setting</text>
<rect x="660" y="152" width="320" height="44" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.4"/>
<text x="820" y="168" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Functional Equivalent</text>
<text x="820" y="185" font-family="Arial, sans-serif" font-size="9.5" fill="#33414F" text-anchor="middle">same outcome, different mechanism</text>
<rect x="660" y="204" width="320" height="48" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/>
<text x="820" y="222" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Manual Compensation</text>
<text x="820" y="240" font-family="Arial, sans-serif" font-size="9" fill="#33414F" text-anchor="middle">PowerShell, Conditional Access, or Defender detection</text>
<rect x="660" y="260" width="320" height="48" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.4"/>
<text x="820" y="278" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#C0392B" text-anchor="middle">No Equivalent</text>
<text x="820" y="296" font-family="Arial, sans-serif" font-size="9" fill="#C0392B" text-anchor="middle">loss logged as accepted risk · owner + review date</text>
<line x1="550" y1="148" x2="658" y2="122" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="550" y1="148" x2="658" y2="174" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="550" y1="148" x2="658" y2="226" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<line x1="550" y1="148" x2="658" y2="282" stroke="#5A5A5A" stroke-width="1.6" marker-end="url(#ar-grey)"/>

<!-- teal + amber outcomes flow to four Intune categories -->
<rect x="280" y="380" width="720" height="100" rx="10" fill="#0D1B2E"/>
<text x="640" y="406" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Four Intune policy categories</text>
<rect x="300" y="420" width="160" height="42" rx="6" fill="#1E3A66"/><text x="380" y="441" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Compliance Policies</text>
<rect x="475" y="420" width="160" height="42" rx="6" fill="#1E3A66"/><text x="555" y="441" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Configuration Profiles</text>
<rect x="650" y="420" width="160" height="42" rx="6" fill="#1E3A66"/><text x="730" y="441" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Endpoint Security</text>
<rect x="825" y="420" width="155" height="42" rx="6" fill="#1E3A66"/><text x="902" y="441" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">App Protection</text>
<line x1="820" y1="196" x2="700" y2="378" stroke="#1E8C8C" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<line x1="820" y1="252" x2="760" y2="378" stroke="#D4A017" stroke-width="1.8" marker-end="url(#ar-amber)"/>

<!-- device tiers -->
<rect x="280" y="520" width="720" height="120" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.4"/>
<text x="640" y="546" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Device tiers</text>
<rect x="300" y="560" width="160" height="60" rx="8" fill="#0D1B2E"/><text x="380" y="586" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Tier 0</text><text x="380" y="604" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">PAW</text>
<rect x="475" y="560" width="160" height="60" rx="8" fill="#0D1B2E"/><text x="555" y="586" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Tier 1</text><text x="555" y="604" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">Arc server</text>
<rect x="650" y="560" width="160" height="60" rx="8" fill="#0D1B2E"/><text x="730" y="586" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Tier 2</text><text x="730" y="604" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">standard workstation</text>
<rect x="825" y="560" width="155" height="60" rx="8" fill="#1E3A66"/><text x="902" y="586" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Kiosk</text><text x="902" y="604" font-family="Consolas, monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">stack</text>
<line x1="640" y1="480" x2="640" y2="518" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-grey)"/>
</svg>
