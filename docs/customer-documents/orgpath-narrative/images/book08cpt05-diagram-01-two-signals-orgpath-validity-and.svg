<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Two signals combine into a four-level</text>
<text x="60" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">risk score that drives remediation</text>

<!-- Axis labels -->
<text x="350" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">OrgPath status</text>
<text x="80" y="320" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" transform="rotate(-90 80 320)">Credential health</text>

<!-- Column headers (teal) -->
<rect x="220" y="160" width="130" height="44" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="285" y="182" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Valid</text>
<rect x="354" y="160" width="130" height="44" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="419" y="182" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Missing</text>
<rect x="488" y="160" width="130" height="44" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="553" y="182" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Invalid</text>
<rect x="622" y="160" width="130" height="44" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.3"/>
<text x="687" y="182" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Archived</text>

<!-- Row headers (navy) -->
<rect x="100" y="212" width="116" height="86" rx="6" fill="#0D1B2E"/>
<text x="158" y="259" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Healthy</text>
<rect x="100" y="302" width="116" height="86" rx="6" fill="#0D1B2E"/>
<text x="158" y="349" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ExpiringSoon</text>
<rect x="100" y="392" width="116" height="86" rx="6" fill="#0D1B2E"/>
<text x="158" y="439" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Expired</text>

<!-- Matrix cells. cols x: Valid 220, Missing 354, Invalid 488, Archived 622 (w130). rows y: Healthy 212, ExpiringSoon 302, Expired 392 (h86) -->
<!-- Row Healthy -->
<rect x="220" y="212" width="130" height="86" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="285" y="259" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Low</text>
<rect x="354" y="212" width="130" height="86" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.2"/>
<text x="419" y="259" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Medium</text>
<rect x="488" y="212" width="130" height="86" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.2"/>
<text x="553" y="259" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">High</text>
<rect x="622" y="212" width="130" height="86" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.2"/>
<text x="687" y="259" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Medium</text>

<!-- Row ExpiringSoon -->
<rect x="220" y="302" width="130" height="86" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.2"/>
<text x="285" y="349" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Medium</text>
<rect x="354" y="302" width="130" height="86" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.2"/>
<text x="419" y="349" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">High</text>
<rect x="488" y="302" width="130" height="86" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.2"/>
<text x="553" y="349" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">High</text>
<rect x="622" y="302" width="130" height="86" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.2"/>
<text x="687" y="349" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">High</text>

<!-- Row Expired -->
<rect x="220" y="392" width="130" height="86" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.2"/>
<text x="285" y="439" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">High</text>
<rect x="354" y="392" width="130" height="86" rx="6" fill="#C0392B" stroke="#C0392B" stroke-width="1.2"/>
<text x="419" y="439" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Critical</text>
<rect x="488" y="392" width="130" height="86" rx="6" fill="#C0392B" stroke="#C0392B" stroke-width="1.2"/>
<text x="553" y="439" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Critical</text>
<rect x="622" y="392" width="130" height="86" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.2"/>
<text x="687" y="439" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">High</text>

<!-- Legend -->
<rect x="100" y="510" width="20" height="20" rx="3" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.2"/>
<text x="128" y="520" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start" dominant-baseline="central">Low</text>
<rect x="200" y="510" width="20" height="20" rx="3" fill="#FBEED2" stroke="#D4A017" stroke-width="1.2"/>
<text x="228" y="520" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start" dominant-baseline="central">Medium / High</text>
<rect x="360" y="510" width="20" height="20" rx="3" fill="#C0392B"/>
<text x="388" y="520" font-family="Arial, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start" dominant-baseline="central">Critical (Missing/Invalid x Expired)</text>

<!-- Remediation routes -->
<!-- Critical -> disable + decommission -->
<line x1="752" y1="435" x2="852" y2="350" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<rect x="855" y="290" width="385" height="120" rx="8" fill="#0D1B2E"/>
<text x="1047" y="320" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.3" fill="#FFFFFF" text-anchor="middle">CRITICAL CELLS</text>
<text x="1047" y="352" font-family="Arial, sans-serif" font-size="13.5" fill="#C7D4E6" text-anchor="middle">Disable the service principal and</text>
<text x="1047" y="374" font-family="Arial, sans-serif" font-size="13.5" fill="#C7D4E6" text-anchor="middle">open a decommissioning inquiry</text>

<!-- High -> ownership triage -->
<line x1="752" y1="260" x2="852" y2="490" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/>
<rect x="855" y="440" width="385" height="100" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/>
<text x="1047" y="470" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.3" fill="#0D1B2E" text-anchor="middle">HIGH CELLS</text>
<text x="1047" y="502" font-family="Arial, sans-serif" font-size="13.5" fill="#33414F" text-anchor="middle">Governance ownership triage</text>
</svg>
