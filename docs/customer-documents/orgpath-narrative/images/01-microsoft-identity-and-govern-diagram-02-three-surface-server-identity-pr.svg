<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">One physical server, three unlinked identity</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">representations</text><rect x="60" y="150" width="376" height="300" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><rect x="60" y="150" width="376" height="12" rx="0" fill="#0D1B2E"/><text x="90" y="208" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="start">Active Directory</text><text x="90" y="242" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#0D1B2E" text-anchor="start">Computer object</text><line x1="90" y1="268" x2="406" y2="268" stroke="#E3E8EF" stroke-width="1"/><text x="90" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#6B7A8D" text-anchor="start">CARRIES</text><text x="90" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">Domain + OU placement, GPO</text><text x="90" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">history, Kerberos identity</text><rect x="468" y="150" width="376" height="300" rx="6" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><rect x="468" y="150" width="376" height="12" rx="0" fill="#1E8C8C"/><text x="498" y="208" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="start">Entra ID</text><text x="498" y="242" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1E8C8C" text-anchor="start">Device object</text><line x1="498" y1="268" x2="814" y2="268" stroke="#E3E8EF" stroke-width="1"/><text 