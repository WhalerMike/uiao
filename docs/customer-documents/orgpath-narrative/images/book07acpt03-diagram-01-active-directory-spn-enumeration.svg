<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">SPN enumeration discovers the SQL estate,</text>
<text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">then each instance is enriched with OrgPath</text>

<!-- AD Global Catalog -->
<rect x="60" y="290" width="230" height="120" rx="8" fill="#0D1B2E"/>
<text x="175" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Active Directory</text>
<text x="175" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Global Catalog</text>
<text x="175" y="384" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#D4A017" text-anchor="middle" dominant-baseline="central">MSSQLSvc/*</text>

<!-- arrow to discovered -->
<line x1="290" y1="350" x2="346" y2="350" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-grey)"/>

<!-- Discovered SQL instances -->
<rect x="350" y="280" width="270" height="140" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.6"/>
<text x="485" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Discovered SQL instances</text>
<text x="485" y="338" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">host account</text>
<text x="485" y="360" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">SPN list · service account</text>
<text x="485" y="382" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">registration state</text>

<!-- arrow to enrichment -->
<line x1="620" y1="350" x2="676" y2="350" stroke="#5A5A5A" stroke-width="2.4" marker-end="url(#ar-grey)"/>

<!-- Enrichment stage (amber) -->
<rect x="680" y="280" width="270" height="140" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.6"/>
<text x="815" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath enrichment</text>
<text x="815" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">resolve each instance via</text>
<text x="815" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">service account hook</text>
<text x="815" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#8A6D10" text-anchor="middle" dominant-baseline="central">preferred over computer account</text>

<!-- branch arrows -->
<line x1="950" y1="320" x2="1006" y2="250" stroke="#1E8C8C" stroke-width="2.4" marker-end="url(#ar-teal)"/>
<line x1="950" y1="380" x2="1006" y2="450" stroke="#C0392B" stroke-width="2.4" marker-end="url(#ar-red)"/>

<!-- Resolved OrgPath (teal) -->
<rect x="1010" y="190" width="230" height="120" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.8"/>
<text x="1125" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">Resolved OrgPath</text>
<text x="1125" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">drives Purview, Fabric,</text>
<text x="1125" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">OneLake, and the</text>
<text x="1125" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">Evidence Bundle</text>

<!-- DRIFT-IDENTITY (red) -->
<rect x="1010" y="390" width="230" height="120" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
<text x="1125" y="420" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">DRIFT-IDENTITY</text>
<text x="1125" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#7B241C" text-anchor="middle" dominant-baseline="central">no verified owner</text>
<text x="1125" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#7B241C" text-anchor="middle" dominant-baseline="central">cannot migrate or mirror</text>

<text x="640" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">Every discovered instance resolves to a verified owner — or is flagged for remediation before migration.</text>
</svg>
