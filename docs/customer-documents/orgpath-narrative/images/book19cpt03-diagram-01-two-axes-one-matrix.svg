<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>

<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Two axes, one matrix &#8212; place is a dimension, not a facet</text>

<!-- light matrix grid: columns x=420..980 (4 x 140), rows y=170..610 (4 x 110) -->
<g stroke="#C7D4E6" stroke-width="1.2">
 <line x1="420" y1="170" x2="980" y2="170"/>
 <line x1="420" y1="280" x2="980" y2="280"/>
 <line x1="420" y1="390" x2="980" y2="390"/>
 <line x1="420" y1="500" x2="980" y2="500"/>
 <line x1="560" y1="170" x2="560" y2="610"/>
 <line x1="700" y1="170" x2="700" y2="610"/>
 <line x1="840" y1="170" x2="840" y2="610"/>
 <line x1="980" y1="170" x2="980" y2="610"/>
</g>

<!-- highlighted matrix cell: Department column x 560..700, ANNAPOLIS-HQ row y 280..390 -->
<rect x="562" y="282" width="136" height="106" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
<text x="630" y="335" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">matrix rule</text>

<!-- horizontal axis: OrgPath -->
<line x1="420" y1="610" x2="1000" y2="610" stroke="#0D1B2E" stroke-width="3" marker-end="url(#ar-navy)"/>
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="middle">
 <text x="490" y="638">Region</text>
 <text x="630" y="638">Department</text>
 <text x="770" y="638">Division</text>
 <text x="910" y="638">Role</text>
</g>
<text x="710" y="676" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle">OrgPath &#8212; organizational facets</text>

<!-- vertical axis: LocPath -->
<line x1="420" y1="610" x2="420" y2="150" stroke="#0D1B2E" stroke-width="3" marker-end="url(#ar-navy)"/>
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F" text-anchor="end">
 <text x="408" y="560">/USA</text>
 <text x="408" y="450">/USA/MD</text>
 <text x="408" y="340">/USA/MD/ANNAPOLIS-HQ</text>
 <text x="408" y="230">/.../BLDG-3</text>
</g>
<text x="190" y="390" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle" transform="rotate(-90 190 390)">LocPath &#8212; place hierarchy</text>

<!-- grey extensionAttribute box, struck through with red X -->
<rect x="1030" y="270" width="210" height="120" rx="8" fill="#EEF1F4" stroke="#5A5A5A" stroke-width="1.8"/>
<text x="1135" y="315" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#33414F" text-anchor="middle" dominant-baseline="central">extensionAttribute</text>
<text x="1135" y="343" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#33414F" text-anchor="middle" dominant-baseline="central">slot 16</text>
<line x1="1038" y1="278" x2="1232" y2="382" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/>
<line x1="1232" y1="278" x2="1038" y2="382" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/>
<text x="1135" y="416" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle">no slot claimed</text>
<text x="1135" y="436" font-size="14" fill="#C0392B" text-anchor="middle">(ADR-102 D5)</text>
</svg>
