<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">Four Defender signals about one user — four</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">identifier systems, no org axis</text><rect x="60" y="160" width="1140" height="70" rx="0" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><rect x="60" y="160" width="10" height="70" rx="0" fill="#0D1B2E"/><text x="95" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="start">Defender for Identity</text><text x="460" y="202" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#33414F" text-anchor="start">Entra object ID + samAccountName</text><text x="1180" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-style="italic" fill="#6B7A8D" text-anchor="end">suspicious LDAP recon</text><rect x="60" y="242" width="1140" height="70" rx="0" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><rect x="60" y="242" width="10" height="70" rx="0" fill="#0D1B2E"/><text x="95" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="start">Conditional Access</text><text x="460" y="284" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#33414F" text-anchor="start">User principal name + correlation ID</text><text x="1180" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-style="italic" fill="#6B7A8D" text-anchor="end">sign-in risk elevation</text><rect x="60" y="324" width="1140" height="70" rx="0" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><rect x="60" y="324" width="10" height="70" rx="0" fill="#0D1B2E"/><text x="95" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="start">Defender for Endpoint</text><text x="460" y="366" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#33414F" text-anchor="start">Entra device ID + DNS name</text><text x="1180" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-style="italic" fill="#6B7A8D" text-anchor="end">workstation alert</text><rect x="60" y="406" width="1140" height="70" rx="0" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/><rect x="60" y="406" width="10" height="70" rx="0" fill="#0D1B2E"/><text x="95" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="start">Defender for Cloud Apps</text><text x="460" y="448" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#33414F" text-anchor="start">UPN + app session ID</text><text x="1180" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-style="italic" fill="#6B7A8D" text-anchor="end">anomalous SharePoint download</text><rect x="60" y="500" width="1140" height="72" rx="0" fill="#F7E2DE"/><rect x="60" y="500" width="10" height="72" rx="0" fill="#C0392B"/><text x="95" y="545" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="start">Correlation is possible. Organizational reasoning is not — none names her division, role, or access tier.</text>
</svg>
