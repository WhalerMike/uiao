<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">The two-front PKI transition — and its</text><text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">revocation tail</text><rect x="60" y="160" width="540" height="150" rx="10" fill="#0D1B2E"/><text x="90" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="start">AD CS</text><text x="90" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#C7D4E6" text-anchor="start">Directory-validated templates · Group Policy</text><text x="90" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#C7D4E6" text-anchor="start">auto-enrollment · reaches domain-joined</text><text x="90" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#C7D4E6" text-anchor="start">machines, users and services.</text><rect x="640" y="160" width="560" height="150" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="670" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="start">MICROSOFT CLOUD PKI</text><text x="670" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">SCEP / PKCS via Intune · reaches Intune-</text><text x="670" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">enrolled devices only — servers and DCOM /</text><text x="670" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33414F" text-anchor="start">CEP-CES clients need extra plumbing.</text><rect x="60" y="360" width="1140" height="200" rx="0" fill="#F7E2DE"/><rect x="60" y="360" width="10" height="200" rx="0" fill="#C0392B"/><text x="90" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" letter-spacing="1" fill="#C0392B" text-anchor="start">REVOCATION OUTLIVES THE CA</text><text x="90" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="start">Every certificate embeds CRL and OCSP URLs that must stay reachable for its full validity —</text><text x="90" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="start">one, two, three years. Decommission the CA early and every relying party's chain validation</text><text x="90" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33414F" text-anchor="start">fails. No native tool inventories every certificate consumer first.</text>
</svg>
