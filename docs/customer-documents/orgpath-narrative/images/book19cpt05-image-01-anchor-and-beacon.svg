<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
 <linearGradient id="sky19c5" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#EAF1FB"/>
  <stop offset="1" stop-color="#CFE0F2"/>
 </linearGradient>
 <linearGradient id="sea19c5" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#CFE0F2"/>
  <stop offset="0.45" stop-color="#EAF1FB"/>
  <stop offset="1" stop-color="#1E3A66"/>
 </linearGradient>
 <radialGradient id="beaconGlow19c5" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#D7F2EE" stop-opacity="0.95"/>
  <stop offset="1" stop-color="#D7F2EE" stop-opacity="0"/>
 </radialGradient>
</defs>
<!-- sky above the horizon -->
<rect x="0" y="0" width="1280" height="300" fill="url(#sky19c5)"/>
<!-- water below the horizon, ice fading to navy depth -->
<rect x="0" y="300" width="1280" height="420" fill="url(#sea19c5)"/>
<line x1="0" y1="300" x2="1280" y2="300" stroke="#6B7A8D" stroke-width="1" opacity="0.4"/>
<!-- gentle surface ripples -->
<g stroke="#EAF1FB" stroke-width="2" fill="none" opacity="0.6">
 <path d="M120,316 C170,310 220,310 270,316"/>
 <path d="M520,322 C570,316 620,316 670,322"/>
 <path d="M1040,318 C1090,312 1140,312 1190,318"/>
</g>
<!-- anchor halo so the navy anchor reads against deep water -->
<g stroke="#EAF1FB" stroke-linecap="round" fill="none" opacity="0.35">
 <circle cx="480" cy="452" r="18" stroke-width="17"/>
 <line x1="480" y1="470" x2="480" y2="615" stroke-width="22"/>
 <line x1="425" y1="495" x2="535" y2="495" stroke-width="19"/>
 <path d="M395,565 C395,628 435,650 480,650 C525,650 565,628 565,565" stroke-width="23"/>
</g>
<!-- taut chain from above down to the anchor ring -->
<line x1="150" y1="305" x2="471" y2="441" stroke="#0D1B2E" stroke-width="8" stroke-linecap="round" stroke-dasharray="13 9"/>
<!-- heavy navy anchor -->
<g stroke="#0D1B2E" stroke-linecap="round" fill="none">
 <circle cx="480" cy="452" r="18" stroke-width="9"/>
 <line x1="480" y1="470" x2="480" y2="615" stroke-width="14"/>
 <line x1="425" y1="495" x2="535" y2="495" stroke-width="11"/>
 <path d="M395,565 C395,628 435,650 480,650 C525,650 565,628 565,565" stroke-width="15"/>
</g>
<path d="M395,565 L373,544 L416,538 Z" fill="#0D1B2E"/>
<path d="M565,565 L587,544 L544,538 Z" fill="#0D1B2E"/>
<text x="615" y="600" font-size="22" fill="#EAF1FB">record</text>
<!-- drifting buoy with teal beacon -->
<ellipse cx="822" cy="303" rx="62" ry="9" fill="#EAF1FB" opacity="0.55"/>
<g transform="rotate(8 820 290)">
 <path d="M788,302 L852,302 L840,248 L800,248 Z" fill="#1E3A66" stroke="#0D1B2E" stroke-width="2"/>
 <rect x="800" y="260" width="40" height="11" fill="#EAF1FB"/>
 <rect x="816" y="210" width="8" height="40" fill="#5A5A5A"/>
 <circle cx="820" cy="200" r="36" fill="url(#beaconGlow19c5)"/>
 <circle cx="820" cy="200" r="11" fill="#1E8C8C" stroke="#0D1B2E" stroke-width="1.5"/>
 <circle cx="820" cy="200" r="26" fill="none" stroke="#1E8C8C" stroke-width="2.5" opacity="0.75"/>
 <circle cx="820" cy="200" r="44" fill="none" stroke="#1E8C8C" stroke-width="2" opacity="0.45"/>
 <circle cx="820" cy="200" r="62" fill="none" stroke="#1E8C8C" stroke-width="1.5" opacity="0.25"/>
</g>
<text x="935" y="206" font-size="22" fill="#5A5A5A">signal</text>
<!-- thin red barred connector: the buoy's drift cannot move the anchor -->
<line x1="812" y1="312" x2="692" y2="362" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="10 7"/>
<line x1="624" y1="390" x2="504" y2="440" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="10 7"/>
<circle cx="658" cy="376" r="20" fill="#FFFFFF" stroke="#C0392B" stroke-width="3.5"/>
<line x1="644" y1="362" x2="672" y2="390" stroke="#C0392B" stroke-width="3.5"/>
</svg>
