<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
  </defs>

  <text x="60" y="52" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">The Credential Journey — Snowflake Authentication Migration</text>
  <text x="60" y="78" font-size="16" fill="#5A5A5A">Password → Key Pair → Federation: three distinct points on a credential-lifecycle narrative, not a security scale</text>

  <!-- Phase arrow spine -->
  <line x1="90" y1="290" x2="1190" y2="290" stroke="#DDDDDD" stroke-width="3"/>

  <!-- Phase A: Password (current / being deprecated) -->
  <rect x="60" y="110" width="260" height="320" rx="14" fill="#FDF3F3" stroke="#C0392B" stroke-width="2"/>
  <text x="190" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0392B">Phase 0</text>
  <text x="190" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Password</text>
  <text x="190" y="184" text-anchor="middle" font-size="12" fill="#C0392B">DEPRECATED</text>

  <rect x="80" y="196" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1"/>
  <text x="190" y="218" text-anchor="middle" font-size="12" fill="#5A5A5A">Long-lived shared secret.</text>
  <text x="190" y="236" text-anchor="middle" font-size="12" fill="#5A5A5A">Single-factor for service</text>
  <text x="190" y="254" text-anchor="middle" font-size="12" fill="#5A5A5A">accounts, pipelines, dbt jobs.</text>
  <text x="190" y="272" text-anchor="middle" font-size="12" fill="#C0392B">Blocked: Aug 2025+</text>

  <text x="190" y="320" text-anchor="middle" font-size="12" fill="#5A5A5A">UIAO view:</text>
  <text x="190" y="338" text-anchor="middle" font-size="12" fill="#C0392B">Shared secret — must</text>
  <text x="190" y="356" text-anchor="middle" font-size="12" fill="#C0392B">be eliminated, not</text>
  <text x="190" y="374" text-anchor="middle" font-size="12" fill="#C0392B">merely rotated</text>
  <text x="190" y="410" text-anchor="middle" font-size="13" fill="#0D1B2E" font-style="italic">No drift class</text>

  <!-- Arrow 0→A -->
  <line x1="320" y1="270" x2="360" y2="270" stroke="#D4A017" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <text x="340" y="258" text-anchor="middle" font-size="10" fill="#D4A017">Snowflake</text>
  <text x="340" y="283" text-anchor="middle" font-size="10" fill="#D4A017">deadline</text>

  <!-- Phase A: Key Pair -->
  <rect x="360" y="110" width="260" height="320" rx="14" fill="#FDF8EC" stroke="#D4A017" stroke-width="2"/>
  <text x="490" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#D4A017">Phase A</text>
  <text x="490" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">RSA Key Pair</text>
  <text x="490" y="184" text-anchor="middle" font-size="12" fill="#D4A017">ENDORSED AS BRIDGE</text>

  <rect x="380" y="196" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="1"/>
  <text x="490" y="218" text-anchor="middle" font-size="12" fill="#5A5A5A">RSA-2048/4096 private key.</text>
  <text x="490" y="236" text-anchor="middle" font-size="12" fill="#5A5A5A">No password at all —</text>
  <text x="490" y="254" text-anchor="middle" font-size="12" fill="#5A5A5A">Snowflake-compliant landing.</text>
  <text x="490" y="272" text-anchor="middle" font-size="12" fill="#1E8C8C">Meets the Snowflake deadline</text>

  <text x="490" y="320" text-anchor="middle" font-size="12" fill="#5A5A5A">UIAO view:</text>
  <text x="490" y="338" text-anchor="middle" font-size="12" fill="#D4A017">Stored credential — still a</text>
  <text x="490" y="356" text-anchor="middle" font-size="12" fill="#D4A017">dated exception. Requires</text>
  <text x="490" y="374" text-anchor="middle" font-size="12" fill="#D4A017">rotation, inventory, and</text>
  <text x="490" y="392" text-anchor="middle" font-size="12" fill="#D4A017">compensating controls</text>
  <text x="490" y="412" text-anchor="middle" font-size="12" fill="#D4A017" font-style="italic">DRIFT-AUTHZ if unrotated</text>

  <!-- Arrow A→B -->
  <line x1="620" y1="270" x2="660" y2="270" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <text x="640" y="258" text-anchor="middle" font-size="10" fill="#1E8C8C">UIAO</text>
  <text x="640" y="283" text-anchor="middle" font-size="10" fill="#1E8C8C">goal</text>

  <!-- Phase B: Federation -->
  <rect x="660" y="110" width="300" height="320" rx="14" fill="#E6F7F2" stroke="#1E8C8C" stroke-width="2"/>
  <text x="810" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E8C8C">Phase B</text>
  <text x="810" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">IdP Federation (SAML/OIDC)</text>
  <text x="810" y="184" text-anchor="middle" font-size="12" fill="#1E8C8C">TARGET STEADY STATE</text>

  <rect x="680" y="196" width="260" height="80" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1"/>
  <text x="810" y="218" text-anchor="middle" font-size="12" fill="#5A5A5A">Entra / Okta → Snowflake SAML.</text>
  <text x="810" y="236" text-anchor="middle" font-size="12" fill="#5A5A5A">No long-lived secret stored</text>
  <text x="810" y="254" text-anchor="middle" font-size="12" fill="#5A5A5A">anywhere. Human+service.</text>
  <text x="810" y="272" text-anchor="middle" font-size="12" fill="#1E8C8C">Eliminates the stored credential</text>

  <text x="810" y="320" text-anchor="middle" font-size="12" fill="#5A5A5A">UIAO view:</text>
  <text x="810" y="338" text-anchor="middle" font-size="12" fill="#1E8C8C">Credential-free steady state.</text>
  <text x="810" y="356" text-anchor="middle" font-size="12" fill="#1E8C8C">Facets (Dept, Role) govern</text>
  <text x="810" y="374" text-anchor="middle" font-size="12" fill="#1E8C8C">which Snowflake roles are</text>
  <text x="810" y="392" text-anchor="middle" font-size="12" fill="#1E8C8C">reachable via OrgPath</text>
  <text x="810" y="412" text-anchor="middle" font-size="12" fill="#1E8C8C" font-style="italic">Grants become drift events</text>

  <!-- OrgPath box -->
  <rect x="1000" y="110" width="220" height="320" rx="14" fill="#0D1B2E"/>
  <text x="1110" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E8C8C">OrgPath Layer</text>
  <text x="1110" y="164" text-anchor="middle" font-size="13" fill="#FFFFFF">Access-authority dimension</text>

  <rect x="1016" y="178" width="188" height="52" rx="8" fill="#1A3A52"/>
  <text x="1110" y="200" text-anchor="middle" font-size="12" fill="#9BB8CC">WHO may reach</text>
  <text x="1110" y="218" text-anchor="middle" font-size="12" fill="#9BB8CC">WHICH Snowflake roles</text>

  <rect x="1016" y="242" width="188" height="52" rx="8" fill="#1A3A52"/>
  <text x="1110" y="264" text-anchor="middle" font-size="12" fill="#9BB8CC">Rule computed from org</text>
  <text x="1110" y="282" text-anchor="middle" font-size="12" fill="#9BB8CC">structure, not ticket queue</text>

  <rect x="1016" y="306" width="188" height="52" rx="8" fill="#1A3A52"/>
  <text x="1110" y="328" text-anchor="middle" font-size="12" fill="#9BB8CC">Stray grant = drift event</text>
  <text x="1110" y="346" text-anchor="middle" font-size="12" fill="#9BB8CC">(DRIFT-AUTHZ class)</text>

  <text x="1110" y="390" text-anchor="middle" font-size="12" fill="#9BB8CC">Dept=Finance AND</text>
  <text x="1110" y="408" text-anchor="middle" font-size="12" fill="#9BB8CC">Role=Analyst →</text>
  <text x="1110" y="426" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1E8C8C">FINANCE_ANALYST_WH</text>

  <!-- Bottom summary -->
  <rect x="60" y="460" width="1160" height="92" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="640" y="488" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Three narratives — one movement</text>
  <text x="60" y="510" font-size="13" fill="#5A5A5A">  Snowflake forces the credential change (password → key pair, on a published deadline).</text>
  <text x="60" y="530" font-size="13" fill="#5A5A5A">  UIAO governs what the credential becomes (endorses key pair as Phase A; targets federation as Phase B — credential-free steady state).</text>
  <text x="60" y="550" font-size="13" fill="#5A5A5A">  OrgPath governs who the credential is for (Dept+Role facet predicate → Snowflake role mapping, continuously evaluated, stray grants drift).</text>

  <rect x="60" y="580" width="1160" height="52" rx="10" fill="#FDF8EC" stroke="#D4A017" stroke-width="1.5"/>
  <text x="640" y="600" text-anchor="middle" font-size="13" font-weight="bold" fill="#D4A017">Status disclaimer</text>
  <text x="640" y="622" text-anchor="middle" font-size="13" fill="#5A5A5A">Snowflake is outside the current GCC-Moderate boundary (ADR-033) — this is architecture comparison, not a shipped adapter. Patterns apply to this class of SaaS credential problem.</text>
</svg>
