<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="60" y="52" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Three Worked Stacks — OrgPath Composability in Practice</text>
  <text x="60" y="78" font-size="16" fill="#5A5A5A">Pick the stack that matches your IdP estate · capabilities are additive · OrgPath core is unchanged</text>

  <!-- Stack 1: Open-source-first -->
  <rect x="60" y="108" width="360" height="490" rx="16" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="60" y="108" width="360" height="56" rx="16" fill="#0D1B2E"/>
  <rect x="60" y="140" width="360" height="24" fill="#0D1B2E"/>
  <text x="240" y="142" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Stack 1 — Open-Source-First</text>
  <text x="240" y="158" text-anchor="middle" font-size="13" fill="#9BB8CC">Apache-2.0 top to bottom · no commercial IdP required</text>

  <rect x="80" y="176" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="240" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Keycloak (identity)</text>
  <text x="240" y="214" text-anchor="middle" font-size="12" fill="#5A5A5A">ADR-113 · keycloak_transport · Proposed</text>

  <rect x="80" y="234" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="240" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Generic LDAP / FreeIPA (legacy bridge)</text>
  <text x="240" y="272" text-anchor="middle" font-size="12" fill="#5A5A5A">ldap_transport · Proposed</text>

  <rect x="80" y="292" width="320" height="48" rx="8" fill="#1E8C8C"/>
  <text x="240" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Drift detection (DRIFT-IDENTITY)</text>
  <text x="240" y="330" text-anchor="middle" font-size="12" fill="#CCEEE8">Active on any profile</text>

  <rect x="80" y="350" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="240" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Active Governance Directory</text>
  <text x="240" y="388" text-anchor="middle" font-size="12" fill="#5A5A5A">In-path LDAP projection · ADR-100 · Proposed</text>

  <rect x="80" y="410" width="320" height="36" rx="8" fill="#FDF3F3" stroke="#C0392B" stroke-width="1"/>
  <text x="240" y="432" text-anchor="middle" font-size="12" fill="#C0392B">Partner governance — OFF (no SailPoint)</text>

  <rect x="80" y="458" width="320" height="36" rx="8" fill="#FDF3F3" stroke="#C0392B" stroke-width="1"/>
  <text x="240" y="480" text-anchor="middle" font-size="12" fill="#C0392B">AI-system governance — OFF</text>

  <rect x="80" y="512" width="320" height="68" rx="8" fill="#0D1B2E"/>
  <text x="240" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8C8C">Best for</text>
  <text x="240" y="552" text-anchor="middle" font-size="12" fill="#FFFFFF">Open-source deployments; proves</text>
  <text x="240" y="568" text-anchor="middle" font-size="12" fill="#FFFFFF">IdP-neutral claim with zero commercial lock-in</text>

  <!-- Stack 2: Microsoft-native + partners -->
  <rect x="460" y="108" width="360" height="490" rx="16" fill="#E6F7F2" stroke="#1E8C8C" stroke-width="2.5"/>
  <rect x="460" y="108" width="360" height="56" rx="16" fill="#1E8C8C"/>
  <rect x="460" y="140" width="360" height="24" fill="#1E8C8C"/>
  <text x="640" y="142" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Stack 2 — Microsoft-Native + Partners</text>
  <text x="640" y="158" text-anchor="middle" font-size="13" fill="#CCEEE8">Most mature today · only active write path</text>

  <rect x="480" y="176" width="320" height="48" rx="8" fill="#1E8C8C"/>
  <text x="640" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Microsoft Entra (identity + device)</text>
  <text x="640" y="214" text-anchor="middle" font-size="12" fill="#CCEEE8">ADR-098 · graph/arm transport · ACTIVE</text>

  <rect x="480" y="234" width="320" height="48" rx="8" fill="#1E8C8C"/>
  <text x="640" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Drift detection (DRIFT-IDENTITY)</text>
  <text x="640" y="272" text-anchor="middle" font-size="12" fill="#CCEEE8">ACTIVE</text>

  <rect x="480" y="292" width="320" height="48" rx="8" fill="#1E8C8C"/>
  <text x="640" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Device plane (Arc / Intune)</text>
  <text x="640" y="330" text-anchor="middle" font-size="12" fill="#CCEEE8">ADR-038 · ACTIVE</text>

  <rect x="480" y="350" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="640" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">SailPoint NERM (partner / non-employee)</text>
  <text x="640" y="388" text-anchor="middle" font-size="12" fill="#5A5A5A">ADR-059 · FedRAMP-Mod AWS GovCloud · Reserved</text>

  <rect x="480" y="408" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="640" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">AI-system governance (M-25-21)</text>
  <text x="640" y="446" text-anchor="middle" font-size="12" fill="#5A5A5A">UIAO_196 / ADR-112 · Proposed</text>

  <rect x="480" y="512" width="320" height="68" rx="8" fill="#0D1B2E"/>
  <text x="640" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8C8C">Best for</text>
  <text x="640" y="552" text-anchor="middle" font-size="12" fill="#FFFFFF">Federal agencies on M365 GCC — largest deployed</text>
  <text x="640" y="568" text-anchor="middle" font-size="12" fill="#FFFFFF">surface; partner + AI governance add-on ready</text>

  <!-- Stack 3: Multi-cloud enterprise -->
  <rect x="860" y="108" width="360" height="490" rx="16" fill="#F8F4E8" stroke="#D4A017" stroke-width="2"/>
  <rect x="860" y="108" width="360" height="56" rx="16" fill="#D4A017"/>
  <rect x="860" y="140" width="360" height="24" fill="#D4A017"/>
  <text x="1040" y="142" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Stack 3 — Multi-Cloud Enterprise</text>
  <text x="1040" y="158" text-anchor="middle" font-size="13" fill="#0D1B2E">Stage-2 transports landing · designed surface</text>

  <rect x="880" y="176" width="320" height="48" rx="8" fill="#1E8C8C"/>
  <text x="1040" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Entra + Okta + PingOne (identity)</text>
  <text x="1040" y="214" text-anchor="middle" font-size="12" fill="#CCEEE8">ADR-113 · Stage 1 transports</text>

  <rect x="880" y="234" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.5"/>
  <text x="1040" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">AWS IAM Identity Center (workload)</text>
  <text x="1040" y="272" text-anchor="middle" font-size="12" fill="#5A5A5A">Profile-only — transport Stage 2</text>

  <rect x="880" y="292" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.5"/>
  <text x="1040" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">GCP Cloud Identity (workload)</text>
  <text x="1040" y="330" text-anchor="middle" font-size="12" fill="#5A5A5A">Profile-only — transport Stage 2</text>

  <rect x="880" y="350" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.5"/>
  <text x="1040" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">VMware NSX-T (enforcement)</text>
  <text x="1040" y="388" text-anchor="middle" font-size="12" fill="#5A5A5A">Profile-only — transport Stage 2</text>

  <rect x="880" y="408" width="320" height="48" rx="8" fill="#1E8C8C"/>
  <text x="1040" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">OrgPath — single policy subject</text>
  <text x="1040" y="446" text-anchor="middle" font-size="12" fill="#CCEEE8">across the whole estate · no re-platforming</text>

  <rect x="880" y="512" width="320" height="68" rx="8" fill="#0D1B2E"/>
  <text x="1040" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8C8C">Best for</text>
  <text x="1040" y="552" text-anchor="middle" font-size="12" fill="#FFFFFF">Large enterprises spanning multiple clouds —</text>
  <text x="1040" y="568" text-anchor="middle" font-size="12" fill="#FFFFFF">designed surface; wait for Stage-2 transport landing</text>

  <!-- Bottom note -->
  <text x="640" y="628" text-anchor="middle" font-size="13" fill="#5A5A5A" font-style="italic">Deployed surface today = Stack 2 (Entra active write path). Stack 1 and 3 are fully designed and unit-tested; await live-tenant conformance before promotion to active.</text>
  <text x="640" y="650" text-anchor="middle" font-size="13" fill="#0D1B2E" font-style="italic">Architecture is composable — deployed surface is narrower than designed surface. Every cell is labeled so the difference is never hidden.</text>
</svg>
