<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="60" y="52" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">The Fragmented DNS Landscape</text>
  <text x="60" y="78" font-size="16" fill="#5A5A5A">Every major platform ships its own independent DNS service — no single team manages end-to-end</text>

  <!-- Legend -->
  <rect x="60" y="96" width="16" height="16" fill="#0D1B2E" rx="3"/>
  <text x="82" y="109" font-size="13" fill="#0D1B2E">On-premises / AD-backed DNS</text>
  <rect x="300" y="96" width="16" height="16" fill="#1E8C8C" rx="3"/>
  <text x="322" y="109" font-size="13" fill="#0D1B2E">Cloud-native DNS</text>
  <rect x="500" y="96" width="16" height="16" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1" rx="3"/>
  <text x="522" y="109" font-size="13" fill="#0D1B2E">Unified DDI (target state)</text>
  <rect x="740" y="96" width="16" height="16" fill="#C0392B" rx="3"/>
  <text x="762" y="109" font-size="13" fill="#C0392B">Split-brain failure zone</text>

  <!-- Row 1: On-premises island -->
  <rect x="60" y="130" width="280" height="140" rx="12" fill="#0D1B2E"/>
  <text x="200" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">On-Premises / AD DNS</text>
  <text x="200" y="178" text-anchor="middle" font-size="12" fill="#9BB8CC">Windows Server DNS</text>
  <text x="200" y="196" text-anchor="middle" font-size="12" fill="#9BB8CC">_ldap._tcp SRV records</text>
  <text x="200" y="214" text-anchor="middle" font-size="12" fill="#9BB8CC">Kerberos SRV targets</text>
  <text x="200" y="232" text-anchor="middle" font-size="12" fill="#9BB8CC">RFC 2136 dynamic updates</text>
  <text x="200" y="254" text-anchor="middle" font-size="11" fill="#D4A017" font-style="italic">Deprecating with AD migration</text>

  <!-- Row 1: Azure DNS -->
  <rect x="380" y="130" width="240" height="140" rx="12" fill="#1E8C8C"/>
  <text x="500" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Azure DNS</text>
  <text x="500" y="178" text-anchor="middle" font-size="12" fill="#CCEEE8">Private DNS Zones</text>
  <text x="500" y="196" text-anchor="middle" font-size="12" fill="#CCEEE8">Public Zone delegation</text>
  <text x="500" y="214" text-anchor="middle" font-size="12" fill="#CCEEE8">168.63.129.16 resolver</text>
  <text x="500" y="232" text-anchor="middle" font-size="12" fill="#CCEEE8">Private Resolver (DoH)</text>

  <!-- Row 1: AWS Route53 -->
  <rect x="660" y="130" width="240" height="140" rx="12" fill="#1E8C8C"/>
  <text x="780" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">AWS Route 53</text>
  <text x="780" y="178" text-anchor="middle" font-size="12" fill="#CCEEE8">Private Hosted Zones</text>
  <text x="780" y="196" text-anchor="middle" font-size="12" fill="#CCEEE8">VPC resolver 169.254.169.253</text>
  <text x="780" y="214" text-anchor="middle" font-size="12" fill="#CCEEE8">Resolver endpoints (inbound/out)</text>
  <text x="780" y="232" text-anchor="middle" font-size="12" fill="#CCEEE8">Resolver rules / DNSSEC</text>

  <!-- Row 1: GCP Cloud DNS -->
  <rect x="940" y="130" width="280" height="140" rx="12" fill="#1E8C8C"/>
  <text x="1080" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">GCP Cloud DNS</text>
  <text x="1080" y="178" text-anchor="middle" font-size="12" fill="#CCEEE8">Private Managed Zones</text>
  <text x="1080" y="196" text-anchor="middle" font-size="12" fill="#CCEEE8">Peering / forwarding zones</text>
  <text x="1080" y="214" text-anchor="middle" font-size="12" fill="#CCEEE8">DNSSEC policy per zone</text>
  <text x="1080" y="232" text-anchor="middle" font-size="12" fill="#CCEEE8">Inbound DNS policy</text>

  <!-- Split-brain explosion callout -->
  <rect x="60" y="300" width="1160" height="100" rx="12" fill="#FDF3F3" stroke="#C0392B" stroke-width="2"/>
  <text x="640" y="325" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">Split-Brain DNS — What Fragmentation Produces</text>
  <text x="200" y="350" text-anchor="middle" font-size="13" fill="#5A5A5A">Private IP resolution</text>
  <text x="200" y="368" text-anchor="middle" font-size="13" fill="#C0392B">breaks cross-cloud</text>
  <text x="500" y="350" text-anchor="middle" font-size="13" fill="#5A5A5A">SaaS endpoint selection</text>
  <text x="500" y="368" text-anchor="middle" font-size="13" fill="#C0392B">returns wrong region</text>
  <text x="800" y="350" text-anchor="middle" font-size="13" fill="#5A5A5A">Certificate OCSP / TLSA</text>
  <text x="800" y="368" text-anchor="middle" font-size="13" fill="#C0392B">validation fails silently</text>
  <text x="1080" y="350" text-anchor="middle" font-size="13" fill="#5A5A5A">Security policy enforcement</text>
  <text x="1080" y="368" text-anchor="middle" font-size="13" fill="#C0392B">diverges by origin</text>
  <line x1="350" y1="310" x2="350" y2="390" stroke="#C0392B" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="640" y1="310" x2="640" y2="390" stroke="#C0392B" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="930" y1="310" x2="930" y2="390" stroke="#C0392B" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Unified DDI target state -->
  <rect x="60" y="430" width="1160" height="170" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Unified DDI — Target State (Infoblox / equivalent)</text>

  <rect x="90" y="470" width="220" height="108" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="200" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Single Management Plane</text>
  <text x="200" y="512" text-anchor="middle" font-size="12" fill="#5A5A5A">One console governs all</text>
  <text x="200" y="530" text-anchor="middle" font-size="12" fill="#5A5A5A">DNS/DHCP/IPAM zones</text>
  <text x="200" y="548" text-anchor="middle" font-size="12" fill="#5A5A5A">across clouds + on-prem</text>
  <text x="200" y="566" text-anchor="middle" font-size="11" fill="#1E8C8C">Eliminates split-brain</text>

  <rect x="340" y="470" width="220" height="108" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="450" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">IPAM Consistency</text>
  <text x="450" y="512" text-anchor="middle" font-size="12" fill="#5A5A5A">Private address space</text>
  <text x="450" y="530" text-anchor="middle" font-size="12" fill="#5A5A5A">deduplication and allocation</text>
  <text x="450" y="548" text-anchor="middle" font-size="12" fill="#5A5A5A">across all environments</text>
  <text x="450" y="566" text-anchor="middle" font-size="11" fill="#1E8C8C">No overlapping RFC 1918</text>

  <rect x="590" y="470" width="220" height="108" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="700" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">DNS Security</text>
  <text x="700" y="512" text-anchor="middle" font-size="12" fill="#5A5A5A">DNSSEC validation,</text>
  <text x="700" y="530" text-anchor="middle" font-size="12" fill="#5A5A5A">RPZ (response policy zones),</text>
  <text x="700" y="548" text-anchor="middle" font-size="12" fill="#5A5A5A">threat intel blocking</text>
  <text x="700" y="566" text-anchor="middle" font-size="11" fill="#1E8C8C">Consistent enforcement posture</text>

  <rect x="840" y="470" width="220" height="108" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="950" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">AD Migration Bridge</text>
  <text x="950" y="512" text-anchor="middle" font-size="12" fill="#5A5A5A">Preserves SRV records</text>
  <text x="950" y="530" text-anchor="middle" font-size="12" fill="#5A5A5A">AD abandoned; orphan</text>
  <text x="950" y="548" text-anchor="middle" font-size="12" fill="#5A5A5A">detection + migration path</text>
  <text x="950" y="566" text-anchor="middle" font-size="11" fill="#1E8C8C">Prevents DNS orphaning</text>

  <rect x="1090" y="470" width="108" height="108" rx="8" fill="#0D1B2E"/>
  <text x="1144" y="507" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8C8C">15+</text>
  <text x="1144" y="525" text-anchor="middle" font-size="11" fill="#FFFFFF">relevant</text>
  <text x="1144" y="543" text-anchor="middle" font-size="11" fill="#FFFFFF">record</text>
  <text x="1144" y="561" text-anchor="middle" font-size="11" fill="#FFFFFF">types</text>

  <text x="640" y="650" text-anchor="middle" font-size="13" fill="#5A5A5A" font-style="italic">DNS is no longer a commodity utility — it is the security enforcement plane, PKI trust chain, and application surface definition of the hybrid enterprise</text>
</svg>
