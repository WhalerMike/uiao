<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · amber #D4A017 (severity) · red #C0392B -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- jumbled overlapping regional cylinders -->
  <g opacity="0.9">
    <g transform="translate(300,210)" opacity="0.85"><ellipse cx="55" cy="14" rx="55" ry="14" fill="#5A5A5A"/><rect x="0" y="14" width="110" height="84" fill="#5A5A5A"/><ellipse cx="55" cy="98" rx="55" ry="14" fill="#4a4a4a"/></g>
    <g transform="translate(380,260)" opacity="0.85"><ellipse cx="55" cy="14" rx="55" ry="14" fill="#1E8C8C"/><rect x="0" y="14" width="110" height="84" fill="#1E8C8C"/><ellipse cx="55" cy="98" rx="55" ry="14" fill="#157272"/></g>
    <g transform="translate(300,330)" opacity="0.85"><ellipse cx="55" cy="14" rx="55" ry="14" fill="#1E8C8C"/><rect x="0" y="14" width="110" height="84" fill="#1E8C8C"/><ellipse cx="55" cy="98" rx="55" ry="14" fill="#157272"/></g>
    <g transform="translate(430,350)" opacity="0.85"><ellipse cx="55" cy="14" rx="55" ry="14" fill="#5A5A5A"/><rect x="0" y="14" width="110" height="84" fill="#5A5A5A"/><ellipse cx="55" cy="98" rx="55" ry="14" fill="#4a4a4a"/></g>
    <g transform="translate(360,410)" opacity="0.85"><ellipse cx="55" cy="14" rx="55" ry="14" fill="#1E8C8C"/><rect x="0" y="14" width="110" height="84" fill="#1E8C8C"/><ellipse cx="55" cy="98" rx="55" ry="14" fill="#157272"/></g>
    <g transform="translate(250,400)" opacity="0.85"><ellipse cx="55" cy="14" rx="55" ry="14" fill="#5A5A5A"/><rect x="0" y="14" width="110" height="84" fill="#5A5A5A"/><ellipse cx="55" cy="98" rx="55" ry="14" fill="#4a4a4a"/></g>
  </g>
  <text x="400" y="555" text-anchor="middle" font-size="17" font-weight="bold" fill="#33414F">Twelve divergent regional truths</text>

  <!-- amber warning diamonds (severity use) + labels -->
  <g font-size="15" font-weight="bold" fill="#0D1B2E">
    <g transform="translate(600,230)"><rect x="-16" y="-16" width="32" height="32" rx="4" transform="rotate(45)" fill="#D4A017"/><text x="0" y="6" text-anchor="middle" font-size="20" fill="#0D1B2E">!</text></g>
    <text x="628" y="236">duplicate payment</text>
    <g transform="translate(640,300)"><rect x="-16" y="-16" width="32" height="32" rx="4" transform="rotate(45)" fill="#D4A017"/><text x="0" y="6" text-anchor="middle" font-size="20" fill="#0D1B2E">!</text></g>
    <text x="668" y="306">stale record</text>
    <g transform="translate(600,370)"><rect x="-16" y="-16" width="32" height="32" rx="4" transform="rotate(45)" fill="#D4A017"/><text x="0" y="6" text-anchor="middle" font-size="20" fill="#0D1B2E">!</text></g>
    <text x="628" y="376">unreconciled</text>
    <g transform="translate(650,440)"><rect x="-16" y="-16" width="32" height="32" rx="4" transform="rotate(45)" fill="#D4A017"/><text x="0" y="6" text-anchor="middle" font-size="20" fill="#0D1B2E">!</text></g>
    <text x="678" y="446">undetected divergence</text>
  </g>

  <!-- magnifying glass with red strike -->
  <g>
    <circle cx="960" cy="320" r="85" fill="none" stroke="#0D1B2E" stroke-width="6"/>
    <line x1="1020" y1="380" x2="1090" y2="450" stroke="#0D1B2E" stroke-width="10" stroke-linecap="round"/>
    <line x1="905" y1="265" x2="1015" y2="375" stroke="#C0392B" stroke-width="5"/>
  </g>
  <text x="960" y="470" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">No authoritative version</text>
  <text x="960" y="492" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">to reconcile to</text>

  <!-- bottom band -->
  <rect x="60" y="618" width="1160" height="72" rx="10" fill="#0D1B2E"/>
  <text x="640" y="650" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">The system could DO things.</text>
  <text x="640" y="676" text-anchor="middle" font-size="20" font-weight="bold" fill="#D7F2EE">It could no longer VERIFY things.</text>
</svg>
