<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="58" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Three Moves That Most Raise Win Probability</text>
  <text x="60" y="86" font-size="16" fill="#5A5A5A">Federal AI-governance solicitation · competitive for pilot-oriented, forward-leaning procurements</text>

  <!-- Move 1 -->
  <rect x="60" y="120" width="340" height="380" rx="14" fill="#0D1B2E"/>
  <text x="230" y="158" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E8C8C">Move 1</text>
  <text x="230" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Lead with deployed core,</text>
  <text x="230" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">stage the rest honestly</text>

  <rect x="82" y="220" width="296" height="56" rx="8" fill="#1E8C8C"/>
  <text x="230" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Demo live:</text>
  <text x="230" y="262" text-anchor="middle" font-size="13" fill="#CCEEE8">Entra facet stamping + drift + M-25-21-as-IAM</text>

  <rect x="82" y="286" width="296" height="70" rx="8" fill="#1A3A52"/>
  <text x="230" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#9BB8CC">Present as labeled roadmap:</text>
  <text x="230" y="328" text-anchor="middle" font-size="12" fill="#9BB8CC">AI scanner · SailPoint · multi-cloud</text>
  <text x="230" y="346" text-anchor="middle" font-size="12" fill="#9BB8CC">composability matrix as evidence</text>

  <text x="230" y="390" text-anchor="middle" font-size="13" fill="#9BB8CC">Credibility beats over-claiming</text>
  <text x="230" y="410" text-anchor="middle" font-size="13" fill="#9BB8CC">with federal evaluators</text>

  <rect x="82" y="428" width="296" height="52" rx="8" fill="#EAF1FB"/>
  <text x="230" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Addresses:</text>
  <text x="230" y="468" text-anchor="middle" font-size="12" fill="#5A5A5A">Deployed-at-scale evidence gap</text>

  <!-- Arrow 1→2 -->
  <line x1="400" y1="310" x2="438" y2="310" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>

  <!-- Move 2 -->
  <rect x="440" y="120" width="340" height="380" rx="14" fill="#0D1B2E"/>
  <text x="610" y="158" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E8C8C">Move 2</text>
  <text x="610" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Resolve the authorization</text>
  <text x="610" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">story explicitly</text>

  <rect x="462" y="220" width="296" height="56" rx="8" fill="#1E8C8C"/>
  <text x="610" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">State up front:</text>
  <text x="610" y="262" text-anchor="middle" font-size="13" fill="#CCEEE8">UIAO operates inside customer boundary</text>

  <rect x="462" y="286" width="296" height="70" rx="8" fill="#1A3A52"/>
  <text x="610" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#9BB8CC">Commercial dependency:</text>
  <text x="610" y="328" text-anchor="middle" font-size="12" fill="#9BB8CC">SailPoint NERM = FedRAMP-Moderate</text>
  <text x="610" y="346" text-anchor="middle" font-size="12" fill="#9BB8CC">on AWS GovCloud (ADR-059)</text>

  <text x="610" y="390" text-anchor="middle" font-size="13" fill="#9BB8CC">Pre-empt "is the platform</text>
  <text x="610" y="410" text-anchor="middle" font-size="13" fill="#9BB8CC">authorized?" before evaluation</text>

  <rect x="462" y="428" width="296" height="52" rx="8" fill="#EAF1FB"/>
  <text x="610" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Addresses:</text>
  <text x="610" y="468" text-anchor="middle" font-size="12" fill="#5A5A5A">No platform-level FedRAMP gap</text>

  <!-- Arrow 2→3 -->
  <line x1="780" y1="310" x2="818" y2="310" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>

  <!-- Move 3 -->
  <rect x="820" y="120" width="400" height="380" rx="14" fill="#0D1B2E"/>
  <text x="1020" y="158" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E8C8C">Move 3</text>
  <text x="1020" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Activate one non-Microsoft</text>
  <text x="1020" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">target end-to-end</text>

  <rect x="842" y="220" width="356" height="56" rx="8" fill="#1E8C8C"/>
  <text x="1020" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Recommended path:</text>
  <text x="1020" y="262" text-anchor="middle" font-size="13" fill="#CCEEE8">Keycloak — cleanest, proves open-source claim</text>

  <rect x="842" y="286" width="356" height="70" rx="8" fill="#1A3A52"/>
  <text x="1020" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#9BB8CC">Single live-tenant conformance run:</text>
  <text x="1020" y="328" text-anchor="middle" font-size="12" fill="#9BB8CC">Converts "designed for any IdP" from</text>
  <text x="1020" y="346" text-anchor="middle" font-size="12" fill="#9BB8CC">assertion to demonstration</text>

  <text x="1020" y="390" text-anchor="middle" font-size="13" fill="#9BB8CC">Apache-2.0 top to bottom;</text>
  <text x="1020" y="410" text-anchor="middle" font-size="13" fill="#9BB8CC">no commercial IdP required</text>

  <rect x="842" y="428" width="356" height="52" rx="8" fill="#EAF1FB"/>
  <text x="1020" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Addresses:</text>
  <text x="1020" y="468" text-anchor="middle" font-size="12" fill="#5A5A5A">Single-SaaS-cloud and lock-in objections</text>

  <!-- Bottom line -->
  <rect x="60" y="530" width="1160" height="70" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="640" y="558" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Bottom line</text>
  <text x="640" y="580" text-anchor="middle" font-size="14" fill="#5A5A5A">Strong on doctrine, differentiation, and openness · thinner on deployed-at-scale and platform ATO</text>
  <text x="640" y="599" text-anchor="middle" font-size="14" fill="#5A5A5A">Fastest gains = honesty-of-framing + one activated non-Microsoft target · both achievable without new doctrine</text>

  <text x="60" y="660" font-size="13" fill="#9BB8CC" font-style="italic">ADR-112 · ADR-054 · ADR-092 · ADR-059 · ADR-098/113</text>
  <text x="640" y="692" text-anchor="middle" font-size="14" fill="#0D1B2E" font-style="italic">Competitive for a forward-leaning, pilot-oriented solicitation · weaker against one demanding production references and an existing platform ATO</text>
</svg>
