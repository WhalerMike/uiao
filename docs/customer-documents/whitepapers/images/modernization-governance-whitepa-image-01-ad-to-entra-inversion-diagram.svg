<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  </defs>

  <text x="640" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Active Directory → Entra ID: The Architectural Inversion</text>
  <text x="640" y="78" text-anchor="middle" font-size="16" fill="#5A5A5A">Same identities — different governance model. Migration is the moment to make the inversion explicit.</text>

  <!-- LEFT PANEL: Active Directory -->
  <rect x="60" y="100" width="530" height="530" rx="16" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="60" y="100" width="530" height="48" rx="16" fill="#0D1B2E"/>
  <rect x="60" y="128" width="530" height="20" fill="#0D1B2E"/>
  <text x="325" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Active Directory — Hierarchical Placement Model</text>

  <!-- OU Tree -->
  <rect x="265" y="170" width="120" height="36" rx="6" fill="#0D1B2E"/>
  <text x="325" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">agency.gov</text>

  <!-- branch lines from root -->
  <line x1="325" y1="206" x2="325" y2="226" stroke="#0D1B2E" stroke-width="2"/>
  <line x1="175" y1="226" x2="475" y2="226" stroke="#0D1B2E" stroke-width="2"/>
  <line x1="175" y1="226" x2="175" y2="246" stroke="#0D1B2E" stroke-width="2"/>
  <line x1="325" y1="226" x2="325" y2="246" stroke="#0D1B2E" stroke-width="2"/>
  <line x1="475" y1="226" x2="475" y2="246" stroke="#0D1B2E" stroke-width="2"/>

  <rect x="110" y="246" width="130" height="32" rx="6" fill="#1A3A52"/>
  <text x="175" y="266" text-anchor="middle" font-size="12" fill="#FFFFFF">OU=Headquarters</text>
  <rect x="260" y="246" width="130" height="32" rx="6" fill="#1A3A52"/>
  <text x="325" y="266" text-anchor="middle" font-size="12" fill="#FFFFFF">OU=Regions</text>
  <rect x="410" y="246" width="130" height="32" rx="6" fill="#1A3A52"/>
  <text x="475" y="266" text-anchor="middle" font-size="12" fill="#FFFFFF">OU=ServiceAccts</text>

  <!-- HQ branch -->
  <line x1="175" y1="278" x2="175" y2="298" stroke="#0D1B2E" stroke-width="1.5"/>
  <line x1="110" y1="298" x2="240" y2="298" stroke="#0D1B2E" stroke-width="1.5"/>
  <line x1="110" y1="298" x2="110" y2="318" stroke="#0D1B2E" stroke-width="1.5"/>
  <line x1="240" y1="298" x2="240" y2="318" stroke="#0D1B2E" stroke-width="1.5"/>

  <rect x="70" y="318" width="80" height="28" rx="6" fill="#5A5A5A"/>
  <text x="110" y="337" text-anchor="middle" font-size="11" fill="#FFFFFF">OU=IT</text>
  <rect x="200" y="318" width="80" height="28" rx="6" fill="#5A5A5A"/>
  <text x="240" y="337" text-anchor="middle" font-size="11" fill="#FFFFFF">OU=Finance</text>

  <!-- Users -->
  <circle cx="90" cy="380" r="10" fill="#9BB8CC"/>
  <circle cx="115" cy="380" r="10" fill="#9BB8CC"/>
  <circle cx="140" cy="380" r="10" fill="#9BB8CC"/>
  <text x="110" y="403" text-anchor="middle" font-size="11" fill="#5A5A5A">IT users</text>

  <circle cx="220" cy="380" r="10" fill="#9BB8CC"/>
  <circle cx="245" cy="380" r="10" fill="#9BB8CC"/>
  <text x="232" y="403" text-anchor="middle" font-size="11" fill="#5A5A5A">Finance users</text>

  <line x1="110" y1="346" x2="110" y2="370" stroke="#5A5A5A" stroke-width="1.5"/>
  <line x1="232" y1="346" x2="232" y2="370" stroke="#5A5A5A" stroke-width="1.5"/>

  <!-- Access flows from placement -->
  <rect x="80" y="430" width="490" height="60" rx="8" fill="#FDF3F3" stroke="#C0392B" stroke-width="1.5"/>
  <text x="325" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">Access flows from placement in OU</text>
  <text x="325" y="475" text-anchor="middle" font-size="12" fill="#5A5A5A">ACLs and group memberships hold policy · Move user OU → re-permission manually</text>

  <!-- Drift surface -->
  <rect x="80" y="504" width="490" height="50" rx="8" fill="#EAF1FB"/>
  <text x="325" y="525" text-anchor="middle" font-size="12" fill="#5A5A5A">Drift looks like: stale group membership</text>
  <text x="325" y="543" text-anchor="middle" font-size="12" fill="#5A5A5A">Movers require manual OU change + re-permission workflow</text>

  <!-- CENTER ARROW -->
  <line x1="590" y1="380" x2="680" y2="380" stroke="#1E8C8C" stroke-width="5" marker-end="url(#arr-teal)"/>
  <text x="635" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">Architectural</text>
  <text x="635" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">inversion</text>
  <text x="635" y="398" text-anchor="middle" font-size="11" fill="#5A5A5A">same identities</text>
  <text x="635" y="414" text-anchor="middle" font-size="11" fill="#5A5A5A">different governance</text>

  <!-- RIGHT PANEL: Entra ID -->
  <rect x="690" y="100" width="530" height="530" rx="16" fill="#E6F7F2" stroke="#1E8C8C" stroke-width="2"/>
  <rect x="690" y="100" width="530" height="48" rx="16" fill="#1E8C8C"/>
  <rect x="690" y="128" width="530" height="20" fill="#1E8C8C"/>
  <text x="955" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Entra ID — Attribute-Driven Model</text>

  <!-- Flat user layer with attribute tags -->
  <text x="955" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Flat identity plane — placement is gone</text>

  <!-- User 1 -->
  <circle cx="780" cy="240" r="22" fill="#0D1B2E"/>
  <text x="780" y="246" text-anchor="middle" font-size="18" fill="#FFFFFF">👤</text>
  <rect x="710" y="270" width="140" height="22" rx="4" fill="#1E8C8C"/>
  <text x="780" y="285" text-anchor="middle" font-size="11" fill="#FFFFFF">Dept=IT · Role=Engineer</text>

  <!-- User 2 -->
  <circle cx="955" cy="240" r="22" fill="#0D1B2E"/>
  <text x="955" y="246" text-anchor="middle" font-size="18" fill="#FFFFFF">👤</text>
  <rect x="880" y="270" width="150" height="22" rx="4" fill="#1E8C8C"/>
  <text x="955" y="285" text-anchor="middle" font-size="11" fill="#FFFFFF">Dept=Finance · Role=Analyst</text>

  <!-- User 3 -->
  <circle cx="1130" cy="240" r="22" fill="#0D1B2E"/>
  <text x="1130" y="246" text-anchor="middle" font-size="18" fill="#FFFFFF">👤</text>
  <rect x="1062" y="270" width="136" height="22" rx="4" fill="#D4A017"/>
  <text x="1130" y="285" text-anchor="middle" font-size="11" fill="#0D1B2E">Dept=IT · Type=Contractor</text>

  <!-- Policy Engine -->
  <line x1="780" y1="292" x2="850" y2="358" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="955" y1="292" x2="955" y2="358" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="1130" y1="292" x2="1060" y2="358" stroke="#1E8C8C" stroke-width="2"/>

  <rect x="830" y="358" width="250" height="70" rx="10" fill="#0D1B2E"/>
  <text x="955" y="382" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8C8C">Policy Engine</text>
  <text x="955" y="402" text-anchor="middle" font-size="12" fill="#9BB8CC">Conditional Access · PIM · UIAO OrgPath</text>
  <text x="955" y="420" text-anchor="middle" font-size="12" fill="#9BB8CC">Evaluates attributes on every request</text>

  <!-- Per-action decisions -->
  <line x1="955" y1="428" x2="955" y2="458" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <text x="955" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">Per-action access decision</text>

  <!-- Consequences -->
  <rect x="710" y="484" width="490" height="60" rx="8" fill="#E6F7F2" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="955" y="508" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Movers: attributes change → access recomputes automatically</text>
  <text x="955" y="528" text-anchor="middle" font-size="12" fill="#5A5A5A">No "move OU and re-permission" step · no manual workflow · no stale group memberships</text>

  <rect x="710" y="556" width="490" height="50" rx="8" fill="#EAF1FB"/>
  <text x="955" y="577" text-anchor="middle" font-size="12" fill="#5A5A5A">Drift looks like: stale / inconsistent attributes feeding wrong policy decisions</text>
  <text x="955" y="595" text-anchor="middle" font-size="12" fill="#1E8C8C">UIAO DRIFT-IDENTITY class · detection mechanism is attribute validation, not group audit</text>

  <text x="640" y="660" text-anchor="middle" font-size="14" fill="#0D1B2E" font-style="italic">Migration is the moment to make the inversion explicit and govern it deliberately — "lift the existing directory" inherits the OU model and loses attribute-driven value</text>
</svg>
