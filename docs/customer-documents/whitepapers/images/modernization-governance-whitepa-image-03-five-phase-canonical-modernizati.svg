  <rect x="528" y="224" width="184" height="34" rx="6" fill="#0D1B2E"/>
  <text x="620" y="245" text-anchor="middle" font-size="12" fill="#FFFFFF">Low-risk OU to cloud-only</text>
  <rect x="528" y="266" width="184" height="34" rx="6" fill="#0D1B2E"/>
  <text x="620" y="287" text-anchor="middle" font-size="12" fill="#FFFFFF">SSPR + MFA validated</text>
  <rect x="528" y="308" width="184" height="34" rx="6" fill="#0D1B2E"/>
  <text x="620" y="329" text-anchor="middle" font-size="12" fill="#FFFFFF">OrgPath facets verified live</text>
  <rect x="528" y="350" width="184" height="34" rx="6" fill="#0D1B2E"/>
  <text x="620" y="371" text-anchor="middle" font-size="12" fill="#FFFFFF">Helpdesk runbook tested</text>
  <rect x="528" y="392" width="184" height="34" rx="6" fill="#0D1B2E"/>
  <text x="620" y="413" text-anchor="middle" font-size="12" fill="#FFFFFF">Drift alert baseline set</text>
  <rect x="528" y="450" width="184" height="44" rx="6" fill="#1E8C8C"/>
  <text x="620" y="469" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Outcome: runbook proven</text>
  <text x="620" y="487" text-anchor="middle" font-size="12" fill="#CCEEE8">at small scale before</text>
  <text x="620" y="503" text-anchor="middle" font-size="12" fill="#CCEEE8">broad rollout</text>

  <!-- Phase 4 -->
  <rect x="736" y="140" width="216" height="460" rx="14" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <rect x="736" y="140" width="216" height="48" rx="14" fill="#1A3A52"/>
  <rect x="736" y="168" width="216" height="20" fill="#1A3A52"/>
  <text x="844" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">Phase 4</text>
  <text x="844" y="181" text-anchor="middle" font-size="12" fill="#9BB8CC">Broad Migration</text>

  <text x="844" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Gate: wave-by-wave</text>
  <rect x="752" y="224" width="184" height="34" rx="6" fill="#0D1B2E"/>
  <text x="844" y="245" text-anchor="middle" font-size="12" fill="#FFFFFF">Wave-based OU migration</text>
  <rect x="752" y="266" width="184" height="34" rx="6" fill="#0D1B2E"/>
  <text x="844" y="287" text-anchor="middle" font-size="12" fill="#FFFFFF">AD sync cutover per wave</text>
  <rect x="752" y="308" width="184" height="34" rx="6" fill="#0D1B2E"/>
  <text x="844" y="329" text-anchor="middle" font-size="12" fill="#FFFFFF">SRV / DNS migration (DDI)</text>
  <rect x="752" y="350" width="184" height="34" rx="6" fill="#0D1B2E"/>
  <text x="844" y="371" text-anchor="middle" font-size="12" fill="#FFFFFF">Device: Entra + Intune</text>
  <rect x="752" y="392" width="184" height="34" rx="6" fill="#0D1B2E"/>
  <text x="844" y="413" text-anchor="middle" font-size="12" fill="#FFFFFF">Legacy auth blocked per wave</text>
  <rect x="752" y="450" width="184" height="44" rx="6" fill="#1E8C8C"/>
  <text x="844" y="469" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Outcome: estate moves</text>
  <text x="844" y="487" text-anchor="middle" font-size="12" fill="#CCEEE8">to Entra; AD dependency</text>
  <text x="844" y="503" text-anchor="middle" font-size="12" fill="#CCEEE8">shrinks each wave</text>

  <!-- Phase 5 -->
  <rect x="960" y="140" width="280" height="460" rx="14" fill="#E6F7F2" stroke="#1E8C8C" stroke-width="2.5"/>
  <rect x="960" y="140" width="280" height="48" rx="14" fill="#1E8C8C"/>
  <rect x="960" y="168" width="280" height="20" fill="#1E8C8C"/>
  <text x="1100" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Phase 5</text>
  <text x="1100" y="181" text-anchor="middle" font-size="12" fill="#CCEEE8">AD Retirement + Steady State</text>

  <text x="1100" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Gate: all waves complete</text>
  <rect x="976" y="224" width="248" height="34" rx="6" fill="#0D1B2E"/>
  <text x="1100" y="245" text-anchor="middle" font-size="12" fill="#FFFFFF">AD DC decommission</text>
  <rect x="976" y="266" width="248" height="34" rx="6" fill="#0D1B2E"/>
  <text x="1100" y="287" text-anchor="middle" font-size="12" fill="#FFFFFF">NTLM / Kerberos removed</text>
  <rect x="976" y="308" width="248" height="34" rx="6" fill="#0D1B2E"/>
  <text x="1100" y="329" text-anchor="middle" font-size="12" fill="#FFFFFF">Zero Trust Assessment run</text>
  <rect x="976" y="350" width="248" height="34" rx="6" fill="#0D1B2E"/>
  <text x="1100" y="371" text-anchor="middle" font-size="12" fill="#FFFFFF">OrgPath continuous gov. live</text>
  <rect x="976" y="392" width="248" height="34" rx="6" fill="#0D1B2E"/>
  <text x="1100" y="413" text-anchor="middle" font-size="12" fill="#FFFFFF">Drift → DRIFT-IDENTITY alerts</text>
  <rect x="976" y="450" width="248" height="68" rx="6" fill="#1E8C8C"/>
  <text x="1100" y="473" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Outcome: attribute-driven</text>
  <text x="1100" y="491" text-anchor="middle" font-size="12" fill="#CCEEE8">steady state; one-way gate</text>
  <text x="1100" y="509" text-anchor="middle" font-size="12" fill="#CCEEE8">closed; AD never reinstated</text>

  <text x="640" y="638" text-anchor="middle" font-size="13" fill="#5A5A5A" font-style="italic">UIAO modernization-governance posture: governance leads migration · Phase 1 cannot be skipped without inheriting OU-placement model in Entra ID</text>
  <text x="640" y="660" text-anchor="middle" font-size="13" fill="#0D1B2E" font-style="italic">ADR-051/052/053/054 (HRIT) · UIAO_007 (OrgPath) · BOD 25-01 (SCuBA) · ADR-091 (SQL/auth transformation)</text>
</svg>
