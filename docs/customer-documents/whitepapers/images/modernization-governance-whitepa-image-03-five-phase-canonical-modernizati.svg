  <text x="396" y="181" text-anchor="middle" font-size="12" fill="#9BB8CC">Entra Tenant Preparation</text>

  <text x="396" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Gate: before pilot</text>
