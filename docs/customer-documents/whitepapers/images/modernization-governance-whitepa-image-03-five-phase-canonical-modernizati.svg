  <text x="396" y="245" text-anchor="middle" font-size="12" fill="#FFFFFF">Hybrid join / cloud-only split</text>
  <rect x="304" y="266" width="184" height="34" rx="6" fill="#0D1B2E"/>
  <text x="396" y="287" text-anchor="middle" font-size="12" fill="#FFFFFF">Conditional Access baseline</text>
  <rect x="304" y="308" width="184" height="34" rx="6" fill="#0D1B2E"/>
  <text x="396" y="329" text-anchor="middle" font-size="12" fill="#FFFFFF">SCuBA ScubaGear run</text>
  <rect x="304" y="350" width="184" height="34" rx="6" fill="#0D1B2E"/>
  <text x="396" y="371" text-anchor="middle" font-size="12" fill="#FFFFFF">MFA enrollment (BOD 25-01)</text>
  <rect x="304" y="392" width="184" height="34" rx="6" fill="#0D1B2E"/>
  <text x="396" y="413" text-anchor="middle" font-size="12" fill="#FFFFFF">Block legacy auth</text>
  <rect x="304" y="450" width="184" height="44" rx="6" fill="#1E8C8C"/>
  <text x="396" y="469" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Outcome: tenant is</text>
  <text x="396" y="487" text-anchor="middle" font-size="12" fill="#CCEEE8">baseline-compliant before</text>
  <text x="396" y="503" text-anchor="middle" font-size="12" fill="#CCEEE8">pilot population lands</text>

  <!-- Phase 3 -->
  <rect x="512" y="140" width="216" height="460" rx="14" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="2"/>
  <rect x="512" y="140" width="216" height="48" rx="14" fill="#1E8C8C"/>
  <rect x="512" y="168" width="216" height="20" fill="#1E8C8C"/>
