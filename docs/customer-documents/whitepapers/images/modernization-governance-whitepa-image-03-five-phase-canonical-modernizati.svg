<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="640" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#0D1B2E">Five-Phase Canonical Modernization Timeline</text>
  <text x="640" y="76" text-anchor="middle" font-size="15" fill="#5A5A5A">Governance leads migration — not the other way around · each phase is a one-way gate, not a reversible re-platforming</text>

  <!-- Phase timeline bar -->
  <rect x="60" y="104" width="1160" height="28" rx="6" fill="#EAF1FB"/>
  <line x1="284" y1="104" x2="284" y2="132" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="508" y1="104" x2="508" y2="132" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="732" y1="104" x2="732" y2="132" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="956" y1="104" x2="956" y2="132" stroke="#DDDDDD" stroke-width="1"/>
  <text x="172" y="123" text-anchor="middle" font-size="12" fill="#5A5A5A">Months 0–3</text>
  <text x="396" y="123" text-anchor="middle" font-size="12" fill="#5A5A5A">Months 3–6</text>
  <text x="620" y="123" text-anchor="middle" font-size="12" fill="#5A5A5A">Months 6–9</text>
  <text x="844" y="123" text-anchor="middle" font-size="12" fill="#5A5A5A">Months 9–12</text>
  <text x="1108" y="123" text-anchor="middle" font-size="12" fill="#5A5A5A">Months 12+</text>

  <!-- Phase 1 -->
  <rect x="60" y="140" width="220" height="460" rx="14" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="60" y="140" width="220" height="48" rx="14" fill="#0D1B2E"/>
  <rect x="60" y="168" width="220" height="20" fill="#0D1B2E"/>
  <text x="170" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">Phase 1</text>
  <text x="170" y="181" text-anchor="middle" font-size="12" fill="#9BB8CC">Governance Foundation</text>

  <text x="170" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Gate: before migration</text>
  <rect x="76" y="224" width="188" height="34" rx="6" fill="#0D1B2E"/>
  <text x="170" y="245" text-anchor="middle" font-size="12" fill="#FFFFFF">Define canonical attributes</text>
  <rect x="76" y="266" width="188" height="34" rx="6" fill="#0D1B2E"/>
  <text x="170" y="287" text-anchor="middle" font-size="12" fill="#FFFFFF">Map HR fields → facets</text>
  <rect x="76" y="308" width="188" height="34" rx="6" fill="#0D1B2E"/>
  <text x="170" y="329" text-anchor="middle" font-size="12" fill="#FFFFFF">Establish HRIT sync (ADR-051)</text>
  <rect x="76" y="350" width="188" height="34" rx="6" fill="#0D1B2E"/>
  <text x="170" y="371" text-anchor="middle" font-size="12" fill="#FFFFFF">OrgPath baseline (UIAO_007)</text>
  <rect x="76" y="392" width="188" height="34" rx="6" fill="#0D1B2E"/>
  <text x="170" y="413" text-anchor="middle" font-size="12" fill="#FFFFFF">Drift detection enabled</text>
  <rect x="76" y="450" width="188" height="44" rx="6" fill="#1E8C8C"/>
  <text x="170" y="469" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Outcome: attributes</text>
  <text x="170" y="487" text-anchor="middle" font-size="12" fill="#CCEEE8">are correct before they</text>
  <text x="170" y="503" text-anchor="middle" font-size="12" fill="#CCEEE8">become load-bearing</text>
  <rect x="76" y="506" width="188" height="34" rx="6" fill="#C0392B" fill-opacity="0.2" stroke="#C0392B" stroke-width="1"/>
  <text x="170" y="527" text-anchor="middle" font-size="11" fill="#C0392B">Skip this → inherit AD model</text>

  <!-- Phase 2 -->
  <rect x="288" y="140" width="216" height="460" rx="14" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <rect x="288" y="140" width="216" height="48" rx="14" fill="#1A3A52"/>
  <rect x="288" y="168" width="216" height="20" fill="#1A3A52"/>
