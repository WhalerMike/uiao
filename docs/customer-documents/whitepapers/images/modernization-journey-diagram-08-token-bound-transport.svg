<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · red #C0392B · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arr-grey8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
    <marker id="arr-teal8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  </defs>

  <!-- ===== TOP: OLD session-bound ===== -->
  <text x="60" y="70" font-size="20" font-weight="bold" fill="#5A5A5A">OLD: session-bound transport</text>
  <rect x="60" y="95" width="120" height="80" rx="8" fill="#0D1B2E"/><text x="120" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Client</text>
  <rect x="1100" y="95" width="120" height="80" rx="8" fill="#0D1B2E"/><text x="1160" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Server</text>
  <!-- one long tunnel -->
  <rect x="185" y="118" width="910" height="34" rx="17" fill="#E3E8EF" stroke="#5A5A5A" stroke-width="1.5"/>
  <!-- lock at left (established once) -->
  <rect x="196" y="123" width="22" height="16" rx="3" fill="#5A5A5A"/><path d="M201 123 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#5A5A5A" stroke-width="2.5"/>
  <text x="640" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#5A5A5A">one TLS tunnel — established once</text>
  <!-- many request arrows riding the tunnel -->
  <g stroke="#5A5A5A" stroke-width="2">
    <line x1="260" y1="135" x2="320" y2="135" marker-end="url(#arr-grey8)"/>
    <line x1="420" y1="135" x2="480" y2="135" marker-end="url(#arr-grey8)"/>
    <line x1="580" y1="135" x2="640" y2="135" marker-end="url(#arr-grey8)"/>
    <line x1="740" y1="135" x2="800" y2="135" marker-end="url(#arr-grey8)"/>
    <line x1="900" y1="135" x2="960" y2="135" marker-end="url(#arr-grey8)"/>
  </g>
  <text x="640" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0392B">established once, trusted for hours — a hijack inherits the standing trust</text>

  <!-- divider -->
  <line x1="60" y1="250" x2="1220" y2="250" stroke="#E3E8EF" stroke-width="2"/>

  <!-- ===== BOTTOM: NEW token-bound per call ===== -->
  <text x="60" y="305" font-size="20" font-weight="bold" fill="#0D1B2E">NEW: token-bound per-call transport</text>
  <rect x="60" y="430" width="120" height="80" rx="8" fill="#0D1B2E"/><text x="120" y="477" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Client</text>
  <rect x="1100" y="430" width="120" height="80" rx="8" fill="#0D1B2E"/><text x="1160" y="477" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Server</text>
  <!-- discrete per-call segments, each carrying a token capsule -->
  <g>
    <line x1="185" y1="470" x2="370" y2="470" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal8)"/>
    <line x1="555" y1="470" x2="740" y2="470" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal8)"/>
    <line x1="915" y1="470" x2="1098" y2="470" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal8)"/>
  </g>
  <!-- token capsules -->
  <g font-size="12" fill="#0D1B2E" text-anchor="middle">
    <rect x="372" y="430" width="182" height="80" rx="14" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/><text x="463" y="455" font-weight="bold" font-size="13">token</text><text x="463" y="475">identity · application</text><text x="463" y="492">posture · location</text>
    <rect x="742" y="430" width="172" height="80" rx="14" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/><text x="828" y="455" font-weight="bold" font-size="13">token</text><text x="828" y="475">lease · cert-chain</text><text x="828" y="492">freshly attested</text>
  </g>
  <text x="640" y="560" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">each call freshly attested — no standing trust to inherit</text>

  <text x="640" y="650" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#0D1B2E">A session is no longer a canonical concept — intent rides each call.</text>
</svg>
