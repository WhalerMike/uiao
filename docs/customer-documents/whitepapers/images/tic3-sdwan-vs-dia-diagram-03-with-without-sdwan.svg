<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1400" height="900" fill="#FFFFFF"/>
  <text x="700" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1F3A5F">Two Paths to the Same TIC 3.0 Zero Trust Posture</text>
  <text x="700" y="74" text-anchor="middle" font-size="15" fill="#4A5A6A">SD-WAN is required for one use case, not the other — SASE/ZTNA satisfies the catalog either way</text>

  <defs>
    <marker id="arrowNavy3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3A5F"/></marker>
    <marker id="arrowTeal3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1A9E8F"/></marker>
    <marker id="arrowGrey3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8A97A3"/></marker>
  </defs>

  <!-- TIC 3.0 gate (top, spans both columns) -->
  <rect x="90" y="100" width="1220" height="96" rx="10" fill="#1F3A5F"/>
  <text x="700" y="136" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">TIC 3.0 — THE POLICY GATE (OMB M-19-26)</text>
  <text x="700" y="162" text-anchor="middle" font-size="14.5" fill="#D7E1EA">Both use cases permit local egress without the TIC hairpin — and neither permits it ungoverned:</text>
  <text x="700" y="183" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">the security-capabilities catalog must be satisfied at the distributed policy enforcement point</text>

  <path d="M 330 196 L 330 222" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrowNavy3)"/>
  <path d="M 1070 196 L 1070 222" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrowNavy3)"/>

  <!-- LEFT COLUMN: Branch Office -->
  <rect x="90" y="226" width="480" height="42" rx="8" fill="#1F3A5F"/>
  <text x="330" y="253" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">BRANCH OFFICE — Use Case E</text>

  <path d="M 330 268 L 330 290" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arrowTeal3)"/>
  <rect x="90" y="294" width="480" height="106" rx="8" fill="#1A9E8F"/>
  <text x="330" y="320" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">SASE / SSE — Layer 7 governor</text>
  <text x="330" y="343" text-anchor="middle" font-size="13" fill="#EAF6F4">SWG / FWaaS (SC-7, SI-3)</text>
  <text x="330" y="362" text-anchor="middle" font-size="13" fill="#EAF6F4">CASB (AC-4) · ZTNA (CA-7)</text>
  <text x="330" y="383" text-anchor="middle" font-size="12" fill="#D7F2EE">the distributed PEP</text>

  <path d="M 330 400 L 330 422" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrowNavy3)"/>
  <rect x="90" y="426" width="480" height="106" rx="8" fill="#1F3A5F"/>
  <text x="330" y="452" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">SD-WAN — Layer 3 governor</text>
  <text x="330" y="475" text-anchor="middle" font-size="13" fill="#D7E1EA">IPsec overlay (SC-8) · Traffic classes (SC-6)</text>
  <text x="330" y="494" text-anchor="middle" font-size="13" fill="#D7E1EA">Active-active multipath</text>
  <text x="330" y="515" text-anchor="middle" font-size="12" fill="#B9C7D6">governs the pipe, not the flows</text>

  <path d="M 330 532 L 330 554" stroke="#C0392B" stroke-width="3" marker-end="url(#arrowNavy3)"/>
  <rect x="90" y="558" width="480" height="70" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.5"/>
  <text x="330" y="588" text-anchor="middle" font-size="15" font-weight="700" fill="#C0392B">THE PIPE — DIA / MPLS / LEO / 5G</text>
  <text x="330" y="610" text-anchor="middle" font-size="12.5" fill="#4A5A6A">solves G.114 latency only — satisfies no control by itself</text>

  <text x="330" y="656" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3A5F">3-layer stack</text>
  <text x="330" y="676" text-anchor="middle" font-size="13" fill="#4A5A6A">SD-WAN governs the pipe; SASE governs the flows</text>

  <!-- RIGHT COLUMN: Remote User -->
  <rect x="830" y="226" width="480" height="42" rx="8" fill="#1F3A5F"/>
  <text x="1070" y="253" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">REMOTE USER</text>

  <path d="M 1070 268 L 1070 290" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arrowTeal3)"/>
  <rect x="830" y="294" width="480" height="106" rx="8" fill="#1A9E8F"/>
  <text x="1070" y="320" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">SASE / SSE — same Layer 7 governor</text>
  <text x="1070" y="343" text-anchor="middle" font-size="13" fill="#EAF6F4">Cloud-delivered SASE PoP</text>
  <text x="1070" y="362" text-anchor="middle" font-size="13" fill="#EAF6F4">ZTNA replaces VPN (CA-7)</text>
  <text x="1070" y="383" text-anchor="middle" font-size="12" fill="#D7F2EE">the distributed PEP — same catalog</text>

  <path d="M 1070 400 L 1070 422" stroke="#8A97A3" stroke-width="3" stroke-dasharray="6,5" marker-end="url(#arrowGrey3)"/>
  <rect x="830" y="426" width="480" height="106" rx="8" fill="#F4F7FA" stroke="#8A97A3" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="1070" y="452" text-anchor="middle" font-size="15.5" font-weight="700" fill="#5C6B78">SD-WAN — NOT APPLICABLE</text>
  <text x="1070" y="475" text-anchor="middle" font-size="13" fill="#5C6B78">No branch circuit to govern</text>
  <text x="1070" y="494" text-anchor="middle" font-size="13" fill="#5C6B78">nothing here for SD-WAN to add</text>
  <text x="1070" y="515" text-anchor="middle" font-size="12" fill="#8A97A3">a single teleworker is not a site</text>

  <path d="M 1070 532 L 1070 554" stroke="#8A97A3" stroke-width="3" marker-end="url(#arrowGrey3)"/>
  <rect x="830" y="558" width="480" height="70" rx="8" fill="#FFFFFF" stroke="#8A97A3" stroke-width="2"/>
  <text x="1070" y="588" text-anchor="middle" font-size="15" font-weight="700" fill="#5C6B78">HOME INTERNET — unmanaged last mile</text>
  <text x="1070" y="610" text-anchor="middle" font-size="12.5" fill="#4A5A6A">not an agency circuit; there is no pipe to overlay</text>

  <text x="1070" y="656" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3A5F">2-layer stack</text>
  <text x="1070" y="676" text-anchor="middle" font-size="13" fill="#4A5A6A">SASE / ZTNA alone reaches the same posture</text>

  <!-- Bottom synthesis banner -->
  <rect x="90" y="704" width="1220" height="150" rx="10" fill="#EAF6F4"/>
  <text x="700" y="736" text-anchor="middle" font-size="16" font-weight="700" fill="#1F3A5F">Both paths satisfy the same TIC 3.0 security-capabilities catalog at the distributed PEP.</text>
  <text x="700" y="760" text-anchor="middle" font-size="15" fill="#0E5C5C">SD-WAN earns its place only where there is a branch circuit to govern — it is never a Zero Trust prerequisite.</text>
  <text x="700" y="800" text-anchor="middle" font-size="12.5" fill="#4A5A6A">Source: CISA, "The Journey to Zero Trust — Using SASE in a Modern TIC 3.0 Solution" (June 2026):</text>
  <text x="700" y="820" text-anchor="middle" font-size="12.5" fill="#4A5A6A">SASE is positioned as the Zero Trust enabler; SD-WAN is not part of that framing.</text>
</svg>
