<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO 16:9 figure (ADR-093). Palette: navy #0D1B2E · teal #1E8C8C · red #C0392B -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="640" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">Two Paths, Five Years: Cumulative Cash Position</text>
  <text x="640" y="80" text-anchor="middle" font-size="15" fill="#5A5A5A">Base-case MPLS assumption of $1,200 per site per month (Section 6.1) — see Section 6.3 for sensitivity</text>

  <!-- Chart frame -->
  <!-- y gridlines: +10 at 150, 0 at 218, -10 at 287, -20 at 355, -30 at 423, -40 at 492, -50 at 560 -->
  <g stroke="#E3E8EF" stroke-width="1">
    <line x1="200" y1="150" x2="1140" y2="150"/>
    <line x1="200" y1="218" x2="1140" y2="218"/>
    <line x1="200" y1="287" x2="1140" y2="287"/>
    <line x1="200" y1="355" x2="1140" y2="355"/>
    <line x1="200" y1="423" x2="1140" y2="423"/>
    <line x1="200" y1="492" x2="1140" y2="492"/>
    <line x1="200" y1="560" x2="1140" y2="560"/>
  </g>
  <!-- emphasize the $0 line -->
  <line x1="200" y1="218" x2="1140" y2="218" stroke="#0D1B2E" stroke-width="2"/>

  <g font-size="13" fill="#5A5A5A" text-anchor="end">
    <text x="190" y="155">+$10M</text>
    <text x="190" y="223">$0</text>
    <text x="190" y="291">−$10M</text>
    <text x="190" y="359">−$20M</text>
    <text x="190" y="427">−$30M</text>
    <text x="190" y="496">−$40M</text>
    <text x="190" y="564">−$50M</text>
  </g>

  <line x1="200" y1="150" x2="200" y2="590" stroke="#33414F" stroke-width="1.5"/>
  <line x1="200" y1="590" x2="1140" y2="590" stroke="#33414F" stroke-width="1.5"/>

  <g font-size="14" fill="#33414F" text-anchor="middle" font-weight="bold">
    <text x="260" y="612">Year 1</text>
    <text x="465" y="612">Year 2</text>
    <text x="670" y="612">Year 3</text>
    <text x="875" y="612">Year 4</text>
    <text x="1080" y="612">Year 5</text>
  </g>

  <!-- Refresh path (red, flat at -$50M) -->
  <polyline points="260,560 465,560 670,560 875,560 1080,560" fill="none" stroke="#C0392B" stroke-width="4"/>
  <g fill="#C0392B">
    <circle cx="260" cy="560" r="6"/><circle cx="465" cy="560" r="6"/><circle cx="670" cy="560" r="6"/><circle cx="875" cy="560" r="6"/><circle cx="1080" cy="560" r="6"/>
  </g>
  <text x="1080" y="545" text-anchor="end" font-size="13" font-weight="bold" fill="#C0392B">recurs at next refresh cycle</text>

  <!-- Network modernization path (teal) -->
  <polyline points="260,287 465,275 670,246 875,206 1080,166" fill="none" stroke="#1E8C8C" stroke-width="4"/>
  <g fill="#1E8C8C">
    <circle cx="260" cy="287" r="6"/><circle cx="465" cy="275" r="6"/><circle cx="670" cy="246" r="6"/><circle cx="1080" cy="166" r="6"/>
  </g>
  <circle cx="875" cy="206" r="9" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="4"/>
  <text x="875" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#0E5C5C">turns cash-positive</text>

  <!-- value labels -->
  <g font-size="12.5" fill="#8C2E20" text-anchor="middle">
    <text x="260" y="580">−$50.0M</text>
  </g>
  <g font-size="12.5" fill="#0E5C5C" text-anchor="middle">
    <text x="260" y="270">−$10.0M</text>
    <text x="465" y="258">−$8.23M</text>
    <text x="670" y="229">−$4.11M</text>
    <text x="875" y="248" fill="#0E5C5C">+$1.78M</text>
    <text x="1080" y="149">+$7.67M</text>
  </g>

  <!-- Legend -->
  <rect x="760" y="640" width="18" height="18" fill="#C0392B"/>
  <text x="786" y="655" font-size="14" fill="#33414F">Distribution point refresh (proposed)</text>
  <rect x="760" y="666" width="18" height="18" fill="#1E8C8C"/>
  <text x="786" y="681" font-size="14" fill="#33414F">SD-WAN + DIA + 5G network modernization</text>

  <!-- Bottom banner -->
  <rect x="60" y="660" width="660" height="60" rx="8" fill="#1F3A5F"/>
  <text x="390" y="686" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">~$57.7M five-year delta between the two paths</text>
  <text x="390" y="706" text-anchor="middle" font-size="12" fill="#D7E1EA">Breakeven threshold: $873/site/month current MPLS spend (Section 6.3)</text>
</svg>
