<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrRight" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#C0392B"/>
    </marker>
  </defs>

  <text x="640" y="44" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="27" fill="#0D1B2E">Act 2 — When Security Ate the Architecture</text>
  <text x="640" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7A8D">Stacked inline inspection did not expire tickets. It degraded the operations that must reach a domain controller.</text>
  <line x1="60" y1="88" x2="1220" y2="88" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ── Left: where the latency actually comes from ───────────── -->
  <text x="70" y="116" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#0D1B2E">Where the latency actually comes from</text>

  <rect x="70" y="130" width="300" height="120" rx="6" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="86" y="154" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#C0392B">1. The geographic detour</text>
  <text x="86" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">Branch traffic is backhauled to the</text>
  <text x="86" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">regional data center and back out.</text>
  <text x="86" y="212" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">It pays the full DC round trip before</text>
  <text x="86" y="230" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">the request reaches its destination.</text>
  <text x="86" y="246" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#C0392B">Dominant cost — tens of milliseconds.</text>

  <rect x="70" y="262" width="300" height="108" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="86" y="286" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#0D1B2E">2. TLS inspection at the proxy</text>
  <text x="86" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">Decrypt, inspect, re-encrypt. Scales</text>
  <text x="86" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">with the number of objects fetched,</text>
  <text x="86" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">not the size of the pipe.</text>
  <text x="86" y="360" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#D4A017">Real, and second largest.</text>

  <rect x="70" y="378" width="300" height="108" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="86" y="404" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#0D1B2E">3. The packet-layer devices</text>
  <text x="86" y="426" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">Firewall, NAT, IDS. On current</text>
  <text x="86" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">hardware each adds well under a</text>
  <text x="86" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">millisecond to a few milliseconds.</text>
  <text x="86" y="479" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#1E8C8C">Not where the time goes.</text>

  <rect x="70" y="498" width="300" height="80" rx="6" fill="#0D1B2E"/>
  <text x="220" y="522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#FFFFFF">A backhauled branch path</text>
  <text x="220" y="542" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#FFFFFF">commonly runs 100–150 ms</text>
  <text x="220" y="564" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#D7F2EE">— and the detour is most of it.</text>

  <line x1="374" y1="538" x2="424" y2="538" stroke="#C0392B" stroke-width="2.2" marker-end="url(#arrRight)"/>

  <!-- ── Middle: what actually degrades ─────────────────────────── -->
  <text x="440" y="116" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#0D1B2E">What this actually degrades</text>
  <rect x="440" y="130" width="392" height="392" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="636" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="14" fill="#6B7A8D">The DC-dependent operations</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">
    <rect x="458" y="170" width="356" height="72" rx="5" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.2"/>
    <text x="474" y="194" font-weight="bold" font-size="14.5" fill="#0D1B2E">Initial TGT acquisition at logon</text>
    <text x="474" y="215">Client must reach a KDC before the</text>
    <text x="474" y="233">desktop is usable. Every hop is in that path.</text>

    <rect x="458" y="254" width="356" height="72" rx="5" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.2"/>
    <text x="474" y="278" font-weight="bold" font-size="14.5" fill="#0D1B2E">SYSVOL / GPO retrieval</text>
    <text x="474" y="299">Many small file reads. Latency multiplies</text>
    <text x="474" y="317">per round trip, so policy application stalls.</text>

    <rect x="458" y="338" width="356" height="54" rx="5" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.2"/>
    <text x="474" y="362" font-weight="bold" font-size="14.5" fill="#0D1B2E">Password change</text>
    <text x="474" y="383">Written to a writable DC, not a local cache.</text>

    <rect x="458" y="404" width="356" height="54" rx="5" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.2"/>
    <text x="474" y="428" font-weight="bold" font-size="14.5" fill="#0D1B2E">Hybrid Entra join registration</text>
    <text x="474" y="449">Documented as needing on-premises DC reach.</text>
  </g>
  <line x1="458" y1="474" x2="814" y2="474" stroke="#E3E8EF" stroke-width="1"/>
  <text x="636" y="494" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7A8D">Steady-state application traffic is largely unaffected —</text>
  <text x="636" y="511" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7A8D">the problem presents as slow logons, not an outage.</text>

  <!-- ── Right: the correction ──────────────────────────────────── -->
  <text x="862" y="116" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#0D1B2E">What does not happen</text>
  <rect x="862" y="130" width="348" height="392" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">
    <text x="882" y="164" font-weight="bold" font-size="15" fill="#0D1B2E">There is no Kerberos latency limit.</text>
    <text x="882" y="188">RFC 4120 sets a five-minute clock-skew</text>
    <text x="882" y="207">tolerance. That is a clock tolerance, not a</text>
    <text x="882" y="226">latency budget. No millisecond threshold</text>
    <text x="882" y="245">exists anywhere in the protocol.</text>

    <line x1="882" y1="268" x2="1190" y2="268" stroke="#1E8C8C" stroke-width="1"/>

    <text x="882" y="298" font-weight="bold" font-size="15" fill="#0D1B2E">NAT does not invalidate tickets.</text>
    <text x="882" y="322">Windows KILE ships ClientIpAddresses = 0,</text>
    <text x="882" y="341">so no client address is written into a ticket.</text>
    <text x="882" y="360">Microsoft states the reason directly: DHCP</text>
    <text x="882" y="379">and network address translation issues.</text>

    <line x1="882" y1="402" x2="1190" y2="402" stroke="#1E8C8C" stroke-width="1"/>

    <text x="882" y="432" font-weight="bold" font-size="15" fill="#0D1B2E">Address checking, where enabled,</text>
    <text x="882" y="456">is performed by the application server</text>
    <text x="882" y="475">(KRB_AP_ERR_BADADDR), not by the KDC.</text>
    <text x="882" y="502" font-size="13" fill="#6B7A8D">SNAT at a PoP writes nothing into a ticket.</text>
  </g>

  <!-- ── Footer ─────────────────────────────────────────────────── -->
  <rect x="440" y="536" width="770" height="70" rx="6" fill="#0D1B2E"/>
  <text x="825" y="562" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15.5" fill="#FFFFFF">The argument survives being stated correctly — and is stronger for it.</text>
  <text x="825" y="584" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#D7F2EE">Stack enough inline latency in front of a domain controller and logons crawl, GPO</text>
  <text x="825" y="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#D7F2EE">processing stalls, and the estate feels exactly the pain this paper describes.</text>

  <line x1="60" y1="632" x2="1220" y2="632" stroke="#E3E8EF" stroke-width="1"/>
  <text x="70" y="656" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#6B7A8D">Ranges are illustrative of a typical backhauled path and should be measured, not assumed; the ordering of the three causes, the DC-dependent operation list, and the Kerberos behaviour are not illustrative.</text>
  <text x="70" y="682" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">Sources: RFC 4120 §5.4.1 (clock skew) · Microsoft KILE / ClientIpAddresses guidance · Microsoft hybrid Entra join prerequisites</text>
</svg>
