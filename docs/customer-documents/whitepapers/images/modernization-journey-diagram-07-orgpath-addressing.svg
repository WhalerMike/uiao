<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · ice #EAF1FB · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arr-grey7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7A8D"/></marker>
  </defs>

  <!-- LEFT: three governed objects each carrying an OrgPath tag -->
  <text x="60" y="110" font-size="16" font-weight="bold" fill="#6B7A8D">GOVERNED OBJECTS</text>
  <!-- user -->
  <g>
    <rect x="60" y="140" width="300" height="120" rx="10" fill="#0D1B2E"/>
    <circle cx="110" cy="185" r="16" fill="#EAF1FB"/><path d="M86 224 a24 22 0 0 1 48 0 z" fill="#EAF1FB"/>
    <text x="160" y="182" font-size="17" font-weight="bold" fill="#FFFFFF">User</text>
    <rect x="150" y="198" width="195" height="44" rx="8" fill="#1E8C8C"/><text x="160" y="216" font-size="11" font-weight="bold" fill="#FFFFFF">OrgPath</text><text x="160" y="234" font-size="12" font-family="Consolas, monospace" fill="#FFFFFF">/Region/CA/Field/Benefits</text>
  </g>
  <!-- device -->
  <g>
    <rect x="60" y="290" width="300" height="120" rx="10" fill="#0D1B2E"/>
    <rect x="92" y="168" width="0" height="0"/>
    <rect x="90" y="320" width="44" height="32" rx="3" fill="#EAF1FB"/><rect x="104" y="352" width="16" height="8" fill="#EAF1FB"/>
    <text x="160" y="332" font-size="17" font-weight="bold" fill="#FFFFFF">Device</text>
    <rect x="150" y="348" width="195" height="44" rx="8" fill="#1E8C8C"/><text x="160" y="366" font-size="11" font-weight="bold" fill="#FFFFFF">OrgPath</text><text x="160" y="384" font-size="12" font-family="Consolas, monospace" fill="#FFFFFF">/Region/CA/Field/Benefits</text>
  </g>
  <!-- service principal (gear) -->
  <g>
    <rect x="60" y="440" width="300" height="120" rx="10" fill="#0D1B2E"/>
    <circle cx="110" cy="485" r="18" fill="none" stroke="#EAF1FB" stroke-width="6"/><circle cx="110" cy="485" r="6" fill="#EAF1FB"/>
    <text x="150" y="482" font-size="15" font-weight="bold" fill="#FFFFFF">Service principal</text>
    <rect x="150" y="498" width="195" height="44" rx="8" fill="#1E8C8C"/><text x="160" y="516" font-size="11" font-weight="bold" fill="#FFFFFF">OrgPath</text><text x="160" y="534" font-size="12" font-family="Consolas, monospace" fill="#FFFFFF">/Region/CA/App/Claims</text>
  </g>

  <!-- CENTER label -->
  <text x="640" y="330" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Every governed object</text>
  <text x="640" y="356" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">CARRIES OrgPath</text>
  <text x="640" y="382" text-anchor="middle" font-size="15" fill="#5A5A5A">(an attribute, not a token)</text>

  <!-- RIGHT: decisions compose against OrgPath -->
  <text x="920" y="110" font-size="16" font-weight="bold" fill="#0D1B2E">Access decisions COMPOSE AGAINST OrgPath</text>
  <g font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">
    <rect x="920" y="135" width="300" height="64" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="1070" y="173">Dynamic Group membership</text>
    <rect x="920" y="215" width="300" height="64" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="1070" y="253">Administrative Unit scoping</text>
    <rect x="920" y="295" width="300" height="64" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="1070" y="333">Conditional Access targeting</text>
    <rect x="920" y="375" width="300" height="64" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="1070" y="413">Intune scope tags</text>
  </g>
  <!-- thin connectors from decisions back toward the OrgPath tags -->
  <g stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="918" y1="167" x2="360" y2="220" marker-end="url(#arr-grey7)"/>
    <line x1="918" y1="247" x2="360" y2="370" marker-end="url(#arr-grey7)"/>
    <line x1="918" y1="327" x2="360" y2="520" marker-end="url(#arr-grey7)"/>
    <line x1="918" y1="407" x2="360" y2="525" marker-end="url(#arr-grey7)"/>
  </g>

  <!-- footnote -->
  <rect x="60" y="620" width="1160" height="56" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="640" y="654" text-anchor="middle" font-size="15" fill="#33414F">Carried on the wire as a claim — e.g. the cert subject token <tspan font-family="Consolas, monospace" fill="#0D1B2E">{{OrgPath}}</tspan>. The cert is the token; OrgPath is its payload.</text>
</svg>
