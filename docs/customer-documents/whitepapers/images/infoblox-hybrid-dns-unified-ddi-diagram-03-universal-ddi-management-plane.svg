<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="60" y="52" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Universal DDI Management Plane</text>
  <text x="60" y="78" font-size="16" fill="#5A5A5A">One governance layer over all DNS, DHCP, and IPAM services — eliminating split-brain at the source</text>

  <defs>
    <marker id="arr-down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L5,10 L10,0 z" fill="#1E8C8C"/></marker>
    <marker id="arr-up" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,10 L5,0 L10,10 z" fill="#0D1B2E"/></marker>
  </defs>

  <!-- Top: Universal DDI Plane -->
  <rect x="60" y="100" width="1160" height="130" rx="14" fill="#0D1B2E"/>
  <text x="640" y="132" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E8C8C">Universal DDI Management Plane</text>
  <text x="640" y="154" text-anchor="middle" font-size="14" fill="#9BB8CC">Single pane of glass · Policy-as-code · Audit log · DNSSEC signing · Threat intelligence feed · RPZ enforcement</text>

  <rect x="90" y="166" width="220" height="48" rx="8" fill="#1A3A52"/>
  <text x="200" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Zone Management</text>
  <text x="200" y="204" text-anchor="middle" font-size="11" fill="#9BB8CC">Authoritative for all zones</text>

  <rect x="340" y="166" width="220" height="48" rx="8" fill="#1A3A52"/>
  <text x="450" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">IPAM Allocation</text>
  <text x="450" y="204" text-anchor="middle" font-size="11" fill="#9BB8CC">RFC 1918 dedup + supernet</text>

  <rect x="590" y="166" width="220" height="48" rx="8" fill="#1A3A52"/>
  <text x="700" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">DHCP Grid</text>
  <text x="700" y="204" text-anchor="middle" font-size="11" fill="#9BB8CC">Failover + lease tracking</text>

  <rect x="840" y="166" width="200" height="48" rx="8" fill="#1A3A52"/>
  <text x="940" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Security Enforcement</text>
  <text x="940" y="204" text-anchor="middle" font-size="11" fill="#9BB8CC">RPZ + threat intel + DoH</text>

  <rect x="1060" y="166" width="140" height="48" rx="8" fill="#1E8C8C"/>
  <text x="1130" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Change</text>
  <text x="1130" y="204" text-anchor="middle" font-size="11" fill="#CCEEE8">Audit log</text>

  <!-- Connectors down -->
  <line x1="200" y1="250" x2="200" y2="310" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="450" y1="250" x2="450" y2="310" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="700" y1="250" x2="700" y2="310" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="940" y1="250" x2="940" y2="310" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="1130" y1="250" x2="1130" y2="310" stroke="#1E8C8C" stroke-width="2"/>

  <!-- Infrastructure row -->
  <!-- On-Premises -->
  <rect x="60" y="310" width="220" height="170" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="170" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">On-Premises</text>
  <text x="170" y="356" text-anchor="middle" font-size="12" fill="#5A5A5A">Windows Server DNS</text>
  <text x="170" y="374" text-anchor="middle" font-size="12" fill="#5A5A5A">AD-integrated zones</text>
  <text x="170" y="392" text-anchor="middle" font-size="12" fill="#5A5A5A">BIND / Infoblox Grid</text>
  <text x="170" y="412" text-anchor="middle" font-size="11" fill="#1E8C8C">Forwarder → DDI plane</text>
  <text x="170" y="432" text-anchor="middle" font-size="11" fill="#1E8C8C">RFC 2136 updates logged</text>
  <text x="170" y="452" text-anchor="middle" font-size="11" fill="#1E8C8C">AD migration bridged</text>
  <text x="170" y="470" text-anchor="middle" font-size="11" fill="#D4A017">SRV orphan detection</text>

  <!-- Azure -->
  <rect x="310" y="310" width="220" height="170" rx="10" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="420" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Azure</text>
  <text x="420" y="356" text-anchor="middle" font-size="12" fill="#5A5A5A">Private DNS Zones</text>
  <text x="420" y="374" text-anchor="middle" font-size="12" fill="#5A5A5A">Private Resolver DoH/DoT</text>
  <text x="420" y="392" text-anchor="middle" font-size="12" fill="#5A5A5A">Conditional forwarders</text>
  <text x="420" y="412" text-anchor="middle" font-size="11" fill="#1E8C8C">Resolver → DDI plane</text>
  <text x="420" y="432" text-anchor="middle" font-size="11" fill="#1E8C8C">Zone delegation synced</text>
  <text x="420" y="452" text-anchor="middle" font-size="11" fill="#1E8C8C">IPAM integration via API</text>

  <!-- AWS -->
  <rect x="560" y="310" width="220" height="170" rx="10" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="670" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">AWS</text>
  <text x="670" y="356" text-anchor="middle" font-size="12" fill="#5A5A5A">Route 53 Private Hosted</text>
  <text x="670" y="374" text-anchor="middle" font-size="12" fill="#5A5A5A">Resolver Inbound Endpoints</text>
  <text x="670" y="392" text-anchor="middle" font-size="12" fill="#5A5A5A">Resolver Rules / DNSSEC</text>
  <text x="670" y="412" text-anchor="middle" font-size="11" fill="#1E8C8C">Resolver endpoint → DDI</text>
  <text x="670" y="432" text-anchor="middle" font-size="11" fill="#1E8C8C">PHZ zones registered</text>
  <text x="670" y="452" text-anchor="middle" font-size="11" fill="#1E8C8C">IPAM via CIDR allocation</text>

  <!-- GCP -->
  <rect x="810" y="310" width="220" height="170" rx="10" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="920" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">GCP</text>
  <text x="920" y="356" text-anchor="middle" font-size="12" fill="#5A5A5A">Cloud DNS Managed Zones</text>
  <text x="920" y="374" text-anchor="middle" font-size="12" fill="#5A5A5A">Peering + forwarding zones</text>
  <text x="920" y="392" text-anchor="middle" font-size="12" fill="#5A5A5A">DNSSEC per-zone policy</text>
  <text x="920" y="412" text-anchor="middle" font-size="11" fill="#1E8C8C">Inbound DNS policy → DDI</text>
  <text x="920" y="432" text-anchor="middle" font-size="11" fill="#1E8C8C">Peering registered in IPAM</text>

  <!-- VMware / NSX -->
  <rect x="1060" y="310" width="180" height="170" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="1150" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">VMware NSX-T</text>
  <text x="1150" y="356" text-anchor="middle" font-size="12" fill="#5A5A5A">Segment-local DNS</text>
  <text x="1150" y="374" text-anchor="middle" font-size="12" fill="#5A5A5A">Edge gateway forwarders</text>
  <text x="1150" y="394" text-anchor="middle" font-size="11" fill="#1E8C8C">Forwarder → DDI plane</text>
  <text x="1150" y="412" text-anchor="middle" font-size="11" fill="#1E8C8C">Segment IPs in IPAM</text>

  <!-- AD Migration callout -->
  <rect x="60" y="506" width="600" height="90" rx="10" fill="#FDF8EC" stroke="#D4A017" stroke-width="1.5"/>
  <text x="360" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#D4A017">AD Migration: the DNS orphan risk</text>
  <text x="360" y="550" text-anchor="middle" font-size="12" fill="#5A5A5A">Windows Server DNS SRV records (_ldap, _kerberos, _gc) do not migrate automatically to Entra ID.</text>
  <text x="360" y="568" text-anchor="middle" font-size="12" fill="#5A5A5A">Unified DDI detects orphaned records and bridges them to the new zone before Kerberos auth fails.</text>
  <text x="360" y="586" text-anchor="middle" font-size="11" fill="#D4A017">Token-based auth (OIDC/FIDO2) reduces the Kerberos dependency — but DNS records must follow the timeline.</text>

  <!-- Zero Trust callout -->
  <rect x="680" y="506" width="560" height="90" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="960" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">DNS becomes the L7 application surface</text>
  <text x="960" y="550" text-anchor="middle" font-size="12" fill="#5A5A5A">*.api.agency.gov is not a single host — it is a namespace of applications.</text>
  <text x="960" y="568" text-anchor="middle" font-size="12" fill="#5A5A5A">HTTPS/SVCB records carry ALT-SVC, ECH keys, and ALPN ports — security policy travels with the name.</text>
  <text x="960" y="586" text-anchor="middle" font-size="11" fill="#1E8C8C">DNS management is application surface management in a zero-trust / service-mesh world.</text>

  <text x="640" y="640" text-anchor="middle" font-size="13" fill="#5A5A5A" font-style="italic">RFC 1034/1035 (DNS) · RFC 5625 (resolver behavior) · RFC 6762 (mDNS) · NIST SP 800-207 (ZTA) · BOD 25-01 (federal M365)</text>
  <text x="640" y="662" text-anchor="middle" font-size="13" fill="#0D1B2E" font-style="italic">Federal agencies that treat DNS as a commodity utility are systematically underestimating their ungoverned attack surface</text>
</svg>
