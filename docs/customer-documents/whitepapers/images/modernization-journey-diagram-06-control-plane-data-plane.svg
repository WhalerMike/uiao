<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · ice #EAF1FB · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arr-navy6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
    <marker id="arr-teal6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  </defs>

  <!-- TOP TIER: control plane -->
  <rect x="80" y="90" width="1120" height="200" rx="14" fill="#0D1B2E"/>
  <text x="110" y="135" font-size="24" font-weight="bold" fill="#FFFFFF">UIAO Control Plane</text>
  <text x="110" y="162" font-size="18" font-weight="bold" fill="#D7F2EE">GOVERNS</text>
  <g font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle">
    <rect x="500" y="115" width="200" height="150" rx="10" fill="#EAF1FB" stroke="#FFFFFF" stroke-width="1.5"/><text x="600" y="180">Desired state</text><text x="600" y="204">(canon)</text>
    <rect x="720" y="115" width="200" height="150" rx="10" fill="#EAF1FB" stroke="#FFFFFF" stroke-width="1.5"/><text x="820" y="180">Observe</text><text x="820" y="204">actual state</text>
    <rect x="940" y="115" width="220" height="150" rx="10" fill="#EAF1FB" stroke="#FFFFFF" stroke-width="1.5"/><text x="1050" y="180">Classify drift</text><text x="1050" y="204">+ reconcile</text>
  </g>

  <!-- DIVIDER: the line AD erased -->
  <line x1="80" y1="360" x2="1200" y2="360" stroke="#0D1B2E" stroke-width="2.5" stroke-dasharray="10 6"/>
  <rect x="318" y="343" width="644" height="32" rx="6" fill="#FFFFFF"/>
  <text x="640" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">The line AD erased — truth above, runtime enforcement below</text>

  <!-- BOTTOM TIER: provider data planes -->
  <rect x="80" y="430" width="1120" height="200" rx="14" fill="#1E8C8C"/>
  <text x="110" y="475" font-size="24" font-weight="bold" fill="#FFFFFF">Provider Data Planes</text>
  <text x="110" y="502" font-size="18" font-weight="bold" fill="#0D1B2E">EXECUTE</text>
  <g font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">
    <rect x="430" y="455" width="140" height="150" rx="10" fill="#FFFFFF"/><text x="500" y="525">Entra ID</text><text x="500" y="546" font-size="12" font-weight="normal">authenticate</text>
    <rect x="582" y="455" width="118" height="150" rx="10" fill="#FFFFFF"/><text x="641" y="525">Intune</text><text x="641" y="546" font-size="12" font-weight="normal">endpoint</text>
    <rect x="712" y="455" width="150" height="150" rx="10" fill="#FFFFFF"/><text x="787" y="518">SD-WAN /</text><text x="787" y="538">SASE</text><text x="787" y="560" font-size="12" font-weight="normal">route</text>
    <rect x="874" y="455" width="130" height="150" rx="10" fill="#FFFFFF"/><text x="939" y="525">Infoblox</text><text x="939" y="546" font-size="12" font-weight="normal">resolve</text>
    <rect x="1016" y="455" width="144" height="150" rx="10" fill="#FFFFFF"/><text x="1088" y="525">Sentinel</text><text x="1088" y="546" font-size="12" font-weight="normal">telemetry</text>
  </g>

  <!-- arrows: plan/apply/reconcile down, evidence up -->
  <line x1="250" y1="290" x2="250" y2="430" stroke="#0D1B2E" stroke-width="3" marker-end="url(#arr-navy6)"/>
  <text x="262" y="408" font-size="14" font-weight="bold" fill="#0D1B2E">plan / apply / reconcile</text>
  <line x1="200" y1="430" x2="200" y2="290" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal6)"/>
  <text x="70" y="318" font-size="14" font-weight="bold" fill="#1E8C8C">evidence</text>
</svg>
