<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="sDown" markerWidth="9" markerHeight="9" refX="8.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1E8C8C"/>
    </marker>
    <marker id="sUp" markerWidth="9" markerHeight="9" refX="8.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2E75B6"/>
    </marker>
  </defs>

  <text x="640" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="26" fill="#0D1B2E">Principle 1 — Restoring a Single Source of Truth</text>
  <text x="640" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#6B7A8D">Active Directory was never the system of record. HR was. The directory became truth by default because nothing upstream was authoritative.</text>
  <line x1="60" y1="84" x2="1220" y2="84" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ── BEFORE ─────────────────────────────────────────────────── -->
  <rect x="60" y="100" width="1160" height="30" rx="5" fill="#C0392B"/>
  <text x="640" y="121" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#FFFFFF">BEFORE — twelve regional directories, no arbiter among them</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF">
    <rect x="86" y="146" width="82" height="34" rx="4" fill="#C0392B"/><text x="127" y="168" text-anchor="middle">Region 1</text>
    <rect x="180" y="146" width="82" height="34" rx="4" fill="#C0392B"/><text x="221" y="168" text-anchor="middle">Region 2</text>
    <rect x="274" y="146" width="82" height="34" rx="4" fill="#C0392B"/><text x="315" y="168" text-anchor="middle">Region 3</text>
    <rect x="368" y="146" width="82" height="34" rx="4" fill="#C0392B"/><text x="409" y="168" text-anchor="middle">Region 4</text>
    <rect x="462" y="146" width="82" height="34" rx="4" fill="#C0392B"/><text x="503" y="168" text-anchor="middle">Region 5</text>
    <rect x="556" y="146" width="82" height="34" rx="4" fill="#C0392B"/><text x="597" y="168" text-anchor="middle">Region 6</text>
    <rect x="650" y="146" width="82" height="34" rx="4" fill="#C0392B"/><text x="691" y="168" text-anchor="middle">Region 7</text>
    <rect x="744" y="146" width="82" height="34" rx="4" fill="#C0392B"/><text x="785" y="168" text-anchor="middle">Region 8</text>
    <rect x="838" y="146" width="82" height="34" rx="4" fill="#C0392B"/><text x="879" y="168" text-anchor="middle">Region 9</text>
    <rect x="932" y="146" width="82" height="34" rx="4" fill="#C0392B"/><text x="973" y="168" text-anchor="middle">Region 10</text>
    <rect x="1026" y="146" width="82" height="34" rx="4" fill="#C0392B"/><text x="1067" y="168" text-anchor="middle">Region 11</text>
    <rect x="1120" y="146" width="82" height="34" rx="4" fill="#C0392B"/><text x="1161" y="168" text-anchor="middle">Region 12</text>
  </g>
  <g stroke="#C0392B" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="168" y1="163" x2="180" y2="163"/><line x1="262" y1="163" x2="274" y2="163"/>
    <line x1="356" y1="163" x2="368" y2="163"/><line x1="450" y1="163" x2="462" y2="163"/>
    <line x1="544" y1="163" x2="556" y2="163"/><line x1="638" y1="163" x2="650" y2="163"/>
    <line x1="732" y1="163" x2="744" y2="163"/><line x1="826" y1="163" x2="838" y2="163"/>
    <line x1="920" y1="163" x2="932" y2="163"/><line x1="1014" y1="163" x2="1026" y2="163"/>
    <line x1="1108" y1="163" x2="1120" y2="163"/>
  </g>
  <text x="640" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#C0392B">Schema drift between adjacent silos · duplicate records · no reconciliation · no authoritative answer to &quot;which one is right?&quot;</text>

  <!-- ── AFTER ──────────────────────────────────────────────────── -->
  <rect x="60" y="220" width="1160" height="30" rx="5" fill="#1E8C8C"/>
  <text x="640" y="241" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#FFFFFF">AFTER — an upstream authority the directory can be reconciled against</text>

  <rect x="380" y="268" width="520" height="76" rx="8" fill="#2E75B6" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="17" fill="#FFFFFF">Authoritative source of truth</text>
  <text x="640" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#EAF1FB">HR-derived identity attributes · one authoritative record per data type</text>
  <text x="640" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#EAF1FB">documented lineage from source to decision · not a runtime enforcer</text>

  <text x="180" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#1E8C8C">plan / apply / reconcile</text>
  <text x="180" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#6B7A8D">desired state pushed down</text>
  <text x="1100" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#2E75B6">observed state / evidence</text>
  <text x="1100" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#6B7A8D">signed records pushed up</text>

  <line x1="640" y1="344" x2="640" y2="372" stroke="#1E8C8C" stroke-width="2"/>
  <rect x="86" y="372" width="1108" height="28" rx="4" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.2"/>
  <text x="640" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="14" fill="#0D1B2E">Data planes — governed at runtime, not replaced</text>

  <g stroke="#1E8C8C" stroke-width="1.6" marker-end="url(#sDown)">
    <line x1="164" y1="400" x2="164" y2="418"/>
    <line x1="394" y1="400" x2="394" y2="418"/>
    <line x1="624" y1="400" x2="624" y2="418"/>
    <line x1="854" y1="400" x2="854" y2="418"/>
    <line x1="1084" y1="400" x2="1084" y2="418"/>
  </g>
  <g stroke="#2E75B6" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#sUp)">
    <line x1="212" y1="418" x2="212" y2="400"/>
    <line x1="442" y1="418" x2="442" y2="400"/>
    <line x1="672" y1="418" x2="672" y2="400"/>
    <line x1="902" y1="418" x2="902" y2="400"/>
    <line x1="1132" y1="418" x2="1132" y2="400"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="86" y="422" width="188" height="98" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="180" y="448" text-anchor="middle" font-weight="bold" font-size="14.5" fill="#0D1B2E">Identity provider</text>
    <text x="180" y="470" text-anchor="middle" font-size="12.5" fill="#33414F">authenticates at runtime</text>
    <text x="180" y="488" text-anchor="middle" font-size="12.5" fill="#33414F">issues tokens and claims</text>
    <text x="180" y="509" text-anchor="middle" font-size="12" fill="#6B7A8D">e.g. Entra ID</text>

    <rect x="316" y="422" width="188" height="98" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="410" y="448" text-anchor="middle" font-weight="bold" font-size="14.5" fill="#0D1B2E">Network fabric</text>
    <text x="410" y="470" text-anchor="middle" font-size="12.5" fill="#33414F">routes and enforces path</text>
    <text x="410" y="488" text-anchor="middle" font-size="12.5" fill="#33414F">policy per transaction</text>
    <text x="410" y="509" text-anchor="middle" font-size="12" fill="#6B7A8D">e.g. SD-WAN / SASE</text>

    <rect x="546" y="422" width="188" height="98" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="640" y="448" text-anchor="middle" font-weight="bold" font-size="14.5" fill="#0D1B2E">DDI platform</text>
    <text x="640" y="470" text-anchor="middle" font-size="12.5" fill="#33414F">resolves names, allocates</text>
    <text x="640" y="488" text-anchor="middle" font-size="12.5" fill="#33414F">addresses, holds inventory</text>
    <text x="640" y="509" text-anchor="middle" font-size="12" fill="#6B7A8D">DNS / DHCP / IPAM</text>

    <rect x="776" y="422" width="188" height="98" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="870" y="448" text-anchor="middle" font-weight="bold" font-size="14.5" fill="#0D1B2E">Device management</text>
    <text x="870" y="470" text-anchor="middle" font-size="12.5" fill="#33414F">assesses posture and</text>
    <text x="870" y="488" text-anchor="middle" font-size="12.5" fill="#33414F">compliance state</text>
    <text x="870" y="509" text-anchor="middle" font-size="12" fill="#6B7A8D">MDM / EDR</text>

    <rect x="1006" y="422" width="188" height="98" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="1100" y="448" text-anchor="middle" font-weight="bold" font-size="14.5" fill="#0D1B2E">Telemetry and audit</text>
    <text x="1100" y="470" text-anchor="middle" font-size="12.5" fill="#33414F">logs, monitors, retains</text>
    <text x="1100" y="488" text-anchor="middle" font-size="12.5" fill="#33414F">evidence continuously</text>
    <text x="1100" y="509" text-anchor="middle" font-size="12" fill="#6B7A8D">SIEM</text>
  </g>

  <!-- ── Footer ─────────────────────────────────────────────────── -->
  <rect x="86" y="540" width="1108" height="76" rx="6" fill="#0D1B2E"/>
  <text x="640" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15.5" fill="#FFFFFF">The identity provider is a data plane, not the source of truth.</text>
  <text x="640" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#D7F2EE">Putting the directory back in the enforcement role — and an HR-derived authority above it — is what stops the estate</text>
  <text x="640" y="608" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#D7F2EE">re-creating the original conflation of truth with the in-path enforcer. Tokens can then assert authorizations that are true.</text>

  <text x="86" y="648" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#6B7A8D">Named products are illustrations of a role; any equivalent in the same role substitutes cleanly.</text>
  <text x="86" y="674" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">Alignment: FICAM Architecture · NIST SP 800-63 Rev 4 · NIST SP 800-53 Rev 5 CM-8, SI-12 · NIST SP 800-207</text>
</svg>
