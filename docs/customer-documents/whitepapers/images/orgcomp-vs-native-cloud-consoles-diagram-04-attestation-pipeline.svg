<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-teal4" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1A9E8F"/></marker>
  </defs>

  <text x="800" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#1F3A5F">From Task Stream to Assessed Control</text>
  <text x="800" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#5A6B7B">A closed task is operational hygiene; an assessed control is what an authorizing official signs</text>

  <!-- card 1: Map -->
  <rect x="70" y="220" width="260" height="300" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M80,220 h240 a10,10 0 0 1 10,10 v70 h-260 v-70 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="200" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 1 · CA-2</text>
  <text x="200" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Map</text>
  <text x="200" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2A2A2A">
    <tspan x="200" dy="0">Control → the platform</tspan>
    <tspan x="200" dy="23">tests/tasks that evidence</tspan>
    <tspan x="200" dy="23">it (compliance-spine</tspan>
    <tspan x="200" dy="23">binding, not hand-kept)</tspan>
  </text>

  <line x1="330" y1="370" x2="368" y2="370" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal4)"/>

  <!-- card 2: Test -->
  <rect x="370" y="220" width="260" height="300" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M380,220 h240 a10,10 0 0 1 10,10 v70 h-260 v-70 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="500" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 2 · CA-2</text>
  <text x="500" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Test</text>
  <text x="500" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2A2A2A">
    <tspan x="500" dy="0">Scheduled control test</tspan>
    <tspan x="500" dy="23">reads the actioned posture</tspan>
    <tspan x="500" dy="23">roll-up: pass / fail / partial,</tspan>
    <tspan x="500" dy="23">evidence attached</tspan>
  </text>

  <line x1="630" y1="370" x2="668" y2="370" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal4)"/>

  <!-- card 3: Gap to POAM -->
  <rect x="670" y="220" width="260" height="300" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M680,220 h240 a10,10 0 0 1 10,10 v70 h-260 v-70 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="800" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 3 · CA-5</text>
  <text x="800" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Gap → POA&amp;M</text>
  <text x="800" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2A2A2A">
    <tspan x="800" dy="0">Any fail/partial becomes</tspan>
    <tspan x="800" dy="23">an owned POA&amp;M item —</tspan>
    <tspan x="800" dy="23">milestone, owner, required</tspan>
    <tspan x="800" dy="23">closure evidence</tspan>
  </text>

  <line x1="930" y1="370" x2="968" y2="370" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal4)"/>

  <!-- card 4: Emit -->
  <rect x="970" y="220" width="260" height="300" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M980,220 h240 a10,10 0 0 1 10,10 v70 h-260 v-70 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="1100" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 4 · CA-7</text>
  <text x="1100" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Emit</text>
  <text x="1100" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2A2A2A">
    <tspan x="1100" dy="0">OSCAL assessment-results</tspan>
    <tspan x="1100" dy="23">+ FedRAMP 20x KSI</tspan>
    <tspan x="1100" dy="23">evidence into the</tspan>
    <tspan x="1100" dy="23">ConMon package</tspan>
  </text>

  <line x1="1230" y1="370" x2="1268" y2="370" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal4)"/>

  <!-- destination card -->
  <rect x="1263" y="213" width="274" height="314" rx="14" fill="none" stroke="#D4860B" stroke-width="3"/>
  <rect x="1270" y="220" width="260" height="300" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M1280,220 h240 a10,10 0 0 1 10,10 v95 h-260 v-95 a10,10 0 0 1 10,-10 z" fill="#D4860B"/>
  <text x="1400" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#FFFFFF">DESTINATION</text>
  <text x="1400" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">
    <tspan x="1400" dy="0">Authorization</tspan>
    <tspan x="1400" dy="22">Package</tspan>
  </text>
  <text x="1400" y="357" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2A2A2A">
    <tspan x="1400" dy="0">Signed by the</tspan>
    <tspan x="1400" dy="23">authorizing official —</tspan>
    <tspan x="1400" dy="23">generated, diffable,</tspan>
    <tspan x="1400" dy="23">not hand-assembled</tspan>
  </text>

  <rect x="70" y="600" width="1460" height="80" rx="8" fill="#F4F7FA" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="800" y="634" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F">A closed remediation task is operational hygiene.</text>
  <text x="800" y="662" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F3A5F">An assessed control is what an authorizing official signs — this pipeline is the difference.</text>
</svg>
