<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1400" height="860" fill="#FFFFFF"/>
  <text x="700" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1F3A5F">The Transport Menu — Physics Varies, Compliance Contribution Does Not</text>
  <text x="700" y="74" text-anchor="middle" font-size="15" fill="#4A5A6A">Four pipes with radically different physics and identical NIST closure contribution: zero</text>

  <!-- Card 1: Fiber DIA -->
  <g>
    <rect x="40" y="100" width="310" height="330" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
    <rect x="40" y="100" width="310" height="52" rx="10" fill="#1F3A5F"/>
    <rect x="40" y="130" width="310" height="22" fill="#1F3A5F"/>
    <text x="195" y="133" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">FIBER DIA (BROADBAND)</text>
    <text x="60" y="182" font-size="14" font-weight="700" fill="#1F3A5F">Propagation</text>
    <text x="60" y="202" font-size="13.5" fill="#333">~200,000 km/s in glass —</text>
    <text x="60" y="220" font-size="13.5" fill="#333">two-thirds of vacuum light speed</text>
    <text x="60" y="252" font-size="14" font-weight="700" fill="#1F3A5F">Path geometry</text>
    <text x="60" y="272" font-size="13.5" fill="#333">ISP routing; locally short —</text>
    <text x="60" y="290" font-size="13.5" fill="#333">breakout at the branch</text>
    <text x="60" y="322" font-size="14" font-weight="700" fill="#1F3A5F">Reference one-way figure</text>
    <text x="60" y="346" font-size="17" font-weight="700" fill="#1A9E8F">5–15 ms</text>
    <text x="60" y="366" font-size="12.5" fill="#4A5A6A">Portland → nearby cloud region</text>
    <rect x="60" y="384" width="270" height="30" rx="6" fill="#EAF6F4"/>
    <text x="195" y="404" text-anchor="middle" font-size="12.5" fill="#0E5C5C">The default local-breakout pipe</text>
  </g>

  <!-- Card 2: MPLS -->
  <g>
    <rect x="378" y="100" width="310" height="330" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
    <rect x="378" y="100" width="310" height="52" rx="10" fill="#1F3A5F"/>
    <rect x="378" y="130" width="310" height="22" fill="#1F3A5F"/>
    <text x="533" y="133" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">MPLS</text>
    <text x="398" y="182" font-size="14" font-weight="700" fill="#1F3A5F">Propagation</text>
    <text x="398" y="202" font-size="13.5" fill="#333">Same glass, same speed —</text>
    <text x="398" y="220" font-size="13.5" fill="#333">the contract does not change physics</text>
    <text x="398" y="252" font-size="14" font-weight="700" fill="#1F3A5F">Path geometry</text>
    <text x="398" y="272" font-size="13.5" fill="#333">Carrier peering topology, often</text>
    <text x="398" y="290" font-size="13.5" fill="#333">indirect — plus the agency hairpin</text>
    <text x="398" y="322" font-size="14" font-weight="700" fill="#1F3A5F">Reference one-way figure</text>
    <text x="398" y="346" font-size="17" font-weight="700" fill="#C0392B">100–130 ms</text>
    <text x="398" y="366" font-size="12.5" fill="#4A5A6A">Portland → cloud via East-Coast DC</text>
    <rect x="398" y="384" width="270" height="30" rx="6" fill="#FBEEEC"/>
    <text x="533" y="404" text-anchor="middle" font-size="12.5" fill="#C0392B">The hairpin G.114 cannot afford</text>
  </g>

  <!-- Card 3: LEO -->
  <g>
    <rect x="716" y="100" width="310" height="330" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
    <rect x="716" y="100" width="310" height="52" rx="10" fill="#1F3A5F"/>
    <rect x="716" y="130" width="310" height="22" fill="#1F3A5F"/>
    <text x="871" y="133" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">LEO SATELLITE (STARLINK-CLASS)</text>
    <text x="736" y="182" font-size="14" font-weight="700" fill="#1F3A5F">Propagation</text>
    <text x="736" y="202" font-size="13.5" fill="#333">~299,792 km/s in vacuum —</text>
    <text x="736" y="220" font-size="13.5" fill="#333">50% faster than glass per km</text>
    <text x="736" y="252" font-size="14" font-weight="700" fill="#1F3A5F">Path geometry</text>
    <text x="736" y="272" font-size="13.5" fill="#333">Up 550 km, across the constellation,</text>
    <text x="736" y="290" font-size="13.5" fill="#333">down — not GEO's 35,786 km</text>
    <text x="736" y="322" font-size="14" font-weight="700" fill="#1F3A5F">Reference one-way figure</text>
    <text x="736" y="346" font-size="17" font-weight="700" fill="#1A9E8F">20–40 ms</text>
    <text x="736" y="366" font-size="12.5" fill="#4A5A6A">end-to-end long-haul, improving</text>
    <rect x="736" y="384" width="270" height="30" rx="6" fill="#EAF6F4"/>
    <text x="871" y="404" text-anchor="middle" font-size="12.5" fill="#0E5C5C">Not the satellite you rejected</text>
  </g>

  <!-- Card 4: 5G -->
  <g>
    <rect x="1054" y="100" width="310" height="330" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
    <rect x="1054" y="100" width="310" height="52" rx="10" fill="#1F3A5F"/>
    <rect x="1054" y="130" width="310" height="22" fill="#1F3A5F"/>
    <text x="1209" y="133" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">5G (MID-BAND / MEC)</text>
    <text x="1074" y="182" font-size="14" font-weight="700" fill="#1F3A5F">Propagation</text>
    <text x="1074" y="202" font-size="13.5" fill="#333">Radio to the tower, then fiber;</text>
    <text x="1074" y="220" font-size="13.5" fill="#333">0.5 ms slots mid-band vs 1 ms LTE</text>
    <text x="1074" y="252" font-size="14" font-weight="700" fill="#1F3A5F">Path geometry</text>
    <text x="1074" y="272" font-size="13.5" fill="#333">CUPS + MEC break traffic out</text>
    <text x="1074" y="290" font-size="13.5" fill="#333">at or near the cell edge</text>
    <text x="1074" y="322" font-size="14" font-weight="700" fill="#1F3A5F">Reference one-way figure</text>
    <text x="1074" y="346" font-size="17" font-weight="700" fill="#1A9E8F">5–10 ms</text>
    <text x="1074" y="366" font-size="12.5" fill="#4A5A6A">across the air interface</text>
    <rect x="1074" y="384" width="270" height="30" rx="6" fill="#EAF6F4"/>
    <text x="1209" y="404" text-anchor="middle" font-size="12.5" fill="#0E5C5C">Often rural offices' best DIA</text>
  </g>

  <!-- Zero controls banner -->
  <rect x="40" y="456" width="1324" height="72" rx="10" fill="#C0392B"/>
  <text x="700" y="486" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">NIST SP 800-53 controls satisfied by the pipe itself: 0 — for all four transports</text>
  <text x="700" y="512" text-anchor="middle" font-size="14.5" fill="#FBEEEC">SC-7 · SC-8 · AC-4 · SI-3 · SI-4 · AU-12 · CA-7 are satisfied by the SD-WAN / SASE / TIC 3.0 stack that governs the pipe — never by the pipe</text>

  <!-- 6G roadmap strip -->
  <rect x="40" y="552" width="1324" height="128" rx="10" fill="#FFFFFF" stroke="#D4860B" stroke-width="2.5" stroke-dasharray="9,6"/>
  <text x="66" y="586" font-size="17" font-weight="700" fill="#D4860B">6G — ROADMAP, NOT PRODUCT</text>
  <text x="66" y="614" font-size="14" fill="#333">ITU-R IMT-2030 defines the target usage scenarios · 3GPP study work aims at first 6G specifications in the Release 21 timeframe · commercial expectations cluster around 2030</text>
  <text x="66" y="640" font-size="14" fill="#333">Native non-terrestrial network (NTN) integration will blur the LEO / cellular boundary · sub-millisecond air-interface targets do not repeal propagation physics</text>
  <rect x="66" y="652" width="560" height="2" fill="#D4860B" opacity="0.35"/>
  <text x="66" y="672" font-size="14" font-weight="700" fill="#1F3A5F">Whatever pipe 6G delivers, it arrives as exactly that — a pipe. The overlay absorbs it as one more path to probe, measure, encrypt, and steer.</text>

  <!-- Punchline -->
  <rect x="40" y="704" width="1324" height="64" rx="10" fill="#1A9E8F"/>
  <text x="700" y="732" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Transport diversity is a reason for the overlay, not a substitute for it</text>
  <text x="700" y="756" text-anchor="middle" font-size="14" fill="#EAF6F4">Four pipes with different failure modes are an asset only if something measures all four continuously and steers per-application</text>

  <text x="700" y="820" text-anchor="middle" font-size="12" fill="#8A97A3">Source: SD-WAN vs. DIA Under TIC 3.0 whitepaper · reference figures from OrgComp Vol I Book 05 (Network Modernization) · Date Code 2026-07-28</text>
</svg>
