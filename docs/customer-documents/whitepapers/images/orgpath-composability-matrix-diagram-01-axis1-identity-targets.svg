  <rect x="320" y="96" width="14" height="14" fill="#9BB8CC" rx="3"/>
  <text x="340" y="108" font-size="13" fill="#0D1B2E">Proposed — profile + transport built, conformance pending</text>
  <rect x="720" y="96" width="14" height="14" fill="#EAF1FB" stroke="#5A5A5A" stroke-width="1" rx="3"/>
  <text x="740" y="108" font-size="13" fill="#0D1B2E">Profile-only — facet map staged, transport in later ADR</text>

  <!-- Table header -->
