  <line x1="60" y1="612" x2="1220" y2="612" stroke="#DDDDDD" stroke-width="1"/>

  <!-- Bottom notes -->
  <rect x="60" y="624" width="560" height="68" rx="8" fill="#EAF1FB"/>
  <text x="340" y="645" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">OrgPath invariant</text>
  <text x="340" y="663" text-anchor="middle" font-size="12" fill="#5A5A5A">The 15-facet model is vendor-neutral (ADR-098 D2).</text>
  <text x="340" y="681" text-anchor="middle" font-size="12" fill="#5A5A5A">New profiles are additive — no core change required.</text>

  <rect x="660" y="624" width="560" height="68" rx="8" fill="#EAF1FB"/>
  <text x="940" y="645" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">SailPoint separability</text>
  <text x="940" y="663" text-anchor="middle" font-size="12" fill="#5A5A5A">SailPoint NERM (ADR-059) deepens non-employee lifecycle only.</text>
  <text x="940" y="681" text-anchor="middle" font-size="12" fill="#5A5A5A">Remove SailPoint — OrgPath loses nothing of its core.</text>
