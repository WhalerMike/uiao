<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="60" y="52" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">OrgPath Composability — Axis 1: Identity / Storage Targets</text>
  <text x="60" y="78" font-size="16" fill="#5A5A5A">OrgPath runs without any single vendor · Microsoft is the reference profile, not the only profile</text>

