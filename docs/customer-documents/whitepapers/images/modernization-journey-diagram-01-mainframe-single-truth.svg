<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · red #C0392B · ice #EAF1FB · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="dot-teal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#1E8C8C"/></marker>
  </defs>

  <!-- locked-room boundary -->
  <rect x="455" y="250" width="370" height="210" rx="6" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="3 4"/>
  <!-- lock glyph on the boundary -->
  <g>
    <rect x="624" y="236" width="32" height="24" rx="4" fill="#5A5A5A"/>
    <path d="M632 236 v-6 a8 8 0 0 1 16 0 v6" fill="none" stroke="#5A5A5A" stroke-width="3"/>
  </g>
  <text x="640" y="446" text-anchor="middle" font-size="13" fill="#6B7A8D">physical access boundary</text>

  <!-- mainframe -->
  <rect x="495" y="290" width="290" height="130" rx="12" fill="#0D1B2E"/>
  <text x="640" y="345" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF">Mainframe</text>
  <text x="640" y="378" text-anchor="middle" font-size="18" fill="#EAF1FB">One Source of Truth</text>

  <!-- 8 terminals + connecting lines -->
  <g>
    <line x1="200" y1="155" x2="500" y2="300" stroke="#1E8C8C" stroke-width="2" marker-start="url(#dot-teal)"/>
    <line x1="470" y1="120" x2="560" y2="288" stroke="#1E8C8C" stroke-width="2" marker-start="url(#dot-teal)"/>
    <line x1="810" y1="120" x2="725" y2="288" stroke="#1E8C8C" stroke-width="2" marker-start="url(#dot-teal)"/>
    <line x1="1080" y1="155" x2="782" y2="300" stroke="#1E8C8C" stroke-width="2" marker-start="url(#dot-teal)"/>
    <line x1="175" y1="350" x2="493" y2="350" stroke="#1E8C8C" stroke-width="2" marker-start="url(#dot-teal)"/>
    <line x1="1105" y1="350" x2="787" y2="350" stroke="#1E8C8C" stroke-width="2" marker-start="url(#dot-teal)"/>
    <line x1="330" y1="540" x2="540" y2="422" stroke="#1E8C8C" stroke-width="2" marker-start="url(#dot-teal)"/>
    <line x1="950" y1="540" x2="745" y2="422" stroke="#1E8C8C" stroke-width="2" marker-start="url(#dot-teal)"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <rect x="120" y="133" width="120" height="44" rx="6" fill="#1E8C8C"/><text x="180" y="160">Terminal</text>
    <rect x="410" y="76" width="120" height="44" rx="6" fill="#1E8C8C"/><text x="470" y="103">Terminal</text>
    <rect x="750" y="76" width="120" height="44" rx="6" fill="#1E8C8C"/><text x="810" y="103">Terminal</text>
    <rect x="1020" y="133" width="120" height="44" rx="6" fill="#1E8C8C"/><text x="1080" y="160">Terminal</text>
    <rect x="70" y="328" width="120" height="44" rx="6" fill="#1E8C8C"/><text x="130" y="355">Terminal</text>
    <rect x="1090" y="328" width="120" height="44" rx="6" fill="#1E8C8C"/><text x="1150" y="355">Terminal</text>
    <rect x="270" y="518" width="120" height="44" rx="6" fill="#1E8C8C"/><text x="330" y="545">Terminal</text>
    <rect x="890" y="518" width="120" height="44" rx="6" fill="#1E8C8C"/><text x="950" y="545">Terminal</text>
  </g>
  <!-- representative annotation -->
  <text x="300" y="245" font-size="13" font-family="Consolas, monospace" fill="#6B7A8D">keystrokes out &#8594; screen refresh back</text>

  <!-- bottom band -->
  <rect x="60" y="624" width="1160" height="66" rx="10" fill="#0D1B2E"/>
  <text x="640" y="665" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">Truth = Network Perimeter = Physical Access</text>
</svg>
