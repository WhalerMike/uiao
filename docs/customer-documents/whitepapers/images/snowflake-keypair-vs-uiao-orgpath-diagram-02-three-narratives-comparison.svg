<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="60" y="52" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Three Narratives — One Movement</text>
  <text x="60" y="78" font-size="16" fill="#5A5A5A">Snowflake forces the credential change · UIAO governs what it becomes · OrgPath governs who it is for</text>

  <!-- Narrative 1: Snowflake -->
  <rect x="60" y="108" width="360" height="460" rx="16" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="60" y="108" width="360" height="56" rx="8" fill="#0D1B2E"/>
  <text x="240" y="143" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Snowflake Narrative</text>
  <text x="240" y="162" text-anchor="middle" font-size="13" fill="#9BB8CC">Product-deprecation · deadline-driven</text>

  <text x="240" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">What it sees</text>
  <text x="240" y="222" text-anchor="middle" font-size="13" fill="#5A5A5A">A SaaS platform deprecating</text>
  <text x="240" y="240" text-anchor="middle" font-size="13" fill="#5A5A5A">single-factor passwords on a</text>
  <text x="240" y="258" text-anchor="middle" font-size="13" fill="#5A5A5A">published schedule. Service accounts</text>
  <text x="240" y="276" text-anchor="middle" font-size="13" fill="#5A5A5A">cannot do MFA → must move to</text>
  <text x="240" y="294" text-anchor="middle" font-size="13" fill="#5A5A5A">key pair, OAuth, or WIF.</text>

  <text x="240" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">The exits</text>
  <rect x="80" y="340" width="320" height="32" rx="6" fill="#1E8C8C"/>
  <text x="240" y="361" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1. Key-pair (RSA) — Phase A</text>
  <rect x="80" y="380" width="320" height="32" rx="6" fill="#1E8C8C"/>
  <text x="240" y="401" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2. OAuth (client-creds)</text>
  <rect x="80" y="420" width="320" height="32" rx="6" fill="#1E8C8C"/>
  <text x="240" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">3. Workload Identity Federation — Phase B</text>

  <rect x="80" y="466" width="320" height="80" rx="8" fill="#0D1B2E"/>
  <text x="240" y="488" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">Snowflake's own roadmap</text>
  <text x="240" y="508" text-anchor="middle" font-size="12" fill="#FFFFFF">WIF GA Aug 2025 — Snowflake places</text>
  <text x="240" y="526" text-anchor="middle" font-size="12" fill="#FFFFFF">key pairs in the same sentence as</text>
  <text x="240" y="540" text-anchor="middle" font-size="12" fill="#FFFFFF">passwords it is deprecating</text>

  <!-- Arrow 1→2 -->
  <line x1="420" y1="340" x2="460" y2="340" stroke="#0D1B2E" stroke-width="3"/>
  <polygon points="455,332 470,340 455,348" fill="#0D1B2E"/>

  <!-- Narrative 2: UIAO -->
  <rect x="460" y="108" width="360" height="460" rx="16" fill="#E6F7F2" stroke="#1E8C8C" stroke-width="2.5"/>
  <rect x="460" y="108" width="360" height="56" rx="8" fill="#1E8C8C"/>
  <text x="640" y="143" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">UIAO Narrative</text>
  <text x="640" y="162" text-anchor="middle" font-size="13" fill="#CCEEE8">Credential-lifecycle · what the credential becomes</text>

  <text x="640" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">What it sees</text>
  <text x="640" y="222" text-anchor="middle" font-size="13" fill="#5A5A5A">Not a security scale (password=bad,</text>
  <text x="640" y="240" text-anchor="middle" font-size="13" fill="#5A5A5A">key-pair=better) but a</text>
  <text x="640" y="258" text-anchor="middle" font-size="13" fill="#5A5A5A">credential-lifecycle problem:</text>
  <text x="640" y="280" text-anchor="middle" font-size="13" fill="#C0392B">Shared secret → must be eliminated</text>
  <text x="640" y="298" text-anchor="middle" font-size="13" fill="#D4A017">Stored credential → dated exception</text>
  <text x="640" y="316" text-anchor="middle" font-size="13" fill="#1E8C8C">Credential-free → steady state</text>

  <text x="640" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">The doctrine (ADR-004 / ADR-091)</text>
  <rect x="480" y="358" width="320" height="40" rx="6" fill="#C0392B"/>
  <text x="640" y="383" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Password — DRIFT-AUTHZ if present</text>
  <rect x="480" y="406" width="320" height="40" rx="6" fill="#D4A017"/>
  <text x="640" y="431" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Key pair — endorsed Phase A; requires rotation</text>
  <rect x="480" y="454" width="320" height="40" rx="6" fill="#1E8C8C"/>
  <text x="640" y="479" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Federation (WIF/SAML) — target Phase B</text>

  <rect x="480" y="506" width="320" height="50" rx="8" fill="#0D1B2E"/>
  <text x="640" y="528" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8C8C">Key pair is Phase A, not the finish line</text>
  <text x="640" y="548" text-anchor="middle" font-size="12" fill="#FFFFFF">Endorsed because it meets the deadline</text>

  <!-- Arrow 2→3 -->
  <line x1="820" y1="340" x2="860" y2="340" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="855,332 870,340 855,348" fill="#1E8C8C"/>

  <!-- Narrative 3: OrgPath -->
  <rect x="860" y="108" width="360" height="460" rx="16" fill="#F8F4E8" stroke="#D4A017" stroke-width="2"/>
  <rect x="860" y="108" width="360" height="56" rx="8" fill="#D4A017"/>
  <text x="1040" y="143" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">OrgPath Narrative</text>
  <text x="1040" y="162" text-anchor="middle" font-size="13" fill="#0D1B2E">Access-authority · who the credential is for</text>

  <text x="1040" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">What it sees</text>
  <text x="1040" y="222" text-anchor="middle" font-size="13" fill="#5A5A5A">Not HOW a principal proves identity</text>
  <text x="1040" y="240" text-anchor="middle" font-size="13" fill="#5A5A5A">(that is UIAO's job) but</text>
  <text x="1040" y="258" text-anchor="middle" font-size="13" fill="#5A5A5A">WHICH principals may reach</text>
  <text x="1040" y="276" text-anchor="middle" font-size="13" fill="#5A5A5A">WHICH Snowflake roles.</text>

  <text x="1040" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">The mechanism</text>
  <rect x="880" y="322" width="320" height="50" rx="6" fill="#1E8C8C"/>
  <text x="1040" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Facet predicate evaluated continuously</text>
  <text x="1040" y="362" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#CCEEE8">Dept=Finance AND Role=Analyst</text>
  <rect x="880" y="380" width="320" height="50" rx="6" fill="#1E8C8C"/>
  <text x="1040" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Maps to Snowflake warehouse role</text>
  <text x="1040" y="420" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#CCEEE8">→ FINANCE_ANALYST_WH</text>
  <rect x="880" y="438" width="320" height="40" rx="6" fill="#C0392B"/>
  <text x="1040" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Stray grant = DRIFT-AUTHZ finding</text>

  <rect x="880" y="492" width="320" height="64" rx="8" fill="#0D1B2E"/>
  <text x="1040" y="514" text-anchor="middle" font-size="12" font-weight="bold" fill="#D4A017">Ticket queue → org-structure rule</text>
  <text x="1040" y="534" text-anchor="middle" font-size="12" fill="#FFFFFF">Grant computed from org structure,</text>
  <text x="1040" y="552" text-anchor="middle" font-size="12" fill="#FFFFFF">evaluated continuously, not by hand</text>

  <!-- Bottom bar -->
  <rect x="60" y="596" width="1160" height="72" rx="12" fill="#0D1B2E"/>
  <text x="640" y="622" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E8C8C">Three altitudes — not three ways to tell the same story</text>
  <text x="640" y="646" text-anchor="middle" font-size="13" fill="#FFFFFF">Snowflake forces the move · UIAO governs what the credential becomes (Phase A bridge → Phase B federation) · OrgPath governs who it is for</text>
  <text x="640" y="664" text-anchor="middle" font-size="12" fill="#9BB8CC" font-style="italic">Architecture comparison — Snowflake is outside current GCC-Moderate boundary (ADR-033) · patterns apply to this class of SaaS credential problem</text>
</svg>
