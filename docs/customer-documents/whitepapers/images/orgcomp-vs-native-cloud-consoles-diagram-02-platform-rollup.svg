<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="800" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#1F3A5F">Four Platforms, One Verdict</text>
  <text x="800" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#5A6B7B">Every native engine actuates. Every control still reads Tool-attestable: No.</text>

  <!-- header row -->
  <rect x="80" y="150" width="1440" height="66" fill="#1F3A5F"/>
  <text x="190" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Platform</text>
  <text x="640" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Native engines (actuate)</text>
  <text x="1080" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Controls</text>
  <text x="1350" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Tool-attestable?</text>

  <!-- row 1: M365 -->
  <rect x="80" y="216" width="1440" height="138" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
  <text x="190" y="292" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1F3A5F">M365</text>
  <text x="640" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2A2A2A">Conditional Access, Purview</text>
  <text x="1080" y="292" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#2A2A2A">CM-6</text>
  <rect x="1290" y="264" width="120" height="56" rx="28" fill="#C0392B"/>
  <text x="1350" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">No</text>

  <!-- row 2: Azure -->
  <rect x="80" y="354" width="1440" height="138" fill="#F4F7FA" stroke="#E3E8EF" stroke-width="1"/>
  <text x="190" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1F3A5F">Azure</text>
  <text x="640" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2A2A2A">
    <tspan x="640" dy="0">Azure Policy, Defender for Cloud,</tspan>
    <tspan x="640" dy="26">MDVM, Update Manager (+ Arc)</tspan>
  </text>
  <text x="1080" y="430" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#2A2A2A">CM-6, RA-5, SI-2</text>
  <rect x="1290" y="402" width="120" height="56" rx="28" fill="#C0392B"/>
  <text x="1350" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">No</text>

  <!-- row 3: AWS -->
  <rect x="80" y="492" width="1440" height="138" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
  <text x="190" y="568" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1F3A5F">AWS</text>
  <text x="640" y="546" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2A2A2A">
    <tspan x="640" dy="0">AWS Config, Security Hub CSPM</tspan>
    <tspan x="640" dy="26">(+ GuardDuty, Inspector), Patch Manager</tspan>
  </text>
  <text x="1080" y="559" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#2A2A2A">
    <tspan x="1080" dy="0">CM-2/CM-6,</tspan>
    <tspan x="1080" dy="22">CM-6/RA-5, SI-2</tspan>
  </text>
  <rect x="1290" y="540" width="120" height="56" rx="28" fill="#C0392B"/>
  <text x="1350" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">No</text>

  <!-- row 4: VMware -->
  <rect x="80" y="630" width="1440" height="138" fill="#F4F7FA" stroke="#E3E8EF" stroke-width="1"/>
  <text x="190" y="706" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1F3A5F">VMware</text>
  <text x="640" y="684" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2A2A2A">
    <tspan x="640" dy="0">vSphere Config Profiles, VCF Operations</tspan>
    <tspan x="640" dy="26">+ NSX DFW, vSphere Lifecycle Manager</tspan>
  </text>
  <text x="1080" y="697" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#2A2A2A">
    <tspan x="1080" dy="0">CM-2/CM-6,</tspan>
    <tspan x="1080" dy="22">CM-6/RA-5, SI-2</tspan>
  </text>
  <rect x="1290" y="678" width="120" height="56" rx="28" fill="#C0392B"/>
  <text x="1350" y="714" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">No</text>

  <rect x="80" y="150" width="1440" height="618" fill="none" stroke="#1F3A5F" stroke-width="2"/>
  <line x1="300" y1="150" x2="300" y2="768" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="980" y1="150" x2="980" y2="768" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="1180" y1="150" x2="1180" y2="768" stroke="#1F3A5F" stroke-width="1.5"/>

  <rect x="80" y="800" width="1440" height="66" rx="8" fill="#FBEED2" stroke="#D4860B" stroke-width="1.5"/>
  <text x="800" y="840" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#7A4E00">Four vendors, four native stacks, one identical column — a structural finding, not a per-vendor gap.</text>
</svg>
