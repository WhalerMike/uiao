<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093) · navy #0D1B2E · teal #1E8C8C · red #C0392B · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="640" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Two Programs, One Substrate</text>
  <text x="640" y="84" text-anchor="middle" font-size="16" fill="#5A5A5A">The federal SSOT mandate and the AD &#8594; Entra ID migration converge on the same identity layer</text>

  <!-- Track 1 — Federal Data Strategy lane -->
  <rect x="60" y="120" width="520" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="320" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Federal Data Strategy / Evidence Act / CDO SSOT Mandate</text>
  <g font-size="12" fill="#0D1B2E" text-anchor="middle">
    <rect x="80" y="166" width="92" height="52" rx="6" fill="#FFFFFF" stroke="#1E8C8C"/>
    <text x="126" y="188">MDM hub /</text>
    <text x="126" y="203">golden records</text>
    <rect x="182" y="166" width="92" height="52" rx="6" fill="#FFFFFF" stroke="#1E8C8C"/>
    <text x="228" y="188">Cloud</text>
    <text x="228" y="203">consolidation</text>
    <rect x="284" y="166" width="92" height="52" rx="6" fill="#FFFFFF" stroke="#1E8C8C"/>
    <text x="330" y="188">Data catalog</text>
    <text x="330" y="203">+ lineage</text>
    <rect x="386" y="166" width="92" height="52" rx="6" fill="#FFFFFF" stroke="#1E8C8C"/>
    <text x="432" y="188">CDO governance</text>
    <text x="432" y="203">board</text>
    <rect x="488" y="166" width="80" height="52" rx="6" fill="#FFFFFF" stroke="#1E8C8C"/>
    <text x="528" y="188">Federated</text>
    <text x="528" y="203">standards</text>
  </g>

  <!-- Track 2 — AD to Entra migration lane -->
  <rect x="700" y="120" width="520" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="960" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">AD &#8594; Entra ID Migration Imperative</text>
  <g font-size="12" fill="#0D1B2E" text-anchor="middle">
    <rect x="720" y="166" width="92" height="52" rx="6" fill="#FFFFFF" stroke="#1E8C8C"/>
    <text x="766" y="188">AD forest</text>
    <text x="766" y="203">(legacy)</text>
    <rect x="822" y="166" width="92" height="52" rx="6" fill="#FFFFFF" stroke="#1E8C8C"/>
    <text x="868" y="188">Sync engine</text>
    <text x="868" y="203">(hybrid)</text>
    <rect x="924" y="166" width="92" height="52" rx="6" fill="#FFFFFF" stroke="#1E8C8C"/>
    <text x="970" y="188">Entra ID</text>
    <text x="970" y="203">(target)</text>
    <rect x="1026" y="166" width="92" height="52" rx="6" fill="#FFFFFF" stroke="#1E8C8C"/>
    <text x="1072" y="188">ZT / TIC 3.0</text>
    <text x="1072" y="203">coherence</text>
    <rect x="1128" y="166" width="80" height="52" rx="6" fill="#FFFFFF" stroke="#1E8C8C"/>
    <text x="1168" y="188">FedRAMP</text>
    <text x="1168" y="203">20x</text>
  </g>

  <!-- Convergence arrows -->
  <path d="M 320 240 C 320 300, 500 330, 620 348" fill="none" stroke="#0D1B2E" stroke-width="3"/>
  <path d="M 960 240 C 960 300, 780 330, 660 348" fill="none" stroke="#0D1B2E" stroke-width="3"/>
  <polygon points="628,338 646,352 622,356" fill="#0D1B2E"/>
  <polygon points="652,338 634,352 658,356" fill="#0D1B2E"/>
  <text x="640" y="290" text-anchor="middle" font-size="13" font-style="italic" fill="#5A5A5A">treated as one governance event,</text>
  <text x="640" y="308" text-anchor="middle" font-size="13" font-style="italic" fill="#5A5A5A">not two programs</text>

  <!-- Convergence band — UIAO Open Canon -->
  <rect x="140" y="360" width="1000" height="150" rx="12" fill="#0D1B2E"/>
  <text x="640" y="394" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">UIAO Open Canon &#8212; Identity SSOT Substrate</text>
  <text x="640" y="418" text-anchor="middle" font-size="13" fill="#9BB8CC">Six governance domains &#183; federated execution over one COR-based SSOT</text>
  <g font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <rect x="170" y="436" width="145" height="34" rx="17" fill="#1E8C8C"/>
    <text x="242" y="458">Identity</text>
    <rect x="327" y="436" width="145" height="34" rx="17" fill="#1E8C8C"/>
    <text x="399" y="458">Authorization</text>
    <rect x="484" y="436" width="145" height="34" rx="17" fill="#1E8C8C"/>
    <text x="556" y="458">Compliance</text>
    <rect x="641" y="436" width="145" height="34" rx="17" fill="#1E8C8C"/>
    <text x="713" y="458">Migration</text>
    <rect x="798" y="436" width="145" height="34" rx="17" fill="#1E8C8C"/>
    <text x="870" y="458">Evidence</text>
    <rect x="955" y="436" width="145" height="34" rx="17" fill="#1E8C8C"/>
    <text x="1027" y="458">Operational</text>
  </g>
  <text x="640" y="496" text-anchor="middle" font-size="12" font-style="italic" fill="#9BB8CC">governance domains (this paper&#8217;s federated reading) &#8212; distinct from the canon&#8217;s six control planes (ADR-030)</text>

  <!-- Output arrow -->
  <line x1="640" y1="510" x2="640" y2="560" stroke="#1E8C8C" stroke-width="4"/>
  <polygon points="628,556 640,576 652,556" fill="#1E8C8C"/>

  <!-- Evidence bundle output -->
  <rect x="400" y="584" width="480" height="70" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2.5"/>
  <text x="640" y="614" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Continuous FedRAMP-grade Evidence Bundle</text>
  <text x="640" y="638" text-anchor="middle" font-size="13" fill="#5A5A5A">regenerated deterministically &#8212; not assembled at assessment time</text>

  <!-- Footer -->
  <text x="640" y="692" text-anchor="middle" font-size="13" font-style="italic" fill="#9BB8CC">federal-ssot-alignment.qmd &#167;1&#8211;&#167;3 &#183; UIAO_007 &#183; substrate-manifest.yaml</text>
</svg>
