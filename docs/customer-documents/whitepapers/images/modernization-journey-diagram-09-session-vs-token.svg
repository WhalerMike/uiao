<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · red #C0392B · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arr-red9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
    <marker id="arr-teal9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  </defs>

  <!-- ===== LEFT: session-based ===== -->
  <rect x="40" y="100" width="580" height="500" rx="12" fill="#F2F4F7" stroke="#5A5A5A" stroke-width="1.5"/>
  <text x="330" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="#5A5A5A">Session-based (Kerberos)</text>

  <!-- same-room dashed boundary -->
  <rect x="90" y="190" width="480" height="150" rx="10" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="330" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#5A5A5A">same room / trusted link</text>
  <rect x="130" y="240" width="160" height="80" rx="8" fill="#0D1B2E"/><text x="210" y="287" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Client</text>
  <rect x="370" y="240" width="160" height="80" rx="8" fill="#0D1B2E"/><text x="450" y="287" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Server</text>

  <!-- DC/KDC both must call -->
  <rect x="210" y="430" width="240" height="80" rx="8" fill="#5A5A5A"/><text x="330" y="465" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Domain Controller</text><text x="330" y="488" text-anchor="middle" font-size="14" fill="#FFFFFF">KDC</text>
  <g stroke="#5A5A5A" stroke-width="2.5">
    <line x1="210" y1="322" x2="290" y2="428" marker-end="url(#arr-red9)" stroke="#C0392B"/>
    <line x1="450" y1="322" x2="370" y2="428" marker-end="url(#arr-red9)" stroke="#C0392B"/>
  </g>
  <text x="330" y="555" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">breaks across distance, proxies, NAT</text>

  <!-- ===== RIGHT: token-based ===== -->
  <rect x="660" y="100" width="580" height="500" rx="12" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="950" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="#0D1B2E">Token-based (Entra / CBA)</text>
  <text x="950" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#6B7A8D">strangers on the Internet</text>

  <rect x="700" y="300" width="150" height="80" rx="8" fill="#0D1B2E"/><text x="775" y="347" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Client</text>
  <rect x="1050" y="300" width="150" height="80" rx="8" fill="#0D1B2E"/><text x="1125" y="347" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Server</text>

  <!-- signed JWT capsule handed across -->
  <line x1="850" y1="340" x2="1048" y2="340" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal9)"/>
  <rect x="880" y="250" width="140" height="56" rx="14" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/><text x="950" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">signed JWT</text><text x="950" y="294" text-anchor="middle" font-size="12" fill="#33414F">timestamp + signature</text>
  <!-- key glyph at server -->
  <circle cx="1110" cy="410" r="14" fill="none" stroke="#1E8C8C" stroke-width="4"/><line x1="1120" y1="420" x2="1145" y2="445" stroke="#1E8C8C" stroke-width="4"/><line x1="1138" y1="438" x2="1148" y2="428" stroke="#1E8C8C" stroke-width="4"/>
  <text x="950" y="470" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">verify signature — no DC round-trip</text>

  <!-- caption -->
  <text x="640" y="650" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#0D1B2E">Kerberos assumes the same room. Tokens assume strangers on the Internet.</text>
</svg>
