<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · red #C0392B (loss) · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="60" y="72" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">What the flip fragments — three planes, nothing reconciling</text>
  <text x="60" y="106" font-size="20" fill="#5A5A5A">Hybrid join splits one machine's truth across three systems of record. Ungoverned, none is authoritative over the others.</text>

  <!-- One laptop at top center -->
  <rect x="540" y="150" width="200" height="74" rx="10" fill="#0D1B2E"/>
  <text x="640" y="183" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">One laptop</text>
  <text x="640" y="208" text-anchor="middle" font-size="14" fill="#EAF1FB">same machine, three records</text>

  <!-- diverging red lines to each plane -->
  <line x1="600" y1="224" x2="260" y2="296" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="640" y1="224" x2="640" y2="296" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="680" y1="224" x2="1020" y2="296" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- Plane 1: Active Directory -->
  <rect x="80" y="300" width="340" height="250" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="250" y="340" text-anchor="middle" font-size="22" font-weight="bold" fill="#0D1B2E">Active Directory</text>
  <text x="250" y="372" text-anchor="middle" font-size="14" fill="#6B7A8D">system of record for:</text>
  <rect x="110" y="392" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="250" y="426" text-anchor="middle" font-size="17" font-weight="bold" fill="#33414F">Computer object</text>
  <text x="250" y="456" text-anchor="middle" font-size="15" fill="#33414F">OU placement · GPO</text>
  <text x="250" y="482" text-anchor="middle" font-size="15" fill="#33414F">Kerberos / NTLM identity</text>

  <!-- Plane 2: Entra ID -->
  <rect x="470" y="300" width="340" height="250" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="340" text-anchor="middle" font-size="22" font-weight="bold" fill="#0D1B2E">Microsoft Entra ID</text>
  <text x="640" y="372" text-anchor="middle" font-size="14" fill="#6B7A8D">system of record for:</text>
  <rect x="500" y="392" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="640" y="430" text-anchor="middle" font-size="17" font-weight="bold" fill="#33414F">Device object</text>
  <text x="640" y="462" text-anchor="middle" font-size="15" fill="#33414F">Primary Refresh Token</text>

  <!-- Plane 3: Intune -->
  <rect x="860" y="300" width="340" height="250" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1030" y="340" text-anchor="middle" font-size="22" font-weight="bold" fill="#0D1B2E">Microsoft Intune</text>
  <text x="1030" y="372" text-anchor="middle" font-size="14" fill="#6B7A8D">system of record for:</text>
  <rect x="890" y="392" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="1030" y="430" text-anchor="middle" font-size="17" font-weight="bold" fill="#33414F">Compliance state</text>
  <text x="1030" y="462" text-anchor="middle" font-size="15" fill="#33414F">the signal CA enforces on</text>

  <!-- "no reconciliation" gaps between planes -->
  <g>
    <line x1="420" y1="425" x2="470" y2="425" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="6 5"/>
    <circle cx="445" cy="425" r="16" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.5"/>
    <text x="445" y="431" text-anchor="middle" font-size="18" font-weight="bold" fill="#C0392B">&#8800;</text>
    <line x1="810" y1="425" x2="860" y2="425" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="6 5"/>
    <circle cx="835" cy="425" r="16" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.5"/>
    <text x="835" y="431" text-anchor="middle" font-size="18" font-weight="bold" fill="#C0392B">&#8800;</text>
  </g>
  <text x="640" y="588" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">no plane reconciles to the others</text>

  <!-- bottom loss band -->
  <rect x="80" y="606" width="1120" height="86" rx="12" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="640" y="642" text-anchor="middle" font-size="18" fill="#33414F">With no control plane over the three, duplicate and stale device objects read as "managed" —</text>
  <text x="640" y="672" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">the exact condition canon names DRIFT-SSOT-CONTENTION.</text>
</svg>
