<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-teal5" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1A9E8F"/></marker>
    <marker id="arw-red5" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#C0392B"/></marker>
  </defs>

  <text x="800" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#1F3A5F">What "Just Use the Console" Costs</text>
  <text x="800" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#5A6B7B">Same starting drift, two paths, two different assessor outcomes</text>

  <!-- shared origin -->
  <rect x="590" y="132" width="420" height="104" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <text x="800" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F">Native console detects drift</text>
  <text x="800" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5A6B7B">
  <tspan x="800" dy="0">(Azure Policy, AWS Config,</tspan>
  <tspan x="800" dy="20">vSphere Profiles, CA)</tspan>
  </text>

  <text x="420" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#C0392B">Path A — console only</text>
  <text x="1180" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1A9E8F">Path B — console + coordination layer</text>
  <path d="M760,236 V286 H420 V300" fill="none" stroke="#5A6B7B" stroke-width="2.5" marker-end="url(#arw-red5)"/>
  <path d="M840,236 V286 H1180 V300" fill="none" stroke="#5A6B7B" stroke-width="2.5" marker-end="url(#arw-teal5)"/>

  <!-- Path A column -->
  <rect x="290" y="310" width="260" height="90" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="420" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">Native auto-remediation</text>
  <text x="420" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">fixes the resource</text>
  <line x1="420" y1="400" x2="420" y2="430" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arw-red5)"/>

  <rect x="290" y="432" width="260" height="90" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="420" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">Console shows green.</text>
  <text x="420" y="494" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">No owner, clock, or approval</text>
  <line x1="420" y1="522" x2="420" y2="552" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arw-red5)"/>

  <rect x="270" y="554" width="300" height="110" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2.5"/>
  <text x="420" y="592" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7A231A">No traceable record</text>
  <text x="420" y="618" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#7A231A">an assessor can rely on —</text>
  <text x="420" y="642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#7A231A">a finding, at ATO review</text>

  <!-- Path B column -->
  <rect x="1050" y="310" width="260" height="90" rx="10" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="2"/>
  <text x="1180" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">Same native remediation —</text>
  <text x="1180" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">actuation is identical</text>
  <line x1="1180" y1="400" x2="1180" y2="430" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arw-teal5)"/>

  <rect x="1050" y="432" width="260" height="90" rx="10" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="2"/>
  <text x="1180" y="463" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">ServiceNow task: owner,</text>
  <text x="1180" y="487" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">PAIN-rated SLA, approval</text>
  <text x="1180" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">on any exception</text>
  <line x1="1180" y1="522" x2="1180" y2="552" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arw-teal5)"/>

  <rect x="1030" y="554" width="300" height="110" rx="10" fill="#D7F2EE" stroke="#1A9E8F" stroke-width="2.5"/>
  <text x="1180" y="592" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0F5C57">Assessed control</text>
  <text x="1180" y="618" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#0F5C57">re-test evidence attached —</text>
  <text x="1180" y="642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#0F5C57">ATO-package ready</text>

  <rect x="80" y="700" width="1440" height="80" rx="8" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="800" y="734" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F">Both paths change the same bit of state. Only one produces a record an assessor can trace.</text>
  <text x="800" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1F3A5F">"Automated" does not mean "unowned" — CM-3 still applies either way.</text>
</svg>
