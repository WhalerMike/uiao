<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO 16:9 figure (ADR-093). Palette: navy #0D1B2E · teal #1E8C8C · red #C0392B · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="640" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">Capacity, Not Office Count, Sizes the Content Tier</text>
  <text x="640" y="80" text-anchor="middle" font-size="15" fill="#5A5A5A">70,000 managed endpoints against Microsoft's published 4,000-clients-per-distribution-point ceiling</text>

  <!-- Left panel: proposed -->
  <rect x="60" y="112" width="530" height="430" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.5"/>
  <rect x="60" y="112" width="530" height="52" rx="10" fill="#C0392B"/>
  <rect x="60" y="140" width="530" height="24" fill="#C0392B"/>
  <text x="325" y="145" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">PROPOSED — 1,500 DISTRIBUTION POINTS</text>

  <!-- grid of small squares symbolizing many field offices -->
  <g fill="#F7E2DE" stroke="#C0392B" stroke-width="1">
    <!-- 20 columns x 6 rows = 120 small squares, representative not literal -->
  </g>
  <g>
    <!-- generate a grid programmatically-styled by hand: 18 cols x 6 rows -->
  </g>
  <g fill="#F7E2DE" stroke="#C0392B" stroke-width="1" id="dp-grid">
    <rect x="82" y="184" width="22" height="18" rx="2"/><rect x="108" y="184" width="22" height="18" rx="2"/><rect x="134" y="184" width="22" height="18" rx="2"/><rect x="160" y="184" width="22" height="18" rx="2"/><rect x="186" y="184" width="22" height="18" rx="2"/><rect x="212" y="184" width="22" height="18" rx="2"/><rect x="238" y="184" width="22" height="18" rx="2"/><rect x="264" y="184" width="22" height="18" rx="2"/><rect x="290" y="184" width="22" height="18" rx="2"/><rect x="316" y="184" width="22" height="18" rx="2"/><rect x="342" y="184" width="22" height="18" rx="2"/><rect x="368" y="184" width="22" height="18" rx="2"/><rect x="394" y="184" width="22" height="18" rx="2"/><rect x="420" y="184" width="22" height="18" rx="2"/><rect x="446" y="184" width="22" height="18" rx="2"/><rect x="472" y="184" width="22" height="18" rx="2"/><rect x="498" y="184" width="22" height="18" rx="2"/><rect x="524" y="184" width="22" height="18" rx="2"/>
    <rect x="82" y="208" width="22" height="18" rx="2"/><rect x="108" y="208" width="22" height="18" rx="2"/><rect x="134" y="208" width="22" height="18" rx="2"/><rect x="160" y="208" width="22" height="18" rx="2"/><rect x="186" y="208" width="22" height="18" rx="2"/><rect x="212" y="208" width="22" height="18" rx="2"/><rect x="238" y="208" width="22" height="18" rx="2"/><rect x="264" y="208" width="22" height="18" rx="2"/><rect x="290" y="208" width="22" height="18" rx="2"/><rect x="316" y="208" width="22" height="18" rx="2"/><rect x="342" y="208" width="22" height="18" rx="2"/><rect x="368" y="208" width="22" height="18" rx="2"/><rect x="394" y="208" width="22" height="18" rx="2"/><rect x="420" y="208" width="22" height="18" rx="2"/><rect x="446" y="208" width="22" height="18" rx="2"/><rect x="472" y="208" width="22" height="18" rx="2"/><rect x="498" y="208" width="22" height="18" rx="2"/><rect x="524" y="208" width="22" height="18" rx="2"/>
    <rect x="82" y="232" width="22" height="18" rx="2"/><rect x="108" y="232" width="22" height="18" rx="2"/><rect x="134" y="232" width="22" height="18" rx="2"/><rect x="160" y="232" width="22" height="18" rx="2"/><rect x="186" y="232" width="22" height="18" rx="2"/><rect x="212" y="232" width="22" height="18" rx="2"/><rect x="238" y="232" width="22" height="18" rx="2"/><rect x="264" y="232" width="22" height="18" rx="2"/><rect x="290" y="232" width="22" height="18" rx="2"/><rect x="316" y="232" width="22" height="18" rx="2"/><rect x="342" y="232" width="22" height="18" rx="2"/><rect x="368" y="232" width="22" height="18" rx="2"/><rect x="394" y="232" width="22" height="18" rx="2"/><rect x="420" y="232" width="22" height="18" rx="2"/><rect x="446" y="232" width="22" height="18" rx="2"/><rect x="472" y="232" width="22" height="18" rx="2"/><rect x="498" y="232" width="22" height="18" rx="2"/><rect x="524" y="232" width="22" height="18" rx="2"/>
    <rect x="82" y="256" width="22" height="18" rx="2"/><rect x="108" y="256" width="22" height="18" rx="2"/><rect x="134" y="256" width="22" height="18" rx="2"/><rect x="160" y="256" width="22" height="18" rx="2"/><rect x="186" y="256" width="22" height="18" rx="2"/><rect x="212" y="256" width="22" height="18" rx="2"/><rect x="238" y="256" width="22" height="18" rx="2"/><rect x="264" y="256" width="22" height="18" rx="2"/><rect x="290" y="256" width="22" height="18" rx="2"/><rect x="316" y="256" width="22" height="18" rx="2"/><rect x="342" y="256" width="22" height="18" rx="2"/><rect x="368" y="256" width="22" height="18" rx="2"/><rect x="394" y="256" width="22" height="18" rx="2"/><rect x="420" y="256" width="22" height="18" rx="2"/><rect x="446" y="256" width="22" height="18" rx="2"/><rect x="472" y="256" width="22" height="18" rx="2"/><rect x="498" y="256" width="22" height="18" rx="2"/><rect x="524" y="256" width="22" height="18" rx="2"/>
    <rect x="82" y="280" width="22" height="18" rx="2"/><rect x="108" y="280" width="22" height="18" rx="2"/><rect x="134" y="280" width="22" height="18" rx="2"/><rect x="160" y="280" width="22" height="18" rx="2"/><rect x="186" y="280" width="22" height="18" rx="2"/><rect x="212" y="280" width="22" height="18" rx="2"/><rect x="238" y="280" width="22" height="18" rx="2"/><rect x="264" y="280" width="22" height="18" rx="2"/><rect x="290" y="280" width="22" height="18" rx="2"/><rect x="316" y="280" width="22" height="18" rx="2"/><rect x="342" y="280" width="22" height="18" rx="2"/><rect x="368" y="280" width="22" height="18" rx="2"/><rect x="394" y="280" width="22" height="18" rx="2"/><rect x="420" y="280" width="22" height="18" rx="2"/><rect x="446" y="280" width="22" height="18" rx="2"/><rect x="472" y="280" width="22" height="18" rx="2"/><rect x="498" y="280" width="22" height="18" rx="2"/><rect x="524" y="280" width="22" height="18" rx="2"/>
    <rect x="82" y="304" width="22" height="18" rx="2"/><rect x="108" y="304" width="22" height="18" rx="2"/><rect x="134" y="304" width="22" height="18" rx="2"/><rect x="160" y="304" width="22" height="18" rx="2"/><rect x="186" y="304" width="22" height="18" rx="2"/><rect x="212" y="304" width="22" height="18" rx="2"/><rect x="238" y="304" width="22" height="18" rx="2"/><rect x="264" y="304" width="22" height="18" rx="2"/><rect x="290" y="304" width="22" height="18" rx="2"/><rect x="316" y="304" width="22" height="18" rx="2"/><rect x="342" y="304" width="22" height="18" rx="2"/><rect x="368" y="304" width="22" height="18" rx="2"/><rect x="394" y="304" width="22" height="18" rx="2"/><rect x="420" y="304" width="22" height="18" rx="2"/><rect x="446" y="304" width="22" height="18" rx="2"/><rect x="472" y="304" width="22" height="18" rx="2"/><rect x="498" y="304" width="22" height="18" rx="2"/><rect x="524" y="304" width="22" height="18" rx="2"/>
  </g>
  <text x="325" y="342" text-anchor="middle" font-size="13" fill="#5A5A5A">1 distribution point per field office (illustrative sample of 108 of 1,500 shown)</text>

  <rect x="82" y="360" width="464" height="66" rx="7" fill="#F7E2DE"/>
  <text x="314" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#8C2E20">Driven by branch transport, not CM capacity</text>
  <text x="314" y="404" text-anchor="middle" font-size="13" fill="#5A5A5A">1,476 of 1,500 exist only to work around constrained circuits</text>

  <rect x="82" y="440" width="464" height="80" rx="7" fill="#0D1B2E"/>
  <text x="314" y="470" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">$50.0M refresh</text>
  <text x="314" y="494" text-anchor="middle" font-size="13" fill="#D7E1EA">$33,333 per site — into a tier already being retired</text>

  <!-- arrow between panels -->
  <defs>
    <marker id="arrow-teal-01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>
  <line x1="596" y1="327" x2="676" y2="327" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal-01)"/>
  <text x="636" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">size to</text>
  <text x="636" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">capacity</text>

  <!-- Right panel: target -->
  <rect x="690" y="112" width="530" height="430" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2.5"/>
  <rect x="690" y="112" width="530" height="52" rx="10" fill="#1E8C8C"/>
  <rect x="690" y="140" width="530" height="24" fill="#1E8C8C"/>
  <text x="955" y="145" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">TARGET — 24 DISTRIBUTION POINTS, 12 HUBS</text>

  <rect x="712" y="184" width="180" height="70" rx="7" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="802" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Primary data center</text>
  <text x="802" y="230" text-anchor="middle" font-size="12" fill="#33414F">2 DPs (source, HA)</text>
  <text x="802" y="246" text-anchor="middle" font-size="11" fill="#5A5A5A">1 site</text>

  <rect x="908" y="184" width="180" height="70" rx="7" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="998" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Secondary data center</text>
  <text x="998" y="230" text-anchor="middle" font-size="12" fill="#33414F">2 DPs (source, HA)</text>
  <text x="998" y="246" text-anchor="middle" font-size="11" fill="#5A5A5A">1 site</text>

  <rect x="712" y="270" width="376" height="86" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="900" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#0E5C5C">10 Regional hubs (existing regional offices)</text>
  <text x="900" y="320" text-anchor="middle" font-size="12" fill="#33414F">20 pull DPs — 2 per hub, source from the two data centers</text>
  <text x="900" y="340" text-anchor="middle" font-size="12" fill="#33414F">Fan-out confined to a 2-to-20 relationship, not 1-to-1,500</text>

  <rect x="712" y="374" width="376" height="52" rx="7" fill="#F4F7FA"/>
  <text x="900" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3A5F">18 minimum (70,000 ÷ 4,000/DP) → 24 deployed</text>
  <text x="900" y="414" text-anchor="middle" font-size="12" fill="#5A5A5A">73% target utilization — headroom for growth</text>

  <rect x="712" y="440" width="376" height="80" rx="7" fill="#0D1B2E"/>
  <text x="900" y="470" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">96,000 client capacity</text>
  <text x="900" y="494" text-anchor="middle" font-size="13" fill="#D7E1EA">37% headroom over the 70,000-endpoint estimate</text>

  <!-- Bottom banner -->
  <rect x="60" y="562" width="1160" height="86" rx="10" fill="#1F3A5F"/>
  <text x="640" y="592" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Distribution point count is a network-topology decision, not a Configuration Manager capacity decision</text>
  <text x="640" y="618" text-anchor="middle" font-size="13.5" fill="#D7E1EA">Fix the branch transport (Section 4) and the content tier collapses from 1,500 sites to 12 — a 98.4% reduction</text>
  <text x="640" y="636" text-anchor="middle" font-size="12" fill="#AFC0D2">Source: Microsoft Learn, "Size and scale — Configuration Manager" (learn.microsoft.com/en-us/intune/configmgr)</text>

  <text x="640" y="674" text-anchor="middle" font-size="12" fill="#8A97A3">Field Office WAN Transformation and Distribution Point Consolidation whitepaper — Section 3–4</text>
</svg>
