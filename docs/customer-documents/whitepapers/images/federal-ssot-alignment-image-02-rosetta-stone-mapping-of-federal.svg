<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093) · navy #0D1B2E · teal #1E8C8C · red #C0392B · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="640" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#0D1B2E">Federal SSOT Mechanism &#8596; UIAO Canon Capability</text>
  <text x="640" y="84" text-anchor="middle" font-size="16" fill="#5A5A5A">Rosetta-stone mapping &#8212; the mechanisms agencies already mandate, anchored to named canon artifacts</text>

  <!-- Column headers -->
  <rect x="80" y="110" width="480" height="44" rx="8" fill="#0D1B2E"/>
  <text x="320" y="138" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Federal Mandate / Mechanism</text>
  <rect x="720" y="110" width="480" height="44" rx="8" fill="#0D1B2E"/>
  <text x="960" y="138" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">UIAO Canon Mechanism</text>

  <!-- Row 1 -->
  <rect x="80" y="170" width="480" height="86" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="320" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">MDM Golden Records</text>
  <text x="320" y="228" text-anchor="middle" font-size="12" fill="#5A5A5A">authoritative source designation per data domain</text>
  <rect x="720" y="170" width="480" height="86" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="960" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">COR Schema (UIAO_007 + OrgPath)</text>
  <text x="960" y="228" text-anchor="middle" font-size="12" fill="#5A5A5A">canonical object records over the identity namespace</text>
  <line x1="560" y1="213" x2="720" y2="213" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="712,207 726,213 712,219" fill="#1E8C8C"/>
  <polygon points="568,207 554,213 568,219" fill="#1E8C8C"/>

  <!-- Row 2 -->
  <rect x="80" y="272" width="480" height="86" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="320" y="308" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Data Lineage &amp; Provenance</text>
  <text x="320" y="330" text-anchor="middle" font-size="12" fill="#5A5A5A">who changed what, when, from which source</text>
  <rect x="720" y="272" width="480" height="86" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="960" y="308" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Immutable Provenance Chain &#8594; Evidence Bundle</text>
  <text x="960" y="330" text-anchor="middle" font-size="12" fill="#5A5A5A">every claim carries a signed provenance envelope</text>
  <line x1="560" y1="315" x2="720" y2="315" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="712,309 726,315 712,321" fill="#1E8C8C"/>
  <polygon points="568,309 554,315 568,321" fill="#1E8C8C"/>

  <!-- Row 3 -->
  <rect x="80" y="374" width="480" height="86" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="320" y="410" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Redundancy &amp; Conflict Audit</text>
  <text x="320" y="432" text-anchor="middle" font-size="12" fill="#5A5A5A">find duplicate and contended authoritative copies</text>
  <rect x="720" y="374" width="480" height="86" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="960" y="410" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Drift Engine &#8212; 6 DRIFT classes (P1&#8211;P4)</text>
  <text x="960" y="432" text-anchor="middle" font-size="12" fill="#5A5A5A">incl. DRIFT-SSOT-CONTENTION per ADR-074</text>
  <line x1="560" y1="417" x2="720" y2="417" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="712,411 726,417 712,423" fill="#1E8C8C"/>
  <polygon points="568,411 554,417 568,423" fill="#1E8C8C"/>

  <!-- Row 4 -->
  <rect x="80" y="476" width="480" height="86" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="320" y="512" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Federated Governance</text>
  <text x="320" y="534" text-anchor="middle" font-size="12" fill="#5A5A5A">central standards, distributed execution</text>
  <rect x="720" y="476" width="480" height="86" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="960" y="512" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Six Governance Domains (federated, central-standards)</text>
  <text x="960" y="534" text-anchor="middle" font-size="12" fill="#5A5A5A">Identity &#183; Authorization &#183; Compliance &#183; Migration &#183; Evidence &#183; Operational</text>
  <line x1="560" y1="519" x2="720" y2="519" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="712,513 726,519 712,525" fill="#1E8C8C"/>
  <polygon points="568,513 554,519 568,525" fill="#1E8C8C"/>

  <!-- Row 5 -->
  <rect x="80" y="578" width="480" height="86" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="320" y="614" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Layer-on-Legacy (no rip-and-replace)</text>
  <text x="320" y="636" text-anchor="middle" font-size="12" fill="#5A5A5A">govern what stays, while it stays</text>
  <rect x="720" y="578" width="480" height="86" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="960" y="608" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Nine Adapter Interfaces</text>
  <text x="960" y="628" text-anchor="middle" font-size="11" fill="#5A5A5A">IPAM &#183; PKI &#183; RADIUS &#183; LDAP-proxy &#183; sync-engine &#183; device-mgmt &#183; NTP &#183; DFS &#183; SQL Server</text>
  <text x="960" y="646" text-anchor="middle" font-size="11" fill="#5A5A5A">(migration-adapter-registry.yaml)</text>
  <line x1="560" y1="621" x2="720" y2="621" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="712,615 726,621 712,627" fill="#1E8C8C"/>
  <polygon points="568,615 554,621 568,627" fill="#1E8C8C"/>

  <!-- Footer band -->
  <rect x="80" y="680" width="1120" height="28" rx="6" fill="#EAF1FB"/>
  <text x="640" y="699" text-anchor="middle" font-size="13" font-style="italic" fill="#0D1B2E">Each mapping is mechanical, not aspirational &#8212; every row anchors to a named canon artifact</text>
</svg>
