<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · ice #EAF1FB · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arr-navy11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
    <marker id="arr-teal11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  </defs>

  <!-- TOP: single source of truth -->
  <rect x="360" y="80" width="560" height="96" rx="12" fill="#0D1B2E"/>
  <text x="640" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Single Source of Truth</text>
  <text x="640" y="146" text-anchor="middle" font-size="15" fill="#D7F2EE">UIAO canon + reconciliation loop</text>
  <!-- evidence-chain glyph -->
  <g stroke="#1E8C8C" stroke-width="3" fill="none">
    <rect x="404" y="110" width="20" height="13" rx="6"/><rect x="416" y="123" width="20" height="13" rx="6"/>
  </g>

  <!-- MIDDLE: application-aware transport mesh band -->
  <rect x="120" y="250" width="1040" height="80" rx="14" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="640" y="284" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Application-aware transport</text>
  <text x="640" y="308" text-anchor="middle" font-size="14" fill="#157272">token-bound, per call · identity-derived SD-WAN / SASE overlay</text>

  <!-- BOTTOM: governed provider data planes with OrgPath tag + rung badge -->
  <g text-anchor="middle">
    <!-- Entra ID -->
    <rect x="120" y="430" width="190" height="150" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <text x="215" y="470" font-size="17" font-weight="bold" fill="#0D1B2E">Entra ID</text>
    <rect x="140" y="488" width="120" height="24" rx="6" fill="#1E8C8C"/><text x="200" y="505" font-size="11" font-weight="bold" fill="#FFFFFF">OrgPath</text>
    <rect x="270" y="488" width="24" height="24" rx="6" fill="#0D1B2E"/><text x="282" y="505" font-size="11" font-weight="bold" fill="#FFFFFF">L3</text>
    <text x="215" y="548" font-size="13" fill="#33414F">authenticate</text>
    <!-- Intune -->
    <rect x="324" y="430" width="190" height="150" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <text x="419" y="470" font-size="17" font-weight="bold" fill="#0D1B2E">Intune</text>
    <rect x="344" y="488" width="120" height="24" rx="6" fill="#1E8C8C"/><text x="404" y="505" font-size="11" font-weight="bold" fill="#FFFFFF">OrgPath</text>
    <rect x="474" y="488" width="24" height="24" rx="6" fill="#0D1B2E"/><text x="486" y="505" font-size="11" font-weight="bold" fill="#FFFFFF">L2</text>
    <text x="419" y="548" font-size="13" fill="#33414F">endpoint</text>
    <!-- AWS / Azure -->
    <rect x="528" y="430" width="224" height="150" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <text x="640" y="470" font-size="16" font-weight="bold" fill="#0D1B2E">AWS / Azure workloads</text>
    <rect x="560" y="488" width="120" height="24" rx="6" fill="#1E8C8C"/><text x="620" y="505" font-size="11" font-weight="bold" fill="#FFFFFF">OrgPath</text>
    <rect x="690" y="488" width="24" height="24" rx="6" fill="#0D1B2E"/><text x="702" y="505" font-size="11" font-weight="bold" fill="#FFFFFF">L1</text>
    <text x="640" y="548" font-size="13" fill="#33414F">run</text>
    <!-- Infoblox -->
    <rect x="766" y="430" width="190" height="150" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <text x="861" y="470" font-size="17" font-weight="bold" fill="#0D1B2E">Infoblox</text>
    <rect x="786" y="488" width="120" height="24" rx="6" fill="#1E8C8C"/><text x="846" y="505" font-size="11" font-weight="bold" fill="#FFFFFF">OrgPath</text>
    <rect x="916" y="488" width="24" height="24" rx="6" fill="#0D1B2E"/><text x="928" y="505" font-size="11" font-weight="bold" fill="#FFFFFF">L2</text>
    <text x="861" y="548" font-size="13" fill="#33414F">resolve</text>
    <!-- Sentinel -->
    <rect x="970" y="430" width="190" height="150" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <text x="1065" y="470" font-size="17" font-weight="bold" fill="#0D1B2E">Sentinel</text>
    <rect x="990" y="488" width="120" height="24" rx="6" fill="#1E8C8C"/><text x="1050" y="505" font-size="11" font-weight="bold" fill="#FFFFFF">OrgPath</text>
    <rect x="1120" y="488" width="24" height="24" rx="6" fill="#0D1B2E"/><text x="1132" y="505" font-size="11" font-weight="bold" fill="#FFFFFF">L1</text>
    <text x="1065" y="548" font-size="13" fill="#33414F">telemetry</text>
  </g>

  <!-- arrows truth<->planes -->
  <line x1="250" y1="176" x2="250" y2="248" stroke="#0D1B2E" stroke-width="3" marker-end="url(#arr-navy11)"/>
  <text x="262" y="216" font-size="13" font-weight="bold" fill="#0D1B2E">plan / apply / reconcile</text>
  <line x1="1030" y1="248" x2="1030" y2="176" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal11)"/>
  <text x="900" y="216" font-size="13" font-weight="bold" fill="#1E8C8C">signed evidence</text>
  <line x1="640" y1="330" x2="640" y2="428" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- bottom band -->
  <rect x="60" y="624" width="1160" height="66" rx="10" fill="#0D1B2E"/>
  <text x="640" y="665" text-anchor="middle" font-size="21" font-weight="bold" fill="#FFFFFF">The system can DO things AND VERIFY things — provenance restored.</text>
</svg>
