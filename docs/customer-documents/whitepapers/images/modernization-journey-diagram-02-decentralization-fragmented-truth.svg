<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · red #C0392B · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-navy2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/>
    </marker>
  </defs>

  <!-- LEFT: single source of truth -->
  <rect x="60" y="290" width="250" height="140" rx="12" fill="#0D1B2E"/>
  <text x="185" y="350" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">One Source</text>
  <text x="185" y="378" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">of Truth</text>

  <!-- decentralize arrow -->
  <line x1="320" y1="360" x2="470" y2="360" stroke="#0D1B2E" stroke-width="4" marker-end="url(#arrow-navy2)"/>
  <text x="395" y="345" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">decentralize</text>

  <!-- RIGHT: twelve regional db cylinders (3 rows x 4) -->
  <g>
    <!-- cylinder helper drawn inline per region: ellipse top + rect body + ellipse bottom, teal -->
    <!-- row1 -->
    <g transform="translate(500,150)"><ellipse cx="40" cy="12" rx="40" ry="12" fill="#1E8C8C"/><rect x="0" y="12" width="80" height="56" fill="#1E8C8C"/><ellipse cx="40" cy="68" rx="40" ry="12" fill="#157272"/><text x="40" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">CA</text></g>
    <g transform="translate(670,150)"><ellipse cx="40" cy="12" rx="40" ry="12" fill="#1E8C8C"/><rect x="0" y="12" width="80" height="56" fill="#1E8C8C"/><ellipse cx="40" cy="68" rx="40" ry="12" fill="#157272"/><text x="40" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">MA</text></g>
    <g transform="translate(840,150)"><ellipse cx="40" cy="12" rx="40" ry="12" fill="#1E8C8C"/><rect x="0" y="12" width="80" height="56" fill="#1E8C8C"/><ellipse cx="40" cy="68" rx="40" ry="12" fill="#157272"/><text x="40" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">NY</text></g>
    <g transform="translate(1010,150)"><ellipse cx="40" cy="12" rx="40" ry="12" fill="#1E8C8C"/><rect x="0" y="12" width="80" height="56" fill="#1E8C8C"/><ellipse cx="40" cy="68" rx="40" ry="12" fill="#157272"/><text x="40" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">TX</text></g>
    <!-- row2 -->
    <g transform="translate(500,300)"><ellipse cx="40" cy="12" rx="40" ry="12" fill="#1E8C8C"/><rect x="0" y="12" width="80" height="56" fill="#1E8C8C"/><ellipse cx="40" cy="68" rx="40" ry="12" fill="#157272"/><text x="40" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">WA</text></g>
    <g transform="translate(670,300)"><ellipse cx="40" cy="12" rx="40" ry="12" fill="#1E8C8C"/><rect x="0" y="12" width="80" height="56" fill="#1E8C8C"/><ellipse cx="40" cy="68" rx="40" ry="12" fill="#157272"/><text x="40" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">VA</text></g>
    <g transform="translate(840,300)"><ellipse cx="40" cy="12" rx="40" ry="12" fill="#1E8C8C"/><rect x="0" y="12" width="80" height="56" fill="#1E8C8C"/><ellipse cx="40" cy="68" rx="40" ry="12" fill="#157272"/><text x="40" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">KS</text></g>
    <g transform="translate(1010,300)"><ellipse cx="40" cy="12" rx="40" ry="12" fill="#1E8C8C"/><rect x="0" y="12" width="80" height="56" fill="#1E8C8C"/><ellipse cx="40" cy="68" rx="40" ry="12" fill="#157272"/><text x="40" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">MD</text></g>
    <!-- row3 -->
    <g transform="translate(500,450)"><ellipse cx="40" cy="12" rx="40" ry="12" fill="#1E8C8C"/><rect x="0" y="12" width="80" height="56" fill="#1E8C8C"/><ellipse cx="40" cy="68" rx="40" ry="12" fill="#157272"/><text x="40" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">OR</text></g>
    <g transform="translate(670,450)"><ellipse cx="40" cy="12" rx="40" ry="12" fill="#1E8C8C"/><rect x="0" y="12" width="80" height="56" fill="#1E8C8C"/><ellipse cx="40" cy="68" rx="40" ry="12" fill="#157272"/><text x="40" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">FL</text></g>
    <g transform="translate(840,450)"><ellipse cx="40" cy="12" rx="40" ry="12" fill="#1E8C8C"/><rect x="0" y="12" width="80" height="56" fill="#1E8C8C"/><ellipse cx="40" cy="68" rx="40" ry="12" fill="#157272"/><text x="40" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">IL</text></g>
    <g transform="translate(1010,450)"><ellipse cx="40" cy="12" rx="40" ry="12" fill="#1E8C8C"/><rect x="0" y="12" width="80" height="56" fill="#1E8C8C"/><ellipse cx="40" cy="68" rx="40" ry="12" fill="#157272"/><text x="40" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">GA</text></g>
  </g>

  <!-- drift connectors (red dashed) with labels -->
  <g stroke="#C0392B" stroke-width="2" stroke-dasharray="6 5">
    <line x1="580" y1="218" x2="670" y2="218"/>
    <line x1="750" y1="368" x2="840" y2="368"/>
    <line x1="920" y1="218" x2="1010" y2="500"/>
  </g>
  <text x="625" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">schema drift</text>
  <text x="795" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">different rules</text>
  <text x="980" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">divergent definitions</text>

  <!-- bottom red band -->
  <rect x="60" y="624" width="1160" height="66" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="640" y="655" text-anchor="middle" font-size="19" font-weight="bold" fill="#0D1B2E">Distributed intelligence gained.</text>
  <text x="640" y="680" text-anchor="middle" font-size="19" font-weight="bold" fill="#C0392B">Distributed truth — never replaced.</text>
</svg>
