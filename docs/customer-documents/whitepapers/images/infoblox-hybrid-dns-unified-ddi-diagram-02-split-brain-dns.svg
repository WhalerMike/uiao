<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="60" y="52" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Split-Brain DNS — Same Query, Different Answers</text>
  <text x="60" y="78" font-size="16" fill="#5A5A5A">When the same FQDN resolves differently by originating location — and why it is harder to fix than it looks</text>

  <!-- Client on-prem -->
  <rect x="60" y="110" width="180" height="80" rx="10" fill="#0D1B2E"/>
  <text x="150" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">On-Prem Client</text>
  <text x="150" y="164" text-anchor="middle" font-size="12" fill="#9BB8CC">10.0.0.0/8 subnet</text>
  <text x="150" y="180" text-anchor="middle" font-size="11" fill="#9BB8CC">Windows DNS resolver</text>

  <!-- Client cloud -->
  <rect x="60" y="220" width="180" height="80" rx="10" fill="#1E8C8C"/>
  <text x="150" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Cloud Workload</text>
  <text x="150" y="272" text-anchor="middle" font-size="12" fill="#CCEEE8">Azure VNet / AWS VPC</text>
  <text x="150" y="288" text-anchor="middle" font-size="11" fill="#CCEEE8">Cloud-native DNS resolver</text>

  <!-- Query arrows -->
  <line x1="240" y1="150" x2="380" y2="230" stroke="#0D1B2E" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arr-dark)"/>
  <line x1="240" y1="260" x2="380" y2="260" stroke="#1E8C8C" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arr-teal)"/>
  <text x="295" y="212" font-size="11" fill="#5A5A5A" transform="rotate(-20,295,212)">query: svc.agency.gov</text>
  <text x="260" y="252" font-size="11" fill="#5A5A5A">query: svc.agency.gov</text>

  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  </defs>

  <!-- DNS resolvers middle box -->
  <rect x="380" y="180" width="240" height="160" rx="12" fill="#EAF1FB" stroke="#5A5A5A" stroke-width="1.5"/>
  <text x="500" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">DNS Resolution Path</text>
  <rect x="400" y="218" width="200" height="40" rx="6" fill="#0D1B2E"/>
  <text x="500" y="241" text-anchor="middle" font-size="12" fill="#FFFFFF">Windows DNS (on-prem)</text>
  <text x="500" y="256" text-anchor="middle" font-size="11" fill="#9BB8CC">→ AD-integrated zone</text>
  <rect x="400" y="270" width="200" height="40" rx="6" fill="#1E8C8C"/>
  <text x="500" y="293" text-anchor="middle" font-size="12" fill="#FFFFFF">Azure Private Resolver</text>
  <text x="500" y="308" text-anchor="middle" font-size="11" fill="#CCEEE8">→ Private DNS Zone</text>
  <text x="500" y="334" text-anchor="middle" font-size="11" fill="#C0392B" font-weight="bold">Same zone name, different data</text>

  <!-- Responses RIGHT side -->
  <!-- On-prem answer -->
  <rect x="760" y="110" width="280" height="100" rx="10" fill="#FDF3F3" stroke="#C0392B" stroke-width="2"/>
  <text x="900" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">Answer A — On-Prem Resolver</text>
  <text x="900" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#0D1B2E">svc.agency.gov → 10.1.4.22</text>
  <text x="900" y="178" text-anchor="middle" font-size="12" fill="#5A5A5A">Private IP from Windows DNS (AD zone)</text>
  <text x="900" y="196" text-anchor="middle" font-size="11" fill="#C0392B">Routing works on-prem; fails from cloud</text>

  <!-- Cloud answer -->
  <rect x="760" y="230" width="280" height="100" rx="10" fill="#FDF3F3" stroke="#C0392B" stroke-width="2"/>
  <text x="900" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">Answer B — Cloud Resolver</text>
  <text x="900" y="278" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#0D1B2E">svc.agency.gov → 20.14.8.55</text>
  <text x="900" y="298" text-anchor="middle" font-size="12" fill="#5A5A5A">Public IP from Azure Private DNS Zone</text>
  <text x="900" y="316" text-anchor="middle" font-size="11" fill="#C0392B">Connection routes through public internet</text>

  <!-- Arrows from DNS to answers -->
  <line x1="620" y1="238" x2="758" y2="160" stroke="#C0392B" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="620" y1="310" x2="758" y2="280" stroke="#C0392B" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Failure cascade -->
  <rect x="60" y="370" width="1160" height="280" rx="14" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="640" y="398" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0392B">Failure Modes by Record Type</text>
  <text x="640" y="420" text-anchor="middle" font-size="13" fill="#5A5A5A">Split-brain is not one problem — it is a class of problems, one per record type that carries security or routing semantics</text>

  <!-- 5 failure mode cards -->
  <rect x="80" y="432" width="200" height="196" rx="8" fill="#EAF1FB"/>
  <text x="180" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">A / AAAA</text>
  <text x="180" y="474" text-anchor="middle" font-size="11" fill="#5A5A5A">Private IP resolves wrong</text>
  <text x="180" y="492" text-anchor="middle" font-size="11" fill="#5A5A5A">from remote origin.</text>
  <text x="180" y="512" text-anchor="middle" font-size="11" fill="#C0392B">Connection fails or routes</text>
  <text x="180" y="528" text-anchor="middle" font-size="11" fill="#C0392B">publicly instead of privately</text>

  <rect x="300" y="432" width="200" height="196" rx="8" fill="#EAF1FB"/>
  <text x="400" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">SRV (Kerberos/LDAP)</text>
  <text x="400" y="474" text-anchor="middle" font-size="11" fill="#5A5A5A">AD SRV records not in</text>
  <text x="400" y="492" text-anchor="middle" font-size="11" fill="#5A5A5A">cloud zone after migration.</text>
  <text x="400" y="512" text-anchor="middle" font-size="11" fill="#C0392B">Kerberos auth fails; LDAP</text>
  <text x="400" y="528" text-anchor="middle" font-size="11" fill="#C0392B">service discovery broken</text>

  <rect x="520" y="432" width="200" height="196" rx="8" fill="#EAF1FB"/>
  <text x="620" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">TLSA / CAA</text>
  <text x="620" y="474" text-anchor="middle" font-size="11" fill="#5A5A5A">Certificate pinning record</text>
  <text x="620" y="492" text-anchor="middle" font-size="11" fill="#5A5A5A">absent or stale in one zone.</text>
  <text x="620" y="512" text-anchor="middle" font-size="11" fill="#C0392B">TLS handshake fails in one</text>
  <text x="620" y="528" text-anchor="middle" font-size="11" fill="#C0392B">environment silently</text>

  <rect x="740" y="432" width="200" height="196" rx="8" fill="#EAF1FB"/>
  <text x="840" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">SPF / DKIM / DMARC</text>
  <text x="840" y="474" text-anchor="middle" font-size="11" fill="#5A5A5A">Email auth TXT records</text>
  <text x="840" y="492" text-anchor="middle" font-size="11" fill="#5A5A5A">diverge between zones.</text>
  <text x="840" y="512" text-anchor="middle" font-size="11" fill="#C0392B">Outbound mail rejected</text>
  <text x="840" y="528" text-anchor="middle" font-size="11" fill="#C0392B">or phishing vectors open</text>

  <rect x="960" y="432" width="240" height="196" rx="8" fill="#EAF1FB"/>
  <text x="1080" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">HTTPS / SVCB</text>
  <text x="1080" y="474" text-anchor="middle" font-size="11" fill="#5A5A5A">Application-layer hints</text>
  <text x="1080" y="492" text-anchor="middle" font-size="11" fill="#5A5A5A">diverge: wrong ALT-SVC,</text>
  <text x="1080" y="510" text-anchor="middle" font-size="11" fill="#5A5A5A">wrong ECH keys, wrong</text>
  <text x="1080" y="528" text-anchor="middle" font-size="11" fill="#5A5A5A">ALPN service port.</text>
  <text x="1080" y="548" text-anchor="middle" font-size="11" fill="#C0392B">HTTP/3 fallback confusion</text>

  <text x="640" y="680" text-anchor="middle" font-size="13" fill="#5A5A5A" font-style="italic">A / AAAA are the floor — SRV, TLSA, SSHFP, SPF, DKIM, DMARC, HTTPS/SVCB, DNSSEC types each carry their own split-brain failure modes</text>
</svg>
