<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="tRight" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="640" y="44" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="27" fill="#0D1B2E">Session vs. Token Identity</text>
  <text x="640" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7A8D">The difference is issuance topology and where policy is evaluated — not offline validation. Both validate offline.</text>
  <line x1="60" y1="88" x2="1220" y2="88" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ── LEFT: session-based ────────────────────────────────────── -->
  <rect x="60" y="106" width="560" height="34" rx="5" fill="#0D1B2E"/>
  <text x="340" y="129" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">Session-based identity (Active Directory / Kerberos)</text>

  <rect x="60" y="152" width="560" height="96" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="78" y="176" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="14.5" fill="#0D1B2E">Issuance topology</text>
  <text x="78" y="199" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">The client must reach a KDC on the agency network to obtain a TGT</text>
  <text x="78" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">at logon. Where the KDC is unreachable, there is no ticket — and</text>
  <text x="78" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">Windows may fall back to NTLM.</text>

  <rect x="60" y="260" width="560" height="76" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="78" y="284" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="14.5" fill="#0D1B2E">Validation is offline — this is not the problem</text>
  <text x="78" y="307" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">The application server decrypts the service ticket with its own key.</text>
  <text x="78" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">It calls no domain controller to do it.</text>

  <text x="78" y="366" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="14.5" fill="#C0392B">What the ticket cannot carry</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">
    <rect x="60" y="378" width="560" height="34" rx="4" fill="#F7E2DE"/>
    <g stroke="#C0392B" stroke-width="2.2" stroke-linecap="round"><line x1="78" y1="389" x2="90" y2="401"/><line x1="90" y1="389" x2="78" y2="401"/></g>
    <text x="102" y="400">No device compliance state — nothing to condition access on</text>

    <rect x="60" y="418" width="560" height="34" rx="4" fill="#F7E2DE"/>
    <g stroke="#C0392B" stroke-width="2.2" stroke-linecap="round"><line x1="78" y1="429" x2="90" y2="441"/><line x1="90" y1="429" x2="78" y2="441"/></g>
    <text x="102" y="440">No per-application authorization scope; access is broad by default</text>

    <rect x="60" y="458" width="560" height="34" rx="4" fill="#F7E2DE"/>
    <g stroke="#C0392B" stroke-width="2.2" stroke-linecap="round"><line x1="78" y1="469" x2="90" y2="481"/><line x1="90" y1="469" x2="78" y2="481"/></g>
    <text x="102" y="480">No risk or location signal evaluated at request time</text>

    <rect x="60" y="498" width="560" height="34" rx="4" fill="#F7E2DE"/>
    <g stroke="#C0392B" stroke-width="2.2" stroke-linecap="round"><line x1="78" y1="509" x2="90" y2="521"/><line x1="90" y1="509" x2="78" y2="521"/></g>
    <text x="102" y="520">NTLM fallback is logged (4776 / 4624) but carries no device context,</text>

    <rect x="60" y="538" width="560" height="26" rx="4" fill="#F7E2DE"/>
    <text x="102" y="556">so Conditional Access cannot reach it at all — BOD 25-01 eliminates it</text>
  </g>

  <!-- ── Divider arrow ──────────────────────────────────────────── -->
  <line x1="636" y1="340" x2="656" y2="340" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#tRight)"/>

  <!-- ── RIGHT: token-based ─────────────────────────────────────── -->
  <rect x="672" y="106" width="548" height="34" rx="5" fill="#1E8C8C"/>
  <text x="946" y="129" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">Token-based identity (OAuth 2.0 / OIDC)</text>

  <rect x="672" y="152" width="548" height="96" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="690" y="176" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="14.5" fill="#0D1B2E">Issuance topology</text>
  <text x="690" y="199" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">The identity provider is reachable over HTTPS from any network,</text>
  <text x="690" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">including across a cloud boundary. No line of sight to an</text>
  <text x="690" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">on-premises domain controller is required.</text>

  <rect x="672" y="260" width="548" height="76" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="690" y="284" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="14.5" fill="#0D1B2E">Validation is offline — the same as Kerberos</text>
  <text x="690" y="307" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">The resource server verifies a signature against a published key.</text>
  <text x="690" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">This is not where the two models differ.</text>

  <text x="690" y="366" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="14.5" fill="#1E8C8C">Policy is evaluated at issuance, and travels inside the assertion</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#33414F">
    <rect x="672" y="378" width="548" height="34" rx="4" fill="#D7F2EE"/>
    <polyline points="690,396 695,401 703,389" fill="none" stroke="#1E8C8C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="714" y="400">Device compliance asserted as a claim the resource can rely on</text>

    <rect x="672" y="418" width="548" height="34" rx="4" fill="#D7F2EE"/>
    <polyline points="690,436 695,441 703,429" fill="none" stroke="#1E8C8C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="714" y="440">Per-application scope — least privilege is expressible per request</text>

    <rect x="672" y="458" width="548" height="34" rx="4" fill="#D7F2EE"/>
    <polyline points="690,476 695,481 703,469" fill="none" stroke="#1E8C8C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="714" y="480">Location and risk signals evaluated before the token is issued</text>

    <rect x="672" y="498" width="548" height="34" rx="4" fill="#D7F2EE"/>
    <polyline points="690,516 695,521 703,509" fill="none" stroke="#1E8C8C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="714" y="520">Audit records carry the context the decision was actually made on</text>

    <rect x="672" y="538" width="548" height="26" rx="4" fill="#D7F2EE"/>
    <text x="714" y="556">Supports OMB M-22-09 phishing-resistant MFA and CISA ZTMM Identity</text>
  </g>

  <!-- ── Footer ─────────────────────────────────────────────────── -->
  <rect x="60" y="586" width="1160" height="62" rx="6" fill="#0D1B2E"/>
  <text x="640" y="610" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15.5" fill="#FFFFFF">Tokens only work if the authoritative identity model underneath them is correct.</text>
  <text x="640" y="633" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#D7F2EE">A token asserts an authorization. If that authorization is wrong, the token signs it faster. Principle 3 depends on Principle 1.</text>

  <text x="60" y="676" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">Sources: RFC 4120 · RFC 6749 / OpenID Connect Core · OMB M-22-09 · CISA BOD 25-01 · CISA ZTMM v2.0 Identity pillar</text>
</svg>
