<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-teal3" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1A9E8F"/></marker>
  </defs>

  <text x="800" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#1F3A5F">The Front Door — What ServiceNow Supplies</text>
  <text x="800" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#5A6B7B">Actuation never moves into ServiceNow; ownership, SLA, approval, and evidence do</text>

  <!-- left: native platforms -->
  <rect x="60" y="300" width="270" height="280" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <rect x="60" y="300" width="270" height="56" rx="10" fill="#1F3A5F"/>
  <rect x="60" y="330" width="270" height="26" fill="#1F3A5F"/>
  <text x="195" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Native Platforms</text>
  <text x="195" y="404" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">
    <tspan x="195" dy="0">M365 · Azure</tspan>
    <tspan x="195" dy="26">AWS · VMware</tspan>
    <tspan x="195" dy="26">— each actuates</tspan>
    <tspan x="195" dy="26">on its own console</tspan>
  </text>

  <line x1="330" y1="440" x2="382" y2="440" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal3)"/>

  <!-- coordination container -->
  <rect x="390" y="230" width="820" height="420" rx="14" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="2.5"/>
  <text x="800" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1F3A5F">ServiceNow — coordination layer</text>

  <!-- sub-card Ingest -->
  <rect x="420" y="300" width="240" height="300" rx="10" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="2"/>
  <text x="540" y="336" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#1A9E8F">ComplianceIngest</text>
  <text x="540" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2A2A2A">
    <tspan x="540" dy="0">Reads each platform's</tspan>
    <tspan x="540" dy="24">native control state via</tspan>
    <tspan x="540" dy="24">an in-boundary MID</tspan>
    <tspan x="540" dy="24">Server — read-only</tspan>
  </text>

  <line x1="660" y1="450" x2="690" y2="450" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal3)"/>

  <!-- sub-card Reconcile -->
  <rect x="698" y="300" width="204" height="300" rx="10" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="2"/>
  <text x="800" y="336" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#1A9E8F">
    <tspan x="800" dy="0">Compliance-</tspan>
    <tspan x="800" dy="22">Reconcile</tspan>
  </text>
  <text x="800" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2A2A2A">
    <tspan x="800" dy="0">Binds the finding to</tspan>
    <tspan x="800" dy="24">the reconciled CMDB</tspan>
    <tspan x="800" dy="24">CI before a task is</tspan>
    <tspan x="800" dy="24">ever raised</tspan>
  </text>

  <line x1="902" y1="450" x2="932" y2="450" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal3)"/>

  <!-- sub-card Gate -->
  <rect x="940" y="300" width="240" height="300" rx="10" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="2"/>
  <text x="1060" y="336" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#1A9E8F">ComplianceGate</text>
  <text x="1060" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2A2A2A">
    <tspan x="1060" dy="0">Re-reads the native</tspan>
    <tspan x="1060" dy="24">surface after actuation;</tspan>
    <tspan x="1060" dy="24">stamps the re-test</tspan>
    <tspan x="1060" dy="24">as evidence on the task</tspan>
  </text>

  <line x1="1210" y1="440" x2="1262" y2="440" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal3)"/>

  <!-- right: governed task -->
  <rect x="1270" y="300" width="270" height="280" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <rect x="1270" y="300" width="270" height="56" rx="10" fill="#D4860B"/>
  <rect x="1270" y="330" width="270" height="26" fill="#D4860B"/>
  <text x="1405" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Governed Record</text>
  <text x="1405" y="404" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2A2A2A">
    <tspan x="1405" dy="0">Owner + SLA class</tspan>
    <tspan x="1405" dy="24">(PAIN rating) + approval</tspan>
    <tspan x="1405" dy="24">trail + re-test evidence</tspan>
    <tspan x="1405" dy="24">— the assessor's record</tspan>
  </text>

  <rect x="60" y="670" width="1480" height="66" rx="8" fill="#EAF1FB" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="800" y="702" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F">ServiceNow never writes the resource. It writes the record — who owns it, by when, under whose approval.</text>
  <text x="800" y="726" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1F3A5F">Feeds the attestation pipeline — the closed task becomes an assessed control.</text>
</svg>
