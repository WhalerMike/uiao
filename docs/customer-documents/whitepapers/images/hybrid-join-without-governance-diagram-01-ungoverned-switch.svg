<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · amber #D4A017 (severity only) · red #C0392B · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="72" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">The ungoverned switch — two settings, fifty thousand devices</text>
  <text x="60" y="106" font-size="20" fill="#5A5A5A">One SCP and one GPO, and the fleet converts itself. Nothing sits between the toggle and a tenant-wide state change.</text>

  <!-- LEFT: two input settings -->
  <text x="60" y="166" font-size="15" font-weight="bold" fill="#6B7A8D">THE ENTIRE MECHANISM</text>

  <rect x="60" y="190" width="300" height="96" rx="10" fill="#0D1B2E"/>
  <text x="210" y="226" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Service Connection Point</text>
  <text x="210" y="254" text-anchor="middle" font-size="15" fill="#EAF1FB">set once in the AD config partition</text>

  <rect x="60" y="320" width="300" height="96" rx="10" fill="#0D1B2E"/>
  <text x="210" y="350" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Group Policy</text>
  <text x="210" y="376" text-anchor="middle" font-size="14" fill="#EAF1FB">"Register domain-joined</text>
  <text x="210" y="396" text-anchor="middle" font-size="14" fill="#EAF1FB">computers as devices"</text>

  <!-- arrows into the task -->
  <line x1="360" y1="238" x2="455" y2="290" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="360" y1="368" x2="455" y2="318" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- MIDDLE: auto-device-join task -->
  <rect x="460" y="226" width="320" height="156" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="620" y="262" text-anchor="middle" font-size="20" font-weight="bold" fill="#0D1B2E">Automatic-Device-Join</text>
  <text x="620" y="292" text-anchor="middle" font-size="15" fill="#33414F">built-in scheduled task</text>
  <text x="620" y="318" text-anchor="middle" font-size="15" fill="#33414F">fires on next logon / reboot</text>
  <text x="620" y="350" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#6B7A8D">enterpriseregistration.windows.net</text>

  <line x1="780" y1="304" x2="855" y2="304" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- RIGHT: the fleet flips -->
  <rect x="860" y="180" width="360" height="248" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1040" y="214" text-anchor="middle" font-size="21" font-weight="bold" fill="#0D1B2E">50,000 Windows devices</text>
  <text x="1040" y="238" text-anchor="middle" font-size="14" fill="#33414F">auto-register on their own schedule</text>
  <!-- device grid (3 x 6) -->
  <g fill="#0D1B2E">
    <rect x="884" y="258" width="46" height="28" rx="4"/><rect x="940" y="258" width="46" height="28" rx="4"/><rect x="996" y="258" width="46" height="28" rx="4"/><rect x="1052" y="258" width="46" height="28" rx="4"/><rect x="1108" y="258" width="46" height="28" rx="4"/><rect x="1164" y="258" width="46" height="28" rx="4"/>
    <rect x="884" y="294" width="46" height="28" rx="4"/><rect x="940" y="294" width="46" height="28" rx="4"/><rect x="996" y="294" width="46" height="28" rx="4"/><rect x="1052" y="294" width="46" height="28" rx="4"/><rect x="1108" y="294" width="46" height="28" rx="4"/><rect x="1164" y="294" width="46" height="28" rx="4"/>
    <rect x="884" y="330" width="46" height="28" rx="4"/><rect x="940" y="330" width="46" height="28" rx="4"/><rect x="996" y="330" width="46" height="28" rx="4"/><rect x="1052" y="330" width="46" height="28" rx="4"/><rect x="1108" y="330" width="46" height="28" rx="4"/><rect x="1164" y="330" width="46" height="28" rx="4"/>
  </g>
  <text x="1040" y="400" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E8C8C">each gets an Entra device object + PRT</text>

  <!-- BOTTOM: the hazard band (loss = red) -->
  <rect x="60" y="470" width="1160" height="180" rx="12" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="640" y="512" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#C0392B">Effortless is the hazard</text>
  <text x="640" y="552" text-anchor="middle" font-size="19" fill="#33414F">No per-device gate&#160;&#160;·&#160;&#160;no ownership check&#160;&#160;·&#160;&#160;no OrgPath&#160;&#160;·&#160;&#160;no reconciliation step</text>
  <text x="640" y="592" text-anchor="middle" font-size="19" fill="#33414F">anywhere in this path. Governance is precisely the part the mechanism does not require —</text>
  <text x="640" y="624" text-anchor="middle" font-size="19" font-weight="bold" fill="#0D1B2E">so the control's intent becomes 50,000 untracked state changes no one can attribute.</text>
</svg>
