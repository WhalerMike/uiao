<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · red #C0392B (loss) · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="72" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">Two paths to the same end state</text>
  <text x="60" y="106" font-size="20" fill="#5A5A5A">Both reach "devices hybrid-joined, Conditional Access enforcing." Only one keeps the changes owned and reversible.</text>

  <!-- ===== UNGOVERNED lane ===== -->
  <text x="60" y="168" font-size="17" font-weight="bold" fill="#C0392B">UNGOVERNED</text>
  <line x1="60" y1="180" x2="1220" y2="180" stroke="#F7E2DE" stroke-width="2"/>

  <rect x="60" y="200" width="190" height="80" rx="10" fill="#0D1B2E"/>
  <text x="155" y="234" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">SCP + GPO</text>
  <text x="155" y="260" text-anchor="middle" font-size="13" fill="#EAF1FB">two settings</text>

  <line x1="250" y1="240" x2="640" y2="240" stroke="#C0392B" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="445" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">fleet flips, unattended — minutes of effort</text>

  <rect x="650" y="200" width="240" height="80" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="770" y="234" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Hybrid-joined fleet</text>
  <text x="770" y="260" text-anchor="middle" font-size="13" fill="#33414F">CA enforcing</text>

  <!-- loss chips -->
  <g font-size="14" font-weight="bold">
    <rect x="60" y="300" width="170" height="34" rx="17" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/><text x="145" y="322" text-anchor="middle" fill="#C0392B">no owner / OrgPath</text>
    <rect x="244" y="300" width="160" height="34" rx="17" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/><text x="324" y="322" text-anchor="middle" fill="#C0392B">duplicate objects</text>
    <rect x="418" y="300" width="150" height="34" rx="17" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/><text x="493" y="322" text-anchor="middle" fill="#C0392B">lockout risk</text>
    <rect x="582" y="300" width="210" height="34" rx="17" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/><text x="687" y="322" text-anchor="middle" fill="#C0392B">non-Windows invisible</text>
    <rect x="806" y="300" width="180" height="34" rx="17" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/><text x="896" y="322" text-anchor="middle" fill="#C0392B">unattributable</text>
  </g>

  <line x1="60" y1="364" x2="1220" y2="364" stroke="#E3E8EF" stroke-width="1.5"/>

  <!-- ===== GOVERNED lane ===== -->
  <text x="60" y="404" font-size="17" font-weight="bold" fill="#1E8C8C">GOVERNED</text>

  <!-- 6-step pipeline -->
  <g>
    <rect x="60" y="424" width="160" height="92" rx="10" fill="#0D1B2E"/>
    <text x="140" y="460" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">OrgPath target</text>
    <text x="140" y="484" text-anchor="middle" font-size="13" fill="#EAF1FB">scoped waves</text>

    <rect x="253" y="424" width="160" height="92" rx="10" fill="#1E8C8C"/>
    <text x="333" y="466" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">L1 Observe</text>
    <text x="333" y="490" text-anchor="middle" font-size="13" fill="#D7F2EE">drift detected</text>

    <rect x="446" y="424" width="160" height="92" rx="10" fill="#1E8C8C"/>
    <text x="526" y="460" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">L2 Advise</text>
    <text x="526" y="484" text-anchor="middle" font-size="12" fill="#D7F2EE">report-only CA</text>

    <rect x="639" y="418" width="160" height="104" rx="10" fill="#0D1B2E" stroke="#D4A017" stroke-width="3"/>
    <text x="719" y="456" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">L3 Gated wave</text>
    <text x="719" y="480" text-anchor="middle" font-size="12" fill="#EAF1FB">human approves</text>
    <text x="719" y="502" text-anchor="middle" font-size="12" fill="#EAF1FB">each wave</text>

    <rect x="832" y="424" width="160" height="92" rx="10" fill="#1E8C8C"/>
    <text x="912" y="460" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Reconcile</text>
    <text x="912" y="484" text-anchor="middle" font-size="12" fill="#D7F2EE">signed evidence</text>

    <rect x="1025" y="424" width="170" height="92" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <text x="1110" y="456" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Hybrid-joined</text>
    <text x="1110" y="482" text-anchor="middle" font-size="13" fill="#33414F">+ accredited</text>
  </g>
  <!-- teal connectors -->
  <g stroke="#1E8C8C" stroke-width="3">
    <line x1="220" y1="470" x2="248" y2="470" marker-end="url(#arrow-teal)"/>
    <line x1="413" y1="470" x2="441" y2="470" marker-end="url(#arrow-teal)"/>
    <line x1="606" y1="470" x2="634" y2="470" marker-end="url(#arrow-teal)"/>
    <line x1="799" y1="470" x2="827" y2="470" marker-end="url(#arrow-teal)"/>
    <line x1="992" y1="470" x2="1020" y2="470" marker-end="url(#arrow-teal)"/>
  </g>

  <!-- bottom caption -->
  <rect x="60" y="560" width="1135" height="116" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="627" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#0D1B2E">Same technical end state</text>
  <text x="627" y="636" text-anchor="middle" font-size="18" fill="#33414F">The governed path pays down the loss ledger — every change owned, addressable, attributable, reversible.</text>
  <text x="627" y="664" text-anchor="middle" font-size="18" font-weight="bold" fill="#C0392B">The ungoverned path runs the ledger up.</text>
</svg>
