<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
  </defs>

  <text x="640" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#0D1B2E">AODIM Attribute Flow — HR to Access Policy</text>
  <text x="640" y="76" text-anchor="middle" font-size="15" fill="#5A5A5A">How authoritative identity context flows from HR source-of-truth through OrgPath facets to computed access decisions</text>

  <!-- Stage 1: HR Source -->
  <rect x="40" y="110" width="180" height="480" rx="14" fill="#0D1B2E"/>
  <text x="130" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8C8C">HR / HRIT</text>
  <text x="130" y="162" text-anchor="middle" font-size="12" fill="#9BB8CC">Source of truth</text>

  <rect x="56" y="178" width="148" height="36" rx="6" fill="#1A3A52"/>
  <text x="130" y="202" text-anchor="middle" font-size="12" fill="#FFFFFF">EmployeeID</text>

  <rect x="56" y="222" width="148" height="36" rx="6" fill="#1A3A52"/>
  <text x="130" y="246" text-anchor="middle" font-size="12" fill="#FFFFFF">Department</text>

  <rect x="56" y="266" width="148" height="36" rx="6" fill="#1A3A52"/>
  <text x="130" y="290" text-anchor="middle" font-size="12" fill="#FFFFFF">JobTitle / Series</text>

  <rect x="56" y="310" width="148" height="36" rx="6" fill="#1A3A52"/>
  <text x="130" y="334" text-anchor="middle" font-size="12" fill="#FFFFFF">SupervisorID</text>

  <rect x="56" y="354" width="148" height="36" rx="6" fill="#1A3A52"/>
  <text x="130" y="378" text-anchor="middle" font-size="12" fill="#FFFFFF">Agency / SubOrg</text>

  <rect x="56" y="398" width="148" height="36" rx="6" fill="#1A3A52"/>
  <text x="130" y="422" text-anchor="middle" font-size="12" fill="#FFFFFF">ClearanceLevel</text>

  <rect x="56" y="442" width="148" height="36" rx="6" fill="#1A3A52"/>
  <text x="130" y="466" text-anchor="middle" font-size="12" fill="#FFFFFF">WorkerType</text>

  <rect x="56" y="486" width="148" height="44" rx="6" fill="#C0392B" fill-opacity="0.3" stroke="#C0392B" stroke-width="1"/>
  <text x="130" y="507" text-anchor="middle" font-size="11" fill="#FFFFFF">DRIFT-IDENTITY</text>
  <text x="130" y="522" text-anchor="middle" font-size="11" fill="#9BB8CC">if HR out of sync</text>

  <!-- Arrow 1→2 -->
  <line x1="220" y1="360" x2="278" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>
  <text x="249" y="348" text-anchor="middle" font-size="11" fill="#1E8C8C">HRIT</text>
  <text x="249" y="374" text-anchor="middle" font-size="11" fill="#1E8C8C">sync</text>

  <!-- Stage 2: OrgPath Facets -->
  <rect x="280" y="110" width="220" height="480" rx="14" fill="#1A3A52" stroke="#1E8C8C" stroke-width="2"/>
  <text x="390" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8C8C">OrgPath Facets</text>
  <text x="390" y="162" text-anchor="middle" font-size="12" fill="#9BB8CC">15-facet model (UIAO_151)</text>

  <rect x="296" y="178" width="188" height="36" rx="6" fill="#1E8C8C"/>
  <text x="390" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">OrgUnit (f1)</text>

  <rect x="296" y="222" width="188" height="36" rx="6" fill="#1E8C8C"/>
  <text x="390" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Department (f2)</text>

  <rect x="296" y="266" width="188" height="36" rx="6" fill="#1E8C8C"/>
  <text x="390" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Classification (f3)</text>

  <rect x="296" y="310" width="188" height="36" rx="6" fill="#1E8C8C"/>
  <text x="390" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Role / Series (f4)</text>

  <rect x="296" y="354" width="188" height="36" rx="6" fill="#1E8C8C"/>
  <text x="390" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">WorkerType (f5)</text>

  <rect x="296" y="398" width="188" height="36" rx="6" fill="#1E8C8C"/>
  <text x="390" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">ManagerChain (f6)</text>

  <rect x="296" y="442" width="188" height="36" rx="6" fill="#1E8C8C" fill-opacity="0.5"/>
  <text x="390" y="466" text-anchor="middle" font-size="12" fill="#CCEEE8">+ 9 additional facets</text>

  <rect x="296" y="492" width="188" height="38" rx="6" fill="#0D1B2E"/>
  <text x="390" y="510" text-anchor="middle" font-size="11" fill="#FFFFFF">Stamped to Entra</text>
  <text x="390" y="524" text-anchor="middle" font-size="11" fill="#9BB8CC">extensionAttribute1-15</text>

  <!-- Arrow 2→3 -->
  <line x1="500" y1="360" x2="558" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>
  <text x="529" y="348" text-anchor="middle" font-size="11" fill="#1E8C8C">graph</text>
  <text x="529" y="374" text-anchor="middle" font-size="11" fill="#1E8C8C">write</text>

  <!-- Stage 3: Computed Groups -->
  <rect x="560" y="110" width="220" height="480" rx="14" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="670" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Computed Groups</text>
  <text x="670" y="162" text-anchor="middle" font-size="12" fill="#5A5A5A">Dynamic membership rules</text>

  <rect x="576" y="178" width="188" height="50" rx="6" fill="#0D1B2E"/>
  <text x="670" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8C8C">Dynamic Security Group</text>
  <text x="670" y="216" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9BB8CC">(f2=Finance AND f5=FTE)</text>

  <rect x="576" y="238" width="188" height="50" rx="6" fill="#0D1B2E"/>
  <text x="670" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8C8C">Administrative Unit</text>
  <text x="670" y="276" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9BB8CC">(f1=HQ department)</text>

  <rect x="576" y="298" width="188" height="50" rx="6" fill="#0D1B2E"/>
  <text x="670" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8C8C">Entitlement Group</text>
  <text x="670" y="336" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9BB8CC">(f4=GS-13 AND f3=Secret)</text>

  <rect x="576" y="358" width="188" height="50" rx="6" fill="#0D1B2E"/>
  <text x="670" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8C8C">PIM Eligible Role</text>
  <text x="670" y="396" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9BB8CC">(f4=SysAdmin)</text>

  <rect x="576" y="420" width="188" height="50" rx="6" fill="#1E8C8C" fill-opacity="0.2" stroke="#1E8C8C" stroke-width="1"/>
  <text x="670" y="445" text-anchor="middle" font-size="12" fill="#1E8C8C">Movers recompute</text>
  <text x="670" y="463" text-anchor="middle" font-size="12" fill="#1E8C8C">automatically on facet change</text>

  <rect x="576" y="484" width="188" height="46" rx="6" fill="#C0392B" fill-opacity="0.15" stroke="#C0392B" stroke-width="1"/>
  <text x="670" y="503" text-anchor="middle" font-size="11" fill="#C0392B">Manual group admin = friction</text>
  <text x="670" y="521" text-anchor="middle" font-size="11" fill="#5A5A5A">not governance</text>

  <!-- Arrow 3→4 -->
  <line x1="780" y1="360" x2="838" y2="360" stroke="#0D1B2E" stroke-width="3" marker-end="url(#arr-navy)"/>
  <text x="809" y="348" text-anchor="middle" font-size="11" fill="#5A5A5A">eval</text>
  <text x="809" y="374" text-anchor="middle" font-size="11" fill="#5A5A5A">rule</text>

  <!-- Stage 4: Access Policies -->
  <rect x="840" y="110" width="220" height="480" rx="14" fill="#F8F4E8" stroke="#D4A017" stroke-width="1.5"/>
  <text x="950" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Access Policies</text>
  <text x="950" y="162" text-anchor="middle" font-size="12" fill="#5A5A5A">Conditional Access + PIM</text>

  <rect x="856" y="178" width="188" height="50" rx="6" fill="#0D1B2E"/>
  <text x="950" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Conditional Access Policy</text>
  <text x="950" y="216" text-anchor="middle" font-size="11" fill="#9BB8CC">Require MFA for GS-14+ admins</text>

  <rect x="856" y="238" width="188" height="50" rx="6" fill="#0D1B2E"/>
  <text x="950" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Conditional Access Policy</text>
  <text x="950" y="276" text-anchor="middle" font-size="11" fill="#9BB8CC">Block legacy auth — all workers</text>

  <rect x="856" y="298" width="188" height="50" rx="6" fill="#0D1B2E"/>
  <text x="950" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">PIM Assignment</text>
  <text x="950" y="336" text-anchor="middle" font-size="11" fill="#9BB8CC">Eligible, time-bounded, approved</text>

  <rect x="856" y="358" width="188" height="50" rx="6" fill="#0D1B2E"/>
  <text x="950" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Entitlement Management</text>
  <text x="950" y="396" text-anchor="middle" font-size="11" fill="#9BB8CC">Access package by facet predicate</text>

  <text x="950" y="440" text-anchor="middle" font-size="12" fill="#5A5A5A">Identity is purely</text>
  <text x="950" y="458" text-anchor="middle" font-size="12" fill="#5A5A5A">attribute-bearing;</text>
  <text x="950" y="476" text-anchor="middle" font-size="12" fill="#5A5A5A">policy holds the logic</text>
  <text x="950" y="498" text-anchor="middle" font-size="12" fill="#D4A017">(boundary shift from AD)</text>

  <!-- Arrow 4→5 -->
  <line x1="1060" y1="360" x2="1118" y2="360" stroke="#0D1B2E" stroke-width="3" marker-end="url(#arr-navy)"/>

  <!-- Stage 5: Resources -->
  <rect x="1120" y="110" width="140" height="480" rx="14" fill="#0D1B2E"/>
  <text x="1190" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">Resources</text>

  <rect x="1136" y="170" width="108" height="34" rx="6" fill="#1A3A52"/>
  <text x="1190" y="192" text-anchor="middle" font-size="12" fill="#FFFFFF">SharePoint</text>

  <rect x="1136" y="214" width="108" height="34" rx="6" fill="#1A3A52"/>
  <text x="1190" y="236" text-anchor="middle" font-size="12" fill="#FFFFFF">Azure VMs</text>

  <rect x="1136" y="258" width="108" height="34" rx="6" fill="#1A3A52"/>
  <text x="1190" y="280" text-anchor="middle" font-size="12" fill="#FFFFFF">Key Vault</text>

  <rect x="1136" y="302" width="108" height="34" rx="6" fill="#1A3A52"/>
  <text x="1190" y="324" text-anchor="middle" font-size="12" fill="#FFFFFF">SaaS apps</text>

  <rect x="1136" y="346" width="108" height="34" rx="6" fill="#1A3A52"/>
  <text x="1190" y="368" text-anchor="middle" font-size="12" fill="#FFFFFF">Snowflake</text>

  <rect x="1136" y="390" width="108" height="34" rx="6" fill="#1A3A52"/>
  <text x="1190" y="412" text-anchor="middle" font-size="12" fill="#FFFFFF">ServiceNow</text>

  <rect x="1136" y="434" width="108" height="34" rx="6" fill="#1A3A52"/>
  <text x="1190" y="456" text-anchor="middle" font-size="12" fill="#FFFFFF">GitHub</text>

  <rect x="1136" y="486" width="108" height="44" rx="6" fill="#1E8C8C" fill-opacity="0.3"/>
  <text x="1190" y="506" text-anchor="middle" font-size="11" fill="#CCEEE8">Per-action</text>
  <text x="1190" y="522" text-anchor="middle" font-size="11" fill="#CCEEE8">decision</text>

  <text x="640" y="626" text-anchor="middle" font-size="13" fill="#5A5A5A" font-style="italic">Wrong attributes → wrong access · right attributes → right access · the directory's quality becomes the program's quality</text>
  <text x="640" y="648" text-anchor="middle" font-size="13" fill="#0D1B2E" font-style="italic">AODIM = Authoritative-Organization-Driven Identity Management · ADR-051/052/053/054 · OrgPath UIAO_007</text>
</svg>
