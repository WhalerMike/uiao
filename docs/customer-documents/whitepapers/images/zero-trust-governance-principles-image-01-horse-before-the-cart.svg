<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif;background:#FFFFFF;">
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <g id="horse">
      <path d="M45,55 C30,60 20,80 22,105 C23,112 30,110 30,102 C29,85 38,68 50,60 Z"/>
      <ellipse cx="110" cy="70" rx="70" ry="32"/>
      <path d="M165,55 L210,10 L222,18 L178,72 Z"/>
      <path d="M205,8 L232,2 L238,14 L214,26 Z"/>
      <path d="M206,6 L212,-9 L216,5 Z"/>
      <rect x="55" y="95" width="12" height="55" rx="3"/>
      <rect x="72" y="95" width="12" height="55" rx="3"/>
      <rect x="148" y="95" width="12" height="55" rx="3"/>
      <rect x="165" y="95" width="12" height="55" rx="3"/>
    </g>
    <g id="cart">
      <circle cx="15" cy="95" r="16"/>
      <circle cx="75" cy="95" r="16"/>
      <rect x="0" y="40" width="90" height="45" rx="6"/>
    </g>
  </defs>

  <text x="640" y="72" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#0D1B2E">Horse Before the Cart</text>
  <text x="640" y="106" text-anchor="middle" font-size="19" fill="#6B7A8D">Whole-agency Zero Trust: unify Network + CSP + VMware first — then let assessment confirm it</text>

  <!-- LEFT PANEL: THE WRONG WAY -->
  <rect x="60" y="150" width="560" height="460" rx="14" fill="#F7E2DE"/>
  <text x="340" y="192" text-anchor="middle" font-size="22" font-weight="bold" fill="#C0392B">THE WRONG WAY</text>
  <text x="340" y="216" text-anchor="middle" font-size="15" fill="#5A5A5A">Cart Before the Horse</text>

  <line x1="95" y1="470" x2="585" y2="470" stroke="#E3E8EF" stroke-width="2"/>

  <!-- wrong: cart leads (left), horse trails (right), tangled connection -->
  <g transform="translate(95,300)" fill="#C0392B" opacity="0.55">
    <use href="#cart"/>
  </g>
  <text x="185" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">ASSESSMENT</text>
  <text x="185" y="252" text-anchor="middle" font-size="26" font-weight="bold" fill="#C0392B">?</text>
  <text x="185" y="418" text-anchor="middle" font-size="12.5" fill="#5A5A5A">confirms nothing real</text>

  <g transform="translate(340,260)" fill="#8A929B">
    <use href="#horse"/>
  </g>

  <!-- tangled red connector between cart and horse -->
  <path d="M185,340 L300,410 L360,345 L430,400" stroke="#C0392B" stroke-width="3" fill="none" stroke-dasharray="7,5"/>

  <!-- scattered, disconnected domain tags -->
  <rect x="380" y="440" width="86" height="30" rx="6" fill="none" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="423" y="460" text-anchor="middle" font-size="12.5" fill="#C0392B">NETWORK</text>
  <rect x="475" y="475" width="66" height="30" rx="6" fill="none" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="508" y="495" text-anchor="middle" font-size="12.5" fill="#C0392B">CSP</text>
  <rect x="370" y="500" width="86" height="30" rx="6" fill="none" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="413" y="520" text-anchor="middle" font-size="12.5" fill="#C0392B">VMWARE</text>
  <text x="340" y="580" text-anchor="middle" font-size="13" fill="#5A5A5A">three silos, never unified —</text>
  <text x="340" y="600" text-anchor="middle" font-size="13" fill="#5A5A5A">the scan just measures the disorder</text>

  <!-- RIGHT PANEL: THE RIGHT WAY -->
  <rect x="660" y="150" width="560" height="460" rx="14" fill="#D7F2EE"/>
  <text x="940" y="192" text-anchor="middle" font-size="22" font-weight="bold" fill="#0D1B2E">THE RIGHT WAY</text>
  <text x="940" y="216" text-anchor="middle" font-size="15" fill="#33414F">Horse Before the Cart</text>

  <line x1="695" y1="470" x2="1185" y2="470" stroke="#B9C2CE" stroke-width="2"/>

  <!-- right: horse leads (left), yoke unifies, cart trails (right) -->
  <g transform="translate(700,260)" fill="#2E4B6B">
    <use href="#horse"/>
  </g>

  <!-- single teal harness line from horse to yoke -->
  <line x1="935" y1="360" x2="990" y2="360" stroke="#1E8C8C" stroke-width="4"/>

  <rect x="990" y="330" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2.5"/>
  <text x="1065" y="354" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0D1B2E">NETWORK + CSP</text>
  <text x="1065" y="372" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0D1B2E">+ VMWARE</text>

  <text x="1065" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">ONE UNIFIED ARCHITECTURE</text>

  <!-- shaft from yoke to cart -->
  <line x1="1140" y1="360" x2="1175" y2="360" stroke="#1E8C8C" stroke-width="4"/>
  <g transform="translate(1175,300)" fill="#2E75B6">
    <use href="#cart"/>
  </g>
  <text x="1220" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E75B6">ASSESSMENT</text>
  <text x="1220" y="418" text-anchor="middle" font-size="12.5" fill="#33414F">confirms compliance</text>
  <text x="1220" y="252" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E8C8C">✓</text>

  <text x="940" y="580" text-anchor="middle" font-size="13" fill="#33414F">one naming/identity plane behind</text>
  <text x="940" y="600" text-anchor="middle" font-size="13" fill="#33414F">Network, every CSP, and VMware alike</text>

  <!-- bottom callout -->
  <rect x="60" y="632" width="1160" height="66" rx="10" fill="#EAF1FB"/>
  <text x="92" y="660" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="17.5" font-weight="bold" fill="#0D1B2E">A whole-agency Zero Trust score is only as real as the architecture behind it.</text>
  <text x="92" y="684" text-anchor="start" font-size="14" fill="#33414F">Assess Network, CSPs, and VMware as one governed system — not three separate scans stitched together after the fact.</text>
</svg>
