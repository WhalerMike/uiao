<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="60" y="52" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">SCuBA vs. Zero Trust Assessment — Complementary, Not Redundant</text>
  <text x="60" y="78" font-size="16" fill="#5A5A5A">Two partially overlapping circles, not one inside the other</text>

  <!-- Left circle area — SCuBA only -->
  <ellipse cx="420" cy="370" rx="340" ry="260" fill="#EAF1FB" fill-opacity="0.7" stroke="#0D1B2E" stroke-width="2.5"/>

  <!-- Right circle area — ZT only -->
  <ellipse cx="860" cy="370" rx="340" ry="260" fill="#CCEEE8" fill-opacity="0.7" stroke="#1E8C8C" stroke-width="2.5"/>

  <!-- Overlap region label background -->
  <ellipse cx="640" cy="370" rx="90" ry="180" fill="#D4EDDE" fill-opacity="0.9"/>

  <!-- Labels -->
  <text x="240" y="220" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">ScubaGear</text>
  <text x="240" y="244" text-anchor="middle" font-size="14" fill="#0D1B2E">(CISA SCuBA)</text>
  <text x="240" y="268" text-anchor="middle" font-size="13" fill="#5A5A5A">Compliance question:</text>
  <text x="240" y="286" text-anchor="middle" font-size="13" fill="#5A5A5A">M365 vs. federal baseline?</text>
  <text x="240" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Driver: BOD 25-01</text>

  <text x="1040" y="220" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E8C8C">Zero Trust</text>
  <text x="1040" y="244" text-anchor="middle" font-size="14" fill="#1E8C8C">Assessment</text>
  <text x="1040" y="268" text-anchor="middle" font-size="13" fill="#5A5A5A">Maturity question:</text>
  <text x="1040" y="286" text-anchor="middle" font-size="13" fill="#5A5A5A">How close to Zero Trust?</text>
  <text x="1040" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8C8C">Driver: Microsoft SFI + ZT</text>

  <!-- SCuBA-only items -->
  <text x="270" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">SCuBA-only coverage</text>
  <text x="270" y="378" text-anchor="middle" font-size="12" fill="#5A5A5A">Exchange Online</text>
  <text x="270" y="396" text-anchor="middle" font-size="12" fill="#5A5A5A">mail-flow, ext. forwarding</text>
  <text x="270" y="414" text-anchor="middle" font-size="12" fill="#5A5A5A">SPF / DKIM / DMARC</text>
  <text x="270" y="432" text-anchor="middle" font-size="12" fill="#5A5A5A">SharePoint / OneDrive</text>
  <text x="270" y="450" text-anchor="middle" font-size="12" fill="#5A5A5A">Teams configuration</text>
  <text x="270" y="468" text-anchor="middle" font-size="12" fill="#5A5A5A">Power Platform</text>
  <text x="270" y="486" text-anchor="middle" font-size="12" fill="#5A5A5A">Defender for O365</text>
  <text x="270" y="504" text-anchor="middle" font-size="12" fill="#5A5A5A">SHALL / SHOULD findings</text>

  <!-- Overlap items -->
  <text x="640" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Shared</text>
  <text x="640" y="342" text-anchor="middle" font-size="11" fill="#0D1B2E">Entra Identity</text>
  <text x="640" y="362" text-anchor="middle" font-size="11" fill="#5A5A5A">Legacy auth block</text>
  <text x="640" y="380" text-anchor="middle" font-size="11" fill="#5A5A5A">MFA enrollment</text>
  <text x="640" y="398" text-anchor="middle" font-size="11" fill="#5A5A5A">Conditional Access</text>
  <text x="640" y="416" text-anchor="middle" font-size="11" fill="#5A5A5A">Privileged roles</text>
  <text x="640" y="434" text-anchor="middle" font-size="11" fill="#5A5A5A">App consent</text>
  <text x="640" y="452" text-anchor="middle" font-size="11" fill="#5A5A5A">Risky users</text>

  <!-- ZT-only items -->
  <text x="1010" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">ZT-only coverage</text>
  <text x="1010" y="378" text-anchor="middle" font-size="12" fill="#5A5A5A">Intune device compliance</text>
  <text x="1010" y="396" text-anchor="middle" font-size="12" fill="#5A5A5A">and configuration</text>
  <text x="1010" y="414" text-anchor="middle" font-size="12" fill="#5A5A5A">Azure networking</text>
  <text x="1010" y="432" text-anchor="middle" font-size="12" fill="#5A5A5A">Azure infrastructure</text>
  <text x="1010" y="450" text-anchor="middle" font-size="12" fill="#5A5A5A">Microsoft Purview data</text>
  <text x="1010" y="468" text-anchor="middle" font-size="12" fill="#5A5A5A">ZT maturity by pillar</text>
  <text x="1010" y="486" text-anchor="middle" font-size="12" fill="#5A5A5A">High / Medium / Low risk</text>
  <text x="1010" y="504" text-anchor="middle" font-size="12" fill="#5A5A5A">More granular than SCuBA</text>

  <!-- Bottom recommendation -->
  <rect x="60" y="650" width="1160" height="54" rx="10" fill="#0D1B2E"/>
  <text x="640" y="672" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8C8C">Recommendation: Run both.</text>
  <text x="640" y="692" text-anchor="middle" font-size="13" fill="#FFFFFF">Use ScubaGear for BOD 25-01 M365 compliance · use Zero Trust Assessment for broader ZT maturity · reconcile findings at the NIST 800-53 control level</text>
</svg>
