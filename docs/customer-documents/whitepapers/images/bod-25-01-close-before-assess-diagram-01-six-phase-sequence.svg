<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif;background:#FFFFFF;">
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <text x="640" y="86" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#0D1B2E">Six Phases: Architecture Before Assessment</text>
  <text x="640" y="122" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#6B7A8D">SCuBAGear and Microsoft ZTTT run at Phase 5 — confirmation, not discovery</text>

  <!-- Connecting arrows -->
  <g stroke="#1E8C8C" stroke-width="4" fill="none">
    <line x1="221" y1="370" x2="243" y2="370"/>
    <line x1="423" y1="370" x2="445" y2="370"/>
    <line x1="625" y1="370" x2="647" y2="370"/>
    <line x1="827" y1="370" x2="849" y2="370"/>
    <line x1="1029" y1="370" x2="1051" y2="370"/>
  </g>
  <g fill="#1E8C8C">
    <path d="M243,362 L257,370 L243,378 Z"/>
    <path d="M445,362 L459,370 L445,378 Z"/>
    <path d="M647,362 L661,370 L647,378 Z"/>
    <path d="M849,362 L863,370 L849,378 Z"/>
    <path d="M1051,362 L1065,370 L1051,378 Z"/>
  </g>

  <!-- Phase 1: Understand -->
  <rect x="49" y="300" width="172" height="140" rx="10" fill="#0D1B2E"/>
  <text x="135" y="358" text-anchor="middle" font-size="21" font-weight="bold" fill="#FFFFFF">Understand</text>
  <text x="135" y="384" text-anchor="middle" font-size="14" font-weight="normal" fill="#EAF1FB">gaps &amp; root causes</text>

  <!-- Phase 2: Design -->
  <rect x="251" y="300" width="172" height="140" rx="10" fill="#0D1B2E"/>
  <text x="337" y="358" text-anchor="middle" font-size="21" font-weight="bold" fill="#FFFFFF">Design</text>
  <text x="337" y="384" text-anchor="middle" font-size="14" font-weight="normal" fill="#EAF1FB">closure patterns</text>

  <!-- Phase 3: Implement -->
  <rect x="453" y="300" width="172" height="140" rx="10" fill="#0D1B2E"/>
  <text x="539" y="358" text-anchor="middle" font-size="21" font-weight="bold" fill="#FFFFFF">Implement</text>
  <text x="539" y="384" text-anchor="middle" font-size="14" font-weight="normal" fill="#EAF1FB">runbooks &amp; deploys</text>

  <!-- Phase 4: Govern -->
  <rect x="655" y="300" width="172" height="140" rx="10" fill="#0D1B2E"/>
  <text x="741" y="358" text-anchor="middle" font-size="21" font-weight="bold" fill="#FFFFFF">Govern</text>
  <text x="741" y="384" text-anchor="middle" font-size="14" font-weight="normal" fill="#EAF1FB">SCRM · POA&amp;M · RACI</text>

  <!-- Phase 5: Validate (highlighted) -->
  <rect x="857" y="300" width="172" height="140" rx="10" fill="#D7F2EE" stroke="#0D1B2E" stroke-width="2.5"/>
  <text x="943" y="350" text-anchor="middle" font-size="21" font-weight="bold" fill="#0D1B2E">Validate</text>
  <text x="943" y="374" text-anchor="middle" font-size="13" font-weight="normal" fill="#33414F">SCuBAGear + ZTTT</text>
  <text x="943" y="392" text-anchor="middle" font-size="13" font-weight="normal" fill="#33414F">run here</text>

  <!-- Phase 6: Authorize -->
  <rect x="1059" y="300" width="172" height="140" rx="10" fill="#2E75B6"/>
  <text x="1145" y="358" text-anchor="middle" font-size="21" font-weight="bold" fill="#FFFFFF">Authorize</text>
  <text x="1145" y="384" text-anchor="middle" font-size="14" font-weight="normal" fill="#FFFFFF">KSI-ready evidence</text>

  <!-- Numbered badges -->
  <g font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <circle cx="67" cy="300" r="16" fill="#0D1B2E"/>
    <text x="67" y="305">1</text>
    <circle cx="269" cy="300" r="16" fill="#0D1B2E"/>
    <text x="269" y="305">2</text>
    <circle cx="471" cy="300" r="16" fill="#0D1B2E"/>
    <text x="471" y="305">3</text>
    <circle cx="673" cy="300" r="16" fill="#0D1B2E"/>
    <text x="673" y="305">4</text>
    <circle cx="875" cy="300" r="16" fill="#0D1B2E"/>
    <text x="875" y="305">5</text>
    <circle cx="1077" cy="300" r="16" fill="#0D1B2E"/>
    <text x="1077" y="305">6</text>
  </g>

  <!-- Bracket 1: phases 1-4, close findings first -->
  <path d="M49,470 L49,478 L827,478 L827,470" stroke="#0D1B2E" stroke-width="2.5" fill="none"/>
  <text x="438" y="504" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">CLOSE FINDINGS FIRST</text>
  <text x="438" y="526" text-anchor="middle" font-size="14" font-weight="normal" fill="#6B7A8D">build the architecture the finding depends on</text>

  <!-- Bracket 2: phases 5-6, then assess -->
  <path d="M857,470 L857,478 L1231,478 L1231,470" stroke="#1E8C8C" stroke-width="2.5" fill="none"/>
  <text x="1044" y="504" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E8C8C">THEN ASSESS &amp; AUTHORIZE</text>
  <text x="1044" y="526" text-anchor="middle" font-size="14" font-weight="normal" fill="#6B7A8D">confirmation, not discovery</text>

  <!-- Bottom callout bar -->
  <rect x="49" y="588" width="1182" height="76" rx="10" fill="#EAF1FB"/>
  <text x="81" y="620" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#0D1B2E">BOD-25-01's "remediate deviations" clause is phases 1–4, not phase 5.</text>
  <text x="81" y="646" text-anchor="start" font-size="15" font-weight="normal" fill="#33414F">Running the assessor before the architecture exists produces an accurate, growing findings list — not a closed one.</text>
</svg>
