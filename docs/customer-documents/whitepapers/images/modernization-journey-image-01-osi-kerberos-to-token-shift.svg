<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO illustrative register (ADR-093 / ADR-095). Idea: authentication and
       encryption move UP the OSI stack — from the session layer (Kerberos,
       KDC-issued session keys) to the application layer (signed/encrypted
       application tokens, JWS/JWE over OAuth/OIDC). Anchored in ADR-068.
       Palette: navy #0D1B2E · teal #1E8C8C · teal_tint #D7F2EE · ice #EAF1FB
       · grey #5A5A5A · muted #6B7A8D · red #C0392B (loss/binding). White bg. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <radialGradient id="glow-active" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#D7F2EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D7F2EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lift" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B7A8D"/>
      <stop offset="100%" stop-color="#1E8C8C"/>
    </linearGradient>
    <marker id="arr-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- ===== Title ===== -->
  <text x="64" y="64" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="27" fill="#0D1B2E">The shift up the OSI stack: Kerberos to application-token encryption</text>
  <text x="64" y="98" font-size="16" fill="#6B7A8D">Authentication and encryption move from the session layer to the application layer — a self-contained signed token replaces the session-bound ticket.</text>

  <!-- layer-number rail labels: L7 (top) down to L1 (bottom) -->
  <!-- y centres: L7 203 · L6 263 · L5 323 · L4 383 · L3 443 · L2 503 · L1 563 -->

  <!-- ============================================================= -->
  <!-- LEFT TOWER — Kerberos era. Active band at L5 (Session).        -->
  <!-- ============================================================= -->
  <text x="330" y="150" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#5A5A5A">Kerberos era</text>

  <!-- glow behind the active session band -->
  <ellipse cx="330" cy="323" rx="250" ry="64" fill="url(#glow-active)"/>

  <!-- L7 Application -->
  <rect x="150" y="176" width="360" height="54" rx="8" fill="#0D1B2E"/>
  <text x="330" y="208" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">7 · Application</text>
  <!-- L6 Presentation -->
  <rect x="150" y="236" width="360" height="54" rx="8" fill="#0D1B2E"/>
  <text x="330" y="268" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">6 · Presentation</text>
  <!-- L5 Session — ACTIVE -->
  <rect x="150" y="296" width="360" height="54" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="3"/>
  <text x="330" y="320" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">5 · Session</text>
  <text x="330" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8C8C">Kerberos tickets · KDC-issued session keys</text>
  <!-- L4 Transport -->
  <rect x="150" y="356" width="360" height="54" rx="8" fill="#0D1B2E"/>
  <text x="330" y="388" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">4 · Transport</text>
  <!-- L3 Network -->
  <rect x="150" y="416" width="360" height="54" rx="8" fill="#0D1B2E"/>
  <text x="330" y="448" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">3 · Network</text>
  <!-- L2 Data Link -->
  <rect x="150" y="476" width="360" height="54" rx="8" fill="#0D1B2E"/>
  <text x="330" y="508" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">2 · Data Link</text>
  <!-- L1 Physical -->
  <rect x="150" y="536" width="360" height="54" rx="8" fill="#0D1B2E"/>
  <text x="330" y="568" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">1 · Physical</text>

  <!-- left binding tag -->
  <text x="330" y="618" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">Trust bound to the session + network</text>
  <text x="330" y="638" text-anchor="middle" font-size="13" fill="#6B7A8D">the KDC must be reachable; tickets break across distance, proxies, NAT</text>

  <!-- ============================================================= -->
  <!-- RIGHT TOWER — Application-token era. Active band at L7.         -->
  <!-- ============================================================= -->
  <text x="950" y="150" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#0D1B2E">Application-token era</text>

  <!-- glow behind the active application band -->
  <ellipse cx="950" cy="203" rx="250" ry="64" fill="url(#glow-active)"/>

  <!-- L7 Application — ACTIVE -->
  <rect x="770" y="176" width="360" height="54" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="3"/>
  <text x="950" y="200" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">7 · Application</text>
  <text x="950" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8C8C">Signed + encrypted token (JWS / JWE) · OAuth / OIDC</text>
  <!-- L6 Presentation -->
  <rect x="770" y="236" width="360" height="54" rx="8" fill="#0D1B2E"/>
  <text x="950" y="268" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">6 · Presentation</text>
  <!-- L5 Session -->
  <rect x="770" y="296" width="360" height="54" rx="8" fill="#0D1B2E"/>
  <text x="950" y="328" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">5 · Session</text>
  <!-- L4 Transport -->
  <rect x="770" y="356" width="360" height="54" rx="8" fill="#0D1B2E"/>
  <text x="950" y="388" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">4 · Transport</text>
  <!-- L3 Network -->
  <rect x="770" y="416" width="360" height="54" rx="8" fill="#0D1B2E"/>
  <text x="950" y="448" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">3 · Network</text>
  <!-- L2 Data Link -->
  <rect x="770" y="476" width="360" height="54" rx="8" fill="#0D1B2E"/>
  <text x="950" y="508" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">2 · Data Link</text>
  <!-- L1 Physical -->
  <rect x="770" y="536" width="360" height="54" rx="8" fill="#0D1B2E"/>
  <text x="950" y="568" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">1 · Physical</text>

  <!-- right binding tag -->
  <text x="950" y="618" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8C8C">Trust carried in the payload</text>
  <text x="950" y="638" text-anchor="middle" font-size="13" fill="#6B7A8D">transport-agnostic; verified by signature with no KDC round-trip</text>

  <!-- ============================================================= -->
  <!-- CENTRE — the lift: encryption & trust move UP the stack.       -->
  <!-- from left L5 (323) sweeping up to right L7 (203).              -->
  <!-- ============================================================= -->
  <path d="M 520,318 C 610,300 650,225 760,206" fill="none" stroke="url(#lift)" stroke-width="6" stroke-linecap="round" marker-end="url(#arr-up)"/>
  <text x="640" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E8C8C">encryption &amp; trust</text>
  <text x="640" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E8C8C">move up the stack</text>

  <!-- ===== Caption ===== -->
  <text x="640" y="694" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#0D1B2E">Kerberos binds trust to the session. The token carries its own proof at the application layer.</text>
</svg>
