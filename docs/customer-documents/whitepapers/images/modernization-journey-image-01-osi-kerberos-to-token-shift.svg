<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO illustrative register (ADR-093 / ADR-095). Scene metaphor: the OSI
       stack as a stratified column — heavy navy bedrock at the bottom (physical
       / data-link / network / transport) lightening into open sky at the top.
       Kerberos sits low, at the Session layer: a gate and key chained down to a
       KDC tower on the ground (trust bound to the network). The application
       token has risen free into the sky at the Application layer: a glowing,
       sealed, signed capsule that carries its own proof. A beam of trust
       ascends the stack between them. Anchored in ADR-068.
       Palette: navy #0D1B2E · navy_mid #1E3A66 · teal #1E8C8C · teal_tint
       #D7F2EE · ice #EAF1FB · grey #5A5A5A · muted #6B7A8D · red #C0392B
       (the tether — trust bound to the ground). White background. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <!-- the stack: bedrock (bottom) rising into sky (top) -->
    <linearGradient id="strata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF1FB"/>
      <stop offset="0.5" stop-color="#1E3A66"/>
      <stop offset="1" stop-color="#0D1B2E"/>
    </linearGradient>
    <!-- soft sky wash behind the risen token -->
    <radialGradient id="skyGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D7F2EE" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- ascending beam of trust -->
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1E8C8C" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#1E8C8C" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="tokenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D7F2EE" stop-opacity="1"/>
      <stop offset="1" stop-color="#D7F2EE" stop-opacity="0"/>
    </radialGradient>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,10 L5,0 L10,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- ===== Title ===== -->
  <text x="64" y="62" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="29" fill="#0D1B2E">Encryption rises up the OSI stack</text>
  <text x="64" y="92" font-size="15" fill="#6B7A8D">Trust rises from the session layer to the top of the stack.</text>

  <!-- ===== Sky wash behind the risen token ===== -->
  <ellipse cx="540" cy="120" rx="360" ry="150" fill="url(#skyGlow)"/>

  <!-- ===== The OSI stack — a stratified column ===== -->
  <!-- band centres: L7 186 · L6 258 · L5 330 · L4 402 · L3 474 · L2 546 · L1 618 -->
  <rect x="360" y="150" width="340" height="504" rx="6" fill="url(#strata)"/>
  <!-- strata separators -->
  <g stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5">
    <line x1="360" y1="222" x2="700" y2="222"/>
    <line x1="360" y1="294" x2="700" y2="294"/>
    <line x1="360" y1="366" x2="700" y2="366"/>
    <line x1="360" y1="438" x2="700" y2="438"/>
    <line x1="360" y1="510" x2="700" y2="510"/>
    <line x1="360" y1="582" x2="700" y2="582"/>
  </g>
  <!-- layer labels (light bands → navy text; dark bands → white text) -->
  <text x="376" y="191" font-size="14" font-weight="bold" fill="#0D1B2E">7 · Application</text>
  <text x="376" y="263" font-size="14" font-weight="bold" fill="#0D1B2E">6 · Presentation</text>
  <text x="376" y="335" font-size="14" font-weight="bold" fill="#13294B">5 · Session</text>
  <text x="376" y="407" font-size="14" font-weight="bold" fill="#FFFFFF">4 · Transport</text>
  <text x="376" y="479" font-size="14" font-weight="bold" fill="#FFFFFF">3 · Network</text>
  <text x="376" y="551" font-size="14" font-weight="bold" fill="#FFFFFF">2 · Data Link</text>
  <text x="376" y="623" font-size="14" font-weight="bold" fill="#FFFFFF">1 · Physical</text>

  <!-- ===== Ascending beam of trust: Session (L5) up to Application (L7) ===== -->
  <!-- a shaft that widens as it rises out of the gate, into the sky -->
  <path d="M512,330 L568,330 L612,150 L468,150 Z" fill="url(#beam)"/>
  <line x1="540" y1="326" x2="540" y2="158" stroke="#1E8C8C" stroke-width="3" stroke-opacity="0.85" marker-end="url(#up)"/>

  <!-- ===== KDC tower on the ground (left) ===== -->
  <ellipse cx="190" cy="654" rx="92" ry="16" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.2"/>
  <rect x="150" y="520" width="80" height="134" fill="#1E3A66"/>
  <rect x="150" y="510" width="14" height="14" fill="#0D1B2E"/>
  <rect x="173" y="510" width="14" height="14" fill="#0D1B2E"/>
  <rect x="196" y="510" width="14" height="14" fill="#0D1B2E"/>
  <rect x="219" y="510" width="11" height="14" fill="#0D1B2E"/>
  <rect x="178" y="556" width="24" height="40" rx="12" fill="#0D1B2E"/>
  <text x="190" y="688" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">KDC</text>

  <!-- red tether: the key is chained back to the KDC (bound to the ground) -->
  <path d="M230,540 C330,520 400,360 472,338" fill="none" stroke="#C0392B" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>

  <!-- ===== Kerberos gate + key, embedded at the Session band (L5) ===== -->
  <path d="M486,358 L486,318 Q486,300 504,300 Q522,300 522,318 L522,358 Z" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <line x1="504" y1="300" x2="504" y2="358" stroke="#0D1B2E" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- key glyph, chained (red) to the tether -->
  <circle cx="472" cy="336" r="9" fill="none" stroke="#C0392B" stroke-width="3"/>
  <line x1="480" y1="340" x2="498" y2="352" stroke="#C0392B" stroke-width="3"/>
  <line x1="492" y1="348" x2="498" y2="342" stroke="#C0392B" stroke-width="3"/>

  <!-- ===== The risen application token (top, in the sky) ===== -->
  <ellipse cx="540" cy="116" rx="120" ry="86" fill="url(#tokenGlow)"/>
  <!-- sealed capsule -->
  <rect x="462" y="86" width="156" height="64" rx="32" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2.5"/>
  <!-- wax-seal / signature badge -->
  <circle cx="500" cy="118" r="19" fill="#1E8C8C"/>
  <path d="M491,118 L498,126 L511,109" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="560" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">signed</text>
  <text x="560" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">+ sealed</text>

  <!-- ===== Right-side annotations ===== -->
  <!-- application-layer note (top) -->
  <text x="760" y="120" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#0D1B2E">Application token</text>
  <text x="760" y="148" font-size="14" fill="#33414F">Carries its own proof — a signed and</text>
  <text x="760" y="168" font-size="14" fill="#33414F">encrypted token (JWS / JWE) over</text>
  <text x="760" y="188" font-size="14" fill="#33414F">OAuth / OIDC. Transport-agnostic;</text>
  <text x="760" y="208" font-size="14" fill="#33414F">verified by signature, no round-trip.</text>

  <!-- session-layer note (mid) -->
  <text x="760" y="318" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#0D1B2E">Kerberos</text>
  <text x="760" y="346" font-size="14" fill="#33414F">Session keys issued by — and tethered</text>
  <text x="760" y="366" font-size="14" fill="#33414F">to — the KDC. Trust is bound to the</text>
  <text x="760" y="386" font-size="14" fill="#33414F">network: the authority must be reachable.</text>

  <!-- ===== Caption ===== -->
  <text x="640" y="700" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#0D1B2E">Trust leaves the ground: from session keys chained to the KDC to a token that carries its own proof.</text>
</svg>
