<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO illustrative register (ADR-093 / ADR-095). Cover-style scene, not a
       labelled diagram. The vertical axis IS the OSI stack: dark bedrock at the
       bottom (physical / data-link / network) brightening into open sky at the
       top (application). A diagonal beam of trust climbs from a key CHAINED
       down to the KDC at the session layer (L5) up to a radiant, sealed
       token-beacon in the light at the application layer (L7). Layers are read
       from drifting mist and a slim right-edge ruler, never from boxes.
       Anchored in ADR-068.
       Palette: navy #0D1B2E · navy_mid #1E3A66 · teal #1E8C8C · teal_tint
       #D7F2EE · ice #EAF1FB · muted #6B7A8D · red #C0392B (the chain — trust
       bound below). White background (frame margin). -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF1FB"/>
      <stop offset="0.16" stop-color="#CFE0F2"/>
      <stop offset="0.36" stop-color="#6E89AE"/>
      <stop offset="0.58" stop-color="#2E4B6B"/>
      <stop offset="0.80" stop-color="#15243E"/>
      <stop offset="1" stop-color="#0A1422"/>
    </linearGradient>
    <linearGradient id="trust" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1E8C8C" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#3FB8A6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#D7F2EE" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="beacon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#D7F2EE" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#D7F2EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1E8C8C" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1E8C8C" stop-opacity="0"/>
    </radialGradient>
    <marker id="climb" viewBox="0 0 10 10" refX="5" refY="3" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,10 L5,0 L10,10 z" fill="#EAF1FB"/>
    </marker>
  </defs>

  <!-- framed scene (white margin keeps the background white) -->
  <rect x="20" y="20" width="1240" height="680" rx="20" fill="url(#sky)"/>

  <!-- drifting layer mist (the OSI strata, read not labelled) -->
  <g stroke-linecap="round" fill="none">
    <path d="M60,150 Q420,134 760,150 T1150,150" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
    <path d="M60,235 Q440,250 800,233 T1150,235" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
    <path d="M60,320 Q420,304 780,320 T1150,320" stroke="#D7F2EE" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M60,405 Q440,420 800,403 T1150,405" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M60,490 Q420,476 780,490 T1150,490" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
    <path d="M60,575 Q440,588 800,574 T1150,575" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  </g>

  <!-- right-edge OSI ruler: L1 (bottom) to L7 (top) -->
  <line x1="1188" y1="110" x2="1188" y2="620" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="1.5"/>
  <g font-size="12" font-weight="bold">
    <line x1="1182" y1="110" x2="1194" y2="110" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="1176" y="114" text-anchor="end" fill="#0D1B2E">L7 Application</text>
    <line x1="1182" y1="195" x2="1194" y2="195" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="1176" y="199" text-anchor="end" fill="#13294B">L6 Presentation</text>
    <line x1="1182" y1="280" x2="1194" y2="280" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="1176" y="284" text-anchor="end" fill="#EAF1FB">L5 Session</text>
    <line x1="1182" y1="365" x2="1194" y2="365" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="1176" y="369" text-anchor="end" fill="#EAF1FB" fill-opacity="0.85">L4 Transport</text>
    <line x1="1182" y1="450" x2="1194" y2="450" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="1176" y="454" text-anchor="end" fill="#EAF1FB" fill-opacity="0.85">L3 Network</text>
    <line x1="1182" y1="535" x2="1194" y2="535" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="1176" y="539" text-anchor="end" fill="#EAF1FB" fill-opacity="0.85">L2 Data Link</text>
    <line x1="1182" y1="620" x2="1194" y2="620" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="1176" y="624" text-anchor="end" fill="#EAF1FB" fill-opacity="0.85">L1 Physical</text>
  </g>
  <circle cx="1188" cy="110" r="4.5" fill="#1E8C8C"/>
  <circle cx="1188" cy="280" r="4.5" fill="#C0392B"/>

  <!-- ===== The trust beam climbing from the session key (L5) to the beacon (L7) ===== -->
  <path d="M560,288 C690,250 770,205 884,162" fill="none" stroke="url(#trust)" stroke-width="26" stroke-linecap="round"/>
  <path d="M560,288 C690,250 770,205 884,162" fill="none" stroke="#EAF1FB" stroke-width="3.5" stroke-opacity="0.9" marker-end="url(#climb)"/>
  <!-- ascending sparks (a sense of motion up the stack) -->
  <circle cx="612" cy="268" r="4.5" fill="#EAF1FB" fill-opacity="0.9"/>
  <circle cx="676" cy="240" r="3.5" fill="#EAF1FB" fill-opacity="0.85"/>
  <circle cx="744" cy="212" r="5" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="812" cy="186" r="3" fill="#EAF1FB" fill-opacity="0.8"/>
  <circle cx="858" cy="172" r="2.5" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="640" cy="300" r="2.5" fill="#D7F2EE" fill-opacity="0.7"/>
  <circle cx="708" cy="270" r="2" fill="#D7F2EE" fill-opacity="0.7"/>

  <!-- ===== KDC monolith, deep in the lower layers ===== -->
  <rect x="266" y="486" width="96" height="120" fill="#0A1422" stroke="#2E4B6B" stroke-width="1.5"/>
  <rect x="266" y="478" width="14" height="12" fill="#0A1422"/>
  <rect x="287" y="478" width="14" height="12" fill="#0A1422"/>
  <rect x="308" y="478" width="14" height="12" fill="#0A1422"/>
  <rect x="329" y="478" width="14" height="12" fill="#0A1422"/>
  <rect x="350" y="478" width="12" height="12" fill="#0A1422"/>
  <circle cx="314" cy="540" r="22" fill="url(#emberGlow)"/>
  <circle cx="314" cy="534" r="6" fill="#1E8C8C"/>
  <path d="M311,538 L317,538 L320,552 L308,552 Z" fill="#1E8C8C"/>
  <text x="314" y="630" text-anchor="middle" font-size="13" font-weight="bold" fill="#EAF1FB">KDC</text>

  <!-- red chain: the session key is bound back down to the KDC -->
  <path d="M544,294 C470,360 392,452 322,492" fill="none" stroke="#C0392B" stroke-width="5" stroke-linecap="round" stroke-dasharray="1.5 10"/>

  <!-- ===== The session key (Kerberos) at L5 ===== -->
  <circle cx="544" cy="288" r="13" fill="none" stroke="#EAF1FB" stroke-width="4.5"/>
  <line x1="556" y1="282" x2="588" y2="262" stroke="#EAF1FB" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="580" y1="266" x2="586" y2="273" stroke="#EAF1FB" stroke-width="4" stroke-linecap="round"/>
  <line x1="588" y1="259" x2="594" y2="266" stroke="#EAF1FB" stroke-width="4" stroke-linecap="round"/>
  <circle cx="544" cy="288" r="4.5" fill="#C0392B"/>

  <!-- ===== a lone figure at the foot of the climb, looking up ===== -->
  <path d="M604,664 Q604,628 614,625 L626,625 Q636,628 636,664 Z" fill="#34527A"/>
  <circle cx="620" cy="612" r="12" fill="#34527A"/>
  <path d="M607,632 Q607,629 612,628" fill="none" stroke="#7E97B8" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== The application token — a sealed beacon at the top, in the light ===== -->
  <circle cx="900" cy="150" r="172" fill="url(#beacon)"/>
  <!-- sunburst rays -->
  <g stroke="#1E8C8C" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
    <line x1="964" y1="150" x2="1030" y2="150"/>
    <line x1="955" y1="182" x2="1013" y2="215"/>
    <line x1="932" y1="205" x2="965" y2="263"/>
    <line x1="845" y1="182" x2="787" y2="215"/>
    <line x1="868" y1="205" x2="835" y2="263"/>
    <line x1="836" y1="150" x2="770" y2="150"/>
    <line x1="845" y1="118" x2="787" y2="85"/>
    <line x1="868" y1="95"  x2="835" y2="42"/>
    <line x1="900" y1="86"  x2="900" y2="28"/>
    <line x1="932" y1="95"  x2="965" y2="42"/>
    <line x1="955" y1="118" x2="1013" y2="85"/>
  </g>
  <!-- wax-seal scalloped rim -->
  <g fill="#1E8C8C">
    <circle cx="900" cy="98" r="6"/><circle cx="926" cy="104" r="6"/><circle cx="945" cy="124" r="6"/>
    <circle cx="952" cy="150" r="6"/><circle cx="945" cy="176" r="6"/><circle cx="926" cy="196" r="6"/>
    <circle cx="900" cy="202" r="6"/><circle cx="874" cy="196" r="6"/><circle cx="855" cy="176" r="6"/>
    <circle cx="848" cy="150" r="6"/><circle cx="855" cy="124" r="6"/><circle cx="874" cy="104" r="6"/>
  </g>
  <circle cx="900" cy="150" r="50" fill="#1E8C8C"/>
  <circle cx="900" cy="150" r="42" fill="#FFFFFF"/>
  <!-- verified signature mark -->
  <path d="M879,151 L894,167 L923,131" fill="none" stroke="#1E8C8C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- sparkle accents -->
  <path d="M1006,96 l3,8 l8,3 l-8,3 l-3,8 l-3,-8 l-8,-3 l8,-3 z" fill="#FFFFFF" fill-opacity="0.9"/>
  <path d="M792,250 l2,6 l6,2 l-6,2 l-2,6 l-2,-6 l-6,-2 l6,-2 z" fill="#D7F2EE" fill-opacity="0.85"/>

  <!-- ===== Text ===== -->
  <text x="48" y="70" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="31" fill="#0D1B2E">Trust ascends the OSI stack</text>
  <text x="48" y="100" font-size="15" fill="#33414F">A key chained to the session layer; a sealed token risen free to the application layer.</text>

  <!-- Kerberos inline label + leader to the key -->
  <line x1="500" y1="312" x2="534" y2="296" stroke="#EAF1FB" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="496" y="318" text-anchor="end" font-size="14" font-weight="bold" fill="#EAF1FB">Kerberos</text>
  <text x="496" y="336" text-anchor="end" font-size="12" fill="#C0392B">bound to the network below</text>

  <!-- Application-token inline label -->
  <text x="900" y="312" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#EAF1FB">Application token</text>
  <text x="900" y="333" text-anchor="middle" font-size="13" fill="#D7F2EE">signed · sealed · self-carrying</text>

  <!-- caption -->
  <text x="630" y="682" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#EAF1FB">From a key bound below to a token sealed in the light.</text>
</svg>
