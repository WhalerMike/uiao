<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · amber #D4A017 (severity/escalation) · red #C0392B (loss) -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="60" y="72" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">Why this operation class is capped at L3</text>
  <text x="60" y="106" font-size="20" fill="#5A5A5A">Tenant-wide device-state and Conditional Access changes are high-blast-radius — one toggle touches every device.</text>

  <!-- baseline -->
  <line x1="60" y1="620" x2="1140" y2="620" stroke="#33414F" stroke-width="2"/>

  <!-- staircase steps (ascending L0..L4) -->
  <!-- L0 -->
  <rect x="70" y="480" width="200" height="140" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="170" y="540" text-anchor="middle" font-size="26" font-weight="bold" fill="#0D1B2E">L0</text>
  <text x="170" y="572" text-anchor="middle" font-size="17" font-weight="bold" fill="#33414F">Record</text>
  <text x="170" y="598" text-anchor="middle" font-size="13" fill="#6B7A8D">desired state in canon</text>
  <!-- L1 -->
  <rect x="270" y="420" width="200" height="200" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="370" y="480" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E8C8C">L1</text>
  <text x="370" y="512" text-anchor="middle" font-size="17" font-weight="bold" fill="#33414F">Observe</text>
  <text x="370" y="538" text-anchor="middle" font-size="13" fill="#6B7A8D">drift detected · read-only</text>
  <!-- L2 -->
  <rect x="470" y="360" width="200" height="260" fill="#1E8C8C"/>
  <text x="570" y="420" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">L2</text>
  <text x="570" y="452" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Advise</text>
  <text x="570" y="478" text-anchor="middle" font-size="13" fill="#D7F2EE">report-only CA change-set</text>
  <!-- L3 (emphasized navy) -->
  <rect x="670" y="300" width="200" height="320" fill="#0D1B2E"/>
  <text x="770" y="360" text-anchor="middle" font-size="28" font-weight="bold" fill="#FFFFFF">L3</text>
  <text x="770" y="394" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Gated actuation</text>
  <text x="770" y="420" text-anchor="middle" font-size="13" fill="#EAF1FB">a human approves each wave</text>
  <text x="770" y="446" text-anchor="middle" font-size="13" fill="#EAF1FB">UIAO then writes via the API</text>
  <!-- L4 (faded, locked, pokes above ceiling) -->
  <rect x="870" y="240" width="200" height="380" fill="#F2F4F7" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="970" y="300" text-anchor="middle" font-size="26" font-weight="bold" fill="#6B7A8D">L4</text>
  <text x="970" y="332" text-anchor="middle" font-size="17" font-weight="bold" fill="#6B7A8D">Autonomous</text>
  <!-- lock glyph on L4 -->
  <rect x="938" y="356" width="64" height="50" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <path d="M952 356 v-12 a18 18 0 0 1 36 0 v12" fill="none" stroke="#C0392B" stroke-width="4"/>
  <circle cx="970" cy="381" r="6" fill="#C0392B"/>
  <text x="970" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#C0392B">not permitted</text>
  <text x="970" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#C0392B">for this class</text>

  <!-- federal ceiling line (amber = escalation) at top of L3 -->
  <line x1="660" y1="300" x2="1150" y2="300" stroke="#D4A017" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="660" y="266" width="360" height="28" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="672" y="286" font-size="16" font-weight="bold" fill="#0D1B2E">FEDERAL DEFAULT CEILING = L3</text>

  <!-- explanatory callout -->
  <rect x="1090" y="360" width="150" height="0" />
  <rect x="60" y="150" width="560" height="120" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="80" y="184" font-size="17" font-weight="bold" fill="#C0392B">High blast radius → permanently L3-capped</text>
  <text x="80" y="214" font-size="15" fill="#33414F">A tenant-wide device-state or CA enforcement change is the</text>
  <text x="80" y="238" font-size="15" fill="#33414F">textbook case the ceiling exists for: one wrong toggle</text>
  <text x="80" y="262" font-size="15" fill="#33414F">touches all 50,000 devices. It always routes to review.</text>

  <!-- halt note -->
  <text x="770" y="664" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7A8D">halt_on_critical: any P1 finding suspends autonomy.</text>
</svg>
