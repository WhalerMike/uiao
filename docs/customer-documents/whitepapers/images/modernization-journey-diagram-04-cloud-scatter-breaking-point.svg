<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · red #C0392B · grey #5A5A5A · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- three destination zones (upper area) -->
  <rect x="120" y="120" width="320" height="120" rx="28" fill="#5A5A5A"/>
  <text x="280" y="165" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Regional DC (Maryland)</text>
  <text x="280" y="194" text-anchor="middle" font-size="15" fill="#EAF1FB">12 AD Domains</text>
  <!-- kerberos token near regional DC -->
  <rect x="232" y="206" width="96" height="26" rx="6" fill="#0D1B2E"/>
  <text x="280" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Kerberos</text>
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#C0392B">bound to a session that no longer exists</text>

  <rect x="490" y="120" width="300" height="120" rx="28" fill="#1E8C8C"/>
  <text x="640" y="172" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Microsoft 365</text>
  <text x="640" y="200" text-anchor="middle" font-size="16" fill="#D7F2EE">Azure SQL</text>

  <rect x="840" y="120" width="300" height="120" rx="28" fill="#1E8C8C"/>
  <text x="990" y="186" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">AWS Workloads</text>

  <!-- field office bottom-left -->
  <rect x="80" y="470" width="200" height="120" rx="10" fill="#0D1B2E"/>
  <text x="180" y="522" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Field Office</text>
  <text x="180" y="550" text-anchor="middle" font-size="15" fill="#EAF1FB">(Portland)</text>

  <!-- three jagged broken red arrows from field office to each zone -->
  <g stroke="#C0392B" stroke-width="3" fill="none">
    <path d="M250 480 L300 380 L260 320 L300 244"/>
    <path d="M280 478 L470 400 L560 320 L620 244"/>
    <path d="M285 486 L700 470 L900 330 L980 244"/>
  </g>
  <text x="430" y="430" font-size="14" font-weight="bold" fill="#C0392B" transform="rotate(-12 430 430)">session contract shattered</text>

  <!-- bottom caption band (neutral; amber reserved) -->
  <rect x="60" y="624" width="1160" height="66" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="652" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">One request: authenticate in Maryland, query in Azure, run in AWS —</text>
  <text x="640" y="678" text-anchor="middle" font-size="17" fill="#33414F">across three vendors, three regions.</text>
</svg>
