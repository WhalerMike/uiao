<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · red #C0392B · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-grey3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <!-- endpoints -->
  <rect x="40" y="330" width="180" height="110" rx="10" fill="#0D1B2E"/>
  <text x="130" y="380" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Field Office</text>
  <text x="130" y="406" text-anchor="middle" font-size="15" fill="#EAF1FB">(Portland)</text>

  <rect x="1060" y="330" width="180" height="110" rx="10" fill="#0D1B2E"/>
  <text x="1150" y="380" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Regional DC</text>
  <text x="1150" y="406" text-anchor="middle" font-size="15" fill="#EAF1FB">(Maryland)</text>

  <!-- inline appliance stack -->
  <g font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <rect x="248" y="345" width="120" height="80" rx="8" fill="#5A5A5A"/><text x="308" y="390">F5 Proxy</text>
    <rect x="388" y="345" width="120" height="80" rx="8" fill="#5A5A5A"/><text x="448" y="383">IDS /</text><text x="448" y="402">IPS</text>
    <rect x="528" y="345" width="100" height="80" rx="8" fill="#5A5A5A"/><text x="578" y="390">NAT</text>
    <rect x="648" y="345" width="120" height="80" rx="8" fill="#5A5A5A"/><text x="708" y="390">Firewall</text>
    <rect x="788" y="345" width="100" height="80" rx="8" fill="#5A5A5A"/><text x="848" y="390">NAT</text>
    <rect x="908" y="345" width="120" height="80" rx="8" fill="#5A5A5A"/><text x="968" y="390">Firewall</text>
  </g>
  <!-- flow arrows through the stack -->
  <g stroke="#5A5A5A" stroke-width="3">
    <line x1="220" y1="385" x2="246" y2="385" marker-end="url(#arrow-grey3)"/>
    <line x1="1028" y1="385" x2="1058" y2="385" marker-end="url(#arrow-grey3)"/>
  </g>

  <!-- shattering Kerberos ticket above the stack -->
  <g>
    <rect x="470" y="150" width="120" height="64" rx="8" fill="#0D1B2E"/>
    <text x="530" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Kerberos</text>
    <text x="530" y="200" text-anchor="middle" font-size="13" fill="#EAF1FB">TGT</text>
    <!-- crack fragments -->
    <path d="M600 165 l40 -10 l-22 26 l34 6 l-30 22" fill="none" stroke="#C0392B" stroke-width="3"/>
    <path d="M612 196 l44 4 l-20 22" fill="none" stroke="#C0392B" stroke-width="3"/>
  </g>
  <text x="690" y="150" font-size="15" font-weight="bold" fill="#C0392B">decrypted, re-encrypted, NATted three times</text>
  <text x="690" y="174" font-size="16" font-weight="bold" fill="#C0392B">&#8594; session invalid</text>
  <line x1="640" y1="220" x2="708" y2="343" stroke="#C0392B" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- distance / latency scale below -->
  <rect x="40" y="500" width="1200" height="70" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="640" y="532" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Portland to Maryland: thousands of miles = latency is physics</text>
  <text x="640" y="556" text-anchor="middle" font-size="15" fill="#33414F">Active Directory expects sub-5ms round-trip.</text>

  <!-- bottom caption -->
  <text x="640" y="640" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#0D1B2E">Security tools built to break sessions — applied to a session-based architecture.</text>
</svg>
