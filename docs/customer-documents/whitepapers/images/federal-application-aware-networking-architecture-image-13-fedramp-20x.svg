<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="tl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0D1B2E"/>
    </marker>
  </defs>

  <text x="640" y="44" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="27" fill="#0D1B2E">FedRAMP 20x: a provider clock, not an agency deadline</text>
  <text x="640" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7A8D">The Consolidated Rules for 2026 obligate cloud service providers. The agency's own obligations are older, and already due.</text>
  <line x1="60" y1="88" x2="1220" y2="88" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ═══════════ UPPER BAND — the provider clock ═══════════ -->
  <rect x="60" y="106" width="1160" height="30" rx="5" fill="#1E3A66"/>
  <text x="640" y="127" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#FFFFFF">The provider clock — binds cloud service providers seeking or holding certification</text>

  <line x1="96" y1="196" x2="1200" y2="196" stroke="#0D1B2E" stroke-width="2.5" marker-end="url(#tl)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="150" cy="196" r="7" fill="#1E8C8C"/>
    <text x="150" y="172" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#0D1B2E">25 Jun 2026</text>
    <text x="150" y="222" text-anchor="middle" font-size="12.5" fill="#33414F">Consolidated Rules</text>
    <text x="150" y="239" text-anchor="middle" font-size="12.5" fill="#33414F">for 2026 published</text>
    <text x="150" y="256" text-anchor="middle" font-size="12" fill="#6B7A8D">10 KSI themes ·</text>
    <text x="150" y="272" text-anchor="middle" font-size="12" fill="#6B7A8D">46 indicators · JSON</text>

    <circle cx="376" cy="196" r="7" fill="#D4A017"/>
    <text x="376" y="172" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#0D1B2E">28 Jul 2026</text>
    <text x="376" y="222" text-anchor="middle" font-size="12.5" fill="#33414F">FedRAMP Ready</text>
    <text x="376" y="239" text-anchor="middle" font-size="12.5" fill="#33414F">pathway ceases</text>

    <circle cx="602" cy="196" r="7" fill="#2E75B6"/>
    <text x="602" y="172" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#0D1B2E">3 &amp; 31 Aug 2026</text>
    <text x="602" y="222" text-anchor="middle" font-size="12.5" fill="#33414F">Class A, then Class B</text>
    <text x="602" y="239" text-anchor="middle" font-size="12.5" fill="#33414F">and C pipelines open</text>

    <circle cx="852" cy="196" r="8" fill="#C0392B"/>
    <text x="852" y="172" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#C0392B">1 Jan 2027</text>
    <text x="852" y="222" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#C0392B">Rules mandatory for</text>
    <text x="852" y="239" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#C0392B">certified cloud</text>
    <text x="852" y="256" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#C0392B">service offerings</text>

    <circle cx="1108" cy="196" r="7" fill="#C0392B"/>
    <text x="1108" y="172" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#0D1B2E">11 Jun 2027</text>
    <text x="1108" y="222" text-anchor="middle" font-size="12.5" fill="#33414F">No new Rev5</text>
    <text x="1108" y="239" text-anchor="middle" font-size="12.5" fill="#33414F">certifications accepted</text>
  </g>

  <!-- ═══════════ LOWER BAND — the agency clock ═══════════ -->
  <rect x="60" y="308" width="1160" height="30" rx="5" fill="#C0392B"/>
  <text x="640" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#FFFFFF">The agency clock — binds the agency directly, and every date on it has already arrived</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="86" y="360" width="352" height="150" rx="7" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
    <text x="262" y="388" text-anchor="middle" font-weight="bold" font-size="16" fill="#0D1B2E">OMB M-22-09</text>
    <text x="262" y="410" text-anchor="middle" font-size="13" fill="#33414F">Federal zero-trust strategy.</text>
    <text x="262" y="430" text-anchor="middle" font-size="13" fill="#33414F">Phishing-resistant MFA, encrypted</text>
    <text x="262" y="450" text-anchor="middle" font-size="13" fill="#33414F">DNS and HTTP, application inventory.</text>
    <text x="262" y="478" text-anchor="middle" font-weight="bold" font-size="14" fill="#C0392B">Milestones due end of FY2024</text>
    <text x="262" y="498" text-anchor="middle" font-weight="bold" font-size="14" fill="#C0392B">— already passed</text>

    <rect x="464" y="360" width="352" height="150" rx="7" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
    <text x="640" y="388" text-anchor="middle" font-weight="bold" font-size="16" fill="#0D1B2E">CISA BOD 25-01</text>
    <text x="640" y="410" text-anchor="middle" font-size="13" fill="#33414F">Secure configuration baselines</text>
    <text x="640" y="430" text-anchor="middle" font-size="13" fill="#33414F">for Microsoft 365. The baseline set</text>
    <text x="640" y="450" text-anchor="middle" font-size="13" fill="#33414F">is revised by CISA, so it is living.</text>
    <text x="640" y="478" text-anchor="middle" font-weight="bold" font-size="14" fill="#C0392B">In force — the assessment</text>
    <text x="640" y="498" text-anchor="middle" font-weight="bold" font-size="14" fill="#C0392B">obligation is continuous</text>

    <rect x="842" y="360" width="352" height="150" rx="7" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.8"/>
    <text x="1018" y="388" text-anchor="middle" font-weight="bold" font-size="16" fill="#0D1B2E">SP 800-53 CA-7 · A-130</text>
    <text x="1018" y="410" text-anchor="middle" font-size="13" fill="#33414F">Continuous monitoring of every</text>
    <text x="1018" y="430" text-anchor="middle" font-size="13" fill="#33414F">system the agency has authorized,</text>
    <text x="1018" y="450" text-anchor="middle" font-size="13" fill="#33414F">inside each existing ATO.</text>
    <text x="1018" y="478" text-anchor="middle" font-weight="bold" font-size="14" fill="#C0392B">Ongoing — this is the</text>
    <text x="1018" y="498" text-anchor="middle" font-weight="bold" font-size="14" fill="#C0392B">obligation already carried</text>
  </g>

  <!-- ═══════════ Footer ═══════════ -->
  <rect x="86" y="536" width="1108" height="76" rx="6" fill="#0D1B2E"/>
  <text x="640" y="564" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">What the agency buys is governed by the top row. What the agency operates is governed by the bottom row.</text>
  <text x="640" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#D4A017">Only the bottom row is late.</text>

  <line x1="60" y1="638" x2="1220" y2="638" stroke="#E3E8EF" stroke-width="1"/>
  <text x="70" y="660" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#6B7A8D">Track the top row to know when a provider's evidence changes format. It is a procurement clock; it sets no deadline for the agency's own infrastructure.</text>
  <text x="70" y="684" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">Sources: FedRAMP Consolidated Rules for 2026 (v2026.06.24.01) · OMB M-22-09 · CISA BOD 25-01 · NIST SP 800-53 Rev 5 CA-7 · OMB Circular A-130</text>
</svg>
