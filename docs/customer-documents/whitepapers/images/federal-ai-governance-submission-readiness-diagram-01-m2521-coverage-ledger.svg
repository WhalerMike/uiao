  <text x="60" y="58" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#0D1B2E">M-25-21 Coverage Ledger — Deployed vs. Proposed</text>
  <text x="60" y="86" font-size="16" fill="#5A5A5A">Honest status per requirement · Active = deployed and exercised · Proposed = built, pending conformance · Reserved = slot allocated</text>

