  <text x="680" y="528" text-anchor="middle" font-size="13" fill="#0D1B2E">DRIFT-COMPLIANCE::ai-agentic-ungoverned</text>
  <rect x="970" y="508" width="180" height="32" rx="8" fill="#6B7A8D"/>
  <text x="1060" y="529" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Proposed</text>

