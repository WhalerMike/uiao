<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1400" height="900" fill="#FFFFFF"/>
  <text x="700" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1F3A5F">"SD-WAN vs. DIA" Is a Category Error — Pipe vs. Governor</text>
  <text x="700" y="74" text-anchor="middle" font-size="15" fill="#4A5A6A">One is infrastructure; the other is the regime that makes the infrastructure lawful at scale</text>

  <!-- TIC 3.0 gate (top) -->
  <rect x="90" y="100" width="1220" height="96" rx="10" fill="#1F3A5F"/>
  <text x="700" y="136" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">TIC 3.0 — THE POLICY GATE (OMB M-19-26)</text>
  <text x="700" y="162" text-anchor="middle" font-size="14.5" fill="#D7E1EA">Branch Office and Remote User use cases permit local egress without the TIC hairpin — and neither permits it ungoverned:</text>
  <text x="700" y="183" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">the security-capabilities catalog must be satisfied at the distributed policy enforcement point</text>

  <path d="M 700 196 L 700 226" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrowNavy)"/>
  <defs>
    <marker id="arrowNavy" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3A5F"/></marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1A9E8F"/></marker>
  </defs>

  <!-- Governor: SASE PEP layer -->
  <rect x="90" y="230" width="1220" height="130" rx="10" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="2.5"/>
  <rect x="90" y="230" width="1220" height="40" rx="10" fill="#1A9E8F"/>
  <rect x="90" y="252" width="1220" height="18" fill="#1A9E8F"/>
  <text x="700" y="257" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">THE GOVERNOR, LAYER 7 — SASE SSE: THE DISTRIBUTED PEP</text>
  <g font-size="13.5" fill="#333">
    <rect x="116" y="286" width="380" height="56" rx="7" fill="#EAF6F4"/>
    <text x="306" y="310" text-anchor="middle" font-weight="700" fill="#0E5C5C">SWG / FWaaS — SC-7, SI-3</text>
    <text x="306" y="330" text-anchor="middle">Boundary protection · inline SSL inspection</text>
    <rect x="512" y="286" width="380" height="56" rx="7" fill="#EAF6F4"/>
    <text x="702" y="310" text-anchor="middle" font-weight="700" fill="#0E5C5C">CASB — AC-4</text>
    <text x="702" y="330" text-anchor="middle">App, tenant, data type, action per session</text>
    <rect x="908" y="286" width="380" height="56" rx="7" fill="#EAF6F4"/>
    <text x="1098" y="310" text-anchor="middle" font-weight="700" fill="#0E5C5C">ZTNA + per-session records — CA-7</text>
    <text x="1098" y="330" text-anchor="middle">Identity, posture, access — machine-readable</text>
  </g>

  <path d="M 700 360 L 700 390" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arrowTeal)"/>

  <!-- Governor: SD-WAN overlay layer -->
  <rect x="90" y="394" width="1220" height="196" rx="10" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="2.5"/>
  <rect x="90" y="394" width="1220" height="40" rx="10" fill="#1A9E8F"/>
  <rect x="90" y="416" width="1220" height="18" fill="#1A9E8F"/>
  <text x="700" y="421" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">THE GOVERNOR, LAYER 3 — SD-WAN OVERLAY: THE CONTROL SURFACE ON THE PIPE</text>
  <g font-size="13.5" fill="#333">
    <rect x="116" y="450" width="380" height="56" rx="7" fill="#EAF6F4"/>
    <text x="306" y="474" text-anchor="middle" font-weight="700" fill="#0E5C5C">IPsec overlay — SC-8 / SC-8(1)</text>
    <text x="306" y="494" text-anchor="middle">Circuit-wide encryption, every flow at once</text>
    <rect x="512" y="450" width="380" height="56" rx="7" fill="#EAF6F4"/>
    <text x="702" y="474" text-anchor="middle" font-weight="700" fill="#0E5C5C">Traffic classes — SC-5</text>
    <text x="702" y="494" text-anchor="middle">Per-class path policy; lean/fat separation</text>
    <rect x="908" y="450" width="380" height="56" rx="7" fill="#EAF6F4"/>
    <text x="1098" y="474" text-anchor="middle" font-weight="700" fill="#0E5C5C">DPI + steering log — SI-4, AU-12</text>
    <text x="1098" y="494" text-anchor="middle">App per flow; every path decision logged</text>
    <rect x="116" y="518" width="1172" height="52" rx="7" fill="#F4F7FA"/>
    <text x="702" y="540" text-anchor="middle" font-weight="700" fill="#1F3A5F">Active-active multipath across every transport — fiber DIA · MPLS · 5G · LEO</text>
    <text x="702" y="560" text-anchor="middle">Fast path-failure absorption (BFD + FEC on protected classes) · asymmetric routing removed for overlay-carried flows · attested M365 Optimize split</text>
  </g>

  <path d="M 700 590 L 700 620" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <text x="726" y="612" font-size="13" fill="#4A5A6A">governs</text>

  <!-- The pipe -->
  <rect x="90" y="624" width="1220" height="110" rx="55" fill="#FFFFFF" stroke="#C0392B" stroke-width="3"/>
  <text x="700" y="666" text-anchor="middle" font-size="19" font-weight="700" fill="#C0392B">THE PIPE — DIA (fiber · MPLS · LEO · 5G · one day 6G)</text>
  <text x="700" y="694" text-anchor="middle" font-size="14.5" fill="#333">Solves exactly one thing: the geographic hairpin (ITU-T G.114's 150 ms budget is physics; local breakout is the only fix)</text>
  <text x="700" y="718" text-anchor="middle" font-size="14.5" font-weight="700" fill="#C0392B">Satisfies no protection control — bare, the egress sits outside the assessed boundary; diversity across pipes closes CP-8</text>

  <!-- Bottom banner -->
  <rect x="90" y="762" width="1220" height="76" rx="10" fill="#1F3A5F"/>
  <text x="700" y="794" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Physics buys the pipe · the overlay buys the controls · TIC 3.0 is why you may not stop at the pipe</text>
  <text x="700" y="820" text-anchor="middle" font-size="14" fill="#D7E1EA">Closures anchored in OrgComp Vol I Book 07 (enforcement substrate), applied by Vol I Books 05–06; doctrine and counter-sources in Vol 0 Book 00</text>

  <text x="700" y="874" text-anchor="middle" font-size="12" fill="#8A97A3">Source: SD-WAN vs. DIA Under TIC 3.0 whitepaper · Date Code 2026-07-29</text>
</svg>
