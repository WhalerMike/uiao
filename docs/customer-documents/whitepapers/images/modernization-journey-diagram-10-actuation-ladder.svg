<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · amber #D4A017 (escalation) · red #C0392B (loss) -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="60" y="74" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">The actuation maturity ladder</text>
  <text x="60" y="106" font-size="19" fill="#5A5A5A">How far the reconciliation loop closes without a human — explicit, and accreditable per operation class.</text>

  <line x1="60" y1="624" x2="1160" y2="624" stroke="#33414F" stroke-width="2"/>

  <!-- ascending steps -->
  <rect x="70" y="484" width="200" height="140" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="170" y="544" text-anchor="middle" font-size="26" font-weight="bold" fill="#0D1B2E">L0</text>
  <text x="170" y="576" text-anchor="middle" font-size="17" font-weight="bold" fill="#33414F">Record</text>
  <text x="170" y="600" text-anchor="middle" font-size="12" fill="#6B7A8D">desired state in canon</text>

  <rect x="270" y="424" width="200" height="200" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="370" y="484" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E8C8C">L1</text>
  <text x="370" y="516" text-anchor="middle" font-size="17" font-weight="bold" fill="#33414F">Observe</text>
  <text x="370" y="540" text-anchor="middle" font-size="12" fill="#6B7A8D">drift detected · read-only</text>

  <rect x="470" y="364" width="200" height="260" fill="#1E8C8C"/>
  <text x="570" y="424" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">L2</text>
  <text x="570" y="456" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Advise</text>
  <text x="570" y="480" text-anchor="middle" font-size="12" fill="#D7F2EE">change-set surfaced</text>

  <rect x="670" y="304" width="200" height="320" fill="#0D1B2E"/>
  <text x="770" y="364" text-anchor="middle" font-size="28" font-weight="bold" fill="#FFFFFF">L3</text>
  <text x="770" y="396" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Gated actuation</text>
  <text x="770" y="420" text-anchor="middle" font-size="12" fill="#EAF1FB">a human approves</text>
  <text x="770" y="438" text-anchor="middle" font-size="12" fill="#EAF1FB">dry-run by default</text>

  <rect x="870" y="244" width="200" height="380" fill="#F2F4F7" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="970" y="356" text-anchor="middle" font-size="26" font-weight="bold" fill="#6B7A8D">L4</text>
  <text x="970" y="386" text-anchor="middle" font-size="17" font-weight="bold" fill="#6B7A8D">Autonomous</text>
  <!-- lock on L4 -->
  <rect x="938" y="412" width="64" height="50" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <path d="M952 412 v-12 a18 18 0 0 1 36 0 v12" fill="none" stroke="#C0392B" stroke-width="4"/>
  <circle cx="970" cy="437" r="6" fill="#C0392B"/>
  <text x="970" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#C0392B">high-blast-radius</text>
  <text x="970" y="509" text-anchor="middle" font-size="12" font-weight="bold" fill="#C0392B">classes are L3-capped</text>

  <!-- federal ceiling line (amber escalation) at top of L3 -->
  <line x1="660" y1="304" x2="1150" y2="304" stroke="#D4A017" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="660" y="270" width="380" height="28" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="672" y="290" font-size="16" font-weight="bold" fill="#0D1B2E">FEDERAL DEFAULT CEILING = L3</text>

  <!-- explanatory callout -->
  <rect x="60" y="150" width="560" height="110" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="80" y="184" font-size="16" font-weight="bold" fill="#C0392B">L4 is earned, never default</text>
  <text x="80" y="212" font-size="14" fill="#33414F">Tenant-wide role assignment and NAC VLAN changes — where</text>
  <text x="80" y="234" font-size="14" fill="#33414F">one wrong move touches thousands of objects — stay L3-capped</text>
  <text x="80" y="256" font-size="14" fill="#33414F">permanently and always route to governance review.</text>

  <text x="770" y="660" text-anchor="middle" font-size="14" font-style="italic" fill="#6B7A8D">halt_on_critical: any P1 finding suspends autonomy.</text>
</svg>
