# SSOT for every external legal/regulatory source cited by the federal
# cybersecurity legal-stack chart — index-diagram-01-federal-cybersecurity-legal-stack.svg
# (index.html) and its docs-site sibling
# federal-compliance-for-moderate-agencies-diagram-01-federal-cybersecurity-legal-stack.svg
# (federal-compliance-for-moderate-agencies.qmd) — plus the whitepaper prose
# around it.
#
# Mirrors the freshness-tracking pattern in
# docs/customer-documents/orgcomp-series/orgcomp-authority-deadlines.yml, scoped
# down to just this chart: live-fetching government sources in CI is not
# reliable (bot-walls, redirects, geo/UA gating — see .lycheeignore for
# fedramp.gov/learn.microsoft.com precedent), so this registry does not fetch
# pages. What it automates is making SKIPPED verification visible — a human or
# agent re-checks each `source` against the live page and bumps
# `last_verified`; the diagram/prose are edited by hand, never rewritten
# automatically. See ADR-093 (SVG is the committed source of truth) and the
# no-hallucination protocol in src/uiao/canon/compliance/executive-orders.md
# for the same principle applied to EO tracking.
#
# ENFORCEMENT: scripts/check_legal_stack_freshness.py
#   last_verified older than --max-age days (default 90 — these are statutes
#   and standing directives, not fast-moving pipeline-opening dates like the
#   AAN registry above, so a shorter window would just be noise) fails in
#   --strict-fresh mode. .github/workflows/legal-stack-authority-freshness.yml
#   runs that mode weekly.
version: "1.0"
sources:
  - id: fisma-2014
    title: "FISMA — Federal Information Security Modernization Act of 2014"
    citation: "44 U.S.C. § 3551 et seq."
    claim: "Requires every federal agency to implement a risk-based information security program; authorizes NIST to develop the implementing standards (SP 800-53, SP 800-37)."
    source: https://www.law.cornell.edu/uscode/text/44/3551
    last_verified: 2026-08-10

  - id: cisa-bod-statutory-authority
    title: "CISA Binding Operational Directive statutory authority"
    citation: "44 U.S.C. § 3553(b)(2)"
    claim: "Authorizes the DHS Secretary, delegated to the CISA Director, to issue binding operational directives to FCEB agencies — the basis for BOD 25-01 and its siblings."
    source: https://www.law.cornell.edu/uscode/text/44/3553
    last_verified: 2026-08-10

  - id: fedramp-authorization-act
    title: "FedRAMP Authorization Act"
    citation: "44 U.S.C. § 3607 (FY23 NDAA, Pub. L. 117-263, Dec 23 2022)"
    claim: "Codifies FedRAMP; binds the CSP seeking/keeping authorization; requires agencies to honor reciprocity of an existing FedRAMP authorization."
    source: https://www.fedramp.gov/2026-01-13-realizing-the-fedramp-authorization-act/
    last_verified: 2026-08-10

  - id: nist-sp-800-53-rev5
    title: "NIST SP 800-53 Rev. 5 — Security and Privacy Controls for Information Systems and Organizations"
    citation: "NIST SP 800-53 Rev. 5"
    claim: "The control catalog FISMA delegates NIST to publish; the FedRAMP Moderate/High baselines and agencies' own ATOs are built on it."
    source: https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
    last_verified: 2026-08-10

  - id: nist-sp-800-37-rev2-rmf
    title: "NIST SP 800-37 Rev. 2 — Risk Management Framework"
    citation: "NIST SP 800-37 Rev. 2"
    claim: "The seven-step RMF agencies use to categorize, select, implement, assess, and authorize (ATO) their own systems — the agency-side analog of a CSP's FedRAMP authorization."
    source: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-37r2.pdf
    last_verified: 2026-08-10

  - id: bod-25-01
    title: "BOD 25-01 — Implementing Secure Practices for Cloud Services"
    citation: "BOD 25-01 (issued Dec 17, 2024)"
    claim: "Names CISA SCuBA / ScubaGear (M365) and ScubaGoggles (Workspace) as the required assessment mechanism for FCEB cloud tenants. Its dated obligations are also tracked separately in docs/customer-documents/orgcomp-series/orgcomp-authority-deadlines.yml#bod-25-01-mandatory-policies — that entry is the one to bump if a specific BOD 25-01 date changes; this entry covers the chart's framing of BOD 25-01 itself."
    source: https://www.cisa.gov/news-events/directives/bod-25-01-implementing-secure-practices-cloud-services
    last_verified: 2026-08-10

  - id: eo-cybersecurity-chain
    title: "Controlling cybersecurity Executive Order (EO 14028 → current EO 14306)"
    citation: "EO 14028 (May 2021); current controlling order EO 14306 (June 2025)"
    claim: "EO 14028 is foundational and explicitly preserved by later orders; EO 14306 is the current controlling cybersecurity EO the chart cites."
    # Not an external URL: the repo's own canon doc is the SSOT for which EO is
    # currently controlling, and it carries its own no-hallucination protocol
    # (any EO cited elsewhere must match its table or be added there first).
    # Re-verify EO currency there, not via a separate external fetch.
    source: src/uiao/canon/compliance/executive-orders.md
    last_verified: 2026-08-10
