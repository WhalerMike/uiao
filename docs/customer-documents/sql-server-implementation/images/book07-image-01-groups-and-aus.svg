<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="b7Teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="64" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Groups are classified before they become logins</text>
  <text x="64" y="106" font-size="17" fill="#6B7A8D">Export the group estate, classify each group by what it should govern, emit the group-login script, and bound it with the Conditional Access perimeter.</text>

  <!-- export -->
  <rect x="64" y="200" width="300" height="120" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="84" y="232" font-family="Consolas, monospace" font-size="13.5" fill="#0D1B2E">Export-UIAOEntraGroups</text>
  <text x="84" y="262" font-family="Arial" font-size="13" fill="#33414F">the group / membership estate</text>
  <text x="84" y="286" font-family="Arial" font-size="13" fill="#33414F">+ Export-UIAOConditionalAccess</text>
  <text x="84" y="308" font-family="Arial" font-size="12" fill="#1E8C8C">export · read-only</text>

  <line x1="366" y1="260" x2="422" y2="260" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b7Teal)"/>

  <!-- classify -->
  <rect x="426" y="200" width="320" height="120" rx="8" fill="#EAF1FB" stroke="#2E75B6" stroke-width="2"/>
  <text x="446" y="232" font-family="Consolas, monospace" font-size="13" fill="#0D1B2E">New-UIAOEntraGroup-</text>
  <text x="446" y="252" font-family="Consolas, monospace" font-size="13" fill="#0D1B2E">Classification</text>
  <text x="446" y="282" font-family="Arial" font-size="13" fill="#33414F">role-bearing → SQL login</text>
  <text x="446" y="304" font-family="Arial" font-size="13" fill="#6B7A8D">structural / stale → not a login</text>

  <line x1="748" y1="260" x2="804" y2="260" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b7Teal)"/>

  <!-- emit -->
  <rect x="808" y="200" width="408" height="120" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="828" y="232" font-family="Consolas, monospace" font-size="13.5" fill="#0D1B2E">New-UIAOGroupLoginScript</text>
  <text x="828" y="262" font-family="Consolas, monospace" font-size="12.5" fill="#33414F">CREATE LOGIN FROM EXTERNAL PROVIDER</text>
  <text x="828" y="286" font-family="Arial" font-size="13" fill="#33414F">one login per governing group</text>
  <text x="828" y="308" font-family="Arial" font-size="12" fill="#6B7A8D">emits a script — no -Execute surface</text>

  <!-- perimeter -->
  <rect x="180" y="392" width="920" height="160" rx="12" fill="none" stroke="#2E75B6" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="640" y="424" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#2E75B6">Conditional Access perimeter</text>

  <rect x="232" y="446" width="240" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="352" y="480" text-anchor="middle" font-size="15" fill="#33414F">group → SQL login</text>
  <text x="352" y="502" text-anchor="middle" font-size="13" fill="#6B7A8D">access by membership, not host</text>

  <rect x="520" y="446" width="240" height="80" rx="8" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="640" y="480" text-anchor="middle" font-size="15" fill="#33414F">administrative units</text>
  <text x="640" y="502" text-anchor="middle" font-size="13" fill="#6B7A8D">scoped delegation</text>

  <rect x="808" y="446" width="240" height="80" rx="8" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="928" y="480" text-anchor="middle" font-size="15" fill="#33414F">CA policy</text>
  <text x="928" y="502" text-anchor="middle" font-size="13" fill="#6B7A8D">device · MFA · network bound</text>

  <text x="640" y="676" text-anchor="middle" font-size="12" fill="#6B7A8D">Schematic — the group / access layer and its Conditional Access perimeter. Exports and the classifier are read-only / derive; named functions are shipped and Pester-tested.</text>
</svg>
