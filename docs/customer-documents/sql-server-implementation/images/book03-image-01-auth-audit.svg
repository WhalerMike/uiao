<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="b3Teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="64" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">The audit makes every authentication event visible</text>
  <text x="64" y="106" font-size="17" fill="#6B7A8D">Spec3-D1.8-Get-SQLServerAuthAudit reads the retained set and emits one classified row per login path — the evidence the migration is planned against.</text>

  <!-- input -->
  <rect x="64" y="240" width="220" height="120" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="174" y="288" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#0D1B2E">retained instances</text>
  <text x="174" y="316" text-anchor="middle" font-size="13" fill="#33414F">the Book 02 gate output</text>
  <text x="174" y="338" text-anchor="middle" font-size="12" fill="#6B7A8D">read-only — opens no writes</text>

  <line x1="286" y1="300" x2="354" y2="300" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b3Teal)"/>

  <!-- audit function -->
  <rect x="358" y="252" width="288" height="96" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="502" y="290" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">Spec3-D1.8-</text>
  <text x="502" y="312" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">Get-SQLServerAuthAudit</text>
  <text x="502" y="336" text-anchor="middle" font-size="12" fill="#6B7A8D">+ the Spec1-D1.4 / D1.5 family</text>

  <line x1="648" y1="300" x2="716" y2="300" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b3Teal)"/>

  <!-- classified output rows -->
  <text x="936" y="200" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#0D1B2E">one row per authentication path, classified</text>

  <rect x="720" y="220" width="496" height="58" rx="6" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="744" y="246" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#C0392B">NTLM fallback</text>
  <text x="744" y="268" font-size="13" fill="#33414F">the pattern Book 06 must eliminate</text>

  <rect x="720" y="288" width="496" height="58" rx="6" fill="#FFF6E0" stroke="#D4A017" stroke-width="1.5"/>
  <text x="744" y="314" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#0D1B2E">Kerberos / Windows Authentication</text>
  <text x="744" y="336" font-size="13" fill="#33414F">migrates to Entra in Books 04–05</text>

  <rect x="720" y="356" width="496" height="58" rx="6" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="744" y="382" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#0D1B2E">SQL Authentication</text>
  <text x="744" y="404" font-size="13" fill="#33414F">stored credentials — eliminated by Book 08</text>

  <text x="380" y="470" font-size="15" fill="#33414F">Emitted as a sealed envelope: schema · data.records · provenance.content_hash —</text>
  <text x="380" y="492" font-size="15" fill="#33414F">reproducible, diffable, and the input Books 04–10 plan against.</text>

  <text x="640" y="676" text-anchor="middle" font-size="12" fill="#6B7A8D">Schematic — the authentication audit. Read-only against the retained set; the named audit is the shipped, Pester-tested function.</text>
</svg>
