<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="b10Teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="b10Red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <text x="64" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Map the certificate chain before retiring ADCS</text>
  <text x="64" y="106" font-size="17" fill="#6B7A8D">Audit which SQL surfaces depend on the certificate authority, plan their migration, and sequence PKI so nothing is decommissioned out from under SQL.</text>

  <!-- audit -->
  <rect x="64" y="190" width="300" height="120" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="84" y="220" font-family="Consolas, monospace" font-size="12.5" fill="#0D1B2E">Spec3-D1.10-Get-</text>
  <text x="84" y="240" font-family="Consolas, monospace" font-size="12.5" fill="#0D1B2E">CertBasedAuthAudit</text>
  <text x="84" y="268" font-family="Arial" font-size="13" fill="#33414F">what SQL surfaces use certs?</text>
  <text x="84" y="292" font-family="Arial" font-size="12" fill="#1E8C8C">read-only / analytical</text>

  <line x1="366" y1="250" x2="422" y2="250" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b10Teal)"/>

  <rect x="426" y="190" width="300" height="120" rx="8" fill="#EAF1FB" stroke="#2E75B6" stroke-width="2"/>
  <text x="446" y="222" font-family="Consolas, monospace" font-size="13.5" fill="#0D1B2E">New-UIAOSqlCertificatePlan</text>
  <text x="446" y="252" font-family="Arial" font-size="13" fill="#33414F">per-surface certificate</text>
  <text x="446" y="274" font-family="Arial" font-size="13" fill="#33414F">migration plan</text>
  <text x="446" y="296" font-family="Arial" font-size="12" fill="#6B7A8D">derive — issues nothing</text>

  <line x1="728" y1="250" x2="784" y2="250" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b10Teal)"/>

  <rect x="788" y="190" width="300" height="120" rx="8" fill="#EAF1FB" stroke="#2E75B6" stroke-width="2"/>
  <text x="808" y="222" font-family="Consolas, monospace" font-size="13.5" fill="#0D1B2E">New-UIAOPKIMigrationPlan</text>
  <text x="808" y="252" font-family="Arial" font-size="13" fill="#33414F">sequence retirement so no</text>
  <text x="808" y="274" font-family="Arial" font-size="13" fill="#33414F">dependent loses its issuer</text>
  <text x="808" y="296" font-family="Arial" font-size="12" fill="#6B7A8D">derive · analytical</text>

  <!-- dependency graph -->
  <text x="640" y="370" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#0D1B2E">the dependency that must not be cut early</text>

  <rect x="540" y="392" width="200" height="72" rx="8" fill="#0D1B2E"/>
  <text x="640" y="424" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#FFFFFF">ADCS / PKI</text>
  <text x="640" y="448" text-anchor="middle" font-size="12" fill="#A9B8CA">certificate authority</text>

  <line x1="640" y1="464" x2="320" y2="528" stroke="#C0392B" stroke-width="2.5" marker-end="url(#b10Red)"/>
  <line x1="640" y1="464" x2="640" y2="528" stroke="#C0392B" stroke-width="2.5" marker-end="url(#b10Red)"/>
  <line x1="640" y1="464" x2="960" y2="528" stroke="#C0392B" stroke-width="2.5" marker-end="url(#b10Red)"/>

  <rect x="200" y="532" width="240" height="76" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="320" y="566" text-anchor="middle" font-size="15" fill="#33414F">TLS / Force Encryption</text>
  <text x="320" y="588" text-anchor="middle" font-size="13" fill="#6B7A8D">SQL endpoint certificate</text>

  <rect x="520" y="532" width="240" height="76" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="640" y="566" text-anchor="middle" font-size="15" fill="#33414F">certificate-based logins</text>
  <text x="640" y="588" text-anchor="middle" font-size="13" fill="#6B7A8D">service / app authentication</text>

  <rect x="840" y="532" width="240" height="76" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="960" y="566" text-anchor="middle" font-size="15" fill="#33414F">Always Encrypted / TDE</text>
  <text x="960" y="588" text-anchor="middle" font-size="13" fill="#6B7A8D">data-protection keys</text>

  <text x="640" y="676" text-anchor="middle" font-size="12" fill="#6B7A8D">Schematic — the SQL ↔ ADCS dependency map. Every step is read-only / analytical; named functions are shipped and Pester-tested.</text>
</svg>
