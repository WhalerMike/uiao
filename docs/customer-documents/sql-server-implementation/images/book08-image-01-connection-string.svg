<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="b8Teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="64" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">The last mile: the stored credential leaves the app</text>
  <text x="64" y="106" font-size="17" fill="#6B7A8D">Inventory who binds with a stored secret, plan the cutover, then change the connection string in application configuration — the one step that is not scripted.</text>

  <!-- inventory -->
  <rect x="64" y="200" width="300" height="110" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="84" y="230" font-family="Consolas, monospace" font-size="12.5" fill="#0D1B2E">Spec3-D1.9-Get-</text>
  <text x="84" y="250" font-family="Consolas, monospace" font-size="12.5" fill="#0D1B2E">LDAPBindAccountInventory</text>
  <text x="84" y="278" font-family="Arial" font-size="13" fill="#33414F">who still binds with a secret?</text>
  <text x="84" y="300" font-family="Arial" font-size="12" fill="#1E8C8C">read-only</text>

  <line x1="366" y1="255" x2="422" y2="255" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b8Teal)"/>

  <!-- plan -->
  <rect x="426" y="200" width="300" height="110" rx="8" fill="#EAF1FB" stroke="#2E75B6" stroke-width="2"/>
  <text x="446" y="232" font-family="Consolas, monospace" font-size="13.5" fill="#0D1B2E">New-UIAOAppConnectionPlan</text>
  <text x="446" y="262" font-family="Arial" font-size="13" fill="#33414F">per-app cutover plan:</text>
  <text x="446" y="284" font-family="Arial" font-size="13" fill="#33414F">old string → token-based string</text>
  <text x="446" y="304" font-family="Arial" font-size="12" fill="#6B7A8D">derive — changes no config itself</text>

  <line x1="728" y1="255" x2="784" y2="255" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b8Teal)"/>

  <!-- in-config change -->
  <rect x="788" y="200" width="428" height="110" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="808" y="232" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#0D1B2E">change in app configuration</text>
  <text x="808" y="260" font-family="Arial" font-size="13" fill="#33414F">not a SQL script — deliberately unscripted</text>
  <text x="808" y="284" font-family="Arial" font-size="13" fill="#33414F">deployed through the app's release pipeline</text>
  <text x="808" y="304" font-family="Arial" font-size="12" fill="#C0392B">review-required · change-controlled</text>

  <!-- before / after connection string -->
  <rect x="120" y="384" width="480" height="150" rx="10" fill="#F4F7FB" stroke="#C0392B" stroke-width="1.5"/>
  <text x="360" y="416" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#C0392B">before — stored credential</text>
  <text x="360" y="456" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#33414F">Server=sql01;</text>
  <text x="360" y="480" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#33414F">User Id=svc_app;</text>
  <text x="360" y="504" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#C0392B">Password=•••••••;</text>

  <line x1="612" y1="459" x2="676" y2="459" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b8Teal)"/>

  <rect x="688" y="384" width="480" height="150" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="928" y="416" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#1E8C8C">after — no secret, token-based</text>
  <text x="928" y="456" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#33414F">Server=sql01;</text>
  <text x="928" y="480" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#33414F">Authentication=</text>
  <text x="928" y="504" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1E8C8C">Active Directory Managed Identity;</text>

  <text x="640" y="600" text-anchor="middle" font-size="15" fill="#33414F">When the connection string changes, the application stops carrying a password — the stored credential is gone from the chain entirely.</text>
  <text x="640" y="676" text-anchor="middle" font-size="12" fill="#6B7A8D">Schematic — the application connection chain. The inventory and plan are shipped, Pester-tested functions; the config change is made in-app, by design.</text>
</svg>
