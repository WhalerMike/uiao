<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="b5Teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="64" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Logins migrate behind a parallel-run window</text>
  <text x="64" y="106" font-size="17" fill="#6B7A8D">Map, then emit a reviewable script — never an open connection — then validate both paths resolve before the old login is removed.</text>

  <!-- three derive steps -->
  <rect x="64" y="180" width="330" height="100" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="84" y="210" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">New-UIAOEntraLoginMapping</text>
  <text x="84" y="236" font-family="Arial" font-size="13" fill="#33414F">Windows login → Entra principal</text>
  <text x="84" y="260" font-family="Arial" font-size="12" fill="#1E8C8C">derive · read-only</text>

  <line x1="396" y1="230" x2="452" y2="230" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b5Teal)"/>

  <rect x="456" y="180" width="330" height="100" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="476" y="210" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">New-UIAOEntraLoginScript</text>
  <text x="476" y="236" font-family="Consolas, monospace" font-size="12.5" fill="#33414F">CREATE LOGIN FROM EXTERNAL PROVIDER</text>
  <text x="476" y="260" font-family="Arial" font-size="12" fill="#6B7A8D">emits a script — no -Server / -Execute surface</text>

  <line x1="788" y1="230" x2="844" y2="230" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b5Teal)"/>

  <rect x="848" y="180" width="368" height="100" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="868" y="210" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">Test-UIAOLoginParallelRun</text>
  <text x="868" y="236" font-family="Arial" font-size="13" fill="#33414F">both logins valid during cutover</text>
  <text x="868" y="260" font-family="Arial" font-size="12" fill="#1E8C8C">validate · dry-run</text>

  <!-- parallel run window timeline -->
  <text x="96" y="356" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#0D1B2E">The parallel-run window</text>

  <rect x="96" y="380" width="1024" height="70" rx="8" fill="#FFF6E0" stroke="#D4A017" stroke-width="1.5"/>
  <rect x="96" y="380" width="420" height="70" rx="8" fill="#F4F7FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="306" y="412" text-anchor="middle" font-size="15" fill="#33414F">old Windows login active</text>
  <text x="306" y="434" text-anchor="middle" font-size="13" fill="#6B7A8D">existing connections keep working</text>
  <text x="700" y="408" text-anchor="middle" font-size="15" fill="#0D1B2E">both valid — applications repoint</text>
  <text x="700" y="430" text-anchor="middle" font-size="13" fill="#6B7A8D">no big-bang cutover; reversible</text>
  <rect x="900" y="380" width="220" height="70" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1010" y="412" text-anchor="middle" font-size="15" fill="#33414F">Entra login only</text>
  <text x="1010" y="434" text-anchor="middle" font-size="13" fill="#6B7A8D">old login removed</text>

  <line x1="96" y1="478" x2="1120" y2="478" stroke="#6B7A8D" stroke-width="1.5" marker-end="url(#b5Teal)"/>
  <text x="100" y="500" font-size="12" fill="#6B7A8D">begin migration</text>
  <text x="1120" y="500" text-anchor="end" font-size="12" fill="#6B7A8D">window closes — cutover complete</text>

  <text x="640" y="560" text-anchor="middle" font-size="15" fill="#33414F">The emitters open no SQL connection at all: they generate the script and the validation plan, and you route them through change control.</text>
  <text x="640" y="676" text-anchor="middle" font-size="12" fill="#6B7A8D">Schematic — login migration with a parallel-run window. The emitters derive and dry-run only; named functions are shipped and Pester-tested.</text>
</svg>
