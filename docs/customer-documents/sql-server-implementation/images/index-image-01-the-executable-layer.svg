<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="exTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="64" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">The executable layer beneath the narrative</text>
  <text x="64" y="106" font-size="17" fill="#6B7A8D">The narrative reasons about the transformation; this companion ships the scripts, parameters, output schemas, and failure modes that perform it.</text>

  <!-- NARRATIVE LAYER -->
  <rect x="96" y="158" width="1088" height="150" rx="10" fill="#EAF1FB" stroke="#2E75B6" stroke-width="2"/>
  <text x="128" y="200" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="22" fill="#0D1B2E">Narrative layer — why, in what order, what good looks like</text>
  <text x="128" y="230" font-size="15" fill="#33414F">Architects, governance, program management. Reasoning, patterns, sequencing, ADRs. Conceptual; changes slowly.</text>
  <rect x="128" y="250" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="228" y="275" text-anchor="middle" font-size="14" fill="#2E75B6">ADR-091 · ADR-068</text>
  <rect x="344" y="250" width="180" height="40" rx="6" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="434" y="275" text-anchor="middle" font-size="14" fill="#2E75B6">UIAO_135 #7</text>

  <!-- aligned by book number arrow -->
  <line x1="640" y1="314" x2="640" y2="378" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#exTeal)"/>
  <text x="660" y="352" font-size="14" font-weight="bold" fill="#1E8C8C">aligned by book number</text>

  <!-- IMPLEMENTATION LAYER -->
  <rect x="96" y="392" width="1088" height="246" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="128" y="434" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="22" fill="#0D1B2E">Implementation companion — how to actually do it</text>
  <text x="128" y="464" font-size="15" fill="#33414F">DBAs, infrastructure engineers, migration teams. Scripts, parameters, output schemas, runbooks, failure modes. Executable; changes fast.</text>

  <!-- three executable tokens -->
  <rect x="128" y="490" width="320" height="118" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="288" y="522" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#0D1B2E">Shipped automation</text>
  <text x="288" y="548" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#33414F">tools/discovery (Spec*-D1.*)</text>
  <text x="288" y="570" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#33414F">tools/powershell modules</text>
  <text x="288" y="592" text-anchor="middle" font-size="12" fill="#6B7A8D">Pester-tested, run offline</text>

  <rect x="480" y="490" width="320" height="118" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="640" y="522" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#0D1B2E">Sealed evidence</text>
  <text x="640" y="548" text-anchor="middle" font-size="13" fill="#33414F">provenance-anchored envelope</text>
  <text x="640" y="570" text-anchor="middle" font-size="13" fill="#33414F">reproducible content_hash</text>
  <text x="640" y="592" text-anchor="middle" font-size="12" fill="#6B7A8D">unattributed = DRIFT-PROVENANCE</text>

  <rect x="832" y="490" width="320" height="118" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="992" y="522" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#0D1B2E">Safety model</text>
  <text x="992" y="548" text-anchor="middle" font-size="13" fill="#33414F">read-only / derivation: run direct</text>
  <text x="992" y="570" text-anchor="middle" font-size="13" fill="#33414F">state-changing: -WhatIf, gated</text>
  <text x="992" y="592" text-anchor="middle" font-size="12" fill="#6B7A8D">review-required before enforcement</text>

  <text x="640" y="688" text-anchor="middle" font-size="12" fill="#6B7A8D">Schematic — the two-layer model; each implementation book is the executable runbook for the narrative book of the same number.</text>
</svg>
