<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="b1Teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="64" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">The toolchain, the evidence, and the run order</text>
  <text x="64" y="106" font-size="17" fill="#6B7A8D">Book 01 installs nothing into production: it sets up the runtime, the sealed-evidence model, the safety line, and the order Books 02–10 run in.</text>

  <!-- pipeline: install -> evidence -> safety -> run order -->
  <rect x="64" y="168" width="252" height="150" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="190" y="202" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#0D1B2E">1 · Install</text>
  <text x="190" y="232" text-anchor="middle" font-size="13" fill="#33414F">PowerShell 7+</text>
  <text x="190" y="254" text-anchor="middle" font-size="13" fill="#33414F">python3 (stdlib seal)</text>
  <text x="190" y="276" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#33414F">Import-Module …Migration</text>
  <text x="190" y="298" text-anchor="middle" font-size="12" fill="#6B7A8D">no editable install needed</text>

  <line x1="320" y1="243" x2="380" y2="243" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b1Teal)"/>

  <rect x="384" y="168" width="252" height="150" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="510" y="202" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#0D1B2E">2 · Evidence</text>
  <text x="510" y="232" text-anchor="middle" font-size="13" fill="#33414F">sealed envelope per step</text>
  <text x="510" y="254" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#33414F">schema · data · provenance</text>
  <text x="510" y="276" text-anchor="middle" font-size="13" fill="#33414F">timestamp omitted from seal</text>
  <text x="510" y="298" text-anchor="middle" font-size="12" fill="#1E8C8C">reproducible content_hash</text>

  <line x1="640" y1="243" x2="700" y2="243" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b1Teal)"/>

  <rect x="704" y="168" width="252" height="150" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="830" y="202" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#0D1B2E">3 · Safety line</text>
  <text x="830" y="232" text-anchor="middle" font-size="13" fill="#1E8C8C">read-only / derive → run direct</text>
  <text x="830" y="256" text-anchor="middle" font-size="13" fill="#C0392B">state-changing → gated</text>
  <text x="830" y="278" text-anchor="middle" font-size="13" fill="#33414F">-WhatIf preview · plan only</text>
  <text x="830" y="300" text-anchor="middle" font-size="12" fill="#6B7A8D">no embedded secrets</text>

  <line x1="1080" y1="318" x2="1080" y2="356" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1100" y="262" font-size="13" fill="#6B7A8D" transform="rotate(90 1100 262)">offline / snapshot</text>

  <!-- run order chain -->
  <rect x="64" y="372" width="1152" height="232" rx="10" fill="#F4F7FB" stroke="#6B7A8D" stroke-width="1.5"/>
  <text x="96" y="410" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#0D1B2E">4 · The run order — later books act only on the set earlier books define</text>

  <!-- gate node -->
  <rect x="96" y="436" width="150" height="120" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="171" y="470" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#0D1B2E">02</text>
  <text x="171" y="494" text-anchor="middle" font-size="12" fill="#33414F">estate</text>
  <text x="171" y="512" text-anchor="middle" font-size="12" fill="#33414F">inventory</text>
  <text x="171" y="534" text-anchor="middle" font-size="11" fill="#1E8C8C">retain / consolidate</text>
  <text x="171" y="550" text-anchor="middle" font-size="11" fill="#1E8C8C">/ retire gate</text>

  <line x1="248" y1="496" x2="300" y2="496" stroke="#1E8C8C" stroke-width="3" marker-end="url(#b1Teal)"/>

  <!-- chain of books 03..10 -->
  <g font-size="14" fill="#0D1B2E">
    <rect x="304" y="452" width="104" height="88" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="356" y="486" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">03–04</text>
    <text x="356" y="508" text-anchor="middle" font-size="11" fill="#33414F">audit ·</text>
    <text x="356" y="524" text-anchor="middle" font-size="11" fill="#33414F">Arc identity</text>

    <rect x="424" y="452" width="104" height="88" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="476" y="486" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">05–06</text>
    <text x="476" y="508" text-anchor="middle" font-size="11" fill="#33414F">logins ·</text>
    <text x="476" y="524" text-anchor="middle" font-size="11" fill="#33414F">NTLM out</text>

    <rect x="544" y="452" width="104" height="88" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="596" y="486" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">07–08</text>
    <text x="596" y="508" text-anchor="middle" font-size="11" fill="#33414F">groups ·</text>
    <text x="596" y="524" text-anchor="middle" font-size="11" fill="#33414F">app chain</text>

    <rect x="664" y="452" width="104" height="88" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="716" y="486" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">09–10</text>
    <text x="716" y="508" text-anchor="middle" font-size="11" fill="#33414F">monitor ·</text>
    <text x="716" y="524" text-anchor="middle" font-size="11" fill="#33414F">certificates</text>
  </g>
  <line x1="408" y1="496" x2="424" y2="496" stroke="#6B7A8D" stroke-width="2" marker-end="url(#b1Teal)"/>
  <line x1="528" y1="496" x2="544" y2="496" stroke="#6B7A8D" stroke-width="2" marker-end="url(#b1Teal)"/>
  <line x1="648" y1="496" x2="664" y2="496" stroke="#6B7A8D" stroke-width="2" marker-end="url(#b1Teal)"/>

  <text x="900" y="486" font-size="14" fill="#33414F">Each book documents a real,</text>
  <text x="900" y="508" font-size="14" fill="#33414F">Pester-tested function — not</text>
  <text x="900" y="530" font-size="14" fill="#33414F">a paraphrased one.</text>

  <text x="640" y="666" text-anchor="middle" font-size="12" fill="#6B7A8D">Schematic — Book 01 is setup and orientation; it runs nothing against a live estate. The first production action is Book 04 (Arc) and Book 05 (logins).</text>
</svg>
