<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="b9Teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="b9Red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <text x="64" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Closure is proven, then kept — run over run</text>
  <text x="64" y="106" font-size="17" fill="#6B7A8D">A scheduled audit seals a closure record each cycle; comparing consecutive records turns any regression into an explicit drift finding.</text>

  <!-- scheduled audit -->
  <rect x="64" y="200" width="280" height="110" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="84" y="232" font-family="Consolas, monospace" font-size="13" fill="#0D1B2E">Spec3-D1.8 (scheduled)</text>
  <text x="84" y="262" font-family="Arial" font-size="13" fill="#33414F">re-audit the transformed estate</text>
  <text x="84" y="286" font-family="Arial" font-size="13" fill="#33414F">on a cadence</text>
  <text x="84" y="306" font-family="Arial" font-size="12" fill="#1E8C8C">read-only</text>

  <line x1="346" y1="255" x2="402" y2="255" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b9Teal)"/>

  <!-- closure record -->
  <rect x="406" y="200" width="280" height="110" rx="8" fill="#EAF1FB" stroke="#2E75B6" stroke-width="2"/>
  <text x="426" y="232" font-family="Consolas, monospace" font-size="13.5" fill="#0D1B2E">New-UIAOClosureRecord</text>
  <text x="426" y="262" font-family="Arial" font-size="13" fill="#33414F">sealed snapshot of posture</text>
  <text x="426" y="284" font-family="Arial" font-size="13" fill="#33414F">reproducible content_hash</text>
  <text x="426" y="304" font-family="Arial" font-size="12" fill="#6B7A8D">one record per cycle, kept in VCS</text>

  <line x1="688" y1="255" x2="744" y2="255" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b9Teal)"/>

  <!-- compare -->
  <rect x="748" y="200" width="280" height="110" rx="8" fill="#EAF1FB" stroke="#2E75B6" stroke-width="2"/>
  <text x="768" y="232" font-family="Consolas, monospace" font-size="13.5" fill="#0D1B2E">Compare-UIAOClosureRun</text>
  <text x="768" y="262" font-family="Arial" font-size="13" fill="#33414F">diff record N-1 → record N</text>
  <text x="768" y="284" font-family="Arial" font-size="13" fill="#33414F">what changed since last run?</text>
  <text x="768" y="304" font-family="Arial" font-size="12" fill="#6B7A8D">read-only</text>

  <!-- diff outcomes -->
  <rect x="120" y="400" width="500" height="150" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="370" y="436" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#1E8C8C">no change</text>
  <text x="370" y="472" text-anchor="middle" font-size="15" fill="#33414F">posture held — closure stays proven</text>
  <text x="370" y="500" text-anchor="middle" font-size="14" fill="#6B7A8D">the steady state the program drives toward</text>
  <line x1="370" y1="516" x2="370" y2="534" stroke="#1E8C8C" stroke-width="2"/>
  <circle cx="370" cy="534" r="3" fill="#1E8C8C"/>

  <rect x="660" y="400" width="500" height="150" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="910" y="436" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#C0392B">regression detected</text>
  <text x="910" y="472" text-anchor="middle" font-size="15" fill="#33414F">a Windows / NTLM / SQL login returned</text>
  <text x="910" y="500" text-anchor="middle" font-size="14" fill="#33414F">surfaced as an explicit drift finding</text>
  <line x1="910" y1="516" x2="910" y2="534" stroke="#C0392B" stroke-width="2" marker-end="url(#b9Red)"/>

  <text x="640" y="610" text-anchor="middle" font-size="15" fill="#33414F">Monitoring joins to Defender for SQL and Entra sign-in logs rather than duplicating them — the closure record stays the single source of truth.</text>
  <text x="640" y="676" text-anchor="middle" font-size="12" fill="#6B7A8D">Schematic — continuous closure and drift detection. Every step is read-only; named functions are shipped and Pester-tested.</text>
</svg>
