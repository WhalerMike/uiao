<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="b2Teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="64" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">One inventory fuses three reads into the gate</text>
  <text x="64" y="106" font-size="17" fill="#6B7A8D">New-UIAOEstateInventory joins discovery, the SPN inventory, and the auth audit into the retain / consolidate / retire decision every later book operates on.</text>

  <!-- three source reads -->
  <g font-family="Consolas, monospace" font-size="13">
    <rect x="64" y="180" width="300" height="62" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="84" y="208" font-size="13" fill="#33414F">Find-DbaInstance</text>
    <text x="84" y="230" font-family="Arial" font-size="12" fill="#6B7A8D">instance discovery across the forest</text>

    <rect x="64" y="262" width="300" height="62" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="84" y="290" fill="#33414F">Spec1-D1.5-Get-KerberosSPNInventory</text>
    <text x="84" y="312" font-family="Arial" font-size="12" fill="#6B7A8D">service-principal / SPN posture</text>

    <rect x="64" y="344" width="300" height="62" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="84" y="372" fill="#33414F">Spec3-D1.8-Get-SQLServerAuthAudit</text>
    <text x="84" y="394" font-family="Arial" font-size="12" fill="#6B7A8D">utilization · version / EOL · zombies</text>
  </g>

  <line x1="368" y1="293" x2="436" y2="293" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b2Teal)"/>

  <!-- fusion -->
  <rect x="440" y="246" width="246" height="96" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="563" y="284" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#0D1B2E">New-UIAOEstateInventory</text>
  <text x="563" y="310" text-anchor="middle" font-size="13" fill="#33414F">read-only · sealed envelope</text>
  <text x="563" y="330" text-anchor="middle" font-size="12" fill="#6B7A8D">Spec3-D1.8 · ADR-091 §1</text>

  <line x1="688" y1="293" x2="752" y2="293" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b2Teal)"/>

  <!-- three-way gate -->
  <rect x="756" y="172" width="460" height="80" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="784" y="206" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#0D1B2E">Retain</text>
  <text x="784" y="232" font-size="14" fill="#33414F">healthy, in use, supported — Books 04–09 act on these</text>

  <rect x="756" y="262" width="460" height="80" rx="8" fill="#EAF1FB" stroke="#2E75B6" stroke-width="2"/>
  <text x="784" y="296" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#0D1B2E">Consolidate</text>
  <text x="784" y="322" font-size="14" fill="#33414F">merged onto fewer targets before migrating</text>

  <rect x="756" y="352" width="460" height="80" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="784" y="386" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#0D1B2E">Retire</text>
  <text x="784" y="412" font-size="14" fill="#33414F">zombie / EOL — decommission, never migrate</text>

  <text x="640" y="500" text-anchor="middle" font-size="15" fill="#33414F">The gate is the denominator: only retain instances and consolidation targets proceed to authentication migration.</text>
  <text x="640" y="676" text-anchor="middle" font-size="12" fill="#6B7A8D">Schematic — the estate-inventory fusion and gate. Read-only; changes nothing. The named reads and function are the shipped, Pester-tested ones.</text>
</svg>
