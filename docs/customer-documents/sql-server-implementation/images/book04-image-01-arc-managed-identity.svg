<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="b4Teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="64" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Arc gives each retained host a managed identity</text>
  <text x="64" y="106" font-size="17" fill="#6B7A8D">Validate first, onboard behind a gate, then prove the token and the SQL extension — the identity Book 05's Entra logins are issued against.</text>

  <!-- host -->
  <rect x="64" y="300" width="190" height="110" rx="8" fill="#0D1B2E"/>
  <text x="159" y="346" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#FFFFFF">SQL Server host</text>
  <text x="159" y="372" text-anchor="middle" font-size="13" fill="#A9B8CA">retained instance</text>
  <text x="159" y="394" text-anchor="middle" font-size="12" fill="#A9B8CA">on-prem / domain-joined</text>

  <line x1="256" y1="355" x2="316" y2="355" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b4Teal)"/>

  <!-- step 1 validate -->
  <rect x="320" y="180" width="290" height="86" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="340" y="208" font-family="Consolas, monospace" font-size="13" fill="#0D1B2E">Test-UIAOArcAgentStatus</text>
  <text x="340" y="232" font-family="Arial" font-size="12" fill="#1E8C8C">validate · read-only</text>
  <text x="340" y="252" font-family="Arial" font-size="12" fill="#6B7A8D">is the Arc agent present and healthy?</text>

  <!-- step 2 onboard gated -->
  <rect x="320" y="312" width="290" height="86" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="340" y="340" font-family="Consolas, monospace" font-size="13" fill="#0D1B2E">Invoke-UIAOArcOnboarding</text>
  <text x="340" y="364" font-family="Arial" font-size="12" fill="#C0392B">review-required · SupportsShouldProcess</text>
  <text x="340" y="384" font-family="Arial" font-size="12" fill="#6B7A8D">defaults to a -WhatIf preview</text>

  <!-- step 3/4 prove -->
  <rect x="320" y="444" width="290" height="86" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="340" y="472" font-family="Consolas, monospace" font-size="12.5" fill="#0D1B2E">Test-UIAOArcManagedIdentityToken</text>
  <text x="340" y="494" font-family="Consolas, monospace" font-size="12.5" fill="#0D1B2E">Test-UIAOArcSqlExtension</text>
  <text x="340" y="516" font-family="Arial" font-size="12" fill="#1E8C8C">prove the token and extension · read-only</text>

  <line x1="612" y1="355" x2="700" y2="355" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b4Teal)"/>

  <!-- identity plane -->
  <rect x="704" y="250" width="512" height="210" rx="12" fill="#EAF1FB" stroke="#2E75B6" stroke-width="2"/>
  <text x="960" y="292" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#0D1B2E">Azure Arc · Microsoft Entra</text>
  <rect x="744" y="316" width="432" height="56" rx="6" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="960" y="350" text-anchor="middle" font-size="15" fill="#33414F">system-assigned managed identity → IMDS token</text>
  <rect x="744" y="384" width="432" height="56" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="960" y="418" text-anchor="middle" font-size="15" fill="#33414F">cloud-aware audience (GCC-Moderate / Gov) — fails closed</text>

  <text x="640" y="600" text-anchor="middle" font-size="15" fill="#33414F">Every function runs fully offline against a captured azcmagent / IMDS snapshot; live onboarding is the only gated, opt-in step.</text>
  <text x="640" y="676" text-anchor="middle" font-size="12" fill="#6B7A8D">Schematic — Arc onboarding and managed-identity validation. Onboarding is review-required; the validators are read-only. Named functions are shipped and Pester-tested.</text>
</svg>
