<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="b6Teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="64" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">NTLM is eliminated audit-first, never blind</text>
  <text x="64" y="106" font-size="17" fill="#6B7A8D">Find what falls back to NTLM, plan the SPN fixes, then move the GPO through audit mode before enforcement — so nothing is locked out by surprise.</text>

  <!-- step 1: audit -->
  <rect x="64" y="190" width="330" height="160" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="84" y="222" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#0D1B2E">1 · Audit (read-only)</text>
  <text x="84" y="252" font-family="Consolas, monospace" font-size="12.5" fill="#33414F">Spec1-D1.4-Get-</text>
  <text x="84" y="270" font-family="Consolas, monospace" font-size="12.5" fill="#33414F">AuthenticationProtocolAudit</text>
  <text x="84" y="296" font-family="Consolas, monospace" font-size="12.5" fill="#33414F">Spec3-D1.7-Get-SPNCollisionReport</text>
  <text x="84" y="326" font-family="Arial" font-size="13" fill="#6B7A8D">where does Kerberos silently fall back?</text>

  <line x1="396" y1="270" x2="452" y2="270" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b6Teal)"/>

  <!-- step 2: plan -->
  <rect x="456" y="190" width="330" height="160" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="476" y="222" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#0D1B2E">2 · Plan (derive)</text>
  <text x="476" y="254" font-family="Consolas, monospace" font-size="13" fill="#33414F">New-UIAOSpnRemediationPlan</text>
  <text x="476" y="282" font-family="Arial" font-size="13" fill="#33414F">fix duplicate / missing SPNs so</text>
  <text x="476" y="302" font-family="Arial" font-size="13" fill="#33414F">Kerberos completes — no fallback</text>
  <text x="476" y="330" font-family="Arial" font-size="12" fill="#6B7A8D">reviewable plan, executes nothing</text>

  <line x1="788" y1="270" x2="844" y2="270" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#b6Teal)"/>

  <!-- step 3: GPO -->
  <rect x="848" y="190" width="368" height="160" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="868" y="222" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#0D1B2E">3 · GPO (review-required)</text>
  <text x="868" y="254" font-family="Consolas, monospace" font-size="13" fill="#33414F">Get-UIAONtlmGpoReport</text>
  <text x="868" y="282" font-family="Arial" font-size="13" fill="#33414F">restrict NTLM — audit mode first,</text>
  <text x="868" y="302" font-family="Arial" font-size="13" fill="#33414F">read the report, then enforce</text>
  <text x="868" y="330" font-family="Arial" font-size="12" fill="#C0392B">changes production security posture</text>

  <!-- audit -> enforce band -->
  <rect x="64" y="412" width="1152" height="66" rx="8" fill="#FFF6E0" stroke="#D4A017" stroke-width="1.5"/>
  <text x="100" y="442" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#0D1B2E">Audit mode</text>
  <text x="100" y="464" font-size="13" fill="#33414F">log what would break — no one is denied yet</text>
  <line x1="560" y1="445" x2="700" y2="445" stroke="#D4A017" stroke-width="3" marker-end="url(#b6Teal)"/>
  <text x="900" y="442" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#C0392B">Enforce</text>
  <text x="900" y="464" text-anchor="middle" font-size="13" fill="#33414F">only after the audit report is clean and change-approved</text>

  <text x="640" y="540" text-anchor="middle" font-size="15" fill="#33414F">The discovery and plan steps are safe to run today; the GPO enforcement is the one step that must clear change control and security review.</text>
  <text x="640" y="676" text-anchor="middle" font-size="12" fill="#6B7A8D">Schematic — NTLM elimination, audit-first. Named audits and plan generators are shipped and Pester-tested; the GPO move is gated. (ADR-068)</text>
</svg>
