<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <rect x="0" y="0" width="900" height="38" fill="#1A9E8F"/>
  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">DURING — Two Paths, One Destination  (2 of 3: The Parallel-Run Pattern)</text>

  <text x="155" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3A5F">Phase 1 — Add</text>
  <text x="450" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3A5F">Phase 2 — Run in Parallel</text>
  <text x="760" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3A5F">Phase 3 — Cut Over</text>

  <line x1="306" y1="66" x2="306" y2="370" stroke="#CCCCCC" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="612" y1="66" x2="612" y2="370" stroke="#CCCCCC" stroke-width="1.5" stroke-dasharray="4,4"/>

  <rect x="28" y="76" width="844" height="52" rx="8" fill="#FEF0EE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="155" y="97" text-anchor="middle" font-size="13" fill="#4A6080">existing · active</text>
  <text x="450" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#C0392B">Windows login  (type-U)</text>
  <text x="760" y="97" text-anchor="middle" font-size="13" fill="#4A6080">disable → observe 30d → drop</text>
  <text x="155" y="118" text-anchor="middle" font-size="12" fill="#6B7E95">type-U login in place</text>
  <text x="450" y="118" text-anchor="middle" font-size="12" fill="#6B7E95">kept as rollback path</text>
  <text x="760" y="118" text-anchor="middle" font-size="12" fill="#C0392B">retired when type-E validated</text>

  <rect x="28" y="146" width="844" height="52" rx="8" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="155" y="167" text-anchor="middle" font-size="13" fill="#4A6080">create with</text>
  <text x="450" y="167" text-anchor="middle" font-size="13" font-weight="600" fill="#1A9E8F">Entra login  (type-E)</text>
  <text x="760" y="167" text-anchor="middle" font-size="13" fill="#1A9E8F">sole active login ✓</text>
  <text x="155" y="188" text-anchor="middle" font-size="12" fill="#6B7E95">FROM EXTERNAL PROVIDER</text>
  <text x="450" y="188" text-anchor="middle" font-size="12" fill="#6B7E95">validated against real traffic</text>
  <text x="760" y="188" text-anchor="middle" font-size="12" fill="#6B7E95">migration complete</text>

  <rect x="28" y="218" width="272" height="144" rx="10" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1"/>
  <text x="164" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#1F3A5F">What you do</text>
  <text x="164" y="268" text-anchor="middle" font-size="13" fill="#4A6080">Run Arc enrollment</text>
  <text x="164" y="292" text-anchor="middle" font-size="13" fill="#4A6080">Enable Entra auth on engine</text>
  <text x="164" y="316" text-anchor="middle" font-size="13" fill="#4A6080">Create type-E alongside type-U</text>
  <text x="164" y="340" text-anchor="middle" font-size="12" fill="#6B7E95">Both logins active</text>

  <rect x="314" y="218" width="272" height="144" rx="10" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1"/>
  <text x="450" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#1F3A5F">What you verify</text>
  <text x="450" y="268" text-anchor="middle" font-size="13" fill="#4A6080">App connects via type-E</text>
  <text x="450" y="292" text-anchor="middle" font-size="13" fill="#4A6080">Permissions are correct</text>
  <text x="450" y="316" text-anchor="middle" font-size="13" fill="#4A6080">No errors in 30-day window</text>
  <text x="450" y="340" text-anchor="middle" font-size="12" fill="#6B7E95">type-U = rollback, not default</text>

  <rect x="600" y="218" width="272" height="144" rx="10" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1"/>
  <text x="736" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#1F3A5F">What you remove</text>
  <text x="736" y="268" text-anchor="middle" font-size="13" fill="#4A6080">Disable type-U login</text>
  <text x="736" y="292" text-anchor="middle" font-size="13" fill="#4A6080">Observe 30 days</text>
  <text x="736" y="316" text-anchor="middle" font-size="13" fill="#4A6080">Drop type-U login</text>
  <text x="736" y="340" text-anchor="middle" font-size="12" fill="#1A9E8F">Migration complete ✓</text>

  <rect x="28" y="378" width="844" height="78" rx="10" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="450" y="408" text-anchor="middle" font-size="14" font-weight="600" fill="#1F3A5F">ADR-091 makes this three-phase pattern normative</text>
  <text x="450" y="434" text-anchor="middle" font-size="13" fill="#4A6080">No login is removed until it has been validated against real traffic for 30 days.</text>
</svg>
