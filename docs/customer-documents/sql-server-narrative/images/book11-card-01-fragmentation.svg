<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <!-- white background -->
  <rect width="900" height="500" fill="white"/>

  <!-- title bar -->
  <rect x="0" y="0" width="900" height="52" fill="#1F3A5F"/>
  <text x="450" y="33" text-anchor="middle" fill="white" font-size="16" font-weight="bold">THE FRAGMENTATION COST — SPRAWL vs. SSOT</text>

  <!-- LEFT PANEL: sprawl -->
  <rect x="20" y="64" width="400" height="390" fill="#FFF5F5" rx="4" stroke="#C0392B" stroke-width="1.5"/>
  <text x="220" y="90" text-anchor="middle" fill="#C0392B" font-size="12" font-weight="bold">40 SQL SERVER INSTANCES</text>
  <text x="220" y="108" text-anchor="middle" fill="#C0392B" font-size="10">each instance = candidate authority</text>

  <!-- sprawl boxes (3 columns, 4 rows of small SQL Server icons) -->
  <!-- Row 1 -->
  <rect x="40" y="122" width="110" height="38" fill="white" stroke="#C0392B" stroke-width="1" rx="3"/>
  <text x="95" y="137" text-anchor="middle" fill="#1F3A5F" font-size="9" font-weight="bold">Instance A</text>
  <text x="95" y="151" text-anchor="middle" fill="#666" font-size="8">HR data</text>

  <rect x="165" y="122" width="110" height="38" fill="white" stroke="#C0392B" stroke-width="1" rx="3"/>
  <text x="220" y="137" text-anchor="middle" fill="#1F3A5F" font-size="9" font-weight="bold">Instance B</text>
  <text x="220" y="151" text-anchor="middle" fill="#666" font-size="8">also HR data?</text>

  <rect x="290" y="122" width="110" height="38" fill="white" stroke="#C0392B" stroke-width="1" rx="3"/>
  <text x="345" y="137" text-anchor="middle" fill="#1F3A5F" font-size="9" font-weight="bold">Instance C</text>
  <text x="345" y="151" text-anchor="middle" fill="#666" font-size="8">financial records</text>

  <!-- Row 2 -->
  <rect x="40" y="172" width="110" height="38" fill="white" stroke="#C0392B" stroke-width="1" rx="3"/>
  <text x="95" y="187" text-anchor="middle" fill="#1F3A5F" font-size="9" font-weight="bold">Instance D</text>
  <text x="95" y="201" text-anchor="middle" fill="#666" font-size="8">case management</text>

  <rect x="165" y="172" width="110" height="38" fill="white" stroke="#C0392B" stroke-width="1" rx="3"/>
  <text x="220" y="187" text-anchor="middle" fill="#1F3A5F" font-size="9" font-weight="bold">Instance E</text>
  <text x="220" y="201" text-anchor="middle" fill="#666" font-size="8">same cases?</text>

  <rect x="290" y="172" width="110" height="38" fill="white" stroke="#C0392B" stroke-width="1" rx="3"/>
  <text x="345" y="187" text-anchor="middle" fill="#1F3A5F" font-size="9" font-weight="bold">Instance F</text>
  <text x="345" y="201" text-anchor="middle" fill="#666" font-size="8">asset inventory</text>

  <!-- Row 3 -->
  <rect x="40" y="222" width="110" height="38" fill="white" stroke="#C0392B" stroke-width="1" rx="3"/>
  <text x="95" y="237" text-anchor="middle" fill="#1F3A5F" font-size="9" font-weight="bold">Instance G</text>
  <text x="95" y="251" text-anchor="middle" fill="#666" font-size="8">authorizations</text>

  <rect x="165" y="222" width="110" height="38" fill="white" stroke="#C0392B" stroke-width="1" rx="3"/>
  <text x="220" y="237" text-anchor="middle" fill="#1F3A5F" font-size="9" font-weight="bold">Instance H</text>
  <text x="220" y="251" text-anchor="middle" fill="#666" font-size="8">also authorizations</text>

  <rect x="290" y="222" width="110" height="38" fill="white" stroke="#C0392B" stroke-width="1" rx="3"/>
  <text x="345" y="237" text-anchor="middle" fill="#1F3A5F" font-size="9" font-weight="bold">…+32 more</text>
  <text x="345" y="251" text-anchor="middle" fill="#666" font-size="8">independently licensed</text>

  <!-- conflict arrows pointing down to question mark -->
  <line x1="95" y1="260" x2="160" y2="300" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="220" y1="260" x2="220" y2="300" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="345" y1="260" x2="280" y2="300" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- conflict zone -->
  <rect x="100" y="300" width="240" height="50" fill="#FFEBEB" stroke="#C0392B" stroke-width="1.5" rx="3"/>
  <text x="220" y="320" text-anchor="middle" fill="#C0392B" font-size="11" font-weight="bold">Which instance is authoritative?</text>
  <text x="220" y="338" text-anchor="middle" fill="#C0392B" font-size="9">Resolved by institutional knowledge.</text>
  <text x="220" y="352" text-anchor="middle" fill="#C0392B" font-size="9">Knowledge does not survive staff turnover.</text>

  <!-- cost badges -->
  <rect x="35" y="365" width="170" height="28" fill="#C0392B" rx="3"/>
  <text x="120" y="383" text-anchor="middle" fill="white" font-size="9">per-core licensing × 40 instances</text>

  <rect x="215" y="365" width="190" height="28" fill="#C0392B" rx="3"/>
  <text x="310" y="383" text-anchor="middle" fill="white" font-size="9">40 admin surfaces to patch and monitor</text>

  <!-- RIGHT PANEL: SSOT -->
  <rect x="480" y="64" width="400" height="390" fill="#F0FAF9" rx="4" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="680" y="90" text-anchor="middle" fill="#1A9E8F" font-size="12" font-weight="bold">ONE AUTHORITATIVE DATABASE</text>
  <text x="680" y="108" text-anchor="middle" fill="#1A9E8F" font-size="10">one platform · one authority model · SSOT</text>

  <!-- feeding data domains -->
  <rect x="495" y="122" width="130" height="34" fill="white" stroke="#1F3A5F" stroke-width="1" rx="3"/>
  <text x="560" y="137" text-anchor="middle" fill="#1F3A5F" font-size="9" font-weight="bold">OrgPath</text>
  <text x="560" y="151" text-anchor="middle" fill="#1F3A5F" font-size="8">identity + org structure</text>

  <rect x="735" y="122" width="130" height="34" fill="white" stroke="#1F3A5F" stroke-width="1" rx="3"/>
  <text x="800" y="137" text-anchor="middle" fill="#1F3A5F" font-size="9" font-weight="bold">HRIT</text>
  <text x="800" y="151" text-anchor="middle" fill="#1F3A5F" font-size="8">workforce position records</text>

  <rect x="495" y="168" width="130" height="34" fill="white" stroke="#1F3A5F" stroke-width="1" rx="3"/>
  <text x="560" y="183" text-anchor="middle" fill="#1F3A5F" font-size="9" font-weight="bold">KYC</text>
  <text x="560" y="197" text-anchor="middle" fill="#1F3A5F" font-size="8">citizen verification</text>

  <rect x="735" y="168" width="130" height="34" fill="white" stroke="#1F3A5F" stroke-width="1" rx="3"/>
  <text x="800" y="183" text-anchor="middle" fill="#1F3A5F" font-size="9" font-weight="bold">Domain Apps</text>
  <text x="800" y="197" text-anchor="middle" fill="#1F3A5F" font-size="8">migrated workloads</text>

  <!-- arrows to central database -->
  <line x1="625" y1="139" x2="660" y2="232" stroke="#1A9E8F" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="735" y1="139" x2="700" y2="232" stroke="#1A9E8F" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="625" y1="185" x2="660" y2="232" stroke="#1A9E8F" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="735" y1="185" x2="700" y2="232" stroke="#1A9E8F" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- central authoritative database -->
  <rect x="595" y="232" width="170" height="72" fill="#1A9E8F" rx="5"/>
  <text x="680" y="258" text-anchor="middle" fill="white" font-size="13" font-weight="bold">AUTHORITATIVE</text>
  <text x="680" y="275" text-anchor="middle" fill="white" font-size="13" font-weight="bold">DATABASE</text>
  <text x="680" y="295" text-anchor="middle" fill="white" font-size="9">PostgreSQL or Oracle</text>

  <!-- SSOT properties -->
  <rect x="495" y="322" width="370" height="80" fill="white" stroke="#1A9E8F" stroke-width="1" rx="3"/>
  <text x="680" y="342" text-anchor="middle" fill="#1F3A5F" font-size="10" font-weight="bold">SSOT PROPERTIES</text>
  <text x="510" y="360" fill="#1A9E8F" font-size="9">✓  One designated authority per data domain</text>
  <text x="510" y="376" fill="#1A9E8F" font-size="9">✓  Logical replication · RLS · FDW · JSONB</text>
  <text x="510" y="392" fill="#1A9E8F" font-size="9">✓  One licensing position · one ops team</text>

  <!-- gain badges -->
  <rect x="495" y="410" width="170" height="28" fill="#1A9E8F" rx="3"/>
  <text x="580" y="428" text-anchor="middle" fill="white" font-size="9">open-source or single-vendor license</text>

  <rect x="675" y="410" width="190" height="28" fill="#1A9E8F" rx="3"/>
  <text x="770" y="428" text-anchor="middle" fill="white" font-size="9">one admin surface · one drift model</text>

  <!-- center divider arrow -->
  <rect x="435" y="225" width="30" height="30" fill="white"/>
  <text x="450" y="246" text-anchor="middle" fill="#1F3A5F" font-size="20" font-weight="bold">→</text>

  <!-- footer -->
  <rect x="0" y="462" width="900" height="38" fill="#1F3A5F"/>
  <text x="450" y="485" text-anchor="middle" fill="white" font-size="10">The authentication transformation re-authenticates the silos. Dissolving them is the platform question.</text>

  <!-- arrow marker -->
  <defs>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1A9E8F"/>
    </marker>
  </defs>
</svg>
