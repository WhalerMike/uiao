<svg viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <defs>
    <marker id="arr-teal" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#1A9E8F"/>
    </marker>
    <marker id="arr-red" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#C0392B"/>
    </marker>
    <marker id="arr-amber" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#E67E22"/>
    </marker>
  </defs>

  <rect width="1400" height="760" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="700" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#1F3A5F">During — Two Paths, One Destination</text>
  <text x="700" y="82" text-anchor="middle" font-size="16" fill="#6B7E95">Legacy connections still use Kerberos. Migrated connections use an Entra token. Both reach the same SQL Server.</text>

  <!-- ══════════════════════════════════
       LEFT COLUMN — two clients
  ══════════════════════════════════ -->

  <!-- Client A: Legacy -->
  <rect x="40" y="118" width="220" height="200" rx="14" fill="#FEF0EE" stroke="#C0392B" stroke-width="2.5"/>
  <rect x="40" y="118" width="220" height="38" rx="14" fill="#C0392B"/>
  <text x="150" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">NOT YET MIGRATED</text>
  <rect x="80" y="170" width="120" height="72" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <rect x="92" y="182" width="96" height="48" rx="3" fill="#C0392B" opacity="0.15"/>
  <text x="150" y="205" text-anchor="middle" font-size="12" fill="#C0392B">Domain-joined</text>
  <text x="150" y="221" text-anchor="middle" font-size="12" fill="#C0392B">workstation</text>
  <text x="150" y="265" text-anchor="middle" font-size="13" fill="#4A6080">Integrated Security=True</text>
  <text x="150" y="284" text-anchor="middle" font-size="12" fill="#C0392B">Kerberos or NTLM</text>
  <text x="150" y="302" text-anchor="middle" font-size="11" fill="#6B7E95" font-style="italic">type-W login expected</text>

  <!-- Client B: Migrated -->
  <rect x="40" y="360" width="220" height="200" rx="14" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="2.5"/>
  <rect x="40" y="360" width="220" height="38" rx="14" fill="#1A9E8F"/>
  <text x="150" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">MIGRATED</text>
  <rect x="80" y="412" width="120" height="72" rx="6" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="1.5"/>
  <rect x="92" y="424" width="96" height="48" rx="3" fill="#1A9E8F" opacity="0.12"/>
  <text x="150" y="449" text-anchor="middle" font-size="12" fill="#1A9E8F">Any device</text>
  <text x="150" y="467" text-anchor="middle" font-size="12" fill="#1A9E8F">any location</text>
  <text x="150" y="508" text-anchor="middle" font-size="12" fill="#4A6080">Authentication=Default</text>
  <text x="150" y="527" text-anchor="middle" font-size="12" fill="#1A9E8F">Entra token</text>
  <text x="150" y="545" text-anchor="middle" font-size="11" fill="#6B7E95" font-style="italic">type-E login expected</text>

  <!-- ══════════════════════════════════
       CENTER — Entra ID (top) + KDC (bottom)
  ══════════════════════════════════ -->

  <!-- Entra ID -->
  <rect x="530" y="118" width="280" height="190" rx="14" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="2.5"/>
  <rect x="530" y="118" width="280" height="38" rx="14" fill="#1A9E8F"/>
  <text x="670" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">MICROSOFT ENTRA ID</text>
  <text x="670" y="184" text-anchor="middle" font-size="14" font-weight="600" fill="#1F3A5F">Conditional Access</text>
  <text x="670" y="206" text-anchor="middle" font-size="13" fill="#4A6080">MFA · device compliance</text>
  <text x="670" y="226" text-anchor="middle" font-size="13" fill="#4A6080">sign-in risk evaluation</text>
  <text x="670" y="253" text-anchor="middle" font-size="13" fill="#1A9E8F">→ Issues OAuth 2.0 token</text>
  <text x="670" y="274" text-anchor="middle" font-size="11" fill="#6B7E95" font-style="italic">New path only</text>
  <text x="670" y="293" text-anchor="middle" font-size="11" fill="#6B7E95" font-style="italic">Kerberos never reaches here</text>

  <!-- KDC -->
  <rect x="530" y="380" width="280" height="170" rx="14" fill="#FEF0EE" stroke="#C0392B" stroke-width="2" stroke-dasharray="8,5"/>
  <rect x="530" y="380" width="280" height="38" rx="14" fill="#C0392B" opacity="0.75"/>
  <text x="670" y="405" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">DOMAIN CONTROLLER</text>
  <text x="670" y="442" text-anchor="middle" font-size="13" fill="#C0392B" font-weight="600">Still active for legacy path</text>
  <text x="670" y="464" text-anchor="middle" font-size="13" fill="#4A6080">Issues Kerberos tickets</text>
  <text x="670" y="484" text-anchor="middle" font-size="12" fill="#4A6080">Some SPNs still missing</text>
  <text x="670" y="504" text-anchor="middle" font-size="12" fill="#E67E22">→ NTLM fallback still happening</text>
  <text x="670" y="530" text-anchor="middle" font-size="11" fill="#C0392B" font-style="italic">To retire when last client migrates</text>

  <!-- ══════════════════════════════════
       RIGHT — SQL Server
  ══════════════════════════════════ -->
  <rect x="1010" y="200" width="340" height="380" rx="16" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="3"/>
  <rect x="1010" y="200" width="340" height="42" rx="16" fill="#1F3A5F"/>
  <text x="1180" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">SQL SERVER  (Arc-Enabled)</text>

  <text x="1180" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#1F3A5F">Accepting both login types</text>
  <text x="1180" y="298" text-anchor="middle" font-size="12" fill="#6B7E95">during the parallel-run window</text>

  <rect x="1038" y="314" width="284" height="52" rx="8" fill="#FEF0EE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="1180" y="336" text-anchor="middle" font-size="14" font-weight="600" fill="#C0392B">type-W / type-G</text>
  <text x="1180" y="356" text-anchor="middle" font-size="12" fill="#4A6080">Windows / AD group logins  ← pending</text>

  <rect x="1038" y="378" width="284" height="52" rx="8" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="1180" y="400" text-anchor="middle" font-size="14" font-weight="600" fill="#1A9E8F">type-E</text>
  <text x="1180" y="420" text-anchor="middle" font-size="12" fill="#4A6080">Entra logins  ← migrated ✓</text>

  <rect x="1038" y="442" width="284" height="52" rx="8" fill="#FFF8EE" stroke="#E67E22" stroke-width="1.5"/>
  <text x="1180" y="464" text-anchor="middle" font-size="14" font-weight="600" fill="#E67E22">type-S / sa</text>
  <text x="1180" y="484" text-anchor="middle" font-size="12" fill="#4A6080">SQL Auth  ← to eliminate</text>

  <text x="1180" y="528" text-anchor="middle" font-size="13" font-weight="600" fill="#1F3A5F">Goal: type-E only</text>
  <text x="1180" y="548" text-anchor="middle" font-size="12" fill="#6B7E95">Deadline: 2027-04-01</text>

  <!-- ══════════════════════════════════
       FLOW ARROWS
  ══════════════════════════════════ -->

  <!-- Client A → KDC -->
  <line x1="260" y1="240" x2="530" y2="460" stroke="#C0392B" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arr-red)"/>

  <!-- KDC → SQL (old path) -->
  <line x1="810" y1="440" x2="1010" y2="370" stroke="#C0392B" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arr-red)"/>
  <rect x="840" y="372" width="136" height="28" rx="5" fill="#FEF0EE" stroke="#C0392B" stroke-width="1"/>
  <text x="908" y="391" text-anchor="middle" font-size="11" fill="#C0392B">Kerberos / NTLM</text>

  <!-- Client B → Entra -->
  <line x1="260" y1="460" x2="530" y2="220" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arr-teal)"/>

  <!-- Entra → SQL (new path) -->
  <line x1="810" y1="210" x2="1010" y2="330" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <rect x="836" y="230" width="148" height="28" rx="5" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="1"/>
  <text x="910" y="249" text-anchor="middle" font-size="11" fill="#1A9E8F">Entra token ✓</text>

  <!-- ══════════════════════════════════
       BOTTOM BAR
  ══════════════════════════════════ -->
  <rect x="40" y="610" width="1320" height="118" rx="12" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="700" y="640" text-anchor="middle" font-size="15" font-weight="700" fill="#E67E22">The hybrid state is a controlled risk — not a stable destination</text>
  <text x="700" y="666" text-anchor="middle" font-size="14" fill="#4A6080">Every legacy login that remains is a connection Conditional Access cannot see, a principal whose device compliance is unknown,</text>
  <text x="700" y="688" text-anchor="middle" font-size="14" fill="#4A6080">and an NTLM exposure that does not shrink until the login is migrated.</text>
  <text x="700" y="714" text-anchor="middle" font-size="13" fill="#1F3A5F" font-style="italic">The migration window closes at 2027-04-01 when the network-level NTLM block is applied regardless.</text>

</svg>
