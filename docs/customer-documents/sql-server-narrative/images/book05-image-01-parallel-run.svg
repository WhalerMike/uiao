<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="prTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="prGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7A8D"/>
    </marker>
  </defs>

  <text x="64" y="74" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">The parallel run, then the switch</text>
  <text x="64" y="104" font-size="17" fill="#6B7A8D">The old Windows login and the new Entra login carry the same principal side by side — until the old track is retired.</text>

  <!-- principal at the start -->
  <path d="M118,372 Q118,344 126,342 L138,342 Q146,344 146,372 Z" fill="#2E4B6B"/>
  <circle cx="132" cy="336" r="12" fill="#2E4B6B"/>
  <text x="132" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">principal</text>
  <text x="132" y="424" text-anchor="middle" font-size="12" fill="#6B7A8D">user · group · service</text>

  <!-- phase markers along the top -->
  <text x="430" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B7A8D">Phase 1 — add</text>
  <text x="710" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B7A8D">Phase 2 — run in parallel</text>
  <text x="1010" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">Phase 3 — cut over</text>
  <line x1="300" y1="172" x2="300" y2="600" stroke="#E3E8EF" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="560" y1="172" x2="560" y2="600" stroke="#E3E8EF" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="860" y1="172" x2="860" y2="600" stroke="#E3E8EF" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- TOP track: legacy Windows login (fades, then retired) -->
  <rect x="320" y="208" width="230" height="58" rx="8" fill="#EAF1FB" stroke="#6B7A8D" stroke-width="2"/>
  <text x="435" y="234" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="16" fill="#33414F">Windows login</text>
  <text x="435" y="255" text-anchor="middle" font-size="12" fill="#6B7A8D">Kerberos ticket / NTLM</text>
  <line x1="180" y1="338" x2="316" y2="262" stroke="#6B7A8D" stroke-width="2.5" marker-end="url(#prGrey)"/>
  <line x1="558" y1="237" x2="848" y2="237" stroke="#6B7A8D" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="700" y="200" text-anchor="middle" font-size="12" fill="#6B7A8D">still works — kept as the rollback path</text>
  <!-- retired marker -->
  <circle cx="900" cy="237" r="22" fill="#F7E2DE" stroke="#C0392B" stroke-width="2.5"/>
  <line x1="889" y1="226" x2="911" y2="248" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
  <line x1="911" y1="226" x2="889" y2="248" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
  <text x="900" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#C0392B">old login removed</text>

  <!-- BOTTOM track: new Entra login (grows, then sole survivor) -->
  <rect x="320" y="452" width="230" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="435" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="16" fill="#0D1B2E">Entra login</text>
  <text x="435" y="499" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1E8C8C">FROM EXTERNAL PROVIDER</text>
  <line x1="180" y1="372" x2="316" y2="468" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#prTeal)"/>
  <line x1="558" y1="481" x2="956" y2="481" stroke="#1E8C8C" stroke-width="3" marker-end="url(#prTeal)"/>
  <text x="710" y="444" text-anchor="middle" font-size="12" fill="#1E8C8C">validated in parallel against real traffic</text>

  <!-- SQL engine at the right, now accepting only Entra -->
  <rect x="978" y="430" width="240" height="100" rx="6" fill="#0D1B2E"/>
  <text x="1098" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="20" fill="#FFFFFF">SQL Server engine</text>
  <text x="1098" y="498" text-anchor="middle" font-size="13" fill="#D7F2EE">accepts Entra-issued OAuth tokens</text>

  <text x="640" y="668" text-anchor="middle" font-size="13" fill="#33414F">Migrate only the instances Book 02 classified "retain" — the three-phase parallel-run pattern (ADR-091).</text>
  <text x="640" y="694" text-anchor="middle" font-size="12" fill="#6B7A8D">Illustrative — the phases are conceptual; the figure does not depict a schedule or measured cutover.</text>
</svg>
