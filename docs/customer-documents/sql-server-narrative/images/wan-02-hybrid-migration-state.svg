<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">

  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1F3A5F"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1A9E8F"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C0392B"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E67E22"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="800" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3A5F">The Migration State — Two Authentication Paths Live Simultaneously</text>
  <text x="800" y="64" text-anchor="middle" font-size="14" fill="#4A6080">Old path (Kerberos/NTLM) active while new path (Entra token) is built out. Both paths reach the same SQL Server.</text>

  <!-- ═══════════════════════════════════════════════════════════════
       LEGEND
  ═══════════════════════════════════════════════════════════════ -->
  <rect x="1250" y="80" width="310" height="110" rx="6" fill="#F8F8F8" stroke="#CCCCCC" stroke-width="1"/>
  <text x="1405" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3A5F">LEGEND</text>
  <line x1="1270" y1="115" x2="1330" y2="115" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="1345" y="119" font-size="11" fill="#C0392B">Old path — Kerberos / NTLM</text>
  <line x1="1270" y1="138" x2="1330" y2="138" stroke="#1A9E8F" stroke-width="2.5"/>
  <text x="1345" y="142" font-size="11" fill="#1A9E8F">New path — Entra token</text>
  <line x1="1270" y1="161" x2="1330" y2="161" stroke="#E67E22" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="1345" y="165" font-size="11" fill="#E67E22">NTLM fallback (silent)</text>

  <!-- ═══════════════════════════════════════════════════════════════
       LEFT COLUMN: TWO CLIENT TYPES
  ═══════════════════════════════════════════════════════════════ -->

  <!-- Client A: legacy, still domain-joined, Kerberos -->
  <rect x="40" y="90" width="260" height="240" rx="8" fill="#FFF5F5" stroke="#C0392B" stroke-width="2"/>
  <rect x="40" y="90" width="260" height="34" rx="8" fill="#C0392B"/>
  <text x="170" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">CLIENT A — Legacy</text>
  <rect x="90" y="140" width="160" height="80" rx="4" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <rect x="110" y="150" width="120" height="50" rx="2" fill="#C0392B" opacity="0.15"/>
  <text x="170" y="172" text-anchor="middle" font-size="11" fill="#C0392B">Domain-joined</text>
  <text x="170" y="188" text-anchor="middle" font-size="11" fill="#C0392B">workstation</text>
  <text x="170" y="240" text-anchor="middle" font-size="11" fill="#4A6080">Integrated Security=True</text>
  <text x="170" y="256" text-anchor="middle" font-size="11" fill="#C0392B">SSPI → Kerberos attempt</text>
  <text x="170" y="272" text-anchor="middle" font-size="11" fill="#4A6080">Falls back to NTLM if</text>
  <text x="170" y="288" text-anchor="middle" font-size="11" fill="#4A6080">SPN not corrected yet</text>
  <text x="170" y="310" text-anchor="middle" font-size="10" fill="#C0392B" font-style="italic">Not yet migrated</text>

  <!-- Client B: migrated, Entra token -->
  <rect x="40" y="355" width="260" height="240" rx="8" fill="#F0FAF8" stroke="#1A9E8F" stroke-width="2"/>
  <rect x="40" y="355" width="260" height="34" rx="8" fill="#1A9E8F"/>
  <text x="170" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">CLIENT B — Migrated</text>
  <rect x="90" y="405" width="160" height="80" rx="4" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="1.5"/>
  <rect x="110" y="415" width="120" height="50" rx="2" fill="#1A9E8F" opacity="0.12"/>
  <text x="170" y="437" text-anchor="middle" font-size="11" fill="#1A9E8F">Any device</text>
  <text x="170" y="453" text-anchor="middle" font-size="11" fill="#1A9E8F">any location</text>
  <text x="170" y="505" text-anchor="middle" font-size="11" fill="#4A6080">Authentication=ActiveDirectory</text>
  <text x="170" y="521" text-anchor="middle" font-size="11" fill="#4A6080">ManagedIdentity / Default</text>
  <text x="170" y="537" text-anchor="middle" font-size="11" fill="#1A9E8F">Entra token in header</text>
  <text x="170" y="559" text-anchor="middle" font-size="10" fill="#1A9E8F" font-style="italic">Migration complete</text>

  <!-- ═══════════════════════════════════════════════════════════════
       CENTER TOP: ENTRA ID (new path only)
  ═══════════════════════════════════════════════════════════════ -->
  <rect x="600" y="80" width="400" height="200" rx="10" fill="#EBF5FB" stroke="#1A9E8F" stroke-width="2.5"/>
  <rect x="600" y="80" width="400" height="36" rx="10" fill="#1A9E8F"/>
  <text x="800" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">MICROSOFT ENTRA ID</text>
  <text x="800" y="140" text-anchor="middle" font-size="12" fill="#1F3A5F" font-weight="bold">Conditional Access evaluation</text>
  <text x="800" y="158" text-anchor="middle" font-size="11" fill="#1A9E8F">✓ MFA completed (phishing-resistant)</text>
  <text x="800" y="174" text-anchor="middle" font-size="11" fill="#1A9E8F">✓ Device compliance verified</text>
  <text x="800" y="190" text-anchor="middle" font-size="11" fill="#1A9E8F">✓ Sign-in risk: evaluated</text>
  <text x="800" y="210" text-anchor="middle" font-size="11" fill="#4A6080">Issues: OAuth 2.0 access token</text>
  <text x="800" y="226" text-anchor="middle" font-size="10" fill="#4A6080">aud: https://database.windows.net</text>
  <text x="800" y="252" text-anchor="middle" font-size="11" fill="#1A9E8F" font-style="italic">New path only — Kerberos never reaches here</text>

  <!-- CENTER: KDC (old path only) -->
  <rect x="600" y="380" width="400" height="160" rx="8" fill="#FFF5F5" stroke="#C0392B" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="600" y="380" width="400" height="34" rx="8" fill="#C0392B"/>
  <text x="800" y="403" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">DOMAIN CONTROLLER / KDC</text>
  <text x="800" y="434" text-anchor="middle" font-size="12" fill="#C0392B" font-weight="bold">Still required for legacy path</text>
  <text x="800" y="452" text-anchor="middle" font-size="11" fill="#4A6080">Issues Kerberos service tickets</text>
  <text x="800" y="468" text-anchor="middle" font-size="11" fill="#4A6080">SPN registry: partially corrected</text>
  <text x="800" y="484" text-anchor="middle" font-size="11" fill="#E67E22">Some SPNs still missing → NTLM fallback</text>
  <text x="800" y="506" text-anchor="middle" font-size="10" fill="#C0392B" font-style="italic">To be decommissioned when all clients migrated</text>

  <!-- ═══════════════════════════════════════════════════════════════
       RIGHT: SQL SERVER (accepting both)
  ═══════════════════════════════════════════════════════════════ -->
  <rect x="1170" y="200" width="380" height="480" rx="8" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2.5"/>
  <rect x="1170" y="200" width="380" height="36" rx="8" fill="#1F3A5F"/>
  <text x="1360" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">SQL SERVER (Arc-Enabled)</text>

  <!-- Arc badge -->
  <rect x="1190" y="248" width="340" height="44" rx="6" fill="#1A9E8F" opacity="0.15" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="1360" y="266" text-anchor="middle" font-size="12" fill="#1A9E8F" font-weight="bold">Azure Arc enrolled</text>
  <text x="1360" y="282" text-anchor="middle" font-size="11" fill="#1A9E8F">Managed Identity: active</text>

  <!-- Login types -->
  <text x="1360" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3A5F">Login types coexisting</text>

  <rect x="1190" y="330" width="340" height="48" rx="4" fill="#FFF5F5" stroke="#C0392B" stroke-width="1.5"/>
  <text x="1360" y="350" text-anchor="middle" font-size="12" fill="#C0392B" font-weight="bold">type-U / type-G  (Windows)</text>
  <text x="1360" y="368" text-anchor="middle" font-size="11" fill="#4A6080">AD logins — pending migration</text>

  <rect x="1190" y="390" width="340" height="48" rx="4" fill="#F0FAF8" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="1360" y="410" text-anchor="middle" font-size="12" fill="#1A9E8F" font-weight="bold">type-E  (Entra / External)</text>
  <text x="1360" y="428" text-anchor="middle" font-size="11" fill="#4A6080">FROM EXTERNAL PROVIDER — migrated</text>

  <rect x="1190" y="450" width="340" height="48" rx="4" fill="#FFF8F0" stroke="#E67E22" stroke-width="1.5"/>
  <text x="1360" y="470" text-anchor="middle" font-size="12" fill="#E67E22" font-weight="bold">type-S  (SQL Auth / sa)</text>
  <text x="1360" y="488" text-anchor="middle" font-size="11" fill="#4A6080">Pending elimination per ADR-091</text>

  <!-- Phase indicators -->
  <text x="1360" y="530" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3A5F">ADR-068 Phase: A → B</text>
  <text x="1360" y="548" text-anchor="middle" font-size="11" fill="#4A6080">Discovery complete</text>
  <text x="1360" y="564" text-anchor="middle" font-size="11" fill="#E67E22">NTLMv1 block: in progress</text>
  <text x="1360" y="580" text-anchor="middle" font-size="11" fill="#4A6080">NTLMv2: progressively restricted</text>
  <text x="1360" y="610" text-anchor="middle" font-size="11" fill="#1F3A5F" font-weight="bold">Parallel-run window:</text>
  <text x="1360" y="628" text-anchor="middle" font-size="11" fill="#4A6080">create type-E → validate →</text>
  <text x="1360" y="644" text-anchor="middle" font-size="11" fill="#4A6080">disable type-U → observe 30d</text>
  <text x="1360" y="660" text-anchor="middle" font-size="11" fill="#1A9E8F">→ drop type-U</text>

  <!-- ═══════════════════════════════════════════════════════════════
       FLOW ARROWS
  ═══════════════════════════════════════════════════════════════ -->

  <!-- Client A → KDC (old path, red dashed) -->
  <line x1="300" y1="210" x2="600" y2="460" stroke="#C0392B" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arrow-red)"/>
  <text x="415" y="310" text-anchor="middle" font-size="10" fill="#C0392B" font-style="italic" transform="rotate(-30, 415, 310)">Kerberos ticket request</text>

  <!-- KDC → Client A (old path return) -->
  <line x1="600" y1="440" x2="300" y2="230" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>

  <!-- Client A → SQL Server (old path, red dashed) -->
  <line x1="300" y1="185" x2="1170" y2="310" stroke="#C0392B" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arrow-red)"/>
  <rect x="640" y="200" width="280" height="28" rx="4" fill="#FFF0EE" stroke="#C0392B" stroke-width="1"/>
  <text x="780" y="219" text-anchor="middle" font-size="11" fill="#C0392B">Kerberos ticket (or NTLM fallback)</text>

  <!-- Client B → Entra (new path, teal) -->
  <line x1="300" y1="450" x2="600" y2="180" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="400" y="340" text-anchor="middle" font-size="10" fill="#1A9E8F" font-style="italic" transform="rotate(-45, 400, 340)">authenticate + MFA</text>

  <!-- Entra → Client B (token return) -->
  <line x1="600" y1="200" x2="300" y2="470" stroke="#1A9E8F" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow-teal)"/>

  <!-- Client B → SQL Server (new path, teal) -->
  <line x1="300" y1="490" x2="1170" y2="400" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="640" y="440" width="280" height="28" rx="4" fill="#EBF5F3" stroke="#1A9E8F" stroke-width="1"/>
  <text x="780" y="459" text-anchor="middle" font-size="11" fill="#1A9E8F">OAuth 2.0 token (type-E login match)</text>

  <!-- NTLM fallback arrow (amber) -->
  <line x1="300" y1="200" x2="1170" y2="340" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-amber)"/>
  <rect x="640" y="260" width="260" height="24" rx="3" fill="#FFF8EE" stroke="#E67E22" stroke-width="1"/>
  <text x="770" y="277" text-anchor="middle" font-size="10" fill="#E67E22">NTLM fallback (silent) — SPN gap</text>

  <!-- ═══════════════════════════════════════════════════════════════
       BOTTOM: PROGRAM STATUS BAR
  ═══════════════════════════════════════════════════════════════ -->
  <rect x="40" y="720" width="1520" height="148" rx="8" fill="#F8F8F8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="800" y="746" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3A5F">Migration Program Status During This Phase</text>

  <!-- Progress bars -->
  <text x="140" y="774" text-anchor="middle" font-size="11" fill="#4A6080">Estate consolidated</text>
  <rect x="30" y="780" width="220" height="14" rx="3" fill="#E0E0E0"/>
  <rect x="30" y="780" width="176" height="14" rx="3" fill="#1A9E8F"/>
  <text x="140" y="806" text-anchor="middle" font-size="10" fill="#1A9E8F">80% complete</text>

  <text x="420" y="774" text-anchor="middle" font-size="11" fill="#4A6080">Arc enrolled</text>
  <rect x="310" y="780" width="220" height="14" rx="3" fill="#E0E0E0"/>
  <rect x="310" y="780" width="132" height="14" rx="3" fill="#1A9E8F"/>
  <text x="420" y="806" text-anchor="middle" font-size="10" fill="#1A9E8F">60% complete</text>

  <text x="700" y="774" text-anchor="middle" font-size="11" fill="#4A6080">Logins migrated (type-E)</text>
  <rect x="590" y="780" width="220" height="14" rx="3" fill="#E0E0E0"/>
  <rect x="590" y="780" width="88" height="14" rx="3" fill="#E67E22"/>
  <text x="700" y="806" text-anchor="middle" font-size="10" fill="#E67E22">40% complete</text>

  <text x="980" y="774" text-anchor="middle" font-size="11" fill="#4A6080">NTLMv1 eliminated</text>
  <rect x="870" y="780" width="220" height="14" rx="3" fill="#E0E0E0"/>
  <rect x="870" y="780" width="44" height="14" rx="3" fill="#C0392B"/>
  <text x="980" y="806" text-anchor="middle" font-size="10" fill="#C0392B">20% complete</text>

  <text x="1260" y="774" text-anchor="middle" font-size="11" fill="#4A6080">Conn strings migrated</text>
  <rect x="1150" y="780" width="220" height="14" rx="3" fill="#E0E0E0"/>
  <rect x="1150" y="780" width="66" height="14" rx="3" fill="#C0392B"/>
  <text x="1260" y="806" text-anchor="middle" font-size="10" fill="#C0392B">30% complete</text>

  <text x="800" y="840" text-anchor="middle" font-size="12" fill="#E67E22" font-weight="bold">The hybrid state is a controlled risk — not a stable destination. Every week it persists, the NTLM exposure window narrows but does not close.</text>
  <text x="800" y="858" text-anchor="middle" font-size="11" fill="#1F3A5F">Completion criterion: every connection to every retained instance uses a type-E login validated by Entra ID token. No type-U, no type-S, no NTLM.</text>

</svg>
