<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ea" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E67E22"/></marker>
    <marker id="na" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#1F3A5F"/></marker>
  </defs>
  <rect width="900" height="500" fill="#FFFFFF"/>
  <rect x="0" y="0" width="900" height="38" fill="#1F3A5F"/>
  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">AFTER — Application-Aware Token  (1 of 3: Overview)</text>

  <rect x="40" y="72" width="170" height="130" rx="12" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2"/>
  <text x="125" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#1F3A5F">SQL Client</text>
  <text x="125" y="156" text-anchor="middle" font-size="12" fill="#6B7E95">any device</text>
  <text x="125" y="174" text-anchor="middle" font-size="12" fill="#6B7E95">any location</text>
  <text x="125" y="192" text-anchor="middle" font-size="11" fill="#1A9E8F" font-style="italic">no domain join</text>

  <rect x="330" y="56" width="240" height="296" rx="12" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="2.5"/>
  <rect x="330" y="56" width="240" height="32" rx="12" fill="#1A9E8F"/>
  <text x="450" y="77" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">MICROSOFT ENTRA ID</text>
  <text x="450" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="#1F3A5F">Conditional Access</text>
  <text x="450" y="136" text-anchor="middle" font-size="13" fill="#4A6080">MFA · device · sign-in risk</text>
  <rect x="348" y="154" width="204" height="172" rx="8" fill="#FFF8EE" stroke="#E67E22" stroke-width="1.5"/>
  <text x="450" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#E67E22">OAuth 2.0 Token</text>
  <line x1="356" y1="186" x2="544" y2="186" stroke="#E67E22" stroke-width="1" opacity="0.4"/>
  <text x="450" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#1F3A5F">Who</text>
  <text x="450" y="230" text-anchor="middle" font-size="12" fill="#4A6080">upn · groups · expiry</text>
  <text x="450" y="256" text-anchor="middle" font-size="12" font-weight="600" fill="#1F3A5F">How</text>
  <text x="450" y="276" text-anchor="middle" font-size="12" fill="#4A6080">MFA method · device compliant</text>
  <text x="450" y="306" text-anchor="middle" font-size="11" fill="#E67E22" font-style="italic">Signed — SQL verifies signature</text>

  <rect x="686" y="72" width="178" height="260" rx="12" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2.5"/>
  <rect x="686" y="72" width="178" height="32" rx="12" fill="#1F3A5F"/>
  <text x="775" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">SQL SERVER</text>
  <text x="775" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#1A9E8F">type-E only</text>
  <text x="775" y="152" text-anchor="middle" font-size="12" fill="#4A6080">validates token</text>
  <text x="775" y="172" text-anchor="middle" font-size="12" fill="#4A6080">maps claims → role</text>
  <text x="775" y="192" text-anchor="middle" font-size="12" fill="#4A6080">logs auth to Entra</text>
  <rect x="700" y="208" width="150" height="104" rx="6" fill="#FEF0EE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="775" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">Eliminated</text>
  <text x="775" y="252" text-anchor="middle" font-size="12" fill="#6B7E95">✗  Kerberos / NTLM</text>
  <text x="775" y="272" text-anchor="middle" font-size="12" fill="#6B7E95">✗  Windows logins</text>
  <text x="775" y="292" text-anchor="middle" font-size="12" fill="#6B7E95">✗  Domain controller</text>

  <!-- ① arrow drawn first, badge on top -->
  <line x1="210" y1="126" x2="330" y2="126" stroke="#1F3A5F" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#na)"/>
  <rect x="178" y="108" width="106" height="18" rx="4" fill="#FFFFFF"/>
  <text x="231" y="121" text-anchor="middle" font-size="12" fill="#1F3A5F">① auth + MFA</text>

  <!-- ② arrow drawn first, badge below -->
  <line x1="330" y1="156" x2="210" y2="156" stroke="#E67E22" stroke-width="2.5" marker-end="url(#ea)"/>
  <rect x="178" y="160" width="106" height="18" rx="4" fill="#FFFFFF"/>
  <text x="231" y="173" text-anchor="middle" font-size="12" fill="#E67E22">② token issued</text>

  <!-- ③ arc drawn first, badge below the curve -->
  <path d="M 210 200 Q 448 395 686 200" fill="none" stroke="#E67E22" stroke-width="3" marker-end="url(#ea)"/>
  <rect x="338" y="374" width="224" height="22" rx="4" fill="#FFFFFF"/>
  <text x="450" y="390" text-anchor="middle" font-size="13" font-weight="600" fill="#E67E22">③ present token at SQL connect</text>

  <rect x="40" y="420" width="824" height="62" rx="10" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="452" y="444" text-anchor="middle" font-size="14" font-weight="600" fill="#1F3A5F">No domain controller · No Kerberos · No NTLM</text>
  <text x="452" y="468" text-anchor="middle" font-size="13" fill="#4A6080">Every authentication is logged to the Entra sign-in log.</text>
</svg>
