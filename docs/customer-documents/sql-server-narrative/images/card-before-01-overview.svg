<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="t" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#1A9E8F"/></marker>
    <marker id="r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#C0392B"/></marker>
    <marker id="n" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#1F3A5F"/></marker>
  </defs>
  <rect width="900" height="480" fill="#FFFFFF"/>
  <rect x="0" y="0" width="900" height="38" fill="#1F3A5F"/>
  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">BEFORE — Kerberos  (1 of 3: Overview)</text>

  <rect x="48" y="78" width="180" height="136" rx="12" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2"/>
  <text x="138" y="146" text-anchor="middle" font-size="22" font-weight="700" fill="#1F3A5F">SQL Client</text>
  <text x="138" y="172" text-anchor="middle" font-size="13" fill="#6B7E95">domain-joined</text>

  <rect x="365" y="62" width="170" height="166" rx="12" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2"/>
  <text x="450" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#1F3A5F">Domain</text>
  <text x="450" y="164" text-anchor="middle" font-size="18" font-weight="700" fill="#1F3A5F">Controller</text>
  <text x="450" y="192" text-anchor="middle" font-size="12" fill="#6B7E95">KDC · SPN registry</text>
  <text x="450" y="212" text-anchor="middle" font-size="12" fill="#6B7E95">issues Kerberos tickets</text>

  <rect x="682" y="78" width="180" height="136" rx="12" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2"/>
  <text x="772" y="146" text-anchor="middle" font-size="22" font-weight="700" fill="#1F3A5F">SQL Server</text>
  <text x="772" y="172" text-anchor="middle" font-size="13" fill="#6B7E95">Windows Auth</text>

  <!-- domain boundary drawn behind boxes -->
  <rect x="28" y="54" width="844" height="218" rx="10" fill="none" stroke="#1F3A5F" stroke-width="1.5" stroke-dasharray="10,6" opacity="0.28"/>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#1F3A5F" opacity="0.5">Active Directory domain boundary</text>

  <!-- ① request — arrow then badge on top -->
  <line x1="228" y1="118" x2="365" y2="128" stroke="#1F3A5F" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#n)"/>
  <rect x="258" y="98" width="78" height="20" rx="4" fill="#FFFFFF"/>
  <text x="297" y="112" text-anchor="middle" font-size="12" fill="#1F3A5F">① request</text>

  <!-- ② ticket back — arrow then badge below -->
  <line x1="365" y1="172" x2="228" y2="162" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#t)"/>
  <rect x="258" y="176" width="78" height="20" rx="4" fill="#FFFFFF"/>
  <text x="297" y="190" text-anchor="middle" font-size="12" fill="#1A9E8F">② issued</text>

  <!-- ③ present ticket — arrow then badge above -->
  <line x1="228" y1="156" x2="682" y2="156" stroke="#1A9E8F" stroke-width="3" marker-end="url(#t)"/>
  <rect x="330" y="136" width="240" height="20" rx="4" fill="#FFFFFF"/>
  <text x="450" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#1A9E8F">③ present ticket — no password on wire</text>

  <!-- NTLM fallback — arrow then badge below -->
  <line x1="228" y1="198" x2="682" y2="198" stroke="#C0392B" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#r)"/>
  <rect x="308" y="202" width="284" height="20" rx="4" fill="#FFFFFF"/>
  <text x="450" y="216" text-anchor="middle" font-size="12" fill="#C0392B">NTLM fallback if SPN missing  (silent — no error)</text>

  <rect x="28" y="300" width="412" height="142" rx="12" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="234" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#1F3A5F">What works well</text>
  <text x="234" y="358" text-anchor="middle" font-size="14" fill="#4A6080">No password on the network</text>
  <text x="234" y="382" text-anchor="middle" font-size="14" fill="#4A6080">Mutual authentication</text>
  <text x="234" y="406" text-anchor="middle" font-size="14" fill="#4A6080">Central policy via AD</text>
  <text x="234" y="430" text-anchor="middle" font-size="12" fill="#1A9E8F" font-style="italic">Correct engineering for its era</text>

  <rect x="460" y="300" width="412" height="142" rx="12" fill="#FEF0EE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="666" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#C0392B">What it cannot provide</text>
  <text x="666" y="358" text-anchor="middle" font-size="14" fill="#4A6080">Conditional Access — CA never sees Kerberos</text>
  <text x="666" y="382" text-anchor="middle" font-size="14" fill="#4A6080">Phishing-resistant MFA — no claim in ticket</text>
  <text x="666" y="406" text-anchor="middle" font-size="14" fill="#4A6080">Device compliance — not in auth path</text>
  <text x="666" y="430" text-anchor="middle" font-size="12" fill="#C0392B" font-style="italic">OMB M-22-09 zero-trust: not achievable</text>
</svg>
