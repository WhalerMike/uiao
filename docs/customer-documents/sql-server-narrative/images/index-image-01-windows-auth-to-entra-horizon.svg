<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="keepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A66"/>
      <stop offset="1" stop-color="#0D1B2E"/>
    </linearGradient>
    <radialGradient id="planeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D7F2EE" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="64" y="74" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="36" fill="#0D1B2E">From Windows Authentication to the Entra identity plane</text>
  <text x="64" y="106" font-size="18" fill="#6B7A8D">The SQL Server estate's ten-book journey off the domain and onto the identity plane.</text>

  <!-- identity-plane glow (right) -->
  <ellipse cx="985" cy="392" rx="250" ry="170" fill="url(#planeGlow)"/>

  <!-- ground / horizon -->
  <line x1="48" y1="566" x2="1232" y2="566" stroke="#E3E8EF" stroke-width="2"/>

  <!-- LEFT: the domain keep -->
  <ellipse cx="212" cy="566" rx="156" ry="26" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <rect x="150" y="438" width="124" height="120" fill="url(#keepGrad)"/>
  <rect x="130" y="410" width="36" height="148" fill="url(#keepGrad)"/>
  <rect x="258" y="410" width="36" height="148" fill="url(#keepGrad)"/>
  <!-- merlons -->
  <rect x="130" y="402" width="10" height="10" fill="#0D1B2E"/>
  <rect x="148" y="402" width="10" height="10" fill="#0D1B2E"/>
  <rect x="166" y="402" width="10" height="10" fill="#0D1B2E"/>
  <rect x="258" y="402" width="10" height="10" fill="#0D1B2E"/>
  <rect x="276" y="402" width="10" height="10" fill="#0D1B2E"/>
  <rect x="150" y="430" width="10" height="10" fill="#0D1B2E"/>
  <rect x="170" y="430" width="10" height="10" fill="#0D1B2E"/>
  <rect x="190" y="430" width="10" height="10" fill="#0D1B2E"/>
  <rect x="210" y="430" width="10" height="10" fill="#0D1B2E"/>
  <rect x="230" y="430" width="10" height="10" fill="#0D1B2E"/>
  <rect x="250" y="430" width="10" height="10" fill="#0D1B2E"/>
  <!-- gate -->
  <rect x="198" y="500" width="28" height="58" rx="14" fill="#EAF1FB"/>
  <!-- pennant -->
  <line x1="276" y1="410" x2="276" y2="384" stroke="#0D1B2E" stroke-width="2"/>
  <path d="M276,386 L300,392 L276,398 Z" fill="#1E8C8C"/>
  <text x="212" y="604" text-anchor="middle" font-size="19" font-weight="bold" fill="#0D1B2E">Windows Authentication</text>
  <text x="212" y="628" text-anchor="middle" font-size="13" fill="#6B7A8D">the domain keep — Kerberos · SPN · NTLM fallback · service accounts</text>

  <!-- BRIDGE deck (perspective, rising to the right) -->
  <path d="M330,558 L778,502 L778,486 L330,538 Z" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <line x1="470" y1="476" x2="792" y2="438" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#tealArrow)"/>
  <text x="560" y="462" font-size="14" font-weight="bold" fill="#1E8C8C">migration</text>

  <!-- figures crossing -->
  <path d="M407,526 Q407,503 414,501 L422,501 Q429,503 429,526 Z" fill="#2E4B6B"/>
  <circle cx="418" cy="494" r="9" fill="#2E4B6B"/>
  <path d="M544,511 Q544,491 550,489 L557,489 Q563,491 563,511 Z" fill="#2E4B6B"/>
  <circle cx="553" cy="483" r="8" fill="#2E4B6B"/>
  <path d="M669,498 Q669,481 674,480 L680,480 Q685,481 685,498 Z" fill="#A9B8CA"/>
  <circle cx="677" cy="474" r="6" fill="#A9B8CA"/>

  <!-- RIGHT: the identity plane slab -->
  <path d="M840,470 L1168,470 L1210,520 L798,520 Z" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5" opacity="0.9"/>
  <text x="1004" y="544" text-anchor="middle" font-size="13" fill="#6B7A8D">the identity plane</text>

  <!-- Entra card on the plane -->
  <rect x="878" y="300" width="252" height="98" rx="20" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1004" y="340" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="24" fill="#0D1B2E">Microsoft Entra ID</text>
  <text x="1004" y="368" text-anchor="middle" font-size="14" fill="#1E8C8C">tokens · Conditional Access</text>
  <!-- legs from card to plane -->
  <line x1="904" y1="398" x2="904" y2="470" stroke="#0D1B2E" stroke-width="1.5"/>
  <line x1="1104" y1="398" x2="1104" y2="470" stroke="#0D1B2E" stroke-width="1.5"/>

  <!-- Conditional Access badge -->
  <circle cx="1130" cy="298" r="23" fill="#1E8C8C"/>
  <path d="M1119,298 L1127,307 L1142,289" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
