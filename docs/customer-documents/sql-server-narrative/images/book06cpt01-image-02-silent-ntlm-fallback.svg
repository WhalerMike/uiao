<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="teal2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="red2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <text x="64" y="74" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Silent NTLM fallback: the unguarded door</text>
  <text x="64" y="104" font-size="17" fill="#6B7A8D">When the SPN is missing, authentication slips from Kerberos to NTLM automatically — with no error in the SQL Server log.</text>

  <!-- SQL Server behind the doors -->
  <rect x="500" y="150" width="280" height="86" rx="6" fill="#0D1B2E"/>
  <text x="640" y="186" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="22" fill="#FFFFFF">SQL Server engine</text>
  <text x="640" y="214" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#D7F2EE">Integrated Security=True</text>

  <!-- client -->
  <path d="M173,470 Q173,444 180,442 L191,442 Q198,444 198,470 Z" fill="#2E4B6B"/>
  <circle cx="185" cy="436" r="10" fill="#2E4B6B"/>
  <text x="185" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">client</text>
  <text x="185" y="516" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">connect</text>

  <!-- step 1: try Kerberos -->
  <line x1="214" y1="446" x2="296" y2="446" stroke="#1E8C8C" stroke-width="3" marker-end="url(#teal2)"/>
  <text x="255" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8C8C">1 · try Kerberos</text>

  <!-- step 2: fallback to NTLM -->
  <line x1="426" y1="455" x2="834" y2="455" stroke="#C0392B" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#red2)"/>
  <text x="630" y="443" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">2 · SPN missing → silent fallback to NTLM</text>

  <!-- LEFT door: Kerberos (guarded) -->
  <rect x="300" y="330" width="120" height="212" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="5"/>
  <circle cx="360" cy="318" r="22" fill="#1E8C8C"/>
  <path d="M350,318 L357,326 L371,310" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- padlock -->
  <path d="M349,432 a11,11 0 0 1 22,0 v8" fill="none" stroke="#1E8C8C" stroke-width="3"/>
  <rect x="344" y="440" width="32" height="26" rx="4" fill="#1E8C8C"/>
  <text x="360" y="566" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E8C8C">Kerberos</text>
  <text x="360" y="590" text-anchor="middle" font-size="13" fill="#33414F">SPN registered → mutual auth, ticket validated</text>
  <text x="360" y="610" text-anchor="middle" font-size="12" fill="#6B7A8D">visible in sign-in telemetry</text>
  <line x1="420" y1="360" x2="556" y2="240" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#teal2)"/>

  <!-- RIGHT door: NTLM (unguarded, ajar) -->
  <rect x="840" y="330" width="120" height="212" fill="#F2F4F7" stroke="#6B7A8D" stroke-width="5"/>
  <!-- door ajar panel -->
  <path d="M840,330 L912,346 L912,556 L840,542 Z" fill="#EAF1FB" stroke="#6B7A8D" stroke-width="2"/>
  <!-- mute / silent badge -->
  <circle cx="900" cy="318" r="22" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="3"/>
  <path d="M891,310 a9,9 0 0 1 18,3 M896,326 h10" fill="none" stroke="#6B7A8D" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="884" y1="304" x2="916" y2="332" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
  <!-- figure slipping through -->
  <path d="M918,520 Q918,498 924,496 L933,496 Q939,498 939,520 Z" fill="#A9B8CA"/>
  <circle cx="928" cy="490" r="8" fill="#A9B8CA"/>
  <text x="900" y="566" text-anchor="middle" font-size="18" font-weight="bold" fill="#C0392B">NTLM fallback</text>
  <text x="900" y="590" text-anchor="middle" font-size="13" fill="#33414F">SPN missing → drops to NTLM automatically</text>
  <text x="900" y="610" text-anchor="middle" font-size="12" font-weight="bold" fill="#C0392B">no error in the SQL Server log — silent</text>
  <line x1="880" y1="360" x2="724" y2="240" stroke="#6B7A8D" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#red2)"/>
</svg>
