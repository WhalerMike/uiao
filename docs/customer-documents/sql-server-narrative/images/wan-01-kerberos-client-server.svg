<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">

  <!-- White background -->
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="800" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3A5F">The Old World — Client-Server Kerberos Authentication</text>
  <text x="800" y="66" text-anchor="middle" font-size="14" fill="#4A6080">Every party domain-joined. The KDC is the authority. The perimeter is the trust boundary.</text>

  <!-- ═══════════════════════════════════════════════════════════════
       DOMAIN BOUNDARY (outer dashed rectangle)
  ═══════════════════════════════════════════════════════════════ -->
  <rect x="40" y="85" width="1520" height="760" rx="12" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="800" y="108" text-anchor="middle" font-size="13" fill="#1F3A5F" font-style="italic">Active Directory Domain Trust Boundary — all clients, servers, and services domain-joined</text>

  <!-- ═══════════════════════════════════════════════════════════════
       LEFT PANEL: CLIENT SITE
  ═══════════════════════════════════════════════════════════════ -->
  <rect x="60" y="120" width="300" height="380" rx="8" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2"/>
  <rect x="60" y="120" width="300" height="36" rx="8" fill="#1F3A5F"/>
  <text x="210" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">CLIENT SITE</text>

  <!-- Workstation icon -->
  <rect x="140" y="175" width="140" height="90" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <rect x="160" y="185" width="100" height="60" rx="2" fill="#1F3A5F"/>
  <rect x="185" y="267" width="50" height="8" rx="2" fill="#1F3A5F"/>
  <text x="210" y="220" text-anchor="middle" font-size="11" fill="#FFFFFF">DOMAIN-JOINED</text>
  <text x="210" y="235" text-anchor="middle" font-size="11" fill="#FFFFFF">WORKSTATION</text>

  <text x="210" y="295" text-anchor="middle" font-size="12" fill="#1F3A5F" font-weight="bold">SQL Client</text>
  <rect x="100" y="308" width="220" height="30" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="210" y="328" text-anchor="middle" font-size="11" fill="#1F3A5F">Integrated Security=True</text>

  <text x="210" y="362" text-anchor="middle" font-size="12" fill="#4A6080">SSPI layer invoked</text>
  <text x="210" y="380" text-anchor="middle" font-size="11" fill="#4A6080">↓ negotiates Kerberos</text>
  <text x="210" y="396" text-anchor="middle" font-size="11" fill="#4A6080">via domain membership</text>
  <text x="210" y="414" text-anchor="middle" font-size="11" fill="#4A6080">No credential in</text>
  <text x="210" y="430" text-anchor="middle" font-size="11" fill="#4A6080">connection string</text>
  <text x="210" y="454" text-anchor="middle" font-size="11" fill="#4A6080">SAM account:</text>
  <text x="210" y="470" text-anchor="middle" font-size="11" fill="#1F3A5F" font-weight="bold">DOMAIN\jsmith</text>

  <!-- ═══════════════════════════════════════════════════════════════
       CENTER: WAN / KDC COLUMN
  ═══════════════════════════════════════════════════════════════ -->

  <!-- WAN cloud shape -->
  <ellipse cx="595" cy="310" rx="110" ry="52" fill="#E8EEF4" stroke="#7A9CBD" stroke-width="2"/>
  <ellipse cx="535" cy="290" rx="65" ry="38" fill="#E8EEF4" stroke="#7A9CBD" stroke-width="2"/>
  <ellipse cx="650" cy="285" rx="75" ry="42" fill="#E8EEF4" stroke="#7A9CBD" stroke-width="2"/>
  <ellipse cx="595" cy="330" rx="100" ry="38" fill="#E8EEF4" stroke="#7A9CBD" stroke-width="2"/>
  <text x="595" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3A5F">ENTERPRISE</text>
  <text x="595" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3A5F">WAN</text>

  <!-- KDC / Domain Controller -->
  <rect x="470" y="480" width="250" height="180" rx="8" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2"/>
  <rect x="470" y="480" width="250" height="34" rx="8" fill="#1F3A5F"/>
  <text x="595" y="502" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">DOMAIN CONTROLLER</text>

  <!-- Server icon inside KDC box -->
  <rect x="545" y="525" width="100" height="50" rx="3" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
  <rect x="552" y="532" width="86" height="6" rx="2" fill="#1F3A5F"/>
  <rect x="552" y="542" width="86" height="6" rx="2" fill="#1F3A5F" opacity="0.5"/>
  <rect x="552" y="552" width="86" height="6" rx="2" fill="#1F3A5F" opacity="0.3"/>
  <circle cx="620" cy="563" r="4" fill="#1A9E8F"/>

  <text x="595" y="595" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3A5F">Key Distribution Center</text>
  <text x="595" y="612" text-anchor="middle" font-size="11" fill="#4A6080">Issues Kerberos service tickets</text>
  <text x="595" y="628" text-anchor="middle" font-size="10" fill="#4A6080">SPN Registry:</text>
  <text x="595" y="643" text-anchor="middle" font-size="10" fill="#1F3A5F">MSSQLSvc/sqlhost:1433</text>

  <!-- ═══════════════════════════════════════════════════════════════
       RIGHT PANEL: DATA CENTER / SQL SERVER
  ═══════════════════════════════════════════════════════════════ -->
  <rect x="1240" y="120" width="300" height="440" rx="8" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2"/>
  <rect x="1240" y="120" width="300" height="36" rx="8" fill="#1F3A5F"/>
  <text x="1390" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">DATA CENTER</text>

  <!-- SQL Server icon -->
  <rect x="1295" y="170" width="190" height="110" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <rect x="1295" y="170" width="190" height="28" rx="4" fill="#1F3A5F"/>
  <text x="1390" y="189" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">SQL SERVER ENGINE</text>
  <rect x="1310" y="207" width="160" height="8" rx="2" fill="#1F3A5F" opacity="0.3"/>
  <rect x="1310" y="219" width="160" height="8" rx="2" fill="#1F3A5F" opacity="0.3"/>
  <rect x="1310" y="231" width="100" height="8" rx="2" fill="#1F3A5F" opacity="0.3"/>
  <text x="1390" y="258" text-anchor="middle" font-size="11" fill="#4A6080">Auth: Windows-only mode</text>
  <text x="1390" y="274" text-anchor="middle" font-size="11" fill="#4A6080">Login type: W (Windows)</text>

  <text x="1390" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3A5F">Service Account</text>
  <rect x="1270" y="315" width="240" height="36" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="1390" y="335" text-anchor="middle" font-size="11" fill="#1F3A5F">svc-sql@domain.com</text>
  <text x="1390" y="350" text-anchor="middle" font-size="10" fill="#4A6080">(or gMSA — still AD-anchored)</text>

  <text x="1390" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3A5F">SPN Registration</text>
  <rect x="1255" y="394" width="270" height="50" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="1390" y="414" text-anchor="middle" font-size="10" fill="#1F3A5F">MSSQLSvc/sqlhost.domain.com:1433</text>
  <text x="1390" y="432" text-anchor="middle" font-size="10" fill="#C0392B">If missing → silent NTLM fallback</text>

  <text x="1390" y="470" text-anchor="middle" font-size="11" fill="#4A6080">Authentication authority:</text>
  <text x="1390" y="488" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3A5F">Active Directory / KDC</text>
  <text x="1390" y="506" text-anchor="middle" font-size="11" fill="#4A6080">Validated by: service acct key hash</text>
  <text x="1390" y="524" text-anchor="middle" font-size="11" fill="#4A6080">Azure identity plane: not involved</text>

  <!-- ═══════════════════════════════════════════════════════════════
       AUTHENTICATION FLOW ARROWS
  ═══════════════════════════════════════════════════════════════ -->

  <!-- ① Client → KDC: ticket request -->
  <line x1="360" y1="270" x2="480" y2="540" stroke="#1F3A5F" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-navy)"/>
  <rect x="340" y="390" width="200" height="36" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1"/>
  <text x="440" y="405" text-anchor="middle" font-size="11" fill="#1F3A5F" font-weight="bold">① Kerberos ticket request</text>
  <text x="440" y="420" text-anchor="middle" font-size="10" fill="#4A6080">SPN: MSSQLSvc/sqlhost:1433</text>

  <!-- ② KDC → Client: service ticket -->
  <line x1="480" y1="560" x2="360" y2="300" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="100" y="478" width="210" height="36" rx="4" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="205" y="493" text-anchor="middle" font-size="11" fill="#1A9E8F" font-weight="bold">② Service ticket issued</text>
  <text x="205" y="508" text-anchor="middle" font-size="10" fill="#4A6080">encrypted with svc acct key</text>

  <!-- ③ Client → SQL Server: ticket presentation -->
  <line x1="360" y1="240" x2="1240" y2="220" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="600" y="205" width="400" height="48" rx="4" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="800" y="222" text-anchor="middle" font-size="12" fill="#1A9E8F" font-weight="bold">③ Present Kerberos ticket at connect</text>
  <text x="800" y="238" text-anchor="middle" font-size="10" fill="#4A6080">No password on the wire — mutual authentication</text>
  <text x="800" y="252" text-anchor="middle" font-size="10" fill="#4A6080">Client proves identity to server; server proves identity to client</text>

  <!-- ④ SQL Server validates -->
  <rect x="1280" y="560" width="240" height="52" rx="4" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="1400" y="579" text-anchor="middle" font-size="11" fill="#1A9E8F" font-weight="bold">④ Engine validates ticket</text>
  <text x="1400" y="594" text-anchor="middle" font-size="10" fill="#4A6080">Decrypts using service acct key</text>
  <text x="1400" y="608" text-anchor="middle" font-size="10" fill="#4A6080">Maps principal → SQL login</text>

  <!-- NTLM fallback (red dashed) -->
  <line x1="360" y1="320" x2="1240" y2="320" stroke="#C0392B" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#arrow-red)"/>
  <rect x="600" y="302" width="400" height="30" rx="4" fill="#FFF0EE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="800" y="322" text-anchor="middle" font-size="11" fill="#C0392B" font-weight="bold">NTLM fallback — if SPN missing or cross-domain (silent, no error logged)</text>

  <!-- ═══════════════════════════════════════════════════════════════
       BOTTOM: WHAT IS MISSING FROM THIS PICTURE
  ═══════════════════════════════════════════════════════════════ -->
  <rect x="60" y="680" width="1520" height="140" rx="8" fill="#FFF8F0" stroke="#E67E22" stroke-width="2"/>
  <text x="800" y="706" text-anchor="middle" font-size="14" font-weight="bold" fill="#E67E22">What this architecture cannot provide</text>
  <line x1="400" y1="718" x2="1200" y2="718" stroke="#E67E22" stroke-width="1" opacity="0.4"/>

  <text x="290" y="742" text-anchor="middle" font-size="12" fill="#1F3A5F" font-weight="bold">Conditional Access</text>
  <text x="290" y="758" text-anchor="middle" font-size="11" fill="#4A6080">Kerberos exchange is local —</text>
  <text x="290" y="773" text-anchor="middle" font-size="11" fill="#4A6080">Azure policy engine never sees it</text>
  <text x="290" y="788" text-anchor="middle" font-size="11" fill="#4A6080">Device compliance: not enforced</text>
  <text x="290" y="803" text-anchor="middle" font-size="11" fill="#4A6080">Sign-in risk: not evaluated</text>

  <text x="690" y="742" text-anchor="middle" font-size="12" fill="#1F3A5F" font-weight="bold">Phishing-Resistant MFA</text>
  <text x="690" y="758" text-anchor="middle" font-size="11" fill="#4A6080">SSPI/Kerberos carries no</text>
  <text x="690" y="773" text-anchor="middle" font-size="11" fill="#4A6080">MFA completion claim</text>
  <text x="690" y="788" text-anchor="middle" font-size="11" fill="#4A6080">OMB M-22-09 compliance:</text>
  <text x="690" y="803" text-anchor="middle" font-size="11" fill="#C0392B">not achievable this path</text>

  <text x="1090" y="742" text-anchor="middle" font-size="12" fill="#1F3A5F" font-weight="bold">Cloud Identity Plane Visibility</text>
  <text x="1090" y="758" text-anchor="middle" font-size="11" fill="#4A6080">No Entra ID sign-in event</text>
  <text x="1090" y="773" text-anchor="middle" font-size="11" fill="#4A6080">No Defender for Identity signal</text>
  <text x="1090" y="788" text-anchor="middle" font-size="11" fill="#4A6080">No cross-domain/cross-tenant</text>
  <text x="1090" y="803" text-anchor="middle" font-size="11" fill="#4A6080">authentication governance</text>

  <line x1="490" y1="728" x2="490" y2="810" stroke="#E67E22" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
  <line x1="890" y1="728" x2="890" y2="810" stroke="#E67E22" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1F3A5F"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1A9E8F"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C0392B"/>
    </marker>
  </defs>

</svg>
