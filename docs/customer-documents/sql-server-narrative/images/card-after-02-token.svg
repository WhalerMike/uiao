<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <rect x="0" y="0" width="900" height="38" fill="#1F3A5F"/>
  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">AFTER — Application-Aware Token  (2 of 3: What the Token Carries)</text>

  <!-- Left: Token anatomy -->
  <rect x="28" y="56" width="380" height="400" rx="12" fill="#FFF8EE" stroke="#E67E22" stroke-width="2.5"/>
  <rect x="28" y="56" width="380" height="36" rx="12" fill="#E67E22"/>
  <text x="218" y="79" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">OAuth 2.0 Access Token  (claims)</text>

  <text x="218" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3A5F">IDENTITY  —  who you are</text>
  <line x1="46" y1="130" x2="390" y2="130" stroke="#E67E22" stroke-width="1" opacity="0.4"/>
  <text x="52" y="154" font-size="13" fill="#4A6080">upn</text>
  <text x="200" y="154" font-size="13" fill="#4A6080">user principal name</text>
  <text x="52" y="176" font-size="13" fill="#4A6080">oid</text>
  <text x="200" y="176" font-size="13" fill="#4A6080">immutable object id</text>
  <text x="52" y="198" font-size="13" fill="#4A6080">groups</text>
  <text x="200" y="198" font-size="13" fill="#4A6080">security group GUIDs</text>
  <text x="52" y="220" font-size="13" fill="#4A6080">exp</text>
  <text x="200" y="220" font-size="13" fill="#4A6080">expiry (default 60–75 min)</text>

  <line x1="46" y1="236" x2="390" y2="236" stroke="#1F3A5F" stroke-width="1" opacity="0.25"/>
  <text x="218" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3A5F">CONTEXT  —  how you authenticated</text>
  <line x1="46" y1="272" x2="390" y2="272" stroke="#E67E22" stroke-width="1" opacity="0.4"/>
  <text x="52" y="296" font-size="13" fill="#4A6080">amr</text>
  <text x="200" y="296" font-size="13" fill="#4A6080">auth methods (mfa, fido, wia…)</text>
  <text x="52" y="318" font-size="13" fill="#4A6080">acr</text>
  <text x="200" y="318" font-size="13" fill="#4A6080">authentication context class</text>
  <text x="52" y="340" font-size="13" fill="#4A6080">deviceid</text>
  <text x="200" y="340" font-size="13" fill="#4A6080">Intune device id</text>
  <text x="52" y="362" font-size="13" fill="#4A6080">compliant</text>
  <text x="200" y="362" font-size="13" fill="#4A6080">device compliance status</text>
  <text x="52" y="384" font-size="13" fill="#4A6080">ipaddr</text>
  <text x="200" y="384" font-size="13" fill="#4A6080">client IP at auth time</text>

  <rect x="46" y="402" width="344" height="36" rx="8" fill="#1F3A5F"/>
  <text x="218" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Signed by Entra — SQL verifies the signature</text>

  <!-- Right: Why each claim matters -->
  <rect x="438" y="56" width="434" height="400" rx="12" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2"/>
  <rect x="438" y="56" width="434" height="36" rx="12" fill="#1F3A5F"/>
  <text x="655" y="79" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Why each claim matters to SQL Server</text>

  <text x="454" y="116" font-size="13" font-weight="700" fill="#1A9E8F">groups →</text>
  <text x="530" y="116" font-size="13" fill="#4A6080">OrgPath security groups map directly to</text>
  <text x="530" y="134" font-size="13" fill="#4A6080">SQL roles without custom lookup tables</text>

  <line x1="454" y1="148" x2="854" y2="148" stroke="#1F3A5F" stroke-width="1" opacity="0.15"/>
  <text x="454" y="170" font-size="13" font-weight="700" fill="#1A9E8F">amr →</text>
  <text x="530" y="170" font-size="13" fill="#4A6080">SQL can require MFA in the token before</text>
  <text x="530" y="188" font-size="13" fill="#4A6080">allowing connection — OMB M-22-09</text>

  <line x1="454" y1="202" x2="854" y2="202" stroke="#1F3A5F" stroke-width="1" opacity="0.15"/>
  <text x="454" y="224" font-size="13" font-weight="700" fill="#1A9E8F">compliant →</text>
  <text x="530" y="224" font-size="13" fill="#4A6080">CA policy can block non-compliant</text>
  <text x="530" y="242" font-size="13" fill="#4A6080">devices before a token is even issued</text>

  <line x1="454" y1="256" x2="854" y2="256" stroke="#1F3A5F" stroke-width="1" opacity="0.15"/>
  <text x="454" y="278" font-size="13" font-weight="700" fill="#1A9E8F">exp →</text>
  <text x="530" y="278" font-size="13" fill="#4A6080">Short-lived credential. A stolen token</text>
  <text x="530" y="296" font-size="13" fill="#4A6080">expires in &lt;75 min with no revocation needed</text>

  <line x1="454" y1="310" x2="854" y2="310" stroke="#1F3A5F" stroke-width="1" opacity="0.15"/>
  <text x="454" y="332" font-size="13" font-weight="700" fill="#1A9E8F">upn + oid →</text>
  <text x="530" y="332" font-size="13" fill="#4A6080">Every SQL auth event is matchable to an</text>
  <text x="530" y="350" font-size="13" fill="#4A6080">Entra sign-in log row for full audit trail</text>

  <rect x="454" y="400" width="360" height="38" rx="8" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="634" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="#1A9E8F">No claim = no trust. SQL reads the token directly.</text>
</svg>
