<svg viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <defs>
    <marker id="arr-teal" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#1A9E8F"/>
    </marker>
    <marker id="arr-red" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#C0392B"/>
    </marker>
    <marker id="arr-navy" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#1F3A5F"/>
    </marker>
  </defs>

  <rect width="1400" height="760" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="700" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#1F3A5F">Before — Kerberos Client-Server</text>
  <text x="700" y="82" text-anchor="middle" font-size="16" fill="#6B7E95">The domain is the trust boundary. The KDC is the authority. Azure has no visibility.</text>

  <!-- ── CLIENT ── -->
  <rect x="60" y="180" width="240" height="220" rx="16" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2.5"/>
  <!-- monitor -->
  <rect x="110" y="210" width="140" height="88" rx="6" fill="#1F3A5F"/>
  <rect x="122" y="222" width="116" height="64" rx="3" fill="#EAF4FB"/>
  <rect x="155" y="298" width="50" height="10" rx="3" fill="#1F3A5F"/>
  <text x="180" y="340" text-anchor="middle" font-size="16" font-weight="600" fill="#1F3A5F">SQL Client</text>
  <text x="180" y="362" text-anchor="middle" font-size="13" fill="#6B7E95">Domain-joined</text>
  <text x="180" y="382" text-anchor="middle" font-size="12" fill="#6B7E95">Integrated Security=True</text>

  <!-- ── DOMAIN CONTROLLER ── -->
  <rect x="530" y="140" width="240" height="260" rx="16" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2.5"/>
  <!-- server stack -->
  <rect x="578" y="170" width="144" height="100" rx="6" fill="#1F3A5F"/>
  <rect x="590" y="182" width="120" height="14" rx="3" fill="#EAF4FB" opacity="0.6"/>
  <rect x="590" y="202" width="120" height="14" rx="3" fill="#EAF4FB" opacity="0.4"/>
  <rect x="590" y="222" width="120" height="14" rx="3" fill="#EAF4FB" opacity="0.25"/>
  <circle cx="696" cy="252" r="8" fill="#1A9E8F"/>
  <text x="650" y="298" text-anchor="middle" font-size="16" font-weight="600" fill="#1F3A5F">Domain Controller</text>
  <text x="650" y="320" text-anchor="middle" font-size="13" fill="#6B7E95">Key Distribution Center</text>
  <text x="650" y="342" text-anchor="middle" font-size="12" fill="#6B7E95">Issues Kerberos tickets</text>
  <text x="650" y="362" text-anchor="middle" font-size="12" fill="#6B7E95">Holds SPN registry</text>

  <!-- ── SQL SERVER ── -->
  <rect x="1000" y="180" width="240" height="220" rx="16" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2.5"/>
  <!-- cylinder DB icon -->
  <ellipse cx="1120" cy="222" rx="60" ry="16" fill="#1F3A5F"/>
  <rect x="1060" y="222" width="120" height="60" fill="#1F3A5F"/>
  <ellipse cx="1120" cy="282" rx="60" ry="16" fill="#2C4F7A"/>
  <ellipse cx="1120" cy="222" rx="60" ry="16" fill="#4A7AAA"/>
  <text x="1120" y="320" text-anchor="middle" font-size="16" font-weight="600" fill="#1F3A5F">SQL Server</text>
  <text x="1120" y="342" text-anchor="middle" font-size="13" fill="#6B7E95">Windows Auth mode</text>
  <text x="1120" y="362" text-anchor="middle" font-size="12" fill="#6B7E95">AD-anchored service acct</text>

  <!-- ── FLOW ARROWS ── -->

  <!-- Client → KDC: ticket request -->
  <path d="M 300 250 Q 415 180 530 230" fill="none" stroke="#1F3A5F" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#arr-navy)"/>
  <text x="415" y="195" text-anchor="middle" font-size="13" fill="#1F3A5F">① Request ticket</text>
  <text x="415" y="212" text-anchor="middle" font-size="12" fill="#6B7E95">SPN: MSSQLSvc/host:1433</text>

  <!-- KDC → Client: ticket issued -->
  <path d="M 530 280 Q 415 340 300 300" fill="none" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <text x="415" y="346" text-anchor="middle" font-size="13" fill="#1A9E8F">② Kerberos ticket issued</text>
  <text x="415" y="364" text-anchor="middle" font-size="12" fill="#6B7E95">encrypted, time-limited</text>

  <!-- Client → SQL: present ticket -->
  <line x1="300" y1="290" x2="1000" y2="290" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arr-teal)"/>
  <text x="650" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#1A9E8F">③ Present ticket at connect — no password on the wire</text>

  <!-- NTLM fallback -->
  <line x1="300" y1="330" x2="1000" y2="330" stroke="#C0392B" stroke-width="2" stroke-dasharray="9,5" marker-end="url(#arr-red)"/>
  <text x="650" y="355" text-anchor="middle" font-size="13" fill="#C0392B">If SPN missing → silent NTLM fallback (no error, no log entry)</text>

  <!-- Domain boundary line -->
  <rect x="40" y="120" width="1320" height="380" rx="12" fill="none" stroke="#1F3A5F" stroke-width="1.5" stroke-dasharray="12,6" opacity="0.4"/>
  <text x="700" y="118" text-anchor="middle" font-size="13" fill="#1F3A5F" opacity="0.6">Active Directory domain boundary — all parties inside</text>

  <!-- ── BOTTOM MESSAGE ── -->
  <rect x="40" y="540" width="1320" height="184" rx="12" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1.5"/>

  <text x="350" y="575" text-anchor="middle" font-size="15" font-weight="700" fill="#1F3A5F">What works well</text>
  <text x="350" y="600" text-anchor="middle" font-size="14" fill="#4A6080">No password on the network</text>
  <text x="350" y="622" text-anchor="middle" font-size="14" fill="#4A6080">Mutual authentication</text>
  <text x="350" y="644" text-anchor="middle" font-size="14" fill="#4A6080">Central policy via AD</text>
  <text x="350" y="666" text-anchor="middle" font-size="14" fill="#4A6080">Works for domain-joined world</text>
  <text x="350" y="698" text-anchor="middle" font-size="12" fill="#1A9E8F" font-style="italic">Correct engineering for its time</text>

  <line x1="560" y1="558" x2="560" y2="708" stroke="#CCCCCC" stroke-width="1"/>

  <text x="840" y="575" text-anchor="middle" font-size="15" font-weight="700" fill="#C0392B">What it cannot provide</text>
  <text x="840" y="600" text-anchor="middle" font-size="14" fill="#4A6080">Conditional Access — CA engine never sees Kerberos</text>
  <text x="840" y="622" text-anchor="middle" font-size="14" fill="#4A6080">Phishing-resistant MFA — no claim in the ticket</text>
  <text x="840" y="644" text-anchor="middle" font-size="14" fill="#4A6080">Sign-in risk evaluation — no Entra signal</text>
  <text x="840" y="666" text-anchor="middle" font-size="14" fill="#4A6080">Device compliance — not in the auth path</text>
  <text x="840" y="698" text-anchor="middle" font-size="12" fill="#C0392B" font-style="italic">OMB M-22-09 zero-trust compliance: not achievable</text>

</svg>
