<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <rect x="0" y="0" width="900" height="38" fill="#1F3A5F"/>
  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">AFTER — Application-Aware Token  (3 of 3: What You Gain)</text>

  <!-- Top-left: Conditional Access -->
  <rect x="28" y="56" width="412" height="190" rx="12" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="2"/>
  <rect x="28" y="56" width="412" height="34" rx="12" fill="#1A9E8F"/>
  <text x="234" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">✓  Conditional Access — Full Coverage</text>
  <text x="234" y="118" text-anchor="middle" font-size="13" fill="#4A6080">Every SQL connection passes through Entra CA.</text>
  <text x="234" y="142" text-anchor="middle" font-size="13" fill="#4A6080">Policy is evaluated before the token is issued —</text>
  <text x="234" y="166" text-anchor="middle" font-size="13" fill="#4A6080">MFA, device compliance, location, sign-in risk.</text>
  <text x="234" y="224" text-anchor="middle" font-size="12" fill="#1A9E8F" font-style="italic">A blocked auth never reaches SQL Server.</text>

  <!-- Top-right: Phishing-Resistant MFA -->
  <rect x="460" y="56" width="412" height="190" rx="12" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="2"/>
  <rect x="460" y="56" width="412" height="34" rx="12" fill="#1A9E8F"/>
  <text x="666" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">✓  Phishing-Resistant MFA</text>
  <text x="666" y="118" text-anchor="middle" font-size="13" fill="#4A6080">The amr claim in the token records the method</text>
  <text x="666" y="142" text-anchor="middle" font-size="13" fill="#4A6080">used: FIDO2, Windows Hello, certificate.</text>
  <text x="666" y="166" text-anchor="middle" font-size="13" fill="#4A6080">SQL can enforce this claim at connection time.</text>
  <text x="666" y="224" text-anchor="middle" font-size="12" fill="#1A9E8F" font-style="italic">OMB M-22-09 requirement satisfied.</text>

  <!-- Bottom-left: Complete Audit Trail -->
  <rect x="28" y="266" width="412" height="190" rx="12" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="2"/>
  <rect x="28" y="266" width="412" height="34" rx="12" fill="#1A9E8F"/>
  <text x="234" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">✓  Complete Audit Trail</text>
  <text x="234" y="328" text-anchor="middle" font-size="13" fill="#4A6080">Every auth appears in the Entra sign-in log.</text>
  <text x="234" y="352" text-anchor="middle" font-size="13" fill="#4A6080">upn + oid tie the SQL session to the log row.</text>
  <text x="234" y="376" text-anchor="middle" font-size="13" fill="#4A6080">Anomaly detection fires on the same events.</text>
  <text x="234" y="434" text-anchor="middle" font-size="12" fill="#1A9E8F" font-style="italic">Zero blind spots — including from outside the network.</text>

  <!-- Bottom-right: OrgPath -->
  <rect x="460" y="266" width="412" height="190" rx="12" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="2"/>
  <rect x="460" y="266" width="412" height="34" rx="12" fill="#1A9E8F"/>
  <text x="666" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">✓  OrgPath Drives SQL Access</text>
  <text x="666" y="328" text-anchor="middle" font-size="13" fill="#4A6080">OrgPath maps org hierarchy to Entra groups.</text>
  <text x="666" y="352" text-anchor="middle" font-size="13" fill="#4A6080">Groups appear in the token's groups claim.</text>
  <text x="666" y="376" text-anchor="middle" font-size="13" fill="#4A6080">SQL role membership follows org structure.</text>
  <text x="666" y="434" text-anchor="middle" font-size="12" fill="#1A9E8F" font-style="italic">ADR-036: extensionAttributes bind the path.</text>
</svg>
