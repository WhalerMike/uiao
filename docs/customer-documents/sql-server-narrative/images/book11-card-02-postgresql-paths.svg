<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <rect width="900" height="540" fill="white"/>

  <!-- title bar -->
  <rect x="0" y="0" width="900" height="52" fill="#1F3A5F"/>
  <text x="450" y="22" text-anchor="middle" fill="white" font-size="15" font-weight="bold">POSTGRESQL IN THE FEDERAL STACK</text>
  <text x="450" y="42" text-anchor="middle" fill="#A8D5D1" font-size="11">Four FedRAMP-authorized paths · Three vendor migration toolchains</text>

  <!-- SECTION: FedRAMP Paths -->
  <text x="24" y="76" fill="#1F3A5F" font-size="11" font-weight="bold">FEDRAMP-AUTHORIZED HOSTING PATHS</text>
  <line x1="24" y1="80" x2="876" y2="80" stroke="#1F3A5F" stroke-width="1"/>

  <!-- Path 1: Amazon RDS -->
  <rect x="20" y="88" width="200" height="108" fill="#F0FAF9" rx="4" stroke="#1A9E8F" stroke-width="1.5"/>
  <rect x="20" y="88" width="200" height="26" fill="#1A9E8F" rx="4"/>
  <rect x="20" y="102" width="200" height="12" fill="#1A9E8F"/>
  <text x="120" y="106" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Amazon RDS for PostgreSQL</text>
  <text x="120" y="122" text-anchor="middle" fill="#1F3A5F" font-size="9">AWS GovCloud (US)</text>
  <text x="120" y="137" text-anchor="middle" fill="#1F3A5F" font-size="9">FedRAMP authorized boundary</text>
  <text x="120" y="152" text-anchor="middle" fill="#1F3A5F" font-size="9">Managed: patch, backup, HA</text>
  <text x="120" y="167" text-anchor="middle" fill="#1F3A5F" font-size="9">Lowest admin overhead path</text>
  <text x="120" y="185" text-anchor="middle" fill="#1A9E8F" font-size="8" font-weight="bold">✓ FedRAMP Authorized</text>

  <!-- Path 2: Aurora PostgreSQL -->
  <rect x="232" y="88" width="200" height="108" fill="#F0FAF9" rx="4" stroke="#1A9E8F" stroke-width="1.5"/>
  <rect x="232" y="88" width="200" height="26" fill="#1A9E8F" rx="4"/>
  <rect x="232" y="102" width="200" height="12" fill="#1A9E8F"/>
  <text x="332" y="106" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Amazon Aurora PostgreSQL</text>
  <text x="332" y="122" text-anchor="middle" fill="#1F3A5F" font-size="9">AWS GovCloud (US)</text>
  <text x="332" y="137" text-anchor="middle" fill="#1F3A5F" font-size="9">Cloud-native distributed storage</text>
  <text x="332" y="152" text-anchor="middle" fill="#1F3A5F" font-size="9">Up to 15 read replicas</text>
  <text x="332" y="167" text-anchor="middle" fill="#1F3A5F" font-size="9">Babelfish: T-SQL wire protocol</text>
  <text x="332" y="185" text-anchor="middle" fill="#1A9E8F" font-size="8" font-weight="bold">✓ FedRAMP Authorized · AWS Migration Playbook</text>

  <!-- Path 3: Crunchy on ROSA -->
  <rect x="444" y="88" width="214" height="108" fill="#EAF4FF" rx="4" stroke="#1F3A5F" stroke-width="2"/>
  <rect x="444" y="88" width="214" height="26" fill="#1F3A5F" rx="4"/>
  <rect x="444" y="102" width="214" height="12" fill="#1F3A5F"/>
  <text x="551" y="106" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Crunchy PostgreSQL on ROSA GovCloud</text>
  <text x="551" y="122" text-anchor="middle" fill="#1F3A5F" font-size="9">Red Hat OpenShift on AWS GovCloud</text>
  <text x="551" y="137" text-anchor="middle" fill="#1F3A5F" font-size="9">OpenShift-certified operator</text>
  <text x="551" y="152" text-anchor="middle" fill="#1F3A5F" font-size="9">Kubernetes-native: pgBackRest, pgBouncer</text>
  <text x="551" y="167" text-anchor="middle" fill="#1F3A5F" font-size="9">Aligns with agency OpenShift footprint</text>
  <text x="551" y="185" text-anchor="middle" fill="#1F3A5F" font-size="8" font-weight="bold">★ Primary path for this agency</text>

  <!-- Path 4: Azure Database -->
  <rect x="670" y="88" width="210" height="108" fill="#F0FAF9" rx="4" stroke="#1A9E8F" stroke-width="1.5"/>
  <rect x="670" y="88" width="210" height="26" fill="#1A9E8F" rx="4"/>
  <rect x="670" y="102" width="210" height="12" fill="#1A9E8F"/>
  <text x="775" y="106" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Azure Database for PostgreSQL</text>
  <text x="775" y="122" text-anchor="middle" fill="#1F3A5F" font-size="9">GCC Moderate boundary</text>
  <text x="775" y="137" text-anchor="middle" fill="#1F3A5F" font-size="9">Flexible Server — managed PaaS</text>
  <text x="775" y="152" text-anchor="middle" fill="#1F3A5F" font-size="9">Co-located with Azure workloads</text>
  <text x="775" y="167" text-anchor="middle" fill="#1F3A5F" font-size="9">Data sovereignty / network topology</text>
  <text x="775" y="185" text-anchor="middle" fill="#1A9E8F" font-size="8" font-weight="bold">✓ GCC Moderate authorized</text>

  <!-- SECTION: Migration Toolchains -->
  <text x="24" y="218" fill="#1F3A5F" font-size="11" font-weight="bold">VENDOR MIGRATION TOOLCHAINS — SQL SERVER → POSTGRESQL</text>
  <line x1="24" y1="222" x2="876" y2="222" stroke="#1F3A5F" stroke-width="1"/>

  <!-- Toolchain headers -->
  <rect x="20" y="230" width="270" height="168" fill="white" rx="4" stroke="#1F3A5F" stroke-width="1"/>
  <rect x="20" y="230" width="270" height="26" fill="#1F3A5F" rx="4"/>
  <rect x="20" y="244" width="270" height="12" fill="#1F3A5F"/>
  <text x="155" y="248" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Microsoft — SSMA for PostgreSQL</text>
  <text x="35" y="272" fill="#1F3A5F" font-size="9" font-weight="bold">Tool:</text>
  <text x="80" y="272" fill="#555" font-size="9">SQL Server Migration Assistant (free)</text>
  <text x="35" y="289" fill="#1F3A5F" font-size="9" font-weight="bold">Schema:</text>
  <text x="92" y="289" fill="#555" font-size="9">DDL + T-SQL → PL/pgSQL conversion</text>
  <text x="35" y="306" fill="#1F3A5F" font-size="9" font-weight="bold">Output:</text>
  <text x="87" y="306" fill="#555" font-size="9">Assessment report: auto vs. manual effort</text>
  <text x="35" y="323" fill="#1F3A5F" font-size="9" font-weight="bold">Use first:</text>
  <text x="97" y="323" fill="#555" font-size="9">scopes manual conversion work</text>
  <text x="35" y="340" fill="#1F3A5F" font-size="9" font-weight="bold">Doc:</text>
  <text x="70" y="340" fill="#1A9E8F" font-size="9">learn.microsoft.com/en-us/data-migration/</text>
  <rect x="30" y="352" width="250" height="38" fill="#F5F9FF" rx="3" stroke="#1F3A5F" stroke-width="0.5"/>
  <text x="155" y="368" text-anchor="middle" fill="#1F3A5F" font-size="9">Run SSMA first — its assessment output</text>
  <text x="155" y="381" text-anchor="middle" fill="#1F3A5F" font-size="9">is the input to the migration plan.</text>

  <rect x="305" y="230" width="285" height="168" fill="white" rx="4" stroke="#1F3A5F" stroke-width="1"/>
  <rect x="305" y="230" width="285" height="26" fill="#1F3A5F" rx="4"/>
  <rect x="305" y="244" width="285" height="12" fill="#1F3A5F"/>
  <text x="447" y="248" text-anchor="middle" fill="white" font-size="11" font-weight="bold">AWS — DMS + Schema Conversion Tool</text>
  <text x="320" y="272" fill="#1F3A5F" font-size="9" font-weight="bold">SCT:</text>
  <text x="355" y="272" fill="#555" font-size="9">schema + stored procedure conversion</text>
  <text x="320" y="289" fill="#1F3A5F" font-size="9" font-weight="bold">DMS CDC:</text>
  <text x="380" y="289" fill="#555" font-size="9">continuous data replication, minimal downtime</text>
  <text x="320" y="306" fill="#1F3A5F" font-size="9" font-weight="bold">Parallel:</text>
  <text x="372" y="306" fill="#555" font-size="9">SQL Server stays live; CDC keeps PostgreSQL</text>
  <text x="372" y="319" fill="#555" font-size="9">current until cutover</text>
  <text x="320" y="336" fill="#1F3A5F" font-size="9" font-weight="bold">Playbook:</text>
  <text x="375" y="336" fill="#1A9E8F" font-size="9">SQL Server to Aurora PostgreSQL</text>
  <text x="375" y="349" fill="#1A9E8F" font-size="9">Migration Playbook (docs.aws.amazon.com)</text>
  <rect x="315" y="358" width="265" height="32" fill="#F5F9FF" rx="3" stroke="#1F3A5F" stroke-width="0.5"/>
  <text x="447" y="374" text-anchor="middle" fill="#1F3A5F" font-size="9">DMS CDC enables the parallel-run pattern:</text>
  <text x="447" y="387" text-anchor="middle" fill="#1F3A5F" font-size="9">never drop until validation is complete.</text>

  <rect x="605" y="230" width="275" height="168" fill="white" rx="4" stroke="#1F3A5F" stroke-width="1"/>
  <rect x="605" y="230" width="275" height="26" fill="#1F3A5F" rx="4"/>
  <rect x="605" y="244" width="275" height="12" fill="#1F3A5F"/>
  <text x="742" y="248" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Red Hat — Migration Toolkit for Apps</text>
  <text x="620" y="272" fill="#1F3A5F" font-size="9" font-weight="bold">Layer:</text>
  <text x="665" y="272" fill="#555" font-size="9">application code (not database schema)</text>
  <text x="620" y="289" fill="#1F3A5F" font-size="9" font-weight="bold">Finds:</text>
  <text x="662" y="289" fill="#555" font-size="9">SQL Server JDBC drivers, T-SQL client</text>
  <text x="662" y="302" fill="#555" font-size="9">patterns, connection string assumptions</text>
  <text x="620" y="319" fill="#1F3A5F" font-size="9" font-weight="bold">Output:</text>
  <text x="665" y="319" fill="#555" font-size="9">refactoring report per app, per API</text>
  <text x="620" y="336" fill="#1F3A5F" font-size="9" font-weight="bold">Pairs with:</text>
  <text x="677" y="336" fill="#555" font-size="9">SSMA or SCT (different migration layer)</text>
  <text x="620" y="353" fill="#1F3A5F" font-size="9" font-weight="bold">Doc:</text>
  <text x="655" y="353" fill="#1A9E8F" font-size="9">docs.redhat.com (MTA 7.1)</text>
  <rect x="615" y="362" width="255" height="28" fill="#F5F9FF" rx="3" stroke="#1F3A5F" stroke-width="0.5"/>
  <text x="742" y="374" text-anchor="middle" fill="#1F3A5F" font-size="9">SSMA / SCT migrates the database.</text>
  <text x="742" y="387" text-anchor="middle" fill="#1F3A5F" font-size="9">MTA migrates the app that talked to it.</text>

  <!-- SSOT capabilities strip -->
  <rect x="20" y="412" width="860" height="92" fill="#1F3A5F" rx="4"/>
  <text x="450" y="432" text-anchor="middle" fill="white" font-size="11" font-weight="bold">POSTGRESQL SSOT-RELEVANT CAPABILITIES</text>

  <!-- 5 capability boxes -->
  <rect x="28" y="440" width="155" height="56" fill="#1A9E8F" rx="3"/>
  <text x="105" y="456" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Logical Replication</text>
  <text x="105" y="470" text-anchor="middle" fill="white" font-size="8">Publish data streams</text>
  <text x="105" y="483" text-anchor="middle" fill="white" font-size="8">across instances → one target</text>

  <rect x="191" y="440" width="155" height="56" fill="#1A9E8F" rx="3"/>
  <text x="268" y="456" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Row-Level Security</text>
  <text x="268" y="470" text-anchor="middle" fill="white" font-size="8">OrgPath-driven row filtering</text>
  <text x="268" y="483" text-anchor="middle" fill="white" font-size="8">per session role — no extra silos</text>

  <rect x="354" y="440" width="155" height="56" fill="#1A9E8F" rx="3"/>
  <text x="431" y="456" text-anchor="middle" fill="white" font-size="9" font-weight="bold">JSONB</text>
  <text x="431" y="470" text-anchor="middle" fill="white" font-size="8">Semi-structured data with</text>
  <text x="431" y="483" text-anchor="middle" fill="white" font-size="8">full GIN index support</text>

  <rect x="517" y="440" width="155" height="56" fill="#1A9E8F" rx="3"/>
  <text x="594" y="456" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Foreign Data Wrappers</text>
  <text x="594" y="470" text-anchor="middle" fill="white" font-size="8">Query SQL Server / Oracle</text>
  <text x="594" y="483" text-anchor="middle" fill="white" font-size="8">as local tables during migration</text>

  <rect x="680" y="440" width="192" height="56" fill="#1A9E8F" rx="3"/>
  <text x="776" y="456" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Schema-Based Tenancy</text>
  <text x="776" y="470" text-anchor="middle" fill="white" font-size="8">Hundreds of logical databases</text>
  <text x="776" y="483" text-anchor="middle" fill="white" font-size="8">on one physical instance</text>

  <!-- footer -->
  <rect x="0" y="510" width="900" height="30" fill="#1F3A5F"/>
  <text x="450" y="529" text-anchor="middle" fill="white" font-size="10">One platform · one licensing position · one operations team — not forty independently licensed silos.</text>
</svg>
