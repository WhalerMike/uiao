<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <rect width="900" height="500" fill="white"/>

  <!-- title bar -->
  <rect x="0" y="0" width="900" height="52" fill="#1F3A5F"/>
  <text x="450" y="22" text-anchor="middle" fill="white" font-size="15" font-weight="bold">ORACLE AS THE ENTERPRISE ALTERNATIVE</text>
  <text x="450" y="42" text-anchor="middle" fill="#A8D5D1" font-size="11">When to choose Oracle · Three authorized deployment paths</text>

  <!-- WHEN column -->
  <rect x="20" y="64" width="240" height="390" fill="#FFF9F0" rx="4" stroke="#D4831A" stroke-width="1.5"/>
  <rect x="20" y="64" width="240" height="30" fill="#D4831A" rx="4"/>
  <rect x="20" y="82" width="240" height="12" fill="#D4831A"/>
  <text x="140" y="84" text-anchor="middle" fill="white" font-size="11" font-weight="bold">WHEN ORACLE IS CORRECT</text>

  <text x="35" y="116" fill="#1F3A5F" font-size="9" font-weight="bold">Existing Oracle estate</text>
  <text x="35" y="131" fill="#555" font-size="9">Agency already operates Oracle.</text>
  <text x="35" y="144" fill="#555" font-size="9">Adding PostgreSQL = third platform.</text>
  <text x="35" y="157" fill="#555" font-size="9">Consolidation onto Oracle reduces</text>
  <text x="35" y="170" fill="#555" font-size="9">platform count; PostgreSQL does not.</text>

  <line x1="35" y1="182" x2="245" y2="182" stroke="#D4831A" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="35" y="200" fill="#1F3A5F" font-size="9" font-weight="bold">PL/SQL corpus too large to translate</text>
  <text x="35" y="215" fill="#555" font-size="9">Complex PL/SQL logic translates</text>
  <text x="35" y="228" fill="#555" font-size="9">to Oracle PL/SQL with lower effort</text>
  <text x="35" y="241" fill="#555" font-size="9">than to PL/pgSQL in many cases.</text>

  <line x1="35" y1="253" x2="245" y2="253" stroke="#D4831A" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="35" y="271" fill="#1F3A5F" font-size="9" font-weight="bold">Oracle-credentialed DBA team</text>
  <text x="35" y="286" fill="#555" font-size="9">30 years of Oracle DBA expertise</text>
  <text x="35" y="299" fill="#555" font-size="9">is not retooled to PostgreSQL</text>
  <text x="35" y="312" fill="#555" font-size="9">without a full hiring/training cycle.</text>

  <line x1="35" y1="324" x2="245" y2="324" stroke="#D4831A" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="35" y="342" fill="#1F3A5F" font-size="9" font-weight="bold">Existing Oracle site license</text>
  <text x="35" y="357" fill="#555" font-size="9">Agencies with Oracle Enterprise</text>
  <text x="35" y="370" fill="#555" font-size="9">licenses covering Autonomous DB</text>
  <text x="35" y="383" fill="#555" font-size="9">have already paid for Oracle.</text>
  <text x="35" y="396" fill="#555" font-size="9">Incremental SQL Server workloads</text>
  <text x="35" y="409" fill="#555" font-size="9">add near-zero licensing cost.</text>

  <rect x="30" y="428" width="220" height="18" fill="#D4831A" rx="3"/>
  <text x="140" y="441" text-anchor="middle" fill="white" font-size="9">The goal is fewer platforms, not the best platform.</text>

  <!-- CENTER: OpenShift Virtualization -->
  <rect x="276" y="64" width="292" height="390" fill="#F0FAF9" rx="4" stroke="#1A9E8F" stroke-width="1.5"/>
  <rect x="276" y="64" width="292" height="30" fill="#1A9E8F" rx="4"/>
  <rect x="276" y="82" width="292" height="12" fill="#1A9E8F"/>
  <text x="422" y="84" text-anchor="middle" fill="white" font-size="11" font-weight="bold">ORACLE 19c ON RED HAT OPENSHIFT</text>

  <text x="422" y="114" text-anchor="middle" fill="#1F3A5F" font-size="10" font-weight="bold">OpenShift Virtualization (KubeVirt)</text>
  <text x="422" y="130" text-anchor="middle" fill="#555" font-size="9">Oracle 19c runs as a VM alongside</text>
  <text x="422" y="143" text-anchor="middle" fill="#555" font-size="9">containerized workloads — same</text>
  <text x="422" y="156" text-anchor="middle" fill="#555" font-size="9">OpenShift cluster, same control plane</text>

  <!-- VM box -->
  <rect x="296" y="168" width="252" height="72" fill="white" stroke="#1A9E8F" stroke-width="1" rx="3"/>
  <text x="422" y="186" text-anchor="middle" fill="#1F3A5F" font-size="9" font-weight="bold">Oracle Database 19c (VM)</text>
  <text x="422" y="202" text-anchor="middle" fill="#555" font-size="9">Oracle Database Operator for Kubernetes</text>
  <text x="422" y="218" text-anchor="middle" fill="#555" font-size="9">manages lifecycle via OpenShift OLM</text>
  <text x="422" y="232" text-anchor="middle" fill="#1A9E8F" font-size="9">Red Hat reference architecture: perf validated</text>

  <line x1="296" y1="252" x2="548" y2="252" stroke="#1A9E8F" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="422" y="274" text-anchor="middle" fill="#1F3A5F" font-size="10" font-weight="bold">Oracle Database Appliance (ODA)</text>
  <text x="422" y="290" text-anchor="middle" fill="#555" font-size="9">Red Hat OpenShift 4.21 supported</text>
  <text x="422" y="305" text-anchor="middle" fill="#555" font-size="9">on Oracle engineered hardware</text>
  <text x="422" y="320" text-anchor="middle" fill="#555" font-size="9">Kubernetes workloads on same appliance</text>
  <text x="422" y="335" text-anchor="middle" fill="#555" font-size="9">that runs Oracle Database</text>

  <line x1="296" y1="348" x2="548" y2="348" stroke="#1A9E8F" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="422" y="368" text-anchor="middle" fill="#1F3A5F" font-size="10" font-weight="bold">Migration Toolchain (App Layer)</text>
  <text x="422" y="384" text-anchor="middle" fill="#555" font-size="9">Red Hat MTA: identifies SQL Server</text>
  <text x="422" y="399" text-anchor="middle" fill="#555" font-size="9">JDBC / connection-string dependencies</text>
  <text x="422" y="414" text-anchor="middle" fill="#555" font-size="9">in application code → refactoring report</text>

  <rect x="286" y="428" width="272" height="18" fill="#1A9E8F" rx="3"/>
  <text x="422" y="441" text-anchor="middle" fill="white" font-size="9">No separate VM fleet outside OpenShift required.</text>

  <!-- RIGHT: Oracle Cloud / OCI GovCloud -->
  <rect x="584" y="64" width="296" height="390" fill="#F0FAF9" rx="4" stroke="#1A9E8F" stroke-width="1.5"/>
  <rect x="584" y="64" width="296" height="30" fill="#1A9E8F" rx="4"/>
  <rect x="584" y="82" width="296" height="12" fill="#1A9E8F"/>
  <text x="732" y="84" text-anchor="middle" fill="white" font-size="11" font-weight="bold">ORACLE CLOUD — OCI US GOVERNMENT</text>

  <rect x="598" y="104" width="268" height="60" fill="white" stroke="#1F3A5F" stroke-width="1" rx="3"/>
  <text x="732" y="122" text-anchor="middle" fill="#1F3A5F" font-size="10" font-weight="bold">FedRAMP High JAB Authorization</text>
  <text x="732" y="138" text-anchor="middle" fill="#555" font-size="9">Oracle Cloud Infrastructure US Government Cloud</text>
  <text x="732" y="153" text-anchor="middle" fill="#555" font-size="9">Covers Moderate and High impact agencies</text>

  <line x1="598" y1="176" x2="866" y2="176" stroke="#1A9E8F" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="732" y="198" text-anchor="middle" fill="#1F3A5F" font-size="10" font-weight="bold">Oracle Autonomous Database</text>
  <text x="732" y="214" text-anchor="middle" fill="#555" font-size="9">Available in OCI US Government Cloud</text>
  <text x="732" y="229" text-anchor="middle" fill="#555" font-size="9">FedRAMP authorized</text>
  <text x="732" y="245" text-anchor="middle" fill="#555" font-size="9">Self-patching · self-tuning · self-HA</text>
  <text x="732" y="261" text-anchor="middle" fill="#555" font-size="9">Managed model comparable to Amazon RDS</text>
  <text x="732" y="277" text-anchor="middle" fill="#555" font-size="9">with full Oracle SQL and PL/SQL compatibility</text>

  <line x1="598" y1="292" x2="866" y2="292" stroke="#1A9E8F" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="732" y="314" text-anchor="middle" fill="#1F3A5F" font-size="10" font-weight="bold">Oracle Database Migration Service</text>
  <text x="732" y="330" text-anchor="middle" fill="#555" font-size="9">Available in OCI US Government Cloud</text>
  <text x="732" y="346" text-anchor="middle" fill="#555" font-size="9">Migration toolchain for SQL Server source</text>
  <text x="732" y="362" text-anchor="middle" fill="#555" font-size="9">to Oracle target on OCI</text>

  <line x1="598" y1="376" x2="866" y2="376" stroke="#1A9E8F" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="732" y="398" text-anchor="middle" fill="#1F3A5F" font-size="10" font-weight="bold">Schema Migration Tool</text>
  <text x="732" y="414" text-anchor="middle" fill="#555" font-size="9">Oracle SQL Developer Migration Workbench</text>
  <text x="732" y="430" text-anchor="middle" fill="#555" font-size="9">T-SQL → Oracle DDL + PL/SQL (free)</text>
  <text x="732" y="446" text-anchor="middle" fill="#555" font-size="9">AWS DMS also supports Oracle as target</text>

  <!-- footer -->
  <rect x="0" y="462" width="900" height="38" fill="#1F3A5F"/>
  <text x="450" y="479" text-anchor="middle" fill="white" font-size="10">PostgreSQL or Oracle — the destination is the same: one authoritative database platform, one data authority model.</text>
  <text x="450" y="495" text-anchor="middle" fill="#A8D5D1" font-size="9">The choice is agency-specific. The goal is not.</text>
</svg>
