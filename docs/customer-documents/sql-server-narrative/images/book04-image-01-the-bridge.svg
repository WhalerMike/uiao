<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="brKeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A66"/>
      <stop offset="1" stop-color="#0D1B2E"/>
    </linearGradient>
    <radialGradient id="brGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D7F2EE" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <marker id="brTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="64" y="78" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="36" fill="#0D1B2E">Arc is the bridge, not the destination</text>
  <text x="64" y="112" font-size="18" fill="#6B7A8D">The Connected Machine agent gives the host a cloud-native identity — the span that lets the SQL engine reach the token plane.</text>

  <!-- right-side glow behind the identity plane -->
  <ellipse cx="1018" cy="368" rx="250" ry="190" fill="url(#brGlow)"/>

  <!-- ground / water line -->
  <line x1="48" y1="556" x2="1232" y2="556" stroke="#E3E8EF" stroke-width="2"/>

  <!-- LEFT: the SQL host island, no cloud identity -->
  <ellipse cx="206" cy="556" rx="150" ry="24" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <rect x="146" y="420" width="120" height="136" rx="6" fill="url(#brKeep)"/>
  <text x="206" y="462" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="19" fill="#FFFFFF">SQL Server</text>
  <text x="206" y="488" text-anchor="middle" font-size="14" fill="#D7F2EE">host</text>
  <text x="206" y="522" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#A9B8CA">no cloud identity yet</text>
  <text x="206" y="602" text-anchor="middle" font-size="14" fill="#6B7A8D">on-premises / domain-joined host</text>

  <!-- BRIDGE deck with three piers, rising toward the plane -->
  <path d="M298,548 L820,468 L820,452 L298,528 Z" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <!-- piers down to the water line -->
  <rect x="400" y="514" width="10" height="42" fill="#A9B8CA"/>
  <rect x="560" y="490" width="10" height="66" fill="#A9B8CA"/>
  <rect x="720" y="466" width="10" height="90" fill="#A9B8CA"/>
  <!-- the agent travelling the span -->
  <rect x="436" y="356" width="248" height="60" rx="8" fill="#1E8C8C"/>
  <text x="560" y="382" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="16" fill="#FFFFFF">Connected Machine agent</text>
  <text x="560" y="404" text-anchor="middle" font-size="13" fill="#D7F2EE">the span itself</text>
  <line x1="318" y1="500" x2="812" y2="424" stroke="#1E8C8C" stroke-width="3" marker-end="url(#brTeal)"/>
  <text x="560" y="606" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8C8C">establishes an ARM resource identity</text>
  <text x="560" y="628" text-anchor="middle" font-size="13" fill="#6B7A8D">+ a system-assigned Managed Identity served through the local IMDS endpoint</text>

  <!-- RIGHT: the identity plane slab + Entra card -->
  <path d="M866,452 L1186,452 L1226,506 L820,506 Z" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5" opacity="0.9"/>
  <text x="1022" y="534" text-anchor="middle" font-size="14" fill="#6B7A8D">the identity plane</text>

  <rect x="896" y="262" width="252" height="104" rx="20" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1022" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="23" fill="#0D1B2E">Microsoft Entra ID</text>
  <text x="1022" y="334" text-anchor="middle" font-size="14" fill="#1E8C8C">issues the tokens the engine accepts</text>
  <line x1="924" y1="366" x2="924" y2="452" stroke="#0D1B2E" stroke-width="1.5"/>
  <line x1="1120" y1="366" x2="1120" y2="452" stroke="#0D1B2E" stroke-width="1.5"/>

  <text x="640" y="688" text-anchor="middle" font-size="12" fill="#6B7A8D">Illustrative — Arc-as-bridge is a metaphor (ADR-002); the figure does not depict a physical topology.</text>
</svg>
