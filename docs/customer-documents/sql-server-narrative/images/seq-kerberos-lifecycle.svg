<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="900" height="600" fill="#FFFFFF"/>
  <rect x="0" y="0" width="900" height="38" fill="#1F3A5F"/>
  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Kerberos Session Lifecycle  —  Sequence Diagram</text>

  <!-- Actor boxes -->
  <rect x="30" y="52" width="160" height="44" rx="8" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2"/>
  <text x="110" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A5F">SQL Client</text>

  <rect x="370" y="52" width="160" height="44" rx="8" fill="#FEF0EE" stroke="#C0392B" stroke-width="2"/>
  <text x="450" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#C0392B">Domain Controller</text>
  <text x="450" y="88" text-anchor="middle" font-size="11" fill="#C0392B">(KDC)</text>

  <rect x="710" y="52" width="160" height="44" rx="8" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2"/>
  <text x="790" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A5F">SQL Server</text>

  <!-- Lifelines -->
  <line x1="110" y1="96" x2="110" y2="530" stroke="#1F3A5F" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="450" y1="96" x2="450" y2="530" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="790" y1="96" x2="790" y2="530" stroke="#1F3A5F" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="na" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#1F3A5F"/></marker>
    <marker id="ra" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#C0392B"/></marker>
    <marker id="da" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#4A6080"/></marker>
  </defs>

  <!-- Step 1: AS-REQ -->
  <line x1="110" y1="130" x2="440" y2="130" stroke="#1F3A5F" stroke-width="2" marker-end="url(#na)"/>
  <rect x="180" y="112" width="120" height="18" rx="4" fill="#FFFFFF"/>
  <text x="240" y="125" text-anchor="middle" font-size="12" fill="#1F3A5F">① AS-REQ</text>
  <text x="240" y="146" text-anchor="middle" font-size="11" fill="#6B7E95">(authenticate me)</text>

  <!-- Step 2: TGT returned -->
  <line x1="450" y1="178" x2="120" y2="178" stroke="#C0392B" stroke-width="2" marker-end="url(#ra)"/>
  <rect x="226" y="160" width="148" height="18" rx="4" fill="#FFFFFF"/>
  <text x="300" y="173" text-anchor="middle" font-size="12" fill="#C0392B">② TGT issued</text>
  <text x="300" y="194" text-anchor="middle" font-size="11" fill="#6B7E95">(Ticket Granting Ticket)</text>

  <!-- Step 3: TGS-REQ -->
  <line x1="110" y1="226" x2="440" y2="226" stroke="#1F3A5F" stroke-width="2" marker-end="url(#na)"/>
  <rect x="160" y="208" width="174" height="18" rx="4" fill="#FFFFFF"/>
  <text x="247" y="221" text-anchor="middle" font-size="12" fill="#1F3A5F">③ TGS-REQ + SPN</text>
  <!-- SPN badge -->
  <rect x="310" y="232" width="176" height="22" rx="6" fill="#FFF8EE" stroke="#E67E22" stroke-width="1.5"/>
  <text x="398" y="247" text-anchor="middle" font-size="11" fill="#E67E22">SPN: MSSQLSvc/host:1433</text>

  <!-- Step 4: Service ticket -->
  <line x1="450" y1="278" x2="120" y2="278" stroke="#C0392B" stroke-width="2" marker-end="url(#ra)"/>
  <rect x="210" y="260" width="170" height="18" rx="4" fill="#FFFFFF"/>
  <text x="295" y="273" text-anchor="middle" font-size="12" fill="#C0392B">④ service ticket issued</text>
  <text x="295" y="294" text-anchor="middle" font-size="11" fill="#6B7E95">(encrypted for SQL Server)</text>

  <!-- Step 5: AP-REQ to SQL -->
  <line x1="110" y1="326" x2="780" y2="326" stroke="#1F3A5F" stroke-width="2" marker-end="url(#na)"/>
  <rect x="340" y="308" width="240" height="18" rx="4" fill="#FFFFFF"/>
  <text x="460" y="321" text-anchor="middle" font-size="12" fill="#1F3A5F">⑤ AP-REQ (present service ticket)</text>

  <!-- Step 6: SQL validates (activation box) -->
  <rect x="774" y="344" width="32" height="64" rx="4" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2"/>
  <text x="830" y="364" font-size="12" fill="#1F3A5F">SQL decrypts</text>
  <text x="830" y="382" font-size="12" fill="#1F3A5F">ticket with its</text>
  <text x="830" y="400" font-size="12" fill="#1F3A5F">service key</text>

  <!-- Step 7: AP-REP -->
  <line x1="780" y1="418" x2="120" y2="418" stroke="#1F3A5F" stroke-width="2" marker-end="url(#na)"/>
  <rect x="330" y="400" width="280" height="18" rx="4" fill="#FFFFFF"/>
  <text x="470" y="413" text-anchor="middle" font-size="12" fill="#1F3A5F">⑥ AP-REP — connection open</text>

  <!-- NTLM fallback note -->
  <rect x="28" y="452" width="844" height="62" rx="10" fill="#FEF0EE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="450" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#C0392B">NTLM Silent Fallback</text>
  <text x="450" y="498" text-anchor="middle" font-size="12" fill="#4A6080">If the SPN is missing or wrong, Windows silently falls back to NTLM — no error, no warning.  ADR-068 blocks NTLM at the network level on 2027-04-01.</text>

  <!-- Actor bottom mirrors -->
  <rect x="30" y="530" width="160" height="36" rx="8" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2"/>
  <text x="110" y="553" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A5F">SQL Client</text>
  <rect x="370" y="530" width="160" height="36" rx="8" fill="#FEF0EE" stroke="#C0392B" stroke-width="2"/>
  <text x="450" y="553" text-anchor="middle" font-size="13" font-weight="700" fill="#C0392B">Domain Controller</text>
  <rect x="710" y="530" width="160" height="36" rx="8" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2"/>
  <text x="790" y="553" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A5F">SQL Server</text>
</svg>
