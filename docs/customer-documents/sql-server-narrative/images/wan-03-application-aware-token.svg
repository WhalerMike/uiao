<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">

  <defs>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1A9E8F"/>
    </marker>
    <marker id="arrow-navy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1F3A5F"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E67E22"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="800" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3A5F">The New World — Application-Aware Token Authentication</text>
  <text x="800" y="64" text-anchor="middle" font-size="14" fill="#4A6080">No domain controller in the authentication path. The token carries the context. The database knows HOW you authenticated, not just WHO you are.</text>

  <!-- ═══════════════════════════════════════════════════════════════
       LEFT: CLIENT (any device, any location)
  ═══════════════════════════════════════════════════════════════ -->
  <rect x="30" y="90" width="280" height="400" rx="8" fill="#F0FAF8" stroke="#1A9E8F" stroke-width="2"/>
  <rect x="30" y="90" width="280" height="34" rx="8" fill="#1A9E8F"/>
  <text x="170" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">CLIENT</text>

  <!-- Device icon: laptop -->
  <rect x="90" y="138" width="160" height="95" rx="5" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="1.5"/>
  <rect x="100" y="148" width="140" height="72" rx="3" fill="#1F3A5F"/>
  <text x="170" y="180" text-anchor="middle" font-size="11" fill="#FFFFFF">SQL Client / App</text>
  <text x="170" y="197" text-anchor="middle" font-size="11" fill="#FFFFFF">Browser / Service</text>
  <text x="170" y="214" text-anchor="middle" font-size="10" fill="#1A9E8F">Any network location</text>
  <rect x="80" y="233" width="180" height="8" rx="4" fill="#1A9E8F" opacity="0.3"/>

  <text x="170" y="260" text-anchor="middle" font-size="12" fill="#4A6080">Not domain-joined.</text>
  <text x="170" y="278" text-anchor="middle" font-size="12" fill="#4A6080">Not inside a perimeter.</text>
  <text x="170" y="296" text-anchor="middle" font-size="12" fill="#4A6080">Location does not</text>
  <text x="170" y="314" text-anchor="middle" font-size="12" fill="#4A6080">determine trust.</text>

  <rect x="50" y="334" width="240" height="54" rx="5" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="170" y="354" text-anchor="middle" font-size="11" fill="#1F3A5F" font-weight="bold">Connection string:</text>
  <text x="170" y="372" text-anchor="middle" font-size="10" fill="#1A9E8F">Authentication=Active Directory</text>
  <text x="170" y="387" text-anchor="middle" font-size="10" fill="#1A9E8F">ManagedIdentity / Default</text>

  <text x="170" y="420" text-anchor="middle" font-size="11" fill="#4A6080">No Kerberos. No NTLM.</text>
  <text x="170" y="438" text-anchor="middle" font-size="11" fill="#4A6080">No stored credential.</text>
  <text x="170" y="456" text-anchor="middle" font-size="11" fill="#4A6080">No domain membership required.</text>

  <!-- ═══════════════════════════════════════════════════════════════
       TOP CENTER: ENTRA ID + CONDITIONAL ACCESS
  ═══════════════════════════════════════════════════════════════ -->
  <rect x="550" y="80" width="500" height="310" rx="10" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="2.5"/>
  <rect x="550" y="80" width="500" height="36" rx="10" fill="#1A9E8F"/>
  <text x="800" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">MICROSOFT ENTRA ID</text>

  <!-- CA policy box -->
  <rect x="570" y="126" width="460" height="160" rx="6" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="800" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3A5F">Conditional Access Policy Engine</text>
  <line x1="580" y1="156" x2="1020" y2="156" stroke="#1A9E8F" stroke-width="1" opacity="0.4"/>

  <!-- CA checks in two columns -->
  <text x="690" y="176" text-anchor="middle" font-size="12" fill="#1A9E8F" font-weight="bold">Identity checks</text>
  <text x="690" y="194" text-anchor="middle" font-size="11" fill="#1F3A5F">✓ MFA: phishing-resistant</text>
  <text x="690" y="210" text-anchor="middle" font-size="11" fill="#1F3A5F">✓ FIDO2 / Windows Hello</text>
  <text x="690" y="226" text-anchor="middle" font-size="11" fill="#1F3A5F">✓ Sign-in risk: evaluated</text>
  <text x="690" y="242" text-anchor="middle" font-size="11" fill="#1F3A5F">✓ User risk: evaluated</text>
  <text x="690" y="258" text-anchor="middle" font-size="11" fill="#1F3A5F">✓ Session controls</text>
  <text x="690" y="274" text-anchor="middle" font-size="11" fill="#1F3A5F">✓ Named Locations</text>

  <line x1="800" y1="160" x2="800" y2="284" stroke="#1A9E8F" stroke-width="1" opacity="0.3" stroke-dasharray="4,3"/>

  <text x="920" y="176" text-anchor="middle" font-size="12" fill="#1A9E8F" font-weight="bold">Device checks</text>
  <text x="920" y="194" text-anchor="middle" font-size="11" fill="#1F3A5F">✓ Intune compliance</text>
  <text x="920" y="210" text-anchor="middle" font-size="11" fill="#1F3A5F">✓ Entra hybrid join</text>
  <text x="920" y="226" text-anchor="middle" font-size="11" fill="#1F3A5F">✓ Device health signal</text>
  <text x="920" y="242" text-anchor="middle" font-size="11" fill="#1F3A5F">✓ App protection policy</text>
  <text x="920" y="258" text-anchor="middle" font-size="11" fill="#1F3A5F">✓ Compliant device required</text>
  <text x="920" y="274" text-anchor="middle" font-size="11" fill="#1F3A5F">   for DBA access</text>

  <!-- Token issuance -->
  <text x="800" y="322" text-anchor="middle" font-size="12" fill="#1F3A5F" font-weight="bold">→ Issues OAuth 2.0 access token scoped to SQL Server resource</text>
  <text x="800" y="342" text-anchor="middle" font-size="11" fill="#4A6080">aud: https://database.windows.net  |  All CA checks passed before issuance</text>
  <text x="800" y="362" text-anchor="middle" font-size="11" fill="#4A6080">If any check fails: token denied. SQL connection never opens.</text>

  <!-- ═══════════════════════════════════════════════════════════════
       BOTTOM CENTER: TOKEN (the shared artifact)
  ═══════════════════════════════════════════════════════════════ -->
  <rect x="490" y="540" width="620" height="210" rx="10" fill="#FFFBF0" stroke="#E67E22" stroke-width="2"/>
  <rect x="490" y="540" width="620" height="34" rx="10" fill="#E67E22"/>
  <text x="800" y="563" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">OAuth 2.0 Access Token — What the Database Sees</text>

  <!-- Token claims in two columns -->
  <text x="620" y="592" text-anchor="middle" font-size="12" fill="#1F3A5F" font-weight="bold">Standard claims</text>
  <text x="620" y="610" text-anchor="middle" font-size="11" fill="#4A6080">iss: login.microsoftonline.com/[tid]</text>
  <text x="620" y="628" text-anchor="middle" font-size="11" fill="#4A6080">sub: [user object ID]</text>
  <text x="620" y="646" text-anchor="middle" font-size="11" fill="#4A6080">upn: jsmith@agency.gov</text>
  <text x="620" y="664" text-anchor="middle" font-size="11" fill="#4A6080">aud: https://database.windows.net</text>
  <text x="620" y="682" text-anchor="middle" font-size="11" fill="#4A6080">exp: [token expiry — short-lived]</text>

  <line x1="800" y1="582" x2="800" y2="736" stroke="#E67E22" stroke-width="1" opacity="0.3" stroke-dasharray="4,3"/>

  <text x="980" y="592" text-anchor="middle" font-size="12" fill="#1F3A5F" font-weight="bold">Context claims (application-aware)</text>
  <text x="980" y="610" text-anchor="middle" font-size="11" fill="#1A9E8F" font-weight="bold">amr: [mfa, hwk, ngcmfa]</text>
  <text x="980" y="628" text-anchor="middle" font-size="11" fill="#4A6080">  → HOW authenticated (FIDO2/WHfB)</text>
  <text x="980" y="646" text-anchor="middle" font-size="11" fill="#1A9E8F" font-weight="bold">groups: [DBA-Production, App-Readonly]</text>
  <text x="980" y="664" text-anchor="middle" font-size="11" fill="#4A6080">  → OrgPath-driven dynamic membership</text>
  <text x="980" y="682" text-anchor="middle" font-size="11" fill="#1A9E8F" font-weight="bold">deviceid + compliant: true</text>
  <text x="980" y="700" text-anchor="middle" font-size="11" fill="#4A6080">  → Intune-verified device state</text>
  <text x="980" y="718" text-anchor="middle" font-size="11" fill="#1A9E8F" font-weight="bold">roles / scp: [sql-access]</text>
  <text x="980" y="736" text-anchor="middle" font-size="11" fill="#4A6080">  → Scoped to SQL resource</text>

  <!-- ═══════════════════════════════════════════════════════════════
       RIGHT: SQL SERVER
  ═══════════════════════════════════════════════════════════════ -->
  <rect x="1290" y="90" width="280" height="560" rx="8" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2.5"/>
  <rect x="1290" y="90" width="280" height="36" rx="8" fill="#1F3A5F"/>
  <text x="1430" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">SQL SERVER</text>

  <!-- Arc badge -->
  <rect x="1308" y="138" width="244" height="42" rx="5" fill="#1A9E8F" opacity="0.15" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="1430" y="156" text-anchor="middle" font-size="12" fill="#1A9E8F" font-weight="bold">Azure Arc enrolled</text>
  <text x="1430" y="172" text-anchor="middle" font-size="11" fill="#1A9E8F">System Managed Identity: active</text>

  <!-- Engine validates -->
  <text x="1430" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3A5F">Token validation</text>
  <rect x="1308" y="214" width="244" height="80" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="1430" y="234" text-anchor="middle" font-size="11" fill="#4A6080">1. Verify JWT signature against</text>
  <text x="1430" y="250" text-anchor="middle" font-size="11" fill="#4A6080">   Entra public key infrastructure</text>
  <text x="1430" y="266" text-anchor="middle" font-size="11" fill="#4A6080">2. Check aud, exp, iss claims</text>
  <text x="1430" y="282" text-anchor="middle" font-size="11" fill="#4A6080">3. Map upn/groups → type-E login</text>

  <!-- Login types -->
  <text x="1430" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3A5F">Login types accepted</text>
  <rect x="1308" y="328" width="244" height="38" rx="4" fill="#F0FAF8" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="1430" y="348" text-anchor="middle" font-size="12" fill="#1A9E8F" font-weight="bold">type-E only</text>
  <text x="1430" y="362" text-anchor="middle" font-size="10" fill="#4A6080">FROM EXTERNAL PROVIDER</text>

  <!-- What is gone -->
  <text x="1430" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3A5F">Eliminated</text>
  <rect x="1308" y="406" width="244" height="100" rx="4" fill="#FFF0EE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="1430" y="426" text-anchor="middle" font-size="11" fill="#C0392B">✗  type-U Windows logins</text>
  <text x="1430" y="444" text-anchor="middle" font-size="11" fill="#C0392B">✗  type-G AD group logins</text>
  <text x="1430" y="462" text-anchor="middle" font-size="11" fill="#C0392B">✗  type-S SQL Auth / sa</text>
  <text x="1430" y="480" text-anchor="middle" font-size="11" fill="#C0392B">✗  Kerberos / NTLM</text>
  <text x="1430" y="498" text-anchor="middle" font-size="11" fill="#C0392B">✗  Domain controller in path</text>

  <!-- What is verified -->
  <text x="1430" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3A5F">Continuously verified</text>
  <rect x="1308" y="542" width="244" height="88" rx="4" fill="#F0FAF8" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="1430" y="562" text-anchor="middle" font-size="11" fill="#1A9E8F">CCM-BIR: no type-U/G/S drift</text>
  <text x="1430" y="578" text-anchor="middle" font-size="11" fill="#1A9E8F">Defender for SQL: zero NTLM</text>
  <text x="1430" y="594" text-anchor="middle" font-size="11" fill="#1A9E8F">Entra sign-in log: every conn</text>
  <text x="1430" y="610" text-anchor="middle" font-size="11" fill="#1A9E8F">sa: disabled + renamed</text>
  <text x="1430" y="626" text-anchor="middle" font-size="11" fill="#1A9E8F">Managed Identity: engine</text>

  <!-- ═══════════════════════════════════════════════════════════════
       FLOW ARROWS
  ═══════════════════════════════════════════════════════════════ -->

  <!-- ① Client → Entra: authenticate -->
  <line x1="310" y1="200" x2="550" y2="180" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="315" y="150" width="230" height="36" rx="4" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="430" y="167" text-anchor="middle" font-size="11" fill="#1A9E8F" font-weight="bold">① Authenticate + MFA</text>
  <text x="430" y="181" text-anchor="middle" font-size="10" fill="#4A6080">credential + FIDO2 / WHfB</text>

  <!-- ② Entra → Client: token -->
  <line x1="550" y1="220" x2="310" y2="240" stroke="#E67E22" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow-amber)"/>
  <rect x="315" y="224" width="230" height="28" rx="4" fill="#FFFBF0" stroke="#E67E22" stroke-width="1.5"/>
  <text x="430" y="242" text-anchor="middle" font-size="11" fill="#E67E22" font-weight="bold">② OAuth 2.0 access token</text>

  <!-- ③ Client → SQL Server: token in connection -->
  <line x1="310" y1="310" x2="1290" y2="310" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <!-- Arrow passes through/below token box area -->

  <!-- Token feeds SQL Server arrow -->
  <line x1="1110" y1="620" x2="1290" y2="430" stroke="#E67E22" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-amber)"/>
  <text x="1230" y="500" text-anchor="middle" font-size="10" fill="#E67E22" font-style="italic" transform="rotate(-35,1230,500)">token validated here</text>

  <!-- Main connection arrow label -->
  <rect x="620" y="290" width="420" height="36" rx="4" fill="#F0FAF8" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="830" y="307" text-anchor="middle" font-size="12" fill="#1A9E8F" font-weight="bold">③ SQL connection — token in TDS header</text>
  <text x="830" y="322" text-anchor="middle" font-size="10" fill="#4A6080">Authentication=ActiveDirectoryManagedIdentity / Default  |  No Kerberos  |  No NTLM</text>

  <!-- ═══════════════════════════════════════════════════════════════
       BOTTOM: THE ARCHITECTURAL SHIFT
  ═══════════════════════════════════════════════════════════════ -->
  <rect x="30" y="768" width="1540" height="112" rx="8" fill="#1F3A5F"/>
  <text x="800" y="793" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">The architectural shift</text>
  <line x1="200" y1="803" x2="1400" y2="803" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>

  <text x="290" y="824" text-anchor="middle" font-size="12" fill="#1A9E8F" font-weight="bold">Old world:</text>
  <text x="290" y="842" text-anchor="middle" font-size="11" fill="#CCDDEE">"Are you who you say you are?"</text>
  <text x="290" y="858" text-anchor="middle" font-size="11" fill="#CCDDEE">Authentication = identity only</text>
  <text x="290" y="874" text-anchor="middle" font-size="11" fill="#CCDDEE">KDC answers. Engine trusts KDC.</text>

  <line x1="540" y1="812" x2="540" y2="876" stroke="#FFFFFF" stroke-width="1" opacity="0.2" stroke-dasharray="4,3"/>

  <text x="800" y="824" text-anchor="middle" font-size="12" fill="#E67E22" font-weight="bold">The token carries context:</text>
  <text x="800" y="842" text-anchor="middle" font-size="11" fill="#CCDDEE">WHO you are + HOW you authenticated + WHAT device + WHICH groups</text>
  <text x="800" y="858" text-anchor="middle" font-size="11" fill="#CCDDEE">The database can condition access on MFA method, device compliance, and group membership —</text>
  <text x="800" y="874" text-anchor="middle" font-size="11" fill="#CCDDEE">not just on a principal name. This is what "application-aware" means.</text>

  <line x1="1090" y1="812" x2="1090" y2="876" stroke="#FFFFFF" stroke-width="1" opacity="0.2" stroke-dasharray="4,3"/>

  <text x="1360" y="824" text-anchor="middle" font-size="12" fill="#1A9E8F" font-weight="bold">New world:</text>
  <text x="1360" y="842" text-anchor="middle" font-size="11" fill="#CCDDEE">"Are you who you say you are,</text>
  <text x="1360" y="858" text-anchor="middle" font-size="11" fill="#CCDDEE">on a compliant device, after MFA,</text>
  <text x="1360" y="874" text-anchor="middle" font-size="11" fill="#CCDDEE">with the right group membership?"</text>

</svg>
