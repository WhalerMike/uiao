<svg viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <defs>
    <marker id="arr-teal" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#1A9E8F"/>
    </marker>
    <marker id="arr-amber" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#E67E22"/>
    </marker>
    <marker id="arr-navy" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#1F3A5F"/>
    </marker>
  </defs>

  <rect width="1400" height="760" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="700" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#1F3A5F">After — Application-Aware Token</text>
  <text x="700" y="78" text-anchor="middle" font-size="16" fill="#6B7E95">No domain controller. No Kerberos. No NTLM. The database knows HOW you authenticated, not just WHO you are.</text>

  <!-- ══════════════════════════════════
       LEFT — SQL Client
  ══════════════════════════════════ -->
  <rect x="40" y="110" width="230" height="280" rx="16" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2.5"/>
  <rect x="40" y="110" width="230" height="40" rx="16" fill="#1F3A5F"/>
  <text x="155" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">SQL CLIENT</text>
  <!-- monitor icon -->
  <rect x="80" y="164" width="130" height="80" rx="6" fill="#1F3A5F"/>
  <rect x="92" y="176" width="106" height="56" rx="3" fill="#EAF4FB"/>
  <rect x="140" y="244" width="42" height="10" rx="3" fill="#1F3A5F"/>
  <text x="155" y="272" text-anchor="middle" font-size="13" fill="#4A6080">Any device</text>
  <text x="155" y="292" text-anchor="middle" font-size="13" fill="#4A6080">Any location</text>
  <text x="155" y="316" text-anchor="middle" font-size="12" fill="#6B7E95">Authentication=ActiveDirectoryDefault</text>
  <text x="155" y="336" text-anchor="middle" font-size="12" fill="#1A9E8F" font-style="italic">No password on the wire</text>
  <text x="155" y="356" text-anchor="middle" font-size="12" fill="#1A9E8F" font-style="italic">No Kerberos ticket</text>
  <text x="155" y="374" text-anchor="middle" font-size="11" fill="#6B7E95" font-style="italic">No domain join required</text>

  <!-- ══════════════════════════════════
       CENTER — Entra ID
  ══════════════════════════════════ -->
  <rect x="470" y="90" width="340" height="360" rx="16" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="3"/>
  <rect x="470" y="90" width="340" height="42" rx="16" fill="#1A9E8F"/>
  <text x="640" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">MICROSOFT ENTRA ID</text>

  <text x="640" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1F3A5F">Conditional Access Engine</text>
  <text x="640" y="180" text-anchor="middle" font-size="13" fill="#4A6080">Phishing-resistant MFA required</text>
  <text x="640" y="200" text-anchor="middle" font-size="13" fill="#4A6080">Device compliance checked</text>
  <text x="640" y="220" text-anchor="middle" font-size="13" fill="#4A6080">Sign-in risk evaluated</text>
  <text x="640" y="240" text-anchor="middle" font-size="13" fill="#4A6080">OrgPath group membership resolved</text>

  <!-- token box -->
  <rect x="490" y="258" width="300" height="168" rx="10" fill="#FFF8EE" stroke="#E67E22" stroke-width="2"/>
  <text x="640" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#E67E22">OAuth 2.0 Token — issued</text>
  <line x1="490" y1="288" x2="790" y2="288" stroke="#E67E22" stroke-width="1" opacity="0.5"/>
  <text x="560" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#1F3A5F">Identity</text>
  <text x="560" y="332" text-anchor="middle" font-size="12" fill="#4A6080">upn: you@agency.gov</text>
  <text x="560" y="350" text-anchor="middle" font-size="12" fill="#4A6080">sub: object-id</text>
  <text x="560" y="368" text-anchor="middle" font-size="12" fill="#4A6080">groups: OrgPath members</text>
  <text x="560" y="386" text-anchor="middle" font-size="12" fill="#4A6080">exp: 1 hour</text>
  <line x1="630" y1="296" x2="630" y2="410" stroke="#E67E22" stroke-width="1" opacity="0.4"/>
  <text x="720" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#1F3A5F">Context</text>
  <text x="720" y="332" text-anchor="middle" font-size="12" fill="#4A6080">amr: fido2 (phishing-resistant)</text>
  <text x="720" y="350" text-anchor="middle" font-size="12" fill="#4A6080">deviceid: compliant</text>
  <text x="720" y="368" text-anchor="middle" font-size="12" fill="#4A6080">roles: app-specific</text>
  <text x="720" y="386" text-anchor="middle" font-size="12" fill="#1A9E8F">aud: SQL Server endpoint</text>
  <text x="640" y="412" text-anchor="middle" font-size="11" fill="#E67E22" font-style="italic">Signed by Entra — SQL verifies the signature</text>

  <!-- ══════════════════════════════════
       RIGHT — SQL Server
  ══════════════════════════════════ -->
  <rect x="1010" y="110" width="350" height="340" rx="16" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="3"/>
  <rect x="1010" y="110" width="350" height="42" rx="16" fill="#1F3A5F"/>
  <text x="1185" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">SQL SERVER (Arc-Enabled)</text>

  <text x="1185" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#1A9E8F">Accepts: type-E logins only</text>
  <text x="1185" y="198" text-anchor="middle" font-size="13" fill="#4A6080">Validates token signature via IMDS</text>
  <text x="1185" y="218" text-anchor="middle" font-size="13" fill="#4A6080">Maps claims → database role</text>
  <text x="1185" y="238" text-anchor="middle" font-size="13" fill="#4A6080">Every auth logged to Entra sign-in log</text>

  <!-- eliminated list -->
  <rect x="1030" y="252" width="310" height="176" rx="8" fill="#FEF0EE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="1185" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#C0392B">Eliminated</text>
  <line x1="1030" y1="284" x2="1340" y2="284" stroke="#C0392B" stroke-width="1" opacity="0.4"/>
  <text x="1185" y="306" text-anchor="middle" font-size="13" fill="#6B7E95">✗  type-U Windows logins</text>
  <text x="1185" y="326" text-anchor="middle" font-size="13" fill="#6B7E95">✗  type-G AD group logins</text>
  <text x="1185" y="346" text-anchor="middle" font-size="13" fill="#6B7E95">✗  type-S SQL Auth / sa account</text>
  <text x="1185" y="366" text-anchor="middle" font-size="13" fill="#6B7E95">✗  Kerberos / NTLM</text>
  <text x="1185" y="386" text-anchor="middle" font-size="13" fill="#6B7E95">✗  Domain controller in auth path</text>
  <text x="1185" y="406" text-anchor="middle" font-size="11" fill="#C0392B" font-style="italic">Enforced by CCM-BIR drift detection</text>

  <!-- ══════════════════════════════════
       FLOW ARROWS
  ══════════════════════════════════ -->

  <!-- Client → Entra: auth request -->
  <path d="M 270 220 Q 360 165 470 200" fill="none" stroke="#1F3A5F" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#arr-navy)"/>
  <text x="368" y="173" text-anchor="middle" font-size="13" fill="#1F3A5F">① Authenticate</text>
  <text x="368" y="191" text-anchor="middle" font-size="12" fill="#6B7E95">MFA + device check</text>

  <!-- Entra → Client: token returned -->
  <path d="M 470 260 Q 360 285 270 265" fill="none" stroke="#E67E22" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <text x="366" y="304" text-anchor="middle" font-size="13" fill="#E67E22">② Token issued</text>
  <text x="366" y="322" text-anchor="middle" font-size="12" fill="#6B7E95">signed OAuth 2.0</text>

  <!-- Client → SQL: present token -->
  <path d="M 270 295 Q 636 480 1010 320" fill="none" stroke="#E67E22" stroke-width="3" marker-end="url(#arr-amber)"/>
  <text x="640" y="490" text-anchor="middle" font-size="14" font-weight="600" fill="#E67E22">③ Present token at SQL connect</text>
  <text x="640" y="510" text-anchor="middle" font-size="13" fill="#6B7E95">No password · No ticket · Token carries all context</text>

  <!-- ══════════════════════════════════
       BOTTOM BAR — contrast old vs new
  ══════════════════════════════════ -->
  <rect x="40" y="548" width="1320" height="182" rx="12" fill="#1F3A5F"/>
  <text x="700" y="578" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">What changed — and why it matters</text>

  <text x="350" y="610" text-anchor="middle" font-size="14" font-weight="600" fill="#6B7E95">Old world</text>
  <text x="350" y="634" text-anchor="middle" font-size="13" fill="#A8BDCF">Kerberos ticket: I am who I say I am</text>
  <text x="350" y="656" text-anchor="middle" font-size="13" fill="#A8BDCF">No MFA claim — authentication method invisible</text>
  <text x="350" y="678" text-anchor="middle" font-size="13" fill="#A8BDCF">No device claim — compliance unknown to SQL</text>
  <text x="350" y="700" text-anchor="middle" font-size="13" fill="#A8BDCF">No Entra signal — CA policy cannot intercept</text>

  <line x1="700" y1="564" x2="700" y2="714" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>

  <text x="1050" y="610" text-anchor="middle" font-size="14" font-weight="600" fill="#1A9E8F">New world</text>
  <text x="1050" y="634" text-anchor="middle" font-size="13" fill="#FFFFFF">Entra token: verified identity + HOW you authenticated</text>
  <text x="1050" y="656" text-anchor="middle" font-size="13" fill="#FFFFFF">amr claim: phishing-resistant MFA method confirmed</text>
  <text x="1050" y="678" text-anchor="middle" font-size="13" fill="#FFFFFF">deviceid claim: Intune compliance status in-token</text>
  <text x="1050" y="700" text-anchor="middle" font-size="13" fill="#FFFFFF">CA policy: evaluated at every sign-in, not just first logon</text>

</svg>
