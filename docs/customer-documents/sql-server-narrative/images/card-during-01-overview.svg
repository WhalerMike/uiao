<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="dt" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#1A9E8F"/></marker>
    <marker id="dr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#C0392B"/></marker>
  </defs>
  <rect width="900" height="480" fill="#FFFFFF"/>
  <rect x="0" y="0" width="900" height="38" fill="#1A9E8F"/>
  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">DURING — Two Paths, One Destination  (1 of 3: Overview)</text>

  <rect x="40" y="60" width="170" height="110" rx="12" fill="#FEF0EE" stroke="#C0392B" stroke-width="2"/>
  <rect x="40" y="60" width="170" height="30" rx="12" fill="#C0392B"/>
  <text x="125" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">NOT YET MIGRATED</text>
  <text x="125" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#C0392B">Client A</text>
  <text x="125" y="160" text-anchor="middle" font-size="12" fill="#6B7E95">Kerberos / NTLM</text>

  <rect x="40" y="196" width="170" height="110" rx="12" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="2"/>
  <rect x="40" y="196" width="170" height="30" rx="12" fill="#1A9E8F"/>
  <text x="125" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">MIGRATED</text>
  <text x="125" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#1A9E8F">Client B</text>
  <text x="125" y="294" text-anchor="middle" font-size="12" fill="#6B7E95">Entra token</text>

  <rect x="340" y="60" width="180" height="110" rx="12" fill="#FEF0EE" stroke="#C0392B" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="430" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#C0392B">Domain</text>
  <text x="430" y="136" text-anchor="middle" font-size="17" font-weight="700" fill="#C0392B">Controller</text>
  <text x="430" y="158" text-anchor="middle" font-size="11" fill="#C0392B" font-style="italic">to retire when last client migrates</text>

  <rect x="340" y="196" width="180" height="110" rx="12" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="2"/>
  <rect x="340" y="196" width="180" height="30" rx="12" fill="#1A9E8F"/>
  <text x="430" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">MICROSOFT ENTRA ID</text>
  <text x="430" y="268" text-anchor="middle" font-size="17" font-weight="600" fill="#1F3A5F">Entra ID</text>
  <text x="430" y="292" text-anchor="middle" font-size="12" fill="#6B7E95">Conditional Access</text>

  <rect x="650" y="100" width="210" height="240" rx="12" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2.5"/>
  <rect x="650" y="100" width="210" height="32" rx="12" fill="#1F3A5F"/>
  <text x="755" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">SQL SERVER  (Arc-Enabled)</text>
  <rect x="668" y="146" width="174" height="42" rx="8" fill="#FEF0EE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="755" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#C0392B">type-U  (pending)</text>
  <rect x="668" y="200" width="174" height="42" rx="8" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="755" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#1A9E8F">type-E  ✓  migrated</text>
  <rect x="668" y="254" width="174" height="42" rx="8" fill="#FFF8EE" stroke="#E67E22" stroke-width="1.5"/>
  <text x="755" y="280" text-anchor="middle" font-size="14" font-weight="600" fill="#E67E22">type-S  (eliminate)</text>
  <text x="755" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#1F3A5F">Goal: type-E only</text>

  <!-- A → DC -->
  <line x1="210" y1="108" x2="340" y2="108" stroke="#C0392B" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#dr)"/>
  <rect x="238" y="88" width="74" height="18" rx="4" fill="#FFFFFF"/>
  <text x="275" y="101" text-anchor="middle" font-size="11" fill="#C0392B">Kerberos/NTLM</text>

  <!-- DC → SQL -->
  <line x1="520" y1="150" x2="650" y2="168" stroke="#C0392B" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#dr)"/>

  <!-- B → Entra -->
  <line x1="210" y1="248" x2="340" y2="248" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#dt)"/>
  <rect x="236" y="252" width="72" height="18" rx="4" fill="#FFFFFF"/>
  <text x="272" y="265" text-anchor="middle" font-size="11" fill="#1A9E8F">Entra token</text>

  <!-- Entra → SQL -->
  <line x1="520" y1="234" x2="650" y2="218" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#dt)"/>

  <rect x="40" y="370" width="820" height="88" rx="12" fill="#FFF8EE" stroke="#E67E22" stroke-width="1.5"/>
  <text x="450" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#E67E22">The hybrid state is a controlled risk — not a stable destination</text>
  <text x="450" y="426" text-anchor="middle" font-size="13" fill="#4A6080">Every unmigrated login is a connection Conditional Access cannot see.</text>
  <text x="450" y="448" text-anchor="middle" font-size="13" fill="#C0392B" font-style="italic">Microsoft's progressive defaults raise the cost of delay with each release.</text>
</svg>
