<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <rect x="0" y="0" width="900" height="38" fill="#1F3A5F"/>
  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">BEFORE — Kerberos  (2 of 3: The Exchange)</text>

  <rect x="30" y="56" width="380" height="86" rx="10" fill="#EAF4FB" stroke="#1F3A5F" stroke-width="2"/>
  <circle cx="72" cy="99" r="18" fill="#1F3A5F"/>
  <text x="72" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
  <text x="228" y="85" text-anchor="middle" font-size="15" font-weight="600" fill="#1F3A5F">Client requests a service ticket</text>
  <text x="228" y="110" text-anchor="middle" font-size="13" fill="#4A6080">Sends SPN to KDC:  MSSQLSvc/host:1433</text>
  <text x="228" y="130" text-anchor="middle" font-size="12" fill="#C0392B">Missing SPN → silent NTLM downgrade</text>

  <rect x="30" y="160" width="380" height="86" rx="10" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="2"/>
  <circle cx="72" cy="203" r="18" fill="#1A9E8F"/>
  <text x="72" y="209" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
  <text x="228" y="189" text-anchor="middle" font-size="15" font-weight="600" fill="#1F3A5F">KDC issues encrypted ticket</text>
  <text x="228" y="214" text-anchor="middle" font-size="13" fill="#4A6080">Time-limited · default 10 hours</text>
  <text x="228" y="234" text-anchor="middle" font-size="12" fill="#6B7E95">Encrypted with SQL Server service account key</text>

  <rect x="30" y="264" width="380" height="86" rx="10" fill="#EBF8F6" stroke="#1A9E8F" stroke-width="2"/>
  <circle cx="72" cy="307" r="18" fill="#1A9E8F"/>
  <text x="72" y="313" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
  <text x="228" y="293" text-anchor="middle" font-size="15" font-weight="600" fill="#1F3A5F">Client presents ticket to SQL Server</text>
  <text x="228" y="318" text-anchor="middle" font-size="13" fill="#4A6080">No password on the network</text>
  <text x="228" y="338" text-anchor="middle" font-size="12" fill="#6B7E95">SQL decrypts and validates — connection opens</text>

  <rect x="30" y="368" width="380" height="88" rx="10" fill="#FEF0EE" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="215" y="397" text-anchor="middle" font-size="14" font-weight="700" fill="#C0392B">NTLM silent fallback</text>
  <text x="215" y="420" text-anchor="middle" font-size="13" fill="#4A6080">If the SPN is missing, Windows quietly</text>
  <text x="215" y="440" text-anchor="middle" font-size="13" fill="#4A6080">downgrades to NTLM.  No error.  No log entry.</text>

  <rect x="440" y="56" width="430" height="400" rx="12" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="655" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#1F3A5F">What the KDC knows about you</text>
  <text x="466" y="126" font-size="20" fill="#1A9E8F">✓</text>
  <text x="500" y="126" font-size="14" fill="#4A6080">Your AD identity (UPN)</text>
  <text x="466" y="158" font-size="20" fill="#1A9E8F">✓</text>
  <text x="500" y="158" font-size="14" fill="#4A6080">Your AD group membership</text>
  <text x="466" y="190" font-size="20" fill="#1A9E8F">✓</text>
  <text x="500" y="190" font-size="14" fill="#4A6080">Your ticket has not expired</text>
  <line x1="460" y1="214" x2="852" y2="214" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="655" y="244" text-anchor="middle" font-size="15" font-weight="700" fill="#C0392B">What the KDC does NOT know</text>
  <text x="466" y="280" font-size="20" fill="#C0392B">✗</text>
  <text x="500" y="280" font-size="14" fill="#4A6080">Whether you used MFA</text>
  <text x="466" y="312" font-size="20" fill="#C0392B">✗</text>
  <text x="500" y="312" font-size="14" fill="#4A6080">Whether your device is compliant</text>
  <text x="466" y="344" font-size="20" fill="#C0392B">✗</text>
  <text x="500" y="344" font-size="14" fill="#4A6080">Your sign-in risk score</text>
  <text x="466" y="376" font-size="20" fill="#C0392B">✗</text>
  <text x="500" y="376" font-size="14" fill="#4A6080">Any Entra Conditional Access policy</text>
  <text x="655" y="430" text-anchor="middle" font-size="12" fill="#C0392B" font-style="italic">These gaps cannot be closed by tuning Kerberos</text>
</svg>
