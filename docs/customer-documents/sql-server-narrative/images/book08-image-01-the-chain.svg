<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="chTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="64" y="74" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">The authentication chain is only as strong as its last link</text>
  <text x="64" y="104" font-size="17" fill="#6B7A8D">An app can migrate its user sign-in to Entra and still reach SQL on a stored credential — the chain is not yet complete.</text>

  <!-- USER link -->
  <circle cx="180" cy="330" r="46" fill="none" stroke="#1E8C8C" stroke-width="14"/>
  <path d="M158,330 Q158,302 166,300 L194,300 Q202,302 202,330 Z" fill="#2E4B6B"/>
  <circle cx="180" cy="296" r="11" fill="#2E4B6B"/>
  <text x="180" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">user</text>
  <text x="180" y="442" text-anchor="middle" font-size="13" fill="#1E8C8C">signs in to Entra ID</text>

  <!-- link connector -->
  <ellipse cx="300" cy="330" rx="48" ry="34" fill="none" stroke="#1E8C8C" stroke-width="14"/>

  <!-- APPLICATION link -->
  <circle cx="420" cy="330" r="46" fill="none" stroke="#1E8C8C" stroke-width="14"/>
  <rect x="396" y="306" width="48" height="48" rx="6" fill="#1E8C8C"/>
  <text x="420" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">application</text>
  <text x="420" y="442" text-anchor="middle" font-size="13" fill="#1E8C8C">user identity flows through</text>

  <!-- link connector (the weak one) -->
  <ellipse cx="540" cy="330" rx="48" ry="34" fill="none" stroke="#C0392B" stroke-width="14" stroke-dasharray="10 8"/>
  <text x="540" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">the weak link</text>

  <!-- STORED CREDENTIAL link (broken / red) -->
  <circle cx="660" cy="330" r="46" fill="none" stroke="#C0392B" stroke-width="14"/>
  <!-- key icon -->
  <circle cx="648" cy="318" r="10" fill="none" stroke="#C0392B" stroke-width="5"/>
  <line x1="655" y1="325" x2="676" y2="346" stroke="#C0392B" stroke-width="5"/>
  <line x1="668" y1="338" x2="676" y2="330" stroke="#C0392B" stroke-width="4"/>
  <text x="660" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">stored SQL credential</text>
  <text x="660" y="442" text-anchor="middle" font-size="12" fill="#6B7A8D">SQL Authentication service account</text>
  <text x="660" y="460" text-anchor="middle" font-size="12" fill="#C0392B">breaks the chain — identity is lost here</text>

  <!-- link connector -->
  <ellipse cx="780" cy="330" rx="48" ry="34" fill="none" stroke="#6B7A8D" stroke-width="14"/>

  <!-- SQL SERVER (the anchor) -->
  <rect x="852" y="282" width="220" height="96" rx="6" fill="#0D1B2E"/>
  <text x="962" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="20" fill="#FFFFFF">SQL Server</text>
  <text x="962" y="348" text-anchor="middle" font-size="13" fill="#D7F2EE">the database the chain reaches</text>

  <!-- the fix, below: replace the red link with a token-bearing one -->
  <rect x="180" y="540" width="892" height="96" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="210" y="576" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="18" fill="#0D1B2E">The last mile (ADR-069)</text>
  <text x="210" y="602" font-size="14" fill="#33414F">Replace the stored credential with a token-bearing connection so the user's Entra identity reaches SQL unbroken —</text>
  <text x="210" y="624" font-size="14" fill="#33414F">App Proxy · SAML · OIDC · Entra Domain Services, then the connection-string migration.</text>
  <line x1="540" y1="468" x2="540" y2="534" stroke="#1E8C8C" stroke-width="3" marker-end="url(#chTeal)"/>

  <text x="640" y="690" text-anchor="middle" font-size="12" fill="#6B7A8D">Illustrative — the chain-link metaphor (ADR-069); it does not depict a specific application topology.</text>
</svg>
