<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <rect x="0" y="0" width="900" height="38" fill="#1A9E8F"/>
  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">DURING — Two Paths, One Destination  (3 of 3: What Every Unmigrated Login Costs)</text>

  <rect x="28" y="56" width="262" height="300" rx="12" fill="#FEF0EE" stroke="#C0392B" stroke-width="2"/>
  <text x="159" y="100" text-anchor="middle" font-size="34">🚫</text>
  <text x="159" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#C0392B">Conditional Access</text>
  <text x="159" y="156" text-anchor="middle" font-size="13" fill="#C0392B">blind spot</text>
  <line x1="46" y1="170" x2="272" y2="170" stroke="#C0392B" stroke-width="1" opacity="0.3"/>
  <text x="159" y="196" text-anchor="middle" font-size="13" fill="#4A6080">Every Kerberos connection</text>
  <text x="159" y="218" text-anchor="middle" font-size="13" fill="#4A6080">bypasses Entra CA entirely.</text>
  <text x="159" y="244" text-anchor="middle" font-size="13" fill="#4A6080">No MFA enforcement.</text>
  <text x="159" y="268" text-anchor="middle" font-size="13" fill="#4A6080">No device check.</text>
  <text x="159" y="292" text-anchor="middle" font-size="13" fill="#4A6080">No sign-in risk signal.</text>
  <text x="159" y="332" text-anchor="middle" font-size="12" fill="#C0392B" font-style="italic">CA policy = 0% coverage</text>

  <rect x="319" y="56" width="262" height="300" rx="12" fill="#FEF0EE" stroke="#C0392B" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" font-size="34">⚠️</text>
  <text x="450" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#C0392B">NTLM Exposure</text>
  <text x="450" y="156" text-anchor="middle" font-size="13" fill="#C0392B">still present</text>
  <line x1="337" y1="170" x2="563" y2="170" stroke="#C0392B" stroke-width="1" opacity="0.3"/>
  <text x="450" y="196" text-anchor="middle" font-size="13" fill="#4A6080">Missing SPNs fall back to</text>
  <text x="450" y="218" text-anchor="middle" font-size="13" fill="#4A6080">NTLM silently. NTLM is</text>
  <text x="450" y="244" text-anchor="middle" font-size="13" fill="#4A6080">vulnerable to relay attacks.</text>
  <text x="450" y="268" text-anchor="middle" font-size="13" fill="#4A6080">Surface shrinks only when</text>
  <text x="450" y="292" text-anchor="middle" font-size="13" fill="#4A6080">each login is migrated.</text>
  <text x="450" y="332" text-anchor="middle" font-size="12" fill="#C0392B" font-style="italic">Each login = one SPN risk</text>

  <rect x="610" y="56" width="262" height="300" rx="12" fill="#FEF0EE" stroke="#C0392B" stroke-width="2"/>
  <text x="741" y="100" text-anchor="middle" font-size="34">🕐</text>
  <text x="741" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#C0392B">Hard Deadline</text>
  <text x="741" y="156" text-anchor="middle" font-size="13" fill="#C0392B">approaching</text>
  <line x1="628" y1="170" x2="854" y2="170" stroke="#C0392B" stroke-width="1" opacity="0.3"/>
  <text x="741" y="196" text-anchor="middle" font-size="13" fill="#4A6080">2027-04-01: network-level</text>
  <text x="741" y="218" text-anchor="middle" font-size="13" fill="#4A6080">NTLM block is applied.</text>
  <text x="741" y="244" text-anchor="middle" font-size="13" fill="#4A6080">Unmigrated connections</text>
  <text x="741" y="268" text-anchor="middle" font-size="13" fill="#4A6080">are refused — not</text>
  <text x="741" y="292" text-anchor="middle" font-size="13" fill="#4A6080">gracefully downgraded.</text>
  <text x="741" y="332" text-anchor="middle" font-size="12" fill="#C0392B" font-style="italic">ADR-068 Phase C backstop</text>

  <rect x="28" y="374" width="844" height="84" rx="12" fill="#1F3A5F"/>
  <text x="450" y="408" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">The hybrid window is not a neutral holding pattern</text>
  <text x="450" y="436" text-anchor="middle" font-size="13" fill="#A8BDCF">It is a period of accepted, tracked risk. The goal is to close it — not maintain it.</text>
</svg>
