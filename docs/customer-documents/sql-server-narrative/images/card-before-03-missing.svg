<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <rect x="0" y="0" width="900" height="38" fill="#1F3A5F"/>
  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">BEFORE — Kerberos  (3 of 3: What Is Missing)</text>
  <rect x="28" y="56" width="412" height="190" rx="12" fill="#FEF0EE" stroke="#C0392B" stroke-width="2"/>
  <text x="234" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#C0392B">Conditional Access</text>
  <text x="234" y="118" text-anchor="middle" font-size="14" fill="#4A6080">Entra's CA engine evaluates policies at sign-in.</text>
  <text x="234" y="142" text-anchor="middle" font-size="14" fill="#4A6080">Kerberos auth never passes through Entra —</text>
  <text x="234" y="166" text-anchor="middle" font-size="14" fill="#4A6080">CA never sees it and cannot act on it.</text>
  <text x="234" y="228" text-anchor="middle" font-size="12" fill="#C0392B" font-style="italic">Zero CA coverage on SQL Server connections.</text>
  <rect x="460" y="56" width="412" height="190" rx="12" fill="#FEF0EE" stroke="#C0392B" stroke-width="2"/>
  <text x="666" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#C0392B">Phishing-Resistant MFA</text>
  <text x="666" y="118" text-anchor="middle" font-size="14" fill="#4A6080">OMB M-22-09 requires phishing-resistant MFA.</text>
  <text x="666" y="142" text-anchor="middle" font-size="14" fill="#4A6080">A Kerberos ticket carries no MFA claim (amr).</text>
  <text x="666" y="166" text-anchor="middle" font-size="14" fill="#4A6080">SQL cannot verify how you authenticated.</text>
  <text x="666" y="228" text-anchor="middle" font-size="12" fill="#C0392B" font-style="italic">M-22-09 requirement: not satisfiable via Kerberos.</text>
  <rect x="28" y="266" width="412" height="190" rx="12" fill="#FEF0EE" stroke="#C0392B" stroke-width="2"/>
  <text x="234" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#C0392B">Device Compliance</text>
  <text x="234" y="328" text-anchor="middle" font-size="14" fill="#4A6080">Intune marks devices compliant or non-compliant.</text>
  <text x="234" y="352" text-anchor="middle" font-size="14" fill="#4A6080">That status is never in the Kerberos ticket.</text>
  <text x="234" y="376" text-anchor="middle" font-size="14" fill="#4A6080">A non-compliant device connects identically.</text>
  <text x="234" y="438" text-anchor="middle" font-size="12" fill="#C0392B" font-style="italic">Compliance posture invisible to SQL.</text>
  <rect x="460" y="266" width="412" height="190" rx="12" fill="#FEF0EE" stroke="#C0392B" stroke-width="2"/>
  <text x="666" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#C0392B">Sign-In Risk and Audit Trail</text>
  <text x="666" y="328" text-anchor="middle" font-size="14" fill="#4A6080">Entra Identity Protection scores every sign-in.</text>
  <text x="666" y="352" text-anchor="middle" font-size="14" fill="#4A6080">Kerberos auths never appear in Entra logs —</text>
  <text x="666" y="376" text-anchor="middle" font-size="14" fill="#4A6080">no signal, no detection, no audit record.</text>
  <text x="666" y="438" text-anchor="middle" font-size="12" fill="#C0392B" font-style="italic">Breach via SQL is invisible in Entra.</text>
</svg>
