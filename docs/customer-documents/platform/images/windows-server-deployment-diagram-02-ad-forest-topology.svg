<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="460" fill="white"/>

  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2c5b">UIAO Supported AD Forest and Trust Topologies</text>

  <!-- Forest A: Single domain -->
  <rect x="30" y="55" width="200" height="170" rx="8" fill="#f0f4ff" stroke="#1a2c5b" stroke-width="2"/>
  <text x="130" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2c5b">Single-Domain Forest</text>
  <text x="130" y="91" text-anchor="middle" font-size="10" fill="#3a5080">(Most common)</text>

  <!-- Forest root DC -->
  <rect x="75" y="100" width="110" height="44" rx="5" fill="#2d7d6b" />
  <text x="130" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Forest Root DC</text>
  <text x="130" y="135" text-anchor="middle" font-size="10" fill="#d0ffe8">PDC Emulator / Schema</text>

  <!-- UIAO server pointing to it -->
  <rect x="55" y="165" width="150" height="40" rx="5" fill="#fff8e6" stroke="#c47c00" stroke-width="1.5"/>
  <text x="130" y="183" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2c5b">UIAO Server</text>
  <text x="130" y="197" text-anchor="middle" font-size="10" fill="#3a5080">LDAPS to forest root DC</text>
  <line x1="130" y1="144" x2="130" y2="165" stroke="#2d7d6b" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr2)"/>

  <!-- Forest A: supported label -->
  <text x="130" y="218" text-anchor="middle" font-size="10" fill="#2d7d6b" font-style="italic">Supported</text>

  <!-- Forest B: Parent-child -->
  <rect x="260" y="55" width="220" height="230" rx="8" fill="#f0f4ff" stroke="#1a2c5b" stroke-width="2"/>
  <text x="370" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2c5b">Parent-Child Domains</text>
  <text x="370" y="91" text-anchor="middle" font-size="10" fill="#3a5080">(Multi-domain forest)</text>

  <rect x="305" y="100" width="130" height="40" rx="5" fill="#2d7d6b"/>
  <text x="370" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Forest Root DC</text>
  <text x="370" y="132" text-anchor="middle" font-size="10" fill="#d0ffe8">corp.contoso.com</text>

  <rect x="285" y="165" width="80" height="40" rx="5" fill="#3a5080"/>
  <text x="325" y="183" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Child DC</text>
  <text x="325" y="196" text-anchor="middle" font-size="9" fill="#ccd0e0">east.corp.</text>

  <rect x="385" y="165" width="80" height="40" rx="5" fill="#3a5080"/>
  <text x="425" y="183" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Child DC</text>
  <text x="425" y="196" text-anchor="middle" font-size="9" fill="#ccd0e0">west.corp.</text>

  <line x1="325" y1="140" x2="325" y2="165" stroke="#aaa" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="425" y1="140" x2="425" y2="165" stroke="#aaa" stroke-width="1.5" marker-end="url(#arr3)"/>

  <rect x="285" y="225" width="170" height="36" rx="5" fill="#fff8e6" stroke="#c47c00" stroke-width="1.5"/>
  <text x="370" y="241" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2c5b">UIAO Server</text>
  <text x="370" y="256" text-anchor="middle" font-size="9" fill="#3a5080">LDAPS to forest root; GC port 3269</text>
  <line x1="370" y1="140" x2="370" y2="225" stroke="#2d7d6b" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr2)"/>

  <text x="370" y="278" text-anchor="middle" font-size="10" fill="#2d7d6b" font-style="italic">Supported</text>

  <!-- Forest C: External trust -->
  <rect x="510" y="55" width="220" height="230" rx="8" fill="#f0f4ff" stroke="#1a2c5b" stroke-width="2"/>
  <text x="620" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2c5b">Cross-Forest / External Trust</text>
  <text x="620" y="91" text-anchor="middle" font-size="10" fill="#3a5080">(Acquisition / federated partner)</text>

  <rect x="545" y="100" width="150" height="40" rx="5" fill="#2d7d6b"/>
  <text x="620" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Home Forest DC</text>
  <text x="620" y="132" text-anchor="middle" font-size="10" fill="#d0ffe8">home.gov</text>

  <rect x="545" y="165" width="150" height="40" rx="5" fill="#c0392b"/>
  <text x="620" y="183" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Partner Forest DC</text>
  <text x="620" y="197" text-anchor="middle" font-size="10" fill="#ffd0d0">partner.gov</text>

  <!-- Trust arrow -->
  <line x1="620" y1="140" x2="620" y2="165" stroke="#c47c00" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="635" y="156" font-size="9" fill="#c47c00">External / Forest trust</text>

  <rect x="545" y="225" width="150" height="36" rx="5" fill="#fff8e6" stroke="#c47c00" stroke-width="1.5"/>
  <text x="620" y="241" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2c5b">UIAO Server</text>
  <text x="620" y="256" text-anchor="middle" font-size="9" fill="#3a5080">Separate queries per forest</text>
  <line x1="620" y1="140" x2="620" y2="225" stroke="#2d7d6b" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr2)"/>

  <text x="620" y="278" text-anchor="middle" font-size="10" fill="#2d7d6b" font-style="italic">Supported — one tenant per forest</text>

  <!-- RODC warning -->
  <rect x="30" y="300" width="200" height="60" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="130" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">RODC — Not Supported</text>
  <text x="130" y="338" text-anchor="middle" font-size="10" fill="#7a0000">Read-Only DCs cannot issue</text>
  <text x="130" y="353" text-anchor="middle" font-size="10" fill="#7a0000">write-back tokens for extensionAttributes</text>

  <!-- Service account permissions table -->
  <rect x="255" y="300" width="475" height="130" rx="6" fill="#f8f9fb" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="492" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2c5b">Service Account Minimum Permissions</text>
  <line x1="270" y1="326" x2="715" y2="326" stroke="#1a2c5b" stroke-width="1"/>
  <text x="290" y="342" font-size="10" fill="#3a5080">Read all User, Group, Computer, OU attributes</text>
  <text x="290" y="358" font-size="10" fill="#3a5080">Read MemberOf / TokenGroups (group expansion)</text>
  <text x="290" y="374" font-size="10" fill="#3a5080">Write extensionAttribute1 (Entra writeback only)</text>
  <text x="290" y="390" font-size="10" fill="#3a5080">SPN: HTTP/&lt;hostname&gt; + HTTP/&lt;FQDN&gt; on service account</text>
  <text x="290" y="406" font-size="10" fill="#c0392b">Do NOT grant Domain Admin, Schema Admin, or replication rights</text>
  <text x="290" y="422" font-size="10" fill="#3a5080">Domain Functional Level: Windows Server 2016 minimum</text>

  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2d7d6b"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#aaa"/>
    </marker>
  </defs>
</svg>
