<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="460" fill="white"/>

  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2c5b">UIAO Windows Server — 5-Step Deployment Sequence</text>

  <!-- Step connector line -->
  <line x1="380" y1="55" x2="380" y2="420" stroke="#d0d8e8" stroke-width="3"/>

  <!-- Step 1 -->
  <circle cx="380" cy="70" r="18" fill="#1a2c5b"/>
  <text x="380" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="white">1</text>
  <rect x="30" y="52" width="320" height="58" rx="7" fill="#f0f4ff" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="190" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2c5b">Install-UIAOServer.ps1</text>
  <text x="190" y="88" text-anchor="middle" font-size="10" fill="#3a5080">Run as Local Admin on target server</text>
  <text x="190" y="102" text-anchor="middle" font-size="10" fill="#3a5080">Installs IIS features, HttpPlatformHandler, Python 3.13, uiao package</text>

  <rect x="410" y="52" width="320" height="58" rx="7" fill="#f8f9fb" stroke="#aaa" stroke-width="1"/>
  <text x="570" y="72" text-anchor="middle" font-size="11" fill="#3a5080">Prereqs: Windows Server 2022/2025/2026</text>
  <text x="570" y="88" text-anchor="middle" font-size="10" fill="#3a5080">Internet access for pip (or offline wheel)</text>
  <text x="570" y="104" text-anchor="middle" font-size="10" fill="#3a5080">Validates .NET Framework 4.8</text>

  <!-- Step 2 -->
  <circle cx="380" cy="160" r="18" fill="#1a2c5b"/>
  <text x="380" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="white">2</text>
  <rect x="30" y="142" width="320" height="58" rx="7" fill="#f0f4ff" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="190" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2c5b">Register-ServiceAccount.ps1</text>
  <text x="190" y="178" text-anchor="middle" font-size="10" fill="#3a5080">Run on DC or RSAT host</text>
  <text x="190" y="194" text-anchor="middle" font-size="10" fill="#3a5080">Creates svc-uiao AD account, sets SPNs</text>

  <rect x="410" y="142" width="320" height="58" rx="7" fill="#f8f9fb" stroke="#aaa" stroke-width="1"/>
  <text x="570" y="162" text-anchor="middle" font-size="11" fill="#3a5080">Prereqs: RSAT ActiveDirectory module</text>
  <text x="570" y="178" text-anchor="middle" font-size="10" fill="#3a5080">Domain user with right to create accounts</text>
  <text x="570" y="194" text-anchor="middle" font-size="10" fill="#3a5080">SPN: HTTP/hostname + HTTP/FQDN</text>

  <!-- Step 3 -->
  <circle cx="380" cy="250" r="18" fill="#1a2c5b"/>
  <text x="380" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="white">3</text>
  <rect x="30" y="232" width="320" height="58" rx="7" fill="#f0f4ff" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="190" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2c5b">Register-UIAOAPI.ps1</text>
  <text x="190" y="268" text-anchor="middle" font-size="10" fill="#3a5080">Run as Local Admin on target server</text>
  <text x="190" y="284" text-anchor="middle" font-size="10" fill="#3a5080">Creates IIS site, app pool, web.config, TLS binding</text>

  <rect x="410" y="232" width="320" height="58" rx="7" fill="#f8f9fb" stroke="#aaa" stroke-width="1"/>
  <text x="570" y="252" text-anchor="middle" font-size="11" fill="#3a5080">Prereqs: TLS cert from enterprise CA</text>
  <text x="570" y="268" text-anchor="middle" font-size="10" fill="#3a5080">Sets UIAO_ENTRA_* machine env vars</text>
  <text x="570" y="284" text-anchor="middle" font-size="10" fill="#3a5080">Applies URL Rewrite HTTP→HTTPS rule</text>

  <!-- Step 4 -->
  <circle cx="380" cy="340" r="18" fill="#2d7d6b"/>
  <text x="380" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="white">4</text>
  <rect x="30" y="322" width="320" height="58" rx="7" fill="#f0faf5" stroke="#2d7d6b" stroke-width="1.5"/>
  <text x="190" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2c5b">Smoke Test</text>
  <text x="190" y="358" text-anchor="middle" font-size="10" fill="#3a5080">curl https://server/health  →  200 OK</text>
  <text x="190" y="374" text-anchor="middle" font-size="10" fill="#3a5080">.\Test-UIAOHealth.ps1  →  all PASS</text>

  <rect x="410" y="322" width="320" height="58" rx="7" fill="#f8f9fb" stroke="#aaa" stroke-width="1"/>
  <text x="570" y="342" text-anchor="middle" font-size="11" fill="#3a5080">Checks: UIAOService, IIS pool, /health</text>
  <text x="570" y="358" text-anchor="middle" font-size="10" fill="#3a5080">Entra token acquisition, TLS cert expiry</text>
  <text x="570" y="374" text-anchor="middle" font-size="10" fill="#3a5080">Exits 1 if any FAIL — fix before proceeding</text>

  <!-- Step 5 -->
  <circle cx="380" cy="420" r="18" fill="#c47c00"/>
  <text x="380" y="425" text-anchor="middle" font-size="13" font-weight="bold" fill="white">5</text>
  <rect x="30" y="402" width="320" height="46" rx="7" fill="#fff8e6" stroke="#c47c00" stroke-width="1.5"/>
  <text x="190" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2c5b">Register in Change Control</text>
  <text x="190" y="438" text-anchor="middle" font-size="10" fill="#3a5080">Document SPN, app pool account, env vars, cert expiry date</text>

  <rect x="410" y="402" width="320" height="46" rx="7" fill="#f8f9fb" stroke="#aaa" stroke-width="1"/>
  <text x="570" y="422" text-anchor="middle" font-size="11" fill="#3a5080">Schedule cert renewal alert (WarnCertDays 30)</text>
  <text x="570" y="438" text-anchor="middle" font-size="10" fill="#3a5080">Enroll log path in SIEM; onboard to DR rotation</text>
</svg>
