<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- White background -->
  <rect width="760" height="440" fill="white"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2c5b">UIAO Governance API — Windows Server Architecture</text>

  <!-- CLIENT -->
  <rect x="30" y="70" width="140" height="60" rx="6" fill="#e8edf7" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="100" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2c5b">Client Browser</text>
  <text x="100" y="113" text-anchor="middle" font-size="11" fill="#3a5080">HTTPS :443</text>

  <!-- Arrow: Client → IIS -->
  <line x1="170" y1="100" x2="240" y2="100" stroke="#2d7d6b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="205" y="92" text-anchor="middle" font-size="10" fill="#2d7d6b">Kerberos/TLS</text>

  <!-- IIS BOX -->
  <rect x="240" y="55" width="200" height="150" rx="8" fill="#f0f4ff" stroke="#1a2c5b" stroke-width="2"/>
  <rect x="240" y="55" width="200" height="30" rx="8" fill="#1a2c5b"/>
  <text x="340" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="white">IIS 10</text>
  <text x="340" y="105" text-anchor="middle" font-size="11" fill="#1a2c5b">Windows Auth (Kerberos)</text>
  <text x="340" y="121" text-anchor="middle" font-size="11" fill="#1a2c5b">TLS Termination (CA cert)</text>
  <text x="340" y="137" text-anchor="middle" font-size="11" fill="#1a2c5b">URL Rewrite: HTTP→HTTPS</text>
  <rect x="260" y="148" width="160" height="44" rx="5" fill="#d0e8f0" stroke="#2d7d6b" stroke-width="1.5"/>
  <text x="340" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2c5b">HttpPlatformHandler</text>
  <text x="340" y="183" text-anchor="middle" font-size="10" fill="#3a5080">loopback HTTP_PLATFORM_PORT</text>

  <!-- Arrow: IIS → Python -->
  <line x1="340" y1="205" x2="340" y2="248" stroke="#2d7d6b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="355" y="232" font-size="10" fill="#2d7d6b">127.0.0.1:PORT</text>

  <!-- Python/Uvicorn box -->
  <rect x="255" y="248" width="170" height="60" rx="6" fill="#fff8e6" stroke="#c47c00" stroke-width="1.5"/>
  <text x="340" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2c5b">Python 3.13 / Uvicorn</text>
  <text x="340" y="289" text-anchor="middle" font-size="11" fill="#3a5080">uiao.api.app</text>
  <text x="340" y="305" text-anchor="middle" font-size="10" fill="#3a5080">uiao.saas (optional)</text>

  <!-- Arrow: Python → AD -->
  <line x1="255" y1="290" x2="140" y2="320" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="185" y="295" text-anchor="middle" font-size="10" fill="#c0392b">LDAPS :636</text>

  <!-- AD box -->
  <rect x="20" y="320" width="170" height="60" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="105" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2c5b">Active Directory</text>
  <text x="105" y="362" text-anchor="middle" font-size="11" fill="#3a5080">Domain Controller (DFL 2016+)</text>
  <text x="105" y="376" text-anchor="middle" font-size="10" fill="#3a5080">LDAPS required · RODC not supported</text>

  <!-- Arrow: Python → Entra -->
  <line x1="425" y1="290" x2="540" y2="290" stroke="#1a2c5b" stroke-width="2" marker-end="url(#arr-navy)"/>
  <text x="483" y="282" text-anchor="middle" font-size="10" fill="#1a2c5b">MSAL / HTTPS</text>

  <!-- Entra box -->
  <rect x="540" y="260" width="190" height="80" rx="6" fill="#e8f0fe" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="635" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2c5b">Microsoft Entra ID</text>
  <text x="635" y="301" text-anchor="middle" font-size="11" fill="#3a5080">Graph API</text>
  <text x="635" y="317" text-anchor="middle" font-size="11" fill="#3a5080">ARM (Azure Resource Manager)</text>
  <text x="635" y="333" text-anchor="middle" font-size="10" fill="#3a5080">Client-credentials (machine env vars)</text>

  <!-- Key vault annotation -->
  <rect x="540" y="360" width="190" height="50" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="635" y="381" text-anchor="middle" font-size="11" fill="#555">Secrets: machine-level env vars</text>
  <text x="635" y="397" text-anchor="middle" font-size="10" fill="#555">(not in web.config)</text>

  <!-- Windows Service mode note -->
  <rect x="240" y="388" width="200" height="36" rx="5" fill="#f0faf5" stroke="#2d7d6b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="340" y="404" text-anchor="middle" font-size="10" fill="#2d7d6b">Alt: Windows Service (pywin32)</text>
  <text x="340" y="418" text-anchor="middle" font-size="10" fill="#2d7d6b">ARR reverse-proxy to :8001</text>

  <!-- Arrow defs -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2d7d6b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-navy" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a2c5b"/>
    </marker>
  </defs>
</svg>
