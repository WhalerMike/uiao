<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/>
    </marker>
  </defs>

  <!-- Figure title -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Platform host in one page</text>

  <!-- ===== Host (navy rounded rectangle) ===== -->
  <rect x="70" y="150" width="940" height="480" rx="14" fill="#0D1B2E"/>

  <!-- Host header -->
  <text x="100" y="186" font-size="22" font-weight="bold" fill="#FFFFFF">Windows Server 2025 &#8212; UIAO-GIT01</text>
  <text x="100" y="212" font-family="Consolas, monospace" font-size="14" fill="#D7F2EE">OrgPath: ORG-IT-INF-PLATFORM   &#183;   AU: AU-ORG-IT-INF-PLATFORM</text>

  <!-- ===== IIS box (top-left inside host) ===== -->
  <rect x="120" y="250" width="350" height="74" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="295" y="280" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">IIS <tspan font-family="Consolas, monospace" font-weight="normal">:443</tspan></text>
  <text x="295" y="304" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0D1B2E">(HTTPS / TLS terminate)</text>

  <!-- ===== Gitea box (top-right inside host) ===== -->
  <rect x="610" y="250" width="350" height="74" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="785" y="280" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Gitea <tspan font-family="Consolas, monospace" font-weight="normal">:3000</tspan></text>
  <text x="785" y="304" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">(127.0.0.1)</text>

  <!-- IIS -> Gitea reverse proxy arrow -->
  <text x="540" y="276" text-anchor="middle" font-size="13" fill="#5A5A5A">reverse proxy</text>
  <line x1="470" y1="287" x2="608" y2="287" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- ===== AD DS / Entra (stacked below IIS) ===== -->
  <rect x="120" y="392" width="350" height="60" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="295" y="422" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#0D1B2E">AD DS &#8212; LDAPS (local accounts)</text>

  <rect x="120" y="486" width="350" height="60" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="295" y="516" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#0D1B2E">Entra ID &#8212; OIDC (federated SSO)</text>

  <!-- AD DS -> IIS arrow (up) -->
  <line x1="250" y1="390" x2="250" y2="326" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <!-- Entra ID -> IIS arrow (up, routed around the right of the AD DS box) -->
  <path d="M380,486 L380,469 L500,469 L500,360 L420,360 L420,326" fill="none" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- ===== Repos / Governance hooks (stacked below Gitea) ===== -->
  <rect x="610" y="392" width="350" height="60" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="785" y="422" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#0D1B2E">Repos &#8212; <tspan font-family="Consolas, monospace">D:\GitRepos</tspan></text>

  <rect x="610" y="486" width="350" height="60" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="785" y="516" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#0D1B2E">Governance hooks</text>

  <!-- Gitea -> Repos / Governance arrows (down) -->
  <line x1="785" y1="326" x2="785" y2="390" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="785" y1="452" x2="785" y2="484" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- ===== Bottom full-width teal_tint band ===== -->
  <rect x="120" y="572" width="840" height="42" rx="8" fill="#D7F2EE"/>
  <text x="540" y="593" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#1E8C8C">Intune compliance   +   Azure Arc agent</text>

  <!-- ===== UIAO_163 drift engine (outside host, right) ===== -->
  <rect x="1056" y="360" width="160" height="100" rx="10" fill="#2E75B6"/>
  <text x="1136" y="402" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF"><tspan font-family="Consolas, monospace">UIAO_163</tspan></text>
  <text x="1136" y="426" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">drift engine</text>

  <!-- host -> drift engine arrow -->
  <text x="1033" y="490" text-anchor="middle" font-size="13" fill="#5A5A5A">signed evidence</text>
  <path d="M1010,505 L1136,505 L1136,462" fill="none" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
</svg>
