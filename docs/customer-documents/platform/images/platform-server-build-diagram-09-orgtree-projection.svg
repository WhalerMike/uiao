<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint figure (ADR-093). Palette: src/uiao/canon/svg-style/palette.json -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Phase 14 — projecting the host into OrgTree governance</text>

  <!-- ===== Connectors (drawn first, sit under boxes) ===== -->
  <!-- center box anchor region ~ x[470,690], y[300,420]; corner boxes ~ 230 wide -->
  <!-- upper-left -->
  <line x1="295" y1="205" x2="478" y2="312" stroke="#1E8C8C" stroke-width="3"/>
  <!-- upper-right -->
  <line x1="682" y1="312" x2="865" y2="205" stroke="#1E8C8C" stroke-width="3"/>
  <!-- lower-left -->
  <line x1="295" y1="540" x2="478" y2="408" stroke="#1E8C8C" stroke-width="3"/>
  <!-- lower-right -->
  <line x1="682" y1="408" x2="865" y2="540" stroke="#1E8C8C" stroke-width="3"/>

  <!-- arrow to drift engine -->
  <line x1="700" y1="365" x2="975" y2="365" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="837" y="350" text-anchor="middle" font-size="14" fill="#5A5A5A">emit canonical state</text>

  <!-- ===== Center: UIAO-GIT01 + OrgPath tag ===== -->
  <rect x="470" y="300" width="230" height="62" rx="10" fill="#0D1B2E"/>
  <text x="585" y="331" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">UIAO-GIT01</text>
  <!-- attached teal_tint tag beneath -->
  <rect x="448" y="362" width="274" height="48" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="585" y="380" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="14" fill="#1E8C8C">OrgPath: ORG-IT-INF-PLATFORM</text>
  <text x="585" y="398" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="13" fill="#0D1B2E">(extensionAttribute1)</text>

  <!-- ===== Upper-left ice box ===== -->
  <rect x="65" y="150" width="230" height="64" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="180" y="182" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">Entra device object</text>

  <!-- ===== Upper-right ice box ===== -->
  <rect x="865" y="150" width="290" height="80" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1010" y="180" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">Azure Arc tags</text>
  <text x="1010" y="202" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#0D1B2E">(mirrored OrgPath)</text>

  <!-- ===== Lower-left ice box ===== -->
  <rect x="65" y="500" width="300" height="80" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="215" y="530" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#0D1B2E">AU-ORG-IT-INF-PLATFORM</text>
  <text x="215" y="552" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#0D1B2E">scoped delegation</text>

  <!-- ===== Lower-right ice box ===== -->
  <rect x="865" y="500" width="290" height="80" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1010" y="530" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">Dynamic groups</text>
  <text x="1010" y="552" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#0D1B2E">&#8594; Gitea teams</text>

  <!-- ===== Far-right: drift engine ===== -->
  <rect x="975" y="320" width="190" height="90" rx="10" fill="#2E75B6"/>
  <text x="1070" y="356" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">UIAO_163</text>
  <text x="1070" y="378" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">drift engine</text>

  <!-- ===== Bottom note ===== -->
  <text x="640" y="650" text-anchor="middle" font-size="15" fill="#5A5A5A">OrgPath must exist in <tspan font-family="Consolas, monospace" fill="#5A5A5A">UIAO_151</tspan> codebook or <tspan font-family="Consolas, monospace" fill="#5A5A5A">UIAO_158</tspan> schema rejects it</text>
</svg>
