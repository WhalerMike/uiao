<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO SaaS tenant lifecycle state machine (ADR-096). Blueprint register, ADR-093.
       teal #1E8C8C (good transitions) · red #C0392B (offboard/loss) · navy #0D1B2E · ice #EAF1FB -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#0D1B2E">Tenant lifecycle</text>

  <!-- PENDING -->
  <rect x="90" y="300" width="230" height="92" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2.5"/>
  <text x="205" y="346" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#0D1B2E">PENDING</text>

  <!-- ACTIVE -->
  <rect x="525" y="300" width="230" height="92" rx="12" fill="#1E8C8C"/>
  <text x="640" y="338" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">ACTIVE</text>
  <text x="640" y="368" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#FFFFFF">serves governance traffic</text>

  <!-- SUSPENDED -->
  <rect x="960" y="300" width="230" height="92" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2.5"/>
  <text x="1075" y="346" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#0D1B2E">SUSPENDED</text>

  <!-- DEPROVISIONED (terminal) -->
  <rect x="525" y="560" width="230" height="92" rx="12" fill="#0D1B2E"/>
  <text x="640" y="598" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">DEPROVISIONED</text>
  <text x="640" y="626" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#FFFFFF">terminal</text>

  <!-- PENDING -> ACTIVE -->
  <line x1="320" y1="332" x2="520" y2="332" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="420" y="320" text-anchor="middle" font-size="17" fill="#1E8C8C">onboard / consent</text>

  <!-- ACTIVE -> SUSPENDED -->
  <line x1="755" y1="332" x2="955" y2="332" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="855" y="320" text-anchor="middle" font-size="17" fill="#1E8C8C">suspend</text>

  <!-- SUSPENDED -> ACTIVE (return, curved below) -->
  <path d="M 1000 392 C 980 470, 760 470, 745 396" fill="none" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="872" y="466" text-anchor="middle" font-size="17" fill="#1E8C8C">resume</text>

  <!-- deprovision arrows (red) to terminal -->
  <line x1="220" y1="392" x2="545" y2="556" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <line x1="640" y1="392" x2="640" y2="556" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <line x1="1060" y1="392" x2="735" y2="556" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="668" y="476" font-size="17" fill="#C0392B">deprovision (from any state)</text>
</svg>
