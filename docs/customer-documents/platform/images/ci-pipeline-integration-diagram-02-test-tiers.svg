<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="380" fill="white"/>

  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2c5b">UIAO Three-Tier Test Architecture</text>

  <!-- Tier-1 -->
  <rect x="30" y="50" width="210" height="290" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
  <rect x="30" y="50" width="210" height="36" rx="8" fill="#c0392b"/>
  <text x="135" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Tier-1 — Live Tenant</text>

  <text x="50" y="108" font-size="11" font-weight="bold" fill="#1a2c5b">Location</text>
  <text x="50" y="124" font-size="10" fill="#3a5080">tests/integration/tier1/</text>

  <text x="50" y="148" font-size="11" font-weight="bold" fill="#1a2c5b">Trigger</text>
  <text x="50" y="164" font-size="10" fill="#3a5080">Manual dispatch (per adapter)</text>
  <text x="50" y="180" font-size="10" fill="#3a5080">Nightly cron (once wired)</text>

  <text x="50" y="204" font-size="11" font-weight="bold" fill="#1a2c5b">Network</text>
  <text x="50" y="220" font-size="10" fill="#3a5080">Required — real vendor API</text>

  <text x="50" y="244" font-size="11" font-weight="bold" fill="#1a2c5b">Strength</text>
  <text x="50" y="260" font-size="10" fill="#3a5080">Strongest evidence substrate</text>
  <text x="50" y="276" font-size="10" fill="#3a5080">emits. Calls real endpoints.</text>

  <text x="50" y="300" font-size="11" font-weight="bold" fill="#c0392b">Key note</text>
  <text x="50" y="316" font-size="10" fill="#7a0000">pytest.skip() when secrets absent</text>
  <text x="50" y="332" font-size="10" fill="#7a0000">→ always green without creds</text>

  <!-- Tier-2 -->
  <rect x="275" y="50" width="210" height="290" rx="8" fill="#fff8e6" stroke="#c47c00" stroke-width="2"/>
  <rect x="275" y="50" width="210" height="36" rx="8" fill="#c47c00"/>
  <text x="380" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Tier-2 — Contract Fixtures</text>

  <text x="295" y="108" font-size="11" font-weight="bold" fill="#1a2c5b">Location</text>
  <text x="295" y="124" font-size="10" fill="#3a5080">tests/fixtures/contract/</text>
  <text x="295" y="140" font-size="10" fill="#3a5080">tests/contract/test_*_contract.py</text>

  <text x="295" y="164" font-size="11" font-weight="bold" fill="#1a2c5b">Trigger</text>
  <text x="295" y="180" font-size="10" fill="#3a5080">Every PR via pytest.yml gate</text>

  <text x="295" y="204" font-size="11" font-weight="bold" fill="#1a2c5b">Network</text>
  <text x="295" y="220" font-size="10" fill="#3a5080">None — recorded API responses</text>

  <text x="295" y="244" font-size="11" font-weight="bold" fill="#1a2c5b">Strength</text>
  <text x="295" y="260" font-size="10" fill="#3a5080">Validates adapter output schema</text>
  <text x="295" y="276" font-size="10" fill="#3a5080">matches UIAO substrate contract</text>

  <text x="295" y="300" font-size="11" font-weight="bold" fill="#c47c00">Key note</text>
  <text x="295" y="316" font-size="10" fill="#7a4000">The gate that runs on every PR</text>
  <text x="295" y="332" font-size="10" fill="#7a4000">No vendor signup required</text>

  <!-- Tier-3 -->
  <rect x="520" y="50" width="210" height="290" rx="8" fill="#e8f0fe" stroke="#1a2c5b" stroke-width="2"/>
  <rect x="520" y="50" width="210" height="36" rx="8" fill="#1a2c5b"/>
  <text x="625" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Tier-3 — Reference Deploy</text>

  <text x="540" y="108" font-size="11" font-weight="bold" fill="#1a2c5b">Location</text>
  <text x="540" y="124" font-size="10" fill="#3a5080">Agency tenant (off-repo)</text>
  <text x="540" y="140" font-size="10" fill="#3a5080">Evidence bundle (external)</text>

  <text x="540" y="164" font-size="11" font-weight="bold" fill="#1a2c5b">Trigger</text>
  <text x="540" y="180" font-size="10" fill="#3a5080">Quarterly, per agency</text>

  <text x="540" y="204" font-size="11" font-weight="bold" fill="#1a2c5b">Network</text>
  <text x="540" y="220" font-size="10" fill="#3a5080">Required — live agency env</text>

  <text x="540" y="244" font-size="11" font-weight="bold" fill="#1a2c5b">Strength</text>
  <text x="540" y="260" font-size="10" fill="#3a5080">End-to-end in real environment</text>
  <text x="540" y="276" font-size="10" fill="#3a5080">Compliance evidence artifact</text>

  <text x="540" y="300" font-size="11" font-weight="bold" fill="#1a2c5b">Key note</text>
  <text x="540" y="316" font-size="10" fill="#3a5080">Output feeds ConMon evidence</text>
  <text x="540" y="332" font-size="10" fill="#3a5080">Coordinated with agency AO</text>

  <!-- Coverage spectrum -->
  <rect x="30" y="350" width="700" height="20" rx="4" fill="#e0e0e0"/>
  <rect x="30" y="350" width="233" height="20" rx="4" fill="#c0392b" opacity="0.7"/>
  <rect x="263" y="350" width="233" height="20" fill="#c47c00" opacity="0.7"/>
  <rect x="497" y="350" width="233" height="20" rx="4" fill="#1a2c5b" opacity="0.7"/>
  <text x="147" y="365" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Strongest evidence, rare run</text>
  <text x="380" y="365" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Every PR, no network</text>
  <text x="614" y="365" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Quarterly agency validation</text>
</svg>
