<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Phases 6-7 &#8212; two auth sources, one Gitea</text>

  <!-- ============ LEFT: two source boxes ============ -->

  <!-- Top source: AD DS -->
  <rect x="70" y="150" width="300" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="220" y="195" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#0D1B2E">AD DS &#8212; LDAPS <tspan font-family="Consolas, monospace" font-weight="normal">:636</tspan></text>
  <text x="220" y="228" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#5A5A5A">legacy local accounts</text>

  <!-- Bottom source: Entra ID -->
  <rect x="70" y="420" width="300" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="220" y="465" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#0D1B2E">Entra ID &#8212; OAuth2 / OIDC</text>
  <text x="220" y="498" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#5A5A5A">federated SSO</text>

  <!-- ============ CENTER: Gitea navy box ============ -->
  <rect x="520" y="280" width="280" height="160" rx="10" fill="#0D1B2E"/>
  <text x="660" y="360" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">Gitea &#8212; auth sources</text>

  <!-- ============ RIGHT: Gitea teams ============ -->
  <rect x="940" y="280" width="280" height="160" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1080" y="345" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#0D1B2E">Gitea teams</text>
  <text x="1080" y="380" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#5A5A5A">Entra groups map automatically</text>

  <!-- ============ ARROWS ============ -->

  <!-- Top arrow: AD DS -> Gitea -->
  <line x1="370" y1="210" x2="515" y2="320" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <!-- Top arrow label -->
  <text x="385" y="172" font-size="14" fill="#5A5A5A">bind DN  &#183;  search base scoped to</text>
  <text x="385" y="192" font-family="Consolas, monospace" font-size="13" fill="#5A5A5A">OU=...,ORG-IT-INF-PLATFORM</text>

  <!-- Bottom arrow: Entra ID -> Gitea -->
  <line x1="370" y1="480" x2="515" y2="400" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <!-- Bottom arrow label -->
  <text x="385" y="520" font-size="14" fill="#5A5A5A">group claims (SecurityGroup)</text>

  <!-- Center arrow: Gitea -> Gitea teams -->
  <line x1="800" y1="360" x2="935" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- ============ BOTTOM NOTE ============ -->
  <text x="70" y="640" font-family="Consolas, monospace" font-size="14" fill="#5A5A5A">admin_filter = memberOf CN=OrgTree-IT-INF-PLATFORM-CanonStewards</text>
</svg>
