<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO Azure SaaS architecture (ADR-096). Blueprint register, ADR-093 house style.
       navy #0D1B2E · teal #1E8C8C · ice #EAF1FB (cloud, navy border) · grey #5A5A5A · white bg -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="62" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#0D1B2E">UIAO Azure SaaS — architecture</text>

  <!-- Customer tenants row -->
  <text x="640" y="108" text-anchor="middle" font-size="20" fill="#5A5A5A">Entra ID — customer tenants (admin-consented)</text>
  <rect x="140" y="124" width="300" height="64" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="290" y="156" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#0D1B2E">Customer tenant A</text>
  <rect x="490" y="124" width="300" height="64" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="156" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#0D1B2E">Customer tenant B</text>
  <rect x="840" y="124" width="300" height="64" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="990" y="156" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#0D1B2E">Customer tenant C</text>

  <!-- Inbound arrow -->
  <line x1="640" y1="190" x2="640" y2="246" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="660" y="226" font-size="18" fill="#1E8C8C">inbound JWT — tid claim</text>

  <!-- Container App boundary -->
  <rect x="150" y="250" width="980" height="252" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2.5"/>
  <text x="174" y="288" font-family="Georgia, serif" font-size="23" font-weight="bold" fill="#0D1B2E">Azure Container App — uiao.saas.asgi:app</text>

  <!-- Data plane -->
  <rect x="180" y="306" width="440" height="116" rx="10" fill="#0D1B2E"/>
  <text x="400" y="340" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Data plane</text>
  <text x="400" y="372" text-anchor="middle" font-size="17" fill="#FFFFFF">TenantResolutionMiddleware</text>
  <text x="400" y="398" text-anchor="middle" font-size="17" fill="#FFFFFF">+ uiao.api governance routes</text>

  <!-- Control plane -->
  <rect x="660" y="306" width="440" height="116" rx="10" fill="#0D1B2E"/>
  <text x="880" y="340" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Control plane — /control/v1</text>
  <text x="880" y="372" text-anchor="middle" font-size="17" fill="#FFFFFF">onboard · suspend · resume</text>
  <text x="880" y="398" text-anchor="middle" font-size="17" fill="#FFFFFF">· deprovision</text>

  <!-- Managed identity pill -->
  <rect x="180" y="438" width="920" height="46" rx="23" fill="#1E8C8C"/>
  <text x="640" y="461" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Managed identity → per-tenant Microsoft Graph / ARM tokens</text>

  <!-- Connectors to backing stores -->
  <line x1="300" y1="502" x2="300" y2="556" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="640" y1="502" x2="640" y2="556" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="980" y1="502" x2="980" y2="556" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Backing stores -->
  <rect x="150" y="560" width="300" height="110" rx="10" fill="#0D1B2E"/>
  <text x="300" y="600" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">PostgreSQL</text>
  <text x="300" y="630" text-anchor="middle" font-size="16" fill="#FFFFFF">tenant registry + state</text>

  <rect x="490" y="560" width="300" height="110" rx="10" fill="#0D1B2E"/>
  <text x="640" y="600" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Key Vault</text>
  <text x="640" y="630" text-anchor="middle" font-size="16" fill="#FFFFFF">per-tenant secrets</text>

  <rect x="830" y="560" width="300" height="110" rx="10" fill="#0D1B2E"/>
  <text x="980" y="600" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Blob Storage</text>
  <text x="980" y="630" text-anchor="middle" font-size="16" fill="#FFFFFF">evidence bundles</text>
</svg>
