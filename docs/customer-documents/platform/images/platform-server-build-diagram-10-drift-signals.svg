<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Phase 14.4 &#8212; five drift signals into UIAO_163</text>

  <!-- ============ LEFT: five drift-signal boxes ============ -->
  <!-- Signal 1: y 120 -->
  <rect x="70" y="120" width="380" height="80" rx="10" fill="#0D1B2E"/>
  <text x="260" y="160" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">OrgPath mismatch</text>
  <text x="260" y="182" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#FFFFFF">(Entra vs Arc tag)</text>
  <rect x="350" y="106" width="98" height="26" rx="13" fill="#1E8C8C"/>
  <text x="399" y="119" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">Value Drift</text>

  <!-- Signal 2: y 230 -->
  <rect x="70" y="230" width="380" height="80" rx="10" fill="#0D1B2E"/>
  <text x="260" y="270" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">OrgPath not in codebook</text>
  <rect x="344" y="216" width="104" height="26" rx="13" fill="#1E8C8C"/>
  <text x="396" y="229" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">Format Drift</text>

  <!-- Signal 3: y 340 -->
  <rect x="70" y="340" width="380" height="80" rx="10" fill="#0D1B2E"/>
  <text x="260" y="380" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">AU membership lost</text>
  <rect x="334" y="326" width="114" height="26" rx="13" fill="#1E8C8C"/>
  <text x="391" y="339" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">Hierarchy Drift</text>

  <!-- Signal 4: y 450 -->
  <rect x="70" y="450" width="380" height="80" rx="10" fill="#0D1B2E"/>
  <text x="260" y="490" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">Dynamic group missing</text>
  <text x="260" y="512" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#FFFFFF">from Gitea</text>
  <rect x="342" y="436" width="106" height="26" rx="13" fill="#1E8C8C"/>
  <text x="395" y="449" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">Phantom Drift</text>

  <!-- Signal 5: y 560 -->
  <rect x="70" y="560" width="380" height="80" rx="10" fill="#0D1B2E"/>
  <text x="260" y="600" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">Arc heartbeat stale &#62; 24h</text>
  <rect x="316" y="546" width="132" height="26" rx="13" fill="#D4A017"/>
  <text x="382" y="559" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0D1B2E">Operational alert</text>

  <!-- ============ CENTER: drift engine ============ -->
  <rect x="610" y="320" width="220" height="120" rx="12" fill="#2E75B6"/>
  <text x="720" y="368" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#FFFFFF">UIAO_163</text>
  <text x="720" y="396" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">drift engine</text>

  <!-- ============ Converging teal arrows: signal right edge (x=450) to engine left edge (x=610) ============ -->
  <line x1="450" y1="160" x2="608" y2="356" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="450" y1="270" x2="608" y2="370" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="450" y1="380" x2="608" y2="380" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="450" y1="490" x2="608" y2="392" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="450" y1="600" x2="608" y2="406" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- ============ RIGHT: SLA ticket box ============ -->
  <rect x="980" y="320" width="250" height="120" rx="12" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="1105" y="362" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">SLA ticket</text>
  <text x="1105" y="392" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#0D1B2E">UIAO_167</text>

  <!-- amber arrow engine -> SLA -->
  <line x1="830" y1="380" x2="978" y2="380" stroke="#D4A017" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="904" y="366" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#5A5A5A">any non-zero count</text>

</svg>
