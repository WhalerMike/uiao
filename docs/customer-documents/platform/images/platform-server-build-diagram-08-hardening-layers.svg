<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO 16:9 blueprint (ADR-093). Phase 13 - defense-in-depth on the host -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Phase 13 — defense-in-depth on the host</text>

  <!-- ============ LAYER STACK (bottom-to-top) ============ -->
  <!-- bands: x=70 width=720; height 88; step 103; top band y=150, bottom band y=562 -->

  <!-- top band: Audit policy (navy, white, two lines) -->
  <rect x="70" y="150" width="720" height="88" rx="10" fill="#0D1B2E"/>
  <text x="430" y="184" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Audit policy — Logon, Object Access,</text>
  <text x="430" y="208" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Privilege Use, Policy Change</text>

  <!-- Defender (ice, navy text, navy border) -->
  <rect x="70" y="253" width="720" height="88" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="430" y="297" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#0D1B2E">Microsoft Defender for Servers Plan 2</text>

  <!-- WDAC (teal_tint, navy text) -->
  <rect x="70" y="356" width="720" height="88" rx="10" fill="#D7F2EE"/>
  <text x="430" y="400" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#0D1B2E">WDAC — UMCI code integrity</text>

  <!-- AppLocker (teal_tint, navy text) -->
  <rect x="70" y="459" width="720" height="88" rx="10" fill="#D7F2EE"/>
  <text x="430" y="503" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#0D1B2E">AppLocker — allow signed UIAO scripts, default deny</text>

  <!-- bottom band: CIS baseline (navy, white) -->
  <rect x="70" y="562" width="720" height="88" rx="10" fill="#0D1B2E"/>
  <text x="430" y="606" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#FFFFFF">CIS Level 2 baseline (LGPO)</text>

  <!-- ============ TELEMETRY: tall teal up-arrow + Sentinel box ============ -->
  <!-- Sentinel box top-right -->
  <rect x="930" y="80" width="300" height="64" rx="10" fill="#2E75B6"/>
  <text x="1080" y="112" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Sentinel / Log Analytics</text>

  <!-- tall teal arrow spanning full stack height, pointing UP into the Sentinel box -->
  <line x1="900" y1="650" x2="900" y2="150" stroke="#1E8C8C" stroke-width="8" marker-end="url(#arrow-teal)"/>

  <!-- connector from arrow head up to Sentinel box -->
  <line x1="900" y1="150" x2="900" y2="144" stroke="#1E8C8C" stroke-width="8"/>

  <!-- arrow label (navy, stacked tspans), placed to the right of the arrow shaft -->
  <text x="930" y="360" text-anchor="start" font-size="18" font-weight="bold" fill="#0D1B2E">
    <tspan x="930" dy="0">Azure Arc +</tspan>
    <tspan x="930" dy="26">Azure Monitor</tspan>
    <tspan x="930" dy="26">Agent</tspan>
  </text>
</svg>
