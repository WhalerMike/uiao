<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Phase 5 — IIS reverse proxy and forwarded headers</text>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Request header pills (above the rewrite arrow / IIS box) -->
  <g font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">
    <rect x="360" y="150" width="244" height="34" rx="17" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="482" y="167" text-anchor="middle" dominant-baseline="central">X-Forwarded-Proto = https</text>

    <rect x="624" y="150" width="170" height="34" rx="17" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="709" y="167" text-anchor="middle" dominant-baseline="central">X-Forwarded-For</text>

    <rect x="814" y="150" width="180" height="34" rx="17" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="904" y="167" text-anchor="middle" dominant-baseline="central">X-Forwarded-Host</text>
  </g>

  <!-- Client box -->
  <rect x="60" y="330" width="190" height="110" rx="10" fill="#0D1B2E"/>
  <text x="155" y="385" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#FFFFFF">Client (HTTPS)</text>

  <!-- Client -> IIS arrow, labeled :443 TLS -->
  <line x1="250" y1="385" x2="358" y2="385" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="304" y="372" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">:443 TLS</text>

  <!-- IIS site box (large ice box) -->
  <rect x="360" y="220" width="560" height="340" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>

  <!-- Response header strip (navy) above IIS title -->
  <rect x="384" y="238" width="512" height="56" rx="6" fill="#0D1B2E"/>
  <g font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">
    <text x="640" y="258" text-anchor="middle" dominant-baseline="central">HSTS  ·  X-Content-Type-Options: nosniff</text>
    <text x="640" y="276" text-anchor="middle" dominant-baseline="central">X-Frame-Options: DENY</text>
  </g>

  <!-- IIS title -->
  <text x="640" y="320" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#0D1B2E">IIS site — UIAOReverseProxy</text>

  <!-- Sub-box 1: URL Rewrite -->
  <rect x="384" y="350" width="512" height="92" rx="8" fill="#0D1B2E"/>
  <g font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">
    <text x="640" y="382" text-anchor="middle" dominant-baseline="central">URL Rewrite:</text>
    <text x="640" y="410" text-anchor="middle" dominant-baseline="central">(.*)  →  http://127.0.0.1:3000/{R:1}</text>
  </g>

  <!-- Sub-box 2: ARR proxy -->
  <rect x="384" y="458" width="512" height="56" rx="8" fill="#0D1B2E"/>
  <text x="640" y="486" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">ARR proxy enabled</text>

  <!-- IIS -> Gitea arrow, labeled loopback :3000 -->
  <line x1="920" y1="385" x2="1038" y2="385" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="979" y="372" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">loopback :3000</text>

  <!-- Gitea box -->
  <rect x="1040" y="330" width="170" height="110" rx="10" fill="#0D1B2E"/>
  <text x="1125" y="385" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#FFFFFF">Gitea</text>

  <!-- Bottom grey note -->
  <text x="640" y="640" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="14" fill="#5A5A5A">maxAllowedContentLength = 500 MB</text>
</svg>
