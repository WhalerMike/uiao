<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Phase 12 — backup, replication, and DR</text>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- LEFT: Active node (navy box with stacked sequence) -->
  <rect x="70" y="150" width="340" height="280" rx="10" fill="#0D1B2E"/>
  <text x="240" y="185" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#FFFFFF">Active — UIAO-GIT01</text>
  <line x1="100" y1="210" x2="380" y2="210" stroke="#6B7A8D" stroke-width="1"/>
  <text x="120" y="262" font-family="Consolas, monospace" font-size="17" fill="#FFFFFF">
    <tspan x="120" dy="0">Stop-Service</tspan>
    <tspan x="120" dy="34">gitea dump</tspan>
    <tspan x="120" dy="34">Compress repos</tspan>
    <tspan x="120" dy="34">Start-Service</tspan>
  </text>

  <!-- TOP arrow: Active -> Azure Blob (cloud), nightly -->
  <line x1="410" y1="225" x2="775" y2="225" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="595" y="208" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#5A5A5A">nightly 02:00</text>

  <!-- Azure Blob cloud target (ice, navy border) -->
  <path d="M 845 165
           a 42 42 0 0 1 78 -18
           a 50 50 0 0 1 92 14
           a 40 40 0 0 1 8 79
           l -210 0
           a 40 40 0 0 1 32 -75 z"
        fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="945" y="208" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">
    <tspan x="945" dy="0">Azure Blob</tspan>
    <tspan x="945" dy="22">gitea-backups</tspan>
  </text>
  <text x="945" y="262" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5A5A5A">retain 30 days</text>

  <!-- DOWN-RIGHT arrow: Active -> Passive replica, replicate -->
  <line x1="410" y1="400" x2="775" y2="475" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="585" y="420" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#5A5A5A">replicate</text>

  <!-- Passive replica (ice, navy border, standby) -->
  <rect x="790" y="440" width="320" height="110" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="950" y="485" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#0D1B2E">Passive replica</text>
  <text x="950" y="515" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#6B7A8D">standby</text>

  <!-- Bottom band: RPO / RTO -->
  <rect x="70" y="600" width="1140" height="60" rx="8" fill="#D7F2EE"/>
  <text x="640" y="630" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">RPO 24h     ·     RTO 4h  (cold restore + DNS cutover)</text>
</svg>
