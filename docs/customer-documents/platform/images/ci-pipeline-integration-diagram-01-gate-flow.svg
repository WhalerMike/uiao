<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="400" fill="white"/>

  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2c5b">UIAO CI Gate Flow — Pull Request to Main</text>

  <!-- PR box -->
  <rect x="20" y="55" width="120" height="55" rx="6" fill="#1a2c5b"/>
  <text x="80" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Pull Request</text>
  <text x="80" y="97" text-anchor="middle" font-size="10" fill="#c0d0f0">opened / updated</text>

  <!-- Arrow PR → Blocking -->
  <line x1="140" y1="82" x2="185" y2="82" stroke="#2d7d6b" stroke-width="2" marker-end="url(#ag)"/>

  <!-- Blocking gates box -->
  <rect x="185" y="45" width="200" height="190" rx="7" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
  <rect x="185" y="45" width="200" height="28" rx="7" fill="#c0392b"/>
  <text x="285" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="white">13 Blocking Gates (all must pass)</text>
  <text x="200" y="88" font-size="10" fill="#3a0000">pytest · ruff · mypy</text>
  <text x="200" y="104" font-size="10" fill="#3a0000">schema-validation · substrate-drift</text>
  <text x="200" y="120" font-size="10" fill="#3a0000">publication-gap · metadata-validator</text>
  <text x="200" y="136" font-size="10" fill="#3a0000">sync-canon-check · customer-docs-status</text>
  <text x="200" y="152" font-size="10" fill="#3a0000">document-index-status · sitemap-drift</text>
  <text x="200" y="168" font-size="10" fill="#3a0000">link-check · docs-leak-check</text>
  <text x="285" y="196" text-anchor="middle" font-size="9" fill="#c0392b" font-style="italic">Any single failure blocks merge</text>
  <text x="285" y="213" text-anchor="middle" font-size="9" fill="#c0392b" font-style="italic">Pre-commit runs same checks locally</text>

  <!-- Fail path -->
  <line x1="285" y1="235" x2="285" y2="285" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ared)"/>
  <rect x="210" y="285" width="150" height="36" rx="5" fill="#fde8e8" stroke="#c0392b" stroke-width="1"/>
  <text x="285" y="303" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Blocked — fix and push</text>
  <text x="285" y="318" text-anchor="middle" font-size="9" fill="#7a0000">All gates re-run on next push</text>

  <!-- Pass arrow -->
  <line x1="385" y1="82" x2="430" y2="82" stroke="#2d7d6b" stroke-width="2" marker-end="url(#ag)"/>
  <text x="407" y="74" text-anchor="middle" font-size="10" fill="#2d7d6b">all pass</text>

  <!-- Merge box -->
  <rect x="430" y="60" width="110" height="45" rx="6" fill="#2d7d6b"/>
  <text x="485" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Merge to</text>
  <text x="485" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="white">main</text>

  <!-- Arrow Merge → Render -->
  <line x1="540" y1="82" x2="590" y2="82" stroke="#2d7d6b" stroke-width="2" marker-end="url(#ag)"/>

  <!-- Render/publish box -->
  <rect x="590" y="45" width="150" height="160" rx="7" fill="#e8f0fe" stroke="#1a2c5b" stroke-width="2"/>
  <rect x="590" y="45" width="150" height="28" rx="7" fill="#1a2c5b"/>
  <text x="665" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Main-only workflows</text>
  <text x="608" y="90" font-size="10" fill="#1a2c5b">quarto.yml</text>
  <text x="622" y="106" font-size="9" fill="#3a5080">HTML site + DOCX → GitHub Pages</text>
  <text x="608" y="124" font-size="10" fill="#1a2c5b">image-gen.yml</text>
  <text x="622" y="140" font-size="9" fill="#3a5080">SVG → PNG rasterize</text>
  <text x="608" y="158" font-size="10" fill="#1a2c5b">release.yml (on tag)</text>
  <text x="622" y="174" font-size="9" fill="#3a5080">Wheel + SBOM + sigstore + PyPI</text>
  <text x="622" y="188" font-size="9" fill="#c0392b">Does NOT run on PRs</text>

  <!-- Scheduled box -->
  <rect x="430" y="165" width="140" height="120" rx="7" fill="#f5f0ff" stroke="#5a3080" stroke-width="1.5"/>
  <text x="500" y="183" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a3080">Scheduled</text>
  <text x="445" y="200" font-size="9" fill="#3a0060">orchestrator-schedule (nightly)</text>
  <text x="445" y="216" font-size="9" fill="#3a0060">conmon-aggregate (weekly)</text>
  <text x="445" y="232" font-size="9" fill="#3a0060">scubagear-upstream-track (weekly)</text>
  <text x="500" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a3080">Manual dispatch</text>
  <text x="445" y="274" font-size="9" fill="#3a0060">azure-saas-deploy · tier1-* adapter tests</text>

  <!-- Tier-2 note -->
  <rect x="20" y="285" width="160" height="80" rx="6" fill="#fff8e6" stroke="#c47c00" stroke-width="1.5"/>
  <text x="100" y="305" text-anchor="middle" font-size="10" font-weight="bold" fill="#c47c00">Tier-2 contract tests</text>
  <text x="100" y="321" text-anchor="middle" font-size="9" fill="#3a5080">Run as part of pytest gate</text>
  <text x="100" y="337" text-anchor="middle" font-size="9" fill="#3a5080">No network needed (fixtures)</text>
  <text x="100" y="353" text-anchor="middle" font-size="9" fill="#3a5080">Always green without secrets</text>

  <defs>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2d7d6b"/>
    </marker>
    <marker id="ared" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
