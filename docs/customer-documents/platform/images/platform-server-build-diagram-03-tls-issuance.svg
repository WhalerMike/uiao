<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Phase 3 &#8212; certificate issuance and key ACL</text>

  <!-- ===== Top row: host <-> Enterprise CA ===== -->

  <!-- Host: UIAO-GIT01 (navy) -->
  <rect x="90" y="150" width="280" height="100" rx="10" fill="#0D1B2E"/>
  <text x="230" y="200" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="19" font-weight="bold" fill="#FFFFFF">UIAO-GIT01</text>

  <!-- Enterprise CA (ice) -->
  <rect x="800" y="140" width="380" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="990" y="180" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">Enterprise CA</text>
  <text x="990" y="212" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="17" fill="#0D1B2E">Contoso-IssuingCA</text>

  <!-- Forward arrow: host -> CA -->
  <line x1="370" y1="172" x2="795" y2="172" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="582" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#5A5A5A">certreq -new / -submit</text>
  <text x="582" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#5A5A5A">(template WebServerV2)</text>

  <!-- Return arrow: CA -> host -->
  <line x1="795" y1="228" x2="370" y2="228" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="600" y="248" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#5A5A5A">certreq -accept</text>

  <!-- Certificate glyph on the return arrow -->
  <g transform="translate(470,210)">
    <rect x="0" y="0" width="46" height="34" rx="4" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <line x1="8" y1="11" x2="38" y2="11" stroke="#5A5A5A" stroke-width="1.5"/>
    <line x1="8" y1="18" x2="30" y2="18" stroke="#5A5A5A" stroke-width="1.5"/>
    <circle cx="36" cy="26" r="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <path d="M33,32 L31,42 L36,38 L41,42 L39,32 Z" fill="#1E8C8C"/>
  </g>

  <!-- ===== Cert store box ===== -->
  <rect x="90" y="330" width="320" height="90" rx="10" fill="#0D1B2E"/>
  <text x="250" y="362" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Cert in</text>
  <text x="250" y="390" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="17" fill="#FFFFFF">LocalMachine\My</text>

  <!-- arrow from host down to cert store -->
  <line x1="230" y1="250" x2="240" y2="325" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- ===== Two consumer boxes ===== -->
  <rect x="90" y="520" width="340" height="90" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="260" y="565" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="18" fill="#0D1B2E">NT SERVICE\gitea</text>

  <rect x="540" y="520" width="420" height="90" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="750" y="565" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="18" fill="#0D1B2E">IIS AppPool\UIAOReverseProxy</text>

  <!-- arrows down from cert store to the two consumers -->
  <line x1="220" y1="420" x2="220" y2="515" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="240" y="475" text-anchor="start" font-size="14" fill="#5A5A5A">Read ACL</text>

  <line x1="320" y1="420" x2="640" y2="515" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="520" y="468" text-anchor="middle" font-size="14" fill="#5A5A5A">Read ACL</text>

  <!-- ===== Bottom callout band ===== -->
  <rect x="90" y="640" width="1100" height="46" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="640" y="663" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#0D1B2E">Exportable = FALSE   &#183;   key ACL is least-privilege &#8212; exactly two principals</text>
</svg>
