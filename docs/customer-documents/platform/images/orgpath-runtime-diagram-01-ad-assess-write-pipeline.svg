<text x="686" y="246" font-family="Consolas, monospace" font-size="12" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">UIAO_151 Codebook</text>
<!-- facet rows -->
<rect x="576" y="266" width="220" height="78" rx="3" fill="#D7F2EE"/>
<text x="592" y="284" font-family="Consolas, monospace" font-size="12.5" fill="#33414F" text-anchor="start" dominant-baseline="central">region</text>
<text x="592" y="304" font-family="Consolas, monospace" font-size="12.5" fill="#33414F" text-anchor="start" dominant-baseline="central">department</text>
