<!-- amber plan/apply arrows -->
<line x1="830" y1="210" x2="978" y2="210" stroke="#D4A017" stroke-width="3" marker-end="url(#ar-amber)"/>
<line x1="830" y1="306" x2="978" y2="318" stroke="#D4A017" stroke-width="3" marker-end="url(#ar-amber)"/>
