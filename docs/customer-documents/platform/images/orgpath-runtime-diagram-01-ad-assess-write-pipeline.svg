<text x="708" y="324" font-family="Consolas, monospace" font-size="12.5" fill="#33414F" text-anchor="start" dominant-baseline="central">classification</text>

<!-- self-loop validate vs codebook -->
<path d="M826 224 C 872 216, 872 252, 836 250" fill="none" stroke="#0D1B2E" stroke-width="2" marker-end="url(#ar-navy)"/>
<text x="838" y="286" font-family="Arial, sans-serif" font-size="11.5" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">validate</text>
<text x="838" y="302" font-family="Arial, sans-serif" font-size="11.5" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">vs codebook</text>

