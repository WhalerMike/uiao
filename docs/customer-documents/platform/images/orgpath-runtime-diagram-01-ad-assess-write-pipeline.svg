<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
  <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
</defs>

<!-- Title -->
<text x="60" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Read / assess Active Directory, derive OrgPath</text>
<text x="60" y="102" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">facets, write Entra / Azure — and govern the drift</text>

<!-- ===== Stage 1: Active Directory ===== -->
<!-- input feeds -->
<text x="44" y="182" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#5A5A5A" text-anchor="start">INPUTS</text>
<text x="44" y="206" font-family="Consolas, monospace" font-size="13" fill="#33414F" text-anchor="start">OUs</text>
<text x="44" y="228" font-family="Consolas, monospace" font-size="13" fill="#33414F" text-anchor="start">users</text>
<text x="44" y="250" font-family="Consolas, monospace" font-size="13" fill="#33414F" text-anchor="start">computers</text>
<text x="44" y="272" font-family="Consolas, monospace" font-size="13" fill="#33414F" text-anchor="start">group membership</text>
<line x1="180" y1="245" x2="232" y2="245" stroke="#5A5A5A" stroke-width="2" marker-end="url(#ar-navy)"/>

<rect x="238" y="170" width="240" height="160" rx="6" fill="#0D1B2E"/>
<text x="358" y="210" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#9FB4CC" text-anchor="middle" dominant-baseline="central">STAGE 1 &#183; SOURCE</text>
<text x="358" y="244" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Active Directory</text>
<text x="358" y="282" font-family="Arial, sans-serif" font-size="15" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">read / assess</text>
<text x="358" y="306" font-family="Consolas, monospace" font-size="12" fill="#9FB4CC" text-anchor="middle" dominant-baseline="central">live LDAP or JSON export</text>

<!-- arrow stage1 -> stage2 -->
<line x1="478" y1="250" x2="546" y2="250" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- ===== Stage 2: Assess / derive (teal) ===== -->
<rect x="546" y="158" width="280" height="200" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="3"/>
<rect x="546" y="158" width="280" height="46" rx="6" fill="#1E8C8C"/>
<rect x="546" y="186" width="280" height="18" fill="#1E8C8C"/>
