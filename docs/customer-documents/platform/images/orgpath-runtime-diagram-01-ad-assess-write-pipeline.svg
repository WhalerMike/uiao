<text x="904" y="200" font-family="Arial, sans-serif" font-size="11" fill="#B8860B" text-anchor="middle" dominant-baseline="central">dry-run by default</text>

<rect x="980" y="172" width="252" height="92" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="1106" y="198" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">STAGE 3 &#183; TARGET</text>
<text x="1106" y="222" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Entra</text>
<text x="1106" y="246" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">extensionAttributes (Graph)</text>

<rect x="980" y="278" width="252" height="92" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="1106" y="306" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Azure Arc</text>
<text x="1106" y="332" font-family="Consolas, monospace" font-size="12" fill="#33414F" text-anchor="middle" dominant-baseline="central">resource tags (ARM)</text>

<!-- ===== Drift Engine (below) ===== -->
<rect x="546" y="470" width="686" height="124" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="3"/>
