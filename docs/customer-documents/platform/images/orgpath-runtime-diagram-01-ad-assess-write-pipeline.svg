<rect x="572" y="540" width="142" height="38" rx="4" fill="#D7F2EE"/>
<text x="643" y="559" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">observe</text>
<line x1="714" y1="559" x2="742" y2="559" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<rect x="742" y="540" width="142" height="38" rx="4" fill="#D7F2EE"/>
<text x="813" y="559" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">compare</text>
<line x1="884" y1="559" x2="912" y2="559" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<rect x="912" y="540" width="142" height="38" rx="4" fill="#D7F2EE"/>
<text x="983" y="559" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">classify</text>
<line x1="1054" y1="559" x2="1082" y2="559" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<rect x="1082" y="540" width="124" height="38" rx="4" fill="#D7F2EE"/>
<text x="1144" y="559" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">reconcile</text>

<!-- observe arrow up from Entra/Arc into drift engine -->
<line x1="1106" y1="370" x2="1106" y2="466" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)" stroke-dasharray="6 5"/>
<text x="1118" y="420" font-family="Arial, sans-serif" font-size="12" fill="#1E8C8C" text-anchor="start" dominant-baseline="central">observe</text>

<!-- amber reconcile arrow back to Entra/ARM -->
<path d="M1144 540 C 1144 460, 1228 470, 1228 380 L 1228 280" fill="none" stroke="#D4A017" stroke-width="3" marker-end="url(#ar-amber)"/>
<text x="1218" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#D4A017" text-anchor="end" dominant-baseline="central">reconcile</text>

<!-- stage band labels -->
<text x="358" y="392" font-family="Arial, sans-serif" font-size="12.5" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">source &amp; target systems &#8212; navy</text>
<text x="686" y="392" font-family="Arial, sans-serif" font-size="12.5" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">runtime / assessment &#8212; teal</text>
<text x="1106" y="392" font-family="Arial, sans-serif" font-size="12.5" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">change-making arrows &#8212; amber</text>

