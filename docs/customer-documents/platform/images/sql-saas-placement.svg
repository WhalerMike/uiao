<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- SQL Server transformation placement (ADR-097). Blueprint register, ADR-093 house style.
       navy #0D1B2E · teal #1E8C8C · ice #EAF1FB · red #C0392B (forbidden path) · white bg -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="52" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#0D1B2E">SQL Server transformation placement</text>
  <text x="60" y="82" font-family="Arial, sans-serif" font-size="19" fill="#5A5A5A">Same UIAO control &amp; evidence plane · adjacent in-boundary execution (ADR-097)</text>

  <!-- ===== Left: UIAO Azure SaaS control & evidence plane ===== -->
  <rect x="55" y="110" width="560" height="470" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2.5"/>
  <text x="80" y="148" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#0D1B2E">UIAO Azure SaaS — control &amp; evidence plane</text>

  <rect x="85" y="172" width="500" height="78" rx="9" fill="#0D1B2E"/>
  <text x="335" y="205" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Tenant onboarding</text>
  <text x="335" y="230" text-anchor="middle" font-size="15" fill="#FFFFFF">+ data_namespace isolation</text>

  <rect x="85" y="262" width="500" height="78" rx="9" fill="#0D1B2E"/>
  <text x="335" y="295" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Identity mapping</text>
  <text x="335" y="320" text-anchor="middle" font-size="15" fill="#FFFFFF">SQL logins → Entra principals</text>

  <rect x="85" y="352" width="500" height="78" rx="9" fill="#0D1B2E"/>
  <text x="335" y="385" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Evidence fabric</text>
  <text x="335" y="410" text-anchor="middle" font-size="15" fill="#FFFFFF">auth audit · KSI · CCM-BIR</text>

  <rect x="85" y="442" width="500" height="78" rx="9" fill="#1E8C8C"/>
  <text x="335" y="475" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">ARM + managed-identity orchestration</text>
  <text x="335" y="500" text-anchor="middle" font-size="15" fill="#FFFFFF">plan · apply · reconcile (dry-run default)</text>

  <!-- ===== Right: customer boundary (adjacent execution) ===== -->
  <rect x="720" y="110" width="500" height="470" rx="12" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="740" y="148" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#0D1B2E">Customer boundary (Arc-connected)</text>

  <rect x="748" y="172" width="444" height="74" rx="9" fill="#0D1B2E"/>
  <text x="970" y="203" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Arc-connected host</text>
  <text x="970" y="227" text-anchor="middle" font-size="14" fill="#FFFFFF">+ managed identity (IMDS)</text>

  <rect x="748" y="300" width="444" height="84" rx="9" fill="#1E8C8C"/>
  <text x="970" y="333" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Execution runner</text>
  <text x="970" y="358" text-anchor="middle" font-size="14" fill="#FFFFFF">UIAOSqlServerMigration (PowerShell)</text>

  <rect x="748" y="438" width="444" height="82" rx="9" fill="#0D1B2E"/>
  <text x="970" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">SQL Server engine</text>
  <text x="970" y="495" text-anchor="middle" font-size="14" fill="#FFFFFF">sysadmin — credential stays in-boundary</text>

  <!-- vertical flow inside the boundary -->
  <line x1="970" y1="246" x2="970" y2="296" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="970" y1="384" x2="970" y2="434" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="986" y="416" font-size="13" fill="#1E8C8C">login migration</text>

  <!-- cross-boundary: orchestrate (SaaS → runner) -->
  <line x1="615" y1="300" x2="744" y2="320" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="628" y="288" font-size="14" fill="#1E8C8C">orchestrate →</text>

  <!-- cross-boundary: evidence (runner → SaaS) -->
  <line x1="744" y1="360" x2="615" y2="392" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="628" y="382" font-size="14" fill="#1E8C8C">← signed evidence</text>

  <!-- ===== forbidden direct path (lane discipline) ===== -->
  <line x1="335" y1="600" x2="970" y2="600" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="10 7"/>
  <line x1="640" y1="585" x2="666" y2="615" stroke="#C0392B" stroke-width="4"/>
  <line x1="666" y1="585" x2="640" y2="615" stroke="#C0392B" stroke-width="4"/>
  <text x="652" y="648" text-anchor="middle" font-size="16" fill="#C0392B">UIAO never opens a direct connection to the customer's SQL engine — ADR-092 lane discipline</text>
</svg>
