<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2d7d6b"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="white"/>

  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2c5b">UIAO AWS SaaS — ECS Fargate · RDS · passwordless IAM auth</text>

  <!-- Customer tenants -->
  <rect x="120" y="48" width="160" height="40" rx="6" fill="#e8f0fc" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="200" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2c5b">Customer tenant A</text>
  <rect x="300" y="48" width="160" height="40" rx="6" fill="#e8f0fc" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="380" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2c5b">Customer tenant B</text>
  <rect x="480" y="48" width="160" height="40" rx="6" fill="#e8f0fc" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="560" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2c5b">Customer tenant C</text>

  <!-- Inbound arrow -->
  <line x1="380" y1="88" x2="380" y2="120" stroke="#2d7d6b" stroke-width="2" marker-end="url(#ag)"/>
  <text x="392" y="108" font-size="10" fill="#2d7d6b">inbound JWT (tid claim)</text>

  <!-- ALB -->
  <rect x="250" y="122" width="260" height="38" rx="6" fill="#1a2c5b"/>
  <text x="380" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Application Load Balancer (TLS)</text>

  <line x1="380" y1="160" x2="380" y2="184" stroke="#2d7d6b" stroke-width="2" marker-end="url(#ag)"/>

  <!-- VPC -->
  <rect x="40" y="186" width="680" height="250" rx="9" fill="#f4f8ff" stroke="#1a2c5b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="58" y="206" font-size="11" font-weight="bold" fill="#1a2c5b">VPC (private subnets)</text>

  <!-- ECS Fargate service -->
  <rect x="200" y="214" width="360" height="120" rx="8" fill="#e8f0fc" stroke="#1a2c5b" stroke-width="1.5"/>
  <text x="380" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2c5b">ECS Fargate service — uiao.saas.asgi:app</text>
  <rect x="218" y="246" width="160" height="44" rx="5" fill="#1a2c5b"/>
  <text x="298" y="264" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Data plane</text>
  <text x="298" y="280" text-anchor="middle" font-size="9" fill="#c0d0f0">tenant resolution · quotas</text>
  <rect x="382" y="246" width="160" height="44" rx="5" fill="#1a2c5b"/>
  <text x="462" y="264" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Control plane /control/v1</text>
  <text x="462" y="280" text-anchor="middle" font-size="9" fill="#c0d0f0">onboard · audit · lifecycle</text>
  <rect x="218" y="300" width="324" height="24" rx="12" fill="#2d7d6b"/>
  <text x="380" y="316" text-anchor="middle" font-size="10" font-weight="bold" fill="white">IAM task role → per-tenant Graph/ARM tokens + RDS IAM token</text>

  <!-- Backing services -->
  <line x1="290" y1="334" x2="200" y2="372" stroke="#2d7d6b" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="380" y1="334" x2="380" y2="372" stroke="#2d7d6b" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="470" y1="334" x2="560" y2="372" stroke="#2d7d6b" stroke-width="2" marker-end="url(#ag)"/>

  <rect x="70" y="374" width="190" height="46" rx="6" fill="#1a2c5b"/>
  <text x="165" y="394" text-anchor="middle" font-size="11" font-weight="bold" fill="white">RDS PostgreSQL</text>
  <text x="165" y="410" text-anchor="middle" font-size="9" fill="#c0d0f0">tenant registry + state</text>

  <rect x="285" y="374" width="190" height="46" rx="6" fill="#1a2c5b"/>
  <text x="380" y="394" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Secrets Manager</text>
  <text x="380" y="410" text-anchor="middle" font-size="9" fill="#c0d0f0">per-tenant secret scopes</text>

  <rect x="500" y="374" width="190" height="46" rx="6" fill="#1a2c5b"/>
  <text x="595" y="394" text-anchor="middle" font-size="11" font-weight="bold" fill="white">S3 evidence bucket</text>
  <text x="595" y="410" text-anchor="middle" font-size="9" fill="#c0d0f0">per-tenant key prefixes</text>

  <text x="380" y="456" text-anchor="middle" font-size="10" font-style="italic" fill="#2d7d6b">Passwordless: the app presents a short-lived RDS IAM token as the database password (no stored DB secret).</text>
</svg>
