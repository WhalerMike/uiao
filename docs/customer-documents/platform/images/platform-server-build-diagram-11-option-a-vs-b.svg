<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO 16:9 blueprint (ADR-093). Appendix A — Option A (rejected) vs Option B (canon).
       Palette: navy #0D1B2E · teal #1E8C8C · teal_tint #D7F2EE · ice #EAF1FB
       red #C0392B · muted #6B7A8D · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7A8D"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title (Georgia bold navy) -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Appendix A &#8212; Option A (rejected) vs Option B (canon)</text>

  <!-- ============ LEFT PANEL: Option A (de-emphasized, rejected) ============ -->
  <rect x="60" y="110" width="560" height="560" rx="16" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Red X mark in top-right corner -->
  <g stroke="#C0392B" stroke-width="6" stroke-linecap="round">
    <line x1="566" y1="132" x2="600" y2="166"/>
    <line x1="600" y1="132" x2="566" y2="166"/>
  </g>

  <!-- Panel header -->
  <text x="90" y="160" font-size="22" font-weight="bold" fill="#0D1B2E">Option A &#8212; IIS + git-http-backend (CGI)</text>

  <!-- Box: IIS Windows Auth -->
  <rect x="120" y="210" width="440" height="86" rx="10" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="2"/>
  <text x="340" y="253" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#6B7A8D">IIS Windows Auth</text>
  <text x="340" y="276" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#6B7A8D">(Kerberos + NTLM)</text>

  <!-- Arrow down -->
  <line x1="340" y1="296" x2="340" y2="346" stroke="#6B7A8D" stroke-width="2.5" marker-end="url(#arrow-muted)"/>

  <!-- Box: git-http-backend.exe -->
  <rect x="120" y="350" width="440" height="86" rx="10" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="2"/>
  <text x="340" y="386" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="18" fill="#6B7A8D">git-http-backend.exe</text>
  <text x="340" y="410" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#6B7A8D">(CGI)</text>

  <!-- Muted bullet lines -->
  <text x="120" y="490" font-size="16" fill="#5A5A5A">&#8226;&#160;&#160;no web UI</text>
  <text x="120" y="524" font-size="16" fill="#5A5A5A">&#8226;&#160;&#160;manual group mapping</text>
  <text x="120" y="558" font-size="16" fill="#5A5A5A">&#8226;&#160;&#160;lab-mode only</text>

  <!-- ============ RIGHT PANEL: Option B (emphasized, canon) ============ -->
  <rect x="660" y="110" width="560" height="560" rx="16" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="3"/>

  <!-- Panel header (two lines to clear the ADR banner) -->
  <text x="690" y="155" font-size="22" font-weight="bold" fill="#0D1B2E">Option B &#8212; Gitea behind IIS</text>
  <text x="690" y="184" font-size="22" font-weight="bold" fill="#0D1B2E">reverse proxy&#160;&#160;&#183;&#160;&#160;CANON</text>

  <!-- ADR banner top-right -->
  <rect x="978" y="132" width="224" height="40" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1090" y="153" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#0D1B2E">ADR-041 accepted 2026-05-12</text>

  <!-- Box: IIS TLS terminate -->
  <rect x="720" y="210" width="440" height="86" rx="10" fill="#0D1B2E"/>
  <text x="940" y="246" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">IIS &#8212; TLS terminate</text>
  <text x="940" y="270" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="17" fill="#FFFFFF">:443</text>

  <!-- Teal arrow down -->
  <line x1="940" y1="296" x2="940" y2="346" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Box: Gitea native -->
  <rect x="720" y="350" width="440" height="86" rx="10" fill="#0D1B2E"/>
  <text x="940" y="386" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Gitea &#8212; native</text>
  <text x="940" y="410" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="17" fill="#FFFFFF">:3000</text>

  <!-- Four teal_tint sub-tags (navy text) -->
  <rect x="720" y="470" width="210" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="825" y="499" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#0D1B2E">web UI + REST API</text>

  <rect x="950" y="470" width="210" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1055" y="499" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#0D1B2E">AD LDAPS + Entra OIDC</text>

  <rect x="720" y="546" width="210" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="825" y="575" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#0D1B2E">native hooks + webhooks</text>

  <rect x="950" y="546" width="210" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1055" y="567" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#0D1B2E">Entra groups</text>
  <text x="1055" y="587" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#0D1B2E">&#8594; Gitea teams</text>
</svg>
