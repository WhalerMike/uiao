<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint figure (ADR-093). Palette: src/uiao/canon/svg-style/palette.json -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Phase 9 &#8212; the governance hook pipeline</text>

  <!-- git push (navy box, far left) -->
  <rect x="60" y="310" width="150" height="100" rx="10" fill="#0D1B2E"/>
  <text x="135" y="360" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#FFFFFF">git push</text>

  <!-- teal arrow: git push -> gate stack -->
  <line x1="210" y1="360" x2="288" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- pre-receive header -->
  <text x="450" y="138" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="17" font-weight="bold" fill="#0D1B2E">pre-receive</text>

  <!-- Gate stack: five teal_tint boxes, navy stroke, navy text -->
  <!-- box width 320, x 290..610, height 64, gap 14, top y 158 -->
  <rect x="290" y="158" width="320" height="64" rx="8" fill="#D7F2EE" stroke="#0D1B2E" stroke-width="2"/>
  <text x="450" y="190" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">author in CanonStewards</text>

  <rect x="290" y="236" width="320" height="64" rx="8" fill="#D7F2EE" stroke="#0D1B2E" stroke-width="2"/>
  <text x="450" y="268" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">reject FOUO markings</text>

  <rect x="290" y="314" width="320" height="64" rx="8" fill="#D7F2EE" stroke="#0D1B2E" stroke-width="2"/>
  <text x="450" y="346" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">validate canon YAML frontmatter</text>

  <rect x="290" y="392" width="320" height="64" rx="8" fill="#D7F2EE" stroke="#0D1B2E" stroke-width="2"/>
  <text x="450" y="424" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">filename regex <tspan font-family="Consolas, monospace">UIAO_NNN</tspan></text>

  <rect x="290" y="470" width="320" height="64" rx="8" fill="#D7F2EE" stroke="#0D1B2E" stroke-width="2"/>
  <text x="450" y="502" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">reject unsigned <tspan font-family="Consolas, monospace">.ps1</tspan></text>

  <!-- Rejection path: red arrow curving from gate stack back to git push -->
  <path d="M 290 540 C 180 560, 135 500, 135 415" fill="none" stroke="#C0392B" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
  <!-- red X glyph -->
  <g stroke="#C0392B" stroke-width="4" stroke-linecap="round">
    <line x1="206" y1="588" x2="226" y2="608"/>
    <line x1="226" y1="588" x2="206" y2="608"/>
  </g>
  <!-- rejected label -->
  <text x="246" y="598" text-anchor="start" dominant-baseline="central" font-size="15" font-weight="bold" fill="#C0392B">rejected</text>

  <!-- teal arrow: gate stack -> update box -->
  <line x1="610" y1="346" x2="688" y2="346" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- update box (navy) -->
  <rect x="690" y="294" width="220" height="104" rx="10" fill="#0D1B2E"/>
  <text x="800" y="334" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">update</text>
  <text x="800" y="360" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#FFFFFF">branch allowlist</text>

  <!-- teal arrow: update -> post-receive -->
  <line x1="800" y1="398" x2="800" y2="446" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- post-receive box (navy) -->
  <rect x="660" y="448" width="280" height="116" rx="10" fill="#0D1B2E"/>
  <text x="800" y="482" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">post-receive</text>
  <text x="800" y="510" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#FFFFFF">log +</text>
  <text x="800" y="534" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">repository_dispatch</text>

  <!-- teal arrow: post-receive -> accepted to main -->
  <line x1="940" y1="506" x2="1018" y2="506" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- accepted to main (teal_tint) -->
  <rect x="1020" y="454" width="200" height="104" rx="10" fill="#D7F2EE" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1120" y="506" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">accepted to main</text>
</svg>
