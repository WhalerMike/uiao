<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Figure title -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">The fourteen-phase build sequence</text>

  <!-- Stage 1: Phases 0-3 — navy -->
  <rect x="54" y="215" width="152" height="210" rx="10" fill="#0D1B2E"/>
  <text x="130" y="252" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="19" font-weight="bold" fill="#FFFFFF">Phases 0-3</text>
  <text x="130" y="300" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#FFFFFF">
    <tspan x="130" dy="0">Foundation:</tspan>
    <tspan x="130" dy="1.4em">prereqs, base</tspan>
    <tspan x="130" dy="1.4em">hardening,</tspan>
    <tspan x="130" dy="1.4em">IIS, TLS</tspan>
  </text>

  <!-- arrow 1->2 -->
  <line x1="206" y1="320" x2="222" y2="320" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Stage 2: Phases 4-5 — teal_tint -->
  <rect x="224" y="215" width="152" height="210" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="300" y="252" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="19" font-weight="bold" fill="#0D1B2E">Phases 4-5</text>
  <text x="300" y="300" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#0D1B2E">
    <tspan x="300" dy="0">Service:</tspan>
    <tspan x="300" dy="1.4em">Gitea +</tspan>
    <tspan x="300" dy="1.4em">reverse proxy</tspan>
  </text>

  <!-- arrow 2->3 -->
  <line x1="376" y1="320" x2="392" y2="320" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Stage 3: Phases 6-7 — teal_tint -->
  <rect x="394" y="215" width="152" height="210" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="470" y="252" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="19" font-weight="bold" fill="#0D1B2E">Phases 6-7</text>
  <text x="470" y="300" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#0D1B2E">
    <tspan x="470" dy="0">Identity:</tspan>
    <tspan x="470" dy="1.4em">AD LDAPS +</tspan>
    <tspan x="470" dy="1.4em">Entra OIDC</tspan>
  </text>

  <!-- arrow 3->4 -->
  <line x1="546" y1="320" x2="562" y2="320" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Stage 4: Phases 8-9 — navy -->
  <rect x="564" y="215" width="152" height="210" rx="10" fill="#0D1B2E"/>
  <text x="640" y="252" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="19" font-weight="bold" fill="#FFFFFF">Phases 8-9</text>
  <text x="640" y="300" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#FFFFFF">
    <tspan x="640" dy="0">Content +</tspan>
    <tspan x="640" dy="1.4em">governance</tspan>
    <tspan x="640" dy="1.4em">hooks</tspan>
  </text>

  <!-- arrow 4->5 -->
  <line x1="716" y1="320" x2="732" y2="320" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Stage 5: Phases 10-11 — ice -->
  <rect x="734" y="215" width="152" height="210" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="810" y="252" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="19" font-weight="bold" fill="#0D1B2E">Phases 10-11</text>
  <text x="810" y="300" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#0D1B2E">
    <tspan x="810" dy="0">Cloud:</tspan>
    <tspan x="810" dy="1.4em">Intune +</tspan>
    <tspan x="810" dy="1.4em">Azure Arc</tspan>
  </text>

  <!-- arrow 5->6 -->
  <line x1="886" y1="320" x2="902" y2="320" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Stage 6: Phases 12-13 — navy -->
  <rect x="904" y="215" width="152" height="210" rx="10" fill="#0D1B2E"/>
  <text x="980" y="252" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="19" font-weight="bold" fill="#FFFFFF">Phases 12-13</text>
  <text x="980" y="300" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#FFFFFF">
    <tspan x="980" dy="0">Resilience:</tspan>
    <tspan x="980" dy="1.4em">backup/DR +</tspan>
    <tspan x="980" dy="1.4em">hardening</tspan>
  </text>

  <!-- arrow 6->7 -->
  <line x1="1056" y1="320" x2="1072" y2="320" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Stage 7: Phase 14 — amber_tint (governance keystone) -->
  <rect x="1074" y="215" width="152" height="210" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="3"/>
  <text x="1150" y="252" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="19" font-weight="bold" fill="#0D1B2E">Phase 14</text>
  <text x="1150" y="300" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#0D1B2E">
    <tspan x="1150" dy="0">OrgTree</tspan>
    <tspan x="1150" dy="1.4em">integration</tspan>
  </text>

  <!-- caption below stage 7 -->
  <text x="1150" y="455" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5A5A5A">
    <tspan x="1150" dy="0">registers the host as a</tspan>
    <tspan x="1150" dy="1.4em">governed OrgTree object</tspan>
  </text>
</svg>
