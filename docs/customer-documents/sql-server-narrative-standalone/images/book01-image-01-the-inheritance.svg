<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="trunkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A66"/>
      <stop offset="1" stop-color="#0D1B2E"/>
    </linearGradient>
    <marker id="gapArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="64" y="74" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="36" fill="#0D1B2E">The authentication inheritance</text>
  <text x="64" y="106" font-size="18" fill="#6B7A8D">Windows Authentication was good engineering — its roots run deep, and that is exactly why ending it is hard.</text>

  <!-- Entra cloud (the sky to reach) -->
  <rect x="506" y="150" width="268" height="78" rx="18" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="186" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="23" fill="#0D1B2E">Microsoft Entra ID</text>
  <text x="640" y="210" text-anchor="middle" font-size="13" fill="#1E8C8C">the sky this estate must be re-rooted to reach</text>

  <!-- gap arrow from canopy to sky -->
  <line x1="640" y1="300" x2="640" y2="236" stroke="#1E8C8C" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#gapArrow)"/>
  <text x="772" y="266" font-size="13" font-weight="bold" fill="#1E8C8C">requires transformation</text>
  <text x="772" y="284" font-size="12" fill="#6B7A8D">(Books 2–10)</text>

  <!-- canopy -->
  <circle cx="588" cy="346" r="50" fill="#D7F2EE" stroke="#0D1B2E" stroke-width="1.5"/>
  <circle cx="694" cy="344" r="52" fill="#D7F2EE" stroke="#0D1B2E" stroke-width="1.5"/>
  <circle cx="612" cy="306" r="44" fill="#D7F2EE" stroke="#0D1B2E" stroke-width="1.5"/>
  <circle cx="672" cy="308" r="46" fill="#D7F2EE" stroke="#0D1B2E" stroke-width="1.5"/>
  <circle cx="640" cy="356" r="58" fill="#D7F2EE" stroke="#0D1B2E" stroke-width="1.5"/>

  <!-- trunk -->
  <path d="M616,520 L664,520 L654,366 L626,366 Z" fill="url(#trunkGrad)"/>
  <rect x="536" y="436" width="208" height="32" rx="16" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="640" y="457" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">SQL Server engine</text>

  <!-- ground line -->
  <line x1="48" y1="520" x2="1232" y2="520" stroke="#0D1B2E" stroke-width="2"/>
  <text x="64" y="544" font-size="13" fill="#6B7A8D">inherited roots — each a mechanism Windows Authentication depends on</text>

  <!-- roots (below ground) -->
  <path d="M640,520 C500,566 340,584 206,636" fill="none" stroke="#1E3A66" stroke-width="7" stroke-linecap="round"/>
  <path d="M640,520 C548,576 472,612 410,652" fill="none" stroke="#1E3A66" stroke-width="7" stroke-linecap="round"/>
  <path d="M640,520 C636,580 644,620 640,664" fill="none" stroke="#1E3A66" stroke-width="7" stroke-linecap="round"/>
  <path d="M640,520 C736,576 812,612 874,652" fill="none" stroke="#1E3A66" stroke-width="7" stroke-linecap="round"/>
  <path d="M640,520 C788,566 940,584 1078,636" fill="none" stroke="#1E3A66" stroke-width="7" stroke-linecap="round"/>

  <!-- root tips + labels -->
  <circle cx="206" cy="636" r="6" fill="#0D1B2E"/>
  <text x="206" y="660" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Kerberos via SSPI</text>
  <circle cx="410" cy="652" r="6" fill="#0D1B2E"/>
  <text x="410" y="676" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">SPN registration</text>
  <circle cx="640" cy="664" r="6" fill="#C0392B"/>
  <text x="640" y="688" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">NTLM fallback</text>
  <circle cx="874" cy="652" r="6" fill="#0D1B2E"/>
  <text x="874" y="676" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">service accounts</text>
  <circle cx="1078" cy="636" r="6" fill="#0D1B2E"/>
  <text x="1078" y="660" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">the sa account</text>
</svg>
