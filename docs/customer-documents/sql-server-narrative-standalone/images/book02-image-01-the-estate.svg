<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="estateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A66"/>
      <stop offset="1" stop-color="#0D1B2E"/>
    </linearGradient>
    <marker id="estTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="estBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E75B6"/>
    </marker>
  </defs>

  <text x="64" y="74" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">The estate, sorted before it is migrated</text>
  <text x="64" y="104" font-size="17" fill="#6B7A8D">Twenty years of forest sprawl is triaged into three piles before any login is touched: retain, consolidate, retire.</text>

  <!-- LEFT: the sprawling, tangled estate -->
  <text x="270" y="178" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="19" fill="#0D1B2E">the estate as discovered</text>
  <text x="270" y="200" text-anchor="middle" font-size="13" fill="#6B7A8D">larger than any team's mental model of it</text>
  <!-- scattered instance blocks of varying size -->
  <rect x="120" y="240" width="78" height="58" rx="5" fill="url(#estateGrad)"/>
  <rect x="190" y="306" width="62" height="44" rx="5" fill="url(#estateGrad)"/>
  <rect x="150" y="362" width="96" height="64" rx="5" fill="url(#estateGrad)"/>
  <rect x="236" y="252" width="54" height="50" rx="5" fill="#1E3A66"/>
  <rect x="276" y="334" width="84" height="52" rx="5" fill="url(#estateGrad)"/>
  <rect x="118" y="440" width="70" height="46" rx="5" fill="#1E3A66"/>
  <rect x="220" y="432" width="92" height="60" rx="5" fill="url(#estateGrad)"/>
  <rect x="324" y="266" width="58" height="42" rx="5" fill="#1E3A66"/>
  <rect x="340" y="404" width="66" height="50" rx="5" fill="url(#estateGrad)"/>
  <rect x="184" y="498" width="80" height="40" rx="5" fill="#1E3A66"/>
  <text x="270" y="566" text-anchor="middle" font-size="12" fill="#6B7A8D">SQL Server instances accumulated across an AD forest</text>

  <!-- the triage arrow -->
  <line x1="424" y1="384" x2="560" y2="384" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#estTeal)"/>
  <text x="492" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">assess</text>
  <text x="492" y="406" text-anchor="middle" font-size="12" fill="#6B7A8D">consolidation gate</text>

  <!-- RIGHT: three sorted piles -->
  <!-- RETAIN -->
  <rect x="600" y="210" width="600" height="138" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <rect x="624" y="244" width="54" height="70" rx="5" fill="#1E8C8C"/>
  <rect x="686" y="262" width="44" height="52" rx="5" fill="#1E8C8C"/>
  <text x="762" y="256" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="22" fill="#0D1B2E">Retain</text>
  <text x="762" y="284" font-size="14" fill="#33414F">carries forward into the authentication migration</text>
  <text x="762" y="306" font-size="13" fill="#6B7A8D">healthy, in use, version supported — Books 04 to 09 act on these</text>

  <!-- CONSOLIDATE -->
  <rect x="600" y="362" width="600" height="138" rx="8" fill="#EAF1FB" stroke="#2E75B6" stroke-width="2"/>
  <rect x="624" y="396" width="44" height="70" rx="5" fill="#2E75B6"/>
  <rect x="676" y="396" width="44" height="70" rx="5" fill="#2E75B6"/>
  <line x1="734" y1="431" x2="780" y2="431" stroke="#2E75B6" stroke-width="3.5" marker-end="url(#estBlue)"/>
  <text x="800" y="408" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="22" fill="#0D1B2E">Consolidate</text>
  <text x="800" y="436" font-size="14" fill="#33414F">merged onto fewer targets before migrating</text>
  <text x="800" y="458" font-size="13" fill="#6B7A8D">shrinks the surface that has to be transformed</text>

  <!-- RETIRE -->
  <rect x="600" y="514" width="600" height="138" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <rect x="624" y="548" width="50" height="68" rx="5" fill="#A9B8CA"/>
  <line x1="630" y1="554" x2="668" y2="610" stroke="#C0392B" stroke-width="3"/>
  <line x1="668" y1="554" x2="630" y2="610" stroke="#C0392B" stroke-width="3"/>
  <text x="700" y="556" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="22" fill="#0D1B2E">Retire</text>
  <text x="700" y="584" font-size="14" fill="#33414F">should not survive the transformation at all</text>
  <text x="700" y="606" font-size="13" fill="#6B7A8D">zombie databases, EOL instances — never migrate what you can decommission</text>

  <text x="900" y="690" text-anchor="middle" font-size="12" fill="#6B7A8D">Illustrative — a metaphor for the retain / consolidate / retire decision, not measured instance counts.</text>
</svg>
