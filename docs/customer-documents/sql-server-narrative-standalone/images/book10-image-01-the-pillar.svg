<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="pillarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A66"/>
      <stop offset="1" stop-color="#0D1B2E"/>
    </linearGradient>
  </defs>

  <text x="64" y="74" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Three SQL capabilities rest on one pillar</text>
  <text x="64" y="104" font-size="17" fill="#6B7A8D">Remove ADCS without a replacement and the slab it carries has nothing left to stand on — a "Not Yet Defined" gap.</text>

  <!-- the slab carried by the pillar -->
  <rect x="300" y="190" width="680" height="62" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="18" fill="#0D1B2E">SQL Server certificate-dependent capabilities</text>
  <text x="640" y="242" text-anchor="middle" font-size="13" fill="#6B7A8D">each one needs an ADCS-issued certificate</text>

  <!-- three capability blocks resting on the slab -->
  <rect x="324" y="282" width="200" height="84" rx="6" fill="#1E8C8C"/>
  <text x="424" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="16" fill="#FFFFFF">TLS encryption</text>
  <text x="424" y="340" text-anchor="middle" font-size="12" fill="#D7F2EE">connections in transit</text>

  <rect x="540" y="282" width="200" height="84" rx="6" fill="#1E8C8C"/>
  <text x="640" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="16" fill="#FFFFFF">Certificate-mapped</text>
  <text x="640" y="330" text-anchor="middle" font-size="14" fill="#FFFFFF">logins</text>
  <text x="640" y="352" text-anchor="middle" font-size="12" fill="#D7F2EE">identity bound to a cert</text>

  <rect x="756" y="282" width="200" height="84" rx="6" fill="#1E8C8C"/>
  <text x="856" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="16" fill="#FFFFFF">Cert-Based Auth</text>
  <text x="856" y="332" text-anchor="middle" font-size="12" fill="#D7F2EE">the authorized interim</text>
  <text x="856" y="350" text-anchor="middle" font-size="12" fill="#D7F2EE">NTLM-replacement posture</text>

  <!-- the load line from slab to pillar -->
  <line x1="500" y1="252" x2="500" y2="400" stroke="#E3E8EF" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- the single ADCS pillar -->
  <rect x="430" y="400" width="140" height="200" fill="url(#pillarGrad)"/>
  <rect x="410" y="392" width="180" height="16" rx="3" fill="#0D1B2E"/>
  <rect x="404" y="600" width="192" height="20" rx="3" fill="#0D1B2E"/>
  <!-- pillar flutes -->
  <line x1="466" y1="408" x2="466" y2="600" stroke="#1E3A66" stroke-width="2"/>
  <line x1="500" y1="408" x2="500" y2="600" stroke="#1E3A66" stroke-width="2"/>
  <line x1="534" y1="408" x2="534" y2="600" stroke="#1E3A66" stroke-width="2"/>
  <text x="500" y="660" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="20" fill="#0D1B2E">ADCS</text>
  <text x="500" y="684" text-anchor="middle" font-size="13" fill="#6B7A8D">Active Directory Certificate Services</text>

  <!-- the warning: pillar removed, no replacement -->
  <rect x="720" y="430" width="448" height="180" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <circle cx="760" cy="472" r="20" fill="#C0392B"/>
  <text x="760" y="480" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="24" fill="#FFFFFF">!</text>
  <text x="794" y="466" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="18" fill="#0D1B2E">Decommission ADCS with no</text>
  <text x="794" y="490" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="18" fill="#0D1B2E">Cloud PKI in place, and...</text>
  <text x="752" y="524" font-size="14" fill="#33414F">• TLS certificates expire and connections fail</text>
  <text x="752" y="550" font-size="14" fill="#33414F">• certificate-mapped logins can no longer authenticate</text>
  <text x="752" y="576" font-size="14" fill="#33414F">• the NTLM-replacement interim posture collapses</text>
  <text x="752" y="600" font-size="13" font-weight="bold" fill="#C0392B">the CA-to-Cloud-PKI migration is not yet defined</text>

  <text x="640" y="708" text-anchor="middle" font-size="12" fill="#6B7A8D">Illustrative — the pillar metaphor names a dependency gap; it is not a normative migration design.</text>
</svg>
