<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="teal3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="grey3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7A8D"/>
    </marker>
  </defs>

  <text x="64" y="74" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="32" fill="#0D1B2E">The identity plane: what Conditional Access can see</text>
  <text x="64" y="104" font-size="16" fill="#6B7A8D">Same destination, different visibility — only authentication that rides the Entra identity plane is subject to Conditional Access.</text>

  <!-- identity plane slab -->
  <rect x="110" y="184" width="1060" height="70" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="2" opacity="0.92"/>
  <text x="132" y="226" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="18" fill="#0D1B2E">Microsoft Entra identity plane</text>

  <!-- Path A: up through the gate and down (drawn under the gate/slab labels) -->
  <polyline points="150,506 640,224 1120,506" fill="none" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#teal3)"/>
  <rect x="312" y="356" width="96" height="26" rx="13" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="360" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8C8C">OAuth token</text>

  <!-- Conditional Access gate (eye) at the peak -->
  <line x1="612" y1="196" x2="612" y2="252" stroke="#1E8C8C" stroke-width="3"/>
  <line x1="668" y1="196" x2="668" y2="252" stroke="#1E8C8C" stroke-width="3"/>
  <ellipse cx="640" cy="224" rx="24" ry="14" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <circle cx="640" cy="224" r="6.5" fill="#1E8C8C"/>
  <text x="640" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8C8C">Entra OAuth token rides the plane — evaluated</text>
  <text x="760" y="228" font-size="13" font-weight="bold" fill="#1E8C8C">Conditional Access</text>

  <!-- client -->
  <rect x="70" y="506" width="160" height="78" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="150" y="542" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">client / application</text>
  <text x="150" y="565" text-anchor="middle" font-size="12" fill="#6B7A8D">connection request</text>

  <!-- SQL Server -->
  <rect x="1030" y="506" width="180" height="78" rx="10" fill="#0D1B2E"/>
  <text x="1120" y="551" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="17" fill="#FFFFFF">SQL Server engine</text>

  <!-- Path B: beneath the plane (grey dashed) -->
  <line x1="230" y1="545" x2="1026" y2="545" stroke="#6B7A8D" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#grey3)"/>
  <text x="628" y="624" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">NTLM / Kerberos — travels beneath the plane; Conditional Access never sees it</text>
</svg>
