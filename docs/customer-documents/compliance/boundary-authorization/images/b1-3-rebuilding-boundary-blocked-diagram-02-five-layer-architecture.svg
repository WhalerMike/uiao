<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="aTeal" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
    <marker id="aNavy" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A66"/></marker>
    <marker id="aBlue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E75B6"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="52" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="34" fill="#0D1B2E">Five-Layer In-Boundary Reference Architecture</text>
  <text x="640" y="86" text-anchor="middle" font-size="18" fill="#6B7A8D">Closing the loop (L5) is what lifts ZTMM maturity &#8212; a risk score no decision consumes only improves visibility</text>

  <!-- boundary -->
  <rect x="60" y="108" width="800" height="586" rx="16" fill="#F7FAFE" stroke="#0D1B2E" stroke-width="2.5"/>
  <text x="84" y="138" font-size="17" font-weight="bold" fill="#0D1B2E">Agency FedRAMP-Moderate Authorization Boundary</text>

  <!-- Access decisions at top -->
  <rect x="300" y="150" width="320" height="56" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="460" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Zero Trust access decisions</text>
  <text x="460" y="196" text-anchor="middle" font-size="13" fill="#6B7A8D">Conditional Access / policy engine (PEP)</text>

  <!-- L1..L5 -->
  <!-- L1 -->
  <rect x="120" y="232" width="680" height="64" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
  <text x="150" y="262" font-size="18" font-weight="bold" fill="#0D1B2E">L1 &#183; Collection</text>
  <text x="150" y="284" font-size="14" fill="#5A5A5A">Entra / Intune / Purview diagnostic settings &#183; Graph export &#183; Defender XDR &#183; Mgmt Activity API</text>
  <!-- L2 -->
  <rect x="120" y="312" width="680" height="64" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
  <text x="150" y="342" font-size="18" font-weight="bold" fill="#0D1B2E">L2 &#183; Store</text>
  <text x="150" y="364" font-size="14" fill="#5A5A5A">Log Analytics workspace &#183; archive / long-term tier &#183; immutable forensic store (180-day &amp; 28-day cliffs fixed)</text>
  <!-- L3 -->
  <rect x="120" y="392" width="680" height="64" rx="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="150" y="422" font-size="18" font-weight="bold" fill="#155E5E">L3 &#183; Analytics &amp; ML</text>
  <text x="150" y="444" font-size="14" fill="#33414F">Sentinel analytic rules (KQL) &#183; Sentinel UEBA &#183; in-boundary Azure ML / Fabric &#8594; entity risk score</text>
  <!-- L4 -->
  <rect x="120" y="472" width="680" height="64" rx="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="150" y="502" font-size="18" font-weight="bold" fill="#155E5E">L4 &#183; Response (SOAR)</text>
  <text x="150" y="524" font-size="14" fill="#33414F">Logic Apps / Automation &#8594; Graph revocation &#183; short token lifetimes (CAE substitute, at minutes)</text>
  <!-- L5 -->
  <rect x="120" y="552" width="680" height="64" rx="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2.5"/>
  <text x="150" y="582" font-size="18" font-weight="bold" fill="#155E5E">L5 &#183; Policy feedback</text>
  <text x="150" y="604" font-size="14" fill="#33414F">push the rebuilt risk signal into access decisions &#8212; risk-based Conditional Access via Graph</text>

  <!-- down arrows -->
  <line x1="98" y1="296" x2="98" y2="312" stroke="#1E3A66" stroke-width="3" marker-end="url(#aNavy)"/>
  <line x1="98" y1="376" x2="98" y2="392" stroke="#1E3A66" stroke-width="3" marker-end="url(#aNavy)"/>
  <line x1="98" y1="456" x2="98" y2="472" stroke="#1E8C8C" stroke-width="3" marker-end="url(#aTeal)"/>
  <line x1="98" y1="536" x2="98" y2="552" stroke="#1E8C8C" stroke-width="3" marker-end="url(#aTeal)"/>

  <!-- loop L5 -> access decisions -->
  <path d="M 800 584 C 880 584 880 178 624 178" fill="none" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#aTeal)"/>
  <text x="892" y="384" font-size="15" font-weight="bold" fill="#1E8C8C" transform="rotate(90 892 384)">the loop &#8212; near-real-time risk gating</text>

  <!-- CLAW dual-use branch -->
  <line x1="800" y1="344" x2="960" y2="344" stroke="#2E75B6" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#aBlue)"/>
  <rect x="962" y="300" width="266" height="92" rx="10" fill="#EAF1FB" stroke="#2E75B6" stroke-width="2.5"/>
  <text x="1095" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E4E79">CISA CLAW</text>
  <text x="1095" y="356" text-anchor="middle" font-size="13" fill="#5A5A5A">dual-use export (Agency</text>
  <text x="1095" y="374" text-anchor="middle" font-size="13" fill="#5A5A5A">Processing stage) &#8212; copy only</text>
  <text x="1095" y="418" text-anchor="middle" font-size="13" fill="#6B7A8D">satisfies TIC 3.0 / BOD 25-01;</text>
  <text x="1095" y="436" text-anchor="middle" font-size="13" fill="#6B7A8D">returns no analytics to the agency</text>

  <text x="1095" y="500" text-anchor="middle" font-size="13" fill="#8E2A20" font-weight="bold">outside the boundary</text>
</svg>
