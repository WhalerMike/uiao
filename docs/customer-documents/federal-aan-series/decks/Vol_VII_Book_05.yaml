# AAN deck spec — Vol VII Book 05 (The ServiceNow Compliance App).
# Scope: FedRAMP Moderate & Microsoft GCC Moderate only. Never cite High.
deck:
  title: "The ServiceNow Compliance App"
  subtitle: "Vol VII Book 05 — the deployable artifact: a scoped app with connectors, Flows, control map, ATF tests, and one update set"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOLUME VII"
  date_code: "2026-07-18 00:33 ET"
  journey:
    - "Ingest"
    - "Reconcile"
    - "Gate"
    - "Ship"
  sources:
    ms_graph: "https://learn.microsoft.com/graph/"
    ms_arm: "https://learn.microsoft.com/rest/api/resources/"
    infoblox_app: "host repo: infoblox-ddi-book/servicenow-app/"

slides:
  - type: title
    notes: >
      Book 05 is the deployable counterpart to Books 00–04: a scoped ServiceNow app an admin can import
      into a sub-production instance, wire to M365 and Azure through an in-boundary MID Server, and stand
      up — rather than hand-build from prose. It generalizes the in-repo DDI-provisioning app skeleton
      from provisioning to control compliance: same boundary discipline, new purpose. The journey is
      Ingest, Reconcile, Gate, Ship. GCC-Moderate throughout.
    vendor_sources: ["infoblox_app"]

  - type: section
    kicker: "PART ONE"
    title: "The loop has to be an artifact, or it is slideware"
    callout: "Books 00–04 describe the loop; a described loop deploys nothing. This is the importable app that makes it real."
    callout_accent: navy
    notes: >
      Motivate the deployable. Everything-as-code (Vol VI Book 00) means the app is an importable update
      set, its control map is machine-readable data, and its behavior is covered by runnable ATF tests.
      Set expectations honestly: this is a starter skeleton named x_fed_compliance — reviewed,
      completed per tenant, and tested in sub-prod before any production use, exactly like the DDI app
      skeleton already in the repo.

  - type: content
    kicker: "THE RECORD MODEL"
    title: "What the scoped app carries"
    layout: grid
    cards:
      - title: "Script Includes"
        body: "ComplianceIngest (read state), ComplianceReconcile (bind to IPAM/DDI CM-8), ComplianceGate (confirm closure, stamp evidence)."
        accent: navy
      - title: "Connectors via MID"
        body: "Graph and ARM REST messages routed through an in-boundary MID Server — credentials and execution never leave the ATO boundary."
        accent: teal
      - title: "Control map (data)"
        body: "data/control-map.json binds each finding to (control, task type, SLA, KSI) — a projection of the spine, CI-checked against it."
        accent: amber
      - title: "Flows + ATF + update set"
        body: "Detect-and-route Flow, exception-review Flow, ATF happy-path and negative suites, one importable update set."
        accent: navy
    callout:
      text: "Least-privilege connectors: read plus scoped, logged, individually-approved write — never standing tenant admin."
      accent: navy
    notes: >
      The four cards are the app. Card two is the boundary control: every callout that reaches an agency
      surface runs through a MID Server registered inside the ATO boundary. Card three is the anti-drift
      control: the finding-to-task binding lives in data, not code, and a CI check fails when the app's
      control map diverges from aan-compliance-spine.yml — the same regen-and-diff pattern as
      render_authorities_table.py, so the deployable app and the series SSOT cannot silently drift.
    vendor_sources: ["ms_graph", "ms_arm"]

  - type: build-sequence
    kicker: "IMPORT & WIRE-UP"
    title: "From update set to running loop"
    notes: "Fallback notes if a step omits its own."
    steps:
      - label: "Import"
        sub: "scoped app"
        accent: navy
        detail: >
          Create x_fed_compliance (or import the update set) in a sub-prod instance; add the three
          Script Includes and the two REST Messages.
        notes: "Step one: import the app skeleton into sub-prod — never straight to production."
      - label: "Connect"
        sub: "in-boundary MID"
        accent: teal
        detail: >
          Create the Graph and ARM credential aliases with the MID Server selected, pointing at the
          GCC-Moderate endpoints; set the boundary property to gcc-moderate.
        notes: >
          Step two wires the in-boundary connectors. Under GCC Moderate the Graph and ARM callouts resolve
          to the commercial endpoints that serve that boundary; GCC High and DoD are not offered.
      - label: "Check"
        sub: "control map vs spine"
        accent: amber
        detail: >
          Load data/control-map.json and run the CI check against aan-compliance-spine.yml so the app's
          control bindings match the series SSOT.
        notes: "Step three enforces the anti-drift contract before anything runs live."
      - label: "Test"
        sub: "ATF in test_mode"
        accent: teal
        detail: >
          Build the Flows, publish the catalog items, and run the ATF suites in test_mode — no live cloud —
          before enabling the connectors.
        notes: "Step four validates the workflow with no live cloud; live-connector validation is a separate, gated step."
    vendor_sources: ["infoblox_app"]

  - type: table
    kicker: "PREREQUISITES"
    title: "What the app needs to stand up"
    headers: ["Component", "Role", "Boundary note"]
    rows:
      - cells: ["Graph app registration", "Read control state + scoped write", "Never standing tenant admin"]
        accent: teal
      - cells: ["ARM service principal", "Read Azure posture per subscription", "Scoped, per-subscription"]
      - cells: ["MID Server", "Route every callout in-boundary", "Registered inside the ATO boundary"]
        accent: teal
      - cells: ["Discovery / Service Graph", "Populate the CMDB", "Reconcile job binds to IPAM/DDI"]
      - cells: ["ServiceNow IRM/GRC", "Attestation surface", "Consumes this app's task stream (Book 04)"]
        accent: amber
    callout:
      text: "A FedRAMP-authorized instance, an in-boundary MID Server, and least-privilege identities — the same discipline as the DDI app."
      accent: navy
    notes: >
      Walk the prerequisites as a build checklist. The sharpest standing risk is connector scope: the app
      must resist creep toward standing tenant admin — the least-privilege posture is a review item every
      time a new remediation is automated. All at FedRAMP Moderate and GCC Moderate.
    vendor_sources: ["infoblox_app"]

  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "The coordination loop, importable"
    layout: columns
    cards:
      - title: "Deployable"
        body: "Connectors, reconcile job, typed-task Flows, ATF coverage, one update set — an admin imports and stands it up."
        accent: teal
        status: "This book"
      - title: "In-boundary"
        body: "MID Server in-boundary; least-privilege connectors; SaaS reach gated by an explicit acknowledgment."
        accent: navy
        status: "Guardrail"
      - title: "Spine-checked"
        body: "The control map is CI-checked against the compliance spine, so app and SSOT cannot drift."
        accent: navy
        status: "Anti-drift"
    callout:
      text: "Volume VII closes here: M365 and Azure control work is coordinated, attested, and shippable — at FedRAMP Moderate & GCC Moderate."
      accent: navy
    notes: >
      Close the volume. The app generalizes the in-repo infoblox-ddi-book/servicenow-app skeleton from
      DDI provisioning to control compliance, carrying the same boundary and change-control discipline.
      Leave the audience with the whole arc: reconcile (01), operate on both clouds (02–03), attest (04),
      and ship the artifact (05) — one boundary, no rewrite needed to add more later.
