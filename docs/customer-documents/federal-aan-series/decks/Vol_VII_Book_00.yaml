# AAN deck spec — Vol VII Book 00 (ServiceNow Automation Overview).
# Build: uiao generate aan-deck --spec inbox/"Application Aware Networking"/decks/Vol_VII_Book_00.yaml \
#   --out inbox/"Application Aware Networking"/Vol_VII_Book_00_FedAAN_ServiceNow_Automation_Overview.pptx
# Scope: FedRAMP Moderate & Microsoft GCC Moderate only. Never cite High.
deck:
  title: "ServiceNow Automation for Federal Control Compliance"
  subtitle: "Volume VII overview — the coordination layer for M365 & Azure control work (FedRAMP Moderate · Microsoft GCC Moderate)"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOLUME VII"
  date_code: "2026-07-12 15:00 ET"
  journey:
    - "Coordinate"
    - "Reconcile"
    - "Operate"
    - "Attest"
  sources:
    ms_graph: "https://learn.microsoft.com/graph/"
    cisa_scuba: "https://www.cisa.gov/scuba"
    servicenow_irm: "https://www.servicenow.com/products/integrated-risk-management.html"

slides:
  - type: title
    notes: >
      Opening frame for Volume VII. This volume is the coordination layer of the Federal
      Application-Aware Networking series: it takes the control state produced on the Microsoft 365
      and Azure surfaces and turns it into tracked ServiceNow work, machine-readable evidence, and
      authorization-package input. State the scope up front and keep it there all deck: FedRAMP
      Moderate and the Microsoft GCC Moderate boundary only — other CSPs and higher boundaries are
      deferred follow-ups. Walk the four-word journey — Coordinate, Reconcile, Operate, Attest —
      before going deeper; those are the four moves every book in the volume makes.
    vendor_sources: ["uiao repo: docs/customer-documents/federal-aan-series/"]

  - type: section
    kicker: "PART ONE"
    title: "Coordination is a plane, not a tool"
    callout: "A control that is deployed but not owned, tracked, and attested is not an operating control — it is a hope."
    callout_accent: navy
    notes: >
      Motivate the volume. Volumes I–IV prove a mechanism closes a control; Volume VI deploys it as
      code. But a federal estate is run by work: a misconfiguration someone must own and fix, an
      access request someone must approve, a control someone must test and attest. That work needs a
      system of record with an approval trail, an SLA clock, and a reconcilable link to the real
      asset. That is what this volume adds — one plane further out than deployment.

  - type: content
    kicker: "THE COORDINATION DOCTRINE"
    title: "ServiceNow coordinates; it does not actuate"
    layout: grid
    cards:
      - title: "Actuation is native"
        body: "M365 (Graph, SCuBA, Purview) and Azure (Policy, Defender, Update Manager) make the change. ServiceNow does not flip the setting."
        accent: navy
      - title: "Governance is unified"
        body: "Every surface emits control state into one workflow-and-evidence system — coordination lives here, as a contract."
        accent: teal
      - title: "CMDB reconciles to IPAM/DDI"
        body: "The CMDB is a workflow projection reconciled to the authoritative CM-8 identity — never the source of truth."
        accent: amber
      - title: "In-boundary by construction"
        body: "A FedRAMP-authorized instance, a MID Server in-boundary, and least-privilege connectors — read plus scoped, logged write."
        accent: navy
    callout:
      text: "Actuate on the native surface; coordinate — owner, SLA, approval, evidence — in ServiceNow."
      accent: navy
    notes: >
      The load-bearing doctrine. Card three is the guardrail an assessor will probe: the CMDB
      reconciles to the naming plane (IPAM/DDI, the CM-8 join key established in Volume I) and never
      becomes a second, competing inventory. Cards one and two are the management-plane split from the
      Executive Summary: actuation platform-native, governance and evidence unified. Card four is the
      boundary discipline the whole series inherits. If the audience remembers one slide, this is it.
    vendor_sources: ["ms_graph", "cisa_scuba", "uiao repo: docs/customer-documents/federal-aan-series/Vol_I_Book_01_FedAAN_SSA_Landing_Zone_IPAM_FedRAMP.qmd"]

  - type: table
    kicker: "THE VOLUME"
    title: "Six books, two moves"
    headers: ["Book", "Focus", "Move"]
    rows:
      - cells: ["VII-00", "Volume overview", "Coordinate"]
      - cells: ["VII-01", "CMDB reconciliation to IPAM/DDI (CM-8)", "Reconcile"]
        accent: teal
      - cells: ["VII-02", "M365 — SCuBA / CA / Purview drift to tasks", "Operate"]
      - cells: ["VII-03", "Azure — Policy / Defender / Update Manager to tasks", "Operate"]
      - cells: ["VII-04", "Attestation — OSCAL / KSI to the ATO package", "Attest"]
        accent: teal
      - cells: ["VII-05", "The deployable scoped app", "Operate"]
    callout:
      text: "Reconcile once (Book 01); operate the loop on both clouds (02–03); attest the result (04); ship it as an app (05); govern SaaS integrations as SA-9 events (06)."
      accent: navy
    notes: >
      The volume map as a table. Book 01 is the foundation — you cannot coordinate what you cannot
      address, so the CMDB must reconcile to one authoritative identity before any task is routed.
      Books 02 and 03 run the identical five-step loop on M365 and Azure. Book 04 lifts the actioned
      task stream to assessed control state and the KSI feed. Book 05 is the deployable artifact that
      makes the whole loop real. Note every focus row stays inside the GCC-Moderate boundary.

  - type: content
    kicker: "THE BOUNDARY"
    title: "Scope held all the way through"
    layout: columns
    cards:
      - title: "FedRAMP Moderate"
        body: "The scope parameter. The platform is referred to as FedRAMP-authorized; never cited at a higher level."
        accent: navy
        status: "Authorized"
      - title: "Microsoft GCC Moderate"
        body: "M365 GCC plus Moderate-targeted Azure; Graph and ARM resolve to the commercial endpoints that serve GCC Moderate."
        accent: teal
        status: "Boundary"
      - title: "Deferred"
        body: "Other CSPs (AWS/OCI/VMware) and higher boundaries (GCC High, DoD) reconcile into the same queues later — no rework of the core."
        accent: amber
        status: "Follow-up"
    callout:
      text: "One boundary now; the loop is built so the rest joins later without a rewrite."
      accent: navy
    notes: >
      Make the scope explicit and defensible. The coordination loop is deliberately surface-agnostic:
      adding AWS, OCI, VMware, or a higher boundary later means new connectors and new control-map
      entries, not a new architecture. State plainly that nothing in this volume claims FedRAMP High —
      where an underlying service happens to hold a higher authorization, it is referred to simply as
      FedRAMP-authorized.

  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "Deployed becomes operating becomes attested"
    layout: columns
    cards:
      - title: "Coordinated"
        body: "Drift on M365 and Azure becomes owned, clocked, approved work — not a dashboard nobody actions."
        accent: teal
        status: "This volume"
      - title: "Reconciled"
        body: "Every task is addressed to one authoritative asset identity — the CMDB never forks the truth."
        accent: navy
        status: "Book 01"
      - title: "Attested"
        body: "The actioned stream becomes OSCAL and KSI evidence in the authorization package."
        accent: navy
        status: "Book 04 → Vol IV/VI"
    callout:
      text: "Next: reconcile the CMDB to IPAM/DDI (Book 01), then operate the loop on M365 (02) and Azure (03)."
      accent: navy
    notes: >
      Close on the through-line: this volume is what turns a configured control into a governed one.
      The handoff outward is to Vol IV Book 06 (Authorization Package & ConMon) and Vol VI Book 07
      (Evidence & ConMon Pipeline), which freeze the attested posture into the OSCAL bundle and the
      FedRAMP 20x KSI feed. Leave the audience with the four moves and the one boundary.
