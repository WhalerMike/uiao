deck:
  title: "Cybersecurity Training & Awareness"
  subtitle: "The AT family as a machine-readable participation record — four training dimensions, LMS evidence, and KSI-CED-RAT activation for FedRAMP 20x"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING"
  date_code: "2026-07-18 00:56 ET"
  journey:
    - "Awareness"
    - "Role-based"
    - "Secure delivery"
    - "IR / DR"
  sources:
    ms_viva_learning: "https://learn.microsoft.com/en-us/viva/learning/overview-viva-learning"
