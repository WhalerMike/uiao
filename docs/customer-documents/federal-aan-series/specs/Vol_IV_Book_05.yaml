slides:
  # --- 1. title -------------------------------------------------------------
  - type: title
    notes: |
      Opening frame for Volume IV, Book 05 — Cybersecurity Training and Awareness.
      Set the thesis that makes this book distinct in the series: FedRAMP 20x
      requires a training program that is continuously demonstrable as a
      machine-readable record of completion, and this is the one KSI the whole
      series cannot close through network, identity, or security architecture
      alone. Every other control family closes through configuration — a DNS
      resolver enforces SC-7, a Conditional Access policy enforces AC-3 — but
      AT-2, AT-3, and AT-4 require human participation recorded in a system that
      produces queryable completion evidence. Walk the four dimensions on the
      title strip — general awareness, role-based, secure delivery, and IR/DR —
      because those are exactly the four dimensions FedRAMP 20x KSI-CED-RAT
      evaluates the organization for persistently reviewing. Stress the word
      persistently: a one-time training event satisfies nothing; the KSI evaluates
      whether the organization maintains a continuous, structured, evidence-backed
      review across all four. Preview the payoff: this book closes nine NIST SP
      800-53 Rev 5 controls across the AT, CP, and IR families, activates the
      final scaffold KSI (KSI-022, KSI-CED-RAT), and takes the series to 29 of 29
      KSIs evaluable. Hold the scope line: Agency GCC Moderate / FedRAMP Moderate
      throughout, no High baseline claims, and every LMS platform named is subject
      to procurement review. Voice the draft-proposal caveat: CSI Team
      pre-decisional material, not yet reviewed by the Agency CIO Office, OIS, or
      leadership. The framing to leave the room with: a trained workforce is the
      one closure mechanism no configuration setting can substitute for.
    vendor_sources: ["nist_800_53", "fedramp_20x"]

  # --- 2. section: training can't be closed by architecture ----------------
  - type: section
    kicker: "PART ONE"
    title: "Training is the one control architecture cannot close"
    callout: "A DNS resolver enforces SC-7; a Conditional Access policy enforces AC-3. AT controls require a human participation record no config can produce."
    callout_accent: navy
    notes: |
      This section motivates why training gets its own book and why it is the
      hardest KSI to close. The core argument: every other control family in this
      series can be closed by infrastructure configuration, but training controls
      are structurally different — AT-2, AT-3, and AT-4 require human participation
      recorded in a system that produces queryable completion evidence. There is
      no switch to flip. FedRAMP 20x KSI-CED-RAT, "Reviewing All Training,"
      evaluates whether the organization persistently reviews training
      effectiveness across four dimensions, and the word persistently is
      deliberate — a single annual event is not enough; the control wants a
      continuous, structured review backed by machine-readable evidence. Set up
      the through-line for the deck: the substrate the rest of the series builds
      supplies the curriculum — the program trains people on the authoritative
      naming and addressing plane, device identity at the port, and cryptographic
      identity — but a trained workforce is the one closure mechanism no
      configuration can substitute for. That is the Closure Necessity for the AT
      family, and it is why the series' necessity claims elsewhere stay credible:
      the series does not pretend training can be automated away. The next slide
      gives the four dimensions. No vendor claim on the divider.

  # --- 3. content: the four dimensions -------------------------------------
  - type: content
    kicker: "THE FOUR-DIMENSION MODEL"
    title: "KSI-CED-RAT evaluates four training dimensions"
    layout: grid
    cards:
      - title: "General awareness"
        body: "All employees and contractors — annual security awareness plus phishing simulation and insider-threat module. AT-2 / AT-2(1) / AT-2(2)."
        accent: navy
      - title: "Role-based"
        body: "Six high-risk role tiers, each with its own curriculum and completion record. AT-3, tracked separately per tier."
        accent: teal
      - title: "Secure delivery"
        body: "Developers and engineers — OWASP Top 10, SBOM/Grype labs, secure-coding standards. AT-3(3), SA-16."
        accent: amber
      - title: "IR / DR"
        body: "Incident-response and recovery personnel — semi-annual IR drills and annual contingency tabletop. IR-2, CP-3."
        accent: red
    callout:
      text: "Each dimension has a distinct audience, delivery mechanism, frequency, and evidence type — the KSI wants all four reviewed persistently."
      accent: navy
    notes: |
      This slide gives the organizing model for the whole book — the four training
      dimensions KSI-CED-RAT requires the organization to persistently review.
      Read the four cards as four distinct programs with distinct audiences,
      cadences, and evidence types. Dimension one, general awareness (AT-2 and its
      enhancements AT-2(1) practical exercises and AT-2(2) insider threat), covers
      every employee and contractor with an annual security awareness program,
      quarterly phishing simulation, and an insider-threat module — evidence is an
      LMS completion record for all staff. Dimension two, role-based (AT-3), covers
      six high-risk role tiers — system administrators, privileged access users,
      developers, incident responders, data stewards, and executives — each with
      its own curriculum and a separate completion record by tier. Dimension three,
      secure delivery (AT-3(3) and SA-16), covers developers and engineers with
      OWASP Top 10, hands-on SBOM and Grype triage labs, and secure-coding
      standards — evidence is a certification transcript or course log. Dimension
      four, IR and DR (IR-2 and CP-3), covers incident-response and recovery
      personnel with semi-annual IR drills and an annual contingency tabletop —
      evidence is a tabletop attendance record and after-action report. The point
      to voice: KSI-CED-RAT is not satisfied by any single dimension; it wants all
      four reviewed persistently, which is why the evidence record has to speak to
      each of them. This is the NIST control structure and the FedRAMP 20x KSI, not
      a vendor claim. Vendor sources: NIST SP 800-53 AT family and the FedRAMP 20x
      program.
    vendor_sources: ["nist_800_53", "fedramp_20x"]

  # --- 4. table: KSI-CED-RAT four dimensions -------------------------------
  - type: table
    kicker: "KSI-CED-RAT"
    title: "Four dimensions, four evidence types"
    headers: ["Dimension", "Coverage", "NIST Control", "Evidence Type"]
    rows:
      - cells: ["General awareness", "All employees", "AT-2", "LMS completion record — all staff"]
        accent: navy
      - cells: ["Role-specific", "High-risk roles", "AT-3", "LMS completion record — by role tier"]
        accent: teal
      - cells: ["Secure delivery", "Developers / engineers", "AT-3(3)", "Certification or course transcript"]
        accent: amber
      - cells: ["IR / DR", "IR and recovery personnel", "IR-2, CP-3", "Tabletop attendance + after-action report"]
        accent: red
    callout:
      text: "PASS requires completion at or above 95% per dimension and per role tier, with IR/DR drills and the tabletop conducted on schedule."
      accent: teal
    notes: |
      This table is how this program decomposes KSI-CED-RAT review for the governance
      substrate — the four training dimensions the organization must persistently
      review, each with its coverage
      population, its NIST control anchor, and its evidence type. Walk the rows.
      General awareness maps to AT-2, covers all employees, and produces an
      all-staff LMS completion record. Role-specific maps to AT-3, covers the
      high-risk roles, and produces a completion record broken out by role tier.
      Secure delivery maps to AT-3(3), covers developers and engineers,
      and produces a certification or course transcript. IR and DR map to IR-2 and
      CP-3, cover incident-response and recovery personnel, and produce tabletop
      attendance records plus after-action reports. The single most important
      thing to voice is the teal callout — the PASS threshold. KSI-CED-RAT
      evaluates to PASS only when completion is at or above 95 percent overall and
      at or above 95 percent per role tier (allowing for onboarding lag and
      approved exceptions), the secure-delivery completion is at or above 95
      percent, and the IR/DR drills and the annual tabletop have actually been
      conducted on schedule with evidence dated within the past twelve months. The
      95 percent is not aspirational — it is the pass line the governance substrate
      queries. Make the point that the four evidence types are heterogeneous — two
      LMS records, a transcript, and an attendance-plus-after-action pair — which
      is exactly why the evidence contract on a later slide has to normalize them
      into one schema. This is the NIST control mapping and the FedRAMP 20x KSI, so
      the source line points there. Vendor sources: the FedRAMP 20x program and
      NIST SP 800-53.
    vendor_sources: ["fedramp_20x", "nist_800_53"]

  # --- 5. section: the four dimensions in depth ----------------------------
  - type: section
    kicker: "PART TWO"
    title: "The four dimensions in depth"
    callout: "Distinct audiences, distinct curricula — from all-staff awareness to six role tiers to hands-on developer labs and IR drills."
    callout_accent: teal
    notes: |
      This section walks each of the four dimensions in operational detail — what
      the training contains, who must complete it, and how often. The purpose is to
      show the audience that this is not one generic annual click-through but four
      genuinely different programs. Awareness is broad and shallow across the whole
      workforce; role-based is deep and narrow across six tiers; secure delivery is
      hands-on and practical for developers; IR/DR is scenario-driven and
      exercised, not lectured. The next four slides give general awareness and its
      module set, the six-tier role matrix, the developer secure-delivery
      curriculum, and the IR/DR drill and tabletop cadence. Keep the presenter
      oriented to the evidence each dimension produces, because that is what feeds
      the AT-4 record in part three — awareness produces an all-staff completion
      rate and phishing results, role-based produces per-tier completion,
      developer training produces lab completion, and IR/DR produces attendance and
      after-action documents. No vendor claim on the divider.

  # --- 6. content: AT-2 general awareness ----------------------------------
  - type: content
    kicker: "DIMENSION 1 — AT-2"
    title: "General awareness for the whole workforce"
    layout: grid
    cards:
      - title: "Eight required modules"
        body: "Zero Trust, phishing/social engineering, password and MFA hygiene, insider threat, data classification, incident reporting, acceptable use, and remote-work security."
        accent: navy
      - title: "Annual, quarterly refreshers"
        body: "Annual is the minimum for FedRAMP 20x; quarterly refreshers are best practice for GCC Moderate. Completion recorded before access is granted."
        accent: teal
      - title: "Phishing simulation (AT-2(1))"
        body: "Quarterly campaigns across the full population; click, report, and remedial-training tracking; GCC-tenant spoof scenarios tied to user identity."
        accent: amber
      - title: "Insider threat (AT-2(2))"
        body: "A dedicated module on behavioral indicators and reporting obligations, included in the all-staff completion record."
        accent: red
    callout:
      text: "GCC Moderate delivery options: Microsoft Viva Learning, the DoD Cyber Awareness Challenge, CISA training, or a FedRAMP-authorized commercial LMS."
      accent: navy
    notes: |
      This slide covers dimension one, AT-2 general security awareness, the
      broadest program because it covers every user of organizational systems —
      employees, contractors, and privileged users — before access is granted and
      on a recurring basis. Walk the eight required modules: Zero Trust
      fundamentals (driven by EO 14028 and OMB M-22-09), phishing and social
      engineering with GCC-tenant spoofing patterns, password and MFA hygiene
      (Entra MFA, FIDO2 keys, why SMS is deprecated), insider-threat awareness,
      data classification and handling with Purview sensitivity labels, incident
      reporting, acceptable use and FISMA obligations, and remote-work security.
      For FedRAMP 20x the recurring basis must produce a persistent completion
      record — annual is the standard minimum, quarterly refreshers best practice
      for GCC Moderate. Then the two enhancements: AT-2(1) practical exercises are
      satisfied by a phishing-simulation program running at minimum quarterly
      across the full population, tracking click rate, report rate, and remedial
      training for those who click, with results tied to user identity (not just
      aggregate statistics) for AT-4 purposes, and scenarios that include
      GCC-tenant spoof patterns — attackers impersonating .mil or .gov domains or
      spoofing Microsoft 365 service notifications. AT-2(2) insider-threat
      awareness is a dedicated module folded into the annual record. Voice the
      delivery options in the callout, all GCC Moderate compliant: Microsoft Viva
      Learning for M365 E3/E5 shops, the free DoD Cyber Awareness Challenge, CISA
      training, or a FedRAMP-authorized commercial LMS such as KnowBe4 or SANS.
      Phishing simulation options are Microsoft Attack Simulator or a KnowBe4 GCC
      deployment. Vendor sources: Viva Learning, the DoD Cyber Awareness Challenge,
      CISA training, and Microsoft Attack Simulator.
    vendor_sources: ["ms_viva_learning", "dod_cyber_awareness", "cisa_training", "ms_attack_simulator"]

  # --- 7. table: AT-3 six-tier role matrix ---------------------------------
  - type: table
    kicker: "DIMENSION 2 — AT-3"
    title: "Six role tiers, six curricula"
    headers: ["Tier", "Examples", "Frequency", "Hours/Yr"]
    rows:
      - cells: ["1 — System Administrators", "Cloud/network admins, Entra Global Admins", "Annual + on new tool", "24–40"]
        accent: navy
      - cells: ["2 — Privileged Access Users", "PAW users, JIT-eligible, vault users", "Annual", "8–16"]
        accent: teal
      - cells: ["3 — Developers / Engineers", "App developers, DevSecOps, pipeline owners", "Annual + quarterly lab", "24–40"]
        accent: amber
      - cells: ["4 — Incident Responders", "SOC analysts, Sentinel operators", "Semi-annual", "16–24"]
        accent: red
      - cells: ["5 — Data Stewards", "Records managers, PII processors", "Annual", "8–12"]
        accent: teal
      - cells: ["6 — Executives / PMs", "AO, PM, ISSM, COR, CO", "Annual", "4–8"]
        accent: navy
    callout:
      text: "AT-3 requires specialized training for any role with elevated access or security-relevant functions — completion tracked separately per tier."
      accent: navy
    notes: |
      This table is the AT-3 role-based training matrix — the six role tiers that
      cover the GCC Moderate environment, each with a distinct curriculum,
      frequency, and annual-hours expectation. AT-3 requires specialized training
      for any personnel with assigned security responsibilities, which for
      FedRAMP 20x means any role with elevated access, system-administration
      duties, or security-relevant functions. Read the tiers by risk. Tier 1
      system administrators are the highest-risk category — cloud and network
      admins, InfoBlox admins, Entra Global Admins — needing 24 to 40 hours a year
      across Azure security, Entra hardening, DDI security, and Sentinel
      administration, refreshed on each new tool deployment. Tier 2 privileged
      access users (PAW users, JIT-eligible roles, vault users) need 8 to 16 hours
      on PAW architecture and Entra PIM workflow. Tier 3 developers and engineers
      need 24 to 40 hours with a quarterly lab — this tier is also dimension three,
      secure delivery. Tier 4 incident responders (SOC analysts, Sentinel
      operators) need 16 to 24 hours semi-annually on KQL, playbook operation, and
      IR procedures. Tier 5 data stewards (records managers, PII processors) need 8
      to 12 hours on CUI handling, Purview DLP, and SORN obligations — this is
      AT-3(5), processing PII, connecting to the PII Processing book. Tier 6
      executives and program managers (AO, PM, ISSM, COR, contracting officer) need
      4 to 8 hours on risk posture and FedRAMP 20x obligations. Voice the callout:
      completion is tracked separately per tier, because the evidence record must
      show each tier at or above 95 percent, not just an aggregate. Tier
      curricula map directly to specific series books — DDI security to the naming
      book, PIM to the PAM book, Sentinel to the SIEM/XDR book. This is the NIST
      control structure, not a vendor claim. Vendor sources: NIST SP 800-53 AT-3.
    vendor_sources: ["nist_800_53"]

  # --- 8. content: AT-3(3)/SA-16 secure delivery ---------------------------
  - type: content
    kicker: "DIMENSION 3 — AT-3(3), SA-16"
    title: "Secure delivery — the human layer of the SDLC"
    layout: columns
    cards:
      - title: "Hands-on, not lecture"
        body: "SBOM labs (generate CycloneDX from a real repo), Grype triage exercises (classify findings, write VEX), and pair secure-code review of a vulnerable PR."
        accent: navy
        status: "Practical"
      - title: "Closes KSI-PIY-RSD's human half"
        body: "The SBOM/Grype pipeline provides the machine signal; trained developers make the triage decisions that determine remediate-or-suppress."
        accent: teal
        status: "Human layer"
      - title: "OWASP + supply chain"
        body: "OWASP Top 10, GitHub Actions security, dependency and transitive-dependency management, and BOD 26-04 D1–D5 SLA obligations."
        accent: amber
        status: "Annual + quarterly"
    callout:
      text: "Automated scanning finds the issue; the trained developer decides whether it is remediated or suppressed with a justified exploitability assertion."
      accent: teal
    notes: |
      This slide covers dimension three, secure delivery training under AT-3(3) and
      SA-16 — the training that makes developers partners in the security pipeline
      rather than treating it as a compliance hurdle. The framing to voice: FedRAMP
      20x KSI-PIY-RSD, Reviewing Security in the SDLC, is activated by the SBOM
      pipeline in the Supply Chain book and the Defender VM integration in the
      Vulnerability Management book — but that automated machinery only produces
      the signal. Training is the human layer of the review: developers who
      understand what Syft produces, what Grype flags, and what a VEX
      exploitability assertion means will engage with the pipeline as partners.
      Together the automated evidence and the trained competency satisfy the full
      CR26 intent — automated scanning provides the machine-readable signal, and
      trained developers make the triage decisions that determine whether findings
      are remediated or suppressed with a justified exploitability assertion. Then
      the delivery: this training must be practical, not lecture-based — a hands-on
      SBOM lab generating a CycloneDX SBOM from a real repository, a Grype triage
      exercise classifying findings and writing VEX assertions, quarterly pair
      review of a deliberately vulnerable pull request, a supply-chain scenario
      tabletop run with the IR tabletop, and an optional but high-value CTF
      challenge. Curriculum covers OWASP Top 10, GitHub Actions and OIDC token
      security, dependency and transitive-dependency management, and the BOD 26-04
      D1 through D5 SLA obligations. Voice the teal callout as the through-line:
      the scanner finds it, the trained human decides. This is the NIST control and
      the cross-book pipeline, not a new vendor claim. Vendor sources: NIST SP
      800-53 AT-3(3) and SA-16.
    vendor_sources: ["nist_800_53"]

  # --- 9. content: IR-2/CP-3 drills and tabletops --------------------------
  - type: content
    kicker: "DIMENSION 4 — IR-2, CP-3"
    title: "IR and DR — exercised, not just documented"
    layout: grid
    cards:
      - title: "IR drill cadence (IR-2)"
        body: "Semi-annual IR procedure walkthroughs, quarterly Sentinel playbook drills, and annual ransomware and supply-chain tabletops with leadership."
        accent: navy
      - title: "Scenario library"
        body: "SOC-maintained scenarios updated after each incident: phishing-to-lateral-movement, dependency compromise, CA misconfiguration, RPZ bypass, ransomware."
        accent: teal
      - title: "CP-3 tabletop calendar"
        body: "Four quarterly exercises testing the CP-2 plan: SQL AG failover, InfoBlox Grid failover, full multi-system tabletop, and Entra/AD DS recovery."
        accent: amber
      - title: "After-action report"
        body: "Every tabletop documents attendance (the CP-3 evidence), scenario and timeline, gaps versus CP-2, and corrective actions with owners and due dates."
        accent: red
    callout:
      text: "The after-action report feeds two things: the PM-14 T&T&M tracker and the CP-3/IR-2 evidence record the governance substrate ingests."
      accent: navy
    notes: |
      This slide covers dimension four, incident-response training (IR-2) and
      contingency training (CP-3) — the dimension that is exercised rather than
      lectured, because these controls are about whether people can execute their
      roles under pressure. IR-2 connects to the SIEM/XDR Detection Engineering
      book: the Sentinel playbooks defined there are the operational tools, and
      this training is what ensures personnel can operate them. Walk the IR
      cadence: semi-annual IR procedure walkthroughs for the full SOC and IR team,
      quarterly Sentinel playbook drills for analysts, and annual tabletops for a
      ransomware scenario and a supply-chain incident with development and
      leadership in the room, plus an annual full red/blue simulation. The SOC
      maintains a scenario library updated after each real incident and each
      after-action review — the five minimum GCC Moderate scenarios are
      phishing-to-credential-theft-to-lateral-movement, supply-chain dependency
      compromise, Entra Conditional Access misconfiguration, InfoBlox RPZ bypass /
      DNS exfiltration, and a ransomware encryption event with Defender
      containment and Azure Site Recovery failover. CP-3 contingency training
      tests the CP-2 plan established in the Business Continuity book through four
      quarterly tabletop exercises: SQL AG failover to DR replica, InfoBlox Grid
      Manager failover, a full multi-system CP-2 tabletop, and an Entra ID plus
      Azure AD DS recovery scenario. Voice the evidence point in the red card and
      callout: every tabletop produces an after-action report documenting
      attendance (that is the CP-3 evidence record), the scenario and timeline,
      gaps found versus the plan, and corrective actions with owners and due
      dates — reviewed by the ISSO and archived, feeding both the PM-14 tracker and
      the governance substrate. This is NIST control content, no vendor claim. Vendor
      sources: NIST SP 800-53 IR-2 and CP-3.
    vendor_sources: ["nist_800_53"]

  # --- 10. section: the machine-readable record ----------------------------
  - type: section
    kicker: "PART THREE"
    title: "The machine-readable evidence record (AT-4)"
    callout: "KSI-CED-RAT is satisfied by a JSON schema every LMS can populate — the contract, not the console, is the control."
    callout_accent: navy
    notes: |
      This section is where training becomes evidence. AT-4 requires the
      organization to retain and review individual training records, and for
      FedRAMP 20x KSI-CED-RAT that review must be persistent and machine-readable:
      the governance substrate needs to query whether all four training
      dimensions have been reviewed, for which populations, and when. The key
      doctrine to set up is that KSI-CED-RAT is satisfied by the
      governance.training-effectiveness-record JSON schema — any LMS that can
      populate that schema satisfies the control identically. The contract is
      LMS-agnostic; the current adapter is Microsoft Viva Learning via the Graph
      API, but the adapter is not the contract. The next three slides give the
      evidence contract and its schema, the Viva-as-adapter concentration-risk
      framing, and then walk the collection pipeline as a build sequence from LMS
      through JSON export through the governance substrate to the KSI verdict. Emphasize
      that the record has to answer four questions — did all employees complete
      AT-2, did all role-designated personnel complete AT-3, did all developers
      complete secure delivery, and did all IR/DR personnel attend the required
      drills and tabletops. No vendor claim on the divider.

  # --- 11. content: AT-4 evidence contract ---------------------------------
  - type: content
    kicker: "AT-4 — THE EVIDENCE CONTRACT"
    title: "One JSON schema, four dimensions, one verdict"
    layout: grid
    cards:
      - title: "The substrate signal"
        body: "governance.training-effectiveness-record — a Document evidence type demonstrating all four training dimensions are reviewed. The KSI-022 evidence contract."
        accent: navy
      - title: "Four questions answered"
        body: "Did all employees complete AT-2? All role personnel AT-3? All developers secure delivery? All IR/DR personnel the drills and tabletops?"
        accent: teal
      - title: "Per-tier and thresholds"
        body: "overall_completion_pct at or above 95, six role_tiers each at or above 95, cp3_tabletop_date and ir2_drill_date within 12 months."
        accent: amber
      - title: "Monthly automated pull"
        body: "A Logic App or Automation runbook exports monthly to the governance record store; the governance substrate ingests it on the next collection cycle."
        accent: red
    callout:
      text: "ksi_ced_rat_status evaluates to PASS when all four dimensions clear their thresholds — the record is the control, queried monthly."
      accent: navy
    notes: |
      This slide states the AT-4 evidence contract precisely, because it is the
      mechanism that turns four heterogeneous training programs into one queryable
      KSI verdict. The substrate signal is governance.training-effectiveness-record,
      a Document evidence type whose job is to demonstrate that all four training
      dimensions are reviewed — this is the evidence contract for KSI-022. The
      record must answer four questions: did all employees complete annual security
      awareness (AT-2), did all role-designated personnel complete their
      role-specific track (AT-3), did all developers and engineers complete secure
      delivery (AT-3(3)), and did all IR/DR personnel attend the required drills
      and tabletops (IR-2, CP-3). Walk the schema fields the audience will see in
      the book: top-level overall_completion_pct (must be at or above 95),
      snapshot_date, cp3_tabletop_date and ir2_drill_date (each within twelve
      months), and a role_tiers array; per tier a tier_name, tier_completion_pct
      (at or above 95 per tier), last_completion_date within twelve months, the
      NIST controls, and for the IR-responder tier the ir2_drill_date. Six tiers
      must be present — sysadmins, privileged access, developers, IR responders,
      data stewards, executives. The delivery is a monthly automated pull: a Logic
      App or Azure Automation runbook triggers on the first of the month, calls the
      LMS export, transforms it to the schema, writes JSON to the GCC-compliant
      governance record store, and the substrate ingests it on the next cycle.
      Voice the callout: ksi_ced_rat_status evaluates to PASS only when all four
      dimensions clear their thresholds — the record is the control, and it is
      queried monthly, not once a year. This is the series evidence contract and the
      NIST control, so the source line points to the control catalog. Vendor
      sources: NIST SP 800-53 AT-4.
    vendor_sources: ["nist_800_53"]

  # --- 12. content: Viva as adapter, not contract --------------------------
  - type: content
    kicker: "ADAPTER, NOT CONTRACT"
    title: "Viva Learning is the current adapter — swap it freely"
    layout: columns
    cards:
      - title: "Why Viva is recommended"
        body: "For M365 GCC E3/E5 shops, Graph API gives a structured JSON export of completion records that maps directly to the AT-4 schema — no extra integration."
        accent: navy
        status: "Recommended"
      - title: "Concentration-risk discipline"
        body: "Microsoft retired Viva Goals (Dec 2025) and Viva Topics (Feb 2025), redirecting to Copilot. The pipeline must not assume any one component's permanence."
        accent: amber
        status: "Verify parity"
      - title: "An LMS swap is an adapter change"
        body: "Any LMS in the delivery table that can populate the schema satisfies the control identically — a swap is a new export mapping, not a control change."
        accent: teal
        status: "LMS-agnostic"
    callout:
      text: "Verify Viva Learning GCC feature parity at deployment; treat the schema as the contract and the LMS as a replaceable adapter."
      accent: amber
    notes: |
      This slide states the adapter-versus-contract discipline explicitly, because
      it is the load-bearing risk-management decision in the book. Microsoft Viva
      Learning is the recommended LMS for organizations already on Microsoft 365
      GCC E3 or E5, and the reason is concrete: its completion data is accessible
      through the Microsoft Graph API without additional integration effort, and
      the Graph response maps directly to the AT-4 evidence schema and can be
      automated into the governance substrate on a monthly pull. But — and this is the
      point to dwell on — Viva Learning is the current adapter, not the contract.
      KSI-CED-RAT is satisfied by the governance.training-effectiveness-record JSON
      schema; any LMS in the delivery table that can populate that schema satisfies
      the control identically. This distinction is deliberate concentration-risk
      management. Microsoft has retired other Viva components — Viva Goals in
      December 2025 and Viva Topics in February 2025 — while redirecting investment
      toward Copilot, and although Viva Learning itself is not retired, the evidence
      pipeline must not assume its permanence. The operating rule: verify Viva
      Learning GCC feature parity at the time of deployment, and treat an LMS swap
      as an adapter change (a new export mapping) rather than a control change. This
      is exactly the same doctrine the Evidence Fabric book applies to the SIEM
      lake — mandate the contract, never the vendor. Voice the amber callout as the
      standing instruction. Vendor sources: the Viva Learning overview and the
      Microsoft Graph learningCourseActivity API.
    vendor_sources: ["ms_viva_learning", "ms_graph_learning"]

  # --- 13. build-sequence: AT-4 evidence pipeline --------------------------
  - type: build-sequence
    kicker: "THE AT-4 EVIDENCE PIPELINE"
    title: "From LMS record to KSI verdict, one step at a time"
    notes: "Fallback notes: the four-stage AT-4 evidence pipeline — LMS store, JSON schema export, governance substrate ingestion, KSI-CED-RAT verdict."
    steps:
      - label: "LMS store"
        sub: "Viva Learning or equivalent"
        accent: navy
        detail: >
          The LMS holds enrollment and completion records across all four
          dimensions — all-staff awareness, six role tiers, developer labs, and
          IR/DR attendance. This is the raw participation record, one system per
          adapter.
        notes: |
          Step one: the LMS store. The pipeline begins where the participation
          actually lives — the learning management system holds enrollment and
          completion records across all four training dimensions: the all-staff
          AT-2 awareness track, the six AT-3 role-tier tracks, the developer
          secure-delivery labs, and the IR/DR drill and tabletop attendance. In the
          recommended configuration this is Microsoft Viva Learning, but it could
          be any LMS in the delivery table — the DoD Cyber Awareness Challenge with
          ATCTS records, a FedRAMP-authorized KnowBe4 or SANS deployment, or CISA
          training with manual transcript entry. Emphasize that at this stage the
          data is still in the LMS's native format; nothing has been normalized
          yet. The value of the pipeline is in what happens next, not in
          centralizing the LMS. Make the point that this is the one stage where a
          human participation record is genuinely created — no configuration
          produces it, which is the whole reason training is a Closure Necessity.
          Vendor sources: the Viva Learning overview and, as alternatives, the DoD
          Cyber Awareness Challenge and CISA training.
        vendor_sources: ["ms_viva_learning", "dod_cyber_awareness"]
      - label: "JSON export"
        sub: "map to the schema (AT-4)"
        accent: teal
        detail: >
          A monthly Graph API pull is transformed into the
          governance.training-effectiveness-record schema — overall and per-tier
          completion percentages, snapshot date, and drill/tabletop dates. This is
          the adapter doing its one job.
        notes: |
          Step two: JSON export to the schema. On a monthly cadence a Logic App or
          Azure Automation runbook calls the Microsoft Graph
          learningCourseActivities endpoint (requiring the
          LearningAssignmentReport.Read.All permission), filters to the AAN course
          IDs, and transforms the response into the
          governance.training-effectiveness-record schema — overall_completion_pct,
          the six role_tiers with per-tier completion and last_completion_date, the
          secure-delivery completion, and the cp3_tabletop_date and ir2_drill_date.
          This is the adapter doing its single job: translating one LMS's native
          export into the LMS-agnostic contract. Stress that this is where the
          adapter-versus-contract discipline pays off — if Viva Learning were
          swapped for another LMS, only this transform changes; the schema
          downstream is identical. The record is written as JSON to the
          GCC-compliant governance record store. Make the point that the export is
          deterministic and repeatable, which is what makes the evidence
          assessor-friendly — the same LMS state produces the same record. Vendor
          sources: the Microsoft Graph learningCourseActivity API.
        vendor_sources: ["ms_graph_learning"]
      - label: "Substrate ingest"
        sub: "Conformance Adapter"
        accent: amber
        detail: >
          The governance substrate ingests the record via the Conformance
          Adapter on its next evidence-collection cycle, binding it to the KSI-022
          slot with high confidence once a full record is present.
        notes: |
          Step three: substrate ingestion. The governance substrate ingests
          the training-effectiveness-record via the Conformance Adapter on its next
          evidence-collection cycle and binds it to the KSI-022 evidence slot
          (slot-08, training). Once a full record is present and current, the slot
          binding moves from low to high confidence. Voice the framing that this is
          the same substrate architecture every other book feeds — training is not
          special in how its evidence is ingested, only in how its evidence is
          created (by humans, in the LMS). The substrate does not re-run the
          training or re-verify attendance; it depends on the record the adapter
          produced, exactly as it depends on the ScuBA verdicts and the SBOM
          artifacts elsewhere. This is the truth-plane pattern: the substrate is
          depended on, it does not re-platform the source. Note that because the
          record is a Document evidence type, the substrate is checking presence,
          currency, and threshold values — is the record present, is it within
          twelve months, and do the completion percentages clear 95. Vendor
          sources: none — this is governance substrate architecture, cited to the repo.
        vendor_sources: ["reference implementation (host repo): src/"]
      - label: "KSI verdict"
        sub: "KSI-CED-RAT → PASS"
        accent: red
        detail: >
          The substrate evaluates KSI-CED-RAT: PASS when overall and per-tier
          completion clear 95% and the drills and tabletop are within 12 months.
          KSI-022 moves scaffold to active, taking the series to 29/29 evaluable.
        notes: |
          Step four: the KSI verdict — the payoff of the whole pipeline. The
          substrate evaluates KSI-CED-RAT by calling the slot binding at high
          confidence, and the ksi_ced_rat_status field resolves to PASS when the
          thresholds are met: AT-2 completion at or above 95 percent, AT-3
          completion at or above 95 percent per tier, secure-delivery completion at
          or above 95 percent, and the IR/DR drills and annual tabletop conducted
          on schedule with dates within twelve months. When the monthly export is
          operational and the first record is ingested, KSI-022 moves from scaffold
          to active and its confidence from low to high (pending the first
          full-year completion cycle). This is the series milestone: KSI-022 is the
          final scaffold rule in the internal CR26 ruleset, so activating it takes CR26
          KSI coverage from 28 of 29 active to 29 of 29 active — completing all
          eight CR26 themes (IAM, MLA, SVC, SCR, PIY, INR, RPL, and now CED). Voice
          the significance: the eighteen-book series is now fully evaluable under
          FedRAMP 20x Consolidated Rules. Note the downward-trend safeguard — if a
          later completion gap drops KSI-022 to not-satisfied, the next bundle run
          auto-populates a POA&M entry, giving the AO an early warning. Vendor
          sources: the FedRAMP 20x program.
        vendor_sources: ["fedramp_20x"]

  # --- 14. table: AT/CP/IR control closure ---------------------------------
  - type: table
    kicker: "CONTROL CLOSURE"
    title: "Nine controls across AT, CP, and IR"
    headers: ["Control", "Title", "Closure Mechanism"]
    rows:
      - cells: ["AT-2", "Literacy Training and Awareness", "Annual all-staff program (8 modules); LMS record"]
        accent: navy
      - cells: ["AT-2(1)", "Practical Exercises", "Quarterly phishing simulation, click/report tracking"]
        accent: teal
      - cells: ["AT-2(2)", "Insider Threat", "Dedicated module in the annual awareness program"]
      - cells: ["AT-3", "Role-Based Training", "Six-tier matrix, completion tracked per tier"]
        accent: amber
      - cells: ["AT-3(3)", "Practical Exercises (High-Risk)", "SBOM/Grype labs, Sentinel drills, tabletops"]
      - cells: ["AT-3(5)", "Processing PII", "Purview DLP + label training for data stewards"]
        accent: teal
      - cells: ["AT-4", "Training Records", "LMS-agnostic JSON schema; monthly pull to substrate"]
        accent: navy
      - cells: ["CP-3 / IR-2", "Contingency + IR Training", "Tabletop + drill attendance and after-action reports"]
        accent: red
    callout:
      text: "Closure Necessity — these close through a human participation record, not the network substrate. Nine net-new controls across AT, CP, and IR."
      accent: amber
    notes: |
      This is the control-closure spine for the book — nine net-new NIST SP 800-53
      Rev 5 controls across three families, each mapped to the mechanism that
      closes it. Read the pattern rather than each cell. Seven controls come from
      the AT family: AT-2 literacy training and awareness (annual all-staff program
      across eight modules with an LMS completion record), AT-2(1) practical
      exercises (quarterly phishing simulation with click and report tracking and a
      remedial trigger), AT-2(2) insider-threat awareness (a dedicated module in
      the annual program), AT-3 role-based training (the six-tier matrix with
      completion tracked per tier), AT-3(3) practical exercises for high-risk roles
      (SBOM and Grype labs, Sentinel drills, tabletop participation), AT-3(5)
      processing PII (Purview DLP and sensitivity-label training for data stewards,
      connecting to the PII Processing book), and AT-4 training records (the
      LMS-agnostic governance.training-effectiveness-record schema with a monthly
      automated pull to the governance substrate). Two more come from the CP and IR
      families: CP-3 contingency training (the annual tabletop calendar with
      attendance and after-action evidence, feeding the PM-14 tracker) and IR-2
      incident-response training (semi-annual drills and quarterly Sentinel
      playbook exercises with a SOC-maintained scenario library). Voice the amber
      callout as the Closure Necessity: every one of these closes through a human
      participation record — LMS completion, drill attendance, after-action
      reports — not through the network substrate. A trained workforce is the one
      closure mechanism no configuration setting can substitute for. Keep the scope
      line: all GCC Moderate, no High claims. Vendor sources: the NIST SP 800-53
      Rev 5 control catalog.
    vendor_sources: ["nist_800_53"]

  # --- 15. content: KSI-022 activation -------------------------------------
  - type: content
    kicker: "KSI-022 ACTIVATION"
    title: "The final scaffold KSI — 28/29 becomes 29/29"
    layout: columns
    cards:
      - title: "Scaffold to active"
        body: "Once the monthly export runs and the first record is ingested, KSI-022 moves scaffold to active and confidence low to high (pending a full-year cycle)."
        accent: navy
        status: "Active"
      - title: "All eight themes covered"
        body: "IAM, MLA, SVC, SCR, PIY, INR, RPL — and now CED. KSI-CED-RAT completes coverage across all eight CR26 themes."
        accent: teal
        status: "8/8 themes"
      - title: "The series is evaluable"
        body: "Eighteen books, nine NIST control families, 29 internal KSI-decomposition rules — the Federal AAN series is fully evaluable under FedRAMP 20x Consolidated Rules."
        accent: amber
        status: "29/29"
    callout:
      text: "This completes the KSI coverage — but 'evaluable' is self-assessed; verdicts remain advisory pending independent security control assessment."
      accent: amber
    notes: |
      This slide marks the series milestone this book delivers. KSI-022,
      KSI-CED-RAT ("Reviewing All Training"), is the final scaffold rule in the
      internal CR26 ruleset. Its activation requires the
      governance.training-effectiveness-record demonstrating persistent review of
      all four training dimensions. Once the monthly LMS export is operational and
      the first record is ingested by the governance substrate, three things happen.
      First, KSI-022 status moves from scaffold to active, and confidence from low
      to high — pending the first full-year completion cycle, which is an honest
      caveat to voice. Second, the series' internal KSI-decomposition coverage moves from 28 of 29
      rules active to 29 of 29 active, completing coverage across all ten CR26
      themes the decomposition maps to: IAM, CNA, SVC, MLA, CMT, SCR, PIY, INR,
      RPL, and now CED. Third, at the series level, the
      Federal Application-Aware Networking series — nine NIST control
      families, 29 internal KSI-decomposition rules Key Security Indicators — becomes fully evaluable under
      FedRAMP 20x Consolidated Rules. Voice the amber callout as the essential
      honesty the series maintains: "evaluable" and "satisfied" here are
      self-assessed by the governance engine's conformance adapter — they are advisory and do not
      constitute a formal authorization. The verdicts must be independently
      validated through a security control assessment (Agency may engage a
      FedRAMP-recognized 3PAO) and accepted by the Agency Authorizing Official
      before an ATO is granted. That handoff to the independent assessment and the
      authorization package is exactly what the next book, Authorization Package
      and ConMon, picks up. Vendor sources: the FedRAMP 20x program.
    vendor_sources: ["fedramp_20x"]

  # --- 16. closing ---------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "The one control no configuration can close"
    layout: columns
    cards:
      - title: "Four dimensions"
        body: "Awareness, role-based, secure delivery, IR/DR — each with its own audience, cadence, and evidence, all reviewed persistently."
        accent: navy
        status: "KSI-CED-RAT"
      - title: "One contract"
        body: "The LMS-agnostic training-effectiveness-record schema — Viva is the adapter, the schema is the control, pulled monthly to the substrate."
        accent: teal
        status: "AT-4"
      - title: "The series completes"
        body: "Nine net-new controls, KSI-022 active, 29/29 KSIs evaluable — advisory pending independent SCA and the authorization package."
        accent: amber
        status: "29/29"
    callout:
      text: "A trained workforce is the one closure mechanism no configuration setting can substitute for — and saying so keeps the series' necessity claims credible."
      accent: navy
    notes: |
      Close on the through-line. Three things carry cybersecurity training to an
      ATO-ready, machine-readable state. First, four dimensions — general
      awareness, role-based, secure delivery, and IR/DR — each with a distinct
      audience, cadence, and evidence type, all of which KSI-CED-RAT requires the
      organization to review persistently, not once. Second, one contract: the
      LMS-agnostic governance.training-effectiveness-record schema, where Viva
      Learning is the current adapter but the schema is the control, exported
      monthly and ingested by the governance substrate to produce a queryable PASS
      verdict at the 95 percent thresholds. Third, the series completes: nine
      net-new controls across AT, CP, and IR, KSI-022 moved from scaffold to
      active, and the eighteen-book series taken to 29 of 29 KSIs evaluable —
      advisory and self-assessed, pending independent security control assessment
      and assembly into the authorization package. Voice the navy callout as the
      doctrinal close, the same one the book opens with: a trained workforce is the
      one closure mechanism no configuration setting can substitute for. Every
      other family in the series closes through infrastructure; this one closes
      through a human participation record, and stating that plainly is exactly
      what keeps the series' harder technology-necessity claims credible. Leave the
      room pointing forward: the self-assessed verdicts and the activated KSI feed
      the next book, Authorization Package and ConMon, which assembles them into
      the OSCAL bundle and the agency RMF package. All LMS and platform selections
      remain pre-decisional pending Agency CIO review; verify authorizations on the
      FedRAMP Marketplace at procurement time. Vendor sources: the FedRAMP 20x
      program and NIST SP 800-53.
    vendor_sources: ["fedramp_20x", "nist_800_53"]
