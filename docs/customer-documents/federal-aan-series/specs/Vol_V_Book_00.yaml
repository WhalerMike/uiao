# Deck spec — Vol V Book 00, FedAAN Training & Certification (Volume V Overview).
# Distilled from docs/customer-documents/federal-aan-series/Vol_V_Book_00_FedAAN_Training_Certification_Overview.qmd
# Schema + build command: BUILD-DERIVATIVES.md §1 (the host repo's deck generator).
# Build:
#   <deck generator> \
#     --spec "docs/customer-documents/federal-aan-series/specs/Vol_V_Book_00.yaml" \
#     --out  "docs/customer-documents/federal-aan-series/Vol_V_Book_00_FedAAN_Training_Certification_Overview.pptx" \
#     --date-code "2026-07-09 11:26 ET"
deck:
  title: "Volume V Overview — Training & Certification"
  subtitle: "The enablement layer that teaches Volumes 0–IV and evidences the training slot"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOL V · BOOK 00"
  date_code: "2026-07-09 11:26 ET"
  journey:
    - "Learn"
    - "Build"
    - "Prove"
    - "Certify"
  sources:
    fedramp_20x: "https://www.fedramp.gov/20x/"
    nist_nice: "https://www.nist.gov/itl/applied-cybersecurity/nice"
    cisa_learning: "https://learning.cisa.gov/"

slides:
  # 1 -----------------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for Volume V of the Federal Application-Aware Networking
      series — the volume overview, not a content book. Volume V is where the
      series becomes a workforce. Volumes 0 through IV describe the substrate,
      the data platform, security operations, and the authorization machinery;
      none of it closes a control until someone can build the mechanism, land its
      evidence, and trace it from the book that specifies it, through the NIST
      SP 800-53 Rev 5 control it satisfies, to the FedRAMP 20x KSI that scores
      it. Walk the journey strip — Learn, Build, Prove, Certify — because it is
      the arc of the volume: learn the corpus, build the architecture, prove the
      evidence traces, and certify the competency. Keep FedRAMP scope at
      Moderate. Note the draft disclaimer: pre-decisional CSI Team material, not
      an approved Agency position.

  # 2 -----------------------------------------------------------------------
  - type: content
    kicker: "VOLUME PURPOSE"
    title: "A workforce — not a scanner — authors the evidence state"
    layout: grid
    cards:
      - title: "Two tracks, one corpus"
        body: "A compliance track reads the series as control-closure evidence; an implementation track reads it as build instructions that end by landing evidence."
        accent: navy
      - title: "Book → control → KSI → evidence"
        body: "Every compliance module traces one evidence slot from the book that specifies it to the KSI that scores it."
        accent: teal
      - title: "Build, then bind"
        body: "Every implementation module ends with an artifact placed where the conformance adapter can bind it — working is not done."
        accent: amber
      - title: "Competency is a control"
        body: "The training itself closes AT-2/AT-3 and evidences KSI-CED — the workforce is one of the series' closure paths."
        accent: red
    callout:
      text: "Conformance tooling measures drift from an intended state; it cannot author one. Ten of 29 KSIs are tool-attestable; the other 19 bind to slots a trained workforce built."
      accent: navy
    notes: >
      This slide states the volume's purpose. The two tracks read the same corpus
      two ways: compliance as control-closure evidence, one module per evidence
      slot; implementation as build instructions, one module per book cluster,
      each ending by landing an evidence artifact. The governing claim is the
      series' Conformance-Tooling Coverage Gap turned into a curriculum:
      conformance tooling measures drift from an intended state but cannot author
      one. Ten of the twenty-nine CR26 KSIs are attestable by ScuBA-class tooling
      alone; the other nineteen bind to evidence slots that exist only because a
      trained workforce built the architecture in Volumes I through IV. And the
      training itself is a control — AT-2 and AT-3, scored by KSI-CED — so the
      workforce is not merely how the controls get closed, it is one of the
      closures.

  # 3 -----------------------------------------------------------------------
  - type: table
    kicker: "BOOKS IN THIS VOLUME"
    title: "Four books turn the corpus into competency and certification"
    headers: ["Book", "Title", "Role"]
    rows:
      - cells: ["Book 01", "The Compliance Track", "The eight evidence slots taught as curriculum — book → NIST control → FedRAMP 20x KSI → evidence — capped by the eight-slot walk"]
        accent: navy
      - cells: ["Book 02", "The Implementation Track", "Building the Volumes I–IV architectures and landing the evidence Track A consumes; lab exercises as worked builds"]
      - cells: ["Book 03", "Assessment, Rubrics & Certification", "The four-level rubric ladder, the eight-slot-walk capstone, and the KSI Closure Necessity Matrix as the certification exam"]
      - cells: ["Book 04", "Vendor Training & Lab Environments", "The realization layer — external courses mapped per volume, and scripted fixture / tenant / eval lab environments"]
        accent: teal
    callout:
      text: "The 20 per-book module summaries stay reference appendices inside Books 01–02 — teaching the series by coordinate, never restating it."
      accent: navy
    notes: >
      The reference table for the volume, read top to bottom as the learner
      progresses. Book 01 is the compliance track — the eight evidence slots
      taught as curriculum, each module tracing one slot from book to control to
      KSI to evidence, capped by the eight-slot walk. Book 02 is the
      implementation track — building the architectures of Volumes I through IV
      and landing the evidence Track A consumes, with the lab exercises as worked
      builds. Book 03 is assessment and certification — the four-level rubric
      ladder, the eight-slot-walk capstone, and the KSI Closure Necessity Matrix
      that doubles as the certification exam. Book 04 is the realization layer:
      external vendor and product courses mapped per volume, and the scripted
      fixture, trial-tenant, and product-eval lab environments. The twenty
      per-book module summaries from the staged curriculum are not promoted to
      manuscripts — they remain reference appendices inside Books 01 and 02, so
      the volume teaches the series by coordinate rather than duplicating it.

  # 4 -----------------------------------------------------------------------
  - type: content
    kicker: "HOW THIS VOLUME FITS THE PROGRAM"
    title: "Depends on every volume; produces the workforce and the training evidence"
    layout: columns
    cards:
      - title: "Teaches Volumes 0–IV"
        body: "The only volume that depends on all others — it references each Vol I–IV book by coordinate rather than restating it."
        accent: navy
        status: "→ Vol 0–IV"
      - title: "Produces the training record"
        body: "The training-effectiveness-record it generates is what Vol IV Book 06 freezes into the OSCAL bundle as the slot-8 / KSI-CED closure."
        accent: teal
        status: "→ Vol IV Book 06"
      - title: "Truth vs. enforcement"
        body: "The certification record is a truth-plane artifact feeding the KSI pipeline; the courses and labs are enforcement-plane, re-platformable per vendor."
        accent: amber
        status: "KSI-CED"
    callout:
      text: "Remove Volume V and Volumes I–IV survive as documents — but the path from 'the books exist' to 'the workforce closes the controls' does not."
      accent: navy
    notes: >
      This slide places Volume V in the program. It is the only volume that
      depends on all the others, because it teaches them — referencing each
      Volume I through IV book by its coordinates rather than restating its
      content. It produces two things nothing else can supply: trained operators
      and assessors, and the training-effectiveness-record that Volume IV's
      Authorization Package and ConMon book freezes into the OSCAL bundle as the
      slot-8, KSI-CED closure. The series' truth-versus-enforcement separation
      holds here as everywhere: the certification record is a truth-plane
      artifact that attests competency and feeds the KSI pipeline, while the
      courses and labs are enforcement-plane and re-platformable per vendor.

  # 5 -----------------------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "Learn it, build it, prove it, certify it"
    layout: columns
    cards:
      - title: "Necessary"
        body: "The controls are not closed until a workforce can build the mechanism and trace its evidence."
        accent: teal
        status: "Established"
      - title: "Self-evidencing"
        body: "The training closes AT-2/AT-3 and evaluates KSI-CED — the volume is one of the series' own closure paths."
        accent: amber
        status: "Slot 8"
      - title: "Where the series lands"
        body: "Volume V turns the four preceding volumes into a certified, evidence-producing workforce."
        accent: navy
        status: "Capstone"
    callout:
      text: "Ten of 29 KSIs a tool can attest; the other 19 need a workforce that built the architecture. Volume V builds that workforce."
      accent: navy
    notes: >
      Close on the through-line. Volume V is where the series lands: the four
      preceding volumes become a certified, evidence-producing workforce. The
      three cards summarize the take-aways — the controls are not closed until a
      workforce can build the mechanism and trace its evidence; the training is
      self-evidencing, closing AT-2 and AT-3 and evaluating KSI-CED so the volume
      is one of the series' own closure paths; and the volume is the capstone
      that turns Volumes 0 through IV into competency. Leave the audience with the
      coverage arithmetic: ten of twenty-nine KSIs a tool can attest, but the
      other nineteen need a workforce that built the architecture — and Volume V
      is how that workforce is built and proven.
    vendor_sources: ["fedramp_20x", "nist_nice", "cisa_learning"]
