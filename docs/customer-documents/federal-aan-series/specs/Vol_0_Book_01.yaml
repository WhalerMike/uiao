deck:
  title: "Existing Product Inventory Questionnaire"
  subtitle: "A discovery instrument that maps the agency's deployed tools onto the AAN compliance architecture — {{< meta agency.short >}} edition, FedRAMP Moderate"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOL 0 · BOOK 01"
  date_code: "2026-07-09 09:54 ET"
  journey:
    - "Inventory"
    - "Verify status"
    - "Map to plane"
    - "Flag gaps"
  sources:
    fedramp_marketplace: "https://marketplace.fedramp.gov/"
    sailpoint_moderate: "https://www.fedramp.gov/marketplace/products/FR2001938710A/"
    servicenow_high: "https://www.servicenow.com/company/media/press-room/servicenow-secures-fedramp-high-authorization.html"
    splunk_moderate: "https://www.fedramp.gov/marketplace/products/F1607197917/"
    riverbed_high: "https://www.riverbed.com/blogs/riverbed-platform-achieves-fedramp-class-d-certification/"
    atlassian_gov: "https://www.atlassian.com/blog/announcements/atlassiangovernmentcloud"
    tanium_moderate: "https://www.fedramp.gov/marketplace/products/FR2110342613/"
    wiz_high: "https://www.wiz.io/blog/wiz-achieves-fedramp-high-authorization"
    prisma_cloud_high: "https://www.paloaltonetworks.com/blog/prisma-cloud/fedramp-high-impact-ready/"

slides:
  # 1 -----------------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for the Existing Product Inventory Questionnaire — the Agency
      edition. This is not a content book; it is a discovery instrument. It
      inventories the products an agency already operates and maps each onto the
      Federal Application-Aware Networking compliance architecture — the
      functional planes, the control-closure books, and the Management-Plane
      Coordination Doctrine. State why it exists: the AAN plan is being executed
      without full visibility into the agency's deployed tooling, and you cannot
      select a coordination stack or claim an inherited control without first
      knowing what is already in place and how it is authorized. Two editions
      exist — this {{< meta agency.short >}} edition, which carries a hard FedRAMP Moderate scope rule
      and a pre-filled block of known Agency tools, and a Federal-agnostic edition to
      follow, which relaxes the level rule to the agency's own boundary level.
      Walk the journey strip: inventory what is deployed, verify its FedRAMP
      status, map it to the AAN plane and book, and flag anything that fails the
      scope rule. Note the draft disclaimer: this is a pre-decisional CSI Team
      discovery instrument, not an authorization artifact or a procurement
      decision.

  # 2 -----------------------------------------------------------------------
  - type: content
    kicker: "PURPOSE AND HOW TO USE"
    title: "Map what is already deployed onto the compliance architecture"
    layout: grid
    cards:
      - title: "Why it exists"
        body: "The AAN plan is executing without full visibility into deployed tooling. You cannot select a coordination stack or claim an inherited control without first knowing what is in place."
        accent: navy
      - title: "Two editions"
        body: "{{< meta agency.short >}} edition (this one): hard Moderate scope rule + pre-filled Agency tools. Federal-agnostic edition (to follow): same tables, level rule relaxed to the agency's boundary."
        accent: teal
      - title: "How to complete it"
        body: "For each category, fill four working columns — In use?, Product & offering, FedRAMP status, Deployment surface. The 'Maps to' column is pre-filled."
        accent: amber
      - title: "What comes out"
        body: "'Maps to' names the AAN book and functional plane each answer feeds; anything failing the scope rule rolls up to the flags list."
        accent: red
    callout:
      text: "A discovery instrument, not an authorization artifact or a procurement decision."
      accent: navy
    notes: >
      This slide covers purpose and mechanics. The questionnaire maps the products
      an agency already operates onto the AAN architecture so that coordination-
      stack selection and inherited-control claims rest on real knowledge of the
      estate rather than assumption. Two editions exist: the {{< meta agency.short >}} edition shown
      here carries a hard FedRAMP Moderate scope rule and a pre-filled block of
      known Agency tools, while the Federal-agnostic edition to follow keeps the same
      discovery tables but removes the Agency pre-fills and relaxes the level rule to
      "state the agency's boundary level, then require products at or above it."
      To complete it, for each category an assessor fills four working columns — is
      it in use, what product and offering, what FedRAMP status, and what
      deployment surface (cloud provider, network equipment, operating system, or
      cross-surface) — while the "Maps to" column is pre-filled to tell them which
      AAN book and functional plane the answer feeds. Emphasize the last point:
      this is a discovery instrument, not an authorization artifact and not a
      procurement decision.

  # 3 -----------------------------------------------------------------------
  - type: table
    kicker: "THE SCOPE RULE — Agency EDITION IS EXCLUSIVELY FEDRAMP MODERATE"
    title: "Four dispositions for every in-boundary dependency"
    headers: ["Situation", "Disposition"]
    rows:
      - cells: ["Class C (Moderate) authorization", "In scope — record the CSO / Marketplace ID"]
        accent: teal
      - cells: ["Class D (High) only, no Moderate offering", "Flag — High exceeds Moderate technically, but the Agency target is Moderate; confirm boundary treatment or seek a Moderate alternative"]
        accent: amber
      - cells: ["On-premises gear (appliance / firmware)", "Not a FedRAMP item — accredit via NIAP CC + DISA STIG + FIPS 140-3 + DoDIN APL"]
      - cells: ["Not FedRAMP authorized (commercial SaaS)", "Flag — not eligible as an in-boundary Agency dependency; find a Government/GovCloud edition or replace"]
        accent: red
    callout:
      text: "As of May 4, 2026 FedRAMP uses 'FedRAMP Certified': Class C = Moderate, Class D = High. Verify every status on the Marketplace at decision time."
      accent: navy
    notes: >
      This is the hard scope rule that defines the {{< meta agency.short >}} edition. Every product the
      {{< meta agency.short >}} edition documents as an in-boundary dependency must be FedRAMP Certified
      at Class C, which is Moderate. Walk the four dispositions. A product with a
      Class C Moderate authorization is in scope — record its cloud service
      offering identifier and Marketplace ID. A product authorized only at Class D
      High, with no Moderate offering, is flagged: High exceeds Moderate
      technically, but the Agency boundary target is Moderate, so the team must
      confirm the boundary treatment or seek a Moderate-authorized alternative
      rather than silently inherit a High obligation. On-premises gear — an
      appliance or firmware rather than a cloud service — is not a FedRAMP item at
      all; it is accredited through the composed gate of NIAP Common Criteria,
      DISA STIG, FIPS 140-3, and DoDIN APL covered in the Network Enforcement
      Substrate book. And a product that is not FedRAMP authorized — commercial
      SaaS — is flagged as ineligible as an in-boundary dependency, to be replaced
      with a Government or GovCloud edition. Voice the nomenclature note: as of
      May 4, 2026 FedRAMP uses "FedRAMP Certified" with Class C meaning Moderate
      and Class D meaning High, and every status must be verified on the FedRAMP
      Marketplace at the time of any authorization or procurement decision.
    vendor_sources: ["fedramp_marketplace"]

  # 4 -----------------------------------------------------------------------
  - type: table
    kicker: "KNOWN Agency INVENTORY — PRE-FILLED (Agency EDITION ONLY)"
    title: "Confirmed tools, verified FedRAMP status, dispositions (2026-07-08)"
    headers: ["Product", "FedRAMP status (verified)", "Disposition"]
    rows:
      - cells: ["SailPoint Identity Security Cloud", "Class C (Moderate) — AWS GovCloud (CSO FR2001938710A)", "In scope — identity coordinator"]
        accent: teal
      - cells: ["ServiceNow Government Cloud", "Class D (High) (DoD IL-4)", "Flag — High covers Moderate; CMDB must reconcile to IPAM/DDI (CM-8), not replace it"]
        accent: amber
      - cells: ["Splunk Cloud Platform", "Class C (Moderate) and Class D (High); SOAR = Moderate", "In scope — use the Moderate offering"]
        accent: teal
      - cells: ["Riverbed (Aternity, NPM+, SteelHead)", "Cloud DEX = Class D (High) only; SteelHead = on-prem gear", "Double flag — High-only cloud; SteelHead is gear (NIAP/STIG path)"]
        accent: red
      - cells: ["Confluence (Atlassian)", "Class C (Moderate) only via Atlassian Government Cloud", "Flag — confirm Atlassian Gov Cloud, not commercial"]
        accent: amber
      - cells: ["InfoBlox DDI", "Class C (Moderate) (CSO FR2017257053)", "In scope — the authoritative asset-identity join key"]
        accent: teal
      - cells: ["Microsoft 365 GCC / Entra / Intune / Sentinel / Purview / Defender", "GCC Moderate", "In scope"]
        accent: teal
      - cells: ["Cisco Catalyst SD-WAN", "Cloud SD-WAN Manager authorized (verify level/CSO); WAN Edge = gear", "Chosen — selected for M365 Informed Network Routing"]
        accent: teal
      - cells: ["Cisco ThousandEyes for Government", "Class C (Moderate) — ATO 2026-03-05 (CSO FR2523656707), FIPS-validated", "In scope — the Moderate observability option"]
        accent: teal
      - cells: ["Palo Alto Prisma", "Prisma Access (SASE) = Class C (Moderate); Prisma Cloud (CNAPP) = Class D (High) only", "Access in scope; Cloud flagged (High)"]
        accent: amber
    notes: >
      This is the pre-filled block of known Agency tools, with FedRAMP status
      verified as of July 8, 2026 and dispositions applied under the scope rule.
      Read it as the current state of the estate. SailPoint Identity Security
      Cloud is Moderate on AWS GovCloud and is in scope as the identity
      coordinator. ServiceNow Government Cloud is High — usable for a Moderate
      boundary and documented as such, with the critical caveat that its CMDB must
      reconcile to the InfoBlox IPAM and DDI as the CM-8 join key, not replace it.
      Splunk Cloud is authorized at both Moderate and High, and its SOAR is
      Moderate, so use the Moderate offering. Riverbed carries a double flag: its
      cloud digital-experience monitoring is High-only, above the Moderate target,
      and SteelHead is on-premises gear that takes the NIAP and STIG path.
      Confluence is Moderate only on Atlassian Government Cloud, so confirm the
      agency is not on the commercial edition. InfoBlox DDI is Moderate and is the
      authoritative asset-identity join key. The Microsoft 365 GCC suite — Entra,
      Intune, Sentinel, Purview, Defender — is GCC Moderate and in scope. Cisco
      Catalyst SD-WAN is the chosen SD-WAN, selected for Microsoft 365 Informed
      Network Routing. Cisco ThousandEyes for Government is the Moderate
      observability option, contrasting with High-only Riverbed. And Palo Alto
      Prisma splits on level — Prisma Access SASE is Moderate and in scope, while
      Prisma Cloud CNAPP is High-only and flagged. Verify every status on the
      FedRAMP Marketplace at procurement time; authorizations change.
    vendor_sources: ["sailpoint_moderate", "servicenow_high", "splunk_moderate", "riverbed_high", "atlassian_gov", "fedramp_marketplace"]

  # 5 -----------------------------------------------------------------------
  - type: content
    kicker: "IMMEDIATE READS — THE COORDINATOR PICTURE"
    title: "What the pre-filled block already tells you"
    layout: grid
    cards:
      - title: "Observability"
        body: "A clean option and a flagged one: Cisco ThousandEyes for Government is Moderate; Riverbed is High-only cloud plus on-prem gear. Prefer ThousandEyes where the Moderate rule binds."
        accent: teal
      - title: "SD-WAN is settled"
        body: "Cisco Catalyst SD-WAN, chosen for Microsoft 365 Informed Network Routing (Network Modernization book, Appendix A)."
        accent: navy
      - title: "SIEM today"
        body: "Splunk and Sentinel both give you a Moderate SIEM now; Splunk SOAR is Moderate. ServiceNow is the best coordination hub but is High — usable for a Moderate boundary, documented as such."
        accent: amber
      - title: "CNAPP splits on level"
        body: "Prisma Access (SASE) is Moderate; Prisma Cloud (CNAPP) and Wiz are both High. The Cloud-Native Posture book weighs them against a Moderate CNAPP (Defender for Cloud in GCC)."
        accent: red
    callout:
      text: "ServiceNow and SailPoint are the owned coordinators; Sentinel/Splunk actuate SIEM; Tanium, Wiz, and Prisma sit at the CNAPP/patch seams."
      accent: navy
    notes: >
      This slide draws the immediate reads out of the pre-filled block — the
      coordinator picture. On observability there is a clean option and a flagged
      one: Cisco ThousandEyes for Government is Class C Moderate, while Riverbed is
      High-only in the cloud and on-premises gear for SteelHead, so prefer
      ThousandEyes wherever the Moderate rule binds. SD-WAN is settled — Cisco
      Catalyst SD-WAN, chosen for Microsoft 365 Informed Network Routing, detailed
      in the Network Modernization book Appendix A. On SIEM, both Splunk and
      Sentinel give a Moderate option today, and Splunk SOAR is Moderate;
      ServiceNow is the strongest coordination hub but is High, so it is used for a
      Moderate boundary and documented as such with its CMDB reconciled to the DDI
      join key. And cloud-native posture splits on level: Prisma Access SASE is
      Moderate, but Prisma Cloud CNAPP and Wiz are both High, so the Cloud-Native
      Posture book must weigh those High CNAPPs against a Moderate-authorized
      option such as Microsoft Defender for Cloud in GCC Moderate. The coordinator
      picture to name aloud: ServiceNow and SailPoint are the owned coordinators,
      Sentinel and Splunk actuate the SIEM plane, and Tanium, Wiz, and Prisma sit
      at the CNAPP and patch seams. Tanium Cloud for US Government is authorized at
      Moderate; Wiz for Government is High.
    vendor_sources: ["tanium_moderate", "wiz_high", "prisma_cloud_high", "fedramp_marketplace"]

  # 6 -----------------------------------------------------------------------
  - type: content
    kicker: "SELECTION PRINCIPLE"
    title: "Microsoft-suite preference is earned, not automatic"
    layout: columns
    cards:
      - title: "The default candidate"
        body: "The agency holds a large Microsoft enterprise agreement, so a Microsoft product is the default candidate for any role — when it genuinely coordinates the multi-vendor surface at Moderate."
        accent: navy
        status: "Default"
      - title: "Earned by coordination"
        body: "Preference is earned by demonstrated cross-vendor coordination — Sentinel ingesting AWS/OCI/NEM telemetry, Defender for Cloud as a multi-cloud CNAPP — not by ownership."
        accent: teal
        status: "Earned"
      - title: "Where it loses"
        body: "Where a Microsoft product coordinates only Microsoft surfaces, or cannot reach the surface (Azure Arc cannot patch ESXi), the best cross-vendor coordinator at Moderate wins."
        accent: amber
        status: "Not automatic"
    callout:
      text: "Preference is earned by demonstrated cross-vendor coordination at Moderate, not by ownership."
      accent: navy
    notes: >
      This slide states the selection principle that governs every product choice
      in the series. The agency holds a large Microsoft enterprise agreement, so a
      Microsoft product is the default candidate for any role — but only when it
      genuinely coordinates the multi-vendor surface, meaning the cloud providers,
      the network equipment, and the operating systems, at FedRAMP Moderate. The
      qualifying examples are Sentinel ingesting AWS, OCI, and network-equipment
      telemetry, or Defender for Cloud acting as a multi-cloud CNAPP. The critical
      discipline: preference is earned by demonstrated cross-vendor coordination,
      not conferred by ownership. Where a Microsoft product coordinates only
      Microsoft surfaces, or simply cannot reach the surface in question — the
      canonical example being that Azure Arc cannot patch ESXi — the best
      cross-vendor coordinator at Moderate wins the role instead. This is what
      keeps the architecture honest: the enterprise agreement lowers the bar for
      Microsoft to be considered first, but it does not lower the bar for Microsoft
      to actually win.

  # 7 -----------------------------------------------------------------------
  - type: table
    kicker: "FLAGS & GAPS SUMMARY"
    title: "The procurement / boundary-decision agenda"
    headers: ["Item", "Issue", "Action"]
    rows:
      - cells: ["Riverbed (Aternity/NPM+)", "Class D (High)-only cloud", "Confirm Moderate need or boundary fit"]
        accent: amber
      - cells: ["Riverbed SteelHead", "On-prem gear (not FedRAMP)", "Accredit via NIAP/STIG/FIPS"]
      - cells: ["Confluence", "Moderate only on Atlassian Gov Cloud", "Confirm not on commercial edition"]
        accent: amber
      - cells: ["ServiceNow", "Class D (High) coordination hub", "Document as High covering the Moderate boundary; reconcile CMDB to DDI"]
        accent: amber
      - cells: ["Palo Alto Prisma Cloud (CNAPP)", "Class D (High)-only", "Agency-preferred; document as High covering Moderate, or select a Moderate CNAPP (Defender for Cloud)"]
        accent: red
    callout:
      text: "This list is the agenda: confirm boundary treatment for each High-only item, or select a Moderate-authorized alternative."
      accent: amber
    notes: >
      This is the flags and gaps roll-up — everything that failed the scope rule
      or has no product yet, gathered into one list that becomes the procurement
      and boundary-decision agenda. Riverbed's Aternity and NPM+ cloud offering is
      High-only, so confirm whether the Moderate need is real or whether the
      boundary fit can be justified. Riverbed SteelHead is on-premises gear, not a
      FedRAMP item, so it takes the NIAP, STIG, and FIPS accreditation path.
      Confluence is Moderate only on Atlassian Government Cloud, so confirm the
      agency is not on the commercial edition. ServiceNow is a Class D High
      coordination hub — the recommended action is to document it as High covering
      the Moderate boundary and to reconcile its CMDB to the DDI join key rather
      than let it become a second, competing asset inventory. And Palo Alto Prisma
      Cloud CNAPP is High-only despite being agency-preferred: either document it
      as High covering Moderate, or select a Moderate CNAPP such as Microsoft
      Defender for Cloud. Voice the framing: none of these are failures, they are
      the explicit decisions the discovery process surfaces so they get made
      deliberately rather than by default. Add rows as discovery proceeds.
    vendor_sources: ["riverbed_high", "atlassian_gov", "servicenow_high", "prisma_cloud_high", "fedramp_marketplace"]

  # 8 -----------------------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "Inventory it, verify it, map it, flag it — then decide"
    layout: columns
    cards:
      - title: "Know the estate"
        body: "You cannot select a coordination stack or claim an inherited control without first knowing what is deployed and how it is authorized."
        accent: teal
        status: "Established"
      - title: "Moderate is the bar"
        body: "The {{< meta agency.short >}} edition documents only FedRAMP Moderate dependencies; High-only, gear, and unauthorized products are flagged, not silently inherited."
        accent: amber
        status: "Scope rule"
      - title: "Next"
        body: "The flags list drives the procurement and boundary decisions; the Federal-agnostic edition generalizes the instrument to any agency."
        accent: navy
        status: "Agenda"
    callout:
      text: "Fill the four working columns, honor the Moderate rule, and let the flags become the decision agenda."
      accent: navy
    notes: >
      Close on the through-line. The questionnaire's job is to convert an unknown
      estate into a known one, because coordination-stack selection and
      inherited-control claims both depend on knowing what is already deployed and
      how it is authorized. The {{< meta agency.short >}} edition holds a hard bar: it documents only
      FedRAMP Moderate dependencies, and anything that is High-only, on-premises
      gear, or unauthorized is surfaced on the flags list rather than silently
      inherited into the boundary. The output is an agenda — the flags become the
      concrete procurement and boundary decisions the program then makes
      deliberately, and the same instrument, with the Agency pre-fills removed and
      the level rule relaxed, generalizes to any federal agency at its own
      boundary level. Leave the audience with the working method: fill the four
      columns, honor the Moderate rule, and let the flags drive the decisions.
