    notes: |
      This is the control-closure spine for the book, distilled from the generated
      authorities table (rendered from aan-compliance-spine.yml, not hand-kept). Read
      the pattern, not each cell: six NIST SP 800-53 Rev 5 controls — AU-3, AU-12,
      AU-12(1), AU-6(1), CA-7, SI-4(16) — all at the FedRAMP Moderate baseline, all
      in the Telemetry evidence slot, all mapping to KSI-MLA. The single most
      important column is the last one: Tool-attestable? is uniformly No. That is the
      whole argument of the series compressed into one column — because the evidence
      is the aggregated, correlated record set across surfaces, not a single-tenant
      configuration snapshot, none of these controls can be attested by a per-tenant
