deck:
  title: "Multi-Cloud Evidence Fabric"
  subtitle: "One compliance picture from many stacks — the unified evidence contract from telemetry to CDM to FedRAMP 20x KSIs"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING"
  date_code: "2026-07-09 08:15 ET"
