  # --- 16. closing ---------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "One contract, one join key, one compliance picture"
    layout: columns
    cards:
      - title: "The contract"
        body: "AU-3 raised to a cross-surface record every stack emits — the coordination mechanism, not a console."
        accent: navy
        status: "AU-3"
      - title: "The join key"
        body: "Authoritative asset identity (IPAM/DDI) plus time — the correlation AU-12(1) depends on."
        accent: teal
        status: "AU-12(1)"
      - title: "The delivery"
        body: "Collect, normalize, correlate, roll up to CDM, attest as KSI/OSCAL — CA-7 as the flow."
        accent: amber
        status: "CA-7"
    callout:
      text: "The fabric mandates the contract, never the vendor — and feeds both detection and the OSCAL bundle."
      accent: navy
    notes: |
      Close on the through-line. Three things make one compliance picture from many
      stacks: a contract, a join key, and a delivery flow. The contract is AU-3
      raised to a cross-surface record every stack emits — coordination is a
      contract, not a console. The join key is the authoritative asset identity from
      the naming plane (IPAM/DDI) plus time, which is what AU-12(1) correlation
      depends on and what the fragmented estate lacked. The delivery is the five-step
      ConMon pipeline — collect, normalize, correlate, roll up to CISA CDM, attest as
      KSI/OSCAL — closing CA-7 as the flow. Restate the guardrail: the fabric
      mandates the contract, never the vendor; Sentinel earns default by genuine
      cross-vendor ingestion, Splunk is a first-class Moderate alternative, and
      ServiceNow's CMDB reconciles to IPAM/DDI rather than replacing it. Leave the
      audience with the boundary: this fabric is the substrate detection analyzes and
      the OSCAL bundle attests — upstream of both. If the room takes one sentence
      away, make it this: coordination across heterogeneous stacks is a contract, not
      a console, and the contract plus the authoritative join key are what turn five
      partial views into one attestable compliance picture. Every control this book
      closes is uniformly not tool-attestable, precisely because the evidence is the
      aggregated, correlated record set that only a cross-surface fabric can produce.
      Selections remain pending procurement review; verify authorizations on the
      FedRAMP Marketplace.
    vendor_sources: ["cisa_cdm", "fedramp_20x"]
