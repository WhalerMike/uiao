# Deck spec — Vol 0 Book 02, FedAAN Series Control Crosswalk (Appendix).
# Distilled from Vol_0_Book_02_FedAAN_Control_Crosswalk.qmd (generated crosswalk).
# Schema: module docstring in src/uiao/generators/aan_deck.py
# Build:
#   uiao generate aan-deck \
#     --spec "docs/customer-documents/federal-aan-series/specs/Vol_0_Book_02.yaml" \
#     --out  "docs/customer-documents/federal-aan-series/Vol_0_Book_02_FedAAN_Control_Crosswalk.pptx" \
#     --date-code "2026-07-10 12:19 ET"
deck:
  title: "Series Control Crosswalk"
  subtitle: "One index — every NIST 800-53r5 control mapped to where the ten-volume series addresses it"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOL 0 · BOOK 02 (APPENDIX)"
  date_code: "2026-07-10 12:19 ET"
  journey:
    - "Control"
    - "Volume · Book"
    - "KSI"
    - "Evidence"
  sources:
    fedramp_20x: "https://www.fedramp.gov/20x/"
    nist_800_53: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"

slides:
  # 1 -----------------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for the series control crosswalk — the appendix to the
      Federal AAN program. This is the reverse index: give it a NIST SP 800-53
      Rev 5 control and it tells you which volume and book of the series
      addresses it. It exists for the assessor, ISSO, or SSP author who works
      control-first, not book-first. The index covers 149 distinct controls
      drawn from every book's own primary closure tables — not incidental
      mentions. Keep FedRAMP scope at Moderate, and remember the standing
      disclaimer: this is a navigational index, not an authorization artifact or
      a control-inheritance claim, self-assessed pending SCA and PMO/AO review.

  # 2 -----------------------------------------------------------------------
  - type: content
    kicker: "HOW TO READ A ROW"
    title: "Each control points to where the series treats it as a subject"
    layout: grid
    cards:
      - title: "Control"
        body: "The NIST SP 800-53 Rev 5 anchor — base control or a specific enhancement where a book cites it."
        accent: navy
      - title: "Where addressed"
        body: "Every Volume · Book that treats the control as a first-class subject, not a passing mention."
        accent: teal
      - title: "Architecture + code"
        body: "A control often lists two books — the one that closes it and the Vol VI book that implements it as code."
        accent: amber
      - title: "FedRAMP 20x KSI"
        body: "The Key Security Indicator a book maps the control to, where one is stated."
        accent: red
    callout:
      text: "A row means the series treats the control as a first-class subject in the named book. Read that book (and its evidence slot) for the substantive treatment."
      accent: navy
    notes: >
      The crosswalk is built by extraction, not by hand. For every book, its own
      "NIST 800-53 Rev 5 Control Closure" or "Authorities Closed Here" table and
      the sections where a control is the substantive subject were captured;
      controls named only in a framework-alignment cross-reference or a vendor
      appendix were deliberately excluded. So a row is a coverage pointer: it says
      the series treats that control as a first-class subject in the named book,
      and nothing stronger. Whether the control is fully inherited, partially
      satisfied, or shared is a boundary-and-assessor determination — the row
      sends you to the book and evidence slot that settle it. Controls frequently
      appear twice: the architecture book that closes the control and the Volume
      VI book that operationalizes it as deployable code, so both the "what" and
      the "how" sit on one line.

  # 3 -----------------------------------------------------------------------
  - type: table
    kicker: "COVERAGE BY VOLUME"
    title: "149 distinct controls span all nine content volumes"
    headers: ["Volume", "Theme", "Distinct controls"]
    rows:
      - cells: ["Vol I", "Foundation & Transport", "41"]
        accent: navy
      - cells: ["Vol II", "Data Platform", "22"]
      - cells: ["Vol III", "Security Operations", "54"]
        accent: teal
      - cells: ["Vol IV", "Governance & Assurance", "54"]
        accent: teal
      - cells: ["Vol V", "Training & Certification", "2"]
      - cells: ["Vol VI", "Implementation (as code)", "38"]
      - cells: ["Series total", "distinct controls", "149"]
        accent: amber
    callout:
      text: "293 control-to-book mappings collapse to 149 distinct controls — the overlap is the series separating architecture, implementation, and layered edge/host/cloud treatments."
      accent: navy
    notes: >
      Coverage by volume. Security Operations (Vol III) and Governance &
      Assurance (Vol IV) each carry the most distinct controls at 54, reflecting
      their breadth across detection, data protection, PAM, continuity, supply
      chain, and authorization. Foundation & Transport (Vol I) closes 41 —
      identity, addressing, network, and edge enforcement. Volume VI, the
      implementation layer, operationalizes 38 controls as deployable code; those
      rows deliberately overlap the architecture books. Volume V contributes only
      AT-2 and AT-3, because the training volume's own subject is the training
      control itself, not the many controls it teaches. The 293 raw
      control-to-book mappings collapse to 149 distinct controls once
      cross-volume overlap is removed — that overlap is a feature, showing where
      the series layers edge, host, and cloud-plane treatments of the same
      control across different books.

  # 4 -----------------------------------------------------------------------
  - type: content
    kicker: "HOW IT WAS BUILT"
    title: "Extracted from the books, generated — never hand-maintained"
    layout: columns
    cards:
      - title: "Primary coverage only"
        body: "Closure tables and substantive sections; passing mentions and cross-reference tables excluded."
        accent: navy
        status: "149 controls"
      - title: "Official NIST titles"
        body: "Rev 5 short control titles, normalized where a book's prose wording differs."
        accent: teal
        status: "800-53r5"
      - title: "Spine back-fill"
        body: "aan-compliance-spine.yml is the machine-checked SSOT, filled book by book; this appendix leads until it catches up."
        accent: amber
        status: "in progress"
    callout:
      text: "Regenerate by re-running the per-book extraction and merge, then re-rendering this appendix — the table never drifts by hand."
      accent: navy
    notes: >
      The method matters for trust. Each book's primary control treatment was
      extracted — the closure tables and the sections where a control is the
      subject — and merged deterministically into the master table. Titles are the
      official NIST SP 800-53 Rev 5 short titles, normalized where a book's prose
      differs (for example AC-11 "Device Lock," not "Session Lock"). The
      relationship to the compliance spine is important: aan-compliance-spine.yml
      is the generated, drift-gated single source of truth for machine-checked
      closures, but it is being back-filled book by book and currently formalizes
      91 closures across 17 of 67 books. Until that back-fill completes, this appendix is the most
      complete series-wide control view. Because it is generated, it is
      regenerated — re-run the extraction and merge, then re-render — so it never
      drifts by hand.

  # 5 -----------------------------------------------------------------------
  - type: table
    kicker: "FEDRAMP 20x KSI VIEW"
    title: "Where books map controls to Key Security Indicators"
    headers: ["KSI", "Controls mapped"]
    rows:
      - cells: ["KSI-MLA", "AU-2, AU-3, AU-6(1), AU-12, AU-12(1), CA-2, CA-5, CA-7, RA-5, SI-2, SI-2(2), SI-3, SI-4, SI-4(16)"]
        accent: navy
      - cells: ["KSI-CNA", "AC-4, AC-17, SC-7, SC-7(8), SC-8, SC-8(1), SC-20, SC-22"]
        accent: teal
      - cells: ["KSI-SVC", "CM-6, CM-7, SA-11, SI-2, SI-2(2), SI-2(3)"]
      - cells: ["KSI-CMT", "CM-2, CM-3, CM-6"]
      - cells: ["KSI-PIY", "CA-3, CM-8"]
      - cells: ["KSI-SCR", "SA-9, SA-9(2)"]
      - cells: ["KSI-022 (CED)", "AT-2, AT-3, AT-4, CP-3, IR-2"]
      - cells: ["KSI-IAM", "AC-2, AC-6, AC-19, AC-20, CM-5, IA-3, IA-5, IA-5(2), SC-17"]
        accent: teal
    callout:
      text: "Absence from this view means no book stated a per-control KSI mapping — not that the control is unmapped in FedRAMP 20x."
      accent: navy
    notes: >
      The KSI view aggregates every per-control FedRAMP 20x Key Security Indicator
      mapping the books state. Monitoring, Logging & Auditing (KSI-MLA) is the
      densest, pulling the AU, CA-7, RA-5, and SI detection controls that feed the
      evidence fabric. Cloud-Native Architecture (KSI-CNA) collects the boundary
      and transport-encryption controls; Service Configuration (KSI-SVC) and
      Change Management (KSI-CMT) collect the configuration and patch families; the
      training KSI (shown as KSI-022 / CED) collects AT-2/3/4, CP-3, and IR-2. Read
      the view as a floor, not a ceiling: a control's absence here only means no
      book stated a per-control KSI mapping in its closure table — many controls
      carry KSI associations at the theme or evidence-slot level that this
      strict per-control view intentionally does not infer.

  # 6 -----------------------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "A control-first door into a book-first series"
    layout: columns
    cards:
      - title: "Answer assessors fast"
        body: "Control in hand, find the volume and book that treat it — then cite the book's evidence slot."
        accent: teal
        status: "reverse index"
      - title: "Build the SSP table"
        body: "The where-addressed column seeds a control-origination map across the series."
        accent: navy
        status: "SSP §"
      - title: "Regenerate, never drift"
        body: "Re-run extraction + merge after any book's control tables change; the appendix stays true."
        accent: amber
        status: "generated"
    callout:
      text: "'Addressed here' is a coverage pointer, not an inheritance claim — the boundary and the assessor decide inheritance; the named book carries the proof."
      accent: navy
    notes: >
      Close on how to use it. The crosswalk is a control-first door into a
      book-first series: hold a control, find the volume and book that treat it,
      and cite that book's evidence slot to an assessor. Its where-addressed
      column seeds the control-origination table of a System Security Plan across
      the whole series. And because it is generated, it stays true — regenerate
      after any book's control tables change and the index never drifts. Leave the
      audience with the one discipline that keeps the appendix honest: "addressed
      here" is a coverage pointer, not a control-inheritance claim. Whether a
      control is inherited, partially satisfied, or shared is decided by the
      boundary and the assessor; the named book and its evidence slot carry the
      proof.
    vendor_sources: ["fedramp_20x", "nist_800_53"]
