    notes: >
      This slide covers IR-8, the incident-response-plan control, and its central
      caution: the seven required IR artifacts are evaluated separately from the SIEM
      system, so an agency can have a fully deployed Sentinel environment and still
      fail IR-8 if the documentation is missing. Four cards fold the seven artifacts.
      The IR plan and contacts card covers artifacts one and two: a written incident
