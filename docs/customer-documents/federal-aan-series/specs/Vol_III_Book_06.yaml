        accent: red
      - cells: ["KEV CVE exploitation attempt", "Defender for Endpoint", "Hours to days", "Minutes — MDVM alert"]
        accent: navy
      - cells: ["Unusual data exfil via SASE", "SASE flow telemetry", "Never — no baseline", "Hours — UEBA"]
        accent: teal
    callout:
      text: "The 'days to never' entries are not hypothetical. Manual log review at agency scale, with no automated rule, produces detection latencies measured in weeks — when detection happens at all."
      accent: amber
    notes: >
      This is a reference table — let the audience read it, then land the point.
      Each row is a common attack pattern against the log sources the earlier volumes
      built, with the detection latency before this book's controls and after. DNS
      command-and-control beaconing via a compromised host, visible in InfoBlox
      syslog, moves from days-to-weeks to minutes on an automated rule. Credential
      stuffing and impossible-travel sign-ins in the Entra logs move from days to
