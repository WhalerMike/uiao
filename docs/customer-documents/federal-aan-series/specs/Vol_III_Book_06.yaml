slides:
  # 1 --- title ---------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for Volume III, Book 06. The Volume I and Volume II books built
      a log pipeline of exceptional depth for a federal agency: InfoBlox structured
      syslog for every DNS query, RPZ hit, and DNSSEC failure; SASE per-session flow
      telemetry with full URL, user, device posture, and transfer volume; Entra ID
      sign-in and audit logs with geolocation and Conditional Access detail; SQL
      Server continuous auditing; and Defender for Endpoint device findings. The
      problem this book addresses is blunt: none of that log volume is useful if no
      one is watching it and nothing fires when something goes wrong. A log warehouse
      that has never generated an alert does not satisfy AU-6, which requires review
      and analysis of audit records — not a passive archive. This book closes the gap
      between log generation and detection through four mechanisms: a connected SIEM,
      Microsoft Sentinel, ingesting every series log source through native
      connectors; a curated KQL detection-rule library targeting those specific
      sources; User and Entity Behavior Analytics applying machine learning across
      the aggregate telemetry to surface anomalies no single-source rule can catch;
      and automated playbooks that turn alert firings into enriched incidents and,
      for confirmed high-severity detections, trigger containment without waiting for
      an analyst. The series targets FedRAMP Moderate exclusively (Agency GCC Moderate
      baseline). Walk the journey strip — Ingest, Detect, Correlate, Respond — as the
      spine. Draft CSI-team proposal, pre-decisional, not an approved Agency position.
    vendor_sources: ["ms_sentinel", "uiao repo: docs/customer-documents/federal-aan-series/Vol_III_Book_06_FedAAN_SIEM_XDR_Detection.qmd"]

  # 2 --- section -------------------------------------------------------------
  - type: section
    kicker: "PART ONE"
    title: "A log warehouse is not a detection engine"
    callout: "A SIEM with zero configured analytics rules does not pass AU-6. The assessor asks: show me an alert that fired last month and the incident ticket it generated."
    callout_accent: navy
    notes: >
      This section makes the case for the whole book by drawing the line between a
      log aggregator and a SIEM. A log aggregator — Splunk, Elastic, Azure Log
      Analytics alone — collects and indexes. A SIEM adds rule-based detection,
      ML-driven anomaly scoring, incident-management workflow, and automation
      orchestration on top; Microsoft Sentinel is built on Log Analytics and adds
      exactly that detection layer. The distinction is not academic — it is the AU-6
      pass/fail line. AU-6 has three required, ongoing actions: review, analyze, and
      report, and AU-6(1) requires automated integration of that review with other
      processes, which explicitly rules out a human manually querying logs on an ad
      hoc basis as compliance. The presenter should walk the assessor's actual
      evidence sequence. First, is there log collection? Most agencies pass. Second,
      are logs in a SIEM? Many have deployed Sentinel or Splunk and pass. Third —
      where programs fail — is there a configured detection rule set, and can you show
      an alert that fired, the incident it generated, and the documented response? A
      SIEM with zero configured rules, or every rule disabled pending tuning, fails
      this step. The concrete evidence request is: provide an example of an alert
      that fired in the last 30 days, the incident record, and what action was taken.
      If nothing fired in 30 days, either the environment has no suspicious activity
      (unlikely), the rules are misconfigured and producing nothing, or no rules are
      configured — and the last two are AU-6 findings. That is the gap this book
      closes.

