    notes: >
      This is the book's Authorities-Closed-Here reference table — twelve NIST SP
      800-53 Rev 5 controls at the FedRAMP Moderate baseline, folded into seven rows
      by family and mapped to the FedRAMP 20x Key Security Indicators. AU-6 and
      AU-6(1) close through Sentinel analytics rules evaluating every source
      continuously and Logic App playbooks integrating incidents into ServiceNow
      automatically. AU-6(4) central review closes because all sources ingest to one
      Log Analytics workspace with one analytics-rule surface and one incident queue,
      ending the silos. AU-8 and AU-11 close through UTC timestamp normalization with
      the ASIM canonical time field and the three-tier retention — 90-day
      interactive, two-year archive, three-year immutable WORM Blob meeting the NARA
      GRS 3.2 floor. SI-4 and SI-4(2) close through the 20-rule detection library, the
      UEBA behavioral baseline, and TIDE IOC correlation running continuously. SI-4(4)
      and SI-4(7) close through DNS and SASE egress monitoring and the automated
      device-isolation and account-disable responses on confirmed signals. IR-4 and
      IR-6 close through the structured Sentinel incident workflow with enrichment and
      ServiceNow ticketing and the documented one-hour US-CERT pathway. IR-8 closes
      through the written plan across all NIST 800-61 phases with its seven artifacts
      and annual testing. Each maps to a 20x KSI in the audit, system-integrity, and
      incident-response families. The callout is the necessity claim the book is
      careful to make falsifiable: SI-4(4) requires monitoring inbound and outbound
      communications, and the application-layer telemetry the detection rules consume
      — full URL, user identity, device posture, transfer volume — exists only because
      the SD-WAN and SASE stack earlier in the series decoded traffic at an
      application-aware enforcement point and emitted it. A bare circuit's flow logs
      show IP pairs and byte counts, not sessions and users; without the overlay, the
      SI-4 and SI-4(4) rows have no input and the control does not close. No
      collector or analytics rule can extract fields from traffic that was never
      decoded in the path. Control mappings use the FedRAMP Moderate baseline.
