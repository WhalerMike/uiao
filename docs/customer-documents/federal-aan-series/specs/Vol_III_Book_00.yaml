deck:
  title: "Volume III Overview — Security Operations"
  subtitle: "Where the Management-Plane Coordination Doctrine is realized: native actuation, unified evidence"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOL III · BOOK 00"
  date_code: "2026-07-09 09:54 ET"
  journey:
    - "Actuate natively"
    - "Correlate"
    - "Unify evidence"
    - "Feed KSI"
  sources:
    fedramp_20x: "https://www.fedramp.gov/20x/"
    cisa_cdm: "https://www.cisa.gov/resources-tools/programs/continuous-diagnostics-and-mitigation-cdm-program"
    fedramp_marketplace: "https://marketplace.fedramp.gov/"

slides:
  # 1 -----------------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for Volume III of the Federal Application-Aware Networking
      series — the volume overview, not a content book. Volume III is where the
      series' operational security planes live, and where the Management-Plane
      Coordination Doctrine introduced in the Executive Summary is actually
      realized. State the doctrine's split up front because it runs through every
      book in the volume: actuation is platform-native — privileged access,
      patching, posture, and detection are each performed by the platform's own
      stack — while governance and evidence are unified into one machine-readable
      contract that flows to CISA CDM and the FedRAMP 20x KSI pipeline. Walk the
      journey strip: actuate natively, correlate across stacks, unify the
      evidence, and feed the KSI pipeline. Keep FedRAMP scope at Moderate
      throughout. Note the draft disclaimer: this is pre-decisional CSI Team
      material, not an approved Agency position.

  # 2 -----------------------------------------------------------------------
  - type: content
    kicker: "VOLUME PURPOSE"
    title: "The doctrine's split runs through every book"
    layout: grid
    cards:
      - title: "Actuation is platform-native"
        body: "Privileged access, patching, posture, and detection are performed by each platform's own stack — no single console runs everything."
        accent: navy
      - title: "Evidence is unified"
        body: "Governance and evidence collapse into one machine-readable contract that flows to CISA CDM and the FedRAMP 20x KSI pipeline."
        accent: teal
      - title: "The real question"
        body: "Not 'which single console runs everything,' but 'which native stack actuates, and how does its evidence join the one compliance picture.'"
        accent: amber
      - title: "The fabric closes the loop"
        body: "The Multi-Cloud Evidence Fabric is the coordination home; the other six books feed it."
        accent: red
    callout:
      text: "For a genuinely multi-cloud federal estate: native stacks actuate; one contract carries the evidence."
      accent: navy
    notes: >
      This slide states the volume's purpose through the doctrine that governs
      it. The Management-Plane Coordination Doctrine has one central move: it
      refuses the single-console fantasy. In a genuinely multi-cloud federal
      estate — Azure and Microsoft 365 GCC, AWS GovCloud, OCI, plus
      network-equipment and operating-system surfaces — no one console can
      actuate everything, and pretending otherwise produces either coverage gaps
      or an unaccredited tool sprawl. So actuation stays platform-native: each
      stack does what it is best positioned to do. What must be unified is not the
      tooling but the evidence — one machine-readable contract that flows to CISA
      CDM and the FedRAMP 20x Key Security Indicator pipeline. The question the
      volume answers is therefore reframed: not which console rules them all, but
      which native stack actuates each control and how its evidence joins the one
      compliance picture. The Multi-Cloud Evidence Fabric closes that loop, and
      the other books feed it.

  # 3 -----------------------------------------------------------------------
  - type: table
    kicker: "BOOKS IN THIS VOLUME"
    title: "Seven books actuate natively and feed one evidence home"
    headers: ["Book", "Title", "Role"]
    rows:
      - cells: ["Book 01", "Privileged Access Management", "Least privilege across clouds — Entra PIM, SailPoint, CyberArk, AWS/OCI IAM"]
        accent: navy
      - cells: ["Book 02", "Vulnerability Management", "Assessment & prioritization — RA-5, CISA KEV, risk-based SLAs (the scan half)"]
      - cells: ["Book 03", "Patch & Systems Management", "Remediation actuation across CSP x OS — SI-2 (the close-it half)"]
      - cells: ["Book 04", "Cloud-Native Posture & Containers", "CSPM / CNAPP / Kubernetes — misconfiguration, exposure, runtime"]
      - cells: ["Book 05", "Data Protection (Purview)", "Classification, DLP, and multi-cloud key management (SC-12/13/28)"]
      - cells: ["Book 06", "SIEM / XDR Detection", "Detection engineering — analytics and response over the evidence lake"]
      - cells: ["Book 07", "Multi-Cloud Evidence Fabric", "The coordination home — every source's record to one lake to CDM to KSI"]
        accent: teal
    callout:
      text: "Books 01–06 actuate natively; Book 07 is the coordination home every record flows into."
      accent: navy
    notes: >
      The reference table for the volume. Books 01 through 06 are the native
      actuation stacks, each closing its control family in the idiom of the
      platform it runs on. Book 01 delivers least privilege across clouds through
      Entra PIM, SailPoint, CyberArk, and the native AWS and OCI IAM. Books 02 and
      03 are two halves of one motion: Vulnerability Management is the scan half —
      assessment and prioritization under RA-5, CISA KEV, and risk-based SLAs —
      and Patch and Systems Management is the close-it half, remediation actuation
      across the cross-product of cloud provider and operating system under SI-2.
      Book 04 covers cloud-native posture — CSPM, CNAPP, and Kubernetes across
      misconfiguration, exposure, and runtime. Book 05 is data protection through
      Purview: classification, DLP, and multi-cloud key management for SC-12,
      SC-13, and SC-28. Book 06 is SIEM and XDR detection engineering over the
      evidence lake. Book 07, the Multi-Cloud Evidence Fabric, is the coordination
      home the whole doctrine points at: every source's record flows into one
      lake, then to CDM, then to the KSI pipeline.

  # 4 -----------------------------------------------------------------------
  - type: content
    kicker: "HOW THIS VOLUME FITS THE PROGRAM"
    title: "Depends on the join key; produces the evidence stream"
    layout: columns
    cards:
      - title: "Depends on Volume I"
        body: "Without one authoritative asset identity (Vol I Book 01, CM-8), five stacks produce five inventories that cannot be reconciled."
        accent: navy
        status: "← Vol I"
      - title: "Produces the evidence"
        body: "The correlated, machine-readable stream (Book 07) is what Volume IV's Authorization Package & ConMon book (Vol IV Book 06) freezes into the OSCAL bundle."
        accent: teal
        status: "→ Vol IV"
      - title: "Truth vs. enforcement"
        body: "The evidence fabric is a truth plane, depended on; the actuation stacks are enforcement planes, re-platformable per vendor."
        accent: amber
        status: "Doctrine"
    callout:
      text: "One join key in; one correlated, machine-readable evidence stream out."
      accent: navy
    notes: >
      This slide places Volume III in the program. It depends on Volume I's
      naming-plane join key — the CM-8 asset identity from Vol I Book 01 — because
      without one authoritative asset identity, the five management stacks in this
      volume produce five separate inventories that can never be reconciled into a
      single compliance picture. The join key is what makes correlation possible
      at all. What Volume III produces is the correlated, machine-readable
      evidence stream from Book 07, which Volume IV's Authorization Package and
      ConMon book then freezes into the OSCAL bundle that carries the program to an
      authorization decision. Voice the series' separation of concerns explicitly:
      throughout this volume, truth is kept separate from enforcement — the
      evidence fabric is a truth plane that everything depends on, while the
      actuation stacks are enforcement planes that can be re-platformed per vendor
      without disturbing the truth they report.

  # 5 -----------------------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "Native stacks actuate; one contract carries the proof"
    layout: columns
    cards:
      - title: "No single console"
        body: "The doctrine refuses the one-console fantasy — each native stack actuates its own control family."
        accent: teal
        status: "Established"
      - title: "One evidence contract"
        body: "Every record joins one machine-readable stream flowing to CDM and the FedRAMP 20x KSI pipeline."
        accent: amber
        status: "Book 07"
      - title: "Next"
        body: "Volume IV freezes the correlated stream into the OSCAL authorization package."
        accent: navy
        status: "→ Vol IV"
    callout:
      text: "The Evidence Fabric closes the loop the doctrine opens — and hands one stream to the capstone."
      accent: navy
    notes: >
      Close on the through-line. Volume III has realized the Management-Plane
      Coordination Doctrine: it refuses the single-console fantasy and lets each
      native stack actuate its own control family, while unifying only the
      evidence into one machine-readable contract that flows to CISA CDM and the
      FedRAMP 20x KSI pipeline. The Multi-Cloud Evidence Fabric closes the loop
      the doctrine opens — every source's record correlated in one lake against
      the Volume I join key. The handoff is to Volume IV, the capstone, which
      freezes this correlated stream into the OSCAL authorization package. Leave
      the audience with the doctrine's discipline restated: the answer for a
      multi-cloud federal estate was never which console runs everything, but
      which native stack actuates and how its evidence joins the one compliance
      picture.
