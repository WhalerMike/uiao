deck:
  title: "Authorization Package & ConMon"
  subtitle: "Assembling twenty-two books into an agency RMF package — the OSCAL KSI bundle, the ScubaDrift disposition pipeline, BOD 26-04, and continuous monitoring"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING"
  date_code: "2026-07-09 09:53 ET"
  journey:
    - "Assess"
    - "Bundle"
    - "Authorize"
    - "Monitor"
  sources:
    nist_800_37: "https://csrc.nist.gov/pubs/sp/800/37/r2/final"
    nist_800_137: "https://csrc.nist.gov/pubs/sp/800/137/final"
    nist_oscal: "https://pages.nist.gov/OSCAL/"
    cisa_directives: "https://www.cisa.gov/news-events/directives"
    cisa_scubagear: "https://github.com/cisagov/ScubaGear"
    openvex: "https://openvex.dev/"
    ms_secure_score: "https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score"
    ms_compliance_manager: "https://learn.microsoft.com/en-us/purview/compliance-manager"
    ms_365dsc: "https://microsoft365dsc.com/"

slides:
  # --- 1. title -------------------------------------------------------------
  - type: title
    notes: |
      Opening frame for Volume IV, Book 06 — the capstone book in the
      Federal Application-Aware Networking series. Set the job of this book: the
      preceding twenty-two books generated the evidence layer — infrastructure
      architecture, security controls, governance artifacts, and training records
      mapped to NIST SP 800-53 Rev 5, with ConMon evidence modeled on the FedRAMP
      20x CR26 KSI schema — and this book assembles all of it into the agency RMF
      authorization package presented to the Agency Authorizing Official for an agency
      ATO under NIST SP 800-37. Voice the single most important scoping fact up
      front: Agency is a consuming agency, not a cloud service provider — nothing in
      this package is submitted to the FedRAMP PMO. The FedRAMP 20x pipeline
      applies to the CSOs Agency inherits, documented as leveraged authorizations, and
      this book tracks those provider timelines only where they matter to
      inheritance. Walk the four-stage journey on the title strip — assess, bundle,
      authorize, monitor — because that is the arc of the book. Preview the four
      deliverables: the authorization package structure, the continuous monitoring
      program (CA-7), the BOD 26-04 VDR/VER submission due December 7 2026, and the
      OSCAL AP+AR+POA&M bundle. State the controls this book closes: CA-2, CA-5,
      CA-6, CA-7, CA-7(1), CA-7(3), RA-3, and SA-15. Hold the scope line: GCC
      Moderate / FedRAMP Moderate throughout. And voice the two standing caveats
      that govern every claim in this book — the draft-proposal caveat (CSI Team
      pre-decisional material, not reviewed by the CIO Office, OIS, or leadership)
      and the self-assessment caveat: all KSI verdicts are produced by an automated
      self-assessment tool, they are advisory, and they must be independently
      validated through a security control assessment and accepted by the Agency
      AO before an ATO is granted.
    vendor_sources: ["nist_800_37", "fedramp_20x"]

  # --- 2. section: assembling the evidence ---------------------------------
  - type: section
    kicker: "PART ONE"
    title: "Nineteen books, one agency RMF package"
    callout: "Agency is a consuming agency, not a CSP — this package goes to the Agency Authorizing Official, not the FedRAMP PMO."
    callout_accent: navy
    notes: |
      This section frames what the authorization package is and, just as
      importantly, what it is not. The twenty-two preceding books closed 89-plus
      distinct NIST controls and provide self-assessed evidence for all 29 rules in the series' internal KSI decomposition (modeled on the FedRAMP 20x CR26 KSI schema).
      This book turns that evidence into a formal package. The critical framing to
      voice twice: Agency is a consuming agency, not a cloud service provider. The
      package is an agency RMF authorization package under NIST SP 800-37, presented
      to the Agency Authorizing Official for an agency ATO. Nothing in it is submitted
      to the FedRAMP PMO — the FedRAMP 20x Class A/B/C pipeline applies to the CSOs
      Agency inherits, which are documented in the SSP as leveraged authorizations.
      This distinction changes what the package must contain: the 20x KSI-evidence
      model replaces the ~323-control audit binder for the inherited CSOs, and the
      agency adopts the same machine-readable model for its own ConMon evidence.
      Set up the honest caveat the whole book carries: every KSI verdict is produced
      by the UIAO Conformance Adapter, an automated self-assessment tool — the
      verdicts are advisory and must be independently validated through a security
      control assessment (Agency may engage a FedRAMP-recognized 3PAO) and accepted by
      the AO. Flag the open KSI-count reconciliation item: the 29 internal KSI rules are
      a decomposition, not the published CR26 Moderate catalog (46 indicators),
      and must be diffed rule-by-rule before "29/29 satisfied" carries into any
      authorization decision. Vendor sources: NIST SP 800-37 RMF.
    vendor_sources: ["nist_800_37"]

  # --- 3. content: the package and the self-assessment ---------------------
  - type: content
    kicker: "WHAT THIS PACKAGE IS"
    title: "An evidence layer, self-assessed, pending independent SCA"
    layout: grid
    cards:
      - title: "89+ controls, 29 KSI rules"
        body: "Eighteen books close 89+ distinct NIST SP 800-53 Rev 5 controls and provide self-assessed evidence for all 29 internal KSI rules across ten themes."
        accent: navy
      - title: "Self-assessment notice"
        body: "All KSI verdicts come from the UIAO Conformance Adapter — advisory, not a formal authorization. An independent SCA and AO acceptance are required."
        accent: red
      - title: "The KSI-count open item"
        body: "The 29 internal KSI rules are a decomposition, not the published CR26 Moderate catalog (46 indicators). They must be diffed rule-by-rule before '29/29' is carried forward."
        accent: amber
      - title: "Leveraged, not submitted"
        body: "FedRAMP-authorized CSOs Agency consumes are documented as inherited authorizations in the SSP; the agency package goes to the Agency AO."
        accent: teal
    callout:
      text: "A zero-item POA&M is the correct target for the self-assessment — all required controls assessed as satisfied in the current adapter run, pending independent validation."
      accent: navy
    notes: |
      This slide states plainly what the package is and the honesty that governs
      it. First card: the series delivered twenty-two technical books closing more
      than 89 distinct NIST SP 800-53 Rev 5 controls and providing self-assessed
      evidence for all 29 rules in the series' internal KSI decomposition across ten theme codes.
      Second card, and the one to dwell on: the self-assessment notice. Every KSI
      verdict in this package is produced by the UIAO Conformance Adapter, an
      automated self-assessment tool — the verdicts are advisory and do not
      constitute a formal authorization. They must be independently validated
      through a security control assessment (Agency may engage a FedRAMP-recognized
      3PAO as its independent assessor) and accepted by the Agency Authorizing
      Official before an ATO is granted. Third card: the open KSI-count
      reconciliation. The 29 rules evaluated here are the series' internal KSI decomposition, not the published CR26 Moderate KSI catalog, which carries
      roughly 56 to 63 indicators across the same ten theme codes depending on
      counting method — the 29-rule set must be diffed rule-ID by rule-ID against
      the finalized CR26 Moderate list before "29/29 satisfied" is carried into any
      authorization decision. This is a live open item, not a solved problem, and
      the presenter should say so. Fourth card: leveraged authorizations — the
      FedRAMP-authorized CSOs Agency consumes are documented as inherited controls in
      the SSP, not resubmitted. Voice the callout on the zero-item POA&M: a
      zero-item POA&M is the correct target state for the self-assessment, meaning
      all required controls are assessed as satisfied in the current adapter run —
      but it is pending independent validation, and any finding that emerges will
      auto-populate the POA&M. Vendor sources: the FedRAMP 20x program.
    vendor_sources: ["fedramp_20x"]

  # --- 4. table: KSI scorecard ---------------------------------------------
  - type: table
    kicker: "KSI SCORECARD"
    title: "29/29 evaluable — two evaluation paths"
    headers: ["Evaluation Path", "Count", "KSI IDs", "Verdict"]
    rows:
      - cells: ["CISA ScuBA adapter (M365 continuous)", "10", "KSI-001..010", "satisfied"]
        accent: teal
      - cells: ["AAN slot evaluator — high confidence", "19", "KSI-011..029", "satisfied"]
        accent: navy
      - cells: ["Scaffold (pending evidence)", "0", "—", "—"]
        accent: neutral
    callout:
      text: "Self-assessed as of July 4, 2026: all 29 rules at high confidence, zero open risks, zero POA&M items — advisory pending independent SCA."
      accent: amber
    notes: |
      This table is the KSI scorecard — how the 29 internal KSI rules are evaluated and
      by which path. Two evaluation paths carry the whole set. The first path is
      the CISA ScuBA adapter: ten rules, KSI-001 through KSI-010, evaluated
      continuously against the M365 configuration surface and assessed as
      satisfied. The second path is the AAN slot evaluator: nineteen rules,
      KSI-011 through KSI-029, each backed by an evidence slot a series book built,
      evaluated at high confidence and assessed as satisfied. The third row is the
      important one to point at precisely because it is zero — there are no scaffold
      rules left pending evidence, which is the state the Training book achieved by
      activating the last one, KSI-022. Voice the callout with the full honesty the
      book requires: as of the July 4 2026 self-assessment run, all 29 rules in
      scope evaluated at high confidence, zero open risks were identified, and zero
      POA&M items were generated — but these results are advisory, produced by the
      automated Conformance Adapter, and pending an independent security control
      assessment. The OSCAL Assessment Results document is the machine-readable
      CA-2 deliverable that carries these verdicts. Make the point that "high
      confidence" is a property of the slot binding — it means a book actually
      produced the evidence artifact behind the rule — not a claim that an
      independent assessor has confirmed it. The distinction between the two paths
      matters for the assessor: the ScuBA rules are validated continuously against
      the regulator's baseline, while the slot rules rest on the evidence each book
      generated. Vendor sources: the CISA ScuBA project and the FedRAMP 20x program.
    vendor_sources: ["cisa_scubagear", "fedramp_20x"]

  # --- 5. section: the OSCAL bundle ----------------------------------------
  - type: section
    kicker: "PART TWO"
    title: "The OSCAL bundle — machine-readable KSI evidence"
    callout: "One command generates three interlinked OSCAL 1.0.4 documents — the AP, the AR, and the POA&M — the KSI evidence package."
    callout_accent: teal
    notes: |
      This section covers the OSCAL bundle, the machine-readable heart of the
      package. The uiao oscal bundle command generates three interlinked OSCAL
      1.0.4 documents that constitute the KSI evidence package: the Assessment Plan
      (ksi-ap.json, CA-2) documenting what was assessed and by which method, the
      Assessment Results (ksi-ar.json, CA-2 and RA-3) recording findings and
      verdicts for all 29 KSIs, and the Plan of Action and Milestones
      (ksi-poam.json, CA-5) listing open findings and remediation milestones (zero
      items currently). The three are linked by UUID reference: the AP specifies
      what was planned, the AR imports the AP and records results, and the POA&M
      imports the AP and references AR observations. The bundle is regenerated as
      part of the ConMon cadence — monthly for ongoing monitoring, on demand for
      package assembly. The next slides give the bundle architecture and then the
      mapping of the ten KSI themes to the eight evidence slots. Emphasize that the
      AR is the machine-readable equivalent of a Security Assessment Report for the
      KSI evidence dimension — it satisfies CA-2 by providing a documented,
      repeatable, automated assessment of all KSI controls. Vendor sources: the
      NIST OSCAL program.
    vendor_sources: ["nist_oscal"]

  # --- 6. content: OSCAL bundle architecture -------------------------------
  - type: content
    kicker: "THREE INTERLINKED DOCUMENTS"
    title: "AP, AR, and POA&M — linked by UUID"
    layout: columns
    cards:
      - title: "Assessment Plan (CA-2)"
        body: "ksi-ap.json documents what was assessed — which controls, which method — organized around the ten FedRAMP 20x KSI themes. It sets the assessment.uuid."
        accent: navy
        status: "ksi-ap.json"
      - title: "Assessment Results (CA-2, RA-3)"
        body: "ksi-ar.json imports the AP and records a finding per KSI: target status, verdict props, linked observations with artifact refs, and risks (open only if not-satisfied)."
        accent: teal
        status: "ksi-ar.json"
      - title: "POA&M (CA-5)"
        body: "ksi-poam.json imports the AP, references AR observations, and lists open findings with milestones. Zero items in the current run — auto-populated from AR gaps."
        accent: amber
        status: "ksi-poam.json"
    callout:
      text: "The AR is the machine-readable Security Assessment Report for the KSI dimension — CA-2 satisfied by a documented, repeatable, automated assessment."
      accent: navy
    notes: |
      This slide walks the three OSCAL documents and how they interlink, because
      the linkage is what makes the bundle a coherent assessment record rather than
      three loose files. The Assessment Plan, ksi-ap.json, is the CA-2 planning
      document — it documents what was assessed, which controls, and by which
      method, and it is organized around the ten KSI themes from FedRAMP 20x. It
      sets the assessment-plan UUID that the other two documents import. The
      Assessment Results, ksi-ar.json, is the CA-2 and RA-3 results document — it
      imports the AP by UUID reference and records one finding for each of the 29
      KSIs, where each finding carries a target status (satisfied, not-satisfied,
      or other), props for ksi-id, verdict, cr26-control, and mapping-confidence, a
      linked observation with description and artifact references and slot IDs, and
      risks that are open only for not-satisfied findings — zero in the current
      run. The POA&M, ksi-poam.json, is the CA-5 document — it imports the AP,
      references AR observations, and lists open findings with remediation
      milestones, currently zero items, auto-populated from AR gaps by the
      extract-ar-gaps function whenever a finding emerges. Voice the callout: the
      AR is the machine-readable equivalent of a Security Assessment Report for the
      KSI evidence dimension, and it satisfies CA-2 by providing a documented,
      repeatable, automated assessment of all KSI controls. Make the point that
      "repeatable and automated" is exactly what distinguishes this from a
      hand-assembled binder — the same command run next month produces a comparable
      document, which is what the ConMon trend analysis depends on. Vendor sources:
      the NIST OSCAL program.
    vendor_sources: ["nist_oscal"]

  # --- 7. table: KSI themes and evidence slots -----------------------------
  - type: table
    kicker: "THEMES TO SLOTS"
    title: "Ten KSI themes, eight evidence slots"
    headers: ["Theme", "KSI Rules", "Evidence Slot(s)"]
    rows:
      - cells: ["KSI-IAM", "001, 002, 003, 009", "slot-01 identity; ScuBA"]
        accent: navy
      - cells: ["KSI-SVC / KSI-CNA", "004, 007, 008", "slot-03/04; ScuBA"]
        accent: teal
      - cells: ["KSI-MLA", "005, 006, 010", "slot-02/04; ScuBA"]
      - cells: ["KSI-CMT", "011–014", "slot-06 security"]
        accent: amber
      - cells: ["KSI-SCR", "015, 016", "slot-06 security"]
      - cells: ["KSI-PIY", "017–021", "slot-05 endpoint"]
        accent: teal
      - cells: ["KSI-INR / KSI-RPL", "023–029", "slot-04/07 continuity"]
      - cells: ["KSI-CED", "022", "slot-08 training"]
        accent: red
    callout:
      text: "Each KSI rule binds to at least one evidence slot a series book built — the ScuBA path (KSI-001..010) is validated continuously against M365."
      accent: navy
    notes: |
      This table maps the ten FedRAMP 20x KSI themes to the eight AAN evidence
      slots, showing which book's evidence backs which rule. Read the structure
      rather than every rule. The identity theme (KSI-IAM) draws on slot-01 identity
      and the ScuBA path. The service and cloud-native themes (KSI-SVC, KSI-CNA)
      draw on the network and telemetry slots and ScuBA. The monitoring, logging,
      and alerting theme (KSI-MLA) draws on the data and telemetry slots and ScuBA.
      The configuration-management theme (KSI-CMT) and the supply-chain-risk theme
      (KSI-SCR) both draw on slot-06 security, backed by the Vulnerability
      Management and Supply Chain books. The policy-inventory theme (KSI-PIY) draws
      on slot-05 endpoint. The incident-response and resilience themes (KSI-INR,
      KSI-RPL) draw on the telemetry and continuity slots, backed by the SIEM/XDR
      and Business Continuity books. And the cybersecurity-education theme (KSI-CED)
      draws on slot-08 training, backed by the Training book — the final slot to
      bind. Voice the callout: each KSI rule binds to at least one evidence slot
      that a series book actually built, which is the whole architecture of the
      series — every rule has a book behind it. And the ScuBA rules, KSI-001
      through KSI-010, are additionally validated continuously against the M365
      configuration surface, not just bound to a slot. Make the point that this
      theme-to-slot map is what lets an assessor trace any KSI verdict back to a
      specific book and a specific evidence artifact. This is the UIAO slot
      architecture, cited to the repo, with the FedRAMP theme codes. Vendor
      sources: the FedRAMP 20x program and the UIAO repository.
    vendor_sources: ["fedramp_20x", "uiao repo: src/uiao/"]

  # --- 8. section: continuous monitoring -----------------------------------
  - type: section
    kicker: "PART THREE"
    title: "Continuous monitoring — keeping the evidence fresh (CA-7)"
    callout: "A point-in-time scan answers 'what passes today?' ConMon answers 'what changed, what is governed, and when does the acceptance lapse?'"
    callout_accent: teal
    notes: |
      This section covers the continuous monitoring program that keeps the evidence
      fresh after ATO. CA-7 requires a continuous monitoring strategy with metrics
      for control effectiveness, frequencies for monitoring, assessment, and
      reporting, ongoing awareness training, and reporting to the Authorizing
      Official. The series provides the evidence-generation layer; the ConMon
      program operationalizes it on a recurring cadence — monthly, quarterly,
      semi-annual, and annual. Set up the section's key insight, which the callout
      states: a point-in-time ScuBAGear report answers only "what passes today?" It
      does not answer the three questions an assessor asks next — what changed since
      last month, which failures are already governed by a documented risk
      acceptance, and when does that acceptance lapse. The ScubaDrift disposition
      pipeline is the lifecycle layer that answers them, and it is the build
      sequence on the next slide. After that, the deck shows why Microsoft's native
      posture tooling does not produce this evidence. Emphasize that the ConMon
      cadence spans monthly OSCAL AR refresh, quarterly KSI quality review,
      semi-annual IR and CP-3 drills, and annual full re-assessment — the same
      drills the Training and Business Continuity books define, now on the ConMon
      calendar. Vendor sources: NIST SP 800-137 ISCM.
    vendor_sources: ["nist_800_137"]

  # --- 9. content: ConMon cadence ------------------------------------------
  - type: content
    kicker: "THE CONMON CADENCE"
    title: "Monthly, quarterly, semi-annual, annual"
    layout: grid
    cards:
      - title: "Monthly"
        body: "OSCAL AR refresh, ScuBA assessment + ScubaDrift triage/gate, Sentinel dashboard review, POA&M status (zero-item target), vuln scan, SBOM delta."
        accent: navy
      - title: "Quarterly"
        body: "KSI evidence quality review (CA-7(3)), training completion review (AT-4, KSI-022), slot-binding confidence review, privileged access review."
        accent: teal
      - title: "Semi-annual"
        body: "IR tabletop drill (IR-2), CP-3 contingency training exercise, SBOM freshness + VDR/VER review for BOD 26-04."
        accent: amber
      - title: "Annual"
        body: "Full KSI re-assessment (all 29), AT-2 awareness refresh, CP-2 plan update, PM-14 T&T&M update, ATO renewal prep (CA-6), BOD 26-04 SBOM certification."
        accent: red
    callout:
      text: "Each evidence slot has a freshness requirement; a downward trend in satisfied count triggers automatic POA&M creation on the next bundle run."
      accent: navy
    notes: |
      This slide lays out the full ConMon cadence — the recurring calendar that
      keeps the evidence current after ATO. Read the four tiers. Monthly activities
      are the operational core: OSCAL AR refresh via uiao oscal bundle, the ScuBA
      assessment run against M365 followed by ScubaDrift triage and the pipeline
      gate, the Sentinel ConMon dashboard review, a POA&M status check against the
      zero-item target, a Defender vulnerability scan, and an SBOM delta check.
      Quarterly activities are the review layer: KSI evidence quality review
      (CA-7(3)), training completion review for AT-4 and KSI-022, slot-binding
      confidence review, and the privileged-access review (AC-6). Semi-annual
      activities are the exercises: the IR tabletop drill (IR-2), the CP-3
      contingency training exercise, and the SBOM freshness plus VDR/VER review for
      BOD 26-04. Annual activities are the big-rock re-authorizations: a full KSI
      re-assessment of all 29 rules, the AT-2 awareness refresh, the CP-2
      contingency plan update, the PM-14 T&T&M plan update, ATO renewal package
      preparation under CA-6, and the BOD 26-04 SBOM annual certification. Voice
      the callout, which is the mechanism that makes the cadence self-correcting:
      each evidence slot has a documented freshness requirement — identity policies
      reviewed quarterly, SBOM regenerated monthly, LMS records exported monthly,
      CP-3 tabletop annually — and a downward trend in the satisfied count (say a
      training completion gap dropping KSI-022) triggers automatic POA&M creation
      on the next bundle run, giving the AO an early warning signal. Point out the
      cross-book integration: the IR and CP-3 drills are the Training book's, the
      SBOM is the Supply Chain book's, the training record is the Training book's —
      ConMon is where every book's evidence is kept alive. Vendor sources: NIST SP
      800-137 ISCM and the CISA directives page for BOD cadence.
    vendor_sources: ["nist_800_137", "cisa_directives"]

  # --- 10. build-sequence: the ScubaDrift monthly loop ---------------------
  - type: build-sequence
    kicker: "THE SCUBADRIFT MONTHLY LOOP"
    title: "From tenant scan to evidence-backed KSI verdict"
    notes: "Fallback notes: the monthly ScubaDrift loop — ScuBAGear assess, scubadrift triage, gate, oscal scuba-verdicts, AR refresh — the evidence behind KSI-001..010."
    steps:
      - label: "Assess"
        sub: "ScuBAGear vs the SCuBA baseline"
        accent: navy
        detail: >
          ScuBAGear assesses the M365 tenant against the CISA SCuBA baseline and
          emits its JSON result — a point-in-time answer to 'what passes today?'
          against the regulator's baseline, not a vendor's rubric.
        notes: |
          Step one: assess. The monthly loop begins with ScuBAGear, the CISA
          Secure Cloud Business Applications assessment tool, running against the
          M365 tenant and emitting its JSON result. The critical property to voice
          is whose baseline is being used: ScuBAGear assesses against the CISA
          SCuBA baseline — the regulator's baseline — not against a vendor's
          proprietary rubric. That is what makes the output an evidence class an
          assessor accepts rather than discounts. But by itself this is only a
          point-in-time answer to the question "what passes today?" It cannot
          answer what changed since last month, which failures are governed by a
          documented risk acceptance, or when that acceptance lapses. Those three
          questions are the reason the loop has four more steps. Emphasize that
          ScuBAGear never changes the tenant — it only reads and assesses — and
          that this is the evidence source behind the ten configuration-surface KSI
          rules, KSI-001 through KSI-010. Vendor sources: the CISA ScuBA project.
        vendor_sources: ["cisa_scubagear"]
      - label: "Triage"
        sub: "scubadrift → three dispositions"
        accent: teal
        detail: >
          scubadrift triage consumes the ScuBAGear JSON and the risk-acceptance
          register and splits every failing policy into exactly three dispositions:
          actionable new drift, lapsed acceptance, or governed exception.
        notes: |
          Step two: triage. ScubaDrift is the lifecycle layer that answers the
          three questions ScuBAGear cannot. It never touches the tenant — it
          consumes ScuBAGear's JSON output and the risk-acceptance register, and
          splits every failing policy into exactly three dispositions.
          actionable_new_drift means the policy is failing with no risk acceptance
          on file — the gate must act. lapsed_acceptance means the policy is
          failing and an acceptance exists but has expired — the gate must act.
          governed_exception means the policy is failing but is covered by an
          in-date, documented risk acceptance — this is governed, the gate passes,
          and the exception is POA&M-linked. Voice why this three-way split is the
          whole point: it separates the failures that demand action from the
          failures that are already governed and aging on a documented timeline. All
          the expiry math is injected via an as-of date, so triage runs are
          deterministic and reproducible for the assessor — the same inputs and the
          same as-of date always produce the same dispositions. This is the
          distinction no vendor dashboard models. Vendor sources: none — ScubaDrift
          is UIAO tooling, cited to the repo.
        vendor_sources: ["uiao repo: src/uiao/"]
      - label: "Gate"
        sub: "fail only on new/lapsed drift"
        accent: amber
        detail: >
          scubadrift gate runs in the pipeline and exits non-zero only on new drift
          or a lapsed acceptance — governed exceptions never break the build. The
          gate has deterministic, reproducible semantics.
        notes: |
          Step three: gate. The scubadrift gate command runs in the pipeline and
          enforces the dispositions with precise, deterministic semantics: it exits
          non-zero — failing the build — only on actionable new drift or a lapsed
          acceptance. Governed exceptions never break the build, because a failure
          that is covered by an in-date risk acceptance is, by definition, already
          governed. Voice why this matters operationally: a naive gate that failed
          on every ScuBAGear failure would be unusable, because a mature tenant
          always carries some governed exceptions; a gate that passed everything
          would be meaningless. ScubaDrift's gate threads the needle — it acts only
          on what is genuinely actionable (ungoverned or expired) and stays quiet on
          what is governed. Because the expiry math is as-of-injected, the gate is
          reproducible: an assessor can re-run it with the same as-of date and get
          the same verdict. Note the register hygiene the loop enforces — retirable
          acceptances, exceptions whose policy now passes, are flagged for removal
          so the acceptance file cannot silently accumulate dead weight. Vendor
          sources: none — UIAO tooling, cited to the repo.
        vendor_sources: ["uiao repo: src/uiao/"]
      - label: "Write verdicts"
        sub: "oscal scuba-verdicts + provenance"
        accent: navy
        detail: >
          uiao oscal scuba-verdicts writes scubadrift-verdicts.json with full
          provenance — each verdict carries its result, disposition, governing
          ticket, and expiry date, not just a pass/fail.
        notes: |
          Step four: write verdicts. The uiao oscal scuba-verdicts command writes
          scubadrift-verdicts.json into the KSI bundle directory with full
          provenance. This is what "evidence-backed" means for the ten
          configuration-surface KSI rules: the OSCAL AR no longer asserts KSI-001
          through KSI-010 as satisfied merely because a scanner ran. Each verdict
          entry carries its result (pass or fail), its disposition (new drift,
          lapsed, or governed), its governing ticket, and its expiry date. Read the
          book's example aloud: a policy like MS.AAD.3.1v1 shows result fail,
          disposition governed_exception, reason accepted until 2026-12-31 under a
          named POA&M ticket, and an explicit expiry date. So a governed exception
          surfaces in the evidence as a POA&M-linked entry with an expiry, not a
          silent pass. This is the structural difference from a vendor score: the
          evidence records not just whether a control passes but how a failure is
          governed and when that governance lapses. Emphasize the assessor value —
          this artifact is exactly what an assessor needs to see, per-policy, with
          provenance, and it is deterministic. Vendor sources: none — UIAO OSCAL
          tooling, cited to the repo.
        vendor_sources: ["uiao repo: src/uiao/"]
      - label: "Refresh AR"
        sub: "AR consumes verdicts; ConMon record"
        accent: red
        detail: >
          The OSCAL AR refresh consumes the verdicts; scubadrift conmon-record
          appends the run to the history ledger and conmon-report emits the posture
          trend and remediation SLA aging CA-7 and NIST 800-137 expect.
        notes: |
          Step five: refresh the AR and record the run. The OSCAL Assessment
          Results refresh consumes scubadrift-verdicts.json, so the AR's KSI-001
          through KSI-010 findings now carry the full disposition provenance rather
