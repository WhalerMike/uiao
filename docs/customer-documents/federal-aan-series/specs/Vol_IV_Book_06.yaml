        vendor_sources: ["nist_800_137", "cisa_directives"]

  # --- 11. table: vendor posture vs disposition evidence -------------------
  - type: table
    kicker: "WHY NOT SECURE SCORE?"
    title: "Vendor posture tooling vs disposition evidence"
    headers: ["Offering", "What it provides", "Why it is not this evidence"]
    rows:
      - cells: ["Microsoft Secure Score", "Proprietary posture score, trend, 'accepted risk' markers", "Microsoft's rubric, not SCuBA; markers never expire, link to no POA&M; cannot gate"]
        accent: amber
      - cells: ["Purview Compliance Manager", "NIST/FedRAMP templates, improvement actions", "Portal workflow, manual evidence; a score, not per-control verdicts; no OSCAL, no expiry math"]
        accent: navy
      - cells: ["Microsoft365DSC", "Config export, drift vs your own snapshot", "Drift = 'changed vs my snapshot,' not 'SCuBA verdict changed'; baseline is the operator, not the regulator"]
        accent: teal
    callout:
      text: "The structural difference is authority and lifecycle — the vendor grades its own product against its own rubric; ScubaDrift proves posture against the regulator's baseline, over time, with governed, expiring exceptions."
      accent: amber
    notes: |
      This table answers the question an Authorizing Official will ask: Microsoft
      already ships posture tooling, so why is this pipeline not redundant? The
      answer is that none of the Microsoft offerings produce evidence an assessor
      can consume, and the reasons are structural, not cosmetic. Microsoft Secure
      Score provides a proprietary posture score with a trend and "accepted risk"
      markers — but it scores against Microsoft's own rubric, not the CISA SCuBA
      baseline; its accepted-risk markers never expire and link to no POA&M; it
      produces no per-policy verdict artifact; and it cannot gate a pipeline.
      Purview Compliance Manager provides NIST 800-53 and FedRAMP assessment
      templates with improvement actions — but it is a portal workflow with largely
      manual evidence attachment, it produces a score rather than machine-readable
      per-control verdicts, and it has no run-to-run drift, no expiry math, and no
      OSCAL output. Microsoft365DSC provides tenant configuration export and drift
      detection with enforcement — but its notion of drift is "configuration changed
      versus my own snapshot," not "SCuBA verdict changed"; it has no
      risk-acceptance model; and its baseline is the operator, not the regulator.
      Voice the callout as the structural point: the difference is authority and
      lifecycle. Secure Score and Compliance Manager are the vendor grading its own
      product against its own rubric — self-attestation, the evidence class an
      assessor discounts first. ScuBAGear verdicts are against the regulator's
      baseline, and ScubaDrift adds what no vendor dashboard models: the governed
      exception that expires, the lapsed acceptance that becomes actionable, the
      retirable acceptance flagged as dead weight, and a gate with deterministic,
      reproducible semantics. The vendor tools tell you your posture; this pipeline
      proves it. Vendor sources: Microsoft Secure Score, Purview Compliance
      Manager, and the Microsoft365DSC project.
    vendor_sources: ["ms_secure_score", "ms_compliance_manager", "ms_365dsc"]

