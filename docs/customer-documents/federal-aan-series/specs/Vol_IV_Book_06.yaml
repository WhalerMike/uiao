          against the regulator's baseline, every failure is dispositioned, the gate
          acts only on what is actionable, the verdicts are written with provenance,
          and the AR and the history ledger are updated — producing the drift trend
          and SLA-aging evidence an assessor asks for. Voice the summary: this
          pipeline does not just tell you your posture, it proves it over time,
          against someone else's baseline, with every exception governed and aging
