# Deck spec — Vol V Book 03, FedAAN Assessment, Rubrics & Certification.
# Distilled from docs/customer-documents/federal-aan-series/Vol_V_Book_03_FedAAN_Assessment_Certification.qmd
# Schema: module docstring in src/uiao/generators/aan_deck.py
# Build:
#   uiao generate aan-deck \
#     --spec "docs/customer-documents/federal-aan-series/specs/Vol_V_Book_03.yaml" \
#     --out  "docs/customer-documents/federal-aan-series/Vol_V_Book_03_FedAAN_Assessment_Certification.pptx" \
#     --date-code "2026-07-09 13:54 ET"
deck:
  title: "Assessment, Rubrics & Certification"
  subtitle: "The rubric ladder, the two capstones, the KSI Closure Necessity Matrix, and the AAN credentials"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOL V · BOOK 03"
  date_code: "2026-07-09 13:54 ET"
  journey:
    - "Score"
    - "Trace"
    - "Examine"
    - "Certify"
  sources:
    fedramp_20x: "https://www.fedramp.gov/20x/"
    ksi_mappings: "https://github.com/WhalerMike/uiao/tree/main/src/uiao/adapters/fedramp_aan_catalog/mappings"
    nist_800_53: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"

slides:
  # 1 -----------------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for the assessment and certification book. The compliance and
      implementation tracks each end in a capstone; this book grades them and
      turns the grade into a credential. It supplies the rubric ladder, the KSI
      Closure Necessity Matrix that doubles as the exam, and the definitions of
      the AAN Practitioner and AAN Assessor credentials. Walk the journey strip —
      Score, Trace, Examine, Certify. Note the draft disclaimer; claims are
      self-assessed pending SCA and PMO/AO review.

  # 2 -----------------------------------------------------------------------
  - type: content
    kicker: "THE RUBRIC LADDER"
    title: "Score an evidence claim the way an assessor would"
    layout: grid
    cards:
      - title: "0 — Missing"
        body: "Not addressed, or addressed without reference to the books or the mapping YAML."
        accent: red
      - title: "1 — Named"
        body: "Feeding books and KSI category named, but controls or evidence flow wrong/absent."
        accent: amber
      - title: "2 — Traced"
        body: "book → NIST anchor → KSI → evidence-source chain complete and correct against the mapping."
        accent: teal
      - title: "3 — Assessor-ready"
        body: "Level 2 plus a real uiao oscal ksi-ar verdict, an honest gap statement, and the deadline it answers to."
        accent: navy
    callout:
      text: "Pass bar: every slot at level 2+, at least three slots assessor-ready (level 3). All eight at level 3 is a ConMon narrative."
      accent: navy
    notes: >
      The four-level scale, applied per slot. The language is deliberately an
      assessor's, because the competency certified is a 3PAO's: not whether you
      can assert a control is met, but whether you can trace and evidence the
      closure and say why no alternate mechanism closes it. The pass bar is every
      slot at level two or higher with at least three at level three; all eight at
      level three is, in substance, a ConMon narrative an assessor could read.

  # 3 -----------------------------------------------------------------------
  - type: table
    kicker: "THE EXAM"
    title: "The KSI Closure Necessity Matrix — 10 tool-attestable, 19 architecture-bound"
    headers: ["KSI family", "Tool-attestable alone?", "Slot / series home"]
    rows:
      - cells: ["KSI-001..010 (ScuBA)", "Yes", "— · Vol 0 adapter"]
        accent: teal
      - cells: ["KSI-IAM", "No", "1 · Vol I Bk 03/04/05, Vol II Bk 01, Vol III Bk 01"]
      - cells: ["KSI-PIY", "No", "2, 5 · Vol I Bk 01/02, Vol III Bk 03/04"]
      - cells: ["KSI-CNA", "No", "3 · Vol I Bk 05/06/07, Vol II Bk 03"]
      - cells: ["KSI-MLA", "Partial", "4 · Vol III Bk 02/05/06/07"]
      - cells: ["KSI-CMT", "Partial", "6 · Vol III Bk 04/06, Vol IV Bk 02/03"]
      - cells: ["KSI-RPL", "No", "7 · Vol IV Bk 01"]
      - cells: ["KSI-CED", "No", "8 · Vol IV Bk 05 (Bk 06 cadence)"]
        accent: navy
    callout:
      text: "The exam is the matrix reconstructed from the corpus: place each rule, name the closing mechanism and why no alternate closes it, mark the 10/19 split."
      accent: navy
    notes: >
      The authoritative artifact of the Academy and the exam itself. One row per
      active KSI family: closing mechanism as function not product, whether
      tooling alone can attest it, the slot, and the series home that produces the
      evidence. The bottom line is pre-computed and must reconcile with Vol 0
      Book 00 and Vol IV Book 06 — ten attestable by tooling alone, nineteen
      architecture-bound, twenty-nine total. A candidate who reproduces the split
      with correct per-rule necessity reasoning has the coverage-gap fluency the
      program turns on.

  # 4 -----------------------------------------------------------------------
  - type: content
    kicker: "TWO CREDENTIALS"
    title: "Competency credentials, evidenced by artifacts — not attendance"
    layout: columns
    cards:
      - title: "AAN Practitioner"
        body: "Track B capstone at pass (one module, evidence-complete) + the matrix reconstructed for the slots that module feeds. Proves: build the control and land the evidence."
        accent: navy
        status: "Implementation"
      - title: "AAN Assessor"
        body: "Track A capstone at pass (all eight slots, ≥3 assessor-ready) + the full matrix with the 10/19 split and per-rule reasoning. Proves: trace and adjudicate the whole model."
        accent: teal
        status: "Compliance"
      - title: "Feeds slot 8"
        body: "The dated, per-identity completion record is the training-effectiveness-record that closes AT-2/AT-3 and satisfies KSI-022."
        accent: amber
        status: "KSI-CED"
    callout:
      text: "The Academy's own graduates are the series' training evidence — competency is a control (AT-3), so the credential is evidenced, not attended."
      accent: navy
    notes: >
      Two credentials, both competency-based and evidenced by artifacts. The AAN
      Practitioner proves implementation competency — the Track B capstone plus
      the matrix for the relevant slots. The AAN Assessor proves compliance
      competency — the Track A capstone across all eight slots plus the full
      matrix with correct necessity reasoning. Both feed slot 8: the per-identity,
      dated, machine-readable completion record is the training-effectiveness
      record that closes AT-2 and AT-3 and satisfies KSI-022. The Academy's
      graduates are the series' own training evidence.

  # 5 -----------------------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "Grading the tracks, and closing the training slot on the graduates"
    layout: columns
    cards:
      - title: "Grades Books 01–02"
        body: "Rubrics built from the same eight slots and volume-coordinate references."
        accent: teal
        status: "Vol V Bk 01–02"
      - title: "Cited by Vol IV Book 06"
        body: "The matrix is the exam-grade rendering of the KSI scorecard the authorization package freezes."
        accent: navy
        status: "→ Vol IV Bk 06"
      - title: "Self-evidencing"
        body: "The credentials produce the training record that closes KSI-CED."
        accent: amber
        status: "Slot 8"
    callout:
      text: "An assessor who can state why a closure is the only path — and prove it with a verdict — has earned the credential; one who can only recite 'satisfied' has not."
      accent: navy
    notes: >
      Close on the through-line. This book is the Academy's grading instrument: it
      scores the capstones of Books 01 and 02 with rubrics built from the same
      eight evidence slots, its KSI Closure Necessity Matrix is the citable form
      of the 10-of-29 coverage gap cross-referenced by Vol IV Book 06, and the
      credentials it confers produce the per-identity training record that closes
      the training control the authorization package depends on. The bar is the
      series' bar: state why a closure is the only path and prove it with a real
      verdict.
    vendor_sources: ["fedramp_20x", "ksi_mappings", "nist_800_53"]
