  # 11 --- section -----------------------------------------------------------
  - type: section
    kicker: "PART FOUR"
    title: "Non-repudiation and PKI governance — proving it happened"
    callout: "AU-10 needs irrefutable evidence, not a mutable log. SC-17 needs a documented Certificate Practice Statement, not just a CA. Both are governance, not gear."
    callout_accent: red
    notes: >
      Part Four covers the two data-layer controls that are about proof and
      governance rather than protection: AU-10 non-repudiation and SC-17 PKI
      certificates. AU-10 requires irrefutable evidence that a specific individual
      performed a specific action, and the word irrefutable is load-bearing. A
      standard audit entry — user accessed file at a timestamp — satisfies AU-12
      audit generation, but it does not satisfy AU-10 because a Global Administrator
      can alter or delete the standard log; an attacker who reaches Global Admin
      scope can cover their tracks, so the record is not irrefutable. Purview Audit
      Premium closes that gap with immutable log storage not accessible to tenant
      administrators and high-value events — MailItemsAccessed, SearchQueryInitiated,
      FileDownloaded, SensitivityLabelUpdated — captured only at the Premium tier,
      with retention set to ten years for privileged activity. The presenter should
      draw the AU-10 versus AU-12 line clearly: the series already satisfies AU-12
      through Defender, Azure Monitor, and Sentinel; AU-10 needs the immutable signed
      records specifically, and both controls are required, satisfied by different
      mechanisms. SC-17 is the parallel governance point: it is not satisfied by
      having certificates but by a documented Certificate Practice Statement per RFC
      3647 governing the full lifecycle — issuance, identity proofing, key
      protection, revocation, CRL and OCSP availability. InfoBlox provides the DNS
      and IPAM that make revocation operationally reliable (the CRL and OCSP
      endpoints must resolve), and Azure Key Vault provides the HSM-backed CA key
      storage that satisfies the CPS's technical-controls section. The next slide
      makes both concrete.

