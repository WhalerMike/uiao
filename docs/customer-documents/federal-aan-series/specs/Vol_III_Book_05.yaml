slides:
  # 1 --- title ---------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for Volume III, Book 05. Everything the series has built so far
      governs the pipe and the identity behind it — which paths traffic can take,
      who is asserting an identity, whether a verified identity may reach a workload
      from a given device, and whether privileged scope is time-bound. None of those
      controls answer a different and equally important question: what is the
      payload? A Cloud Access Security Broker at the boundary can see that a file is
      moving from a managed endpoint to OneDrive — the size, the sender, the
      destination — but it cannot tell whether that file is a Privacy Act record, a
      law enforcement sensitive document, or a personnel file. The pipe is
      regulated; the payload is opaque. A legitimately authenticated user, on a
      compliant device, sending to a compliant destination, can still exfiltrate
      CUI if the data was never identified as sensitive before it moved. This book
      closes that payload gap through three coordinated mechanisms and a fourth that
      proves it: a federal classification taxonomy enforced by Purview sensitivity
      labels, Data Loss Prevention that acts on label-derived signal across service,
      endpoint, and network surfaces, cryptographic key management under
      agency-controlled keys, and non-repudiation through immutable signed audit
      records. Together they close the data-layer NIST SP 800-53 Rev 5 controls —
      AC-4, AU-10, the MP family, SC-12, SC-12(1), SC-13, SC-17, and SC-28 — that
      remain open after the network and identity layers are complete. The series
      targets FedRAMP Moderate exclusively (Agency GCC Moderate baseline). Walk the
      journey strip — Classify, Prevent, Encrypt, Prove. Draft CSI-team proposal,
      pre-decisional, not an approved Agency position.
    vendor_sources: ["ms_sensitivity_labels", "host repo: docs/customer-documents/federal-aan-series/Vol_III_Book_05_FedAAN_Data_Protection_Purview.qmd"]

  # 2 --- section -------------------------------------------------------------
  - type: section
    kicker: "PART ONE"
    title: "The payload gap pipe control leaves open"
    callout: "The CASB sees a file transfer — size, sender, destination. It cannot tell a public press release from a Privacy Act record. The pipe is regulated; the payload is opaque."
    callout_accent: navy
    notes: >
      This section motivates the whole book by naming the gap an assessor finds in a
      hardened-but-unclassified Microsoft 365 environment. The structural findings
      are consistent regardless of agency. There is no data classification scheme:
      documents in SharePoint carry no sensitivity labels, so there is no
      machine-readable way to tell whether a file is public, internal, CUI-Basic, or
      CUI-Specified — the classification, where it exists at all, lives in a
      filename or a folder, which is neither enforceable nor auditable. Because
      labels are absent, the service layer treats every document identically:
      SharePoint external-sharing settings apply to a whole site, so you cannot
      restrict sharing of a CUI document while permitting it for a public document
      in the same library. There is no DLP on Teams, so an SSN pasted into a channel
      transits and is stored in plaintext. Encryption keys are managed by individual
      application owners with no central inventory, no rotation, and no access audit
      trail. Non-repudiation (AU-10) is unmet because standard audit logs are
      mutable by a Global Administrator. And SharePoint permissions grant access to
      entire sites rather than to classified content. The unifying insight is the
      CASB point: network-layer controls have no payload signal. The CASB sees a
      file move but not what the file is, so it can apply coarse policies but cannot
      enforce block external sharing of CUI because it cannot determine whether a
      given file is CUI. Purview supplies exactly that missing signal, and the rest
      of the book is how.

  # 3 --- content grid --------------------------------------------------------
  - type: content
    kicker: "WHAT AN ASSESSOR FINDS WITHOUT PURVIEW"
    title: "Six structural gaps in a hardened-but-unclassified tenant"
    layout: grid
    cards:
      - title: "No classification scheme"
        body: "SharePoint documents carry no sensitivity labels. Classification lives in a filename or folder — not enforceable, not auditable, not machine-readable."
        accent: navy
      - title: "Uniform service treatment"
        body: "Without labels, external-sharing settings apply to a whole site. You cannot restrict a CUI file while permitting a public file in the same library."
        accent: teal
      - title: "No Teams DLP"
        body: "An SSN pasted into a Teams message transits and is stored in Exchange Online in plaintext — outside every network-layer control's reach."
        accent: amber
      - title: "Keys without custody"
        body: "TDE keys, private keys, and secrets scattered across config files and subscriptions. No central vault, no rotation policy, no access audit trail."
        accent: red
    callout:
      text: "The CASB reads the pipe; Purview reads the payload. The label is the signal the CASB was missing — the two controls compose, they do not substitute."
      accent: navy
    notes: >
      This slide inventories the gap so the audience feels its shape before the
      tools arrive. Four cards distilled from the assessor's predictable findings.
      No classification scheme: documents carry no labels, so there is no
      programmatic way to determine sensitivity, and the classification decision —
      where it exists — lives in a filename, a manual metadata field, or a folder
      structure, none of which are enforceable or auditable. Uniform service
      treatment: because labels are absent, the Microsoft 365 service layer treats
      every document identically, and SharePoint external-sharing policy applies to
      an entire site or library, so a CUI document and a public document in the same
      library get the same sharing treatment. No Teams DLP: a Social Security Number
      pasted into a Teams message is sent to the service and stored in Exchange
      Online in plaintext, entirely outside the enforcement boundary of
      network-layer controls. Keys without custody: TDE keys, certificate private
      keys, and application secrets sit in config files, local certificate stores,
      and individual subscriptions with no central vault, no rotation, and no audit
      trail — an assessor cannot even determine whether keys were rotated after an
      administrator with access departed. The callout is the architectural thesis of
      the book: the CASB reads the pipe and Purview reads the payload; the label is
      the payload signal the CASB was missing, and the two controls compose rather
      than substitute. When a label is applied, its metadata travels with the file,
      the CASB reads it, and boundary enforcement finally becomes content-aware.

  # 4 --- content grid --------------------------------------------------------
  - type: content
    kicker: "THE FEDERAL CUI TAXONOMY"
    title: "Four tiers, mapped to Purview sensitivity labels"
    layout: grid
    cards:
      - title: "Public"
        body: "Cleared for unrestricted release. No handling restrictions, no marking, no encryption. Press releases, published regulations, public program data."
        accent: navy
      - title: "Internal"
        body: "Not classified, not for public release — drafts, working papers, administrative mail. Label applied for handling; no legal marking requirement."
        accent: teal
      - title: "CUI-Basic"
        body: "Controlled Unclassified Information under the CUI Registry's baseline: mark, safeguard, limit to authorized holders. Encrypted, agency-domain scoped."
        accent: amber
      - title: "CUI-Specified"
        body: "CUI where a law or policy sets specific handling — Privacy Act (5 U.S.C. 552a), tax (26 U.S.C. 6103), LES. Named holders, time-limited, premium audit."
        accent: red
    callout:
      text: "Governed by EO 13556 and the NARA CUI Registry; safeguards per NIST SP 800-171 (non-federal) and NIST SP 800-53 Rev 5 (federal). Labels carry the tier's controls."
      accent: navy
    notes: >
      This slide grounds the classification work in the actual federal framework so
      the taxonomy is not an arbitrary agency invention. The government's
      classification framework for unclassified information is governed by Executive
      Order 13556 and implemented by NARA through the CUI Registry; NIST SP 800-171
      supplies the safeguards for CUI in non-federal systems and NIST SP 800-53 Rev
      5 the equivalent for federal systems. Four operative tiers for a civilian
      agency's holdings. Public is cleared for unrestricted release with no handling
      restrictions and no marking. Internal is not classified but not for public
      release — internal mail, drafts, working papers — with no legal marking
      requirement but an agency handling policy. CUI-Basic is Controlled
      Unclassified Information subject to the CUI Registry's baseline handling with
      no additional authority: mark it, safeguard it, limit access to authorized
      holders, and in Purview terms encrypt it and scope decryption to the agency
      domain. CUI-Specified is CUI where a specific law or government-wide policy
      imposes handling that differs from the baseline, and the agency must cite the
      authority — Privacy Act records under 5 U.S.C. 552a, tax information under 26
      U.S.C. 6103, Law Enforcement Sensitive, HIPAA-protected health information —
      with named authorized holders, time-limited access, and Purview Audit Premium
      logging. Each tier maps to a Purview sensitivity label carrying the protective
      controls appropriate to it, organized parent-to-child so CUI-Specified has
      child labels for each specific authority. Land the callout: the labels are not
      cosmetic markings — each one carries the encryption, access scope, and audit
      posture its tier demands.
    vendor_sources: ["nara_cui", "nist_800_171", "nist_800_53"]

  # 5 --- section -------------------------------------------------------------
  - type: section
    kicker: "PART TWO"
    title: "From label to enforcement — the classification-to-DLP chain"
    callout: "A label is only useful if it moves with the file and something acts on it. Auto-labeling supplies the signal; three DLP surfaces act on it."
    callout_accent: teal
    notes: >
      Part Two is the operational heart of the book — how a classification decision
      becomes an enforced restriction. It has two halves. First, getting the label
      onto the content reliably, which manual labeling alone never achieves: authors
      label the obviously sensitive document but miss the routine handling — the
      spreadsheet of SSNs extracted for a task, the deck of budget projections, the
      EIN in a Teams message — that constitutes the majority of actual CUI exposure.
      Automatic labeling closes that by classifying on content inspection
      independent of author awareness, using Sensitive Information Types
      (pattern-matching classifiers for SSN, ITIN, EIN, passport, DEA numbers, plus
      custom agency identifiers), trainable classifiers (ML for document categories
      that do not match a pattern, such as policy documents or case notes), and
      auto-labeling policies that apply labels both to content at rest via the
      SharePoint scanner and to new content at creation or send time. The discipline
      the book insists on: always deploy auto-labeling in simulation mode first, so
      the report shows what would be labeled without modifying anything, and review
      for false positives before switching to enforce — a false-positive spike at
      scale generates help-desk calls. The second half is DLP acting on the label
      across three enforcement surfaces, which the build sequence walks. Frame the
      chain here so the next slides land as one continuous pipeline: classify the
      payload, attach a persistent label, then enforce that label at every point
      the data can move.

  # 6 --- table --------------------------------------------------------------
  - type: table
    kicker: "AUTOMATIC LABELING · THE SIGNAL SOURCES"
    title: "How content gets classified without relying on the author"
    headers: ["Mechanism", "What it detects", "Where it runs", "NIST relevance"]
    rows:
      - cells: ["Sensitive Information Types", "SSN, ITIN, EIN, passport, DEA, bank account — pattern + proximity", "Service + endpoint content inspection", "MP-3, MP-4"]
        accent: navy
      - cells: ["Custom SIT", "Agency identifiers — employee/case/claim numbers (regex + keyword)", "Same, agency-defined pattern pack", "MP-3"]
        accent: teal
      - cells: ["Trainable classifier", "Categories with no fixed pattern — policy docs, case notes, budget papers", "ML model trained on 50-500 samples", "MP-3"]
        accent: amber
      - cells: ["Auto-labeling (at rest)", "Existing library content, retroactively, via the SharePoint scanner", "SharePoint Online + OneDrive", "MP-3, MP-4"]
        accent: navy
      - cells: ["Auto-labeling (in transit)", "New content at creation or send time — Office apps + Exchange", "Client-side, user can accept/override", "AC-4, MP-5"]
        accent: teal
    callout:
      text: "Always deploy auto-labeling in simulation mode first — the report shows what would be labeled without modifying content. Enforce only after reviewing false positives."
      accent: amber
    notes: >
      This is a reference table — let the audience read it. Five mechanisms by which
      content gets classified without depending on the author to recognize
      sensitivity. Sensitive Information Types are pattern-matching classifiers with
      proximity and confidence scoring for common federal data — Social Security
      Numbers, ITINs, EINs, passport numbers, DEA numbers, bank account and routing
      pairs — maintained as a pre-built library by the service. Custom SITs extend
      that to agency-specific identifiers, such as an employee number matching a
      regex and a keyword proximity rule, packaged as an agency rule pack. Trainable
      classifiers handle categories that have no fixed pattern at all — internal
      policy documents, law enforcement case notes, budget working papers — by
      training an ML model on 50 to 500 representative samples, and the book warns
      that the samples must be representative of the real population or the
      classifier underperforms on informal documents. Auto-labeling policies then
      apply labels in two modes: service-side against content already at rest in
      SharePoint and OneDrive via a background scanner, which is how existing CUI
      exposure is addressed retroactively, and client-side at creation or send time
      in Office and Exchange, where the user sees a suggestion they can accept or
      override. The callout carries the operational rule the book states twice:
      always run auto-labeling in simulation mode first — the simulation report shows
      exactly which documents would receive which label without touching any content
      — and switch to enforcement only after reviewing the false positives, because a
      false-positive spike that mislabels routine internal documents as CUI-Specified
      generates help-desk calls at scale.
    vendor_sources: ["ms_sit", "ms_auto_labeling"]

  # 7 --- build-sequence (5 steps) -------------------------------------------
  - type: build-sequence
    kicker: "THE CLASSIFICATION-TO-ENFORCEMENT CHAIN"
    title: "How a CUI document is stopped from leaving the boundary"
    notes: >
      Fallback notes: the label supplies the payload signal, and three DLP surfaces
      enforce on it — service layer, endpoint, and CASB network boundary — so
      enforcement follows the content wherever it tries to move.
    steps:
      - label: "Classify"
        sub: "SIT detects the pattern"
        accent: navy
        detail: >
          A Sensitive Information Type inspects the content and matches — for example
          an SSN at 85% confidence in an outbound message or a stored spreadsheet.
          The payload is now known to be sensitive, independent of the author.
        notes: >
          Step one: classify the payload. A Sensitive Information Type inspects the
          content — the body of a document, a message, a spreadsheet cell — and
          matches a pattern with a confidence score, say a U.S. Social Security
          Number at 85% confidence. This is the moment the system learns what the
          data is, and critically it happens by content inspection, not by trusting
          the author to have recognized the sensitivity. That independence is the
          whole reason automatic classification exists: the majority of real CUI
          exposure is routine data handling where the author never thought to
          classify. Emphasize that classification alone changes nothing yet — no file
          has been blocked, no label attached — it is purely the detection that seeds
          everything downstream. Give the audience the scale reason this matters:
          manual labeling covers the intentionally sensitive document and misses the
          spreadsheet of SSNs extracted for a workflow, the deck of budget
          projections, the EIN dropped into a chat. Content inspection catches the
          routine handling that human labeling structurally cannot, and it is the raw
          signal the next four steps act on. Reinforce the confidence-and-simulation
          discipline here: the SIT match carries a confidence score, and the whole
          classification stage is first run in simulation mode so the team can see
          exactly what would be detected and labeled before any enforcement touches a
          document — a false match at this step would otherwise propagate into a
          wrongful block downstream, so the detection is tuned against real content
          before the label of step two is ever applied for real.
      - label: "Label"
        sub: "Persistent, travels with the file"
        accent: teal
        detail: >
          A sensitivity label is applied and its metadata is written into the file —
          an encrypted property of the Office container or a PDF custom property. The
          label now travels with the content across platforms and format changes.
        notes: >
          Step two: attach the label. Based on the classification, a sensitivity
          label is applied — CUI-Basic, or CUI-Specified with the specific authority
          — and its metadata is written into the file itself as an encrypted property
          of the Office Open XML container or a custom property on a PDF. This is the
          decisive architectural move: the label is not a database tag that stays
          behind in SharePoint, it travels with the content. Move the file to
          OneDrive, email it, copy it to a laptop, convert its format — the label
          persists, and with it the tier's protective controls, including encryption
          that scopes decryption to authorized holders even outside the SharePoint
          boundary. That persistence is what makes every subsequent enforcement
          surface possible: each one reads the same label the file carries rather than
          having to re-classify from scratch. Underline the payoff for the CASB
          problem from Part One — the label is exactly the payload signal the network
          boundary was missing, and because it lives in the file, the boundary can
          read it when the file arrives. Steps three, four, and five are three
          different surfaces all acting on this one persistent label. State the access
          consequence explicitly: for the CUI tiers the label does not only mark the
          file, it encrypts it and scopes decryption to authorized holders, so even if
          a file slips past every DLP surface and lands on an unmanaged device or an
          external mailbox, an unauthorized holder cannot open it — the label is both
          the signal the enforcement surfaces read and, for encrypted tiers, a
          last-line protection that travels when the perimeter does not.
      - label: "Service-layer DLP"
        sub: "SharePoint / Exchange / Teams"
        accent: amber
        detail: >
          Server-side DLP evaluates the label when content is shared or sent. Block
          external sharing of a CUI-labeled file; block external email of CUI; alert
          on an SSN in Teams. The broadest surface — independent of device state.
        notes: >
          Step three: service-layer DLP, the broadest enforcement surface because it
          operates server-side within Microsoft 365 regardless of the endpoint's
          compliance state. When labeled content is shared, sent, or posted, the
          service evaluates the DLP policy before the action completes: block
          external sharing of a CUI-Basic or CUI-Specified file in SharePoint and
          OneDrive with a policy tip and an alert; block external email of a
          CUI-labeled message in Exchange; restrict and alert on an SSN detected in a
          Teams message. The user sees a policy tip explaining why, and the share or
          send is stopped at the service before it leaves. Make the coverage point
          explicit: because this layer is server-side, it protects content even from
          an unmanaged or non-compliant device that the endpoint layer cannot reach —
          it is the floor of DLP coverage. But it is not complete on its own, because
          plenty of exfiltration paths never transit the Microsoft 365 service at all
          — printing, USB, clipboard, a browser upload to a non-Microsoft site — which
          is precisely what the next surface exists to cover. Service-layer DLP is
          necessary and broad; the endpoint fills the gaps it structurally cannot see.
          Voice the user-experience design too: the policy tip is not incidental — it
          tells the user why the action was blocked and what the approved alternative
          is, so the control educates rather than merely frustrates, which is what
          keeps users from routing around it. A DLP program that blocks silently
          trains users to find workarounds; one that explains itself at the moment of
          the block turns each stop into a small piece of classification training.
      - label: "Endpoint DLP"
        sub: "Print / USB / clipboard / upload"
        accent: red
        detail: >
          The Defender for Endpoint sensor enforces on the device for activities that
          bypass the service: block print and USB transfer of CUI-Specified, block
          upload to non-approved cloud storage, audit clipboard and network-share copy.
        notes: >
          Step four: endpoint DLP, which extends enforcement to the activities that
          never touch the Microsoft 365 service and would otherwise be invisible. It
          runs on the Windows workstation through the Defender for Endpoint sensor,
          so it depends on the device being onboarded to Defender — the same
          device-compliance and Conditional Access requirement the series established
          earlier. On a CUI-Specified labeled file it can block printing, block copy
          to removable media such as a USB drive, block upload to a browser-based
          cloud application that is not an approved Microsoft 365 service, and audit
          clipboard and network-share copies. These are the exfiltration channels a
          server-side control cannot see because they happen entirely on the device.
          The operational caveat the book flags and the presenter should voice: a
          device excluded from Defender onboarding — a legacy control system, a
          specialized test workstation — will not receive endpoint DLP policy, so the
          Defender onboarding coverage report must be audited and gaps resolved before
          relying on this layer. Endpoint DLP is where the label follows the data all
          the way to the last physical action a user can take on the box, closing the
          paths service-layer DLP structurally cannot reach.
      - label: "CASB network boundary"
        sub: "Label metadata via Graph"
        accent: teal
        detail: >
          At the internet boundary the CASB reads the file's label through the Graph
          API and enforces the label-specific policy — block upload of a CUI-Specified
          file to a non-approved destination. The pipe is now content-aware.
        notes: >
          Step five closes the loop back to Part One's thesis. At the network
          boundary, the CASB — the same broker that could see only pipe metadata —
          now queries the moving file's sensitivity label through the Microsoft Graph
          API and enforces the label-specific policy: block upload of a CUI-Specified
          file to a non-approved cloud destination, for instance. This is the exact
          integration the book builds toward: Purview classifies the payload, exposes
          the label metadata, and the CASB enforces on it. The static network
          boundary has become a content-aware enforcement boundary. Land the composed
          result the audience should carry out: one persistent label, produced once by
          content inspection, is now enforced at three independent surfaces — the
          Microsoft 365 service, the endpoint, and the network boundary — so a CUI
          document is stopped whether a user tries to share it, email it, print it,
          copy it to USB, or upload it to a personal cloud drive. No single surface is
          sufficient alone, but composed they follow the content everywhere it can go.
          This is the reference state to export back into the Book as the
          classification-to-enforcement figure — the payload gap of Part One, closed.
        vendor_sources: ["ms_dlp"]

  # 8 --- section -------------------------------------------------------------
  - type: section
    kicker: "PART THREE"
    title: "Cryptographic key management — keys the agency controls"
    callout: "Classification decides what to protect; keys decide whether the agency, not Microsoft, controls the protection. SC-12 and SC-13 close on agency-held keys in an HSM."
    callout_accent: amber
    notes: >
      Part Three moves from what the data is to whether the agency controls the
      cryptography protecting it. A federal key infrastructure is a hierarchy of
      trust with four levels, and compromise at any level invalidates everything
      below it. The root CA private key lives in an offline HSM, brought online only
      to issue or renew, self-signed and distributed as a trusted root. The issuing
      CA operates online, issuing device, user, and TLS certificates, with its
      private key in a cloud HSM — Azure Key Vault Premium — for availability and
      auditability. Customer-Managed Keys in Key Vault replace Microsoft-managed
      encryption keys for data at rest across SharePoint, Exchange, SQL Server TDE,
      and Blob storage: the agency controls the key lifecycle, Microsoft's service
      wraps and unwraps the data encryption key using the CMK, and the plaintext CMK
      never leaves the HSM boundary. Data encryption keys are generated fresh per
      resource and are never stored in plaintext outside the HSM. The federal
      requirement the presenter must state: Key Vault Premium provides HSM-protected,
      FIPS-validated keys, which is what satisfies SC-12 and SC-13 at Moderate; the
      Standard tier's software keys do not. The operational doctrine is that no human
      identity has standing access to key material — access is granted to Managed
      Identities through Azure RBAC, humans get metadata-only Reader except a single
      break-glass administrator, and every key operation is logged. The next slide
      walks the hierarchy and the CMK-for-TDE migration concretely.

  # 9 --- content grid --------------------------------------------------------
  - type: content
    kicker: "THE FEDERAL KEY HIERARCHY · SC-12 / SC-13 / SC-28"
    title: "Four levels of trust, agency-controlled at the top"
    layout: grid
    cards:
      - title: "Root CA — offline HSM"
        body: "Self-signed root private key kept offline except to issue or renew. Distributed as a trusted root by Group Policy. The anchor of the hierarchy."
        accent: navy
      - title: "Issuing CA — Key Vault HSM"
        body: "Online CA issuing device, user, and TLS certs; private key in Azure Key Vault Premium (HSM) for availability, auditability, and non-exportability."
        accent: teal
      - title: "Customer-Managed Keys"
        body: "CMK in Key Vault wraps the data encryption keys for SQL TDE, SharePoint BYOK, and Exchange Customer Key. The plaintext CMK never leaves the HSM."
        accent: amber
      - title: "Managed-Identity access"
        body: "No human holds standing key access. Key Vault Crypto User is granted to Managed Identities via RBAC; one break-glass admin; all operations logged."
        accent: red
    callout:
      text: "Key Vault Premium provides HSM-protected, FIPS-validated keys — required for SC-12/SC-13 at Moderate. Rotation policy: 12-month automatic cycle, notify at 30 days, soft-delete + purge protection."
      accent: navy
    notes: >
      This slide makes the key hierarchy concrete and ties it to the controls it
      closes. Four levels, and the agency's control tightens as you go up. The root
      CA private key sits in an offline HSM, online only during issuance or renewal,
      self-signed and pushed as a trusted root by Group Policy — it is the anchor,
      and its offline posture is why a compromise of the online estate does not
      reach it. The issuing CA operates online and issues the end-entity certificates
      the environment actually uses, with its private key stored in Azure Key Vault
      Premium HSM so the key is available, every use is audited, and it is
      non-exportable. Customer-Managed Keys are the data-at-rest story: a CMK in Key
      Vault wraps the data encryption keys for SQL Server TDE, SharePoint BYOK, and
      Exchange Customer Key, and the plaintext CMK never leaves the HSM boundary —
      Microsoft's service wraps and unwraps with it but never holds it in the clear.
      The access model is the fourth card and the operational heart: no human has
      standing access to key material; the Key Vault Crypto User role is granted to
      Managed Identities — the SQL server's, the Customer Key service principal's —
      through Azure RBAC, only a single break-glass account holds administrator, all
      other humans get metadata-only Reader, and every key operation is logged to Log
