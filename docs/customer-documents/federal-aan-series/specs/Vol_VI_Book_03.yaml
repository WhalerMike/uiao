slides:
  # 1 -----------------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for Detection Engineering — Volume VI Book 03, the deployable
      realization of the Volume III SIEM/XDR architecture. Volume III makes the
      assessor-facing argument that AU-6 is not satisfied by log collection alone:
      a SIEM with zero configured analytics rules, or every rule disabled pending
      tuning, fails the control. It stops at the architecture. This book carries
      the rules. Frame the engineering problem plainly: the richest behavioral
      detections a modern cloud offers — machine-learning risk scoring,
      impossible-travel, sub-second session anomaly, behavioral data-loss
      analytics — are computed in the vendor's commercial multi-tenant pipeline,
      which is frequently out of scope inside a federal authorization boundary.
      The detection capability is degraded not because the data is missing but
      because the analytic layer over it sits outside the boundary. Walk the
      journey strip — Land, Analyze, Detect, Respond — because it is the shape of
      every rule: telemetry the Volume III connector fabric already lands, a
      scheduled analytic that reconstructs the commercial ML output in-boundary,
      a detection with entity mappings and ATT&CK tags, and a handoff to the
      Book VI-04 response playbooks. Keep FedRAMP scope at Moderate. Note the
      draft disclaimer: this is CSI Team work, not yet reviewed by the Agency CIO
      Office or OIS, and every threshold is a starting point to be tuned.

  # 2 -----------------------------------------------------------------------
  - type: section
    kicker: "PART ONE — THE PROBLEM"
    title: "The analytic layer, not the data, is what the boundary removes"
    callout: "The boundary constrains the destination of raw telemetry, not the data itself. Route the same telemetry to the agency's own workspace and the detection is lawful where inheriting the commercial analytic is not."
    callout_accent: navy
    notes: >
      This section establishes the single fact that makes the whole library
      lawful. The blocked flow is raw, identity-attributed behavioral telemetry
      leaving the boundary for a commercial multi-tenant analytics service. The
      rebuild flow is the same telemetry routed to the agency's own analytics
      workspace inside its own authorized boundary — exactly the in-boundary
      monitoring SI-4 and AU-2/AU-3 contemplate. The distinction is not a
      loophole; it is the boundary working as designed. Stress the corollary that
      constrains every engineering choice downstream: every component the library
      depends on — the workspace, any model-training compute, any enrichment
      lookup — must itself be authorized and in-boundary. The moment telemetry is
      shipped to an out-of-scope service for convenience, the library has
      recreated the flow the boundary forbids and the closure collapses. This is
      the in-boundary principle that separates a compliant reconstruction from a
      shadow of the commercial pipeline. It is also why the library is authored
      as deterministic rules and baselines rather than by pointing the workspace
      at an external ML endpoint: determinism keeps the computation inside the
      boundary and makes it reviewable.

  # 3 -----------------------------------------------------------------------
  - type: content
    kicker: "THE IN-BOUNDARY RECONSTRUCTION"
    title: "Four moves turn a log warehouse into an operating detection engine"
    layout: grid
    cards:
      - title: "Land"
        body: "The Volume III connector fabric lands sign-in (interactive and non-interactive), unified-audit, and device-event tables into one workspace."
        accent: navy
      - title: "Analyze"
        body: "A scheduled KQL analytic reconstructs the commercial ML output — geo-velocity, atypical-IP, low-and-slow spray — deterministically, in-boundary."
        accent: teal
      - title: "Detect"
        body: "Each rule carries entity mappings, MITRE ATT&CK tags, and an inline-flagged threshold to tune against the local baseline."
        accent: amber
      - title: "Respond"
        body: "High-confidence firings hand off to the Book VI-04 playbooks; the incident and its evidence emit to the Book VI-07 contract."
        accent: red
    callout:
      text: "The mechanism — deterministic detections and baselines reconstructing a commercial ML output in-boundary — is the invariant; the query language is the deployed example."
      accent: navy
    notes: >
      These four moves are the fixed shape of the library. Land is the
      prerequisite: the rules query tables that must already be arriving, so a
      missing or silently-stopped connector is a detection outage, not a tuning
      problem. Analyze is the substance — a scheduled analytic computes a
      rule-and-baseline equivalent of the commercial signal over the landed
      telemetry, producing a deterministic output the agency owns end to end.
      Detect is the operational packaging: entity mappings let the SIEM correlate
      a firing to an account, host, and IP so a responder and a playbook can act
      on it, and the ATT&CK tags let the coverage be mapped to adversary
      technique rather than to a product feature. Respond is the handoff to
      Book VI-04. Emphasize the deployed-example framing: the library ships in
      the Microsoft Sentinel scheduled-analytics-rule format because Sentinel is
      the deployed example for the Agency estate and its KQL runs directly over the
      Volume III tables, but the library carries a translation column for Splunk
      SPL and Elastic EQL/ES|QL so a different SIEM realizes the same detections.
      The mechanism is the invariant; the query language is the deployed example.
    vendor_sources: ["ms_sentinel_analytics", "ms_signin_logs", "mitre_attack"]

  # 4 -----------------------------------------------------------------------
  - type: table
    kicker: "THE RULE LIBRARY"
    title: "Seven rules, each reconstructing a commercial signal in-boundary"
    headers: ["Rule", "Reconstructs (commercial signal)", "Controls"]
    rows:
      - cells: ["01 impossible-travel", "Identity Protection ML impossible-travel", "SI-4 · AC-7 · IA-2"]
        accent: navy
      - cells: ["02 atypical-ip-asn", "Identity Protection atypical-IP / unfamiliar properties", "SI-4 · AC-2 · IA-2"]
      - cells: ["03 password-spray-lowandslow", "ML spray / low-and-slow (incl. non-interactive)", "SI-4 · AC-7"]
      - cells: ["04 token-theft-session-anomaly", "Session-anomaly heuristic; triggers CAE-approximation", "SI-4 · AC-12"]
        accent: amber
      - cells: ["05 mass-label-removal-decrypt", "Sensitivity-label usage analytics", "SI-4 · AU-6 · AC-4"]
      - cells: ["06 dlp-override-pattern", "Behavioral-DLP override / near-miss richness", "SI-4 · AU-6 · AC-4"]
      - cells: ["07 anomalous-elevation-epm", "Endpoint privilege-management elevation analytics", "SI-4 · AC-6(9)"]
        accent: teal
    callout:
      text: "The library is versioned under impl/detection-rules/; each rule cross-references the Volume III architecture it implements and the controls it operationalizes."
      accent: navy
    notes: >
      This is the reference map for the library, one row per deployable rule.
      Read the columns as the closure chain: the rule name is the artifact, the
      middle column is the commercial ML signal it reconstructs so the agency is
      not simply losing that detection at the boundary, and the last column is the
      NIST SP 800-53 Rev 5 anchors the rule operationalizes. Rules 01 through 04
      are the identity-behavior detections that rebuild Entra Identity Protection
      risk signals — impossible-travel, atypical IP and ASN, low-and-slow password
      spray including the non-interactive sign-in path attackers favor, and the
      token-theft session anomaly that is the trigger for the Book VI-04 revoke
      playbook. Rules 05 and 06 pair with Book VI-05 data protection: they watch
      sensitivity-label usage and DLP-override behavior, which is why they carry
      AU-6 and AC-4 alongside SI-4. Rule 07 pairs with PAM to watch endpoint
      privilege elevation, anchoring AC-6(9) audit of privileged-function
      execution. Stress that the library does not claim commercial parity; it
      claims in-boundary evaluability of the same technique coverage, scored under
      the FedRAMP 20x KSI-MLA monitoring-logging-alerting indicator.
    vendor_sources: ["ms_identity_protection", "nist_800_53"]

  # 5 -----------------------------------------------------------------------
  - type: build-sequence
    kicker: "HOW A SCHEDULED ANALYTIC FIRES"
    title: "The impossible-travel rule, end to end"
    notes: "Fallback notes; each step carries its own presenter prose."
    steps:
      - label: "Query"
        sub: "SigninLogs"
        accent: navy
        detail: >
          The scheduled rule reads successful sign-ins from the Volume III
          SigninLogs table (ResultType == 0) and extracts the geo-coordinates
          the sign-in event already carries — no new telemetry, no data leaving
          the boundary.
        notes: >
          Step one is the query against telemetry that is already landing. The
          rule filters to successful interactive sign-ins and extracts latitude
          and longitude from the LocationDetails field the sign-in log already
          records. Nothing here reaches outside the boundary: the computation is
          a KQL query over an in-boundary table. This is the concrete form of the
          in-boundary principle — the same identity-attributed telemetry that the
          commercial pipeline would have consumed is instead consumed by the
          agency's own workspace. Stress the prerequisite: if the connector has
          silently stopped landing sign-in events, this step returns nothing and
          the detection is dark without erroring, which is exactly the silent
          decay Book VI-08 validation harnesses exist to catch.
      - label: "Correlate"
        sub: "geo-velocity"
        accent: teal
        detail: >
          Serialized and sorted per user, the rule compares each sign-in to the
          previous one and computes implied travel speed with geo_distance_2points
          over the elapsed time — the deterministic equivalent of the commercial
          impossible-travel model.
        notes: >
          Step two is the reconstruction itself. Sorting by user and time and
          serializing lets the rule reference the previous sign-in with prev(),
          then compute the great-circle distance between the two locations with
          the KQL geo_distance_2points function and divide by the elapsed hours to
          get an implied travel speed. When that speed exceeds a commercial-flight
          threshold the sign-in pair is physically implausible for one human. This
          is deterministic where the commercial signal is probabilistic, which is
          the honest trade: the agency gets an explainable, in-boundary detection
          it can defend to an assessor line by line, at the cost of the continuous
          ML tuning the vendor's pipeline applies.
      - label: "Threshold"
        sub: "// TUNE"
        accent: amber
        detail: >
          The 900 km/h boundary is a conservative starting point flagged
          // TUNE. It must be calibrated against the estate's own baseline —
          teleworkers, VPN egress, and cloud-relay logins all shift it — before
          the rule is enabled.
        notes: >
          Step three is the tuning gate, and it is mandatory. Every threshold in
          the library is a conservative starting point flagged inline with a
          // TUNE comment, and the impossible-travel speed is the canonical
          example: VPN egress points, cloud relays, and legitimate travel all
          shift the false-positive profile, so a threshold that works for one
          estate will flood another. The rule ships disabled-by-default and is
          enabled only after calibration against the agency's own baseline. This
          is where the operate-and-tune cost lives: a rule enabled without
          baselining is either noise that trains responders to ignore it or a
          silent miss, and both are worse than no rule because both are
          indistinguishable from coverage on paper.
      - label: "Map"
        sub: "entities + ATT&CK"
        accent: navy
        detail: >
          The firing is mapped to Account, IP, and Host entities and tagged with
          the MITRE ATT&CK technique, so the SIEM can correlate it into an
          incident and coverage can be measured against adversary technique.
        notes: >
          Step four packages the firing for operations. Entity mappings bind the
          alert to the Account, IP address, and Host so the SIEM can correlate
          related firings into a single incident and so the Book VI-04 playbook
          has a concrete principal to act on — a revocation needs an account
          object, not a log line. The MITRE ATT&CK tag lets detection coverage be
          reported against adversary technique rather than against a vendor
          feature list, which is how an assessor and a threat-informed defense
          program both want to see it. This mapping is not cosmetic: it is the
          difference between an alert a human can triage and a row in a table.
      - label: "Hand off"
        sub: "→ Book VI-04"
        accent: red
        detail: >
          A high-confidence firing raises a Sentinel incident that triggers the
          Book VI-04 response playbook; the incident and the response action emit
          to the Book VI-07 evidence contract for ConMon.
        notes: >
          Step five is the handoff that turns a detection into control. A
          high-confidence firing raises an incident that, through the SIEM's
          automation rules, triggers the matching Book VI-04 response playbook —
          for the token-theft session anomaly that is session revocation and
          confirm-compromised. The incident and the response action both emit to
          the Book VI-07 evidence contract, which is what makes AU-6 demonstrable:
          the assessor's actual request is "show me an alert that fired in the
          last thirty days and the incident it generated," and this handoff is
          what produces that artifact. Detection without this step shortens
          time-to-know but not time-to-contain.

  # 6 -----------------------------------------------------------------------
  - type: content
    kicker: "DEPLOYMENT"
    title: "Rules ship through the pipeline, disabled until baselined"
    layout: columns
    cards:
      - title: "Pipeline, not click-path"
        body: "Deploy via the SIEM repository connection (GitHub / Azure DevOps), a PowerShell module, or ARM conversion — through the Book VI-00 change-controlled pipeline."
        accent: navy
        status: "Book VI-00"
      - title: "Prerequisite: the fabric"
        body: "Sign-in (interactive and non-interactive), unified-audit, and device-event tables must already be landing. No fabric, no detection."
        accent: teal
        status: "Volume III"
      - title: "Tune before enable"
        body: "Every threshold is a // TUNE starting point calibrated against the agency's own baseline before the rule is enabled."
        accent: amber
        status: "// TUNE"
    callout:
      text: "The .pptx is a build artifact and so is the rule set: authored as code, versioned, reviewed, and deployed — never hand-edited in the portal."
      accent: navy
    notes: >
      Deployment is a change-control story, not a portal exercise. The rules use
      the Sentinel scheduled-analytics-rule YAML schema and deploy through the
      SIEM's repository connection, a PowerShell module, or ARM conversion —
      always through the Book VI-00 change-controlled pipeline so that every rule
      change is reviewed, versioned, and attributable, which is itself part of the
      CM and AU evidence story. The hard prerequisite is the Volume III connector
      fabric: the interactive and non-interactive sign-in tables, the unified
      audit log, and the device-event tables the rules query must already be
      landing, because a rule over an empty table is a detection that cannot fire.
      The non-interactive sign-in path deserves emphasis because it is where
      low-and-slow spray and token abuse hide and where teams most often forget to
      enable the connector. Finally, every threshold ships as a conservative
      // TUNE starting point and every rule ships disabled until it is calibrated
      against the agency's own baseline — enabling an untuned rule is how a
      detection program buries real signal under false positives and trains its
      responders to ignore the console.
    vendor_sources: ["ms_sentinel_repo", "ms_kql"]

  # 7 -----------------------------------------------------------------------
  - type: table
    kicker: "WHAT THE LIBRARY OPERATIONALIZES"
    title: "Rules to controls to the KSI that scores them"
    headers: ["Control", "What the rule proves", "KSI"]
    rows:
      - cells: ["SI-4", "System monitoring — a configured analytic that fires on the behavior", "KSI-MLA"]
        accent: navy
      - cells: ["AU-6", "Audit review — an alert and the incident it generated, on demand", "KSI-MLA"]
      - cells: ["AC-7", "Unsuccessful-logon handling — spray and impossible-travel detection", "KSI-IAM"]
      - cells: ["AC-12", "Session termination — the session-anomaly trigger for revocation", "KSI-IAM"]
      - cells: ["AC-6(9)", "Audit of privileged-function execution — elevation analytics", "KSI-CNA"]
    callout:
      text: "Closure Necessity: without the rules, the SSP describes a detection control no assessor can exercise. The rule is what makes AU-6 assessable."
      accent: amber
    notes: >
      This mapping is the assessor-facing spine. SI-4 and AU-6 are the two the
      library is built to satisfy: SI-4 system monitoring is proven by a
      configured analytic that actually fires on the target behavior, and AU-6
      audit review is proven by the agency's ability to produce, on demand, an
      alert that fired and the incident it generated. That last point is the
      Closure Necessity argument — the Volume III architecture proves a connected
      SIEM is the mechanism that satisfies AU-6 and SI-4, but this book is what
      makes the closure demonstrable, because a SIEM with no rules cannot produce
      the artifact the assessor asks for. AC-7 unsuccessful-logon handling is
      operationalized by the spray and impossible-travel rules, AC-12 session
      termination by the session-anomaly rule that triggers revocation, and
      AC-6(9) audit of privileged-function execution by the endpoint-elevation
      rule. In FedRAMP 20x terms these roll up to KSI-MLA for
      monitoring-logging-alerting, KSI-IAM for the identity-behavior detections,
      and KSI-CNA where the privileged-execution audit lives. The rules are not an
      alternate closure path — they are the deployed form of the one the
      architecture names.
    vendor_sources: ["nist_800_53", "fedramp_20x"]

  # 8 -----------------------------------------------------------------------
  - type: content
    kicker: "HONEST LIMITS"
    title: "What the library is not — carry these into any assessment"
    layout: grid
    cards:
      - title: "Minutes, not commercial-minutes"
        body: "These are minutes-to-hours detections, not the continuously-tuned commercial-minutes fidelity of the vendor's pipeline."
        accent: amber
      - title: "No global threat intel"
        body: "The agency sees only its own tenant; atypical-IP and leaked-credential joins are bounded by whatever feed the agency subscribes to."
        accent: red
      - title: "Approximate revocation"
        body: "Rule 04 triggers a Book VI-04 playbook that approximates real-time session revocation at minutes, not sub-second."
        accent: amber
      - title: "Detections rot"
        body: "Thresholds drift and sources silently stop emitting; the standing operate-and-tune capability is the real cost and the precondition for the maturity claim."
        accent: red
    callout:
      text: "The library does not pretend to commercial parity. Book VI-08 carries the validation harnesses that catch the silent decay."
      accent: amber
    notes: >
      Be explicit about the limits, because an assessment that discovers them is
      worse than one told them up front. First, these are minutes-to-hours
      detections bounded by the scheduled-analytic cadence, not the
      continuously-recomputed commercial-minutes fidelity of the vendor's ML
      pipeline — a scheduled rule cannot beat its own schedule. Second, the
      library carries no global threat intelligence: the agency sees only its own
      tenant, so the atypical-IP and leaked-credential joins are only as good as
      whatever threat-intel feed the agency subscribes to and lands in-boundary.
      Third, the session-anomaly rule triggers a Book VI-04 playbook that
      approximates real-time revocation at minutes, not the sub-second Continuous
      Access Evaluation the boundary removes. Fourth and most important
      operationally: detections rot. Thresholds drift as the estate changes and
      connectors silently stop emitting, so the standing detection- and
      data-engineering that maintains and re-tunes the library is the real cost
      and the precondition for the maturity claim holding over time. Book VI-08
      carries the validation harnesses that catch silent decay, which is why this
      book and that one are inseparable.

  # 9 -----------------------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "From a log warehouse to a detection engine the agency owns"
    layout: columns
    cards:
      - title: "Deploys Volume III"
        body: "The rule library is the deployable realization of the Volume III SIEM/XDR architecture — the rules the architecture argues an assessor must be able to exercise."
        accent: teal
        status: "Volume III"
      - title: "Feeds Book VI-04"
        body: "High-confidence firings trigger the SOAR playbooks that convert a detection into a bounded containment action."
        accent: navy
        status: "→ Book VI-04"
      - title: "Emits to VI-07"
        body: "Rule firings and incidents emit to the evidence contract; Book VI-08 tests detection efficacy and telemetry completeness."
        accent: amber
        status: "VI-07 / VI-08"
    callout:
      text: "A connected SIEM is the mechanism; a tuned, in-boundary rule library is the proof. Detection is where the boundary's constraint becomes an engineering discipline, not a lost capability."
      accent: navy
    notes: >
      Close on the through-line. Detection Engineering turns the Volume III
      log warehouse into an operating detection engine the agency owns entirely
      inside its own boundary — reconstructing the commercial ML signals as
      deterministic, reviewable, in-boundary analytics rather than surrendering
      the capability at the boundary. The library deploys the Volume III
      architecture, feeds the Book VI-04 response playbooks that convert a
      high-confidence firing into a bounded containment action, and emits its
      firings and incidents to the Book VI-07 evidence contract where Book VI-08
      tests detection efficacy and telemetry completeness. Leave the audience
      with the discipline: a connected SIEM is the mechanism, but a tuned,
      in-boundary rule library is the proof, and the standing operate-and-tune
      capability is what keeps the proof true over time. The boundary did not take
      the detection capability away — it turned it into an engineering discipline
      the agency now runs for itself. Keep scope at FedRAMP Moderate and remember
      every closure claim here is self-assessed pending SCA and PMO/AO review.
    vendor_sources: ["fedramp_20x", "nist_800_53"]
