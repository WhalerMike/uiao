# Deck spec — Vol V Book 02, FedAAN The Implementation Track.
# Distilled from docs/customer-documents/federal-aan-series/Vol_V_Book_02_FedAAN_Implementation_Track.qmd
# Schema: module docstring in src/uiao/generators/aan_deck.py
# Build:
#   uiao generate aan-deck \
#     --spec "docs/customer-documents/federal-aan-series/specs/Vol_V_Book_02.yaml" \
#     --out  "docs/customer-documents/federal-aan-series/Vol_V_Book_02_FedAAN_Implementation_Track.pptx" \
#     --date-code "2026-07-09 13:54 ET"
deck:
  title: "The Implementation Track"
  subtitle: "Build the Volumes I–IV architectures and land the evidence the compliance track scores"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOL V · BOOK 02"
  date_code: "2026-07-09 13:54 ET"
  journey:
    - "Build"
    - "Land evidence"
    - "Verify"
    - "Operate"
  sources:
    fedramp_20x: "https://www.fedramp.gov/20x/"
    ksi_mappings: "https://github.com/WhalerMike/uiao/tree/main/src/uiao/adapters/fedramp_aan_catalog/mappings"
    cisa_learning: "https://learning.cisa.gov/"

slides:
  # 1 -----------------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for the implementation track — the engineer's half of
      Volume V. Where Book 01 read the corpus from the assessor's chair, this
      book builds the Volumes I–IV architectures and lands the evidence Book 01's
      eight slots score. Walk the journey strip — Build, Land evidence, Verify,
      Operate — because it is the arc of every module. Keep FedRAMP scope at
      Moderate. Note the draft disclaimer and that closure claims are
      self-assessed pending SCA and PMO/AO review.

  # 2 -----------------------------------------------------------------------
  - type: content
    kicker: "THE RULE OF THE TRACK"
    title: "A module is done when it works AND the adapter can see it"
    layout: grid
    cards:
      - title: "Build the mechanism"
        body: "Stand up the architecture the Vol I–IV book specifies — the working half."
        accent: navy
      - title: "Land the evidence"
        body: "Place the artifact where a fedramp_aan_catalog slot mapping can bind it — the half most builds skip."
        accent: teal
      - title: "Verify the verdict"
        body: "Run uiao oscal ksi-ar and confirm the slot verdict is fed by your artifact."
        accent: amber
      - title: "Sequence by dependency"
        body: "Name/address → admit/identify → transport → data; detect, PAM, resilience parallel; authorize last."
        accent: red
    callout:
      text: "Building the control is half the work; producing the evidence the KSI reads is the other half — and it is the half most builds skip."
      accent: navy
    notes: >
      The track's one rule: a module is done when the thing works and the
      conformance adapter can see it. Every lab ends with an evidence artifact
      placed where a slot mapping binds it, and a uiao oscal ksi-ar run that shows
      the slot's verdict fed by that artifact. The four cards are the arc — build,
      land, verify, and respect the dependency sequence. The discipline to voice:
      most builds stop at "it works"; an authorizable build produces the evidence
      the KSI reads.

  # 3 -----------------------------------------------------------------------
  - type: table
    kicker: "EIGHT ENGINEERING MODULES"
    title: "Each module builds a cluster and lands specific slot evidence"
    headers: ["Module", "Builds", "Lands evidence in"]
    rows:
      - cells: ["B1 Landing zone / DDI", "Vol I Bk 01", "slot 2 (addressing)"]
        accent: navy
      - cells: ["B2 Access & identity", "Vol I Bk 02–04", "slot 1 (slot 5 pending)"]
      - cells: ["B3 Network / telecom", "Vol I Bk 05–07", "slot 3 (network)"]
      - cells: ["B4 Data platform", "Vol II Bk 01–03", "slot 1 (identity)"]
      - cells: ["B5 Privileged access", "Vol III Bk 01", "slots 1 + 5"]
      - cells: ["B6 Detect & protect", "Vol III Bk 02, 04–07", "slots 4 + 6"]
      - cells: ["B7 Resilience & governance", "Vol IV Bk 01–04", "slots 6 + 7"]
      - cells: ["B8 Authorize & operate", "Vol IV Bk 05–06", "slot 8; assembles all"]
        accent: teal
    callout:
      text: "B1→B2→B3→B4 is a real dependency chain; B5–B7 parallel after B2; B8 assembles what every module produced."
      accent: navy
    notes: >
      The eight modules, grouped by build cluster and read top to bottom as the
      system assembles. B1 is the DDI join key. B2 is the admission-and-identity
      floor — 802.1X monitor-mode-first, the certificate plane, and HR-driven
      provisioning. B3 builds application-aware transport and the customer-owned
      edge that closes the half of SC-7/SC-8 no CSP covers. B4 is data-platform
      identity. B5 is privileged access, break-glass first. B6 is the telemetry
      spine and the multi-cloud evidence fabric. B7 is resilience and governance
      with the SBOM pipeline. B8 authorizes and operates — and lands the training
      record that closes the slot Volume V both teaches and is.

  # 4 -----------------------------------------------------------------------
  - type: content
    kicker: "THE CAPSTONE"
    title: "One module, evidence-complete"
    layout: columns
    cards:
      - title: "Implement end-to-end"
        body: "Pick one module (B1–B8); build or lab-simulate it fully."
        accent: navy
        status: "B1–B8"
      - title: "Land and regenerate"
        body: "Place the artifact where the slot binds it, then uiao ksi evaluate + uiao oscal ksi-ar."
        accent: teal
        status: "ksi-ar.json"
      - title: "Your artifact, your verdict"
        body: "The Assessment Results must show your module's slot verdict fed by your artifact — same bar as the UIAO substrate's Operator track."
        accent: amber
        status: "Scored in Bk 03"
    callout:
      text: "Pair each B-module with its A-module — B1↔A2, B2↔A1/A5, B3↔A1/A3, B4↔A1, B5↔A1/A5, B6↔A4/A6, B7↔A6/A7, B8↔A8."
      accent: navy
    notes: >
      The capstone: pick one module, implement or lab-simulate it end-to-end,
      land the evidence where the slot mapping binds it, and regenerate the
      verdicts. Completion means the Assessment Results show your module's slot
      verdict fed by your own artifact — the same bar as the UIAO substrate's
      Operator track's clean walker/drift run, applied to the AAN vertical. The result is
      scored against Book 03's rubric ladder. Many teams pair each B-module with
      its A-module so the build and the evidence-trace are learned together.

  # 5 -----------------------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "Build it, land it — the work becomes its own evidence"
    layout: columns
    cards:
      - title: "Same sources as Book 01"
        body: "Builds the Vol I–IV architectures the compliance track reads."
        accent: teal
        status: "Vol I–IV"
      - title: "Labs in Book 04"
        body: "Fixture / trial-tenant / product-eval environments are stood up in Vol V Book 04."
        accent: navy
        status: "→ Vol V Bk 04"
      - title: "Scored in Book 03"
        body: "The artifacts every module produces are graded against the rubric ladder."
        accent: amber
        status: "→ Vol V Bk 03"
    callout:
      text: "A control is not closed until its evidence is bound where the KSI can read it — the discipline the rest of the series assumes but never states as a rule."
      accent: navy
    notes: >
      Close on the through-line. The implementation track builds the same
      Volumes I–IV sources the compliance track reads, and it exists to enforce
      one discipline the series assumes but never states as a rule: a control is
      not closed until its evidence is bound where the KSI can read it. The lab
      environments are stood up in Book 04; the artifacts are scored in Book 03.
      Build it and land it, and the training slot that Volume V both teaches and
      is closes on the evidence of the work itself.
    vendor_sources: ["fedramp_20x", "ksi_mappings", "cisa_learning"]
