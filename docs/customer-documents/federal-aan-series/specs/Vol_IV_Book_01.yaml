      accent: navy
    notes: >
      This slide extends the continuity architecture beyond the Microsoft estate and
      states the doctrine that keeps a multi-cloud agency coherent. A federal agency
      under FedRAMP Moderate rarely runs one cloud; it commonly runs Azure Government
      alongside AWS GovCloud, Oracle OCI, and on-premises VMware, and each platform
      ships its own native backup and disaster-recovery service. Microsoft workloads
      use Azure Backup and Azure Site Recovery, the default for the Azure estate under
      the Microsoft-preference doctrine. AWS GovCloud workloads use AWS Backup and AWS
      Elastic Disaster Recovery. Oracle workloads use OCI Full Stack Disaster Recovery.
      VMware workloads use Site Recovery Manager with vSphere Replication, and the
      recovery target may deliberately be Azure or AWS — a design choice made
      explicitly, not defaulted into. The doctrine to state plainly: DR actuation is
      platform-native, the same split the management-plane coordination doctrine draws
      for patching, and forcing every workload under one plane is neither required nor
      wise. What unifies the estate is the evidence contract, not the tooling: RTO and
      RPO test results, backup-success status, and replication-lag records from every
      platform normalize into the multi-cloud evidence fabric, so CP-9 and CP-10
      evidence is one correlated picture rather than five disconnected dashboards, and
      those metrics plus the CP-4 test records roll up through the fabric to CISA CDM
