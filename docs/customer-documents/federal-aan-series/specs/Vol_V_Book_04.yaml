# Deck spec — Vol V Book 04, FedAAN Vendor Training & Lab Environments.
# Distilled from docs/customer-documents/federal-aan-series/Vol_V_Book_04_FedAAN_Vendor_Training_Lab_Environments.qmd
# Schema: module docstring in src/uiao/generators/aan_deck.py
# Build:
#   uiao generate aan-deck \
#     --spec "docs/customer-documents/federal-aan-series/specs/Vol_V_Book_04.yaml" \
#     --out  "docs/customer-documents/federal-aan-series/Vol_V_Book_04_FedAAN_Vendor_Training_Lab_Environments.pptx" \
#     --date-code "2026-07-09 13:54 ET"
deck:
  title: "Vendor Training & Lab Environments"
  subtitle: "The realization layer — external courses per volume and scripted lab environments"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOL V · BOOK 04"
  date_code: "2026-07-09 13:54 ET"
  journey:
    - "Train"
    - "Provision"
    - "Bind"
    - "Verify"
  sources:
    fedramp_marketplace: "https://www.fedramp.gov/"
    ms_learn: "https://learn.microsoft.com/en-us/training/"
    cisa_learning: "https://learning.cisa.gov/"

slides:
  # 1 -----------------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for the realization layer of Volume V. The four preceding
      books teach the corpus and grade the learner; none teaches a product. This
      book supplies the two things a learner needs to acquire the skills —
      external vendor training mapped to the volume it supports, and scripted,
      disposable lab environments. It is the one place the volume names vendors,
      deliberately, per Theme F: one mechanism, N accredited products. Walk the
      journey strip — Train, Provision, Bind, Verify. Note the draft disclaimer
      and that vendor names imply no endorsement; verify accreditation at
      procurement time.

  # 2 -----------------------------------------------------------------------
  - type: content
    kicker: "MECHANISM, NOT PRODUCT"
    title: "Vendor-named by necessity — the doctrine stays clean elsewhere"
    layout: grid
    cards:
      - title: "Networking & DDI"
        body: "Cisco U / NetAcad, Infoblox, BlueCat, Juniper — for Vol I landing zone, NAC, transport, edge."
        accent: navy
      - title: "Identity & zero trust"
        body: "Microsoft SC-300/AZ-500, SailPoint, Fortinet, Palo Alto, Zscaler, Netskope — for Vol I identity and SASE."
        accent: teal
      - title: "Security operations"
        body: "SC-200, Splunk, Elastic, SANS, Tenable, Qualys — for Vol III detect & protect."
        accent: amber
      - title: "Federal & compliance"
        body: "CISA Learning, FedRAMP PMO, NIST NICE, OpenSSF, ISACA, IAPP — for Vol IV governance & assurance."
        accent: red
    callout:
      text: "A training catalog cannot function without vendor names, so this book names them — and confines the series' vendor surface to one book so Books 00–03 stay function-first."
      accent: navy
    notes: >
      This book is the realization layer. Theme F: every control is closed by a
      mechanism, and every mechanism ships inside a product carrying a federal
      accreditation. A training catalog cannot function without naming those
      products, so this book names them — courses, portals, eval licenses —
      mapped to the volume each supports, across four domains: networking and
      DDI, identity and zero trust, security operations, and federal and
      compliance. It assigns no organizational owner and recommends no
      procurement; and by confining vendor names to this one book, the doctrine
      of Books 00 through 03 stays function-first.

  # 3 -----------------------------------------------------------------------
  - type: table
    kicker: "LAB ENVIRONMENTS"
    title: "Disposable, tiered setups where the Track B builds are exercised"
    headers: ["Lab", "Module", "Tier"]
    rows:
      - cells: ["DDI (Vol I Bk 01)", "B1", "product-eval / fixture"]
        accent: navy
      - cells: ["Access & identity (Vol I Bk 02–04)", "B2", "trial-tenant / fixture"]
      - cells: ["PIM & privileged access (Vol III Bk 01)", "B5", "trial-tenant"]
      - cells: ["Sentinel detection (Vol III Bk 02/06)", "B6", "trial-tenant"]
      - cells: ["Purview data protection (Vol III Bk 05)", "B6", "trial-tenant"]
        accent: teal
    callout:
      text: "Never a production tenant · report-only first · break-glass before lockdown · teardown is part of the lab."
      accent: navy
    notes: >
      The lab environments, one row per Track B build that needs a tenant. Three
      tiers: fixture (nothing but the repo and Python, for the evidence-binding
      mechanics), trial-tenant (a disposable M365/Azure trial for the identity,
      PIM, Sentinel, and Purview labs), and product-eval (a vendor eval or
      containers for the DDI lab). B3, B7, and B8 have no tenant lab — they are
      document- and CI-shaped and run anywhere at fixture tier. Voice the four
      safety rules every lab starts from: never a production tenant, report-only
      first, break-glass before lockdown, and teardown is part of the lab.

  # 4 -----------------------------------------------------------------------
  - type: content
    kicker: "THE COMMON FINAL STEP"
    title: "Every lab ends by binding the evidence"
    layout: columns
    cards:
      - title: "Produce"
        body: "The build generates a concrete artifact — an inventory export, an audit trail, a fired-rule record, a JSON."
        accent: navy
        status: "Track B"
      - title: "Bind"
        body: "Place it where a fedramp_aan_catalog slot mapping references it, then uiao oscal ksi-ar."
        accent: teal
        status: "slot mapping"
      - title: "Score"
        body: "The Vol V Book 03 rubrics grade what you produced — level 3 needs a real verdict fed by your artifact."
        accent: amber
        status: "→ Vol V Bk 03"
    callout:
      text: "Cost discipline: E5 trial tenants cover P2/Purview/Defender; keep Sentinel ingestion free-tier; fixture tier needs no license."
      accent: navy
    notes: >
      Every lab ends the same way regardless of tier: produce the artifact, bind
      it where a slot mapping can reference it, and regenerate verdicts with uiao
      oscal ksi-ar. The Book 03 rubrics score what you produce, and level three
      requires a real verdict fed by your own artifact. Close on cost discipline —
      developer/trial tenants cover the P2, Purview, and Defender features for the
      trial window; keep Sentinel ingestion in the free-tier range with a single
      forwarder and seeded events; the fixture tier needs no license at all.

  # 5 -----------------------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "A concrete, buyable path to the skills — evidence at the end of each"
    layout: columns
    cards:
      - title: "Feeds Book 02"
        body: "The external product skill the implementation track points to."
        accent: teal
        status: "→ Vol V Bk 02"
      - title: "Scored in Book 03"
        body: "Lab artifacts are bound and graded against the rubric ladder."
        accent: navy
        status: "→ Vol V Bk 03"
      - title: "Living catalog"
        body: "Rows carry the volume they support; link-check re-verifies URLs; the research queue drives expansion."
        accent: amber
        status: "Expanding"
    callout:
      text: "Verify every vendor's FedRAMP / NIAP / STIG / FIPS / APL status on the Marketplace at procurement time — the catalog maps training, not authorizations."
      accent: navy
    notes: >
      Close on the through-line. This book gives the learner a concrete, buyable
      path to the product skills the implementation track needs, and every lab
      ends by producing the evidence the rubrics score. It feeds Book 02, is
      scored through Book 03, and stays a living catalog — rows carry the volume
      they support, link-check re-verifies the URLs, and the research queue drives
      the next expansion. Leave the audience with the procurement caveat: the
      catalog maps training, not authorizations — verify every vendor's FedRAMP or
      NIAP/STIG/FIPS/APL status on the Marketplace before buying.
    vendor_sources: ["fedramp_marketplace", "ms_learn", "cisa_learning"]
