      accent: navy
    notes: >
      This slide gives the audience the build-integrity ladder and where Agency sits on
      it. SLSA — Supply Chain Levels for Software Artifacts — is the NIST-endorsed
      framework for measuring how trustworthy a build process is, and it matters
      because the whole SBOM and VEX argument rests on an assumption that the component
      the pipeline scanned is the component actually deployed; provenance is what makes
      that assumption defensible. Level 1 requires only that a provenance document
      exists, which the GitHub Actions SBOM workflow produces automatically as a build
      attestation, so the agency clears it from day one. Level 2 requires a hosted
      build with signed provenance: because the workflows run on GitHub-hosted runners
      and the provenance is signed by an OIDC token, the estate meets Level 2, which is
      the current Agency target across all production release workflows. Level 3 requires
      a hardened build with two-party review — branch protection plus required
      reviewers on the release workflow so no single person can push a release
      unreviewed — and that is the explicit goal before the authorization deadline. The
      progression is the point: SLSA is not a checkbox but a maturity path, and stating
      the current level honestly (Level 2, moving to Level 3) is more credible to an
      assessor than claiming a level the evidence does not yet support. Level 2
      provenance is also what backs the SR-10 and SR-11 closures and the KSI-012
      immutable-redeployment assertion.
