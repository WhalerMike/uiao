<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#EFF1F4"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#B8C0CC" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="50" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="34" fill="#0D1B2E">ZTMM Maturity Lift From the In-Boundary Rebuild</text>
  <text x="640" y="84" text-anchor="middle" font-size="18" fill="#6B7A8D">Most pillars rise Initial &#8594; Advanced; Optimal stays out of reach without MAS 2026 or irreducible agency equivalence</text>

  <!-- tier gridlines -->
  <line x1="150" y1="250" x2="1190" y2="250" stroke="#E3E8EF" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="150" y1="400" x2="1190" y2="400" stroke="#E3E8EF" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="150" y1="560" x2="1190" y2="560" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="140" y="255" text-anchor="end" font-size="15" font-weight="bold" fill="#6B7A8D">Optimal</text>
  <text x="140" y="405" text-anchor="end" font-size="15" font-weight="bold" fill="#155E5E">Advanced</text>
  <text x="140" y="565" text-anchor="end" font-size="15" font-weight="bold" fill="#0D1B2E">Initial</text>

  <!-- bars: 7 pillars. group centers 204,353,501,650,798,947,1095. bar width 84 (x=center-42) -->
  <!-- Optimal cap (hatched) y 250..400 ; Advanced (teal) y 400..560 ; Initial (navy) baseline 560..600 small base on axis -->
  <g>
    <!-- Identity -->
    <rect x="162" y="400" width="84" height="160" fill="#1E8C8C"/>
    <rect x="162" y="250" width="84" height="150" fill="url(#hatch)" stroke="#B8C0CC" stroke-width="1"/>
    <rect x="162" y="556" width="84" height="8" fill="#0D1B2E"/>
    <!-- Devices -->
    <rect x="311" y="400" width="84" height="160" fill="#1E8C8C"/>
    <rect x="311" y="250" width="84" height="150" fill="url(#hatch)" stroke="#B8C0CC" stroke-width="1"/>
    <rect x="311" y="556" width="84" height="8" fill="#0D1B2E"/>
    <!-- Networks -->
    <rect x="459" y="400" width="84" height="160" fill="#1E8C8C"/>
    <rect x="459" y="250" width="84" height="150" fill="url(#hatch)" stroke="#B8C0CC" stroke-width="1"/>
    <rect x="459" y="556" width="84" height="8" fill="#0D1B2E"/>
    <!-- Apps -->
    <rect x="608" y="400" width="84" height="160" fill="#1E8C8C"/>
    <rect x="608" y="250" width="84" height="150" fill="url(#hatch)" stroke="#B8C0CC" stroke-width="1"/>
    <rect x="608" y="556" width="84" height="8" fill="#0D1B2E"/>
    <!-- Data -->
    <rect x="756" y="400" width="84" height="160" fill="#1E8C8C"/>
    <rect x="756" y="250" width="84" height="150" fill="url(#hatch)" stroke="#B8C0CC" stroke-width="1"/>
    <rect x="756" y="556" width="84" height="8" fill="#0D1B2E"/>
    <!-- Visibility -->
    <rect x="905" y="400" width="84" height="160" fill="#1E8C8C"/>
    <rect x="905" y="250" width="84" height="150" fill="url(#hatch)" stroke="#B8C0CC" stroke-width="1"/>
    <rect x="905" y="556" width="84" height="8" fill="#0D1B2E"/>
    <!-- Automation -->
    <rect x="1053" y="400" width="84" height="160" fill="#1E8C8C"/>
    <rect x="1053" y="250" width="84" height="150" fill="url(#hatch)" stroke="#B8C0CC" stroke-width="1"/>
    <rect x="1053" y="556" width="84" height="8" fill="#0D1B2E"/>
  </g>

  <!-- "needs MAS 2026" label on the hatched caps -->
  <text x="640" y="332" text-anchor="middle" font-size="16" font-weight="bold" fill="#6B7A8D">Optimal tier &#8212; requires MAS 2026 (not reachable by the rebuild)</text>

  <!-- pillar labels -->
  <g font-size="14" fill="#33414F" text-anchor="middle">
    <text x="204" y="588">Identity</text>
    <text x="353" y="588">Devices</text>
    <text x="501" y="588">Networks</text>
    <text x="501" y="606" font-size="12" fill="#6B7A8D">(ADR-057)</text>
    <text x="650" y="588">Apps &amp;</text><text x="650" y="606">Workloads</text>
    <text x="798" y="588">Data</text>
    <text x="947" y="588">Visibility &amp;</text><text x="947" y="606">Analytics</text>
    <text x="1095" y="588">Automation &amp;</text><text x="1095" y="606">Orchestration</text>
  </g>

  <!-- legend -->
  <rect x="300" y="640" width="22" height="22" fill="#0D1B2E"/>
  <text x="330" y="657" font-size="15" fill="#33414F">Initial (baseline, no agency analytics)</text>
  <rect x="640" y="640" width="22" height="22" fill="#1E8C8C"/>
  <text x="670" y="657" font-size="15" fill="#33414F">Advanced (with this rebuild)</text>
  <rect x="930" y="640" width="22" height="22" fill="url(#hatch)" stroke="#B8C0CC" stroke-width="1"/>
  <text x="960" y="657" font-size="15" fill="#33414F">Optimal (needs MAS 2026)</text>
</svg>
