<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrTeal" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
    <marker id="arrRed" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="58" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="36" fill="#0D1B2E">The In-Boundary Principle</text>
  <text x="640" y="94" text-anchor="middle" font-size="19" fill="#6B7A8D">Same data, different destination &#8212; the constraint is the boundary the data crosses, not the data itself</text>

  <!-- Authorization boundary -->
  <rect x="64" y="138" width="772" height="486" rx="16" fill="#F7FAFE" stroke="#0D1B2E" stroke-width="2.5"/>
  <text x="88" y="172" font-size="18" font-weight="bold" fill="#0D1B2E">Agency FedRAMP-Moderate Authorization Boundary</text>

  <!-- Raw telemetry -->
  <rect x="110" y="208" width="320" height="158" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="270" y="242" text-anchor="middle" font-size="19" font-weight="bold" fill="#0D1B2E">Raw M365 / Entra telemetry</text>
  <text x="270" y="276" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#5A5A5A">SigninLogs &#183; AuditLogs</text>
  <text x="270" y="300" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#5A5A5A">device &#183; compliance &#183; DLP events</text>
  <text x="270" y="324" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#5A5A5A">MailItemsAccessed &#183; search</text>
  <text x="270" y="350" text-anchor="middle" font-size="14" fill="#6B7A8D">collected in-boundary</text>

  <!-- Agency SIEM -->
  <rect x="110" y="438" width="320" height="158" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2.5"/>
  <text x="270" y="476" text-anchor="middle" font-size="18" font-weight="bold" fill="#155E5E">Agency in-boundary SIEM + analytics</text>
  <text x="270" y="506" text-anchor="middle" font-size="15" fill="#33414F">Sentinel &#183; Log Analytics &#183; in-boundary ML</text>
  <text x="270" y="530" text-anchor="middle" font-size="15" fill="#33414F">the L1&#8211;L5 rebuild stack</text>
  <text x="270" y="566" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E8C8C">&#10003; IN SCOPE</text>

  <!-- Rebuild arrow -->
  <line x1="270" y1="366" x2="270" y2="432" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#arrTeal)"/>
  <text x="300" y="396" font-size="16" font-weight="bold" fill="#1E8C8C">REBUILD FLOW</text>
  <text x="300" y="416" font-size="13" fill="#6B7A8D">authorized in-boundary monitoring (SI-4)</text>

  <!-- Commercial ML outside -->
  <rect x="940" y="298" width="288" height="166" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2.5"/>
  <text x="1084" y="338" text-anchor="middle" font-size="18" font-weight="bold" fill="#8E2A20">Microsoft commercial</text>
  <text x="1084" y="364" text-anchor="middle" font-size="18" font-weight="bold" fill="#8E2A20">multi-tenant ML / analytics</text>
  <text x="1084" y="398" text-anchor="middle" font-size="14" fill="#5A5A5A">Identity Protection ML &#183; INR</text>
  <text x="1084" y="420" text-anchor="middle" font-size="14" fill="#5A5A5A">Adoption Score &#183; behavioral DLP</text>
  <text x="1084" y="450" text-anchor="middle" font-size="17" font-weight="bold" fill="#C0392B">&#10007; OUT OF SCOPE</text>

  <!-- Blocked arrow crossing boundary -->
  <line x1="430" y1="262" x2="940" y2="350" stroke="#C0392B" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrRed)"/>
  <text x="690" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0392B">BLOCKED FLOW</text>
  <text x="690" y="253" text-anchor="middle" font-size="13" fill="#8E2A20">off-boundary export &#8212; SC-7 / SI-4 / AU</text>
  <!-- strike circle at crossing -->
  <circle cx="836" cy="335" r="17" fill="#FFFFFF" stroke="#C0392B" stroke-width="3"/>
  <line x1="825" y1="324" x2="847" y2="346" stroke="#C0392B" stroke-width="3"/>
  <line x1="847" y1="324" x2="825" y2="346" stroke="#C0392B" stroke-width="3"/>

  <text x="640" y="668" text-anchor="middle" font-size="16" fill="#33414F">Exporting raw telemetry off-boundary to commercial ML is the blocked flow. Routing the <tspan font-weight="bold">same</tspan> telemetry to the</text>
  <text x="640" y="692" text-anchor="middle" font-size="16" fill="#33414F">agency&#8217;s own in-boundary analytics is an authorized flow &#8212; that is what makes the rebuild lawful.</text>
</svg>
