<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" font-family="Segoe UI,Arial,sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#595959"/></marker></defs>
<rect width="900" height="480" fill="#F2F2F2"/>
<rect x="0" y="0" width="900" height="50" fill="#1F3864"/>
<text x="450" y="33" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="bold">Managed Identity — Zero-Credential Secret Access Pattern</text>
<rect x="70" y="190" width="130" height="120" fill="#2E75B6" rx="6"/>
<text x="135" y="208" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">APPLICATION</text>
<text x="135" y="222" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">RUNTIME</text>
<text x="135" y="242" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Azure VM / Function App</text>
<text x="135" y="255" text-anchor="middle" fill="#FFFFFF" font-size="8.5">AKS Pod / App Service</text>
<text x="135" y="268" text-anchor="middle" fill="#FFFFFF" font-size="8.5">System- or User-Assigned MI</text>
<circle cx="135" cy="175" r="14" fill="#C00000"/>
<text x="135" y="180" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">1</text>
<line x1="202" y1="250" x2="258" y2="250" stroke="#595959" stroke-width="2" marker-end="url(#arr)"/>
<rect x="260" y="190" width="130" height="120" fill="#1F7391" rx="6"/>
<text x="325" y="208" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">IMDS ENDPOINT</text>
<text x="325" y="242" text-anchor="middle" fill="#FFFFFF" font-size="8.5">169.254.169.254</text>
<text x="325" y="255" text-anchor="middle" fill="#FFFFFF" font-size="8.5">/metadata/identity</text>
<text x="325" y="268" text-anchor="middle" fill="#FFFFFF" font-size="8.5">/oauth2/token</text>
<text x="325" y="281" text-anchor="middle" fill="#FFFFFF" font-size="8.5">(Azure fabric only)</text>
<circle cx="325" cy="175" r="14" fill="#C00000"/>
<text x="325" y="180" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">2</text>
<line x1="392" y1="250" x2="448" y2="250" stroke="#595959" stroke-width="2" marker-end="url(#arr)"/>
<rect x="450" y="190" width="130" height="120" fill="#1F3864" rx="6"/>
<text x="515" y="208" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">ENTRA ID</text>
<text x="515" y="242" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Validates Managed Identity</text>
<text x="515" y="255" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Issues bearer token</text>
<text x="515" y="268" text-anchor="middle" fill="#FFFFFF" font-size="8.5">TTL: 60 minutes</text>
<text x="515" y="281" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Scoped to vault.azure.net</text>
<circle cx="515" cy="175" r="14" fill="#C00000"/>
<text x="515" y="180" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">3</text>
<line x1="582" y1="250" x2="638" y2="250" stroke="#595959" stroke-width="2" marker-end="url(#arr)"/>
<rect x="640" y="190" width="130" height="120" fill="#375623" rx="6"/>
<text x="705" y="208" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">KEY VAULT</text>
<text x="705" y="242" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Validates bearer token</text>
<text x="705" y="255" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Checks RBAC assignment</text>
<text x="705" y="268" text-anchor="middle" fill="#FFFFFF" font-size="8.5">(Secrets User role)</text>
<text x="705" y="281" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Returns secret value</text>
<circle cx="705" cy="175" r="14" fill="#C00000"/>
<text x="705" y="180" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">4</text>
<line x1="772" y1="250" x2="828" y2="250" stroke="#595959" stroke-width="2" marker-end="url(#arr)"/>
<rect x="830" y="190" width="130" height="120" fill="#C55A11" rx="6"/>
<text x="895" y="208" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">APPLICATION</text>
<text x="895" y="222" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">USES SECRET</text>
<text x="895" y="242" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Value held in memory</text>
<text x="895" y="255" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Never written to disk</text>
<text x="895" y="268" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Never logged</text>
<text x="895" y="281" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Connection pool uses value</text>
<circle cx="895" cy="175" r="14" fill="#C00000"/>
<text x="895" y="180" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">5</text>
<rect x="40" y="340" width="820" height="60" fill="#FFFFFF" stroke="#375623" stroke-width="2" rx="6"/>
<text x="450" y="362" text-anchor="middle" fill="#375623" font-size="11" font-weight="bold">NO CREDENTIAL STORED ANYWHERE IN THE APPLICATION</text>
<text x="100" y="382" text-anchor="middle" fill="#595959" font-size="9">✓ No secret in source code</text>
<text x="295" y="382" text-anchor="middle" fill="#595959" font-size="9">✓ No secret in config file</text>
<text x="490" y="382" text-anchor="middle" fill="#595959" font-size="9">✓ No secret in environment variable</text>
<text x="685" y="382" text-anchor="middle" fill="#595959" font-size="9">✓ No secret in pipeline</text>
<rect x="40" y="415" width="820" height="30" fill="#1F3864" rx="4"/>
<text x="450" y="435" text-anchor="middle" fill="#FFFFFF" font-size="10">Satisfies IA-5(7): No embedded authenticators · IMDS token is Azure-fabric-only, not reusable outside the compute boundary</text>
</svg>
