<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="mGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5A5A5A"/></marker>
    <marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1E8C8C"/></marker>
    <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E75B6"/></marker>
  </defs>

  <text x="640" y="44" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#0D1B2E">RADIUS Architecture — NPS High Availability with Entra Integration</text>
  <text x="640" y="74" text-anchor="middle" font-size="17" fill="#6B7A8D">Active-passive NPS pair · certificate validation · compliance posture · SCEP issuance · Sentinel accounting</text>

  <!-- Authenticators group -->
  <rect x="45" y="120" width="300" height="360" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="2"/>
  <text x="195" y="152" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#0D1B2E">Authenticators</text>

  <rect x="70" y="172" width="250" height="76" rx="8" fill="#1E3A66"/>
  <text x="195" y="203" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Access Switches</text>
  <text x="195" y="228" text-anchor="middle" font-size="15" fill="#EAF1FB">wired 802.1X ports</text>

  <rect x="70" y="272" width="250" height="76" rx="8" fill="#1E3A66"/>
  <text x="195" y="303" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Wireless APs / WLC</text>
  <text x="195" y="328" text-anchor="middle" font-size="15" fill="#EAF1FB">WPA3-Enterprise SSID</text>

  <text x="195" y="392" text-anchor="middle" font-size="15" fill="#5A5A5A">Every switch and WAP:</text>
  <text x="195" y="414" text-anchor="middle" font-size="15" fill="#5A5A5A">primary NPS = first RADIUS target,</text>
  <text x="195" y="436" text-anchor="middle" font-size="15" fill="#5A5A5A">secondary on 3-second failover</text>

  <!-- Managed endpoints -->
  <rect x="45" y="540" width="300" height="92" rx="8" fill="#0D1B2E"/>
  <text x="195" y="572" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Managed Endpoints</text>
  <text x="195" y="596" text-anchor="middle" font-size="15" fill="#EAF1FB">802.1X supplicant +</text>
  <text x="195" y="616" text-anchor="middle" font-size="15" fill="#EAF1FB">TPM-bound machine certificate</text>

  <line x1="195" y1="536" x2="195" y2="484" stroke="#5A5A5A" stroke-width="2" marker-end="url(#mGrey)"/>
  <text x="206" y="516" font-size="15" fill="#5A5A5A">EAPOL</text>

  <!-- NPS group -->
  <rect x="470" y="120" width="310" height="360" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="2"/>
  <text x="625" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#0D1B2E">RADIUS — NPS Pair</text>
  <text x="625" y="172" text-anchor="middle" font-size="14" fill="#6B7A8D">Windows Server 2025</text>

  <rect x="495" y="190" width="260" height="90" rx="8" fill="#0D1B2E"/>
  <text x="625" y="228" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">NPS Primary</text>
  <text x="625" y="254" text-anchor="middle" font-size="15" fill="#EAF1FB">active</text>

  <rect x="495" y="330" width="260" height="90" rx="8" fill="#1E3A66"/>
  <text x="625" y="368" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">NPS Secondary</text>
  <text x="625" y="394" text-anchor="middle" font-size="15" fill="#EAF1FB">passive — failover</text>

  <line x1="560" y1="280" x2="560" y2="330" stroke="#6B7A8D" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="572" y="310" font-size="14" fill="#6B7A8D">config export / import sync</text>

  <!-- Authenticator to NPS arrows -->
  <line x1="345" y1="210" x2="491" y2="228" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#mTeal)"/>
  <text x="418" y="200" text-anchor="middle" font-size="15" fill="#1E8C8C">RADIUS — first target</text>
  <line x1="345" y1="330" x2="491" y2="378" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#mGrey)"/>
  <text x="350" y="316" font-size="15" fill="#5A5A5A">failover — 3 s timeout</text>

  <!-- Right column -->
  <rect x="950" y="130" width="270" height="84" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1085" y="160" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Active Directory</text>
  <text x="1085" y="184" text-anchor="middle" font-size="15" fill="#33414F">machine certificate</text>
  <text x="1085" y="204" text-anchor="middle" font-size="15" fill="#33414F">validation</text>

  <rect x="950" y="246" width="270" height="84" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1085" y="276" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Intune Compliance API</text>
  <text x="1085" y="300" text-anchor="middle" font-size="15" fill="#33414F">real-time device posture</text>
  <text x="1085" y="320" text-anchor="middle" font-size="15" fill="#33414F">via Microsoft Graph</text>

  <rect x="950" y="362" width="270" height="96" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1085" y="390" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Entra ID</text>
  <text x="1085" y="412" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Certificate Authority</text>
  <text x="1085" y="438" text-anchor="middle" font-size="15" fill="#33414F">issues device certificates</text>

  <!-- NPS to directory / compliance -->
  <line x1="759" y1="216" x2="946" y2="180" stroke="#1E8C8C" stroke-width="2" marker-end="url(#mTeal)"/>
  <line x1="759" y1="252" x2="946" y2="286" stroke="#1E8C8C" stroke-width="2" marker-end="url(#mTeal)"/>

  <!-- SCEP issuance to endpoints -->
  <polyline points="1085,458 1085,505 280,505 280,534" fill="none" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#mTeal)"/>
  <text x="430" y="496" text-anchor="middle" font-size="15" fill="#1E8C8C">device certificates via SCEP at Intune enrollment</text>

  <!-- Sentinel / Log Analytics -->
  <rect x="470" y="580" width="770" height="80" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="855" y="613" text-anchor="middle" font-size="19" font-weight="bold" fill="#0D1B2E">Log Analytics Workspace — Microsoft Sentinel</text>
  <text x="855" y="640" text-anchor="middle" font-size="15" fill="#33414F">RADIUS accounting: Start · Interim-Update · Stop</text>

  <line x1="700" y1="484" x2="700" y2="576" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#mBlue)"/>
  <text x="712" y="535" font-size="15" fill="#2E75B6">RADIUS accounting records</text>
</svg>
