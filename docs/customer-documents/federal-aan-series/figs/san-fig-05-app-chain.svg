<svg viewBox="0 0 1040 415" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="415" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs><text x="520" y="28" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">Application Chain Migration — Four Authentication Classes</text><text x="520" y="46" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">Assign each application a class and migrate in preference order — Class 3 is the goal</text><rect x="10" y="68" width="220" height="230" rx="8" fill="#2E75B6"/><text x="120" y="92" text-anchor="middle" font-size="14" font-weight="bold" font-style="normal" fill="#FFFFFF">Class 3</text><text x="120" y="110" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">OIDC / Token</text><rect x="65" y="118" width="110" height="22" rx="4" fill="#FFFFFF"/><text x="120" y="133" text-anchor="middle" font-size="9" font-weight="bold" font-style="normal" fill="#2E75B6">Preferred</text><text x="120" y="160" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">DefaultAzureCredential chain</text><text x="120" y="176" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Entra as primary IdP</text><text x="120" y="192" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">GCC audience token</text><text x="120" y="208" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">No stored credential</text><rect x="250" y="68" width="220" height="230" rx="8" fill="#C55A11"/><text x="360" y="92" text-anchor="middle" font-size="14" font-weight="bold" font-style="normal" fill="#FFFFFF">Class 2</text><text x="360" y="110" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">SAML Federation</text><rect x="305" y="118" width="110" height="22" rx="4" fill="#FFFFFF"/><text x="360" y="133" text-anchor="middle" font-size="9" font-weight="bold" font-style="normal" fill="#C55A11">Acceptable</text><text x="360" y="160" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Entra as SAML IdP</text><text x="360" y="176" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">App stays SAML-aware</text><text x="360" y="192" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Federated into tenant</text><text x="360" y="208" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Reduced credential exposure</text><rect x="490" y="68" width="220" height="230" rx="8" fill="#1F3864"/><text x="600" y="92" text-anchor="middle" font-size="14" font-weight="bold" font-style="normal" fill="#FFFFFF">Class 1</text><text x="600" y="110" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">App Proxy</text><rect x="545" y="118" width="110" height="22" rx="4" fill="#FFFFFF"/><text x="600" y="133" text-anchor="middle" font-size="9" font-weight="bold" font-style="normal" fill="#1F3864">Constrained</text><text x="600" y="160" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Cannot modernize auth directly</text><text x="600" y="176" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Proxy provides Entra front-end</text><text x="600" y="192" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Internal app auth unchanged</text><text x="600" y="208" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Temporary posture</text><rect x="730" y="68" width="220" height="230" rx="8" fill="#C00000"/><text x="840" y="92" text-anchor="middle" font-size="14" font-weight="bold" font-style="normal" fill="#FFFFFF">Class 4</text><text x="840" y="110" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Domain Services</text><rect x="785" y="118" width="110" height="22" rx="4" fill="#FFFFFF"/><text x="840" y="133" text-anchor="middle" font-size="9" font-weight="bold" font-style="normal" fill="#C00000">Last resort</text><text x="840" y="160" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Preserves AD dependency</text><text x="840" y="176" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Blocks Entra-only host</text><text x="840" y="192" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Avoid for new workloads</text><text x="840" y="208" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Plan migration path</text><rect x="60" y="314" width="880" height="84" rx="6" fill="#EBF3FB" stroke="#2E75B6" stroke-width="1"/><text x="500" y="334" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#1F3864">Connection String Transformation — Class 3 OIDC Path</text><text x="120" y="352" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#C00000">BEFORE:</text><text x="200" y="352" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Server=sql01;Database=AppDB;Integrated Security=SSPI</text><text x="120" y="370" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#375623">AFTER:</text><text x="200" y="370" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Server=sql01.database.usgovcloudapi.net;Authentication=Active Directory Default</text><text x="120" y="388" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#2E75B6">IDENTITY:</text><text x="200" y="388" text-anchor="start" font-size="10" font-weight="normal" font-style="italic" fill="#2E75B6">Managed Identity — no stored credential, no rotation required</text></svg>
