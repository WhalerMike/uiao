<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1A9E8F"/></marker>
  </defs>

  <text x="800" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#1F3A5F">Control Attestation, Evidence &amp; KSI (Vol VII Book 04)</text>
  <text x="800" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5A6B7B">From actioned task stream to assessed control — the OSCAL / KSI feed into the authorization package</text>
  <rect x="49" y="210" width="270" height="300" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M59,210 h250 a10,10 0 0 1 10,10 v78 h-270 v-78 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="184.0" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 1</text>
  <text x="184.0" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="184.0" dy="0.0">Map</tspan>
  </text>
  <text x="184.0" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#2A2A2A">
  <tspan x="184.0" dy="0.0">Control to the</tspan>
  <tspan x="184.0" dy="23.4">M365/Azure tests that</tspan>
  <tspan x="184.0" dy="23.4">evidence it — the spine</tspan>
  <tspan x="184.0" dy="23.4">binding (IRM control</tspan>
  <tspan x="184.0" dy="23.4">map)</tspan>
  </text>
  <line x1="319" y1="360.0" x2="357" y2="360.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <rect x="357" y="210" width="270" height="300" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M367,210 h250 a10,10 0 0 1 10,10 v78 h-270 v-78 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="492.0" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 2</text>
  <text x="492.0" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="492.0" dy="0.0">Test</tspan>
  </text>
  <text x="492.0" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#2A2A2A">
  <tspan x="492.0" dy="0.0">Scheduled control test</tspan>
  <tspan x="492.0" dy="23.4">reads the actioned</tspan>
  <tspan x="492.0" dy="23.4">posture roll-up — pass /</tspan>
  <tspan x="492.0" dy="23.4">fail / partial, evidence</tspan>
  <tspan x="492.0" dy="23.4">attached</tspan>
  </text>
  <line x1="627" y1="360.0" x2="665" y2="360.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <rect x="665" y="210" width="270" height="300" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M675,210 h250 a10,10 0 0 1 10,10 v78 h-270 v-78 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="800.0" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 3</text>
  <text x="800.0" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="800.0" dy="0.0">Gap → POA&amp;M</tspan>
  </text>
  <text x="800.0" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#2A2A2A">
  <tspan x="800.0" dy="0.0">Any fail or partial</tspan>
  <tspan x="800.0" dy="23.4">becomes an owned POA&amp;M</tspan>
  <tspan x="800.0" dy="23.4">item: milestone, owner,</tspan>
  <tspan x="800.0" dy="23.4">closure evidence (CA-5)</tspan>
  </text>
  <line x1="935" y1="360.0" x2="973" y2="360.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <rect x="973" y="210" width="270" height="300" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M983,210 h250 a10,10 0 0 1 10,10 v78 h-270 v-78 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="1108.0" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 4</text>
  <text x="1108.0" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="1108.0" dy="0.0">Emit</tspan>
  </text>
  <text x="1108.0" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#2A2A2A">
  <tspan x="1108.0" dy="0.0">OSCAL assessment-results</tspan>
  <tspan x="1108.0" dy="23.4">+ FedRAMP 20x KSI</tspan>
  <tspan x="1108.0" dy="23.4">evidence, per the</tspan>
  <tspan x="1108.0" dy="23.4">spine's KSI bindings</tspan>
  </text>
  <line x1="1243" y1="360.0" x2="1281" y2="360.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <rect x="1281" y="210" width="270" height="300" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M1291,210 h250 a10,10 0 0 1 10,10 v78 h-270 v-78 a10,10 0 0 1 10,-10 z" fill="#1A9E8F"/>
  <text x="1416.0" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">DESTINATION</text>
  <text x="1416.0" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="1416.0" dy="0.0">Authorization</tspan>
  <tspan x="1416.0" dy="23.1">Package</tspan>
  </text>
  <text x="1416.0" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#2A2A2A">
  <tspan x="1416.0" dy="0.0">Vol IV Book 06</tspan>
  <tspan x="1416.0" dy="23.4">(Authorization Package &amp;</tspan>
  <tspan x="1416.0" dy="23.4">ConMon) and Vol VI Book</tspan>
  <tspan x="1416.0" dy="23.4">07 (Evidence &amp; ConMon</tspan>
  <tspan x="1416.0" dy="23.4">Pipeline)</tspan>
  </text>
  <text x="800" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5A6B7B">The compliance spine (aan-compliance-spine.yml) is the SSOT for the control-to-evidence binding; the IRM control map is a projection of it.</text>
    <rect x="49" y="828" width="1502" height="54" rx="8" fill="#F4F7FA" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="800" y="861" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1F3A5F">Scope: FedRAMP Moderate &amp; Microsoft GCC Moderate. A passing control is backed by an owned, evidenced trail — CA-2 as a standing indicator, not an annual event.</text>
</svg>
