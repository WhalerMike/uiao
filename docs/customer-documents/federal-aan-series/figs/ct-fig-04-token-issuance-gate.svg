<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrTeal" markerWidth="9" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#C0392B"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="640" y="42" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Token Issuance as the Policy Gate</text>
  <text x="640" y="72" font-family="Arial, sans-serif" font-size="17" fill="#6B7A8D" text-anchor="middle">Phishing-resistant credential in — signed, path-independent assertion out</text>

  <!-- ===== Left: user credential ===== -->
  <rect x="40" y="120" width="260" height="160" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="170" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="middle">User</text>
  <rect x="60" y="164" width="220" height="38" rx="5" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="170" y="189" font-family="Arial, sans-serif" font-size="17" fill="#0D1B2E" text-anchor="middle">PIV smart card</text>
  <rect x="60" y="210" width="220" height="38" rx="5" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="170" y="235" font-family="Arial, sans-serif" font-size="17" fill="#0D1B2E" text-anchor="middle">FIDO2 authenticator</text>
  <text x="170" y="268" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#1E8C8C" text-anchor="middle">phishing-resistant</text>

  <!-- ===== Left: device credential ===== -->
  <rect x="40" y="310" width="260" height="120" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="170" y="340" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Device</text>
  <rect x="60" y="354" width="220" height="38" rx="5" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="170" y="379" font-family="Arial, sans-serif" font-size="17" fill="#0D1B2E" text-anchor="middle">machine certificate</text>
  <text x="170" y="418" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D" text-anchor="middle">(Vol I Book 02 device identity)</text>

  <line x1="300" y1="200" x2="442" y2="240" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrTeal)"/>
  <line x1="300" y1="370" x2="442" y2="330" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrTeal)"/>

  <!-- ===== Center: identity provider ===== -->
  <rect x="450" y="140" width="330" height="330" rx="10" fill="#0D1B2E"/>
  <text x="615" y="176" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Identity Provider</text>
  <text x="615" y="202" font-family="Arial, sans-serif" font-size="17" fill="#EAF1FB" text-anchor="middle">token issuance = policy decision</text>
  <line x1="478" y1="218" x2="752" y2="218" stroke="#1E3A66" stroke-width="2"/>

  <path d="M480,242 l8,9 l15,-18" fill="none" stroke="#1E8C8C" stroke-width="4"/>
  <text x="514" y="248" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">credential strength:</text>
  <text x="514" y="270" font-family="Arial, sans-serif" font-size="16" fill="#D7F2EE">phishing-resistant</text>
  <path d="M480,300 l8,9 l15,-18" fill="none" stroke="#1E8C8C" stroke-width="4"/>
  <text x="514" y="306" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">device: compliant</text>
  <path d="M480,340 l8,9 l15,-18" fill="none" stroke="#1E8C8C" stroke-width="4"/>
  <text x="514" y="346" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">location: plausible</text>
  <path d="M480,380 l8,9 l15,-18" fill="none" stroke="#1E8C8C" stroke-width="4"/>
  <text x="514" y="386" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">session risk: low</text>

  <text x="615" y="442" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#EAF1FB" text-anchor="middle">evaluated before signing</text>

  <!-- policy gate line + rejected branch -->
  <line x1="450" y1="470" x2="450" y2="660" stroke="#0D1B2E" stroke-width="2.5" stroke-dasharray="7,6"/>
  <text x="462" y="660" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A">policy gate</text>

  <rect x="40" y="540" width="260" height="112" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="170" y="572" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#33414F" text-anchor="middle">Password + SMS</text>
  <text x="170" y="598" font-family="Arial, sans-serif" font-size="17" fill="#33414F" text-anchor="middle">one-time passcode</text>
  <text x="170" y="628" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#C0392B" text-anchor="middle">shared secret — relayable</text>

  <line x1="300" y1="596" x2="436" y2="596" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line x1="438" y1="582" x2="462" y2="610" stroke="#C0392B" stroke-width="5"/>
  <line x1="462" y1="582" x2="438" y2="610" stroke="#C0392B" stroke-width="5"/>
  <text x="480" y="590" font-family="Arial, sans-serif" font-size="17" fill="#C0392B">refused at the gate —</text>
  <text x="480" y="613" font-family="Arial, sans-serif" font-size="17" fill="#C0392B">not phishing-resistant per OMB M-22-09</text>

  <!-- IdP -> JWT -->
  <line x1="780" y1="300" x2="827" y2="300" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>
  <text x="804" y="286" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A" text-anchor="middle">signs</text>

  <!-- ===== Signed JWT as sealed envelope ===== -->
  <rect x="835" y="190" width="220" height="230" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2.5"/>
  <path d="M835,190 L945,232 L1055,190" fill="none" stroke="#0D1B2E" stroke-width="2.5"/>
  <text x="945" y="262" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Signed JWT</text>
  <circle cx="862" cy="285" r="4" fill="#1E8C8C"/>
  <text x="876" y="291" font-family="Consolas, monospace" font-size="16" fill="#33414F">subject</text>
  <circle cx="862" cy="311" r="4" fill="#1E8C8C"/>
  <text x="876" y="317" font-family="Consolas, monospace" font-size="16" fill="#33414F">device</text>
  <circle cx="862" cy="337" r="4" fill="#1E8C8C"/>
  <text x="876" y="343" font-family="Consolas, monospace" font-size="16" fill="#33414F">authorizations</text>
  <circle cx="862" cy="363" r="4" fill="#1E8C8C"/>
  <text x="876" y="369" font-family="Consolas, monospace" font-size="16" fill="#33414F">expiry</text>
  <circle cx="862" cy="389" r="4" fill="#1E8C8C"/>
  <text x="876" y="395" font-family="Consolas, monospace" font-size="16" fill="#33414F">signature</text>

  <!-- ===== Relying services ===== -->
  <rect x="1080" y="110" width="180" height="140" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1170" y="140" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Service A</text>
  <path d="M1098,162 l8,9 l15,-18" fill="none" stroke="#1E8C8C" stroke-width="4"/>
  <text x="1176" y="170" font-family="Arial, sans-serif" font-size="16" fill="#33414F" text-anchor="middle">validates</text>
  <text x="1170" y="192" font-family="Arial, sans-serif" font-size="16" fill="#33414F" text-anchor="middle">signature locally</text>
  <text x="1170" y="222" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#6B7A8D" text-anchor="middle">no domain controller</text>
  <text x="1170" y="242" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#6B7A8D" text-anchor="middle">callback</text>

  <rect x="1080" y="280" width="180" height="140" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1170" y="310" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Service B</text>
  <path d="M1098,332 l8,9 l15,-18" fill="none" stroke="#1E8C8C" stroke-width="4"/>
  <text x="1176" y="340" font-family="Arial, sans-serif" font-size="16" fill="#33414F" text-anchor="middle">validates</text>
  <text x="1170" y="362" font-family="Arial, sans-serif" font-size="16" fill="#33414F" text-anchor="middle">signature locally</text>
  <text x="1170" y="392" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#6B7A8D" text-anchor="middle">no domain controller</text>
  <text x="1170" y="412" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#6B7A8D" text-anchor="middle">callback</text>

  <rect x="1080" y="450" width="180" height="140" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1170" y="480" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Service C</text>
  <path d="M1098,502 l8,9 l15,-18" fill="none" stroke="#1E8C8C" stroke-width="4"/>
  <text x="1176" y="510" font-family="Arial, sans-serif" font-size="16" fill="#33414F" text-anchor="middle">validates</text>
  <text x="1170" y="532" font-family="Arial, sans-serif" font-size="16" fill="#33414F" text-anchor="middle">signature locally</text>
  <text x="1170" y="562" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#6B7A8D" text-anchor="middle">no domain controller</text>
  <text x="1170" y="582" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#6B7A8D" text-anchor="middle">callback</text>

  <!-- token to services over different network paths -->
  <line x1="1055" y1="250" x2="1072" y2="196" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrTeal)"/>
  <line x1="1055" y1="305" x2="1072" y2="342" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrTeal)"/>
  <line x1="1055" y1="360" x2="1072" y2="500" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrTeal)"/>
  <text x="945" y="448" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A" text-anchor="middle">delivered across three</text>
  <text x="945" y="470" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A" text-anchor="middle">different network paths</text>

  <!-- bottom caption -->
  <text x="640" y="700" font-family="Arial, sans-serif" font-size="17" font-style="italic" fill="#6B7A8D" text-anchor="middle">The token is valid on any path — nothing about its validity references the network.</text>
</svg>
