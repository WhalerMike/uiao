<svg viewBox="0 0 1040 400" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="400" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#999"/></marker><marker id="arww" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#fff"/></marker></defs><text x="520" y="26" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">Privileged Access: Standing vs. Just-in-Time</text><text x="520" y="44" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">The structural change from persistent admin exposure to time-limited, audited activation</text><rect x="30" y="60" width="460" height="300" rx="8" fill="#F2F2F2" stroke="#C00000" stroke-width="2"/><text x="260" y="85" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#C00000">Before — Standing Access</text><text x="50" y="108" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#666666">Role:  </text><text x="175" y="108" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#C00000">Global Administrator / Domain Admin</text><text x="50" y="138" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#666666">State:  </text><text x="175" y="138" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#C00000">ALWAYS ACTIVE — 24 hours, 7 days</text><text x="50" y="168" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#666666">Activation:  </text><text x="175" y="168" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#C00000">None required</text><text x="50" y="198" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#666666">Justification:  </text><text x="175" y="198" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#C00000">None required</text><text x="50" y="228" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#666666">Time limit:  </text><text x="175" y="228" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#C00000">None — permanent grant</text><text x="50" y="258" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#666666">Audit trail:  </text><text x="175" y="258" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#C00000">Group membership only</text><text x="50" y="288" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#666666">Blast radius:  </text><text x="175" y="288" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#C00000">Full tenant on credential theft</text><rect x="550" y="60" width="460" height="300" rx="8" fill="#EBF3FB" stroke="#375623" stroke-width="2"/><text x="780" y="85" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#375623">After — Just-in-Time (PIM)</text><text x="570" y="108" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#666666">Role:  </text><text x="695" y="108" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#375623">Eligible — not active</text><text x="570" y="138" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#666666">State:  </text><text x="695" y="138" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#375623">INACTIVE until explicitly activated</text><text x="570" y="168" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#666666">Activation:  </text><text x="695" y="168" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#375623">Request → MFA → Approver</text><text x="570" y="198" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#666666">Justification:  </text><text x="695" y="198" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#375623">Required and logged</text><text x="570" y="228" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#666666">Time limit:  </text><text x="695" y="228" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#375623">1–8 hours, auto-expires</text><text x="570" y="258" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#666666">Audit trail:  </text><text x="695" y="258" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#375623">Token-level, per-activation</text><text x="570" y="288" text-anchor="start" font-size="10" font-weight="bold" font-style="normal" fill="#666666">Blast radius:  </text><text x="695" y="288" text-anchor="start" font-size="10" font-weight="normal" font-style="normal" fill="#375623">Scoped to approved window only</text><line x1="495" y1="210" x2="548" y2="210" stroke="#1F3864" stroke-width="2" marker-end="url(#arw)"/><text x="520" y="205" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#1F3864">Entra</text><text x="520" y="217" text-anchor="middle" font-size="8" font-weight="normal" font-style="normal" fill="#1F3864">PIM</text><text x="520" y="385" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">AC-6(5) Privileged Accounts · AC-6(9) Log Use · IA-11 Re-authentication · AC-11/AC-12 Session</text></svg>
