<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1A9E8F"/></marker>
    <marker id="arw-red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#C0392B"/></marker>
  </defs>

  <text x="800" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#1F3A5F">SaaS Integration Governance (Vol VII Book 06)</text>
  <text x="800" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5A6B7B">The Entra gallery as a governed SA-9 event — verify, then configure</text>

  <!-- amber emphasis ring around Step 2, the gate -->
  <rect x="291" y="200" width="241" height="404" rx="14" fill="none" stroke="#D4860B" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="411.5" y="638" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1" fill="#8A6210">THE GATE</text>
  <text x="411.5" y="661" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#8A6210">
    <tspan x="411.5" dy="0">Verdict recorded before</tspan>
    <tspan x="411.5" dy="19">anything is configured</tspan>
  </text>

  <!-- ===== Step 1 — Request ===== -->
  <rect x="40" y="210" width="225" height="384" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M50,210 h205 a10,10 0 0 1 10,10 v68 h-225 v-68 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="152.5" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 1</text>
  <text x="152.5" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Request</text>
  <text x="152.5" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">
    <tspan x="152.5" dy="0">The SaaS, its business</tspan>
    <tspan x="152.5" dy="25">owner, and the identity</tspan>
    <tspan x="152.5" dy="25">attributes it will</tspan>
    <tspan x="152.5" dy="25">receive</tspan>
  </text>
  <rect x="107.5" y="540" width="90" height="30" rx="15" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="152.5" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1F3A5F">AC-20</text>

  <!-- ===== Step 2 — Verify (the gate) ===== -->
  <rect x="299" y="210" width="225" height="384" rx="10" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="2"/>
  <path d="M309,210 h205 a10,10 0 0 1 10,10 v68 h-225 v-68 a10,10 0 0 1 10,-10 z" fill="#1A9E8F"/>
  <text x="411.5" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#E6F5F2">STEP 2</text>
  <text x="411.5" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Verify</text>
  <text x="411.5" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">
    <tspan x="411.5" dy="0">A FedRAMP Marketplace</tspan>
    <tspan x="411.5" dy="25">authorization verdict at</tspan>
    <tspan x="411.5" dy="25">or above the Moderate</tspan>
    <tspan x="411.5" dy="25">baseline, recorded</tspan>
    <tspan x="411.5" dy="25">against the request</tspan>
  </text>
  <text x="411.5" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-style="italic" fill="#8A6210">No verdict, no progression</text>
  <rect x="366.5" y="540" width="90" height="30" rx="15" fill="#F4F7FA" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="411.5" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1A9E8F">SA-9</text>

  <!-- ===== Step 3 — Classify ===== -->
  <rect x="558" y="210" width="225" height="384" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M568,210 h205 a10,10 0 0 1 10,10 v68 h-225 v-68 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="670.5" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 3</text>
  <text x="670.5" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Classify</text>
  <text x="670.5" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">
    <tspan x="670.5" dy="0">SSO-only, or SCIM?</tspan>
  </text>
  <circle cx="592" cy="382" r="6" fill="#1A9E8F"/>
  <text x="608" y="388" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2A2A2A">SSO — an assertion</text>
  <text x="608" y="410" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A6B7B">at sign-in; transient</text>
  <circle cx="592" cy="446" r="6" fill="#C0392B"/>
  <text x="608" y="452" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#C0392B">SCIM — a standing</text>
  <text x="608" y="474" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C0392B">directory replica</text>
  <rect x="625.5" y="540" width="90" height="30" rx="15" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="670.5" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1F3A5F">AC-4</text>

  <!-- ===== Step 4 — Agree (SCIM path only) ===== -->
  <rect x="817" y="210" width="225" height="384" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M817,220 a10,10 0 0 1 10,-10 h8 v384 h-8 a10,10 0 0 1 -10,-10 z" fill="#C0392B"/>
  <path d="M835,210 h197 a10,10 0 0 1 10,10 v68 h-207 z" fill="#1F3A5F"/>
  <text x="938.5" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 4</text>
  <text x="938.5" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Agree</text>
  <text x="938.5" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">
    <tspan x="938.5" dy="0">An ISA attached and</tspan>
    <tspan x="938.5" dy="25">approved before the</tspan>
    <tspan x="938.5" dy="25">synchronization job</tspan>
    <tspan x="938.5" dy="25">is enabled</tspan>
  </text>
  <text x="938.5" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#C0392B">SCIM path only</text>
  <rect x="893.5" y="540" width="90" height="30" rx="15" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="938.5" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1F3A5F">CA-3</text>

  <!-- ===== Step 5 — Configure ===== -->
  <rect x="1076" y="210" width="225" height="384" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M1086,210 h205 a10,10 0 0 1 10,10 v68 h-225 v-68 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="1188.5" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 5</text>
  <text x="1188.5" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Configure</text>
  <text x="1188.5" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">
    <tspan x="1188.5" dy="0">SSO or provisioning</tspan>
    <tspan x="1188.5" dy="25">actuated via Microsoft</tspan>
    <tspan x="1188.5" dy="25">Graph through the</tspan>
    <tspan x="1188.5" dy="25">in-boundary MID Server</tspan>
  </text>
  <text x="1188.5" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-style="italic" fill="#5A6B7B">Never a portal click</text>
  <rect x="1143.5" y="540" width="90" height="30" rx="15" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="1188.5" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1F3A5F">IA-2</text>

  <!-- ===== Step 6 — Attest ===== -->
  <rect x="1335" y="210" width="225" height="384" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M1345,210 h205 a10,10 0 0 1 10,10 v68 h-225 v-68 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="1447.5" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 6</text>
  <text x="1447.5" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Attest</text>
  <text x="1447.5" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A2A2A">
    <tspan x="1447.5" dy="0">Authorization</tspan>
    <tspan x="1447.5" dy="25">re-verified on cadence;</tspan>
    <tspan x="1447.5" dy="25">a lapsed authorization</tspan>
    <tspan x="1447.5" dy="25">raises a task</tspan>
  </text>
  <rect x="1402.5" y="540" width="90" height="30" rx="15" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="1447.5" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1F3A5F">CA-7</text>

  <!-- ===== connectors ===== -->
  <line x1="267" y1="400" x2="295" y2="400" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <line x1="526" y1="400" x2="554" y2="400" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <line x1="785" y1="400" x2="813" y2="400" stroke="#C0392B" stroke-width="3" marker-end="url(#arw-red)"/>
  <line x1="1044" y1="400" x2="1072" y2="400" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <line x1="1303" y1="400" x2="1331" y2="400" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>

  <!-- SSO-only bypass: Step 3 straight to Step 5, skipping the ISA gate -->
  <path d="M670.5,600 v52 h518 v-52" fill="none" stroke="#1A9E8F" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arw-teal)"/>
  <rect x="838" y="636" width="203" height="30" rx="6" fill="#FFFFFF"/>
  <text x="939.5" y="657" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1A9E8F">SSO-only — no ISA required</text>

  <!-- ===== footer ===== -->
  <line x1="40" y1="716" x2="1560" y2="716" stroke="#E3E8EF" stroke-width="2"/>
  <text x="800" y="758" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#1F3A5F">Six phases, 24 governed catalog items, 24 controls.</text>
  <text x="800" y="790" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#C0392B">Closed during provisioning — or silently skipped there.</text>
  <text x="800" y="836" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5A6B7B">ServiceNow governs who, when, approval and evidence — Graph actuates through the in-boundary MID Server.</text>
  <text x="800" y="864" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5A6B7B">FedRAMP Moderate and GCC Moderate.</text>
</svg>
