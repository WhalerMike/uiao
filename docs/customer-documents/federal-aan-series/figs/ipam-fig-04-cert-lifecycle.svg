<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1100" height="620" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="0" y="0" width="1100" height="48" fill="#1F3864"/>
  <text x="550" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">VM Workload IP, DNS &amp; Certificate Lifecycle — InfoBlox Automated Pipeline</text>
  <text x="550" y="43" text-anchor="middle" font-size="10" fill="#D5E8F0">Cloud VM Provisioning → IPAM Allocation → DHCP/DNS Registration → SCEP/EST Cert Enrollment → mTLS Activation</text>

  <!-- Timeline rail -->
  <line x1="60" y1="200" x2="1040" y2="200" stroke="#CCCCCC" stroke-width="3"/>
  <!-- Stage tick marks -->
  <line x1="110" y1="192" x2="110" y2="208" stroke="#1F3864" stroke-width="2"/>
  <line x1="230" y1="192" x2="230" y2="208" stroke="#2E75B6" stroke-width="2"/>
  <line x1="360" y1="192" x2="360" y2="208" stroke="#2E75B6" stroke-width="2"/>
  <line x1="490" y1="192" x2="490" y2="208" stroke="#2E75B6" stroke-width="2"/>
  <line x1="620" y1="192" x2="620" y2="208" stroke="#C55A11" stroke-width="2"/>
  <line x1="750" y1="192" x2="750" y2="208" stroke="#C55A11" stroke-width="2"/>
  <line x1="880" y1="192" x2="880" y2="208" stroke="#375623" stroke-width="2"/>
  <line x1="990" y1="192" x2="990" y2="208" stroke="#375623" stroke-width="2"/>

  <!-- ── STAGE BOXES (above timeline) ── -->

  <!-- Stage 1: VM Provisioned -->
  <rect x="60" y="56" width="126" height="128" rx="7" fill="#EBF3FF" stroke="#1F3864" stroke-width="2"/>
  <rect x="60" y="56" width="126" height="22" rx="7" fill="#1F3864"/>
  <text x="123" y="71" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">① VM PROVISIONED</text>
  <text x="123" y="92" text-anchor="middle" font-size="8.5" fill="#1F3864">Azure / AWS / OCI</text>
  <text x="123" y="106" text-anchor="middle" font-size="8" fill="#595959">Operator or IaC tool</text>
  <text x="123" y="120" text-anchor="middle" font-size="8" fill="#595959">(Terraform / Bicep)</text>
  <text x="123" y="134" text-anchor="middle" font-size="8" fill="#595959">triggers cloud event</text>
  <text x="123" y="150" text-anchor="middle" font-size="8" fill="#595959">→ Azure Event Grid</text>
  <text x="123" y="164" text-anchor="middle" font-size="8" fill="#595959">→ AWS EventBridge</text>
  <text x="123" y="176" text-anchor="middle" font-size="8" fill="#595959">→ OCI Events Service</text>
  <!-- connector down to timeline -->
  <line x1="110" y1="184" x2="110" y2="200" stroke="#1F3864" stroke-width="2"/>
  <polygon points="106,196 110,200 114,196" fill="#1F3864"/>

  <!-- Stage 2: InfoBlox API Connector -->
  <rect x="175" y="56" width="126" height="128" rx="7" fill="#D5E8F0" stroke="#2E75B6" stroke-width="2"/>
  <rect x="175" y="56" width="126" height="22" rx="7" fill="#2E75B6"/>
  <text x="238" y="71" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">② API CONNECTOR</text>
  <text x="238" y="92" text-anchor="middle" font-size="8.5" fill="#2E75B6">InfoBlox Cloud</text>
  <text x="238" y="106" text-anchor="middle" font-size="8" fill="#595959">Connector receives</text>
  <text x="238" y="120" text-anchor="middle" font-size="8" fill="#595959">provisioning event</text>
  <text x="238" y="134" text-anchor="middle" font-size="8" fill="#595959">Validates: hostname</text>
  <text x="238" y="148" text-anchor="middle" font-size="8" fill="#595959">naming convention</text>
  <text x="238" y="162" text-anchor="middle" font-size="8" fill="#595959">subnet target</text>
  <text x="238" y="176" text-anchor="middle" font-size="8" fill="#595959">zone assignment</text>
  <line x1="230" y1="184" x2="230" y2="200" stroke="#2E75B6" stroke-width="2"/>
  <polygon points="226,196 230,200 234,196" fill="#2E75B6"/>

  <!-- Stage 3: IPAM Allocation -->
  <rect x="305" y="56" width="126" height="128" rx="7" fill="#D5E8F0" stroke="#2E75B6" stroke-width="2"/>
  <rect x="305" y="56" width="126" height="22" rx="7" fill="#2E75B6"/>
  <text x="368" y="71" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">③ IPAM ALLOCATION</text>
  <text x="368" y="92" text-anchor="middle" font-size="8.5" fill="#2E75B6">Next Available IP</text>
  <text x="368" y="106" text-anchor="middle" font-size="8" fill="#595959">InfoBlox selects IP</text>
  <text x="368" y="120" text-anchor="middle" font-size="8" fill="#595959">from correct subnet</text>
  <text x="368" y="134" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1F3864">172.16.4.88 assigned</text>
  <text x="368" y="148" text-anchor="middle" font-size="8" fill="#595959">Network View: Azure-GCC</text>
  <text x="368" y="162" text-anchor="middle" font-size="8" fill="#595959">Subnet: 172.16.4.0/24</text>
  <text x="368" y="176" text-anchor="middle" font-size="8" fill="#595959">Host record created</text>
  <line x1="360" y1="184" x2="360" y2="200" stroke="#2E75B6" stroke-width="2"/>
  <polygon points="356,196 360,200 364,196" fill="#2E75B6"/>

  <!-- Stage 4: DHCP + DNS -->
  <rect x="435" y="56" width="126" height="128" rx="7" fill="#D5E8F0" stroke="#2E75B6" stroke-width="2"/>
  <rect x="435" y="56" width="126" height="22" rx="7" fill="#2E75B6"/>
  <text x="498" y="71" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">④ DHCP + DNS REG</text>
  <text x="498" y="92" text-anchor="middle" font-size="8.5" fill="#2E75B6">Automatic records</text>
  <text x="498" y="107" text-anchor="middle" font-size="8" font-weight="bold" fill="#1F3864">A record:</text>
  <text x="498" y="120" text-anchor="middle" font-size="7.5" fill="#595959">app01.agency.gov</text>
  <text x="498" y="133" text-anchor="middle" font-size="7.5" fill="#595959">→ 172.16.4.88</text>
  <text x="498" y="147" text-anchor="middle" font-size="8" font-weight="bold" fill="#1F3864">PTR record:</text>
  <text x="498" y="160" text-anchor="middle" font-size="7.5" fill="#595959">88.4.16.172.in-addr.arpa</text>
  <text x="498" y="173" text-anchor="middle" font-size="7.5" fill="#595959">→ app01.agency.gov</text>
  <line x1="490" y1="184" x2="490" y2="200" stroke="#2E75B6" stroke-width="2"/>
  <polygon points="486,196 490,200 494,196" fill="#2E75B6"/>

  <!-- Stage 5: SCEP/EST Request -->
  <rect x="565" y="56" width="126" height="128" rx="7" fill="#FCE4D6" stroke="#C55A11" stroke-width="2"/>
  <rect x="565" y="56" width="126" height="22" rx="7" fill="#C55A11"/>
  <text x="628" y="71" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">⑤ SCEP/EST REQUEST</text>
  <text x="628" y="92" text-anchor="middle" font-size="8.5" fill="#C55A11">Cert Enrollment</text>
  <text x="628" y="107" text-anchor="middle" font-size="8" fill="#595959">InfoBlox triggers SCEP</text>
  <text x="628" y="121" text-anchor="middle" font-size="8" fill="#595959">request to ADCS CA</text>
  <text x="628" y="135" text-anchor="middle" font-size="8" fill="#595959">CSR generated with:</text>
  <text x="628" y="149" text-anchor="middle" font-size="7.5" fill="#595959">CN=app01.agency.gov</text>
  <text x="628" y="163" text-anchor="middle" font-size="7.5" fill="#595959">SAN=IP:172.16.4.88</text>
  <text x="628" y="177" text-anchor="middle" font-size="7.5" fill="#595959">SAN=DNS:app01.agency.gov</text>
  <line x1="620" y1="184" x2="620" y2="200" stroke="#C55A11" stroke-width="2"/>
  <polygon points="616,196 620,200 624,196" fill="#C55A11"/>

  <!-- Stage 6: Cert Issued -->
  <rect x="695" y="56" width="126" height="128" rx="7" fill="#FCE4D6" stroke="#C55A11" stroke-width="2"/>
  <rect x="695" y="56" width="126" height="22" rx="7" fill="#C55A11"/>
  <text x="758" y="71" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">⑥ CERT ISSUED</text>
  <text x="758" y="92" text-anchor="middle" font-size="8.5" fill="#C55A11">ADCS Signed Cert</text>
  <text x="758" y="107" text-anchor="middle" font-size="8" fill="#595959">X.509 v3 cert issued</text>
  <text x="758" y="121" text-anchor="middle" font-size="8" fill="#595959">by agency Issuing CA</text>
  <text x="758" y="135" text-anchor="middle" font-size="8" fill="#595959">Validity: 1 year</text>
  <text x="758" y="149" text-anchor="middle" font-size="8" fill="#595959">Key: RSA-2048 / P-256</text>
  <text x="758" y="163" text-anchor="middle" font-size="7.5" fill="#595959">OID: agency PKI policy</text>
  <text x="758" y="177" text-anchor="middle" font-size="7.5" fill="#595959">Deployed to VM keystore</text>
  <line x1="750" y1="184" x2="750" y2="200" stroke="#C55A11" stroke-width="2"/>
  <polygon points="746,196 750,200 754,196" fill="#C55A11"/>

  <!-- Stage 7: InfoBlox Cert Tracker -->
  <rect x="825" y="56" width="126" height="128" rx="7" fill="#E2EFDA" stroke="#375623" stroke-width="2"/>
  <rect x="825" y="56" width="126" height="22" rx="7" fill="#375623"/>
  <text x="888" y="71" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">⑦ CERT TRACKER</text>
  <text x="888" y="92" text-anchor="middle" font-size="8.5" fill="#375623">InfoBlox records:</text>
  <text x="888" y="107" text-anchor="middle" font-size="7.5" fill="#595959">Thumbprint: A3:F2:...</text>
  <text x="888" y="121" text-anchor="middle" font-size="7.5" fill="#595959">Expiry: 2027-06-29</text>
  <text x="888" y="135" text-anchor="middle" font-size="7.5" fill="#595959">Issuer: Agency-Issuing-CA</text>
  <text x="888" y="149" text-anchor="middle" font-size="7.5" fill="#595959">Bound IP: 172.16.4.88</text>
  <text x="888" y="163" text-anchor="middle" font-size="7.5" fill="#595959">FQDN: app01.agency.gov</text>
  <text x="888" y="177" text-anchor="middle" font-size="7.5" fill="#595959">Alert: 90/30/7-day</text>
  <line x1="880" y1="184" x2="880" y2="200" stroke="#375623" stroke-width="2"/>
  <polygon points="876,196 880,200 884,196" fill="#375623"/>

  <!-- Stage 8: Workload Online -->
  <rect x="937" y="56" width="120" height="128" rx="7" fill="#E2EFDA" stroke="#375623" stroke-width="2"/>
  <rect x="937" y="56" width="120" height="22" rx="7" fill="#375623"/>
  <text x="997" y="71" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">⑧ ONLINE</text>
  <text x="997" y="92" text-anchor="middle" font-size="8.5" fill="#375623">mTLS Active</text>
  <text x="997" y="106" text-anchor="middle" font-size="8" fill="#595959">VM accepts mTLS</text>
  <text x="997" y="120" text-anchor="middle" font-size="8" fill="#595959">connections on</text>
  <text x="997" y="134" text-anchor="middle" font-size="8" fill="#595959">172.16.4.88:443</text>
  <text x="997" y="148" text-anchor="middle" font-size="8" fill="#595959">Token endpoints</text>
  <text x="997" y="162" text-anchor="middle" font-size="8" fill="#595959">trust cert chain</text>
  <text x="997" y="176" text-anchor="middle" font-size="8" fill="#375623">Elapsed: ~60 sec</text>
  <line x1="990" y1="184" x2="990" y2="200" stroke="#375623" stroke-width="2"/>
  <polygon points="986,196 990,200 994,196" fill="#375623"/>

  <!-- ── BELOW TIMELINE: detail boxes ── -->

  <!-- Timing labels on rail -->
  <text x="110" y="220" text-anchor="middle" font-size="8" fill="#1F3864">T+0s</text>
  <text x="230" y="220" text-anchor="middle" font-size="8" fill="#2E75B6">T+2s</text>
  <text x="360" y="220" text-anchor="middle" font-size="8" fill="#2E75B6">T+5s</text>
  <text x="490" y="220" text-anchor="middle" font-size="8" fill="#2E75B6">T+8s</text>
  <text x="620" y="220" text-anchor="middle" font-size="8" fill="#C55A11">T+15s</text>
  <text x="750" y="220" text-anchor="middle" font-size="8" fill="#C55A11">T+30s</text>
  <text x="880" y="220" text-anchor="middle" font-size="8" fill="#375623">T+32s</text>
  <text x="990" y="220" text-anchor="middle" font-size="8" fill="#375623">T+60s</text>

  <!-- Below-timeline detail: IPAM host record sample -->
  <rect x="60" y="240" width="410" height="120" rx="7" fill="#F2F2F2" stroke="#2E75B6" stroke-width="1.2"/>
  <text x="265" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E75B6">InfoBlox IP Host Record (created at Stage 3)</text>
  <rect x="70" y="264" width="390" height="86" rx="4" fill="#1F3864"/>
  <text x="80" y="281" font-size="8" fill="#2E75B6">host_record:  </text><text x="148" y="281" font-size="8" fill="#FFFFFF">app01.agency.gov</text>
  <text x="80" y="295" font-size="8" fill="#2E75B6">ipv4addr:     </text><text x="142" y="295" font-size="8" fill="#FFFFFF">172.16.4.88</text>
  <text x="80" y="309" font-size="8" fill="#2E75B6">network_view: </text><text x="153" y="309" font-size="8" fill="#FFFFFF">Azure-GCC</text>
  <text x="80" y="323" font-size="8" fill="#2E75B6">mac_address:  </text><text x="150" y="323" font-size="8" fill="#FFFFFF">00:50:56:A2:3F:1C</text>
  <text x="80" y="337" font-size="8" fill="#2E75B6">comment:      </text><text x="144" y="337" font-size="8" fill="#FFFFFF">Azure VM / Terraform run 2026-06-29T14:00:00Z</text>
  <text x="80" y="351" font-size="8" fill="#2E75B6">ttl:          </text><text x="130" y="351" font-size="8" fill="#FFFFFF">3600   disable: false   zone: agency.gov</text>

  <!-- Below-timeline: Cert tracker record sample -->
  <rect x="490" y="240" width="560" height="120" rx="7" fill="#F2F2F2" stroke="#C55A11" stroke-width="1.2"/>
  <text x="770" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#C55A11">InfoBlox Certificate Tracker Record (created at Stage 7)</text>
  <rect x="500" y="264" width="540" height="86" rx="4" fill="#1F3864"/>
  <text x="510" y="281" font-size="8" fill="#C55A11">thumbprint:    </text><text x="582" y="281" font-size="8" fill="#FFFFFF">A3:F2:9D:11:CC:44:8B:21:07:...</text>
  <text x="510" y="295" font-size="8" fill="#C55A11">subject_cn:    </text><text x="578" y="295" font-size="8" fill="#FFFFFF">app01.agency.gov</text>
  <text x="510" y="309" font-size="8" fill="#C55A11">san_ip:        </text><text x="566" y="309" font-size="8" fill="#FFFFFF">172.16.4.88</text>
  <text x="510" y="323" font-size="8" fill="#C55A11">issuer:        </text><text x="563" y="323" font-size="8" fill="#FFFFFF">Agency-Issuing-CA-G3</text>
  <text x="510" y="337" font-size="8" fill="#C55A11">expiry:        </text><text x="561" y="337" font-size="8" fill="#FFFFFF">2027-06-29T14:00:30Z  →  alerts: 90d 30d 7d</text>
  <text x="510" y="351" font-size="8" fill="#C55A11">bound_ip_host: </text><text x="589" y="351" font-size="8" fill="#FFFFFF">app01.agency.gov (172.16.4.88) · network_view: Azure-GCC</text>

  <!-- ── EXPIRY RENEWAL LOOP ── -->
  <rect x="60" y="380" width="980" height="90" rx="8" fill="#FCE4D6" stroke="#C55A11" stroke-width="1.5"/>
  <text x="550" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#C55A11">Certificate Renewal Loop — InfoBlox Certificate Tracker</text>
  <!-- Renewal timeline -->
  <line x1="100" y1="440" x2="1000" y2="440" stroke="#C55A11" stroke-width="2"/>
  <rect x="100" y="430" width="6" height="20" fill="#1F3864"/>
  <text x="103" y="425" font-size="8" fill="#1F3864">Issued</text>
  <text x="103" y="458" font-size="7.5" fill="#595959">2026-06-29</text>
  <!-- 90 day alert -->
  <rect x="370" y="430" width="6" height="20" fill="#C55A11"/>
  <text x="340" y="425" font-size="8" fill="#C55A11">90-day alert</text>
  <text x="340" y="458" font-size="7.5" fill="#595959">2027-03-31</text>
  <!-- 30 day alert -->
  <rect x="680" y="430" width="6" height="20" fill="#C55A11"/>
  <text x="650" y="425" font-size="8" fill="#C55A11">30-day alert</text>
  <text x="650" y="458" font-size="7.5" fill="#595959">2027-05-30</text>
  <!-- 7 day alert -->
  <rect x="870" y="430" width="6" height="20" fill="#C00000"/>
  <text x="840" y="425" font-size="8" fill="#C00000">7-day CRITICAL</text>
  <text x="840" y="458" font-size="7.5" fill="#595959">2027-06-22</text>
  <!-- Expiry -->
  <rect x="994" y="430" width="6" height="20" fill="#C00000"/>
  <text x="960" y="425" font-size="8" fill="#C00000">Expiry</text>
  <text x="955" y="458" font-size="7.5" fill="#595959">2027-06-29</text>
  <!-- Auto-renew arrow -->
  <path d="M 700,440 Q 700,470 550,470 Q 400,470 400,440" fill="none" stroke="#375623" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="396,440 400,436 404,440" fill="#375623"/>
  <text x="550" y="482" text-anchor="middle" font-size="8" fill="#375623">Auto-renew triggered at 30-day alert → SCEP re-enrollment → new thumbprint in tracker</text>

  <!-- ── FedRAMP strip ── -->
  <rect x="60" y="488" width="980" height="36" rx="6" fill="#1F3864"/>
  <text x="550" y="506" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">FedRAMP Moderate Control Evidence from this Pipeline</text>
  <text x="550" y="520" text-anchor="middle" font-size="8.5" fill="#D5E8F0">CM-8: IP Host Record = component inventory entry · IA-5(2): cert bound to IP host record · SC-8: mTLS enforced · AU-12: all lifecycle events logged · SA-9: OPM certs tracked as external</text>

  <!-- Bottom strip -->
  <rect x="0" y="600" width="1100" height="20" fill="#1F3864"/>
  <text x="550" y="614" text-anchor="middle" font-size="8" fill="#FFFFFF">UNCLASSIFIED // FOUO — VM/Cert Lifecycle Pipeline — InfoBlox DDI — FedRAMP Moderate — IA-5(2) · CM-8 · SC-8</text>
</svg>
