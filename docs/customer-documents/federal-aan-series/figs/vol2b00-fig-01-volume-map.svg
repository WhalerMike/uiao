  <path d="M106,300 h420 a10,10 0 0 1 10,10 v86 h-440 v-86 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="316.0" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#A9C0DC">VOL II BOOK 01</text>
  <foreignObject x="106" y="338" width="420" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:22px;font-weight:700;color:#FFFFFF;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">SQL Server Authentication Modernization</div>
  </foreignObject>
