    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:21px;color:#2A2A2A;line-height:1.32;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">Speed-of-light propagation floor, consistency-class-to-transport alignment, SD-WAN traffic separation for replication</div>
