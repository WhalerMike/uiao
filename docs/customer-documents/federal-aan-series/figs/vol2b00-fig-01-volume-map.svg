  <foreignObject x="590" y="338" width="420" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:22px;font-weight:700;color:#FFFFFF;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">SQL Server Implementation Guide</div>
  </foreignObject>
  <foreignObject x="596" y="404" width="408" height="248">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:21px;color:#2A2A2A;line-height:1.32;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">The operational runbook — estate discovery, Arc deployment, login migration, NTLM remediation, continuous monitoring</div>
  </foreignObject>
