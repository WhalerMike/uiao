    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:21px;color:#2A2A2A;line-height:1.32;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">Arc Managed Identity replaces stored credentials; NTLM eliminated; Entra Conditional Access as the SQL perimeter</div>
  </foreignObject>
  <rect x="580" y="300" width="440" height="360" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
