  <foreignObject x="120" y="752" width="642" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:20px;color:#2A2A2A;line-height:1.3;">Cryptographic identity (Vol I Book 03) and governed transport (Vol I Books 05–06).</div></foreignObject>
  <rect x="814" y="704" width="690" height="120" rx="8" fill="#F4F7FA" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="838" y="742" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1A9E8F">Feeds (downstream)</text>
  <foreignObject x="838" y="752" width="642" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:20px;color:#2A2A2A;line-height:1.3;">DR replicas → Business Continuity (Vol IV Book 01); SQL compliance record → Multi-Cloud Evidence Fabric (Vol III Book 07).</div></foreignObject>
