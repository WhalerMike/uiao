  <text x="800" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#1F3A5F">Volume II — Data Platform</text>
  <text x="800" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5A6B7B">Applying the Volume I identity and transport substrate to the database tier</text>
  <text x="96" y="250" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5" fill="#1F3A5F">WORKLOAD-IDENTITY PROGRESSION, EXECUTED END-TO-END ON THE FIRST LARGE ESTATE</text>
