<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrTeal" markerWidth="9" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#1E8C8C"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="44" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#0D1B2E">The Automated Certificate Lifecycle</text>
  <text x="40" y="74" font-family="Arial, sans-serif" font-size="17" fill="#6B7A8D">Enrollment protocols, short lifetimes, and DDI-keyed inventory</text>

  <!-- guide circle -->
  <circle cx="560" cy="400" r="205" fill="none" stroke="#E3E8EF" stroke-width="2" stroke-dasharray="7,6"/>

  <!-- ===== Station 1: Request (top) ===== -->
  <rect x="400" y="108" width="320" height="128" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <circle cx="430" cy="136" r="16" fill="#1E8C8C"/>
  <text x="430" y="142" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="458" y="143" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E">Request</text>
  <text x="420" y="174" font-family="Arial, sans-serif" font-size="16" fill="#33414F">Workload or device asks for a</text>
  <text x="420" y="196" font-family="Arial, sans-serif" font-size="16" fill="#33414F">certificate via ACME, SCEP, or</text>
  <text x="420" y="218" font-family="Arial, sans-serif" font-size="16" fill="#33414F">EST — at provisioning time</text>

  <!-- ===== Station 2: Verify (right) ===== -->
  <rect x="830" y="300" width="340" height="176" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <circle cx="860" cy="328" r="16" fill="#1E8C8C"/>
  <text x="860" y="334" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="888" y="335" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E">Verify</text>
  <text x="850" y="366" font-family="Arial, sans-serif" font-size="16" fill="#33414F">CA proves control of the name:</text>
  <text x="850" y="388" font-family="Arial, sans-serif" font-size="16" fill="#33414F">a DNS-01 TXT record written by</text>
  <text x="850" y="410" font-family="Arial, sans-serif" font-size="16" fill="#33414F">the DDI API, or enrollment</text>
  <text x="850" y="432" font-family="Arial, sans-serif" font-size="16" fill="#33414F">credentials tied to the device</text>
  <text x="850" y="454" font-family="Arial, sans-serif" font-size="16" fill="#33414F">management platform</text>

  <!-- ===== Station 3: Issue (bottom) ===== -->
  <rect x="400" y="562" width="320" height="140" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <circle cx="430" cy="590" r="16" fill="#1E8C8C"/>
  <text x="430" y="596" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="458" y="597" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E">Issue</text>
  <text x="420" y="628" font-family="Arial, sans-serif" font-size="16" fill="#33414F">Short-lived certificate</text>
  <rect x="420" y="640" width="220" height="18" rx="4" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <rect x="420" y="640" width="100" height="18" rx="4" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="420" y="684" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E8C8C">validity: 30–90 days</text>

  <!-- ===== Station 4: Renew or Expire (left) ===== -->
  <rect x="20" y="300" width="320" height="176" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <circle cx="50" cy="328" r="16" fill="#1E8C8C"/>
  <text x="50" y="334" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="78" y="335" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E">Renew or Expire</text>
  <text x="40" y="366" font-family="Arial, sans-serif" font-size="16" fill="#33414F">Automatic renewal at two-thirds</text>
  <text x="40" y="388" font-family="Arial, sans-serif" font-size="16" fill="#33414F">of lifetime; new key pair at</text>
  <text x="40" y="410" font-family="Arial, sans-serif" font-size="16" fill="#33414F">every renewal</text>
  <text x="40" y="438" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#1E8C8C">revocation is largely replaced</text>
  <text x="40" y="460" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#1E8C8C">by non-renewal</text>

  <!-- cycle arrows (clockwise) -->
  <path d="M726,200 Q870,220 936,292" fill="none" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>
  <path d="M980,482 Q930,610 728,632" fill="none" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>
  <path d="M394,632 Q190,610 142,484" fill="none" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>
  <path d="M186,292 Q250,220 394,200" fill="none" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>

  <!-- ===== Center: IPAM inventory database ===== -->
  <path d="M470,352 a90,20 0 0 0 180,0 l0,96 a90,20 0 0 1 -180,0 z" fill="#2E75B6"/>
  <ellipse cx="560" cy="352" rx="90" ry="20" fill="#2E75B6" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="560" y="358" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">IPAM</text>
  <text x="560" y="392" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">certificate inventory</text>
  <text x="560" y="414" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">keyed to name and</text>
  <text x="560" y="436" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">address records</text>

  <!-- ===== Retired spreadsheet (outside the circle) ===== -->
  <rect x="1050" y="95" width="150" height="110" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
  <rect x="1050" y="95" width="150" height="26" fill="#E3E8EF" stroke="#5A5A5A" stroke-width="2"/>
  <line x1="1087" y1="95" x2="1087" y2="205" stroke="#5A5A5A" stroke-width="1"/>
  <line x1="1125" y1="95" x2="1125" y2="205" stroke="#5A5A5A" stroke-width="1"/>
  <line x1="1162" y1="95" x2="1162" y2="205" stroke="#5A5A5A" stroke-width="1"/>
  <line x1="1050" y1="149" x2="1200" y2="149" stroke="#5A5A5A" stroke-width="1"/>
  <line x1="1050" y1="177" x2="1200" y2="177" stroke="#5A5A5A" stroke-width="1"/>
  <line x1="1042" y1="88" x2="1208" y2="212" stroke="#C0392B" stroke-width="6"/>
  <line x1="1208" y1="88" x2="1042" y2="212" stroke="#C0392B" stroke-width="6"/>
  <text x="1125" y="240" font-family="Arial, sans-serif" font-size="17" fill="#5A5A5A" text-anchor="middle">retired operating model</text>
</svg>
