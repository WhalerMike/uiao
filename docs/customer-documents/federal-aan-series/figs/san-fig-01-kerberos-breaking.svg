<svg viewBox="0 0 1040 330" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="330" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs><text x="520" y="30" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">Kerberos Authentication Breaks Across Hybrid Cloud</text><text x="520" y="50" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">Session-bound tickets cannot cross cloud, VPN, or multi-path SD-WAN boundaries</text><rect x="30" y="68" width="440" height="250" rx="8" fill="#EBF3FB" stroke="#1F3864" stroke-width="1"/><text x="250" y="90" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#1F3864">OLD WORLD — AD Kerberos</text><rect x="80" y="106" width="340" height="26" rx="4" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1"/><text x="250" y="124" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#1F3864">Field Office Laptop</text><line x1="250" y1="134" x2="250" y2="162" stroke="#555" stroke-width="2" marker-end="url(#arw)"/><rect x="80" y="164" width="340" height="26" rx="4" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1"/><text x="250" y="182" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#1F3864">Domain Controller (Regional DC)</text><line x1="250" y1="192" x2="250" y2="220" stroke="#555" stroke-width="2" marker-end="url(#arw)"/><rect x="80" y="222" width="340" height="26" rx="4" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1"/><text x="250" y="240" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#1F3864">SQL Server (Data Center)</text><text x="250" y="285" text-anchor="middle" font-size="10" font-weight="normal" font-style="italic" fill="#375623">Same LAN/MPLS — Kerberos works</text><rect x="560" y="68" width="440" height="250" rx="8" fill="#EBF3FB" stroke="#C00000" stroke-width="1"/><text x="780" y="90" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#C00000">NEW WORLD — Hybrid Cloud</text><rect x="570" y="111" width="160" height="26" rx="4" fill="#FFFFFF" stroke="#C55A11" stroke-width="1"/><text x="640" y="129" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Field Office</text><rect x="830" y="111" width="160" height="26" rx="4" fill="#FFFFFF" stroke="#C55A11" stroke-width="1"/><text x="900" y="129" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Azure GovCloud</text><rect x="570" y="196" width="160" height="26" rx="4" fill="#FFFFFF" stroke="#C55A11" stroke-width="1"/><text x="640" y="214" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">AWS GovCloud</text><rect x="830" y="196" width="160" height="26" rx="4" fill="#FFFFFF" stroke="#C55A11" stroke-width="1"/><text x="900" y="214" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">OCI HRIT</text><rect x="740" y="158" width="80" height="24" rx="4" fill="#C00000"/><text x="780" y="174" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">KDC?</text><text x="780" y="250" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#C00000">KDC unreachable — NTLM fallback</text><text x="780" y="264" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#C00000">Kerberos ticket invalid across boundaries</text><line x1="472" y1="193" x2="556" y2="193" stroke="#C55A11" stroke-width="2" marker-end="url(#arw)"/><text x="514" y="188" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#C55A11">Migration</text></svg>
