<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrTeal" markerWidth="9" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrGrey" markerWidth="9" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#5A5A5A"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="640" y="42" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#0D1B2E" text-anchor="middle">DC-Tethered vs Credential-Bound Identity Across the Cross-Boundary Estate</text>

  <!-- ================= LEFT PANEL ================= -->
  <rect x="25" y="70" width="610" height="630" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <rect x="25" y="70" width="610" height="46" fill="#0D1B2E"/>
  <text x="330" y="100" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DC-Tethered Identity (Kerberos)</text>

  <!-- Sub-diagram 1: single path -->
  <text x="330" y="150" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#6B7A8D" text-anchor="middle">Ticket issuance requires a reachable domain controller</text>

  <rect x="60" y="172" width="160" height="84" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="140" y="206" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Kerberos Client</text>
  <text x="140" y="232" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D" text-anchor="middle">(branch office)</text>

  <rect x="440" y="172" width="160" height="84" rx="8" fill="#0D1B2E"/>
  <text x="520" y="206" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Data Center</text>
  <text x="520" y="232" font-family="Arial, sans-serif" font-size="16" fill="#EAF1FB" text-anchor="middle">KDC + service</text>

  <line x1="220" y1="214" x2="432" y2="214" stroke="#1E8C8C" stroke-width="4.5" marker-end="url(#arrTeal)"/>
  <text x="326" y="200" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1E8C8C" text-anchor="middle">authenticated session</text>

  <line x1="45" y1="288" x2="615" y2="288" stroke="#E3E8EF" stroke-width="1.5"/>

  <!-- Sub-diagram 2: multipath -->
  <text x="330" y="322" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#6B7A8D" text-anchor="middle">Cross-boundary estate: cloud tenancies + multipath transport</text>

  <rect x="60" y="350" width="150" height="170" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="135" y="424" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Kerberos Client</text>
  <text x="135" y="450" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D" text-anchor="middle">(branch office)</text>

  <rect x="450" y="350" width="150" height="170" rx="8" fill="#0D1B2E"/>
  <text x="525" y="424" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Data Center</text>
  <text x="525" y="450" font-family="Arial, sans-serif" font-size="16" fill="#EAF1FB" text-anchor="middle">KDC + service</text>

  <line x1="210" y1="382" x2="442" y2="382" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>
  <line x1="210" y1="435" x2="442" y2="435" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>
  <line x1="210" y1="488" x2="442" y2="488" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>
  <text x="220" y="374" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A">Fiber</text>
  <text x="220" y="427" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A">Broadband DIA</text>
  <text x="220" y="480" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A">5G</text>

  <!-- cracked session-state ticket icon -->
  <rect x="368" y="406" width="64" height="58" rx="5" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="392" y="443" font-family="Consolas, monospace" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle">TGT</text>
  <path d="M414,406 l-7,11 l10,9 l-9,11 l10,9 l-7,18" fill="none" stroke="#C0392B" stroke-width="3"/>
  <circle cx="432" cy="406" r="12" fill="#D4A017"/>
  <text x="432" y="412" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text>

  <!-- red annotation -->
  <text x="330" y="566" font-family="Arial, sans-serif" font-size="19" font-style="italic" fill="#C0392B" text-anchor="middle">Ticket issuance stalls: the proof of identity</text>
  <text x="330" y="592" font-family="Arial, sans-serif" font-size="19" font-style="italic" fill="#C0392B" text-anchor="middle">depends on reaching a domain controller.</text>

  <text x="330" y="660" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D" text-anchor="middle">In cloud tenancies no KDC is reachable; slow failover</text>
  <text x="330" y="682" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D" text-anchor="middle">stalls DC re-discovery — silent fallback to NTLM</text>

  <!-- ================= RIGHT PANEL ================= -->
  <rect x="645" y="70" width="610" height="630" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <rect x="645" y="70" width="610" height="46" fill="#1E8C8C"/>
  <text x="950" y="100" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Credential-Bound Identity (X.509 / OAuth 2.0)</text>

  <text x="860" y="150" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#6B7A8D" text-anchor="middle">Same client, same three paths</text>

  <!-- client with credentials -->
  <rect x="675" y="180" width="210" height="200" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="780" y="212" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Client</text>
  <rect x="695" y="228" width="170" height="48" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="780" y="258" font-family="Consolas, monospace" font-size="17" fill="#0D1B2E" text-anchor="middle">Signed JWT</text>
  <rect x="688" y="292" width="184" height="48" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="780" y="321" font-family="Consolas, monospace" font-size="16" fill="#0D1B2E" text-anchor="middle">X.509 Certificate</text>
  <text x="780" y="366" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D" text-anchor="middle">proof travels with it</text>

  <!-- three services -->
  <rect x="1080" y="140" width="160" height="130" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1160" y="168" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Service A</text>
  <rect x="1095" y="180" width="130" height="30" rx="5" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="1160" y="200" font-family="Arial, sans-serif" font-size="16" fill="#0D1B2E" text-anchor="middle">trust anchor</text>
  <path d="M1092,238 l8,9 l15,-18" fill="none" stroke="#1E8C8C" stroke-width="4"/>
  <text x="1178" y="246" font-family="Arial, sans-serif" font-size="16" fill="#1E8C8C" text-anchor="middle">verified locally</text>

  <rect x="1080" y="300" width="160" height="130" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1160" y="328" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Service B</text>
  <rect x="1095" y="340" width="130" height="30" rx="5" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="1160" y="360" font-family="Arial, sans-serif" font-size="16" fill="#0D1B2E" text-anchor="middle">trust anchor</text>
  <path d="M1092,398 l8,9 l15,-18" fill="none" stroke="#1E8C8C" stroke-width="4"/>
  <text x="1178" y="406" font-family="Arial, sans-serif" font-size="16" fill="#1E8C8C" text-anchor="middle">verified locally</text>

  <rect x="1080" y="460" width="160" height="130" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1160" y="488" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Service C</text>
  <rect x="1095" y="500" width="130" height="30" rx="5" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="1160" y="520" font-family="Arial, sans-serif" font-size="16" fill="#0D1B2E" text-anchor="middle">trust anchor</text>
  <path d="M1092,558 l8,9 l15,-18" fill="none" stroke="#1E8C8C" stroke-width="4"/>
  <text x="1178" y="566" font-family="Arial, sans-serif" font-size="16" fill="#1E8C8C" text-anchor="middle">verified locally</text>

  <!-- three paths -->
  <line x1="885" y1="230" x2="1072" y2="200" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>
  <line x1="885" y1="285" x2="1072" y2="362" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>
  <line x1="885" y1="335" x2="1072" y2="522" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>
  <text x="948" y="204" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A">Fiber</text>
  <text x="912" y="330" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A">Broadband DIA</text>
  <text x="902" y="412" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A">5G</text>

  <!-- teal annotation -->
  <text x="950" y="640" font-family="Arial, sans-serif" font-size="19" font-style="italic" fill="#1E8C8C" text-anchor="middle">The proof of identity lives in the credential —</text>
  <text x="950" y="666" font-family="Arial, sans-serif" font-size="19" font-style="italic" fill="#1E8C8C" text-anchor="middle">and is path-independent.</text>
</svg>
