  <text x="30" y="371" font-family="Arial,sans-serif" font-size="9.5" fill="#C55A11" text-anchor="start" font-weight="bold">Stage 3 — Safe Attachments (SI-3):</text>
  <text x="225" y="371" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">Action=Block: holds message until detonation completes | Sandboxed VM detonation (5 min observation) | AllowSafeDocsOpen=false | Extends to SharePoint/OneDrive/Teams</text>
  <line x1="25" y1="379" x2="955" y2="379" stroke="#F2F2F2" stroke-width="1"/>
  <text x="30" y="399" font-family="Arial,sans-serif" font-size="9.5" fill="#BF8F00" text-anchor="start" font-weight="bold">Stage 4 — Safe Links:</text>
  <text x="225" y="399" font-family="Arial,sans-serif" font-size="9" fill="#595959" text-anchor="start">All URLs rewritten at delivery time | Re-evaluated at click time against threat intelligence | AllowClickThrough=false (no user bypass) | TrackClicks=true for AU-2</text>
