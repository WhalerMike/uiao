<svg viewBox="0 0 1040 520" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;">
<rect width="1040" height="520" fill="#FFFFFF"/>
<defs>
  <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
  </marker>
  <marker id="arw-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#2E7D32"/>
  </marker>
  <marker id="arw-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#1565C0"/>
  </marker>
  <marker id="arw-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#C00000"/>
  </marker>
  <marker id="arw-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#C55A11"/>
  </marker>
</defs>

<!-- Title -->
<text x="520" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3864">InfoBlox DNS Traffic Control (DTC) — DNS-Based Traffic Steering</text>
<text x="520" y="44" text-anchor="middle" font-size="11" fill="#2E75B6">Health-aware DNS responses route clients to healthy endpoints across on-prem, AWS GovCloud, and Azure Government</text>

<!-- ── DNS Client ── -->
<rect x="20" y="130" width="160" height="90" rx="6" fill="#1F3864"/>
<text x="100" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">DNS Resolver</text>
<text x="100" y="173" text-anchor="middle" font-size="10" fill="#BDD7EE">Agency Workstation</text>
<text x="100" y="190" text-anchor="middle" font-size="9" fill="#9DC3E6">or Cloud Workload</text>
<text x="100" y="208" text-anchor="middle" font-size="9" fill="#9DC3E6">query: api.agency.gov</text>

<!-- DNS Query arrow -->
<line x1="180" y1="163" x2="296" y2="163" stroke="#1565C0" stroke-width="2" marker-end="url(#arw-b)"/>
<text x="238" y="153" text-anchor="middle" font-size="9" fill="#1565C0" font-style="italic">DNS query</text>
<!-- DNS Response arrow (lower) -->
<line x1="296" y1="195" x2="180" y2="195" stroke="#2E7D32" stroke-width="2" marker-end="url(#arw-g)"/>
<text x="238" y="212" text-anchor="middle" font-size="9" fill="#2E7D32" font-style="italic">DNS reply: 10.1.2.3</text>

<!-- ── InfoBlox DTC ── -->
<rect x="300" y="100" width="220" height="150" rx="8" fill="#2E75B6"/>
<text x="410" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">InfoBlox DTC</text>
<text x="410" y="142" text-anchor="middle" font-size="10" fill="#BDD7EE">DNS Traffic Controller</text>
<rect x="316" y="152" width="188" height="28" rx="4" fill="#1F3864"/>
<text x="410" y="170" text-anchor="middle" font-size="9" fill="#FFFFFF">Pool: api.agency.gov</text>
<rect x="316" y="184" width="188" height="22" rx="4" fill="#1F3864"/>
<text x="410" y="199" text-anchor="middle" font-size="9" fill="#9DC3E6">LB Policy: Topology + Failover</text>
<rect x="316" y="210" width="188" height="22" rx="4" fill="#1F3864"/>
<text x="410" y="225" text-anchor="middle" font-size="9" fill="#9DC3E6">TTL: 30s · DNSSEC: enabled</text>

<!-- Health Monitor label -->
<text x="410" y="276" text-anchor="middle" font-size="10" fill="#C55A11" font-style="italic">Health monitors (ICMP · TCP · HTTP/S)</text>
<line x1="360" y1="262" x2="360" y2="285" stroke="#C55A11" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="460" y1="262" x2="460" y2="285" stroke="#C55A11" stroke-width="1.5" stroke-dasharray="4,3"/>

<!-- ── Pool 1: On-Premises (HEALTHY) ── -->
<rect x="620" y="60" width="200" height="100" rx="6" fill="#E8F5E9"/>
<rect x="620" y="60" width="200" height="28" rx="6" fill="#2E7D32"/>
<text x="720" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">On-Premises</text>
<text x="720" y="103" text-anchor="middle" font-size="10" fill="#1B5E20">Grid Member · VMware ESXi</text>
<text x="720" y="119" text-anchor="middle" font-size="10" fill="#1B5E20">10.1.2.3 / api-onprem.agency.gov</text>
<text x="720" y="135" text-anchor="middle" font-size="9" fill="#2E7D32" font-weight="bold">● HEALTHY — Priority 1</text>
<text x="720" y="151" text-anchor="middle" font-size="9" fill="#555">Preferred for on-prem resolvers</text>

<!-- ── Pool 2: AWS GovCloud (HEALTHY) ── -->
<rect x="620" y="200" width="200" height="100" rx="6" fill="#E3F2FD"/>
<rect x="620" y="200" width="200" height="28" rx="6" fill="#1565C0"/>
<text x="720" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">AWS GovCloud</text>
<text x="720" y="243" text-anchor="middle" font-size="10" fill="#0D47A1">ALB · us-gov-west-1</text>
<text x="720" y="259" text-anchor="middle" font-size="10" fill="#0D47A1">52.61.x.x / api-aws.agency.gov</text>
<text x="720" y="275" text-anchor="middle" font-size="9" fill="#1565C0" font-weight="bold">● HEALTHY — Priority 2</text>
<text x="720" y="291" text-anchor="middle" font-size="9" fill="#555">Failover / cloud bursting</text>

<!-- ── Pool 3: Azure Government (UNHEALTHY) ── -->
<rect x="620" y="340" width="200" height="100" rx="6" fill="#FFF3F3"/>
<rect x="620" y="340" width="200" height="28" rx="6" fill="#C00000"/>
<text x="720" y="359" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Azure Government</text>
<text x="720" y="383" text-anchor="middle" font-size="10" fill="#B71C1C">App Gateway · usgovvirginia</text>
<text x="720" y="399" text-anchor="middle" font-size="10" fill="#B71C1C">Endpoint: 52.127.x.x</text>
<text x="720" y="415" text-anchor="middle" font-size="9" fill="#C00000" font-weight="bold">✕ UNHEALTHY — Excluded</text>
<text x="720" y="431" text-anchor="middle" font-size="9" fill="#555">DTC omits from answer set</text>
<!-- Cross-out line on pool 3 -->
<line x1="622" y1="342" x2="818" y2="438" stroke="#C00000" stroke-width="2" opacity="0.3"/>

<!-- Arrows DTC → Pools -->
<!-- DTC to Pool 1 (on-prem) -->
<line x1="520" y1="148" x2="618" y2="110" stroke="#2E7D32" stroke-width="2" marker-end="url(#arw-g)"/>
<text x="574" y="120" text-anchor="middle" font-size="9" fill="#2E7D32">healthy ✓</text>

<!-- DTC to Pool 2 (AWS) -->
<line x1="520" y1="175" x2="618" y2="250" stroke="#1565C0" stroke-width="2" marker-end="url(#arw-b)"/>
<text x="574" y="210" text-anchor="middle" font-size="9" fill="#1565C0">healthy ✓</text>

<!-- DTC to Pool 3 (Azure) — probe shows unhealthy -->
<line x1="520" y1="200" x2="618" y2="380" stroke="#C00000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arw-r)"/>
<text x="574" y="320" text-anchor="middle" font-size="9" fill="#C00000">probe fail ✕</text>

<!-- Legend -->
<rect x="20" y="390" width="560" height="110" rx="6" fill="#F4F6F9" stroke="#DDE3EE" stroke-width="1"/>
<text x="40" y="412" font-size="11" font-weight="bold" fill="#1F3864">How It Works</text>
<text x="40" y="430" font-size="10" fill="#333">1.  Client resolver queries api.agency.gov → routed to nearest/authoritative InfoBlox DTC instance.</text>
<text x="40" y="447" font-size="10" fill="#333">2.  DTC continuously runs ICMP, TCP, and HTTP/S health monitors against each pool member.</text>
<text x="40" y="464" font-size="10" fill="#333">3.  Unhealthy members are removed from the answer set before the response is sent (TTL 30s).</text>
<text x="40" y="481" font-size="10" fill="#333">4.  Topology policy returns on-prem IP to on-prem resolvers; cloud IP to cloud-origin queries.</text>
<text x="40" y="498" font-size="10" fill="#333">5.  DNSSEC signs the steering answer — clients verify the response is authoritative (SC-20).</text>
</svg>
