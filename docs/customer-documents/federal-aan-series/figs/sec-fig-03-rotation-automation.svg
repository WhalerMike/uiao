<svg xmlns="http://www.w3.org/2000/svg" width="950" height="540" font-family="Segoe UI,Arial,sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#595959"/></marker></defs>
<rect width="950" height="540" fill="#F2F2F2"/>
<rect x="0" y="0" width="950" height="50" fill="#1F3864"/>
<text x="475" y="33" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="bold">Secret Rotation Automation — Event-Driven, Sub-5-Minute Completion</text>
<rect x="40" y="80" width="870" height="20" fill="#2E75B6" rx="3"/>
<text x="475" y="95" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="bold">TIMELINE  →  T-30 days: Near-Expiry Warning   |   T: Rotation Trigger   |   T+5 min: Application Uses New Secret</text>
<rect x="30" y="130" width="155" height="120" fill="#2E75B6" rx="5"/>
<text x="107" y="147" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">① KEY VAULT</text>
<text x="107" y="161" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">NEAR-EXPIRY EVENT</text>
<text x="107" y="185" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Secret within 30 days</text>
<text x="107" y="197" text-anchor="middle" fill="#FFFFFF" font-size="8.5">of expiry date</text>
<text x="107" y="209" text-anchor="middle" fill="#FFFFFF" font-size="8.5">SecretNearExpiry event</text>
<text x="107" y="221" text-anchor="middle" fill="#FFFFFF" font-size="8.5">generated automatically</text>
<text x="107" y="233" text-anchor="middle" fill="#FFFFFF" font-size="8.5">by Key Vault</text>
<rect x="215" y="130" width="155" height="120" fill="#1F7391" rx="5"/>
<text x="292" y="147" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">② EVENT GRID</text>
<text x="292" y="161" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">ROUTING</text>
<text x="292" y="185" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Event Grid topic</text>
<text x="292" y="197" text-anchor="middle" fill="#FFFFFF" font-size="8.5">subscription filters</text>
<text x="292" y="209" text-anchor="middle" fill="#FFFFFF" font-size="8.5">event type</text>
<text x="292" y="221" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Routes to Rotation</text>
<text x="292" y="233" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Function endpoint</text>
<rect x="400" y="130" width="175" height="120" fill="#1F3864" rx="5"/>
<text x="487" y="147" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">③ ROTATION FUNCTION</text>
<text x="487" y="161" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">EXECUTES</text>
<text x="487" y="185" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Connects to target system</text>
<text x="487" y="197" text-anchor="middle" fill="#FFFFFF" font-size="8.5">(SQL Server / API / AD)</text>
<text x="487" y="209" text-anchor="middle" fill="#FFFFFF" font-size="8.5">using rotation identity MI</text>
<text x="487" y="221" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Generates new credential</text>
<text x="487" y="233" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Sets on target system</text>
<rect x="605" y="130" width="175" height="120" fill="#375623" rx="5"/>
<text x="692" y="147" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">④ KEY VAULT</text>
<text x="692" y="161" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">UPDATED</text>
<text x="692" y="185" text-anchor="middle" fill="#FFFFFF" font-size="8.5">New version created with</text>
<text x="692" y="197" text-anchor="middle" fill="#FFFFFF" font-size="8.5">new credential value</text>
<text x="692" y="209" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Expiry set: today +</text>
<text x="692" y="221" text-anchor="middle" fill="#FFFFFF" font-size="8.5">rotation period</text>
<text x="692" y="233" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Old version retained</text>
<rect x="810" y="130" width="120" height="120" fill="#C55A11" rx="5"/>
<text x="870" y="147" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">⑤ APPLICATION</text>
<text x="870" y="161" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">PICKS UP</text>
<text x="870" y="185" text-anchor="middle" fill="#FFFFFF" font-size="8.5">GetSecret (no version)</text>
<text x="870" y="197" text-anchor="middle" fill="#FFFFFF" font-size="8.5">returns latest version</text>
<text x="870" y="209" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Key Vault Reference</text>
<text x="870" y="221" text-anchor="middle" fill="#FFFFFF" font-size="8.5">auto-refreshes</text>
<text x="870" y="233" text-anchor="middle" fill="#FFFFFF" font-size="8.5">Zero downtime</text>
<line x1="185" y1="190" x2="215" y2="190" stroke="#595959" stroke-width="2" marker-end="url(#arr)"/>
<line x1="370" y1="190" x2="400" y2="190" stroke="#595959" stroke-width="2" marker-end="url(#arr)"/>
<line x1="575" y1="190" x2="605" y2="190" stroke="#595959" stroke-width="2" marker-end="url(#arr)"/>
<line x1="780" y1="190" x2="810" y2="190" stroke="#595959" stroke-width="2" marker-end="url(#arr)"/>
<rect x="30" y="275" width="890" height="120" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5" rx="5"/>
<rect x="30" y="275" width="890" height="22" fill="#1F3864" rx="5"/>
<text x="475" y="291" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">Rotation Function Internals — Idempotent Design</text>
<text x="45" y="310" fill="#595959" font-size="8.5">1. Get current secret version from Key Vault (rotation identity MI)</text>
<text x="45" y="324" fill="#595959" font-size="8.5">2. Generate new credential value (cryptographically random; complexity-compliant)</text>
<text x="45" y="338" fill="#595959" font-size="8.5">3. SET new credential on target system — SQL: ALTER LOGIN … WITH PASSWORD; API: call /keys/rotate endpoint</text>
<text x="45" y="352" fill="#595959" font-size="8.5">4. If step 3 succeeds → create new Key Vault secret version with new value + new expiry date</text>
<text x="45" y="366" fill="#595959" font-size="8.5">5. After grace period (60 min) → disable old secret version (connection pools drained)</text>
<text x="45" y="380" fill="#595959" font-size="8.5">6. Emit rotation-completed event to Log Analytics → audit record with timestamp, identity, secret name</text>
<rect x="30" y="410" width="435" height="80" fill="#FFFFFF" stroke="#375623" stroke-width="1.5" rx="5"/>
<text x="50" y="430" fill="#375623" font-size="10" font-weight="bold">CM-3: Controlled Change Evidence</text>
<text x="50" y="447" fill="#595959" font-size="9">Key Vault version history = immutable audit record of every rotation</text>
<text x="50" y="461" fill="#595959" font-size="9">Log Analytics: rotation timestamp, calling identity, secret name, result</text>
<text x="50" y="475" fill="#595959" font-size="9">ITSM integration: rotation event → change record with pre/post state</text>
<rect x="485" y="410" width="435" height="80" fill="#FFFFFF" stroke="#C00000" stroke-width="1.5" rx="5"/>
<text x="505" y="430" fill="#C00000" font-size="10" font-weight="bold">Rollback Procedure (if rotation causes failure)</text>
<text x="505" y="447" fill="#595959" font-size="9">1. Re-enable previous secret version in Key Vault</text>
<text x="505" y="461" fill="#595959" font-size="9">2. Application picks up old version (GetSecret returns latest enabled)</text>
<text x="505" y="475" fill="#595959" font-size="9">3. Root cause analysis → fix rotation function → re-trigger</text>
</svg>
