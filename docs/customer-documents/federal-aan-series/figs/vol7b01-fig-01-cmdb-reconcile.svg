<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1A9E8F"/></marker>
    <marker id="arw-up" markerWidth="10" markerHeight="10" refX="4" refY="8" orient="auto"><path d="M0,10 L8,10 L4,0 z" fill="#1A9E8F"/></marker>
  </defs>
  <text x="800" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#1F3A5F">CMDB Reconciliation &amp; Asset Identity (Vol VII Book 01)</text>
  <text x="800" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5A6B7B">The CMDB is a workflow projection — it reconciles to IPAM/DDI, it is never the source of truth</text>
  <text x="49" y="150" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5" fill="#1F3A5F">NAMING &amp; ADDRESSING PLANE — TRUTH (SSOT)</text>
  <rect x="360" y="168" width="880" height="150" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M370,168 h860 a10,10 0 0 1 10,10 v68 h-880 v-68 a10,10 0 0 1 10,-10 z" fill="#1A9E8F"/>
  <text x="800.0" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">AUTHORITATIVE</text>
  <text x="800.0" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="800.0" dy="0.0">IPAM / DDI — Authoritative Asset Identity</tspan>
  </text>
  <text x="800.0" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#2A2A2A">
  <tspan x="800.0" dy="0.0">One authoritative name/address per asset — the CM-8 join key (Vol I</tspan>
  <tspan x="800.0" dy="24.7">Book 01). Every inventory reconciles to it.</tspan>
  </text>
  <text x="49" y="396" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5" fill="#1F3A5F">CLOUD-NATIVE INVENTORY — CONNECTORS POPULATE THE CMDB</text>
  <rect x="120" y="414" width="340" height="140" rx="9" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <text x="290.0" y="444" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F">
  <tspan x="290.0" dy="0.0">M365 / Entra</tspan>
  </text>
  <text x="290.0" y="481.85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="290.0" dy="0.0">Users, groups, licensed services, CA</tspan>
  <tspan x="290.0" dy="21.8">policy objects — via Graph</tspan>
  </text>
  <rect x="630" y="414" width="340" height="140" rx="9" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <text x="800.0" y="444" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F">
  <tspan x="800.0" dy="0.0">Azure</tspan>
  </text>
  <text x="800.0" y="481.85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="800.0" dy="0.0">Subscriptions, VMs, storage, key vaults,</tspan>
  <tspan x="800.0" dy="21.8">policy assignments — via Resource Graph</tspan>
  </text>
  <rect x="1140" y="414" width="340" height="140" rx="9" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <text x="1310.0" y="444" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F">
  <tspan x="1310.0" dy="0.0">Security posture</tspan>
  </text>
  <text x="1310.0" y="481.85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="1310.0" dy="0.0">Defender for Cloud / MDVM findings as</tspan>
  <tspan x="1310.0" dy="21.8">attributes on existing CIs</tspan>
  </text>
  <text x="49" y="632" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5" fill="#1F3A5F">CMDB — COORDINATION PROJECTION</text>
  <rect x="120" y="650" width="760" height="150" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M130,650 h740 a10,10 0 0 1 10,10 v68 h-760 v-68 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="500.0" y="677" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">PROJECTION</text>
  <text x="500.0" y="704" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="500.0" dy="0.0">ServiceNow CMDB</tspan>
  </text>
  <text x="500.0" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#2A2A2A">
  <tspan x="500.0" dy="0.0">Workflow-addressable CI records + relationships. Match on the</tspan>
  <tspan x="500.0" dy="24.7">authoritative key first, cloud resource-id second.</tspan>
  </text>
  <rect x="1000" y="650" width="460" height="150" rx="9" fill="#F4F7FA" stroke="#D4860B" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="1230.0" y="680" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#8A6210">
  <tspan x="1230.0" dy="0.0">Reconcile exception queue</tspan>
  </text>
  <text x="1230.0" y="717.85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="1230.0" dy="0.0">Asset in a cloud but not in IPAM/DDI = a finding: shadow</tspan>
  <tspan x="1230.0" dy="21.8">IT (CM-8, BOD 23-01) or an IPAM gap. Raised, never</tspan>
  <tspan x="1230.0" dy="21.8">absorbed.</tspan>
  </text>



  <line x1="290" y1="558" x2="470" y2="648" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arw-teal)"/>
  <line x1="800" y1="558" x2="560" y2="648" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arw-teal)"/>
  <line x1="1310" y1="558" x2="720" y2="648" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arw-teal)"/>
  <text x="470" y="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5A6B7B">Discovery / Service Graph connectors</text>
  <path d="M500,650 V330" fill="none" stroke="#1A9E8F" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arw-up)"/>
  <text x="516" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1A9E8F">reconcile to the CM-8 key</text>
  <line x1="880" y1="725" x2="1000" y2="725" stroke="#D4860B" stroke-width="2.5" marker-end="url(#arw-teal)"/>
    <rect x="49" y="828" width="1502" height="54" rx="8" fill="#F4F7FA" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="800" y="861" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1F3A5F">The CMDB reconciles to IPAM/DDI; it never becomes the SSOT. Where they disagree, the CMDB is wrong by definition — that disagreement is itself a finding.</text>
</svg>
