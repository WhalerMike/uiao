<svg viewBox="0 0 1040 350" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="350" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs><text x="520" y="30" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">Azure Arc Managed Identity — The Credential-Free SQL Auth Bridge</text><text x="520" y="50" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">Arc provides a cloud-native managed identity — no stored passwords, no domain credential</text><rect x="330" y="70" width="380" height="60" rx="8" fill="#1F3864"/><text x="520" y="95" text-anchor="middle" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF">Azure Arc Agent</text><text x="520" y="113" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">System-assigned Managed Identity (cert rotated 90d, never human-visible)</text><rect x="70" y="160" width="380" height="70" rx="8" fill="#2E75B6"/><text x="260" y="185" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Layer 1 — SQL Engine Entra Auth</text><text x="260" y="203" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">SQL 2022 + Arc + domain-joined Windows Server 2019+</text><line x1="520" y1="132" x2="260" y2="158" stroke="#555" stroke-width="2" marker-end="url(#arw)"/><rect x="590" y="160" width="380" height="70" rx="8" fill="#C55A11"/><text x="780" y="185" text-anchor="middle" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF">Layer 2 — OS Entra Login</text><text x="780" y="203" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#FFFFFF">Requires domain unjoin + Windows Server 2025</text><line x1="520" y1="132" x2="780" y2="158" stroke="#555" stroke-width="2" marker-end="url(#arw)"/><rect x="60" y="250" width="880" height="80" rx="6" fill="#F2F2F2"/><text x="500" y="270" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#1F3864">Why Arc over alternatives</text><text x="160" y="286" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#C00000">gMSA</text><text x="160" y="302" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">re-anchors to AD being retired</text><text x="380" y="286" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#C00000">Vault Service Principal</text><text x="380" y="302" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">stored bootstrap credential</text><text x="600" y="286" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#C55A11">Certificate-Based Auth</text><text x="600" y="302" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">interim only, not long-term</text><text x="820" y="286" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#375623">Arc Managed Identity</text><text x="820" y="302" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">sole credential-free option</text></svg>
