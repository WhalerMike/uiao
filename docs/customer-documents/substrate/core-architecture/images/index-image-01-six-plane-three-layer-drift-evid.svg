  <text x="1116" y="682" font-size="11" fill="#33414F">Six-Plane node</text>
  <rect x="1098" y="688" width="12" height="12" rx="2" fill="#FBEED2" stroke="#D4A017" stroke-width="1"/>
  <text x="1116" y="699" font-size="11" fill="#33414F">Evidence overlay</text>
</svg>
