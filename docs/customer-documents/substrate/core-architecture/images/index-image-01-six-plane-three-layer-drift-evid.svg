<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A66"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="54" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="32" fill="#0D1B2E">Substrate Core Architecture</text>
  <text x="60" y="82" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7A8D">Six-Plane Architecture · Three-Layer Rule Model · Drift Engine · Evidence Chain · Boundary Impact Model</text>

  <!-- ===== THREE-LAYER BRACKET (left side label) ===== -->
  <!-- Layer 3: Policy (top band) -->
  <rect x="40" y="108" width="16" height="180" rx="4" fill="#1E3A66"/>
  <text x="48" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF" transform="rotate(-90 48 198)">LAYER 3 — POLICY</text>

  <!-- Layer 2: Rule (middle band) -->
  <rect x="40" y="298" width="16" height="172" rx="4" fill="#1E8C8C"/>
  <text x="48" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF" transform="rotate(-90 48 384)">LAYER 2 — RULE</text>

  <!-- Layer 1: Fact (bottom band) -->
  <rect x="40" y="480" width="16" height="172" rx="4" fill="#5A5A5A"/>
  <text x="48" y="566" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF" transform="rotate(-90 48 566)">LAYER 1 — FACT</text>

  <!-- ===== SIX PLANES (main grid) ===== -->
  <!-- Column headers -->
  <text x="248" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">S.A.1</text>
  <text x="248" y="116" text-anchor="middle" font-size="11" fill="#6B7A8D">Six-Plane Arch</text>
  <text x="488" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">S.A.2</text>
  <text x="488" y="116" text-anchor="middle" font-size="11" fill="#6B7A8D">Three-Layer Rules</text>
  <text x="728" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">S.A.3</text>
  <text x="728" y="116" text-anchor="middle" font-size="11" fill="#6B7A8D">Drift Engine</text>
  <text x="968" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">S.A.4</text>
  <text x="968" y="116" text-anchor="middle" font-size="11" fill="#6B7A8D">Evidence Chain</text>
  <text x="1148" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">S.A.5</text>
  <text x="1148" y="122" text-anchor="middle" font-size="11" fill="#6B7A8D">Boundary</text>

  <!-- ===== PLANE 1: Governance Plane (Layer 3 / Policy) ===== -->
  <!-- Six-Plane node -->
  <rect x="68" y="118" width="360" height="68" rx="10" fill="#0D1B2E"/>
  <text x="248" y="149" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Plane 1 — Governance</text>
  <text x="248" y="170" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">Policy, Authority, Compliance Mandates</text>

  <!-- Three-Layer Rule node -->
  <rect x="438" y="118" width="300" height="68" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="588" y="149" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">SHALL / MUST rules</text>
  <text x="588" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">Non-negotiable policy assertions</text>

  <!-- Drift Engine node -->
  <rect x="608" y="118" width="240" height="68" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="728" y="149" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Policy Drift Watch</text>
  <text x="728" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">Baseline deviation detection</text>

  <!-- Evidence Chain node -->
  <rect x="848" y="118" width="240" height="68" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="968" y="149" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Governance Evidence</text>
  <text x="968" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">canon/ audit trail, signed commits</text>

  <!-- Boundary node (spans all layers, right col) -->
  <rect x="1088" y="118" width="172" height="530" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1174" y="260" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#0D1B2E">S.A.5</text>
  <text x="1174" y="283" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#0D1B2E">Boundary</text>
  <text x="1174" y="306" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5A5A5A">Impact</text>
  <text x="1174" y="326" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5A5A5A">Model</text>
  <text x="1174" y="370" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6B7A8D">GCC-Moderate</text>
  <text x="1174" y="390" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6B7A8D">boundary</text>
  <text x="1174" y="420" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6B7A8D">enforcement</text>
  <text x="1174" y="460" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6B7A8D">Cross-pillar</text>
  <text x="1174" y="480" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6B7A8D">scope gate</text>

  <!-- ===== PLANE 2: Assessment Plane (Layer 3 / Policy) ===== -->
  <rect x="68" y="198" width="360" height="68" rx="10" fill="#1E3A66"/>
  <text x="248" y="229" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Plane 2 — Assessment</text>
  <text x="248" y="250" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">SCuBA assess · ScubaConnect automate</text>

  <rect x="438" y="198" width="300" height="68" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="588" y="229" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Assessment Rules</text>
  <text x="588" y="250" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">Control applicability criteria</text>

  <rect x="608" y="198" width="240" height="68" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="728" y="229" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Assessment Drift</text>
  <text x="728" y="250" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">AD JSON delta detection</text>

  <rect x="848" y="198" width="240" height="68" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="968" y="229" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Assessment Evidence</text>
  <text x="968" y="250" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">D:\UIAO\Assessment\ JSON</text>

  <!-- ===== PLANE 3: Enforcement Plane (Layer 2 / Rule) ===== -->
  <rect x="68" y="308" width="360" height="68" rx="10" fill="#0D1B2E"/>
  <text x="248" y="339" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Plane 3 — Enforcement</text>
  <text x="248" y="360" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">Git hooks, canon/, UIAO governs</text>

  <rect x="438" y="308" width="300" height="68" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="588" y="339" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">SHOULD / OUGHT rules</text>
  <text x="588" y="360" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">Strong-preference rule layer</text>

  <rect x="608" y="308" width="240" height="68" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="728" y="339" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Enforcement Drift</text>
  <text x="728" y="360" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">Hook bypass / canon deviation</text>

  <rect x="848" y="308" width="240" height="68" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="968" y="339" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Hook Evidence</text>
  <text x="968" y="360" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">git-audit.jsonl, canon-changes.jsonl</text>

  <!-- ===== PLANE 4: Operations Plane (Layer 2 / Rule) ===== -->
  <rect x="68" y="388" width="360" height="68" rx="10" fill="#1E3A66"/>
  <text x="248" y="419" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Plane 4 — Operations</text>
  <text x="248" y="440" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">Scheduled tasks, backup, replication</text>

  <rect x="438" y="388" width="300" height="68" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="588" y="419" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Operational Rules</text>
  <text x="588" y="440" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">RPO/RTO, retention, encryption</text>

  <rect x="608" y="388" width="240" height="68" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="728" y="419" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Ops Drift</text>
  <text x="728" y="440" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">Scheduled task / backup staleness</text>

  <rect x="848" y="388" width="240" height="68" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="968" y="419" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Ops Evidence</text>
  <text x="968" y="440" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">backup.log, manifest JSON</text>

  <!-- ===== PLANE 5: Data Plane (Layer 1 / Fact) ===== -->
  <rect x="68" y="490" width="360" height="68" rx="10" fill="#0D1B2E"/>
  <text x="248" y="521" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Plane 5 — Data</text>
  <text x="248" y="542" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">Gitea DB, Git repos, AD assessment</text>

  <rect x="438" y="490" width="300" height="68" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="588" y="521" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Data-Layer Rules</text>
  <text x="588" y="542" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">Integrity, schema, retention facts</text>

  <rect x="608" y="490" width="240" height="68" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="728" y="521" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Data Drift</text>
  <text x="728" y="542" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">gitea.db corruption / repo fsck</text>

  <rect x="848" y="490" width="240" height="68" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="968" y="521" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Data Evidence</text>
  <text x="968" y="542" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">SHA-256 manifests, PRAGMA check</text>

  <!-- ===== PLANE 6: Identity Plane (Layer 1 / Fact) ===== -->
  <rect x="68" y="570" width="360" height="68" rx="10" fill="#1E3A66"/>
  <text x="248" y="601" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Plane 6 — Identity</text>
  <text x="248" y="622" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">AD/LDAP, Entra ID, svc-gitea</text>

  <rect x="438" y="570" width="300" height="68" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="588" y="601" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Identity Rules</text>
  <text x="588" y="622" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">AuthN/AuthZ assertions</text>

  <rect x="608" y="570" width="240" height="68" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="728" y="601" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Identity Drift</text>
  <text x="728" y="622" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">AD assessment delta, privilege change</text>

  <rect x="848" y="570" width="240" height="68" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="968" y="601" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Identity Evidence</text>
  <text x="968" y="622" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A">git-audit.jsonl sign-in records</text>

  <!-- ===== VERTICAL FLOW ARROWS (Six-Plane column) ===== -->
  <line x1="248" y1="186" x2="248" y2="196" stroke="#1E3A66" stroke-width="2" marker-end="url(#arrow-navy)"/>
  <line x1="248" y1="266" x2="248" y2="296" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <line x1="248" y1="376" x2="248" y2="386" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <line x1="248" y1="456" x2="248" y2="478" stroke="#5A5A5A" stroke-width="2" marker-end="url(#arrow-navy)"/>
  <line x1="248" y1="558" x2="248" y2="568" stroke="#5A5A5A" stroke-width="2" marker-end="url(#arrow-navy)"/>

  <!-- ===== Two-Way Governance footnote band ===== -->
  <rect x="68" y="652" width="1000" height="46" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="568" y="668" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">S.A.6 — Two-Way Governance</text>
  <text x="568" y="686" text-anchor="middle" font-size="12" fill="#1E8C8C">SCuBA assesses  ·  ScubaConnect automates  ·  UIAO governs  (applied across all six planes)</text>

