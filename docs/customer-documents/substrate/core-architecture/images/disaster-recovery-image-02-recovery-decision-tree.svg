<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="50" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30" fill="#0D1B2E">Recovery Decision Tree</text>
  <text x="60" y="72" font-size="14" fill="#6B7A8D">Incident Detected → Classify Severity → Match Scenario → Execute Runbook → Validate → Post-Incident Review</text>

  <!-- ================================================================ -->
  <!-- NODE 1: INCIDENT DETECTED (top centre) -->
  <!-- ================================================================ -->
  <rect x="490" y="90" width="300" height="56" rx="10" fill="#0D1B2E"/>
  <text x="640" y="113" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Incident Detected</text>
  <text x="640" y="133" text-anchor="middle" font-size="12" fill="#D7F2EE">monitoring alert · user report · scheduled check failure</text>

  <!-- Arrow down to classify diamond -->
  <line x1="640" y1="146" x2="640" y2="172" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- ================================================================ -->
  <!-- DIAMOND 1: CLASSIFY SEVERITY -->
  <!-- ================================================================ -->
  <!-- diamond drawn as polygon centred at (640, 200) w=180 h=52 -->
  <polygon points="640,172 730,200 640,228 550,200" fill="#1E3A66" stroke="#D7F2EE" stroke-width="1"/>
  <text x="640" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Classify</text>
  <text x="640" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Severity</text>

  <!-- ================================================================ -->
  <!-- BRANCH: Unauthorized access? → immediately Scenario 5 -->
  <!-- ================================================================ -->
  <!-- arrow right from diamond to "security breach?" check -->
  <line x1="730" y1="200" x2="820" y2="200" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="773" y="192" text-anchor="middle" font-size="11" fill="#C0392B">evidence of</text>
  <text x="773" y="206" text-anchor="middle" font-size="11" fill="#C0392B">unauth access?</text>
  <rect x="820" y="174" width="200" height="52" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="920" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">Scenario 5</text>
  <text x="920" y="214" text-anchor="middle" font-size="12" fill="#C0392B">Unauthorized Access</text>
  <text x="920" y="230" text-anchor="middle" font-size="11" fill="#C0392B">→ containment immediately</text>

  <!-- ================================================================ -->
  <!-- BRANCH LEFT: P1 (arrow down-left from diamond) -->
  <!-- ================================================================ -->
  <line x1="595" y1="215" x2="250" y2="265" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="390" y="236" text-anchor="middle" font-size="11" fill="#C0392B">Platform completely</text>
  <text x="390" y="250" text-anchor="middle" font-size="11" fill="#C0392B">unreachable → P1</text>

  <!-- P1 BLOCK -->
  <rect x="60" y="265" width="380" height="56" rx="10" fill="#C0392B"/>
  <text x="250" y="288" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">P1 — CRITICAL</text>
  <text x="250" y="308" text-anchor="middle" font-size="12" fill="#FFFFFF">Immediate containment · notify within 15 min</text>

  <!-- Arrow down from P1 block to P1 scenario diamond -->
  <line x1="250" y1="321" x2="250" y2="345" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- DIAMOND 2: P1 Scenario Identification -->
  <polygon points="250,345 360,375 250,405 140,375" fill="#C0392B" stroke="#F7E2DE" stroke-width="1"/>
  <text x="250" y="371" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Identify</text>
  <text x="250" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Scenario</text>

  <!-- P1 Scenario branches -->
  <!-- Scenario 1 -->
  <line x1="140" y1="375" x2="60" y2="375" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="60" y1="375" x2="60" y2="440" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="20" y="440" width="160" height="64" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="100" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">Scenario 1</text>
  <text x="100" y="479" text-anchor="middle" font-size="11" fill="#C0392B">Complete</text>
  <text x="100" y="494" text-anchor="middle" font-size="11" fill="#C0392B">Server Loss</text>
  <text x="60" y="430" text-anchor="middle" font-size="10" fill="#C0392B">server</text>
  <text x="60" y="441" text-anchor="middle" font-size="10" fill="#C0392B">unreachable</text>

  <!-- Scenario 2 -->
  <line x1="200" y1="405" x2="200" y2="440" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="140" y="440" width="160" height="64" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="220" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">Scenario 2</text>
  <text x="220" y="479" text-anchor="middle" font-size="11" fill="#C0392B">Gitea DB</text>
  <text x="220" y="494" text-anchor="middle" font-size="11" fill="#C0392B">Corruption</text>
  <text x="200" y="428" text-anchor="middle" font-size="10" fill="#C0392B">UI broken</text>
  <text x="200" y="440" text-anchor="middle" font-size="10" fill="#C0392B">repos OK</text>

  <!-- Scenario 3 -->
  <line x1="250" y1="405" x2="250" y2="440" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="310" y="440" width="160" height="64" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="390" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">Scenario 3</text>
  <text x="390" y="479" text-anchor="middle" font-size="11" fill="#C0392B">Git Repo</text>
  <text x="390" y="494" text-anchor="middle" font-size="11" fill="#C0392B">Corruption</text>
  <text x="296" y="428" text-anchor="middle" font-size="10" fill="#C0392B">Git ops</text>
  <text x="296" y="440" text-anchor="middle" font-size="10" fill="#C0392B">failing</text>

  <!-- Scenario 4 -->
  <line x1="340" y1="375" x2="440" y2="375" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="440" y1="375" x2="440" y2="440" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="380" y="440" width="160" height="64" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="460" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">Scenario 4</text>
  <text x="460" y="479" text-anchor="middle" font-size="11" fill="#C0392B">TLS Certificate</text>
  <text x="460" y="494" text-anchor="middle" font-size="11" fill="#C0392B">Expiry/Compromise</text>
  <text x="410" y="366" text-anchor="middle" font-size="10" fill="#C0392B">HTTPS</text>
  <text x="410" y="378" text-anchor="middle" font-size="10" fill="#C0392B">broken</text>

  <!-- ================================================================ -->
  <!-- BRANCH CENTRE-DOWN: P2 (arrow straight down from classify diamond) -->
  <!-- ================================================================ -->
  <line x1="640" y1="228" x2="640" y2="265" stroke="#D4A017" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="660" y="252" font-size="11" fill="#D4A017">specific service</text>
  <text x="660" y="265" font-size="11" fill="#D4A017">degraded → P2</text>

  <!-- P2 BLOCK -->
  <rect x="490" y="265" width="300" height="56" rx="10" fill="#D4A017"/>
  <text x="640" y="288" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">P2 — HIGH</text>
  <text x="640" y="308" text-anchor="middle" font-size="12" fill="#FFFFFF">Scheduled response · notify within 2 hr</text>

  <!-- Arrow down from P2 block -->
  <line x1="640" y1="321" x2="640" y2="345" stroke="#D4A017" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- DIAMOND 3: P2 Scenario Identification -->
  <polygon points="640,345 750,375 640,405 530,375" fill="#D4A017" stroke="#FBEED2" stroke-width="1"/>
  <text x="640" y="371" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Identify</text>
  <text x="640" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Scenario</text>

  <!-- P2 Scenario branches -->
  <!-- Scenario 6 -->
  <line x1="560" y1="390" x2="560" y2="440" stroke="#D4A017" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="490" y="440" width="160" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="570" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#D4A017">Scenario 6</text>
  <text x="570" y="479" text-anchor="middle" font-size="11" fill="#5A5A5A">Assessment</text>
  <text x="570" y="494" text-anchor="middle" font-size="11" fill="#5A5A5A">Data Loss</text>
  <text x="534" y="426" text-anchor="middle" font-size="10" fill="#D4A017">AD data</text>
  <text x="534" y="438" text-anchor="middle" font-size="10" fill="#D4A017">missing</text>

  <!-- Scenario 7 -->
  <line x1="640" y1="405" x2="640" y2="440" stroke="#D4A017" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="658" y="440" width="160" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="738" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#D4A017">Scenario 7</text>
  <text x="738" y="479" text-anchor="middle" font-size="11" fill="#5A5A5A">IIS Reverse</text>
  <text x="738" y="494" text-anchor="middle" font-size="11" fill="#5A5A5A">Proxy Failure</text>
  <text x="650" y="426" text-anchor="middle" font-size="10" fill="#D4A017">IIS down</text>
  <text x="650" y="438" text-anchor="middle" font-size="10" fill="#D4A017">:3000 works</text>

  <!-- Scenario 8 -->
  <line x1="720" y1="390" x2="720" y2="440" stroke="#D4A017" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="826" y="440" width="160" height="64" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="906" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#D4A017">Scenario 8</text>
  <text x="906" y="479" text-anchor="middle" font-size="11" fill="#5A5A5A">Replication</text>
  <text x="906" y="494" text-anchor="middle" font-size="11" fill="#5A5A5A">Failure</text>
  <text x="755" y="426" text-anchor="middle" font-size="10" fill="#D4A017">mirror not</text>
  <text x="755" y="438" text-anchor="middle" font-size="10" fill="#D4A017">syncing</text>
  <line x1="750" y1="375" x2="826" y2="462" stroke="#D4A017" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- ================================================================ -->
  <!-- BRANCH RIGHT: P3/P4 (arrow right from classify diamond) -->
  <!-- ================================================================ -->
  <line x1="550" y1="215" x2="1080" y2="290" stroke="#5A5A5A" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <text x="840" y="240" text-anchor="middle" font-size="11" fill="#5A5A5A">non-blocking → P3/P4</text>

  <!-- P3/P4 BLOCK -->
  <rect x="1000" y="290" width="250" height="70" rx="10" fill="#5A5A5A"/>
  <text x="1125" y="313" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">P3/P4 — LOW</text>
  <text x="1125" y="331" text-anchor="middle" font-size="12" fill="#FFFFFF">Log · document · schedule</text>
  <text x="1125" y="349" text-anchor="middle" font-size="11" fill="#D7F2EE">P3: remediate within business day</text>

  <!-- Novel scenario branch from P2 diamond -->
  <line x1="750" y1="375" x2="1000" y2="400" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-grey)"/>
  <text x="868" y="380" text-anchor="middle" font-size="10" fill="#6B7A8D">novel / no scenario match</text>
  <rect x="1000" y="400" width="250" height="64" rx="8" fill="#EAF1FB" stroke="#5A5A5A" stroke-width="2"/>
  <text x="1125" y="422" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Ad-hoc Response</text>
  <text x="1125" y="440" text-anchor="middle" font-size="11" fill="#5A5A5A">Not matching Scenarios 1–8</text>
  <text x="1125" y="456" text-anchor="middle" font-size="11" fill="#5A5A5A">Mandatory documentation required</text>

  <!-- ================================================================ -->
  <!-- EXECUTE RUNBOOK (bottom centre) -->
  <!-- ================================================================ -->
  <!-- collect all scenario outputs into Execute Runbook -->
  <!-- vertical collect line at x=640, y=530 -->
  <line x1="100" y1="504" x2="100" y2="560" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="220" y1="504" x2="220" y2="560" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="390" y1="504" x2="390" y2="560" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="460" y1="504" x2="460" y2="560" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="570" y1="504" x2="570" y2="560" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="738" y1="504" x2="738" y2="560" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="906" y1="504" x2="906" y2="560" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="4 2"/>
  <!-- horizontal collector -->
  <line x1="100" y1="560" x2="906" y2="560" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="4 2"/>
  <!-- drop to Execute Runbook -->
  <line x1="503" y1="560" x2="503" y2="578" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Execute Runbook node -->
  <rect x="353" y="578" width="300" height="54" rx="10" fill="#1E3A66"/>
  <text x="503" y="600" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Execute Runbook</text>
  <text x="503" y="620" text-anchor="middle" font-size="12" fill="#D7F2EE">Section 5 · matched scenario (1–8)</text>

  <!-- Arrow right → Validate Recovery -->
  <line x1="653" y1="605" x2="710" y2="605" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Validate Recovery node -->
  <rect x="710" y="578" width="260" height="54" rx="10" fill="#1E8C8C"/>
  <text x="840" y="600" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Validate Recovery</text>
  <text x="840" y="620" text-anchor="middle" font-size="12" fill="#FFFFFF">Section 8 · 20-item checklist</text>

  <!-- Arrow right → Post-Incident Review -->
  <line x1="970" y1="605" x2="1025" y2="605" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Post-Incident Review node -->
  <rect x="1025" y="578" width="230" height="54" rx="10" fill="#0D1B2E"/>
  <text x="1140" y="598" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Post-Incident</text>
  <text x="1140" y="614" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Review</text>
  <text x="1140" y="630" text-anchor="middle" font-size="11" fill="#D7F2EE">within 5 biz days (P1/P2) § 9.4</text>

  <!-- ================================================================ -->
  <!-- LEGEND bottom-left -->
  <!-- ================================================================ -->
  <rect x="60" y="648" width="280" height="60" rx="6" fill="#F7F7F7" stroke="#E3E8EF" stroke-width="1"/>
  <rect x="72" y="659" width="14" height="12" rx="2" fill="#C0392B"/>
  <text x="92" y="670" font-size="11" fill="#33414F">P1 Critical — immediate</text>
  <rect x="72" y="677" width="14" height="12" rx="2" fill="#D4A017"/>
  <text x="92" y="688" font-size="11" fill="#33414F">P2 High — scheduled response</text>
  <rect x="172" y="677" width="14" height="12" rx="2" fill="#5A5A5A"/>
  <text x="192" y="688" font-size="11" fill="#33414F">P3/P4 Low</text>
  <rect x="72" y="695" width="14" height="12" rx="2" fill="#1E8C8C"/>
  <text x="92" y="706" font-size="11" fill="#33414F">Runbook → Validate → Review</text>

  <!-- S.A. ref bottom right -->
  <text x="1240" y="708" text-anchor="end" font-size="11" fill="#6B7A8D">UIAO DR Playbook v1.0  ·  Scenarios 1–8  ·  § 10</text>
</svg>
