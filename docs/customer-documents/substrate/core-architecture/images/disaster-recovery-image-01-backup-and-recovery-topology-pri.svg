<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A66"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="54" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="32" fill="#0D1B2E">Backup and Recovery Topology</text>
  <text x="60" y="80" font-size="15" fill="#6B7A8D">Primary server · Active-passive replica · GitHub mirror — with RPO/RTO overlays</text>

  <!-- ================================================================ -->
  <!-- PRIMARY SERVER (centre-left) -->
  <!-- ================================================================ -->
  <rect x="60" y="108" width="340" height="310" rx="10" fill="#0D1B2E"/>
  <!-- header -->
  <text x="230" y="136" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Primary Server</text>
  <text x="230" y="156" text-anchor="middle" font-size="13" fill="#D7F2EE">git.uiao.local · Windows Server 2025</text>

  <!-- Gitea Application -->
  <rect x="76" y="170" width="308" height="48" rx="6" fill="#1E3A66"/>
  <text x="230" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Gitea Application Server</text>
  <text x="230" y="208" text-anchor="middle" font-size="12" fill="#D7F2EE">v1.26.0 · port 3000 · svc-gitea</text>

  <!-- IIS Reverse Proxy -->
  <rect x="76" y="226" width="308" height="40" rx="6" fill="#1E3A66"/>
  <text x="230" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">IIS Reverse Proxy</text>
  <text x="230" y="260" text-anchor="middle" font-size="12" fill="#D7F2EE">ARR + URL Rewrite · HTTPS:443</text>

  <!-- Git Repos -->
  <rect x="76" y="274" width="148" height="40" rx="6" fill="#2E75B6"/>
  <text x="150" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Git Repos</text>
  <text x="150" y="308" text-anchor="middle" font-size="11" fill="#D7F2EE">D:\GitRepos\</text>

  <!-- Gitea DB -->
  <rect x="236" y="274" width="148" height="40" rx="6" fill="#2E75B6"/>
  <text x="310" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Gitea DB</text>
  <text x="310" y="308" text-anchor="middle" font-size="11" fill="#D7F2EE">gitea.db · SQLite</text>

  <!-- AD Assessment JSON -->
  <rect x="76" y="322" width="148" height="40" rx="6" fill="#1E3A66"/>
  <text x="150" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">AD Assessment</text>
  <text x="150" y="356" text-anchor="middle" font-size="11" fill="#D7F2EE">D:\UIAO\Assessment\</text>

  <!-- TLS Certs -->
  <rect x="236" y="322" width="148" height="40" rx="6" fill="#1E3A66"/>
  <text x="310" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">TLS Certificates</text>
  <text x="310" y="356" text-anchor="middle" font-size="11" fill="#D7F2EE">git.uiao.local / docs</text>

  <!-- Git Hooks -->
  <rect x="76" y="370" width="148" height="38" rx="6" fill="#1E3A66"/>
  <text x="150" y="389" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Git Hooks</text>
  <text x="150" y="403" text-anchor="middle" font-size="11" fill="#D7F2EE">pre/post-receive · update</text>

  <!-- Audit Logs -->
  <rect x="236" y="370" width="148" height="38" rx="6" fill="#1E3A66"/>
  <text x="310" y="389" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Audit Logs</text>
  <text x="310" y="403" text-anchor="middle" font-size="11" fill="#D7F2EE">git-audit.jsonl · JSONL</text>

  <!-- ================================================================ -->
  <!-- LOCAL BACKUP STAGING (below primary) -->
  <!-- ================================================================ -->
  <rect x="60" y="438" width="340" height="90" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="230" y="460" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Local Backup Staging</text>
  <text x="230" y="478" text-anchor="middle" font-size="12" fill="#5A5A5A">D:\UIAO\Backups\  ·  Invoke-UIAOBackup.ps1</text>
  <text x="230" y="496" text-anchor="middle" font-size="12" fill="#5A5A5A">Gitea DB (hourly VSS)  ·  Config (daily 02:00)</text>
  <text x="230" y="513" text-anchor="middle" font-size="12" fill="#5A5A5A">Certs (on-change)  ·  Manifest JSON (SHA-256)</text>

  <!-- arrow: Primary → Local Staging -->
  <line x1="230" y1="418" x2="230" y2="435" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- ================================================================ -->
  <!-- SECONDARY SERVER / ACTIVE-PASSIVE REPLICA (right of primary) -->
  <!-- ================================================================ -->
  <rect x="480" y="108" width="300" height="200" rx="10" fill="#1E3A66"/>
  <text x="630" y="136" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Secondary Server</text>
  <text x="630" y="156" text-anchor="middle" font-size="13" fill="#D7F2EE">git-dr.uiao.local</text>
  <text x="630" y="174" text-anchor="middle" font-size="12" fill="#D7F2EE">Active-Passive Hot Standby (ADR-090)</text>

  <!-- Git Mirror -->
  <rect x="496" y="188" width="268" height="44" rx="6" fill="#0D1B2E"/>
  <text x="630" y="207" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Git Repo Mirror</text>
  <text x="630" y="224" text-anchor="middle" font-size="12" fill="#D7F2EE">git push --mirror · SSH transport</text>

  <!-- Gitea Instance -->
  <rect x="496" y="240" width="268" height="44" rx="6" fill="#0D1B2E"/>
  <text x="630" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Gitea Instance (secondary)</text>
  <text x="630" y="276" text-anchor="middle" font-size="12" fill="#D7F2EE">Quorum-gated promotion · fenced</text>

  <!-- RPO/RTO badge for secondary -->
  <rect x="496" y="292" width="268" height="36" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="630" y="307" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">RPO: ~0 (real-time)  ·  RTO: 30 min</text>
  <text x="630" y="322" text-anchor="middle" font-size="11" fill="#5A5A5A">P1 Critical · post-receive hook trigger</text>

  <!-- arrow: Primary → Secondary (real-time mirror) -->
  <line x1="400" y1="232" x2="476" y2="232" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="438" y="222" text-anchor="middle" font-size="11" fill="#1E8C8C">SSH · git push</text>
  <text x="438" y="236" text-anchor="middle" font-size="10" fill="#6B7A8D">real-time on push</text>

  <!-- ================================================================ -->
  <!-- NETWORK SHARE BACKUP (below secondary) -->
  <!-- ================================================================ -->
  <rect x="480" y="340" width="300" height="100" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="630" y="364" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Network Share Backup</text>
  <text x="630" y="382" text-anchor="middle" font-size="12" fill="#5A5A5A">\\backup-server\UIAO\</text>
  <text x="630" y="400" text-anchor="middle" font-size="12" fill="#5A5A5A">SMB 3.0 enc · AES-256 (WSB) · 30-day retain</text>
  <text x="630" y="418" text-anchor="middle" font-size="12" fill="#5A5A5A">DB (hourly) · Config (daily) · Certs (on-change)</text>
  <text x="630" y="433" text-anchor="middle" font-size="11" fill="#6B7A8D">Weekly full + daily incremental Windows Server Backup</text>

  <!-- arrow: Local Staging → Network Share -->
  <line x1="400" y1="483" x2="476" y2="390" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="430" y="450" text-anchor="middle" font-size="11" fill="#1E8C8C">SMB</text>

  <!-- ================================================================ -->
  <!-- GITHUB MIRROR (far right) -->
  <!-- ================================================================ -->
  <rect x="870" y="108" width="340" height="180" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1040" y="136" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">GitHub Mirror</text>
  <text x="1040" y="156" text-anchor="middle" font-size="13" fill="#5A5A5A">github.com/WhalerMike/uiao</text>
  <text x="1040" y="174" text-anchor="middle" font-size="12" fill="#6B7A8D">Off-site · geographically distributed</text>

  <!-- Mirror detail -->
  <rect x="886" y="186" width="308" height="40" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="1040" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">git push --mirror · HTTPS transport</text>
  <text x="1040" y="220" text-anchor="middle" font-size="11" fill="#5A5A5A">uiao repo only · no sensitive data committed</text>

  <!-- RPO/RTO badge for GitHub -->
  <rect x="886" y="234" width="308" height="36" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1"/>
  <text x="1040" y="249" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">RPO: ~0 (real-time)  ·  RTO: 30 min</text>
  <text x="1040" y="265" text-anchor="middle" font-size="11" fill="#5A5A5A">Fallback for uiao repo · full history retained</text>

  <!-- arrow: Primary → GitHub (real-time mirror) -->
  <line x1="400" y1="165" x2="866" y2="165" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow-teal)"/>
  <text x="634" y="156" text-anchor="middle" font-size="11" fill="#1E8C8C">HTTPS · git push --mirror (real-time on push)</text>

  <!-- ================================================================ -->
  <!-- CERTIFICATE BACKUP (far right, lower) -->
  <!-- ================================================================ -->
  <rect x="870" y="320" width="340" height="118" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1040" y="344" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Certificate Backup</text>
  <text x="1040" y="362" text-anchor="middle" font-size="12" fill="#5A5A5A">\\backup-server\UIAO\certs\</text>
  <text x="1040" y="380" text-anchor="middle" font-size="12" fill="#5A5A5A">PFX · password-protected · last 5 versions</text>
  <text x="1040" y="398" text-anchor="middle" font-size="12" fill="#5A5A5A">SMB encryption required</text>
  <rect x="886" y="406" width="308" height="24" rx="4" fill="#FBEED2" stroke="#D4A017" stroke-width="1"/>
  <text x="1040" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">RPO: on-change  ·  RTO: 30 min  ·  P1</text>

  <!-- arrow: Network Share → Certificate Backup -->
  <line x1="780" y1="390" x2="866" y2="390" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="823" y="382" text-anchor="middle" font-size="10" fill="#6B7A8D">SMB</text>

  <!-- ================================================================ -->
  <!-- SCHEDULED TASKS / ORCHESTRATOR (bottom centre) -->
  <!-- ================================================================ -->
  <rect x="480" y="464" width="680" height="64" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="820" y="487" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Invoke-UIAOBackup.ps1  —  Master Orchestrator  (\\UIAO\ · daily 02:00)</text>
  <text x="820" y="507" text-anchor="middle" font-size="12" fill="#5A5A5A">Backup-UIAOGiteaDB · Backup-UIAORepositories · Backup-UIAOCertificates · Backup-UIAOConfig</text>
  <text x="820" y="522" text-anchor="middle" font-size="11" fill="#6B7A8D">Generates SHA-256 manifest JSON · sends webhook notification · exit 0 on success</text>

  <!-- arrow: Local Staging → Orchestrator -->
  <line x1="230" y1="528" x2="478" y2="497" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- ================================================================ -->
  <!-- RECOVERY PRIORITY LEGEND (bottom) -->
  <!-- ================================================================ -->
  <rect x="60" y="560" width="400" height="140" rx="8" fill="#F7F7F7" stroke="#E3E8EF" stroke-width="1"/>
  <text x="260" y="582" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Recovery Objectives (Disaster Recovery floor)</text>

  <rect x="76" y="594" width="10" height="10" rx="2" fill="#C0392B"/>
  <text x="92" y="604" font-size="12" fill="#33414F">P1 Critical: Git Repos RPO 0 · RTO 30 min</text>
  <rect x="76" y="612" width="10" height="10" rx="2" fill="#C0392B"/>
  <text x="92" y="622" font-size="12" fill="#33414F">P1 Critical: Gitea DB RPO 1 hr · RTO 1 hr</text>
  <rect x="76" y="630" width="10" height="10" rx="2" fill="#C0392B"/>
  <text x="92" y="640" font-size="12" fill="#33414F">P1 Critical: TLS Certs RPO on-change · RTO 30 min</text>
  <rect x="76" y="648" width="10" height="10" rx="2" fill="#D4A017"/>
  <text x="92" y="658" font-size="12" fill="#33414F">P2 High: IIS Config RPO 24 hr · RTO 1 hr</text>
  <rect x="76" y="666" width="10" height="10" rx="2" fill="#5A5A5A"/>
  <text x="92" y="676" font-size="12" fill="#33414F">P3 Important: OS Backup RPO weekly · RTO 8 hr</text>
  <text x="260" y="694" text-anchor="middle" font-size="10" fill="#6B7A8D">HA failover (ADR-090) provides faster path for node/disk/network failures</text>

  <!-- ================================================================ -->
  <!-- BACKUP VERIFICATION NOTE (bottom right) -->
  <!-- ================================================================ -->
  <rect x="490" y="560" width="670" height="140" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1"/>
  <text x="825" y="582" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Backup Verification (automated after each cycle)</text>
  <text x="510" y="602" font-size="12" fill="#33414F">DB: sqlite3 PRAGMA integrity_check on restored copy</text>
  <text x="510" y="620" font-size="12" fill="#33414F">Git mirrors: compare HEAD ref + commit count (primary vs secondary)</text>
  <text x="510" y="638" font-size="12" fill="#33414F">Config: Test-Path + file count comparison against manifest</text>
  <text x="510" y="656" font-size="12" fill="#33414F">Certs: Get-PfxData non-destructive import verify</text>
  <text x="510" y="674" font-size="12" fill="#33414F">Manifest: SHA-256 checksums verified before marking cycle complete</text>
  <text x="510" y="692" font-size="12" fill="#33414F">Audit logs: append-only JSONL · daily archive · 1-year retention</text>
</svg>
