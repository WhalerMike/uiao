<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A66"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="54" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">UIAO Dual-Remote Repository Architecture</text>
  <text x="60" y="82" font-size="16" fill="#6B7A8D">DIAG-001 — Gitea primary (origin) + GitHub mirror (github) with push/sync flows</text>
  <line x1="60" y1="95" x2="1220" y2="95" stroke="#E3E8EF" stroke-width="1"/>

  <!-- LOCAL WORKSPACE node -->
  <rect x="60" y="218" width="290" height="308" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="205" y="248" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Local Workspace</text>
  <text x="205" y="268" text-anchor="middle" font-size="13" fill="#5A5A5A">C:\Users\whale\git\uiao</text>
  <rect x="84" y="282" width="242" height="58" rx="8" fill="#0D1B2E"/>
  <text x="205" y="309" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Working Tree</text>
  <text x="205" y="329" text-anchor="middle" font-size="12" fill="#D7F2EE">feature/* branches</text>
  <text x="78" y="366" font-size="13" fill="#33414F">Remotes configured:</text>
  <text x="78" y="386" font-size="13" fill="#1E8C8C" font-family="Consolas, 'DejaVu Sans Mono', monospace">origin  → git.uiao.local</text>
  <text x="78" y="406" font-size="13" fill="#5A5A5A" font-family="Consolas, 'DejaVu Sans Mono', monospace">github → github.com/...</text>
  <text x="78" y="434" font-size="12" fill="#5A5A5A">git remote add github</text>
  <text x="78" y="452" font-size="12" fill="#5A5A5A">  https://github.com/WhalerMike/uiao.git</text>
  <text x="205" y="514" text-anchor="middle" font-size="12" fill="#D4A017" font-weight="bold">git config: user Michael Stratton</text>

  <!-- GITEA PRIMARY node -->
  <rect x="490" y="138" width="320" height="316" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="650" y="168" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Gitea Primary</text>
  <text x="650" y="190" text-anchor="middle" font-size="13" fill="#5A5A5A" font-weight="bold">origin</text>
  <rect x="514" y="203" width="272" height="82" rx="8" fill="#0D1B2E"/>
  <text x="650" y="237" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Gitea v1.26.0</text>
  <text x="650" y="261" text-anchor="middle" font-size="13" fill="#1E8C8C">git.uiao.local / UIAO/uiao</text>
  <text x="510" y="306" font-size="13" fill="#33414F">Canonical source of truth</text>
  <text x="510" y="326" font-size="13" fill="#33414F">All feature branches live here</text>
  <text x="510" y="346" font-size="13" fill="#33414F">Branch protection on main</text>
  <text x="510" y="366" font-size="13" fill="#33414F">LDAP auth via Active Directory</text>
  <text x="510" y="386" font-size="13" fill="#33414F">IIS reverse proxy (:443 → :3000)</text>
  <text x="510" y="412" font-size="12" fill="#D4A017" font-weight="bold">API: https://git.uiao.local/api/v1/</text>
  <rect x="514" y="423" width="272" height="18" rx="4" fill="#1E3A66"/>
  <text x="650" y="436" text-anchor="middle" font-size="11" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">org: UIAO  |  repo: uiao  |  branch: main</text>

  <!-- GITHUB SECONDARY node -->
  <rect x="490" y="493" width="320" height="196" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="650" y="522" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">GitHub Secondary</text>
  <text x="650" y="544" text-anchor="middle" font-size="13" fill="#5A5A5A" font-weight="bold">github (mirror)</text>
  <rect x="514" y="557" width="272" height="70" rx="8" fill="#1E3A66"/>
  <text x="650" y="585" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">github.com/WhalerMike/uiao</text>
  <text x="650" y="607" text-anchor="middle" font-size="12" fill="#D7F2EE">main branch only</text>
  <text x="510" y="645" font-size="13" fill="#33414F">Read-only mirror — no feature work</text>
  <text x="510" y="664" font-size="13" fill="#33414F">Sync: every 6h via UIAO-GitHubSync</text>

  <!-- WORKFLOW STEPS column -->
  <rect x="882" y="138" width="348" height="551" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="1056" y="166" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Standard Contribution Workflow</text>

  <!-- Step boxes -->
  <rect x="900" y="180" width="312" height="44" rx="6" fill="#0D1B2E"/>
  <text x="910" y="197" font-size="13" font-weight="bold" fill="#1E8C8C">1. Sync</text>
  <text x="910" y="214" font-size="12" fill="#FFFFFF">git fetch origin; git pull origin main</text>

  <rect x="900" y="232" width="312" height="44" rx="6" fill="#1E3A66"/>
  <text x="910" y="249" font-size="13" font-weight="bold" fill="#D7F2EE">2. Branch</text>
  <text x="910" y="266" font-size="12" fill="#FFFFFF">git checkout -b feature/UIAO-NNN-desc</text>

  <rect x="900" y="284" width="312" height="44" rx="6" fill="#0D1B2E"/>
  <text x="910" y="301" font-size="13" font-weight="bold" fill="#1E8C8C">3. Develop</text>
  <text x="910" y="318" font-size="12" fill="#FFFFFF">Edit files; git add; git diff --cached</text>

  <rect x="900" y="336" width="312" height="44" rx="6" fill="#1E3A66"/>
  <text x="910" y="353" font-size="13" font-weight="bold" fill="#D7F2EE">4. Commit</text>
  <text x="910" y="370" font-size="12" fill="#FFFFFF">git commit -m "type(scope): msg"</text>

  <rect x="900" y="388" width="312" height="44" rx="6" fill="#0D1B2E"/>
  <text x="910" y="405" font-size="13" font-weight="bold" fill="#1E8C8C">5. Push to Gitea</text>
  <text x="910" y="422" font-size="12" fill="#FFFFFF">git push origin feature/UIAO-NNN-desc</text>

  <rect x="900" y="440" width="312" height="44" rx="6" fill="#1E3A66"/>
  <text x="910" y="457" font-size="13" font-weight="bold" fill="#D7F2EE">6. Pull Request</text>
  <text x="910" y="474" font-size="12" fill="#FFFFFF">Create PR: feature → main on Gitea</text>

  <rect x="900" y="492" width="312" height="44" rx="6" fill="#0D1B2E"/>
  <text x="910" y="509" font-size="13" font-weight="bold" fill="#1E8C8C">7. Cleanup</text>
  <text x="910" y="526" font-size="12" fill="#FFFFFF">git branch -d feature/UIAO-NNN-desc</text>

  <rect x="900" y="544" width="312" height="44" rx="6" fill="#1E3A66"/>
  <text x="910" y="561" font-size="13" font-weight="bold" fill="#D7F2EE">8. Mirror to GitHub</text>
  <text x="910" y="578" font-size="12" fill="#FFFFFF">git push github main</text>

  <rect x="900" y="608" width="312" height="62" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1"/>
  <text x="910" y="625" font-size="12" fill="#33414F" font-weight="bold">Note: Feature branches stay on Gitea only.</text>
  <text x="910" y="642" font-size="12" fill="#33414F">Only main syncs to GitHub. Tags also</text>
  <text x="910" y="659" font-size="12" fill="#33414F">pushed: git push github --tags</text>

  <!-- Arrows: Local ↔ Gitea (bidirectional) -->
  <line x1="350" y1="308" x2="490" y2="278" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="382" y="280" font-size="13" fill="#1E8C8C" font-weight="bold">push / fetch</text>
  <line x1="490" y1="320" x2="350" y2="350" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="376" y="348" font-size="13" fill="#1E8C8C" font-weight="bold">pull / clone</text>
  <text x="375" y="316" font-size="12" fill="#5A5A5A" font-style="italic">origin</text>

  <!-- Arrow: Local → GitHub (push main only) -->
  <line x1="350" y1="432" x2="490" y2="584" stroke="#1E3A66" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#arrow-navy)"/>
  <text x="352" y="512" font-size="13" fill="#1E3A66" font-weight="bold">push main</text>
  <text x="352" y="530" font-size="12" fill="#5A5A5A">(github remote)</text>

  <!-- Arrow: Gitea → GitHub automated sync -->
  <line x1="650" y1="454" x2="650" y2="493" stroke="#D4A017" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow-amber)"/>
  <text x="656" y="478" font-size="12" fill="#D4A017" font-weight="bold">auto-sync 6h</text>

  <!-- Bottom note -->
  <rect x="60" y="602" width="390" height="46" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="76" y="620" font-size="13" fill="#0D1B2E" font-weight="bold">All feature work pushes to origin (Gitea).</text>
  <text x="76" y="638" font-size="13" fill="#0D1B2E">Only main branch syncs to github (GitHub).</text>
</svg>
