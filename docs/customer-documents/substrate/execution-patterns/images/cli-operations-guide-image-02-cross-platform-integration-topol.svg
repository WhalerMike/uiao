<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A66"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
    <marker id="arrow-mid-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E75B6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="54" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">UIAO Cross-Platform Integration Topology</text>
  <text x="60" y="82" font-size="16" fill="#6B7A8D">DIAG-003/004/005 — Active Directory | Entra ID | Intune | Azure Arc</text>
  <line x1="60" y1="95" x2="1220" y2="95" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- TIER LABELS (left margin) -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <rect x="20" y="112" width="26" height="174" rx="4" fill="#0D1B2E"/>
  <text x="33" y="199" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFFFFF" transform="rotate(-90,33,199)">ON-PREMISES</text>

  <rect x="20" y="300" width="26" height="74" rx="4" fill="#1E3A66"/>
  <text x="33" y="337" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFFFFF" transform="rotate(-90,33,337)">HYBRID</text>

  <rect x="20" y="388" width="26" height="308" rx="4" fill="#1E8C8C"/>
  <text x="33" y="542" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFFFFF" transform="rotate(-90,33,542)">AZURE CLOUD</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ON-PREMISES TIER  (y 112–286) -->
  <!-- ══════════════════════════════════════════════════════════════ -->

  <!-- UIAO-GIT01 / Gitea server -->
  <rect x="60" y="112" width="290" height="174" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="205" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">UIAO-GIT01</text>
  <text x="205" y="158" text-anchor="middle" font-size="12" fill="#5A5A5A">Windows Server 2025</text>
  <rect x="80" y="168" width="250" height="50" rx="8" fill="#0D1B2E"/>
  <text x="205" y="189" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">Gitea v1.26.0</text>
  <text x="205" y="208" text-anchor="middle" font-size="12" fill="#1E8C8C">git.uiao.local :443 / :3000</text>
  <text x="76" y="238" font-size="12" fill="#33414F">IIS 10 ARR reverse proxy</text>
  <text x="76" y="256" font-size="12" fill="#33414F">Azure Connected Machine Agent</text>
  <text x="76" y="274" font-size="12" fill="#D4A017" font-weight="bold">Tier=Tier0 | Role=GitServer</text>

  <!-- Active Directory -->
  <rect x="400" y="112" width="290" height="174" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="545" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Active Directory</text>
  <text x="545" y="158" text-anchor="middle" font-size="12" fill="#5A5A5A">On-premises domain forest</text>
  <rect x="420" y="168" width="250" height="50" rx="8" fill="#0D1B2E"/>
  <text x="545" y="187" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">DC / LDAP / Kerberos</text>
  <text x="545" y="207" text-anchor="middle" font-size="12" fill="#D7F2EE">dc01.domain.local :389 / :88</text>
  <text x="416" y="238" font-size="12" fill="#33414F">Users · Groups · Computers · OUs</text>
  <text x="416" y="256" font-size="12" fill="#33414F">GPO · PKI (Enterprise CA) · DNS</text>
  <text x="416" y="274" font-size="12" fill="#33414F">svc-uiao-assess (read-only bind)</text>

  <!-- Workstation / PowerShell client -->
  <rect x="740" y="112" width="290" height="174" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="885" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">PowerShell Workstation</text>
  <text x="885" y="158" text-anchor="middle" font-size="12" fill="#5A5A5A">C:\Users\whale\git\uiao</text>
  <rect x="760" y="168" width="250" height="50" rx="8" fill="#1E3A66"/>
  <text x="885" y="187" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">UIAO.Tools Module v2.0</text>
  <text x="885" y="207" text-anchor="middle" font-size="12" fill="#D7F2EE">Git CLI | Az CLI | Graph SDK</text>
  <text x="756" y="238" font-size="12" fill="#33414F">Invoke-UIAOFullAssessment</text>
  <text x="756" y="256" font-size="12" fill="#33414F">Connect-UIAOGitea | Connect-MgGraph</text>
  <text x="756" y="274" font-size="12" fill="#33414F">az connectedmachine / policy / monitor</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- HYBRID TIER  (y 300–374) -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <rect x="60" y="300" width="970" height="74" rx="10" fill="#EAF1FB" stroke="#1E3A66" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="545" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A66">Azure AD Connect Sync</text>
  <text x="545" y="347" text-anchor="middle" font-size="12" fill="#5A5A5A">Syncs on-premises AD objects (users, groups, devices) to Entra ID tenant — hybrid identity bridge</text>
  <text x="545" y="365" text-anchor="middle" font-size="11" fill="#5A5A5A" font-family="Consolas, 'DejaVu Sans Mono', monospace">Password Hash Sync | Device writeback | Group writeback</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- AZURE CLOUD TIER  (y 388–696) -->
  <!-- ══════════════════════════════════════════════════════════════ -->

  <!-- Entra ID -->
  <rect x="60" y="388" width="290" height="218" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="205" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Entra ID</text>
  <text x="205" y="434" text-anchor="middle" font-size="12" fill="#5A5A5A">(Azure Active Directory)</text>
  <rect x="80" y="446" width="250" height="44" rx="8" fill="#0D1B2E"/>
  <text x="205" y="463" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">UIAO-Gitea-SSO</text>
  <text x="205" y="481" text-anchor="middle" font-size="12" fill="#1E8C8C">App Registration / OAuth2-OIDC</text>
  <text x="76" y="508" font-size="12" fill="#33414F">Dynamic Security Groups</text>
  <text x="76" y="526" font-size="12" fill="#33414F">  UIAO-Tier0-GCC-Servers</text>
  <text x="76" y="544" font-size="12" fill="#33414F">Conditional Access Policies</text>
  <text x="76" y="562" font-size="12" fill="#33414F">  UIAO-Gitea-MFA-Required</text>
  <text x="76" y="580" font-size="12" fill="#33414F">Device Objects (hybrid joined)</text>
  <text x="76" y="598" font-size="12" fill="#D4A017" font-weight="bold">Microsoft Graph API endpoint</text>

  <!-- Intune -->
  <rect x="400" y="388" width="290" height="218" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="545" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Microsoft Intune</text>
  <text x="545" y="434" text-anchor="middle" font-size="12" fill="#5A5A5A">Endpoint Management (MDM/MAM)</text>
  <rect x="420" y="446" width="250" height="44" rx="8" fill="#1E3A66"/>
  <text x="545" y="463" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">Compliance Policies</text>
  <text x="545" y="481" text-anchor="middle" font-size="12" fill="#D7F2EE">UIAO-Server-Compliance</text>
  <text x="416" y="508" font-size="12" fill="#33414F">Assigned to UIAO-Tier0-GCC-Servers</text>
  <text x="416" y="526" font-size="12" fill="#33414F">BitLocker · SecureBoot · Defender</text>
  <text x="416" y="544" font-size="12" fill="#33414F">OS min: Windows 10.0.26100</text>
  <text x="416" y="562" font-size="12" fill="#33414F">Update Ring: UIAO-Server-UpdateRing</text>
  <text x="416" y="580" font-size="12" fill="#33414F">PS Script: UIAO-Gitea-HealthCheck</text>
  <text x="416" y="598" font-size="12" fill="#D4A017" font-weight="bold">Graph: /deviceManagement/...</text>

  <!-- Azure Arc -->
  <rect x="740" y="388" width="490" height="218" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="985" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Azure Arc</text>
  <text x="985" y="434" text-anchor="middle" font-size="12" fill="#5A5A5A">rg-uiao-governance | eastus</text>
  <rect x="760" y="446" width="450" height="44" rx="8" fill="#2E75B6"/>
  <text x="985" y="463" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">UIAO-GIT01 (Arc-enrolled)</text>
  <text x="985" y="481" text-anchor="middle" font-size="12" fill="#D7F2EE">Microsoft.HybridCompute/machines</text>

  <!-- Arc sub-boxes -->
  <rect x="760" y="500" width="130" height="90" rx="6" fill="#1E3A66"/>
  <text x="825" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Azure Policy</text>
  <text x="825" y="538" text-anchor="middle" font-size="11" fill="#D7F2EE">Compliance eval</text>
  <text x="825" y="554" text-anchor="middle" font-size="11" fill="#D7F2EE">uiao-gitea-iis</text>
  <text x="825" y="570" text-anchor="middle" font-size="11" fill="#D7F2EE">-validation</text>
  <text x="825" y="586" text-anchor="middle" font-size="10" fill="#D4A017">az policy state</text>

  <rect x="904" y="500" width="145" height="90" rx="6" fill="#1E3A66"/>
  <text x="977" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Azure Monitor</text>
  <text x="977" y="538" text-anchor="middle" font-size="11" fill="#D7F2EE">law-uiao-governance</text>
  <text x="977" y="554" text-anchor="middle" font-size="11" fill="#D7F2EE">AzureMonitorAgent</text>
  <text x="977" y="570" text-anchor="middle" font-size="11" fill="#D7F2EE">dcr-uiao-gitserver</text>
  <text x="977" y="586" text-anchor="middle" font-size="10" fill="#D4A017">KQL / Log Analytics</text>

  <rect x="1063" y="500" width="155" height="90" rx="6" fill="#1E3A66"/>
  <text x="1141" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Defender for Cloud</text>
  <text x="1141" y="538" text-anchor="middle" font-size="11" fill="#D7F2EE">Security posture</text>
  <text x="1141" y="554" text-anchor="middle" font-size="11" fill="#D7F2EE">Threat detection</text>
  <text x="1141" y="570" text-anchor="middle" font-size="11" fill="#D7F2EE">Arc extension</text>
  <text x="1141" y="586" text-anchor="middle" font-size="10" fill="#D4A017">GCC-Moderate scope</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ARROWS -->
  <!-- ══════════════════════════════════════════════════════════════ -->

  <!-- Workstation → AD: RSAT / PS AD Module -->
  <line x1="740" y1="196" x2="690" y2="196" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="694" y="190" font-size="11" fill="#1E8C8C">RSAT/AD module</text>

  <!-- Gitea → AD: LDAP bind -->
  <line x1="350" y1="218" x2="400" y2="218" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="353" y="212" font-size="11" fill="#1E8C8C">LDAP bind</text>

  <!-- AD → Hybrid tier (Azure AD Connect) -->
  <line x1="545" y1="286" x2="545" y2="300" stroke="#1E3A66" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow-navy)"/>

  <!-- Hybrid tier → Entra ID -->
  <line x1="205" y1="374" x2="205" y2="388" stroke="#1E3A66" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow-navy)"/>

  <!-- Workstation → Entra ID: Microsoft Graph -->
  <line x1="885" y1="286" x2="310" y2="478" stroke="#2E75B6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-mid-blue)"/>
  <text x="545" y="400" font-size="11" fill="#2E75B6">Microsoft Graph API</text>

  <!-- Gitea → Entra ID: OAuth2/OIDC SSO -->
  <line x1="170" y1="286" x2="175" y2="388" stroke="#D4A017" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-amber)"/>
  <text x="60" y="344" font-size="11" fill="#D4A017" font-weight="bold">OAuth2/OIDC</text>

  <!-- Entra ID → Intune: Device compliance -->
  <line x1="350" y1="497" x2="400" y2="497" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="352" y="491" font-size="11" fill="#1E8C8C">group assign</text>

  <!-- UIAO-GIT01 → Azure Arc: HTTPS outbound -->
  <line x1="205" y1="286" x2="885" y2="388" stroke="#2E75B6" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrow-mid-blue)"/>
  <text x="500" y="360" font-size="12" fill="#2E75B6" font-weight="bold">HTTPS :443 outbound</text>

  <!-- Workstation → Arc: az CLI commands -->
  <line x1="885" y1="286" x2="985" y2="388" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
  <text x="906" y="340" font-size="11" fill="#1E8C8C">az CLI</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- LEGEND -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <rect x="60" y="660" width="760" height="46" rx="6" fill="#EAF1FB" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="76" y1="683" x2="106" y2="683" stroke="#1E8C8C" stroke-width="2"/>
  <text x="112" y="688" font-size="12" fill="#5A5A5A">LDAP / AD protocol</text>
  <line x1="236" y1="683" x2="266" y2="683" stroke="#1E3A66" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="272" y="688" font-size="12" fill="#5A5A5A">Azure AD Connect sync</text>
  <line x1="414" y1="683" x2="444" y2="683" stroke="#D4A017" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="450" y="688" font-size="12" fill="#5A5A5A">OAuth2/OIDC SSO</text>
  <line x1="560" y1="683" x2="590" y2="683" stroke="#2E75B6" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="596" y="688" font-size="12" fill="#5A5A5A">Microsoft Graph / Az CLI</text>
  <rect x="730" y="676" width="14" height="14" rx="2" fill="#1E3A66"/>
  <text x="750" y="688" font-size="12" fill="#5A5A5A">Cloud / Hybrid service</text>
</svg>
