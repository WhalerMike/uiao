<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A66"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="54" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">UIAO Platform Architecture Topology</text>
  <text x="60" y="82" font-size="16" fill="#6B7A8D">OPS-001 — Windows Server 2025 | Gitea | IIS | Assessment Pipeline | Replication</text>
  <line x1="60" y1="95" x2="1220" y2="95" stroke="#E3E8EF" stroke-width="1"/>

  <!-- PRIMARY SERVER container -->
  <rect x="40" y="108" width="760" height="572" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="420" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">PRIMARY SERVER — Windows Server 2025</text>

  <!-- IIS Reverse Proxy box -->
  <rect x="60" y="148" width="220" height="90" rx="10" fill="#0D1B2E"/>
  <text x="170" y="187" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">IIS 10</text>
  <text x="170" y="210" text-anchor="middle" font-size="13" fill="#D7F2EE">Reverse Proxy (ARR)</text>
  <text x="170" y="228" text-anchor="middle" font-size="12" fill="#D7F2EE">HTTPS :443 → :3000</text>

  <!-- DNS box -->
  <rect x="310" y="148" width="220" height="90" rx="10" fill="#1E3A66"/>
  <text x="420" y="187" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">DNS</text>
  <text x="420" y="210" text-anchor="middle" font-size="13" fill="#D7F2EE">git.uiao.local</text>
  <text x="420" y="228" text-anchor="middle" font-size="12" fill="#D7F2EE">docs.uiao.local</text>

  <!-- TLS / PKI box -->
  <rect x="560" y="148" width="220" height="90" rx="10" fill="#1E3A66"/>
  <text x="670" y="187" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">TLS / PKI</text>
  <text x="670" y="210" text-anchor="middle" font-size="13" fill="#D7F2EE">Cert:\LocalMachine\My</text>
  <text x="670" y="228" text-anchor="middle" font-size="12" fill="#D7F2EE">Enterprise CA</text>

  <!-- Gitea box (central) -->
  <rect x="155" y="283" width="280" height="120" rx="10" fill="#0D1B2E"/>
  <text x="295" y="328" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Gitea v1.26.0</text>
  <text x="295" y="354" text-anchor="middle" font-size="14" fill="#D7F2EE">localhost:3000</text>
  <text x="295" y="374" text-anchor="middle" font-size="13" fill="#1E8C8C">svc: gitea | DOMAIN\svc-gitea</text>

  <!-- PostgreSQL DB box -->
  <rect x="460" y="283" width="300" height="120" rx="10" fill="#2E75B6"/>
  <text x="610" y="326" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">PostgreSQL</text>
  <text x="610" y="350" text-anchor="middle" font-size="13" fill="#FFFFFF">uiao_gitea</text>
  <text x="610" y="370" text-anchor="middle" font-size="12" fill="#D7F2EE">pg01.corp.contoso.com:5432</text>
  <text x="610" y="390" text-anchor="middle" font-size="11" fill="#D7F2EE">ADR-041</text>

  <!-- Assessment Pipeline box -->
  <rect x="60" y="448" width="340" height="198" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="230" y="472" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Assessment Pipeline</text>
  <text x="230" y="494" text-anchor="middle" font-size="13" fill="#0D1B2E">DOMAIN\svc-uiao-assess</text>
  <text x="80" y="518" font-size="13" fill="#33414F">UIAOADAssessment   → D:\UIAO\Assessment\AD</text>
  <text x="80" y="537" font-size="13" fill="#33414F">UIAODNSAssessment  → D:\UIAO\Assessment\DNS</text>
  <text x="80" y="556" font-size="13" fill="#33414F">UIAOPKIAssessment  → D:\UIAO\Assessment\PKI</text>
  <text x="80" y="575" font-size="13" fill="#33414F">UIAODriftDetection  → D:\UIAO\Logs\</text>
  <text x="80" y="594" font-size="13" fill="#33414F">Quarto render       → docs.uiao.local</text>
  <text x="80" y="613" font-size="13" fill="#33414F">JSON → Gitea commit → Dashboard</text>
  <text x="80" y="632" font-size="11" fill="#5A5A5A">Weekly Mon 03:00–05:00 | Daily 07:00–08:00</text>

  <!-- Scheduled Tasks box -->
  <rect x="430" y="448" width="340" height="198" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="600" y="472" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Scheduled Tasks (\UIAO\)</text>
  <text x="450" y="496" font-size="12" fill="#33414F">UIAO-DailyHealthCheck   06:00 daily</text>
  <text x="450" y="514" font-size="12" fill="#33414F">UIAO-BackupDB           hourly</text>
  <text x="450" y="532" font-size="12" fill="#33414F">UIAO-FullBackup         02:00 daily</text>
  <text x="450" y="550" font-size="12" fill="#33414F">UIAO-ADAssessment       Mon 03:00</text>
  <text x="450" y="568" font-size="12" fill="#33414F">UIAO-DriftDetection     07:00 daily</text>
  <text x="450" y="586" font-size="12" fill="#33414F">UIAO-DashboardRender    08:00 daily</text>
  <text x="450" y="604" font-size="12" fill="#33414F">UIAO-GitHubSync         every 6h</text>
  <text x="450" y="622" font-size="12" fill="#33414F">UIAO-LogRotation        23:00 daily</text>
  <text x="450" y="640" font-size="12" fill="#33414F">UIAO-CertExpiryCheck    06:30 daily</text>

  <!-- SECONDARY SERVER box -->
  <rect x="840" y="108" width="260" height="200" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="970" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">SECONDARY SERVER</text>
  <text x="970" y="156" text-anchor="middle" font-size="13" fill="#5A5A5A">Active-Passive DR Mirror</text>
  <rect x="868" y="168" width="204" height="70" rx="8" fill="#1E3A66"/>
  <text x="970" y="197" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Gitea (passive)</text>
  <text x="970" y="221" text-anchor="middle" font-size="13" fill="#D7F2EE">git-dr.uiao.local</text>
  <text x="860" y="262" font-size="12" fill="#5A5A5A">Replication: active-passive push</text>
  <text x="860" y="280" font-size="12" fill="#5A5A5A">HEAD-ref sync check daily</text>

  <!-- GITHUB MIRROR box -->
  <rect x="840" y="338" width="260" height="130" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="970" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">GITHUB MIRROR</text>
  <rect x="868" y="378" width="204" height="60" rx="8" fill="#1E3A66"/>
  <text x="970" y="400" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">github.com/WhalerMike</text>
  <text x="970" y="422" text-anchor="middle" font-size="13" fill="#D7F2EE">/uiao</text>
  <text x="860" y="456" font-size="12" fill="#5A5A5A">Sync every 6 hours (main only)</text>

  <!-- ACTIVE DIRECTORY box -->
  <rect x="840" y="498" width="260" height="130" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="970" y="526" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">ACTIVE DIRECTORY</text>
  <rect x="868" y="538" width="204" height="60" rx="8" fill="#0D1B2E"/>
  <text x="970" y="560" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">DC / LDAP</text>
  <text x="970" y="582" text-anchor="middle" font-size="12" fill="#D7F2EE">dc01.domain.local</text>
  <text x="860" y="616" font-size="12" fill="#5A5A5A">Gitea LDAP auth | svc-uiao-assess</text>

  <!-- Arrow: IIS → Gitea -->
  <line x1="170" y1="238" x2="230" y2="283" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="172" y="268" font-size="11" fill="#5A5A5A">proxy</text>

  <!-- Arrow: Gitea → PostgreSQL -->
  <line x1="435" y1="343" x2="460" y2="343" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="434" y="336" font-size="11" fill="#5A5A5A">ADR-041</text>

  <!-- Arrow: Assessment → Gitea -->
  <line x1="290" y1="448" x2="290" y2="403" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="296" y="432" font-size="11" fill="#5A5A5A">commit</text>

  <!-- Arrow: Gitea → Secondary (replication) -->
  <line x1="800" y1="328" x2="840" y2="238" stroke="#1E3A66" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrow-navy)"/>
  <text x="802" y="290" font-size="12" fill="#1E3A66" font-weight="bold">mirror push</text>

  <!-- Arrow: Gitea → GitHub (sync) -->
  <line x1="800" y1="368" x2="840" y2="388" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-teal)"/>
  <text x="802" y="366" font-size="12" fill="#1E8C8C">6h sync</text>

  <!-- Arrow: Gitea → AD (LDAP) -->
  <line x1="435" y1="388" x2="868" y2="563" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
  <text x="620" y="490" font-size="11" fill="#5A5A5A">LDAP bind</text>

  <!-- Key paths note -->
  <rect x="840" y="648" width="400" height="52" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1"/>
  <text x="855" y="668" font-size="12" fill="#33414F" font-weight="bold">Key paths: D:\Gitea\  D:\GitRepos\  D:\UIAO\Assessment\</text>
  <text x="855" y="686" font-size="12" fill="#33414F">D:\UIAO\Logs\  D:\UIAO\Backups\  D:\UIAO\Modules\  D:\UIAO\Scripts\</text>

  <!-- Legend -->
  <rect x="60" y="662" width="16" height="12" rx="2" fill="#0D1B2E"/>
  <text x="82" y="673" font-size="12" fill="#5A5A5A">On-prem primary</text>
  <rect x="210" y="662" width="16" height="12" rx="2" fill="#2E75B6"/>
  <text x="232" y="673" font-size="12" fill="#5A5A5A">Database</text>
  <rect x="320" y="662" width="16" height="12" rx="2" fill="#1E3A66"/>
  <text x="342" y="673" font-size="12" fill="#5A5A5A">Secondary / external</text>
  <line x1="470" y1="668" x2="500" y2="668" stroke="#D4A017" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="506" y="673" font-size="12" fill="#5A5A5A">Scheduled / governance</text>
  <line x1="670" y1="668" x2="700" y2="668" stroke="#1E8C8C" stroke-width="2"/>
  <text x="706" y="673" font-size="12" fill="#5A5A5A">Data / control flow</text>
</svg>
