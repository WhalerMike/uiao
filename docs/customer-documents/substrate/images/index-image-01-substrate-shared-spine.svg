<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">The substrate: one shared spine, both pillars ride it</text>
  <text x="60" y="88" font-size="17" fill="#6B7A8D">Components that are neither modernization nor compliance — the machinery that lets both exist</text>

  <!-- Two pillars (top) -->
  <rect x="170" y="130" width="420" height="78" rx="12" fill="#0D1B2E"/>
  <text x="380" y="162" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Modernization pillar</text>
  <text x="380" y="188" text-anchor="middle" font-size="14" fill="#EAF1FB">client-server to hybrid-cloud transformation</text>

  <rect x="690" y="130" width="420" height="78" rx="12" fill="#0D1B2E"/>
  <text x="900" y="162" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Compliance pillar</text>
  <text x="900" y="188" text-anchor="middle" font-size="14" fill="#EAF1FB">FedRAMP, OSCAL, KSI, continuous monitoring</text>

  <!-- Spine band (center) -->
  <rect x="120" y="300" width="1040" height="150" rx="14" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="640" y="330" text-anchor="middle" font-size="20" font-weight="bold" fill="#0D1B2E">Substrate — the shared spine</text>

  <!-- three sub-category cards inside spine -->
  <rect x="150" y="352" width="300" height="80" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="300" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Platform &amp; tooling</text>
  <text x="300" y="404" text-anchor="middle" font-size="12" fill="#33414F">monorepo · Quarto pipeline · CLI</text>
  <text x="300" y="421" text-anchor="middle" font-size="12" fill="#33414F">canon sync · CI/CD · Academy</text>

  <rect x="490" y="352" width="300" height="80" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="640" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Core architecture</text>
  <text x="640" y="404" text-anchor="middle" font-size="12" fill="#33414F">Six-Plane · Three-Layer Rule</text>
  <text x="640" y="421" text-anchor="middle" font-size="12" fill="#33414F">Drift Engine · Evidence Chain · Boundary</text>

  <rect x="830" y="352" width="300" height="80" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="980" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Execution patterns</text>
  <text x="980" y="404" text-anchor="middle" font-size="12" fill="#33414F">Two-Brain Execution · AODIM</text>
  <text x="980" y="421" text-anchor="middle" font-size="12" fill="#33414F">Instruments vs. Orchestra</text>

  <!-- arrows: spine feeds both pillars -->
  <line x1="380" y1="298" x2="380" y2="210" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="298" x2="900" y2="210" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- invariants footer -->
  <rect x="120" y="500" width="1040" height="150" rx="12" fill="#1E3A66"/>
  <text x="148" y="532" font-size="17" font-weight="bold" fill="#FFFFFF">Canonical invariants</text>
  <text x="148" y="568" font-size="14" fill="#EAF1FB">Tenant agnosticism — substrate artifacts carry no tenant-specific identifiers; values injected at deploy time.</text>
  <text x="148" y="598" font-size="14" fill="#EAF1FB">Single source — one monorepo, one canon registry, one render pipeline; mirrors are non-canonical.</text>
  <text x="148" y="628" font-size="14" fill="#EAF1FB">Governance is not execution — Copilot reviews and authorizes; the Execution Substrate executes.</text>

  <text x="60" y="690" font-size="13" fill="#6B7A8D">Splitting these across pillars would duplicate canon — they live here so both pillars cross-reference instead of redefining.</text>
</svg>
