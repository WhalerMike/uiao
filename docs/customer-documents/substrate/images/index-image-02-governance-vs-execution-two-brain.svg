<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrowamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Governance is not execution: the Two-Brain split</text>
  <text x="60" y="88" font-size="17" fill="#6B7A8D">Copilot reviews and authorizes; the Execution Substrate executes. The two never co-mingle.</text>

  <!-- Governance brain (left) -->
  <rect x="80" y="150" width="470" height="330" rx="16" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="80" y="150" width="470" height="56" rx="16" fill="#0D1B2E"/>
  <text x="315" y="178" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">Governance brain</text>
  <text x="315" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E8C8C">Copilot — reviews &amp; authorizes</text>
  <text x="110" y="276" font-size="15" fill="#33414F">• Reads the diff and the canon it must satisfy</text>
  <text x="110" y="306" font-size="15" fill="#33414F">• Validates against schema, boundary, safety</text>
  <text x="110" y="336" font-size="15" fill="#33414F">• Approves or rejects — the authorization gate</text>
  <text x="110" y="366" font-size="15" fill="#33414F">• Never touches a live tenant directly</text>
  <rect x="110" y="392" width="410" height="64" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="315" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Output: an authorized, signed plan</text>
  <text x="315" y="438" text-anchor="middle" font-size="12" fill="#33414F">committed to Gitea, provenance-bound</text>

  <!-- Execution brain (right) -->
  <rect x="730" y="150" width="470" height="330" rx="16" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="730" y="150" width="470" height="56" rx="16" fill="#0D1B2E"/>
  <text x="965" y="178" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">Execution brain</text>
  <text x="965" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E8C8C">Execution Substrate — executes</text>
  <text x="760" y="276" font-size="15" fill="#33414F">• Accepts only an authorized plan as input</text>
  <text x="760" y="306" font-size="15" fill="#33414F">• Applies idempotent writes via adapters</text>
  <text x="760" y="336" font-size="15" fill="#33414F">• Records evidence for every action taken</text>
  <text x="760" y="366" font-size="15" fill="#33414F">• No discretion — it does not decide policy</text>
  <rect x="760" y="392" width="410" height="64" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="965" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Output: applied change + evidence record</text>
  <text x="965" y="438" text-anchor="middle" font-size="12" fill="#33414F">drift-checked against canon afterward</text>

  <!-- handoff arrow -->
  <line x1="552" y1="320" x2="728" y2="320" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="640" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">authorized plan</text>
  <text x="640" y="344" text-anchor="middle" font-size="12" fill="#6B7A8D">one-way handoff</text>

  <!-- firewall divider note -->
  <rect x="80" y="520" width="1120" height="130" rx="12" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="104" y="552" font-size="17" font-weight="bold" fill="#0D1B2E">Why the separation is structural, not stylistic</text>
  <text x="104" y="582" font-size="14" fill="#33414F">A brain that both decides and acts can rationalize a non-compliant change into existence. Splitting authorization</text>
  <text x="104" y="606" font-size="14" fill="#33414F">from execution means every live mutation traces to an independently-approved, signed plan — and nothing reaches</text>
  <text x="104" y="630" font-size="14" fill="#33414F">a tenant without passing the gate. The handoff is one-way: the Execution Substrate cannot grant its own authority.</text>
</svg>
