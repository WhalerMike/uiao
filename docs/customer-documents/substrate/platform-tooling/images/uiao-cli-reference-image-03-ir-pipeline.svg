<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow_mid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="52" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">IR Pipeline: SCuBA-to-Auditor Evidence Flow</text>
  <text x="60" y="78" font-size="16" fill="#6B7A8D">adapter run-scuba → normalized JSON → ir scuba-transform → ir evidence-bundle → six terminal commands</text>

  <!-- Stage 1: adapter run-scuba -->
  <rect x="50" y="300" width="190" height="90" rx="10" fill="#2E75B6"/>
  <text x="145" y="335" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">adapter</text>
  <text x="145" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">run-scuba</text>
  <text x="145" y="378" text-anchor="middle" font-size="11" fill="#D7F2EE">SCuBA / vendor input</text>

  <!-- Arrow 1 → normalized JSON -->
  <line x1="240" y1="345" x2="278" y2="345" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: normalized JSON -->
  <rect x="278" y="300" width="170" height="90" rx="10" fill="#1E3A66"/>
  <text x="363" y="335" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">Normalized</text>
  <text x="363" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">JSON</text>
  <text x="363" y="380" text-anchor="middle" font-size="11" fill="#D7F2EE">DNS-style claims</text>

  <!-- Arrow 2 → ir scuba-transform -->
  <line x1="448" y1="345" x2="486" y2="345" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: ir scuba-transform -->
  <rect x="486" y="300" width="190" height="90" rx="10" fill="#1E3A66"/>
  <text x="581" y="332" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">ir</text>
  <text x="581" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">scuba-transform</text>
  <text x="581" y="378" text-anchor="middle" font-size="11" fill="#D7F2EE">IR Evidence objects</text>

  <!-- Arrow 3 → ir evidence-bundle -->
  <line x1="676" y1="345" x2="714" y2="345" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: ir evidence-bundle (central fan-out node) -->
  <rect x="714" y="280" width="190" height="130" rx="10" fill="#0D1B2E"/>
  <text x="809" y="323" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">ir</text>
  <text x="809" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">evidence-bundle</text>
  <text x="809" y="372" text-anchor="middle" font-size="11" fill="#D7F2EE">Canonical EvidenceBundle</text>
  <text x="809" y="392" text-anchor="middle" font-size="10" fill="#6B7A8D">bundle-level hash · tamper-evident</text>

  <!-- Fan-out vertical distribution line from evidence-bundle right edge -->
  <!-- 6 terminal commands: y positions spread from ~130 to ~590 -->
  <!-- Terminal y centers: 138, 238, 338, 438, 538, 618 -->
  <!-- Fan-out starts at x=904 (right edge of evidence-bundle) -->
  <line x1="904" y1="345" x2="944" y2="345" stroke="#1E8C8C" stroke-width="2.5"/>
  <!-- Vertical distribution spine -->
  <line x1="944" y1="130" x2="944" y2="618" stroke="#1E8C8C" stroke-width="2.5"/>

  <!-- Arrow stubs from spine to each terminal box -->
  <line x1="944" y1="130" x2="980" y2="130" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="944" y1="226" x2="980" y2="226" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="944" y1="322" x2="980" y2="322" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="944" y1="418" x2="980" y2="418" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="944" y1="514" x2="980" y2="514" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="944" y1="618" x2="980" y2="618" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Terminal box 1: ir poam-export -->
  <rect x="980" y="100" width="260" height="60" rx="10" fill="#1E3A66"/>
  <text x="1110" y="122" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">ir poam-export</text>
  <text x="1110" y="146" text-anchor="middle" font-size="11" fill="#D7F2EE">FAIL + WARN → POA&amp;M entries</text>

  <!-- Terminal box 2: ir drift-detect / ir diff -->
  <rect x="980" y="196" width="260" height="60" rx="10" fill="#1E3A66"/>
  <text x="1110" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">ir drift-detect</text>
  <text x="1110" y="241" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">ir diff</text>

  <!-- Terminal box 3: ir governance-report → ir ssp-report -->
  <rect x="980" y="292" width="260" height="60" rx="10" fill="#1E3A66"/>
  <text x="1110" y="314" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">ir governance-report</text>
  <text x="1110" y="337" text-anchor="middle" font-size="11" fill="#D7F2EE">SCuBA → IR → Evidence → Report</text>
  <!-- Sub-arrow: governance-report feeds ssp-report -->
  <line x1="1240" y1="322" x2="1260" y2="322" stroke="#1E8C8C" stroke-width="1.5"/>
  <line x1="1260" y1="322" x2="1260" y2="388" stroke="#1E8C8C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Terminal box 3b: ir ssp-report (fed by governance-report) -->
  <rect x="1110" y="388" width="150" height="50" rx="8" fill="#1E3A66" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1185" y="406" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">ir ssp-report</text>
  <text x="1185" y="425" text-anchor="middle" font-size="10" fill="#D7F2EE">SSP narrative + lineage</text>

  <!-- Terminal box 4: ir auditor-bundle -->
  <rect x="980" y="388" width="115" height="60" rx="10" fill="#0D1B2E"/>
  <text x="1038" y="408" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">ir</text>
  <text x="1038" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">auditor-bundle</text>

  <!-- Terminal box 5: ir freshness / ir dashboard -->
  <rect x="980" y="484" width="260" height="60" rx="10" fill="#1E3A66"/>
  <text x="1110" y="506" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">ir freshness</text>
  <text x="1110" y="529" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">ir dashboard</text>

  <!-- Terminal box 6: ir validate (input gate) -->
  <rect x="980" y="588" width="260" height="60" rx="10" fill="#1E3A66"/>
  <text x="1110" y="610" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">ir validate</text>
  <text x="1110" y="633" text-anchor="middle" font-size="11" fill="#D7F2EE">Input validation gate</text>

  <!-- Pipeline stage labels below main chain -->
  <text x="145" y="402" text-anchor="middle" font-size="11" fill="#5A5A5A">Adapter layer</text>
  <text x="363" y="402" text-anchor="middle" font-size="11" fill="#5A5A5A">Normalization</text>
  <text x="581" y="402" text-anchor="middle" font-size="11" fill="#5A5A5A">IR transform</text>
  <text x="809" y="424" text-anchor="middle" font-size="11" fill="#5A5A5A">Evidence aggregation</text>

  <!-- Legend -->
  <rect x="50" y="668" width="13" height="13" rx="2" fill="#2E75B6"/>
  <text x="70" y="678" font-size="12" fill="#5A5A5A">Adapter input</text>
  <rect x="185" y="668" width="13" height="13" rx="2" fill="#1E3A66"/>
  <text x="205" y="678" font-size="12" fill="#5A5A5A">IR pipeline stages</text>
  <rect x="355" y="668" width="13" height="13" rx="2" fill="#0D1B2E"/>
  <text x="375" y="678" font-size="12" fill="#5A5A5A">Canonical bundle / auditor output</text>
  <line x1="605" y1="673" x2="641" y2="673" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="650" y="678" font-size="12" fill="#5A5A5A">Pipeline flow</text>
</svg>
