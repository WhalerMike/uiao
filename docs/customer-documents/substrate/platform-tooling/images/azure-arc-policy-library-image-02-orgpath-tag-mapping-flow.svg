<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">OrgPath-to-Tag Mapping Flow</text>
  <text x="60" y="84" font-size="18" fill="#6B7A8D">OrgPath extension attributes mapped to Azure Arc resource tags for scoped governance</text>

  <!-- ── STAGE 1: Active Directory ── -->
  <rect x="40" y="118" width="220" height="490" rx="10" fill="#0D1B2E"/>
  <text x="150" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Active Directory</text>
  <text x="150" y="170" text-anchor="middle" font-size="12" fill="#D7F2EE">Computer Object</text>

  <!-- Six extension attrs -->
  <rect x="58" y="186" width="184" height="38" rx="5" fill="#1E3A66"/>
  <text x="150" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">extensionAttribute1</text>
  <text x="150" y="217" text-anchor="middle" font-size="11" fill="#D7F2EE">Region</text>

  <rect x="58" y="232" width="184" height="38" rx="5" fill="#1E3A66"/>
  <text x="150" y="247" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">extensionAttribute2</text>
  <text x="150" y="263" text-anchor="middle" font-size="11" fill="#D7F2EE">Site</text>

  <rect x="58" y="278" width="184" height="38" rx="5" fill="#1E3A66"/>
  <text x="150" y="293" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">extensionAttribute3</text>
  <text x="150" y="309" text-anchor="middle" font-size="11" fill="#D7F2EE">Department</text>

  <rect x="58" y="324" width="184" height="38" rx="5" fill="#1E3A66"/>
  <text x="150" y="339" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">extensionAttribute4</text>
  <text x="150" y="355" text-anchor="middle" font-size="11" fill="#D7F2EE">DeviceTier</text>

  <rect x="58" y="370" width="184" height="38" rx="5" fill="#1E3A66"/>
  <text x="150" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">extensionAttribute5</text>
  <text x="150" y="401" text-anchor="middle" font-size="11" fill="#D7F2EE">Environment</text>

  <rect x="58" y="416" width="184" height="38" rx="5" fill="#1E3A66"/>
  <text x="150" y="431" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">extensionAttribute6</text>
  <text x="150" y="447" text-anchor="middle" font-size="11" fill="#D7F2EE">DeviceRole</text>

  <!-- UIAO assessment callout -->
  <rect x="58" y="474" width="184" height="48" rx="5" fill="#1E8C8C"/>
  <text x="150" y="493" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">UIAO Assessment</text>
  <text x="150" y="511" text-anchor="middle" font-size="11" fill="#FFFFFF">Sets attrs on AD objects</text>

  <!-- Get-UIAOOrgPath -->
  <rect x="58" y="534" width="184" height="56" rx="5" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1"/>
  <text x="150" y="553" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D1B2E" font-family="Consolas, 'DejaVu Sans Mono', monospace">Get-UIAOOrgPath</text>
  <text x="150" y="571" text-anchor="middle" font-size="10" fill="#33414F">Reads attrs before</text>
  <text x="150" y="585" text-anchor="middle" font-size="10" fill="#33414F">azcmagent connect</text>

  <!-- Arrow AD → Entra Sync -->
  <line x1="262" y1="363" x2="306" y2="363" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ── STAGE 2: Entra Connect Sync ── -->
  <rect x="308" y="118" width="180" height="180" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="398" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Entra Connect</text>
  <text x="398" y="166" text-anchor="middle" font-size="12" fill="#5A5A5A">Sync</text>
  <text x="398" y="194" text-anchor="middle" font-size="12" fill="#33414F">Hybrid-joined devices:</text>
  <text x="398" y="212" text-anchor="middle" font-size="12" fill="#33414F">extension attrs synced</text>
  <text x="398" y="230" text-anchor="middle" font-size="12" fill="#33414F">to Entra ID objects</text>
  <text x="398" y="254" text-anchor="middle" font-size="11" fill="#6B7A8D">Entra ID tenant</text>
  <text x="398" y="272" text-anchor="middle" font-size="11" fill="#6B7A8D">(GCC-Moderate)</text>

  <!-- Arrow Entra Sync → Arc Deploy (downward) -->
  <line x1="398" y1="300" x2="398" y2="376" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="440" y="342" font-size="10" fill="#5A5A5A">optional</text>

  <!-- ── STAGE 3: Arc Agent Deploy ── -->
  <rect x="308" y="378" width="180" height="178" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="398" y="408" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Arc Agent</text>
  <text x="398" y="426" text-anchor="middle" font-size="12" fill="#5A5A5A">Deployment</text>
  <text x="398" y="454" text-anchor="middle" font-size="12" fill="#33414F">azcmagent connect</text>
  <text x="398" y="473" text-anchor="middle" font-size="12" fill="#33414F">reads OrgPath values</text>
  <text x="398" y="492" text-anchor="middle" font-size="12" fill="#33414F">applies as --tags</text>
  <text x="398" y="520" text-anchor="middle" font-size="11" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0D1B2E">Install-UIAOArcAgent</text>
  <text x="398" y="538" text-anchor="middle" font-size="10" fill="#5A5A5A">.ps1</text>

  <!-- Arrow Arc Deploy → Azure Tags -->
  <line x1="490" y1="467" x2="534" y2="467" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="512" y="459" text-anchor="middle" font-size="11" fill="#1E8C8C">tags</text>

  <!-- ── STAGE 4: Azure Resource Tags ── -->
  <rect x="536" y="118" width="240" height="490" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="656" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Azure Arc</text>
  <text x="656" y="170" text-anchor="middle" font-size="13" fill="#5A5A5A">Resource Tags</text>

  <rect x="554" y="186" width="204" height="40" rx="5" fill="#1E3A66"/>
  <text x="656" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao-region</text>
  <text x="656" y="219" text-anchor="middle" font-size="11" fill="#D7F2EE">East, West, Central, Global</text>

  <rect x="554" y="234" width="204" height="40" rx="5" fill="#1E3A66"/>
  <text x="656" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao-site</text>
  <text x="656" y="267" text-anchor="middle" font-size="11" fill="#D7F2EE">Org-specific (AD assessment)</text>

  <rect x="554" y="282" width="204" height="40" rx="5" fill="#1E3A66"/>
  <text x="656" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao-department</text>
  <text x="656" y="315" text-anchor="middle" font-size="11" fill="#D7F2EE">Org-specific (AD assessment)</text>

  <rect x="554" y="330" width="204" height="40" rx="5" fill="#1E3A66"/>
  <text x="656" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao-device-tier</text>
  <text x="656" y="363" text-anchor="middle" font-size="11" fill="#D7F2EE">Tier0, Tier1, Tier2</text>

  <rect x="554" y="378" width="204" height="40" rx="5" fill="#1E3A66"/>
  <text x="656" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao-environment</text>
  <text x="656" y="411" text-anchor="middle" font-size="11" fill="#D7F2EE">Production, Staging, Dev, DR</text>

  <rect x="554" y="426" width="204" height="40" rx="5" fill="#1E3A66"/>
  <text x="656" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao-device-role</text>
  <text x="656" y="459" text-anchor="middle" font-size="11" fill="#D7F2EE">DC / GitServer / AppServer…</text>

  <!-- Tag Validation callout -->
  <rect x="554" y="478" width="204" height="52" rx="5" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="656" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">UIAO-Arc-RequiredTags</text>
  <text x="656" y="515" text-anchor="middle" font-size="11" fill="#33414F">Deny if any tag missing</text>

  <rect x="554" y="538" width="204" height="52" rx="5" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="656" y="558" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">UIAO-Arc-TagValues</text>
  <text x="656" y="575" text-anchor="middle" font-size="11" fill="#33414F">Deny if value invalid</text>

  <!-- Arrow Tags → Policy Engine -->
  <line x1="778" y1="363" x2="822" y2="363" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ── STAGE 5: Policy Engine ── -->
  <rect x="824" y="118" width="220" height="490" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="934" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Azure Policy</text>
  <text x="934" y="170" text-anchor="middle" font-size="13" fill="#5A5A5A">Scoped Assignment</text>

  <!-- Scope levels -->
  <rect x="842" y="188" width="184" height="50" rx="5" fill="#1E3A66"/>
  <text x="934" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Management Group</text>
  <text x="934" y="225" text-anchor="middle" font-size="11" fill="#D7F2EE">Enterprise-wide baseline</text>

  <rect x="842" y="248" width="184" height="50" rx="5" fill="#1E3A66"/>
  <text x="934" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Subscription</text>
  <text x="934" y="285" text-anchor="middle" font-size="11" fill="#D7F2EE">Environment-level governance</text>

  <rect x="842" y="308" width="184" height="50" rx="5" fill="#1E3A66"/>
  <text x="934" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Resource Group</text>
  <text x="934" y="345" text-anchor="middle" font-size="11" fill="#D7F2EE">rg-uiao-arc-{region}-{env}</text>

  <!-- Policy effects -->
  <rect x="842" y="374" width="184" height="42" rx="5" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="934" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Tag Inheritance</text>
  <text x="934" y="408" text-anchor="middle" font-size="11" fill="#33414F">UIAO-Arc-TagInheritance</text>

  <rect x="842" y="426" width="184" height="42" rx="5" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="934" y="444" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Compliance Reporting</text>
  <text x="934" y="460" text-anchor="middle" font-size="11" fill="#33414F">By Region / Tier / Role</text>

  <rect x="842" y="478" width="184" height="42" rx="5" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="934" y="496" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Dashboard Segmentation</text>
  <text x="934" y="512" text-anchor="middle" font-size="11" fill="#33414F">OrgPath-segmented views</text>

  <rect x="842" y="530" width="184" height="56" rx="5" fill="#0D1B2E"/>
  <text x="934" y="551" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Azure Resource Graph</text>
  <text x="934" y="568" text-anchor="middle" font-size="11" fill="#D7F2EE">Compliance state API</text>
  <text x="934" y="585" text-anchor="middle" font-size="10" fill="#D7F2EE">→ UIAO Governance Dash</text>

  <!-- Arrow Policy Engine → Governance Pipeline -->
  <line x1="1046" y1="363" x2="1086" y2="363" stroke="#D4A017" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#arrow-amber)"/>

  <!-- ── STAGE 6: Governance Pipeline ── -->
  <rect x="1088" y="270" width="162" height="190" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="1169" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Governance</text>
  <text x="1169" y="318" text-anchor="middle" font-size="13" fill="#0D1B2E">Pipeline</text>
  <rect x="1104" y="334" width="130" height="36" rx="4" fill="#D4A017"/>
  <text x="1169" y="349" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">UIAODriftDetection</text>
  <text x="1169" y="364" text-anchor="middle" font-size="10" fill="#FFFFFF">Compliance drift alerts</text>
  <rect x="1104" y="380" width="130" height="36" rx="4" fill="#D4A017"/>
  <text x="1169" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">UIAO Dashboard</text>
  <text x="1169" y="410" text-anchor="middle" font-size="10" fill="#FFFFFF">Segmented by OrgPath</text>
  <rect x="1104" y="426" width="130" height="22" rx="4" fill="#0D1B2E"/>
  <text x="1169" y="441" text-anchor="middle" font-size="10" fill="#FFFFFF">Remediation triggers</text>

  <!-- Legend -->
  <rect x="40" y="632" width="440" height="72" rx="6" fill="#F7F9FC" stroke="#E3E8EF" stroke-width="1"/>
  <text x="60" y="654" font-size="13" font-weight="bold" fill="#0D1B2E">Legend</text>
  <rect x="60" y="662" width="14" height="10" fill="#0D1B2E" rx="2"/>
  <text x="80" y="672" font-size="12" fill="#33414F">AD structural / tag node</text>
  <rect x="200" y="662" width="14" height="10" fill="#1E8C8C" rx="2"/>
  <text x="220" y="672" font-size="12" fill="#33414F">Arc / teal pipeline</text>
  <rect x="340" y="662" width="14" height="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1" rx="2"/>
  <text x="360" y="672" font-size="12" fill="#33414F">Governance overlay</text>
  <line x1="60" y1="692" x2="76" y2="692" stroke="#D4A017" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="82" y="696" font-size="12" fill="#33414F">Compliance / drift feedback</text>
  <line x1="240" y1="692" x2="256" y2="692" stroke="#1E8C8C" stroke-width="2"/>
  <text x="262" y="696" font-size="12" fill="#33414F">Tag propagation path</text>
</svg>
