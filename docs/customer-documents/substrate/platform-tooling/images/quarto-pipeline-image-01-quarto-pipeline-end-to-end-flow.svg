<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Quarto Pipeline End-to-End Flow</text>
  <text x="60" y="84" font-size="16" fill="#6B7A8D">Gitea push → post-receive hook → Quarto CLI render → IIS (docs.uiao.local) + GitHub Pages (whalermike.github.io/uiao)</text>

  <!-- ──────────────────────────────────────── -->
  <!-- STAGE LABELS (top strip)                 -->
  <!-- ──────────────────────────────────────── -->
  <rect x="60" y="104" width="160" height="26" rx="4" fill="#E3E8EF"/>
  <text x="140" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">1. Author</text>

  <rect x="240" y="104" width="160" height="26" rx="4" fill="#E3E8EF"/>
  <text x="320" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">2. Push</text>

  <rect x="420" y="104" width="160" height="26" rx="4" fill="#E3E8EF"/>
  <text x="500" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">3. Hook</text>

  <rect x="600" y="104" width="160" height="26" rx="4" fill="#E3E8EF"/>
  <text x="680" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">4. Render</text>

  <rect x="780" y="104" width="160" height="26" rx="4" fill="#E3E8EF"/>
  <text x="860" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">5. Validate</text>

  <rect x="960" y="104" width="260" height="26" rx="4" fill="#E3E8EF"/>
  <text x="1090" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">6. Deploy (dual)</text>

  <!-- ──────────────────────────────────────── -->
  <!-- STAGE 1: Author                          -->
  <!-- ──────────────────────────────────────── -->
  <rect x="60" y="148" width="160" height="264" rx="8" fill="#0D1B2E"/>
  <text x="140" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Author</text>
  <text x="140" y="192" text-anchor="middle" font-size="11" fill="#D7F2EE">docs/ directory</text>

  <rect x="76" y="204" width="128" height="36" rx="5" fill="#1E3A66"/>
  <text x="140" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">124 .qmd files</text>
  <text x="140" y="233" text-anchor="middle" font-size="10" fill="#D7F2EE">governance / assessment</text>

  <rect x="76" y="250" width="128" height="36" rx="5" fill="#1E3A66"/>
  <text x="140" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">_quarto.yml</text>
  <text x="140" y="279" text-anchor="middle" font-size="10" fill="#D7F2EE">Site configuration</text>

  <rect x="76" y="296" width="128" height="36" rx="5" fill="#1E3A66"/>
  <text x="140" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">_metadata.yml</text>
  <text x="140" y="325" text-anchor="middle" font-size="10" fill="#D7F2EE">Shared metadata</text>

  <rect x="76" y="342" width="128" height="36" rx="5" fill="#1E3A66"/>
  <text x="140" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">uiao-theme.css</text>
  <text x="140" y="371" text-anchor="middle" font-size="10" fill="#D7F2EE">UIAO visual identity</text>

  <rect x="76" y="388" width="128" height="16" rx="4" fill="#1E8C8C"/>
  <text x="140" y="400" text-anchor="middle" font-size="10" fill="#FFFFFF">Controlled | GCC-Moderate</text>

  <!-- Arrow 1 → 2 -->
  <line x1="222" y1="280" x2="236" y2="280" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ──────────────────────────────────────── -->
  <!-- STAGE 2: Push to Gitea                   -->
  <!-- ──────────────────────────────────────── -->
  <rect x="240" y="148" width="160" height="264" rx="8" fill="#1E3A66"/>
  <text x="320" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Gitea</text>
  <text x="320" y="192" text-anchor="middle" font-size="11" fill="#D7F2EE">Self-hosted Git server</text>

  <rect x="256" y="204" width="128" height="40" rx="5" fill="#0D1B2E"/>
  <text x="320" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">git push</text>
  <text x="320" y="237" text-anchor="middle" font-size="10" fill="#D7F2EE">to main branch</text>

  <rect x="256" y="254" width="128" height="40" rx="5" fill="#0D1B2E"/>
  <text x="320" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Gitea v1.22+</text>
  <text x="320" y="287" text-anchor="middle" font-size="10" fill="#D7F2EE">D:\Gitea\</text>

  <rect x="256" y="304" width="128" height="40" rx="5" fill="#0D1B2E"/>
  <text x="320" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">IIS Reverse Proxy</text>
  <text x="320" y="337" text-anchor="middle" font-size="10" fill="#D7F2EE">WS 2025 built-in</text>

  <rect x="256" y="354" width="128" height="40" rx="5" fill="#0D1B2E"/>
  <text x="320" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">WhalerMike/uiao</text>
  <text x="320" y="387" text-anchor="middle" font-size="10" fill="#D7F2EE">github.com</text>

  <!-- Arrow 2 → 3 -->
  <line x1="402" y1="280" x2="416" y2="280" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ──────────────────────────────────────── -->
  <!-- STAGE 3: Post-receive Hook               -->
  <!-- ──────────────────────────────────────── -->
  <rect x="420" y="148" width="160" height="264" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="500" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Post-receive</text>
  <text x="500" y="192" text-anchor="middle" font-size="11" fill="#5A5A5A">Hook Extension</text>

  <rect x="436" y="204" width="128" height="40" rx="5" fill="#0D1B2E"/>
  <text x="500" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Detect docs/</text>
  <text x="500" y="237" text-anchor="middle" font-size="10" fill="#D7F2EE">changed .qmd files</text>

  <rect x="436" y="254" width="128" height="40" rx="5" fill="#0D1B2E"/>
  <text x="500" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">render-docs.ps1</text>
  <text x="500" y="287" text-anchor="middle" font-size="10" fill="#D7F2EE">tools/quarto/</text>

  <rect x="436" y="304" width="128" height="40" rx="5" fill="#1E8C8C"/>
  <text x="500" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Validate Quarto CLI</text>
  <text x="500" y="337" text-anchor="middle" font-size="10" fill="#FFFFFF">v1.5.x minimum</text>

  <rect x="436" y="354" width="128" height="40" rx="5" fill="#1E8C8C"/>
  <text x="500" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Trigger render</text>
  <text x="500" y="387" text-anchor="middle" font-size="10" fill="#FFFFFF">D:\Quarto\bin</text>

  <!-- Arrow 3 → 4 -->
  <line x1="582" y1="280" x2="596" y2="280" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ──────────────────────────────────────── -->
  <!-- STAGE 4: Quarto CLI Render               -->
  <!-- ──────────────────────────────────────── -->
  <rect x="600" y="148" width="160" height="264" rx="8" fill="#1E8C8C"/>
  <text x="680" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Quarto CLI</text>
  <text x="680" y="192" text-anchor="middle" font-size="11" fill="#FFFFFF">Render Engine</text>

  <rect x="616" y="204" width="128" height="40" rx="5" fill="#0D1B2E"/>
  <text x="680" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">quarto render</text>
  <text x="680" y="237" text-anchor="middle" font-size="10" fill="#D7F2EE">all 124 .qmd files</text>

  <rect x="616" y="254" width="128" height="40" rx="5" fill="#0D1B2E"/>
  <text x="680" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Pandoc (bundled)</text>
  <text x="680" y="287" text-anchor="middle" font-size="10" fill="#D7F2EE">Markdown → HTML</text>

  <rect x="616" y="304" width="128" height="40" rx="5" fill="#0D1B2E"/>
  <text x="680" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Lua filters</text>
  <text x="680" y="337" text-anchor="middle" font-size="10" fill="#D7F2EE">classification-banner</text>

  <rect x="616" y="354" width="128" height="40" rx="5" fill="#0D1B2E"/>
  <text x="680" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Output: docs/_site/</text>
  <text x="680" y="387" text-anchor="middle" font-size="10" fill="#D7F2EE">Static HTML + CSS + JS</text>

  <!-- Arrow 4 → 5 -->
  <line x1="762" y1="280" x2="776" y2="280" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ──────────────────────────────────────── -->
  <!-- STAGE 5: Validate                        -->
  <!-- ──────────────────────────────────────── -->
  <rect x="780" y="148" width="160" height="264" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="860" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Validation</text>
  <text x="860" y="192" text-anchor="middle" font-size="11" fill="#5A5A5A">Quality gate</text>

  <rect x="796" y="204" width="128" height="40" rx="5" fill="#1E3A66"/>
  <text x="860" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">validate-links.ps1</text>
  <text x="860" y="237" text-anchor="middle" font-size="10" fill="#D7F2EE">tools/quarto/</text>

  <rect x="796" y="254" width="128" height="40" rx="5" fill="#1E3A66"/>
  <text x="860" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Broken link scan</text>
  <text x="860" y="287" text-anchor="middle" font-size="10" fill="#D7F2EE">Internal hrefs</text>

  <rect x="796" y="304" width="128" height="40" rx="5" fill="#1E3A66"/>
  <text x="860" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Missing images</text>
  <text x="860" y="337" text-anchor="middle" font-size="10" fill="#D7F2EE">src= references</text>

  <rect x="796" y="354" width="128" height="40" rx="5" fill="#1E3A66"/>
  <text x="860" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Broken anchors</text>
  <text x="860" y="387" text-anchor="middle" font-size="10" fill="#D7F2EE">link-validation-report.json</text>

  <!-- Arrow 5 → 6 internal -->
  <line x1="942" y1="248" x2="956" y2="248" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Arrow 5 → 6 external -->
  <line x1="942" y1="340" x2="956" y2="340" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ──────────────────────────────────────── -->
  <!-- STAGE 6a: IIS Internal                   -->
  <!-- ──────────────────────────────────────── -->
  <rect x="960" y="148" width="260" height="172" rx="8" fill="#0D1B2E"/>
  <text x="1090" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Internal Deploy</text>
  <text x="1090" y="194" text-anchor="middle" font-size="11" fill="#D7F2EE">IIS · Windows Server 2025</text>

  <rect x="976" y="206" width="228" height="40" rx="5" fill="#1E3A66"/>
  <text x="1090" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">robocopy /MIR</text>
  <text x="1090" y="239" text-anchor="middle" font-size="11" fill="#D7F2EE">_site/ → D:\UIAO\Docs\site\</text>

  <rect x="976" y="256" width="228" height="52" rx="5" fill="#1E8C8C"/>
  <text x="1090" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">docs.uiao.local</text>
  <text x="1090" y="296" text-anchor="middle" font-size="11" fill="#FFFFFF">Windows Integrated Auth</text>

  <!-- ──────────────────────────────────────── -->
  <!-- STAGE 6b: GitHub Pages External          -->
  <!-- ──────────────────────────────────────── -->
  <rect x="960" y="338" width="260" height="172" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1090" y="364" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">External Deploy</text>
  <text x="1090" y="384" text-anchor="middle" font-size="11" fill="#5A5A5A">GitHub Actions · on push to main</text>

  <rect x="976" y="396" width="228" height="40" rx="5" fill="#1E3A66"/>
  <text x="1090" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">quarto-publish.yml</text>
  <text x="1090" y="429" text-anchor="middle" font-size="11" fill="#D7F2EE">GitHub Actions workflow</text>

  <rect x="976" y="446" width="228" height="52" rx="5" fill="#0D1B2E"/>
  <text x="1090" y="464" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">whalermike.github.io/uiao</text>
  <text x="1090" y="482" text-anchor="middle" font-size="11" fill="#D7F2EE">Public · GitHub Pages</text>

  <!-- ──────────────────────────────────────── -->
  <!-- BOTTOM: Pipeline summary strip           -->
  <!-- ──────────────────────────────────────── -->
  <rect x="60" y="450" width="880" height="72" rx="8" fill="#F7F9FC" stroke="#E3E8EF" stroke-width="1"/>
  <text x="500" y="473" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Pipeline Flow Summary</text>
  <!-- Step icons -->
  <circle cx="100" cy="500" r="14" fill="#0D1B2E"/>
  <text x="100" y="505" text-anchor="middle" font-size="12" fill="#FFFFFF">1</text>
  <text x="120" y="505" font-size="11" fill="#33414F">Author .qmd</text>
  <line x1="195" y1="500" x2="215" y2="500" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="230" cy="500" r="14" fill="#1E3A66"/>
  <text x="230" y="505" text-anchor="middle" font-size="12" fill="#FFFFFF">2</text>
  <text x="250" y="505" font-size="11" fill="#33414F">git push</text>
  <line x1="310" y1="500" x2="330" y2="500" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="345" cy="500" r="14" fill="#1E8C8C"/>
  <text x="345" y="505" text-anchor="middle" font-size="12" fill="#FFFFFF">3</text>
  <text x="365" y="505" font-size="11" fill="#33414F">Hook fires</text>
  <line x1="432" y1="500" x2="452" y2="500" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="467" cy="500" r="14" fill="#1E8C8C"/>
  <text x="467" y="505" text-anchor="middle" font-size="12" fill="#FFFFFF">4</text>
  <text x="487" y="505" font-size="11" fill="#33414F">quarto render</text>
  <line x1="564" y1="500" x2="584" y2="500" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="599" cy="500" r="14" fill="#1E3A66"/>
  <text x="599" y="505" text-anchor="middle" font-size="12" fill="#FFFFFF">5</text>
  <text x="619" y="505" font-size="11" fill="#33414F">Validate</text>
  <line x1="680" y1="500" x2="700" y2="500" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="715" cy="500" r="14" fill="#0D1B2E"/>
  <text x="715" y="505" text-anchor="middle" font-size="12" fill="#FFFFFF">6</text>
  <text x="735" y="505" font-size="11" fill="#33414F">Deploy (IIS + GitHub Pages)</text>

  <!-- GitHub Actions side note -->
  <rect x="60" y="542" width="880" height="52" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="80" y="563" font-size="12" font-weight="bold" fill="#0D1B2E">GitHub Actions CI also runs:</text>
  <text x="80" y="582" font-size="11" fill="#33414F">quarto-validate.yml (PR validation)  ·  quarto-link-check.yml (link check on PR)  ·  quarto-publish.yml (GitHub Pages deploy on merge to main)</text>

  <!-- Legend -->
  <rect x="960" y="534" width="260" height="100" rx="6" fill="#F7F9FC" stroke="#E3E8EF" stroke-width="1"/>
  <text x="980" y="556" font-size="13" font-weight="bold" fill="#0D1B2E">Legend</text>
  <rect x="980" y="564" width="14" height="10" fill="#0D1B2E" rx="2"/>
  <text x="1000" y="574" font-size="12" fill="#33414F">On-prem / structural</text>
  <rect x="980" y="582" width="14" height="10" fill="#1E8C8C" rx="2"/>
  <text x="1000" y="592" font-size="12" fill="#33414F">Build / render pipeline</text>
  <rect x="980" y="600" width="14" height="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1" rx="2"/>
  <text x="1000" y="610" font-size="12" fill="#33414F">Azure / cloud deploy target</text>
  <line x1="980" y1="626" x2="994" y2="626" stroke="#1E8C8C" stroke-width="2.5"/>
  <text x="1000" y="630" font-size="12" fill="#33414F">Data / deploy flow</text>
</svg>
