<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Azure Arc Integration Topology</text>
  <text x="60" y="84" font-size="18" fill="#6B7A8D">Active Directory → Arc-enabled Servers → Azure Policy governance plane</text>

  <!-- ── LEFT COLUMN: On-Premises AD ── -->
  <rect x="60" y="118" width="300" height="448" rx="10" fill="#0D1B2E"/>
  <text x="210" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Active Directory</text>
  <text x="210" y="172" text-anchor="middle" font-size="13" fill="#D7F2EE">On-Premises Forest · GCC-Moderate</text>

  <rect x="80" y="188" width="260" height="52" rx="6" fill="#1E3A66"/>
  <text x="210" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Domain Controllers</text>
  <text x="210" y="229" text-anchor="middle" font-size="12" fill="#D7F2EE">WS 2019 / 2022 / 2025</text>

  <rect x="80" y="252" width="260" height="52" rx="6" fill="#1E3A66"/>
  <text x="210" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">OrgPath Extension Attrs</text>
  <text x="210" y="293" text-anchor="middle" font-size="12" fill="#D7F2EE">extensionAttribute1–6</text>

  <rect x="80" y="316" width="260" height="52" rx="6" fill="#1E3A66"/>
  <text x="210" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Group Policy (GPO)</text>
  <text x="210" y="357" text-anchor="middle" font-size="12" fill="#D7F2EE">Auth / Config / Compliance</text>

  <rect x="80" y="380" width="260" height="52" rx="6" fill="#1E3A66"/>
  <text x="210" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Server OUs</text>
  <text x="210" y="421" text-anchor="middle" font-size="12" fill="#D7F2EE">DC / CA / Git / App / File</text>

  <rect x="80" y="444" width="260" height="52" rx="6" fill="#1E3A66"/>
  <text x="210" y="466" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Entra Connect Sync</text>
  <text x="210" y="485" text-anchor="middle" font-size="12" fill="#D7F2EE">Hybrid identity projection</text>

  <rect x="80" y="508" width="260" height="44" rx="6" fill="#1E3A66"/>
  <text x="210" y="527" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Certificate Authority</text>
  <text x="210" y="544" text-anchor="middle" font-size="12" fill="#D7F2EE">ADCS · PKI / Kerberos</text>

  <!-- ── MIDDLE COLUMN: Arc Bridge ── -->
  <rect x="430" y="118" width="290" height="448" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="575" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#0D1B2E">Azure Arc Bridge</text>
  <text x="575" y="172" text-anchor="middle" font-size="13" fill="#5A5A5A">Commercial Cloud · Explicit Exception</text>

