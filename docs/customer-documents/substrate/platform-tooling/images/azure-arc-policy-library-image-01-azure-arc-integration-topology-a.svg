  <text x="575" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Install-UIAOArcAgent.ps1</text>
  <text x="575" y="300" text-anchor="middle" font-size="11" fill="#33414F">OrgPath → Arc tags on connect</text>

  <rect x="450" y="324" width="250" height="84" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="575" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">OrgPath Tag Mapping</text>
  <text x="575" y="366" text-anchor="middle" font-size="11" fill="#33414F">uiao-region · uiao-site</text>
  <text x="575" y="383" text-anchor="middle" font-size="11" fill="#33414F">uiao-department · uiao-device-tier</text>
  <text x="575" y="400" text-anchor="middle" font-size="11" fill="#33414F">uiao-environment · uiao-device-role</text>

  <rect x="450" y="420" width="250" height="52" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="575" y="442" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Connectivity Health</text>
  <text x="575" y="460" text-anchor="middle" font-size="11" fill="#33414F">*.his.arc.azure.com · 24 h SLA</text>

  <rect x="450" y="484" width="250" height="60" rx="6" fill="#0D1B2E"/>
  <text x="575" y="506" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">Microsoft.HybridCompute</text>
  <text x="575" y="523" text-anchor="middle" font-size="11" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#D7F2EE">/machines</text>
  <text x="575" y="540" text-anchor="middle" font-size="11" fill="#D7F2EE">Azure Resource ID assigned</text>

