  <rect x="818" y="256" width="384" height="56" rx="6" fill="#1E3A66"/>
  <text x="1010" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">UIAO-Tier0Hardening</text>
  <text x="1010" y="298" text-anchor="middle" font-size="12" fill="#D7F2EE">DC / CA / Git servers · Enhanced audit + Hook integrity</text>

  <rect x="818" y="324" width="384" height="56" rx="6" fill="#1E3A66"/>
  <text x="1010" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">UIAO-OperationalHealth</text>
  <text x="1010" y="366" text-anchor="middle" font-size="12" fill="#D7F2EE">10 policies · Patch + Backup + AMA + Assessment currency</text>

  <!-- Policy domains row -->
  <rect x="818" y="392" width="186" height="66" rx="6" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="911" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">24 Policies</text>
  <text x="911" y="432" text-anchor="middle" font-size="11" fill="#33414F">Audit / Deny / Modify</text>
  <text x="911" y="450" text-anchor="middle" font-size="11" fill="#33414F">DeployIfNotExists</text>

  <rect x="1016" y="392" width="186" height="66" rx="6" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1109" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Guest Configuration</text>
  <text x="1109" y="432" text-anchor="middle" font-size="11" fill="#33414F">Security baseline · TLS</text>
  <text x="1109" y="450" text-anchor="middle" font-size="11" fill="#33414F">Hook integrity · ESC checks</text>

  <!-- Integration services row -->
  <rect x="818" y="470" width="92" height="68" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="864" y="497" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Defender</text>
  <text x="864" y="513" text-anchor="middle" font-size="11" fill="#33414F">for Cloud</text>

  <rect x="920" y="470" width="92" height="68" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="966" y="497" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Azure</text>
  <text x="966" y="513" text-anchor="middle" font-size="11" fill="#33414F">Monitor</text>

  <rect x="1022" y="470" width="92" height="68" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="1068" y="497" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Update</text>
  <text x="1068" y="513" text-anchor="middle" font-size="11" fill="#33414F">Manager</text>

  <rect x="1124" y="470" width="92" height="68" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="1170" y="497" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Azure</text>
  <text x="1170" y="513" text-anchor="middle" font-size="11" fill="#33414F">Automation</text>

  <!-- ── ARROWS ── -->
  <!-- AD → Arc: OrgPath -->
  <line x1="362" y1="270" x2="426" y2="270" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="394" y="262" text-anchor="middle" font-size="11" fill="#1E8C8C">OrgPath</text>

  <!-- AD → Arc: deploy -->
  <line x1="362" y1="410" x2="426" y2="410" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="394" y="402" text-anchor="middle" font-size="10" fill="#5A5A5A">deploy</text>

  <!-- Arc → Azure Policy: Resource ID -->
  <line x1="722" y1="270" x2="796" y2="270" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="759" y="262" text-anchor="middle" font-size="11" fill="#1E8C8C">Resource ID</text>

  <!-- Arc → Azure Policy: Arc tags -->
  <line x1="722" y1="370" x2="796" y2="370" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="759" y="362" text-anchor="middle" font-size="10" fill="#5A5A5A">Arc tags</text>

  <!-- Compliance feedback arc -->
  <path d="M 800 500 Q 680 620 430 580 Q 362 560 362 544" stroke="#D4A017" stroke-width="2" stroke-dasharray="7,4" fill="none" marker-end="url(#arrow-amber)"/>
  <text x="620" y="638" text-anchor="middle" font-size="11" fill="#D4A017">Compliance state → Dashboard · Drift detection</text>

  <!-- Legend -->
  <rect x="60" y="596" width="340" height="106" rx="6" fill="#F7F9FC" stroke="#E3E8EF" stroke-width="1"/>
  <text x="80" y="618" font-size="13" font-weight="bold" fill="#0D1B2E">Legend</text>
  <rect x="80" y="626" width="16" height="10" fill="#0D1B2E" rx="2"/>
  <text x="102" y="636" font-size="12" fill="#33414F">On-premises structural node</text>
  <rect x="80" y="644" width="16" height="10" fill="#1E8C8C" rx="2"/>
  <text x="102" y="654" font-size="12" fill="#33414F">Arc bridge / teal connector</text>
  <rect x="80" y="662" width="16" height="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1" rx="2"/>
  <text x="102" y="672" font-size="12" fill="#33414F">Azure cloud box</text>
  <line x1="80" y1="688" x2="96" y2="688" stroke="#D4A017" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="102" y="692" font-size="12" fill="#33414F">Compliance feedback / governance</text>
</svg>
