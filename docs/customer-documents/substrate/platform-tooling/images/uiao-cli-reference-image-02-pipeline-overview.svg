<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="52" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">UIAO CLI Pipeline Overview</text>
  <text x="60" y="78" font-size="16" fill="#6B7A8D">Canon YAML branches into two parallel tracks converging into auditor evidence</text>

  <!-- Canon YAML source box (left center, between the two tracks) -->
  <rect x="50" y="280" width="185" height="130" rx="10" fill="#0D1B2E"/>
  <text x="143" y="330" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Canon YAML</text>
  <text x="143" y="358" text-anchor="middle" font-size="14" fill="#D7F2EE">SSOT</text>
  <text x="143" y="383" text-anchor="middle" font-size="12" fill="#6B7A8D" font-family="Consolas, 'DejaVu Sans Mono', monospace">canon check</text>

  <!-- Fork: horizontal from canon right, then split up and down -->
  <line x1="235" y1="345" x2="265" y2="345" stroke="#1E8C8C" stroke-width="2.5"/>
  <line x1="265" y1="195" x2="265" y2="495" stroke="#1E8C8C" stroke-width="2.5"/>
  <line x1="265" y1="195" x2="300" y2="195" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="265" y1="495" x2="300" y2="495" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Track labels -->
  <text x="305" y="118" font-size="15" font-weight="bold" fill="#1E3A66">Track 1 — Core Generation</text>
  <text x="305" y="420" font-size="15" font-weight="bold" fill="#1E3A66">Track 2 — Adapter &amp; IR</text>

  <!-- ======= TRACK 1 (top) ======= -->

  <!-- Stage T1-A: generate ssp / oscal validate -->
  <rect x="300" y="148" width="210" height="94" rx="10" fill="#1E3A66"/>
  <text x="405" y="181" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">generate ssp</text>
  <text x="405" y="204" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">oscal validate</text>
  <text x="405" y="226" text-anchor="middle" font-size="11" fill="#6B7A8D">OSCAL SSP + schema validation</text>

  <!-- Arrow T1-A → T1-B -->
  <line x1="510" y1="195" x2="545" y2="195" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage T1-B: generate visuals / diagrams / gemini -->
  <rect x="545" y="148" width="210" height="94" rx="10" fill="#1E3A66"/>
  <text x="650" y="175" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">generate visuals</text>
  <text x="650" y="198" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">generate diagrams</text>
  <text x="650" y="220" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">generate gemini</text>

  <!-- Arrow T1-B → T1-C -->
  <line x1="755" y1="195" x2="790" y2="195" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage T1-C: generate docx / pptx / artifacts -->
  <rect x="790" y="148" width="210" height="94" rx="10" fill="#1E3A66"/>
  <text x="895" y="175" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">generate docx</text>
  <text x="895" y="198" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">generate pptx</text>
  <text x="895" y="220" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">generate artifacts</text>

  <!-- Stage labels under T1 boxes -->
  <text x="405" y="254" text-anchor="middle" font-size="12" fill="#5A5A5A">SSP + schema gate</text>
  <text x="650" y="254" text-anchor="middle" font-size="12" fill="#5A5A5A">Diagrams + AI visuals</text>
  <text x="895" y="254" text-anchor="middle" font-size="12" fill="#5A5A5A">DOCX / PPTX output</text>

  <!-- ======= TRACK 2 (bottom) ======= -->

  <!-- Stage T2-A: adapter run / run-scuba -->
  <rect x="300" y="448" width="210" height="94" rx="10" fill="#2E75B6"/>
  <text x="405" y="481" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">adapter run</text>
  <text x="405" y="504" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">adapter run-scuba</text>
  <text x="405" y="526" text-anchor="middle" font-size="11" fill="#EAF1FB">Vendor → normalized IR</text>

  <!-- Arrow T2-A → T2-B -->
  <line x1="510" y1="495" x2="545" y2="495" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage T2-B: ir scuba-transform / evidence-bundle -->
  <rect x="545" y="448" width="210" height="94" rx="10" fill="#2E75B6"/>
  <text x="650" y="478" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">ir scuba-transform</text>
  <text x="650" y="502" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">ir evidence-bundle</text>
  <text x="650" y="524" text-anchor="middle" font-size="11" fill="#EAF1FB">IR objects + evidence bundles</text>

  <!-- Arrow T2-B → T2-C -->
  <line x1="755" y1="495" x2="790" y2="495" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage T2-C: conmon process / export-oa / dashboard -->
  <rect x="790" y="448" width="210" height="94" rx="10" fill="#2E75B6"/>
  <text x="895" y="476" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">conmon process</text>
  <text x="895" y="499" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">conmon export-oa</text>
  <text x="895" y="521" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">conmon dashboard</text>

  <!-- Stage labels above T2 boxes -->
  <text x="405" y="438" text-anchor="middle" font-size="12" fill="#5A5A5A">SCuBA / vendor adapter</text>
  <text x="650" y="438" text-anchor="middle" font-size="12" fill="#5A5A5A">IR transform + bundle</text>
  <text x="895" y="438" text-anchor="middle" font-size="12" fill="#5A5A5A">Continuous monitoring</text>

  <!-- Convergence: both tracks merge right and point into final box -->
  <!-- T1-C right edge → merge point -->
  <line x1="1000" y1="195" x2="1045" y2="195" stroke="#1E8C8C" stroke-width="2.5"/>
  <line x1="1045" y1="195" x2="1045" y2="345" stroke="#1E8C8C" stroke-width="2.5"/>
  <!-- T2-C right edge → merge point -->
  <line x1="1000" y1="495" x2="1045" y2="495" stroke="#1E8C8C" stroke-width="2.5"/>
  <line x1="1045" y1="495" x2="1045" y2="355" stroke="#1E8C8C" stroke-width="2.5"/>
  <!-- Arrow from merge into final box -->
  <line x1="1045" y1="345" x2="1080" y2="345" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Final convergence box: ir auditor-bundle / evidence graph -->
  <rect x="1080" y="278" width="160" height="134" rx="10" fill="#0D1B2E"/>
  <text x="1160" y="316" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">ir auditor-bundle</text>
  <text x="1160" y="340" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">evidence graph</text>
  <text x="1160" y="363" text-anchor="middle" font-size="12" fill="#1E8C8C">Auditor evidence</text>
  <text x="1160" y="384" text-anchor="middle" font-size="11" fill="#6B7A8D">tamper-evident chain</text>
  <text x="1160" y="403" text-anchor="middle" font-size="10" fill="#6B7A8D">provenance-hashed</text>

  <!-- Legend -->
  <rect x="60" y="642" width="13" height="13" rx="2" fill="#0D1B2E"/>
  <text x="80" y="652" font-size="13" fill="#5A5A5A">Canon YAML / Auditor delivery</text>
  <rect x="310" y="642" width="13" height="13" rx="2" fill="#1E3A66"/>
  <text x="330" y="652" font-size="13" fill="#5A5A5A">Track 1: Core Generation</text>
  <rect x="560" y="642" width="13" height="13" rx="2" fill="#2E75B6"/>
  <text x="580" y="652" font-size="13" fill="#5A5A5A">Track 2: Adapter &amp; IR</text>
  <line x1="800" y1="648" x2="836" y2="648" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="845" y="652" font-size="13" fill="#5A5A5A">Pipeline flow</text>

  <!-- Dividing line between tracks (visual separator) -->
  <line x1="265" y1="345" x2="1045" y2="345" stroke="#E3E8EF" stroke-width="1" stroke-dasharray="6,4"/>
</svg>
