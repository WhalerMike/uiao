<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="52" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">UIAO CLI Sub-App Topology</text>
  <text x="60" y="78" font-size="16" fill="#6B7A8D">ADR-046 sub-app surface — 13 domain sub-apps under the uiao root entry point</text>

  <!-- Root entry point -->
  <rect x="515" y="100" width="250" height="58" rx="10" fill="#0D1B2E"/>
  <text x="640" y="129" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao</text>

  <!-- Vertical drop from root to horizontal bar -->
  <line x1="640" y1="158" x2="640" y2="188" stroke="#1E8C8C" stroke-width="2"/>
  <!-- Horizontal distribution bar -->
  <line x1="60" y1="188" x2="1220" y2="188" stroke="#1E8C8C" stroke-width="2"/>

  <!-- 13 sub-apps evenly spaced: x-centers at 60 + n*(1160/12), n=0..12 -->
  <!-- spacing = 1160/12 ~ 96.67, rounded: 60,157,253,350,446,543,640,736,833,929,1026,1123,1220 -->

  <!-- Drop lines from bar to each sub-app -->
  <line x1="60"   y1="188" x2="60"   y2="208" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="157"  y1="188" x2="157"  y2="208" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="253"  y1="188" x2="253"  y2="208" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="350"  y1="188" x2="350"  y2="208" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="446"  y1="188" x2="446"  y2="208" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="543"  y1="188" x2="543"  y2="208" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="640"  y1="188" x2="640"  y2="208" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="736"  y1="188" x2="736"  y2="208" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="833"  y1="188" x2="833"  y2="208" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="929"  y1="188" x2="929"  y2="208" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="1026" y1="188" x2="1026" y2="208" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="1123" y1="188" x2="1123" y2="208" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="1220" y1="188" x2="1220" y2="208" stroke="#1E8C8C" stroke-width="2"/>

  <!-- Sub-app boxes: width 84, centered on x-positions -->
  <!-- canon -->
  <rect x="18"   y="208" width="84" height="48" rx="10" fill="#1E3A66"/>
  <text x="60"   y="232" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">canon</text>

  <!-- generate -->
  <rect x="115"  y="208" width="84" height="48" rx="10" fill="#1E3A66"/>
  <text x="157"  y="232" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">generate</text>

  <!-- oscal -->
  <rect x="211"  y="208" width="84" height="48" rx="10" fill="#1E3A66"/>
  <text x="253"  y="232" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">oscal</text>

  <!-- adapter -->
  <rect x="308"  y="208" width="84" height="48" rx="10" fill="#1E3A66"/>
  <text x="350"  y="232" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">adapter</text>

  <!-- ir -->
  <rect x="404"  y="208" width="84" height="48" rx="10" fill="#1E3A66"/>
  <text x="446"  y="232" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">ir</text>

  <!-- conmon -->
  <rect x="501"  y="208" width="84" height="48" rx="10" fill="#1E3A66"/>
  <text x="543"  y="232" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">conmon</text>

  <!-- reciprocity -->
  <rect x="598"  y="208" width="84" height="48" rx="10" fill="#1E3A66"/>
  <text x="640"  y="232" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">reciprocity</text>

  <!-- cql -->
  <rect x="694"  y="208" width="84" height="48" rx="10" fill="#1E3A66"/>
  <text x="736"  y="232" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">cql</text>

  <!-- evidence -->
  <rect x="791"  y="208" width="84" height="48" rx="10" fill="#1E3A66"/>
  <text x="833"  y="232" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">evidence</text>

  <!-- substrate -->
  <rect x="887"  y="208" width="84" height="48" rx="10" fill="#1E3A66"/>
  <text x="929"  y="232" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">substrate</text>

  <!-- ksi -->
  <rect x="984"  y="208" width="84" height="48" rx="10" fill="#1E3A66"/>
  <text x="1026" y="232" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">ksi</text>

  <!-- orchestrator -->
  <rect x="1081" y="208" width="84" height="48" rx="10" fill="#1E3A66"/>
  <text x="1123" y="232" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">orchestrator</text>

  <!-- enforcement -->
  <rect x="1178" y="208" width="84" height="48" rx="10" fill="#1E3A66"/>
  <text x="1220" y="232" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Consolas, 'DejaVu Sans Mono', monospace">enforcement</text>

  <!-- Bracket grouping lines connecting sub-apps to the three lanes below -->
  <!-- Lines drop from sub-app bottoms at y=256 -->

  <!-- Canon-anchored group: canon(60), generate(157), oscal(253) -->
  <line x1="60"  y1="256" x2="60"  y2="290" stroke="#E3E8EF" stroke-width="1.5"/>
  <line x1="157" y1="256" x2="157" y2="290" stroke="#E3E8EF" stroke-width="1.5"/>
  <line x1="253" y1="256" x2="253" y2="290" stroke="#E3E8EF" stroke-width="1.5"/>
  <line x1="60"  y1="290" x2="253" y2="290" stroke="#1E3A66" stroke-width="1.5"/>
  <line x1="157" y1="290" x2="157" y2="310" stroke="#1E3A66" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Adapter-ingested group: adapter(350), ir(446), conmon(543), reciprocity(640), cql(736), evidence(833) -->
  <line x1="350" y1="256" x2="350" y2="290" stroke="#E3E8EF" stroke-width="1.5"/>
  <line x1="446" y1="256" x2="446" y2="290" stroke="#E3E8EF" stroke-width="1.5"/>
  <line x1="543" y1="256" x2="543" y2="290" stroke="#E3E8EF" stroke-width="1.5"/>
  <line x1="640" y1="256" x2="640" y2="290" stroke="#E3E8EF" stroke-width="1.5"/>
  <line x1="736" y1="256" x2="736" y2="290" stroke="#E3E8EF" stroke-width="1.5"/>
  <line x1="833" y1="256" x2="833" y2="290" stroke="#E3E8EF" stroke-width="1.5"/>
  <line x1="350" y1="290" x2="833" y2="290" stroke="#1E3A66" stroke-width="1.5"/>
  <line x1="592" y1="290" x2="592" y2="310" stroke="#1E3A66" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Auditor-delivered group: substrate(929), ksi(1026), orchestrator(1123), enforcement(1220) -->
  <line x1="929"  y1="256" x2="929"  y2="290" stroke="#E3E8EF" stroke-width="1.5"/>
  <line x1="1026" y1="256" x2="1026" y2="290" stroke="#E3E8EF" stroke-width="1.5"/>
  <line x1="1123" y1="256" x2="1123" y2="290" stroke="#E3E8EF" stroke-width="1.5"/>
  <line x1="1220" y1="256" x2="1220" y2="290" stroke="#E3E8EF" stroke-width="1.5"/>
  <line x1="929"  y1="290" x2="1220" y2="290" stroke="#1E3A66" stroke-width="1.5"/>
  <line x1="1075" y1="290" x2="1075" y2="310" stroke="#1E3A66" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Three data-flow lane boxes -->
  <!-- Canon-anchored lane -->
  <rect x="30" y="310" width="254" height="360" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="157" y="345" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Canon-anchored</text>
  <line x1="50" y1="358" x2="264" y2="358" stroke="#E3E8EF" stroke-width="1"/>
  <text x="157" y="380" text-anchor="middle" font-size="13" fill="#5A5A5A">canon · generate · oscal</text>
  <text x="157" y="402" text-anchor="middle" font-size="13" fill="#5A5A5A">Canon YAML → OSCAL artifacts</text>
  <text x="157" y="424" text-anchor="middle" font-size="13" fill="#5A5A5A">→ visual renderings</text>
  <text x="157" y="446" text-anchor="middle" font-size="13" fill="#5A5A5A">→ DOCX / PPTX deliverables</text>
  <text x="157" y="468" text-anchor="middle" font-size="12" fill="#6B7A8D">Idempotent · provenance-traced</text>
  <text x="157" y="490" text-anchor="middle" font-size="12" fill="#6B7A8D">CycloneDX SBOM · supply chain</text>
  <text x="157" y="530" text-anchor="middle" font-size="12" fill="#1E8C8C" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao generate all</text>
  <text x="157" y="552" text-anchor="middle" font-size="12" fill="#1E8C8C" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao oscal validate</text>
  <text x="157" y="574" text-anchor="middle" font-size="12" fill="#1E8C8C" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao canon check</text>
  <text x="157" y="610" text-anchor="middle" font-size="11" fill="#6B7A8D">Schema-valid · deterministic</text>
  <text x="157" y="630" text-anchor="middle" font-size="11" fill="#6B7A8D">EO 14028 · FedRAMP governed</text>
  <text x="157" y="654" text-anchor="middle" font-size="11" fill="#6B7A8D">ADR-046 sub-app surface</text>

  <!-- Adapter-ingested lane -->
  <rect x="465" y="310" width="254" height="360" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="592" y="345" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Adapter-ingested</text>
  <line x1="485" y1="358" x2="699" y2="358" stroke="#E3E8EF" stroke-width="1"/>
  <text x="592" y="380" text-anchor="middle" font-size="13" fill="#5A5A5A">adapter · ir · conmon</text>
  <text x="592" y="402" text-anchor="middle" font-size="13" fill="#5A5A5A">reciprocity · cql · evidence</text>
  <text x="592" y="424" text-anchor="middle" font-size="13" fill="#5A5A5A">Vendor output → normalized IR</text>
  <text x="592" y="446" text-anchor="middle" font-size="13" fill="#5A5A5A">→ evidence bundles</text>
  <text x="592" y="468" text-anchor="middle" font-size="13" fill="#5A5A5A">→ governance reports</text>
  <text x="592" y="490" text-anchor="middle" font-size="12" fill="#6B7A8D">Drift detection · POA&amp;M export</text>
  <text x="592" y="530" text-anchor="middle" font-size="12" fill="#1E8C8C" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao adapter run-scuba</text>
  <text x="592" y="552" text-anchor="middle" font-size="12" fill="#1E8C8C" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao ir evidence-bundle</text>
  <text x="592" y="574" text-anchor="middle" font-size="12" fill="#1E8C8C" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao conmon process</text>
  <text x="592" y="610" text-anchor="middle" font-size="11" fill="#6B7A8D">ConMon · KSI dashboard</text>
  <text x="592" y="630" text-anchor="middle" font-size="11" fill="#6B7A8D">HRIT Single-ATO reciprocity</text>
  <text x="592" y="654" text-anchor="middle" font-size="11" fill="#6B7A8D">CQL compliance queries</text>

  <!-- Auditor-delivered lane -->
  <rect x="948" y="310" width="282" height="360" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1089" y="345" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Auditor-delivered</text>
  <line x1="968" y1="358" x2="1210" y2="358" stroke="#E3E8EF" stroke-width="1"/>
  <text x="1089" y="380" text-anchor="middle" font-size="13" fill="#5A5A5A">substrate · ksi</text>
  <text x="1089" y="402" text-anchor="middle" font-size="13" fill="#5A5A5A">orchestrator · enforcement</text>
  <text x="1089" y="424" text-anchor="middle" font-size="13" fill="#5A5A5A">Evidence graph · KSI verdicts</text>
  <text x="1089" y="446" text-anchor="middle" font-size="13" fill="#5A5A5A">→ auditor packages</text>
  <text x="1089" y="468" text-anchor="middle" font-size="12" fill="#6B7A8D">Substrate manifest validation</text>
  <text x="1089" y="490" text-anchor="middle" font-size="12" fill="#6B7A8D">HMAC-SHA256 reciprocity records</text>
  <text x="1089" y="530" text-anchor="middle" font-size="12" fill="#1E8C8C" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao ir auditor-bundle</text>
  <text x="1089" y="552" text-anchor="middle" font-size="12" fill="#1E8C8C" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao evidence graph</text>
  <text x="1089" y="574" text-anchor="middle" font-size="12" fill="#1E8C8C" font-family="Consolas, 'DejaVu Sans Mono', monospace">uiao ksi evaluate</text>
  <text x="1089" y="610" text-anchor="middle" font-size="11" fill="#6B7A8D">Pipeline orchestration</text>
  <text x="1089" y="630" text-anchor="middle" font-size="11" fill="#6B7A8D">Enforcement runtime (library)</text>
  <text x="1089" y="654" text-anchor="middle" font-size="11" fill="#6B7A8D">UIAO_111 · UIAO_113</text>

  <!-- Legend -->
  <rect x="30" y="685" width="12" height="12" rx="2" fill="#1E3A66"/>
  <text x="48" y="695" font-size="12" fill="#5A5A5A">Sub-app</text>
  <rect x="140" y="685" width="12" height="12" rx="2" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="158" y="695" font-size="12" fill="#5A5A5A">Data flow lane</text>
  <rect x="290" y="685" width="12" height="12" rx="2" fill="#0D1B2E"/>
  <text x="308" y="695" font-size="12" fill="#5A5A5A">Root entry point</text>
</svg>
