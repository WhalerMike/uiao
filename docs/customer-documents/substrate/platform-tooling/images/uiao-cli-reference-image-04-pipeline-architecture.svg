<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="52" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Full Pipeline Architecture: Canon to Auditor</text>
  <text x="60" y="78" font-size="16" fill="#6B7A8D">Canon YAML SSOT → two streams → Auditor Delivery</text>

  <!-- Canon YAML SSOT (top center) -->
  <rect x="490" y="105" width="300" height="72" rx="10" fill="#0D1B2E"/>
  <text x="640" y="133" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Canon YAML SSOT</text>
  <text x="640" y="158" text-anchor="middle" font-size="13" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">canon check  ·  idempotent</text>

  <!-- Fork from Canon YAML: down then split left and right -->
  <line x1="640" y1="177" x2="640" y2="210" stroke="#1E8C8C" stroke-width="2.5"/>
  <line x1="260" y1="210" x2="1020" y2="210" stroke="#1E8C8C" stroke-width="2.5"/>
  <!-- Arrow to Stream 1 (left) -->
  <line x1="260" y1="210" x2="260" y2="243" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Arrow to Stream 2 (right) -->
  <line x1="1020" y1="210" x2="1020" y2="243" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stream labels -->
  <text x="260" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A66">Stream 1 — Core OSCAL + Visual + Monitoring</text>
  <text x="1020" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A66">Stream 2 — Adapter + IR + Governance</text>

  <!-- ===== STREAM 1 (LEFT COLUMN) ===== -->
  <!-- Node S1-A: Core OSCAL Generation -->
  <rect x="100" y="243" width="320" height="76" rx="10" fill="#1E3A66"/>
  <text x="260" y="268" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Core OSCAL Generation</text>
  <text x="260" y="293" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">generate ssp  ·  oscal validate</text>
  <text x="260" y="309" text-anchor="middle" font-size="11" fill="#6B7A8D">OSCAL SSP · schema + semantic validation</text>

  <!-- Arrow S1-A → S1-B -->
  <line x1="260" y1="319" x2="260" y2="349" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node S1-B: Visual Rendering -->
  <rect x="100" y="349" width="320" height="76" rx="10" fill="#1E3A66"/>
  <text x="260" y="374" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Visual Rendering</text>
  <text x="260" y="397" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">generate visuals  ·  generate diagrams</text>
  <text x="260" y="413" text-anchor="middle" font-size="11" fill="#6B7A8D">PlantUML PNGs · Gemini AI visuals</text>

  <!-- Arrow S1-B → S1-C -->
  <line x1="260" y1="425" x2="260" y2="455" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node S1-C: Artifact Packaging -->
  <rect x="100" y="455" width="320" height="76" rx="10" fill="#1E3A66"/>
  <text x="260" y="480" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Artifact Packaging</text>
  <text x="260" y="503" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">generate docx  ·  generate pptx</text>
  <text x="260" y="519" text-anchor="middle" font-size="11" fill="#6B7A8D">DOCX / PPTX · CycloneDX SBOM</text>

  <!-- Arrow S1-C → S1-D -->
  <line x1="260" y1="531" x2="260" y2="561" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node S1-D: Continuous Monitoring -->
  <rect x="100" y="561" width="320" height="76" rx="10" fill="#1E3A66"/>
  <text x="260" y="586" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Continuous Monitoring</text>
  <text x="260" y="609" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">conmon process  ·  conmon export-oa</text>
  <text x="260" y="625" text-anchor="middle" font-size="11" fill="#6B7A8D">POA&amp;M · KSI dashboard · ATO cadence</text>

  <!-- ===== STREAM 2 (RIGHT COLUMN) ===== -->
  <!-- Node S2-A: Adapter Ingestion -->
  <rect x="860" y="243" width="320" height="76" rx="10" fill="#2E75B6"/>
  <text x="1020" y="268" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Adapter Ingestion</text>
  <text x="1020" y="293" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">adapter run  ·  adapter run-scuba</text>
  <text x="1020" y="309" text-anchor="middle" font-size="11" fill="#EAF1FB">Vendor → normalized DNS-style claims</text>

  <!-- Arrow S2-A → S2-B -->
  <line x1="1020" y1="319" x2="1020" y2="349" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node S2-B: IR Pipeline -->
  <rect x="860" y="349" width="320" height="76" rx="10" fill="#2E75B6"/>
  <text x="1020" y="374" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">IR Pipeline</text>
  <text x="1020" y="397" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">ir scuba-transform  ·  ir evidence-bundle</text>
  <text x="1020" y="413" text-anchor="middle" font-size="11" fill="#EAF1FB">IR Evidence objects · drift detect · POA&amp;M</text>

  <!-- Arrow S2-B → S2-C -->
  <line x1="1020" y1="425" x2="1020" y2="455" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node S2-C: Governance Reporting -->
  <rect x="860" y="455" width="320" height="76" rx="10" fill="#2E75B6"/>
  <text x="1020" y="480" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Governance Reporting</text>
  <text x="1020" y="503" text-anchor="middle" font-size="12" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">ir governance-report  ·  ir ssp-report</text>
  <text x="1020" y="519" text-anchor="middle" font-size="11" fill="#EAF1FB">Full governance report + SSP narrative</text>

  <!-- Extend S2 column to same height as S1-D before converging -->
  <!-- Dotted continuation line from S2-C down to convergence level -->
  <line x1="1020" y1="531" x2="1020" y2="599" stroke="#1E8C8C" stroke-width="2.5"/>

  <!-- Convergence: both streams merge into Auditor Delivery -->
  <!-- S1-D bottom center → horizontal right toward merge point x=640 -->
  <line x1="260" y1="637" x2="260" y2="670" stroke="#1E8C8C" stroke-width="2.5"/>
  <line x1="260" y1="670" x2="590" y2="670" stroke="#1E8C8C" stroke-width="2.5"/>
  <!-- S2-C extended bottom → horizontal left toward merge point x=640 -->
  <line x1="1020" y1="599" x2="1020" y2="670" stroke="#1E8C8C" stroke-width="2.5"/>
  <line x1="1020" y1="670" x2="690" y2="670" stroke="#1E8C8C" stroke-width="2.5"/>
  <!-- Arrows pointing into Auditor Delivery from left and right -->
  <line x1="590" y1="670" x2="590" y2="660" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="670" x2="690" y2="660" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Auditor Delivery (bottom center) -->
  <rect x="450" y="580" width="380" height="80" rx="10" fill="#0D1B2E"/>
  <text x="640" y="608" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Auditor Delivery</text>
  <text x="640" y="632" text-anchor="middle" font-size="13" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">ir auditor-bundle  ·  evidence graph</text>
  <text x="640" y="650" text-anchor="middle" font-size="11" fill="#6B7A8D">tamper-evident · provenance-hashed</text>

  <!-- Legend -->
  <rect x="60" y="690" width="13" height="13" rx="2" fill="#0D1B2E"/>
  <text x="80" y="700" font-size="12" fill="#5A5A5A">Canon YAML / Auditor Delivery</text>
  <rect x="310" y="690" width="13" height="13" rx="2" fill="#1E3A66"/>
  <text x="330" y="700" font-size="12" fill="#5A5A5A">Stream 1: Core OSCAL + Monitoring</text>
  <rect x="610" y="690" width="13" height="13" rx="2" fill="#2E75B6"/>
  <text x="630" y="700" font-size="12" fill="#5A5A5A">Stream 2: Adapter + IR + Governance</text>
  <line x1="920" y1="696" x2="956" y2="696" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="965" y="700" font-size="12" fill="#5A5A5A">Pipeline flow</text>
</svg>
