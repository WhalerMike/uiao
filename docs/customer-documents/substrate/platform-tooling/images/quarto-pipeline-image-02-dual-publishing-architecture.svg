<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Dual-Publishing Architecture</text>
  <text x="60" y="84" font-size="16" fill="#6B7A8D">One source repository rendering to two targets: internal IIS (docs.uiao.local) and public GitHub Pages</text>

  <!-- ──────────────────────────────────────────── -->
  <!-- CENTER: Single Source                        -->
  <!-- ──────────────────────────────────────────── -->
  <rect x="460" y="118" width="360" height="360" rx="12" fill="#0D1B2E"/>
  <text x="640" y="152" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Single Source</text>
  <text x="640" y="174" text-anchor="middle" font-size="13" fill="#D7F2EE">github.com/WhalerMike/uiao</text>

  <!-- Source contents -->
  <rect x="480" y="190" width="320" height="40" rx="6" fill="#1E3A66"/>
  <text x="640" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">docs/ (124 .qmd files)</text>
  <text x="640" y="224" text-anchor="middle" font-size="11" fill="#D7F2EE">governance / assessment / modules / dashboard</text>

  <rect x="480" y="240" width="320" height="36" rx="6" fill="#1E3A66"/>
  <text x="640" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">docs/_quarto.yml</text>
  <text x="640" y="271" text-anchor="middle" font-size="11" fill="#D7F2EE">Master site configuration</text>

  <rect x="480" y="286" width="320" height="36" rx="6" fill="#1E3A66"/>
  <text x="640" y="301" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">docs/_metadata.yml</text>
  <text x="640" y="317" text-anchor="middle" font-size="11" fill="#D7F2EE">Shared: Controlled | GCC-Moderate</text>

  <rect x="480" y="332" width="320" height="36" rx="6" fill="#1E3A66"/>
  <text x="640" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">docs/assets/css/uiao-theme.css</text>
  <text x="640" y="363" text-anchor="middle" font-size="11" fill="#D7F2EE">UIAO visual identity (cosmo + overrides)</text>

  <rect x="480" y="378" width="320" height="36" rx="6" fill="#1E3A66"/>
  <text x="640" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">docs/_extensions/uiao-theme/</text>
  <text x="640" y="409" text-anchor="middle" font-size="11" fill="#D7F2EE">classification-banner.lua · metadata-validator.lua</text>

  <!-- Quarto CLI engine -->
  <rect x="480" y="424" width="320" height="40" rx="6" fill="#1E8C8C"/>
  <text x="640" y="441" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Quarto CLI >= 1.5.x</text>
  <text x="640" y="457" text-anchor="middle" font-size="11" fill="#FFFFFF">quarto render  →  docs/_site/ (static HTML)</text>

  <!-- ──────────────────────────────────────────── -->
  <!-- LEFT: Internal IIS target                    -->
  <!-- ──────────────────────────────────────────── -->
  <rect x="60" y="148" width="340" height="330" rx="12" fill="#0D1B2E"/>
  <text x="230" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Internal Target</text>
  <text x="230" y="200" text-anchor="middle" font-size="12" fill="#D7F2EE">IIS · Windows Server 2025</text>

  <rect x="80" y="218" width="300" height="44" rx="6" fill="#1E3A66"/>
  <text x="230" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Trigger</text>
  <text x="230" y="254" text-anchor="middle" font-size="11" fill="#D7F2EE">Gitea post-receive hook</text>

  <rect x="80" y="272" width="300" height="44" rx="6" fill="#1E3A66"/>
  <text x="230" y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Deploy mechanism</text>
  <text x="230" y="308" text-anchor="middle" font-size="11" fill="#D7F2EE">robocopy /MIR → D:\UIAO\Docs\site\</text>

  <rect x="80" y="326" width="300" height="44" rx="6" fill="#1E3A66"/>
  <text x="230" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Authentication</text>
  <text x="230" y="362" text-anchor="middle" font-size="11" fill="#D7F2EE">Windows Integrated (domain users)</text>

  <rect x="80" y="380" width="300" height="44" rx="6" fill="#1E8C8C"/>
  <text x="230" y="405" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">docs.uiao.local</text>

  <rect x="80" y="434" width="300" height="32" rx="5" fill="#1E3A66"/>
  <text x="230" y="454" text-anchor="middle" font-size="11" fill="#D7F2EE">Classification: Controlled | GCC-Moderate</text>

  <!-- ──────────────────────────────────────────── -->
  <!-- RIGHT: GitHub Pages external target          -->
  <!-- ──────────────────────────────────────────── -->
  <rect x="880" y="148" width="340" height="330" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1050" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">External Target</text>
  <text x="1050" y="200" text-anchor="middle" font-size="12" fill="#5A5A5A">GitHub Pages · Public</text>

  <rect x="900" y="218" width="300" height="44" rx="6" fill="#1E3A66"/>
  <text x="1050" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Trigger</text>
  <text x="1050" y="254" text-anchor="middle" font-size="11" fill="#D7F2EE">GitHub Actions on push to main</text>

  <rect x="900" y="272" width="300" height="44" rx="6" fill="#1E3A66"/>
  <text x="1050" y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Workflow</text>
  <text x="1050" y="308" text-anchor="middle" font-size="11" fill="#D7F2EE">.github/workflows/quarto-publish.yml</text>

  <rect x="900" y="326" width="300" height="44" rx="6" fill="#1E3A66"/>
  <text x="1050" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Authentication</text>
  <text x="1050" y="362" text-anchor="middle" font-size="11" fill="#D7F2EE">Public (GitHub Pages)</text>

  <rect x="900" y="380" width="300" height="44" rx="6" fill="#0D1B2E"/>
  <text x="1050" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">whalermike.github.io/uiao</text>
  <text x="1050" y="414" text-anchor="middle" font-size="11" fill="#D7F2EE">Live external documentation site</text>

  <rect x="900" y="434" width="300" height="32" rx="5" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="1050" y="454" text-anchor="middle" font-size="11" fill="#0D1B2E">repo-url: github.com/WhalerMike/uiao</text>

  <!-- ──────────────────────────────────────────── -->
  <!-- ARROWS: Source → Targets                     -->
  <!-- ──────────────────────────────────────────── -->
  <!-- Source → IIS (left) -->
  <line x1="458" y1="440" x2="404" y2="440" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="432" y="432" text-anchor="middle" font-size="11" fill="#1E8C8C">render-docs.ps1</text>

  <!-- Source → GitHub Pages (right) -->
  <line x1="822" y1="440" x2="876" y2="440" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="849" y="432" text-anchor="middle" font-size="11" fill="#1E8C8C">quarto-publish.yml</text>

  <!-- ──────────────────────────────────────────── -->
  <!-- BOTTOM: Comparison table                     -->
  <!-- ──────────────────────────────────────────── -->
  <rect x="60" y="510" width="1160" height="30" rx="4" fill="#0D1B2E"/>
  <text x="200" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Property</text>
  <text x="500" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Internal (IIS)</text>
  <text x="900" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">External (GitHub Pages)</text>

  <rect x="60" y="540" width="1160" height="32" rx="0" fill="#EAF1FB"/>
  <text x="200" y="560" text-anchor="middle" font-size="12" fill="#0D1B2E">URL</text>
  <text x="500" y="560" text-anchor="middle" font-size="12" fill="#33414F">docs.uiao.local</text>
  <text x="900" y="560" text-anchor="middle" font-size="12" fill="#33414F">whalermike.github.io/uiao</text>

  <rect x="60" y="572" width="1160" height="32" rx="0" fill="#F7F9FC"/>
  <text x="200" y="592" text-anchor="middle" font-size="12" fill="#0D1B2E">Trigger</text>
  <text x="500" y="592" text-anchor="middle" font-size="12" fill="#33414F">Gitea post-receive hook</text>
  <text x="900" y="592" text-anchor="middle" font-size="12" fill="#33414F">GitHub Actions on push to main</text>

  <rect x="60" y="604" width="1160" height="32" rx="0" fill="#EAF1FB"/>
  <text x="200" y="624" text-anchor="middle" font-size="12" fill="#0D1B2E">Auth</text>
  <text x="500" y="624" text-anchor="middle" font-size="12" fill="#33414F">Windows Integrated (domain users)</text>
  <text x="900" y="624" text-anchor="middle" font-size="12" fill="#33414F">Public (no authentication)</text>

  <rect x="60" y="636" width="1160" height="32" rx="0" fill="#F7F9FC"/>
  <text x="200" y="656" text-anchor="middle" font-size="12" fill="#0D1B2E">Hosting</text>
  <text x="500" y="656" text-anchor="middle" font-size="12" fill="#33414F">IIS on Windows Server 2025</text>
  <text x="900" y="656" text-anchor="middle" font-size="12" fill="#33414F">GitHub Pages (CDN)</text>

  <rect x="60" y="668" width="1160" height="32" rx="0" fill="#EAF1FB"/>
  <text x="200" y="688" text-anchor="middle" font-size="12" fill="#0D1B2E">Content</text>
  <text x="500" y="688" text-anchor="middle" font-size="12" fill="#33414F">Full site (all 124 pages)</text>
  <text x="900" y="688" text-anchor="middle" font-size="12" fill="#33414F">Full site (all 124 pages) · same source</text>

  <!-- Column dividers in table -->
  <line x1="340" y1="510" x2="340" y2="700" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="680" y1="510" x2="680" y2="700" stroke="#E3E8EF" stroke-width="1"/>
</svg>
