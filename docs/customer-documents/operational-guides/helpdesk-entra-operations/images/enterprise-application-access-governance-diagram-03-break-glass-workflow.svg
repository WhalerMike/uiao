<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093). navy #0D1B2E · teal #1E8C8C · amber #D4A017 (emergency/severity) · red #C0392B (alert) · ice #EAF1FB · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <text x="60" y="60" font-family="Georgia, serif" font-size="35" font-weight="bold" fill="#0D1B2E">Workflow C &#8212; Emergency / Break-Glass Access</text>
  <text x="60" y="92" font-size="18" fill="#5A5A5A">Granted fast under tight conditions, then reconciled &#8212; never unaccountable.</text>

  <!-- phase labels + divider -->
  <text x="60" y="156" font-size="17" font-weight="bold" fill="#1E8C8C" letter-spacing="1.5">PHASE 1 &#183; GRANT</text>
  <text x="700" y="156" font-size="17" font-weight="bold" fill="#1E8C8C" letter-spacing="1.5">PHASE 2 &#183; RECONCILE</text>
  <line x1="645" y1="135" x2="645" y2="560" stroke="#5A5A5A" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Emergency trigger (amber) -->
  <rect x="50" y="210" width="170" height="104" rx="10" fill="#D4A017"/>
  <text x="135" y="256" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Emergency</text>
  <text x="135" y="280" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">trigger</text>
  <text x="135" y="302" text-anchor="middle" font-size="13" fill="#0D1B2E">incident / outage</text>

  <line x1="220" y1="262" x2="270" y2="262" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <!-- Time-boxed elevated access (navy) -->
  <rect x="274" y="198" width="300" height="128" rx="10" fill="#0D1B2E"/>
  <text x="424" y="236" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Time-boxed elevated access</text>
  <text x="424" y="268" text-anchor="middle" font-size="14" fill="#EAF1FB">incident ticket required &#183; dual authorization</text>
  <text x="424" y="292" text-anchor="middle" font-size="14" fill="#EAF1FB">automatic expiry &#183; least privilege scope</text>

  <!-- Red SIEM alert -->
  <line x1="424" y1="326" x2="424" y2="384" stroke="#C0392B" stroke-width="3" marker-end="url(#arrow-red)"/>
  <rect x="274" y="388" width="300" height="74" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.5"/>
  <text x="424" y="418" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0392B">Automatic SIEM alert</text>
  <text x="424" y="442" text-anchor="middle" font-size="15" fill="#33414F">notifies IGO + CISO at sign-in</text>

  <!-- cross-divider teal arrow to phase 2 -->
  <line x1="574" y1="262" x2="696" y2="262" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="635" y="250" text-anchor="middle" font-size="13" fill="#5A5A5A">after</text>

  <!-- Mandatory review (navy) -->
  <rect x="700" y="198" width="240" height="128" rx="10" fill="#0D1B2E"/>
  <text x="820" y="248" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Mandatory</text>
  <text x="820" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">post-incident review</text>
  <text x="820" y="302" text-anchor="middle" font-size="13" fill="#9FB6CF">required for every break-glass use</text>

  <line x1="940" y1="262" x2="986" y2="262" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <!-- Revoked + evidence (navy) -->
  <rect x="990" y="198" width="250" height="128" rx="10" fill="#0D1B2E"/>
  <text x="1115" y="248" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Access revoked</text>
  <text x="1115" y="280" text-anchor="middle" font-size="15" fill="#EAF1FB">evidence recorded</text>
  <text x="1115" y="302" text-anchor="middle" font-size="13" fill="#9FB6CF">closed in the governance record</text>

  <text x="60" y="610" font-size="16" fill="#33414F">Break-glass trades speed for accountability: access is granted immediately, but every use is alerted, time-boxed, reviewed, and revoked.</text>
</svg>
