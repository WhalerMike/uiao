<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093). navy #0D1B2E · teal #1E8C8C · ice #EAF1FB · red #C0392B · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>
  <text x="640" y="52" fill="#0D1B2E" font-family="Georgia, serif" font-weight="bold" font-size="30" text-anchor="middle">SAM pipeline (A2 / A3) — owner / IGO approves, then provision</text>

  <rect x="80" y="300" width="180" height="64" rx="6" fill="#0D1B2E"/>
  <text x="170" y="337" fill="#FFFFFF" font-size="17" text-anchor="middle">A2 / A3 request</text>

  <line x1="260" y1="332" x2="320" y2="332" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <rect x="320" y="300" width="200" height="64" rx="6" fill="#0D1B2E"/>
  <text x="420" y="337" fill="#FFFFFF" font-size="17" text-anchor="middle">SAM access request</text>

  <!-- approval chain -->
  <line x1="520" y1="332" x2="580" y2="332" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <rect x="580" y="232" width="280" height="60" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="720" y="257" fill="#0D1B2E" font-size="16" text-anchor="middle">A2 — Manager + Application Owner</text>
  <text x="720" y="279" fill="#0D1B2E" font-size="13" fill-opacity="0.85" text-anchor="middle">business need + app-specific approval</text>
  <rect x="580" y="372" width="280" height="60" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="720" y="397" fill="#0D1B2E" font-size="16" text-anchor="middle">A3 — IGO / Identity Eng (dual)</text>
  <text x="720" y="419" fill="#0D1B2E" font-size="13" text-anchor="middle">high-authority approval</text>
  <line x1="540" y1="320" x2="578" y2="280" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <line x1="540" y1="344" x2="578" y2="392" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>

  <!-- provision decision -->
  <line x1="860" y1="262" x2="920" y2="312" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <line x1="860" y1="402" x2="920" y2="352" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <polygon points="1050,278 1190,332 1050,386 910,332" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1050" y="328" fill="#0D1B2E" font-size="14" text-anchor="middle">SAM connector</text>
  <text x="1050" y="348" fill="#0D1B2E" font-size="14" text-anchor="middle">can provision?</text>

  <line x1="1050" y1="278" x2="1050" y2="232" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <text x="1068" y="262" fill="#5A5A5A" font-size="14">yes</text>
  <rect x="900" y="160" width="300" height="64" rx="6" fill="#1E8C8C"/>
  <text x="1050" y="197" fill="#FFFFFF" font-size="17" text-anchor="middle">SAM provisions in Entra</text>

  <line x1="1050" y1="386" x2="1050" y2="436" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <text x="1068" y="416" fill="#5A5A5A" font-size="14">no</text>
  <rect x="880" y="436" width="340" height="64" rx="6" fill="#0D1B2E"/>
  <text x="1050" y="466" fill="#FFFFFF" font-size="16" text-anchor="middle">ServiceNow RITM → SCTASK</text>
  <text x="1050" y="488" fill="#FFFFFF" font-size="14" text-anchor="middle">Cloud Services (group→app-role, ImmutableID)</text>

  <!-- close -->
  <path d="M1050,224 C760,250 720,520 880,556" fill="none" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <line x1="1050" y1="500" x2="1050" y2="556" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <rect x="880" y="556" width="340" height="60" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1050" y="592" fill="#0D1B2E" font-size="16" text-anchor="middle">Close in SAM — system of record</text>

  <text x="640" y="676" fill="#5A5A5A" font-size="15" text-anchor="middle">Admin Consent (A3) is triaged and escalated to the IGO — never auto-executed</text>
</svg>
