<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093). navy #0D1B2E · teal #1E8C8C · ice #EAF1FB · red #C0392B · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>
  <text x="640" y="52" fill="#0D1B2E" font-family="Georgia, serif" font-weight="bold" font-size="30" text-anchor="middle">The triage decision — classify by authority</text>

  <rect x="520" y="84" width="240" height="56" rx="6" fill="#0D1B2E"/>
  <text x="640" y="116" fill="#FFFFFF" font-size="17" text-anchor="middle">Triage record (sender, subject, body)</text>

  <!-- microsoft hard rule -->
  <line x1="640" y1="140" x2="640" y2="178" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <polygon points="640,178 800,224 640,270 480,224" fill="#FBE9E7" stroke="#C0392B" stroke-width="2"/>
  <text x="640" y="219" fill="#C0392B" font-size="16" text-anchor="middle">From</text>
  <text x="640" y="239" fill="#C0392B" font-size="16" text-anchor="middle">@microsoft.com?</text>
  <line x1="800" y1="224" x2="950" y2="224" stroke="#C0392B" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="875" y="214" fill="#C0392B" font-size="14" text-anchor="middle">yes</text>
  <rect x="950" y="196" width="280" height="56" rx="6" fill="#C0392B"/>
  <text x="1090" y="221" fill="#FFFFFF" font-size="16" text-anchor="middle">A3 — escalate only</text>
  <text x="1090" y="241" fill="#FFFFFF" font-size="13" text-anchor="middle">never actioned from the email</text>

  <!-- match request type -->
  <line x1="640" y1="270" x2="640" y2="306" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <text x="660" y="292" fill="#5A5A5A" font-size="14">no</text>
  <rect x="500" y="306" width="280" height="52" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="338" fill="#0D1B2E" font-size="17" text-anchor="middle">Match request type → tier</text>

  <!-- tier chips -->
  <line x1="640" y1="358" x2="640" y2="392" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <g font-size="16" text-anchor="middle">
    <rect x="120" y="396" width="150" height="48" rx="6" fill="#0D1B2E"/><text x="195" y="425" fill="#FFFFFF">A0</text>
    <rect x="300" y="396" width="150" height="48" rx="6" fill="#0D1B2E"/><text x="375" y="425" fill="#FFFFFF">A1</text>
    <rect x="480" y="396" width="150" height="48" rx="6" fill="#0D1B2E"/><text x="555" y="425" fill="#FFFFFF">A2</text>
    <rect x="660" y="396" width="150" height="48" rx="6" fill="#0D1B2E"/><text x="735" y="425" fill="#FFFFFF">A3</text>
    <rect x="900" y="396" width="190" height="48" rx="6" fill="#C0392B"/><text x="995" y="425" fill="#FFFFFF">Out of scope</text>
  </g>

  <!-- destinations -->
  <rect x="180" y="540" width="280" height="64" rx="6" fill="#1E8C8C"/>
  <text x="320" y="567" fill="#FFFFFF" font-size="17" text-anchor="middle" font-weight="bold">ServiceNow pipeline</text>
  <text x="320" y="589" fill="#FFFFFF" font-size="14" text-anchor="middle">A0 / A1</text>
  <line x1="195" y1="444" x2="300" y2="538" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <line x1="375" y1="444" x2="335" y2="538" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>

  <rect x="540" y="540" width="280" height="64" rx="6" fill="#1E8C8C"/>
  <text x="680" y="567" fill="#FFFFFF" font-size="17" text-anchor="middle" font-weight="bold">SAM pipeline</text>
  <text x="680" y="589" fill="#FFFFFF" font-size="14" text-anchor="middle">A2 / A3</text>
  <line x1="555" y1="444" x2="650" y2="538" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <line x1="735" y1="444" x2="700" y2="538" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>

  <rect x="900" y="540" width="200" height="64" rx="6" fill="#C0392B"/>
  <text x="1000" y="576" fill="#FFFFFF" font-size="17" text-anchor="middle">Escalate</text>
  <line x1="995" y1="444" x2="1000" y2="538" stroke="#C0392B" stroke-width="2.5" marker-end="url(#ar)"/>

  <text x="640" y="664" fill="#5A5A5A" font-size="15" text-anchor="middle">@microsoft.com mail is forced to A3 escalate-only before any other match · the matrix is the single source of truth</text>
</svg>
