<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093). navy #0D1B2E · teal #1E8C8C · ice #EAF1FB · red #C0392B · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>
  <text x="640" y="52" fill="#0D1B2E" font-family="Georgia, serif" font-weight="bold" font-size="30" text-anchor="middle">ServiceNow pipeline (A0 / A1) — manager approves, then execute</text>

  <rect x="60" y="300" width="180" height="64" rx="6" fill="#0D1B2E"/>
  <text x="150" y="337" fill="#FFFFFF" font-size="17" text-anchor="middle">A0 / A1 record</text>

  <line x1="240" y1="332" x2="300" y2="332" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <polygon points="430,278 560,332 430,386 300,332" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="430" y="328" fill="#0D1B2E" font-size="15" text-anchor="middle">A0 — no</text>
  <text x="430" y="348" fill="#0D1B2E" font-size="15" text-anchor="middle">approval?</text>

  <!-- A1: manager approval -->
  <line x1="430" y1="386" x2="430" y2="440" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <text x="450" y="418" fill="#5A5A5A" font-size="14">no (A1)</text>
  <rect x="300" y="440" width="260" height="64" rx="6" fill="#0D1B2E"/>
  <text x="430" y="467" fill="#FFFFFF" font-size="16" text-anchor="middle">Flow Designer:</text>
  <text x="430" y="489" fill="#FFFFFF" font-size="16" text-anchor="middle">manager approval</text>
  <!-- rejected -->
  <line x1="560" y1="472" x2="640" y2="472" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <rect x="640" y="446" width="160" height="52" rx="6" fill="#EAF1FB" stroke="#C0392B" stroke-width="2"/>
  <text x="720" y="477" fill="#C0392B" font-size="15" text-anchor="middle">rejected → close</text>

  <!-- spoke decision (A0 yes goes here too) -->
  <line x1="560" y1="332" x2="720" y2="332" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <text x="630" y="322" fill="#5A5A5A" font-size="14">yes</text>
  <path d="M430,504 C430,300 700,360 760,338" fill="none" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <text x="600" y="430" fill="#5A5A5A" font-size="13">approved</text>
  <polygon points="900,278 1040,332 900,386 760,332" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="900" y="328" fill="#0D1B2E" font-size="15" text-anchor="middle">Entra ID Spoke</text>
  <text x="900" y="348" fill="#0D1B2E" font-size="15" text-anchor="middle">covers it?</text>

  <line x1="900" y1="278" x2="900" y2="232" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <text x="918" y="262" fill="#5A5A5A" font-size="14">yes</text>
  <rect x="740" y="160" width="320" height="72" rx="6" fill="#1E8C8C"/>
  <text x="900" y="190" fill="#FFFFFF" font-size="17" text-anchor="middle" font-weight="bold">Spoke action (auto)</text>
  <text x="900" y="214" fill="#FFFFFF" font-size="14" text-anchor="middle">password reset · add-to-group · license</text>

  <line x1="900" y1="386" x2="900" y2="436" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <text x="918" y="416" fill="#5A5A5A" font-size="14">no</text>
  <rect x="740" y="436" width="320" height="72" rx="6" fill="#0D1B2E"/>
  <text x="900" y="466" fill="#FFFFFF" font-size="17" text-anchor="middle">SCTASK → Help Desk</text>
  <text x="900" y="490" fill="#FFFFFF" font-size="14" text-anchor="middle">Cloud Services only if Help Desk cannot</text>

  <!-- converge -->
  <path d="M1060,196 C1180,260 1180,520 1060,572" fill="none" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <path d="M1060,472 C1120,500 1120,540 1060,566" fill="none" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <rect x="740" y="560" width="320" height="60" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="900" y="596" fill="#0D1B2E" font-size="17" text-anchor="middle">Validate · close · log</text>

  <text x="640" y="676" fill="#5A5A5A" font-size="15" text-anchor="middle">Approval sits with the requester's manager — never a Cloud Services peer for routine work</text>
</svg>
