<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint figure (ADR-093). Palette: navy #0D1B2E · teal #1E8C8C ·
       amber #D4A017 (escalation/severity only) · red #C0392B (loss/gap) ·
       ice #EAF1FB · grey #5A5A5A · white background. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="64" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#0D1B2E">The Four-Layer OrgPath Governance Model</text>
  <text x="60" y="98" font-size="19" fill="#5A5A5A">Requests flow upward; each layer adds context and accountability before the next.</text>

  <!-- Upward flow arrow (left rail) -->
  <line x1="150" y1="648" x2="150" y2="172" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="118" y="420" font-size="17" font-weight="bold" fill="#1E8C8C" letter-spacing="1.5" transform="rotate(-90 118 420)" text-anchor="middle">REQUEST + CONTEXT FLOWS UPWARD</text>

  <!-- ===== LAYER 4 (top) ===== -->
  <rect x="300" y="150" width="680" height="112" rx="10" fill="#0D1B2E"/>
  <rect x="316" y="170" width="72" height="72" rx="10" fill="#1E8C8C"/>
  <text x="352" y="206" text-anchor="middle" dominant-baseline="central" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="408" y="186" font-size="23" font-weight="bold" fill="#FFFFFF">Identity Governance Authority (IGO)</text>
  <text x="408" y="214" font-size="16" fill="#EAF1FB">Final approval &#183; all Admin Consent &#183; risk tiers &#183; PIM</text>
  <text x="408" y="238" font-size="14" fill="#9FB6CF">Entra: Global Administrator / Privileged Role Administrator (via PIM)</text>

  <!-- Admin Consent control badge (amber = escalation gate) -->
  <rect x="1000" y="166" width="220" height="80" rx="10" fill="#D4A017"/>
  <rect x="1016" y="190" width="16" height="20" rx="3" fill="none" stroke="#0D1B2E" stroke-width="3"/>
  <path d="M1019 190 v-6 a5 5 0 0 1 10 0 v6" fill="none" stroke="#0D1B2E" stroke-width="3"/>
  <text x="1044" y="198" font-size="16" font-weight="bold" fill="#0D1B2E">ADMIN CONSENT</text>
  <text x="1016" y="224" font-size="14" fill="#0D1B2E">Layer 4 only &#8212;</text>
  <text x="1016" y="242" font-size="14" fill="#0D1B2E">non-delegable</text>

  <!-- ===== LAYER 3 ===== -->
  <rect x="300" y="280" width="680" height="112" rx="10" fill="#0D1B2E"/>
  <rect x="316" y="300" width="72" height="72" rx="10" fill="#1E8C8C"/>
  <text x="352" y="336" text-anchor="middle" dominant-baseline="central" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="408" y="316" font-size="23" font-weight="bold" fill="#FFFFFF">Application Owner</text>
  <text x="408" y="344" font-size="16" fill="#EAF1FB">Second-stage approver &#183; sponsors (not approves) Admin Consent</text>
  <text x="408" y="368" font-size="14" fill="#9FB6CF">Entra: Enterprise Application owner &#183; quarterly access certification</text>

  <!-- ===== LAYER 2 ===== -->
  <rect x="300" y="410" width="680" height="112" rx="10" fill="#0D1B2E"/>
  <rect x="316" y="430" width="72" height="72" rx="10" fill="#1E8C8C"/>
  <text x="352" y="466" text-anchor="middle" dominant-baseline="central" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="408" y="446" font-size="23" font-weight="bold" fill="#FFFFFF">Departmental / Team Owner</text>
  <text x="408" y="474" font-size="16" fill="#EAF1FB">First-stage approver &#183; validates legitimate business need</text>
  <text x="408" y="498" font-size="14" fill="#9FB6CF">Entra: group owner &#183; accountable for the unit's access footprint</text>

  <!-- ===== LAYER 1 (bottom) ===== -->
  <rect x="300" y="540" width="680" height="112" rx="10" fill="#0D1B2E"/>
  <rect x="316" y="560" width="72" height="72" rx="10" fill="#1E8C8C"/>
  <text x="352" y="596" text-anchor="middle" dominant-baseline="central" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="408" y="576" font-size="23" font-weight="bold" fill="#FFFFFF">Requester</text>
  <text x="408" y="604" font-size="16" fill="#EAF1FB">Initiates request via the SAM self-service portal</text>
  <text x="408" y="628" font-size="14" fill="#9FB6CF">No approval authority &#183; cannot initiate or approve Admin Consent</text>

  <!-- Footer caption -->
  <text x="300" y="688" font-size="15" fill="#5A5A5A">OrgPath is the governance pattern &#183; SAM (SailPoint IGA) enforces it &#183; ServiceNow executes downstream.</text>
</svg>
