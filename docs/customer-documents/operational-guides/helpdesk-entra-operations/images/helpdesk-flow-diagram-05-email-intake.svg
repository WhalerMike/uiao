<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093). navy #0D1B2E · teal #1E8C8C · ice #EAF1FB · red #C0392B · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>
  <text x="640" y="56" fill="#0D1B2E" font-family="Georgia, serif" font-weight="bold" font-size="30" text-anchor="middle">Email intake — redirect into the ServiceNow triage queue</text>

  <!-- six-box pipeline -->
  <g font-size="15" text-anchor="middle">
    <rect x="40"   y="230" width="175" height="86" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <text x="127" y="268" fill="#0D1B2E">Sender</text><text x="127" y="290" fill="#5A5A5A" font-size="13">email to Cloud Services</text>

    <rect x="233"  y="230" width="175" height="86" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <text x="320" y="268" fill="#0D1B2E">Exchange</text><text x="320" y="289" fill="#0D1B2E">transport rule</text>

    <rect x="426"  y="230" width="175" height="86" rx="6" fill="#0D1B2E"/>
    <text x="513" y="268" fill="#FFFFFF">ServiceNow</text><text x="513" y="289" fill="#FFFFFF">Email Account</text>

    <rect x="619"  y="230" width="175" height="86" rx="6" fill="#0D1B2E"/>
    <text x="706" y="277" fill="#FFFFFF">Email Filters</text>

    <rect x="812"  y="230" width="175" height="86" rx="6" fill="#0D1B2E"/>
    <text x="899" y="268" fill="#FFFFFF">Inbound</text><text x="899" y="289" fill="#FFFFFF">Email Action</text>

    <rect x="1005" y="226" width="235" height="94" rx="6" fill="#1E8C8C"/>
    <text x="1122" y="262" fill="#FFFFFF" font-weight="bold" font-size="16">Triage queue</text><text x="1122" y="286" fill="#FFFFFF" font-size="13">record created · assignee blank</text>
  </g>
  <g stroke="#1E8C8C" stroke-width="2.5">
    <line x1="215" y1="273" x2="231" y2="273" marker-end="url(#at)"/>
    <line x1="408" y1="273" x2="424" y2="273" marker-end="url(#at)"/>
    <line x1="601" y1="273" x2="617" y2="273" marker-end="url(#at)"/>
    <line x1="794" y1="273" x2="810" y2="273" marker-end="url(#at)"/>
    <line x1="987" y1="273" x2="1003" y2="273" marker-end="url(#at)"/>
  </g>
  <text x="706" y="200" fill="#5A5A5A" font-size="13" text-anchor="middle">filters drop loops / junk</text>

  <!-- reroute path -->
  <rect x="430" y="470" width="320" height="70" rx="6" fill="#EAF1FB" stroke="#C0392B" stroke-width="2"/>
  <text x="590" y="500" fill="#0D1B2E" font-size="16" text-anchor="middle">Ticket already assigned</text>
  <text x="590" y="522" fill="#0D1B2E" font-size="16" text-anchor="middle">to Cloud Services</text>

  <line x1="750" y1="505" x2="840" y2="505" stroke="#C0392B" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="840" y="470" width="320" height="70" rx="6" fill="#C0392B"/>
  <text x="1000" y="500" fill="#FFFFFF" font-size="16" text-anchor="middle">Business Rule:</text>
  <text x="1000" y="522" fill="#FFFFFF" font-size="16" text-anchor="middle">reroute to triage</text>

  <path d="M1122,470 C1122,420 1122,380 1122,322" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="1150" y="400" fill="#C0392B" font-size="13" text-anchor="start">back to triage</text>

  <text x="640" y="636" fill="#5A5A5A" font-size="15" text-anchor="middle">Redirect (not forward) preserves the audit trail · the record lands in triage with no assignee · Cloud Services is escalation-only</text>
</svg>
