<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093). navy #0D1B2E · teal #1E8C8C · ice #EAF1FB · red #C0392B · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>
  <text x="640" y="56" fill="#0D1B2E" font-family="Georgia, serif" font-weight="bold" font-size="30" text-anchor="middle">Recommended target architecture — ServiceNow is the single front door</text>

  <!-- intake band -->
  <rect x="40" y="120" width="200" height="70" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="140" y="148" fill="#0D1B2E" font-size="18" text-anchor="middle">Inbound request</text>
  <text x="140" y="170" fill="#5A5A5A" font-size="14" text-anchor="middle">user · Microsoft · manager</text>

  <line x1="240" y1="155" x2="300" y2="155" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <rect x="300" y="120" width="200" height="70" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="400" y="150" fill="#0D1B2E" font-size="17" text-anchor="middle">Exchange transport</text>
  <text x="400" y="172" fill="#0D1B2E" font-size="17" text-anchor="middle">rule (redirect)</text>

  <line x1="500" y1="155" x2="560" y2="155" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <rect x="560" y="120" width="220" height="70" rx="6" fill="#0D1B2E"/>
  <text x="670" y="150" fill="#FFFFFF" font-size="18" text-anchor="middle">ServiceNow</text>
  <text x="670" y="172" fill="#FFFFFF" font-size="18" text-anchor="middle">triage queue</text>

  <!-- classify decision -->
  <line x1="670" y1="190" x2="670" y2="248" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <polygon points="670,248 830,300 670,352 510,300" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="670" y="295" fill="#0D1B2E" font-size="18" text-anchor="middle">Classify by</text>
  <text x="670" y="317" fill="#0D1B2E" font-size="18" text-anchor="middle">authority</text>

  <!-- three branches -->
  <rect x="120" y="420" width="280" height="64" rx="6" fill="#0D1B2E"/>
  <text x="260" y="447" fill="#FFFFFF" font-size="17" text-anchor="middle">ServiceNow pipeline</text>
  <text x="260" y="469" fill="#FFFFFF" font-size="15" text-anchor="middle">A0 / A1 — manager approval</text>
  <path d="M560,320 C420,360 320,380 260,418" fill="none" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>

  <rect x="500" y="420" width="280" height="64" rx="6" fill="#0D1B2E"/>
  <text x="640" y="447" fill="#FFFFFF" font-size="17" text-anchor="middle">SAM pipeline</text>
  <text x="640" y="469" fill="#FFFFFF" font-size="15" text-anchor="middle">A2 / A3 — owner / IGO approval</text>
  <line x1="670" y1="352" x2="650" y2="418" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>

  <rect x="880" y="420" width="280" height="64" rx="6" fill="#C0392B"/>
  <text x="1020" y="447" fill="#FFFFFF" font-size="17" text-anchor="middle">Escalate (out of scope)</text>
  <text x="1020" y="469" fill="#FFFFFF" font-size="15" text-anchor="middle">Security · Identity Eng</text>
  <path d="M780,320 C920,360 1000,380 1020,418" fill="none" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>

  <!-- execution -->
  <path d="M260,484 C260,540 400,556 540,560" fill="none" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <path d="M640,484 C640,520 640,536 640,556" fill="none" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#at)"/>
  <rect x="300" y="560" width="680" height="76" rx="6" fill="#1E8C8C"/>
  <text x="640" y="590" fill="#FFFFFF" font-size="19" text-anchor="middle" font-weight="bold">Execute</text>
  <text x="640" y="616" fill="#FFFFFF" font-size="16" text-anchor="middle">Entra ID Spoke auto-action where one exists · else manual Help Desk task</text>

  <text x="640" y="688" fill="#5A5A5A" font-size="15" text-anchor="middle">ServiceNow is the single front door · triage by authority · automate via the Spoke, people only for the gaps</text>
</svg>
