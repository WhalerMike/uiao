<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093). navy #0D1B2E · teal #1E8C8C · amber #D4A017 (severity) · red #C0392B · ice #EAF1FB · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-teal-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="64" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#0D1B2E">The Three-Platform Operating Model</text>
  <text x="60" y="98" font-size="19" fill="#5A5A5A">SAM governs and approves &#183; ServiceNow routes and tracks &#183; Entra ID is where access changes.</text>

  <!-- SAM -->
  <rect x="70" y="210" width="320" height="150" rx="10" fill="#0D1B2E"/>
  <text x="230" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#FFFFFF">SAM</text>
  <text x="230" y="292" text-anchor="middle" font-size="16" fill="#9FB6CF">SailPoint IGA</text>
  <text x="230" y="324" text-anchor="middle" font-size="17" fill="#EAF1FB">Governance &amp; approval</text>

  <!-- ServiceNow -->
  <rect x="480" y="210" width="320" height="150" rx="10" fill="#0D1B2E"/>
  <text x="640" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#FFFFFF">ServiceNow</text>
  <text x="640" y="292" text-anchor="middle" font-size="16" fill="#9FB6CF">ITSM</text>
  <text x="640" y="324" text-anchor="middle" font-size="17" fill="#EAF1FB">Routes &amp; tracks the work item</text>

  <!-- Entra ID -->
  <rect x="890" y="210" width="320" height="150" rx="10" fill="#0D1B2E"/>
  <text x="1050" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#FFFFFF">Microsoft Entra ID</text>
  <text x="1050" y="294" text-anchor="middle" font-size="16" fill="#9FB6CF">The action lands here</text>
  <text x="1050" y="324" text-anchor="middle" font-size="17" fill="#EAF1FB">Access change is executed</text>

  <!-- arrows between platforms -->
  <line x1="390" y1="285" x2="478" y2="285" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="434" y="272" text-anchor="middle" font-size="13" fill="#5A5A5A">approved</text>
  <line x1="800" y1="285" x2="888" y2="285" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="844" y="272" text-anchor="middle" font-size="13" fill="#5A5A5A">RITM</text>

  <!-- SAM automated provisioning (dashed) straight to Entra -->
  <path d="M230 360 L230 440 L1050 440 L1050 360" fill="none" stroke="#1E8C8C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-teal-dash)"/>
  <rect x="500" y="418" width="280" height="30" rx="6" fill="#FFFFFF"/>
  <text x="640" y="439" text-anchor="middle" font-size="15" fill="#1E8C8C">automated provisioning (SAM Entra connector)</text>

  <!-- Help Desk Operator (teal) executing residual manual action -->
  <rect x="890" y="510" width="320" height="120" rx="10" fill="#1E8C8C"/>
  <text x="1050" y="552" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">Help Desk Operator</text>
  <text x="1050" y="582" text-anchor="middle" font-size="16" fill="#EAF1FB">Executes the residual manual action</text>
  <text x="1050" y="606" text-anchor="middle" font-size="16" fill="#EAF1FB">under just-in-time PIM</text>
  <line x1="1050" y1="508" x2="1050" y2="362" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="1066" y="440" font-size="14" fill="#5A5A5A">manual action</text>

  <text x="70" y="688" font-size="15" fill="#5A5A5A">SAM governs &#183; ServiceNow executes &#183; Entra ID is where access changes. The Help Desk performs only what automation cannot reach.</text>
</svg>
