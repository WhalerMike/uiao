<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093). navy #0D1B2E · teal #1E8C8C · amber #D4A017 · red #C0392B (prohibition) · ice #EAF1FB · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="60" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">Admin Consent Escalation &#8212; Decision Tree</text>
  <text x="60" y="92" font-size="18" fill="#5A5A5A">The Help Desk triages and routes the request; it never approves Admin Consent.</text>

  <!-- Start -->
  <rect x="420" y="120" width="400" height="68" rx="10" fill="#0D1B2E"/>
  <text x="620" y="160" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Admin Consent request reaches Help Desk</text>
  <line x1="620" y1="188" x2="620" y2="226" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <!-- Decision diamond -->
  <polygon points="620,232 772,320 620,408 468,320" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2.5"/>
  <text x="620" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Application Owner</text>
  <text x="620" y="334" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">sponsorship attached?</text>

  <!-- NO -> route to App Owner -->
  <line x1="468" y1="320" x2="392" y2="320" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="430" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">NO</text>
  <rect x="90" y="278" width="300" height="86" rx="10" fill="#1E8C8C"/>
  <text x="240" y="314" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Route to Application Owner</text>
  <text x="240" y="340" text-anchor="middle" font-size="16" fill="#EAF1FB">for sponsorship</text>
  <!-- App Owner sponsors, rejoins the escalation path -->
  <path d="M240 364 L240 470 L468 470" fill="none" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#arrow-teal)"/>
  <text x="300" y="462" font-size="14" fill="#5A5A5A">sponsored &#8594; re-enters</text>

  <!-- YES -> escalate -->
  <line x1="620" y1="408" x2="620" y2="442" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="650" y="430" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E8C8C">YES</text>
  <rect x="468" y="446" width="304" height="86" rx="10" fill="#0D1B2E"/>
  <text x="620" y="482" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Package &amp; escalate to the</text>
  <text x="620" y="508" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Identity Governance Authority</text>

  <line x1="620" y1="532" x2="620" y2="572" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <rect x="468" y="576" width="304" height="80" rx="10" fill="#0D1B2E"/>
  <text x="620" y="610" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">IGO approves or denies</text>
  <text x="620" y="634" text-anchor="middle" font-size="15" fill="#EAF1FB">decision recorded in the governance record</text>

  <!-- Prohibition box -->
  <rect x="860" y="300" width="360" height="160" rx="12" fill="#FFFFFF" stroke="#C0392B" stroke-width="3"/>
  <text x="884" y="342" font-size="18" font-weight="bold" fill="#C0392B">Help Desk must NOT</text>
  <text x="884" y="368" font-size="18" font-weight="bold" fill="#C0392B">approve Admin Consent</text>
  <text x="884" y="404" font-size="15" fill="#33414F">Approval authority is non-delegable</text>
  <text x="884" y="426" font-size="15" fill="#33414F">below Layer 4 (Identity Governance</text>
  <text x="884" y="448" font-size="15" fill="#33414F">Authority). Triage and route only.</text>
</svg>
