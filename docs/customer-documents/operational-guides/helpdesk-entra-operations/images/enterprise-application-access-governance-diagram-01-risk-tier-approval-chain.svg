<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093). navy #0D1B2E · teal #1E8C8C · amber #D4A017 (HIGH severity only) · red #C0392B · ice #EAF1FB · mid #6B7A8D · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="64" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#0D1B2E">Risk Tier Drives Approval Depth</text>
  <text x="60" y="98" font-size="19" fill="#5A5A5A">Higher application risk &#8212; deeper approval chain.</text>

  <!-- ===== Tier 3 (low) ===== -->
  <rect x="50" y="168" width="190" height="84" rx="10" fill="#1E8C8C"/>
  <text x="145" y="204" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Tier 3</text>
  <text x="145" y="230" text-anchor="middle" font-size="15" fill="#EAF1FB">Low risk</text>

  <rect x="300" y="170" width="210" height="80" rx="10" fill="#0D1B2E"/>
  <text x="405" y="216" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Requester</text>
  <line x1="510" y1="210" x2="566" y2="210" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <rect x="570" y="170" width="230" height="80" rx="10" fill="#0D1B2E"/>
  <text x="685" y="208" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Departmental Owner</text>
  <text x="685" y="230" text-anchor="middle" font-size="13" fill="#9FB6CF">approve / provision</text>

  <!-- ===== Tier 2 (moderate) ===== -->
  <rect x="50" y="328" width="190" height="84" rx="10" fill="#6B7A8D"/>
  <text x="145" y="364" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Tier 2</text>
  <text x="145" y="390" text-anchor="middle" font-size="15" fill="#EAF1FB">Moderate risk</text>

  <rect x="300" y="330" width="210" height="80" rx="10" fill="#0D1B2E"/>
  <text x="405" y="376" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Requester</text>
  <line x1="510" y1="370" x2="566" y2="370" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <rect x="570" y="330" width="230" height="80" rx="10" fill="#0D1B2E"/>
  <text x="685" y="368" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Departmental Owner</text>
  <text x="685" y="390" text-anchor="middle" font-size="13" fill="#9FB6CF">business need</text>
  <line x1="800" y1="370" x2="856" y2="370" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <rect x="860" y="330" width="230" height="80" rx="10" fill="#0D1B2E"/>
  <text x="975" y="368" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Application Owner</text>
  <text x="975" y="390" text-anchor="middle" font-size="13" fill="#9FB6CF">scope review</text>

  <!-- ===== Tier 1 (high) ===== -->
  <rect x="50" y="488" width="190" height="84" rx="10" fill="#D4A017"/>
  <text x="145" y="524" text-anchor="middle" font-size="20" font-weight="bold" fill="#0D1B2E">Tier 1</text>
  <text x="145" y="550" text-anchor="middle" font-size="15" fill="#0D1B2E">High risk</text>

  <rect x="300" y="490" width="190" height="80" rx="10" fill="#0D1B2E"/>
  <text x="395" y="536" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Requester</text>
  <line x1="490" y1="530" x2="538" y2="530" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <rect x="542" y="490" width="210" height="80" rx="10" fill="#0D1B2E"/>
  <text x="647" y="528" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Departmental Owner</text>
  <line x1="752" y1="530" x2="800" y2="530" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <rect x="804" y="490" width="190" height="80" rx="10" fill="#0D1B2E"/>
  <text x="899" y="528" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Application Owner</text>
  <line x1="994" y1="530" x2="1042" y2="530" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <rect x="1046" y="486" width="194" height="88" rx="10" fill="#D4A017"/>
  <text x="1143" y="520" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Identity Governance</text>
  <text x="1143" y="542" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Authority (L4)</text>
  <text x="1143" y="562" text-anchor="middle" font-size="12" fill="#0D1B2E">final approval gate</text>

  <text x="50" y="650" font-size="15" fill="#5A5A5A">SAM routes each request through the chain configured for the application's risk tier. Admin Consent always requires the Tier 1 chain.</text>
</svg>
