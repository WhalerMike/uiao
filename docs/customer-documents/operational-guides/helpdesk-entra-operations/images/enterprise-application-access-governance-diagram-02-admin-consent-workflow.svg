<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093). navy #0D1B2E · teal #1E8C8C · amber #D4A017 (severity/escalation gate) · red #C0392B (prohibition) · ice #EAF1FB · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="64" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0D1B2E">Workflow B &#8212; Admin Consent Request</text>
  <text x="60" y="98" font-size="18" fill="#5A5A5A">Sponsored by the Application Owner; approved only by the Identity Governance Authority.</text>

  <!-- Stage 1: Requester -->
  <rect x="50" y="290" width="200" height="150" rx="10" fill="#0D1B2E"/>
  <text x="150" y="356" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Requester</text>
  <text x="150" y="388" text-anchor="middle" font-size="14" fill="#9FB6CF">initiates the</text>
  <text x="150" y="408" text-anchor="middle" font-size="14" fill="#9FB6CF">consent request</text>

  <line x1="250" y1="365" x2="296" y2="365" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <!-- Stage 2: Departmental Owner -->
  <rect x="300" y="290" width="200" height="150" rx="10" fill="#0D1B2E"/>
  <text x="400" y="350" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Departmental</text>
  <text x="400" y="372" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Owner</text>
  <text x="400" y="404" text-anchor="middle" font-size="14" fill="#9FB6CF">validates business need</text>

  <line x1="500" y1="365" x2="546" y2="365" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <!-- Stage 3: Application Owner -->
  <rect x="550" y="290" width="200" height="150" rx="10" fill="#0D1B2E"/>
  <text x="650" y="344" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Application Owner</text>
  <text x="650" y="378" text-anchor="middle" font-size="14" fill="#EAF1FB">sponsors the request</text>
  <text x="650" y="400" text-anchor="middle" font-size="14" fill="#9FB6CF">scope + risk assessment</text>

  <line x1="750" y1="365" x2="796" y2="365" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <!-- Stage 4: IGO gate (amber) -->
  <rect x="800" y="286" width="200" height="158" rx="10" fill="#D4A017"/>
  <text x="900" y="338" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Identity Governance</text>
  <text x="900" y="360" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Authority</text>
  <text x="900" y="392" text-anchor="middle" font-size="14" fill="#0D1B2E">sole approval authority</text>
  <text x="900" y="414" text-anchor="middle" font-size="14" fill="#0D1B2E">(Layer 4)</text>

  <line x1="1000" y1="365" x2="1046" y2="365" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <!-- Stage 5: Entra consent action -->
  <rect x="1050" y="290" width="190" height="150" rx="10" fill="#0D1B2E"/>
  <text x="1145" y="350" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Entra ID</text>
  <text x="1145" y="374" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">consent action</text>
  <text x="1145" y="406" text-anchor="middle" font-size="13" fill="#9FB6CF">recorded in the audit log</text>

  <!-- Red prohibition note under the gate -->
  <rect x="760" y="486" width="280" height="64" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.5"/>
  <text x="900" y="514" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">No approval below Layer 4</text>
  <text x="900" y="536" text-anchor="middle" font-size="14" fill="#33414F">consent approval is non-delegable</text>
  <line x1="900" y1="444" x2="900" y2="484" stroke="#C0392B" stroke-width="2" stroke-dasharray="5 4"/>

  <text x="50" y="630" font-size="16" fill="#33414F">The request travels as a documented package &#8212; business justification, sponsorship, scope, and risk tier &#8212; so the IGO never receives a cold, context-free request.</text>
</svg>
