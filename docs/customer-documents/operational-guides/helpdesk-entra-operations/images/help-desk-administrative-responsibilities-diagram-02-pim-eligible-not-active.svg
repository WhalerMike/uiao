<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093). navy #0D1B2E · teal #1E8C8C · amber #D4A017 (severity/escalation) · red #C0392B (prohibited) · ice #EAF1FB · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="64" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#0D1B2E">PIM: Eligible, Not Active</text>
  <text x="60" y="98" font-size="19" fill="#5A5A5A">Help Desk technicians hold eligible roles only &#8212; every elevation is just-in-time and logged.</text>

  <!-- Prohibited: standing active assignment -->
  <rect x="70" y="250" width="360" height="200" rx="12" fill="#FFFFFF" stroke="#C0392B" stroke-width="3"/>
  <line x1="100" y1="290" x2="400" y2="410" stroke="#C0392B" stroke-width="3"/>
  <text x="250" y="306" text-anchor="middle" font-size="22" font-weight="bold" fill="#0D1B2E">Standing (Active)</text>
  <text x="250" y="336" text-anchor="middle" font-size="22" font-weight="bold" fill="#0D1B2E">role assignment</text>
  <text x="250" y="392" text-anchor="middle" font-size="18" font-weight="bold" fill="#C0392B" letter-spacing="1">PROHIBITED</text>
  <text x="250" y="424" text-anchor="middle" font-size="14" fill="#5A5A5A">no always-on privileged access</text>

  <!-- vs -->
  <text x="470" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#5A5A5A">vs</text>

  <!-- Eligible -> activation gate -> time-boxed active -->
  <rect x="520" y="290" width="210" height="120" rx="10" fill="#0D1B2E"/>
  <text x="625" y="338" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">PIM-eligible</text>
  <text x="625" y="364" text-anchor="middle" font-size="17" fill="#EAF1FB">assignment</text>
  <text x="625" y="390" text-anchor="middle" font-size="14" fill="#9FB6CF">Help Desk technician</text>

  <rect x="800" y="300" width="180" height="100" rx="10" fill="#D4A017"/>
  <text x="890" y="338" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Activation gate</text>
  <text x="890" y="362" text-anchor="middle" font-size="13" fill="#0D1B2E">justification &#183; MFA</text>
  <text x="890" y="382" text-anchor="middle" font-size="13" fill="#0D1B2E">&#183; time limit</text>

  <rect x="1050" y="290" width="190" height="120" rx="10" fill="#0D1B2E"/>
  <text x="1145" y="334" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Active role</text>
  <text x="1145" y="360" text-anchor="middle" font-size="15" fill="#EAF1FB">time-boxed</text>
  <text x="1145" y="382" text-anchor="middle" font-size="15" fill="#EAF1FB">expires automatically</text>

  <line x1="730" y1="350" x2="798" y2="350" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <line x1="980" y1="350" x2="1048" y2="350" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="625" y="270" text-anchor="middle" font-size="14" fill="#1E8C8C">just-in-time elevation &#8594;</text>

  <text x="70" y="540" font-size="17" fill="#33414F">No standing privileged access. Each activation requires justification, MFA, and a time limit &#8212; and is written to the audit log.</text>
  <text x="70" y="688" font-size="15" fill="#5A5A5A">Eligible roles: Application Administrator &#183; Hybrid Identity Administrator &#183; Authentication Administrator &#183; User Administrator (activated only when needed).</text>
</svg>
