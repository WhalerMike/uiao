<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A66"/>
    </marker>
  </defs>

  <!-- Title block -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Five-Role Stack on One WS2025 Host</text>
  <text x="60" y="88" font-size="18" fill="#6B7A8D">One Tier-0 governance substrate · not a cluster · not a microservice mesh</text>

  <!-- ===== MAIN HOST OUTLINE ===== -->
  <rect x="55" y="108" width="780" height="574" rx="16" fill="#EAF1FB" stroke="#1E3A66" stroke-width="3"/>
  <!-- Host title bar -->
  <rect x="55" y="108" width="780" height="50" rx="16" fill="#1E3A66"/>
  <rect x="55" y="138" width="780" height="20" fill="#1E3A66"/>
  <text x="445" y="136" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">UIAO Platform Server — Windows Server 2025  ·  Single Host</text>

  <!-- ===== ROLE STRIPS (stacked) ===== -->

  <!-- Role 1: Canonical Source of Truth (Gitea) -->
  <rect x="80" y="172" width="730" height="88" rx="10" fill="#2E75B6"/>
  <!-- amber governance overlay tag -->
  <rect x="756" y="175" width="54" height="22" rx="4" fill="#D4A017"/>
  <text x="783" y="186" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#0D1B2E">ADR-041</text>
  <text x="445" y="200" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#FFFFFF">Role 1 — Canonical Source of Truth</text>
  <text x="445" y="226" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#FFFFFF">Gitea · versioned governance artifacts · signed commits · every change is a commit</text>
  <text x="445" y="250" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">OrgPath codebook · group rules · delegation matrices · plans · policy libraries · adapter manifests · drift reports</text>

  <!-- Role 2: HTTPS Reverse Proxy (IIS) -->
  <rect x="80" y="270" width="730" height="74" rx="10" fill="#1E3A66"/>
  <text x="445" y="298" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#FFFFFF">Role 2 — HTTPS Reverse Proxy + Client-Cert Terminator</text>
  <text x="445" y="330" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#D7F2EE">IIS + URL Rewrite + ARR · TLS + mTLS · HSTS · HTTP/2 · AD LDAPS auth landing</text>

  <!-- Role 3: Legacy-to-Modern Auth Bridge (Kerberos + PKI) -->
  <rect x="80" y="354" width="730" height="74" rx="10" fill="#1E3A66"/>
  <text x="445" y="382" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#FFFFFF">Role 3 — Legacy-to-Modern Auth Bridge</text>
  <text x="445" y="414" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#D7F2EE">Kerberos (AD-joined, read-only) · Enterprise PKI · Entra-registered (OAuth2/OIDC, read-write)</text>

  <!-- Role 4: Transformation Engine Host (PowerShell + Python) -->
  <rect x="80" y="438" width="730" height="88" rx="10" fill="#1E8C8C"/>
  <text x="445" y="466" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#FFFFFF">Role 4 — Transformation Engine Host</text>
  <text x="445" y="494" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#FFFFFF">PowerShell 7.4+ (AD reads, Pester) · Python 3.12+ (networkx, OSCAL, UIAO_158 schema)</text>
  <text x="445" y="518" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">Graph · ARM · Intune · Infoblox WAPI · ServiceNow REST · CyberArk REST · ScubaGear</text>

  <!-- Role 5: Adapter Dispatcher (DM_* + UIAO_159) -->
  <rect x="80" y="536" width="730" height="74" rx="10" fill="#0D1B2E"/>
  <!-- amber registry overlay tag -->
  <rect x="756" y="539" width="54" height="22" rx="4" fill="#D4A017"/>
  <text x="783" y="550" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#0D1B2E">DM_*</text>
  <text x="445" y="564" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#FFFFFF">Role 5 — Adapter Dispatcher</text>
  <text x="445" y="596" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#D7F2EE">DM_* adapter interface · UIAO_159 glue · vendor-pluggable dispatch</text>

  <!-- Host footer: operational properties strip -->
  <rect x="55" y="620" width="780" height="42" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1"/>
  <text x="445" y="641" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#0D1B2E">Tier-0 · OrgPath: NCR / IT / InfraOps · Drift-monitored (UIAO_163) · DR-ready (ADR-090) · Arc-enrolled</text>

  <!-- ===== RIGHT PANEL ===== -->

  <!-- Two-Brain Split callout box -->
  <rect x="875" y="108" width="350" height="130" rx="10" fill="#EAF1FB" stroke="#1E3A66" stroke-width="2"/>
  <text x="1050" y="132" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#0D1B2E">Two-Brain Split (ADR-002)</text>
  <line x1="890" y1="148" x2="1210" y2="148" stroke="#E3E8EF" stroke-width="1"/>
  <rect x="890" y="155" width="145" height="70" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="962" y="178" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0D1B2E">Governance Brain</text>
  <text x="962" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#33414F">Copilot</text>
  <text x="962" y="214" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#33414F">review + authorize</text>
  <rect x="1050" y="155" width="145" height="70" rx="6" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1"/>
  <text x="1122" y="178" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0D1B2E">Execution Brain</text>
  <text x="1122" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#33414F">Execution Substrate</text>
  <text x="1122" y="214" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#33414F">deliver + log</text>

  <!-- Arrow: platform server to integration targets -->
  <line x1="840" y1="400" x2="870" y2="400" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Integration targets box -->
  <rect x="875" y="268" width="350" height="330" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1050" y="296" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#0D1B2E">Integration Targets</text>
  <line x1="890" y1="312" x2="1210" y2="312" stroke="#E3E8EF" stroke-width="1"/>

  <text x="895" y="335" font-size="14" font-weight="bold" fill="#1E3A66">Entra ID</text>
  <text x="1000" y="335" font-size="12" fill="#5A5A5A">Read-write · adapter-specs/entra-id</text>

  <text x="895" y="358" font-size="14" font-weight="bold" fill="#1E3A66">Intune</text>
  <text x="1000" y="358" font-size="12" fill="#5A5A5A">Read-write · adapter-specs/intune</text>

  <text x="895" y="381" font-size="14" font-weight="bold" fill="#1E3A66">Azure Arc</text>
  <text x="1000" y="381" font-size="12" fill="#5A5A5A">Read-write · DM_060 scope</text>

  <text x="895" y="404" font-size="14" font-weight="bold" fill="#1E8C8C">Infoblox / BlueCat</text>
  <text x="1000" y="404" font-size="12" fill="#5A5A5A">Read-write · DM_010</text>

  <text x="895" y="427" font-size="14" font-weight="bold" fill="#1E8C8C">Cisco ISE / NPS</text>
  <text x="1000" y="427" font-size="12" fill="#5A5A5A">Read-write · DM_030</text>

  <text x="895" y="450" font-size="14" font-weight="bold" fill="#5A5A5A">AD Forest (legacy)</text>
  <text x="1000" y="450" font-size="12" fill="#5A5A5A">Read-only · UIAO_159</text>

  <text x="895" y="473" font-size="14" font-weight="bold" fill="#5A5A5A">ADCS (legacy PKI)</text>
  <text x="1000" y="473" font-size="12" fill="#5A5A5A">Read-only · DM_020</text>

  <text x="895" y="496" font-size="14" font-weight="bold" fill="#5A5A5A">ServiceNow</text>
  <text x="1000" y="496" font-size="12" fill="#5A5A5A">Read-write · adapter-specs/service-now</text>

  <text x="895" y="519" font-size="14" font-weight="bold" fill="#5A5A5A">CyberArk</text>
  <text x="1000" y="519" font-size="12" fill="#5A5A5A">Read-write · adapter-specs/cyberark</text>

  <text x="895" y="542" font-size="14" font-weight="bold" fill="#5A5A5A">GitHub</text>
  <text x="1000" y="542" font-size="12" fill="#5A5A5A">Read-write · upstream canon mirror</text>

  <line x1="890" y1="554" x2="1210" y2="554" stroke="#E3E8EF" stroke-width="1"/>
  <text x="1050" y="576" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6B7A8D">Every integration drift-revalidated on schedule</text>

  <!-- Adapter identifier callout -->
  <rect x="875" y="620" width="350" height="42" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1"/>
  <text x="1050" y="641" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E">DM_010..080 · UIAO_158 · UIAO_159 · UIAO_163 · UIAO_167</text>
</svg>
