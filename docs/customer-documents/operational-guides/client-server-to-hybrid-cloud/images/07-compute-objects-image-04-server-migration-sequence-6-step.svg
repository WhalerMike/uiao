<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="60" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Server Migration Sequence — 6 Steps</text>
  <text x="60" y="93" font-size="18" fill="#6B7A8D">Arc onboarding to domain-unjoin: per-server sequence for domain-joined Windows and Linux servers</text>

  <!-- Step boxes — horizontal layout, 6 steps across -->
  <!-- Step widths: each step box ~175px wide, arrows ~25px, total = 6*175 + 5*30 + 2*60 = 1050+150+120 = needs fitting -->
  <!-- Let's use: x start=60, step width=172, gap=22, total = 60 + 6*172 + 5*22 = 60+1032+110=1202 fits in 1280 -->

  <!-- Step number circles and boxes -->

  <!-- STEP 1 -->
  <rect x="60" y="180" width="172" height="360" rx="10" fill="#1E3A66"/>
  <circle cx="146" cy="215" r="22" fill="#1E8C8C"/>
  <text x="146" y="215" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="146" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Enroll in Intune</text>
  <text x="146" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">compliance tracking</text>
  <text x="146" y="316" text-anchor="middle" font-size="11" fill="#D7F2EE">Server agent reports</text>
  <text x="146" y="333" text-anchor="middle" font-size="11" fill="#D7F2EE">compliance to Intune</text>
  <text x="146" y="350" text-anchor="middle" font-size="11" fill="#D7F2EE">via Graph API</text>
  <text x="146" y="378" text-anchor="middle" font-size="11" fill="#D7F2EE">CA uses signal for</text>
  <text x="146" y="395" text-anchor="middle" font-size="11" fill="#D7F2EE">server-to-server</text>
  <text x="146" y="412" text-anchor="middle" font-size="11" fill="#D7F2EE">auth policies</text>
  <!-- State badge -->
  <rect x="76" y="500" width="140" height="26" rx="5" fill="#0D1B2E"/>
  <text x="146" y="513" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#D7F2EE">Still domain-joined</text>

  <!-- Arrow 1 to 2 -->
  <line x1="232" y1="360" x2="252" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- STEP 2 -->
  <rect x="254" y="180" width="172" height="360" rx="10" fill="#1E3A66"/>
  <circle cx="340" cy="215" r="22" fill="#1E8C8C"/>
  <text x="340" y="215" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="340" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Arc-connect</text>
  <text x="340" y="316" text-anchor="middle" font-size="11" fill="#D7F2EE">Install azcmagent</text>
  <text x="340" y="333" text-anchor="middle" font-size="11" fill="#D7F2EE">Register with Arc</text>
  <text x="340" y="350" text-anchor="middle" font-size="11" fill="#D7F2EE">Apply OrgPath tags:</text>
  <text x="340" y="375" text-anchor="middle" font-size="10" fill="#D4A017" font-family="Consolas, 'DejaVu Sans Mono', monospace">OrgPath:</text>
  <text x="340" y="390" text-anchor="middle" font-size="10" fill="#D4A017" font-family="Consolas, 'DejaVu Sans Mono', monospace">NCR / IT / InfraOps</text>
  <text x="340" y="408" text-anchor="middle" font-size="10" fill="#D4A017" font-family="Consolas, 'DejaVu Sans Mono', monospace">DeviceTier: Tier0</text>
  <text x="340" y="426" text-anchor="middle" font-size="10" fill="#D4A017" font-family="Consolas, 'DejaVu Sans Mono', monospace">Environment: Prod</text>
  <!-- State badge -->
  <rect x="270" y="500" width="140" height="26" rx="5" fill="#0D1B2E"/>
  <text x="340" y="513" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1E8C8C">Arc connected</text>

  <!-- Arrow 2 to 3 -->
  <line x1="426" y1="360" x2="446" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- STEP 3 -->
  <rect x="448" y="180" width="172" height="360" rx="10" fill="#1E3A66"/>
  <circle cx="534" cy="215" r="22" fill="#1E8C8C"/>
  <text x="534" y="215" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="534" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Assign Azure Policy</text>
  <text x="534" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">/ Guest Config</text>
  <text x="534" y="316" text-anchor="middle" font-size="11" fill="#D7F2EE">Settings previously</text>
  <text x="534" y="333" text-anchor="middle" font-size="11" fill="#D7F2EE">from GPO now come</text>
  <text x="534" y="350" text-anchor="middle" font-size="11" fill="#D7F2EE">from Arc</text>
  <text x="534" y="378" text-anchor="middle" font-size="11" fill="#D7F2EE">Policy targets OrgPath</text>
  <text x="534" y="395" text-anchor="middle" font-size="11" fill="#D7F2EE">tags in Azure</text>
  <!-- State badge -->
  <rect x="464" y="500" width="140" height="26" rx="5" fill="#0D1B2E"/>
  <text x="534" y="513" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1E8C8C">Policy migrating</text>

  <!-- Arrow 3 to 4 -->
  <line x1="620" y1="360" x2="640" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- STEP 4 -->
  <rect x="642" y="180" width="172" height="360" rx="10" fill="#1E3A66"/>
  <circle cx="728" cy="215" r="22" fill="#1E8C8C"/>
  <text x="728" y="215" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="728" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Validate</text>
  <text x="728" y="316" text-anchor="middle" font-size="11" fill="#D7F2EE">Guest Config reports</text>
  <text x="728" y="333" text-anchor="middle" font-size="11" fill="#D7F2EE">compliant</text>
  <text x="728" y="355" text-anchor="middle" font-size="11" fill="#D7F2EE">Expected settings</text>
  <text x="728" y="372" text-anchor="middle" font-size="11" fill="#D7F2EE">present</text>
  <text x="728" y="394" text-anchor="middle" font-size="11" fill="#D7F2EE">Drift engine reports</text>
  <text x="728" y="411" text-anchor="middle" font-size="11" fill="#D7F2EE">zero</text>
  <text x="728" y="433" text-anchor="middle" font-size="11" fill="#D7F2EE">All SPNs resolved</text>
  <!-- State badge -->
  <rect x="658" y="500" width="140" height="26" rx="5" fill="#1E8C8C"/>
  <text x="728" y="513" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FFFFFF">Ready to unjoin</text>

  <!-- Arrow 4 to 5 -->
  <line x1="814" y1="360" x2="834" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- STEP 5 -->
  <rect x="836" y="180" width="172" height="360" rx="10" fill="#0D1B2E"/>
  <circle cx="922" cy="215" r="22" fill="#C0392B"/>
  <text x="922" y="215" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="922" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Domain-unjoin</text>
  <text x="922" y="316" text-anchor="middle" font-size="11" fill="#D7F2EE">Only once all legacy</text>
  <text x="922" y="333" text-anchor="middle" font-size="11" fill="#D7F2EE">AD dependencies</text>
  <text x="922" y="350" text-anchor="middle" font-size="11" fill="#D7F2EE">are resolved:</text>
  <text x="922" y="375" text-anchor="middle" font-size="11" fill="#D7F2EE">Kerberos clients</text>
  <text x="922" y="392" text-anchor="middle" font-size="11" fill="#D7F2EE">migrated</text>
  <text x="922" y="414" text-anchor="middle" font-size="11" fill="#D7F2EE">No AD-anchored</text>
  <text x="922" y="431" text-anchor="middle" font-size="11" fill="#D7F2EE">local admins</text>
  <!-- State badge -->
  <rect x="852" y="500" width="140" height="26" rx="5" fill="#C0392B"/>
  <text x="922" y="513" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FFFFFF">AD link severed</text>

  <!-- Arrow 5 to 6 -->
  <line x1="1008" y1="360" x2="1028" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- STEP 6 -->
  <rect x="1030" y="180" width="190" height="360" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <circle cx="1125" cy="215" r="22" fill="#1E8C8C"/>
  <text x="1125" y="215" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">6</text>
  <text x="1125" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Post-unjoin</text>
  <text x="1125" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">validation</text>
  <text x="1125" y="316" text-anchor="middle" font-size="11" fill="#33414F">Server reboots clean</text>
  <text x="1125" y="338" text-anchor="middle" font-size="11" fill="#33414F">Arc heartbeat continues</text>
  <text x="1125" y="360" text-anchor="middle" font-size="11" fill="#33414F">Guest Config re-applies</text>
  <text x="1125" y="378" text-anchor="middle" font-size="11" fill="#33414F">without AD</text>
  <text x="1125" y="406" text-anchor="middle" font-size="11" fill="#1E8C8C" font-weight="bold">Zero AD dependency</text>
  <!-- State badge -->
  <rect x="1046" y="500" width="158" height="26" rx="5" fill="#1E8C8C"/>
  <text x="1125" y="513" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FFFFFF">Arc-connected (target)</text>

  <!-- Timeline annotation -->
  <rect x="60" y="555" width="1160" height="40" rx="6" fill="#F7F9FC" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="80" y1="575" x2="1200" y2="575" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="640" y="570" text-anchor="middle" font-size="12" fill="#6B7A8D">Typical federal server fleet: 6–18 months end-to-end depending on Kerberos-app inventory</text>
  <text x="640" y="585" text-anchor="middle" font-size="11" fill="#5A5A5A">SPN resolution gate: no server domain-unjoins until every SPN on that server is migrated, retired, or islanded</text>

  <!-- SPN gate callout -->
  <rect x="60" y="612" width="560" height="50" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1"/>
  <text x="340" y="630" text-anchor="middle" font-size="13" font-weight="bold" fill="#D4A017">SPN Resolution Gate (Chapter 02)</text>
  <text x="340" y="650" text-anchor="middle" font-size="12" fill="#33414F">Each SPN: migrate to OAuth2/OIDC  |  retire  |  island with end-of-life date</text>

  <!-- Adapter reference -->
  <rect x="660" y="612" width="560" height="50" rx="6" fill="#F7F9FC" stroke="#E3E8EF" stroke-width="1"/>
  <text x="940" y="630" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E" font-family="Consolas, 'DejaVu Sans Mono', monospace">DM_060</text>
  <text x="940" y="650" text-anchor="middle" font-size="12" fill="#5A5A5A">Device Management Adapter Interface — discovery, risk assessment, migration path, validation</text>
</svg>
