<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Microsoft Provides the Instruments. UIAO Provides the Orchestra.</text>
  <text x="60" y="88" font-size="18" fill="#6B7A8D">Each tool is individually excellent. Collective governance is what UIAO adds.</text>

  <!-- Divider line -->
  <line x1="60" y1="104" x2="1220" y2="104" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ========== LEFT PANEL ========== -->
  <rect x="40" y="114" width="548" height="578" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>

  <!-- Left panel header -->
  <rect x="40" y="114" width="548" height="58" rx="10" fill="#0D1B2E"/>
  <rect x="40" y="152" width="548" height="20" fill="#0D1B2E"/>
  <text x="314" y="144" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="bold" fill="#FFFFFF">Instruments — Microsoft Provides</text>

  <!-- Left panel subtitle -->
  <text x="314" y="190" text-anchor="middle" font-size="14" fill="#1E3A66">Individual authorized tools — each outstanding, each independent</text>

  <!-- LEFT PANEL tiles: 3 columns x 3 rows = 9 tiles -->
  <!-- Row 1: Entra ID | Intune | Azure Arc -->
  <rect x="60" y="204" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="139" y="230" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Entra ID</text>
  <text x="139" y="253" text-anchor="middle" font-size="11" fill="#5A5A5A">Cloud identity directory</text>

  <rect x="233" y="204" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="312" y="230" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Intune</text>
  <text x="312" y="253" text-anchor="middle" font-size="11" fill="#5A5A5A">MDM + device policy</text>

  <rect x="406" y="204" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="485" y="230" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Azure Arc</text>
  <text x="485" y="253" text-anchor="middle" font-size="11" fill="#5A5A5A">Hybrid server management</text>

  <!-- Row 2: Conditional Access | Azure Private DNS | Sentinel -->
  <rect x="60" y="284" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="139" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Conditional</text>
  <text x="139" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Access</text>
  <text x="139" y="341" text-anchor="middle" font-size="11" fill="#5A5A5A">Access-policy enforcement</text>

  <rect x="233" y="284" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="312" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Azure Private</text>
  <text x="312" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">DNS</text>
  <text x="312" y="341" text-anchor="middle" font-size="11" fill="#5A5A5A">Hybrid DNS resolution</text>

  <rect x="406" y="284" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="485" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Sentinel</text>
  <text x="485" y="332" text-anchor="middle" font-size="11" fill="#5A5A5A">SIEM + threat detection</text>

  <!-- Row 3: Defender | Purview | Key Vault -->
  <rect x="60" y="364" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="139" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Defender</text>
  <text x="139" y="413" text-anchor="middle" font-size="11" fill="#5A5A5A">Endpoint + cloud protection</text>

  <rect x="233" y="364" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="312" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Purview</text>
  <text x="312" y="413" text-anchor="middle" font-size="11" fill="#5A5A5A">Information governance</text>

  <rect x="406" y="364" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="485" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Key Vault</text>
  <text x="485" y="413" text-anchor="middle" font-size="11" fill="#5A5A5A">Secrets + certificate store</text>

  <!-- Left panel gap callout -->
  <rect x="60" y="452" width="504" height="72" rx="6" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="312" y="476" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">No framework decides what the target looks like,</text>
  <text x="312" y="498" text-anchor="middle" font-size="14" fill="#C0392B">how to get there, or how to prove it was done right.</text>
  <text x="312" y="516" text-anchor="middle" font-size="13" fill="#C0392B">Each tool is individually authorized. None governs the rest.</text>

  <!-- Left panel footer -->
  <text x="314" y="554" text-anchor="middle" font-size="13" fill="#5A5A5A">Nine individually authorized, individually excellent tools.</text>
  <text x="314" y="574" text-anchor="middle" font-size="13" fill="#5A5A5A">No shared governance layer. No orchestration. No canon.</text>
  <text x="314" y="600" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">Without coordination</text>

  <!-- ========== CENTER ARROW ========== -->
  <line x1="600" y1="403" x2="684" y2="403" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="642" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">+ UIAO</text>
  <text x="642" y="423" text-anchor="middle" font-size="11" fill="#6B7A8D">orchestration</text>

  <!-- ========== RIGHT PANEL ========== -->
  <rect x="694" y="114" width="546" height="578" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2.5"/>

  <!-- Right panel header -->
  <rect x="694" y="114" width="546" height="58" rx="10" fill="#1E8C8C"/>
  <rect x="694" y="152" width="546" height="20" fill="#1E8C8C"/>
  <text x="967" y="144" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="bold" fill="#FFFFFF">Orchestra — UIAO Provides</text>

  <!-- Right panel subtitle -->
  <text x="967" y="190" text-anchor="middle" font-size="14" fill="#1E3A66">Same tools + coordination layer + governance + evidence</text>

  <!-- RIGHT PANEL tiles: 3 columns x 3 rows = 9 tiles, teal bordered -->
  <!-- Row 1 -->
  <rect x="714" y="204" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="793" y="225" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Entra ID</text>
  <text x="793" y="249" text-anchor="middle" font-size="11" fill="#1E8C8C">OrgPath groups · AU governance</text>

  <rect x="887" y="204" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="966" y="225" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Intune</text>
  <text x="966" y="249" text-anchor="middle" font-size="11" fill="#1E8C8C">GPO-mapped profiles · plan-driven</text>

  <rect x="1060" y="204" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1139" y="225" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Azure Arc</text>
  <text x="1139" y="249" text-anchor="middle" font-size="11" fill="#1E8C8C">Retire/project decided in canon</text>

  <!-- Row 2 -->
  <rect x="714" y="284" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="793" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Conditional</text>
  <text x="793" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Access</text>
  <text x="793" y="341" text-anchor="middle" font-size="11" fill="#1E8C8C">CA-NNN · OrgPath targeted</text>

  <rect x="887" y="284" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="966" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Azure Private</text>
  <text x="966" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">DNS</text>
  <text x="966" y="341" text-anchor="middle" font-size="11" fill="#1E8C8C">Zone authority in Gitea</text>

  <rect x="1060" y="284" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1139" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Sentinel</text>
  <text x="1139" y="332" text-anchor="middle" font-size="11" fill="#1E8C8C">Feeds drift engine · SLA tickets</text>

  <!-- Row 3 -->
  <rect x="714" y="364" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="793" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Defender</text>
  <text x="793" y="413" text-anchor="middle" font-size="11" fill="#1E8C8C">Evidence stream to ATO package</text>

  <rect x="887" y="364" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="966" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Purview</text>
  <text x="966" y="413" text-anchor="middle" font-size="11" fill="#1E8C8C">Data governance by OrgPath</text>

  <rect x="1060" y="364" width="158" height="66" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1139" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Key Vault</text>
  <text x="1139" y="413" text-anchor="middle" font-size="11" fill="#1E8C8C">Secrets rotated by signed plans</text>

  <!-- Coordination overlay dashed connectors across right panel tiles -->
  <!-- Horizontal row 1 -->
  <line x1="872" y1="237" x2="887" y2="237" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="1045" y1="237" x2="1060" y2="237" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Horizontal row 2 -->
  <line x1="872" y1="317" x2="887" y2="317" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="1045" y1="317" x2="1060" y2="317" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Horizontal row 3 -->
  <line x1="872" y1="397" x2="887" y2="397" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="1045" y1="397" x2="1060" y2="397" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Vertical: col 1 between rows -->
  <line x1="793" y1="270" x2="793" y2="284" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="793" y1="350" x2="793" y2="364" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Vertical: col 2 between rows -->
  <line x1="966" y1="270" x2="966" y2="284" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="966" y1="350" x2="966" y2="364" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Vertical: col 3 between rows -->
  <line x1="1139" y1="270" x2="1139" y2="284" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="1139" y1="350" x2="1139" y2="364" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- UIAO governance bar -->
  <rect x="714" y="452" width="504" height="60" rx="6" fill="#0D1B2E"/>
  <text x="966" y="474" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8C8C">UIAO Coordination Layer</text>
  <text x="966" y="498" text-anchor="middle" font-size="12" fill="#FFFFFF">Canon in Gitea · Gates · Signed plans · Drift detection · Evidence · Two-Brain Execution</text>

  <!-- Right panel footer -->
  <text x="967" y="554" text-anchor="middle" font-size="13" fill="#5A5A5A">One coordination layer governs all nine tools together.</text>
  <text x="967" y="574" text-anchor="middle" font-size="13" fill="#5A5A5A">Target surface is a materialization of the canon, not the source of truth.</text>
  <text x="967" y="600" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8C8C">With coordination</text>
</svg>
