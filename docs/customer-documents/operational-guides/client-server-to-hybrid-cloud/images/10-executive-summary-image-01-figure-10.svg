<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

<!-- ── Title bar ─────────────────────────────────────────────────────────── -->
<text x="640" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold"
      fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">
  Microsoft provides the instruments · UIAO provides the orchestra
</text>

<!-- ── Dividing arrow label ───────────────────────────────────────────────── -->
<!-- Center divider: right-pointing arrow at x=634 -->
