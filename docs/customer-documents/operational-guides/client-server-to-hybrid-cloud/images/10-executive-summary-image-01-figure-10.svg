      fill="#5A5A5A" text-anchor="middle">without coordination</text>
<text x="640" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12"
      fill="#1E8C8C" text-anchor="middle">with coordination</text>

<!-- ── Defs ──────────────────────────────────────────────────────────────── -->
<defs>
