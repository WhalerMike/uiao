<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="32" fill="#0D1B2E">Morning Login: Seven-Step Zero-Trust Access Flow</text>
  <text x="60" y="84" font-size="15" fill="#6B7A8D">Device boot to privileged elevation — identity-bound, OrgPath-scoped, drift-monitored</text>

  <!-- Step 1: Device Boot (navy - on-device) -->
  <rect x="40" y="118" width="152" height="200" rx="10" fill="#0D1B2E"/>
  <text x="116" y="162" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E8C8C">1</text>
  <text x="116" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Device Boot</text>
  <text x="116" y="215" text-anchor="middle" font-size="12" fill="#D7F2EE">Intune compliance</text>
  <text x="116" y="232" text-anchor="middle" font-size="12" fill="#D7F2EE">checks run;</text>
  <text x="116" y="249" text-anchor="middle" font-size="12" fill="#D7F2EE">BitLocker unlocks</text>
  <text x="116" y="266" text-anchor="middle" font-size="12" fill="#D7F2EE">w/ Entra-escrowed</text>
  <text x="116" y="283" text-anchor="middle" font-size="12" fill="#D7F2EE">key; device compliant</text>

  <!-- Arrow 1 to 2 -->
  <line x1="193" y1="218" x2="213" y2="218" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: Windows Hello Sign-in (navy - on-device) -->
  <rect x="215" y="118" width="152" height="200" rx="10" fill="#0D1B2E"/>
  <text x="291" y="162" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E8C8C">2</text>
  <text x="291" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Windows Hello</text>
  <text x="291" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Sign-in</text>
  <text x="291" y="237" text-anchor="middle" font-size="12" fill="#D7F2EE">CAC inserted;</text>
  <text x="291" y="254" text-anchor="middle" font-size="12" fill="#D7F2EE">PIN entered;</text>
  <text x="291" y="271" text-anchor="middle" font-size="12" fill="#D7F2EE">Platform SSO /</text>
  <text x="291" y="288" text-anchor="middle" font-size="12" fill="#D7F2EE">Windows Hello</text>

  <!-- Arrow 2 to 3 -->
  <line x1="368" y1="218" x2="388" y2="218" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3: Entra Authentication (ice/cloud) -->
  <rect x="390" y="118" width="152" height="200" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="466" y="162" text-anchor="middle" font-size="38" font-weight="bold" fill="#0D1B2E">3</text>
  <text x="466" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Entra</text>
  <text x="466" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Authentication</text>
  <text x="466" y="237" text-anchor="middle" font-size="12" fill="#33414F">Entra CBA validates</text>
  <text x="466" y="254" text-anchor="middle" font-size="12" fill="#33414F">certificate chain;</text>
  <text x="466" y="271" text-anchor="middle" font-size="12" fill="#33414F">CAE-aware session</text>
  <text x="466" y="288" text-anchor="middle" font-size="12" fill="#33414F">token issued</text>

  <!-- Arrow 3 to 4 -->
  <line x1="543" y1="218" x2="563" y2="218" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4: Conditional Access Evaluation (ice/cloud) -->
  <rect x="565" y="118" width="152" height="200" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="641" y="162" text-anchor="middle" font-size="38" font-weight="bold" fill="#0D1B2E">4</text>
  <text x="641" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Conditional</text>
  <text x="641" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Access Eval</text>
  <text x="641" y="237" text-anchor="middle" font-size="12" fill="#33414F">CA-100 baseline:</text>
  <text x="641" y="254" text-anchor="middle" font-size="12" fill="#33414F">identity + device</text>
  <text x="641" y="271" text-anchor="middle" font-size="12" fill="#33414F">+ location + risk</text>
  <text x="641" y="288" text-anchor="middle" font-size="12" fill="#33414F">all evaluated</text>

  <!-- Arrow 4 to 5 -->
  <line x1="718" y1="218" x2="738" y2="218" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 5: Device Compliance Check (ice/cloud) -->
  <rect x="740" y="118" width="152" height="200" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="816" y="162" text-anchor="middle" font-size="38" font-weight="bold" fill="#0D1B2E">5</text>
  <text x="816" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Device</text>
  <text x="816" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Compliance</text>
  <text x="816" y="237" text-anchor="middle" font-size="12" fill="#33414F">Intune compliance</text>
  <text x="816" y="254" text-anchor="middle" font-size="12" fill="#33414F">signal confirmed;</text>
  <text x="816" y="271" text-anchor="middle" font-size="12" fill="#33414F">posture verified</text>
  <text x="816" y="288" text-anchor="middle" font-size="12" fill="#33414F">via MS Graph</text>

  <!-- Arrow 5 to 6 -->
  <line x1="893" y1="218" x2="913" y2="218" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 6: Certificate-Based VPN/SASE (navy - network edge) -->
  <rect x="915" y="118" width="152" height="200" rx="10" fill="#0D1B2E"/>
  <text x="991" y="162" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E8C8C">6</text>
  <text x="991" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">CBA VPN /</text>
  <text x="991" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">SASE ZTNA</text>
  <text x="991" y="237" text-anchor="middle" font-size="12" fill="#D7F2EE">SASE ZTNA proxy</text>
  <text x="991" y="254" text-anchor="middle" font-size="12" fill="#D7F2EE">accepts Entra token;</text>
  <text x="991" y="271" text-anchor="middle" font-size="12" fill="#D7F2EE">compliance + MFA</text>
  <text x="991" y="288" text-anchor="middle" font-size="12" fill="#D7F2EE">+ OrgPath scope</text>

  <!-- Arrow 6 to 7 (amber — high-severity gate) -->
  <line x1="1068" y1="218" x2="1088" y2="218" stroke="#D4A017" stroke-width="3" marker-end="url(#arrow-amber)"/>

  <!-- Step 7: JIT Privileged Elevation (navy-mid - PAM/privileged tier) -->
  <rect x="1090" y="118" width="152" height="200" rx="10" fill="#1E3A66"/>
  <text x="1166" y="162" text-anchor="middle" font-size="38" font-weight="bold" fill="#D4A017">7</text>
  <text x="1166" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">JIT Privileged</text>
  <text x="1166" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Elevation</text>
  <text x="1166" y="237" text-anchor="middle" font-size="12" fill="#D7F2EE">PIM elevation req;</text>
  <text x="1166" y="254" text-anchor="middle" font-size="12" fill="#D7F2EE">FIDO2 re-auth;</text>
  <text x="1166" y="271" text-anchor="middle" font-size="12" fill="#D7F2EE">60-min session;</text>
  <text x="1166" y="288" text-anchor="middle" font-size="12" fill="#D7F2EE">CyberArk recorded</text>

  <!-- Policy/signal tags beneath each step box -->
  <rect x="40" y="334" width="152" height="34" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="116" y="356" text-anchor="middle" font-size="11" fill="#0D1B2E" font-family="Consolas, 'DejaVu Sans Mono', monospace">Intune · BitLocker</text>

  <rect x="215" y="334" width="152" height="34" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="291" y="356" text-anchor="middle" font-size="11" fill="#0D1B2E" font-family="Consolas, 'DejaVu Sans Mono', monospace">WHfB · Platform SSO</text>

  <rect x="390" y="334" width="152" height="34" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="466" y="356" text-anchor="middle" font-size="11" fill="#0D1B2E" font-family="Consolas, 'DejaVu Sans Mono', monospace">Entra CBA · CAE</text>

  <rect x="565" y="334" width="152" height="34" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="641" y="356" text-anchor="middle" font-size="11" fill="#0D1B2E" font-family="Consolas, 'DejaVu Sans Mono', monospace">CA-100 · CA-400</text>

  <rect x="740" y="334" width="152" height="34" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="816" y="356" text-anchor="middle" font-size="11" fill="#0D1B2E" font-family="Consolas, 'DejaVu Sans Mono', monospace">Intune · MS Graph</text>

  <rect x="915" y="334" width="152" height="34" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="991" y="356" text-anchor="middle" font-size="11" fill="#0D1B2E" font-family="Consolas, 'DejaVu Sans Mono', monospace">ZTNA · SASE · SCIM</text>

  <rect x="1090" y="334" width="152" height="34" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1"/>
  <text x="1166" y="356" text-anchor="middle" font-size="11" fill="#0D1B2E" font-family="Consolas, 'DejaVu Sans Mono', monospace">PIM · UIAO_174</text>

  <!-- Separator -->
  <line x1="40" y1="390" x2="1242" y2="390" stroke="#E3E8EF" stroke-width="1"/>

  <!-- Zero Trust principles row -->
  <text x="60" y="420" font-size="14" font-weight="bold" fill="#0D1B2E">Zero Trust principles enforced at every step:</text>

  <rect x="40" y="436" width="375" height="64" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="228" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Verify Explicitly</text>
  <text x="228" y="477" text-anchor="middle" font-size="12" fill="#33414F">Every request authenticated at point of use;</text>
  <text x="228" y="492" text-anchor="middle" font-size="12" fill="#33414F">identity + device + risk + session per request</text>

  <rect x="435" y="436" width="390" height="64" rx="8" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="630" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Least-Privilege Access</text>
  <text x="630" y="477" text-anchor="middle" font-size="12" fill="#33414F">PIM time-bound · OrgTree AU resource-scoped</text>
  <text x="630" y="492" text-anchor="middle" font-size="12" fill="#33414F">Access Packages · no standing privilege</text>

  <rect x="845" y="436" width="397" height="64" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1043" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Assume Breach</text>
  <text x="1043" y="477" text-anchor="middle" font-size="12" fill="#33414F">CAE revokes live sessions on risk change;</text>
  <text x="1043" y="492" text-anchor="middle" font-size="12" fill="#33414F">CyberArk records every privileged session</text>

  <!-- Separator -->
  <line x1="40" y1="520" x2="1242" y2="520" stroke="#E3E8EF" stroke-width="1"/>

  <!-- Governance identifiers row -->
  <text x="60" y="547" font-size="13" fill="#6B7A8D" font-family="Consolas, 'DejaVu Sans Mono', monospace">UIAO_163 access-plane drift  ·  UIAO_167 SLA response  ·  UIAO_170 identity risk scoring  ·  UIAO_174 governance telemetry (CAE events)  ·  DM_020 PKI</text>

  <!-- Legend -->
  <line x1="40" y1="572" x2="1242" y2="572" stroke="#E3E8EF" stroke-width="1"/>
  <text x="60" y="596" font-size="12" font-weight="bold" fill="#5A5A5A">Legend:</text>
  <rect x="120" y="582" width="16" height="14" rx="3" fill="#0D1B2E"/>
  <text x="143" y="594" font-size="12" fill="#33414F">On-device / endpoint</text>
  <rect x="290" y="582" width="16" height="14" rx="3" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="313" y="594" font-size="12" fill="#33414F">Cloud / Entra surface</text>
  <rect x="470" y="582" width="16" height="14" rx="3" fill="#1E3A66"/>
  <text x="493" y="594" font-size="12" fill="#33414F">Privileged / PAM tier</text>
  <rect x="640" y="582" width="16" height="14" rx="3" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="663" y="594" font-size="12" fill="#33414F">SASE / network edge</text>
  <rect x="820" y="582" width="16" height="14" rx="3" fill="#FBEED2" stroke="#D4A017" stroke-width="1"/>
  <text x="843" y="594" font-size="12" fill="#33414F">Governance / audit</text>
  <rect x="990" y="582" width="16" height="14" rx="3" fill="#D4A017"/>
  <text x="1013" y="594" font-size="12" fill="#33414F">High-severity gate (amber arrow)</text>
</svg>
