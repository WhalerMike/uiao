<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <!-- 08-access-plane-image-01-figure-8.svg
       Caption: Morning login: seven-step Zero-Trust access flow from
       device boot to privileged elevation
       ADR-093 house style: white background, navy/teal/ice palette, pure SVG -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E">Morning Login &#8212; Seven-Step Zero-Trust Access Flow</text>

  <!-- ══════════════════════════════════════════════════════════
       RIGHT RAIL — OrgPath-scoped provenance banner
       ════════════════════════════════════════════════════════ -->
  <rect x="1196" y="80" width="60" height="596" rx="8" fill="#0D1B2E"/>
  <text x="1226" y="378" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90,1226,378)">OrgPath-scoped &#183; provenance-bound &#183; drift-monitored &#183; UIAO_163 / UIAO_174</text>

  <!-- ══════════════════════════════════════════════════════════
       STEP LAYOUT — 7 steps in two rows: 4 top + 3 bottom
       Each step: teal circle number + navy rounded-rect card
       Top row y=80, bottom row y=430
       Step widths: 155px each; gap 10px; left margin 60
       ════════════════════════════════════════════════════════ -->

  <!-- STEP POSITIONS (card left x): 60, 230, 400, 570, 740, 910, 1080 — but 7 in a single row at 1280 wide is tight.
       Use single horizontal row, card width 148, gap 8. Total = 7*148 + 6*8 + 60 + 8 = 1104+48+68=1220. Fits. -->

  <!-- ── Step card macro: x, step#, title, sub1, sub2, sub3 ── -->

  <!-- STEP 1 — Device boot -->
  <!-- teal circle number -->
  <circle cx="100" cy="115" r="22" fill="#1E8C8C"/>
  <text x="100" y="115" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
  <!-- card -->
  <rect x="56" y="140" width="182" height="200" rx="10" fill="#0D1B2E"/>
  <text x="147" y="168" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Device Boot</text>
  <line x1="72" y1="180" x2="222" y2="180" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="147" y="201" font-size="12" fill="#C7D4E6" text-anchor="middle">Intune compliance</text>
  <text x="147" y="219" font-size="12" fill="#C7D4E6" text-anchor="middle">check runs</text>
  <text x="147" y="241" font-size="12" fill="#C7D4E6" text-anchor="middle">BitLocker unlock</text>
  <text x="147" y="259" font-size="12" fill="#C7D4E6" text-anchor="middle">via Entra-escrowed</text>
  <text x="147" y="277" font-size="12" fill="#C7D4E6" text-anchor="middle">recovery key</text>
  <text x="147" y="315" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#6B7A8D" text-anchor="middle">actor: device</text>

  <!-- connector 1→2 -->
  <line x1="238" y1="238" x2="258" y2="238" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>

  <!-- STEP 2 — Windows Hello / CAC sign-in -->
  <circle cx="296" cy="115" r="22" fill="#1E8C8C"/>
  <text x="296" y="115" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="252" y="140" width="182" height="200" rx="10" fill="#0D1B2E"/>
  <text x="343" y="163" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Windows Hello</text>
  <text x="343" y="181" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Sign-In</text>
  <line x1="268" y1="192" x2="418" y2="192" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="343" y="213" font-size="12" fill="#C7D4E6" text-anchor="middle">CAC + PIN or</text>
  <text x="343" y="231" font-size="12" fill="#C7D4E6" text-anchor="middle">Platform SSO passkey</text>
  <text x="343" y="253" font-size="12" fill="#C7D4E6" text-anchor="middle">Entra CBA validates</text>
  <text x="343" y="271" font-size="12" fill="#C7D4E6" text-anchor="middle">certificate chain</text>
  <text x="343" y="293" font-size="12" fill="#C7D4E6" text-anchor="middle">CAE-aware token</text>
  <text x="343" y="311" font-size="12" fill="#C7D4E6" text-anchor="middle">issued</text>
  <text x="343" y="327" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#6B7A8D" text-anchor="middle">actor: Entra CBA</text>

  <!-- connector 2→3 -->
  <line x1="434" y1="238" x2="454" y2="238" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>

  <!-- STEP 3 — Entra Authentication + CA evaluation -->
  <circle cx="492" cy="115" r="22" fill="#1E8C8C"/>
  <text x="492" y="115" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="448" y="140" width="182" height="200" rx="10" fill="#0D1B2E"/>
  <text x="539" y="163" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Conditional Access</text>
  <text x="539" y="181" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Evaluation</text>
  <line x1="464" y1="192" x2="614" y2="192" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="539" y="210" font-size="12" fill="#C7D4E6" text-anchor="middle">CA-100 baseline:</text>
  <!-- tick rows -->
  <text x="464" y="230" font-size="11" fill="#1E8C8C">&#10003;</text>
  <text x="480" y="230" font-size="11" fill="#C7D4E6">compliant device</text>
  <text x="464" y="248" font-size="11" fill="#1E8C8C">&#10003;</text>
  <text x="480" y="248" font-size="11" fill="#C7D4E6">CBA MFA satisfied</text>
  <text x="464" y="266" font-size="11" fill="#1E8C8C">&#10003;</text>
  <text x="480" y="266" font-size="11" fill="#C7D4E6">location in range</text>
  <text x="464" y="284" font-size="11" fill="#1E8C8C">&#10003;</text>
  <text x="480" y="284" font-size="11" fill="#C7D4E6">risk score low</text>
  <text x="539" y="316" font-size="12" fill="#D7F2EE" text-anchor="middle">&#8594; Session allowed</text>
  <text x="539" y="332" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#6B7A8D" text-anchor="middle">actor: Entra CA</text>

  <!-- connector 3→4 -->
  <line x1="630" y1="238" x2="650" y2="238" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>

  <!-- STEP 4 — Entra authentication + app access -->
  <circle cx="688" cy="115" r="22" fill="#1E8C8C"/>
  <text x="688" y="115" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="644" y="140" width="182" height="200" rx="10" fill="#0D1B2E"/>
  <text x="735" y="168" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Application Access</text>
  <line x1="660" y1="180" x2="810" y2="180" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="735" y="201" font-size="12" fill="#C7D4E6" text-anchor="middle">M365 apps open</text>
  <text x="735" y="219" font-size="12" fill="#C7D4E6" text-anchor="middle">Platform SSO satisfies</text>
  <text x="735" y="237" font-size="12" fill="#C7D4E6" text-anchor="middle">subsequent auths</text>
  <text x="735" y="259" font-size="12" fill="#C7D4E6" text-anchor="middle">CAE live — session</text>
  <text x="735" y="277" font-size="12" fill="#C7D4E6" text-anchor="middle">revocable mid-flight</text>
  <text x="735" y="315" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#6B7A8D" text-anchor="middle">actor: Graph / M365</text>

  <!-- connector 4→5 -->
  <line x1="826" y1="238" x2="846" y2="238" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>

  <!-- STEP 5 — VPN-replacement (SASE/ZTNA) -->
  <circle cx="884" cy="115" r="22" fill="#1E8C8C"/>
  <text x="884" y="115" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">5</text>
  <rect x="840" y="140" width="182" height="200" rx="10" fill="#0D1B2E"/>
  <text x="931" y="163" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SASE / ZTNA</text>
  <text x="931" y="181" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">VPN-Replacement</text>
  <line x1="856" y1="192" x2="1006" y2="192" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="931" y="211" font-size="12" fill="#C7D4E6" text-anchor="middle">On-prem app access</text>
  <text x="931" y="229" font-size="12" fill="#C7D4E6" text-anchor="middle">ZTNA reverse-proxy</text>
  <text x="931" y="247" font-size="12" fill="#C7D4E6" text-anchor="middle">validates Entra token</text>
  <text x="931" y="265" font-size="12" fill="#C7D4E6" text-anchor="middle">checks compliance</text>
  <text x="931" y="283" font-size="12" fill="#C7D4E6" text-anchor="middle">+ OrgPath scope</text>
  <text x="931" y="301" font-size="12" fill="#C7D4E6" text-anchor="middle">logs to SIEM</text>
  <text x="931" y="327" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#6B7A8D" text-anchor="middle">actor: SASE edge</text>

  <!-- connector 5→6 -->
  <line x1="1022" y1="238" x2="1042" y2="238" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>

  <!-- STEP 6 — Privileged elevation (PIM + CyberArk) -->
  <circle cx="1080" cy="115" r="22" fill="#1E8C8C"/>
  <text x="1080" y="115" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">6</text>
  <rect x="1036" y="140" width="148" height="200" rx="10" fill="#0D1B2E"/>
  <text x="1110" y="163" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Privileged</text>
  <text x="1110" y="181" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Elevation</text>
  <line x1="1052" y1="192" x2="1168" y2="192" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1110" y="211" font-size="11" fill="#C7D4E6" text-anchor="middle">PIM request</text>
  <text x="1110" y="229" font-size="11" fill="#C7D4E6" text-anchor="middle">FIDO2 re-challenge</text>
  <text x="1110" y="247" font-size="11" fill="#C7D4E6" text-anchor="middle">60 min time-bound</text>
  <text x="1110" y="265" font-size="11" fill="#C7D4E6" text-anchor="middle">CyberArk session</text>
  <text x="1110" y="283" font-size="11" fill="#C7D4E6" text-anchor="middle">recording active</text>
  <text x="1110" y="305" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#6B7A8D" text-anchor="middle">UIAO_174 event</text>
  <text x="1110" y="325" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#6B7A8D" text-anchor="middle">actor: PIM+CyberArk</text>

  <!-- connector 6→7 (below, looping down) -->
  <path d="M1110,340 L1110,380 L1110,420 L1020,420 L1020,460" stroke="#1E8C8C" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#ar-teal)"/>

  <!-- STEP 7 — End of day -->
  <circle cx="940" cy="490" r="22" fill="#1E8C8C"/>
  <text x="940" y="490" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">7</text>
  <rect x="860" y="515" width="218" height="152" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="969" y="540" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">End of Day</text>
  <line x1="876" y1="552" x2="1062" y2="552" stroke="#0D1B2E" stroke-width="1"/>
  <text x="969" y="571" font-size="12" fill="#33414F" text-anchor="middle">Laptop sleeps</text>
  <text x="969" y="589" font-size="12" fill="#33414F" text-anchor="middle">Token expires</text>
  <text x="969" y="607" font-size="12" fill="#33414F" text-anchor="middle">CAE revokes on</text>
  <text x="969" y="625" font-size="12" fill="#33414F" text-anchor="middle">reconnect</text>
  <text x="969" y="647" font-size="11" fill="#6B7A8D" text-anchor="middle">re-auth starts cycle</text>

  <!-- ══════════════════════════════════════════════════════════
       BOTTOM LEGEND / FOOTER
       ════════════════════════════════════════════════════════ -->
  <rect x="60" y="680" width="1120" height="30" rx="6" fill="#EAF1FB" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="80" y1="695" x2="114" y2="695" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
  <text x="122" y="700" font-size="12" fill="#33414F">Teal flow = nominal Zero-Trust path</text>
  <text x="460" y="700" font-size="12" fill="#33414F">Every step: OrgPath-scoped &#183; provenance-emitted &#183; drift-engine monitored</text>
  <text x="970" y="700" font-size="12" fill="#33414F">Failure &#8594; SLA ticket (UIAO_167)</text>
</svg>
