<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">CA Policy Numbering Ranges (CA-000 through CA-999)</text>
  <text x="60" y="84" font-size="16" fill="#6B7A8D">Scope tier determines which numbering band a Conditional Access policy occupies</text>

  <!-- Header row -->
  <rect x="60" y="110" width="220" height="44" rx="8" fill="#0D1B2E"/>
  <text x="170" y="132" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Range</text>

  <rect x="300" y="110" width="500" height="44" rx="8" fill="#0D1B2E"/>
  <text x="550" y="132" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Meaning / Scope Tier</text>

  <rect x="820" y="110" width="400" height="44" rx="8" fill="#1E3A66"/>
  <text x="1020" y="132" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Example Policy ID</text>

  <!-- Row 1: CA-000–099 Foundational / break-glass / emergency -->
  <rect x="60" y="168" width="220" height="60" rx="8" fill="#0D1B2E"/>
  <text x="170" y="198" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="bold" fill="#FFFFFF">CA-000–099</text>

  <rect x="300" y="168" width="500" height="60" rx="8" fill="#1E3A66"/>
  <text x="550" y="198" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">Foundational / break-glass / emergency</text>

  <rect x="820" y="168" width="400" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1020" y="198" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#0D1B2E">CA-001 · BreakGlass-Exclude</text>

  <!-- Row 2: CA-100–199 Enterprise baseline -->
  <rect x="60" y="238" width="220" height="60" rx="8" fill="#1E3A66"/>
  <text x="170" y="268" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="bold" fill="#FFFFFF">CA-100–199</text>

  <rect x="300" y="238" width="500" height="60" rx="8" fill="#1E8C8C"/>
  <text x="550" y="268" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">Enterprise baseline (all users)</text>

  <rect x="820" y="238" width="400" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1020" y="268" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#0D1B2E">CA-100 · Enterprise-MFA</text>

  <!-- Row 3: CA-200–299 Division-scoped -->
  <rect x="60" y="308" width="220" height="60" rx="8" fill="#1E3A66"/>
  <text x="170" y="338" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="bold" fill="#FFFFFF">CA-200–299</text>

  <rect x="300" y="308" width="500" height="60" rx="8" fill="#1E3A66"/>
  <text x="550" y="338" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">Division-scoped</text>

  <rect x="820" y="308" width="400" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1020" y="338" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#0D1B2E">CA-210 · Division-IT-MFA</text>

  <!-- Row 4: CA-300–399 Department-scoped -->
  <rect x="60" y="378" width="220" height="60" rx="8" fill="#1E3A66"/>
  <text x="170" y="408" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="bold" fill="#FFFFFF">CA-300–399</text>

  <rect x="300" y="378" width="500" height="60" rx="8" fill="#1E3A66"/>
  <text x="550" y="408" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">Department-scoped</text>

  <rect x="820" y="378" width="400" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1020" y="408" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#0D1B2E">CA-320 · Dept-FIN-Compliant</text>

  <!-- Row 5: CA-400–499 Role-scoped -->
  <rect x="60" y="448" width="220" height="60" rx="8" fill="#1E3A66"/>
  <text x="170" y="478" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="bold" fill="#FFFFFF">CA-400–499</text>

  <rect x="300" y="448" width="500" height="60" rx="8" fill="#D4A017"/>
  <text x="550" y="462" text-anchor="middle" font-size="17" fill="#FFFFFF">Role-scoped</text>
  <text x="550" y="482" text-anchor="middle" font-size="14" fill="#FFFFFF">(executive, admin, high-risk)</text>

  <rect x="820" y="448" width="400" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1020" y="478" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#0D1B2E">CA-410 · Role-Admin-NoLegacyAuth</text>

  <!-- Row 6: CA-500–599 Workload-specific -->
  <rect x="60" y="518" width="220" height="60" rx="8" fill="#1E3A66"/>
  <text x="170" y="548" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="bold" fill="#FFFFFF">CA-500–599</text>

  <rect x="300" y="518" width="500" height="60" rx="8" fill="#1E3A66"/>
  <text x="550" y="548" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">Workload-specific (M365, SharePoint, custom apps)</text>

  <rect x="820" y="518" width="400" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1020" y="548" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#0D1B2E">CA-510 · M365-Session-Limits</text>

  <!-- Row 7: CA-900–999 Reserved experimental / pilot -->
  <rect x="60" y="588" width="220" height="60" rx="8" fill="#5A5A5A"/>
  <text x="170" y="618" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="bold" fill="#FFFFFF">CA-900–999</text>

  <rect x="300" y="588" width="500" height="60" rx="8" fill="#6B7A8D"/>
  <text x="550" y="618" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">Reserved — experimental / pilot</text>

  <rect x="820" y="588" width="400" height="60" rx="8" fill="#EAF1FB" stroke="#5A5A5A" stroke-width="2"/>
  <text x="1020" y="618" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#5A5A5A">CA-901 · Pilot-NewAuthMethod</text>

  <!-- Note callout -->
  <rect x="60" y="666" width="1160" height="40" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="640" y="686" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#33414F">Every policy picks the next open number in its range. Display name begins with the CA-NNN identifier. ~40 baseline policies in the UIAO CA library.</text>

</svg>
