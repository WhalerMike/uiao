<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <!-- 06-network-services-image-01-figure-6.svg
       Caption: Hybrid resolution topology: on-prem namespace, Private Resolver,
       Private DNS zone, IPAM as single source of truth
       ADR-093 house style: white background, navy/teal/ice palette, pure SVG -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Hybrid Resolution Topology &#8212; DNS, Private Resolver, IPAM</text>

  <!-- ══════════════════════════════════════════════════════════
       COLUMN HEADERS
       ════════════════════════════════════════════════════════ -->
  <text x="170" y="108" font-size="16" font-weight="bold" fill="#6B7A8D" text-anchor="middle">On-Prem Namespace</text>
  <text x="640" y="108" font-size="16" font-weight="bold" fill="#6B7A8D" text-anchor="middle">Azure DNS Private Resolver</text>
  <text x="1080" y="108" font-size="16" font-weight="bold" fill="#6B7A8D" text-anchor="middle">Cloud Namespace</text>

  <!-- ══════════════════════════════════════════════════════════
       LEFT COLUMN — On-prem namespace box (ice + navy border)
       ════════════════════════════════════════════════════════ -->
  <rect x="30" y="120" width="278" height="340" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="169" y="148" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">corp DNS (AD-integrated)</text>

  <!-- AD DNS Server 1 -->
  <rect x="55" y="165" width="230" height="58" rx="8" fill="#0D1B2E"/>
  <text x="170" y="188" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AD-integrated DNS server 1</text>
  <text x="170" y="208" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">UIAO-DC01.corp</text>

  <!-- AD DNS Server 2 -->
  <rect x="55" y="238" width="230" height="58" rx="8" fill="#0D1B2E"/>
  <text x="170" y="261" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AD-integrated DNS server 2</text>
  <text x="170" y="281" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">UIAO-DC02.corp</text>

  <!-- Sample records -->
  <text x="169" y="320" font-size="13" font-weight="bold" fill="#33414F" text-anchor="middle">Sample records</text>
  <text x="169" y="342" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5A5A5A" text-anchor="middle">UIAO-GIT01.corp</text>
  <text x="169" y="360" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5A5A5A" text-anchor="middle">fileserver.corp</text>
  <text x="169" y="378" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5A5A5A" text-anchor="middle">printer.corp</text>

  <!-- Conditional forwarder label -->
  <text x="169" y="436" font-size="12" fill="#6B7A8D" text-anchor="middle">conditional forwarder</text>
  <text x="169" y="452" font-size="12" fill="#6B7A8D" text-anchor="middle">&#8594; inbound endpoint</text>

  <!-- ══════════════════════════════════════════════════════════
       CENTER COLUMN — Azure DNS Private Resolver (ice + navy)
       ════════════════════════════════════════════════════════ -->
  <rect x="440" y="120" width="400" height="340" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2.5"/>
  <text x="640" y="150" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Azure DNS Private Resolver</text>

  <!-- Inbound endpoint -->
  <rect x="468" y="168" width="166" height="64" rx="8" fill="#0D1B2E"/>
  <text x="551" y="193" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Inbound</text>
  <text x="551" y="213" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Endpoint</text>

  <!-- Outbound endpoint -->
  <rect x="648" y="168" width="166" height="64" rx="8" fill="#0D1B2E"/>
  <text x="731" y="193" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Outbound</text>
  <text x="731" y="213" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Endpoint</text>

  <!-- Vertical connector inside resolver -->
  <line x1="640" y1="232" x2="640" y2="280" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>

  <!-- Private DNS Zone (inside resolver box) -->
  <rect x="468" y="284" width="346" height="80" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="641" y="312" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Azure Private DNS Zone</text>
  <text x="641" y="332" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#33414F" text-anchor="middle">uiao.internal (authoritative)</text>
  <text x="641" y="352" font-size="11" fill="#6B7A8D" text-anchor="middle">linked to platform VNet</text>

  <!-- VNet link indicator -->
  <text x="640" y="408" font-size="12" fill="#33414F" text-anchor="middle">VNet DNS settings &#8594; outbound endpoint</text>
  <text x="640" y="428" font-size="12" fill="#33414F" text-anchor="middle">Arc-projected VMs resolve uiao.internal</text>

  <!-- ══════════════════════════════════════════════════════════
       RIGHT COLUMN — Cloud namespace (ice + navy)
       ════════════════════════════════════════════════════════ -->
  <rect x="960" y="120" width="290" height="340" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1105" y="148" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Cloud Namespace</text>

  <!-- Private Link record -->
  <rect x="984" y="165" width="242" height="72" rx="8" fill="#0D1B2E"/>
  <text x="1105" y="191" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Private Link DNS Zone</text>
  <text x="1105" y="211" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">privatelink.blob.core</text>
  <text x="1105" y="228" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#C7D4E6" text-anchor="middle">.windows.net</text>

  <!-- M365 record -->
  <rect x="984" y="252" width="242" height="60" rx="8" fill="#0D1B2E"/>
  <text x="1105" y="278" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">M365 / Azure SaaS</text>
  <text x="1105" y="298" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#C7D4E6" text-anchor="middle">*.microsoftonline.com</text>

  <text x="1105" y="352" font-size="12" fill="#33414F" text-anchor="middle">ZTNA / SASE edge</text>
  <text x="1105" y="370" font-size="12" fill="#33414F" text-anchor="middle">resolves via outbound</text>
  <text x="1105" y="388" font-size="12" fill="#33414F" text-anchor="middle">endpoint forwarder</text>

  <!-- ══════════════════════════════════════════════════════════
       ARROWS between columns
       ════════════════════════════════════════════════════════ -->
  <!-- On-prem → inbound endpoint (bidirectional; show two lines) -->
  <line x1="308" y1="285" x2="435" y2="218" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>
  <text x="367" y="245" font-size="11" fill="#1E8C8C" text-anchor="middle">query</text>

  <!-- Outbound endpoint → right column -->
  <line x1="840" y1="200" x2="956" y2="200" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>
  <text x="896" y="192" font-size="11" fill="#1E8C8C" text-anchor="middle">forward</text>

  <!-- ══════════════════════════════════════════════════════════
       IPAM BAR — spanning all three columns beneath the content
       ════════════════════════════════════════════════════════ -->
  <rect x="30" y="510" width="1220" height="72" rx="10" fill="#0D1B2E"/>
  <text x="640" y="536" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">IPAM (DM_010) &#8212; Single Source of Truth</text>
  <text x="640" y="561" font-size="13" fill="#C7D4E6" text-anchor="middle">IP address ranges &#183; DHCP reservations &#183; DNS record provenance &#183; OrgPath-tagged per scope</text>

  <!-- IPAM upward arrows into each column -->
  <line x1="170" y1="510" x2="170" y2="470" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
  <line x1="640" y1="510" x2="640" y2="378" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
  <line x1="1105" y1="510" x2="1105" y2="470" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>

  <!-- Footer note -->
  <text x="60" y="618" font-size="12" font-style="italic" fill="#6B7A8D">DM_010 IPAM is the authoritative source; DM_015 DNS and DM_016 DHCP derive from it. No DNS-only or DHCP-only migration runs.</text>
  <text x="60" y="638" font-size="12" font-style="italic" fill="#6B7A8D">Drift between IPAM and DNS / DHCP is classified as Hierarchy Drift by UIAO_163.</text>
</svg>
