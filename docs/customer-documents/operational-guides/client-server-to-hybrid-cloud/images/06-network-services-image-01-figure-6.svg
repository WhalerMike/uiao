<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A66"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Figure 6 — Hybrid Resolution Topology</text>
  <text x="60" y="92" font-size="18" fill="#6B7A8D">On-prem namespace · Azure Private Resolver · Azure Private DNS zone · IPAM as single source of truth</text>

  <!-- ═══════════════════════════════════════════════════════════════
       LEFT COLUMN: On-Premises Namespace
       ═══════════════════════════════════════════════════════════════ -->
  <!-- Container -->
  <rect x="50" y="122" width="330" height="470" rx="10" fill="#D7F2EE" stroke="#0D1B2E" stroke-width="2"/>
  <!-- Header bar -->
  <rect x="50" y="122" width="330" height="46" rx="10" fill="#0D1B2E"/>
  <rect x="50" y="148" width="330" height="20" fill="#0D1B2E"/>
  <text x="215" y="150" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">On-Premises Namespace</text>

  <!-- AD-Integrated DNS Server 1 -->
  <rect x="76" y="186" width="278" height="88" rx="10" fill="#0D1B2E"/>
  <text x="215" y="220" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">AD-Integrated DNS Server 1</text>
  <text x="215" y="248" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">DC / DNS · AD-integrated zone</text>

  <!-- AD replication label -->
  <line x1="215" y1="274" x2="215" y2="298" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-teal)"/>
  <text x="222" y="290" font-size="11" fill="#6B7A8D">AD replication</text>

  <!-- AD-Integrated DNS Server 2 -->
  <rect x="76" y="298" width="278" height="88" rx="10" fill="#0D1B2E"/>
  <text x="215" y="332" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">AD-Integrated DNS Server 2</text>
  <text x="215" y="360" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">DC / DNS · AD-integrated zone</text>

  <!-- On-prem clients -->
  <rect x="76" y="408" width="278" height="156" rx="10" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="215" y="432" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">On-Prem Clients</text>
  <text x="215" y="456" text-anchor="middle" font-size="13" fill="#33414F">UIAO-GIT01.corp</text>
  <text x="215" y="476" text-anchor="middle" font-size="13" fill="#33414F">fileserver.corp</text>
  <text x="215" y="496" text-anchor="middle" font-size="13" fill="#33414F">printer.corp</text>
  <text x="215" y="520" text-anchor="middle" font-size="12" fill="#1E8C8C">resolve via conditional forwarder →</text>
  <text x="215" y="540" text-anchor="middle" font-size="12" fill="#6B7A8D">→ Private Resolver inbound endpoint</text>

  <!-- ═══════════════════════════════════════════════════════════════
       CENTER COLUMN: Azure DNS Private Resolver
       ═══════════════════════════════════════════════════════════════ -->
  <!-- Container -->
  <rect x="462" y="122" width="356" height="470" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <!-- Header bar -->
  <rect x="462" y="122" width="356" height="46" rx="10" fill="#1E3A66"/>
  <rect x="462" y="148" width="356" height="20" fill="#1E3A66"/>
  <text x="640" y="150" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">Azure DNS Private Resolver</text>

  <!-- Inbound Endpoint -->
  <rect x="488" y="186" width="304" height="88" rx="10" fill="#1E8C8C"/>
  <text x="640" y="220" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Inbound Endpoint</text>
  <text x="640" y="248" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">Receives queries from on-prem</text>

  <!-- Bidirectional ↕ arrow between endpoints -->
  <line x1="640" y1="274" x2="640" y2="298" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>
  <line x1="634" y1="316" x2="634" y2="278" stroke="#1E3A66" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-navy)"/>

  <!-- Outbound Endpoint -->
  <rect x="488" y="298" width="304" height="88" rx="10" fill="#1E8C8C"/>
  <text x="640" y="332" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Outbound Endpoint</text>
  <text x="640" y="360" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">Forwards VNet queries on-prem</text>

  <!-- VNet detail -->
  <rect x="488" y="408" width="304" height="156" rx="10" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="640" y="432" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Platform VNet</text>
  <text x="640" y="456" text-anchor="middle" font-size="13" fill="#33414F">Arc-projected VMs resolve</text>
  <text x="640" y="476" text-anchor="middle" font-size="13" fill="#33414F">via outbound endpoint</text>
  <text x="640" y="500" text-anchor="middle" font-size="13" fill="#1E8C8C">→ uiao.internal</text>
  <text x="640" y="520" text-anchor="middle" font-size="13" fill="#1E8C8C">→ Azure SaaS endpoints</text>
  <text x="640" y="540" text-anchor="middle" font-size="12" fill="#6B7A8D">VNet DNS points to outbound endpoint</text>

  <!-- ═══════════════════════════════════════════════════════════════
       RIGHT COLUMN: Azure Private DNS Zone
       ═══════════════════════════════════════════════════════════════ -->
  <!-- Container -->
  <rect x="900" y="122" width="330" height="470" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <!-- Header bar -->
  <rect x="900" y="122" width="330" height="46" rx="10" fill="#1E3A66"/>
  <rect x="900" y="148" width="330" height="20" fill="#1E3A66"/>
  <text x="1065" y="150" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">Azure Private DNS Zone</text>

  <!-- Zone: uiao.internal -->
  <rect x="926" y="186" width="278" height="88" rx="10" fill="#0D1B2E"/>
  <text x="1065" y="220" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">uiao.internal</text>
  <text x="1065" y="248" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">(authoritative)</text>

  <!-- Private Link zone -->
  <rect x="926" y="298" width="278" height="88" rx="10" fill="#1E3A66"/>
  <text x="1065" y="326" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">Private Link Zone</text>
  <text x="1065" y="352" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D7F2EE">privatelink.blob.core.windows.net</text>

  <!-- Linked VNets -->
  <rect x="926" y="408" width="278" height="156" rx="10" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="1065" y="432" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Linked Virtual Networks</text>
  <text x="1065" y="456" text-anchor="middle" font-size="13" fill="#33414F">Platform VNet</text>
  <text x="1065" y="476" text-anchor="middle" font-size="13" fill="#33414F">Workload VNets</text>
  <text x="1065" y="496" text-anchor="middle" font-size="13" fill="#33414F">Arc-projected VM VNets</text>
  <text x="1065" y="520" text-anchor="middle" font-size="12" fill="#6B7A8D">auto-registration enabled</text>
  <text x="1065" y="540" text-anchor="middle" font-size="12" fill="#1E8C8C">← linked to Private DNS zones</text>

  <!-- ═══════════════════════════════════════════════════════════════
       HORIZONTAL ARROWS between columns
       ═══════════════════════════════════════════════════════════════ -->
  <!-- On-prem DNS → Resolver inbound (conditional forwarder) -->
  <line x1="354" y1="248" x2="486" y2="232" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>
  <text x="420" y="234" text-anchor="middle" font-size="11" fill="#1E8C8C">conditional forwarder</text>

  <!-- Resolver → On-prem (response) -->
  <line x1="486" y1="268" x2="354" y2="282" stroke="#1E3A66" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-navy)"/>
  <text x="420" y="282" text-anchor="middle" font-size="11" fill="#6B7A8D">response</text>

  <!-- Resolver → Private DNS Zone (forward / authorize) -->
  <line x1="818" y1="244" x2="898" y2="244" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>
  <text x="858" y="236" text-anchor="middle" font-size="11" fill="#1E8C8C">forward / authorize</text>

  <!-- Private DNS Zone → Resolver (response) -->
  <line x1="898" y1="264" x2="818" y2="264" stroke="#1E3A66" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-navy)"/>
  <text x="858" y="280" text-anchor="middle" font-size="11" fill="#6B7A8D">response</text>

  <!-- ═══════════════════════════════════════════════════════════════
       IPAM BAR — bottom, spanning all three columns
       ═══════════════════════════════════════════════════════════════ -->
  <rect x="50" y="616" width="1180" height="76" rx="10" fill="#2E75B6" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="644" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">IPAM — Single Source of Truth — IP / DHCP / DNS Records</text>
  <text x="640" y="674" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#EAF1FB">DM_010 · Infoblox NIOS / BlueCat Address Manager / Generic IPAM · all addressing governed here</text>

  <!-- Connectors down to IPAM bar -->
  <line x1="215" y1="592" x2="215" y2="616" stroke="#2E75B6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-teal)"/>
  <line x1="640" y1="592" x2="640" y2="616" stroke="#2E75B6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-teal)"/>
  <line x1="1065" y1="592" x2="1065" y2="616" stroke="#2E75B6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-teal)"/>
</svg>
