<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A66"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="54" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="32" fill="#0D1B2E">Four-Surface Access Plane Integration Map</text>
  <text x="60" y="82" font-size="15" fill="#6B7A8D">Zero Trust + Conditional Access + SASE + MFA/CBA — governed by UIAO, targeted by OrgPath</text>

  <!-- ===== CENTER HUB: UIAO Identity-Bound Access Plane ===== -->
  <rect x="490" y="270" width="300" height="130" rx="12" fill="#0D1B2E"/>
  <text x="640" y="315" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">UIAO Identity-Bound</text>
  <text x="640" y="337" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Access Plane</text>
  <text x="640" y="362" text-anchor="middle" font-size="13" fill="#D7F2EE">OrgPath-scoped · provenance-bound</text>
  <text x="640" y="379" text-anchor="middle" font-size="13" fill="#D7F2EE">drift-monitored · UIAO_163</text>

  <!-- ===== SURFACE 1: Zero Trust (top-left) ===== -->
  <rect x="60" y="110" width="300" height="190" rx="10" fill="#1E3A66"/>
  <text x="210" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Zero Trust</text>
  <text x="210" y="170" text-anchor="middle" font-size="13" fill="#D7F2EE">Architectural model — three principles:</text>
  <text x="210" y="190" text-anchor="middle" font-size="13" fill="#D7F2EE">Verify Explicitly</text>
  <text x="210" y="208" text-anchor="middle" font-size="13" fill="#D7F2EE">Least-Privilege Access</text>
  <text x="210" y="226" text-anchor="middle" font-size="13" fill="#D7F2EE">Assume Breach</text>
  <text x="210" y="248" text-anchor="middle" font-size="12" fill="#1E8C8C">No product — an enforced pattern</text>
  <text x="210" y="265" text-anchor="middle" font-size="12" fill="#1E8C8C">requiring all four surfaces together</text>

  <!-- ===== SURFACE 2: Conditional Access (top-right) ===== -->
  <rect x="920" y="110" width="300" height="190" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1070" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Conditional Access</text>
  <text x="1070" y="170" text-anchor="middle" font-size="13" fill="#33414F">Policy enforcement surface (Ch. 05)</text>
  <text x="1070" y="192" text-anchor="middle" font-size="13" fill="#33414F">CA-100 enterprise baseline</text>
  <text x="1070" y="210" text-anchor="middle" font-size="13" fill="#33414F">CA-400 role-scoped (Tier-0 admins)</text>
  <text x="1070" y="228" text-anchor="middle" font-size="13" fill="#33414F">CA-500 sensitive applications</text>
  <text x="1070" y="249" text-anchor="middle" font-size="12" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#2E75B6">CA-000 through CA-999 baseline</text>
  <text x="1070" y="266" text-anchor="middle" font-size="12" fill="#33414F">CAE-aware · OrgTree-targeted</text>

  <!-- ===== SURFACE 3: SASE (bottom-left) ===== -->
  <rect x="60" y="440" width="300" height="220" rx="10" fill="#0D1B2E"/>
  <text x="210" y="476" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">SASE</text>
  <text x="210" y="497" text-anchor="middle" font-size="13" fill="#D7F2EE">Secure Access Service Edge</text>
  <text x="210" y="516" text-anchor="middle" font-size="13" fill="#1E8C8C">ZTNA</text>
  <text x="210" y="534" text-anchor="middle" font-size="12" fill="#D7F2EE">per-app reverse-proxy, replaces VPN</text>
  <text x="210" y="552" text-anchor="middle" font-size="13" fill="#1E8C8C">SWG</text>
  <text x="210" y="570" text-anchor="middle" font-size="12" fill="#D7F2EE">outbound web filtering + DLP</text>
  <text x="210" y="588" text-anchor="middle" font-size="13" fill="#1E8C8C">CASB</text>
  <text x="210" y="606" text-anchor="middle" font-size="12" fill="#D7F2EE">sanctioned-cloud inline enforcement</text>
  <text x="210" y="624" text-anchor="middle" font-size="12" fill="#D7F2EE">Entra OIDC federated · SCIM groups</text>
  <text x="210" y="642" text-anchor="middle" font-size="12" fill="#D7F2EE">policies/sase/ in Gitea — no portal edits</text>

  <!-- ===== SURFACE 4: MFA/CBA (bottom-right) ===== -->
  <rect x="920" y="440" width="300" height="220" rx="10" fill="#EAF1FB" stroke="#1E3A66" stroke-width="2"/>
  <text x="1070" y="476" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">MFA / CBA</text>
  <text x="1070" y="497" text-anchor="middle" font-size="13" fill="#33414F">Phishing-Resistant Identity Proof</text>
  <text x="1070" y="518" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">FIDO2 security keys</text>
  <text x="1070" y="536" text-anchor="middle" font-size="12" fill="#33414F">YubiKey, Feitian — Tier-0 admins</text>
  <text x="1070" y="554" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">Platform SSO passkeys</text>
  <text x="1070" y="572" text-anchor="middle" font-size="12" fill="#33414F">Windows Hello for Business — daily auth</text>
  <text x="1070" y="590" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">Entra CBA (PIV / CAC)</text>
  <text x="1070" y="608" text-anchor="middle" font-size="12" fill="#33414F">Federal users — re-anchors ADCS chain</text>
  <text x="1070" y="626" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Authenticator (number-matching)</text>
  <text x="1070" y="644" text-anchor="middle" font-size="12" fill="#33414F">Standard users, secondary method</text>

  <!-- ===== INTEGRATION CONNECTORS (hub-and-spoke arrows) ===== -->

  <!-- ZT -> Hub -->
  <line x1="360" y1="205" x2="488" y2="315" stroke="#1E3A66" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  <text x="408" y="264" text-anchor="middle" font-size="11" fill="#1E3A66">model enforced by</text>
  <text x="408" y="279" text-anchor="middle" font-size="11" fill="#1E3A66">CA + Intune + PIM + CBA</text>

  <!-- CA -> Hub -->
  <line x1="920" y1="205" x2="792" y2="315" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="872" y="264" text-anchor="middle" font-size="11" fill="#1E3A66">policy enforcement</text>
  <text x="872" y="279" text-anchor="middle" font-size="11" fill="#1E3A66">per-request evaluation</text>

  <!-- SASE -> Hub -->
  <line x1="360" y1="550" x2="489" y2="390" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="392" y="492" text-anchor="middle" font-size="11" fill="#1E8C8C">Entra token accepted</text>
  <text x="392" y="507" text-anchor="middle" font-size="11" fill="#1E8C8C">SCIM group targeting</text>
  <text x="392" y="522" text-anchor="middle" font-size="11" fill="#1E8C8C">access logs to SIEM</text>

  <!-- MFA/CBA -> Hub -->
  <line x1="920" y1="550" x2="791" y2="400" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="888" y="492" text-anchor="middle" font-size="11" fill="#1E8C8C">phishing-resistant proof</text>
  <text x="888" y="507" text-anchor="middle" font-size="11" fill="#1E8C8C">ADCS chain re-anchored</text>
  <text x="888" y="522" text-anchor="middle" font-size="11" fill="#1E8C8C">PIM re-challenge FIDO2</text>

  <!-- Hub internal label re-emphasising integration -->
  <text x="640" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#D4A017">Every access decision:</text>
  <text x="640" y="416" text-anchor="middle" font-size="11" fill="#6B7A8D">identity + device + signal · cloud edge · logged · drift-visible</text>

  <!-- ===== BOTTOM BAND: shared integration contract ===== -->
  <line x1="44" y1="672" x2="1236" y2="672" stroke="#E3E8EF" stroke-width="1"/>
  <text x="60" y="696" font-size="12" font-weight="bold" fill="#0D1B2E">Integration contract:</text>
  <text x="200" y="696" font-size="12" fill="#33414F">Identity federation via Entra OIDC</text>
  <text x="430" y="696" font-size="12" fill="#33414F">·</text>
  <text x="450" y="696" font-size="12" fill="#33414F">Group targeting via OrgTree dynamic groups</text>
  <text x="730" y="696" font-size="12" fill="#33414F">·</text>
  <text x="750" y="696" font-size="12" fill="#33414F">Device posture via Intune/MS Graph</text>
  <text x="1000" y="696" font-size="12" fill="#33414F">·</text>
  <text x="1020" y="696" font-size="12" fill="#33414F">Logs to UIAO SIEM adapter</text>
</svg>
