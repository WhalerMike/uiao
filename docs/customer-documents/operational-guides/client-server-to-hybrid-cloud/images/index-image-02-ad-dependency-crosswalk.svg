<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="52" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="32" fill="#0D1B2E">Eleven AD-era dependencies, mapped to their Hybrid-Cloud targets</text>
  <text x="60" y="82" font-size="17" fill="#6B7A8D">Every silent Active Directory role gets an explicit, governed carrier in the target estate</text>

  <!-- Column headers -->
  <rect x="60" y="104" width="470" height="40" rx="8" fill="#0D1B2E"/>
  <text x="295" y="124" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Client/Server (AD forest)</text>
  <rect x="750" y="104" width="470" height="40" rx="8" fill="#1E8C8C"/>
  <text x="985" y="124" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Hybrid-Cloud target</text>

  <!-- 11 crosswalk rows -->
  <!-- row template: left navy box, teal arrow, right ice box -->
  <!-- y starts 156, step 50, box height 40 -->
  <g font-size="15">
    <!-- 1 -->
    <rect x="60" y="156" width="470" height="40" rx="7" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="78" y="176" dominant-baseline="central" font-weight="bold" fill="#0D1B2E">Identity (users, groups, OUs)</text>
    <line x1="540" y1="176" x2="742" y2="176" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="750" y="156" width="470" height="40" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="768" y="176" dominant-baseline="central" fill="#33414F">Entra ID + OrgPath attribute</text>
    <!-- 2 -->
    <rect x="60" y="206" width="470" height="40" rx="7" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="78" y="226" dominant-baseline="central" font-weight="bold" fill="#0D1B2E">Group Policy (GPO)</text>
    <line x1="540" y1="226" x2="742" y2="226" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="750" y="206" width="470" height="40" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="768" y="226" dominant-baseline="central" fill="#33414F">Intune profiles + Conditional Access</text>
    <!-- 3 -->
    <rect x="60" y="256" width="470" height="40" rx="7" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="78" y="276" dominant-baseline="central" font-weight="bold" fill="#0D1B2E">AD-integrated DNS</text>
    <line x1="540" y1="276" x2="742" y2="276" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="750" y="256" width="470" height="40" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="768" y="276" dominant-baseline="central" fill="#33414F">Azure Private DNS + Private Resolver</text>
    <!-- 4 -->
    <rect x="60" y="306" width="470" height="40" rx="7" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="78" y="326" dominant-baseline="central" font-weight="bold" fill="#0D1B2E">AD DHCP scopes</text>
    <line x1="540" y1="326" x2="742" y2="326" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="750" y="306" width="470" height="40" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="768" y="326" dominant-baseline="central" fill="#33414F">Governed IPAM (single source of truth)</text>
    <!-- 5 -->
    <rect x="60" y="356" width="470" height="40" rx="7" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="78" y="376" dominant-baseline="central" font-weight="bold" fill="#0D1B2E">ADCS / enterprise PKI</text>
    <line x1="540" y1="376" x2="742" y2="376" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="750" y="356" width="470" height="40" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="768" y="376" dominant-baseline="central" fill="#33414F">Cloud PKI + Intune SCEP/PKCS</text>
    <!-- 6 -->
    <rect x="60" y="406" width="470" height="40" rx="7" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="78" y="426" dominant-baseline="central" font-weight="bold" fill="#0D1B2E">RADIUS / NPS</text>
    <line x1="540" y1="426" x2="742" y2="426" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="750" y="406" width="470" height="40" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="768" y="426" dominant-baseline="central" fill="#33414F">Entra certificate-based auth + CA</text>
    <!-- 7 -->
    <rect x="60" y="456" width="470" height="40" rx="7" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="78" y="476" dominant-baseline="central" font-weight="bold" fill="#0D1B2E">Certificate auto-enrollment</text>
    <line x1="540" y1="476" x2="742" y2="476" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="750" y="456" width="470" height="40" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="768" y="476" dominant-baseline="central" fill="#33414F">Intune SCEP / PKCS delivery</text>
    <!-- 8 -->
    <rect x="60" y="506" width="470" height="40" rx="7" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="78" y="526" dominant-baseline="central" font-weight="bold" fill="#0D1B2E">LDAP queries</text>
    <line x1="540" y1="526" x2="742" y2="526" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="750" y="506" width="470" height="40" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="768" y="526" dominant-baseline="central" fill="#33414F">Microsoft Graph API</text>
    <!-- 9 -->
    <rect x="60" y="556" width="470" height="40" rx="7" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="78" y="576" dominant-baseline="central" font-weight="bold" fill="#0D1B2E">Replication topology</text>
    <line x1="540" y1="576" x2="742" y2="576" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="750" y="556" width="470" height="40" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="768" y="576" dominant-baseline="central" fill="#33414F">Entra Connect sync</text>
    <!-- 10 -->
    <rect x="60" y="606" width="470" height="40" rx="7" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="78" y="626" dominant-baseline="central" font-weight="bold" fill="#0D1B2E">Time sync (W32Time)</text>
    <line x1="540" y1="626" x2="742" y2="626" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="750" y="606" width="470" height="40" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="768" y="626" dominant-baseline="central" fill="#33414F">Azure host time / managed NTP</text>
    <!-- 11 -->
    <rect x="60" y="656" width="470" height="40" rx="7" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
    <text x="78" y="676" dominant-baseline="central" font-weight="bold" fill="#0D1B2E">SYSVOL / file shares</text>
    <line x1="540" y1="676" x2="742" y2="676" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="750" y="656" width="470" height="40" rx="7" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
    <text x="768" y="676" dominant-baseline="central" fill="#33414F">SharePoint / OneDrive + Azure Files</text>
  </g>
</svg>
