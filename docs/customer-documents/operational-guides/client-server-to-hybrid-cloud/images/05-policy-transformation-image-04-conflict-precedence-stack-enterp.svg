<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L5,10 L10,0 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Conflict Precedence Stack</text>
  <text x="60" y="84" font-size="16" fill="#6B7A8D">When Intune profiles conflict, the highest-scope layer wins — Enterprise overrides all below it</text>

  <!-- Left: precedence stack (centered at x=400) -->
  <!-- Stack label -->
  <text x="400" y="124" text-anchor="middle" font-size="15" fill="#6B7A8D" font-weight="bold">HIGHEST PRECEDENCE</text>

  <!-- Level 1: Enterprise -->
  <rect x="160" y="140" width="480" height="80" rx="10" fill="#0D1B2E"/>
  <text x="400" y="172" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">Enterprise</text>
  <text x="400" y="196" text-anchor="middle" font-size="14" fill="#D7F2EE">OrgTree-Enterprise-Devices · all governed endpoints</text>

  <!-- Arrow down -->
  <line x1="400" y1="220" x2="400" y2="238" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-down)"/>

  <!-- Level 2: Division -->
  <rect x="185" y="242" width="430" height="74" rx="10" fill="#1E3A66"/>
  <text x="400" y="271" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Division</text>
  <text x="400" y="293" text-anchor="middle" font-size="14" fill="#D7F2EE">OrgTree-IT-Devices · OrgTree-FIN-Devices</text>

  <!-- Arrow down -->
  <line x1="400" y1="316" x2="400" y2="334" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-down)"/>

  <!-- Level 3: Department -->
  <rect x="210" y="338" width="380" height="74" rx="10" fill="#1E3A66"/>
  <text x="400" y="367" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Department</text>
  <text x="400" y="389" text-anchor="middle" font-size="14" fill="#D7F2EE">OrgTree-IT-INF-Devices</text>

  <!-- Arrow down -->
  <line x1="400" y1="412" x2="400" y2="430" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-down)"/>

  <!-- Level 4: Role -->
  <rect x="235" y="434" width="330" height="74" rx="10" fill="#2E75B6"/>
  <text x="400" y="463" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Role</text>
  <text x="400" y="485" text-anchor="middle" font-size="14" fill="#EAF1FB">OrgTree-HighRisk-Devices · OrgTree-Exec-Devices</text>

  <!-- Arrow down -->
  <line x1="400" y1="508" x2="400" y2="526" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-down)"/>

  <!-- Level 5: Device -->
  <rect x="260" y="530" width="280" height="74" rx="10" fill="#5A5A5A"/>
  <text x="400" y="559" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Device</text>
  <text x="400" y="581" text-anchor="middle" font-size="14" fill="#E3E8EF">Device-specific emergency patches</text>

  <!-- Lowest precedence label -->
  <text x="400" y="622" text-anchor="middle" font-size="15" fill="#6B7A8D" font-weight="bold">LOWEST PRECEDENCE</text>

  <!-- Right side: rules and notes panel -->
  <rect x="740" y="130" width="480" height="500" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>

  <!-- Rules panel title -->
  <rect x="740" y="130" width="480" height="44" rx="10" fill="#0D1B2E"/>
  <text x="980" y="152" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Precedence Rules</text>

  <!-- Rule 1 -->
  <rect x="760" y="190" width="440" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="980" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">1. Enterprise baseline profiles win</text>
  <text x="980" y="234" text-anchor="middle" font-size="13" fill="#33414F">OrgTree-Enterprise-* overrides all narrower scopes</text>

  <!-- Rule 2 -->
  <rect x="760" y="258" width="440" height="58" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="980" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">2. Narrower scope layers below</text>
  <text x="980" y="302" text-anchor="middle" font-size="13" fill="#33414F">Division then Dept then Role then Device</text>

  <!-- Rule 3 -->
  <rect x="760" y="326" width="440" height="68" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="980" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">3. Conflicts flagged at plan-validation</text>
  <text x="980" y="366" text-anchor="middle" font-size="13" fill="#33414F">Plan fails until conflict resolved in canon.</text>
  <text x="980" y="384" text-anchor="middle" font-size="13" fill="#33414F">Violations of order block delivery.</text>

  <!-- Rule 4 -->
  <rect x="760" y="404" width="440" height="68" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="980" y="426" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">4. CA follows the same order</text>
  <text x="980" y="446" text-anchor="middle" font-size="13" fill="#33414F">Require at broad scope + Block at narrow scope</text>
  <text x="980" y="464" text-anchor="middle" font-size="13" fill="#33414F">is prohibited (causes unpredictable lockouts)</text>

  <!-- Rule 5 -->
  <rect x="760" y="482" width="440" height="58" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="980" y="504" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">5. OrgPath drives all targeting</text>
  <text x="980" y="526" text-anchor="middle" font-size="13" fill="#33414F">No manually-curated groups. Dynamic groups only.</text>

  <!-- Connector arrow from stack to rules panel -->
  <line x1="640" y1="420" x2="736" y2="420" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-teal)"/>
  <text x="688" y="414" text-anchor="middle" font-size="12" fill="#1E8C8C">governs</text>

  <!-- Legend row at bottom -->
  <rect x="60" y="668" width="22" height="16" rx="3" fill="#0D1B2E"/>
  <text x="90" y="680" font-size="13" fill="#5A5A5A">Enterprise (highest)</text>
  <rect x="250" y="668" width="22" height="16" rx="3" fill="#2E75B6"/>
  <text x="280" y="680" font-size="13" fill="#5A5A5A">Role-scoped</text>
  <rect x="400" y="668" width="22" height="16" rx="3" fill="#5A5A5A"/>
  <text x="430" y="680" font-size="13" fill="#5A5A5A">Device (lowest)</text>
  <rect x="560" y="668" width="22" height="16" rx="3" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="590" y="680" font-size="13" fill="#5A5A5A">Conflict warning</text>
</svg>
