  <rect x="490" y="620" width="16" height="14" rx="3" fill="#1E8C8C"/>
  <text x="512" y="633" font-size="13" fill="#33414F">Transform / steady state</text>
  <rect x="720" y="620" width="16" height="14" rx="3" fill="#1E3A66"/>
  <text x="742" y="633" font-size="13" fill="#33414F">Entra output objects</text>

  <text x="1220" y="706" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">UIAO_156 migration runbook</text>
