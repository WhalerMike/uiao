  <text x="177" y="492" text-anchor="middle" font-size="12" fill="#D7F2EE">extensionAttribute1</text>
  <text x="177" y="512" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#D7F2EE">ORG-FIN-AP-EAST</text>
  <text x="177" y="532" text-anchor="middle" font-size="11" fill="#6B7A8D">UIAO_151 codebook</text>

  <rect x="294" y="438" width="190" height="120" rx="8" fill="#1E3A66"/>
