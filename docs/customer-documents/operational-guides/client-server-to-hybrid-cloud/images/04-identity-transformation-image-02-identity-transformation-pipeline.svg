  <rect x="588" y="118" width="170" height="30" rx="6" fill="#1E3A66"/>
  <text x="673" y="133" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFFFFF">Phase 3 — Rollout</text>
  <line x1="758" y1="133" x2="773" y2="133" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>

