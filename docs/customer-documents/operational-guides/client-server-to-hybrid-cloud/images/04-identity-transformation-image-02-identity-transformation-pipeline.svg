  <text x="163" y="220" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Legacy AD Objects</text>
  <text x="163" y="246" text-anchor="middle" font-size="13" fill="#D7F2EE">Users · Groups · OUs</text>
