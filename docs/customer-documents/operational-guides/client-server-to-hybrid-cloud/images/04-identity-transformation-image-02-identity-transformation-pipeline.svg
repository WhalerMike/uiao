  <text x="601" y="492" text-anchor="middle" font-size="12" fill="#D7F2EE">UIAO_154 matrix</text>
  <text x="601" y="512" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#D7F2EE">AU-ORG-FIN</text>
  <text x="601" y="532" text-anchor="middle" font-size="11" fill="#6B7A8D">Restricted management</text>

  <rect x="718" y="438" width="210" height="120" rx="8" fill="#1E3A66"/>
  <text x="823" y="469" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">Conditional Access</text>
  <text x="823" y="492" text-anchor="middle" font-size="12" fill="#D7F2EE">OrgPath-scoped groups</text>
  <text x="823" y="512" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#D7F2EE">OrgTree-EAST-Users</text>
  <text x="823" y="532" text-anchor="middle" font-size="11" fill="#6B7A8D">GPO inheritance repl.</text>

  <rect x="940" y="438" width="213" height="120" rx="8" fill="#1E8C8C"/>
  <text x="1047" y="469" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">Drift Detection</text>
  <text x="1047" y="492" text-anchor="middle" font-size="12" fill="#D7F2EE">UIAO_163 engine</text>
  <text x="1047" y="512" text-anchor="middle" font-size="11" fill="#D7F2EE">5 categories · UIAO_167 SLA</text>
  <text x="1047" y="532" text-anchor="middle" font-size="11" fill="#D7F2EE">Zero-action = steady state</text>

