  <text x="323" y="133" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFFFFF">Phase 1 — Canon</text>
  <line x1="398" y1="133" x2="413" y2="133" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>

  <rect x="418" y="118" width="150" height="30" rx="6" fill="#1E3A66"/>
  <text x="493" y="133" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFFFFF">Phase 2 — Pilot</text>
