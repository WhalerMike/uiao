<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A66"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">One IPAM, Three Services</text>
  <text x="60" y="92" font-size="17" fill="#6B7A8D">DM_010 / DM_015 / DM_016 derive from canonical IPAM truth — addressing governance is owned by IPAM</text>

  <!-- ═══════════════════════════════════════════════════════════════
       TOP CENTER: IPAM — canonical truth (DM_010)
       ═══════════════════════════════════════════════════════════════ -->
  <!-- Outer frame -->
  <rect x="390" y="120" width="500" height="174" rx="12" fill="#2E75B6" stroke="#0D1B2E" stroke-width="3"/>
  <!-- Inner label area -->
  <text x="640" y="155" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">IPAM — Canonical Truth</text>
  <text x="640" y="183" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#EAF1FB">Single source of truth for all network addressing</text>

  <!-- DM_010 identifier badge -->
  <rect x="430" y="200" width="420" height="74" rx="8" fill="#FFFFFF" stroke="#2E75B6" stroke-width="2"/>
  <text x="540" y="230" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="bold" fill="#2E75B6">DM_010</text>
  <text x="770" y="216" text-anchor="middle" font-size="13" fill="#33414F">IPAM Adapter (source present)</text>
  <text x="770" y="238" text-anchor="middle" font-size="12" fill="#6B7A8D">Infoblox NIOS 8.x · BlueCat Address Manager</text>
  <text x="770" y="256" text-anchor="middle" font-size="12" fill="#6B7A8D">Generic IPAM (CSV-driven fallback)</text>

  <!-- ═══════════════════════════════════════════════════════════════
       VERTICAL ARROWS from IPAM down to three services
       ═══════════════════════════════════════════════════════════════ -->
  <!-- Arrow to DM_015 (DNS) — left branch -->
  <line x1="500" y1="294" x2="240" y2="378" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>
  <text x="348" y="330" text-anchor="middle" font-size="13" fill="#1E8C8C" font-weight="bold">zone entries</text>
  <text x="348" y="348" text-anchor="middle" font-size="12" fill="#6B7A8D">keyed to IPAM records</text>

  <!-- Arrow to DM_010 down to center / plan coordinator — center -->
  <line x1="640" y1="294" x2="640" y2="378" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>
  <text x="660" y="340" font-size="13" fill="#1E8C8C" font-weight="bold">populate</text>
  <text x="660" y="358" font-size="12" fill="#6B7A8D">authoritative records</text>

  <!-- Arrow to DM_016 (DHCP) — right branch -->
  <line x1="780" y1="294" x2="1040" y2="378" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>
  <text x="930" y="330" text-anchor="middle" font-size="13" fill="#1E8C8C" font-weight="bold">reservations</text>
  <text x="930" y="348" text-anchor="middle" font-size="12" fill="#6B7A8D">keyed to IPAM records</text>

  <!-- ═══════════════════════════════════════════════════════════════
       LEFT SERVICE BOX: DM_015 — DNS Adapter
       ═══════════════════════════════════════════════════════════════ -->
  <rect x="48" y="378" width="366" height="222" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <!-- Header -->
  <rect x="48" y="378" width="366" height="50" rx="12" fill="#1E3A66"/>
  <rect x="48" y="406" width="366" height="22" fill="#1E3A66"/>
  <text x="231" y="405" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">DNS Adapter</text>
  <!-- DM_015 badge -->
  <text x="231" y="446" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#1E3A66">DM_015</text>
  <text x="231" y="472" text-anchor="middle" font-size="13" fill="#6B7A8D">gap — to author</text>
  <!-- Service details -->
  <line x1="68" y1="484" x2="394" y2="484" stroke="#E3E8EF" stroke-width="1"/>
  <text x="231" y="502" text-anchor="middle" font-size="13" fill="#33414F">Azure Private DNS Zone entries</text>
  <text x="231" y="522" text-anchor="middle" font-size="13" fill="#33414F">Stale record detection · zone cutover</text>
  <text x="231" y="542" text-anchor="middle" font-size="13" fill="#33414F">OrgPath-scoped DNS records</text>
  <text x="231" y="562" text-anchor="middle" font-size="12" fill="#1E8C8C">→ Private Resolver + Private DNS Zone</text>

  <!-- ═══════════════════════════════════════════════════════════════
       CENTER SERVICE BOX: DM_010 plan actions (IPAM populate)
       ═══════════════════════════════════════════════════════════════ -->
  <rect x="457" y="378" width="366" height="222" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <!-- Header -->
  <rect x="457" y="378" width="366" height="50" rx="12" fill="#2E75B6"/>
  <rect x="457" y="406" width="366" height="22" fill="#2E75B6"/>
  <text x="640" y="405" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">IPAM Adapter</text>
  <!-- DM_010 badge -->
  <text x="640" y="446" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#2E75B6">DM_010</text>
  <text x="640" y="472" text-anchor="middle" font-size="13" fill="#6B7A8D">source present</text>
  <!-- Service details -->
  <line x1="477" y1="484" x2="803" y2="484" stroke="#E3E8EF" stroke-width="1"/>
  <text x="640" y="502" text-anchor="middle" font-size="13" fill="#33414F">Network range discovery</text>
  <text x="640" y="522" text-anchor="middle" font-size="13" fill="#33414F">Host record sync with DNS</text>
  <text x="640" y="542" text-anchor="middle" font-size="13" fill="#33414F">Reservation sync with DHCP</text>
  <text x="640" y="562" text-anchor="middle" font-size="12" fill="#1E8C8C">→ Gitea provenance · correlation IDs</text>

  <!-- ═══════════════════════════════════════════════════════════════
       RIGHT SERVICE BOX: DM_016 — DHCP Adapter
       ═══════════════════════════════════════════════════════════════ -->
  <rect x="866" y="378" width="366" height="222" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <!-- Header -->
  <rect x="866" y="378" width="366" height="50" rx="12" fill="#1E3A66"/>
  <rect x="866" y="406" width="366" height="22" fill="#1E3A66"/>
  <text x="1049" y="405" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">DHCP Adapter</text>
  <!-- DM_016 badge -->
  <text x="1049" y="446" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="bold" fill="#1E3A66">DM_016</text>
  <text x="1049" y="472" text-anchor="middle" font-size="13" fill="#6B7A8D">gap — to author</text>
  <!-- Service details -->
  <line x1="886" y1="484" x2="1212" y2="484" stroke="#E3E8EF" stroke-width="1"/>
  <text x="1049" y="502" text-anchor="middle" font-size="13" fill="#33414F">Scope + reservation management</text>
  <text x="1049" y="522" text-anchor="middle" font-size="13" fill="#33414F">MAC reservations · failover pairs</text>
  <text x="1049" y="542" text-anchor="middle" font-size="13" fill="#33414F">OrgPath-scoped DHCP scopes</text>
  <text x="1049" y="562" text-anchor="middle" font-size="12" fill="#1E8C8C">→ on-prem / Azure VNet / Infoblox IB-Flex</text>

  <!-- ═══════════════════════════════════════════════════════════════
       DRIFT DETECTION BAR (bottom)
       ═══════════════════════════════════════════════════════════════ -->
  <rect x="48" y="624" width="1184" height="72" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="640" y="651" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#0D1B2E">Hierarchy Drift Detection — IPAM ↔ DNS ↔ DHCP</text>
  <text x="640" y="681" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#33414F">If any adapter would produce drift between itself and the other two, the plan fails validation — never DNS-only, always all three together</text>

  <!-- Connectors from service boxes down to drift bar -->
  <line x1="231" y1="600" x2="231" y2="624" stroke="#D4A017" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-amber)"/>
  <line x1="640" y1="600" x2="640" y2="624" stroke="#D4A017" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-amber)"/>
  <line x1="1049" y1="600" x2="1049" y2="624" stroke="#D4A017" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-amber)"/>
</svg>
