<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="54" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="32" fill="#0D1B2E">MFA Method Hierarchy — Phishing-Resistance Ranking</text>
  <text x="60" y="82" font-size="15" fill="#6B7A8D">Strongest at top (teal) · weakest at bottom (red/amber flagged as retired) · UIAO canon</text>

  <!-- Rank label column header -->
  <text x="100" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#5A5A5A">Rank</text>
  <text x="300" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#5A5A5A">Method</text>
  <text x="610" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#5A5A5A">Phishing-Resistant</text>
  <text x="830" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#5A5A5A">Typical Use / Scope</text>
  <text x="1100" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#5A5A5A">CA Policy / Status</text>
  <line x1="60" y1="126" x2="1220" y2="126" stroke="#E3E8EF" stroke-width="1.5"/>

  <!-- ===== ROW 1: FIDO2 security keys (strongest) ===== -->
  <rect x="60" y="136" width="1160" height="80" rx="8" fill="#1E8C8C"/>
  <!-- Rank badge -->
  <rect x="68" y="148" width="56" height="56" rx="8" fill="#0D1B2E"/>
  <text x="96" y="183" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E8C8C">1</text>
  <!-- Method name -->
  <text x="300" y="172" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">FIDO2 Security Keys</text>
  <text x="300" y="194" text-anchor="middle" font-size="13" fill="#D7F2EE">YubiKey, Feitian</text>
  <!-- Phishing resistant check -->
  <text x="610" y="176" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">YES</text>
  <text x="610" y="198" text-anchor="middle" font-size="12" fill="#D7F2EE">Hardware-bound · no phishable secret</text>
  <!-- Use -->
  <text x="830" y="172" text-anchor="middle" font-size="14" fill="#FFFFFF">Tier-0 admins</text>
  <text x="830" y="192" text-anchor="middle" font-size="13" fill="#D7F2EE">High-privilege users · break-glass test accounts</text>
  <!-- CA policy -->
  <text x="1100" y="168" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF">CA-400 required</text>
  <text x="1100" y="188" text-anchor="middle" font-size="12" fill="#D7F2EE">Privileged Identity roles</text>
  <text x="1100" y="206" text-anchor="middle" font-size="12" fill="#D7F2EE">PIM re-challenge</text>

  <!-- ===== ROW 2: Platform SSO (Windows Hello for Business) ===== -->
  <rect x="60" y="228" width="1160" height="80" rx="8" fill="#1E8C8C"/>
  <rect x="68" y="240" width="56" height="56" rx="8" fill="#0D1B2E"/>
  <text x="96" y="275" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E8C8C">2</text>
  <text x="300" y="262" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Entra Platform SSO Passkeys</text>
  <text x="300" y="284" text-anchor="middle" font-size="13" fill="#D7F2EE">Windows Hello for Business</text>
  <text x="610" y="266" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">YES</text>
  <text x="610" y="288" text-anchor="middle" font-size="12" fill="#D7F2EE">Device-bound passkey · no phishable credential</text>
  <text x="830" y="262" text-anchor="middle" font-size="14" fill="#FFFFFF">User PCs — default daily auth</text>
  <text x="830" y="282" text-anchor="middle" font-size="13" fill="#D7F2EE">All users · preferred primary method</text>
  <text x="1100" y="258" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF">CA-100 allowed</text>
  <text x="1100" y="278" text-anchor="middle" font-size="12" fill="#D7F2EE">Enterprise baseline</text>
  <text x="1100" y="296" text-anchor="middle" font-size="12" fill="#D7F2EE">Platform SSO satisfies</text>

  <!-- ===== ROW 3: Certificate-Based Auth (CBA / PIV / CAC) ===== -->
  <rect x="60" y="320" width="1160" height="80" rx="8" fill="#1E8C8C"/>
  <rect x="68" y="332" width="56" height="56" rx="8" fill="#0D1B2E"/>
  <text x="96" y="367" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E8C8C">3</text>
  <text x="300" y="354" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Certificate-Based Auth (CBA)</text>
  <text x="300" y="376" text-anchor="middle" font-size="13" fill="#D7F2EE">Entra CBA + PIV / CAC smart card</text>
  <text x="610" y="358" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">YES</text>
  <text x="610" y="380" text-anchor="middle" font-size="12" fill="#D7F2EE">X.509 certificate · chain in Entra · not AD-anchored</text>
  <text x="830" y="354" text-anchor="middle" font-size="14" fill="#FFFFFF">Federal users with CAC / PIV</text>
  <text x="830" y="374" text-anchor="middle" font-size="13" fill="#D7F2EE">CAC+PIN = same session as Platform SSO</text>
  <text x="1100" y="350" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFFFFF">CA-400 required</text>
  <text x="1100" y="370" text-anchor="middle" font-size="12" fill="#D7F2EE">Agency default for CAC holders</text>
  <text x="1100" y="388" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#D7F2EE">DM_020 PKI adapter</text>

  <!-- ===== ROW 4: Authenticator App with number-matching (partial) ===== -->
  <rect x="60" y="412" width="1160" height="80" rx="8" fill="#D7F2EE" stroke="#1E3A66" stroke-width="1.5"/>
  <rect x="68" y="424" width="56" height="56" rx="8" fill="#1E3A66"/>
  <text x="96" y="459" text-anchor="middle" font-size="24" font-weight="bold" fill="#D7F2EE">4</text>
  <text x="300" y="446" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Authenticator App</text>
  <text x="300" y="468" text-anchor="middle" font-size="13" fill="#33414F">with number-matching enabled</text>
  <text x="610" y="450" text-anchor="middle" font-size="22" font-weight="bold" fill="#D4A017">PARTIAL</text>
  <text x="610" y="472" text-anchor="middle" font-size="12" fill="#33414F">Resists push bombing · not hardware-bound</text>
  <text x="830" y="446" text-anchor="middle" font-size="14" fill="#0D1B2E">Standard users</text>
  <text x="830" y="466" text-anchor="middle" font-size="13" fill="#33414F">Secondary method · non-privileged access</text>
  <text x="1100" y="442" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E">CA-100 allowed</text>
  <text x="1100" y="462" text-anchor="middle" font-size="12" fill="#33414F">Number-matching REQUIRED</text>
  <text x="1100" y="480" text-anchor="middle" font-size="12" fill="#33414F">Without: not permitted</text>

  <!-- Divider: RETIRED methods below -->
  <line x1="60" y1="506" x2="1220" y2="506" stroke="#C0392B" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="640" y="524" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">RETIRED — NOT PERMITTED IN UIAO CANON</text>

  <!-- ===== ROW 5: Authenticator without number-matching (retired) ===== -->
  <rect x="60" y="534" width="1160" height="70" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <rect x="68" y="544" width="56" height="50" rx="8" fill="#C0392B"/>
  <text x="96" y="576" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="300" y="563" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0392B">Authenticator App (no number-matching)</text>
  <text x="300" y="584" text-anchor="middle" font-size="13" fill="#33414F">Push notification without challenge</text>
  <text x="610" y="566" text-anchor="middle" font-size="20" font-weight="bold" fill="#C0392B">NO</text>
  <text x="610" y="587" text-anchor="middle" font-size="12" fill="#33414F">Vulnerable to push bombing attacks</text>
  <text x="830" y="566" text-anchor="middle" font-size="14" fill="#C0392B">RETIRED</text>
  <text x="830" y="586" text-anchor="middle" font-size="13" fill="#33414F">Not permitted in UIAO canon</text>
  <text x="1100" y="560" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C0392B">CA-100 blocked</text>
  <text x="1100" y="580" text-anchor="middle" font-size="12" fill="#33414F">Explicitly blocked</text>
  <text x="1100" y="597" text-anchor="middle" font-size="12" fill="#33414F">by enterprise baseline</text>

  <!-- ===== ROW 6: SMS / Voice (retired) ===== -->
  <rect x="60" y="614" width="1160" height="70" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <rect x="68" y="624" width="56" height="50" rx="8" fill="#C0392B"/>
  <text x="96" y="656" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF">6</text>
  <text x="300" y="644" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0392B">SMS / Voice OTP</text>
  <text x="300" y="665" text-anchor="middle" font-size="13" fill="#33414F">One-time code via text or phone call</text>
  <text x="610" y="648" text-anchor="middle" font-size="20" font-weight="bold" fill="#C0392B">NO</text>
  <text x="610" y="669" text-anchor="middle" font-size="12" fill="#33414F">SIM-swap, SS7, phishing all viable attacks</text>
  <text x="830" y="646" text-anchor="middle" font-size="14" fill="#C0392B">RETIRED</text>
  <text x="830" y="666" text-anchor="middle" font-size="13" fill="#33414F">Not permitted in UIAO canon</text>
  <text x="1100" y="640" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C0392B">CA-100 blocked</text>
  <text x="1100" y="660" text-anchor="middle" font-size="12" fill="#33414F">Explicitly blocked</text>
  <text x="1100" y="677" text-anchor="middle" font-size="12" fill="#33414F">SMS + Voice both retired</text>
</svg>
