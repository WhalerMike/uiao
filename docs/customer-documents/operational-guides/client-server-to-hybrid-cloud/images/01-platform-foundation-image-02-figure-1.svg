<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A66"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">UIAO Platform Server — Five Roles on One Host</text>
  <text x="60" y="88" font-size="18" fill="#6B7A8D">Windows Server 2025 · single Tier-0 governance substrate</text>

  <!-- Outer server rectangle -->
  <rect x="60" y="112" width="870" height="576" rx="14" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="3"/>

  <!-- Server title bar (square off bottom corners with a rect) -->
  <rect x="60" y="112" width="870" height="54" rx="14" fill="#0D1B2E"/>
  <rect x="60" y="148" width="870" height="18" fill="#0D1B2E"/>
  <text x="495" y="143" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">UIAO Platform Server — Windows Server 2025</text>

  <!-- Role 1: Gitea — Canonical Source of Truth -->
  <rect x="90" y="180" width="810" height="86" rx="10" fill="#2E75B6"/>
  <text x="495" y="210" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Role 1 — Canonical Source of Truth</text>
  <text x="495" y="236" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#FFFFFF">Gitea · versioned governance artifacts · signed commits · ADR-041 · behind IIS · loopback :3000</text>
  <text x="495" y="258" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">OrgPath codebook · dynamic group rules · delegation matrices · transformation plans · policy libraries · adapter manifests · drift reports</text>

  <!-- Role 2: IIS Reverse Proxy -->
  <rect x="90" y="278" width="810" height="72" rx="10" fill="#1E3A66"/>
  <text x="495" y="306" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Role 2 — HTTPS Reverse Proxy + Client-Cert Terminator</text>
  <text x="495" y="336" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#D7F2EE">IIS + URL Rewrite + ARR · TLS termination · mTLS · HSTS · HTTP/2 · AD LDAPS auth</text>

  <!-- Role 3: Auth Bridge -->
  <rect x="90" y="362" width="810" height="72" rx="10" fill="#1E3A66"/>
  <text x="495" y="390" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Role 3 — Legacy-to-Modern Auth Bridge</text>
  <text x="495" y="420" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#D7F2EE">Kerberos (AD-joined) · Enterprise PKI (ADCS-issued certs) · Entra-registered (OAuth2/OIDC)</text>

  <!-- Role 4: Transformation Engine -->
  <rect x="90" y="446" width="810" height="86" rx="10" fill="#1E8C8C"/>
  <text x="495" y="475" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Role 4 — Transformation Engine Host</text>
  <text x="495" y="503" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#FFFFFF">PowerShell 7.4+ (AD reads, Pester harness) · Python 3.12+ (networkx, OSCAL, UIAO_158)</text>
  <text x="495" y="525" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">Graph · ARM · Intune · Infoblox WAPI · ServiceNow REST · CyberArk REST · ScubaGear ingestion</text>

  <!-- Role 5: Adapter Dispatcher -->
  <rect x="90" y="544" width="810" height="72" rx="10" fill="#0D1B2E"/>
  <text x="495" y="572" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Role 5 — Adapter Dispatcher</text>
  <text x="495" y="602" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#D7F2EE">DM_* adapter interface · UIAO_159 glue · vendor-pluggable (Infoblox, ADCS, Entrust, Cisco ISE)</text>

  <!-- Arrow to Azure cloud target -->
  <line x1="935" y1="400" x2="1010" y2="400" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="972" y="392" text-anchor="middle" font-size="13" fill="#1E8C8C">governs</text>

  <!-- Azure / Entra / Intune target tenant box -->
  <rect x="1015" y="300" width="225" height="200" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1127" y="332" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Azure / Entra /</text>
  <text x="1127" y="358" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Intune Target</text>
  <text x="1127" y="384" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#0D1B2E">Tenant</text>
  <line x1="1030" y1="400" x2="1225" y2="400" stroke="#E3E8EF" stroke-width="1"/>
  <text x="1127" y="420" text-anchor="middle" font-size="13" fill="#5A5A5A">Entra ID</text>
  <text x="1127" y="440" text-anchor="middle" font-size="13" fill="#5A5A5A">Intune</text>
  <text x="1127" y="460" text-anchor="middle" font-size="13" fill="#5A5A5A">Azure Arc</text>
  <text x="1127" y="480" text-anchor="middle" font-size="13" fill="#5A5A5A">Azure Blob (backup)</text>

  <!-- GitHub upstream arrow -->
  <line x1="495" y1="688" x2="495" y2="666" stroke="#1E3A66" stroke-width="2" marker-end="url(#arrow-navy)"/>
  <text x="495" y="705" text-anchor="middle" font-size="13" fill="#6B7A8D">GitHub mirror (upstream canon) — read-write</text>
</svg>
