<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="32" fill="#0D1B2E">Active Directory — Implicit Governance Substrate</text>
  <text x="60" y="84" font-size="15" fill="#6B7A8D">Eleven infrastructure capabilities silently wired into AD — each one a governance dependency</text>

  <!--
    Hub center: (640, 370)
    11 spokes at equal angular spacing: 360/11 ≈ 32.73°
    Start at top (-90°), go clockwise.
    Spoke label radii: 265px from hub center
    Angles (degrees from north, clockwise):
      0: -90    → top          (640, 105)
      1: -57.27 → upper-right
      2: -24.55 → right-upper
      3:   8.18 → right
      4:  40.91 → right-lower
      5:  73.64 → lower-right
      6: 106.36 → lower-left  (bottom-left area)
      7: 139.09 → left-lower
      8: 171.82 → left
      9: 204.55 → left-upper
     10: 237.27 → upper-left
  -->

  <!-- Hub: central navy rounded rect -->
  <rect x="480" y="298" width="320" height="120" rx="14" fill="#0D1B2E"/>
  <text x="640" y="345" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#FFFFFF">Active Directory</text>
  <text x="640" y="372" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">implicit governance substrate</text>

  <!-- ── Spoke 0: Identity  top  (640, 105) ── -->
  <line x1="640" y1="298" x2="640" y2="194" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="550" y="126" width="180" height="64" rx="10" fill="#1E3A66"/>
  <text x="640" y="158" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Identity</text>

  <!-- ── Spoke 1: Group Policy  upper-right ── -->
  <!-- angle -57.27°: sin=-0.840, cos=-0.542  → offset(+222,-143) → hub edge ~(762,327) tip (862,204) -->
  <line x1="768" y1="322" x2="888" y2="210" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="866" y="148" width="222" height="64" rx="10" fill="#1E3A66"/>
  <text x="977" y="180" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Group Policy</text>

  <!-- ── Spoke 2: DNS  right-upper ── -->
  <!-- angle -24.55°: sin=-0.415, cos=-0.910  → large-right, slight-up  hub edge ~(800,348) tip (960,310) -->
  <line x1="800" y1="352" x2="962" y2="312" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="962" y="278" width="166" height="64" rx="10" fill="#1E3A66"/>
  <text x="1045" y="310" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">DNS</text>

  <!-- ── Spoke 3: DHCP  right ── -->
  <!-- angle 8.18°: sin=0.142, cos=0.990  → far right, nearly level  hub edge ~(800,378) tip (960,390) -->
  <line x1="800" y1="382" x2="962" y2="392" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="962" y="358" width="166" height="64" rx="10" fill="#1E3A66"/>
  <text x="1045" y="390" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">DHCP</text>

  <!-- ── Spoke 4: PKI  right-lower ── -->
  <!-- angle 40.91°: sin=0.655, cos=0.756  → right+down  hub edge ~(780,404) tip (880,468) -->
  <line x1="778" y1="408" x2="880" y2="490" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="848" y="490" width="148" height="64" rx="10" fill="#1E3A66"/>
  <text x="922" y="522" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">PKI</text>

  <!-- ── Spoke 5: RADIUS  lower-right ── -->
  <!-- angle 73.64°: sin=0.960, cos=0.281  → mostly-down  hub edge ~(712,418) tip (740,554) -->
  <line x1="716" y1="418" x2="744" y2="558" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="640" y="558" width="188" height="64" rx="10" fill="#1E3A66"/>
  <text x="734" y="590" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">RADIUS</text>

  <!-- ── Spoke 6: Certificate Enrollment  lower-left ── -->
  <!-- angle 106.36°: sin=0.960, cos=-0.281  → mostly-down-left  hub edge ~(562,418) tip (536,558) -->
  <line x1="564" y1="418" x2="530" y2="558" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="318" y="558" width="256" height="64" rx="10" fill="#1E3A66"/>
  <text x="446" y="590" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Certificate Enrollment</text>

  <!-- ── Spoke 7: LDAP queries  left-lower ── -->
  <!-- angle 139.09°: sin=0.655, cos=-0.756  → left+down  hub edge ~(500,404) tip (392,484) -->
  <line x1="502" y1="408" x2="390" y2="490" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="194" y="490" width="196" height="64" rx="10" fill="#1E3A66"/>
  <text x="292" y="522" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">LDAP queries</text>

  <!-- ── Spoke 8: Time Sync  left ── -->
  <!-- angle 171.82°: nearly opposite right  hub edge ~(480,380) tip (316,392) -->
  <line x1="480" y1="382" x2="318" y2="392" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="118" y="358" width="200" height="64" rx="10" fill="#1E3A66"/>
  <text x="218" y="390" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Time Sync</text>

  <!-- ── Spoke 9: Replication topology  left-upper ── -->
  <!-- angle 204.55°: left+up  hub edge ~(480,352) tip (316,310) -->
  <line x1="480" y1="352" x2="320" y2="312" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="88" y="278" width="264" height="64" rx="10" fill="#1E3A66"/>
  <text x="220" y="310" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Replication topology</text>

  <!-- ── Spoke 10: SYSVOL/file shares  upper-left ── -->
  <!-- angle 237.27°: upper-left  hub edge ~(512,322) tip (392,210) -->
  <line x1="512" y1="322" x2="392" y2="210" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="172" y="148" width="248" height="64" rx="10" fill="#1E3A66"/>
  <text x="296" y="180" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">SYSVOL/file shares</text>

  <!-- Legend bottom-right -->
  <rect x="956" y="612" width="288" height="82" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="1100" y="634" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Legend</text>
  <rect x="976" y="648" width="18" height="14" rx="3" fill="#0D1B2E"/>
  <text x="1002" y="661" font-size="13" fill="#33414F">Hub: governance authority</text>
  <rect x="976" y="670" width="18" height="14" rx="3" fill="#1E3A66"/>
  <text x="1002" y="683" font-size="13" fill="#33414F">Spoke: silently governed service</text>

  <!-- Footer caption -->
  <text x="640" y="706" text-anchor="middle" font-size="12" fill="#6B7A8D">Each spoke is a capability AD silently governed. Retiring AD without replacement governance breaks all eleven.</text>
</svg>
