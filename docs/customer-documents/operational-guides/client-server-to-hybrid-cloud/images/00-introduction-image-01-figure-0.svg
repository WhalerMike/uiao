<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>

<!-- Title -->
<text x="640" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Active Directory as the Implicit Governance Substrate</text>

<!-- Central AD node -->
<rect x="480" y="280" width="320" height="130" rx="16" fill="#0D1B2E"/>
<text x="640" y="326" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Active Directory</text>
<text x="640" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Domain Services</text>
<text x="640" y="387" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">Implicit governance substrate</text>

<!-- ===== LEAF NODES ===== -->
<!-- Arranged in a clock face: 11 nodes at positions 0°, 33°, 66°, 99°, 132°, 165°, 198°, 231°, 264°, 297°, 330° -->
<!-- Center: 640, 345. Spoke radius 260. Leaf box 180×68 -->

<!-- Node 1 — Users (top center, 90° = 270° up = 12 o'clock) -->
<!-- angle 270°: cx=640+260*cos(270°)=640, cy=345+260*sin(270°)=345-260=85 -->
<line x1="640" y1="280" x2="640" y2="138" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="549" y="72" width="182" height="62" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="640" y="94" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Users</text>
<text x="640" y="116" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">Identity lifecycle &amp; OU placement</text>

<!-- Node 2 — Computers (top-right, ~330° = 11 steps of 360/11≈32.7° starting at 270°) -->
<!-- angle 270+32.7=302.7°: cos=-0.535, sin=0.844 → cx=640+260*0.535=779, cy=345-260*0.844=126 -->
<!-- Let's position this at ~1 o'clock: cx=780, cy=130 -->
<line x1="724" y1="284" x2="812" y2="150" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="742" y="84" width="182" height="62" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="833" y="106" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Computers</text>
<text x="833" y="128" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">Domain join &amp; GPO targeting</text>

<!-- Node 3 — Service Accounts (~2 o'clock): cx=900, cy=200 -->
<line x1="780" y1="302" x2="900" y2="225" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="818" y="163" width="182" height="62" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="909" y="185" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Service Accounts</text>
<text x="909" y="207" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">SPNs &amp; Kerberos delegation</text>

<!-- Node 4 — Security Groups (~3 o'clock): cx=980, cy=345 -->
<line x1="800" y1="345" x2="934" y2="345" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="938" y="314" width="182" height="62" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="1029" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Security Groups</text>
<text x="1029" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">Access control &amp; policy scoping</text>

<!-- Node 5 — Group Policy Objects (~4 o'clock): cx=920, cy=490 -->
<line x1="780" y1="388" x2="908" y2="464" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="826" y="452" width="182" height="62" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="917" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Group Policy Objects</text>
<text x="917" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">Device config &amp; security baselines</text>

<!-- Node 6 — DNS/DHCP (~5 o'clock): cx=870, cy=591 -->
<line x1="730" y1="408" x2="842" y2="556" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="779" y="560" width="182" height="62" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="870" y="582" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">DNS / DHCP</text>
<text x="870" y="604" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">Name resolution &amp; IP allocation</text>

<!-- Node 7 — PKI/Certificate Services (~6 o'clock): cx=640, cy=620 -->
<line x1="640" y1="410" x2="640" y2="556" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="549" y="560" width="182" height="62" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="640" y="579" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">PKI / Certificate Services</text>
<text x="640" y="601" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">Auto-enrollment &amp; CRL distribution</text>

<!-- Node 8 — RADIUS/NPS (~7 o'clock): cx=410, cy=591 -->
<line x1="550" y1="408" x2="438" y2="556" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="319" y="560" width="182" height="62" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="410" y="582" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">RADIUS / NPS</text>
<text x="410" y="604" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">802.1X &amp; VPN authentication</text>

<!-- Node 9 — LDAP (~8 o'clock): cx=360, cy=490 -->
<line x1="500" y1="388" x2="372" y2="464" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="280" y="452" width="182" height="62" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="371" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">LDAP</text>
<text x="371" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">App auth &amp; directory queries</text>

<!-- Node 10 — SPNs/App Registrations (~9 o'clock): cx=300, cy=345 -->
<line x1="480" y1="345" x2="346" y2="345" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="150" y="314" width="192" height="62" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="246" y="333" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">SPNs / App Registrations</text>
<text x="246" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">Kerberos service identity</text>

<!-- Node 11 — Trust Relationships (~10-11 o'clock): cx=380, cy=200 -->
<line x1="500" y1="302" x2="392" y2="224" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<rect x="200" y="163" width="192" height="62" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
<text x="296" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Trust Relationships</text>
<text x="296" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">Cross-domain authentication</text>

<!-- Footer note -->
<text x="640" y="698" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6B7A8D" text-anchor="middle">Figure 0.1 — Eleven categories of infrastructure object silently governed by AD Domain Services. Each category has a dedicated modern replacement in the UIAO target surface.</text>
</svg>
