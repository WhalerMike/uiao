<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Provenance Envelope — who / when / what / profile / hash / commit</text>
  <text x="60" y="84" font-size="17" fill="#6B7A8D">Every assessment run produces a signed, attestation-grade provenance record committed to Gitea</text>
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ===== OUTER ENVELOPE CONTAINER ===== -->
  <rect x="60" y="118" width="1160" height="470" rx="14" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="144" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A66">provenance.yaml  ·  assessments/&lt;run-id&gt;/provenance.yaml</text>
  <line x1="80" y1="156" x2="1200" y2="156" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ===== SIX PROVENANCE FIELDS ===== -->
  <!-- Two rows of three cards each -->
  <!-- Row 1: y=170..310  Row 2: y=322..462 -->
  <!-- Card width=346, gap=20, start x=80 -->
  <!-- Row 1 cards at x: 80, 446, 812 -->
  <!-- Row 2 cards at x: 80, 446, 812 -->

  <!-- ── CARD 1: WHO ── -->
  <rect x="80" y="170" width="346" height="136" rx="10" fill="#0D1B2E"/>
  <text x="253" y="200" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">WHO</text>
  <line x1="100" y1="214" x2="406" y2="214" stroke="#1E3A66" stroke-width="1"/>
  <text x="100" y="234" font-size="14" fill="#D7F2EE">Service principal or account UPN</text>
  <text x="100" y="256" font-size="14" fill="#D7F2EE">that ran the assessment</text>
  <text x="100" y="282" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B7A8D">run_account: svc-uiao-assess@corp.gov</text>

  <!-- ── CARD 2: WHEN ── -->
  <rect x="446" y="170" width="346" height="136" rx="10" fill="#0D1B2E"/>
  <text x="619" y="200" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">WHEN</text>
  <line x1="466" y1="214" x2="772" y2="214" stroke="#1E3A66" stroke-width="1"/>
  <text x="466" y="234" font-size="14" fill="#D7F2EE">UTC timestamp of the run start</text>
  <text x="466" y="256" font-size="14" fill="#D7F2EE">and completion</text>
  <text x="466" y="282" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B7A8D">run_utc: 2026-04-24T10:30:00Z</text>

  <!-- ── CARD 3: WHAT ── -->
  <rect x="812" y="170" width="346" height="136" rx="10" fill="#0D1B2E"/>
  <text x="985" y="200" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">WHAT</text>
  <line x1="832" y1="214" x2="1138" y2="214" stroke="#1E3A66" stroke-width="1"/>
  <text x="832" y="234" font-size="14" fill="#D7F2EE">Forest DNS name, domain FQDNs,</text>
  <text x="832" y="256" font-size="14" fill="#D7F2EE">DC that served the read</text>
  <text x="832" y="282" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B7A8D">forest: corp.gov  dc: dc01.corp.gov</text>

  <!-- Arrow connectors Row 1 → Row 2 (downward) -->
  <line x1="253" y1="306" x2="253" y2="326" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="619" y1="306" x2="619" y2="326" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="985" y1="306" x2="985" y2="326" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>

  <!-- ── CARD 4: PROFILE ── -->
  <rect x="80" y="328" width="346" height="136" rx="10" fill="#1E3A66" stroke="#1E8C8C" stroke-width="2"/>
  <text x="253" y="358" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">PROFILE</text>
  <line x1="100" y1="372" x2="406" y2="372" stroke="#1E8C8C" stroke-width="1"/>
  <text x="100" y="393" font-size="14" fill="#D7F2EE">Tier A / Tier B / custom</text>
  <text x="100" y="415" font-size="14" fill="#D7F2EE">assessment configuration used</text>
  <text x="100" y="440" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B7A8D">profile: tierB  streams: 11</text>

  <!-- ── CARD 5: HASH ── -->
  <rect x="446" y="328" width="346" height="136" rx="10" fill="#1E3A66" stroke="#1E8C8C" stroke-width="2"/>
  <text x="619" y="358" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">HASH</text>
  <line x1="466" y1="372" x2="772" y2="372" stroke="#1E8C8C" stroke-width="1"/>
  <text x="466" y="393" font-size="14" fill="#D7F2EE">SHA-256 of each output file;</text>
  <text x="466" y="415" font-size="14" fill="#D7F2EE">tamper-evident artifact chain</text>
  <text x="466" y="440" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B7A8D">hash: sha256:a1b2c3d4e5f6...</text>

  <!-- ── CARD 6: COMMIT ── -->
  <rect x="812" y="328" width="346" height="136" rx="10" fill="#2E75B6"/>
  <text x="985" y="358" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">COMMIT</text>
  <line x1="832" y1="372" x2="1138" y2="372" stroke="#EAF1FB" stroke-width="1"/>
  <text x="832" y="393" font-size="14" fill="#FFFFFF">Gitea branch + commit SHA;</text>
  <text x="832" y="415" font-size="14" fill="#FFFFFF">single signed commit per run</text>
  <text x="832" y="440" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#D7F2EE">commit: feat(assess): 2026-04-24</text>

  <!-- ===== BOTTOM CHAIN BAR ===== -->
  <!-- Horizontal connecting pipe showing the chain -->
  <!-- Horizontal arrows joining cards across row 2 -->
  <line x1="426" y1="396" x2="444" y2="396" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>
  <line x1="792" y1="396" x2="810" y2="396" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>

  <!-- ===== OUTPUT BOX — rejection / acceptance ===== -->
  <rect x="60" y="610" width="560" height="82" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="340" y="638" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Run WITH provenance &#10003;</text>
  <text x="340" y="664" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1E3A66">Canonical · accepted by engine · committed to Gitea</text>
  <text x="340" y="684" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5A5A5A">No run-id collision · signed · attributable</text>

  <rect x="660" y="610" width="560" height="82" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="940" y="638" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#C0392B">Run WITHOUT provenance &#10007;</text>
  <text x="940" y="664" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#C0392B">Non-canonical · rejected by engine</text>
  <text x="940" y="684" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5A5A5A">provenance.yaml missing or unsigned = discard</text>

  <!-- Down arrow from envelope to output boxes -->
  <line x1="340" y1="592" x2="340" y2="608" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="940" y1="592" x2="940" y2="608" stroke="#C0392B" stroke-width="2" marker-end="url(#arr-navy)"/>
</svg>
