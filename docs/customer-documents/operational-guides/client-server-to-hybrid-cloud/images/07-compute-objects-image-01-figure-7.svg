<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <!-- 07-compute-objects-image-01-figure-7.svg
       Caption: Device state transitions from Domain-Joined to target
       Entra-Joined (workstations) or Arc-connected (servers)
       ADR-093 house style: white background, navy/teal/ice palette, pure SVG -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/>
    </marker>
    <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Device State Transitions &#8212; Domain-Joined to Target States</text>

  <!-- ══════════════════════════════════════════════════════════
       ROW LABELS (left margin)
       ════════════════════════════════════════════════════════ -->
  <text x="30" y="230" font-size="13" font-weight="bold" fill="#6B7A8D" text-anchor="start" transform="rotate(-90,30,230)">USER PCs</text>
  <text x="30" y="530" font-size="13" font-weight="bold" fill="#6B7A8D" text-anchor="start" transform="rotate(-90,30,530)">SERVERS</text>

  <!-- ══════════════════════════════════════════════════════════
       STATE NODE 1 — Domain-Joined (legacy) — navy, left
       ════════════════════════════════════════════════════════ -->
  <rect x="60" y="240" width="216" height="110" rx="12" fill="#0D1B2E"/>
  <text x="168" y="278" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Domain-Joined</text>
  <text x="168" y="300" font-size="13" fill="#C7D4E6" text-anchor="middle">(legacy origin)</text>
  <text x="168" y="322" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6B7A8D" text-anchor="middle">Kerberos &#183; GPO &#183; AD OU</text>

  <!-- ══════════════════════════════════════════════════════════
       STATE NODE 2 — Hybrid-Joined (transition) — dashed border
       ════════════════════════════════════════════════════════ -->
  <rect x="460" y="200" width="236" height="120" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2.5" stroke-dasharray="10 5"/>
  <!-- warning triangle -->
  <polygon points="578,218 594,248 562,248" fill="#D4A017"/>
  <text x="578" y="242" font-size="10" font-weight="bold" fill="#0D1B2E" text-anchor="middle">!</text>
  <text x="640" y="232" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Entra Hybrid Joined</text>
  <text x="578" y="260" font-size="12" fill="#33414F" text-anchor="middle">transition — not a destination</text>
  <text x="578" y="278" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#6B7A8D" text-anchor="middle">AD + Entra simultaneous</text>
  <text x="578" y="296" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#6B7A8D" text-anchor="middle">GPO + Intune co-managed</text>

  <!-- ══════════════════════════════════════════════════════════
       STATE NODE 3 — Entra Joined (workstation target) — teal
       ════════════════════════════════════════════════════════ -->
  <rect x="920" y="130" width="310" height="120" rx="12" fill="#1E8C8C"/>
  <!-- checkmark -->
  <text x="1055" y="155" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">&#10003;</text>
  <text x="1075" y="175" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Entra Joined</text>
  <text x="1075" y="197" font-size="13" fill="#D7F2EE" text-anchor="middle">workstation target</text>
  <text x="1075" y="217" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#D7F2EE" text-anchor="middle">Intune &#183; Platform SSO &#183; OrgPath</text>
  <text x="1075" y="237" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#D7F2EE" text-anchor="middle">extensionAttribute1 tagged</text>

  <!-- ══════════════════════════════════════════════════════════
       STATE NODE 4 — Azure Arc-connected (server target) — teal
       ════════════════════════════════════════════════════════ -->
  <rect x="920" y="440" width="310" height="120" rx="12" fill="#1E8C8C"/>
  <!-- checkmark -->
  <text x="1055" y="465" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">&#10003;</text>
  <text x="1075" y="483" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Azure Arc-connected</text>
  <text x="1075" y="504" font-size="13" fill="#D7F2EE" text-anchor="middle">server target</text>
  <text x="1075" y="524" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#D7F2EE" text-anchor="middle">Arc &#183; Guest Config &#183; Azure Policy</text>
  <text x="1075" y="544" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#D7F2EE" text-anchor="middle">managed identity &#183; OrgPath tags</text>

  <!-- ══════════════════════════════════════════════════════════
       ARROWS — PC migration paths
       ════════════════════════════════════════════════════════ -->

  <!-- PATH A: Greenfield via Autopilot — Domain-Joined directly to Entra Joined (arc over top) -->
  <path d="M276,270 C400,100 800,100 916,185" stroke="#1E8C8C" stroke-width="2.5" fill="none" marker-end="url(#ar-teal)"/>
  <text x="596" y="96" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Greenfield via Autopilot</text>
  <text x="596" y="114" font-size="12" fill="#5A5A5A" text-anchor="middle">(new hardware, direct enrollment)</text>

  <!-- PATH B: Reset-and-re-enroll — Domain-Joined directly to Entra Joined (straight arrow below path A) -->
  <path d="M276,290 C400,160 800,160 916,195" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="8 4" fill="none" marker-end="url(#ar-teal)"/>
  <text x="596" y="152" font-size="12" fill="#1E8C8C" text-anchor="middle">Reset-and-re-enroll</text>
  <text x="596" y="168" font-size="11" fill="#6B7A8D" text-anchor="middle">(wipe, Autopilot re-register)</text>

  <!-- PATH C1: hybrid-then-cloud step 1 — Domain-Joined to Hybrid-Joined -->
  <line x1="276" y1="295" x2="456" y2="260" stroke="#5A5A5A" stroke-width="2.5" marker-end="url(#ar-grey)"/>
  <text x="364" y="307" font-size="11" font-weight="bold" fill="#5A5A5A" text-anchor="middle">Hybrid-then-cloud</text>
  <text x="364" y="322" font-size="11" fill="#6B7A8D" text-anchor="middle">Entra Connect writeback</text>

  <!-- PATH C2: Hybrid-Joined to Entra Joined -->
  <line x1="696" y1="246" x2="916" y2="192" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>
  <text x="806" y="236" font-size="11" font-weight="bold" fill="#1E8C8C" text-anchor="middle">workload cutover</text>
  <text x="806" y="252" font-size="11" fill="#6B7A8D" text-anchor="middle">GPO &#8594; Intune, then domain-unjoin</text>

  <!-- ══════════════════════════════════════════════════════════
       ARROWS — Server migration path
       ════════════════════════════════════════════════════════ -->

  <!-- Domain-Joined to Arc-connected (down-and-right arc) -->
  <path d="M168,350 C168,620 700,620 916,520" stroke="#5A5A5A" stroke-width="2.5" fill="none" marker-end="url(#ar-grey)"/>
  <text x="500" y="638" font-size="13" font-weight="bold" fill="#5A5A5A" text-anchor="middle">Arc onboarding: install azcmagent &#8594; register &#8594; tag OrgPath &#8594; assign Guest Config &#8594; domain-unjoin</text>

  <!-- Dotted branch: Hybrid-Joined also branches to Arc (servers can pass through hybrid join) -->
  <path d="M578,320 C578,420 800,490 916,490" stroke="#5A5A5A" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#ar-grey)"/>
  <text x="730" y="415" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="middle">server Arc path</text>

  <!-- ══════════════════════════════════════════════════════════
       LEGEND
       ════════════════════════════════════════════════════════ -->
  <rect x="60" y="666" width="1160" height="38" rx="6" fill="#EAF1FB" stroke="#E3E8EF" stroke-width="1"/>
  <!-- teal solid line legend -->
  <line x1="80" y1="685" x2="120" y2="685" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
  <text x="130" y="690" font-size="12" fill="#33414F">Target path (Entra Joined)</text>
  <!-- grey solid line legend -->
  <line x1="340" y1="685" x2="380" y2="685" stroke="#5A5A5A" stroke-width="2.5" marker-end="url(#ar-grey)"/>
  <text x="390" y="690" font-size="12" fill="#33414F">Arc server path</text>
  <!-- teal dashed legend -->
  <line x1="550" y1="685" x2="590" y2="685" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#ar-teal)"/>
  <text x="600" y="690" font-size="12" fill="#33414F">Reset-and-re-enroll</text>
  <!-- warning chip -->
  <rect x="780" y="672" width="20" height="20" rx="3" fill="#D4A017"/>
  <text x="790" y="687" font-size="11" font-weight="bold" fill="#0D1B2E" text-anchor="middle">!</text>
  <text x="808" y="690" font-size="12" fill="#33414F">Hybrid Joined = transition only; never a permanent destination</text>
</svg>
