<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A66"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="60" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Figure 7 — Device State Transitions</text>
  <text x="60" y="92" font-size="18" fill="#6B7A8D">Domain-Joined (legacy) &#8594; Hybrid-Joined (transition) &#8594; Entra-Joined (workstation) / Azure Arc-connected (server)</text>

  <!-- Node 1: Domain-Joined (legacy) -->
  <rect x="60" y="290" width="260" height="110" rx="10" fill="#0D1B2E"/>
  <text x="190" y="338" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Domain-Joined</text>
  <text x="190" y="365" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#D7F2EE">(legacy)</text>
  <text x="190" y="385" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#6B7A8D">Auth: AD Kerberos / GPO</text>
  <!-- LEGACY badge -->
  <rect x="68" y="298" width="68" height="22" rx="5" fill="#C0392B"/>
  <text x="102" y="309" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">LEGACY</text>

  <!-- Arrow 1: Domain-Joined to Hybrid-Joined -->
  <line x1="320" y1="345" x2="454" y2="345" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="323" y="314" width="128" height="26" rx="4" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1"/>
  <text x="387" y="327" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0D1B2E">Entra Connect</text>
  <rect x="327" y="340" width="120" height="20" rx="4" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1"/>
  <text x="387" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0D1B2E">device writeback</text>

  <!-- Node 2: Hybrid-Joined (transition) -->
  <rect x="455" y="270" width="280" height="150" rx="10" fill="#1E3A66"/>
  <text x="595" y="330" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Hybrid-Joined</text>
  <text x="595" y="358" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#D7F2EE">(transition)</text>
  <text x="595" y="382" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">Auth: AD + Entra (dual)</text>
  <text x="595" y="402" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D4A017">Not a target state</text>
  <!-- TRANSITION badge -->
  <rect x="463" y="278" width="96" height="22" rx="5" fill="#D4A017"/>
  <text x="511" y="289" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">TRANSITION</text>

  <!-- Arrow 2a: Hybrid-Joined to Entra-Joined (workstation) -->
  <path d="M735,310 C820,310 820,195 910,195" stroke="#1E8C8C" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/>
  <rect x="758" y="225" width="140" height="44" rx="4" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1"/>
  <text x="828" y="241" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0D1B2E">Autopilot enrollment</text>
  <text x="828" y="259" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0D1B2E">+ domain leave</text>

  <!-- Arrow 2b: Hybrid-Joined to Azure Arc-connected (server) -->
  <path d="M735,390 C820,390 820,500 910,500" stroke="#1E8C8C" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/>
  <rect x="756" y="435" width="140" height="44" rx="4" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1"/>
  <text x="826" y="451" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0D1B2E">Arc onboarding</text>
  <text x="826" y="469" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0D1B2E">+ domain leave</text>

  <!-- Node 3: Entra-Joined (workstation target) -->
  <rect x="910" y="130" width="300" height="130" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="930" y="138" width="72" height="22" rx="5" fill="#1E8C8C"/>
  <text x="966" y="149" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">TARGET</text>
  <text x="1060" y="185" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#0D1B2E">Entra-Joined</text>
  <text x="1060" y="210" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1E3A66">(workstation target)</text>
  <text x="1060" y="233" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5A5A5A">Auth: Entra only / Intune</text>

  <!-- Node 4: Azure Arc-connected (server target) -->
  <rect x="910" y="435" width="300" height="130" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="930" y="443" width="72" height="22" rx="5" fill="#1E8C8C"/>
  <text x="966" y="454" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">TARGET</text>
  <text x="1060" y="488" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#0D1B2E">Azure Arc-connected</text>
  <text x="1060" y="513" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#1E3A66">(server target)</text>
  <text x="1060" y="536" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5A5A5A">Auth: Entra managed identity</text>

  <!-- Legend -->
  <rect x="60" y="620" width="560" height="70" rx="6" fill="#F7F9FC" stroke="#E3E8EF" stroke-width="1"/>
  <text x="80" y="643" font-size="13" font-weight="bold" fill="#0D1B2E">Legend</text>
  <rect x="80" y="656" width="20" height="12" rx="3" fill="#0D1B2E"/>
  <text x="108" y="665" font-size="12" fill="#33414F">Legacy state</text>
  <rect x="200" y="656" width="20" height="12" rx="3" fill="#1E3A66"/>
  <text x="228" y="665" font-size="12" fill="#33414F">Transition state</text>
  <rect x="350" y="656" width="20" height="12" rx="3" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="378" y="665" font-size="12" fill="#33414F">Target states</text>
  <line x1="464" y1="662" x2="490" y2="662" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="498" y="665" font-size="12" fill="#33414F">Transition arrow</text>
</svg>
