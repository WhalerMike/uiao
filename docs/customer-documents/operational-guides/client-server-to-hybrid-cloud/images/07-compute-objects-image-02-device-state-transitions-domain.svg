<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="60" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Device State Transitions: Domain-Joined to Target States</text>
  <text x="60" y="93" font-size="18" fill="#6B7A8D">Domain-Joined  &#8594;  Hybrid-Joined  &#8594;  Entra-Joined (workstations) / Azure Arc-connected (servers)</text>

  <!-- STATE 1: Domain-Joined -->
  <rect x="60" y="270" width="220" height="180" rx="10" fill="#0D1B2E"/>
  <text x="170" y="330" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Domain-Joined</text>
  <text x="170" y="355" text-anchor="middle" font-size="13" fill="#D7F2EE">Auth: AD Kerberos</text>
  <text x="170" y="375" text-anchor="middle" font-size="13" fill="#D7F2EE">Managed: GPO only</text>
  <text x="170" y="395" text-anchor="middle" font-size="13" fill="#D7F2EE">PC + Server</text>
  <text x="170" y="420" text-anchor="middle" font-size="12" fill="#C0392B">Migration origin</text>

  <!-- Arrow 1 to 2 -->
  <line x1="280" y1="360" x2="358" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="319" y="348" text-anchor="middle" font-size="11" fill="#1E3A66">Entra Connect</text>
  <text x="319" y="360" text-anchor="middle" font-size="11" fill="#1E3A66">device sync</text>

  <!-- STATE 2: Hybrid-Joined -->
  <rect x="360" y="260" width="220" height="200" rx="10" fill="#1E3A66"/>
  <text x="470" y="322" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Hybrid-Joined</text>
  <text x="470" y="348" text-anchor="middle" font-size="13" fill="#D7F2EE">Auth: AD + Entra</text>
  <text x="470" y="368" text-anchor="middle" font-size="13" fill="#D7F2EE">Managed: GPO + Intune</text>
  <text x="470" y="388" text-anchor="middle" font-size="13" fill="#D7F2EE">PC + Server</text>
  <text x="470" y="415" text-anchor="middle" font-size="12" fill="#D4A017">Transition only —</text>
  <text x="470" y="433" text-anchor="middle" font-size="12" fill="#D4A017">not a destination</text>

  <!-- Arrow 2 to 3 (workstation path, upper) -->
  <path d="M580,310 C660,310 680,220 760,210" stroke="#1E8C8C" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/>
  <text x="672" y="248" text-anchor="middle" font-size="11" fill="#1E3A66">Autopilot</text>
  <text x="672" y="261" text-anchor="middle" font-size="11" fill="#1E3A66">enrollment</text>

  <!-- Arrow 2 to 4 (server path, lower) -->
  <path d="M580,420 C660,420 680,510 760,520" stroke="#1E8C8C" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/>
  <text x="671" y="492" text-anchor="middle" font-size="11" fill="#1E3A66">Arc onboarding</text>
  <text x="671" y="505" text-anchor="middle" font-size="11" fill="#1E3A66">+ domain leave</text>

  <!-- STATE 3: Entra-Joined (workstation target) -->
  <rect x="760" y="130" width="240" height="170" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="780" y="138" width="84" height="22" rx="5" fill="#1E8C8C"/>
  <text x="822" y="149" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">TARGET — PC</text>
  <text x="880" y="184" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Entra-Joined</text>
  <text x="880" y="207" text-anchor="middle" font-size="13" fill="#1E3A66">Auth: Entra only</text>
  <text x="880" y="227" text-anchor="middle" font-size="13" fill="#1E3A66">Managed: Intune</text>
  <text x="880" y="247" text-anchor="middle" font-size="13" fill="#5A5A5A">User PCs / workstations</text>
  <text x="880" y="265" text-anchor="middle" font-size="12" fill="#5A5A5A">OrgPath in extensionAttribute1</text>
  <text x="880" y="283" text-anchor="middle" font-size="12" fill="#5A5A5A">Autopilot lifecycle</text>

  <!-- STATE 4: Azure Arc-connected (server target) -->
  <rect x="760" y="440" width="240" height="170" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="780" y="448" width="100" height="22" rx="5" fill="#1E8C8C"/>
  <text x="830" y="459" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">TARGET — Server</text>
  <text x="880" y="494" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Azure Arc-connected</text>
  <text x="880" y="517" text-anchor="middle" font-size="13" fill="#1E3A66">Auth: Entra managed identity</text>
  <text x="880" y="537" text-anchor="middle" font-size="13" fill="#1E3A66">Managed: Arc + Guest Config</text>
  <text x="880" y="557" text-anchor="middle" font-size="13" fill="#5A5A5A">Windows + Linux servers</text>
  <text x="880" y="575" text-anchor="middle" font-size="12" fill="#5A5A5A">OrgPath tags in Azure</text>
  <text x="880" y="593" text-anchor="middle" font-size="12" fill="#5A5A5A">Azure Policy / Guest Config</text>

  <!-- Greenfield direct path annotation -->
  <rect x="60" y="490" width="220" height="54" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="170" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Greenfield (Autopilot)</text>
  <text x="170" y="528" text-anchor="middle" font-size="12" fill="#1E3A66">New hardware &#8594; Entra-Joined</text>
  <text x="170" y="543" text-anchor="middle" font-size="12" fill="#1E3A66">directly; no domain-join</text>
  <line x1="280" y1="517" x2="754" y2="215" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#arrow-teal)"/>

  <!-- Adapter reference badge -->
  <rect x="1080" y="130" width="165" height="60" rx="6" fill="#F7F9FC" stroke="#E3E8EF" stroke-width="1"/>
  <text x="1162" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E" font-family="Consolas, 'DejaVu Sans Mono', monospace">DM_060</text>
  <text x="1162" y="171" text-anchor="middle" font-size="11" fill="#5A5A5A">Device Management</text>
  <text x="1162" y="185" text-anchor="middle" font-size="11" fill="#5A5A5A">Adapter Interface</text>

  <!-- Legend -->
  <rect x="60" y="628" width="660" height="66" rx="6" fill="#F7F9FC" stroke="#E3E8EF" stroke-width="1"/>
  <text x="80" y="648" font-size="13" font-weight="bold" fill="#0D1B2E">Legend</text>
  <rect x="80" y="661" width="18" height="14" rx="3" fill="#0D1B2E"/>
  <text x="105" y="671" font-size="12" fill="#33414F">Legacy state</text>
  <rect x="195" y="661" width="18" height="14" rx="3" fill="#1E3A66"/>
  <text x="220" y="671" font-size="12" fill="#33414F">Transition state</text>
  <rect x="330" y="661" width="18" height="14" rx="3" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="356" y="671" font-size="12" fill="#33414F">Target states (no AD dependency)</text>
  <rect x="552" y="661" width="18" height="14" rx="3" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="578" y="671" font-size="12" fill="#33414F">Greenfield path</text>
</svg>
