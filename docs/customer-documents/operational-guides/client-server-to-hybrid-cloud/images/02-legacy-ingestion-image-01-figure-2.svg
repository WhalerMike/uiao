<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Figure 2 — Eleven Ingestion Streams into Gitea</text>
  <text x="60" y="84" font-size="17" fill="#6B7A8D">Eleven labeled input streams feed a single provenance-bound artifact set</text>
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ===== LEFT COLUMN: 11 input stream boxes ===== -->
  <!-- 11 boxes, y pitch=52, start y=116, box height=44 -->
  <!-- y centers: 138, 190, 242, 294, 346, 398, 450, 502, 554, 606, 658 -->

  <!-- Stream 1: AD (Tier A + B) -->
  <rect x="50" y="116" width="240" height="44" rx="10" fill="#0D1B2E"/>
  <text x="170" y="138" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">AD (Forest / Domain)</text>

  <!-- Stream 2: DNS (Tier B) -->
  <rect x="50" y="168" width="240" height="44" rx="10" fill="#0D1B2E"/>
  <text x="170" y="190" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">DNS Zones + Records</text>

  <!-- Stream 3: DHCP (Tier B) -->
  <rect x="50" y="220" width="240" height="44" rx="10" fill="#0D1B2E"/>
  <text x="170" y="242" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">DHCP Scopes</text>

  <!-- Stream 4: GPO (Tier B) -->
  <rect x="50" y="272" width="240" height="44" rx="10" fill="#0D1B2E"/>
  <text x="170" y="294" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">GPO (Group Policy)</text>

  <!-- Stream 5: PKI -->
  <rect x="50" y="324" width="240" height="44" rx="10" fill="#0D1B2E"/>
  <text x="170" y="346" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">PKI / ADCS</text>

  <!-- Stream 6: RADIUS -->
  <rect x="50" y="376" width="240" height="44" rx="10" fill="#1E3A66"/>
  <text x="170" y="398" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">RADIUS</text>

  <!-- Stream 7: IPAM -->
  <rect x="50" y="428" width="240" height="44" rx="10" fill="#1E3A66"/>
  <text x="170" y="450" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">IPAM</text>

  <!-- Stream 8: NTP -->
  <rect x="50" y="480" width="240" height="44" rx="10" fill="#1E3A66"/>
  <text x="170" y="502" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">NTP</text>

  <!-- Stream 9: File Shares -->
  <rect x="50" y="532" width="240" height="44" rx="10" fill="#1E3A66"/>
  <text x="170" y="554" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">File Shares</text>

  <!-- Stream 10: Scheduled Tasks -->
  <rect x="50" y="584" width="240" height="44" rx="10" fill="#1E3A66"/>
  <text x="170" y="606" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">Scheduled Tasks</text>

  <!-- Stream 11: Service Accounts -->
  <rect x="50" y="636" width="240" height="44" rx="10" fill="#1E3A66"/>
  <text x="170" y="658" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">Service Accounts</text>

  <!-- ===== ARROWS from each stream box to central pipeline ===== -->
  <!-- Central pipeline box: x=500..790, y=270..510, center=(645,390) -->
  <!-- Arrow targets converge to left edge of pipeline at x=500 -->

  <line x1="290" y1="138" x2="498" y2="320" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="290" y1="190" x2="498" y2="338" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="290" y1="242" x2="498" y2="356" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="290" y1="294" x2="498" y2="370" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="290" y1="346" x2="498" y2="383" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="290" y1="398" x2="498" y2="392" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="290" y1="450" x2="498" y2="400" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="290" y1="502" x2="498" y2="410" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="290" y1="554" x2="498" y2="425" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="290" y1="606" x2="498" y2="443" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="290" y1="658" x2="498" y2="460" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr-teal)"/>

  <!-- ===== CENTRAL PIPELINE BOX ===== -->
  <rect x="500" y="280" width="290" height="220" rx="10" fill="#1E3A66" stroke="#1E8C8C" stroke-width="3"/>
  <text x="645" y="355" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#FFFFFF">Read-only assessment</text>
  <text x="645" y="383" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#FFFFFF">ingest</text>
  <text x="645" y="411" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#D7F2EE">provenance-bound</text>
  <text x="645" y="440" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#6B7A8D">UIAOADAssessment</text>
  <text x="645" y="466" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#6B7A8D">read-only · least-privilege</text>

  <!-- Arrow from pipeline to output -->
  <line x1="790" y1="390" x2="898" y2="390" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arr-teal)"/>

  <!-- ===== OUTPUT BOX — Gitea ===== -->
  <rect x="900" y="300" width="330" height="180" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1065" y="356" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="bold" fill="#0D1B2E">Gitea artifact set</text>
  <text x="1065" y="384" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#2E75B6">(hash-stamped, signed)</text>
  <line x1="920" y1="404" x2="1210" y2="404" stroke="#E3E8EF" stroke-width="1"/>
  <text x="1065" y="425" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5A5A5A">assessments/&lt;run-id&gt;/</text>
  <text x="1065" y="447" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5A5A5A">feat(assess): signed commit</text>

  <!-- Legend -->
  <rect x="900" y="540" width="330" height="130" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
  <text x="918" y="562" font-size="14" font-weight="bold" fill="#0D1B2E">Legend</text>
  <rect x="918" y="575" width="18" height="14" rx="3" fill="#0D1B2E"/>
  <text x="942" y="587" font-size="13" fill="#33414F">Core AD streams (Tier A + B)</text>
  <rect x="918" y="597" width="18" height="14" rx="3" fill="#1E3A66"/>
  <text x="942" y="609" font-size="13" fill="#33414F">Extended streams (Tier B only)</text>
  <rect x="918" y="619" width="18" height="14" rx="3" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="942" y="631" font-size="13" fill="#33414F">Gitea output (cloud artifact store)</text>
  <rect x="918" y="641" width="18" height="3" rx="1" fill="#1E8C8C"/>
  <text x="942" y="649" font-size="13" fill="#33414F">Teal arrows — data flow</text>

  <!-- Stream count label -->
  <text x="170" y="108" text-anchor="middle" font-size="13" fill="#6B7A8D">11 input streams</text>
</svg>
