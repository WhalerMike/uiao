     ADR-093 house style: white bg, navy/teal/ice palette, Georgia headers, Arial labels. -->
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

<!-- ── Defs ──────────────────────────────────────────────────────────────── -->
