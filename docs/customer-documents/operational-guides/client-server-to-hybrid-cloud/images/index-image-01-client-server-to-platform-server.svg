<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Client-Server to Platform Server to Hybrid-Cloud</text>
  <text x="60" y="88" font-size="18" fill="#6B7A8D">The UIAO transformation arc: read-only ingestion, deterministic planning, governed delivery</text>

  <!-- Divider line -->
  <line x1="60" y1="104" x2="1220" y2="104" stroke="#E3E8EF" stroke-width="1"/>

  <!-- =============================== -->
  <!-- PANEL 1: CLIENT-SERVER (source) -->
  <!-- =============================== -->
  <rect x="40" y="120" width="330" height="548" rx="10" fill="#0D1B2E"/>

  <!-- Panel 1 header -->
  <text x="205" y="152" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">CLIENT-SERVER</text>
  <text x="205" y="178" text-anchor="middle" font-size="13" fill="#6B7A8D">the source</text>

  <!-- Separator line -->
  <line x1="60" y1="192" x2="350" y2="192" stroke="#1E3A66" stroke-width="1"/>

  <!-- Panel 1 items -->
  <rect x="64" y="204" width="282" height="48" rx="6" fill="#1E3A66"/>
  <text x="205" y="228" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">AD Forest</text>

  <rect x="64" y="262" width="282" height="48" rx="6" fill="#1E3A66"/>
  <text x="205" y="286" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">GPO</text>

  <rect x="64" y="320" width="282" height="48" rx="6" fill="#1E3A66"/>
  <text x="205" y="344" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">AD-Integrated DNS</text>

  <rect x="64" y="378" width="282" height="48" rx="6" fill="#1E3A66"/>
  <text x="205" y="402" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">AD DHCP</text>

  <rect x="64" y="436" width="282" height="48" rx="6" fill="#1E3A66"/>
  <text x="205" y="460" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Kerberos SPNs</text>

  <rect x="64" y="494" width="282" height="48" rx="6" fill="#1E3A66"/>
  <text x="205" y="518" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">ADCS</text>

  <rect x="64" y="552" width="282" height="48" rx="6" fill="#1E3A66"/>
  <text x="205" y="576" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Domain-Joined PCs</text>

  <!-- Panel 1 bottom label -->
  <text x="205" y="638" text-anchor="middle" font-size="13" fill="#6B7A8D">Client/Server era estate</text>
  <text x="205" y="658" text-anchor="middle" font-size="13" fill="#6B7A8D">inherited AD forest</text>

  <!-- =============================== -->
  <!-- ARROW 1: read-only             -->
  <!-- =============================== -->
  <line x1="380" y1="394" x2="456" y2="394" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="418" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">read</text>
  <text x="418" y="414" text-anchor="middle" font-size="12" fill="#6B7A8D">only</text>

  <!-- ======================================= -->
  <!-- PANEL 2: UIAO PLATFORM SERVER (transformer) -->
  <!-- ======================================= -->
  <rect x="466" y="120" width="348" height="548" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>

  <!-- Panel 2 header -->
  <rect x="466" y="120" width="348" height="62" rx="10" fill="#D4A017"/>
  <rect x="466" y="162" width="348" height="20" fill="#D4A017"/>
  <text x="640" y="152" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="bold" fill="#0D1B2E">UIAO PLATFORM SERVER</text>
  <text x="640" y="192" text-anchor="middle" font-size="13" fill="#1E3A66">the transformer</text>

  <!-- Separator -->
  <line x1="486" y1="208" x2="794" y2="208" stroke="#E3E8EF" stroke-width="1"/>

  <!-- Platform components -->
  <rect x="490" y="218" width="300" height="52" rx="7" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.5"/>
  <text x="640" y="244" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#0D1B2E">WS2025 + IIS + Gitea</text>

  <rect x="490" y="282" width="300" height="52" rx="7" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.5"/>
  <text x="640" y="308" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#0D1B2E">Kerberos + Enterprise PKI</text>

  <rect x="490" y="346" width="300" height="52" rx="7" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.5"/>
  <text x="640" y="363" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">PowerShell + Python</text>
  <text x="640" y="385" text-anchor="middle" font-size="13" fill="#5A5A5A">+ API integrators</text>

  <!-- Pipeline flow label in center box -->
  <rect x="490" y="416" width="300" height="100" rx="7" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="640" y="444" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Analysis</text>
  <line x1="595" y1="458" x2="685" y2="458" stroke="#D4A017" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="640" y="476" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Plan</text>
  <line x1="595" y1="490" x2="685" y2="490" stroke="#D4A017" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="640" y="508" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Deliver</text>

  <!-- Canonical monorepo label -->
  <rect x="490" y="532" width="300" height="52" rx="7" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.5"/>
  <text x="640" y="555" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Canonical Monorepo</text>
  <text x="640" y="575" text-anchor="middle" font-size="12" fill="#5A5A5A">versioned + signed artifacts in Gitea</text>

  <!-- Panel 2 footer -->
  <text x="640" y="638" text-anchor="middle" font-size="13" fill="#5A5A5A">Single Tier-0 Windows Server 2025 host</text>
  <text x="640" y="658" text-anchor="middle" font-size="13" fill="#5A5A5A">governs the entire transformation</text>

  <!-- =============================== -->
  <!-- ARROW 2: write                 -->
  <!-- =============================== -->
  <line x1="824" y1="394" x2="900" y2="394" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="862" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">write</text>
  <text x="862" y="414" text-anchor="middle" font-size="12" fill="#6B7A8D">governed</text>

  <!-- =============================== -->
  <!-- PANEL 3: HYBRID-CLOUD (target) -->
  <!-- =============================== -->
  <rect x="910" y="120" width="330" height="548" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>

  <!-- Panel 3 header -->
  <rect x="910" y="120" width="330" height="62" rx="10" fill="#1E8C8C"/>
  <rect x="910" y="162" width="330" height="20" fill="#1E8C8C"/>
  <text x="1075" y="152" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">HYBRID-CLOUD</text>
  <text x="1075" y="192" text-anchor="middle" font-size="13" fill="#1E3A66">the target</text>

  <!-- Separator -->
  <line x1="930" y1="208" x2="1220" y2="208" stroke="#E3E8EF" stroke-width="1"/>

  <!-- Panel 3 items -->
  <rect x="934" y="218" width="282" height="48" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1075" y="242" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#0D1B2E">Entra ID + Intune + Arc</text>

  <rect x="934" y="276" width="282" height="48" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1075" y="300" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#0D1B2E">IPAM + DNS + DHCP</text>

  <rect x="934" y="334" width="282" height="48" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1075" y="358" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#0D1B2E">SASE + Zero Trust + MFA</text>

  <rect x="934" y="392" width="282" height="48" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1075" y="416" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#0D1B2E">Conditional Access</text>

  <rect x="934" y="450" width="282" height="48" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1075" y="474" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#0D1B2E">Certificate-Based Auth</text>

  <!-- Gap spacer rows -->
  <rect x="934" y="508" width="282" height="76" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1"/>
  <text x="1075" y="534" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8C8C">Zero-Trust estate</text>
  <text x="1075" y="556" text-anchor="middle" font-size="12" fill="#5A5A5A">canon-materialized, drift-detected,</text>
  <text x="1075" y="575" text-anchor="middle" font-size="12" fill="#5A5A5A">evidence-built-in, ATO-ready</text>

  <!-- Panel 3 footer -->
  <text x="1075" y="638" text-anchor="middle" font-size="13" fill="#5A5A5A">Governed Hybrid-Cloud target surface</text>
  <text x="1075" y="658" text-anchor="middle" font-size="13" fill="#5A5A5A">Canon in Gitea is the source of truth</text>

  <!-- Bottom bar -->
  <rect x="40" y="678" width="1200" height="32" rx="6" fill="#0D1B2E"/>
  <text x="640" y="694" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#6B7A8D">UIAO_151–UIAO_176 · DM_010..090 · 52-week / 7-gate program · Five parallel workstreams</text>
</svg>
