<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<!-- index-image-01-client-server-to-platform-server.svg
     Caption: Client-Server to Platform Server to Hybrid-Cloud transformation arc
     Three-stage left-to-right arc with detail rows drawn from index.qmd ASCII diagram.
     Stage 1: Client-Server (navy) — AD Forest, GPO, DNS, DHCP, Kerberos SPNs, ADCS, Domain-joined PCs
     Stage 2: UIAO Platform Server (navy/teal) — WS2025+IIS+Gitea, Kerberos+PKI, PS+Python+API, Analysis→Plan→Deliver
