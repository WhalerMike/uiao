<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Layered Platform Architecture — UIAO Substrate Stack</text>
  <text x="60" y="88" font-size="18" fill="#6B7A8D">Bottom-to-top: hardware anchor through adapter dispatch surface</text>

  <!-- Layer 1: Windows Server 2025 (bottom) -->
  <rect x="200" y="590" width="880" height="80" rx="10" fill="#0D1B2E"/>
  <text x="640" y="622" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">Windows Server 2025</text>
  <text x="640" y="650" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#D7F2EE">CIS Level 2 · AppLocker · WDAC · Defender for Servers Plan 2 · Tier-0 host</text>

  <!-- Layer 2: Legacy-to-Modern Auth Bridge -->
  <rect x="200" y="490" width="880" height="80" rx="10" fill="#1E3A66"/>
  <text x="640" y="522" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">Legacy-to-Modern Auth Bridge</text>
  <text x="640" y="550" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#D7F2EE">Kerberos (AD-joined) · Enterprise PKI · Entra-registered (OAuth2/OIDC) · mTLS client cert</text>

  <!-- Layer 3: HTTPS Reverse Proxy -->
  <rect x="200" y="390" width="880" height="80" rx="10" fill="#1E3A66"/>
  <text x="640" y="422" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">HTTPS Reverse Proxy + Client-Cert Terminator</text>
  <text x="640" y="450" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#D7F2EE">IIS + URL Rewrite + ARR · TLS termination · HSTS · HTTP/2 · AD LDAPS auth</text>

  <!-- Layer 4: Transformation Engine -->
  <rect x="200" y="280" width="880" height="90" rx="10" fill="#1E8C8C"/>
  <text x="640" y="310" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">Transformation Engine</text>
  <text x="640" y="338" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#FFFFFF">PowerShell 7.4+ (AD reads, Pester) · Python 3.12+ (networkx, OSCAL, UIAO_158 schema)</text>
  <text x="640" y="360" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#FFFFFF">Graph · ARM · Intune · Infoblox · ServiceNow REST · CyberArk REST · ScubaGear</text>

  <!-- Layer 5: Canonical Source of Truth -->
  <rect x="200" y="180" width="880" height="80" rx="10" fill="#2E75B6"/>
  <text x="640" y="210" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">Canonical Source of Truth</text>
  <text x="640" y="238" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#FFFFFF">Gitea (behind IIS, loopback :3000) · every artifact versioned · every commit signed · ADR-041</text>

  <!-- Layer 6 (top): Adapter Dispatcher -->
  <rect x="200" y="120" width="880" height="50" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="640" y="145" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#0D1B2E">Adapter Dispatcher — DM_* + UIAO_159</text>

  <!-- Vertical connector arrows between layers (upward) -->
  <line x1="640" y1="170" x2="640" y2="182" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="640" y1="270" x2="640" y2="282" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="640" y1="380" x2="640" y2="392" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="640" y1="480" x2="640" y2="492" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="640" y1="580" x2="640" y2="592" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Layer labels (left side) -->
  <text x="175" y="147" text-anchor="end" font-size="13" fill="#6B7A8D">L6</text>
  <text x="175" y="222" text-anchor="end" font-size="13" fill="#6B7A8D">L5</text>
  <text x="175" y="328" text-anchor="end" font-size="13" fill="#6B7A8D">L4</text>
  <text x="175" y="432" text-anchor="end" font-size="13" fill="#6B7A8D">L3</text>
  <text x="175" y="532" text-anchor="end" font-size="13" fill="#6B7A8D">L2</text>
  <text x="175" y="632" text-anchor="end" font-size="13" fill="#6B7A8D">L1</text>

  <!-- Legend bottom-right -->
  <rect x="1050" y="590" width="190" height="110" rx="6" fill="#EAF1FB" stroke="#E3E8EF" stroke-width="1"/>
  <text x="1145" y="610" text-anchor="middle" font-size="13" font-weight="bold" fill="#33414F">Legend</text>
  <rect x="1065" y="622" width="18" height="12" rx="2" fill="#0D1B2E"/>
  <text x="1090" y="633" font-size="12" fill="#33414F">OS / Security baseline</text>
  <rect x="1065" y="642" width="18" height="12" rx="2" fill="#1E3A66"/>
  <text x="1090" y="653" font-size="12" fill="#33414F">Auth / Proxy layers</text>
  <rect x="1065" y="662" width="18" height="12" rx="2" fill="#1E8C8C"/>
  <text x="1090" y="673" font-size="12" fill="#33414F">Engine / Integration</text>
  <rect x="1065" y="682" width="18" height="12" rx="2" fill="#2E75B6"/>
  <text x="1090" y="693" font-size="12" fill="#33414F">Canonical state store</text>
</svg>
