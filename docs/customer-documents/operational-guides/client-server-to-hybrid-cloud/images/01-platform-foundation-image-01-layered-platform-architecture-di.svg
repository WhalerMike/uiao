<text x="640" y="70" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">Figure 1.1 — Four layers running on one Windows Server 2025 host (UIAO-GIT01 · Tier-0)</text>

