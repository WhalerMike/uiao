<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="54" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="32" fill="#0D1B2E">How to read this series: five parts, eleven chapters</text>
  <text x="60" y="84" font-size="17" fill="#6B7A8D">Enter at any chapter; reading in order is the intended path</text>

  <!-- Five part columns -->
  <!-- Part I -->
  <rect x="48" y="120" width="232" height="36" rx="8" fill="#0D1B2E"/>
  <text x="164" y="138" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Part I · Platform</text>
  <rect x="48" y="166" width="232" height="58" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="64" y="190" font-size="14" font-weight="bold" fill="#0D1B2E">00 · The Problem</text>
  <text x="64" y="210" font-size="12" fill="#33414F">AD's hidden governance surface</text>
  <rect x="48" y="232" width="232" height="58" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="64" y="256" font-size="14" font-weight="bold" fill="#0D1B2E">01 · Platform Server</text>
  <text x="64" y="276" font-size="12" fill="#33414F">WS2025 + IIS + Gitea + PKI</text>

  <!-- Part II -->
  <rect x="300" y="120" width="232" height="36" rx="8" fill="#0D1B2E"/>
  <text x="416" y="138" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Part II · Engine</text>
  <rect x="300" y="166" width="232" height="58" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="316" y="190" font-size="14" font-weight="bold" fill="#0D1B2E">02 · Analyze the Estate</text>
  <text x="316" y="210" font-size="12" fill="#33414F">Read-only, provenance-bound</text>
  <rect x="300" y="232" width="232" height="58" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="316" y="256" font-size="14" font-weight="bold" fill="#0D1B2E">03 · Analyze to Deliver</text>
  <text x="316" y="276" font-size="12" fill="#33414F">Plan, validate, deliver</text>

  <!-- Part III -->
  <rect x="552" y="120" width="232" height="36" rx="8" fill="#0D1B2E"/>
  <text x="668" y="138" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Part III · Delivery</text>
  <rect x="552" y="166" width="232" height="58" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="568" y="190" font-size="14" font-weight="bold" fill="#0D1B2E">04 · Identity</text>
  <text x="568" y="210" font-size="12" fill="#33414F">Entra ID + OrgPath</text>
  <rect x="552" y="232" width="232" height="58" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="568" y="256" font-size="14" font-weight="bold" fill="#0D1B2E">05 · Policy</text>
  <text x="568" y="276" font-size="12" fill="#33414F">Intune + Conditional Access</text>
  <rect x="552" y="298" width="232" height="58" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="568" y="322" font-size="14" font-weight="bold" fill="#0D1B2E">06 · Services</text>
  <text x="568" y="342" font-size="12" fill="#33414F">DNS, DHCP, IPAM</text>
  <rect x="552" y="364" width="232" height="58" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="568" y="388" font-size="14" font-weight="bold" fill="#0D1B2E">07 · Compute</text>
  <text x="568" y="408" font-size="12" fill="#33414F">Entra + Intune + Azure Arc</text>

  <!-- Part IV -->
  <rect x="804" y="120" width="232" height="36" rx="8" fill="#0D1B2E"/>
  <text x="920" y="138" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Part IV · Access</text>
  <rect x="804" y="166" width="232" height="58" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="820" y="190" font-size="14" font-weight="bold" fill="#0D1B2E">08 · Access Plane</text>
  <text x="820" y="210" font-size="12" fill="#33414F">SASE, Zero Trust, MFA, CBA</text>

  <!-- Part V -->
  <rect x="1056" y="120" width="180" height="36" rx="8" fill="#0D1B2E"/>
  <text x="1146" y="138" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Part V · Program</text>
  <rect x="1056" y="166" width="180" height="58" rx="9" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="1072" y="190" font-size="14" font-weight="bold" fill="#0D1B2E">09 · Roadmap</text>
  <text x="1072" y="210" font-size="12" fill="#33414F">Phases, gates, rollback</text>
  <rect x="1056" y="232" width="180" height="58" rx="9" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="1072" y="256" font-size="14" font-weight="bold" fill="#0D1B2E">10 · Takeaway</text>
  <text x="1072" y="276" font-size="12" fill="#33414F">Instruments vs. orchestra</text>

  <!-- flow arrows between parts -->
  <line x1="282" y1="195" x2="298" y2="195" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="534" y1="195" x2="550" y2="195" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="786" y1="195" x2="802" y2="195" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1038" y1="195" x2="1054" y2="195" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Recommended paths by audience -->
  <rect x="48" y="470" width="1188" height="210" rx="12" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="2"/>
  <rect x="48" y="470" width="1188" height="40" rx="12" fill="#1E3A66"/>
  <text x="68" y="490" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">Recommended paths by audience</text>

  <text x="72" y="540" font-size="15" font-weight="bold" fill="#1E8C8C">CIO / CISO / sponsor</text>
  <text x="72" y="566" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F">00 -&gt; 10 -&gt; 09</text>
  <text x="72" y="612" font-size="15" font-weight="bold" fill="#1E8C8C">Identity architect</text>
  <text x="72" y="638" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F">00 -&gt; 04 -&gt; 05 -&gt; 08</text>

  <text x="470" y="540" font-size="15" font-weight="bold" fill="#1E8C8C">Infrastructure architect</text>
  <text x="470" y="566" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F">00 -&gt; 01 -&gt; 06 -&gt; 07</text>
  <text x="470" y="612" font-size="15" font-weight="bold" fill="#1E8C8C">Program manager</text>
  <text x="470" y="638" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F">00 -&gt; 03 -&gt; 09</text>

  <text x="868" y="540" font-size="15" font-weight="bold" fill="#1E8C8C">Platform engineer</text>
  <text x="868" y="566" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#33414F">01 -&gt; 02 -&gt; 03</text>
  <text x="868" y="612" font-size="15" font-weight="bold" fill="#1E8C8C">3PAO assessor</text>
  <text x="868" y="638" font-size="14" fill="#33414F">Read in full; cross-ref Compliance</text>
</svg>
