<text x="44" y="703" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="start">Canon: UIAO_151 codebook &#183; UIAO_152 group library &#183; UIAO_154 delegation matrix &#183; UIAO_163 drift engine &#183; UIAO_158 JSON schema</text>
