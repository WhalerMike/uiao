<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="62" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">OrgPath — One Attribute, Five Governance Outcomes</text>
  <text x="60" y="94" font-size="18" fill="#6B7A8D">A single OrgPath attribute drives five downstream governance outcomes</text>

  <!-- Central node -->
  <rect x="430" y="282" width="340" height="136" rx="14" fill="#0D1B2E"/>
  <text x="600" y="326" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">OrgPath attribute</text>
  <text x="600" y="352" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#D7F2EE">CORP/US/EAST/IT</text>
  <text x="600" y="378" text-anchor="middle" font-size="13" fill="#6B7A8D">extensionAttribute1 · UIAO_151</text>

  <!-- ========= OUTCOME 1: Dynamic group membership (top-right) ========= -->
  <!-- arrow from central to outcome 1 -->
  <line x1="770" y1="318" x2="898" y2="184" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <text x="846" y="264" text-anchor="middle" font-size="12" fill="#1E8C8C" transform="rotate(-35,846,264)">-startsWith rule</text>

  <rect x="900" y="120" width="320" height="118" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1060" y="154" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Dynamic Group Membership</text>
  <text x="1060" y="178" text-anchor="middle" font-size="13" fill="#33414F">OrgPath -startsWith / -eq rule</text>
  <text x="1060" y="198" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2E75B6">OrgTree-FIN-Users · UIAO_152</text>
  <text x="1060" y="218" text-anchor="middle" font-size="12" fill="#5A5A5A">Membership auto-recomputes (&lt;15 min)</text>

  <!-- ========= OUTCOME 2: Conditional Access scoping (mid-right upper) ========= -->
  <line x1="770" y1="340" x2="898" y2="340" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <text x="834" y="330" text-anchor="middle" font-size="12" fill="#1E8C8C">group targeting</text>

  <rect x="900" y="298" width="320" height="118" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1060" y="332" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Conditional Access Scoping</text>
  <text x="1060" y="356" text-anchor="middle" font-size="13" fill="#33414F">CA policies include / exclude</text>
  <text x="1060" y="376" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2E75B6">OrgTree-EAST-Users · OrgTree-EXEC-CA</text>
  <text x="1060" y="396" text-anchor="middle" font-size="12" fill="#5A5A5A">Simulates GPO OU inheritance</text>

  <!-- ========= OUTCOME 3: Intune policy targeting (mid-right lower) ========= -->
  <line x1="770" y1="370" x2="898" y2="476" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <text x="836" y="442" text-anchor="middle" font-size="12" fill="#1E8C8C" transform="rotate(30,836,442)">group-based assign.</text>

  <rect x="900" y="476" width="320" height="118" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1060" y="510" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Intune Policy Targeting</text>
  <text x="1060" y="534" text-anchor="middle" font-size="13" fill="#33414F">Device / user config profiles</text>
  <text x="1060" y="554" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2E75B6">OrgTree-IT-SEC-SOC-Users</text>
  <text x="1060" y="574" text-anchor="middle" font-size="12" fill="#5A5A5A">Scoped to OrgPath branch</text>

  <!-- ========= OUTCOME 4: Administrative Unit delegation (left upper) ========= -->
  <line x1="430" y1="318" x2="302" y2="184" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <text x="350" y="263" text-anchor="middle" font-size="12" fill="#1E8C8C" transform="rotate(35,350,263)">AU membership rule</text>

  <rect x="60" y="120" width="320" height="118" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="220" y="154" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Admin Unit Delegation</text>
  <text x="220" y="178" text-anchor="middle" font-size="13" fill="#33414F">Mirrors OrgPath dynamic group rule</text>
  <text x="220" y="198" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2E75B6">AU-ORG-FIN · UIAO_154</text>
  <text x="220" y="218" text-anchor="middle" font-size="12" fill="#5A5A5A">isMemberManagementRestricted: true</text>

  <!-- ========= OUTCOME 5: Reporting and audit slicing (left lower) ========= -->
  <line x1="430" y1="370" x2="302" y2="476" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <text x="350" y="440" text-anchor="middle" font-size="12" fill="#1E8C8C" transform="rotate(-30,350,440)">drift engine query</text>

  <rect x="60" y="476" width="320" height="118" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="220" y="510" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#0D1B2E">Reporting and Audit Slicing</text>
  <text x="220" y="534" text-anchor="middle" font-size="13" fill="#33414F">UIAO_163 drift detection engine</text>
  <text x="220" y="554" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2E75B6">5 drift categories · UIAO_167 SLA</text>
  <text x="220" y="574" text-anchor="middle" font-size="12" fill="#5A5A5A">Compliance query = dyn-group query</text>

  <!-- Outcome numbering badges -->
  <circle cx="912" cy="158" r="14" fill="#1E8C8C"/>
  <text x="912" y="158" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>

  <circle cx="912" cy="336" r="14" fill="#1E8C8C"/>
  <text x="912" y="336" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>

  <circle cx="912" cy="514" r="14" fill="#1E8C8C"/>
  <text x="912" y="514" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">3</text>

  <circle cx="72" cy="158" r="14" fill="#1E8C8C"/>
  <text x="72" y="158" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">4</text>

  <circle cx="72" cy="514" r="14" fill="#1E8C8C"/>
  <text x="72" y="514" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">5</text>

  <!-- Bottom caption -->
  <text x="600" y="660" text-anchor="middle" font-size="15" fill="#5A5A5A">One attribute. Five governance outcomes. Zero admin-portal clicks to assign any of them.</text>

  <!-- Canon ref -->
  <text x="1220" y="706" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">UIAO_151 · UIAO_152 · UIAO_154 · UIAO_163</text>
</svg>
