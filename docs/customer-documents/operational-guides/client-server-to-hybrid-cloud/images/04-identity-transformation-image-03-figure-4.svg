<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<!-- Figure 4 — A single OrgPath attribute drives five downstream governance outcomes -->
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
  </marker>
</defs>

<!-- Title -->
<text x="640" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">A Single OrgPath Attribute Drives Five Downstream Governance Outcomes</text>

<!-- ============================================================
     CENTRAL NODE — the OrgPath attribute
     x=440..640 (200 wide), centered at x=540, y=260..380 (120 tall)
     ============================================================ -->
<rect x="390" y="250" width="240" height="160" rx="16" fill="#0D1B2E" stroke="#1E8C8C" stroke-width="3"/>
<!-- label -->
<text x="510" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">OrgPath attribute</text>
<!-- monospace identifier value -->
<rect x="406" y="306" width="208" height="34" rx="6" fill="#1E3A66"/>
<text x="510" y="324" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ORG-FIN-AP-EAST</text>
<!-- storage note -->
<text x="510" y="360" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">extensionAttribute1</text>
<text x="510" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">Set by assign-orgpath workflow</text>
<text x="510" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">HR-driven &#183; codebook-validated</text>

<!-- ============================================================
     OUTCOME CARDS — 5 cards fanning right from center node
     Cards stacked vertically on the right side, x=810..1230
     y positions (top of each card): 66, 186, 306, 426, 546
     Card height: 100; width: 420
     Arrow from center right edge (x=630, y=330) to left edge of each card
     ============================================================ -->

<!-- lines from center to each card (fan-out) -->
<!-- Outcome 1: Dynamic Group Membership — y center=116 -->
<line x1="630" y1="330" x2="760" y2="116" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>
<!-- Outcome 2: Administrative Unit — y center=236 -->
<line x1="630" y1="330" x2="760" y2="236" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>
<!-- Outcome 3: Conditional Access — y center=356 (same level) -->
<line x1="630" y1="330" x2="760" y2="356" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>
<!-- Outcome 4: License Assignment — y center=476 -->
<line x1="630" y1="330" x2="760" y2="476" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>
<!-- Outcome 5: Drift Detection — y center=596 -->
<line x1="630" y1="330" x2="760" y2="596" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>

<!-- === OUTCOME 1: Dynamic Group Membership === -->
<rect x="762" y="66" width="474" height="100" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<rect x="762" y="66" width="8" height="100" rx="4" fill="#1E8C8C"/>
<!-- number badge -->
<rect x="778" y="82" width="24" height="24" rx="12" fill="#0D1B2E"/>
<text x="790" y="95" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
<text x="816" y="95" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">Dynamic Group Membership</text>
<text x="778" y="124" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start" dominant-baseline="central">Every user with extensionAttribute1 startsWith "ORG-FIN"</text>
<text x="778" y="144" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">&#8594; OrgTree-FIN-AP-Users</text>

<!-- === OUTCOME 2: Administrative Unit Scoping === -->
<rect x="762" y="186" width="474" height="100" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<rect x="762" y="186" width="8" height="100" rx="4" fill="#1E8C8C"/>
<rect x="778" y="202" width="24" height="24" rx="12" fill="#0D1B2E"/>
<text x="790" y="215" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
<text x="816" y="215" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">Administrative Unit Scoping</text>
<text x="778" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start" dominant-baseline="central">Delegated admins manage only users in their AU scope</text>
<text x="778" y="264" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">&#8594; AU-ORG-FIN-AP  (restricted management)</text>

<!-- === OUTCOME 3: Conditional Access Targeting === -->
<rect x="762" y="306" width="474" height="100" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<rect x="762" y="306" width="8" height="100" rx="4" fill="#1E8C8C"/>
<rect x="778" y="322" width="24" height="24" rx="12" fill="#0D1B2E"/>
<text x="790" y="335" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
<text x="816" y="335" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">Conditional Access Targeting</text>
<text x="778" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start" dominant-baseline="central">CA policies include or exclude groups keyed to OrgPath segments</text>
<text x="778" y="384" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">&#8594; OrgTree-FIN-CA targets CA-200..CA-299 range</text>

<!-- === OUTCOME 4: License Assignment === -->
<rect x="762" y="426" width="474" height="100" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<rect x="762" y="426" width="8" height="100" rx="4" fill="#1E8C8C"/>
<rect x="778" y="442" width="24" height="24" rx="12" fill="#0D1B2E"/>
<text x="790" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
<text x="816" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">Group-Based License Assignment</text>
<text x="778" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start" dominant-baseline="central">License SKUs flow from OrgPath-scoped dynamic groups automatically</text>
<text x="778" y="504" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">&#8594; OrgTree-HR-Licensed  (M365 E3/E5 per division)</text>

<!-- === OUTCOME 5: Drift Detection === -->
<rect x="762" y="546" width="474" height="100" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<rect x="762" y="546" width="8" height="100" rx="4" fill="#1E8C8C"/>
<rect x="778" y="562" width="24" height="24" rx="12" fill="#0D1B2E"/>
<text x="790" y="575" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">5</text>
<text x="816" y="575" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">Drift Detection (UIAO_163)</text>
<text x="778" y="604" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start" dominant-baseline="central">Every user OrgPath validated against codebook and HR source of truth</text>
<text x="778" y="624" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">&#8594; Value Drift SLA: 24 h &#183; Schema Drift SLA: 4 h</text>

<!-- ============================================================
     LEFT SIDE — supplementary OrgPath examples
     ============================================================ -->
<rect x="30" y="84" width="346" height="152" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="203" y="106" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">OrgPath format: ORG-&lt;DIV&gt;[-&lt;DEPT&gt;[-&lt;SUB&gt;[-&lt;LOC&gt;]]]</text>
<text x="46" y="130" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">ORG-FIN-AP-EAST</text>
<text x="256" y="130" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="start" dominant-baseline="central">Fin / AP / East</text>
<text x="46" y="152" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">ORG-IT-INF-PLATFORM</text>
<text x="256" y="152" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="start" dominant-baseline="central">IT / Infra / Platform</text>
<text x="46" y="174" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">ORG-HR-BEN</text>
<text x="256" y="174" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="start" dominant-baseline="central">HR / Benefits</text>
<text x="46" y="196" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">ORG-EXEC</text>
<text x="256" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B7A8D" text-anchor="start" dominant-baseline="central">Executive (top-level)</text>
<text x="46" y="220" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D" text-anchor="start" dominant-baseline="central">^ORG(-[A-Z]{2,6}){0,4}$</text>

<!-- codebook callout -->
<rect x="30" y="256" width="346" height="100" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
<text x="203" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Codebook (UIAO_151)</text>
<text x="46" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start" dominant-baseline="central">Every valid code enumerated in YAML</text>
<text x="46" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start" dominant-baseline="central">Changes via Canon Change Protocol</text>
<text x="46" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="start" dominant-baseline="central">UIAO_158 schema rejects invalid codes</text>

<!-- key insight banner -->
<rect x="30" y="600" width="700" height="66" rx="12" fill="#0D1B2E"/>
<text x="380" y="626" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">One attribute. Five governance outcomes. Zero admin-portal clicks to assign any of them.</text>
<text x="380" y="650" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">Set OrgPath &#8594; group membership, AU scope, CA targeting, license, drift visibility — all automatic</text>

