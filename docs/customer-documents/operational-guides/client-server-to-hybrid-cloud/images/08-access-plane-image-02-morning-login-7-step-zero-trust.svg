<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="54" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="32" fill="#0D1B2E">Morning Login — 7-Step Zero-Trust Flow</text>
  <text x="60" y="82" font-size="15" fill="#6B7A8D">Identity-bound · per-request evaluation · continuous revocation · OrgPath-scoped · provenance-bound</text>

  <!-- ===== STEP NODES (horizontal flow, compact) ===== -->
  <!-- Step 1: Device Boot -->
  <rect x="44" y="110" width="156" height="108" rx="10" fill="#0D1B2E"/>
  <text x="122" y="148" text-anchor="middle" font-size="34" font-weight="bold" fill="#1E8C8C">1</text>
  <text x="122" y="175" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Device Boot</text>
  <text x="122" y="196" text-anchor="middle" font-size="12" fill="#D7F2EE">Intune compliance</text>
  <text x="122" y="212" text-anchor="middle" font-size="12" fill="#D7F2EE">BitLocker unlock</text>

  <!-- Step 2: Windows Hello Sign-in -->
  <rect x="222" y="110" width="156" height="108" rx="10" fill="#0D1B2E"/>
  <text x="300" y="148" text-anchor="middle" font-size="34" font-weight="bold" fill="#1E8C8C">2</text>
  <text x="300" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Windows Hello</text>
  <text x="300" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Sign-in</text>
  <text x="300" y="212" text-anchor="middle" font-size="12" fill="#D7F2EE">CAC + PIN / passkey</text>

  <!-- Step 3: Entra Authentication -->
  <rect x="400" y="110" width="156" height="108" rx="10" fill="#1E3A66"/>
  <text x="478" y="148" text-anchor="middle" font-size="34" font-weight="bold" fill="#1E8C8C">3</text>
  <text x="478" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Entra</text>
  <text x="478" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Authentication</text>
  <text x="478" y="212" text-anchor="middle" font-size="12" fill="#D7F2EE">CBA cert chain · token</text>

  <!-- Step 4: Conditional Access Evaluation -->
  <rect x="578" y="110" width="162" height="108" rx="10" fill="#1E3A66"/>
  <text x="659" y="148" text-anchor="middle" font-size="34" font-weight="bold" fill="#1E8C8C">4</text>
  <text x="659" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Conditional Access</text>
  <text x="659" y="189" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Evaluation</text>
  <text x="659" y="210" text-anchor="middle" font-size="12" fill="#D7F2EE">CA-100 enterprise baseline</text>

  <!-- Step 5: Device Compliance Check -->
  <rect x="762" y="110" width="156" height="108" rx="10" fill="#1E8C8C"/>
  <text x="840" y="148" text-anchor="middle" font-size="34" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="840" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Device</text>
  <text x="840" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Compliance</text>
  <text x="840" y="212" text-anchor="middle" font-size="12" fill="#0D1B2E">Intune · MS Graph</text>

  <!-- Step 6: Certificate-Based VPN/SASE -->
  <rect x="940" y="110" width="156" height="108" rx="10" fill="#1E8C8C"/>
  <text x="1018" y="148" text-anchor="middle" font-size="34" font-weight="bold" fill="#FFFFFF">6</text>
  <text x="1018" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">CBA VPN /</text>
  <text x="1018" y="189" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">SASE ZTNA</text>
  <text x="1018" y="210" text-anchor="middle" font-size="12" fill="#0D1B2E">Entra token · OrgPath</text>

  <!-- Step 7: JIT Privileged Elevation -->
  <rect x="1118" y="110" width="162" height="108" rx="10" fill="#D4A017"/>
  <text x="1199" y="148" text-anchor="middle" font-size="34" font-weight="bold" fill="#0D1B2E">7</text>
  <text x="1199" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">JIT Privileged</text>
  <text x="1199" y="189" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Elevation</text>
  <text x="1199" y="210" text-anchor="middle" font-size="12" fill="#0D1B2E">PIM · FIDO2 · CyberArk</text>

  <!-- Arrows between step nodes -->
  <line x1="200" y1="164" x2="220" y2="164" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="378" y1="164" x2="398" y2="164" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="556" y1="164" x2="576" y2="164" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="740" y1="164" x2="760" y2="164" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="918" y1="164" x2="938" y2="164" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1096" y1="164" x2="1116" y2="164" stroke="#D4A017" stroke-width="3" marker-end="url(#arrow-amber)"/>

  <!-- Separator -->
  <line x1="44" y1="236" x2="1242" y2="236" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ===== MIDDLE BAND: Zero Trust principles ===== -->
  <text x="640" y="265" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Zero Trust Principles Enforced Across Every Step</text>

  <!-- ZT Principle 1: Verify Explicitly -->
  <rect x="44" y="282" width="375" height="80" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="232" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">1. Verify Explicitly</text>
  <text x="232" y="328" text-anchor="middle" font-size="13" fill="#33414F">Identity + device + risk + session state</text>
  <text x="232" y="348" text-anchor="middle" font-size="13" fill="#33414F">evaluated per request — no implicit trust</text>

  <!-- ZT Principle 2: Least-Privilege Access -->
  <rect x="453" y="282" width="372" height="80" rx="8" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="639" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">2. Least-Privilege Access</text>
  <text x="639" y="328" text-anchor="middle" font-size="13" fill="#33414F">PIM time-bound · AU resource-scoped</text>
  <text x="639" y="348" text-anchor="middle" font-size="13" fill="#33414F">Access Packages · no standing privilege</text>

  <!-- ZT Principle 3: Assume Breach -->
  <rect x="859" y="282" width="383" height="80" rx="8" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1050" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">3. Assume Breach</text>
  <text x="1050" y="328" text-anchor="middle" font-size="13" fill="#33414F">CAE revokes sessions mid-flight on risk change</text>
  <text x="1050" y="348" text-anchor="middle" font-size="13" fill="#33414F">Break-glass minimal · monitored · audited</text>

  <!-- Separator -->
  <line x1="44" y1="380" x2="1242" y2="380" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ===== LOWER BAND: AD-era patterns retired ===== -->
  <text x="640" y="408" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">AD-Era Patterns Retired by This Access Plane</text>

  <rect x="44" y="424" width="370" height="70" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="229" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">Network-Segment Authority</text>
  <text x="229" y="467" text-anchor="middle" font-size="12" fill="#33414F">IP-range allowlists retired — policy is per-identity,</text>
  <text x="229" y="483" text-anchor="middle" font-size="12" fill="#33414F">per-device, per-session.</text>

  <rect x="450" y="424" width="370" height="70" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="635" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">Pass-through AD Kerberos</text>
  <text x="635" y="467" text-anchor="middle" font-size="12" fill="#33414F">Kerberos tickets from DC retired — tokens are</text>
  <text x="635" y="483" text-anchor="middle" font-size="12" fill="#33414F">Entra-issued, short-lived, CAE-monitored.</text>

  <rect x="856" y="424" width="386" height="70" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="1049" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">Persistent Admin Rights</text>
  <text x="1049" y="467" text-anchor="middle" font-size="12" fill="#33414F">Domain Admins / never-expiring service accounts</text>
  <text x="1049" y="483" text-anchor="middle" font-size="12" fill="#33414F">migrate to PIM / gMSA / Workload Identity Federation.</text>

  <!-- Separator -->
  <line x1="44" y1="510" x2="1242" y2="510" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ===== BOTTOM BAND: governance identifiers + legend ===== -->
  <text x="640" y="537" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Governance Identifiers</text>

  <rect x="44" y="552" width="264" height="44" rx="6" fill="#EAF1FB" stroke="#E3E8EF" stroke-width="1"/>
  <text x="176" y="569" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Governance Telemetry</text>
  <text x="176" y="587" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2E75B6">UIAO_174 · UIAO_167</text>

  <rect x="326" y="552" width="238" height="44" rx="6" fill="#EAF1FB" stroke="#E3E8EF" stroke-width="1"/>
  <text x="445" y="569" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">PKI Adapter</text>
  <text x="445" y="587" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2E75B6">DM_020</text>

  <rect x="582" y="552" width="238" height="44" rx="6" fill="#EAF1FB" stroke="#E3E8EF" stroke-width="1"/>
  <text x="701" y="569" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Identity Risk Scoring</text>
  <text x="701" y="587" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2E75B6">UIAO_170</text>

  <rect x="838" y="552" width="238" height="44" rx="6" fill="#EAF1FB" stroke="#E3E8EF" stroke-width="1"/>
  <text x="957" y="569" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Delegation Matrix</text>
  <text x="957" y="587" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2E75B6">UIAO_154</text>

  <rect x="1094" y="552" width="188" height="44" rx="6" fill="#EAF1FB" stroke="#E3E8EF" stroke-width="1"/>
  <text x="1188" y="569" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Access-Plane Drift</text>
  <text x="1188" y="587" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2E75B6">UIAO_163</text>

  <!-- Legend -->
  <rect x="44" y="622" width="14" height="14" rx="2" fill="#0D1B2E"/>
  <text x="64" y="634" font-size="12" fill="#5A5A5A">Device / structural step</text>
  <rect x="220" y="622" width="14" height="14" rx="2" fill="#1E3A66"/>
  <text x="240" y="634" font-size="12" fill="#5A5A5A">Entra cloud step</text>
  <rect x="370" y="622" width="14" height="14" rx="2" fill="#1E8C8C"/>
  <text x="390" y="634" font-size="12" fill="#5A5A5A">Access enforcement step</text>
  <rect x="570" y="622" width="14" height="14" rx="2" fill="#D4A017"/>
  <text x="590" y="634" font-size="12" fill="#5A5A5A">JIT privileged elevation (high-severity gate)</text>
  <rect x="840" y="622" width="14" height="14" rx="2" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="860" y="634" font-size="12" fill="#5A5A5A">Retired AD-era pattern</text>
</svg>
