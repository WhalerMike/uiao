<!-- ══════════════════════════════════════════════════════════════════════
     11 spoke nodes arranged clockwise from top.
     Each node: w=170, h=68.
     Angles (°→radians, measured from 12-o'clock clockwise):
       0=top (270°), 1=top-right-ish (302°), 2=right-top (334°),
       3=right (6°), 4=bottom-right (38°), 5=bottom-right-far (70°),
       6=bottom (102°→bottom), 7=bottom-left-far (134°), 8=bottom-left (166°),
       9=left (198°), 10=top-left (230°)
     Using spoke radius 240 from hub center for outer edge mid-points.
     cx=640, cy=390.

     Pre-calculated spoke-line endpoints (hub edge → node center, r=240):
     We use 11 evenly-spaced angles starting at -90° (top), stepping 360/11 ≈ 32.7°.

     Angles (degrees, from positive-x axis):
       0:  -90       → node center (640, 150)
       1:  -57.3     → (843, 188)
       2:  -24.5     → (978, 291)
       3:    8.2     → (978, 411)  — NOTE: some overlap, so we offset slightly below right
       4:   40.9     → (878, 547)  — nudge right
       5:   73.6     → (693, 626)
       6:  106.4     → (497, 626)  — below center-left  (symmetry of 5)
       7:  139.1     → (296, 547)  — symmetry of 4
       8:  171.8     → (197, 411)  — symmetry of 3
       9:  204.5     → (197, 291)  — symmetry of 2
      10:  237.3     → (330, 188)  — symmetry of 1

     Spoke node tile: w=170, h=68 → half: 85, 34
     Tile top-left = node_center - (85, 34)
     Spoke line: from hub-edge (approximated along the spoke direction) to tile near-edge.
     ══════════════════════════════════════════════════════════════════════ -->

