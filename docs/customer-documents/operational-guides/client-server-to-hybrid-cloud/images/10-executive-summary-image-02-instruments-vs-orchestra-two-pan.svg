<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="52" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Instruments vs. Orchestra</text>
  <text x="60" y="84" font-size="18" fill="#6B7A8D">Microsoft supplies the tools. UIAO supplies the governance framework that runs them as one.</text>

  <!-- Divider line -->
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ========== LEFT PANEL ========== -->
  <!-- Panel background -->
  <rect x="44" y="112" width="556" height="570" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>

  <!-- Panel header bar -->
  <rect x="44" y="112" width="556" height="56" rx="10" fill="#0D1B2E"/>
  <rect x="44" y="148" width="556" height="20" fill="#0D1B2E"/>
  <text x="322" y="141" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="bold" fill="#FFFFFF">INSTRUMENTS</text>

  <!-- Sub-header -->
  <text x="322" y="186" text-anchor="middle" font-size="14" fill="#1E3A66">Individual authorized tools — no shared governance layer</text>

  <!-- Tool tiles: 2 columns, left panel -->
  <!-- Row 1 -->
  <rect x="64" y="202" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="183" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Entra ID</text>
  <text x="183" y="252" text-anchor="middle" font-size="12" fill="#5A5A5A">Cloud identity directory</text>

  <rect x="322" y="202" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="441" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Intune</text>
  <text x="441" y="252" text-anchor="middle" font-size="12" fill="#5A5A5A">MDM + device policy</text>

  <!-- Row 2 -->
  <rect x="64" y="280" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="183" y="306" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Azure Arc</text>
  <text x="183" y="330" text-anchor="middle" font-size="12" fill="#5A5A5A">Hybrid server management</text>

  <rect x="322" y="280" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="441" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Conditional Access</text>
  <text x="441" y="330" text-anchor="middle" font-size="12" fill="#5A5A5A">Access-policy enforcement</text>

  <!-- Row 3 -->
  <rect x="64" y="358" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="183" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Azure Private DNS</text>
  <text x="183" y="408" text-anchor="middle" font-size="12" fill="#5A5A5A">Hybrid DNS resolution</text>

  <rect x="322" y="358" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="441" y="381" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Sentinel</text>
  <text x="441" y="408" text-anchor="middle" font-size="12" fill="#5A5A5A">SIEM + threat detection</text>

  <!-- Row 4 -->
  <rect x="64" y="436" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="183" y="459" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Defender</text>
  <text x="183" y="481" text-anchor="middle" font-size="12" fill="#5A5A5A">Endpoint + cloud protection</text>

  <rect x="322" y="436" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="441" y="459" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Purview</text>
  <text x="441" y="481" text-anchor="middle" font-size="12" fill="#5A5A5A">Information governance</text>

  <!-- Row 5 -->
  <rect x="64" y="514" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="183" y="537" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Key Vault</text>
  <text x="183" y="559" text-anchor="middle" font-size="12" fill="#5A5A5A">Secrets + certificate store</text>

  <rect x="322" y="514" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="441" y="537" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Azure PIM</text>
  <text x="441" y="559" text-anchor="middle" font-size="12" fill="#5A5A5A">Just-in-time privilege</text>

  <!-- Left panel gap callout -->
  <rect x="64" y="594" width="496" height="58" rx="6" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="312" y="617" text-anchor="middle" font-size="14" fill="#C0392B" font-weight="bold">No framework decides what the target looks like,</text>
  <text x="312" y="639" text-anchor="middle" font-size="14" fill="#C0392B">how to get there, or how to prove it was done right.</text>

  <!-- ========== CENTER ARROW ========== -->
  <line x1="612" y1="393" x2="672" y2="393" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="642" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">+ UIAO</text>
  <text x="642" y="414" text-anchor="middle" font-size="11" fill="#6B7A8D">orchestration</text>

  <!-- ========== RIGHT PANEL ========== -->
  <!-- Panel background -->
  <rect x="680" y="112" width="556" height="570" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2.5"/>

  <!-- Panel header bar -->
  <rect x="680" y="112" width="556" height="56" rx="10" fill="#1E8C8C"/>
  <rect x="680" y="148" width="556" height="20" fill="#1E8C8C"/>
  <text x="958" y="141" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="bold" fill="#FFFFFF">ORCHESTRA</text>

  <!-- Sub-header -->
  <text x="958" y="186" text-anchor="middle" font-size="14" fill="#1E3A66">Same tools + UIAO coordination, governance, and evidence layer</text>

  <!-- Tool tiles right panel: same 2x5 grid, teal bordered, with governance labels -->
  <!-- Row 1 -->
  <rect x="700" y="202" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="819" y="225" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Entra ID</text>
  <text x="819" y="252" text-anchor="middle" font-size="11" fill="#1E8C8C">OrgPath groups · AU governance</text>

  <rect x="958" y="202" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1077" y="225" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Intune</text>
  <text x="1077" y="252" text-anchor="middle" font-size="11" fill="#1E8C8C">GPO-mapped profiles · plan-driven</text>

  <!-- Row 2 -->
  <rect x="700" y="280" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="819" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Azure Arc</text>
  <text x="819" y="330" text-anchor="middle" font-size="11" fill="#1E8C8C">Retire/project decided in canon</text>

  <rect x="958" y="280" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1077" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Conditional Access</text>
  <text x="1077" y="330" text-anchor="middle" font-size="11" fill="#1E8C8C">CA-NNN library · OrgPath targeted</text>

  <!-- Row 3 -->
  <rect x="700" y="358" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="819" y="381" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Azure Private DNS</text>
  <text x="819" y="408" text-anchor="middle" font-size="11" fill="#1E8C8C">Zone authority governed in Gitea</text>

  <rect x="958" y="358" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1077" y="381" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Sentinel</text>
  <text x="1077" y="408" text-anchor="middle" font-size="11" fill="#1E8C8C">Feeds drift engine · SLA tickets</text>

  <!-- Row 4 -->
  <rect x="700" y="436" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="819" y="459" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Defender</text>
  <text x="819" y="481" text-anchor="middle" font-size="11" fill="#1E8C8C">Evidence stream to ATO package</text>

  <rect x="958" y="436" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1077" y="459" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Purview</text>
  <text x="1077" y="481" text-anchor="middle" font-size="11" fill="#1E8C8C">Data governance by OrgPath</text>

  <!-- Row 5 -->
  <rect x="700" y="514" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="819" y="537" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Key Vault</text>
  <text x="819" y="559" text-anchor="middle" font-size="11" fill="#1E8C8C">Secrets rotated by signed plans</text>

  <rect x="958" y="514" width="238" height="64" rx="7" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1077" y="537" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Azure PIM</text>
  <text x="1077" y="559" text-anchor="middle" font-size="11" fill="#1E8C8C">Roles canon-defined · no standing</text>

  <!-- Coordination overlay: dashed lines connecting tile midpoints -->
  <!-- Horizontal connectors -->
  <line x1="938" y1="234" x2="958" y2="234" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="938" y1="312" x2="958" y2="312" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="938" y1="390" x2="958" y2="390" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="938" y1="468" x2="958" y2="468" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="938" y1="546" x2="958" y2="546" stroke="#1E8C8C" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- UIAO governance bar overlaying bottom of right panel -->
  <rect x="700" y="590" width="496" height="58" rx="6" fill="#0D1B2E"/>
  <text x="948" y="613" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">UIAO Coordination Layer</text>
  <text x="948" y="635" text-anchor="middle" font-size="12" fill="#FFFFFF">Canon in Gitea · Gates · Plans · Drift detection · Evidence · Two-Brain Execution</text>

  <!-- Legend bottom-right corner -->
  <rect x="1060" y="676" width="184" height="36" rx="5" fill="#F7F9FC" stroke="#E3E8EF" stroke-width="1"/>
  <rect x="1072" y="687" width="14" height="10" rx="2" fill="#C0392B"/>
  <text x="1092" y="696" font-size="12" fill="#33414F">gap (no framework)</text>
  <rect x="1152" y="687" width="14" height="10" rx="2" fill="#1E8C8C"/>
  <text x="1172" y="696" font-size="12" fill="#33414F">governed</text>
</svg>
