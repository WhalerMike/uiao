<!-- 10-executive-summary-image-02-instruments-vs-orchestra-two-pan.svg
     Caption: Hub-spoke of AD's 11 silent governance roles
     Hub-and-spoke: central "Active Directory" node, 11 labeled spoke boxes.
     Roles from IMAGE-PROMPTS.md and generate-series-images.py (confirmed via 00-introduction.qmd).
     ADR-093 house style: white bg, navy/teal palette, Georgia headers, Arial labels. -->
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

<!-- ── Title ─────────────────────────────────────────────────────────────── -->
<text x="640" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="26"
      font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">
  Active Directory's 11 Silent Governance Roles
</text>
<text x="640" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15"
      fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">
  AD was never just an identity store — it was the implicit governance model for every network service a federal agency ran.
</text>

<!-- ── Defs: teal arrow marker ────────────────────────────────────────────── -->
<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5"
