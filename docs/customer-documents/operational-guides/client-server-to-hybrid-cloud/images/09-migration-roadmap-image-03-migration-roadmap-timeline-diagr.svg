<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<!-- 09-migration-roadmap-image-03 | Naive vs governed migration: what breaks vs what's preserved -->
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

<!-- Title -->
<text x="640" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Naive vs. Governed Migration: What Breaks vs. What Is Preserved</text>

<!-- Divider line under title -->
<line x1="60" y1="76" x2="1220" y2="76" stroke="#E3E8EF" stroke-width="1.5"/>

<!-- Column headers -->
<rect x="60" y="88" width="550" height="48" rx="8" fill="#C0392B"/>
<text x="335" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Naive Lift-and-Shift</text>

<rect x="670" y="88" width="550" height="48" rx="8" fill="#1E8C8C"/>
<text x="945" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Governed Migration</text>

<!-- VS label in center -->
<text x="640" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#33414F" text-anchor="middle" dominant-baseline="central">vs.</text>

<!-- Sub-header labels -->
<text x="335" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">What breaks</text>
<text x="945" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">What is preserved</text>

<!-- ====== ROW 1: Delegation / governance ====== -->
<rect x="60" y="175" width="550" height="70" rx="6" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
<text x="85" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" dominant-baseline="central">Delegation model lost</text>
<text x="85" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" dominant-baseline="central">OU ACLs have no Entra equivalent; admins lose scope.</text>

<rect x="670" y="175" width="550" height="70" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="695" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" dominant-baseline="central">Delegation preserved via AUs</text>
<text x="695" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" dominant-baseline="central">Administrative Units (UIAO_154) mirror OU ACL scopes.</text>

<!-- ====== ROW 2: Group membership ====== -->
<rect x="60" y="256" width="550" height="70" rx="6" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
<text x="85" y="283" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" dominant-baseline="central">Security group membership orphaned</text>
<text x="85" y="305" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" dominant-baseline="central">Flat Entra directory drops OU-derived memberships.</text>

<rect x="670" y="256" width="550" height="70" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="695" y="283" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" dominant-baseline="central">Dynamic groups rebuild membership</text>
<text x="695" y="305" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" dominant-baseline="central">OrgPath + UIAO_152 rules re-derive every group (UIAO_163).</text>

<!-- ====== ROW 3: Policy / GPO ====== -->
<rect x="60" y="337" width="550" height="70" rx="6" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
<text x="85" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" dominant-baseline="central">GPO inheritance silently drops</text>
<text x="85" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" dominant-baseline="central">Intune + CA not configured; policy gaps are invisible.</text>

<rect x="670" y="337" width="550" height="70" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="695" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" dominant-baseline="central">GPO coverage mapped to Intune + CA</text>
<text x="695" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" dominant-baseline="central">Each GPO category gets a governed target surface (Ch 05).</text>

<!-- ====== ROW 4: DNS / DHCP ====== -->
<rect x="60" y="418" width="550" height="70" rx="6" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
<text x="85" y="445" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" dominant-baseline="central">DNS / DHCP remain AD-integrated</text>
<text x="85" y="467" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" dominant-baseline="central">AD cannot retire; resolution breaks in the cloud path.</text>

<rect x="670" y="418" width="550" height="70" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="695" y="445" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" dominant-baseline="central">DNS + DHCP + IPAM migrated together</text>
<text x="695" y="467" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" dominant-baseline="central">Azure Private Resolver + DM_010 IPAM own the namespace.</text>

<!-- ====== ROW 5: Provenance / audit ====== -->
<rect x="60" y="499" width="550" height="70" rx="6" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
<text x="85" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" dominant-baseline="central">Audit trail absent</text>
<text x="85" y="548" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" dominant-baseline="central">Ad-hoc changes; FedRAMP ConMon cannot produce provenance.</text>

<rect x="670" y="499" width="550" height="70" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="695" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" dominant-baseline="central">Every change carries provenance</text>
<text x="695" y="548" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" dominant-baseline="central">Plan-stage delivery (Ch 03); signed evidence packet per action.</text>

<!-- ====== ROW 6: Drift visibility ====== -->
<rect x="60" y="580" width="550" height="70" rx="6" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
<text x="85" y="607" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" dominant-baseline="central">Drift discovered at audit time</text>
<text x="85" y="629" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" dominant-baseline="central">No continuous detection; gaps surface during 3PAO review.</text>

<rect x="670" y="580" width="550" height="70" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
<text x="695" y="607" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" dominant-baseline="central">Drift detected continuously (UIAO_163)</text>
<text x="695" y="629" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#33414F" dominant-baseline="central">Nightly assessment; SLA-gated remediation per UIAO_167.</text>

<!-- Center separator line -->
<line x1="628" y1="88" x2="628" y2="660" stroke="#E3E8EF" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="652" y1="88" x2="652" y2="660" stroke="#E3E8EF" stroke-width="2" stroke-dasharray="6 4"/>

<!-- Footer note -->
<text x="640" y="695" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">Red = structural risk introduced by naive migration &#183; Teal = properties preserved by governed migration</text>
</svg>
