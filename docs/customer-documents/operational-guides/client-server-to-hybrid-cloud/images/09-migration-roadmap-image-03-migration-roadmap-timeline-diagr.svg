<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Migration Roadmap Timeline</text>
  <text x="60" y="84" font-size="16" fill="#6B7A8D">Seven phases, 52 weeks — Phase 0 Pre-flight through Phase 6 Steady State</text>

  <!-- 52-week bracket -->
  <line x1="60" y1="108" x2="1220" y2="108" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="60" y1="103" x2="60" y2="113" stroke="#1E8C8C" stroke-width="2"/>
  <line x1="1220" y1="103" x2="1220" y2="113" stroke="#1E8C8C" stroke-width="2"/>
  <text x="640" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">52-week modernization program</text>

  <!-- Timeline axis line -->
  <line x1="60" y1="370" x2="1220" y2="370" stroke="#E3E8EF" stroke-width="2"/>

  <!-- Week scale labels -->
  <text x="60"   y="398" font-size="11" fill="#6B7A8D" text-anchor="middle">Wk 1</text>
  <text x="183"  y="398" font-size="11" fill="#6B7A8D" text-anchor="middle">Wk 5</text>
  <text x="306"  y="398" font-size="11" fill="#6B7A8D" text-anchor="middle">Wk 9</text>
  <text x="552"  y="398" font-size="11" fill="#6B7A8D" text-anchor="middle">Wk 17</text>
  <text x="920"  y="398" font-size="11" fill="#6B7A8D" text-anchor="middle">Wk 37</text>
  <text x="1043" y="398" font-size="11" fill="#6B7A8D" text-anchor="middle">Wk 45</text>
  <text x="1166" y="398" font-size="11" fill="#6B7A8D" text-anchor="middle">Wk 49</text>
  <text x="1220" y="398" font-size="11" fill="#6B7A8D" text-anchor="middle">Wk 52+</text>

  <!-- Tick marks -->
  <line x1="60"   y1="365" x2="60"   y2="375" stroke="#6B7A8D" stroke-width="1"/>
  <line x1="183"  y1="365" x2="183"  y2="375" stroke="#6B7A8D" stroke-width="1"/>
  <line x1="306"  y1="365" x2="306"  y2="375" stroke="#6B7A8D" stroke-width="1"/>
  <line x1="552"  y1="365" x2="552"  y2="375" stroke="#6B7A8D" stroke-width="1"/>
  <line x1="920"  y1="365" x2="920"  y2="375" stroke="#6B7A8D" stroke-width="1"/>
  <line x1="1043" y1="365" x2="1043" y2="375" stroke="#6B7A8D" stroke-width="1"/>
  <line x1="1166" y1="365" x2="1166" y2="375" stroke="#6B7A8D" stroke-width="1"/>
  <line x1="1220" y1="365" x2="1220" y2="375" stroke="#6B7A8D" stroke-width="1"/>

  <!-- Phase bars: each week = (1220-60)/52 = 22.31 px -->
  <!-- Phase 0: wks 1-4, x=60, w=4*22.31=89 -->
  <rect x="60" y="290" width="123" height="64" rx="10" fill="#0D1B2E"/>
  <text x="121" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Phase 0</text>
  <text x="121" y="334" text-anchor="middle" font-size="12" fill="#D7F2EE">Pre-flight</text>
  <text x="121" y="350" text-anchor="middle" font-size="10" fill="#9FBCD4">Wks 1–4</text>

  <!-- Phase 1: wks 5-8, x=183, w=4*22.31=89 -->
  <rect x="183" y="290" width="123" height="64" rx="10" fill="#1E3A66"/>
  <text x="244" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Phase 1</text>
  <text x="244" y="334" text-anchor="middle" font-size="12" fill="#D7F2EE">Foundation</text>
  <text x="244" y="350" text-anchor="middle" font-size="10" fill="#9FBCD4">Wks 5–8</text>

  <!-- Phase 2: wks 9-16, x=306, w=8*22.31=178 -->
  <rect x="306" y="290" width="246" height="64" rx="10" fill="#1E8C8C"/>
  <text x="429" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Phase 2</text>
  <text x="429" y="334" text-anchor="middle" font-size="12" fill="#FFFFFF">Pilot Division</text>
  <text x="429" y="350" text-anchor="middle" font-size="10" fill="#D7F2EE">Wks 9–16</text>

  <!-- Phase 3: wks 17-36, x=552, w=20*22.31=446 -->
  <rect x="552" y="290" width="368" height="64" rx="10" fill="#2E75B6"/>
  <text x="736" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Phase 3</text>
  <text x="736" y="334" text-anchor="middle" font-size="12" fill="#FFFFFF">General Rollout</text>
  <text x="736" y="350" text-anchor="middle" font-size="10" fill="#D7F2EE">Wks 17–36</text>

  <!-- Phase 4: wks 37-44, x=920, w=8*22.31=178 -->
  <rect x="920" y="290" width="123" height="64" rx="10" fill="#C0392B"/>
  <text x="981" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Phase 4</text>
  <text x="981" y="334" text-anchor="middle" font-size="12" fill="#FFFFFF">Legacy Retirement</text>
  <text x="981" y="350" text-anchor="middle" font-size="10" fill="#FBEED2">Wks 37–44</text>

  <!-- Phase 5: wks 45-48, x=1043, w=4*22.31=89 -->
  <rect x="1043" y="290" width="123" height="64" rx="10" fill="#D4A017"/>
  <text x="1104" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Phase 5</text>
  <text x="1104" y="334" text-anchor="middle" font-size="12" fill="#0D1B2E">AD DS Retirement</text>
  <text x="1104" y="350" text-anchor="middle" font-size="10" fill="#33414F">Wks 45–48</text>

  <!-- Phase 6: wk 49+, x=1166, w=54 to right edge -->
  <rect x="1166" y="290" width="54" height="64" rx="10" fill="#0D1B2E"/>
  <text x="1193" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Phase 6</text>
  <text x="1193" y="334" text-anchor="middle" font-size="11" fill="#D7F2EE">Steady State</text>
  <text x="1193" y="350" text-anchor="middle" font-size="10" fill="#9FBCD4">Wk 49+</text>

  <!-- Gate diamonds at phase boundaries on the axis -->
  <!-- G0 at x=183 -->
  <polygon points="183,358 196,370 183,382 170,370" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="183" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#0D1B2E">G0</text>
  <text x="183" y="422" text-anchor="middle" font-size="9" fill="#6B7A8D">Ready to Plan</text>

  <!-- G1 at x=306 -->
  <polygon points="306,358 319,370 306,382 293,370" fill="#FFFFFF" stroke="#1E3A66" stroke-width="2"/>
  <text x="306" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E3A66">G1</text>
  <text x="306" y="422" text-anchor="middle" font-size="9" fill="#6B7A8D">Foundation Complete</text>

  <!-- G2 at x=552 -->
  <polygon points="552,358 565,370 552,382 539,370" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2"/>
  <text x="552" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E8C8C">G2</text>
  <text x="552" y="422" text-anchor="middle" font-size="9" fill="#6B7A8D">Pilot Clean</text>

  <!-- G3 at x=920 -->
  <polygon points="920,358 933,370 920,382 907,370" fill="#FFFFFF" stroke="#2E75B6" stroke-width="2"/>
  <text x="920" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E75B6">G3</text>
  <text x="920" y="422" text-anchor="middle" font-size="9" fill="#6B7A8D">Rollout Complete</text>

  <!-- G4 at x=1043 -->
  <polygon points="1043,358 1056,370 1043,382 1030,370" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="1043" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#C0392B">G4</text>
  <text x="1043" y="422" text-anchor="middle" font-size="9" fill="#6B7A8D">Legacy Quiet</text>

  <!-- G5 at x=1166 -->
  <polygon points="1166,358 1179,370 1166,382 1153,370" fill="#FFFFFF" stroke="#D4A017" stroke-width="2"/>
  <text x="1166" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#D4A017">G5</text>
  <text x="1166" y="422" text-anchor="middle" font-size="9" fill="#6B7A8D">AD Retired</text>

  <!-- Phase descriptions below -->
  <text x="121" y="452" text-anchor="middle" font-size="10" fill="#33414F">Platform server built</text>
  <text x="121" y="465" text-anchor="middle" font-size="10" fill="#33414F">AD assessment run</text>
  <text x="121" y="478" text-anchor="middle" font-size="10" fill="#33414F">OrgPath codebook</text>

  <text x="244" y="452" text-anchor="middle" font-size="10" fill="#33414F">Dynamic groups + AUs</text>
  <text x="244" y="465" text-anchor="middle" font-size="10" fill="#33414F">CA-100 baseline</text>
  <text x="244" y="478" text-anchor="middle" font-size="10" fill="#33414F">IPAM (DM_010) + FIDO2</text>

  <text x="429" y="452" text-anchor="middle" font-size="10" fill="#33414F">Pilot division OrgPath</text>
  <text x="429" y="465" text-anchor="middle" font-size="10" fill="#33414F">CA-200 + Intune</text>
  <text x="429" y="478" text-anchor="middle" font-size="10" fill="#33414F">Autopilot + Arc + CBA</text>

  <text x="736" y="452" text-anchor="middle" font-size="10" fill="#33414F">Scale to all divisions</text>
  <text x="736" y="465" text-anchor="middle" font-size="10" fill="#33414F">2–3 divisions parallel</text>
  <text x="736" y="478" text-anchor="middle" font-size="10" fill="#33414F">Weekly steering review</text>

  <text x="981" y="452" text-anchor="middle" font-size="10" fill="#33414F">Retire GPOs + OU groups</text>
  <text x="981" y="465" text-anchor="middle" font-size="10" fill="#33414F">Retire AD-integrated DNS</text>
  <text x="981" y="478" text-anchor="middle" font-size="10" fill="#33414F">Retire SPNs + DHCP</text>

  <text x="1104" y="452" text-anchor="middle" font-size="10" fill="#33414F">Demote DCs</text>
  <text x="1104" y="465" text-anchor="middle" font-size="10" fill="#33414F">Transfer FSMO roles</text>
  <text x="1104" y="478" text-anchor="middle" font-size="10" fill="#33414F">Forest retired</text>

  <text x="1193" y="452" text-anchor="middle" font-size="10" fill="#33414F">Nightly</text>
  <text x="1193" y="465" text-anchor="middle" font-size="10" fill="#33414F">assessments</text>
  <text x="1193" y="478" text-anchor="middle" font-size="10" fill="#33414F">ConMon</text>

  <!-- Five workstreams row -->
  <text x="60" y="520" font-size="12" font-weight="bold" fill="#0D1B2E">Five parallel workstreams (Phases 2–4):</text>
  <rect x="60" y="533" width="100" height="26" rx="6" fill="#0D1B2E"/>
  <text x="110" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Identity</text>
  <rect x="170" y="533" width="100" height="26" rx="6" fill="#1E3A66"/>
  <text x="220" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Policy</text>
  <rect x="280" y="533" width="100" height="26" rx="6" fill="#1E8C8C"/>
  <text x="330" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Services</text>
  <rect x="390" y="533" width="100" height="26" rx="6" fill="#2E75B6"/>
  <text x="440" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Compute</text>
  <rect x="500" y="533" width="100" height="26" rx="6" fill="#5A5A5A"/>
  <text x="550" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Access</text>

  <!-- Legend -->
  <polygon points="820,540 832,550 820,560 808,550" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="840" y="554" font-size="11" fill="#33414F">Gate / decision point (G0–G5)</text>
  <rect x="808" y="568" width="20" height="12" rx="3" fill="#C0392B"/>
  <text x="840" y="579" font-size="11" fill="#33414F">Legacy retirement</text>
  <rect x="808" y="585" width="20" height="12" rx="3" fill="#D4A017"/>
  <text x="840" y="596" font-size="11" fill="#33414F">AD DS retirement phase</text>

  <!-- Canon reference -->
  <text x="60" y="660" font-size="11" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#6B7A8D">UIAO Master Project Plan · UIAO_156 Migration Runbook · UIAO_167 SLA Escalation</text>
</svg>
