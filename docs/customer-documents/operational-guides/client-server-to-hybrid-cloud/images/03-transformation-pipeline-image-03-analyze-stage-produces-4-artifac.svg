<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="62" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Analyze Stage — 4 Output Artifacts</text>
  <text x="60" y="95" font-size="18" fill="#6B7A8D">Input: 11 ingestion streams · Output: 4 derivative artifacts stored in Gitea · plans/&lt;id&gt;/analysis/</text>

  <!-- ═══ ANALYZE source box ═══ -->
  <rect x="40" y="140" width="290" height="420" rx="10" fill="#0D1B2E"/>
  <text x="185" y="183" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">ANALYZE</text>
  <text x="185" y="210" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">Brain: Copilot (governance)</text>
  <line x1="60" y1="226" x2="310" y2="226" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="185" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#FBEED2">11 ingestion streams:</text>
  <text x="185" y="274" text-anchor="middle" font-size="12" fill="#D7F2EE">OUs · users · computers</text>
  <text x="185" y="294" text-anchor="middle" font-size="12" fill="#D7F2EE">groups · GPO links · trust edges</text>
  <text x="185" y="314" text-anchor="middle" font-size="12" fill="#D7F2EE">SPN map · Azure Arc tags · IPAM</text>
  <text x="185" y="334" text-anchor="middle" font-size="12" fill="#D7F2EE">Intune policies · Conditional Access</text>
  <line x1="60" y1="354" x2="310" y2="354" stroke="#1E3A66" stroke-width="1"/>
  <text x="185" y="380" text-anchor="middle" font-size="12" fill="#6B7A8D">Deterministic: same input</text>
  <text x="185" y="398" text-anchor="middle" font-size="12" fill="#6B7A8D">→ same 4 artifacts</text>
  <text x="185" y="424" text-anchor="middle" font-size="12" fill="#6B7A8D">Review gate depends on</text>
  <text x="185" y="442" text-anchor="middle" font-size="12" fill="#6B7A8D">this property</text>
  <text x="185" y="476" text-anchor="middle" font-size="12" fill="#1E8C8C" font-family="Consolas, 'DejaVu Sans Mono', monospace">plans/&lt;id&gt;/analysis/</text>
  <text x="185" y="496" text-anchor="middle" font-size="11" fill="#6B7A8D" font-family="Consolas, 'DejaVu Sans Mono', monospace">(Gitea · signed · versioned)</text>

  <!-- ═══ Outgoing arrow trunk ═══ -->
  <line x1="330" y1="350" x2="410" y2="350" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Vertical spine connecting to all 4 artifacts -->
  <line x1="450" y1="350" x2="450" y2="163" stroke="#1E8C8C" stroke-width="1.5"/>
  <line x1="450" y1="350" x2="450" y2="537" stroke="#1E8C8C" stroke-width="1.5"/>

  <!-- ─── Artifact 1: Current-state graph (top-left quadrant) ─── -->
  <line x1="450" y1="193" x2="485" y2="193" stroke="#1E8C8C" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <rect x="490" y="140" width="370" height="165" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <!-- header -->
  <rect x="490" y="140" width="370" height="44" rx="10" fill="#1E3A66"/>
  <rect x="490" y="166" width="370" height="18" fill="#1E3A66"/>
  <text x="675" y="164" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">1 — Current-State Graph</text>
  <!-- body -->
  <text x="675" y="204" text-anchor="middle" font-size="13" fill="#0D1B2E">Normalized representation of the forest</text>
  <text x="675" y="222" text-anchor="middle" font-size="13" fill="#0D1B2E">OUs · users · computers · groups</text>
  <text x="675" y="240" text-anchor="middle" font-size="13" fill="#0D1B2E">GPO links · trust edges · SPN map</text>
  <text x="675" y="258" text-anchor="middle" font-size="12" fill="#2E75B6" font-family="Consolas, 'DejaVu Sans Mono', monospace">Python networkx graph · single artifact</text>
  <text x="675" y="277" text-anchor="middle" font-size="11" fill="#5A5A5A">Input to every downstream decision</text>

  <!-- ─── Artifact 2: Target-state graph (bottom-left quadrant) ─── -->
  <line x1="450" y1="507" x2="485" y2="507" stroke="#1E8C8C" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <rect x="490" y="415" width="370" height="170" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="490" y="415" width="370" height="44" rx="10" fill="#1E3A66"/>
  <rect x="490" y="441" width="370" height="18" fill="#1E3A66"/>
  <text x="675" y="439" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">2 — Target-State Graph</text>
  <text x="675" y="479" text-anchor="middle" font-size="13" fill="#0D1B2E">Proposed Hybrid-Cloud equivalent</text>
  <text x="675" y="497" text-anchor="middle" font-size="13" fill="#0D1B2E">OrgPath hierarchy · dynamic group rules</text>
  <text x="675" y="515" text-anchor="middle" font-size="13" fill="#0D1B2E">Admin Unit map · CA targeting · Intune</text>
  <text x="675" y="533" text-anchor="middle" font-size="12" fill="#2E75B6" font-family="Consolas, 'DejaVu Sans Mono', monospace">Azure Arc tag set · IPAM record set</text>
  <text x="675" y="551" text-anchor="middle" font-size="11" fill="#5A5A5A">The finished target state</text>

  <!-- Horizontal spine right side -->
  <line x1="900" y1="193" x2="960" y2="193" stroke="#1E8C8C" stroke-width="1.5"/>
  <line x1="900" y1="507" x2="960" y2="507" stroke="#1E8C8C" stroke-width="1.5"/>
  <line x1="960" y1="193" x2="960" y2="507" stroke="#1E8C8C" stroke-width="1.5"/>

  <!-- ─── Artifact 3: Diff (top-right quadrant) ─── -->
  <line x1="960" y1="225" x2="992" y2="225" stroke="#1E8C8C" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <rect x="996" y="140" width="240" height="165" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="996" y="140" width="240" height="44" rx="10" fill="#1E3A66"/>
  <rect x="996" y="166" width="240" height="18" fill="#1E3A66"/>
  <text x="1116" y="164" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">3 — Diff</text>
  <text x="1116" y="204" text-anchor="middle" font-size="12" fill="#0D1B2E">Machine-readable delta:</text>
  <text x="1116" y="222" text-anchor="middle" font-size="12" fill="#0D1B2E">current → target</text>
  <text x="1116" y="240" text-anchor="middle" font-size="12" fill="#0D1B2E">additions · modifications</text>
  <text x="1116" y="258" text-anchor="middle" font-size="12" fill="#0D1B2E">retirements · no-change</text>
  <text x="1116" y="277" text-anchor="middle" font-size="11" fill="#2E75B6" font-family="Consolas, 'DejaVu Sans Mono', monospace">typed + source-linked</text>

  <!-- ─── Artifact 4: Risk register (bottom-right quadrant) ─── -->
  <line x1="960" y1="475" x2="992" y2="475" stroke="#1E8C8C" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <rect x="996" y="415" width="240" height="170" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="996" y="415" width="240" height="44" rx="10" fill="#1E3A66"/>
  <rect x="996" y="441" width="240" height="18" fill="#1E3A66"/>
  <text x="1116" y="439" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">4 — Risk Register</text>
  <text x="1116" y="479" text-anchor="middle" font-size="12" fill="#0D1B2E">Blast-radius model</text>
  <text x="1116" y="497" text-anchor="middle" font-size="12" fill="#0D1B2E">users affected</text>
  <text x="1116" y="515" text-anchor="middle" font-size="12" fill="#0D1B2E">downstream systems touched</text>
  <text x="1116" y="533" text-anchor="middle" font-size="12" fill="#0D1B2E">boundaries + compliance controls</text>
  <text x="1116" y="551" text-anchor="middle" font-size="11" fill="#D4A017" font-family="Consolas, 'DejaVu Sans Mono', monospace">Required for Steward review</text>

  <!-- Footer banner -->
  <rect x="40" y="630" width="1200" height="52" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="640" y="650" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#0D1B2E">All 4 artifacts committed to Gitea · signed · versioned · immutable · input to Stage 2 (Plan)</text>
  <text x="640" y="668" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A" font-family="Consolas, 'DejaVu Sans Mono', monospace">plans/&lt;plan-id&gt;/analysis/</text>
</svg>
