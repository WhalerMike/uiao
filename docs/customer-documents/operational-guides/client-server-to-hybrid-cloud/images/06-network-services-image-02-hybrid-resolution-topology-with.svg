<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A66"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Hybrid Resolution Topology with IPAM SSOT</text>
  <text x="60" y="92" font-size="17" fill="#6B7A8D">On-prem namespace · Azure DNS Private Resolver · Azure Private DNS · IPAM as authoritative registry</text>

  <!-- ═══════════════════════════════════════════════════════════════
       COLUMN A: On-prem namespace
       ═══════════════════════════════════════════════════════════════ -->
  <!-- Column header -->
  <rect x="48" y="120" width="330" height="46" rx="10" fill="#0D1B2E"/>
  <text x="213" y="145" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">On-Prem Namespace</text>

  <!-- AD-integrated DNS group -->
  <rect x="48" y="178" width="330" height="204" rx="10" fill="#D7F2EE" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="213" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">AD-Integrated DNS</text>
  <!-- Server 1 -->
  <rect x="66" y="210" width="294" height="64" rx="8" fill="#0D1B2E"/>
  <text x="213" y="235" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">DNS Server 1</text>
  <text x="213" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D7F2EE">DC / DNS (AD-integrated zone)</text>
  <!-- Server 2 -->
  <rect x="66" y="286" width="294" height="64" rx="8" fill="#0D1B2E"/>
  <text x="213" y="311" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">DNS Server 2</text>
  <text x="213" y="334" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D7F2EE">DC / DNS (AD-integrated zone)</text>

  <!-- On-prem clients -->
  <rect x="48" y="394" width="330" height="140" rx="10" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="213" y="416" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">On-Prem Clients</text>
  <text x="213" y="440" text-anchor="middle" font-size="13" fill="#33414F">UIAO-GIT01.corp</text>
  <text x="213" y="460" text-anchor="middle" font-size="13" fill="#33414F">fileserver.corp</text>
  <text x="213" y="480" text-anchor="middle" font-size="13" fill="#33414F">printer.corp</text>
  <text x="213" y="503" text-anchor="middle" font-size="12" fill="#6B7A8D">resolve via conditional forwarder →</text>

  <!-- ═══════════════════════════════════════════════════════════════
       COLUMN B: Azure DNS Private Resolver (Hybrid path)
       ═══════════════════════════════════════════════════════════════ -->
  <!-- Column header -->
  <rect x="476" y="120" width="328" height="46" rx="10" fill="#1E3A66"/>
  <text x="640" y="145" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Azure DNS Private Resolver</text>

  <!-- Resolver body -->
  <rect x="476" y="178" width="328" height="204" rx="10" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1.5"/>
  <!-- Inbound endpoint -->
  <rect x="494" y="188" width="292" height="70" rx="8" fill="#1E8C8C"/>
  <text x="640" y="216" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">Inbound Endpoint</text>
  <text x="640" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D7F2EE">receives on-prem queries</text>
  <!-- Bidirectional arrows -->
  <line x1="640" y1="258" x2="640" y2="278" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <line x1="635" y1="302" x2="635" y2="262" stroke="#1E3A66" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-navy)"/>
  <!-- Outbound endpoint -->
  <rect x="494" y="280" width="292" height="70" rx="8" fill="#1E8C8C"/>
  <text x="640" y="308" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">Outbound Endpoint</text>
  <text x="640" y="332" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D7F2EE">forwards VNet queries on-prem</text>

  <!-- Governance / audit overlay (amber) -->
  <rect x="476" y="394" width="328" height="140" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="640" y="416" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Conditional Forwarder Config</text>
  <text x="640" y="440" text-anchor="middle" font-size="13" fill="#33414F">On-prem DNS → inbound endpoint</text>
  <text x="640" y="460" text-anchor="middle" font-size="13" fill="#33414F">VNet DNS → outbound endpoint</text>
  <text x="640" y="484" text-anchor="middle" font-size="12" fill="#D4A017" font-weight="bold">Governance / Audit Overlay</text>
  <text x="640" y="503" text-anchor="middle" font-size="12" fill="#6B7A8D">DM_015 governs forwarder state</text>

  <!-- ═══════════════════════════════════════════════════════════════
       COLUMN C: Cloud namespace
       ═══════════════════════════════════════════════════════════════ -->
  <!-- Column header -->
  <rect x="902" y="120" width="330" height="46" rx="10" fill="#1E3A66"/>
  <text x="1067" y="145" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Cloud Namespace</text>

  <!-- Cloud namespace body -->
  <rect x="902" y="178" width="330" height="204" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <!-- Azure Private DNS Zone -->
  <rect x="920" y="188" width="294" height="80" rx="8" fill="#0D1B2E"/>
  <text x="1067" y="216" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">Azure Private DNS Zone</text>
  <text x="1067" y="240" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">uiao.internal (authoritative)</text>
  <!-- Private link zone -->
  <rect x="920" y="282" width="294" height="70" rx="8" fill="#1E3A66"/>
  <text x="1067" y="308" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">Private Link Zone</text>
  <text x="1067" y="332" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D7F2EE">privatelink.blob.core.windows.net</text>

  <!-- Linked VNets -->
  <rect x="902" y="394" width="330" height="140" rx="10" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1.5"/>
  <text x="1067" y="416" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Linked Virtual Networks</text>
  <text x="1067" y="440" text-anchor="middle" font-size="13" fill="#33414F">Platform VNet</text>
  <text x="1067" y="460" text-anchor="middle" font-size="13" fill="#33414F">Workload VNets</text>
  <text x="1067" y="480" text-anchor="middle" font-size="13" fill="#33414F">Arc-projected VM VNets</text>
  <text x="1067" y="503" text-anchor="middle" font-size="12" fill="#6B7A8D">resolve via outbound endpoint →</text>

  <!-- ═══════════════════════════════════════════════════════════════
       HORIZONTAL ARROWS
       ═══════════════════════════════════════════════════════════════ -->
  <!-- On-prem DNS → Resolver inbound -->
  <line x1="378" y1="242" x2="492" y2="224" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>
  <text x="435" y="226" text-anchor="middle" font-size="11" fill="#1E8C8C">conditional forwarder</text>
  <!-- Resolver outbound → On-prem (response) -->
  <line x1="492" y1="312" x2="378" y2="332" stroke="#1E3A66" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-navy)"/>
  <text x="435" y="336" text-anchor="middle" font-size="11" fill="#6B7A8D">response</text>

  <!-- Resolver → Cloud DNS zone -->
  <line x1="804" y1="228" x2="900" y2="228" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr-teal)"/>
  <text x="852" y="220" text-anchor="middle" font-size="11" fill="#1E8C8C">authorize / forward</text>
  <!-- Cloud DNS zone → Resolver (response) -->
  <line x1="900" y1="248" x2="804" y2="248" stroke="#1E3A66" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-navy)"/>
  <text x="852" y="266" text-anchor="middle" font-size="11" fill="#6B7A8D">response</text>

  <!-- ═══════════════════════════════════════════════════════════════
       IPAM SSOT bar (bottom)
       ═══════════════════════════════════════════════════════════════ -->
  <rect x="48" y="554" width="1184" height="82" rx="10" fill="#2E75B6" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="581" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">IPAM — Single Source of Truth (SSOT)</text>
  <text x="640" y="616" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#EAF1FB">IP address ranges · DHCP reservations · DNS records · provenance for every change · correlation IDs</text>

  <!-- Connectors to IPAM bar -->
  <line x1="213" y1="534" x2="213" y2="554" stroke="#2E75B6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-teal)"/>
  <line x1="640" y1="534" x2="640" y2="554" stroke="#2E75B6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-teal)"/>
  <line x1="1067" y1="534" x2="1067" y2="554" stroke="#2E75B6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-teal)"/>

  <!-- Legend bottom-right -->
  <rect x="1046" y="648" width="188" height="64" rx="6" fill="#F5F7FA" stroke="#E3E8EF" stroke-width="1"/>
  <rect x="1056" y="658" width="14" height="10" rx="2" fill="#1E8C8C"/>
  <text x="1076" y="667" font-size="12" fill="#33414F">resolution path</text>
  <rect x="1056" y="676" width="14" height="10" rx="2" fill="#1E3A66"/>
  <text x="1076" y="685" font-size="12" fill="#33414F">response / governance</text>
  <rect x="1056" y="694" width="14" height="10" rx="2" fill="#2E75B6"/>
  <text x="1076" y="703" font-size="12" fill="#33414F">IPAM authority</text>
</svg>
