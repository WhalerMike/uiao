<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="62" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Analyze, Plan, Deliver Pipeline</text>
  <text x="60" y="95" font-size="18" fill="#6B7A8D">Three sequential stages · Two-Brain authorization handoff · ADR-002</text>

  <!-- ═══ ANALYZE block ═══ -->
  <rect x="55" y="140" width="300" height="420" rx="10" fill="#0D1B2E"/>
  <!-- header banner -->
  <text x="205" y="192" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="bold" fill="#FFFFFF">ANALYZE</text>
  <line x1="75" y1="215" x2="335" y2="215" stroke="#1E8C8C" stroke-width="1.5"/>
  <!-- sub-tags -->
  <text x="205" y="252" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#D7F2EE">ingest</text>
  <text x="205" y="295" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#D7F2EE">classify</text>
  <text x="205" y="338" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#D7F2EE">baseline</text>
  <!-- separator -->
  <line x1="75" y1="368" x2="335" y2="368" stroke="#1E3A66" stroke-width="1"/>
  <!-- brain label -->
  <text x="205" y="396" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#6B7A8D">Brain: Copilot (governance)</text>
  <!-- artifact path -->
  <text x="205" y="468" text-anchor="middle" font-size="13" fill="#1E8C8C" font-family="Consolas, 'DejaVu Sans Mono', monospace">plans/&lt;id&gt;/analysis/</text>
  <!-- stage label -->
  <text x="205" y="530" text-anchor="middle" font-size="13" fill="#5A5A5A">Stage 1</text>

  <!-- Arrow ANALYZE → PLAN -->
  <line x1="355" y1="350" x2="440" y2="350" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- ═══ PLAN block ═══ -->
  <rect x="445" y="140" width="300" height="420" rx="10" fill="#0D1B2E"/>
  <text x="595" y="192" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="bold" fill="#FFFFFF">PLAN</text>
  <line x1="465" y1="215" x2="725" y2="215" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="595" y="252" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#D7F2EE">target shape</text>
  <text x="595" y="295" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#D7F2EE">gates</text>
  <text x="595" y="338" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#D7F2EE">rollback</text>
  <line x1="465" y1="368" x2="725" y2="368" stroke="#1E3A66" stroke-width="1"/>
  <text x="595" y="396" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#6B7A8D">Brain: Copilot (governance)</text>
  <text x="595" y="468" text-anchor="middle" font-size="13" fill="#1E8C8C" font-family="Consolas, 'DejaVu Sans Mono', monospace">plans/&lt;id&gt;/proposed/</text>
  <text x="595" y="530" text-anchor="middle" font-size="13" fill="#5A5A5A">Stage 2</text>

  <!-- ═══ Two-Brain authorization handoff vertical bar ═══ -->
  <rect x="770" y="118" width="44" height="464" rx="6" fill="#D4A017"/>
  <!-- Rotated label inside amber bar -->
  <text x="792" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#0D1B2E" transform="rotate(-90,792,350)">Two-Brain authorization handoff</text>

  <!-- Arrow: PLAN edge → handoff bar -->
  <line x1="745" y1="350" x2="768" y2="350" stroke="#D4A017" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <!-- Arrow: handoff bar → DELIVER -->
  <line x1="814" y1="350" x2="882" y2="350" stroke="#D4A017" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <!-- Label "authorized" above outgoing arrow -->
  <text x="848" y="336" text-anchor="middle" font-size="12" fill="#D4A017">authorized</text>

  <!-- Callout below bar -->
  <line x1="792" y1="582" x2="792" y2="613" stroke="#D4A017" stroke-width="1.5"/>
  <rect x="672" y="613" width="240" height="74" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="792" y="636" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Canon Steward review</text>
  <text x="792" y="654" text-anchor="middle" font-size="12" fill="#5A5A5A">Gitea PR · blast-radius summary</text>
  <text x="792" y="672" text-anchor="middle" font-size="11" fill="#5A5A5A">separation-of-duties sign-off</text>
  <text x="792" y="688" text-anchor="middle" font-size="11" fill="#5A5A5A" font-family="Consolas, 'DejaVu Sans Mono', monospace">proposed/ → authorized/</text>

  <!-- ═══ DELIVER block ═══ -->
  <rect x="887" y="140" width="338" height="420" rx="10" fill="#1E3A66"/>
  <text x="1056" y="192" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="bold" fill="#FFFFFF">DELIVER</text>
  <line x1="907" y1="215" x2="1205" y2="215" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="1056" y="252" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#D7F2EE">stage</text>
  <text x="1056" y="295" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#D7F2EE">validate</text>
  <text x="1056" y="338" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#D7F2EE">evidence</text>
  <line x1="907" y1="368" x2="1205" y2="368" stroke="#1E8C8C" stroke-width="1"/>
  <text x="1056" y="396" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#6B7A8D">Brain: Execution Substrate</text>
  <text x="1056" y="468" text-anchor="middle" font-size="13" fill="#1E8C8C" font-family="Consolas, 'DejaVu Sans Mono', monospace">plans/&lt;id&gt;/evidence.json</text>
  <text x="1056" y="530" text-anchor="middle" font-size="13" fill="#5A5A5A">Stage 3</text>

  <!-- Footer note -->
  <text x="640" y="660" text-anchor="middle" font-size="14" fill="#6B7A8D">No plan touches the target surface without authorization · Nothing skips a stage · ADR-002 Two-Brain Execution</text>
</svg>
