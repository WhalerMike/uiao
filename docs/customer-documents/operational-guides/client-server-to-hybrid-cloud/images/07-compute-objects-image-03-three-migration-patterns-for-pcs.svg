<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A66"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="60" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Three Migration Patterns for PCs</text>
  <text x="60" y="93" font-size="18" fill="#6B7A8D">Greenfield (Autopilot) / Reset-and-re-enroll / Hybrid-then-cloud — compared side by side</text>

  <!-- Column headers -->
  <!-- Pattern 1: Greenfield -->
  <rect x="60" y="118" width="360" height="50" rx="8" fill="#0D1B2E"/>
  <text x="240" y="143" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Pattern 1 — Greenfield</text>

  <!-- Pattern 2: Reset-and-re-enroll -->
  <rect x="460" y="118" width="360" height="50" rx="8" fill="#1E3A66"/>
  <text x="640" y="143" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Pattern 2 — Reset-and-re-enroll</text>

  <!-- Pattern 3: Hybrid-then-cloud -->
  <rect x="860" y="118" width="360" height="50" rx="8" fill="#1E3A66"/>
  <text x="1040" y="143" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Pattern 3 — Hybrid-then-cloud</text>

  <!-- =================== PATTERN 1 STEPS =================== -->
  <!-- Step 1a: New hardware OEM shipped -->
  <rect x="80" y="192" width="320" height="60" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="240" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">New hardware (OEM shipped)</text>
  <text x="240" y="234" text-anchor="middle" font-size="12" fill="#33414F">Autopilot pre-registered at factory</text>

  <!-- Arrow down -->
  <line x1="240" y1="252" x2="240" y2="275" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Step 1b: First boot -->
  <rect x="80" y="276" width="320" height="60" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="240" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">First boot — Autopilot OOBE</text>
  <text x="240" y="318" text-anchor="middle" font-size="12" fill="#33414F">User signs in with Entra UPN</text>

  <!-- Arrow down -->
  <line x1="240" y1="336" x2="240" y2="359" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Step 1c: Entra-Joined directly -->
  <rect x="80" y="360" width="320" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="240" y="382" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Entra-Joined + Intune enrolled</text>
  <text x="240" y="402" text-anchor="middle" font-size="12" fill="#33414F">Apps deploy; BitLocker escrowed</text>

  <!-- Arrow down -->
  <line x1="240" y1="420" x2="240" y2="443" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Step 1d: No AD created -->
  <rect x="80" y="444" width="320" height="50" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="240" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">No AD dependency created</text>
  <text x="240" y="480" text-anchor="middle" font-size="12" fill="#33414F">Zero legacy footprint</text>

  <!-- Risk / timing summary for P1 -->
  <rect x="80" y="520" width="320" height="80" rx="8" fill="#F7F9FC" stroke="#E3E8EF" stroke-width="1"/>
  <text x="240" y="542" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Summary</text>
  <text x="240" y="562" text-anchor="middle" font-size="12" fill="#33414F">Risk: Lowest</text>
  <text x="240" y="579" text-anchor="middle" font-size="12" fill="#33414F">Disruption: None (new hardware)</text>
  <text x="240" y="596" text-anchor="middle" font-size="12" fill="#33414F">Timeline: Immediate</text>

  <!-- =================== PATTERN 2 STEPS =================== -->
  <!-- Step 2a: Existing domain-joined device -->
  <rect x="480" y="192" width="320" height="60" rx="8" fill="#0D1B2E" stroke="#1E3A66" stroke-width="1"/>
  <text x="640" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Existing Domain-Joined device</text>
  <text x="640" y="234" text-anchor="middle" font-size="12" fill="#D7F2EE">Auth: AD Kerberos / GPO</text>

  <!-- Arrow down -->
  <line x1="640" y1="252" x2="640" y2="275" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Step 2b: Back up user state -->
  <rect x="480" y="276" width="320" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="640" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Back up user state</text>
  <text x="640" y="318" text-anchor="middle" font-size="12" fill="#33414F">OneDrive Known Folder Move / USMT</text>

  <!-- Arrow down -->
  <line x1="640" y1="336" x2="640" y2="359" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Step 2c: Wipe / Reset -->
  <rect x="480" y="360" width="320" height="60" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1"/>
  <text x="640" y="382" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">Wipe / Reset this PC</text>
  <text x="640" y="402" text-anchor="middle" font-size="12" fill="#33414F">Local customisation lost (unless synced)</text>

  <!-- Arrow down -->
  <line x1="640" y1="420" x2="640" y2="443" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Step 2d: Re-enroll via Autopilot -->
  <rect x="480" y="444" width="320" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Re-enroll via Autopilot</text>
  <text x="640" y="486" text-anchor="middle" font-size="12" fill="#33414F">Entra-Joined from first boot post-reset</text>

  <!-- Risk / timing summary for P2 -->
  <rect x="480" y="520" width="320" height="80" rx="8" fill="#F7F9FC" stroke="#E3E8EF" stroke-width="1"/>
  <text x="640" y="542" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Summary</text>
  <text x="640" y="562" text-anchor="middle" font-size="12" fill="#33414F">Risk: Medium (user data loss risk)</text>
  <text x="640" y="579" text-anchor="middle" font-size="12" fill="#33414F">Disruption: High — user downtime</text>
  <text x="640" y="596" text-anchor="middle" font-size="12" fill="#33414F">Best for: admin / developer PCs</text>

  <!-- =================== PATTERN 3 STEPS =================== -->
  <!-- Step 3a: Existing domain-joined device -->
  <rect x="880" y="192" width="320" height="60" rx="8" fill="#0D1B2E" stroke="#1E3A66" stroke-width="1"/>
  <text x="1040" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Existing Domain-Joined device</text>
  <text x="1040" y="234" text-anchor="middle" font-size="12" fill="#D7F2EE">Auth: AD Kerberos / GPO</text>

  <!-- Arrow down -->
  <line x1="1040" y1="252" x2="1040" y2="275" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Step 3b: Entra Connect device writeback -->
  <rect x="880" y="276" width="320" height="60" rx="8" fill="#1E3A66" stroke="#1E8C8C" stroke-width="1"/>
  <text x="1040" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Hybrid-Joined (transition)</text>
  <text x="1040" y="318" text-anchor="middle" font-size="12" fill="#D7F2EE">Entra Connect device writeback + GPO</text>

  <!-- Arrow down -->
  <line x1="1040" y1="336" x2="1040" y2="359" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Step 3c: Migrate workloads 3-12 months -->
  <rect x="880" y="360" width="320" height="60" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1"/>
  <text x="1040" y="382" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Migrate workloads (3–12 months)</text>
  <text x="1040" y="402" text-anchor="middle" font-size="12" fill="#33414F">GPO &#8594; Intune: compliance, config, apps, WU</text>

  <!-- Arrow down -->
  <line x1="1040" y1="420" x2="1040" y2="443" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Step 3d: Convert to Entra-Joined only -->
  <rect x="880" y="444" width="320" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1040" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">Convert to Entra-Joined only</text>
  <text x="1040" y="486" text-anchor="middle" font-size="12" fill="#33414F">Drop AD side; domain-unjoin</text>

  <!-- Risk / timing summary for P3 -->
  <rect x="880" y="520" width="320" height="80" rx="8" fill="#F7F9FC" stroke="#E3E8EF" stroke-width="1"/>
  <text x="1040" y="542" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Summary</text>
  <text x="1040" y="562" text-anchor="middle" font-size="12" fill="#33414F">Risk: Lowest (operational)</text>
  <text x="1040" y="579" text-anchor="middle" font-size="12" fill="#33414F">Disruption: Minimal</text>
  <text x="1040" y="596" text-anchor="middle" font-size="12" fill="#33414F">Timeline: 3–12 months per fleet</text>

  <!-- Drift engine warning for P3 -->
  <rect x="880" y="612" width="320" height="36" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1"/>
  <text x="1040" y="628" text-anchor="middle" font-size="12" font-weight="bold" fill="#D4A017">Drift engine monitors every step</text>
  <text x="1040" y="644" text-anchor="middle" font-size="11" fill="#33414F">Prevents permanent Hybrid-Joined state</text>

  <!-- Column dividers -->
  <line x1="456" y1="118" x2="456" y2="700" stroke="#E3E8EF" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="856" y1="118" x2="856" y2="700" stroke="#E3E8EF" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- TARGET badge shared -->
  <rect x="80" y="662" width="320" height="32" rx="6" fill="#1E8C8C"/>
  <text x="240" y="678" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">Target: Entra-Joined + Intune</text>
  <rect x="480" y="662" width="320" height="32" rx="6" fill="#1E8C8C"/>
  <text x="640" y="678" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">Target: Entra-Joined + Intune</text>
  <rect x="880" y="662" width="320" height="32" rx="6" fill="#1E8C8C"/>
  <text x="1040" y="678" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">Target: Entra-Joined + Intune</text>
</svg>
