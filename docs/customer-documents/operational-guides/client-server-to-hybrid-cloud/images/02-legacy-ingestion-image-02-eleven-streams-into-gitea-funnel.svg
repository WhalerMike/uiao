<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arr-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Eleven Streams into Gitea — Assessment Funnel</text>
  <text x="60" y="84" font-size="17" fill="#6B7A8D">All eleven AD-dependency categories converge into a single provenance-bound Gitea artifact store</text>
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ===== FUNNEL POLYGON ===== -->
  <!-- Wide mouth left at x=340, y range 118..682; narrows to throat at x=700, y range 330..490 -->
  <polygon points="340,118 700,330 700,490 340,682" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>

  <!-- Funnel throat label -->
  <text x="520" y="382" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#0D1B2E">Read-only assessment</text>
  <text x="520" y="404" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#0D1B2E">ingest</text>
  <text x="520" y="424" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1E3A66">provenance-bound</text>

  <!-- Throat connector to output -->
  <rect x="700" y="370" width="80" height="60" fill="#1E3A66"/>
  <line x1="780" y1="400" x2="858" y2="400" stroke="#0D1B2E" stroke-width="4" marker-end="url(#arr-out)"/>

  <!-- ===== GITEA OUTPUT BOX ===== -->
  <rect x="860" y="310" width="350" height="180" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1035" y="365" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#0D1B2E">Gitea artifact set</text>
  <text x="1035" y="395" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#2E75B6">(hash-stamped, signed)</text>
  <line x1="880" y1="415" x2="1190" y2="415" stroke="#E3E8EF" stroke-width="1"/>
  <text x="1035" y="435" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5A5A5A">assessments/&lt;run-id&gt;/ · YYYY-MM-DD-HHmm</text>
  <text x="1035" y="455" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5A5A5A">feat(assess): signed commit · one per run</text>
  <text x="1035" y="474" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5A5A5A">Tier A · Tier B · custom profile</text>

  <!-- ===== 11 INPUT STREAM BOXES left of funnel mouth ===== -->
  <!-- 11 rows, pitch=52, y centers: 128,180,232,284,336,388,440,492,544,596,648 -->
  <!-- Boxes right edge at x=320, width=240 -->

  <!-- 1: AD -->
  <rect x="60" y="106" width="260" height="44" rx="10" fill="#0D1B2E"/>
  <text x="190" y="128" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">AD (Forest / Domain)</text>
  <line x1="320" y1="128" x2="338" y2="140" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2: DNS -->
  <rect x="60" y="158" width="260" height="44" rx="10" fill="#0D1B2E"/>
  <text x="190" y="180" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">DNS Zones + Records</text>
  <line x1="320" y1="180" x2="338" y2="192" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3: DHCP -->
  <rect x="60" y="210" width="260" height="44" rx="10" fill="#0D1B2E"/>
  <text x="190" y="232" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">DHCP Scopes</text>
  <line x1="320" y1="232" x2="338" y2="246" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4: GPO -->
  <rect x="60" y="262" width="260" height="44" rx="10" fill="#0D1B2E"/>
  <text x="190" y="284" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">GPO (Group Policy)</text>
  <line x1="320" y1="284" x2="338" y2="301" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 5: PKI -->
  <rect x="60" y="314" width="260" height="44" rx="10" fill="#0D1B2E"/>
  <text x="190" y="336" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">PKI / ADCS</text>
  <line x1="320" y1="336" x2="338" y2="348" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 6: RADIUS -->
  <rect x="60" y="366" width="260" height="44" rx="10" fill="#1E3A66"/>
  <text x="190" y="388" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">RADIUS</text>
  <line x1="320" y1="388" x2="338" y2="390" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 7: IPAM -->
  <rect x="60" y="418" width="260" height="44" rx="10" fill="#1E3A66"/>
  <text x="190" y="440" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">IPAM</text>
  <line x1="320" y1="440" x2="338" y2="430" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 8: NTP -->
  <rect x="60" y="470" width="260" height="44" rx="10" fill="#1E3A66"/>
  <text x="190" y="492" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">NTP</text>
  <line x1="320" y1="492" x2="338" y2="472" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 9: File Shares -->
  <rect x="60" y="522" width="260" height="44" rx="10" fill="#1E3A66"/>
  <text x="190" y="544" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">File Shares</text>
  <line x1="320" y1="544" x2="338" y2="524" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 10: Scheduled Tasks -->
  <rect x="60" y="574" width="260" height="44" rx="10" fill="#1E3A66"/>
  <text x="190" y="596" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">Scheduled Tasks</text>
  <line x1="320" y1="596" x2="338" y2="568" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 11: Service Accounts -->
  <rect x="60" y="626" width="260" height="44" rx="10" fill="#1E3A66"/>
  <text x="190" y="648" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">Service Accounts</text>
  <line x1="320" y1="648" x2="338" y2="618" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stream count badge -->
  <circle cx="190" cy="690" r="18" fill="#1E3A66"/>
  <text x="190" y="690" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">11</text>
  <text x="214" y="690" dominant-baseline="central" font-size="13" fill="#6B7A8D">streams · one artifact set per run</text>

  <!-- Legend -->
  <rect x="860" y="550" width="350" height="128" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
  <text x="878" y="572" font-size="14" font-weight="bold" fill="#0D1B2E">Legend</text>
  <rect x="878" y="584" width="18" height="14" rx="3" fill="#0D1B2E"/>
  <text x="902" y="596" font-size="13" fill="#33414F">Tier A + B core streams</text>
  <rect x="878" y="606" width="18" height="14" rx="3" fill="#1E3A66"/>
  <text x="902" y="618" font-size="13" fill="#33414F">Tier B-only extended streams</text>
  <polygon points="878,634 886,628 886,648 878,642" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1"/>
  <text x="902" y="638" font-size="13" fill="#33414F">Funnel — provenance-bound processing</text>
  <rect x="878" y="652" width="18" height="14" rx="3" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="902" y="664" font-size="13" fill="#33414F">Gitea cloud artifact output</text>
</svg>
