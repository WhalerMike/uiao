<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Migration Roadmap Timeline</text>
  <text x="640" y="78" text-anchor="middle" font-size="15" fill="#6B7A8D">52-week program · seven phases · five parallel workstreams · six named gates</text>

  <!-- Thin rule under subtitle -->
  <line x1="100" y1="92" x2="1180" y2="92" stroke="#E3E8EF" stroke-width="1"/>

  <!-- ============================================================
       Clean horizontal layout:
       Center spine y=340 (mid of chart area 120..560)
       Phase nodes above/below the spine alternating
       Week marks on spine
       Gate diamonds exactly at phase transitions
  ============================================================ -->

  <!-- Main spine arrow -->
  <line x1="100" y1="340" x2="1195" y2="340" stroke="#E3E8EF" stroke-width="3"/>
  <line x1="1170" y1="340" x2="1210" y2="340" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Week markers on spine every 4 weeks -->
  <!-- Each week: (1170-100)/52 = 20.58 px, start x=100 -->
  <line x1="100"  y1="333" x2="100"  y2="347" stroke="#6B7A8D" stroke-width="1.5"/>
  <line x1="182"  y1="333" x2="182"  y2="347" stroke="#6B7A8D" stroke-width="1"/>
  <line x1="265"  y1="333" x2="265"  y2="347" stroke="#6B7A8D" stroke-width="1"/>
  <line x1="430"  y1="333" x2="430"  y2="347" stroke="#6B7A8D" stroke-width="1"/>
  <line x1="842"  y1="333" x2="842"  y2="347" stroke="#6B7A8D" stroke-width="1"/>
  <line x1="1007" y1="333" x2="1007" y2="347" stroke="#6B7A8D" stroke-width="1"/>
  <line x1="1090" y1="333" x2="1090" y2="347" stroke="#6B7A8D" stroke-width="1"/>
  <line x1="1170" y1="333" x2="1170" y2="347" stroke="#6B7A8D" stroke-width="1.5"/>

  <!-- Week labels on spine -->
  <text x="100"  y="360" text-anchor="middle" font-size="11" fill="#6B7A8D">Wk 1</text>
  <text x="182"  y="360" text-anchor="middle" font-size="11" fill="#6B7A8D">5</text>
  <text x="265"  y="360" text-anchor="middle" font-size="11" fill="#6B7A8D">9</text>
  <text x="430"  y="360" text-anchor="middle" font-size="11" fill="#6B7A8D">17</text>
  <text x="842"  y="360" text-anchor="middle" font-size="11" fill="#6B7A8D">37</text>
  <text x="1007" y="360" text-anchor="middle" font-size="11" fill="#6B7A8D">45</text>
  <text x="1090" y="360" text-anchor="middle" font-size="11" fill="#6B7A8D">49</text>
  <text x="1170" y="360" text-anchor="middle" font-size="11" fill="#6B7A8D">52+</text>

  <!-- ====== PHASE NODES — alternating above/below spine ====== -->
  <!-- Centers of phases (midpoint x):
       P0: (100+182)/2 = 141
       P1: (182+265)/2 = 223
       P2: (265+430)/2 = 347
       P3: (430+842)/2 = 636
       P4: (842+1007)/2 = 924
       P5: (1007+1090)/2 = 1048
       P6: (1090+1170)/2 = 1130
  -->

  <!-- P0 ABOVE spine: cx=141, top y=130, h=160, w=150 -->
  <line x1="141" y1="290" x2="141" y2="340" stroke="#0D1B2E" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="66" y="130" width="150" height="160" rx="12" fill="#0D1B2E"/>
  <text x="141" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Phase 0</text>
  <text x="141" y="174" text-anchor="middle" font-size="13" fill="#D7F2EE">Pre-flight</text>
  <text x="141" y="192" text-anchor="middle" font-size="10" fill="#9FBCD4">Weeks 1–4</text>
  <line x1="86" y1="202" x2="196" y2="202" stroke="#1E3A66" stroke-width="1"/>
  <text x="141" y="216" text-anchor="middle" font-size="9" fill="#EAF1FB">Platform server built</text>
  <text x="141" y="230" text-anchor="middle" font-size="9" fill="#EAF1FB">AD assessment run</text>
  <text x="141" y="244" text-anchor="middle" font-size="9" fill="#EAF1FB">OrgPath codebook</text>
  <text x="141" y="258" text-anchor="middle" font-size="9" fill="#EAF1FB">Gitea repo stood up</text>
  <text x="141" y="272" text-anchor="middle" font-size="9" fill="#EAF1FB">Entra + Intune access</text>

  <!-- P1 BELOW spine: cx=223 -->
  <line x1="223" y1="340" x2="223" y2="390" stroke="#1E3A66" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="148" y="390" width="150" height="160" rx="12" fill="#1E3A66"/>
  <text x="223" y="416" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Phase 1</text>
  <text x="223" y="434" text-anchor="middle" font-size="13" fill="#D7F2EE">Foundation</text>
  <text x="223" y="452" text-anchor="middle" font-size="10" fill="#9FBCD4">Weeks 5–8</text>
  <line x1="168" y1="462" x2="278" y2="462" stroke="#0D1B2E" stroke-width="1"/>
  <text x="223" y="476" text-anchor="middle" font-size="9" fill="#EAF1FB">Dynamic groups + AUs</text>
  <text x="223" y="490" text-anchor="middle" font-size="9" fill="#EAF1FB">CA-100 baseline</text>
  <text x="223" y="504" text-anchor="middle" font-size="9" fill="#EAF1FB">IPAM (DM_010)</text>
  <text x="223" y="518" text-anchor="middle" font-size="9" fill="#EAF1FB">FIDO2 Tier-0</text>
  <text x="223" y="532" text-anchor="middle" font-size="9" fill="#9FBCD4">Platform-SSO</text>

  <!-- P2 ABOVE spine: cx=347 -->
  <line x1="347" y1="290" x2="347" y2="340" stroke="#1E8C8C" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="272" y="130" width="150" height="160" rx="12" fill="#1E8C8C"/>
  <text x="347" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Phase 2</text>
  <text x="347" y="174" text-anchor="middle" font-size="13" fill="#FFFFFF">Pilot Division</text>
  <text x="347" y="192" text-anchor="middle" font-size="10" fill="#D7F2EE">Weeks 9–16</text>
  <line x1="292" y1="202" x2="402" y2="202" stroke="#0D1B2E" stroke-width="1" fill-opacity="0.4"/>
  <text x="347" y="216" text-anchor="middle" font-size="9" fill="#FFFFFF">Pilot OrgPath live</text>
  <text x="347" y="230" text-anchor="middle" font-size="9" fill="#FFFFFF">CA-200 + Intune</text>
  <text x="347" y="244" text-anchor="middle" font-size="9" fill="#FFFFFF">DNS/DHCP migrated</text>
  <text x="347" y="258" text-anchor="middle" font-size="9" fill="#FFFFFF">Autopilot + Arc</text>
  <text x="347" y="272" text-anchor="middle" font-size="9" fill="#D7F2EE">CBA + SASE ZTNA</text>

  <!-- P3 BELOW spine: cx=636, wider node -->
  <line x1="636" y1="340" x2="636" y2="390" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="480" y="390" width="312" height="160" rx="12" fill="#2E75B6"/>
  <text x="636" y="416" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Phase 3</text>
  <text x="636" y="434" text-anchor="middle" font-size="13" fill="#FFFFFF">General Rollout</text>
  <text x="636" y="452" text-anchor="middle" font-size="10" fill="#D7F2EE">Weeks 17–36  (longest phase)</text>
  <line x1="500" y1="462" x2="772" y2="462" stroke="#1E3A66" stroke-width="1"/>
  <text x="636" y="476" text-anchor="middle" font-size="9" fill="#EAF1FB">Scale to all remaining divisions</text>
  <text x="636" y="490" text-anchor="middle" font-size="9" fill="#EAF1FB">2–3 divisions parallel · weekly steering review</text>
  <text x="636" y="504" text-anchor="middle" font-size="9" fill="#EAF1FB">Every PC Entra Joined · every server Arc-connected</text>
  <text x="636" y="518" text-anchor="middle" font-size="9" fill="#EAF1FB">Every HR employee has valid OrgPath</text>
  <text x="636" y="532" text-anchor="middle" font-size="9" fill="#D7F2EE">Chapters 04–08 applied per division</text>

  <!-- P4 ABOVE spine: cx=924 -->
  <line x1="924" y1="290" x2="924" y2="340" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="849" y="130" width="150" height="160" rx="12" fill="#C0392B"/>
  <text x="924" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Phase 4</text>
  <text x="924" y="174" text-anchor="middle" font-size="13" fill="#FFFFFF">Legacy Retire</text>
  <text x="924" y="192" text-anchor="middle" font-size="10" fill="#FBEED2">Weeks 37–44</text>
  <line x1="869" y1="202" x2="979" y2="202" stroke="#7D1E14" stroke-width="1"/>
  <text x="924" y="216" text-anchor="middle" font-size="9" fill="#FFFFFF">Retire GPOs</text>
  <text x="924" y="230" text-anchor="middle" font-size="9" fill="#FFFFFF">Retire OU groups</text>
  <text x="924" y="244" text-anchor="middle" font-size="9" fill="#FFFFFF">Retire AD-integrated DNS</text>
  <text x="924" y="258" text-anchor="middle" font-size="9" fill="#FFFFFF">Retire AD DHCP</text>
  <text x="924" y="272" text-anchor="middle" font-size="9" fill="#FBEED2">Retire SPNs</text>

  <!-- P5 BELOW spine: cx=1048 -->
  <line x1="1048" y1="340" x2="1048" y2="390" stroke="#D4A017" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="978" y="390" width="140" height="160" rx="12" fill="#D4A017"/>
  <text x="1048" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Phase 5</text>
  <text x="1048" y="434" text-anchor="middle" font-size="12" fill="#0D1B2E">AD DS Retire</text>
  <text x="1048" y="452" text-anchor="middle" font-size="10" fill="#33414F">Weeks 45–48</text>
  <line x1="998" y1="462" x2="1098" y2="462" stroke="#9B7210" stroke-width="1"/>
  <text x="1048" y="476" text-anchor="middle" font-size="9" fill="#33414F">Freeze AD changes</text>
  <text x="1048" y="490" text-anchor="middle" font-size="9" fill="#33414F">Final assessment</text>
  <text x="1048" y="504" text-anchor="middle" font-size="9" fill="#33414F">Demote DCs</text>
  <text x="1048" y="518" text-anchor="middle" font-size="9" fill="#33414F">Transfer FSMO</text>
  <text x="1048" y="532" text-anchor="middle" font-size="9" fill="#33414F">Forest retired</text>

  <!-- P6 ABOVE spine: cx=1130 -->
  <line x1="1130" y1="260" x2="1130" y2="340" stroke="#1E8C8C" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="1068" y="130" width="130" height="130" rx="12" fill="#1E8C8C"/>
  <text x="1133" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Phase 6</text>
  <text x="1133" y="174" text-anchor="middle" font-size="12" fill="#FFFFFF">Steady State</text>
  <text x="1133" y="192" text-anchor="middle" font-size="10" fill="#D7F2EE">Week 49+</text>
  <line x1="1086" y1="202" x2="1176" y2="202" stroke="#0D5A5A" stroke-width="1"/>
  <text x="1133" y="216" text-anchor="middle" font-size="9" fill="#FFFFFF">Nightly assessments</text>
  <text x="1133" y="230" text-anchor="middle" font-size="9" fill="#FFFFFF">FedRAMP ConMon</text>
  <text x="1133" y="244" text-anchor="middle" font-size="9" fill="#D7F2EE">Canon via PR</text>

  <!-- ====== GATE DIAMONDS on spine ====== -->
  <!-- G0 at x=182 (boundary P0/P1) -->
  <polygon points="182,327 196,340 182,353 168,340" fill="#D4A017" stroke="#0D1B2E" stroke-width="2"/>
  <text x="182" y="370" text-anchor="middle" font-size="10" font-weight="bold" fill="#0D1B2E">G0</text>
  <text x="182" y="382" text-anchor="middle" font-size="8" fill="#5A5A5A">Ready to Plan</text>

  <!-- G1 at x=265 (boundary P1/P2) -->
  <polygon points="265,327 279,340 265,353 251,340" fill="#D4A017" stroke="#0D1B2E" stroke-width="2"/>
  <text x="265" y="370" text-anchor="middle" font-size="10" font-weight="bold" fill="#0D1B2E">G1</text>
  <text x="265" y="382" text-anchor="middle" font-size="8" fill="#5A5A5A">Foundation Complete</text>

  <!-- G2 at x=430 (boundary P2/P3) -->
  <polygon points="430,327 444,340 430,353 416,340" fill="#D4A017" stroke="#0D1B2E" stroke-width="2"/>
  <text x="430" y="370" text-anchor="middle" font-size="10" font-weight="bold" fill="#0D1B2E">G2</text>
  <text x="430" y="382" text-anchor="middle" font-size="8" fill="#5A5A5A">Pilot Clean</text>

  <!-- G3 at x=842 (boundary P3/P4) -->
  <polygon points="842,327 856,340 842,353 828,340" fill="#D4A017" stroke="#0D1B2E" stroke-width="2"/>
  <text x="842" y="370" text-anchor="middle" font-size="10" font-weight="bold" fill="#0D1B2E">G3</text>
  <text x="842" y="382" text-anchor="middle" font-size="8" fill="#5A5A5A">Rollout Complete</text>

  <!-- G4 at x=1007 (boundary P4/P5) -->
  <polygon points="1007,327 1021,340 1007,353 993,340" fill="#D4A017" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1007" y="370" text-anchor="middle" font-size="10" font-weight="bold" fill="#0D1B2E">G4</text>
  <text x="1007" y="382" text-anchor="middle" font-size="8" fill="#5A5A5A">Legacy Quiet</text>

  <!-- G5 at x=1090 (boundary P5/P6) -->
  <polygon points="1090,327 1104,340 1090,353 1076,340" fill="#D4A017" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1090" y="370" text-anchor="middle" font-size="10" font-weight="bold" fill="#0D1B2E">G5</text>
  <text x="1090" y="382" text-anchor="middle" font-size="8" fill="#5A5A5A">AD Retired</text>

  <!-- ====== FIVE WORKSTREAMS callout band ====== -->
  <rect x="100" y="610" width="1080" height="46" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="640" y="626" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D1B2E">Five parallel workstreams (Phases 2–4):</text>
  <rect x="120" y="633" width="90" height="17" rx="5" fill="#0D1B2E"/>
  <text x="165" y="645" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Identity</text>
  <rect x="220" y="633" width="90" height="17" rx="5" fill="#1E3A66"/>
  <text x="265" y="645" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Policy</text>
  <rect x="320" y="633" width="90" height="17" rx="5" fill="#1E8C8C"/>
  <text x="365" y="645" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Services</text>
  <rect x="420" y="633" width="90" height="17" rx="5" fill="#2E75B6"/>
  <text x="465" y="645" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Compute</text>
  <rect x="520" y="633" width="90" height="17" rx="5" fill="#5A5A5A"/>
  <text x="565" y="645" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Access</text>

  <!-- Source note -->
  <text x="640" y="690" text-anchor="middle" font-size="11" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#6B7A8D">UIAO Master Project Plan · UIAO_156 Migration Runbook · UIAO_167 SLA Escalation · UIAO_172 Canonical Contributor Workflow</text>
</svg>
