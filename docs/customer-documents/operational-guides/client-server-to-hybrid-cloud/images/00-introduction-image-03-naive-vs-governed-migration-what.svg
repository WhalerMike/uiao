<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Page title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="32" fill="#0D1B2E">Naive vs. Governed Migration</text>
  <text x="60" y="82" font-size="15" fill="#6B7A8D">What breaks vs. what is preserved — the invisible 90 percent of an AD retirement</text>

  <!-- ───────────────────────────────────────────────
       LEFT COLUMN: Naive migration — what breaks
       Background panel
  ─────────────────────────────────────────────── -->
  <rect x="60" y="104" width="556" height="580" rx="12" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>

  <!-- Column header -->
  <rect x="60" y="104" width="556" height="60" rx="12" fill="#C0392B"/>
  <rect x="60" y="144" width="556" height="20" fill="#C0392B"/>
  <text x="338" y="138" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">Naive Migration — What Breaks</text>

  <!-- Sub-label -->
  <text x="338" y="182" text-anchor="middle" font-size="13" fill="#C0392B">Scoped to users, groups, and mailboxes only — the visible 10 percent</text>

  <!-- Row items: left column -->
  <!-- Item 1 -->
  <rect x="84" y="200" width="508" height="54" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="104" y="221" font-size="14" font-weight="bold" fill="#C0392B">Service Account SPNs unresolved</text>
  <text x="104" y="241" font-size="12" fill="#5A5A5A">Application authentication fails silently — no log line, months of outages</text>

  <!-- Item 2 -->
  <rect x="84" y="262" width="508" height="54" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="104" y="283" font-size="14" font-weight="bold" fill="#C0392B">Group Policy abandoned in place</text>
  <text x="104" y="303" font-size="12" fill="#5A5A5A">Device configuration drifts — security baselines, patch policy inconsistent</text>

  <!-- Item 3 -->
  <rect x="84" y="324" width="508" height="54" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="104" y="345" font-size="14" font-weight="bold" fill="#C0392B">PKI / certificate enrollment broken</text>
  <text x="104" y="365" font-size="12" fill="#5A5A5A">Certificates silently expire — authentication and mTLS break months later</text>

  <!-- Item 4 -->
  <rect x="84" y="386" width="508" height="54" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="104" y="407" font-size="14" font-weight="bold" fill="#C0392B">RADIUS / NPS loses AD group lookup</text>
  <text x="104" y="427" font-size="12" fill="#5A5A5A">802.1X and VPN authentication fails — unauthorized access or network outage</text>

  <!-- Item 5 -->
  <rect x="84" y="448" width="508" height="54" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="104" y="469" font-size="14" font-weight="bold" fill="#C0392B">LDAP-bound applications severed</text>
  <text x="104" y="489" font-size="12" fill="#5A5A5A">Legacy app bind accounts decommissioned — login failures, broken integrations</text>

  <!-- Item 6 -->
  <rect x="84" y="510" width="508" height="54" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="104" y="531" font-size="14" font-weight="bold" fill="#C0392B">OU tree / delegation lost entirely</text>
  <text x="104" y="551" font-size="12" fill="#5A5A5A">Entra ID flat directory — no delegation graph, no policy inheritance, no audit scope</text>

  <!-- Item 7 -->
  <rect x="84" y="572" width="508" height="54" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="104" y="593" font-size="14" font-weight="bold" fill="#C0392B">Forest trust relationships severed</text>
  <text x="104" y="613" font-size="12" fill="#5A5A5A">Cross-domain authentication breaks — inter-org access fails without warning</text>

  <!-- Bottom callout: left -->
  <rect x="84" y="636" width="508" height="36" rx="8" fill="#C0392B"/>
  <text x="338" y="654" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">Result: six-month tail of untraceable outages + compliance audit failure</text>

  <!-- ───────────────────────────────────────────────
       RIGHT COLUMN: Governed migration — what's preserved
  ─────────────────────────────────────────────── -->
  <rect x="664" y="104" width="556" height="580" rx="12" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>

  <!-- Column header -->
  <rect x="664" y="104" width="556" height="60" rx="12" fill="#1E8C8C"/>
  <rect x="664" y="144" width="556" height="20" fill="#1E8C8C"/>
  <text x="942" y="138" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">Governed Migration — What is Preserved</text>

  <!-- Sub-label -->
  <text x="942" y="182" text-anchor="middle" font-size="13" fill="#1E8C8C">All eleven categories enumerated, mapped, and delivered via UIAO</text>

  <!-- Row items: right column -->
  <!-- Item 1 -->
  <rect x="688" y="200" width="508" height="54" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="708" y="221" font-size="14" font-weight="bold" fill="#1E8C8C">Service Account SPNs migrated</text>
  <text x="708" y="241" font-size="12" fill="#5A5A5A">SPNs re-registered in Entra ID before cutover — no authentication gap</text>

  <!-- Item 2 -->
  <rect x="688" y="262" width="508" height="54" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="708" y="283" font-size="14" font-weight="bold" fill="#1E8C8C">GPO inventory transformed to Intune</text>
  <text x="708" y="303" font-size="12" fill="#5A5A5A">Every GPO mapped to Intune compliance / Conditional Access equivalent</text>

  <!-- Item 3 -->
  <rect x="688" y="324" width="508" height="54" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="708" y="345" font-size="14" font-weight="bold" fill="#1E8C8C">PKI re-anchored to Entra CBA</text>
  <text x="708" y="365" font-size="12" fill="#5A5A5A">Certificate enrollment policy re-pointed — auto-renewal continues unbroken</text>

  <!-- Item 4 -->
  <rect x="688" y="386" width="508" height="54" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="708" y="407" font-size="14" font-weight="bold" fill="#1E8C8C">RADIUS / NPS re-keyed to Entra groups</text>
  <text x="708" y="427" font-size="12" fill="#5A5A5A">802.1X and VPN policies updated before AD DS decommission</text>

  <!-- Item 5 -->
  <rect x="688" y="448" width="508" height="54" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="708" y="469" font-size="14" font-weight="bold" fill="#1E8C8C">LDAP binds migrated or modernized</text>
  <text x="708" y="489" font-size="12" fill="#5A5A5A">Legacy apps re-pointed to LDAPS / Graph API equivalents before cutover</text>

  <!-- Item 6 -->
  <rect x="688" y="510" width="508" height="54" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="708" y="531" font-size="14" font-weight="bold" fill="#1E8C8C">OrgTree canon replaces OU tree</text>
  <text x="708" y="551" font-size="12" fill="#5A5A5A">OrgPath + Admin Units + dynamic groups encode delegation, policy, and audit scope</text>

  <!-- Item 7 -->
  <rect x="688" y="572" width="508" height="54" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="708" y="593" font-size="14" font-weight="bold" fill="#1E8C8C">Trust topology documented and cut</text>
  <text x="708" y="613" font-size="12" fill="#5A5A5A">Cross-forest auth re-established via Entra B2B or Conditional Access before removal</text>

  <!-- Bottom callout: right -->
  <rect x="688" y="636" width="508" height="36" rx="8" fill="#1E8C8C"/>
  <text x="942" y="654" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">Result: governed continuity, evidentiary pipeline, zero silent failures</text>

  <!-- Centre divider label -->
  <rect x="600" y="336" width="80" height="48" rx="24" fill="#0D1B2E"/>
  <text x="640" y="360" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">vs.</text>

</svg>
