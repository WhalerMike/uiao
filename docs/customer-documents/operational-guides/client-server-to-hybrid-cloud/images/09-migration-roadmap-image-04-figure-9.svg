<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<!-- 09-migration-roadmap-image-04 | Provenance envelope: who/when/what/profile/hash/commit chain -->
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

<!-- Title -->
<text x="640" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Provenance Envelope: who / when / what / profile / hash / commit chain</text>
<line x1="60" y1="68" x2="1220" y2="68" stroke="#E3E8EF" stroke-width="1.5"/>

<!-- ============================================================
     OUTER ENVELOPE — the document/folder wrapper
     ============================================================ -->
<rect x="80" y="88" width="1120" height="568" rx="16" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2.5"/>

<!-- Envelope "flap" accent bar at top -->
<rect x="80" y="88" width="1120" height="10" rx="8" fill="#0D1B2E"/>

<!-- Envelope label -->
<text x="640" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">provenance.yaml — signed envelope committed to Gitea canon</text>
<line x1="100" y1="132" x2="1180" y2="132" stroke="#0D1B2E" stroke-width="1" stroke-dasharray="4 3"/>

<!-- ============================================================
     LEFT COLUMN — who / when / what (three field cards)
     ============================================================ -->

<!-- FIELD: who -->
<rect x="106" y="148" width="490" height="110" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
<rect x="106" y="148" width="8" height="110" rx="4" fill="#1E8C8C"/>
<text x="130" y="178" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" dominant-baseline="central">who</text>
<text x="130" y="200" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1E8C8C" dominant-baseline="central">actor: canon-steward@agency.gov</text>
<text x="130" y="220" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#5A5A5A" dominant-baseline="central">role: Canon Steward (UIAO_172)</text>
<text x="130" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6B7A8D" dominant-baseline="central">Identity of the authorizing principal — not the executor</text>

<!-- FIELD: when -->
<rect x="106" y="272" width="490" height="110" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
<rect x="106" y="272" width="8" height="110" rx="4" fill="#1E8C8C"/>
<text x="130" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" dominant-baseline="central">when</text>
<text x="130" y="324" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1E8C8C" dominant-baseline="central">authorized_at: 2026-04-24T14:33:00Z</text>
<text x="130" y="344" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#5A5A5A" dominant-baseline="central">delivered_at:  2026-04-24T14:47:22Z</text>
<text x="130" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6B7A8D" dominant-baseline="central">ISO-8601 UTC; authorization precedes delivery always</text>

<!-- FIELD: what -->
<rect x="106" y="396" width="490" height="110" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
<rect x="106" y="396" width="8" height="110" rx="4" fill="#1E8C8C"/>
<text x="130" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" dominant-baseline="central">what</text>
<text x="130" y="448" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1E8C8C" dominant-baseline="central">action: assign-orgpath</text>
<text x="130" y="468" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#5A5A5A" dominant-baseline="central">scope: ORG-FIN-AP-EAST (42 objects)</text>
<text x="130" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6B7A8D" dominant-baseline="central">Canonical action type + governed scope — no ad-hoc strings</text>

<!-- ============================================================
     RIGHT COLUMN — profile / hash / commit chain
     ============================================================ -->

<!-- FIELD: profile -->
<rect x="614" y="148" width="546" height="110" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
<rect x="614" y="148" width="8" height="110" rx="4" fill="#2E75B6"/>
<text x="638" y="178" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" dominant-baseline="central">profile</text>
<text x="638" y="200" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2E75B6" dominant-baseline="central">schema: UIAO_158 v1.4</text>
<text x="638" y="220" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#5A5A5A" dominant-baseline="central">validation: UIAO_160 Pester gate PASS</text>
<text x="638" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6B7A8D" dominant-baseline="central">Schema version + validation result locked at delivery</text>

<!-- FIELD: hash -->
<rect x="614" y="272" width="546" height="110" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
<rect x="614" y="272" width="8" height="110" rx="4" fill="#2E75B6"/>
<text x="638" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" dominant-baseline="central">hash</text>
<text x="638" y="322" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2E75B6" dominant-baseline="central">sha256: a3f9e2b1c847d605...</text>
<text x="638" y="342" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5A5A5A" dominant-baseline="central">        ...4e8a1d29f3c70b82</text>
<text x="638" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6B7A8D" dominant-baseline="central">SHA-256 of the canonical plan payload; recomputed at verify</text>

<!-- FIELD: commit chain (the chain graphic) -->
<rect x="614" y="396" width="546" height="210" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
<rect x="614" y="396" width="8" height="210" rx="4" fill="#D4A017"/>
<text x="638" y="423" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" dominant-baseline="central">commit chain</text>

<!-- Chain: three commit nodes connected with arrows -->
<!-- Commit A: plan authored -->
<rect x="638" y="442" width="230" height="54" rx="7" fill="#0D1B2E"/>
<text x="753" y="462" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">commit: b45661c1</text>
<text x="753" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">plan authored + signed</text>

<!-- Arrow A → B -->
<line x1="868" y1="469" x2="890" y2="469" stroke="#D4A017" stroke-width="2.5"/>
<polygon points="890,464 900,469 890,474" fill="#D4A017"/>

<!-- Commit B: authorized delivery -->
<rect x="900" y="442" width="230" height="54" rx="7" fill="#1E8C8C"/>
<text x="1015" y="462" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">commit: 587e5d05</text>
<text x="1015" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">delivery executed</text>

<!-- Arrow B → C (down then left) -->
<line x1="1015" y1="496" x2="1015" y2="524" stroke="#D4A017" stroke-width="2.5"/>
<line x1="1015" y1="524" x2="638" y2="524" stroke="#D4A017" stroke-width="2.5"/>
<polygon points="643,519 633,524 643,529" fill="#D4A017"/>

<!-- Commit C: evidence packet -->
<rect x="638" y="508" width="230" height="54" rx="7" fill="#2E75B6"/>
<text x="753" y="528" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">commit: 8afbf30a</text>
<text x="753" y="546" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">evidence packet committed</text>

<!-- Hash→commit label -->
<text x="638" y="582" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" dominant-baseline="central">hash links each commit; chain is immutable in Gitea canon</text>

<!-- ============================================================
     BOTTOM BAND — sealing label
     ============================================================ -->
<rect x="106" y="518" width="490" height="98" rx="10" fill="#0D1B2E"/>
<text x="351" y="548" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Envelope sealed at delivery</text>
<text x="351" y="572" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">signature: ed25519:canon-steward@agency.gov</text>
<text x="351" y="594" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Fields are immutable post-seal — audit reads directly from Gitea</text>

<!-- Footer -->
<text x="640" y="692" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">Teal = identity/time fields &#183; Blue = schema/hash fields &#183; Amber = commit chain &#183; Navy = sealed envelope</text>
</svg>
