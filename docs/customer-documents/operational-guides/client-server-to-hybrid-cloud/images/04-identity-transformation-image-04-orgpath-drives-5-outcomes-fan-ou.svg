<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">One OrgPath attribute drives five governance outcomes</text>
  <text x="60" y="90" font-size="18" fill="#6B7A8D">Set the attribute once; every downstream effect follows automatically (no admin-portal clicks)</text>

  <!-- Central OrgPath source node (left-center) -->
  <rect x="56" y="300" width="300" height="150" rx="14" fill="#0D1B2E"/>
  <rect x="56" y="300" width="9" height="150" rx="4" fill="#1E8C8C"/>
  <text x="206" y="338" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">OrgPath attribute</text>
  <text x="206" y="372" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#1E8C8C">NCR / IT / InfraOps</text>
  <text x="206" y="406" text-anchor="middle" font-size="15" fill="#EAF1FB">ea1-3 + ea15 derived</text>
  <text x="206" y="430" text-anchor="middle" font-size="15" fill="#EAF1FB">canonical, single source</text>

  <!-- Outcome card 1 -->
  <rect x="470" y="120" width="430" height="78" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <circle cx="506" cy="159" r="17" fill="#1E8C8C"/>
  <text x="506" y="159" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="540" y="151" font-size="19" font-weight="bold" fill="#0D1B2E">Dynamic Group Membership</text>
  <text x="540" y="178" font-size="14" fill="#33414F">membership rule resolves from the attribute</text>
  <!-- Outcome card 2 -->
  <rect x="470" y="214" width="430" height="78" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <circle cx="506" cy="253" r="17" fill="#1E8C8C"/>
  <text x="506" y="253" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="540" y="245" font-size="19" font-weight="bold" fill="#0D1B2E">Admin Unit Delegation</text>
  <text x="540" y="272" font-size="14" fill="#33414F">scoped administration without forest OUs</text>
  <!-- Outcome card 3 -->
  <rect x="470" y="308" width="430" height="78" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <circle cx="506" cy="347" r="17" fill="#1E8C8C"/>
  <text x="506" y="347" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="540" y="339" font-size="19" font-weight="bold" fill="#0D1B2E">Conditional Access Scoping</text>
  <text x="540" y="366" font-size="14" fill="#33414F">CA policies target the resolved population</text>
  <!-- Outcome card 4 -->
  <rect x="470" y="402" width="430" height="78" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <circle cx="506" cy="441" r="17" fill="#1E8C8C"/>
  <text x="506" y="441" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="540" y="433" font-size="19" font-weight="bold" fill="#0D1B2E">License Assignment</text>
  <text x="540" y="460" font-size="14" fill="#33414F">group-based licensing follows membership</text>
  <!-- Outcome card 5 (drift, amber) -->
  <rect x="470" y="496" width="430" height="78" rx="12" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <circle cx="506" cy="535" r="17" fill="#D4A017"/>
  <text x="506" y="535" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="540" y="527" font-size="19" font-weight="bold" fill="#0D1B2E">Drift Detection</text>
  <text x="540" y="554" font-size="14" fill="#33414F">deviation from canonical OrgPath is flagged</text>

  <!-- Fan-out arrows -->
  <line x1="356" y1="360" x2="466" y2="159" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="356" y1="365" x2="466" y2="253" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="356" y1="375" x2="466" y2="347" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="356" y1="385" x2="466" y2="441" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="356" y1="390" x2="466" y2="535" stroke="#D4A017" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Right detail panel: lifecycle + drift SLA -->
  <rect x="936" y="120" width="288" height="454" rx="12" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="2"/>
  <rect x="936" y="120" width="288" height="44" rx="12" fill="#0D1B2E"/>
  <text x="1080" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Lifecycle and drift</text>

  <text x="958" y="196" font-size="15" font-weight="bold" fill="#1E8C8C">Joiner / Mover / Leaver</text>
  <text x="958" y="222" font-size="13" fill="#33414F">Joiner: attribute set at onboarding</text>
  <text x="958" y="244" font-size="13" fill="#33414F">Mover: one edit re-resolves all five</text>
  <text x="958" y="266" font-size="13" fill="#33414F">Leaver: clear attribute, access revokes</text>
  <text x="958" y="290" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7A8D">UIAO_155 workflow catalog</text>

  <line x1="958" y1="312" x2="1202" y2="312" stroke="#E3E8EF" stroke-width="1"/>
  <text x="958" y="340" font-size="15" font-weight="bold" fill="#D4A017">Drift categories and SLA</text>
  <text x="958" y="366" font-size="13" fill="#33414F">DRIFT-IDENTITY: 15 min</text>
  <text x="958" y="388" font-size="13" fill="#33414F">DRIFT-AUTHZ: 1 hour</text>
  <text x="958" y="410" font-size="13" fill="#33414F">DRIFT-SCHEMA: 4 hours</text>
  <text x="958" y="432" font-size="13" fill="#33414F">DRIFT-PROVENANCE: 24 hours</text>

  <line x1="958" y1="454" x2="1202" y2="454" stroke="#E3E8EF" stroke-width="1"/>
  <text x="958" y="482" font-size="13" fill="#6B7A8D">Fix the attribute, not five</text>
  <text x="958" y="502" font-size="13" fill="#6B7A8D">separate consoles. Remediation</text>
  <text x="958" y="522" font-size="13" fill="#6B7A8D">re-asserts the canonical value</text>
  <text x="958" y="542" font-size="13" fill="#6B7A8D">and every outcome realigns.</text>
</svg>
