<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="62" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Analyze-Plan-Deliver Pipeline with Two-Brain Handoff</text>
  <text x="60" y="95" font-size="18" fill="#6B7A8D">UIAO governed modernization engine · each stage signed, versioned, auditable in Gitea</text>

  <!-- ═══ ANALYZE column ═══ -->
  <rect x="40" y="130" width="330" height="460" rx="10" fill="#1E3A66"/>
  <!-- header cap -->
  <rect x="40" y="130" width="330" height="52" rx="10" fill="#0D1B2E"/>
  <rect x="40" y="162" width="330" height="20" fill="#0D1B2E"/>
  <text x="205" y="160" text-anchor="middle" dominant-baseline="central" font-size="23" font-weight="bold" fill="#FFFFFF">ANALYZE</text>
  <text x="205" y="197" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">Brain: Copilot (governance)</text>
  <!-- Input pill -->
  <rect x="62" y="220" width="285" height="52" rx="6" fill="#0D1B2E"/>
  <text x="205" y="240" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">Input</text>
  <text x="205" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D7F2EE">Raw assessment artifact set (Ch. 02)</text>
  <!-- Body text -->
  <text x="205" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#FBEED2">11 ingestion streams →</text>
  <text x="205" y="315" text-anchor="middle" font-size="13" fill="#D7F2EE">current-state graph</text>
  <text x="205" y="335" text-anchor="middle" font-size="13" fill="#D7F2EE">target-state graph</text>
  <text x="205" y="355" text-anchor="middle" font-size="13" fill="#D7F2EE">diff (additions / mods / retirements)</text>
  <text x="205" y="375" text-anchor="middle" font-size="13" fill="#D7F2EE">risk score (blast radius)</text>
  <!-- Output pill -->
  <rect x="62" y="400" width="285" height="52" rx="6" fill="#0D1B2E"/>
  <text x="205" y="418" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1E8C8C">Output: analysis report + change set</text>
  <text x="205" y="438" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6B7A8D" font-family="Consolas, 'DejaVu Sans Mono', monospace">plans/&lt;id&gt;/analysis/</text>
  <!-- Note -->
  <text x="205" y="476" text-anchor="middle" font-size="12" fill="#6B7A8D">Deterministic: same input → same output</text>
  <text x="205" y="494" text-anchor="middle" font-size="12" fill="#6B7A8D">Output varies run-to-run → rejected</text>
  <text x="205" y="546" text-anchor="middle" font-size="12" fill="#5A5A5A">Stage 1</text>

  <!-- Arrow ANALYZE → PLAN -->
  <line x1="370" y1="360" x2="432" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="401" y="346" text-anchor="middle" font-size="11" fill="#1E8C8C">diff</text>

  <!-- ═══ PLAN column ═══ -->
  <rect x="437" y="130" width="330" height="460" rx="10" fill="#1E3A66"/>
  <rect x="437" y="130" width="330" height="52" rx="10" fill="#0D1B2E"/>
  <rect x="437" y="162" width="330" height="20" fill="#0D1B2E"/>
  <text x="602" y="160" text-anchor="middle" dominant-baseline="central" font-size="23" font-weight="bold" fill="#FFFFFF">PLAN</text>
  <text x="602" y="197" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">Brain: Copilot (governance)</text>
  <rect x="459" y="220" width="285" height="52" rx="6" fill="#0D1B2E"/>
  <text x="602" y="240" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">Input</text>
  <text x="602" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D7F2EE">Analyze output + canon (UIAO_151–161)</text>
  <text x="602" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">~30 canonical action types:</text>
  <text x="602" y="315" text-anchor="middle" font-size="12" fill="#D7F2EE">typed · scoped · dependency-ordered</text>
  <text x="602" y="335" text-anchor="middle" font-size="12" fill="#D7F2EE">rollback-paired · provenance-linked</text>
  <text x="602" y="363" text-anchor="middle" font-size="13" font-weight="bold" fill="#FBEED2">Validation (UIAO_160):</text>
  <text x="602" y="382" text-anchor="middle" font-size="12" fill="#D7F2EE">schema · canon · boundary · safety · idempotency</text>
  <rect x="459" y="400" width="285" height="52" rx="6" fill="#0D1B2E"/>
  <text x="602" y="418" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1E8C8C">Output: signed executable Plan</text>
  <text x="602" y="438" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6B7A8D" font-family="Consolas, 'DejaVu Sans Mono', monospace">plans/&lt;id&gt;/proposed/</text>
  <text x="602" y="476" text-anchor="middle" font-size="12" fill="#6B7A8D">Plans never partially-ship</text>
  <text x="602" y="494" text-anchor="middle" font-size="12" fill="#6B7A8D">Fail any gate → returned to steward</text>
  <text x="602" y="546" text-anchor="middle" font-size="12" fill="#5A5A5A">Stage 2</text>

  <!-- ═══ Two-Brain authorization handoff bar ═══ -->
  <rect x="793" y="108" width="46" height="482" rx="6" fill="#D4A017"/>
  <text x="816" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#0D1B2E" transform="rotate(-90,816,350)">Two-Brain authorization handoff</text>

  <!-- Arrow PLAN → bar -->
  <line x1="767" y1="360" x2="791" y2="360" stroke="#D4A017" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <!-- Arrow bar → DELIVER -->
  <line x1="839" y1="360" x2="880" y2="360" stroke="#D4A017" stroke-width="3" marker-end="url(#arrow-amber)"/>

  <!-- Callout below bar -->
  <line x1="816" y1="590" x2="816" y2="620" stroke="#D4A017" stroke-width="1.5"/>
  <rect x="692" y="620" width="248" height="76" rx="6" fill="#FBEED2" stroke="#D4A017" stroke-width="1.5"/>
  <text x="816" y="641" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Canon Steward review</text>
  <text x="816" y="659" text-anchor="middle" font-size="12" fill="#5A5A5A">Gitea PR · blast-radius summary</text>
  <text x="816" y="676" text-anchor="middle" font-size="12" fill="#5A5A5A">separation-of-duties · sign-off</text>
  <text x="816" y="692" text-anchor="middle" font-size="11" fill="#5A5A5A" font-family="Consolas, 'DejaVu Sans Mono', monospace">proposed/ → authorized/</text>

  <!-- ═══ DELIVER column ═══ -->
  <rect x="885" y="130" width="355" height="460" rx="10" fill="#1E3A66"/>
  <rect x="885" y="130" width="355" height="52" rx="10" fill="#0D1B2E"/>
  <rect x="885" y="162" width="355" height="20" fill="#0D1B2E"/>
  <text x="1062" y="160" text-anchor="middle" dominant-baseline="central" font-size="23" font-weight="bold" fill="#FFFFFF">DELIVER</text>
  <text x="1062" y="197" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">Brain: Execution Substrate</text>
  <rect x="907" y="220" width="311" height="52" rx="6" fill="#0D1B2E"/>
  <text x="1062" y="240" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">Input</text>
  <text x="1062" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D7F2EE">Authorized plan (signed)</text>
  <text x="1062" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Per-action sequence:</text>
  <text x="1062" y="315" text-anchor="middle" font-size="12" fill="#D7F2EE">Fetch → Resolve → Compare</text>
  <text x="1062" y="335" text-anchor="middle" font-size="12" fill="#D7F2EE">Invoke → Verify → Record</text>
  <text x="1062" y="363" text-anchor="middle" font-size="12" fill="#D7F2EE">Correlation ID in all log streams</text>
  <text x="1062" y="382" text-anchor="middle" font-size="12" fill="#D7F2EE">Separate svc principal + credential store</text>
  <rect x="907" y="400" width="311" height="52" rx="6" fill="#0D1B2E"/>
  <text x="1062" y="418" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1E8C8C">Output: result log + evidence packet</text>
  <text x="1062" y="438" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6B7A8D" font-family="Consolas, 'DejaVu Sans Mono', monospace">plans/&lt;id&gt;/evidence.json</text>
  <text x="1062" y="476" text-anchor="middle" font-size="12" fill="#6B7A8D">UIAO_174 telemetry → SIEM</text>
  <text x="1062" y="494" text-anchor="middle" font-size="12" fill="#6B7A8D">FedRAMP ConMon + federal ATO</text>
  <text x="1062" y="546" text-anchor="middle" font-size="12" fill="#5A5A5A">Stage 3</text>
</svg>
