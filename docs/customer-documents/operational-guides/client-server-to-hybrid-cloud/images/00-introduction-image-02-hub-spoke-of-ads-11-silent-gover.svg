<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="54" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="32" fill="#0D1B2E">AD's 11 Silent Governance Roles</text>
  <text x="60" y="80" font-size="15" fill="#6B7A8D">Every object type AD governed — and what breaks without a replacement governance model</text>

  <!--
    Hub center: (640, 372)
    11 spokes, 360/11 ≈ 32.73° apart, starting at -90° (top), clockwise.
    Outer node center radius ≈ 255px from hub center.
    Hub half-dimensions: w=140, h=56 (edges at x 500/780, y 316/428)
    Angles:
      0: -90.00° → top         sin=-0    cos=+1  → (640, 117)
      1: -57.27° → upper-right sin=-0.840, cos=+0.542  → (854, 234)
      2: -24.55° → right-upper sin=-0.415, cos+0.910  → (746, 140) NO recalc below
      3:   8.18° → right        sin=+0.142, cos+0.990  → (895, 409)  NO – recalc
      4:  40.91° → lower-right  sin=+0.655, cos+0.756  → (807, 565)  NO
      5:  73.64° → lower-right  sin=+0.960, cos+0.281  → (885, 444)  NO
    Let me place nodes manually at pleasant positions.
  -->

  <!-- Hub -->
  <rect x="500" y="316" width="280" height="112" rx="14" fill="#0D1B2E"/>
  <text x="640" y="358" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">Active Directory</text>
  <text x="640" y="382" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#D7F2EE">11 silent governance roles</text>
  <text x="640" y="402" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1E8C8C">UIAO governs all eleven</text>

  <!-- ──────────────────────────────────────────────────────
       Node positions (cx, cy of each spoke rect center):
       0: Users             640, 138   top
       1: Computers         880, 186   upper-right
       2: Service Accounts  1020, 316  right-upper
       3: Security Groups   1020, 428  right-lower
       4: Group Policy Objs 880, 556   lower-right
       5: DNS / DHCP        680, 620   lower-center-right
       6: PKI / Cert Svcs   500, 620   lower-center-left
       7: RADIUS / NPS      320, 556   lower-left
       8: LDAP              200, 428   left-lower
       9: SPNs / App Regs   200, 316   left-upper    (amber: complex)
      10: Trust Relationships 320, 186  upper-left   (amber: complex)
  ────────────────────────────────────────────────────── -->

  <!-- ── 0: Users  top ── -->
  <line x1="640" y1="316" x2="640" y2="210" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="524" y="110" width="232" height="68" rx="10" fill="#1E3A66"/>
  <text x="640" y="139" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">1 · Users</text>
  <text x="640" y="161" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#D7F2EE">Identity lifecycle · OU placement</text>

  <!-- ── 1: Computers  upper-right ── -->
  <line x1="760" y1="328" x2="862" y2="238" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="836" y="158" width="240" height="68" rx="10" fill="#1E3A66"/>
  <text x="956" y="185" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">2 · Computers</text>
  <text x="956" y="207" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#D7F2EE">Domain join · GPO targeting</text>

  <!-- ── 2: Service Accounts  right-upper ── -->
  <line x1="780" y1="354" x2="950" y2="324" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="950" y="284" width="258" height="68" rx="10" fill="#1E3A66"/>
  <text x="1079" y="311" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">3 · Service Accounts</text>
  <text x="1079" y="333" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#D7F2EE">SPNs · Kerberos delegation</text>

  <!-- ── 3: Security Groups  right-lower ── -->
  <line x1="780" y1="400" x2="950" y2="420" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="950" y="380" width="258" height="68" rx="10" fill="#1E3A66"/>
  <text x="1079" y="407" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">4 · Security Groups</text>
  <text x="1079" y="429" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#D7F2EE">Access control · policy scoping</text>

  <!-- ── 4: Group Policy Objects  lower-right ── -->
  <line x1="760" y1="420" x2="876" y2="516" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="836" y="516" width="272" height="68" rx="10" fill="#1E3A66"/>
  <text x="972" y="543" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">5 · Group Policy Objects</text>
  <text x="972" y="565" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#D7F2EE">Device config · security baselines</text>

  <!-- ── 5: DNS / DHCP  lower-center-right ── -->
  <line x1="694" y1="428" x2="720" y2="544" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="618" y="544" width="214" height="68" rx="10" fill="#1E3A66"/>
  <text x="725" y="571" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">6 · DNS / DHCP</text>
  <text x="725" y="593" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#D7F2EE">Name resolution · IP allocation</text>

  <!-- ── 6: PKI / Certificate Services  lower-center-left ── -->
  <line x1="586" y1="428" x2="548" y2="544" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="316" y="544" width="272" height="68" rx="10" fill="#1E3A66"/>
  <text x="452" y="569" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">7 · PKI / Certificate Services</text>
  <text x="452" y="591" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#D7F2EE">Cert issuance · auto-enrollment</text>

  <!-- ── 7: RADIUS / NPS  lower-left ── -->
  <line x1="520" y1="420" x2="406" y2="516" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="140" y="516" width="240" height="68" rx="10" fill="#1E3A66"/>
  <text x="260" y="543" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">8 · RADIUS / NPS</text>
  <text x="260" y="565" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#D7F2EE">802.1X · VPN auth · Wi-Fi</text>

  <!-- ── 8: LDAP  left-lower ── -->
  <line x1="500" y1="400" x2="336" y2="420" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="72" y="380" width="222" height="68" rx="10" fill="#1E3A66"/>
  <text x="183" y="407" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">9 · LDAP</text>
  <text x="183" y="429" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#D7F2EE">App auth · directory queries</text>

  <!-- ── 9: SPNs / App Registrations  left-upper  (amber — high complexity) ── -->
  <line x1="500" y1="354" x2="336" y2="324" stroke="#D4A017" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="72" y="284" width="272" height="68" rx="10" fill="#1E3A66" stroke="#D4A017" stroke-width="2"/>
  <text x="208" y="309" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FBEED2">10 · SPNs / App Registrations</text>
  <text x="208" y="331" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#D7F2EE">Kerberos SPNs · app identity</text>

  <!-- ── 10: Trust Relationships  upper-left  (amber — high complexity) ── -->
  <line x1="520" y1="328" x2="408" y2="238" stroke="#D4A017" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="140" y="158" width="272" height="68" rx="10" fill="#1E3A66" stroke="#D4A017" stroke-width="2"/>
  <text x="276" y="183" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FBEED2">11 · Trust Relationships</text>
  <text x="276" y="205" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#D7F2EE">Cross-domain auth · forest trusts</text>

  <!-- Legend bottom-left -->
  <rect x="60" y="630" width="368" height="72" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="244" y="652" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D1B2E">Legend</text>
  <line x1="80" y1="668" x2="108" y2="668" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="118" y="672" font-size="12" fill="#33414F">Standard governance dependency</text>
  <line x1="80" y1="688" x2="108" y2="688" stroke="#D4A017" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <text x="118" y="692" font-size="12" fill="#33414F">High-risk / complex dependency (SPNs, Trusts)</text>
</svg>
