<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">GPO Categories to Modern Targets</text>
  <text x="60" y="84" font-size="16" fill="#6B7A8D">Group Policy Object categories and their canonical modern replacements across four target surfaces</text>

  <!-- Left column header: GPO Categories -->
  <rect x="60" y="108" width="380" height="44" rx="8" fill="#0D1B2E"/>
  <text x="250" y="130" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">GPO Category</text>

  <!-- Center column header: Surface -->
  <rect x="490" y="108" width="250" height="44" rx="8" fill="#1E8C8C"/>
  <text x="615" y="130" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#FFFFFF">Surface</text>

  <!-- Right column header: Modern Target -->
  <rect x="840" y="108" width="380" height="44" rx="8" fill="#1E3A66"/>
  <text x="1030" y="130" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Modern Target</text>

  <!-- Row 1: Device configuration -->
  <rect x="60" y="168" width="380" height="52" rx="8" fill="#1E3A66"/>
  <text x="250" y="194" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#FFFFFF">Device configuration</text>
  <rect x="490" y="168" width="250" height="52" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="615" y="194" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0D1B2E">Intune</text>
  <rect x="840" y="168" width="380" height="52" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1030" y="194" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#0D1B2E">Intune Configuration Profiles</text>
  <line x1="440" y1="194" x2="486" y2="194" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="194" x2="836" y2="194" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: Security baselines -->
  <rect x="60" y="228" width="380" height="52" rx="8" fill="#1E3A66"/>
  <text x="250" y="254" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#FFFFFF">Security baselines</text>
  <rect x="490" y="228" width="250" height="52" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="615" y="254" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0D1B2E">Intune + Entra ID</text>
  <rect x="840" y="228" width="380" height="52" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1030" y="242" text-anchor="middle" font-size="15" fill="#0D1B2E">Intune Security Baselines +</text>
  <text x="1030" y="262" text-anchor="middle" font-size="15" fill="#0D1B2E">Entra ID Auth Methods</text>
  <line x1="440" y1="254" x2="486" y2="254" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="254" x2="836" y2="254" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3: Software deployment -->
  <rect x="60" y="288" width="380" height="52" rx="8" fill="#1E3A66"/>
  <text x="250" y="314" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#FFFFFF">Software deployment</text>
  <rect x="490" y="288" width="250" height="52" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="615" y="314" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0D1B2E">Intune</text>
  <rect x="840" y="288" width="380" height="52" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1030" y="314" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#0D1B2E">Intune Win32 Apps + Autopilot</text>
  <line x1="440" y1="314" x2="486" y2="314" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="314" x2="836" y2="314" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 4: Access control -->
  <rect x="60" y="348" width="380" height="52" rx="8" fill="#1E3A66"/>
  <text x="250" y="374" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#FFFFFF">Access control</text>
  <rect x="490" y="348" width="250" height="52" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="615" y="374" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0D1B2E">Conditional Access</text>
  <rect x="840" y="348" width="380" height="52" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1030" y="362" text-anchor="middle" font-size="15" fill="#0D1B2E">Conditional Access +</text>
  <text x="1030" y="382" text-anchor="middle" font-size="15" fill="#0D1B2E">Entra ID Session Controls</text>
  <line x1="440" y1="374" x2="486" y2="374" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="374" x2="836" y2="374" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 5: Server configuration -->
  <rect x="60" y="408" width="380" height="52" rx="8" fill="#1E3A66"/>
  <text x="250" y="434" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#FFFFFF">Server configuration</text>
  <rect x="490" y="408" width="250" height="52" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="615" y="434" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0D1B2E">Azure Arc</text>
  <rect x="840" y="408" width="380" height="52" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1030" y="422" text-anchor="middle" font-size="15" fill="#0D1B2E">Azure Arc Guest Configuration</text>
  <text x="1030" y="442" text-anchor="middle" font-size="15" fill="#0D1B2E">+ Azure Policy</text>
  <line x1="440" y1="434" x2="486" y2="434" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="434" x2="836" y2="434" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 6: Browser / mailbox config -->
  <rect x="60" y="468" width="380" height="52" rx="8" fill="#1E3A66"/>
  <text x="250" y="494" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#FFFFFF">Browser / mailbox config</text>
  <rect x="490" y="468" width="250" height="52" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="615" y="494" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0D1B2E">Intune + M365</text>
  <rect x="840" y="468" width="380" height="52" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1030" y="482" text-anchor="middle" font-size="15" fill="#0D1B2E">Intune Settings Catalog +</text>
  <text x="1030" y="502" text-anchor="middle" font-size="15" fill="#0D1B2E">Office 365 policies</text>
  <line x1="440" y1="494" x2="486" y2="494" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="494" x2="836" y2="494" stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Callout box -->
  <rect x="60" y="548" width="1160" height="72" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="640" y="572" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Replacement is not one product — it is four: Intune (device config + compliance) · Conditional Access (access control)</text>
  <text x="640" y="600" text-anchor="middle" font-size="16" fill="#0D1B2E">Azure Arc / Guest Configuration (server config) · Entra ID Settings Catalog (tenant policy)</text>

  <!-- Legend -->
  <rect x="60" y="638" width="20" height="16" rx="3" fill="#1E3A66"/>
  <text x="88" y="651" font-size="14" fill="#5A5A5A">Legacy GPO</text>
  <rect x="200" y="638" width="20" height="16" rx="3" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="228" y="651" font-size="14" fill="#5A5A5A">Delivery surface</text>
  <rect x="380" y="638" width="20" height="16" rx="3" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="408" y="651" font-size="14" fill="#5A5A5A">Modern target</text>
  <line x1="560" y1="646" x2="600" y2="646" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="610" y="651" font-size="14" fill="#5A5A5A">Maps to</text>

</svg>
