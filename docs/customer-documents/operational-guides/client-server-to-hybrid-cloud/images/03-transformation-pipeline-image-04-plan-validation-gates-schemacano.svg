<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="62" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">Plan Validation Gates</text>
  <text x="60" y="95" font-size="18" fill="#6B7A8D">UIAO_160 Governance Enforcement Test Suite · five sequential gates before authorization</text>

  <!-- ═══ Input: Proposed Plan ═══ -->
  <rect x="30" y="260" width="140" height="200" rx="10" fill="#1E3A66"/>
  <text x="100" y="340" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Proposed</text>
  <text x="100" y="364" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Plan</text>
  <text x="100" y="400" text-anchor="middle" font-size="11" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">plans/&lt;id&gt;/</text>
  <text x="100" y="418" text-anchor="middle" font-size="11" fill="#D7F2EE" font-family="Consolas, 'DejaVu Sans Mono', monospace">proposed/</text>

  <!-- Arrow into Gate 1 -->
  <line x1="170" y1="360" x2="208" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- ─── Gate 1: Schema ─── -->
  <rect x="212" y="222" width="166" height="276" rx="10" fill="#0D1B2E"/>
  <!-- diamond/chevron shape indicator at top -->
  <polygon points="295,222 378,270 295,318 212,270" fill="#1E3A66"/>
  <text x="295" y="270" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">SCHEMA</text>
  <line x1="212" y1="320" x2="378" y2="320" stroke="#1E8C8C" stroke-width="1"/>
  <text x="295" y="348" text-anchor="middle" font-size="12" fill="#D7F2EE">Conforms to</text>
  <text x="295" y="366" text-anchor="middle" font-size="12" fill="#D7F2EE">plan JSON</text>
  <text x="295" y="384" text-anchor="middle" font-size="12" fill="#D7F2EE">schema</text>
  <text x="295" y="418" text-anchor="middle" font-size="11" fill="#6B7A8D">Gate 1</text>
  <text x="295" y="438" text-anchor="middle" font-size="11" fill="#6B7A8D" font-family="Consolas, 'DejaVu Sans Mono', monospace">UIAO_160</text>
  <text x="295" y="470" text-anchor="middle" font-size="11" fill="#1E8C8C">PASS →</text>

  <!-- Arrow Gate 1 → Gate 2 -->
  <line x1="378" y1="360" x2="412" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- ─── Gate 2: Canon ─── -->
  <rect x="416" y="222" width="166" height="276" rx="10" fill="#0D1B2E"/>
  <polygon points="499,222 582,270 499,318 416,270" fill="#1E3A66"/>
  <text x="499" y="270" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">CANON</text>
  <line x1="416" y1="320" x2="582" y2="320" stroke="#1E8C8C" stroke-width="1"/>
  <text x="499" y="345" text-anchor="middle" font-size="12" fill="#D7F2EE">OrgPath in</text>
  <text x="499" y="363" text-anchor="middle" font-size="12" fill="#D7F2EE">UIAO_151</text>
  <text x="499" y="381" text-anchor="middle" font-size="12" fill="#D7F2EE">Groups/AUs/roles</text>
  <text x="499" y="399" text-anchor="middle" font-size="12" fill="#D7F2EE">valid per 152/154</text>
  <text x="499" y="424" text-anchor="middle" font-size="11" fill="#6B7A8D">Gate 2</text>
  <text x="499" y="444" text-anchor="middle" font-size="11" fill="#6B7A8D" font-family="Consolas, 'DejaVu Sans Mono', monospace">UIAO_151–154</text>
  <text x="499" y="470" text-anchor="middle" font-size="11" fill="#1E8C8C">PASS →</text>

  <!-- Arrow Gate 2 → Gate 3 -->
  <line x1="582" y1="360" x2="616" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- ─── Gate 3: Boundary ─── -->
  <rect x="620" y="222" width="166" height="276" rx="10" fill="#0D1B2E"/>
  <polygon points="703,222 786,270 703,318 620,270" fill="#1E3A66"/>
  <text x="703" y="270" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">BOUNDARY</text>
  <line x1="620" y1="320" x2="786" y2="320" stroke="#1E8C8C" stroke-width="1"/>
  <text x="703" y="345" text-anchor="middle" font-size="12" fill="#D7F2EE">No out-of-scope</text>
  <text x="703" y="363" text-anchor="middle" font-size="12" fill="#D7F2EE">service calls</text>
  <text x="703" y="381" text-anchor="middle" font-size="12" fill="#D7F2EE">No Commercial</text>
  <text x="703" y="399" text-anchor="middle" font-size="12" fill="#D7F2EE">Cloud (exc. Connect)</text>
  <text x="703" y="424" text-anchor="middle" font-size="11" fill="#6B7A8D">Gate 3</text>
  <text x="703" y="444" text-anchor="middle" font-size="11" fill="#6B7A8D">Classification tags</text>
  <text x="703" y="470" text-anchor="middle" font-size="11" fill="#1E8C8C">PASS →</text>

  <!-- Arrow Gate 3 → Gate 4 -->
  <line x1="786" y1="360" x2="820" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- ─── Gate 4: Safety ─── -->
  <rect x="824" y="222" width="166" height="276" rx="10" fill="#0D1B2E"/>
  <polygon points="907,222 990,270 907,318 824,270" fill="#1E3A66"/>
  <text x="907" y="270" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">SAFETY</text>
  <line x1="824" y1="320" x2="990" y2="320" stroke="#1E8C8C" stroke-width="1"/>
  <text x="907" y="345" text-anchor="middle" font-size="12" fill="#D7F2EE">No bulk-delete</text>
  <text x="907" y="363" text-anchor="middle" font-size="12" fill="#D7F2EE">without confirm</text>
  <text x="907" y="381" text-anchor="middle" font-size="12" fill="#D7F2EE">No high-permanence</text>
  <text x="907" y="399" text-anchor="middle" font-size="12" fill="#D7F2EE">credential rotation</text>
  <text x="907" y="424" text-anchor="middle" font-size="11" fill="#6B7A8D">Gate 4</text>
  <text x="907" y="444" text-anchor="middle" font-size="11" fill="#6B7A8D">No substrate changes</text>
  <text x="907" y="470" text-anchor="middle" font-size="11" fill="#1E8C8C">PASS →</text>

  <!-- Arrow Gate 4 → Gate 5 -->
  <line x1="990" y1="360" x2="1024" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- ─── Gate 5: Idempotency ─── -->
  <rect x="1028" y="222" width="182" height="276" rx="10" fill="#0D1B2E"/>
  <polygon points="1119,222 1210,270 1119,318 1028,270" fill="#1E3A66"/>
  <text x="1119" y="260" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#FFFFFF">IDEMPOTENCY</text>
  <line x1="1028" y1="320" x2="1210" y2="320" stroke="#1E8C8C" stroke-width="1"/>
  <text x="1119" y="345" text-anchor="middle" font-size="12" fill="#D7F2EE">Plan equivalent to</text>
  <text x="1119" y="363" text-anchor="middle" font-size="12" fill="#D7F2EE">re-planning from</text>
  <text x="1119" y="381" text-anchor="middle" font-size="12" fill="#D7F2EE">current state</text>
  <text x="1119" y="399" text-anchor="middle" font-size="12" fill="#D7F2EE">Re-run of partial</text>
  <text x="1119" y="417" text-anchor="middle" font-size="12" fill="#D7F2EE">plan is safe</text>
  <text x="1119" y="450" text-anchor="middle" font-size="11" fill="#6B7A8D">Gate 5</text>
  <text x="1119" y="470" text-anchor="middle" font-size="11" fill="#1E8C8C">ALL PASS →</text>

  <!-- Arrow out to authorized -->
  <line x1="1210" y1="360" x2="1245" y2="360" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- FAIL path — common reject arrow downward from midpoint -->
  <!-- Reject banner below all gates -->
  <rect x="212" y="560" width="980" height="58" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/>
  <text x="702" y="581" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#C0392B">FAIL any gate → plan rejected · diff returned to Canon Steward for correction · plans never partially-ship</text>
  <text x="702" y="601" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5A5A5A" font-family="Consolas, 'DejaVu Sans Mono', monospace">UIAO_160 Governance Enforcement Test Suite</text>

  <!-- Downward reject arrows from each gate -->
  <line x1="295" y1="498" x2="295" y2="558" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="499" y1="498" x2="499" y2="558" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="703" y1="498" x2="703" y2="558" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="907" y1="498" x2="907" y2="558" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="1119" y1="498" x2="1119" y2="558" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- FAIL labels on reject arrows -->
  <text x="295" y="542" text-anchor="middle" font-size="11" fill="#C0392B">FAIL</text>
  <text x="499" y="542" text-anchor="middle" font-size="11" fill="#C0392B">FAIL</text>
  <text x="703" y="542" text-anchor="middle" font-size="11" fill="#C0392B">FAIL</text>
  <text x="907" y="542" text-anchor="middle" font-size="11" fill="#C0392B">FAIL</text>
  <text x="1119" y="542" text-anchor="middle" font-size="11" fill="#C0392B">FAIL</text>

  <!-- Authorization target label at far right -->
  <text x="1258" y="350" text-anchor="middle" font-size="13" fill="#0D1B2E" font-weight="bold">Auth</text>
  <text x="1258" y="368" text-anchor="middle" font-size="13" fill="#0D1B2E" font-weight="bold">gate</text>

  <!-- Footer -->
  <text x="640" y="665" text-anchor="middle" font-size="14" fill="#6B7A8D">All five gates must pass before a plan is eligible for Canon Steward authorization · ADR-002 Two-Brain Execution</text>
</svg>
