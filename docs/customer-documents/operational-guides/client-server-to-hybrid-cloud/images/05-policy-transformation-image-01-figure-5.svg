<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#0D1B2E">GPO Categories Mapped to Modern Target Surfaces</text>
  <text x="60" y="84" font-size="16" fill="#6B7A8D">Each legacy Group Policy category has a canonical Intune / Microsoft 365 equivalent</text>

  <!-- Column headers -->
  <rect x="60" y="104" width="430" height="42" rx="8" fill="#0D1B2E"/>
  <text x="275" y="125" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">GPO Category (Legacy)</text>

  <rect x="790" y="104" width="430" height="42" rx="8" fill="#1E3A66"/>
  <text x="1005" y="125" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#FFFFFF">Modern Target Surface</text>

  <!-- Row 1: Security settings → Intune configuration profiles -->
  <rect x="60" y="160" width="430" height="48" rx="8" fill="#1E3A66"/>
  <text x="275" y="184" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">Security settings</text>
  <line x1="490" y1="184" x2="785" y2="184" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="790" y="160" width="430" height="48" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1005" y="184" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">Intune configuration profiles</text>

  <!-- Row 2: Software install → Win32 app deployment -->
  <rect x="60" y="218" width="430" height="48" rx="8" fill="#1E3A66"/>
  <text x="275" y="242" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">Software install</text>
  <line x1="490" y1="242" x2="785" y2="242" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="790" y="218" width="430" height="48" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1005" y="242" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">Win32 app deployment</text>

  <!-- Row 3: Scripts → Intune scripts -->
  <rect x="60" y="276" width="430" height="48" rx="8" fill="#1E3A66"/>
  <text x="275" y="300" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">Scripts</text>
  <line x1="490" y1="300" x2="785" y2="300" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="790" y="276" width="430" height="48" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1005" y="300" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">Intune scripts</text>

  <!-- Row 4: Drive maps → OneDrive Known Folder Move -->
  <rect x="60" y="334" width="430" height="48" rx="8" fill="#1E3A66"/>
  <text x="275" y="358" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">Drive maps</text>
  <line x1="490" y1="358" x2="785" y2="358" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="790" y="334" width="430" height="48" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1005" y="358" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">OneDrive Known Folder Move</text>

  <!-- Row 5: Registry → Settings Catalog -->
  <rect x="60" y="392" width="430" height="48" rx="8" fill="#1E3A66"/>
  <text x="275" y="416" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">Registry</text>
  <line x1="490" y1="416" x2="785" y2="416" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="790" y="392" width="430" height="48" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1005" y="416" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">Settings Catalog</text>

  <!-- Row 6: Certificate auto-enrollment → PKI auto-enrollment via Intune -->
  <rect x="60" y="450" width="430" height="48" rx="8" fill="#1E3A66"/>
  <text x="275" y="474" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">Certificate auto-enrollment</text>
  <line x1="490" y1="474" x2="785" y2="474" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="790" y="450" width="430" height="48" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1005" y="474" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">PKI auto-enrollment via Intune</text>

  <!-- Row 7: BitLocker → BitLocker via Intune -->
  <rect x="60" y="508" width="430" height="48" rx="8" fill="#1E3A66"/>
  <text x="275" y="532" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">BitLocker</text>
  <line x1="490" y1="532" x2="785" y2="532" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="790" y="508" width="430" height="48" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1005" y="532" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">BitLocker via Intune</text>

  <!-- Row 8: Windows Update → Windows Update for Business -->
  <rect x="60" y="566" width="430" height="48" rx="8" fill="#1E3A66"/>
  <text x="275" y="590" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">Windows Update</text>
  <line x1="490" y1="590" x2="785" y2="590" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="790" y="566" width="430" height="48" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1005" y="590" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">Windows Update for Business</text>

  <!-- Row 9: Firewall → Defender Firewall via Intune -->
  <rect x="60" y="624" width="430" height="48" rx="8" fill="#1E3A66"/>
  <text x="275" y="648" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">Firewall</text>
  <line x1="490" y1="648" x2="785" y2="648" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="790" y="624" width="430" height="48" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1005" y="648" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">Defender Firewall via Intune</text>

  <!-- Row 10: Audit policy → Microsoft Sentinel -->
  <rect x="60" y="682" width="430" height="32" rx="8" fill="#1E3A66"/>
  <text x="275" y="698" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#FFFFFF">Audit policy</text>
  <line x1="490" y1="698" x2="785" y2="698" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="790" y="682" width="430" height="32" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1005" y="698" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0D1B2E">Microsoft Sentinel</text>

</svg>
