<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · ice #EAF1FB · red #C0392B · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="74" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#0D1B2E">Assessment: AD attributes to OrgPath facets</text>
  <text x="60" y="108" font-size="20" fill="#5A5A5A">Pure and read-only — derive facet values, validate against the Codebook, and report unmapped findings.</text>

  <!-- AD source -->
  <rect x="60" y="250" width="260" height="190" rx="10" fill="#0D1B2E"/>
  <text x="190" y="290" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Active Directory</text>
  <text x="80" y="328" font-family="Consolas, monospace" font-size="15" fill="#EAF1FB">department</text>
  <text x="80" y="354" font-family="Consolas, monospace" font-size="15" fill="#EAF1FB">title</text>
  <text x="80" y="380" font-family="Consolas, monospace" font-size="15" fill="#EAF1FB">physicalDeliveryOffice</text>
  <text x="80" y="406" font-family="Consolas, monospace" font-size="15" fill="#EAF1FB">employeeType</text>
  <text x="190" y="432" text-anchor="middle" font-size="13" fill="#6B7A8D">live LDAP or --from-export</text>
  <line x1="322" y1="345" x2="388" y2="345" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Mapping -->
  <rect x="392" y="250" width="260" height="190" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="522" y="290" text-anchor="middle" font-size="20" font-weight="bold" fill="#0D1B2E">AD to facet mapping</text>
  <text x="412" y="328" font-family="Consolas, monospace" font-size="15" fill="#33414F">alias</text>
  <text x="412" y="354" font-family="Consolas, monospace" font-size="15" fill="#33414F">passthrough</text>
  <text x="412" y="380" font-family="Consolas, monospace" font-size="15" fill="#33414F">date</text>
  <text x="412" y="406" font-family="Consolas, monospace" font-size="15" fill="#33414F">derive_account_type</text>
  <text x="522" y="432" text-anchor="middle" font-size="13" fill="#6B7A8D">tenant override (not canon)</text>
  <line x1="654" y1="345" x2="720" y2="345" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Codebook (validates) -->
  <rect x="724" y="120" width="260" height="100" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="854" y="160" text-anchor="middle" font-size="19" font-weight="bold" fill="#0D1B2E">Codebook (UIAO_151)</text>
  <text x="854" y="190" text-anchor="middle" font-size="15" fill="#33414F">validates every derived value</text>
  <line x1="854" y1="222" x2="854" y2="288" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Assigner -->
  <rect x="724" y="290" width="260" height="110" rx="10" fill="#0D1B2E"/>
  <text x="854" y="335" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">OrgPathAssigner</text>
  <text x="854" y="368" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#EAF1FB">orgtree assess</text>

  <!-- Outputs -->
  <line x1="986" y1="320" x2="1052" y2="270" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="1056" y="210" width="170" height="100" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1141" y="252" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E8C8C">facet_values</text>
  <text x="1141" y="280" text-anchor="middle" font-size="14" fill="#33414F">ready to write</text>

  <line x1="986" y1="370" x2="1052" y2="420" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="1056" y="380" width="170" height="100" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="1141" y="422" text-anchor="middle" font-size="18" font-weight="bold" fill="#C0392B">findings</text>
  <text x="1141" y="450" text-anchor="middle" font-size="14" fill="#33414F">unmapped values</text>

  <text x="640" y="560" text-anchor="middle" font-size="17" fill="#5A5A5A">Tune the mapping until findings reach zero — then enable writeback (Guides 5 and 6).</text>
</svg>
