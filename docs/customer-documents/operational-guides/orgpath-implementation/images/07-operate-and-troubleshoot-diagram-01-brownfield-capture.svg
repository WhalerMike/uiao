<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · ice #EAF1FB · red #C0392B · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <text x="60" y="72" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">Brownfield capture — already-enrolled devices missing OrgPath</text>
  <text x="60" y="108" font-size="19" fill="#5A5A5A">A read-only scan of both planes; missing OrgPath surfaces as DRIFT-IDENTITY, then a proposed backfill.</text>

  <!-- Sources -->
  <rect x="40" y="210" width="180" height="66" rx="9" fill="#0D1B2E"/>
  <text x="130" y="238" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Entra devices</text>
  <text x="130" y="259" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#EAF1FB">Graph extAttr</text>
  <rect x="40" y="330" width="180" height="66" rx="9" fill="#0D1B2E"/>
  <text x="130" y="358" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Arc machines</text>
  <text x="130" y="379" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#EAF1FB">ARM tags</text>

  <!-- Inventory -->
  <line x1="222" y1="243" x2="256" y2="285" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="222" y1="363" x2="256" y2="318" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="260" y="240" width="180" height="120" rx="10" fill="#0D1B2E"/>
  <text x="350" y="286" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">uiao orgtree</text>
  <text x="350" y="310" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">inventory</text>
  <text x="350" y="336" text-anchor="middle" font-size="13" fill="#EAF1FB">(read-only scan)</text>

  <!-- Classify -->
  <line x1="440" y1="300" x2="476" y2="300" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="480" y="267" width="160" height="66" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="560" y="295" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">classify</text>
  <text x="560" y="316" text-anchor="middle" font-size="14" fill="#33414F">vs Codebook</text>

  <!-- Complete offshoot (skip) -->
  <line x1="560" y1="267" x2="560" y2="216" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="450" y="150" width="240" height="60" rx="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="570" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E8C8C">complete → skip</text>
  <text x="570" y="196" text-anchor="middle" font-size="13" fill="#33414F">already stamped</text>

  <!-- DRIFT-IDENTITY -->
  <line x1="640" y1="300" x2="676" y2="300" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="680" y="267" width="180" height="66" rx="9" fill="#0D1B2E"/>
  <text x="770" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">DRIFT-IDENTITY</text>
  <text x="770" y="315" text-anchor="middle" font-size="13" fill="#EAF1FB">partial / absent</text>

  <!-- Propose -->
  <line x1="860" y1="300" x2="896" y2="300" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="900" y="240" width="320" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1060" y="280" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">propose backfill</text>
  <text x="1060" y="310" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#33414F">asset-map → owner-map</text>
  <text x="1060" y="334" text-anchor="middle" font-size="14" fill="#33414F">validated vs Codebook</text>

  <!-- Outcomes -->
  <path d="M1000,360 L1000,460 L860,460 L860,516" fill="none" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="740" y="520" width="240" height="92" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="860" y="556" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E8C8C">resolved</text>
  <text x="860" y="586" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#33414F">backfill: assess --write</text>

  <path d="M1120,360 L1120,516" fill="none" stroke="#C0392B" stroke-width="3" marker-end="url(#arrow-red)"/>
  <rect x="1000" y="520" width="240" height="92" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="1120" y="556" text-anchor="middle" font-size="18" font-weight="bold" fill="#C0392B">unresolved</text>
  <text x="1120" y="586" text-anchor="middle" font-size="14" fill="#33414F">manual review</text>

  <!-- Footer -->
  <rect x="40" y="648" width="1200" height="48" rx="8" fill="#D7F2EE"/>
  <text x="640" y="678" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E8C8C">Read-only — backfill flows through assess --write; the reconcile loop re-trips DRIFT-IDENTITY on any regression.</text>
</svg>
