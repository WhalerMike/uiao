<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · amber #D4A017 (severity only) · red #C0392B -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="60" y="74" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#0D1B2E">Drift classification — per facet, by severity</text>
  <text x="60" y="108" font-size="20" fill="#5A5A5A">A governance pass validates each facet independently and classifies every divergence. Dry-run writes nothing.</text>

  <!-- Column headers -->
  <text x="80" y="160" font-size="16" font-weight="bold" fill="#6B7A8D">CLASS</text>
  <text x="360" y="160" font-size="16" font-weight="bold" fill="#6B7A8D">SEVERITY</text>
  <text x="560" y="160" font-size="16" font-weight="bold" fill="#6B7A8D">TRIGGER</text>
  <line x1="60" y1="172" x2="1220" y2="172" stroke="#E3E8EF" stroke-width="2"/>

  <!-- Row: Format P1 -->
  <rect x="60" y="186" width="270" height="58" rx="8" fill="#0D1B2E"/>
  <text x="195" y="221" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Format</text>
  <rect x="360" y="194" width="64" height="42" rx="6" fill="#D4A017"/>
  <text x="392" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">P1</text>
  <text x="450" y="221" font-size="17" fill="#33414F">Typed facet value fails its type / pattern</text>

  <!-- Row: Slot P1 -->
  <rect x="60" y="258" width="270" height="58" rx="8" fill="#0D1B2E"/>
  <text x="195" y="293" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Slot</text>
  <rect x="360" y="266" width="64" height="42" rx="6" fill="#D4A017"/>
  <text x="392" y="293" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">P1</text>
  <text x="450" y="293" font-size="17" fill="#33414F">Codebook integrity problem (slot collision)</text>

  <!-- Row: Value P2 -->
  <rect x="60" y="330" width="270" height="58" rx="8" fill="#0D1B2E"/>
  <text x="195" y="365" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Value</text>
  <rect x="360" y="338" width="64" height="42" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="392" y="365" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">P2</text>
  <text x="450" y="365" font-size="17" fill="#33414F">Enumerated value not in the Codebook</text>

  <!-- Row: Orphan P3 -->
  <rect x="60" y="402" width="270" height="58" rx="8" fill="#0D1B2E"/>
  <text x="195" y="437" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Orphan</text>
  <rect x="360" y="410" width="64" height="42" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="392" y="437" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">P3</text>
  <text x="450" y="437" font-size="17" fill="#33414F">Enumeration value with zero principals</text>

  <!-- Row: Phantom P3 -->
  <rect x="60" y="474" width="270" height="58" rx="8" fill="#0D1B2E"/>
  <text x="195" y="509" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Phantom</text>
  <rect x="360" y="482" width="64" height="42" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="392" y="509" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">P3</text>
  <text x="450" y="509" font-size="17" fill="#33414F">Deprecated value (auto-reassign if replaced_by)</text>

  <!-- Row: Identity (missing) -->
  <rect x="60" y="546" width="270" height="58" rx="8" fill="#1E8C8C"/>
  <text x="195" y="581" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Identity</text>
  <rect x="360" y="554" width="160" height="42" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="440" y="581" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E8C8C">DRIFT-IDENTITY</text>
  <text x="540" y="581" font-size="17" fill="#33414F">Missing OrgPath — the brownfield-capture signal</text>

  <!-- Halt note -->
  <rect x="850" y="186" width="370" height="130" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="870" y="220" font-size="17" font-weight="bold" fill="#0D1B2E">Halt-on-critical</text>
  <text x="870" y="250" font-size="15" fill="#33414F">A P1 finding stops the line —</text>
  <text x="870" y="274" font-size="15" fill="#33414F">remediation is suppressed until the</text>
  <text x="870" y="298" font-size="15" fill="#33414F">codebook-integrity problem is fixed.</text>
</svg>
