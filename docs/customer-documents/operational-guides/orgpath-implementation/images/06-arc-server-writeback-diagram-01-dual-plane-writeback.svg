<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · ice #EAF1FB · red #C0392B · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/>
    </marker>
  </defs>

  <text x="60" y="74" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#0D1B2E">Dual-plane device writeback</text>
  <text x="60" y="108" font-size="20" fill="#5A5A5A">A device's disposition routes its per-facet writes to Microsoft Graph or Azure Resource Manager.</text>

  <!-- Disposition hub -->
  <rect x="60" y="300" width="210" height="120" rx="10" fill="#0D1B2E"/>
  <text x="165" y="350" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">Device</text>
  <text x="165" y="380" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">disposition</text>

  <!-- Lane A: ENTRA-DEVICE -> Graph -->
  <text x="525" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#1E8C8C">ENTRA-DEVICE</text>
  <line x1="272" y1="330" x2="396" y2="216" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="400" y="162" width="250" height="108" rx="10" fill="#0D1B2E"/>
  <text x="525" y="200" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Graph transport</text>
  <text x="525" y="230" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#EAF1FB">graph.microsoft.com</text>
  <text x="525" y="250" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#EAF1FB">/.default</text>
  <line x1="650" y1="216" x2="710" y2="216" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="715" y="158" width="505" height="124" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="735" y="192" font-size="18" font-weight="bold" fill="#0D1B2E">Entra device object</text>
  <text x="735" y="222" font-family="Consolas, monospace" font-size="15" fill="#33414F">PATCH /devices/{id}</text>
  <text x="735" y="248" font-family="Consolas, monospace" font-size="15" fill="#33414F">onPremisesExtensionAttributes:</text>
  <text x="735" y="270" font-family="Consolas, monospace" font-size="15" fill="#33414F">  extensionAttribute1..10</text>

  <!-- Lane B: ARC-SERVER -> ARM -->
  <text x="525" y="378" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#1E8C8C">ARC-SERVER  ·  + 2 migration dispositions</text>
  <line x1="272" y1="390" x2="396" y2="446" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="400" y="392" width="250" height="108" rx="10" fill="#0D1B2E"/>
  <text x="525" y="430" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">ARM transport</text>
  <text x="525" y="460" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#EAF1FB">management.azure.com</text>
  <text x="525" y="480" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#EAF1FB">/.default</text>
  <line x1="650" y1="446" x2="710" y2="446" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="715" y="388" width="505" height="124" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="735" y="422" font-size="18" font-weight="bold" fill="#0D1B2E">Arc machine resource</text>
  <text x="735" y="452" font-family="Consolas, monospace" font-size="15" fill="#33414F">PATCH {resourceId}?api-version</text>
  <text x="735" y="478" font-family="Consolas, monospace" font-size="15" fill="#33414F">tags.Region, tags.Department,</text>
  <text x="735" y="500" font-family="Consolas, monospace" font-size="15" fill="#33414F">  tags.CostCenter ...</text>

  <!-- Lane C: skip -->
  <text x="525" y="566" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#5A5A5A">STAY-AD-DC  ·  DECOMMISSION</text>
  <line x1="262" y1="420" x2="396" y2="604" stroke="#5A5A5A" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-grey)"/>
  <rect x="400" y="578" width="250" height="64" rx="10" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
  <text x="525" y="616" text-anchor="middle" font-size="19" font-weight="bold" fill="#5A5A5A">skip — no write</text>

  <!-- Red note: distinct audiences -->
  <rect x="715" y="572" width="505" height="76" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="735" y="604" font-size="16" font-weight="bold" fill="#C0392B">Distinct token audiences</text>
  <text x="735" y="630" font-size="15" fill="#33414F">A Graph-audience token sent to ARM is rejected with HTTP 401.</text>
</svg>
