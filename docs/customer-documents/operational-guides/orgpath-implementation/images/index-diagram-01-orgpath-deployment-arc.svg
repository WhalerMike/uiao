<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO house style (ADR-093). navy #0D1B2E · teal #1E8C8C · ice #EAF1FB · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="84" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#0D1B2E">OrgPath deployment arc</text>
  <text x="60" y="120" font-size="20" fill="#5A5A5A">From an empty tenant to governed OrgPath on Intune devices and Arc servers. Read each guide in order.</text>

  <!-- Row 1: stages 1-4 -->
  <!-- 1 Prerequisites (navy) -->
  <rect x="60" y="190" width="250" height="120" rx="10" fill="#0D1B2E"/>
  <text x="185" y="232" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">1 · Prerequisites</text>
  <text x="185" y="266" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#EAF1FB">app reg + RBAC</text>
  <text x="185" y="288" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#EAF1FB">UIAO_ENTRA_*</text>
  <line x1="312" y1="250" x2="378" y2="250" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- 2 Codebook (navy) -->
  <rect x="382" y="190" width="250" height="120" rx="10" fill="#0D1B2E"/>
  <text x="507" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">2 · Codebook</text>
  <text x="507" y="276" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#EAF1FB">validate codebook</text>
  <line x1="634" y1="250" x2="700" y2="250" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- 3 Assess (navy) -->
  <rect x="704" y="190" width="250" height="120" rx="10" fill="#0D1B2E"/>
  <text x="829" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">3 · Assess</text>
  <text x="829" y="276" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#EAF1FB">orgtree assess</text>
  <line x1="956" y1="250" x2="1022" y2="250" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- 4 Govern (navy) -->
  <rect x="1026" y="190" width="194" height="120" rx="10" fill="#0D1B2E"/>
  <text x="1123" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">4 · Govern</text>
  <text x="1123" y="276" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#EAF1FB">govern (dry-run)</text>

  <!-- elbow connector down from stage 4 to stage 5 -->
  <path d="M1123,312 L1123,360 L185,360 L185,408" fill="none" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Row 2: stages 5-7 (writes = ice/cloud boxes) -->
  <!-- 5 Intune write (ice) -->
  <rect x="60" y="412" width="290" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="205" y="454" text-anchor="middle" font-size="20" font-weight="bold" fill="#0D1B2E">5 · Intune write</text>
  <text x="205" y="488" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#33414F">Graph extensionAttributes</text>
  <text x="205" y="510" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#33414F">assess --write (ENTRA-DEVICE)</text>
  <line x1="352" y1="472" x2="418" y2="472" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- 6 Arc write (ice) -->
  <rect x="422" y="412" width="290" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="567" y="454" text-anchor="middle" font-size="20" font-weight="bold" fill="#0D1B2E">6 · Arc write</text>
  <text x="567" y="488" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#33414F">ARM resource tags</text>
  <text x="567" y="510" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#33414F">assess --write (ARC-SERVER)</text>
  <line x1="714" y1="472" x2="780" y2="472" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- 7 Operate (navy) -->
  <rect x="784" y="412" width="290" height="120" rx="10" fill="#0D1B2E"/>
  <text x="929" y="454" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">7 · Operate</text>
  <text x="929" y="488" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#EAF1FB">console + reconcile loop</text>
  <text x="929" y="510" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#EAF1FB">inventory + govern</text>

  <!-- footer band -->
  <rect x="60" y="600" width="1160" height="56" rx="8" fill="#D7F2EE"/>
  <text x="640" y="634" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E8C8C">Read-only and dry-run by default — live writes happen only with --no-dry-run.</text>
</svg>
