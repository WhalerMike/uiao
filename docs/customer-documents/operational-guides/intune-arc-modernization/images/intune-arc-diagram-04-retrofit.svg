<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093). navy #0D1B2E · teal #1E8C8C · amber #D4A017 (HIGH only) · red #C0392B · ice #EAF1FB · mid #6B7A8D · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="64" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#0D1B2E">Adding OrgPath Later, Without Rebuilding</text>
  <text x="60" y="98" font-size="19" fill="#5A5A5A">The manually-built estate is adopted into governance &#8212; additive, not a migration.</text>

  <!-- Start state -->
  <rect x="50" y="300" width="220" height="120" rx="12" fill="#6B7A8D"/>
  <text x="160" y="346" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Manual estate</text>
  <text x="160" y="372" text-anchor="middle" font-size="13" fill="#FFFFFF">Arc + Intune built</text>
  <text x="160" y="392" text-anchor="middle" font-size="13" fill="#FFFFFF">audits in .\artifacts</text>
  <line x1="270" y1="360" x2="318" y2="360" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <!-- Step boxes -->
  <rect x="322" y="160" width="200" height="96" rx="10" fill="#0D1B2E"/>
  <text x="422" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">1 &#183; Inventory</text>
  <text x="422" y="220" text-anchor="middle" font-size="12.5" fill="#9FB6CF">tags, GPOs, CA,</text>
  <text x="422" y="238" text-anchor="middle" font-size="12.5" fill="#9FB6CF">audit CSVs</text>

  <rect x="322" y="312" width="200" height="96" rx="10" fill="#0D1B2E"/>
  <text x="422" y="348" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">2 &#183; Derive OrgPath</text>
  <text x="422" y="372" text-anchor="middle" font-size="12.5" fill="#9FB6CF">from tags / OUs /</text>
  <text x="422" y="390" text-anchor="middle" font-size="12.5" fill="#9FB6CF">owner groups</text>

  <rect x="322" y="464" width="200" height="96" rx="10" fill="#0D1B2E"/>
  <text x="422" y="500" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">3 &#183; Register (L0)</text>
  <text x="422" y="524" text-anchor="middle" font-size="12.5" fill="#9FB6CF">existing config as</text>
  <text x="422" y="542" text-anchor="middle" font-size="12.5" fill="#9FB6CF">desired state</text>

  <rect x="562" y="160" width="200" height="96" rx="10" fill="#0D1B2E"/>
  <text x="662" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">4 &#183; Stamp OrgPath</text>
  <text x="662" y="220" text-anchor="middle" font-size="12.5" fill="#9FB6CF">-WhatIf first; tag</text>
  <text x="662" y="238" text-anchor="middle" font-size="12.5" fill="#9FB6CF">write only (no-op agent)</text>

  <rect x="562" y="312" width="200" height="96" rx="10" fill="#1E8C8C"/>
  <text x="662" y="348" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">5 &#183; Observe (L1/L2)</text>
  <text x="662" y="372" text-anchor="middle" font-size="12.5" fill="#EAF1FB">drift loop on,</text>
  <text x="662" y="390" text-anchor="middle" font-size="12.5" fill="#EAF1FB">scoped by OrgPath</text>

  <rect x="562" y="464" width="200" height="96" rx="10" fill="#D4A017"/>
  <text x="662" y="500" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">6 &#183; Promote (L3)</text>
  <text x="662" y="524" text-anchor="middle" font-size="12.5" fill="#FFFFFF">add -OrgPath +</text>
  <text x="662" y="542" text-anchor="middle" font-size="12.5" fill="#FFFFFF">-ApprovalRef</text>

  <line x1="762" y1="360" x2="812" y2="360" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <!-- End state -->
  <rect x="816" y="300" width="220" height="120" rx="12" fill="#1E8C8C"/>
  <text x="926" y="346" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Governed estate</text>
  <text x="926" y="372" text-anchor="middle" font-size="13" fill="#EAF1FB">owner + approval</text>
  <text x="926" y="392" text-anchor="middle" font-size="13" fill="#EAF1FB">+ evidence + drift</text>

  <!-- Unchanged note -->
  <rect x="50" y="600" width="1180" height="70" rx="10" fill="#EAF1FB"/>
  <text x="640" y="632" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Unchanged: no device re-imaged, no server re-onboarded, no CA policy recreated.</text>
  <text x="640" y="656" text-anchor="middle" font-size="14" fill="#5A5A5A">The manual path was the first half of the governed path.</text>
</svg>
