<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093). navy #0D1B2E · teal #1E8C8C · amber #D4A017 (HIGH only) · red #C0392B · ice #EAF1FB · mid #6B7A8D · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/>
    </marker>
  </defs>

  <text x="60" y="64" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#0D1B2E">One Kit, Two Ways to Run It</text>
  <text x="60" y="98" font-size="19" fill="#5A5A5A">The same scripts. The governed path adds the binding from intent to change.</text>

  <!-- Manual path lane -->
  <rect x="50" y="150" width="540" height="430" rx="12" fill="#EAF1FB"/>
  <text x="80" y="190" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#0D1B2E">Manual path</text>
  <text x="80" y="216" font-size="15" fill="#5A5A5A">Operator owns the decision &#183; local change control</text>

  <rect x="90" y="244" width="460" height="64" rx="10" fill="#0D1B2E"/>
  <text x="320" y="278" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Preview with -WhatIf</text>
  <text x="320" y="298" text-anchor="middle" font-size="13" fill="#9FB6CF">see exactly what will change</text>
  <line x1="320" y1="312" x2="320" y2="352" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <rect x="90" y="356" width="460" height="64" rx="10" fill="#0D1B2E"/>
  <text x="320" y="390" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Run the script</text>
  <text x="320" y="410" text-anchor="middle" font-size="13" fill="#9FB6CF">no OrgPath, no approval reference</text>
  <line x1="320" y1="424" x2="320" y2="464" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <rect x="90" y="468" width="460" height="64" rx="10" fill="#1E8C8C"/>
  <text x="320" y="502" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Provider configured</text>
  <text x="320" y="522" text-anchor="middle" font-size="13" fill="#EAF1FB">Arc &#183; Intune &#183; NTLM &#183; SPN &#183; SQL &#183; CA</text>

  <!-- Governed path lane -->
  <rect x="690" y="150" width="540" height="430" rx="12" fill="#EAF1FB"/>
  <text x="720" y="190" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#0D1B2E">Governed path (UIAO / OrgPath)</text>
  <text x="720" y="216" font-size="15" fill="#5A5A5A">OrgPath owner &#183; recorded approval &#183; drift loop</text>

  <rect x="730" y="244" width="460" height="64" rx="10" fill="#0D1B2E"/>
  <text x="960" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Add -OrgPath + -ApprovalRef</text>
  <text x="960" y="294" text-anchor="middle" font-size="13" fill="#9FB6CF">bind change to intent + authority</text>
  <line x1="960" y1="312" x2="960" y2="352" stroke="#D4A017" stroke-width="4" marker-end="url(#arrow-amber)"/>

  <rect x="730" y="356" width="460" height="64" rx="10" fill="#0D1B2E"/>
  <text x="960" y="384" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Gated actuation (L3)</text>
  <text x="960" y="406" text-anchor="middle" font-size="13" fill="#9FB6CF">write refused without approval &#183; decision logged</text>
  <line x1="960" y1="424" x2="960" y2="464" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <rect x="730" y="468" width="460" height="64" rx="10" fill="#1E8C8C"/>
  <text x="960" y="502" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Provider configured</text>
  <text x="960" y="522" text-anchor="middle" font-size="13" fill="#EAF1FB">same end state &#183; plus owner, approval, evidence</text>

  <!-- Convergence note -->
  <text x="640" y="626" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Both converge on the same configuration.</text>
  <text x="640" y="650" text-anchor="middle" font-size="15" fill="#5A5A5A">Build manual now &#8594; retrofit OrgPath later without redoing the work.</text>
</svg>
