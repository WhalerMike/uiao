<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093). navy #0D1B2E · teal #1E8C8C · amber #D4A017 (HIGH only) · red #C0392B · ice #EAF1FB · mid #6B7A8D · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="64" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#0D1B2E">Control Plane Governs, Data Plane Executes</text>
  <text x="60" y="98" font-size="19" fill="#5A5A5A">UIAO holds desired state and reconciles; the providers run at runtime (ADR-092).</text>

  <!-- Control plane band -->
  <rect x="50" y="140" width="1180" height="180" rx="12" fill="#0D1B2E"/>
  <text x="80" y="178" font-family="Georgia, serif" font-size="23" font-weight="bold" fill="#FFFFFF">UIAO &#8212; control plane (truth + reconciliation)</text>
  <text x="80" y="204" font-size="14" fill="#9FB6CF">Unified Identity-Addressing-Overlay Architecture &#183; not an inline runtime component</text>

  <rect x="90" y="222" width="260" height="78" rx="10" fill="#1E8C8C"/>
  <text x="220" y="254" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Desired state (canon)</text>
  <text x="220" y="278" text-anchor="middle" font-size="13" fill="#EAF1FB">plan / apply / reconcile</text>

  <rect x="375" y="222" width="260" height="78" rx="10" fill="#1E8C8C"/>
  <text x="505" y="254" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Observe + classify drift</text>
  <text x="505" y="278" text-anchor="middle" font-size="13" fill="#EAF1FB">OrgTree drift engine (ADR-040)</text>

  <rect x="660" y="222" width="260" height="78" rx="10" fill="#1E8C8C"/>
  <text x="790" y="254" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">OrgPath addressing</text>
  <text x="790" y="278" text-anchor="middle" font-size="13" fill="#EAF1FB">carried on every object</text>

  <rect x="945" y="222" width="245" height="78" rx="10" fill="#1E8C8C"/>
  <text x="1067" y="254" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Evidence</text>
  <text x="1067" y="278" text-anchor="middle" font-size="13" fill="#EAF1FB">provenance-anchored</text>

  <!-- Management-surface arrows -->
  <line x1="270" y1="330" x2="270" y2="430" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <line x1="540" y1="330" x2="540" y2="430" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <line x1="810" y1="330" x2="810" y2="430" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <line x1="1075" y1="330" x2="1075" y2="430" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="640" y="380" text-anchor="middle" font-size="14" font-style="italic" fill="#5A5A5A">change-making calls to provider management surfaces only &#8212; never the runtime auth path</text>

  <!-- Data plane band -->
  <rect x="50" y="436" width="1180" height="210" rx="12" fill="#EAF1FB"/>
  <text x="80" y="474" font-family="Georgia, serif" font-size="23" font-weight="bold" fill="#0D1B2E">Provider data planes &#8212; execute at runtime</text>
  <text x="80" y="500" font-size="14" fill="#5A5A5A">incorporated, not replaced &#183; each remains the seat-holder in its slot</text>

  <rect x="90" y="520" width="260" height="100" rx="10" fill="#6B7A8D"/>
  <text x="220" y="556" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Microsoft Entra ID</text>
  <text x="220" y="582" text-anchor="middle" font-size="13" fill="#FFFFFF">authenticates</text>
  <text x="220" y="602" text-anchor="middle" font-size="13" fill="#FFFFFF">enforces Conditional Access</text>

  <rect x="375" y="520" width="260" height="100" rx="10" fill="#6B7A8D"/>
  <text x="505" y="556" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Microsoft Intune</text>
  <text x="505" y="582" text-anchor="middle" font-size="13" fill="#FFFFFF">enrolls endpoints</text>
  <text x="505" y="602" text-anchor="middle" font-size="13" fill="#FFFFFF">enforces device policy</text>

  <rect x="660" y="520" width="260" height="100" rx="10" fill="#6B7A8D"/>
  <text x="790" y="556" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Azure Policy / Arc</text>
  <text x="790" y="582" text-anchor="middle" font-size="13" fill="#FFFFFF">evaluates Guest Config</text>
  <text x="790" y="602" text-anchor="middle" font-size="13" fill="#FFFFFF">server baseline</text>

  <rect x="945" y="520" width="245" height="100" rx="10" fill="#6B7A8D"/>
  <text x="1067" y="556" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Active Directory</text>
  <text x="1067" y="582" text-anchor="middle" font-size="13" fill="#FFFFFF">issues Kerberos</text>
  <text x="1067" y="602" text-anchor="middle" font-size="13" fill="#FFFFFF">holds SPNs</text>
</svg>
