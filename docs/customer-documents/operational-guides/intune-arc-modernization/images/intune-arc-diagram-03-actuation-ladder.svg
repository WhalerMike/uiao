<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO blueprint (ADR-093). navy #0D1B2E · teal #1E8C8C · amber #D4A017 (HIGH only) · red #C0392B · ice #EAF1FB · mid #6B7A8D · grey #5A5A5A -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#0D1B2E">The Actuation Maturity Ladder</text>
  <text x="60" y="98" font-size="19" fill="#5A5A5A">Each operation declares a rung. The federal default write ceiling is L3 (ADR-092).</text>

  <!-- L0 -->
  <rect x="120" y="540" width="760" height="56" rx="8" fill="#EAF1FB"/>
  <rect x="120" y="540" width="120" height="56" rx="8" fill="#6B7A8D"/>
  <text x="180" y="575" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">L0</text>
  <text x="260" y="567" font-size="17" font-weight="bold" fill="#0D1B2E">Record</text>
  <text x="260" y="587" font-size="14" fill="#5A5A5A">desired state in canon only &#8212; the modernization spine table</text>

  <!-- L1 -->
  <rect x="120" y="468" width="800" height="56" rx="8" fill="#EAF1FB"/>
  <rect x="120" y="468" width="120" height="56" rx="8" fill="#1E8C8C"/>
  <text x="180" y="503" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">L1</text>
  <text x="260" y="495" font-size="17" font-weight="bold" fill="#0D1B2E">Observe</text>
  <text x="260" y="515" font-size="14" fill="#5A5A5A">collect actual state, detect drift (read-only) &#8212; the audits + drift report</text>

  <!-- L2 -->
  <rect x="120" y="396" width="840" height="56" rx="8" fill="#EAF1FB"/>
  <rect x="120" y="396" width="120" height="56" rx="8" fill="#1E8C8C"/>
  <text x="180" y="431" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">L2</text>
  <text x="260" y="423" font-size="17" font-weight="bold" fill="#0D1B2E">Advise</text>
  <text x="260" y="443" font-size="14" fill="#5A5A5A">generate the corrective change-set, surface it (no writes) &#8212; the -WhatIf previews</text>

  <!-- L3 (ceiling) -->
  <rect x="120" y="324" width="880" height="56" rx="8" fill="#FBEFD0"/>
  <rect x="120" y="324" width="120" height="56" rx="8" fill="#D4A017"/>
  <text x="180" y="359" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">L3</text>
  <text x="260" y="351" font-size="17" font-weight="bold" fill="#0D1B2E">Gated actuation</text>
  <text x="260" y="371" font-size="14" fill="#5A5A5A">a human approves; UIAO writes via the provider API &#8212; the kit's state-changing scripts</text>

  <!-- L4 (above ceiling) -->
  <rect x="120" y="232" width="920" height="56" rx="8" fill="#F7DDDA"/>
  <rect x="120" y="232" width="120" height="56" rx="8" fill="#C0392B"/>
  <text x="180" y="267" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">L4</text>
  <text x="260" y="259" font-size="17" font-weight="bold" fill="#C0392B">Autonomous</text>
  <text x="260" y="279" font-size="14" fill="#5A5A5A">the loop closes with no human &#8212; above the federal ceiling: refused in-boundary</text>

  <!-- ceiling marker -->
  <line x1="1030" y1="300" x2="1240" y2="300" stroke="#C0392B" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="1240" y="294" text-anchor="end" font-size="15" font-weight="bold" fill="#C0392B">federal write ceiling</text>

  <!-- upward arrow -->
  <text x="70" y="300" font-size="14" fill="#5A5A5A" transform="rotate(-90 70 300)">increasing autonomy &#8594;</text>
</svg>
