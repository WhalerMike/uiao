# AAN series — the FEDERAL edition's agency facts (directory metadata).
#
# Two editions render from this one source (OrgComp_Series_Expansion_Plan §11, author
# decision: "SSA-first now; extract a Federal-agnostic edition in a later pass").
# This is that pass.
#
#   FEDERAL edition  — the default. Quarto merges this file into every book in
#                      this directory, so `{{< meta agency.* >}}` resolves. This
#                      is the edition that publishes.
#
# This is _metadata.yml, NOT _quarto.yml, deliberately: docs/ is already a
# Quarto project, and a second _quarto.yml here would nest one project inside
# another. Directory metadata merges into the parent project instead.
#   SSA edition      — Pandoc only:
#                        python expand_meta.py _agency-ssa.yml <book>.qmd out.qmd
#                        pandoc out.qmd ... (see render_all_docx.sh --edition ssa)
#
# WHY THE SSA EDITION IS NOT A QUARTO PROFILE. Quarto only reads
# `_quarto-<profile>.yml` from the PROJECT directory. Once the books move under
# docs/, a `_quarto-ssa.yml` would have to sit in the public repo — which is
# exactly what "the SSA edition lives segregated in inbox until a Moderate-boundary
# GitHub exists" forbids. Pandoc's --metadata-file takes any path, so the SSA facts
# can stay outside the published tree. The file is deliberately NOT named
# `_quarto-ssa.yml`, so `--profile ssa` cannot silently activate it.
#
# FEDERAL IS THE DEFAULT ON PURPOSE. A render with no edition selected produces the
# generic edition. Forgetting the flag can never leak agency facts.
agency:
  # BARE proper noun. The workhorse: it stands where "SSA" stood, so it must
  # compose -- "Agency-wide", "Agency's estate", "Agency employees". An article
  # here would produce "the Agency-wide", which is why short != name.
  short: "Agency"
  full: "Agency"
  # Formal name WITH the acronym gloss on first use. Composing full + short by
  # hand yields "the Agency (Agency)" in this edition, which is why it is one key.
  formal: "Agency"
  domain: "agency.gov"
  tenant: "tenant.onmicrosoft.com"
  statute: "the agency's enabling statute"

# HTML format, stated rather than inherited.
#
# docs/_quarto.yml sets `theme: cosmo` project-wide. Only 4 of 58 books declared a
# theme, so the other 54 would have picked up cosmo SILENTLY on this move -- the
# look would change and nothing would say why. Joining the site theme is the right
# call now that the series publishes with the rest of the host site; inheriting it by
# accident is not. lz-style.css rides on top and still owns the AAN callout boxes
# (.aan-*), which Quarto does not style because the series owns those class names.
# Date Code rendering — authoring spec §1, "accurate to the minute".
#
# The spec used to say the frontmatter `date:` field takes the Date Code string
# verbatim because "Quarto accepts the string verbatim". It does not. Quarto
# parses `date:` before rendering, and "2026-07-08 16:07 ET" is not one of its
# accepted input formats, so every book's title block rendered the literal text
# "Invalid Date" — on all 63 published HTML pages, in the .docx volume bundles,
# and in the markdown kit. It had been that way since the series moved under
# docs/, on the third line of almost every document.
#
# The fix keeps the Date Code exactly as the spec defines it, and makes it
# parse: `date:` now carries ISO-8601 with the Eastern offset (an accepted input
# format), and this `date-format` renders it back to `YYYY-MM-DD HH:MM ET`.
# Bracketed text is a literal in Quarto's format strings, so [ET] emits "ET"
# rather than a timezone abbreviation Quarto would compute from the offset.
#
# WRITING A NEW DATE CODE: use -04:00 for Eastern Daylight Time (second Sunday
# in March to first Sunday in November) and -05:00 for Eastern Standard Time.
# The offset is part of the value, not derived, so it has to be right.
date-format: "YYYY-MM-DD HH:mm [ET]"

format:
  html:
    theme: cosmo
    css: lz-style.css
