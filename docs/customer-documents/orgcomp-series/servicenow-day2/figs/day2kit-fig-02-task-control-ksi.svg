<svg viewBox="0 0 1280 860" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="860" fill="#FFFFFF"/>
  <text x="640" y="36" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#0D1B2E">Each Task — Verb, Origin, Actuator, and the Controls and KSIs It Emits</text>
  <text x="640" y="58" text-anchor="middle" font-size="13" fill="#6B7A8D">Every catalog task maps to one MACD-R verb, an actuator, the NIST 800-53 control it closes, and the FedRAMP KSI it feeds</text>

  <!-- Column headers -->
  <rect x="30" y="76" width="1220" height="34" rx="5" fill="#0D1B2E"/>
  <text x="55"  y="98" font-size="12" font-weight="bold" fill="#FFFFFF">Task</text>
  <text x="360" y="98" font-size="12" font-weight="bold" fill="#FFFFFF">Verb</text>
  <text x="470" y="98" font-size="12" font-weight="bold" fill="#FFFFFF">Origin (SSOT)</text>
  <text x="700" y="98" font-size="12" font-weight="bold" fill="#FFFFFF">Actuator (via MID)</text>
  <text x="1010" y="98" font-size="12" font-weight="bold" fill="#FFFFFF">NIST control</text>
  <text x="1150" y="98" font-size="12" font-weight="bold" fill="#FFFFFF">KSI</text>

  <!-- rows: y baseline every 58 -->
  <!-- Row helper: alt shading via rects -->
  <g font-size="11.5" fill="#33414F">
    <!-- 1 Password reset -->
    <rect x="30" y="116" width="1220" height="56" fill="#EAF1FB"/>
    <text x="55" y="140" font-weight="bold" fill="#0D1B2E">Password reset</text>
    <text x="55" y="158" font-size="10" fill="#6B7A8D">re-proof, out-of-band delivery</text>
    <rect x="352" y="130" width="70" height="26" rx="4" fill="#D4A017"/><text x="387" y="147" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">Reset</text>
    <text x="470" y="147">ServiceNow catalog</text>
    <text x="700" y="147" font-family="Consolas, monospace" font-size="10.5">EntraHelpdeskClient.resetPassword</text>
    <text x="1010" y="147" font-weight="bold" fill="#1E8C8C">IA-5</text>
    <text x="1150" y="147" font-weight="bold" fill="#2E75B6">KSI-IAM</text>

    <!-- 2 MFA reset -->
    <rect x="30" y="172" width="1220" height="56" fill="#FFFFFF"/>
    <text x="55" y="196" font-weight="bold" fill="#0D1B2E">MFA method reset</text>
    <text x="55" y="214" font-size="10" fill="#C0392B">takeover verb — proof + alert</text>
    <rect x="352" y="186" width="70" height="26" rx="4" fill="#D4A017"/><text x="387" y="203" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">Reset</text>
    <text x="470" y="203">ServiceNow catalog</text>
    <text x="700" y="203" font-family="Consolas, monospace" font-size="10.5">EntraHelpdeskClient.resetMfaMethod</text>
    <text x="1010" y="203" font-weight="bold" fill="#1E8C8C">IA-5 · IA-2</text>
    <text x="1150" y="203" font-weight="bold" fill="#2E75B6">KSI-IAM</text>

    <!-- 3 Joiner -->
    <rect x="30" y="228" width="1220" height="56" fill="#EAF1FB"/>
    <text x="55" y="252" font-weight="bold" fill="#0D1B2E">New account (joiner)</text>
    <text x="55" y="270" font-size="10" fill="#6B7A8D">entitlements derived, not picked</text>
    <rect x="352" y="242" width="70" height="26" rx="4" fill="#0D1B2E"/><text x="387" y="259" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">Add</text>
    <text x="470" y="259">HR joiner event</text>
    <text x="700" y="259" font-family="Consolas, monospace" font-size="10.5">EntraHelpdeskClient.createUser</text>
    <text x="1010" y="259" font-weight="bold" fill="#1E8C8C">AC-2 · IA-4</text>
    <text x="1150" y="259" font-weight="bold" fill="#2E75B6">KSI-IAM</text>

    <!-- 4 Mover -->
    <rect x="30" y="284" width="1220" height="56" fill="#FFFFFF"/>
    <text x="55" y="308" font-weight="bold" fill="#0D1B2E">Role/scope change (mover)</text>
    <text x="55" y="326" font-size="10" fill="#6B7A8D">remove stale entitlements</text>
    <rect x="352" y="298" width="70" height="26" rx="4" fill="#0D1B2E"/><text x="387" y="315" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">Move</text>
    <text x="470" y="315">HR mover event</text>
    <text x="700" y="315" font-family="Consolas, monospace" font-size="10.5">re-derive groups / licenses</text>
    <text x="1010" y="315" font-weight="bold" fill="#1E8C8C">AC-6 · AC-2</text>
    <text x="1150" y="315" font-weight="bold" fill="#2E75B6">KSI-IAM</text>

    <!-- 5 Leaver -->
    <rect x="30" y="340" width="1220" height="56" fill="#EAF1FB"/>
    <text x="55" y="364" font-weight="bold" fill="#0D1B2E">De-provision (leaver)</text>
    <text x="55" y="382" font-size="10" fill="#6B7A8D">revoke sessions + non-human estate</text>
    <rect x="352" y="354" width="82" height="26" rx="4" fill="#C0392B"/><text x="393" y="371" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">Deletion</text>
    <text x="470" y="371">HR leaver event</text>
    <text x="700" y="371" font-family="Consolas, monospace" font-size="10.5">EntraHelpdeskClient.disableUser</text>
    <text x="1010" y="371" font-weight="bold" fill="#1E8C8C">AC-2 · AC-2(3)</text>
    <text x="1150" y="371" font-weight="bold" fill="#2E75B6">KSI-IAM</text>

    <!-- 6 Group membership -->
    <rect x="30" y="396" width="1220" height="56" fill="#FFFFFF"/>
    <text x="55" y="420" font-weight="bold" fill="#0D1B2E">Group membership</text>
    <text x="55" y="438" font-size="10" fill="#6B7A8D">privileged grant carries an expiry</text>
    <rect x="352" y="410" width="70" height="26" rx="4" fill="#1E8C8C"/><text x="387" y="427" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">Change</text>
    <text x="470" y="427">SAM decision / catalog</text>
    <text x="700" y="427" font-family="Consolas, monospace" font-size="10.5">EntraHelpdeskClient.addGroupMember</text>
    <text x="1010" y="427" font-weight="bold" fill="#1E8C8C">AC-6</text>
    <text x="1150" y="427" font-weight="bold" fill="#2E75B6">KSI-IAM</text>

    <!-- 7 Azure RBAC -->
    <rect x="30" y="452" width="1220" height="56" fill="#EAF1FB"/>
    <text x="55" y="476" font-weight="bold" fill="#0D1B2E">Azure RBAC grant</text>
    <text x="55" y="494" font-size="10" fill="#6B7A8D">resource plane, least-privilege role</text>
    <rect x="352" y="466" width="70" height="26" rx="4" fill="#1E8C8C"/><text x="387" y="483" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">Change</text>
    <text x="470" y="483">SAM decision (Tier-1/2)</text>
    <text x="700" y="483" font-family="Consolas, monospace" font-size="10.5">AzureArmClient.assignRbacRole</text>
    <text x="1010" y="483" font-weight="bold" fill="#1E8C8C">AC-6</text>
    <text x="1150" y="483" font-weight="bold" fill="#2E75B6">KSI-IAM</text>

    <!-- 8 License -->
    <rect x="30" y="508" width="1220" height="56" fill="#FFFFFF"/>
    <text x="55" y="532" font-weight="bold" fill="#0D1B2E">License assignment</text>
    <text x="55" y="550" font-size="10" fill="#6B7A8D">group-based licensing preferred</text>
    <rect x="352" y="522" width="70" height="26" rx="4" fill="#1E8C8C"/><text x="387" y="539" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">Change</text>
    <text x="470" y="539">manager / SAM RITM</text>
    <text x="700" y="539" font-family="Consolas, monospace" font-size="10.5">EntraHelpdeskClient.assignLicense</text>
    <text x="1010" y="539" font-weight="bold" fill="#1E8C8C">AC-2</text>
    <text x="1150" y="539" font-weight="bold" fill="#2E75B6">KSI-IAM</text>

    <!-- 9 Guest invite -->
    <rect x="30" y="564" width="1220" height="56" fill="#EAF1FB"/>
    <text x="55" y="588" font-weight="bold" fill="#0D1B2E">Guest / B2B invite</text>
    <text x="55" y="606" font-size="10" fill="#6B7A8D">sponsor + expiry</text>
    <rect x="352" y="578" width="70" height="26" rx="4" fill="#0D1B2E"/><text x="387" y="595" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">Add</text>
    <text x="470" y="595">sponsor + security</text>
    <text x="700" y="595" font-family="Consolas, monospace" font-size="10.5">EntraHelpdeskClient.inviteGuest</text>
    <text x="1010" y="595" font-weight="bold" fill="#1E8C8C">AC-2</text>
    <text x="1150" y="595" font-weight="bold" fill="#2E75B6">KSI-IAM</text>

    <!-- 10 Admin consent -->
    <rect x="30" y="620" width="1220" height="56" fill="#FFFFFF"/>
    <text x="55" y="644" font-weight="bold" fill="#0D1B2E">Admin consent (SaaS)</text>
    <text x="55" y="662" font-size="10" fill="#6B7A8D">verdict recorded before configure</text>
    <rect x="352" y="634" width="70" height="26" rx="4" fill="#1E8C8C"/><text x="387" y="651" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">Change</text>
    <text x="470" y="651">Lane F integration request</text>
    <text x="700" y="651" font-family="Consolas, monospace" font-size="10.5">Day2NativeActuator (SA-9 verdict)</text>
    <text x="1010" y="651" font-weight="bold" fill="#1E8C8C">AC-20 · SA-9</text>
    <text x="1150" y="651" font-weight="bold" fill="#2E75B6">KSI-SCR</text>

    <!-- 11 Morning check / logs -->
    <rect x="30" y="676" width="1220" height="56" fill="#EAF1FB"/>
    <text x="55" y="700" font-weight="bold" fill="#0D1B2E">Morning check / logs</text>
    <text x="55" y="718" font-size="10" fill="#6B7A8D">scheduled read-only probe</text>
    <rect x="352" y="690" width="86" height="26" rx="4" fill="#5A5A5A"/><text x="395" y="707" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Evidence</text>
    <text x="470" y="707">scheduled probe</text>
    <text x="700" y="707" font-family="Consolas, monospace" font-size="10.5">read-only clients &#8594; evidence table</text>
    <text x="1010" y="707" font-weight="bold" fill="#1E8C8C">CA-7 · AU-6</text>
    <text x="1150" y="707" font-weight="bold" fill="#2E75B6">KSI-MLA</text>
  </g>

  <!-- verb legend -->
  <text x="55" y="762" font-size="11" font-weight="bold" fill="#5A5A5A">MACD-R verbs:</text>
  <rect x="165" y="750" width="46" height="20" rx="4" fill="#0D1B2E"/><text x="188" y="764" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Add</text>
  <rect x="221" y="750" width="52" height="20" rx="4" fill="#0D1B2E"/><text x="247" y="764" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Move</text>
  <rect x="283" y="750" width="60" height="20" rx="4" fill="#1E8C8C"/><text x="313" y="764" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Change</text>
  <rect x="353" y="750" width="66" height="20" rx="4" fill="#C0392B"/><text x="386" y="764" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Deletion</text>
  <rect x="429" y="750" width="52" height="20" rx="4" fill="#D4A017"/><text x="455" y="764" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Reset</text>

  <rect x="30" y="792" width="1220" height="44" rx="8" fill="#EAF1FB" stroke="#E3E8EF" stroke-width="1"/>
  <text x="640" y="814" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0D1B2E">The control and the KSI are not added after the task — the task's evidenced closure is what emits them, automatically.</text>
  <text x="640" y="830" text-anchor="middle" font-size="10.5" fill="#6B7A8D">Every actuation is Microsoft Graph or ARM through the in-boundary MID Server, under a just-in-time role — never standing admin.</text>
</svg>
