<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1180" height="620" fill="#FFFFFF"/>
  <defs><marker id="a-navy" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#0D1B2E"/></marker><marker id="a-teal" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#1E8C8C"/></marker><marker id="a-blue" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#2E75B6"/></marker></defs>
  <rect x="0" y="0" width="1180" height="66" fill="#0D1B2E"/>
  <text x="40" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#FFFFFF">Morning Check / Log Review</text>
  <text x="40" y="52" font-size="12.5" fill="#D7F2EE">2027 Target state &#183; MACD-R verb: Evidence &#183; flow key saas.audit.review</text>
  <rect x="910" y="16" width="127" height="34" rx="6" fill="#2E75B6"/>
  <text x="974" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">CA-7 · AU-6</text>
  <rect x="1049" y="16" width="91" height="34" rx="6" fill="#1E8C8C"/>
  <text x="1094" y="38" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">KSI-MLA</text>
  <text x="40" y="96" font-size="12.5" font-weight="bold" fill="#5A5A5A">ORIGIN &#8594; GOVERN &#8594; ACTUATE (cloud-native) &#8594; VERIFY &#8594; EVIDENCE</text>
  <rect x="40" y="112" width="200" height="150" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="140" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0D1B2E">1 &#183; Origin</text>
    <text x="140" y="158" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#33414F">Scheduled probe</text>
  <text x="140" y="174" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#33414F">(not a request)</text>
  <text x="140" y="190" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#33414F">read-only, cloud estate</text>
  <rect x="264" y="112" width="200" height="150" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="364" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0D1B2E">2 &#183; Govern</text>
  <rect x="280" y="150" width="168" height="30" rx="5" fill="#0D1B2E"/><text x="364" y="170" text-anchor="middle" font-size="9.5" fill="#FFFFFF">Authorize &#8212; SoD (CM-5)</text>
  <rect x="280" y="184" width="168" height="30" rx="5" fill="#0D1B2E"/><text x="364" y="204" text-anchor="middle" font-size="9.5" fill="#FFFFFF">Elevate &#8212; PIM/PAG (AC-6)</text>
  <rect x="280" y="218" width="168" height="34" rx="5" fill="#2E75B6"/>
  <text x="364" y="233" text-anchor="middle" font-size="9" fill="#FFFFFF">Router: cloud-only object</text>
  <text x="364" y="246" text-anchor="middle" font-size="9" fill="#D7F2EE">&#8594; Graph/ARM leg only</text>
  <text x="700" y="104" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5A5A5A">3 &#183; Actuate &#8212; cloud-native, one leg</text>
  <rect x="488" y="112" width="424" height="90" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <rect x="488" y="112" width="10" height="90" rx="4" fill="#2E75B6"/>
  <text x="508" y="132" font-size="11" font-weight="bold" fill="#0D1B2E">Read-only leg — Entra / Azure reads</text>
  <text x="508" y="150" font-size="9.5" fill="#33414F">query recent lifecycle/auth events in Entra and Azure; no writes</text>
  <text x="508" y="167" font-size="9.5" fill="#33414F">reconcile the estate to the evidence table and the CMDB</text>
  <text x="508" y="184" font-size="9" fill="#6B7A8D">the only routine that writes nothing — it emits evidence, it does not actuate</text>
  <rect x="488" y="210" width="424" height="52" rx="8" fill="#EAF1FB" stroke="#D4A017" stroke-width="1"/>
  <text x="508" y="231" font-size="10" font-weight="bold" fill="#7A5B00">No AD leg</text>
  <text x="508" y="249" font-size="9.5" fill="#7A5B00">with a cloud-native estate there is no AD plane to read; monitoring is Entra/Azure only.</text>
  <rect x="936" y="112" width="204" height="150" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="1038" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0D1B2E">4 &#183; Verify</text>
    <text x="1038" y="160" text-anchor="middle" font-size="10" font-weight="normal" fill="#33414F">the check IS the</text>
  <text x="1038" y="174" text-anchor="middle" font-size="10" font-weight="normal" fill="#33414F">verification — deltas</text>
  <text x="1038" y="188" text-anchor="middle" font-size="10" font-weight="normal" fill="#33414F">become tasks / findings</text>
  <text x="1038" y="234" text-anchor="middle" font-size="9.5" fill="#C0392B">silence is not</text>
  <text x="1038" y="248" text-anchor="middle" font-size="9.5" fill="#C0392B">assurance — read it</text>
  <rect x="40" y="300" width="1100" height="150" rx="10" fill="#0D1B2E"/>
  <text x="70" y="332" font-size="14" font-weight="bold" fill="#FFFFFF">5 &#183; Evidence &#8212; the closure the attestation pipeline reads</text>
  <text x="70" y="358" font-size="11" fill="#D7F2EE">One write-once record per run: what was read, the deltas found, and the tasks/findings opened from them</text>
  <text x="70" y="376" font-size="11" fill="#D7F2EE">— the continuous-monitoring heartbeat. A quiet morning is only evidence once it is actually observed.</text>
  <rect x="70" y="392" width="500" height="40" rx="6" fill="#1E8C8C"/>
  <text x="320" y="417" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">Emits NIST CA-7 / AU-6</text>
  <rect x="586" y="392" width="484" height="40" rx="6" fill="#2E75B6"/>
  <text x="828" y="417" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">Feeds KSI-MLA — continuous monitoring + log review</text>
  <line x1="240" y1="187" x2="262" y2="187" stroke="#0D1B2E" stroke-width="2" marker-end="url(#a-navy)"/>
  <line x1="464" y1="157" x2="486" y2="157" stroke="#2E75B6" stroke-width="2" marker-end="url(#a-blue)"/>
  <line x1="912" y1="157" x2="934" y2="157" stroke="#1E8C8C" stroke-width="2" marker-end="url(#a-teal)"/>
  <line x1="590" y1="262" x2="590" y2="298" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <text x="590" y="480" text-anchor="middle" font-size="11" font-style="italic" fill="#6B7A8D">Morning check in the target state: read the cloud estate, reconcile to the evidence store, and open work from the deltas — no writes.</text>
  </svg>
