<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="ah-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#1E8C8C"/></marker>
    <marker id="ah-navy" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#0D1B2E"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#C0392B"/></marker>
  </defs>

  <text x="640" y="34" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#0D1B2E">OrgComp Day-2 Kit — Input to Estate to Evidence</text>
  <text x="640" y="56" text-anchor="middle" font-size="13" fill="#6B7A8D">From a SAM or ServiceNow request, through the in-boundary MID to Entra/Azure, to emitted NIST controls and FedRAMP KSIs</text>

  <!-- Column headers -->
  <text x="150" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#5A5A5A">1 · ORIGIN (SSOT)</text>
  <text x="470" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#5A5A5A">2 · ORCHESTRATE (x_fed_day2_ops)</text>
  <text x="820" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#5A5A5A">3 · ACTUATE (in-boundary)</text>
  <text x="1120" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#5A5A5A">4 · EMIT (evidence)</text>

  <!-- ORIGIN -->
  <rect x="40" y="110" width="220" height="86" rx="8" fill="#0D1B2E"/>
  <text x="150" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">SAM — SailPoint IdentityIQ</text>
  <text x="150" y="156" text-anchor="middle" font-size="10.5" fill="#D7F2EE">Tier-1/2 access decision + approval</text>
  <text x="150" y="172" text-anchor="middle" font-size="10.5" fill="#D7F2EE">SDIM pushes the RITM (IIQ-push)</text>
  <text x="150" y="188" text-anchor="middle" font-size="10" fill="#A9B8CA">clause 1–2 · AC-2 / AC-5</text>

  <rect x="40" y="212" width="220" height="86" rx="8" fill="#0D1B2E"/>
  <text x="150" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">ServiceNow catalog</text>
  <text x="150" y="258" text-anchor="middle" font-size="10.5" fill="#D7F2EE">Lower-tier request (reset, unlock)</text>
  <text x="150" y="274" text-anchor="middle" font-size="10.5" fill="#D7F2EE">or HR joiner/mover/leaver event</text>
  <text x="150" y="290" text-anchor="middle" font-size="10" fill="#A9B8CA">clause 1 · the form is the contract</text>

  <text x="150" y="330" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6B7A8D">SSOT-originated — no SSOT record,</text>
  <text x="150" y="345" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6B7A8D">no valid request (fail closed)</text>

  <!-- ORCHESTRATE: five MACD-R clauses -->
  <rect x="320" y="108" width="300" height="300" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="470" y="128" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0D1B2E">MACD-R lifecycle — every task, in order</text>

  <rect x="338" y="140" width="264" height="40" rx="6" fill="#0D1B2E"/>
  <text x="352" y="158" font-size="11.5" font-weight="bold" fill="#FFFFFF">2 · Authorize</text>
  <text x="352" y="173" font-size="10" fill="#D7F2EE">SoD: requester &#8800; approver (CM-5)</text>

  <rect x="338" y="187" width="264" height="40" rx="6" fill="#0D1B2E"/>
  <text x="352" y="205" font-size="11.5" font-weight="bold" fill="#FFFFFF">3 · Elevate (PIM / PAG)</text>
  <text x="352" y="220" font-size="10" fill="#D7F2EE">JIT, time-boxed — no id, no actuation (AC-6)</text>

  <rect x="338" y="234" width="264" height="40" rx="6" fill="#1E8C8C"/>
  <text x="352" y="252" font-size="11.5" font-weight="bold" fill="#FFFFFF">4 · Actuate</text>
  <text x="352" y="267" font-size="10" fill="#EAF1FB">Graph / ARM via the MID (never standing admin)</text>

  <rect x="338" y="281" width="264" height="40" rx="6" fill="#0D1B2E"/>
  <text x="352" y="299" font-size="11.5" font-weight="bold" fill="#FFFFFF">4 · Verify</text>
  <text x="352" y="314" font-size="10" fill="#D7F2EE">re-read state — a 2xx is not closure</text>

  <rect x="338" y="328" width="264" height="40" rx="6" fill="#0D1B2E"/>
  <text x="352" y="346" font-size="11.5" font-weight="bold" fill="#FFFFFF">5 · Evidence</text>
  <text x="352" y="361" font-size="10" fill="#D7F2EE">request + approver + PIM id + verdict (CM-3/AU-2)</text>

  <text x="470" y="392" text-anchor="middle" font-size="10" fill="#C0392B">Stops at the first failing clause — a refused task is evidence too</text>

  <!-- ACTUATE: MID + estate -->
  <rect x="686" y="150" width="268" height="34" rx="6" fill="#1E8C8C"/>
  <text x="820" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">In-boundary MID Server</text>

  <rect x="686" y="206" width="268" height="76" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="820" y="230" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0D1B2E">Entra ID — Microsoft Graph</text>
  <text x="820" y="250" text-anchor="middle" font-size="10.5" fill="#33414F">JML, credential reset, group/license,</text>
  <text x="820" y="266" text-anchor="middle" font-size="10.5" fill="#33414F">app consent, guest — least privilege</text>

  <rect x="686" y="296" width="268" height="76" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="820" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0D1B2E">Azure — Resource Manager (ARM)</text>
  <text x="820" y="340" text-anchor="middle" font-size="10.5" fill="#33414F">RBAC assignment on the resource plane,</text>
  <text x="820" y="356" text-anchor="middle" font-size="10.5" fill="#33414F">custom least-privilege role only</text>

  <text x="820" y="396" text-anchor="middle" font-size="10" fill="#6B7A8D">Estate is actuated, never an origination surface</text>

  <!-- EMIT: evidence -> controls + KSIs -->
  <rect x="1010" y="150" width="230" height="40" rx="6" fill="#2E75B6"/>
  <text x="1125" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Evidence store</text>
  <text x="1125" y="183" text-anchor="middle" font-size="10" fill="#EAF1FB">closure stream (write-once)</text>

  <rect x="1010" y="210" width="230" height="80" rx="8" fill="#1E8C8C"/>
  <text x="1125" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">NIST SP 800-53 controls</text>
  <text x="1125" y="254" text-anchor="middle" font-size="10.5" fill="#EAF1FB">AC-2 · AC-6 · IA-2 · IA-4 · IA-5</text>
  <text x="1125" y="270" text-anchor="middle" font-size="10.5" fill="#EAF1FB">AC-20 · SA-9 · AU-2 · CM-3</text>
  <text x="1125" y="285" text-anchor="middle" font-size="10" fill="#D7F2EE">closed by an owned, evidenced trail</text>

  <rect x="1010" y="300" width="230" height="72" rx="8" fill="#1E8C8C"/>
  <text x="1125" y="324" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">FedRAMP 20x KSIs</text>
  <text x="1125" y="344" text-anchor="middle" font-size="10.5" fill="#EAF1FB">KSI-IAM · KSI-MLA · KSI-SCR</text>
  <text x="1125" y="362" text-anchor="middle" font-size="10" fill="#D7F2EE">emitted to the ConMon pipeline</text>

  <text x="1125" y="396" text-anchor="middle" font-size="10" fill="#6B7A8D">Vol VII Book 04 attestation reads the stream</text>

  <!-- Arrows between columns -->
  <line x1="262" y1="155" x2="316" y2="200" stroke="#0D1B2E" stroke-width="2" marker-end="url(#ah-navy)"/>
  <line x1="262" y1="255" x2="316" y2="230" stroke="#0D1B2E" stroke-width="2" marker-end="url(#ah-navy)"/>
  <line x1="622" y1="254" x2="682" y2="167" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ah-teal)"/>
  <line x1="820" y1="184" x2="820" y2="204" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ah-teal)"/>
  <line x1="956" y1="244" x2="1006" y2="230" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ah-teal)"/>
  <line x1="1125" y1="190" x2="1125" y2="208" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ah-teal)"/>
  <line x1="1125" y1="290" x2="1125" y2="298" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ah-teal)"/>

  <!-- footer band -->
  <rect x="40" y="640" width="1200" height="48" rx="8" fill="#EAF1FB" stroke="#E3E8EF" stroke-width="1"/>
  <text x="640" y="662" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0D1B2E">SAM decides · ServiceNow orchestrates + evidences · Entra/Azure actuate via the in-boundary MID · the closure emits the controls and KSIs</text>
  <text x="640" y="680" text-anchor="middle" font-size="10.5" fill="#6B7A8D">FedRAMP Moderate / Microsoft GCC Moderate · least privilege, just-in-time, evidenced — no standing admin</text>
</svg>
