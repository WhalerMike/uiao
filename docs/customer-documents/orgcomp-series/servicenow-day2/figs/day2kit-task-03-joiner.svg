<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1180" height="620" fill="#FFFFFF"/>
  <defs><marker id="a-navy" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#0D1B2E"/></marker><marker id="a-teal" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#1E8C8C"/></marker><marker id="a-blue" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#2E75B6"/></marker></defs>
  <rect x="0" y="0" width="1180" height="66" fill="#0D1B2E"/>
  <text x="40" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#FFFFFF">New Account (Joiner)</text>
  <text x="40" y="52" font-size="12.5" fill="#D7F2EE">Current state &#183; MACD-R verb: Add &#183; flow key entra.jml.joiner</text>
  <rect x="957" y="16" width="80" height="34" rx="6" fill="#2E75B6"/>
  <text x="997" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">AC-2</text>
  <rect x="1049" y="16" width="91" height="34" rx="6" fill="#1E8C8C"/>
  <text x="1094" y="38" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">KSI-IAM</text>
  <text x="40" y="96" font-size="12.5" font-weight="bold" fill="#5A5A5A">ORIGIN &#8594; GOVERN &#8594; ACTUATE (split) &#8594; VERIFY &#8594; EVIDENCE</text>
  <rect x="40" y="112" width="200" height="150" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="140" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0D1B2E">1 &#183; Origin</text>
    <text x="140" y="158" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#33414F">Joiner event in AD</text>
  <text x="140" y="174" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#33414F">(HR/agency process)</text>
  <text x="140" y="190" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#33414F">entitlements derived by role</text>
  <rect x="56" y="222" width="168" height="30" rx="5" fill="#FCF3D9" stroke="#D4A017" stroke-width="1"/>
  <text x="140" y="242" text-anchor="middle" font-size="9" fill="#7A5B00">2027: OPM-HRIT joiner</text>
  <rect x="264" y="112" width="200" height="150" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="364" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0D1B2E">2 &#183; Govern</text>
  <rect x="280" y="150" width="168" height="30" rx="5" fill="#0D1B2E"/><text x="364" y="170" text-anchor="middle" font-size="9.5" fill="#FFFFFF">Authorize &#8212; SoD (CM-5)</text>
  <rect x="280" y="184" width="168" height="30" rx="5" fill="#0D1B2E"/><text x="364" y="204" text-anchor="middle" font-size="9.5" fill="#FFFFFF">Elevate &#8212; PIM/PAG (AC-6)</text>
  <rect x="280" y="218" width="168" height="34" rx="5" fill="#2E75B6"/>
  <text x="364" y="233" text-anchor="middle" font-size="9" fill="#FFFFFF">Router: synced object?</text>
  <text x="364" y="246" text-anchor="middle" font-size="9" fill="#D7F2EE">yes &#8594; both legs below</text>
  <text x="700" y="104" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5A5A5A">3 &#183; Actuate &#8212; the write splits</text>
  <rect x="488" y="112" width="424" height="74" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <rect x="488" y="112" width="10" height="74" rx="4" fill="#1E8C8C"/>
  <text x="508" y="132" font-size="11" font-weight="bold" fill="#0D1B2E">AD leg (AdHybridClient) — create the account</text>
  <text x="508" y="150" font-size="9.5" fill="#33414F">New-ADUser in the role's OU, owner + least-privilege baseline, on the DC</text>
  <text x="508" y="167" font-size="9.5" fill="#2E75B6">→ Entra Connect sync projects the new user into Entra</text>
  <text x="508" y="181" font-size="9" fill="#6B7A8D">the account is born in AD for a synced estate — Entra is its projection</text>
  <rect x="488" y="194" width="424" height="68" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <rect x="488" y="194" width="10" height="68" rx="4" fill="#2E75B6"/>
  <text x="508" y="214" font-size="11" font-weight="bold" fill="#0D1B2E">Graph leg — after the object appears in Entra</text>
  <text x="508" y="232" font-size="9.5" fill="#33414F">assign license + cloud-only / M365 groups by role (not hand-picked)</text>
  <text x="508" y="249" font-size="9" fill="#6B7A8D">cloud entitlements attach once the synced object exists in Entra</text>
  <rect x="936" y="112" width="204" height="150" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="1038" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0D1B2E">4 &#183; Verify</text>
    <text x="1038" y="160" text-anchor="middle" font-size="10" font-weight="normal" fill="#33414F">re-read AD: object in the</text>
  <text x="1038" y="174" text-anchor="middle" font-size="10" font-weight="normal" fill="#33414F">right OU; re-read Entra:</text>
  <text x="1038" y="188" text-anchor="middle" font-size="10" font-weight="normal" fill="#33414F">synced, license applied</text>
  <text x="1038" y="234" text-anchor="middle" font-size="9.5" fill="#C0392B">a dispatch is not</text>
  <text x="1038" y="248" text-anchor="middle" font-size="9.5" fill="#C0392B">closure — observe it</text>
  <rect x="40" y="300" width="1100" height="150" rx="10" fill="#0D1B2E"/>
  <text x="70" y="332" font-size="14" font-weight="bold" fill="#FFFFFF">5 &#183; Evidence &#8212; the closure the attestation pipeline reads</text>
  <text x="70" y="358" font-size="11" fill="#D7F2EE">One write-once record: the joiner origin + approver + PIM id + AD create + sync confirmation + cloud entitlements</text>
  <text x="70" y="376" font-size="11" fill="#D7F2EE">+ the verify verdict. Entitlements are derived from the role, never picked ad hoc.</text>
  <rect x="70" y="392" width="500" height="40" rx="6" fill="#1E8C8C"/>
  <text x="320" y="417" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">Emits NIST AC-2 / IA-4</text>
  <rect x="586" y="392" width="484" height="40" rx="6" fill="#2E75B6"/>
  <text x="828" y="417" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">Feeds KSI-IAM — provisioned to least privilege, owned</text>
  <line x1="240" y1="187" x2="262" y2="187" stroke="#0D1B2E" stroke-width="2" marker-end="url(#a-navy)"/>
  <line x1="464" y1="170" x2="486" y2="150" stroke="#2E75B6" stroke-width="2" marker-end="url(#a-blue)"/>
  <line x1="464" y1="200" x2="486" y2="225" stroke="#2E75B6" stroke-width="2" marker-end="url(#a-blue)"/>
  <line x1="912" y1="150" x2="934" y2="165" stroke="#1E8C8C" stroke-width="2" marker-end="url(#a-teal)"/>
  <line x1="912" y1="228" x2="934" y2="200" stroke="#1E8C8C" stroke-width="2" marker-end="url(#a-teal)"/>
  <line x1="590" y1="262" x2="590" y2="298" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <text x="590" y="480" text-anchor="middle" font-size="11" font-style="italic" fill="#6B7A8D">Joiner in current state: the account is created in AD and syncs to Entra; cloud entitlements attach after. Derived, evidenced, or not closed.</text>
  <rect x="40" y="500" width="1100" height="30" rx="6" fill="#FCF3D9" stroke="#D4A017" stroke-width="1"/>
  <text x="590" y="520" text-anchor="middle" font-size="10.5" fill="#7A5B00">2027 target (hybrid_mode = false): OPM-HRIT emits the joiner and the account is provisioned cloud-native in Entra — no AD leg.</text>
  </svg>
