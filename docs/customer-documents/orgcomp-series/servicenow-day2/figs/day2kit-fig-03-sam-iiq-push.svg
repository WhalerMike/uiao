<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="s-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#1E8C8C"/></marker>
    <marker id="s-navy" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#0D1B2E"/></marker>
    <marker id="s-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#C0392B"/></marker>
  </defs>

  <text x="640" y="34" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#0D1B2E">SAM to ServiceNow — the IdentityIQ-Push Path</text>
  <text x="640" y="56" text-anchor="middle" font-size="13" fill="#6B7A8D">IdentityIQ decides and approves; its SDIM pushes the RITM; ServiceNow correlates and executes; the closure carries the decision to attestation</text>

  <!-- 1 IIQ decision -->
  <rect x="40" y="92" width="250" height="220" rx="10" fill="#0D1B2E"/>
  <text x="165" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">1 · SailPoint IdentityIQ</text>
  <text x="165" y="136" text-anchor="middle" font-size="10.5" fill="#D7F2EE">Lifecycle Manager (LCM) — the decision</text>
  <line x1="60" y1="148" x2="270" y2="148" stroke="#1E3A66" stroke-width="1"/>
  <text x="165" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Approval chain by Risk Tier</text>
  <text x="60" y="192" font-size="10.5" fill="#D7F2EE">Tier 1 (High):</text>
  <text x="60" y="208" font-size="10" fill="#A9B8CA">Dept Owner &#8594; App Owner &#8594; IGO</text>
  <text x="60" y="230" font-size="10.5" fill="#D7F2EE">Tier 2 (Moderate):</text>
  <text x="60" y="246" font-size="10" fill="#A9B8CA">Dept Owner &#8594; App Owner</text>
  <text x="60" y="268" font-size="10.5" fill="#D7F2EE">Tier 3 (Low):</text>
  <text x="60" y="284" font-size="10" fill="#A9B8CA">Dept Owner</text>
  <text x="165" y="304" text-anchor="middle" font-size="10" font-style="italic" fill="#D7F2EE">on-prem, inside the boundary · AC-2 / AC-5</text>

  <!-- push arrow -->
  <line x1="290" y1="200" x2="360" y2="200" stroke="#1E8C8C" stroke-width="3" marker-end="url(#s-teal)"/>
  <text x="325" y="188" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1E8C8C">SDIM</text>
  <text x="325" y="216" text-anchor="middle" font-size="10" fill="#6B7A8D">pushes</text>

  <!-- 2 endpoint -->
  <rect x="362" y="120" width="256" height="180" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="490" y="144" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0D1B2E">2 · Inbound endpoint</text>
  <text x="490" y="161" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#2E75B6">POST /api/x_fed_day2_ops/sam/ritm</text>
  <text x="382" y="182" font-size="10" font-weight="bold" fill="#0D1B2E">Push contract (all required):</text>
  <text x="382" y="199" font-family="Consolas, monospace" font-size="9.5" fill="#33414F">sam_request_id · access_item</text>
  <text x="382" y="214" font-family="Consolas, monospace" font-size="9.5" fill="#33414F">requested_for · approval_authority</text>
  <rect x="382" y="226" width="216" height="60" rx="6" fill="#F7E2DE" stroke="#C0392B" stroke-width="1"/>
  <text x="490" y="244" text-anchor="middle" font-size="10" font-weight="bold" fill="#C0392B">Fail closed — no RITM created:</text>
  <text x="490" y="260" text-anchor="middle" font-size="9.5" fill="#C0392B">403 wrong role · 400 missing field</text>
  <text x="490" y="275" text-anchor="middle" font-size="9.5" fill="#C0392B">422 identity does not resolve</text>

  <!-- arrow -->
  <line x1="618" y1="200" x2="688" y2="200" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#s-teal)"/>

  <!-- 3 ServiceNow correlate + flow -->
  <rect x="690" y="92" width="290" height="308" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="835" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0D1B2E">3 · ServiceNow (x_fed_day2_ops)</text>

  <rect x="708" y="130" width="254" height="52" rx="6" fill="#2E75B6"/>
  <text x="835" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Correlate</text>
  <text x="835" y="168" text-anchor="middle" font-size="9.5" fill="#EAF1FB">create RITM · write SAM&#8596;RITM&#8596;subject lineage (AU-2)</text>

  <rect x="708" y="190" width="254" height="200" rx="6" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1"/>
  <text x="835" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D1B2E">Governed Day-2 Request Flow</text>
  <rect x="722" y="220" width="226" height="30" rx="4" fill="#0D1B2E"/><text x="835" y="240" text-anchor="middle" font-size="10" fill="#FFFFFF">Authorize — SoD (CM-5)</text>
  <rect x="722" y="254" width="226" height="30" rx="4" fill="#0D1B2E"/><text x="835" y="274" text-anchor="middle" font-size="10" fill="#FFFFFF">Elevate — PIM / PAG (AC-6)</text>
  <rect x="722" y="288" width="226" height="30" rx="4" fill="#1E8C8C"/><text x="835" y="308" text-anchor="middle" font-size="10" fill="#FFFFFF">Actuate — Graph / ARM via MID</text>
  <rect x="722" y="322" width="226" height="30" rx="4" fill="#0D1B2E"/><text x="835" y="342" text-anchor="middle" font-size="10" fill="#FFFFFF">Verify — re-read state</text>
  <rect x="722" y="356" width="226" height="30" rx="4" fill="#0D1B2E"/><text x="835" y="376" text-anchor="middle" font-size="10" fill="#FFFFFF">Evidence — carries sam_request_id</text>

  <!-- arrow to estate + attestation -->
  <line x1="980" y1="303" x2="1030" y2="303" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#s-teal)"/>
  <rect x="1032" y="270" width="216" height="66" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="1140" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0D1B2E">Entra / Azure</text>
  <text x="1140" y="312" text-anchor="middle" font-size="10" fill="#33414F">estate actuated via the MID</text>
  <text x="1140" y="327" text-anchor="middle" font-size="9.5" fill="#6B7A8D">least privilege, just-in-time</text>

  <!-- closure back to attestation -->
  <line x1="980" y1="371" x2="1030" y2="410" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#s-teal)"/>
  <rect x="1032" y="386" width="216" height="70" rx="8" fill="#1E8C8C"/>
  <text x="1140" y="410" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">4 · Attestation</text>
  <text x="1140" y="428" text-anchor="middle" font-size="9.5" fill="#EAF1FB">Vol VII Book 04 reads the closure —</text>
  <text x="1140" y="443" text-anchor="middle" font-size="9.5" fill="#EAF1FB">access backed by an owned decision</text>

  <!-- write-back note -->
  <line x1="835" y1="400" x2="835" y2="470" stroke="#5A5A5A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#s-navy)"/>
  <text x="835" y="490" text-anchor="middle" font-size="10.5" fill="#5A5A5A">SDIM writes the RITM number back onto the IIQ IdentityRequest (externalTicketId) — correlation is bidirectional</text>

  <!-- footer -->
  <rect x="40" y="640" width="1208" height="48" rx="8" fill="#EAF1FB" stroke="#E3E8EF" stroke-width="1"/>
  <text x="644" y="662" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0D1B2E">SAM decides; ServiceNow executes — neither becomes the other. The two planes stay separate on purpose.</text>
  <text x="644" y="680" text-anchor="middle" font-size="10.5" fill="#6B7A8D">Primary: IdentityIQ (on-prem, SDIM push). Secondary: Identity Security Cloud — same contract, set sam_flavor = isc.</text>
</svg>
