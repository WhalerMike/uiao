<svg viewBox="0 0 1280 780" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="780" fill="#FFFFFF"/>
  <defs>
    <marker id="c1-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#1E8C8C"/></marker>
    <marker id="c1-navy" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#0D1B2E"/></marker>
    <marker id="c1-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#2E75B6"/></marker>
  </defs>

  <text x="640" y="34" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#0D1B2E">OrgComp Day-2 Kit — Current State (Hybrid, AD-Mastered)</text>
  <text x="640" y="56" text-anchor="middle" font-size="13" fill="#6B7A8D">Active Directory is the identity master and Entra Connect syncs AD&#8594;Entra — so synced-object writes land in AD and flow to Entra; cloud-native objects stay on Graph/ARM</text>

  <!-- current-state banner -->
  <rect x="40" y="70" width="1200" height="30" rx="6" fill="#FCF3D9" stroke="#D4A017" stroke-width="1"/>
  <text x="640" y="90" text-anchor="middle" font-size="11.5" fill="#7A5B00">CURRENT STATE edition. The 2027 TARGET (OPM-HRIT as SSOT, cloud-native provisioning straight to Entra) is the companion &#8220;2027 Target State&#8221; edition — set hybrid_mode = false.</text>

  <!-- Column headers -->
  <text x="150" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#5A5A5A">1 · ORIGIN (today's SSOT)</text>
  <text x="455" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#5A5A5A">2 · ORCHESTRATE + ROUTE</text>
  <text x="835" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#5A5A5A">3 · ACTUATE (two legs)</text>
  <text x="1122" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#5A5A5A">4 · EMIT (evidence)</text>

  <!-- ORIGIN -->
  <rect x="40" y="144" width="220" height="92" rx="8" fill="#0D1B2E"/>
  <text x="150" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Active Directory</text>
  <text x="150" y="189" text-anchor="middle" font-size="10.5" fill="#D7F2EE">the identity master today</text>
  <text x="150" y="205" text-anchor="middle" font-size="10.5" fill="#D7F2EE">HR/agency process updates AD;</text>
  <text x="150" y="221" text-anchor="middle" font-size="10.5" fill="#A9B8CA">joiner/mover/leaver originate here</text>

  <rect x="40" y="248" width="220" height="80" rx="8" fill="#0D1B2E"/>
  <text x="150" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">ServiceNow catalog / SAM</text>
  <text x="150" y="291" text-anchor="middle" font-size="10.5" fill="#D7F2EE">reset/unlock, group, license,</text>
  <text x="150" y="307" text-anchor="middle" font-size="10.5" fill="#D7F2EE">RBAC, guest — SAM governs access</text>
  <text x="150" y="323" text-anchor="middle" font-size="10" fill="#A9B8CA">the form / decision is the contract</text>

  <rect x="40" y="344" width="220" height="60" rx="8" fill="#FCF3D9" stroke="#D4A017" stroke-width="1"/>
  <text x="150" y="366" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7A5B00">2027 target: OPM-HRIT</text>
  <text x="150" y="383" text-anchor="middle" font-size="10" fill="#7A5B00">becomes the joiner/mover/leaver</text>
  <text x="150" y="397" text-anchor="middle" font-size="10" fill="#7A5B00">SSOT, feeding Entra cloud-native</text>

  <!-- ORCHESTRATE + ROUTER -->
  <rect x="300" y="144" width="310" height="300" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="455" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0D1B2E">MACD-R lifecycle — every task, in order</text>

  <rect x="316" y="174" width="278" height="30" rx="5" fill="#0D1B2E"/><text x="330" y="194" font-size="10.5" fill="#FFFFFF">2 · Authorize — SoD (CM-5), fail closed</text>
  <rect x="316" y="208" width="278" height="30" rx="5" fill="#0D1B2E"/><text x="330" y="228" font-size="10.5" fill="#FFFFFF">3 · Elevate — PIM/PAG, JIT (AC-6)</text>

  <rect x="316" y="244" width="278" height="86" rx="6" fill="#2E75B6"/>
  <text x="455" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">ROUTER — the current-state addition</text>
  <text x="455" y="281" text-anchor="middle" font-size="10" fill="#EAF1FB">onPremisesSyncEnabled = true (synced)?</text>
  <text x="330" y="300" font-size="10" fill="#FFFFFF">&#8594; synced object: lifecycle/attr/pwd/AD-group = AD leg</text>
  <text x="330" y="317" font-size="10" fill="#FFFFFF">&#8594; cloud-only object: everything = Graph/ARM leg</text>

  <rect x="316" y="336" width="278" height="30" rx="5" fill="#0D1B2E"/><text x="330" y="356" font-size="10.5" fill="#FFFFFF">4 · Actuate + Verify — re-read state</text>
  <rect x="316" y="370" width="278" height="30" rx="5" fill="#0D1B2E"/><text x="330" y="390" font-size="10.5" fill="#FFFFFF">5 · Evidence — request+approver+PIM+verdict</text>
  <text x="455" y="422" text-anchor="middle" font-size="10" fill="#C0392B">Stops at the first failing clause — a refused task is evidence too</text>

  <!-- ACTUATE: two legs -->
  <!-- AD leg -->
  <rect x="650" y="144" width="360" height="150" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="830" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0D1B2E">AD leg — synced objects (AdHybridClient)</text>
  <rect x="666" y="174" width="150" height="44" rx="6" fill="#1E8C8C"/>
  <text x="741" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Domain-joined MID</text>
  <text x="741" y="207" text-anchor="middle" font-size="9" fill="#EAF1FB">&#8594; writable DC</text>
  <rect x="828" y="174" width="166" height="44" rx="6" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1"/>
  <text x="911" y="190" text-anchor="middle" font-size="9" fill="#33414F">New-ADUser · Disable-ADAccount</text>
  <text x="911" y="204" text-anchor="middle" font-size="9" fill="#33414F">Set-ADAccountPassword · Add-ADGroupMember</text>
  <text x="830" y="238" text-anchor="middle" font-size="9.5" fill="#6B7A8D">write to AD on the preferred DC (least-privilege delegated rights, never Domain Admin)</text>
  <rect x="666" y="248" width="328" height="34" rx="6" fill="#2E75B6"/>
  <text x="830" y="269" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">Entra Connect sync &#8594; Entra ID (projection)</text>

  <!-- Graph/ARM leg -->
  <rect x="650" y="306" width="360" height="138" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="830" y="326" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0D1B2E">Graph / ARM leg — cloud-native objects</text>
  <rect x="666" y="336" width="150" height="40" rx="6" fill="#1E8C8C"/>
  <text x="741" y="354" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">In-boundary MID</text>
  <text x="741" y="368" text-anchor="middle" font-size="9" fill="#EAF1FB">&#8594; Graph / ARM</text>
  <rect x="828" y="336" width="166" height="40" rx="6" fill="#EAF1FB" stroke="#1E3A66" stroke-width="1"/>
  <text x="911" y="352" text-anchor="middle" font-size="9" fill="#33414F">MFA reset · Azure RBAC · license</text>
  <text x="911" y="366" text-anchor="middle" font-size="9" fill="#33414F">guest invite · app consent · revoke sessions</text>
  <text x="830" y="396" text-anchor="middle" font-size="9.5" fill="#6B7A8D">directly in Entra/Azure — these never had an on-prem master</text>
  <rect x="666" y="408" width="328" height="28" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1"/>
  <text x="830" y="427" text-anchor="middle" font-size="10" fill="#0D1B2E">Entra ID · Azure Resource Manager</text>

  <!-- EMIT -->
  <rect x="1020" y="150" width="220" height="36" rx="6" fill="#2E75B6"/>
  <text x="1130" y="167" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">Evidence store</text>
  <text x="1130" y="181" text-anchor="middle" font-size="9.5" fill="#EAF1FB">closure stream (write-once)</text>

  <rect x="1020" y="200" width="220" height="86" rx="8" fill="#1E8C8C"/>
  <text x="1130" y="223" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">NIST SP 800-53</text>
  <text x="1130" y="243" text-anchor="middle" font-size="10" fill="#EAF1FB">AC-2 · AC-6 · IA-2 · IA-4 · IA-5</text>
  <text x="1130" y="259" text-anchor="middle" font-size="10" fill="#EAF1FB">AC-20 · SA-9 · AU-2 · CM-3</text>
  <text x="1130" y="277" text-anchor="middle" font-size="9.5" fill="#D7F2EE">closed by an owned, evidenced trail</text>

  <rect x="1020" y="300" width="220" height="76" rx="8" fill="#1E8C8C"/>
  <text x="1130" y="323" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">FedRAMP 20x KSIs</text>
  <text x="1130" y="343" text-anchor="middle" font-size="10" fill="#EAF1FB">KSI-IAM · KSI-MLA · KSI-SCR</text>
  <text x="1130" y="361" text-anchor="middle" font-size="9.5" fill="#D7F2EE">emitted to the ConMon pipeline</text>

  <text x="1130" y="400" text-anchor="middle" font-size="9.5" fill="#6B7A8D">the control is the same whichever</text>
  <text x="1130" y="414" text-anchor="middle" font-size="9.5" fill="#6B7A8D">leg actuated — only the write path differs</text>

  <!-- arrows -->
  <line x1="262" y1="190" x2="296" y2="230" stroke="#0D1B2E" stroke-width="2" marker-end="url(#c1-navy)"/>
  <line x1="262" y1="288" x2="296" y2="270" stroke="#0D1B2E" stroke-width="2" marker-end="url(#c1-navy)"/>
  <line x1="594" y1="280" x2="644" y2="235" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#c1-blue)"/>
  <line x1="594" y1="300" x2="644" y2="360" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#c1-blue)"/>
  <line x1="1010" y1="235" x2="1016" y2="220" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#c1-teal)"/>
  <line x1="1010" y1="370" x2="1016" y2="300" stroke="#1E8C8C" stroke-width="2" marker-end="url(#c1-teal)"/>
  <line x1="1130" y1="286" x2="1130" y2="298" stroke="#1E8C8C" stroke-width="2" marker-end="url(#c1-teal)"/>

  <!-- footer -->
  <rect x="40" y="700" width="1200" height="56" rx="8" fill="#EAF1FB" stroke="#E3E8EF" stroke-width="1"/>
  <text x="640" y="722" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0D1B2E">Current state: AD is the master · synced-object writes go to AD and sync to Entra · cloud-native writes go straight to Graph/ARM · the closure still emits the controls and KSIs</text>
  <text x="640" y="742" text-anchor="middle" font-size="10.5" fill="#6B7A8D">One script set, config-switched: hybrid_mode = true routes synced work to the AD leg. The 2027 target sets hybrid_mode = false and everything goes cloud-native.</text>
</svg>
