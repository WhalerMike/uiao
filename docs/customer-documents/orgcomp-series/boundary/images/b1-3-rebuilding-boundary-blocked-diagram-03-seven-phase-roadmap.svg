<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="rTeal" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="54" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="34" fill="#0D1B2E">Seven-Phase Implementation Roadmap</text>
  <text x="640" y="88" text-anchor="middle" font-size="18" fill="#6B7A8D">Each phase delivers standalone value and is a precondition for the next &#8212; the operate-and-tune phase never closes</text>

  <!-- phases -->
  <!-- row 1: P0..P3 -->
  <g>
    <rect x="70" y="150" width="265" height="110" rx="10" fill="#0D1B2E"/>
    <text x="92" y="184" font-size="20" font-weight="bold" fill="#FFFFFF">P0</text>
    <text x="92" y="210" font-size="17" font-weight="bold" fill="#EAF1FB">Authorization Foundation</text>
    <text x="92" y="234" font-size="13" fill="#A9B8CA">stack in-scope; ATO subsystem;</text>
    <text x="92" y="252" font-size="13" fill="#A9B8CA">EO 14117 location handling</text>
  </g>
  <g>
    <rect x="372" y="150" width="265" height="110" rx="10" fill="#0D1B2E"/>
    <text x="394" y="184" font-size="20" font-weight="bold" fill="#FFFFFF">P1</text>
    <text x="394" y="210" font-size="17" font-weight="bold" fill="#EAF1FB">Telemetry Landing</text>
    <text x="394" y="234" font-size="13" fill="#A9B8CA">all diag settings on; retention</text>
    <text x="394" y="252" font-size="13" fill="#A9B8CA">cliffs fixed (L1 &#8594; L2)</text>
  </g>
  <g>
    <rect x="674" y="150" width="265" height="110" rx="10" fill="#1E8C8C"/>
    <text x="696" y="184" font-size="20" font-weight="bold" fill="#FFFFFF">P2</text>
    <text x="696" y="210" font-size="17" font-weight="bold" fill="#FFFFFF">Deterministic Detections</text>
    <text x="696" y="234" font-size="13" fill="#D7F2EE">KQL analytic rules (L3)</text>
    <text x="696" y="252" font-size="13" fill="#FFFFFF" font-weight="bold">&#9733; fastest value</text>
  </g>
  <g>
    <rect x="976" y="150" width="265" height="110" rx="10" fill="#1E8C8C"/>
    <text x="998" y="184" font-size="20" font-weight="bold" fill="#FFFFFF">P3</text>
    <text x="998" y="210" font-size="17" font-weight="bold" fill="#FFFFFF">Behavioral &amp; ML Rebuild</text>
    <text x="998" y="234" font-size="13" fill="#D7F2EE">UEBA / in-boundary models</text>
    <text x="998" y="252" font-size="13" fill="#FFFFFF" font-weight="bold">most expensive</text>
  </g>

  <!-- connectors row1 -->
  <line x1="335" y1="205" x2="372" y2="205" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#rTeal)"/>
  <line x1="637" y1="205" x2="674" y2="205" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#rTeal)"/>
  <line x1="939" y1="205" x2="976" y2="205" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#rTeal)"/>
  <!-- wrap connector P3 -> P4 -->
  <path d="M 1108 260 L 1108 300 L 196 300 L 196 340" fill="none" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#rTeal)"/>

  <!-- row 2: P4..P6 -->
  <g>
    <rect x="70" y="344" width="265" height="110" rx="10" fill="#1E8C8C"/>
    <text x="92" y="378" font-size="20" font-weight="bold" fill="#FFFFFF">P4</text>
    <text x="92" y="404" font-size="17" font-weight="bold" fill="#FFFFFF">Response (SOAR)</text>
    <text x="92" y="428" font-size="13" fill="#D7F2EE">Graph revocation playbooks;</text>
    <text x="92" y="446" font-size="13" fill="#D7F2EE">short token lifetimes (L4)</text>
  </g>
  <g>
    <rect x="372" y="344" width="265" height="110" rx="10" fill="#2E75B6"/>
    <text x="394" y="378" font-size="20" font-weight="bold" fill="#FFFFFF">P5</text>
    <text x="394" y="404" font-size="17" font-weight="bold" fill="#FFFFFF">Close the Loop</text>
    <text x="394" y="428" font-size="13" fill="#EAF1FB">risk score &#8594; Conditional Access</text>
    <text x="394" y="446" font-size="13" fill="#FFFFFF" font-weight="bold">lifts maturity (L5)</text>
  </g>
  <g>
    <rect x="674" y="344" width="265" height="110" rx="10" fill="#0D1B2E"/>
    <text x="696" y="378" font-size="20" font-weight="bold" fill="#FFFFFF">P6</text>
    <text x="696" y="404" font-size="17" font-weight="bold" fill="#EAF1FB">Validation &amp; Attestation</text>
    <text x="696" y="428" font-size="13" fill="#A9B8CA">completeness workbook; efficacy;</text>
    <text x="696" y="446" font-size="13" fill="#A9B8CA">ZTMM tier attestation</text>
  </g>

  <!-- connectors row2 -->
  <line x1="335" y1="399" x2="372" y2="399" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#rTeal)"/>
  <line x1="637" y1="399" x2="674" y2="399" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#rTeal)"/>

  <!-- operate & tune loop -->
  <rect x="976" y="344" width="265" height="110" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2.5"/>
  <text x="1108" y="382" text-anchor="middle" font-size="19" font-weight="bold" fill="#8A6A0F">Operate &amp; Tune</text>
  <text x="1108" y="408" text-anchor="middle" font-size="15" fill="#33414F">never closes &#8212; detections</text>
  <text x="1108" y="428" text-anchor="middle" font-size="15" fill="#33414F">rot without continuous</text>
  <text x="1108" y="448" text-anchor="middle" font-size="15" fill="#33414F">engineering investment</text>
  <line x1="939" y1="399" x2="976" y2="399" stroke="#D4A017" stroke-width="3.5" marker-end="url(#rTeal)"/>
  <path d="M 1108 454 C 1108 520 1108 520 1108 540" fill="none" stroke="#D4A017" stroke-width="3"/>
  <path d="M 1108 540 C 1108 560 200 560 200 460" fill="none" stroke="#D4A017" stroke-width="3" stroke-dasharray="8 5"/>

  <!-- bottom banner -->
  <rect x="70" y="600" width="1171" height="78" rx="10" fill="#F7FAFE" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="655" y="634" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">A bridge, not a destination</text>
  <text x="655" y="660" text-anchor="middle" font-size="15" fill="#33414F">This plan lifts most pillars Initial &#8594; Advanced. It does not reach commercial-cloud fidelity; the irreducible gap and Optimal tier still depend on MAS 2026.</text>
</svg>
