<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="54" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="34" fill="#0D1B2E">What the Rebuild Can &#8212; and Cannot &#8212; Recover</text>
  <text x="640" y="88" text-anchor="middle" font-size="18" fill="#6B7A8D">The boundary&#8217;s blocked capabilities split into three classes by why the signal is missing</text>

  <!-- Bucket 1 -->
  <rect x="56" y="120" width="376" height="430" rx="12" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2.5"/>
  <rect x="56" y="120" width="376" height="62" rx="12" fill="#1E8C8C"/>
  <rect x="56" y="158" width="376" height="24" fill="#1E8C8C"/>
  <text x="244" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Inferred-blocked</text>
  <text x="244" y="172" text-anchor="middle" font-size="15" fill="#D7F2EE">agency boundary constrains the export</text>
  <text x="244" y="222" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E8C8C">&#10003; REBUILDABLE</text>
  <line x1="88" y1="248" x2="400" y2="248" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="88" y="288" font-size="15" fill="#33414F">&#8226; Entra Identity Protection ML risk</text>
  <text x="88" y="320" font-size="15" fill="#33414F">&#8226; CAE real-time revocation</text>
  <text x="88" y="352" font-size="15" fill="#33414F">&#8226; Intune behavioral analytics</text>
  <text x="88" y="384" font-size="15" fill="#33414F">&#8226; Behavioral DLP / label analytics</text>
  <line x1="88" y1="414" x2="400" y2="414" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="244" y="448" text-anchor="middle" font-size="14" fill="#155E5E" font-weight="bold">Raw telemetry is collectible</text>
  <text x="244" y="470" text-anchor="middle" font-size="14" fill="#155E5E" font-weight="bold">in-boundary; agency rebuilds</text>
  <text x="244" y="492" text-anchor="middle" font-size="14" fill="#155E5E" font-weight="bold">the missing ML layer.</text>
  <text x="244" y="528" text-anchor="middle" font-size="14" fill="#6B7A8D">Lifts pillars Initial &#8594; Advanced</text>

  <!-- Bucket 2 -->
  <rect x="452" y="120" width="376" height="430" rx="12" fill="#FFFFFF" stroke="#D4A017" stroke-width="2.5"/>
  <rect x="452" y="120" width="376" height="62" rx="12" fill="#D4A017"/>
  <rect x="452" y="158" width="376" height="24" fill="#D4A017"/>
  <text x="640" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#3D2E04">Confirmed-unavailable</text>
  <text x="640" y="172" text-anchor="middle" font-size="15" fill="#3D2E04">Microsoft does not provision the feature</text>
  <text x="640" y="222" text-anchor="middle" font-size="26" font-weight="bold" fill="#8A6A0F">&#126; SUBSTITUTE ONLY</text>
  <line x1="484" y1="248" x2="796" y2="248" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="484" y="288" font-size="15" fill="#33414F">&#8226; Informed Network Routing (INR)</text>
  <text x="484" y="320" font-size="15" fill="#33414F">&#8226; Adoption Score</text>
  <text x="484" y="352" font-size="15" fill="#33414F">&#8226; Endpoint Analytics Advanced</text>
  <line x1="484" y1="414" x2="796" y2="414" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="640" y="448" text-anchor="middle" font-size="14" fill="#3D2E04" font-weight="bold">Inputs never reach the tenant.</text>
  <text x="640" y="470" text-anchor="middle" font-size="14" fill="#3D2E04" font-weight="bold">A different source substitutes</text>
  <text x="640" y="492" text-anchor="middle" font-size="14" fill="#3D2E04" font-weight="bold">(e.g. SD-WAN for INR) &#8212;</text>
  <text x="640" y="514" text-anchor="middle" font-size="14" fill="#3D2E04" font-weight="bold">never the same product.</text>

  <!-- Bucket 3 -->
  <rect x="848" y="120" width="376" height="430" rx="12" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.5"/>
  <rect x="848" y="120" width="376" height="62" rx="12" fill="#C0392B"/>
  <rect x="848" y="158" width="376" height="24" fill="#C0392B"/>
  <text x="1036" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Irreducible</text>
  <text x="1036" y="172" text-anchor="middle" font-size="15" fill="#F7E2DE">the input is other tenants&#8217; data</text>
  <text x="1036" y="222" text-anchor="middle" font-size="26" font-weight="bold" fill="#C0392B">&#10007; NOT RECOVERABLE</text>
  <line x1="880" y1="248" x2="1192" y2="248" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="880" y="288" font-size="15" fill="#33414F">&#8226; Cross-tenant correlation</text>
  <text x="880" y="320" font-size="15" fill="#33414F">&#8226; Microsoft global threat</text>
  <text x="906" y="342" font-size="15" fill="#33414F">intelligence</text>
  <line x1="880" y1="414" x2="1192" y2="414" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="1036" y="448" text-anchor="middle" font-size="14" fill="#8E2A20" font-weight="bold">The agency sees only its own</text>
  <text x="1036" y="470" text-anchor="middle" font-size="14" fill="#8E2A20" font-weight="bold">tenant. Permanent at any budget.</text>
  <text x="1036" y="492" text-anchor="middle" font-size="14" fill="#8E2A20" font-weight="bold">Only MAS 2026 / purchased</text>
  <text x="1036" y="514" text-anchor="middle" font-size="14" fill="#8E2A20" font-weight="bold">threat-intel feeds narrow it.</text>

  <!-- bottom banner -->
  <rect x="56" y="582" width="1168" height="96" rx="10" fill="#F7FAFE" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="618" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">The rebuild does NOT overcome the boundary.</text>
  <text x="640" y="648" text-anchor="middle" font-size="16" fill="#33414F">It closes bucket 1, substitutes for bucket 2, and leaves bucket 3 &#8212; and the Optimal ZTMM tier &#8212; dependent on MAS 2026.</text>
  <text x="640" y="670" text-anchor="middle" font-size="14" fill="#6B7A8D">EO 14117 location restrictions are unaffected: rebuilding analytics in-boundary does not change who is barred from the data.</text>
</svg>
