# AAN authority-deadline registry — the SSOT for every binding federal date the
# series cites. Each entry carries the issuing-agency source and the date it was
# last verified against that source.
#
# ENFORCEMENT: check_authority_deadlines.py
#   - a corpus line that names one of these events with a DIFFERENT date fails;
#   - a `last_verified` older than --max-age (default 30 days) warns; the
#     scheduled workflow runs --strict-fresh so staleness goes red and someone
#     re-verifies against the source and bumps last_verified. That is the
#     standing "check the latest federal agencies" process — verification is a
#     human/agent act against the issuing agency; the gate makes skipping it
#     visible instead of silent.
#
# All entries verified 2026-07-14 against the sources shown.
version: "1.0"
deadlines:
  # BOD 25-01 is IN FORCE and continuous — its three 2025 deadlines are past, so it
  # is not an upcoming date, but it must not read as lapsed. The anchor date is the
  # mandatory-"shall"-policy compliance date; the event records the continuing
  # obligation and the LIVING nature of the scope: the finalized-baseline set and
  # the mandatory-policy list are revised by CISA on the Required Configurations
  # page, so a downloaded snapshot is not authoritative for the current set.
  # Verified 2026-07-21: directive in force, not superseded. Google Workspace
  # baselines (slated to enter scope after issuance, assessed by ScubaGoggles) and
  # the current M365 baseline versions must be confirmed at the source below.
  - id: bod-25-01-mandatory-policies
    date: 2025-06-20
    event: "BOD 25-01 mandatory SCuBA 'shall' policies in force — continuous SCuBA assessment + reporting obligation ongoing; finalized-baseline set and mandatory-policy list are living (confirm the current set at the CISA source, not any static snapshot)"
    keywords: ["BOD 25-01.{0,60}mandatory", "BOD 25-01.{0,50}(in force|shall polic)", "mandatory SCuBA.{0,20}shall"]
    source: https://www.cisa.gov/resources-tools/services/bod-25-01-implementing-secure-practices-cloud-services-required-configurations
    issuer: CISA
    last_verified: 2026-07-21

