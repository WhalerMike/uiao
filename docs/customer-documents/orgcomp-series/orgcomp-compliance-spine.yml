  # --- book-04 : HRIT Identity & Org SSOT (identity lifecycle from the HR system of record) ---
  # Transcribed from the book's own "NIST SP 800-53 Rev 5 Control Closure" table
  # (mechanism from the "With This Architecture" column; necessity rebuttals from
  # the "Why No Alternative Closes It" column). Structural fields (plane 3 /
  # slot-01-identity / gate fedramp) follow the spine's established identity-control
  # convention (cf. book-day2-helpdesk AC-2). Back-fill increment: 15 -> 16 books.
  - {control: "AC-2",     title: "Account Management",                          book: book-04, plane: 3, mechanism: "Account create/modify/disable/remove executed as consequences of effective-dated HR hire/transfer/separation events, each traceable to an authoritative worker record", gate: fedramp, drivers: [nist-800-53r5, omb-m-22-09], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: true, alternative_rebuttal: 'Strongest alternative: "directory-hygiene sweeps and access reviews keep accounts aligned." Fails AC-2 because alignment with termination/transfer presumes a machine-readable personnel truth to align to; employment facts originate in the HR system of record — no scanner or review cadence generates the fact of employment, it can only copy it, late.'}
  - {control: "AC-2(1)",  title: "Automated System Account Management",          book: book-04, plane: 3, mechanism: "Automated inbound-provisioning pipeline + lifecycle workflows keyed to effective-dated HR events, with per-action provenance", gate: fedramp, drivers: [nist-800-53r5], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "IA-4",     title: "Identifier Management",                       book: book-04, plane: 3, mechanism: "One identifier per person assigned from the worker record at first affiliation, carried by every account and preserved across rehire/conversion; reuse structurally prevented by the persisting worker record", gate: fedramp, drivers: [nist-800-53r5], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: true, alternative_rebuttal: 'Strongest alternative: "the directory prevents identifier reuse." Fails IA-4 because non-reuse and rehire correlation require durable memory of persons, not accounts; directories track accounts and forget them at deletion. Only the HR system of record, whose subject is the person, survives the end of every account.'}
  - {control: "PS-4",     title: "Personnel Termination",                       book: book-04, plane: 3, mechanism: "Effective-dated separation record initiates the automated disable/revoke/remove sequence on the effective date with a timestamped evidence record per step; separation-to-revocation interval becomes a ConMon metric", gate: fedramp, drivers: [nist-800-53r5], slot: slot-01-identity, ksi: [], tool: false, necessity: true, alternative_rebuttal: 'Strongest alternative: "email/checklist offboarding disables access." Fails PS-4 because the clock starts at an event only the HR system records as a first-class fact — termination is not network-observable, and absence of logins is indistinguishable from leave; only an event-driven feed from the owner of the fact starts the automation on time.'}
  - {control: "PS-5",     title: "Personnel Transfer",                          book: book-04, plane: 3, mechanism: "Mover event triggers re-derivation of access from the new assignment and an access review of the residual within the defined period of the formal transfer action", gate: fedramp, drivers: [nist-800-53r5], slot: slot-01-identity, ksi: [], tool: false, necessity: true, alternative_rebuttal: 'Strongest alternative: "periodic access reviews catch transfers." Fails PS-5 because the formal transfer action is an HR record; to the network and directory the transferred person is the same account on the same device — no mechanism that cannot see the transfer can start the required review on time.'}
  - {control: "SI-12",    title: "Information Management and Retention",         book: book-04, plane: 3, mechanism: "One designated authoritative source per identity/organizational data type with documented lineage from HR record through middleware provenance to every downstream consumer; retention applied at the source", gate: fedramp, drivers: [nist-800-53r5], slot: slot-01-identity, ksi: [], tool: false, necessity: true, alternative_rebuttal: 'Strongest alternative: "reconstruct lineage from downstream copies at audit time." Fails SI-12 because lineage cannot be reconstructed afterward from copies — provenance must be emitted where the data originates and flows; designating and instrumenting one source is the only mechanism that produces lineage rather than asserting it.'}
