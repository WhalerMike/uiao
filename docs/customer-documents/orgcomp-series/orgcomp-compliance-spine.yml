# -----------------------------------------------------------------------------
# Closures — one row per (control × book) closure claim.
#   control   NIST SP 800-53 Rev 5 control id
#   book      book id (see registry)
#   plane     functional plane number (1-7)
#   mechanism function-framed closing mechanism (NOT a product)
#   gate      accreditation gate id (see gates)
#   drivers   authority ids that mandate/motivate this control here
#   slot      evidence slot id
#   ksi       FedRAMP 20x KSI theme(s), or [] if none direct
#   tool      attestable by conformance tooling alone? (true/false)
#   necessity true if this is a Closure-Necessity anchor (no alternate path)
# -----------------------------------------------------------------------------
closures:

  # --- book-net-enforce : Network Enforcement Substrate (gear, NIAP/STIG/FIPS) -
  - {control: "SC-7",     title: "Boundary Protection",                         book: book-net-enforce, plane: 4, mechanism: "NGFW boundary enforcement at the customer-owned edge (function: distributed policy enforcement point)", gate: niap-stig-fips, drivers: [nist-800-53r5, cisa-tic-3, nist-800-207], slot: slot-03-network, ksi: [KSI-CNA], tool: false, necessity: false}
  - {control: "SC-7(8)",  title: "Route Traffic to Authenticated Proxy Servers", book: book-net-enforce, plane: 4, mechanism: "Forced-proxy egress through the SASE/SWG enforcement point", gate: niap-stig-fips, drivers: [nist-800-53r5, cisa-tic-3], slot: slot-03-network, ksi: [KSI-CNA], tool: false, necessity: false}
  - {control: "SC-8",     title: "Transmission Confidentiality and Integrity",  book: book-net-enforce, plane: 1, mechanism: "IPsec/MACsec overlay on customer-premises transport (function: network-layer encryption)", gate: niap-stig-fips, drivers: [nist-800-53r5, eo-14028], slot: slot-03-network, ksi: [KSI-CNA], tool: false, necessity: true, alternative_rebuttal: 'Strongest alternative: "TLS already encrypts the data in transit." Fails SC-8 for the circuit as a whole — TLS protects only applications that implement it, leaving management, legacy, and non-TLS flows in cleartext on a bare DIA path; only a network-layer IPsec/MACsec overlay encrypts all traffic regardless of application behavior.'}
  - {control: "SC-8(1)",  title: "Cryptographic Protection",                    book: book-net-enforce, plane: 1, mechanism: "FIPS 140-3 validated cipher suite on the overlay", gate: niap-stig-fips, drivers: [nist-800-53r5], slot: slot-03-network, ksi: [KSI-CNA], tool: false, necessity: false}
  - {control: "AC-4",     title: "Information Flow Enforcement",                 book: book-net-enforce, plane: 4, mechanism: "Application-aware flow policy at the NGFW/SASE PEP", gate: niap-stig-fips, drivers: [nist-800-53r5, nist-800-207, cisa-tic-3], slot: slot-03-network, ksi: [KSI-CNA], tool: false, necessity: false}
  - {control: "IA-3",     title: "Device Identification and Authentication",    book: book-net-enforce, plane: 3, mechanism: "802.1X authenticator + NAC at the port (function: device identity at the edge)", gate: niap-stig-fips, drivers: [nist-800-53r5, nist-800-207, cisa-ztmm-2], slot: slot-03-network, ksi: [KSI-IAM], tool: false, necessity: true, alternative_rebuttal: 'Strongest alternative: "MAC filtering / port security identifies the device." Fails IA-3 because MAC identity is spoofable identification, not authentication; only 802.1X (EAP-TLS) supplies cryptographically authenticated device identity, and it gates access at the port rather than observing devices already admitted.'}
  - {control: "AC-19",    title: "Access Control for Mobile Devices",           book: book-net-enforce, plane: 3, mechanism: "NAC posture gating at the access layer", gate: niap-stig-fips, drivers: [nist-800-53r5, omb-m-22-09], slot: slot-05-endpoint, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "AC-17",    title: "Remote Access",                               book: book-net-enforce, plane: 4, mechanism: "Vendor ZTNA/remote-access gateway (function: per-session remote access)", gate: niap-stig-fips, drivers: [nist-800-53r5, omb-m-22-09, cisa-ztmm-2], slot: slot-03-network, ksi: [KSI-CNA], tool: false, necessity: false}
  - {control: "SI-4",     title: "System Monitoring",                           book: book-net-enforce, plane: 6, mechanism: "Network detection/telemetry export from the enforcement substrate to the evidence contract", gate: niap-stig-fips, drivers: [nist-800-53r5, omb-m-21-31], slot: slot-04-telemetry, ksi: [KSI-MLA], tool: false, necessity: false, test: "Vol VI Book 08 — source-liveness monitoring"}

  # --- book-patch-sysmgmt : Patch & Systems Management (multi-CSP, SI-2/CM) ----
  - {control: "SI-2",     title: "Flaw Remediation",                            book: book-patch-sysmgmt, plane: 7, mechanism: "Platform-native patch orchestration per CSP × OS (Intune/Arc, SSM, OS Mgmt Hub/Ksplice, vLCM, Satellite/Ansible)", gate: fedramp, drivers: [nist-800-53r5, cisa-bod-26-04, eo-14028], slot: slot-05-endpoint, ksi: [KSI-SVC, KSI-MLA], tool: false, necessity: true, alternative_rebuttal: 'Strongest alternative: "A single cross-platform scanner or patch console covers every OS." Fails SI-2 because a scanner detects but does not remediate, and cross-platform consoles still delegate the actual install to each platform native mechanism (Intune/Arc, SSM, vLCM, Ksplice); no remediation path bypasses the per-CSP-by-OS orchestrator.'}
  - {control: "SI-2(2)",  title: "Automated Flaw Remediation Status",           book: book-patch-sysmgmt, plane: 7, mechanism: "Machine-readable remediation-status record emitted by each native stack into the unified evidence contract", gate: fedramp, drivers: [nist-800-53r5, cisa-cdm], slot: slot-05-endpoint, ksi: [KSI-SVC, KSI-MLA], tool: false, necessity: false}
  - {control: "SI-2(3)",  title: "Time to Remediate Flaws and Benchmarks for Corrective Actions",              book: book-patch-sysmgmt, plane: 7, mechanism: "Remediation-SLA class per asset, keyed to KEV/exposure (BOD 26-04 four-variable model)", gate: fedramp, drivers: [nist-800-53r5, cisa-bod-22-01, cisa-bod-26-04], slot: slot-05-endpoint, ksi: [KSI-SVC], tool: false, necessity: false}
  - {control: "CM-2",     title: "Baseline Configuration",                      book: book-patch-sysmgmt, plane: 7, mechanism: "Desired-state config baseline per platform (Azure Machine Config, SSM State Manager, Aria, Ansible)", gate: fedramp, drivers: [nist-800-53r5, omb-a-130], slot: slot-05-endpoint, ksi: [KSI-CMT], tool: false, necessity: false}
  - {control: "CM-6",     title: "Configuration Settings",                      book: book-patch-sysmgmt, plane: 7, mechanism: "Drift detection + reconciliation against the baseline; drift record to the evidence contract", gate: fedramp, drivers: [nist-800-53r5, cisa-scuba], slot: slot-05-endpoint, ksi: [KSI-CMT], tool: false, necessity: false, test: "Vol VI Book 08 — baseline conformance re-check (scheduled re-scan vs intended baseline)"}
  - {control: "CM-8",     title: "System Component Inventory",                   book: book-patch-sysmgmt, plane: 2, mechanism: "IPAM-keyed asset identity as the join key correlating all native-stack inventories (naming-plane necessity)", gate: fedramp, drivers: [nist-800-53r5, cisa-bod-23-01], slot: slot-03-network, ksi: [KSI-PIY], tool: false, necessity: true, alternative_rebuttal: 'Strongest alternative: "The ServiceNow CMDB is the authoritative inventory." Fails CM-8 because a CMDB is a discovery-populated projection that must reconcile to an authoritative address/name identity to dedupe across clouds; you cannot inventory what you cannot enumerate, and only the IPAM/DDI naming plane enumerates every host by construction. The CMDB reconciles to it, it does not replace it.'}
  - {control: "RA-5",     title: "Vulnerability Monitoring and Scanning",       book: book-patch-sysmgmt, plane: 6, mechanism: "Assessment handoff FROM Book 11 (scan measures the gap; this book actuates remediation)", gate: fedramp, drivers: [nist-800-53r5, cisa-bod-22-01], slot: slot-05-endpoint, ksi: [KSI-MLA], tool: false, necessity: false}

  # --- book-00 : doctrine anchors (the three Closure-Necessity anchors) --------
  - {control: "SC-20",    title: "Secure Name/Address Resolution Service (Authoritative Source)", book: book-01, plane: 2, mechanism: "Authoritative DNSSEC-signing resolver (naming plane)", gate: fedramp, drivers: [nist-800-53r5], slot: slot-03-network, ksi: [KSI-CNA], tool: false, necessity: true, alternative_rebuttal: 'Strongest alternative: "Managed cloud DNS with DNSSEC toggled on." Fails SC-20 unless that service is the authoritative signing resolver for your zone — SC-20 requires originating authoritative data-origin authentication for names you are authoritative for; a forwarding or non-authoritative resolver cannot sign responses for your namespace.'}
  - {control: "SC-21",    title: "Secure Name/Address Resolution Service (Recursive or Caching Resolver)",   book: book-01, plane: 2, mechanism: "Recursive DNSSEC validation + protective-DNS RPZ", gate: fedramp, drivers: [nist-800-53r5, cisa-tic-3], slot: slot-03-network, ksi: [KSI-CNA], tool: false, necessity: true, alternative_rebuttal: 'Strongest alternative: "Endpoint DNS-over-HTTPS or a firewall URL filter." Fails SC-21 because it operates above resolution and does not validate DNSSEC signatures; a forged response to a non-validating recursive resolver still succeeds. Only a validating recursive resolver, plus protective-DNS RPZ policy, closes SC-21.'}

  # --- book-evidence-fabric : Multi-Cloud Evidence Fabric (telemetry → CDM → KSI) ---
  - {control: "AU-3",     title: "Content of Audit Records",                     book: book-evidence-fabric, plane: 6, mechanism: "Unified machine-readable evidence-record contract every native stack emits (the coordination mechanism)", gate: fedramp, drivers: [nist-800-53r5, omb-m-21-31], slot: slot-04-telemetry, ksi: [KSI-MLA], tool: false, necessity: true, alternative_rebuttal: 'Strongest alternative: "Every system already logs; just aggregate in the SIEM." Fails AU-3 because heterogeneous native logs use incompatible schemas and keys, so a SIEM can co-locate but not reconcile them; the shared machine-readable record contract is what makes cross-surface records carry a consistent, joinable content set.'}
  - {control: "AU-6(1)",  title: "Automated Process Integration",               book: book-evidence-fabric, plane: 6, mechanism: "Automated aggregation + analysis across CSP/NEM/OS sources into one lake (Sentinel default; Splunk alternative)", gate: fedramp, drivers: [nist-800-53r5, nist-800-137], slot: slot-04-telemetry, ksi: [KSI-MLA], tool: false, necessity: false}
  - {control: "AU-12",    title: "Audit Record Generation",                     book: book-evidence-fabric, plane: 6, mechanism: "Enterprise-wide audit generation spanning every CSP, NEM appliance, and OS agent", gate: fedramp, drivers: [nist-800-53r5, omb-m-21-31], slot: slot-04-telemetry, ksi: [KSI-MLA], tool: false, necessity: false}
  - {control: "AU-12(1)", title: "System-wide and Time-correlated Audit Trail",   book: book-evidence-fabric, plane: 6, mechanism: "Cross-surface correlation keyed to authoritative asset identity (IPAM/DDI) + time — the join that makes one compliance picture", gate: fedramp, drivers: [nist-800-53r5, cisa-bod-23-01], slot: slot-04-telemetry, ksi: [KSI-MLA], tool: false, necessity: true, alternative_rebuttal: 'Strongest alternative: "Correlate on hostname or IP as each tool logs it." Fails AU-12(1) because raw hostnames and IPs collide and churn across clouds (reused RFC1918 space, ephemeral IPs), mis-joining records; only a stable authoritative asset identity (the IPAM/DDI join key) plus time yields a correct system-wide, time-correlated audit trail.'}
  - {control: "CA-7",     title: "Continuous Monitoring",                       book: book-evidence-fabric, plane: 6, mechanism: "The telemetry→evidence→CDM→KSI pipeline; ServiceNow coordinates workflow, CMDB reconciled to IPAM/DDI", gate: fedramp, drivers: [nist-800-53r5, nist-800-137, cisa-cdm, fedramp-20x], slot: slot-04-telemetry, ksi: [KSI-MLA], tool: false, necessity: false, test: "Vol VI Book 08 — telemetry-completeness workbook (CA-7(3))"}
  - {control: "SI-4(16)", title: "Correlate Monitoring Information",            book: book-evidence-fabric, plane: 6, mechanism: "Correlation of monitoring data across vendor/surface boundaries in the unified fabric", gate: fedramp, drivers: [nist-800-53r5], slot: slot-04-telemetry, ksi: [KSI-MLA], tool: false, necessity: false, test: "Vol VI Book 08 — source-liveness monitoring"}

  # --- book-cloudnative-posture : Cloud-Native Security Posture & Containers (CSPM/CNAPP, K8s) ---
  - {control: "CM-6",     title: "Configuration Settings",                      book: book-cloudnative-posture, plane: 6, mechanism: "Cloud resource misconfiguration detection across CSPs (CSPM) — Defender for Cloud (Moderate default); Prisma Cloud/Wiz (High)", gate: fedramp, drivers: [nist-800-53r5, cisa-scuba], slot: slot-06-security, ksi: [KSI-CMT, KSI-SVC], tool: false, necessity: false, test: "Vol VI Book 08 — baseline conformance re-check (scheduled re-scan vs intended baseline)"}
  - {control: "RA-5",     title: "Vulnerability Monitoring and Scanning",       book: book-cloudnative-posture, plane: 6, mechanism: "Agentless cloud-workload + container-image vulnerability scanning (CNAPP/CWPP)", gate: fedramp, drivers: [nist-800-53r5, cisa-bod-22-01], slot: slot-06-security, ksi: [KSI-MLA], tool: false, necessity: false}
  - {control: "CM-7",     title: "Least Functionality",                         book: book-cloudnative-posture, plane: 4, mechanism: "Container hardening + Kubernetes admission control (deny non-compliant workloads)", gate: fedramp, drivers: [nist-800-53r5], slot: slot-06-security, ksi: [KSI-SVC], tool: false, necessity: false}
  - {control: "SC-7",     title: "Boundary Protection",                         book: book-cloudnative-posture, plane: 4, mechanism: "Cloud network-exposure and attack-path analysis (CNAPP) — internet-reachable workloads flagged", gate: fedramp, drivers: [nist-800-53r5, nist-800-207], slot: slot-03-network, ksi: [KSI-CNA], tool: false, necessity: false}
  - {control: "SI-3",     title: "Malicious Code Protection",                   book: book-cloudnative-posture, plane: 6, mechanism: "Container / workload runtime threat detection", gate: fedramp, drivers: [nist-800-53r5], slot: slot-06-security, ksi: [KSI-MLA], tool: false, necessity: false}
  - {control: "SA-11",    title: "Developer Testing and Evaluation",            book: book-cloudnative-posture, plane: 6, mechanism: "Shift-left IaC and container-image scanning in CI (CNAPP code security)", gate: fedramp, drivers: [nist-800-53r5, nist-800-218], slot: slot-06-security, ksi: [KSI-SVC], tool: false, necessity: false}

  # --- book-sn-cmdb : CMDB Reconciliation & Asset Identity (reconciled to IPAM/DDI) ---
  # Coordination, not truth: the CMDB is the workflow projection of asset state;
  # IPAM/DDI (Vol I Book 01) remains the CM-8 SSOT — no necessity anchor here.
