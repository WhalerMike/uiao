  - {control: "CM-3",     title: "Configuration Change Control",                book: book-sn-cmdb, plane: 6, mechanism: "Change Management as the CM-3 gate: every compliance-affecting change to M365/Azure carries an approved, reviewable change record before actuation", gate: fedramp, drivers: [nist-800-53r5, omb-a-130], slot: slot-06-security, ksi: [KSI-CMT], tool: false, necessity: false}

  # --- book-sn-m365 : M365 Federal Control Compliance Automation ---
  - {control: "CM-6",     title: "Configuration Settings",                      book: book-sn-m365, plane: 6, mechanism: "SCuBA / secure-baseline drift on the M365 SaaS surface raised as a ServiceNow Incident/Change task and tracked to closure (actuation stays platform-native)", gate: fedramp, drivers: [nist-800-53r5, cisa-scuba, cisa-bod-25-01], slot: slot-06-security, ksi: [KSI-CMT, KSI-SVC], tool: false, necessity: false, test: "Vol VI Book 08 — baseline conformance re-check (scheduled re-scan vs intended baseline)"}
  - {control: "AC-2",     title: "Account Management",                          book: book-sn-m365, plane: 3, mechanism: "Joiner/mover/leaver and Conditional-Access exception requests raised, approved, and access-reviewed as ServiceNow tasks over the Entra estate", gate: fedramp, drivers: [nist-800-53r5, omb-m-22-09], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "CA-7",     title: "Continuous Monitoring",                       book: book-sn-m365, plane: 6, mechanism: "M365 control-test results (Graph, SCuBA, Purview) ingested as attestation tasks feeding the KSI evidence pipeline", gate: fedramp, drivers: [nist-800-53r5, nist-800-137, fedramp-20x], slot: slot-04-telemetry, ksi: [KSI-MLA], tool: false, necessity: false, test: "Vol VI Book 08 — telemetry-completeness workbook (CA-7(3))"}

  # --- book-sn-azure : Azure Federal Control Compliance Automation ---
  - {control: "CM-6",     title: "Configuration Settings",                      book: book-sn-azure, plane: 6, mechanism: "Azure Policy / Defender-for-Cloud recommendations raised as ServiceNow remediation tasks; Azure-native remediation actuates, ServiceNow tracks to closure", gate: fedramp, drivers: [nist-800-53r5, cisa-scuba], slot: slot-06-security, ksi: [KSI-CMT], tool: false, necessity: false, test: "Vol VI Book 08 — baseline conformance re-check (scheduled re-scan vs intended baseline)"}
  - {control: "SI-2",     title: "Flaw Remediation",                            book: book-sn-azure, plane: 7, mechanism: "Azure Update Manager patch results reconciled into ServiceNow Change/Incident with SLA-class tasks keyed to KEV/exposure (actuation platform-native)", gate: fedramp, drivers: [nist-800-53r5, cisa-bod-26-04], slot: slot-05-endpoint, ksi: [KSI-SVC, KSI-MLA], tool: false, necessity: false}
  - {control: "RA-5",     title: "Vulnerability Monitoring and Scanning",       book: book-sn-azure, plane: 6, mechanism: "Defender for Cloud / MDVM findings on Azure workloads flow to ServiceNow Vulnerability Response as prioritized remediation tasks", gate: fedramp, drivers: [nist-800-53r5, cisa-bod-22-01], slot: slot-06-security, ksi: [KSI-MLA], tool: false, necessity: false}

  # --- book-sn-attestation : Control Attestation, Evidence & KSI ---
  - {control: "CA-2",     title: "Control Assessments",                         book: book-sn-attestation, plane: 6, mechanism: "ServiceNow IRM/GRC control tests and evidence tasks produce assessed control state feeding the authorization package", gate: fedramp, drivers: [nist-800-53r5], slot: slot-04-telemetry, ksi: [KSI-MLA], tool: false, necessity: false, test: "Vol VI Book 08 — detection-efficacy + deploy smoke tests"}
  - {control: "CA-5",     title: "Plan of Action and Milestones",               book: book-sn-attestation, plane: 6, mechanism: "POA&M items tracked as ServiceNow IRM issues/tasks with owner, milestone, and closure evidence", gate: fedramp, drivers: [nist-800-53r5, omb-a-130], slot: slot-06-security, ksi: [KSI-MLA], tool: false, necessity: false}
  - {control: "CA-7",     title: "Continuous Monitoring",                       book: book-sn-attestation, plane: 6, mechanism: "Compliance posture rolled up in ServiceNow and emitted as OSCAL/KSI evidence into the ConMon package (Vol IV Book 06 / Vol VI Book 07)", gate: fedramp, drivers: [nist-800-53r5, nist-800-137, cisa-cdm, fedramp-20x], slot: slot-04-telemetry, ksi: [KSI-MLA], tool: false, necessity: false, test: "Vol VI Book 08 — telemetry-completeness workbook (CA-7(3))"}

  # --- book-sn-saas : SaaS Integration Governance (Vol IX Book 05) ---
  # Onboarding a third-party SaaS is not one control event — it is the moment
  # ~24 controls are closed at the workflow plane, or silently skipped. Per the
  # Vol 0 Book 02 convention these are COORDINATION/EVIDENCE closures: the
  # architecture volumes own the primary closure (identity in Vol I Book 04,
  # naming in Vol I Book 01); this lane is where each is operated and evidenced
  # during provisioning. Rows are derived from servicenow-day2/saas-control-map.json
  # (Lane F) — control, KSI and slot come from the map, so the two cannot
  # disagree. SA-9 is the necessity anchor: nothing else in the estate answers
  # "is this CSO authorized to hold federal identity data?"
  - {control: "AC-20",     title: "Use of External Systems", book: book-sn-saas, plane: 3, mechanism: "The governed request records which organizational identity data leaves the boundary, to which external system, and under which authorization — closing the outbound direction that inbound-scoped external-access controls do not reach", gate: fedramp, drivers: [nist-800-53r5, omb-m-22-09], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "SA-9",      title: "External System Services", book: book-sn-saas, plane: 6, mechanism: "Every SaaS integration request is gated on a recorded FedRAMP Marketplace authorization verdict at or above the Moderate baseline before SSO or provisioning is configured; the verdict is re-checked on cadence and a lapsed authorization raises a task", gate: fedramp, drivers: [nist-800-53r5, fedramp-20x], slot: slot-06-security, ksi: [KSI-SCR], tool: false, necessity: true, alternative_rebuttal: "\"Restrict who can consent\" (SCuBA MS.AAD.5.1v1/5.2v1) is the nearest alternative and does not close this: consent restriction governs *who* approves an integration, not *whether the service on the far end is authorized to hold federal data*. A tenant fully compliant with admin-only consent still has an administrator correctly consenting to an unauthorized CSO — every gate passes, the boundary still leaks. Only an authorization verdict recorded against the integration closes SA-9."}
  - {control: "SA-9(2)",   title: "External System Services | Identification of Functions, Ports, Protocols, and Services", book: book-sn-saas, plane: 4, mechanism: "The CSO declares its SSO/SCIM endpoints, ports and protocols as a catalog record; the NGFW allow-list and DDI records derive from that record, so an undocumented endpoint is detectable as drift rather than invisible", gate: fedramp, drivers: [nist-800-53r5], slot: slot-03-network, ksi: [KSI-SCR], tool: false, necessity: false}
  - {control: "AC-4",      title: "Information Flow Enforcement", book: book-sn-saas, plane: 3, mechanism: "Each integration is classified from the attributes captured at request as assertion-only (transient) or SCIM (a standing directory replica), determining what organizational data may cross and whether an interconnection agreement applies", gate: fedramp, drivers: [nist-800-53r5], slot: slot-02-data, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "CA-3",      title: "Information Exchange", book: book-sn-saas, plane: 6, mechanism: "SCIM-provisioned integrations are classified as interconnections and gated on an approved ISA before the synchronization job is enabled; SSO-only integrations, which pass assertions without a standing replica, are recorded but do not require one", gate: fedramp, drivers: [nist-800-53r5, omb-a-130], slot: slot-06-security, ksi: [KSI-PIY], tool: false, necessity: false}
  - {control: "AC-5",      title: "Separation of Duties", book: book-sn-saas, plane: 3, mechanism: "Requester may never approve; privileged scopes and any SCIM path require a security approver distinct from the business owner, enforced pre-flight by the gate rather than by convention", gate: fedramp, drivers: [nist-800-53r5], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "CM-8",      title: "System Component Inventory", book: book-sn-saas, plane: 2, mechanism: "The service principal, its gallery template id, SSO mode and sync-job state are registered as a CMDB CI reconciled to the authoritative IPAM/DDI asset identity (CM-8 join key); an integration absent from the register is drift", gate: fedramp, drivers: [nist-800-53r5, cisa-bod-23-01], slot: slot-03-network, ksi: [KSI-PIY], tool: false, necessity: false}
  - {control: "CM-3",      title: "Configuration Change Control", book: book-sn-saas, plane: 6, mechanism: "Every compliance-affecting change to the integration — enabling SSO, enabling SCIM, widening attribute scope, rotating a credential — carries an approved, reviewable change record before actuation", gate: fedramp, drivers: [nist-800-53r5, omb-a-130], slot: slot-06-security, ksi: [KSI-CMT], tool: false, necessity: false}
  - {control: "IA-2",      title: "Identification and Authentication (Organizational Users)", book: book-sn-saas, plane: 3, mechanism: "Federation is configured via Graph through the in-boundary MID Server and the catalog records that SaaS-local credentials are disabled or exception-approved — enforcing 'SSO required', not merely 'SSO available'", gate: fedramp, drivers: [nist-800-53r5, omb-m-22-09], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "IA-4",      title: "Identifier Management", book: book-sn-saas, plane: 3, mechanism: "One enterprise identifier per person, sourced from the HR-derived worker record, is carried into the SaaS; the vendor never mints its own identifier for an organizational user, preventing per-app identity sprawl", gate: fedramp, drivers: [nist-800-53r5], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "IA-5(2)",   title: "Authenticator Management | Public Key-Based Authentication", book: book-sn-saas, plane: 3, mechanism: "The SAML token-signing certificate and SCIM bearer token are issued as authenticators with mandatory expiry — certificate-based where the SaaS supports it — never as a long-lived secret pasted into configuration", gate: fedramp, drivers: [nist-800-53r5, eo-14028], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "IA-5",      title: "Authenticator Management", book: book-sn-saas, plane: 3, mechanism: "Federation credentials are rotated automatically ahead of expiry with the SaaS-side update tracked as a change; the trust never depends on a human remembering a three-year certificate", gate: fedramp, drivers: [nist-800-53r5], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "SC-17",     title: "Public Key Infrastructure Certificates", book: book-sn-saas, plane: 6, mechanism: "Issuance, publication to the relying party, rollover and revocation of the token-signing certificate run under the agency certificate policy rather than accepting the identity provider's default self-signed certificate at setup", gate: fedramp, drivers: [nist-800-53r5], slot: slot-06-security, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "AC-2(1)",   title: "Account Management | Automated System Account Management", book: book-sn-saas, plane: 3, mechanism: "Enabling the synchronization job is automated account management: accounts in the SaaS are created, updated and removed from the authoritative directory, with scoping filter and attribute mapping carried in the approved change record", gate: fedramp, drivers: [nist-800-53r5], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "AC-3",      title: "Access Enforcement", book: book-sn-saas, plane: 3, mechanism: "User/group assignment is required on the enterprise application — never 'available to all users' — making the assignment the enforcement point the agency still controls once the trust exists", gate: fedramp, drivers: [nist-800-53r5], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "AC-6",      title: "Least Privilege", book: book-sn-saas, plane: 3, mechanism: "App roles are mapped from the authoritative org/assignment model rather than a vendor default; any role carrying administrative authority inside the SaaS requires a security approver", gate: fedramp, drivers: [nist-800-53r5], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "AC-2(3)",   title: "Account Management | Disable Accounts", book: book-sn-saas, plane: 3, mechanism: "The HR separation event drives disable/remove in the SaaS on the effective date with per-step evidence; separation-to-revocation interval inside the SaaS becomes a continuous-monitoring metric", gate: fedramp, drivers: [nist-800-53r5, omb-m-22-09], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "PS-5",      title: "Personnel Transfer", book: book-sn-saas, plane: 3, mechanism: "A mover event re-derives SaaS entitlements from the new assignment and raises an access review of the residual — the transfer is only visible to the SaaS because the HR event carries it", gate: fedramp, drivers: [nist-800-53r5], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: false}
  - {control: "AC-2(4)",   title: "Account Management | Automated Audit Actions", book: book-sn-saas, plane: 6, mechanism: "Creation, modification, enable/disable and removal of SaaS accounts emit audit records automatically, correlated to the originating HR or catalog event", gate: fedramp, drivers: [nist-800-53r5], slot: slot-04-telemetry, ksi: [KSI-MLA], tool: false, necessity: false}
  - {control: "AU-2",      title: "Event Logging", book: book-sn-saas, plane: 6, mechanism: "Provisioning and application sign-in telemetry for the integration are routed to the agency SIEM at onboarding rather than retrofitted after an incident — bounded by what the GCC-Moderate boundary permits the tenant to see", gate: fedramp, drivers: [nist-800-53r5, cisa-cdm], slot: slot-04-telemetry, ksi: [KSI-MLA], tool: false, necessity: false}
  - {control: "AU-6",      title: "Audit Record Review, Analysis, and Reporting", book: book-sn-saas, plane: 6, mechanism: "A named reviewer, a cadence and a closure record over the integration's audit trail — collection is AU-2; evidence that somebody looked is AU-6, and only an owned task produces it", gate: fedramp, drivers: [nist-800-53r5], slot: slot-04-telemetry, ksi: [KSI-MLA], tool: false, necessity: false}
  - {control: "CA-7",      title: "Continuous Monitoring", book: book-sn-saas, plane: 6, mechanism: "Cadence re-verification of the marketplace verdict, the owner and the attribute scope; a lapsed authorization or orphaned integration raises a task feeding the attestation and KSI evidence pipeline", gate: fedramp, drivers: [nist-800-53r5, nist-800-137, fedramp-20x], slot: slot-04-telemetry, ksi: [KSI-MLA], tool: false, necessity: false}
  - {control: "SI-12",     title: "Information Management and Retention", book: book-sn-saas, plane: 3, mechanism: "Which identity attributes flow to the SaaS, from which authoritative source, and the vendor's retention and deletion commitments are recorded where the data originates — lineage cannot be reconstructed from the vendor's copy at audit time", gate: fedramp, drivers: [nist-800-53r5, privacy-act], slot: slot-02-data, ksi: [KSI-PIY], tool: false, necessity: false}
  - {control: "AC-2",      title: "Account Management", book: book-sn-saas, plane: 3, mechanism: "Offboarding disables the sync job, removes assignments, revokes the federation trust and credential, confirms vendor-side deletion against the retention record and retires the CI — the step whose omission leaves a live replica behind", gate: fedramp, drivers: [nist-800-53r5], slot: slot-01-identity, ksi: [KSI-IAM], tool: false, necessity: false}

