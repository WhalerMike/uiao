# Deck spec — Vol V Book 01, OrgComp The Compliance Track.
# Distilled from docs/customer-documents/orgcomp-series/Vol_V_Book_01_OrgComp_Compliance_Track.qmd
# Schema + build command: BUILD-DERIVATIVES.md §1 (the host repo's deck generator).
# Build:
#   <deck generator> \
#     --spec "docs/customer-documents/orgcomp-series/specs/Vol_V_Book_01.yaml" \
#     --out  "docs/customer-documents/orgcomp-series/Vol_V_Book_01_OrgComp_Compliance_Track.pptx" \
#     --date-code "2026-07-09 13:44 ET"
deck:
  title: "The Compliance Track"
  subtitle: "The eight evidence slots as curriculum — book → control → KSI → evidence"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOL V · BOOK 01"
  date_code: "2026-07-18 06:20 ET"
  journey:
    - "Read"
    - "Control"
    - "KSI"
    - "Evidence"
  sources:
    fedramp_20x: "https://www.fedramp.gov/20x/"
    nist_800_53: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
    ksi_mappings: "https://github.com/WhalerMike/uiao/tree/main/src/uiao/adapters/fedramp_aan_catalog/mappings"

slides:
  # 1 -----------------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for the compliance track — the first content book of
      Volume V. This is the reading of the corpus an assessor, ISSO, or ConMon
      operator needs: the eight evidence slots turned into modules, each tracing
      a book to the NIST control it closes to the FedRAMP 20x KSI that scores it
      to the evidence that proves it. Walk the journey strip — Read, Control,
      KSI, Evidence — because it is the shape of every module. Keep FedRAMP scope
      at Moderate. Note the draft disclaimer and that all closure claims are
      self-assessed pending SCA and PMO/AO review.

  # 2 -----------------------------------------------------------------------
  - type: content
    kicker: "WHY A TRACK, NOT A CHECKLIST"
    title: "Tooling measures drift; it cannot author the intended state"
    layout: grid
    cards:
      - title: "Read"
        body: "The AAN book(s), by volume coordinate, bound to each evidence slot."
        accent: navy
      - title: "Control"
        body: "The NIST SP 800-53 Rev 5 anchor controls the slot closes."
        accent: teal
      - title: "KSI"
        body: "The FedRAMP 20x Key Security Indicator category that scores the closure."
        accent: amber
      - title: "Evidence"
        body: "The concrete artifact or CLI run proving the chain end-to-end."
        accent: red
    callout:
      text: "10 of the 29 internal KSI rules are attestable by ScuBA-class tooling alone; the other 19 bind to slots a workforce built. This track certifies the tracing skill those 19 require."
      accent: navy
    notes: >
      The track's reason to exist: conformance tooling measures drift from an
      intended state but cannot author one. Ten of the series' twenty-nine
      internal KSI rules are attestable by ScuBA-class tooling alone; the other nineteen bind to
      evidence slots that exist only because a workforce built the architecture
      in Volumes I through IV. The four cards are the fixed shape of every
      module — Read, Control, KSI, Evidence. The discipline underneath is Closure
      Necessity: for each slot, name the mechanism and the reason no scanner
      finding or policy document substitutes for it.

  # 3 -----------------------------------------------------------------------
  - type: table
    kicker: "THE EIGHT EVIDENCE SLOTS"
    title: "Each module is one slot — feeding books, controls, and KSI"
    headers: ["Slot", "Feeding books", "Anchor / KSI"]
    rows:
      - cells: ["1 Identity", "Vol I Bk 03/04/05 · Vol II Bk 01 · Vol III Bk 01", "IA-2 / AC-2 · KSI-IAM"]
        accent: navy
      - cells: ["2 Addressing", "Vol I Bk 01 (Bk 02 pending)", "CM-8 / AC-4 · KSI-PIY"]
      - cells: ["3 Network", "Vol I Bk 05/06/07 · Vol II Bk 03", "SC-8 / SC-7 / CA-7 · KSI-CNA"]
      - cells: ["4 Telemetry", "Vol III Bk 02/05/06/07", "CA-7 / SI-4 · KSI-MLA"]
      - cells: ["5 Endpoint", "Vol I Bk 02 · Vol III Bk 01/03/04 · Vol IV Bk 04", "CM-8 / IA-3 · KSI-PIY"]
      - cells: ["6 Security / Change", "Vol III Bk 04/06 · Vol IV Bk 02/03", "CM-2 / AC-4 · KSI-CMT"]
      - cells: ["7 Continuity", "Vol IV Bk 01", "CP-2 / CP-4 · KSI-RPL"]
      - cells: ["8 Training", "Vol IV Bk 05 (Bk 06 context)", "AT-2/3/4 · KSI-CED"]
        accent: teal
    callout:
      text: "With slot 8 active, all 29 internal KSI-decomposition rules are evaluable. The 19 slot-bound rules are the coverage gap this track closes."
      accent: navy
    notes: >
      The reference map for the track, one row per module. Feeding books are
      volume coordinates; the last column pairs the NIST anchor with the KSI
      category the OSCAL emitter scores. Slot 2 notes that NAC (Vol I Book 02)
      feeds device-identity-at-the-port but its formal binding is pending the
      adapter mapping refresh. Slots 4 and 6 are partially tool-attestable; the
      rest depend on architecture a workforce built. With slot 8 — training —
      active, all twenty-nine internal KSI-decomposition rules are evaluable; ten via the ScuBA adapter,
      nineteen bound to these slots.

  # 4 -----------------------------------------------------------------------
  - type: content
    kicker: "THE CAPSTONE"
    title: "The eight-slot walk — a ConMon narrative an assessor could read"
    layout: columns
    cards:
      - title: "Name and trace"
        body: "For all eight slots: feeding books, anchor controls, and closure status."
        accent: navy
        status: "Slots 1–8"
      - title: "Real verdicts"
        body: "Per-KSI satisfied / not-satisfied / not-evaluated from an actual <engine> oscal ksi-ar run."
        accent: teal
        status: "ksi-ar.json"
      - title: "Gaps with deadlines"
        body: "For anything not-evaluated or stale, the gap and the date it answers to (Vol IV Book 06 freshness rules)."
        accent: amber
        status: "BOD 26-04"
    callout:
      text: "Pass = every slot at level 2+, at least three slots assessor-ready (level 3), scored against Vol V Book 03."
      accent: navy
    notes: >
      The capstone is a single document, or an annotated ksi-ar export, that for
      all eight slots names the feeding books, lists the anchor controls and
      closure status, shows the per-KSI verdict from a real <engine> oscal ksi-ar
      run, and states the gap and its deadline for anything not-evaluated or
      stale. It is deliberately the skeleton of a ConMon narrative. It is graded
      against the rubric ladder in Vol V Book 03 — a pass is every slot at level
      two or higher with at least three slots assessor-ready.

  # 5 -----------------------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "From documents to a workforce that can trace the evidence"
    layout: columns
    cards:
      - title: "Reads every volume"
        body: "Depends on Volumes I–IV as the evidence sources for the eight slots."
        accent: teal
        status: "Vol I–IV"
      - title: "Pairs with Book 02"
        body: "The implementation track builds the same sources and lands the artifacts this track scores."
        accent: navy
        status: "→ Vol V Bk 02"
      - title: "Self-evidencing"
        body: "The tracing competency is itself the AT-2/AT-3 closure that KSI-CED scores."
        accent: amber
        status: "Slot 8"
    callout:
      text: "An assessor who can state why a closure is the only path has closed the slot; one who can only recite 'satisfied' has not."
      accent: navy
    notes: >
      Close on the through-line. The compliance track turns the corpus from a set
      of documents into a workforce that can trace book to control to KSI to
      evidence for every slot. It depends on all of Volumes I through IV as its
      evidence sources, pairs with Volume V Book 02 which builds those sources and
      lands the artifacts this track scores, and is itself self-evidencing — the
      tracing competency it certifies is the AT-2/AT-3 closure that KSI-CED reads.
      Leave the audience with the discipline: an assessor who can state why a
      closure is the only path has closed the slot; one who can only recite that
      it is satisfied has not.
    vendor_sources: ["fedramp_20x", "nist_800_53", "ksi_mappings"]
