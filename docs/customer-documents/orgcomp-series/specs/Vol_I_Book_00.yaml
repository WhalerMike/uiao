# Deck spec — Vol I Book 00, OrgComp Foundation & Transport (Volume I Overview).
# Distilled from docs/customer-documents/orgcomp-series/Vol_I_Book_00_OrgComp_Foundation_Transport_Overview.qmd
# Schema + build command: BUILD-DERIVATIVES.md §1 (the host repo's deck generator).
# Build:
#   <deck generator> \
#     --spec "docs/customer-documents/orgcomp-series/specs/Vol_I_Book_00.yaml" \
#     --out  "docs/customer-documents/orgcomp-series/Vol_I_Book_00_OrgComp_Foundation_Transport_Overview.pptx" \
#     --date-code "2026-07-09 09:54 ET"
deck:
  title: "Volume I Overview — Foundation & Transport"
  subtitle: "The naming, identity, and transport substrate every other volume depends on"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOL I · BOOK 00"
  date_code: "2026-07-09 09:54 ET"
  journey:
    - "Name"
    - "Identify"
    - "Transport"
    - "Enforce"
  sources:
    fedramp_marketplace: "https://marketplace.fedramp.gov/"
    infoblox_ddi: "https://marketplace.fedramp.gov/products/FR2017257053/"
    niap_pcl: "https://www.niap-ccevs.org/Product/"
    disa_stig: "https://public.cyber.mil/stigs/"
    cisa_tic3: "https://www.cisa.gov/resources-tools/programs/trusted-internet-connections-tic"

slides:
  # 1 -----------------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for Volume I of the Federal Application-Aware Networking
      series — the volume overview, not a content book. Volume I is the floor
      the entire program stands on: before a control can be scanned, an identity
      authorized, a workload consolidated, or an authorization package assembled,
      four things must already exist and be authoritative. A naming and
      addressing plane — DNS, DHCP, IPAM, and certificate issuance. A device and
      cryptographic identity plane. An organizational identity source of truth.
      And an encrypted, governed transport between sites and clouds. Volume I
      builds all four. Walk the journey strip — Name, Identify, Transport,
      Enforce — because it is the arc of the whole volume: you name and address
      first, prove identity second, carry it over governed transport third, and
      enforce at the customer-owned edge fourth. Keep the FedRAMP scope at
      Moderate throughout; the series never claims a level above Moderate. Note
      the draft disclaimer: this is pre-decisional CSI Team material, not an
      approved Agency position.

  # 2 -----------------------------------------------------------------------
  - type: content
    kicker: "VOLUME PURPOSE"
    title: "Volume I establishes the substrate every other volume depends on"
    layout: grid
    cards:
      - title: "Naming & addressing"
        body: "DNS, DHCP, IPAM, and certificate issuance — the authoritative plane that lets everything above it be named and correlated."
        accent: navy
      - title: "Device & crypto identity"
        body: "802.1X at the wire and certificates/tokens for users, devices, and workloads — path-independent, session-less proof."
        accent: teal
      - title: "Organizational SSOT"
        body: "The HRIT human/organizational source of truth every account and access decision asserts against."
        accent: amber
      - title: "Governed transport"
        body: "Encrypted, application-aware SD-WAN + SASE under TIC 3.0, and the customer-owned edge that enforces at the boundary."
        accent: red
    callout:
      text: "You cannot inventory what you cannot name, authorize what you cannot identify, or encrypt a circuit that has no overlay."
      accent: navy
    notes: >
      This slide states the volume's purpose in one frame: Volume I is where the
      truth planes — naming/addressing and identity — are established, together
      with the transport and customer-owned edge enforcement that carry and
      protect everything above them. The four cards map the four things that must
      exist before any downstream control is evaluable. The callout is the
      volume's governing claim, the series' Closure Necessity doctrine at its
      foundation: you cannot inventory what you cannot name, authorize what you
      cannot identify, or encrypt a circuit that has no overlay. The single most
      important consequence to voice: remove Volume I and the controls claimed in
      Volumes II through IV do not merely degrade — they become unevaluable.
      There is nothing authoritative to correlate them against.

  # 3 -----------------------------------------------------------------------
  - type: table
    kicker: "BOOKS IN THIS VOLUME"
    title: "Seven books build the foundation and transport substrate"
    headers: ["Book", "Title", "Role"]
    rows:
      - cells: ["Book 01", "Landing Zone, IPAM/DDI, FedRAMP", "The authoritative naming/addressing plane — the CM-8 asset-identity join key the whole program correlates on"]
        accent: navy
      - cells: ["Book 02", "Network Access Control (802.1X)", "Device identity at the physical port (IA-3) — what is connected, proven at the wire"]
      - cells: ["Book 03", "Certificates & Tokens", "Cryptographic identity for users, devices, and workloads — path-independent, session-less"]
      - cells: ["Book 04", "HRIT Identity & Org SSOT", "The human/organizational source of truth every account and access decision asserts"]
      - cells: ["Book 05", "Network Modernization", "Entra ID, ZTNA, and Active Governance — session-to-token identity modernization"]
      - cells: ["Book 06", "Federal Telecom Modernization", "SD-WAN + SASE under TIC 3.0 — encrypted, application-aware transport"]
      - cells: ["Book 07", "Network Enforcement Substrate", "Cisco / Palo Alto / Juniper at the customer edge — NIAP / DISA STIG / FIPS 140-3 / DoDIN APL"]
        accent: teal
    callout:
      text: "Book 01's naming-plane join key is the correlation anchor; Books 06–07 close the customer-owned half of SC-7/SC-8 no CSP covers."
      accent: navy
    notes: >
      This is the reference table for the volume — seven books, read top to
      bottom as the substrate assembles. Book 01 is the naming and addressing
      plane and the single most load-bearing artifact: the CM-8 asset-identity
      join key that the Multi-Cloud Evidence Fabric later correlates five
      management stacks against. Books 02 and 03 establish device and
      cryptographic identity — 802.1X proving what is connected at the wire, and
      certificates and tokens providing session-less proof for users, devices,
      and workloads. Book 04 is the HRIT organizational source of truth that
      SailPoint and every access decision sit on. Book 05 modernizes identity to
      Entra ID and ZTNA with Active Governance. Books 06 and 07 are transport and
      edge: SD-WAN plus SASE under TIC 3.0, and the customer-owned Cisco, Palo
      Alto, and Juniper gear accredited through the NIAP, DISA STIG, FIPS 140-3,
      and DoDIN APL gate rather than through FedRAMP. InfoBlox DDI holds a FedRAMP
      Moderate authorization (CSO FR2017257053); verify every vendor status on
      the Marketplace at procurement time.
    vendor_sources: ["infoblox_ddi", "niap_pcl", "disa_stig", "cisa_tic3"]

  # 4 -----------------------------------------------------------------------
  - type: content
    kicker: "HOW THIS VOLUME FITS THE PROGRAM"
    title: "Volume I is the floor; the rest of the series is built on it"
    layout: columns
    cards:
      - title: "Feeds the evidence fabric"
        body: "The naming-plane join key (Book 01) is what lets the Multi-Cloud Evidence Fabric (Vol III Book 07) correlate five management stacks into one compliance picture."
        accent: navy
        status: "→ Vol III"
      - title: "Feeds data & identity"
        body: "The identity SSOT (Book 04) is what SailPoint and every access decision sit on; cryptographic identity (Book 03) is applied to the database tier in Volume II."
        accent: teal
        status: "→ Vol II"
      - title: "Closes the customer edge"
        body: "Transport + edge enforcement (Books 06–07) close the customer-owned half of SC-7/SC-8 — the half no CSP's FedRAMP authorization covers."
        accent: amber
        status: "SC-7 / SC-8"
    callout:
      text: "Truth planes (naming, identity) are depended on and stable; enforcement planes (edge gear) are re-platformable per vendor."
      accent: navy
    notes: >
      This slide places Volume I in the program. Everything downstream draws on
      it. The naming-plane join key from Book 01 is the correlation anchor for the
      Multi-Cloud Evidence Fabric in Volume III — without one authoritative asset
      identity, five stacks produce five inventories that cannot be reconciled.
      The identity source of truth from Book 04 is the substrate SailPoint and
      every access decision rest on. The cryptographic identity from Book 03 is
      carried forward and applied to the database tier in Volume II. And the
      transport and edge enforcement of Books 06 and 07 are where the
      customer-owned half of the SC-7 boundary and SC-8 transmission controls is
      closed — the half no cloud provider's FedRAMP package can cover, because the
      provider does not operate the branch firewall or the WAN edge. Voice the
      series' recurring separation: the truth planes here are depended upon and
      meant to be stable, while the enforcement planes are re-platformable per
      vendor without disturbing the truth they enforce.

  # 5 -----------------------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "Name it, prove it, carry it, enforce it — then build on it"
    layout: columns
    cards:
      - title: "Necessary"
        body: "No downstream control is evaluable without an authoritative naming and identity floor."
        accent: teal
        status: "Established"
      - title: "Customer-owned seam"
        body: "The edge past the CSP boundary is the agency's to accredit — NIAP/STIG/FIPS/APL, not FedRAMP."
        accent: amber
        status: "Book 07"
      - title: "Next"
        body: "Volume II applies this substrate to the data tier and proves it holds under production load."
        accent: navy
        status: "→ Vol II"
    callout:
      text: "Volume I is the floor. Volumes II–IV are built on it — and become unevaluable without it."
      accent: navy
    notes: >
      Close on the through-line. Volume I is necessary but, by design, not
      sufficient on its own — it is the floor, not the ceiling. The three cards
      summarize the take-aways: the naming and identity floor is what makes every
      downstream control evaluable at all; the customer-owned edge past the cloud
      provider's boundary is a structural obligation the agency accredits through
      NIAP, DISA STIG, FIPS 140-3, and DoDIN APL rather than FedRAMP; and the
      handoff from here is Volume II, which applies this exact substrate to the
      database tier and proves it holds under real production load. Leave the
      audience with the closing claim: remove Volume I and the rest of the series
      does not degrade, it becomes unevaluable — which is why this volume comes
      first.
