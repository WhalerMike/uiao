# Deck spec — Vol II Book 00, OrgComp Data Platform (Volume II Overview).
# Distilled from docs/customer-documents/orgcomp-series/Vol_II_Book_00_OrgComp_Data_Platform_Overview.qmd
# Schema + build command: BUILD-DERIVATIVES.md §1 (the host repo's deck generator).
# Build:
#   <deck generator> \
#     --spec "docs/customer-documents/orgcomp-series/specs/Vol_II_Book_00.yaml" \
#     --out  "docs/customer-documents/orgcomp-series/Vol_II_Book_00_OrgComp_Data_Platform_Overview.pptx" \
