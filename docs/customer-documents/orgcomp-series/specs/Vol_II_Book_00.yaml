deck:
  title: "Volume II Overview — Data Platform"
  subtitle: "Applying the identity and transport substrate of Volume I to the database tier"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOL II · BOOK 00"
  date_code: "2026-07-09 09:54 ET"
  journey:
    - "Eliminate secrets"
    - "Migrate"
    - "Consolidate"
    - "Prove"
  sources:
    azure_arc_sql: "https://learn.microsoft.com/en-us/azure/azure-arc/data/managed-identity-authentication"
    entra_sql: "https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-overview"
    fedramp_marketplace: "https://marketplace.fedramp.gov/"

slides:
  # 1 -----------------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for Volume II of the Federal Application-Aware Networking
      series — the volume overview, not a content book. Volume II takes the
      identity and transport substrate that Volume I built and applies it to the
      data tier, where most federal business systems keep their crown jewels. The
      framing to establish up front: the database layer carries exactly the same
      credential vulnerabilities as the identity and network layers above it —
      stored passwords, NTLM fallback, manual rotation, and no continuous
      evidence — but it has usually been left out of the modernization
      conversation. Walk the journey strip: eliminate stored secrets, migrate the
      estate, consolidate within the limits physics allows, and prove it
      continuously. Keep FedRAMP scope at Moderate throughout. Note the draft
      disclaimer: this is pre-decisional CSI Team material, not an approved Agency
      position.

  # 2 -----------------------------------------------------------------------
  - type: content
    kicker: "VOLUME PURPOSE"
    title: "Volume II applies Volume I's substrate to the data tier"
    layout: grid
    cards:
      - title: "The same surface"
        body: "The database layer carries the same credential vulnerabilities as identity and network — stored passwords, NTLM fallback, manual rotation, no continuous evidence."
        accent: red
      - title: "Eliminate stored credentials"
        body: "Arc Managed Identity and token-based authentication remove stored SQL credentials; NTLM is eliminated; Entra Conditional Access becomes the SQL perimeter."
        accent: navy
      - title: "Operational runbooks"
        body: "Estate discovery, Arc deployment, login migration, NTLM remediation, and continuous monitoring — the steps to actually execute the migration."
        accent: teal
      - title: "Network physics"
        body: "The speed-of-light propagation floor and consistency-class alignment govern how far a database can be consolidated before physics, not procurement, decides."
        accent: amber
    callout:
      text: "The database is the first large estate where the series' workload-identity progression is executed end to end."
      accent: navy
    notes: >
      This slide states the volume's purpose. Volume II closes the database
      credential surface: it eliminates stored SQL credentials through Azure Arc
      Managed Identity and token-based authentication, it provides the
      operational runbooks that make the migration executable rather than
      aspirational, and it resolves the network-physics constraints — the
      speed-of-light propagation floor and consistency-class alignment — that
      govern how far a database can be consolidated before physics decides the
      answer instead of the procurement office. The callout is the volume's
      strategic point: the database is the first large estate where the series'
      workload-identity progression is executed end to end. That makes Volume II
      both an application of the Volume I substrate and a proof that the substrate
      holds under real production load. The Arc and Entra authentication claims
      are Microsoft-documented; verify FedRAMP status on the Marketplace at
      procurement time.
    vendor_sources: ["azure_arc_sql", "entra_sql"]

  # 3 -----------------------------------------------------------------------
  - type: table
    kicker: "BOOKS IN THIS VOLUME"
    title: "Three books close the database credential surface"
    headers: ["Book", "Title", "Role"]
    rows:
      - cells: ["Book 01", "SQL Server Authentication Modernization", "Arc Managed Identity replaces stored credentials; NTLM eliminated; Entra Conditional Access as the SQL perimeter"]
        accent: navy
      - cells: ["Book 02", "SQL Server Implementation Guide", "The operational runbook — estate discovery, Arc deployment, login migration, NTLM remediation, continuous monitoring"]
        accent: teal
      - cells: ["Book 03", "Database Consolidation & Network Physics", "Speed-of-light floor, consistency-class-to-transport alignment, SD-WAN traffic separation for replication"]
        accent: amber
    callout:
      text: "Book 01 states the target; Book 02 makes it executable; Book 03 bounds how far consolidation can physically go."
      accent: navy
    notes: >
      The reference table for the volume, read as a sequence. Book 01 sets the
      target state: Arc Managed Identity replaces stored credentials, NTLM
      authentication is eliminated, and Entra Conditional Access becomes the
      perimeter around SQL — the same identity-first model the rest of the series
      applies, now brought to the data tier. Book 02 is the operational runbook
      that turns that target into a set of executable steps: discover the estate,
      deploy Arc, migrate logins, remediate NTLM, and stand up continuous
      monitoring. Book 03 is the physics book: it establishes the speed-of-light
      propagation floor, aligns each workload's consistency class to the
      transport it requires, and separates replication traffic on the SD-WAN so
      consolidation decisions are bounded by physics rather than by wishful
      architecture. The through-line: state the target, make it executable, then
      bound how far it can physically reach.

  # 4 -----------------------------------------------------------------------
  - type: content
    kicker: "HOW THIS VOLUME FITS THE PROGRAM"
    title: "The bridge between the substrate and the volumes that follow"
    layout: columns
    cards:
      - title: "Consumes Volume I"
        body: "Takes the cryptographic identity of Vol I Book 03 (Certificates & Tokens) and the transport of Vol I Books 05–06."
        accent: navy
        status: "← Vol I"
      - title: "Feeds Business Continuity"
        body: "Geo-replicated DR replicas are the Section-5 recovery content the Business Continuity book (Vol IV Book 01) assembles into a CP-2 plan."
        accent: teal
        status: "→ Vol IV"
      - title: "Feeds the evidence fabric"
        body: "The continuous SQL compliance record emits into the Multi-Cloud Evidence Fabric (Vol III Book 07) like every other source."
        accent: amber
        status: "→ Vol III"
    callout:
      text: "Volume II both applies the substrate and proves it holds under real production load."
      accent: navy
    notes: >
      This slide places Volume II in the program. It sits in the middle of the
      dependency chain: it consumes the cryptographic identity of Vol I Book 03
      and the transport of Vol I Books 05 and 06 — Volume I's outputs are Volume
      II's inputs — and it feeds two downstream volumes. Its geo-replicated
      disaster-recovery replicas become the Section-5 recovery content that the
      Business Continuity book in Volume IV assembles into a CP-2 contingency
      plan. And its continuous SQL compliance record emits into the Multi-Cloud
      Evidence Fabric in Volume III exactly like every other source of evidence
      in the program. Voice the closing point: Volume II is the bridge between the
      substrate and the operational and governance volumes that follow, and by
      running the workload-identity model end to end on a real production estate,
      it proves the Volume I substrate holds under load.

  # 5 -----------------------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "Secrets eliminated, estate migrated, consolidation bounded by physics"
    layout: columns
    cards:
      - title: "Credential surface closed"
        body: "Stored SQL credentials and NTLM are gone; Entra Conditional Access is the perimeter."
        accent: teal
        status: "Established"
      - title: "Physics is the limit"
        body: "Consolidation is bounded by the speed-of-light floor and consistency class, not by procurement."
        accent: amber
        status: "Book 03"
      - title: "Next"
        body: "Volume III turns the continuous SQL record into part of one correlated evidence picture."
        accent: navy
        status: "→ Vol III"
    callout:
      text: "The substrate holds under production load — and now emits continuous evidence into the fabric."
      accent: navy
    notes: >
      Close on the through-line. Volume II has taken the identity and transport
      substrate and closed the database credential surface: stored SQL
      credentials and NTLM are eliminated, and Entra Conditional Access is the
      SQL perimeter. It has established that consolidation is bounded by network
      physics — the speed-of-light propagation floor and consistency-class
      alignment — not by procurement preference. And it hands off downstream: its
      DR replicas feed the CP-2 plan in Volume IV, and its continuous SQL
      compliance record joins the Multi-Cloud Evidence Fabric in Volume III as one
      more correlated source. Leave the audience with the proof point: running the
      workload-identity progression end to end on a production database estate is
      what demonstrates the Volume I substrate actually holds under load.
