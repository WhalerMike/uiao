    fedramp_20x: "https://www.fedramp.gov/20x/"

slides:
  # 1 --- title --------------------------------------------------------------
  - type: title
    notes: >
      Opening frame for Volume VI, Book 06 — the deployable realization of the
      configuration and posture architecture set out in Volume III. Volume III
      makes the sharp point that conformance tooling measures drift from an
      intended state but cannot author one. This book authors the intended
      state as machine-enforced policy, detects deviation from it continuously,
      and reconciles or reports what it finds. Walk the journey strip, because
      it is the shape of every baseline in the book: Author the baseline as
      policy-as-code mapped from SCuBA, CIS, or DISA STIG; Assign it to the
      target scope; Detect drift with a continuous compliance scan; and
      Reconcile — auto-remediate the safe rules and open a POA&M for the rest.
      This is the loop CM-6 actually requires: an enforced configuration, a
      detection of deviation, and a documented reconciliation — not a
      spreadsheet of settings someone once applied. Keep FedRAMP scope at
      Moderate throughout; this is the Agency Moderate edition. Note the draft
      disclaimer: this was developed by the Cloud Services Infrastructure team
      and is not yet reviewed or approved by the Agency CIO Office, OIS, or
      leadership, and every closure claim here is self-assessed pending
      security control assessment and PMO/AO review.

  # 2 --- section ------------------------------------------------------------
  - type: section
    kicker: "PART ONE"
    title: "An unenforced baseline is a document, not a control"
    callout: "CM-6 is closed only when the baseline is machine-enforced and every drift is detected and dispositioned."
    callout_accent: navy
    notes: >
      This section motivates the whole book before we enumerate the artifacts.
      The Closure Necessity argument is the thesis: Volume III proves that a
      scanner measures drift but cannot author the intended state. A hardening
      guide applied once and filed in SharePoint is not a baseline — it is a
      memory of one. NIST SP 800-53 Rev 5 CM-6 requires the organization to
      establish and document configuration settings, and then to identify,
      document, and approve any deviations. Both halves matter. A spreadsheet of
      settings no pipeline applies closes nothing, because there is no enforcing
      mechanism and no evidence of currency. A scanner pointed at hosts with no
      authored baseline has nothing to measure against, so it produces noise
      instead of a verdict. The control is satisfied only where the intended
      state exists as code, a mechanism enforces or audits it continuously, and
      each deviation carries a disposition — remediated, or governed as a
      documented exception. That is the standard this book holds itself to, and
      it is the difference between a hardening event and a standing control an
      assessor can trust between audits.

  # 3 --- content grid -------------------------------------------------------
  - type: content
    kicker: "THE CM-6 CLOSED LOOP"
    title: "Four moves turn a one-time hardening into a standing control"
    layout: grid
    cards:
      - title: "Author"
        body: "The baseline definition — SCuBA, CIS, or STIG settings mapped to policy-as-code. This is the intended state, versioned and reviewable."
        accent: navy
      - title: "Assign"
        body: "Policy assignment to the target scope binds the intended state to real subscriptions, resource groups, and hosts (CM-2)."
        accent: teal
      - title: "Detect"
        body: "A continuous compliance scan produces a drift record every time the fleet diverges from the authored setting (CM-3, CM-6)."
        accent: amber
      - title: "Reconcile"
        body: "Auto-remediate the safe, idempotent rules; open a POA&M and feed SI-2 where human judgment is required."
        accent: red
    callout:
      text: "The last two moves — Detect and Reconcile — are what convert a hardening guide into a control CM-6 recognizes."
      accent: navy
    notes: >
      These four cards are the baseline lifecycle, and they map one-to-one onto
      the journey strip. Author and Assign are the parts most programs already
      do: someone writes down the settings and applies them. The book's point is
      that those two alone are a one-time hardening, not a control. Detect and
      Reconcile are what make it standing. Detect means a continuous compliance
      scan that emits a drift record — not a quarterly manual review — so CM-3
      change control and CM-6 settings-conformance are evidenced between audits.
      Reconcile means every drift has a disposition: the idempotent, low-blast-
      radius rules auto-remediate, and everything that needs human judgment
      becomes a POA&M item and a feed into the SI-2 flaw-remediation queue. Note
      the deliberate red on the Reconcile card: reconciliation is where
      availability risk lives, because a baseline that auto-remediates a setting
      the estate depends on is an availability incident, not a security win.
      That is why the book splits rules into remediate and report, and why the
      split is itself reviewed in the pull request rather than assumed safe.

  # 4 --- table -------------------------------------------------------------
  - type: table
    kicker: "THE BASELINE LIFECYCLE"
    title: "Each stage produces an artifact bound to a control"
    headers: ["Stage", "Artifact", "Control tie"]
    rows:
      - cells: ["Author", "Baseline definition — SCuBA/CIS/STIG mapped to policy", "CM-6 settings"]
        accent: navy
      - cells: ["Assign", "Policy assignment to the target scope", "CM-2 baseline"]
      - cells: ["Detect", "Continuous compliance scan produces a drift record", "CM-3 change; CM-6"]
        accent: amber
      - cells: ["Reconcile / report", "Auto-remediate where safe; POA&M where not", "CM-6; SI-2 feed"]
        accent: teal
    callout:
      text: "The Detect and Reconcile rows are the ones that make CM-6 continuously attestable rather than point-in-time."
      accent: navy
    notes: >
      This is the reference table for the lifecycle, one row per stage, each
      tied to the NIST SP 800-53 Rev 5 control it feeds. Author produces the
      baseline definition — SCuBA for the cloud business applications, CIS or
      DISA STIG for the platforms — expressed as policy-as-code so it is
      versioned, diffable, and reviewable, satisfying the CM-6 requirement to
      document configuration settings. Assign binds that definition to a scope,
      which is the CM-2 baseline-configuration act: the intended state is now
      attached to named subscriptions, resource groups, and hosts, not merely
      described. Detect is the continuous compliance scan; every divergence
      becomes a drift record, which is both a CM-3 change signal and the
      evidence CM-6 needs to be continuously conformant. Reconcile is the
      disposition step: safe rules auto-remediate, unsafe ones become a POA&M
      and an SI-2 flaw-remediation feed. Emphasize to the audience that a
      program that stops after the first two rows has a hardening project; a
      program that runs all four has a control. The whole book exists to make
      the bottom two rows real and evidenced.

  # 5 --- content grid ------------------------------------------------------
  - type: content
    kicker: "DEPLOYABLE ARTIFACTS"
    title: "Four artifact families realize the Volume III posture"
    layout: grid
    cards:
      - title: "SCuBA conformance packs"
        body: "ScubaGear assessment plus policy-as-code for the cloud business apps; equivalent CIS cloud-benchmark packs on other CSPs. Realizes the CM-6 cloud baseline."
        accent: navy
      - title: "Guest / machine-config baselines"
        body: "Azure Machine Config for OS settings; AWS SSM State Manager or GCP OS Config as substitutions. Realizes CM-2/6 OS configuration."
        accent: teal
      - title: "Host hardening roles"
        body: "Ansible or DSC roles mapped to STIG/CIS for least functionality (CM-6/7); Chef or Puppet equivalents preserve the mechanism."
        accent: amber
      - title: "Drift detection + reconciliation"
        body: "Config-drift export to the evidence contract feeds CM-3 change control and the SI-2 flaw queue; native compliance exports substitute per CSP."
        accent: red
    callout:
      text: "Products are deployed examples; the substitution columns preserve the mechanism on any CSP."
      accent: navy
    notes: >
      These are the four artifact families the book ships, each realizing a
      piece of the Volume III posture. Frame them as deployed examples, not
      mandates: the mechanism is uniform across clouds, but the pack content is
      not, which is exactly why each family carries a multi-CSP substitution.
      SCuBA conformance packs are the cloud-business-application counterpart to
      host hardening — the ScubaGear assessment output is diffed against the
      intended SCuBA baseline, and CISA publishes SCuBA as the secure-
      configuration baseline for Microsoft 365 and Google Workspace. Guest and
      machine-config baselines carry OS settings; the deployed example is Azure
      Machine Config, with AWS SSM State Manager and GCP OS Config as the
      substitutions that preserve the same detect-and-remediate mechanism. Host
      hardening roles apply STIG and CIS content through Ansible or DSC for CM-7
      least functionality. The fourth family, drift detection and
      reconciliation, is the one that makes the other three evidential: the
      drift record is exported to the Book VI-07 evidence contract, so CM-6 is
      continuously attestable and SI-2 sees the remediation feed. Keep the Agency
      Moderate scope in mind — none of this is chosen because it is Microsoft;
      it is chosen where it genuinely coordinates the multi-vendor surface, and
      the substitution columns exist so no CSP is assumed.
    vendor_sources: ["cisa_scuba", "scubagear", "cis_benchmarks", "disa_stig", "azure_machine_config", "aws_ssm_state_manager", "gcp_os_config", "ansible"]

  # 6 --- content columns ---------------------------------------------------
  - type: content
    kicker: "THE REMEDIATE / REPORT SPLIT"
    title: "A baseline declares the desired setting and what to do when the fleet drifts"
    layout: columns
    cards:
      - title: "Remediate"
        body: "Idempotent, low-blast-radius rules auto-correct on drift — e.g. Administrator-account-disabled. Safe to close without a human in the loop."
        accent: teal
        status: "onDrift: remediate"
      - title: "Report"
        body: "Rules where auto-remediation risks a break — e.g. disabling the SMBv1 client driver — are reported, not silently corrected, and routed to human judgment."
        accent: amber
        status: "onDrift: report"
      - title: "Governed exception"
        body: "A SCuBA deviation the estate genuinely needs is carried as a documented, policy-backed exception — so an assessor sees a governed gap, not a silent one."
        accent: navy
        status: "documented deviation"
    callout:
      text: "The remediate/report split is reviewed in the pull request — auto-remediating a setting the estate depends on is an availability incident, not a security win."
      accent: amber
    notes: >
      This slide unpacks the book's illustrative machine-config baseline, whose
      whole design point is that the baseline declares both the desired setting
      and the on-drift action. The three columns are the three dispositions. The
      remediate path is for idempotent, low-blast-radius rules — the book's
      example is the Administrator account status set to Disabled, a rule that
      is safe to auto-correct because re-applying it cannot break a dependent
      workload. The report path exists precisely because not every drift can be
      closed without judgment; the book's example is the SMBv1 client driver,
      where a legacy dependency might mean auto-remediation takes down a share.
      Report emits the drift and routes it to a human rather than acting. The
      third column is the governed exception: a SCuBA deviation the estate
      genuinely needs is carried as a documented, policy-backed deviation, so
      the assessor sees a governed exception rather than an open drift or a
      silent gap. Stress the callout: the split between remediate and report is
      itself reviewed in the pull request, because the deployment guidance is to
      assign every baseline in audit-only mode first and measure the drift
      population before enabling any auto-remediation. That review discipline is
      what keeps CM-6 enforcement from becoming a self-inflicted availability
      incident.
    vendor_sources: ["azure_machine_config", "cisa_scuba"]

  # 7 --- section -----------------------------------------------------------
  - type: section
    kicker: "PART TWO"
    title: "Deploying the baseline safely"
    callout: "Audit first, split the rules, wire the evidence, feed the queue — in that order."
    callout_accent: teal
    notes: >
      The second half of the book is deployment sequence, and the order is not
      arbitrary — it is designed so that enforcement never outruns the program's
      understanding of its own estate. The next slide walks the four steps as a
      progressive build. The governing principle is that a baseline which
      auto-remediates a setting the estate silently depends on is an
      availability incident, so the sequence deliberately measures before it
      acts and wires evidence before it declares closure. This is the
      operate-and-tune discipline the whole of Volume VI is built around: deploy
      is not the finish line, it is the start of a standing control that has to
      keep proving itself. Notice how the four steps map onto the NIST control
      story in order: audit-only exercises the CM-6 detect capability without
      enforcement; the reviewed remediate/report split is the CM-3 change-control
      decision made visible; wiring the evidence contract is what makes CM-6
      continuously attestable through Book VI-07; and feeding SI-2 and the POA&M
      is the honest accounting that keeps every un-auto-remediated condition
      owned and deadlined. Each step is a gate the baseline must pass before it
      earns more authority over production, and a program that runs them out of
      order — enforcing before it has measured, or declaring closure before it
      has wired evidence — has skipped the very controls that make the baseline
      trustworthy. Present this as the safe path from an authored baseline to an
      enforced, evidenced, and accounted-for CM-6 loop.

  # 8 --- build-sequence ----------------------------------------------------
  - type: build-sequence
    kicker: "THE DEPLOYMENT SEQUENCE"
    title: "How a baseline goes from authored to continuously evidenced"
    notes: "Fallback presenter notes; each step carries its own."
    steps:
      - label: "Assign audit-only"
        sub: "measure the drift population"
        accent: navy
        detail: >
          Assign every baseline in audit-only mode first and measure the drift
          population before enabling any auto-remediation. You cannot know
          whether a rule is safe to remediate until you see how much of the
          estate currently diverges from it — the audit-only pass is that
          measurement. Enabling remediation blind is how a baseline becomes an
          availability incident.
        notes: >
          Step one is the safety valve for the entire deployment. Assign each
          baseline in audit-only mode and let it run long enough to produce a
          real drift population. This is the CM-6 detect capability operating
          before any enforcement, and it answers the only question that makes
          remediation safe: how much of the estate currently diverges from this
          setting, and would correcting it break something. A rule that shows
          near-universal drift is almost certainly load-bearing for the estate
          and belongs on the report path, not the remediate path. Skipping this
          step and enabling auto-remediation directly is the classic
          self-inflicted outage — the baseline is correct in the abstract and
          catastrophic in practice. The audit-only pass turns that gamble into a
          measured decision. In practice you let the audit-only assignment run
          long enough to capture the estate's real variance — across maintenance
          windows, patch cycles, and the long tail of legacy hosts — because a
          short sample under-counts the drift that matters. The output of this
          step is not just a number; it is a per-rule drift population that
          feeds the very next step, where each rule is classified as safe to
          remediate or requiring human judgment. Treat this as the CM-6 detect
          capability proving itself before it is ever allowed to act, and record
          the audit-only findings as evidence in their own right — they document
          the starting posture the enforcement is measured against.
      - label: "Split remediate / report"
        sub: "reviewed in the pull request"
        accent: teal
        detail: >
          Split the rules into remediate — safe, idempotent, low-blast-radius —
          and report, which needs human judgment. The split is not a one-time
          engineering call; it is reviewed in the pull request against the
          audit-only drift data, so the decision to auto-correct a setting is
          visible and accountable.
        notes: >
          Step two operationalizes what the audit-only pass revealed. Every rule
          is classified as remediate or report. Remediate rules are idempotent
          and low-blast-radius — re-applying them cannot break a dependent
          workload. Report rules need human judgment because the drift may
          reflect a real dependency. The important discipline is that this split
          is reviewed in the pull request, using the measured drift population
          as evidence, not asserted by a single engineer. That review is itself
          part of the CM-3 change-control story: the decision to let a control
          auto-modify production configuration is documented, peer-reviewed, and
          reversible. It also means the report path is a deliberate, defensible
          choice rather than an admission of incomplete automation. Concretely,
          a rule like disabling the Administrator account is a natural remediate
          candidate — idempotent and safe — while a rule like disabling the
          SMBv1 client driver belongs on the report path until someone confirms
          no legacy dependency will break. The pull-request record of that
          classification is durable evidence: months later an assessor can see
          not only which settings auto-remediate but who decided they were safe
          and on what drift data. That traceability is what separates a governed
          enforcement decision from an engineer's unreviewed default, and it is
          the reason the split lives in version control rather than in a console
          toggle.
      - label: "Wire the evidence contract"
        sub: "Book VI-07 — CM-6 continuously evidenced"
        accent: amber
        detail: >
          Wire drift and reconciliation records to the evidence contract so CM-6
          is continuously evidenced rather than attested once a year. Every
          drift detection and every reconciliation becomes an evidence record —
          not a dashboard tile that disappears on refresh, but a durable,
          control-bound artifact the ConMon pipeline can emit into the package.
        notes: >
          Step three is what makes the control attestable. Drift and
          reconciliation records are wired to the Book VI-07 evidence contract,
          so CM-6 conformance is continuously evidenced rather than reconstructed
          at audit time. The key idea is that a drift record is not a dashboard
          tile — a tile shows current state and forgets history. An evidence
          record is durable, timestamped, and bound to CM-6 and its KSI theme,
          so the ConMon pipeline can emit it into the OSCAL authorization
          package. This is the seam where this book hands off to Book VI-07:
          the baseline mechanism produces the evidence, and the evidence pipeline
          carries it into the package an assessor reads. Without this step the
          baseline may be perfectly enforced and completely invisible to the
          authorization process. The record that gets wired is deliberately rich:
          the rule, the desired value, the observed value, the disposition, and a
          pointer back to the raw compliance row, so the claim of conformance is
          traceable to source rather than asserted. Once wired, CM-6 conformance
          for this baseline is refreshed on every scan cycle and carried into the
          OSCAL package automatically, which is what continuous evidencing
          actually means — not a screenshot captured the week before an audit,
          but a standing feed. This is also the point where Book VI-06 stops
          being a standalone hardening effort and becomes a citizen of the
          volume-wide evidence fabric.
      - label: "Feed SI-2 and the POA&M"
        sub: "unremediated drift becomes tracked work"
        accent: red
        detail: >
          Feed unremediated drift into the SI-2 remediation queue and the POA&M.
          A report-path drift or a governed exception is not closed — it is
          tracked work with an owner and a due date, so nothing sits as a silent
          open gap outside the authorization's line of sight.
        notes: >
          Step four closes the loop for everything the automation deliberately
          did not fix. Report-path drifts and governed exceptions are real open
          conditions, and they belong in the SI-2 flaw-remediation queue and the
          POA&M — tracked work with an owner and a milestone date, not a silent
          gap. This is the honest-accounting move that keeps the program's risk
          posture truthful: the automation closes what it safely can, and
          everything else is visible, owned, and deadlined. It also connects the
          configuration story to flaw remediation, because a drift that reflects
          an unpatched or misconfigured component is exactly the kind of finding
          SI-2 exists to track. By the end of the four steps the baseline is
          authored, safely enforced, continuously evidenced, and honestly
          accounted for — the full CM-6 loop, operating. The discipline to
          emphasize is that closure is never silent: a setting the automation
          chose not to touch is not a gap that disappears, it is tracked work
          with an owner and a due date, visible to the AO in the same POA&M that
          carries every other open condition. That honesty is what lets an
          assessor trust the green findings — they know the program is not hiding
          the settings it could not safely enforce, it is carrying them in the
          open. A baseline program that auto-remediates what it can and openly
          tracks what it cannot is exactly the standing control CM-6 was written
          to require.

  # 9 --- table -------------------------------------------------------------
  - type: table
    kicker: "CONTROLS OPERATIONALIZED"
    title: "What this book deploys, mapped to NIST 800-53r5"
    headers: ["Control", "Title", "How this book deploys it"]
    rows:
      - cells: ["CM-2 / CM-6", "Baseline Configuration / Settings", "Policy-as-code baselines plus continuous drift detection"]
        accent: navy
      - cells: ["CM-3", "Configuration Change Control", "Drift records and reconciliation carried through the pipeline"]
      - cells: ["CM-7", "Least Functionality", "Host hardening roles and admission control"]
        accent: teal
      - cells: ["SI-2", "Flaw Remediation", "Drift and patch-state feed into the remediation queue"]
        accent: amber
    callout:
      text: "Every row is deployed and continuously evidenced through Book VI-07 — the mapping is a claim the ConMon pipeline can substantiate."
      accent: navy
    notes: >
      This is the control-to-deployment mapping, the answer to an assessor who
      asks which NIST SP 800-53 Rev 5 controls this book actually operationalizes.
      CM-2 and CM-6 are the core: policy-as-code baselines establish the
      documented configuration, and continuous drift detection keeps the settings
      conformant between audits. CM-3 configuration change control is satisfied
      because every drift is a change record and every reconciliation is a
      documented change carried through the pipeline. CM-7 least functionality is
      deployed through the host hardening roles — STIG and CIS content that
      strips unneeded services and, with admission control, prevents non-conforming
      workloads. SI-2 flaw remediation is fed by the drift and patch-state
      export, so a configuration drift that reflects an unremediated flaw lands
      in the same queue as a vulnerability finding. The callout is the honest
      framing: this mapping is only as good as the evidence behind it, and every
      row is continuously evidenced through the Book VI-07 pipeline, so the claim
      is one the OSCAL package can substantiate rather than an aspiration. All of
      this is scoped to FedRAMP Moderate for this series, and every closure
      is self-assessed pending SCA and AO review.
    vendor_sources: ["nist_800_53"]

  # 10 --- content columns --------------------------------------------------
  - type: content
    kicker: "HONEST LIMITS"
    title: "What baselines-as-code do not solve"
    layout: columns
    cards:
      - title: "Remediation has a ceiling"
        body: "Auto-remediation is safe only for idempotent, low-blast-radius settings. The report path exists because not every drift can close without human judgment."
        accent: amber
        status: "By design"
      - title: "Baselines age out"
        body: "SCuBA, CIS, and STIG baselines are point-in-time. They must track the publishing authority's updates or the baseline silently drifts out of currency."
        accent: red
        status: "Track upstream"
      - title: "Multi-CSP is per-pack"
        body: "CSPM findings on multi-CSP estates need per-CSP packs. The detect-and-reconcile mechanism is uniform; the pack content is not."
        accent: navy
        status: "Mechanism ≠ content"
    callout:
      text: "Naming the limits is part of the control — an assessor trusts a baseline program that knows where its own edges are."
      accent: navy
    notes: >
      Every book in the series ends by naming its own edges, because a program
      that oversells its coverage is one an assessor learns to distrust. Three
      limits matter here. First, auto-remediation has a ceiling: it is safe only
      for idempotent, low-blast-radius settings, and the report path is not a
      gap in the automation but a deliberate acknowledgment that some drift needs
      human judgment before it is touched. Second, baselines age. SCuBA, CIS, and
      DISA STIG content is point-in-time; the publishing authorities revise it,
      and a baseline that does not track upstream updates silently ages out of
      currency while still reporting green. The operational discipline is to
      treat baseline currency as its own monitored condition. Third, multi-CSP
      coverage is per-pack: the detect-and-reconcile mechanism is uniform across
      clouds, but the actual pack content is CSP-specific, so a multi-CSP estate
      needs per-CSP packs and cannot assume one benchmark covers all. None of
      these limits undercuts the control; naming them precisely is part of what
      makes the CM-6 story credible, and each maps to standing operational work
      rather than a one-time fix.

  # 11 --- closing ----------------------------------------------------------
  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "From a hardening guide to an enforced, evidenced CM-6 loop"
    layout: columns
    cards:
      - title: "Deploys Volume III"
        body: "The secure-configuration posture Volume III specified is now machine-enforced policy with continuous drift detection."
        accent: teal
        status: "Vol III realized"
      - title: "Emits to Book VI-07"
        body: "Every drift and reconciliation is an evidence record, so CM-6 is continuously attestable in the authorization package."
        accent: navy
        status: "→ Book VI-07"
      - title: "Validated by Book VI-08"
        body: "Baseline conformance is re-checked by the test harnesses, so drift past reconciliation is caught, not assumed away."
        accent: amber
        status: "→ Book VI-08"
    callout:
      text: "A baseline no pipeline enforces is a document; a baseline authored, enforced, evidenced, and validated is a control."
      accent: navy
    notes: >
      Close on the through-line. This book took the secure-configuration posture
      Volume III specified — SCuBA for the cloud business applications, CIS and
      STIG for the platforms — and turned it into machine-enforced policy-as-code
      with continuous drift detection and a disciplined reconcile-or-report
      disposition. It does not stand alone: it emits every drift and
      reconciliation to the Book VI-07 evidence contract, so CM-6 is continuously
      attestable in the OSCAL authorization package, and its conformance is
      re-checked by the Book VI-08 test harnesses, so drift past reconciliation is
      caught by a test rather than discovered in an incident. Leave the audience
      with the discipline that opened the book: a baseline no pipeline enforces is
      a document, not a control, and CM-6 is satisfied only when the intended
