# AAN briefing-deck spec — Vol VI Book 06: Configuration Baselines & Hardening.
# Distills docs/customer-documents/orgcomp-series/Vol_VI_Book_06_OrgComp_Configuration_Baselines_Hardening.qmd
# Schema + build command: BUILD-DERIVATIVES.md §1 (the host repo's deck generator).
