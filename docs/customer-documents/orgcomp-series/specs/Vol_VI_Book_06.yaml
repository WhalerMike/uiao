#     --date-code "2026-07-09 17:00 ET"
deck:
  title: "Configuration Baselines & Hardening"
  subtitle: "SCuBA, CIS, and STIG baselines as policy-as-code — with continuous drift detection and reconciliation"
  series_kicker: "Federal AAN — Volume VI: Implementation"
  date_code: "2026-07-09 17:00 ET"
  journey:
    - "Author"
    - "Assign"
    - "Detect"
    - "Reconcile"
  sources:
    cisa_scuba: "https://www.cisa.gov/resources-tools/services/secure-cloud-business-applications-scuba-project"
    scubagear: "https://github.com/cisagov/ScubaGear"
    cis_benchmarks: "https://www.cisecurity.org/cis-benchmarks"
    disa_stig: "https://public.cyber.mil/stigs/"
    azure_machine_config: "https://learn.microsoft.com/azure/governance/machine-configuration/overview"
    aws_ssm_state_manager: "https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-state.html"
    gcp_os_config: "https://cloud.google.com/compute/docs/os-configuration-management"
    ansible: "https://docs.ansible.com/ansible/latest/index.html"
