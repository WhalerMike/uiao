<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;">
<rect width="1180" height="640" fill="#FFFFFF"/>
<defs>
  <marker id="an" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1F3A5F"/></marker>
  <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1A9E8F"/></marker>
</defs>

<text x="40" y="44" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#1F3A5F">The OrgComp Evidence &amp; Authorization Contract</text>
<text x="40" y="70" font-size="15" fill="#1A9E8F">Three inputs, two outputs — any conformant engine may satisfy it. The series names none.</text>

<!-- OrgComp books source -->
<rect x="40" y="270" width="150" height="90" rx="8" fill="#1F3A5F"/>
<text x="115" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">OrgComp books</text>
<text x="115" y="330" text-anchor="middle" font-size="11" fill="#C9D4E0">architecture corpus</text>
<text x="115" y="345" text-anchor="middle" font-size="11" fill="#C9D4E0">(stands alone)</text>

<line x1="190" y1="315" x2="228" y2="315" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>

<!-- Three inputs -->
<text x="360" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#5B6B7C">THREE INPUTS</text>
<rect x="232" y="180" width="256" height="66" rx="8" fill="#E6F5F2" stroke="#1F3A5F" stroke-width="1.5"/>
<text x="360" y="207" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">1 — Compliance spine</text>
<text x="360" y="228" text-anchor="middle" font-size="11" fill="#1E293B">control - mechanism - slot - KSI (SSOT)</text>

<rect x="232" y="258" width="256" height="66" rx="8" fill="#E6F5F2" stroke="#1F3A5F" stroke-width="1.5"/>
<text x="360" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">2 — Evidence slot records</text>
<text x="360" y="306" text-anchor="middle" font-size="11" fill="#1E293B">eight slots, machine-readable</text>

<rect x="232" y="336" width="256" height="66" rx="8" fill="#E6F5F2" stroke="#1F3A5F" stroke-width="1.5"/>
<text x="360" y="363" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">3 — Cadence + dispositions</text>
<text x="360" y="384" text-anchor="middle" font-size="11" fill="#1E293B">CA-7 cadence; nothing always satisfied</text>

<line x1="488" y1="291" x2="530" y2="291" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>

<!-- Engine (swappable) -->
<rect x="532" y="216" width="256" height="150" rx="10" fill="#EAF1FB" stroke="#1F3A5F" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="660" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1F3A5F">ANY conformant</text>
<text x="660" y="294" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1F3A5F">evidence engine</text>
<text x="660" y="326" text-anchor="middle" font-size="11.5" fill="#5B6B7C">purpose-built · COTS GRC ·</text>
<text x="660" y="343" text-anchor="middle" font-size="11.5" fill="#5B6B7C">native OSCAL tooling</text>

<line x1="788" y1="291" x2="830" y2="291" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#at)"/>

<!-- Two outputs -->
<text x="960" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#5B6B7C">TWO OUTPUTS</text>
<rect x="832" y="220" width="308" height="66" rx="8" fill="#1A9E8F"/>
<text x="986" y="247" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">A — OSCAL AP + AR + POA&amp;M</text>
<text x="986" y="268" text-anchor="middle" font-size="11" fill="#E6F5F2">the authorization bundle</text>

<rect x="832" y="296" width="308" height="66" rx="8" fill="#1A9E8F"/>
<text x="986" y="323" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">B — Continuous-monitoring stream</text>
<text x="986" y="344" text-anchor="middle" font-size="11" fill="#E6F5F2">re-emitted on cadence</text>

<!-- swappable note -->
<text x="660" y="404" text-anchor="middle" font-size="12" font-style="italic" fill="#1A9E8F">OSCAL boundary = the engine is swappable; the corpus is untouched</text>

<!-- Invariants strip -->
<rect x="40" y="452" width="1100" height="150" rx="10" fill="#F3F5F8" stroke="#C9D4E0" stroke-width="1.5"/>
<text x="64" y="482" font-size="14" font-weight="bold" fill="#1F3A5F">Five conformance invariants — the whole contract</text>
<g font-size="12" fill="#1E293B">
  <rect x="64" y="498" width="205" height="86" rx="7" fill="#FFFFFF" stroke="#C9D4E0"/>
  <text x="166" y="536" text-anchor="middle" font-weight="bold" fill="#1F3A5F">1  Spine is SSOT</text>
  <text x="166" y="558" text-anchor="middle">CI gates every closure</text>

  <rect x="279" y="498" width="205" height="86" rx="7" fill="#FFFFFF" stroke="#C9D4E0"/>
  <text x="381" y="530" text-anchor="middle" font-weight="bold" fill="#1F3A5F">2  Mechanism,</text>
  <text x="381" y="548" text-anchor="middle" font-weight="bold" fill="#1F3A5F">not product</text>
  <text x="381" y="570" text-anchor="middle">names protocol, not vendor</text>

  <rect x="494" y="498" width="205" height="86" rx="7" fill="#FFFFFF" stroke="#C9D4E0"/>
  <text x="596" y="536" text-anchor="middle" font-weight="bold" fill="#1F3A5F">3  Slot record is truth</text>
  <text x="596" y="558" text-anchor="middle">narrative never overrides</text>

  <rect x="709" y="498" width="205" height="86" rx="7" fill="#FFFFFF" stroke="#C9D4E0"/>
  <text x="811" y="530" text-anchor="middle" font-weight="bold" fill="#1F3A5F">4  Nothing always</text>
  <text x="811" y="548" text-anchor="middle" font-weight="bold" fill="#1F3A5F">satisfied</text>
  <text x="811" y="570" text-anchor="middle">every item has a disposition</text>

  <rect x="924" y="498" width="192" height="86" rx="7" fill="#FFFFFF" stroke="#C9D4E0"/>
  <text x="1020" y="530" text-anchor="middle" font-weight="bold" fill="#1F3A5F">5  OSCAL is the</text>
  <text x="1020" y="548" text-anchor="middle" font-weight="bold" fill="#1F3A5F">boundary</text>
  <text x="1020" y="570" text-anchor="middle">open-format, swappable</text>
</g>
</svg>
