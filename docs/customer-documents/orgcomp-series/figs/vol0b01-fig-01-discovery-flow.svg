<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#1A9E8F"/>
    </marker>
    <marker id="arw-navy" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#1F3A5F"/>
    </marker>
  </defs>

  <text x="800" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#1F3A5F">Product Inventory Questionnaire — Discovery Flow</text>
  <text x="800" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5A6B7B">How the intake instrument feeds AAN product selection and boundary decisions</text>
  <rect x="40" y="190" width="280" height="380" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M50,190 h260 a10,10 0 0 1 10,10 v86 h-280 v-86 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="180.0" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 1 · INTAKE</text>
  <foreignObject x="50" y="228" width="260" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:22px;font-weight:700;color:#FFFFFF;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">Purpose &amp; Two Editions</div>
  </foreignObject>
  <foreignObject x="56" y="294" width="248" height="268">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:21px;color:#2A2A2A;line-height:1.32;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">Inventory the tools the agency already operates and map each onto the AAN architecture. Agency edition (pre-filled, hard scope) vs. Federal edition (§1).</div>
  </foreignObject>
  <rect x="350" y="190" width="280" height="380" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M360,190 h260 a10,10 0 0 1 10,10 v86 h-280 v-86 a10,10 0 0 1 10,-10 z" fill="#D4860B"/>
  <text x="490.0" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 2 · SCOPE RULE</text>
  <foreignObject x="360" y="228" width="260" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:22px;font-weight:700;color:#FFFFFF;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">FedRAMP Moderate Gate</div>
  </foreignObject>
  <foreignObject x="366" y="294" width="248" height="268">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:21px;color:#2A2A2A;line-height:1.32;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">Every in-boundary dependency must be FedRAMP Certified at Class C (Moderate). High-only, gear, and unauthorized products are dispositioned here (§2).</div>
  </foreignObject>
  <rect x="660" y="190" width="280" height="380" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M670,190 h260 a10,10 0 0 1 10,10 v86 h-280 v-86 a10,10 0 0 1 10,-10 z" fill="#1A9E8F"/>
  <text x="800.0" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 3 · DISCOVERY</text>
  <foreignObject x="670" y="228" width="260" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:22px;font-weight:700;color:#FFFFFF;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">Inventory Each Category</div>
  </foreignObject>
  <foreignObject x="676" y="294" width="248" height="268">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:21px;color:#2A2A2A;line-height:1.32;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">For every category across Volumes I–IV, record In use? · Product &amp; offering · FedRAMP status · Deployment surface. The Maps-to column is pre-filled (§3–4).</div>
  </foreignObject>
  <rect x="970" y="190" width="280" height="380" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M980,190 h260 a10,10 0 0 1 10,10 v86 h-280 v-86 a10,10 0 0 1 10,-10 z" fill="#C0392B"/>
  <text x="1110.0" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 4 · FLAGS &amp; GAPS</text>
  <foreignObject x="980" y="228" width="260" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:22px;font-weight:700;color:#FFFFFF;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">Roll Up Exceptions</div>
  </foreignObject>
  <foreignObject x="986" y="294" width="248" height="268">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:21px;color:#2A2A2A;line-height:1.32;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">Anything failing the scope rule — or missing entirely — rolls into the flag list: the procurement / boundary-decision agenda (§5).</div>
  </foreignObject>
  <rect x="1280" y="190" width="280" height="380" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M1290,190 h260 a10,10 0 0 1 10,10 v86 h-280 v-86 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="1420.0" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 5 · SELECTION</text>
  <foreignObject x="1290" y="228" width="260" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:22px;font-weight:700;color:#FFFFFF;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">Map to Book &amp; Plane</div>
  </foreignObject>
  <foreignObject x="1296" y="294" width="248" height="268">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial, Helvetica, sans-serif;font-size:21px;color:#2A2A2A;line-height:1.32;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">Each answer feeds an AAN book and functional plane, driving coordination-stack selection and inherited-control claims — Microsoft preference earned by cross-vendor coordination.</div>
  </foreignObject>
  <line x1="320" y1="380.0" x2="350" y2="380.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <line x1="630" y1="380.0" x2="660" y2="380.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <line x1="940" y1="380.0" x2="970" y2="380.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <line x1="1250" y1="380.0" x2="1280" y2="380.0" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <rect x="40" y="640" width="1520" height="96" rx="8" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="64" y="674" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1F3A5F">Scope-rule dispositions (Step 2):</text>
  <text x="64" y="710" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1a7f4f">✅  Class C (Moderate) → in scope</text>
  <text x="439" y="710" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#D4860B">⚠️  Class D (High)-only → flag</text>
  <text x="814" y="710" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1F3A5F">↪️  On-prem gear → NIAP / STIG / FIPS</text>
  <text x="1189" y="710" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#C0392B">❌  Not authorized → flag / replace</text>
  <rect x="49" y="764" width="1502" height="96" rx="8" fill="#F4F7FA" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="800" y="819.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#1F3A5F">Discovery instrument, not an authorization artifact or procurement decision — it produces the visibility required before a coordination stack is chosen or a control inherited.</text>
</svg>
