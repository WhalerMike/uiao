<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1A9E8F"/></marker>
  </defs>

  <text x="800" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#1F3A5F">Identity &amp; Access Governance (Vol IX Book 06)</text>
  <text x="800" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5A6B7B">The governance layer over the request lane &#8212; event-driven JML, certification campaigns, IAM evidence</text>

  <!-- Step 1 — HR event -->
  <rect x="50" y="205" width="330" height="380" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M60,205 h310 a10,10 0 0 1 10,10 v78 h-330 v-78 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="215" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 1</text>
  <text x="215" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">HR event</text>
  <text x="70" y="340" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">An effective-dated</text>
  <text x="70" y="374" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">joiner, mover, or leaver</text>
  <text x="70" y="408" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">event from the HRIT Org</text>
  <text x="70" y="442" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">SSOT &#8212; the truth plane.</text>
  <rect x="70" y="510" width="290" height="44" rx="8" fill="#EDF2FA"/>
  <text x="215" y="539" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1F3A5F">AC-2 &#183; IA-4</text>

  <path d="M382 395 L436 395" stroke="#1A9E8F" stroke-width="4" fill="none" marker-end="url(#arw-teal)"/>

  <!-- Step 2 — Lifecycle action -->
  <rect x="440" y="205" width="330" height="380" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M450,205 h310 a10,10 0 0 1 10,10 v78 h-330 v-78 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="605" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 2</text>
  <text x="605" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Lifecycle action</text>
  <text x="460" y="340" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">Provision, re-derive, or</text>
  <text x="460" y="374" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">de-provision within SLA;</text>
  <text x="460" y="408" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">high-risk events held for</text>
  <text x="460" y="442" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">second-party approval.</text>
  <rect x="460" y="510" width="290" height="44" rx="8" fill="#EDF2FA"/>
  <text x="605" y="539" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1F3A5F">AC-2 &#183; AC-5 &#183; IA-5</text>

  <path d="M772 395 L826 395" stroke="#1A9E8F" stroke-width="4" fill="none" marker-end="url(#arw-teal)"/>

  <!-- Step 3 — Certify (teal accent) -->
  <rect x="830" y="205" width="330" height="380" rx="10" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="2"/>
  <path d="M840,205 h310 a10,10 0 0 1 10,10 v78 h-330 v-78 a10,10 0 0 1 10,-10 z" fill="#1A9E8F"/>
  <text x="995" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#CDEEE9">STEP 3</text>
  <text x="995" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Certify</text>
  <text x="850" y="340" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">Scheduled user, manager,</text>
  <text x="850" y="374" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">app-owner, and privileged</text>
  <text x="850" y="408" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">campaigns with SSOT</text>
  <text x="850" y="442" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">context; revocation</text>
  <text x="850" y="476" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">triggers remediation.</text>
  <rect x="850" y="510" width="290" height="44" rx="8" fill="#E2F4F1"/>
  <text x="995" y="539" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1A9E8F">AC-6</text>

  <path d="M1162 395 L1216 395" stroke="#1A9E8F" stroke-width="4" fill="none" marker-end="url(#arw-teal)"/>

  <!-- Step 4 — Evidence -->
  <rect x="1220" y="205" width="330" height="380" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M1230,205 h310 a10,10 0 0 1 10,10 v78 h-330 v-78 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="1385" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">STEP 4</text>
  <text x="1385" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Evidence</text>
  <text x="1240" y="340" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">Immutable audited</text>
  <text x="1240" y="374" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">records on the join key,</text>
  <text x="1240" y="408" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">exported OSCAL-</text>
  <text x="1240" y="442" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243248">compatibly to attestation.</text>
  <rect x="1240" y="510" width="290" height="44" rx="8" fill="#FBF0D9"/>
  <text x="1385" y="539" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#B27210">AU-2 &#8594; CA-2 / CA-7</text>

  <!-- loop-back annotation -->
  <path d="M1385 585 C1385 680, 215 680, 215 590" stroke="#B9C2CC" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
  <path d="M207 602 L215 586 L223 602 Z" fill="#B9C2CC"/>
  <text x="800" y="708" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-style="italic" fill="#5A6B7B">The next vintage of truth re-enters the loop &#8212; certification findings and residuals feed the next campaign</text>

  <!-- Footer banner -->
  <rect x="50" y="760" width="1500" height="96" rx="10" fill="#EDF2FA"/>
  <text x="800" y="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1F3A5F">Actuation via the in-boundary MID &#8212; never standing admin &#183; HRIT and IPAM/DDI remain the truth planes</text>
  <text x="800" y="834" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#243248">Kit Expansion Phase 2 &#8212; gated on requirements v1.0 sign-off &#183; FedRAMP Moderate + GCC Moderate only</text>
</svg>
