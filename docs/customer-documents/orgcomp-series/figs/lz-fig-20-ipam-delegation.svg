<svg viewBox="0 0 1040 520" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;">
<rect width="1040" height="520" fill="#FFFFFF"/>
<defs>
  <marker id="arw-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#1F3864"/>
  </marker>
  <marker id="arw-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#2E7D32"/>
  </marker>
  <marker id="arw-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#C55A11"/>
  </marker>
  <marker id="arw-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#4A148C"/>
  </marker>
</defs>

<!-- Title -->
<text x="520" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3864">InfoBlox IPAM — Least-Privilege Delegation Model</text>
<text x="520" y="46" text-anchor="middle" font-size="11" fill="#2E75B6">Grid Master on on-premises VMware; functions delegated to owning CIO Component by role</text>

<!-- ── Grid Master (Center) ── -->
<rect x="370" y="70" width="300" height="120" rx="8" fill="#1F3864"/>
<text x="520" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">InfoBlox NIOS Grid Master</text>
<text x="520" y="113" text-anchor="middle" font-size="10" fill="#9DC3E6">On-Premises · VMware ESXi VM</text>
<text x="520" y="131" text-anchor="middle" font-size="10" fill="#BDD7EE">Central policy authority — Grid Admin role</text>
<text x="520" y="149" text-anchor="middle" font-size="10" fill="#BDD7EE">Full DDI: DNS · DHCP · IPAM · SCEP triggers</text>
<text x="520" y="167" text-anchor="middle" font-size="9" fill="#9DC3E6">Trust anchor for all Grid Members</text>

<!-- ═══════ Delegated Role Boxes ═══════ -->

<!-- 1. DNS Zone Management — Network / DNS Team -->
<rect x="20" y="250" width="200" height="120" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<rect x="20" y="250" width="200" height="28" rx="6" fill="#1565C0"/>
<text x="120" y="269" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">DNS Zone Management</text>
<text x="120" y="296" text-anchor="middle" font-size="9" fill="#0D47A1">Owner: Network / DNS Team</text>
<text x="120" y="312" text-anchor="middle" font-size="9" fill="#333">Read/write: owned zones only</text>
<text x="120" y="328" text-anchor="middle" font-size="9" fill="#333">Cannot view other CIO zones</text>
<text x="120" y="344" text-anchor="middle" font-size="9" fill="#333">DNSSEC key custody: shared</text>
<text x="120" y="360" text-anchor="middle" font-size="9" fill="#1565C0">Closes: SC-20 · SC-22 · AU-12</text>

<!-- 2. DHCP Scope Management — Network Infra Team -->
<rect x="250" y="250" width="200" height="120" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
<rect x="250" y="250" width="200" height="28" rx="6" fill="#2E7D32"/>
<text x="350" y="269" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">DHCP Scope Management</text>
<text x="350" y="296" text-anchor="middle" font-size="9" fill="#1B5E20">Owner: Network Infrastructure</text>
<text x="350" y="312" text-anchor="middle" font-size="9" fill="#333">Read/write: assigned IP ranges</text>
<text x="350" y="328" text-anchor="middle" font-size="9" fill="#333">Cannot modify DNS records</text>
<text x="350" y="344" text-anchor="middle" font-size="9" fill="#333">IPAM auto-creates A/PTR on lease</text>
<text x="350" y="360" text-anchor="middle" font-size="9" fill="#2E7D32">Closes: CM-8 · SA-9 · AC-4</text>

<!-- 3. SCEP / Cert Binding — PKI / Security (OIS) -->
<rect x="480" y="250" width="200" height="120" rx="6" fill="#F3E5F5" stroke="#4A148C" stroke-width="2"/>
<rect x="480" y="250" width="200" height="28" rx="6" fill="#4A148C"/>
<text x="580" y="269" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">SCEP / Cert Binding</text>
<text x="580" y="296" text-anchor="middle" font-size="9" fill="#4A148C">Owner: OIS / PKI Team</text>
<text x="580" y="312" text-anchor="middle" font-size="9" fill="#333">Trigger SCEP at A-record creation</text>
<text x="580" y="328" text-anchor="middle" font-size="9" fill="#333">Bind cert CN to DNS FQDN</text>
<text x="580" y="344" text-anchor="middle" font-size="9" fill="#333">Cannot modify zone or DHCP config</text>
<text x="580" y="360" text-anchor="middle" font-size="9" fill="#4A148C">Closes: IA-5 · SC-12 · SC-17</text>

<!-- 4. Cloud Grid Members — Cloud Infra Teams -->
<rect x="710" y="250" width="200" height="120" rx="6" fill="#FFF8F0" stroke="#C55A11" stroke-width="2"/>
<rect x="710" y="250" width="200" height="28" rx="6" fill="#C55A11"/>
<text x="810" y="269" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Cloud Grid Members</text>
<text x="810" y="296" text-anchor="middle" font-size="9" fill="#BF360C">Owner: Cloud Infra Teams (per-env)</text>
<text x="810" y="312" text-anchor="middle" font-size="9" fill="#333">AWS GovCloud · Azure Gov · OCI</text>
<text x="810" y="328" text-anchor="middle" font-size="9" fill="#333">Read policy from Grid Master</text>
<text x="810" y="344" text-anchor="middle" font-size="9" fill="#333">Handle local DNS/DHCP for env</text>
<text x="810" y="360" text-anchor="middle" font-size="9" fill="#C55A11">Closes: SC-8 · SA-9 · CM-2</text>

<!-- Arrows from Grid Master down to each box -->
<!-- To DNS Zone Mgmt -->
<line x1="430" y1="190" x2="120" y2="250" stroke="#1565C0" stroke-width="2" marker-end="url(#arw-d)"/>

<!-- To DHCP Scope -->
<line x1="470" y1="190" x2="350" y2="250" stroke="#2E7D32" stroke-width="2" marker-end="url(#arw-g)"/>

<!-- To SCEP / Cert -->
<line x1="560" y1="190" x2="580" y2="250" stroke="#4A148C" stroke-width="2" marker-end="url(#arw-p)"/>

<!-- To Cloud Grid Members -->
<line x1="610" y1="190" x2="810" y2="250" stroke="#C55A11" stroke-width="2" marker-end="url(#arw-o)"/>

<!-- ── Trust Note ── -->
<rect x="20" y="390" width="1000" height="110" rx="6" fill="#F4F6F9" stroke="#DDE3EE" stroke-width="1"/>
<text x="40" y="412" font-size="11" font-weight="bold" fill="#1F3864">Why On-Premises VMware for the Grid Master — Trust Architecture</text>
<text x="40" y="432" font-size="10" fill="#333">The Grid Master is the authority for DNS, DHCP, and IPAM policy across all Agency environments. Placing it on-premises means Agency retains</text>
<text x="40" y="449" font-size="10" fill="#333">direct physical and hypervisor-layer control — no dependency on a cloud provider''s control plane for the most sensitive network function.</text>
<text x="40" y="466" font-size="10" fill="#333">DNS poisoning, DHCP scope manipulation, and cert-binding spoofing are all prevented at the hypervisor boundary rather than relying on cloud IAM.</text>
<text x="40" y="483" font-size="10" fill="#C00000" font-weight="bold">OIS and CIO Office must validate this trust boundary decision and define Grid Admin role-holder accountability before the Grid is deployed.</text>
</svg>
