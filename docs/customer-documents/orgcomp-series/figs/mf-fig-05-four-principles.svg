<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="1200" height="660" fill="#FFFFFF"/>
  <defs>
    <radialGradient id="hub5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E75B6"/>
      <stop offset="100%" stop-color="#1F3864"/>
    </radialGradient>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#888"/>
    </marker>
  </defs>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">Act 4: The Four Principles of Application-Aware Modernization</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#555">The structural move — separated from the mainframe's conflation of truth and enforcement</text>

  <!-- Center hub -->
  <circle cx="600" cy="340" r="110" fill="url(#hub5)"/>
  <text x="600" y="318" text-anchor="middle" font-size="15" fill="white" font-weight="bold">Separated</text>
  <text x="600" y="338" text-anchor="middle" font-size="14" fill="#acd">Truth from</text>
  <text x="600" y="358" text-anchor="middle" font-size="14" fill="#acd">Enforcement</text>
  <text x="600" y="380" text-anchor="middle" font-size="11" fill="#8aaccc">NIST SP 800-207</text>
  <text x="600" y="396" text-anchor="middle" font-size="11" fill="#8aaccc">OMB M-22-09</text>

  <!-- P1: Single Source of Truth (top-left) -->
  <rect x="60" y="80" width="280" height="190" rx="12" fill="#1F3864" stroke="#13223E" stroke-width="2"/>
  <text x="200" y="110" text-anchor="middle" font-size="14" fill="#C55A11" font-weight="bold">Principle 1</text>
  <text x="200" y="132" text-anchor="middle" font-size="15" fill="white" font-weight="bold">Single Source of Truth</text>
  <text x="200" y="158" text-anchor="middle" font-size="11" fill="#ddd">Collapse 12 regional silos</text>
  <text x="200" y="176" text-anchor="middle" font-size="11" fill="#ddd">One authoritative record per data type</text>
  <text x="200" y="194" text-anchor="middle" font-size="11" fill="#ddd">Regional variation documented, not hidden</text>
  <text x="200" y="218" text-anchor="middle" font-size="11" fill="#aaa">FICAM · NIST SP 800-63</text>
  <text x="200" y="238" text-anchor="middle" font-size="11" fill="#aaa">Evidence Act 2018 · Federal Data Strategy</text>
  <line x1="340" y1="175" x2="490" y2="280" stroke="#888" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr5)"/>

  <!-- P2: AAN (top-right) -->
  <rect x="860" y="80" width="280" height="190" rx="12" fill="#375623" stroke="#223515" stroke-width="2"/>
  <text x="1000" y="110" text-anchor="middle" font-size="14" fill="#C55A11" font-weight="bold">Principle 2</text>
  <text x="1000" y="132" text-anchor="middle" font-size="15" fill="white" font-weight="bold">Application-Aware Networking</text>
  <text x="1000" y="158" text-anchor="middle" font-size="11" fill="#ddd">SD-WAN at transport layer</text>
  <text x="1000" y="176" text-anchor="middle" font-size="11" fill="#ddd">SASE delivers the capability</text>
  <text x="1000" y="194" text-anchor="middle" font-size="11" fill="#ddd">Policy = full transaction context</text>
  <text x="1000" y="218" text-anchor="middle" font-size="11" fill="#afc">OMB M-22-09 §4 · TIC 3.0 Use E/F</text>
  <text x="1000" y="238" text-anchor="middle" font-size="11" fill="#afc">CISA ZTMM Networks pillar</text>
  <line x1="860" y1="175" x2="710" y2="280" stroke="#888" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr5)"/>

  <!-- P3: Token identity (bottom-left) -->
  <rect x="60" y="400" width="280" height="190" rx="12" fill="#2E75B6" stroke="#1C4870" stroke-width="2"/>
  <text x="200" y="430" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Principle 3</text>
  <text x="200" y="452" text-anchor="middle" font-size="15" fill="white" font-weight="bold">Token-Based Identity</text>
  <text x="200" y="478" text-anchor="middle" font-size="11" fill="#ddd">OAuth 2.0 / OIDC replaces Kerberos</text>
  <text x="200" y="496" text-anchor="middle" font-size="11" fill="#ddd">CBA — cryptographic credentials</text>
  <text x="200" y="514" text-anchor="middle" font-size="11" fill="#ddd">Eliminate NTLM · phishing-resistant MFA</text>
  <text x="200" y="538" text-anchor="middle" font-size="11" fill="#C0E0FF">BOD 25-01 · OMB M-22-09</text>
  <text x="200" y="558" text-anchor="middle" font-size="11" fill="#C0E0FF">CISA ZTMM v2.0 Identity pillar</text>
  <line x1="340" y1="490" x2="490" y2="400" stroke="#888" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr5)"/>

  <!-- P4: Active Governance (bottom-right) -->
  <rect x="860" y="400" width="280" height="190" rx="12" fill="#C55A11" stroke="#7A370A" stroke-width="2"/>
  <text x="1000" y="430" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Principle 4</text>
  <text x="1000" y="452" text-anchor="middle" font-size="15" fill="white" font-weight="bold">Active Governance</text>
  <text x="1000" y="478" text-anchor="middle" font-size="11" fill="#ddd">Control plane over data planes</text>
  <text x="1000" y="496" text-anchor="middle" font-size="11" fill="#ddd">Gated actuation (human approves)</text>
  <text x="1000" y="514" text-anchor="middle" font-size="11" fill="#ddd">Continuous, automated, machine-readable</text>
  <text x="1000" y="538" text-anchor="middle" font-size="11" fill="#FFD0A0">FedRAMP ConMon · OMB A-130</text>
  <text x="1000" y="558" text-anchor="middle" font-size="11" fill="#FFD0A0">NIST SP 800-37 Rev 2 CA-7</text>
  <line x1="860" y1="490" x2="710" y2="400" stroke="#888" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr5)"/>

  <!-- Dependency arrow: P3 depends on P1 -->
  <path d="M340,560 Q600,620 860,560" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,4"/>
  <text x="600" y="638" text-anchor="middle" font-size="11" fill="#888">P3 depends on P1: tokens must assert authorizations that are TRUE, not just well-formed</text>
</svg>
