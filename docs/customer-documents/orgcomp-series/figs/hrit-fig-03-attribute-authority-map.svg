<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="mTealUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1E8C8C"/></marker>
    <marker id="mNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0D1B2E"/></marker>
    <marker id="mRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C0392B"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#0D1B2E">The Attribute Authority Map</text>
  <text x="640" y="68" text-anchor="middle" font-size="16" fill="#6B7A8D">Every attribute is authoritative in exactly one plane &#8212; and derived, never edited, everywhere else</text>

  <!-- ===== Band 1: HR System of Record ===== -->
  <rect x="170" y="92" width="980" height="196" rx="10" fill="#0D1B2E"/>
  <text x="190" y="122" font-size="20" font-weight="bold" fill="#FFFFFF">HR System of Record</text>
  <text x="1130" y="122" text-anchor="end" font-size="15" font-style="italic" fill="#EAF1FB">authoritative &#8212; created by business acts</text>

  <g fill="#EAF1FB">
    <rect x="188" y="140" width="222" height="60" rx="6"/>
    <rect x="430" y="140" width="222" height="60" rx="6"/>
    <rect x="672" y="140" width="222" height="60" rx="6"/>
    <rect x="914" y="140" width="222" height="60" rx="6"/>
    <rect x="188" y="212" width="222" height="60" rx="6"/>
    <rect x="430" y="212" width="222" height="60" rx="6"/>
    <rect x="672" y="212" width="222" height="60" rx="6"/>
    <rect x="914" y="212" width="222" height="60" rx="6"/>
  </g>
  <!-- anchor icon in employeeId chip -->
  <g stroke="#0D1B2E" stroke-width="2.5" fill="none">
    <circle cx="212" cy="153" r="4"/>
    <line x1="212" y1="157" x2="212" y2="176"/>
    <line x1="204" y1="163" x2="220" y2="163"/>
    <path d="M202,169 Q212,182 222,169"/>
  </g>
  <text x="316" y="166" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="bold" fill="#0D1B2E">employeeId</text>
  <text x="299" y="188" text-anchor="middle" font-size="14" fill="#1E3A66">immutable correlation anchor</text>
  <text x="541" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">legal name</text>
  <text x="783" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">worker type</text>
  <text x="1025" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">employment status</text>
  <text x="299" y="248" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">position &#183; title &#183; grade</text>
  <text x="541" y="240" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">organizational placement</text>
  <text x="541" y="262" text-anchor="middle" font-size="14" fill="#1E3A66">cost center</text>
  <text x="783" y="248" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">supervisor &#183; reporting line</text>
  <text x="1025" y="248" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">duty location</text>

  <!-- computed-from arrows -->
  <g stroke="#1E8C8C" stroke-width="2.5">
    <line x1="298" y1="410" x2="298" y2="296" marker-end="url(#mTealUp)"/>
    <line x1="540" y1="410" x2="540" y2="296" marker-end="url(#mTealUp)"/>
    <line x1="782" y1="410" x2="782" y2="296" marker-end="url(#mTealUp)"/>
    <line x1="1024" y1="410" x2="1024" y2="296" marker-end="url(#mTealUp)"/>
  </g>
  <g font-size="15" fill="#5A5A5A">
    <text x="308" y="320">computed from</text>
    <text x="308" y="340">legal name + employeeId</text>
    <text x="550" y="320">computed from</text>
    <text x="550" y="340">legal name</text>
    <text x="792" y="320">computed from</text>
    <text x="792" y="340">org placement &#183; worker type</text>
    <text x="1034" y="320">computed from</text>
    <text x="1034" y="340">position &#183; supervisor</text>
  </g>

  <!-- ===== Band 2: Identity Platform (derived) ===== -->
  <rect x="170" y="360" width="980" height="136" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="190" y="390" font-size="20" font-weight="bold" fill="#0D1B2E">Identity Platform</text>
  <text x="1130" y="390" text-anchor="end" font-size="15" font-style="italic" fill="#1E8C8C">derived &#8212; computed, stamped, read</text>

  <g fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5">
    <rect x="186" y="414" width="226" height="58" rx="6"/>
    <rect x="428" y="414" width="226" height="58" rx="6"/>
    <rect x="670" y="414" width="226" height="58" rx="6"/>
    <rect x="912" y="414" width="226" height="58" rx="6"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">
    <text x="299" y="449">user principal name</text>
    <text x="541" y="449">mail</text>
    <text x="783" y="449">dynamic group membership</text>
    <text x="1025" y="449">access package assignment</text>
  </g>

  <!-- ===== Band 3: Naming + Cryptographic Planes ===== -->
  <rect x="170" y="556" width="980" height="108" rx="10" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="2"/>
  <text x="190" y="586" font-size="20" font-weight="bold" fill="#33414F">Naming + Cryptographic Planes</text>
  <text x="1130" y="586" text-anchor="end" font-size="15" font-style="italic" fill="#6B7A8D">Books 01&#8211;03 &#8212; device and workload truth</text>
  <g fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.5">
    <rect x="200" y="602" width="280" height="46" rx="6"/>
    <rect x="530" y="602" width="280" height="46" rx="6"/>
    <rect x="860" y="602" width="280" height="46" rx="6"/>
  </g>
  <g font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle">
    <text x="340" y="631">device identity</text>
    <text x="670" y="631">DNS names and addresses</text>
    <text x="1000" y="631">certificates and tokens</text>
  </g>

  <!-- left margin: authority flows down -->
  <line x1="92" y1="104" x2="92" y2="648" stroke="#0D1B2E" stroke-width="6" marker-end="url(#mNavy)"/>
  <text x="58" y="378" text-anchor="middle" transform="rotate(-90 58 378)" font-size="17" font-weight="bold" fill="#0D1B2E">authority flows down &#183; corrections flow up as record fixes</text>

  <!-- right margin: crossed-out upward edit arrow -->
  <line x1="1205" y1="470" x2="1205" y2="182" stroke="#C0392B" stroke-width="4" marker-end="url(#mRed)"/>
  <line x1="1189" y1="310" x2="1221" y2="342" stroke="#C0392B" stroke-width="5"/>
  <line x1="1189" y1="342" x2="1221" y2="310" stroke="#C0392B" stroke-width="5"/>
  <text x="1248" y="326" text-anchor="middle" transform="rotate(90 1248 326)" font-size="16" font-weight="bold" fill="#C0392B">no downstream edits &#8212; fix the record, not the projection</text>

  <text x="660" y="702" text-anchor="middle" font-size="18" font-style="italic" fill="#6B7A8D">A hand-edited projection is a new fragment &#8212; corrections flow upstream to the record.</text>
</svg>
