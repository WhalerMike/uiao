<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="1200" height="620" fill="#FFFFFF"/>
  <defs>
    <filter id="sh"><feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.18"/></filter>
    <linearGradient id="fibgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E75B6"/>
      <stop offset="100%" stop-color="#1F3864"/>
    </linearGradient>
    <linearGradient id="vacgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#375623"/>
      <stop offset="100%" stop-color="#2E75B6"/>
    </linearGradient>
  </defs>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">Physics the Network Cannot Escape</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#555">Fiber · LEO Satellite · 5G — latency floors, refractive index, and the vacuum advantage</text>

  <!-- Fiber path illustration -->
  <rect x="60" y="100" width="500" height="200" rx="12" fill="#EBF3FF" stroke="#2E75B6" stroke-width="2"/>
  <text x="310" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3864">Terrestrial Fiber (MPLS / DIA)</text>
  <!-- Squiggly path -->
  <path d="M90,180 C150,150 180,210 240,175 C300,140 330,200 390,170 C450,140 480,195 545,175"
        stroke="#2E75B6" stroke-width="3" fill="none"/>
  <text x="310" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">Speed: 200,000 km/s (glass, refractive index ≈ 1.5)</text>
  <text x="310" y="240" text-anchor="middle" font-size="12" fill="#555">Portland → DC fiber path: ~5,400 km</text>
  <text x="310" y="260" text-anchor="middle" font-size="13" fill="#C55A11" font-weight="bold">27 ms one-way minimum propagation</text>
  <text x="310" y="280" text-anchor="middle" font-size="12" fill="#4A5A6A">+ queue delay + security inspection + AD latency</text>

  <!-- LEO path illustration -->
  <rect x="640" y="100" width="500" height="200" rx="12" fill="#F0FFF0" stroke="#375623" stroke-width="2"/>
  <text x="890" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#375623">LEO Satellite (Starlink)</text>
  <!-- Satellite arc path -->
  <path d="M670,205 L770,165 L890,150 L1010,165 L1110,205" stroke="#375623" stroke-width="2.5" fill="none" stroke-dasharray="6,3"/>
  <circle cx="890" cy="150" r="15" fill="#375623"/>
  <text x="890" y="154" text-anchor="middle" font-size="10" fill="white">SAT</text>
  <line x1="770" y1="165" x2="890" y2="165" stroke="#375623" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="890" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">Speed: 299,792 km/s (vacuum, no glass)</text>
  <text x="890" y="240" text-anchor="middle" font-size="12" fill="#555">550 km up + ISL hops + 550 km down</text>
  <text x="890" y="260" text-anchor="middle" font-size="13" fill="#375623" font-weight="bold">~20–40 ms end-to-end · improving</text>
  <text x="890" y="280" text-anchor="middle" font-size="12" fill="#4A5A6A">For long paths: may be faster than fiber</text>

  <!-- Comparison bar chart -->
  <text x="600" y="340" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3864">One-Way Latency Comparison — Portland to AWS/Azure (ms)</text>

  <!-- Bars -->
  <!-- Portland MPLS DC -->
  <rect x="100" y="380" width="420" height="40" rx="5" fill="#C00000" filter="url(#sh)"/>
  <text x="110" y="406" font-size="13" fill="white" font-weight="bold">Portland → MPLS → DC → Cloud</text>
  <text x="530" y="406" font-size="14" fill="#C00000" font-weight="bold">100–130 ms</text>
  <!-- Portland DIA -->
  <rect x="100" y="432" width="140" height="40" rx="5" fill="#2E75B6" filter="url(#sh)"/>
  <text x="250" y="458" font-size="13" fill="#1F3864" font-weight="bold">Portland → DIA → AWS us-west-2 · 5–15 ms</text>
  <!-- 5G -->
  <rect x="100" y="484" width="90" height="40" rx="5" fill="#375623" filter="url(#sh)"/>
  <text x="200" y="510" font-size="13" fill="#375623" font-weight="bold">5G MEC local breakout · 5–10 ms</text>
  <!-- LEO long haul -->
  <rect x="100" y="536" width="200" height="40" rx="5" fill="#7030A0" filter="url(#sh)"/>
  <text x="310" y="562" font-size="13" fill="#7030A0" font-weight="bold">Starlink LEO (Portland → East Coast) · 20–35 ms</text>

  <!-- 5G architecture note -->
  <rect x="700" y="370" width="440" height="220" rx="10" fill="#F4F6F9" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="920" y="396" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3864">5G Architecture Advantage</text>
  <text x="920" y="418" text-anchor="middle" font-size="12" fill="#1F3864" font-weight="bold">Radio mechanism:</text>
  <text x="920" y="436" text-anchor="middle" font-size="11" fill="#555">0.125 ms slot time (vs 1 ms LTE)</text>
  <text x="920" y="454" text-anchor="middle" font-size="11" fill="#555">~1 ms theoretical radio minimum</text>
  <text x="920" y="476" text-anchor="middle" font-size="12" fill="#1F3864" font-weight="bold">Architectural mechanism:</text>
  <text x="920" y="494" text-anchor="middle" font-size="11" fill="#555">CUPS + MEC — traffic breaks out at cell tower</text>
  <text x="920" y="512" text-anchor="middle" font-size="11" fill="#555">not backhauled to central core</text>
  <text x="920" y="532" text-anchor="middle" font-size="12" fill="#375623" font-weight="bold">Key for rural field offices:</text>
  <text x="920" y="550" text-anchor="middle" font-size="11" fill="#555">5G and Starlink now reach most locations</text>
  <text x="920" y="568" text-anchor="middle" font-size="11" fill="#555">SD-WAN includes them in multipath pool</text>

  <text x="600" y="604" text-anchor="middle" font-size="12" fill="#4A5A6A">Physics reference: IEEE 802.3 fiber specs · Starlink constellation data · ITU-T G.114 · Speed of light = 299,792 km/s</text>
</svg>
