<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#EBF5FF"/>
      <stop offset="100%" stop-color="#F4F6F9"/>
    </radialGradient>
    <radialGradient id="hub" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3A8FD6"/>
      <stop offset="100%" stop-color="#1F3864"/>
    </radialGradient>
    <radialGradient id="vmw" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7EB26D"/>
      <stop offset="100%" stop-color="#375623"/>
    </radialGradient>
    <radialGradient id="azr" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4A9FE0"/>
      <stop offset="100%" stop-color="#0066B3"/>
    </radialGradient>
    <radialGradient id="aws" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#C55A11"/>
    </radialGradient>
    <radialGradient id="oci" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E05252"/>
      <stop offset="100%" stop-color="#8B1A1A"/>
    </radialGradient>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E75B6" opacity="0.7"/>
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E75B6" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#2E75B6" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="100" y1="0" x2="100" y2="700"/>
    <line x1="300" y1="0" x2="300" y2="700"/>
    <line x1="500" y1="0" x2="500" y2="700"/>
    <line x1="700" y1="0" x2="700" y2="700"/>
    <line x1="900" y1="0" x2="900" y2="700"/>
    <line x1="1100" y1="0" x2="1100" y2="700"/>
  </g>

  <!-- Orbital ring -->
  <ellipse cx="600" cy="350" rx="330" ry="230" fill="none" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.3"/>
  <ellipse cx="600" cy="350" rx="410" ry="290" fill="none" stroke="#1F3864" stroke-width="1" stroke-dasharray="4,8" opacity="0.15"/>

  <!-- Spoke lines (behind nodes) -->
  <!-- To VMware (top-left 190,150) -->
  <line x1="600" y1="350" x2="225" y2="188" stroke="#375623" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6" marker-end="url(#arr)"/>
  <!-- To Azure (top-right 980,160) -->
  <line x1="600" y1="350" x2="952" y2="192" stroke="#0066B3" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6" marker-end="url(#arr)"/>
  <!-- To AWS (bottom-right 970,530) -->
  <line x1="600" y1="350" x2="952" y2="512" stroke="#C55A11" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6" marker-end="url(#arr)"/>
  <!-- To OCI (bottom-left 200,530) -->
  <line x1="600" y1="350" x2="235" y2="516" stroke="#8B1A1A" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6" marker-end="url(#arr)"/>

  <!-- Spoke labels -->
  <g font-size="12" fill="#1F3864" font-weight="bold" opacity="0.85">
    <text x="375" y="235" text-anchor="middle" transform="rotate(-28,375,235)">DNS · IPAM · RPZ</text>
    <text x="808" y="240" text-anchor="middle" transform="rotate(20,808,240)">DNS · IPAM · RPZ</text>
    <text x="808" y="465" text-anchor="middle" transform="rotate(-20,808,465)">DNS · IPAM · Certs</text>
    <text x="388" y="468" text-anchor="middle" transform="rotate(28,388,468)">DNS · IPAM · SA-9</text>
  </g>

  <!-- ── Center hub ── -->
  <g>
    <circle cx="600" cy="350" r="118" fill="url(#hub)"/>
    <circle cx="600" cy="350" r="110" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
  </g>
  <!-- Hub icon: network symbol -->
  <circle cx="600" cy="310" r="22" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
  <circle cx="560" cy="370" r="12" fill="white" opacity="0.6"/>
  <circle cx="640" cy="370" r="12" fill="white" opacity="0.6"/>
  <circle cx="600" cy="310" r="6" fill="white" opacity="0.95"/>
  <line x1="600" y1="332" x2="568" y2="362" stroke="white" stroke-width="2.5" opacity="0.8"/>
  <line x1="600" y1="332" x2="632" y2="362" stroke="white" stroke-width="2.5" opacity="0.8"/>
  <line x1="572" y1="370" x2="628" y2="370" stroke="white" stroke-width="2.5" opacity="0.8"/>

  <text x="600" y="408" text-anchor="middle" fill="white" font-size="17" font-weight="bold" letter-spacing="1">INFOBLOX DDI</text>
  <text x="600" y="428" text-anchor="middle" fill="white" font-size="11" opacity="0.85">DNS · DHCP · IPAM · RPZ · PKI</text>

  <!-- ── VMware node (top-left) ── -->
  <g>
    <rect x="90" y="108" width="200" height="108" rx="14" fill="url(#vmw)"/>
  </g>
  <!-- VMware icon: gear-like circle -->
  <circle cx="148" cy="150" r="24" fill="none" stroke="white" stroke-width="2.5" opacity="0.7"/>
  <circle cx="148" cy="150" r="10" fill="white" opacity="0.5"/>
  <text x="190" y="140" fill="white" font-size="14" font-weight="bold">VMware VCF</text>
  <text x="190" y="157" fill="white" font-size="11" opacity="0.9">NSX-T + VCF 9.1</text>
  <text x="148" y="200" text-anchor="middle" fill="white" font-size="11" opacity="0.8">On-Premises DDI</text>

  <!-- ── Azure node (top-right) ── -->
  <g>
    <rect x="878" y="112" width="210" height="108" rx="14" fill="url(#azr)"/>
  </g>
  <!-- Azure icon: triangle -->
  <polygon points="936,148 956,178 916,178" fill="none" stroke="white" stroke-width="2.5" opacity="0.7"/>
  <text x="970" y="142" fill="white" font-size="14" font-weight="bold">Azure Government</text>
  <text x="970" y="159" fill="white" font-size="11" opacity="0.9">GCC Moderate</text>
  <text x="983" y="200" text-anchor="middle" fill="white" font-size="11" opacity="0.8">BloxOne Azure Connector</text>

  <!-- ── AWS node (bottom-right) ── -->
  <g>
    <rect x="870" y="472" width="210" height="108" rx="14" fill="url(#aws)"/>
  </g>
  <!-- AWS icon: cloud shape simplified -->
  <ellipse cx="930" cy="512" rx="26" ry="18" fill="none" stroke="white" stroke-width="2.5" opacity="0.7"/>
  <rect x="908" y="510" width="44" height="14" rx="4" fill="white" opacity="0.25"/>
  <text x="966" y="506" fill="white" font-size="14" font-weight="bold">AWS GovCloud</text>
  <text x="966" y="523" fill="white" font-size="11" opacity="0.9">BloxOne on AWS</text>
  <text x="975" y="562" text-anchor="middle" fill="white" font-size="11" opacity="0.8">FedRAMP CSO FR2017257053</text>

  <!-- ── OCI node (bottom-left) ── -->
  <g>
    <rect x="90" y="472" width="210" height="108" rx="14" fill="url(#oci)"/>
  </g>
  <!-- OCI icon: diamond -->
  <polygon points="148,497 168,517 148,537 128,517" fill="none" stroke="white" stroke-width="2.5" opacity="0.7"/>
  <text x="178" y="507" fill="white" font-size="14" font-weight="bold">Oracle OCI</text>
  <text x="178" y="524" fill="white" font-size="11" opacity="0.9">OPM HRIT (future)</text>
  <text x="195" y="562" text-anchor="middle" fill="white" font-size="11" opacity="0.8">Conditional Forwarder + Cert Monitor</text>

  <!-- Title -->
  <text x="600" y="44" text-anchor="middle" fill="#1F3864" font-size="22" font-weight="bold">InfoBlox DDI — The Unified Control Plane for Agency's Multi-Cloud Landing Zone</text>
  <text x="600" y="66" text-anchor="middle" fill="#2E75B6" font-size="14">One platform · Four environments · Single evidence source for FedRAMP Moderate compliance</text>

  <!-- Legend -->
  <rect x="420" y="640" width="360" height="44" rx="8" fill="white" opacity="0.8" stroke="#CCCCCC" stroke-width="1"/>
  <circle cx="444" cy="662" r="7" fill="#375623"/>
  <text x="456" y="666" fill="#1F3864" font-size="12">On-Prem</text>
  <circle cx="524" cy="662" r="7" fill="#0066B3"/>
  <text x="536" y="666" fill="#1F3864" font-size="12">Azure Gov</text>
  <circle cx="614" cy="662" r="7" fill="#C55A11"/>
  <text x="626" y="666" fill="#1F3864" font-size="12">AWS Gov</text>
  <circle cx="700" cy="662" r="7" fill="#8B1A1A"/>
  <text x="712" y="666" fill="#1F3864" font-size="12">OCI / OPM</text>
</svg>
