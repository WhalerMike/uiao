<svg width="900" height="460" viewBox="0 0 900 460"
     xmlns="http://www.w3.org/2000/svg" style="background:#FFFFFF;font-family:Arial,sans-serif">

  <rect width="900" height="460" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="48" fill="#1F3864"/>
  <text x="450" y="22" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">FedRAMP 20x Consolidated Rules: What Mainframe-to-AAN Modernization Must Achieve</text>
  <text x="450" y="40" text-anchor="middle" fill="#F2F2F2" font-size="10">Machine-readable KSIs replace periodic evidence assembly. Infrastructure-as-code is the compliance posture.</text>

  <!-- Timeline backbone -->
  <line x1="60" y1="195" x2="840" y2="195" stroke="#1F3864" stroke-width="4"/>
  <polygon points="836,189 848,195 836,201" fill="#1F3864"/>

  <!-- Events on timeline -->
  <!-- Event 1: Jun 25, 2026 -->
  <circle cx="100" cy="195" r="10" fill="#375623"/>
  <line x1="100" y1="185" x2="100" y2="100" stroke="#375623" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="30" y="60" width="170" height="55" rx="5" fill="#F2F2F2" stroke="#375623" stroke-width="1.5"/>
  <text x="115" y="77" text-anchor="middle" fill="#375623" font-size="9" font-weight="bold">Jun 25, 2026</text>
  <text x="115" y="92" text-anchor="middle" fill="#1F3864" font-size="9">Consolidated Rules</text>
  <text x="115" y="105" text-anchor="middle" fill="#1F3864" font-size="9">published. Machine-</text>
  <text x="115" y="118" text-anchor="middle" fill="#1F3864" font-size="9">readable JSON KSIs.</text>

  <!-- Event 2: Jul 28, 2026 -->
  <circle cx="230" cy="195" r="10" fill="#C55A11"/>
  <line x1="230" y1="205" x2="230" y2="275" stroke="#C55A11" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="160" y="240" width="180" height="50" rx="5" fill="#F2F2F2" stroke="#C55A11" stroke-width="1.5"/>
  <text x="250" y="257" text-anchor="middle" fill="#C55A11" font-size="9" font-weight="bold">Jul 28, 2026</text>
  <text x="250" y="272" text-anchor="middle" fill="#1F3864" font-size="9">FedRAMP Ready</text>
  <text x="250" y="285" text-anchor="middle" fill="#1F3864" font-size="9">pathway ceases.</text>

  <!-- Event 3: Aug 3, 2026 -->
  <circle cx="370" cy="195" r="10" fill="#2E75B6"/>
  <line x1="370" y1="185" x2="370" y2="100" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="300" y="60" width="170" height="55" rx="5" fill="#F2F2F2" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="385" y="77" text-anchor="middle" fill="#2E75B6" font-size="9" font-weight="bold">Aug 3, 2026</text>
  <text x="385" y="92" text-anchor="middle" fill="#1F3864" font-size="9">Class A pipeline</text>
  <text x="385" y="105" text-anchor="middle" fill="#1F3864" font-size="9">opens. Automated</text>
  <text x="385" y="118" text-anchor="middle" fill="#1F3864" font-size="9">KSI validation live.</text>

  <!-- Event 4: Aug 31, 2026 -->
  <circle cx="510" cy="195" r="10" fill="#2E75B6"/>
  <line x1="510" y1="205" x2="510" y2="275" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="430" y="240" width="170" height="50" rx="5" fill="#F2F2F2" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="515" y="257" text-anchor="middle" fill="#2E75B6" font-size="9" font-weight="bold">Aug 31, 2026</text>
  <text x="515" y="272" text-anchor="middle" fill="#1F3864" font-size="9">Class B and C</text>
  <text x="515" y="285" text-anchor="middle" fill="#1F3864" font-size="9">pathways open.</text>

  <!-- Event 5: Jan 1, 2027 -->
  <circle cx="660" cy="195" r="10" fill="#C00000"/>
  <line x1="660" y1="185" x2="660" y2="100" stroke="#C00000" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="588" y="60" width="180" height="55" rx="5" fill="#F2F2F2" stroke="#C00000" stroke-width="1.5"/>
  <text x="678" y="77" text-anchor="middle" fill="#C00000" font-size="9" font-weight="bold">Jan 1, 2027</text>
  <text x="678" y="92" text-anchor="middle" fill="#1F3864" font-size="9">Rules mandatory for</text>
  <text x="678" y="105" text-anchor="middle" fill="#1F3864" font-size="9">all certified systems.</text>
  <text x="678" y="118" text-anchor="middle" fill="#C00000" font-size="9" font-weight="bold">Hard deadline.</text>

  <!-- Event 6: Jun 11, 2027 -->
  <circle cx="800" cy="195" r="10" fill="#C00000"/>
  <line x1="800" y1="205" x2="800" y2="275" stroke="#C00000" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="720" y="240" width="170" height="50" rx="5" fill="#F2F2F2" stroke="#C00000" stroke-width="1.5"/>
  <text x="805" y="257" text-anchor="middle" fill="#C00000" font-size="9" font-weight="bold">Jun 11, 2027</text>
  <text x="805" y="272" text-anchor="middle" fill="#1F3864" font-size="9">No new Rev5</text>
  <text x="805" y="285" text-anchor="middle" fill="#1F3864" font-size="9">certifications accepted.</text>

  <!-- TODAY marker -->
  <line x1="115" y1="140" x2="115" y2="195" stroke="#C55A11" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="115" y="155" text-anchor="middle" fill="#C55A11" font-size="9" font-weight="bold">TODAY</text>
  <text x="115" y="167" text-anchor="middle" fill="#C55A11" font-size="9">Jul 1, 2026</text>

  <!-- Implication boxes -->
  <rect x="20" y="310" width="415" height="130" rx="8" fill="#F2F2F2" stroke="#375623" stroke-width="2"/>
  <rect x="20" y="310" width="415" height="28" rx="8" fill="#375623"/>
  <rect x="20" y="330" width="415" height="8" fill="#375623"/>
  <text x="227" y="328" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">Active Governance Aligns to 20x</text>
  <text x="35" y="360" fill="#1F3864" font-size="10">Advanced maturity (gated actuation) is the AO-signable</text>
  <text x="35" y="376" fill="#1F3864" font-size="10">posture. FedRAMP 20x demands continuous, automated,</text>
  <text x="35" y="392" fill="#1F3864" font-size="10">machine-readable evidence &#x2014; exactly what the</text>
  <text x="35" y="408" fill="#1F3864" font-size="10">control-plane/data-plane model produces.</text>
  <text x="35" y="428" fill="#375623" font-size="10" font-weight="bold">Active governance IS the 20x compliance posture.</text>

  <rect x="465" y="310" width="415" height="130" rx="8" fill="#F2F2F2" stroke="#2E75B6" stroke-width="2"/>
  <rect x="465" y="310" width="415" height="28" rx="8" fill="#2E75B6"/>
  <rect x="465" y="330" width="415" height="8" fill="#2E75B6"/>
  <text x="672" y="328" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">Annual Assessment to Continuous KSI</text>
  <text x="480" y="360" fill="#1F3864" font-size="10">20x replaces periodic evidence assembly with</text>
  <text x="480" y="376" fill="#1F3864" font-size="10">infrastructure-as-code guardrails. SD-WAN path logs,</text>
  <text x="480" y="392" fill="#1F3864" font-size="10">SASE session records, and DDI events ARE the evidence.</text>
  <text x="480" y="408" fill="#1F3864" font-size="10">No manual assembly required.</text>
  <text x="480" y="428" fill="#2E75B6" font-size="10" font-weight="bold">Continuous telemetry replaces the 3-year audit cycle.</text>

</svg>
