<svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="760" fill="#FFFFFF"/>
  <defs>
    <marker id="hp-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#1E8C8C"/></marker>
    <marker id="hp-navy" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#0D1B2E"/></marker>
    <marker id="hp-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#2E75B6"/></marker>
  </defs>

  <text x="640" y="34" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#0D1B2E">HRIT to HR-Driven IAM — the Execution Pipeline on the Federal HR 2.0 Clock</text>
  <text x="640" y="56" text-anchor="middle" font-size="13" fill="#6B7A8D">Oracle Fusion Cloud HCM (Core HCM) feeds the ADR-003 middleware; provisioning lands in AD today and in Entra at the target — on a timetable the OMB/OPM memo already set</text>

  <!-- Program clock band -->
  <text x="640" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#5A5A5A">THE PROGRAM CLOCK — set by the Dec 10, 2025 OMB/OPM memo and the Jun 11, 2026 award</text>
  <line x1="70" y1="130" x2="1210" y2="130" stroke="#0D1B2E" stroke-width="2.5"/>
  <line x1="1210" y1="130" x2="1218" y2="130" stroke="#0D1B2E" stroke-width="2.5" marker-end="url(#hp-navy)"/>

  <circle cx="130" cy="130" r="7" fill="#0D1B2E"/>
  <text x="130" y="112" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0D1B2E">Dec 10, 2025</text>
  <text x="130" y="152" text-anchor="middle" font-size="10" fill="#33414F">Federal HR 2.0 memo</text>
  <text x="130" y="166" text-anchor="middle" font-size="9.5" fill="#6B7A8D">agencies pause own Core HCM</text>

  <circle cx="360" cy="130" r="7" fill="#0D1B2E"/>
  <text x="360" y="112" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0D1B2E">Jun 11, 2026</text>
  <text x="360" y="152" text-anchor="middle" font-size="10" fill="#33414F">Oracle Fusion Cloud HCM award</text>
  <text x="360" y="166" text-anchor="middle" font-size="9.5" fill="#6B7A8D">no native Entra connector — ADR-003 path is THE path</text>

  <circle cx="620" cy="130" r="7" fill="#1E8C8C"/>
  <text x="620" y="112" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1E8C8C">FY 2026</text>
  <text x="620" y="152" text-anchor="middle" font-size="10" fill="#33414F">Wave 1 begins (DHS, USDA, HHS,</text>
  <text x="620" y="166" text-anchor="middle" font-size="10" fill="#33414F">DOI, OPM, DOT, VA, EPA)</text>

  <circle cx="880" cy="130" r="9" fill="#D4A017"/>
  <text x="880" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#7A5B00">FY 2027 — Wave 2 incl. SSA</text>
  <text x="880" y="152" text-anchor="middle" font-size="10" fill="#33414F">8-month onboarding; interconnections</text>
  <text x="880" y="166" text-anchor="middle" font-size="10" font-weight="bold" fill="#C0392B">go live ~month 5 — the feed must be ready</text>

  <circle cx="1130" cy="130" r="7" fill="#0D1B2E"/>
  <text x="1130" y="112" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0D1B2E">FY 2028</text>
  <text x="1130" y="152" text-anchor="middle" font-size="10" fill="#33414F">government-wide adoption;</text>
  <text x="1130" y="166" text-anchor="middle" font-size="9.5" fill="#6B7A8D">eOPF + EHRI decommissioned</text>

  <!-- Pipeline band -->
  <text x="640" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#5A5A5A">THE PIPE — ADR-003: API-driven inbound provisioning (the government's own PWS requires SCIM 2.0 near-real-time)</text>

  <!-- Source -->
  <rect x="40" y="232" width="250" height="150" rx="10" fill="#0D1B2E"/>
  <text x="165" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Oracle Fusion Cloud HCM</text>
  <text x="165" y="275" text-anchor="middle" font-size="10" fill="#A9B8CA">Core HCM — the identity + org SSOT</text>
  <line x1="60" y1="286" x2="270" y2="286" stroke="#1E3A66" stroke-width="1"/>
  <text x="60" y="306" font-size="10.5" font-weight="bold" fill="#D7F2EE">Initial: HCM Extracts (CSV)</text>
  <text x="60" y="324" font-size="10.5" font-weight="bold" fill="#D7F2EE">Delta: ATOM feeds</text>
  <text x="60" y="340" font-size="9.5" fill="#A9B8CA">newhire · empassignment · empupdate</text>
  <text x="60" y="354" font-size="9.5" fill="#A9B8CA">termination · workrelshipupdate</text>
  <text x="60" y="372" font-size="9.5" fill="#A9B8CA">match key: PersonNumber &#8596; employeeId</text>

  <line x1="290" y1="307" x2="336" y2="307" stroke="#1E8C8C" stroke-width="3" marker-end="url(#hp-teal)"/>

  <!-- Middleware -->
  <rect x="338" y="232" width="290" height="150" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="483" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0D1B2E">ADR-003 middleware layer</text>
  <text x="483" y="271" text-anchor="middle" font-size="9.5" fill="#6B7A8D">Azure Functions / Logic Apps — substrate-owned</text>
  <rect x="354" y="282" width="258" height="24" rx="5" fill="#0D1B2E"/><text x="483" y="298" text-anchor="middle" font-size="9.5" fill="#FFFFFF">schema normalization &#8594; SCIM bulkRequest</text>
  <rect x="354" y="310" width="258" height="24" rx="5" fill="#2E75B6"/><text x="483" y="326" text-anchor="middle" font-size="9.5" fill="#FFFFFF">OrgPath calculation — every identity, pre-Entra</text>
  <rect x="354" y="338" width="258" height="24" rx="5" fill="#0D1B2E"/><text x="483" y="354" text-anchor="middle" font-size="9.5" fill="#FFFFFF">validation + provenance record (evidence contract)</text>
  <text x="483" y="376" text-anchor="middle" font-size="9" fill="#6B7A8D">&#8594; Graph bulkUpload (SCIM 2.0)</text>

  <line x1="628" y1="307" x2="674" y2="307" stroke="#1E8C8C" stroke-width="3" marker-end="url(#hp-teal)"/>

  <!-- Router / targets -->
  <rect x="676" y="232" width="220" height="150" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="786" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0D1B2E">Entra provisioning service</text>
  <text x="786" y="276" text-anchor="middle" font-size="10" fill="#33414F">attribute mapping · scoping filters</text>
  <rect x="692" y="290" width="188" height="34" rx="5" fill="#2E75B6"/>
  <text x="786" y="305" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#FFFFFF">target choice = the edition</text>
  <text x="786" y="318" text-anchor="middle" font-size="9" fill="#EAF1FB">hybrid today &#183; cloud-native at target</text>
  <text x="786" y="344" text-anchor="middle" font-size="10" fill="#33414F">Lifecycle Workflows on</text>
  <text x="786" y="359" text-anchor="middle" font-size="9.5" font-family="Consolas, monospace" fill="#2E75B6">employeeHireDate / employeeLeaveDateTime</text>
  <text x="786" y="375" text-anchor="middle" font-size="9" fill="#6B7A8D">licensing: Entra ID P1 + ID Governance</text>

  <line x1="896" y1="275" x2="948" y2="258" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#hp-blue)"/>
  <line x1="896" y1="345" x2="948" y2="362" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#hp-blue)"/>

  <!-- Target A: hybrid -->
  <rect x="950" y="224" width="290" height="88" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <rect x="950" y="224" width="10" height="88" rx="4" fill="#1E8C8C"/>
  <text x="970" y="245" font-size="11" font-weight="bold" fill="#0D1B2E">TODAY — hybrid (AD-mastered)</text>
  <text x="970" y="262" font-size="9.5" fill="#33414F">provisioning agent &#8594; on-prem AD &#8594; Entra Connect</text>
  <text x="970" y="278" font-size="9.5" fill="#33414F">= the Day-2 kit Active Directory edition</text>
  <text x="970" y="294" font-size="9" font-family="Consolas, monospace" fill="#2E75B6">hybrid_mode = true</text>
  <text x="970" y="306" font-size="9" fill="#6B7A8D">AdHybridClient actuates the synced estate</text>

  <!-- Target B: cloud -->
  <rect x="950" y="326" width="290" height="88" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/>
  <rect x="950" y="326" width="10" height="88" rx="4" fill="#2E75B6"/>
  <text x="970" y="347" font-size="11" font-weight="bold" fill="#0D1B2E">TARGET — cloud-native (HRIT)</text>
  <text x="970" y="364" font-size="9.5" fill="#33414F">direct to Entra ID — no AD leg, no sync wait</text>
  <text x="970" y="380" font-size="9.5" fill="#33414F">= the Day-2 kit HRIT edition</text>
  <text x="970" y="396" font-size="9" font-family="Consolas, monospace" fill="#2E75B6">hybrid_mode = false</text>
  <text x="970" y="408" font-size="9" fill="#6B7A8D">the flip is a config change, timed to the wave</text>

  <!-- Phase band -->
  <text x="640" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#5A5A5A">THE PLAN — Spec 2 (HR-Agnostic Provisioning), concretized; Phase 0 is the memo's own Appendix C</text>

  <rect x="40" y="474" width="224" height="128" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="152" y="496" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D1B2E">Phase 0 — memo App. C</text>
  <text x="152" y="514" text-anchor="middle" font-size="9.5" fill="#33414F">POCs + working groups named;</text>
  <text x="152" y="528" text-anchor="middle" font-size="9.5" fill="#33414F">integration points + data flows</text>
  <text x="152" y="542" text-anchor="middle" font-size="9.5" fill="#33414F">inventoried; legacy data strategy</text>
  <text x="152" y="560" text-anchor="middle" font-size="9" fill="#6B7A8D">directed by OPM/OMB — doing it</text>
  <text x="152" y="573" text-anchor="middle" font-size="9" fill="#6B7A8D">is compliance, not overhead</text>
  <text x="152" y="591" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E8C8C">gate: inventory signed</text>

  <rect x="286" y="474" width="224" height="128" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="398" y="496" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D1B2E">Phase 1 — schema + mapping</text>
  <text x="398" y="514" text-anchor="middle" font-size="9.5" fill="#33414F">canonical attribute schema (D1.1);</text>
  <text x="398" y="528" text-anchor="middle" font-size="9.5" fill="#33414F">worker-type taxonomy (D1.6);</text>
  <text x="398" y="542" text-anchor="middle" font-size="9.5" fill="#33414F">Oracle&#8594;SCIM&#8594;OrgPath crosswalk</text>
  <text x="398" y="560" text-anchor="middle" font-size="9" fill="#6B7A8D">D1.7 connector comparison is</text>
  <text x="398" y="573" text-anchor="middle" font-size="9" fill="#6B7A8D">RESOLVED — API-driven, by award</text>
  <text x="398" y="591" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E8C8C">gate: crosswalk validated</text>

  <rect x="532" y="474" width="224" height="128" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="644" y="496" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D1B2E">Phase 2 — middleware build</text>
  <text x="644" y="514" text-anchor="middle" font-size="9.5" fill="#33414F">transform + OrgPath + provenance;</text>
  <text x="644" y="528" text-anchor="middle" font-size="9.5" fill="#33414F">JML workflows (D2.x); scoping</text>
  <text x="644" y="542" text-anchor="middle" font-size="9.5" fill="#33414F">filters (D2.8); LCW triggers</text>
  <text x="644" y="560" text-anchor="middle" font-size="9" fill="#6B7A8D">sandbox HCM extract + canned</text>
  <text x="644" y="573" text-anchor="middle" font-size="9" fill="#6B7A8D">ATOM payloads — no live estate</text>
  <text x="644" y="591" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E8C8C">gate: E2E in test tenant</text>

  <rect x="778" y="474" width="224" height="128" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/>
  <text x="890" y="496" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D1B2E">Phase 3 — hybrid go-live</text>
  <text x="890" y="514" text-anchor="middle" font-size="9.5" fill="#33414F">provisioning agent HA (D3.3);</text>
  <text x="890" y="528" text-anchor="middle" font-size="9.5" fill="#33414F">AD-target mappings (D3.4);</text>
  <text x="890" y="542" text-anchor="middle" font-size="9.5" fill="#33414F">monitoring (D3.7); pilot cohort</text>
  <text x="890" y="560" text-anchor="middle" font-size="9" fill="#6B7A8D">feeds the AD-mastered estate the</text>
  <text x="890" y="573" text-anchor="middle" font-size="9" fill="#6B7A8D">Day-2 kit governs today</text>
  <text x="890" y="591" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E8C8C">gate: evidence-closed JML</text>

  <rect x="1024" y="474" width="216" height="128" rx="8" fill="#FCF3D9" stroke="#D4A017" stroke-width="1.5"/>
  <text x="1132" y="496" text-anchor="middle" font-size="11" font-weight="bold" fill="#7A5B00">Phase 4 — wave cutover</text>
  <text x="1132" y="514" text-anchor="middle" font-size="9.5" fill="#7A5B00">align to the agency's Wave 2 slot;</text>
  <text x="1132" y="528" text-anchor="middle" font-size="9.5" fill="#7A5B00">interconnection live by month ~5;</text>
  <text x="1132" y="542" text-anchor="middle" font-size="9.5" fill="#7A5B00">retarget provisioning to Entra;</text>
  <text x="1132" y="556" text-anchor="middle" font-size="9.5" font-family="Consolas, monospace" fill="#7A5B00">hybrid_mode &#8594; false</text>
  <text x="1132" y="574" text-anchor="middle" font-size="9" fill="#7A5B00">per population, evidence-gated</text>
  <text x="1132" y="591" text-anchor="middle" font-size="9" font-weight="bold" fill="#7A5B00">gate: wave exit criteria</text>

  <line x1="264" y1="538" x2="284" y2="538" stroke="#0D1B2E" stroke-width="2" marker-end="url(#hp-navy)"/>
  <line x1="510" y1="538" x2="530" y2="538" stroke="#0D1B2E" stroke-width="2" marker-end="url(#hp-navy)"/>
  <line x1="756" y1="538" x2="776" y2="538" stroke="#0D1B2E" stroke-width="2" marker-end="url(#hp-navy)"/>
  <line x1="1002" y1="538" x2="1022" y2="538" stroke="#0D1B2E" stroke-width="2" marker-end="url(#hp-navy)"/>

  <!-- footer -->
  <rect x="40" y="640" width="1200" height="56" rx="8" fill="#EAF1FB" stroke="#E3E8EF" stroke-width="1"/>
  <text x="640" y="662" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0D1B2E">ADR-003 chose the pipe before the vendor was known; the Oracle award made it the only Microsoft-supported path — the plan now just has to hit the wave clock.</text>
  <text x="640" y="682" text-anchor="middle" font-size="10.5" fill="#6B7A8D">Open verification: GCC (Moderate) availability of API-driven provisioning + Lifecycle Workflows &#183; post-award PWS Appendix A &#183; the promised HR-services memo &#183; eOPF/EHRI decommission schedule</text>
</svg>
