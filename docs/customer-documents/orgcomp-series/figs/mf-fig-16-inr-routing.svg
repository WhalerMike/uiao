<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="600" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3A5F">Microsoft 365 Routing — Local Breakout vs. Backhaul</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#4A5A6A">The front-door entry point determines whether agency traffic rides Microsoft's private backbone</text>

  <line x1="600" y1="80" x2="600" y2="330" stroke="#B9C4CE" stroke-width="2" stroke-dasharray="7,5"/>

  <!-- LEFT: Backhaul -->
  <text x="300" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">Backhaul Path (Legacy)</text>
  <rect x="40" y="120" width="140" height="54" rx="7" fill="#C55A11" stroke="#8A3D0C" stroke-width="2"/>
  <text x="110" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Portland</text>
  <text x="110" y="160" text-anchor="middle" font-size="11" fill="#FFFFFF">Field Office</text>
  <line x1="180" y1="147" x2="222" y2="147" stroke="#C0392B" stroke-width="3"/>
  <polygon points="222,141 234,147 222,153" fill="#C0392B"/>
  <text x="207" y="134" text-anchor="middle" font-size="10" font-weight="bold" fill="#C0392B">MPLS</text>
  <rect x="234" y="120" width="140" height="54" rx="7" fill="#1F3A5F" stroke="#12233E" stroke-width="2"/>
  <text x="304" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Agency DC</text>
  <text x="304" y="160" text-anchor="middle" font-size="11" fill="#FFFFFF">Washington DC</text>
  <line x1="374" y1="147" x2="416" y2="147" stroke="#C0392B" stroke-width="3"/>
  <polygon points="416,141 428,147 416,153" fill="#C0392B"/>
  <text x="401" y="134" text-anchor="middle" font-size="10" font-weight="bold" fill="#C0392B">Internet</text>
  <rect x="428" y="120" width="150" height="54" rx="7" fill="#2E75B6" stroke="#1B4E7A" stroke-width="2"/>
  <text x="503" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Microsoft PoP</text>
  <text x="503" y="160" text-anchor="middle" font-size="11" fill="#FFFFFF">Ashburn — suboptimal</text>

  <rect x="40" y="196" width="450" height="52" rx="7" fill="#FBEEEC" stroke="#C0392B" stroke-width="2"/>
  <text x="265" y="217" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#A02020">Portland→DC backhaul 65 ms + DC→Ashburn 15 ms = 80 ms+ one-way</text>
  <text x="265" y="237" text-anchor="middle" font-size="11" fill="#A02020">Microsoft backbone only starts at Ashburn — the detour is complete before it begins</text>

  <line x1="530" y1="174" x2="530" y2="262" stroke="#1F3A5F" stroke-width="2.5" stroke-dasharray="5,4"/>
  <polygon points="524,262 530,274 536,262" fill="#1F3A5F"/>
  <text x="540" y="256" text-anchor="start" font-size="10" fill="#4A5A6A">suboptimal</text>
  <rect x="428" y="274" width="150" height="48" rx="7" fill="#41547A" stroke="#2A3A57" stroke-width="2"/>
  <text x="503" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Microsoft Teams</text>
  <text x="503" y="310" text-anchor="middle" font-size="11" fill="#FFFFFF">Infrastructure</text>

  <!-- RIGHT: Local breakout -->
  <text x="905" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F6B33">Local Breakout (SD-WAN + INR)</text>
  <rect x="640" y="120" width="140" height="54" rx="7" fill="#C55A11" stroke="#8A3D0C" stroke-width="2"/>
  <text x="710" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Portland</text>
  <text x="710" y="160" text-anchor="middle" font-size="11" fill="#FFFFFF">Field Office (SD-WAN)</text>
  <line x1="780" y1="147" x2="822" y2="147" stroke="#1F6B33" stroke-width="3"/>
  <polygon points="822,141 834,147 822,153" fill="#1F6B33"/>
  <text x="807" y="134" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F6B33">DIA / 5G</text>
  <rect x="834" y="120" width="170" height="54" rx="7" fill="#2E75B6" stroke="#1B4E7A" stroke-width="2"/>
  <text x="919" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Microsoft PoP</text>
  <text x="919" y="160" text-anchor="middle" font-size="11" fill="#FFFFFF">Seattle — optimal front door</text>
  <line x1="1004" y1="147" x2="1044" y2="147" stroke="#1F3A5F" stroke-width="4"/>
  <polygon points="1044,140 1058,147 1044,154" fill="#1F3A5F"/>
  <text x="1024" y="134" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3A5F">backbone</text>
  <rect x="1058" y="120" width="112" height="54" rx="7" fill="#1F3A5F" stroke="#12233E" stroke-width="2"/>
  <text x="1114" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Microsoft</text>
  <text x="1114" y="160" text-anchor="middle" font-size="11" fill="#FFFFFF">Teams Infra</text>

  <rect x="640" y="196" width="530" height="52" rx="7" fill="#EAF3E8" stroke="#1F6B33" stroke-width="2"/>
  <text x="905" y="217" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1F6B33">Portland→Seattle 12 ms + Microsoft backbone to Teams = 18 ms total</text>
  <text x="905" y="237" text-anchor="middle" font-size="11" fill="#1F6B33">4× improvement — the backbone carries the traffic from the first hop</text>

  <rect x="640" y="262" width="530" height="56" rx="7" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="2"/>
  <text x="905" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3A5F">Cisco Catalyst SD-WAN — Cloud OnRamp for SaaS</text>
  <text x="905" y="304" text-anchor="middle" font-size="11" fill="#333">Probes all transports · selects the lowest-latency Microsoft front door per branch · re-evaluates continuously</text>

  <!-- Category table -->
  <rect x="40" y="348" width="1130" height="40" rx="7" fill="#1F3A5F" stroke="#12233E" stroke-width="2"/>
  <text x="605" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Microsoft 365 Endpoint Categories — Traffic Treatment in Cisco Catalyst SD-WAN</text>

  <rect x="40" y="402" width="1130" height="66" rx="6" fill="#EAF3E8" stroke="#1F6B33" stroke-width="2"/>
  <rect x="40" y="402" width="160" height="66" rx="6" fill="#375623" stroke="#1F3114" stroke-width="2"/>
  <text x="120" y="431" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Optimize</text>
  <text x="120" y="450" text-anchor="middle" font-size="11" fill="#FFFFFF">category</text>
  <text x="224" y="429" font-size="12" font-weight="bold" fill="#1F3114">Teams media · SharePoint Online</text>
  <text x="224" y="450" font-size="11.5" fill="#333">No proxy · No inspection · Maximum-priority DIA/5G path · Direct to the Microsoft front door</text>

  <rect x="40" y="482" width="1130" height="66" rx="6" fill="#EBF3FF" stroke="#1B4E7A" stroke-width="2"/>
  <rect x="40" y="482" width="160" height="66" rx="6" fill="#2E75B6" stroke="#1B4E7A" stroke-width="2"/>
  <text x="120" y="511" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Allow</text>
  <text x="120" y="530" text-anchor="middle" font-size="11" fill="#FFFFFF">category</text>
  <text x="224" y="509" font-size="12" font-weight="bold" fill="#1B4E7A">General M365 services</text>
  <text x="224" y="530" font-size="11.5" fill="#333">Local breakout preferred · Proxy inspection allowed · Steered to the best DIA path</text>

  <rect x="40" y="562" width="1130" height="66" rx="6" fill="#FBF1E8" stroke="#8A3D0C" stroke-width="2"/>
  <rect x="40" y="562" width="160" height="66" rx="6" fill="#C55A11" stroke="#8A3D0C" stroke-width="2"/>
  <text x="120" y="591" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Default</text>
  <text x="120" y="610" text-anchor="middle" font-size="11" fill="#FFFFFF">category</text>
  <text x="224" y="589" font-size="12" font-weight="bold" fill="#8A3D0C">Non-M365 internet traffic</text>
  <text x="224" y="610" font-size="11.5" fill="#333">Standard security stack applies · TICAP or Umbrella inspection · No special steering</text>

  <text x="600" y="666" text-anchor="middle" font-size="12" fill="#4A5A6A">Satisfies: SC-8 Transmission Confidentiality and Integrity · AC-4 Information Flow Enforcement · TIC 3.0 Use Case E — local breakout with the branch security stack</text>
</svg>
