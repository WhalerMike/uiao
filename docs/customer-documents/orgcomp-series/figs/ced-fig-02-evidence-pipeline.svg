<svg viewBox="0 0 1040 350" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;">
<rect width="1040" height="350" fill="#FFFFFF"/>
<defs>
  <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#999"/>
  </marker>
  <marker id="arwb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#2E75B6"/>
  </marker>
  <marker id="arwg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#375623"/>
  </marker>
</defs>

<!-- Title -->
<text x="520" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3864">AT-4 Evidence Collection Pipeline — governance.training-effectiveness-record</text>
<text x="520" y="42" text-anchor="middle" font-size="10" fill="#2E75B6">LMS → Graph API export → governance substrate → KSI-CED-RAT evaluation</text>

<!-- Step 1: LMS -->
<rect x="20" y="60" width="180" height="60" rx="6" fill="#1F3864"/>
<text x="110" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">LMS (Viva Learning</text>
<text x="110" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">/ Equivalent)</text>
<text x="110" y="111" text-anchor="middle" font-size="9" fill="#BDD7EE">Enrollment + completion records</text>

<!-- Arrow 1 -->
<line x1="200" y1="90" x2="240" y2="90" stroke="#999" stroke-width="2" marker-end="url(#arw)"/>
<text x="220" y="84" text-anchor="middle" font-size="8" fill="#666">Graph API</text>

<!-- Step 2: JSON export -->
<rect x="240" y="60" width="200" height="60" rx="6" fill="#2E75B6"/>
<text x="340" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">JSON Schema Export</text>
<text x="340" y="96" text-anchor="middle" font-size="10" fill="#D9EEF9">training-effectiveness-record</text>
<text x="340" y="111" text-anchor="middle" font-size="9" fill="#D9EEF9">Six role_tier entries with pct + dates</text>

<!-- Arrow 2 -->
<line x1="440" y1="90" x2="480" y2="90" stroke="#999" stroke-width="2" marker-end="url(#arw)"/>
<text x="460" y="84" text-anchor="middle" font-size="8" fill="#666">Substrate ingest</text>

<!-- Step 3: governance substrate -->
<rect x="480" y="60" width="200" height="60" rx="6" fill="#375623"/>
<text x="580" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Governance</text>
<text x="580" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Substrate</text>
<text x="580" y="111" text-anchor="middle" font-size="9" fill="#D9EBD3">Conformance Adapter (ADR-111)</text>

<!-- Arrow 3 -->
<line x1="680" y1="90" x2="720" y2="90" stroke="#999" stroke-width="2" marker-end="url(#arw)"/>
<text x="700" y="84" text-anchor="middle" font-size="8" fill="#666">evaluator</text>

<!-- Step 4: KSI verdict -->
<rect x="720" y="60" width="300" height="60" rx="6" fill="#7B2C2C"/>
<text x="870" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">KSI-CED-RAT Verdict</text>
<text x="870" y="96" text-anchor="middle" font-size="10" fill="#F4CCCC">slot_binding(KSI-CED-RAT, confidence=high)</text>
<text x="870" y="111" text-anchor="middle" font-size="9" fill="#F4CCCC">PASS when all thresholds met</text>

<!-- Schema detail box -->
<rect x="20" y="145" width="1000" height="172" rx="5" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
<text x="30" y="163" font-size="11" font-weight="bold" fill="#1F3864">governance.training-effectiveness-record — Required Fields</text>

<!-- Schema columns: left -->
<text x="40" y="184" font-size="10" font-weight="bold" fill="#2E75B6">Top-level fields</text>
<text x="40" y="200" font-size="9" fill="#333">overall_completion_pct</text>
<text x="40" y="214" font-size="9" fill="#333">snapshot_date</text>
<text x="40" y="228" font-size="9" fill="#333">cp3_tabletop_date</text>
<text x="40" y="242" font-size="9" fill="#333">ir2_drill_date</text>
<text x="40" y="256" font-size="9" fill="#333">role_tiers[ ]</text>

<!-- Schema threshold annotations -->
<text x="200" y="200" font-size="9" fill="#375623">≥ 95.0 required for PASS</text>
<text x="200" y="214" font-size="9" fill="#555">ISO 8601 date of export</text>
<text x="200" y="228" font-size="9" fill="#375623">within last 12 months required</text>
<text x="200" y="242" font-size="9" fill="#375623">within last 12 months required</text>
<text x="200" y="256" font-size="9" fill="#555">six entries (one per tier)</text>

<!-- Vertical divider -->
<line x1="510" y1="163" x2="510" y2="305" stroke="#E0E0E0" stroke-width="1"/>

<!-- Schema columns: right (role_tier object) -->
<text x="530" y="184" font-size="10" font-weight="bold" fill="#2E75B6">role_tiers[ ] — Per-Entry Fields</text>
<text x="530" y="200" font-size="9" fill="#333">tier_name</text>
<text x="530" y="214" font-size="9" fill="#333">tier_completion_pct</text>
<text x="530" y="228" font-size="9" fill="#333">last_completion_date</text>
<text x="530" y="242" font-size="9" fill="#333">nist_controls[ ]</text>
<text x="530" y="256" font-size="9" fill="#333">ir2_drill_date (IR responders only)</text>
<text x="530" y="270" font-size="9" fill="#555">Six tiers: sysadmins, privileged_access, developers,</text>
<text x="530" y="283" font-size="9" fill="#555">ir_responders, data_stewards, executives</text>

<text x="720" y="200" font-size="9" fill="#555">e.g., &quot;sysadmins&quot; | &quot;developers&quot;</text>
<text x="720" y="214" font-size="9" fill="#375623">≥ 95.0 required per tier</text>
<text x="720" y="228" font-size="9" fill="#375623">within last 12 months</text>
<text x="720" y="242" font-size="9" fill="#555">AT-2, AT-3, AT-3(3), etc.</text>
<text x="720" y="256" font-size="9" fill="#375623">within last 12 months</text>

<!-- Bottom note -->
<rect x="20" y="325" width="1000" height="16" rx="3" fill="none"/>
<text x="520" y="337" text-anchor="middle" font-size="8.5" fill="#2E75B6">Evaluation: slot_evaluator.evaluate_rule(KSI-022, row, binding_index) → “pass” when slot-08 binding confidence=high and schema thresholds met</text>
</svg>
