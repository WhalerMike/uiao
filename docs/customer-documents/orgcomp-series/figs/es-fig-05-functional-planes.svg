<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="80" y="66" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#1F3A5F">The Seven Functional Planes</text>
  <text x="80" y="102" font-family="Arial, sans-serif" font-size="19" fill="#5B6B7C">Functions, not organizations — any agency can map its own structure onto the model</text>

  <!-- =========================================================
       PLANE ROWS
       box: x=80 w=360 h=76 ; middle text from x=475 ; volume ref right-aligned x=1560
       row tops: 150, 238, 326, 414, 502, 590, 678
       ========================================================= -->

  <!-- Plane 1 — Transport — Enforcement (navy) -->
  <rect x="80" y="150" width="360" height="76" rx="8" fill="#1F3A5F"/>
  <text x="102" y="188" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">1 · Transport</text>
  <text x="102" y="210" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#A9BBD0">ENFORCEMENT</text>
  <text x="475" y="182" font-family="Arial, sans-serif" font-size="16" fill="#1E293B">Move packets between sites and clouds</text>
  <text x="475" y="208" font-family="Arial, sans-serif" font-size="13" fill="#5B6B7C">MPLS → DIA · SD-WAN overlay · path selection · QoS</text>
  <text x="1560" y="194" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#5B6B7C">Vol I Book 06, Vol II Book 03</text>

  <!-- Plane 2 — Naming &amp; addressing — Truth (teal) -->
  <rect x="80" y="238" width="360" height="76" rx="8" fill="#1A9E8F"/>
  <text x="102" y="276" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">2 · Naming &amp; addressing</text>
  <text x="102" y="298" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#CDEBE6">TRUTH</text>
  <text x="475" y="270" font-family="Arial, sans-serif" font-size="16" fill="#1E293B">Assert what things are called and where they live</text>
  <text x="475" y="296" font-family="Arial, sans-serif" font-size="13" fill="#5B6B7C">DNS · DHCP · IPAM · DNSSEC · RPZ · certificate issuance</text>
  <text x="1560" y="282" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#5B6B7C">Vol I Books 01, 03</text>

  <!-- Plane 3 — Identity — Truth (teal) -->
  <rect x="80" y="326" width="360" height="76" rx="8" fill="#1A9E8F"/>
  <text x="102" y="364" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">3 · Identity</text>
  <text x="102" y="386" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#CDEBE6">TRUTH</text>
  <text x="475" y="358" font-family="Arial, sans-serif" font-size="16" fill="#1E293B">Assert who and what is requesting</text>
  <text x="475" y="384" font-family="Arial, sans-serif" font-size="13" fill="#5B6B7C">NAC/802.1X · Entra ID · workload identity · OAuth/OIDC · CBA</text>
  <text x="1560" y="370" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#5B6B7C">Vol I Books 02–04, 06</text>

  <!-- Plane 4 — Policy enforcement — Enforcement (navy) -->
  <rect x="80" y="414" width="360" height="76" rx="8" fill="#1F3A5F"/>
  <text x="102" y="452" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">4 · Policy enforcement</text>
  <text x="102" y="474" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#A9BBD0">ENFORCEMENT</text>
  <text x="475" y="446" font-family="Arial, sans-serif" font-size="16" fill="#1E293B">Decide and enforce per session</text>
  <text x="475" y="472" font-family="Arial, sans-serif" font-size="13" fill="#5B6B7C">SASE (SWG/CASB/FWaaS) · ZTNA · TIC 3.0 PEPs · Conditional Access</text>
  <text x="1560" y="458" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#5B6B7C">Vol I Books 05–06</text>

  <!-- Plane 5 — Application &amp; experience — Consumes both (ice-blue) -->
  <rect x="80" y="502" width="360" height="76" rx="8" fill="#EAF1FB" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="102" y="540" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F3A5F">5 · Application &amp; experience</text>
  <text x="102" y="562" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#5B6B7C">CONSUMES BOTH</text>
  <text x="475" y="534" font-family="Arial, sans-serif" font-size="16" fill="#1E293B">Deliver the mission service</text>
  <text x="475" y="560" font-family="Arial, sans-serif" font-size="13" fill="#5B6B7C">Contact center · unified communications · business apps · databases</text>
  <text x="1560" y="546" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#5B6B7C">Vol I Book 06, Vol II</text>

  <!-- Plane 6 — Evidence &amp; telemetry — Truth (teal) -->
  <rect x="80" y="590" width="360" height="76" rx="8" fill="#1A9E8F"/>
  <text x="102" y="628" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">6 · Evidence &amp; telemetry</text>
  <text x="102" y="650" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#CDEBE6">TRUTH</text>
  <text x="475" y="622" font-family="Arial, sans-serif" font-size="16" fill="#1E293B">Prove continuously what happened</text>
  <text x="475" y="648" font-family="Arial, sans-serif" font-size="13" fill="#5B6B7C">SIEM/XDR · per-session records · OSCAL bundle · KSI evidence pipeline</text>
  <text x="1560" y="634" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#5B6B7C">Vol III Book 06, Vol IV Book 06</text>

  <!-- Plane 7 — Configuration &amp; remediation — Enforcement (navy) -->
  <rect x="80" y="678" width="360" height="76" rx="8" fill="#1F3A5F"/>
  <text x="102" y="716" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">7 · Configuration &amp; remediation</text>
  <text x="102" y="738" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#A9BBD0">ENFORCEMENT</text>
  <text x="475" y="710" font-family="Arial, sans-serif" font-size="16" fill="#1E293B">Actuate and hold patch and baseline state across platforms</text>
  <text x="475" y="736" font-family="Arial, sans-serif" font-size="13" fill="#5B6B7C">Intune/Arc · AWS SSM · OCI OS Mgmt Hub/Ksplice · vLCM · Satellite/Ansible</text>
  <text x="1560" y="722" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#5B6B7C">Vol III Books 02–03</text>

  <!-- Footer axiom + legend -->
  <text x="80" y="808" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#1E293B">Enforcement planes can be re-platformed. Truth planes can only be depended on.</text>

  <rect x="1090" y="796" width="16" height="16" rx="3" fill="#1A9E8F"/>
  <text x="1114" y="809" font-family="Arial, sans-serif" font-size="14" fill="#1E293B">Truth</text>
  <rect x="1290" y="796" width="16" height="16" rx="3" fill="#1F3A5F"/>
  <text x="1314" y="809" font-family="Arial, sans-serif" font-size="14" fill="#1E293B">Enforcement</text>

  <!-- Bottom bar -->
  <line x1="80" y1="846" x2="1520" y2="846" stroke="#D6DEE7" stroke-width="1"/>
  <text x="80" y="874" font-family="Arial, sans-serif" font-size="13" fill="#5B6B7C">OrgComp — Executive Summary · CSI Team Draft — Internal, Not for Public Distribution · Date Code 2026-07-09 08:50 ET</text>
</svg>
