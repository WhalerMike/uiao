<svg viewBox="0 0 1200 580" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <defs>
    <linearGradient id="pipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8EDF8"/>
      <stop offset="50%" stop-color="#D0E4F8"/>
      <stop offset="100%" stop-color="#E8EDF8"/>
    </linearGradient>
    <linearGradient id="ibpipe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A8FD6"/>
      <stop offset="100%" stop-color="#1F3864"/>
    </linearGradient>
    <linearGradient id="mspipe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0090E0"/>
      <stop offset="100%" stop-color="#004E8C"/>
    </linearGradient>
    <marker id="a4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#1F3864" opacity="0.8"/>
    </marker>
  </defs>

  <rect width="1200" height="580" fill="#F4F8FF"/>

  <text x="600" y="36" text-anchor="middle" fill="#1F3864" font-size="21" font-weight="bold">M365 GCC Endpoint Lifecycle Automation</text>
  <text x="600" y="57" text-anchor="middle" fill="#2E75B6" font-size="13">InfoBlox auto-polls the Microsoft 365 IP &amp; URL Web Service API · Updates all enforcement layers simultaneously</text>

  <!-- Background pipeline bar -->
  <rect x="60" y="130" width="1080" height="100" rx="50" fill="url(#pipe)" stroke="#C8D8EC" stroke-width="1.5"/>

  <!-- Stage 1: Microsoft API -->
  <g>
    <rect x="70" y="120" width="200" height="120" rx="16" fill="url(#mspipe)"/>
  </g>
  <!-- MS logo squares -->
  <rect x="92" y="142" width="16" height="16" rx="2" fill="#F25022"/>
  <rect x="112" y="142" width="16" height="16" rx="2" fill="#7FBA00" stroke="#4E7300" stroke-width="2"/>
  <rect x="92" y="162" width="16" height="16" rx="2" fill="#00A4EF" stroke="#006594" stroke-width="2"/>
  <rect x="112" y="162" width="16" height="16" rx="2" fill="#FFB900"/>
  <text x="145" y="151" fill="white" font-size="13" font-weight="bold">Microsoft 365</text>
  <text x="145" y="167" fill="white" font-size="11" opacity="0.9">Endpoint API</text>
  <text x="170" y="197" text-anchor="middle" fill="white" font-size="11" opacity="0.85">endpoints.office.com</text>
  <text x="170" y="213" text-anchor="middle" fill="white" font-size="11" opacity="0.85">GCC version: daily poll</text>

  <!-- Arrow 1 -->
  <line x1="272" y1="180" x2="348" y2="180" stroke="#1F3864" stroke-width="3" marker-end="url(#a4)"/>
  <text x="310" y="168" text-anchor="middle" fill="#1F3864" font-size="11">Change</text>
  <text x="310" y="182" text-anchor="middle" fill="#1F3864" font-size="11">Detected</text>

  <!-- Stage 2: InfoBlox Processing -->
  <g>
    <rect x="350" y="108" width="220" height="144" rx="16" fill="url(#ibpipe)"/>
  </g>
  <circle cx="390" cy="162" r="22" fill="none" stroke="white" stroke-width="2.5" opacity="0.8"/>
  <circle cx="390" cy="162" r="8" fill="white" opacity="0.7"/>
  <text x="432" y="150" fill="white" font-size="14" font-weight="bold">InfoBlox DDI</text>
  <text x="432" y="167" fill="white" font-size="11" opacity="0.9">Processing Engine</text>
  <text x="460" y="194" text-anchor="middle" fill="white" font-size="11" opacity="0.85">• Parse Optimize / Allow / Default</text>
  <text x="460" y="211" text-anchor="middle" fill="white" font-size="11" opacity="0.85">• Map to GCC IP ranges</text>
  <text x="460" y="228" text-anchor="middle" fill="white" font-size="11" opacity="0.85">• Flag commercial M365 (block)</text>

  <!-- Arrow 2 -->
  <line x1="572" y1="180" x2="638" y2="180" stroke="#1F3864" stroke-width="3" marker-end="url(#a4)"/>
  <text x="605" y="168" text-anchor="middle" fill="#1F3864" font-size="11">Push</text>
  <text x="605" y="182" text-anchor="middle" fill="#1F3864" font-size="11">Updates</text>

  <!-- Stage 3: Fan-out to 4 enforcement layers -->
  <text x="790" y="108" text-anchor="middle" fill="#1F3864" font-size="14" font-weight="bold">Enforcement Updates (Simultaneous)</text>

  <!-- RPZ Passthrough -->
  <g>
    <rect x="648" y="118" width="280" height="56" rx="10" fill="white" stroke="#375623" stroke-width="2"/>
  </g>
  <rect x="660" y="130" width="36" height="32" rx="6" fill="#375623" stroke="#223515" stroke-width="2"/>
  <text x="678" y="151" text-anchor="middle" fill="white" font-size="11" font-weight="bold">RPZ</text>
  <text x="710" y="140" fill="#375623" font-size="12" font-weight="bold">RPZ Passthrough Allow-list</text>
  <text x="710" y="156" fill="#333" font-size="11">GCC FQDNs bypass threat blocking</text>
  <text x="710" y="168" fill="#C00000" font-size="11">Commercial M365 FQDNs → BLOCKED</text>

  <!-- Azure NSG -->
  <g>
    <rect x="648" y="186" width="280" height="50" rx="10" fill="white" stroke="#0066B3" stroke-width="2"/>
  </g>
  <rect x="660" y="196" width="36" height="28" rx="6" fill="#0066B3" stroke="#003F6E" stroke-width="2"/>
  <text x="678" y="215" text-anchor="middle" fill="white" font-size="10" font-weight="bold">NSG</text>
  <text x="710" y="208" fill="#0066B3" font-size="12" font-weight="bold">Azure Gov NSG IP Groups</text>
  <text x="710" y="224" fill="#333" font-size="11">Updated IP ranges for GCC Optimize endpoints</text>

  <!-- AWS Security Group -->
  <g>
    <rect x="648" y="248" width="280" height="50" rx="10" fill="white" stroke="#C55A11" stroke-width="2"/>
  </g>
  <rect x="660" y="258" width="36" height="28" rx="6" fill="#C55A11" stroke="#7A370A" stroke-width="2"/>
  <text x="678" y="276" text-anchor="middle" fill="white" font-size="10" font-weight="bold">SG</text>
  <text x="710" y="270" fill="#C55A11" font-size="12" font-weight="bold">AWS GovCloud Security Groups</text>
  <text x="710" y="286" fill="#333" font-size="11">GCC IP ranges for outbound rules</text>

  <!-- VPN Split-Tunnel -->
  <g>
    <rect x="648" y="310" width="280" height="50" rx="10" fill="white" stroke="#7030A0" stroke-width="2"/>
  </g>
  <rect x="660" y="320" width="36" height="28" rx="6" fill="#7030A0" stroke="#451D63" stroke-width="2"/>
  <text x="678" y="338" text-anchor="middle" fill="white" font-size="9" font-weight="bold">VPN</text>
  <text x="710" y="332" fill="#7030A0" font-size="12" font-weight="bold">VPN Split-Tunnel DNS Config</text>
  <text x="710" y="348" fill="#333" font-size="11">M365 Optimize FQDNs bypass VPN</text>

  <!-- Fan-out lines -->
  <line x1="640" y1="180" x2="648" y2="146" stroke="#1F3864" stroke-width="1.5" opacity="0.5"/>
  <line x1="640" y1="180" x2="648" y2="211" stroke="#1F3864" stroke-width="1.5" opacity="0.5"/>
  <line x1="640" y1="180" x2="648" y2="273" stroke="#1F3864" stroke-width="1.5" opacity="0.5"/>
  <line x1="640" y1="180" x2="648" y2="335" stroke="#1F3864" stroke-width="1.5" opacity="0.5"/>
  <circle cx="640" cy="180" r="5" fill="#1F3864"/>

  <!-- Sentinel alert output -->
  <g>
    <rect x="948" y="190" width="220" height="74" rx="12" fill="#7030A0" stroke="#451D63" stroke-width="2"/>
  </g>
  <text x="1058" y="214" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Sentinel Alert</text>
  <text x="1058" y="231" text-anchor="middle" fill="white" font-size="11" opacity="0.9">Commercial M365 DNS query</text>
  <text x="1058" y="247" text-anchor="middle" fill="white" font-size="11" opacity="0.9">from in-boundary workload</text>
  <text x="1058" y="263" text-anchor="middle" fill="white" font-size="11" opacity="0.85">→ Boundary violation IR ticket</text>
  <line x1="928" y1="227" x2="948" y2="227" stroke="#7030A0" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Before / After comparison box -->
  <rect x="60" y="400" width="520" height="150" rx="12" fill="#FCE4D6" stroke="#C55A11" stroke-width="1.5"/>
  <text x="320" y="424" text-anchor="middle" fill="#7B3000" font-size="14" font-weight="bold">BEFORE InfoBlox: Manual Endpoint Updates</text>
  <text x="80" y="448" fill="#7B3000" font-size="12">• 4 separate change tickets (NSG, SG, RPZ, VPN) per endpoint change</text>
  <text x="80" y="466" fill="#7B3000" font-size="12">• Microsoft changes endpoints 8–12x per year</text>
  <text x="80" y="484" fill="#7B3000" font-size="12">• Lag between change and enforcement = boundary gap window</text>
  <text x="80" y="502" fill="#7B3000" font-size="12">• No detection of workloads hitting commercial M365 endpoints</text>
  <text x="80" y="520" fill="#7B3000" font-size="12">• GCC vs commercial boundary ambiguity not enforced</text>

  <rect x="620" y="400" width="520" height="150" rx="12" fill="#C8E6C9" stroke="#375623" stroke-width="1.5"/>
  <text x="880" y="424" text-anchor="middle" fill="#1B4D1B" font-size="14" font-weight="bold">AFTER InfoBlox: Automated Enforcement</text>
  <text x="640" y="448" fill="#1B4D1B" font-size="12">✓  Single scheduled task polls Microsoft API daily</text>
  <text x="640" y="466" fill="#1B4D1B" font-size="12">✓  All four enforcement layers update within minutes</text>
  <text x="640" y="484" fill="#1B4D1B" font-size="12">✓  GCC vs commercial DNS resolution enforced at RPZ</text>
  <text x="640" y="502" fill="#1B4D1B" font-size="12">✓  Sentinel alert fires on any GCC boundary drift</text>
  <text x="640" y="520" fill="#1B4D1B" font-size="12">✓  Zero change tickets for routine endpoint updates</text>
</svg>
