<svg viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <text x="115" y="88" font-size="30" font-weight="700" letter-spacing="1" fill="#1A9E8F">TWO CREDENTIALS</text>
  <text x="112" y="158" font-size="58" font-weight="700" fill="#1F3A5F">Competency credentials, evidenced by artifacts &#8212;</text>
  <text x="112" y="228" font-size="58" font-weight="700" fill="#1F3A5F">not attendance</text>

  <!-- Card 1 — OrgComp Practitioner -->
  <rect x="106" y="290" width="562" height="466" rx="16" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="2"/>
  <circle cx="171" cy="351" r="28" fill="#1F3A5F"/>
  <text x="171" y="362" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">1</text>
  <text x="226" y="363" font-size="33" font-weight="700" fill="#1F3A5F">OrgComp Practitioner</text>
  <text x="148" y="426" font-size="25" fill="#243248">Track B capstone at pass (one module,</text>
  <text x="148" y="460" font-size="25" fill="#243248">evidence-complete) + the matrix</text>
  <text x="148" y="494" font-size="25" fill="#243248">reconstructed for the slots that module</text>
  <text x="148" y="528" font-size="25" fill="#243248">feeds. Proves: build the control and land</text>
  <text x="148" y="562" font-size="25" fill="#243248">the evidence.</text>
  <rect x="140" y="672" width="494" height="56" rx="8" fill="#EDF2FA"/>
  <text x="387" y="709" text-anchor="middle" font-size="26" font-weight="700" fill="#1F3A5F">Implementation</text>

  <!-- Card 2 — OrgComp Assessor -->
  <rect x="688" y="290" width="562" height="466" rx="16" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="2"/>
  <circle cx="753" cy="351" r="28" fill="#1A9E8F"/>
  <text x="753" y="362" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">2</text>
  <text x="808" y="363" font-size="33" font-weight="700" fill="#1F3A5F">OrgComp Assessor</text>
  <text x="730" y="426" font-size="25" fill="#243248">Track A capstone at pass (all eight slots,</text>
  <text x="730" y="460" font-size="25" fill="#243248">&#8805;3 assessor-ready) + the full matrix with</text>
  <text x="730" y="494" font-size="25" fill="#243248">the 10/19 split and per-rule reasoning.</text>
  <text x="730" y="528" font-size="25" fill="#243248">Proves: trace and adjudicate the whole</text>
  <text x="730" y="562" font-size="25" fill="#243248">model.</text>
  <rect x="722" y="672" width="494" height="56" rx="8" fill="#E2F4F1"/>
  <text x="969" y="709" text-anchor="middle" font-size="26" font-weight="700" fill="#1A9E8F">Compliance</text>

  <!-- Card 3 — Feeds slot 8 -->
  <rect x="1270" y="290" width="562" height="466" rx="16" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="2"/>
  <circle cx="1335" cy="351" r="28" fill="#E8A020"/>
  <text x="1335" y="362" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">3</text>
  <text x="1390" y="363" font-size="33" font-weight="700" fill="#1F3A5F">Feeds slot 8</text>
  <text x="1312" y="426" font-size="25" fill="#243248">The dated, per-identity completion record</text>
  <text x="1312" y="460" font-size="25" fill="#243248">is the training-effectiveness-record that</text>
  <text x="1312" y="494" font-size="25" fill="#243248">closes AT-2/AT-3 and satisfies KSI-022.</text>
  <rect x="1304" y="672" width="494" height="56" rx="8" fill="#FBF0D9"/>
  <text x="1551" y="709" text-anchor="middle" font-size="26" font-weight="700" fill="#B27210">KSI-CED</text>

  <!-- Footer banner -->
  <rect x="106" y="828" width="1728" height="118" rx="10" fill="#EDF2FA"/>
  <text x="146" y="878" font-size="30" font-weight="700" fill="#1F3A5F">The Academy's own graduates are the series' training evidence &#8212; competency is a control (AT-3), so the credential</text>
  <text x="146" y="916" font-size="30" font-weight="700" fill="#1F3A5F">is evidenced, not attended.</text>

  <!-- Meta footer -->
  <text x="112" y="1040" font-size="26" fill="#5A6B7B">Assessment, Rubrics &amp; Certification &#183; Date Code: 2026-07-09 13:54 ET</text>
  <text x="1820" y="1040" text-anchor="end" font-size="26" fill="#5A6B7B">4</text>
</svg>
