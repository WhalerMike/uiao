<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1E8C8C"/></marker>
    <marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C0392B"/></marker>
    <g id="outree">
      <rect x="15" y="0" width="18" height="12" fill="#0D1B2E"/>
      <line x1="24" y1="12" x2="24" y2="19" stroke="#5A5A5A" stroke-width="1.5"/>
      <line x1="8" y1="19" x2="40" y2="19" stroke="#5A5A5A" stroke-width="1.5"/>
      <line x1="8" y1="19" x2="8" y2="25" stroke="#5A5A5A" stroke-width="1.5"/>
      <line x1="40" y1="19" x2="40" y2="25" stroke="#5A5A5A" stroke-width="1.5"/>
      <rect x="0" y="25" width="16" height="11" fill="#1E3A66"/>
      <rect x="32" y="25" width="16" height="11" fill="#1E3A66"/>
    </g>
  </defs>

  <text x="640" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#0D1B2E">Fragmented Truth vs. the HR-Anchored Single Source of Truth</text>
  <text x="640" y="72" text-anchor="middle" font-size="17" fill="#6B7A8D">Five disconnected stores reconciled by tickets &#8212; or one system of record every consumer derives from</text>

  <!-- ============ LEFT PANEL: Fragmented Truth ============ -->
  <rect x="42" y="96" width="576" height="596" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="2"/>
  <rect x="42" y="96" width="576" height="38" rx="10" fill="#F7E2DE"/>
  <rect x="42" y="118" width="576" height="16" fill="#F7E2DE"/>
  <text x="330" y="122" text-anchor="middle" font-size="21" font-weight="bold" fill="#C0392B">Fragmented Truth</text>

  <!-- 12 AD OU tree icons: regional silos -->
  <rect x="62" y="148" width="252" height="200" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="188" y="172" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">regional directory silos (12)</text>
  <use href="#outree" x="74" y="184"/><use href="#outree" x="134" y="184"/><use href="#outree" x="194" y="184"/><use href="#outree" x="254" y="184"/>
  <use href="#outree" x="74" y="236"/><use href="#outree" x="134" y="236"/><use href="#outree" x="194" y="236"/><use href="#outree" x="254" y="236"/>
  <use href="#outree" x="74" y="288"/><use href="#outree" x="134" y="288"/><use href="#outree" x="194" y="288"/><use href="#outree" x="254" y="288"/>

  <!-- Spreadsheet icon: onboarding tracker -->
  <text x="405" y="150" text-anchor="middle" font-size="16" fill="#33414F">onboarding tracker</text>
  <rect x="352" y="156" width="118" height="78" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="352" y="156" width="118" height="19" fill="#EAF1FB"/>
  <line x1="352" y1="175" x2="470" y2="175" stroke="#0D1B2E" stroke-width="1"/>
  <line x1="352" y1="195" x2="470" y2="195" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="352" y1="215" x2="470" y2="215" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="382" y1="156" x2="382" y2="234" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="412" y1="156" x2="412" y2="234" stroke="#E3E8EF" stroke-width="1"/>
  <line x1="442" y1="156" x2="442" y2="234" stroke="#E3E8EF" stroke-width="1"/>

  <!-- Visio-style org chart drawing: not queryable -->
  <text x="550" y="150" text-anchor="middle" font-size="16" fill="#33414F">org chart drawing</text>
  <rect x="488" y="156" width="112" height="78" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <rect x="528" y="164" width="32" height="14" fill="#6B7A8D"/>
  <line x1="544" y1="178" x2="544" y2="188" stroke="#6B7A8D" stroke-width="1.5"/>
  <line x1="514" y1="188" x2="574" y2="188" stroke="#6B7A8D" stroke-width="1.5"/>
  <line x1="514" y1="188" x2="514" y2="198" stroke="#6B7A8D" stroke-width="1.5"/>
  <line x1="574" y1="188" x2="574" y2="198" stroke="#6B7A8D" stroke-width="1.5"/>
  <rect x="498" y="198" width="32" height="14" fill="#6B7A8D"/>
  <rect x="558" y="198" width="32" height="14" fill="#6B7A8D"/>
  <text x="520" y="270" text-anchor="middle" font-size="17" font-weight="bold" fill="#C0392B">not queryable</text>

  <!-- Three application cylinders -->
  <g stroke="#0D1B2E" stroke-width="2" fill="#EAF1FB">
    <rect x="102" y="400" width="116" height="70" stroke="none"/>
    <line x1="102" y1="400" x2="102" y2="470"/>
    <line x1="218" y1="400" x2="218" y2="470"/>
    <ellipse cx="160" cy="470" rx="58" ry="13"/>
    <ellipse cx="160" cy="400" rx="58" ry="13"/>
    <rect x="277" y="400" width="116" height="70" stroke="none"/>
    <line x1="277" y1="400" x2="277" y2="470"/>
    <line x1="393" y1="400" x2="393" y2="470"/>
    <ellipse cx="335" cy="470" rx="58" ry="13"/>
    <ellipse cx="335" cy="400" rx="58" ry="13"/>
    <rect x="452" y="400" width="116" height="70" stroke="none"/>
    <line x1="452" y1="400" x2="452" y2="470"/>
    <line x1="568" y1="400" x2="568" y2="470"/>
    <ellipse cx="510" cy="470" rx="58" ry="13"/>
    <ellipse cx="510" cy="400" rx="58" ry="13"/>
  </g>
  <text x="160" y="442" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">App 1</text>
  <text x="335" y="442" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">App 2</text>
  <text x="510" y="442" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">App 3</text>
  <text x="335" y="516" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">per-system account stores</text>

  <!-- Dotted red conflict arrows with question marks -->
  <g stroke="#C0392B" stroke-width="2" stroke-dasharray="5,5" fill="none">
    <line x1="316" y1="200" x2="348" y2="200" marker-end="url(#mRed)"/>
    <line x1="150" y1="352" x2="150" y2="392" marker-end="url(#mRed)"/>
    <line x1="411" y1="240" x2="345" y2="390" marker-end="url(#mRed)"/>
    <line x1="602" y1="238" x2="562" y2="388" marker-end="url(#mRed)"/>
    <line x1="222" y1="436" x2="273" y2="436" marker-end="url(#mRed)"/>
    <line x1="448" y1="436" x2="397" y2="436" marker-end="url(#mRed)"/>
  </g>
  <g font-size="21" font-weight="bold" fill="#C0392B" text-anchor="middle">
    <text x="332" y="190">?</text>
    <text x="165" y="378">?</text>
    <text x="392" y="318">?</text>
    <text x="608" y="318">?</text>
    <text x="247" y="424">?</text>
    <text x="422" y="424">?</text>
  </g>

  <!-- Red badge -->
  <rect x="120" y="630" width="420" height="46" rx="23" fill="#C0392B"/>
  <text x="330" y="660" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">orphaned accounts: the guaranteed output</text>

  <!-- ============ RIGHT PANEL: One Source of Truth ============ -->
  <rect x="662" y="96" width="576" height="596" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="2"/>
  <rect x="662" y="96" width="576" height="38" rx="10" fill="#D7F2EE"/>
  <rect x="662" y="118" width="576" height="16" fill="#D7F2EE"/>
  <text x="950" y="122" text-anchor="middle" font-size="21" font-weight="bold" fill="#1E8C8C">One Source of Truth</text>

  <!-- HCM system of record -->
  <rect x="712" y="150" width="476" height="104" rx="10" fill="#0D1B2E"/>
  <text x="950" y="184" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">HCM System of Record</text>
  <text x="950" y="212" text-anchor="middle" font-size="17" fill="#EAF1FB">worker records &#183; positions &#183; supervisory hierarchy</text>
  <text x="950" y="238" text-anchor="middle" font-size="15" fill="#6B7A8D">effective-dated business facts</text>

  <line x1="950" y1="254" x2="950" y2="286" stroke="#1E8C8C" stroke-width="3" marker-end="url(#mTeal)"/>

  <!-- Integration middleware -->
  <rect x="752" y="292" width="396" height="56" rx="8" fill="#1E3A66"/>
  <text x="950" y="315" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Integration Middleware</text>
  <text x="950" y="338" text-anchor="middle" font-size="15" fill="#EAF1FB">SCIM 2.0 &#183; single provisioning entry point</text>

  <line x1="950" y1="348" x2="950" y2="380" stroke="#1E8C8C" stroke-width="3" marker-end="url(#mTeal)"/>

  <!-- Entra ID -->
  <rect x="810" y="386" width="280" height="62" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="950" y="412" text-anchor="middle" font-size="20" font-weight="bold" fill="#0D1B2E">Entra ID</text>
  <text x="950" y="436" text-anchor="middle" font-size="15" fill="#6B7A8D">identity platform</text>

  <!-- Fan-out to consumers -->
  <g stroke="#1E8C8C" stroke-width="2.5" fill="none">
    <line x1="880" y1="450" x2="752" y2="508" marker-end="url(#mTeal)"/>
    <line x1="925" y1="452" x2="886" y2="508" marker-end="url(#mTeal)"/>
    <line x1="975" y1="452" x2="1018" y2="508" marker-end="url(#mTeal)"/>
    <line x1="1020" y1="450" x2="1152" y2="508" marker-end="url(#mTeal)"/>
  </g>
  <g fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2">
    <rect x="686" y="512" width="124" height="56" rx="8"/>
    <rect x="822" y="512" width="124" height="56" rx="8"/>
    <rect x="958" y="512" width="124" height="56" rx="8"/>
    <rect x="1094" y="512" width="124" height="56" rx="8"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle">
    <text x="748" y="546">Directory</text>
    <text x="884" y="546">Applications</text>
    <text x="1020" y="546">Badge</text>
    <text x="1156" y="546">VPN</text>
  </g>
  <g font-size="15" fill="#1E8C8C" text-anchor="middle">
    <text x="748" y="590">derived</text><text x="748" y="608">auditable</text>
    <text x="884" y="590">derived</text><text x="884" y="608">auditable</text>
    <text x="1020" y="590">derived</text><text x="1020" y="608">auditable</text>
    <text x="1156" y="590">derived</text><text x="1156" y="608">auditable</text>
  </g>

  <path d="M718,650 l7,8 l13,-16" fill="none" stroke="#1E8C8C" stroke-width="4"/>
  <text x="960" y="658" text-anchor="middle" font-size="19" font-weight="bold" fill="#1E8C8C">every account traceable to a worker record</text>
</svg>
