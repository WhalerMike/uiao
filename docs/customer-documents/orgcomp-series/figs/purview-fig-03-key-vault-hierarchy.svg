<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="860" height="480" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#999"/></marker><marker id="arww" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#fff"/></marker></defs><text x="430" y="26" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">Cryptographic Key Hierarchy</text><text x="430" y="44" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">Offline root → issuing CA → Key Vault CMK → application-level encryption</text><rect x="280" y="62" width="300" height="50" rx="8" fill="#C00000"/><text x="430" y="82" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">Root CA (HSM — offline)</text><text x="430" y="95" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">Air-gapped · Annual ceremony</text><line x1="430" y1="112" x2="430" y2="130" stroke="#999" stroke-width="2" marker-end="url(#arw)"/><rect x="280" y="132" width="300" height="50" rx="8" fill="#C55A11"/><text x="430" y="152" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">Issuing CA</text><text x="430" y="165" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">ADCS or PKI-as-a-Service · Online · OCSP</text><line x1="430" y1="182" x2="430" y2="200" stroke="#999" stroke-width="2" marker-end="url(#arw)"/><rect x="230" y="202" width="400" height="55" rx="8" fill="#1F3864"/><text x="430" y="222" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF">Azure Key Vault — Customer-Managed Keys</text><text x="430" y="237" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#FFFFFF">HSM-backed · Managed Identity access only · Annual rotation</text><line x1="430" y1="257" x2="430" y2="300" stroke="#DDDDDD" stroke-width="1"/><line x1="185" y1="300" x2="670" y2="300" stroke="#DDDDDD" stroke-width="1"/><line x1="185" y1="300" x2="185" y2="315" stroke="#DDDDDD" stroke-width="1"/><rect x="120" y="320" width="130" height="60" rx="6" fill="#2E75B6"/><text x="185" y="342" text-anchor="middle" font-size="9" font-weight="bold" font-style="normal" fill="#FFFFFF">SQL Server TDE</text><text x="185" y="360" text-anchor="middle" font-size="9" font-weight="bold" font-style="normal" fill="#FFFFFF">(Vol II Books 01-02 extension)</text><line x1="425" y1="300" x2="425" y2="315" stroke="#DDDDDD" stroke-width="1"/><rect x="360" y="320" width="130" height="60" rx="6" fill="#2E75B6"/><text x="425" y="342" text-anchor="middle" font-size="9" font-weight="bold" font-style="normal" fill="#FFFFFF">SharePoint Online</text><text x="425" y="360" text-anchor="middle" font-size="9" font-weight="bold" font-style="normal" fill="#FFFFFF">BYOK</text><line x1="665" y1="300" x2="665" y2="315" stroke="#DDDDDD" stroke-width="1"/><rect x="600" y="320" width="130" height="60" rx="6" fill="#2E75B6"/><text x="665" y="342" text-anchor="middle" font-size="9" font-weight="bold" font-style="normal" fill="#FFFFFF">Exchange</text><text x="665" y="360" text-anchor="middle" font-size="9" font-weight="bold" font-style="normal" fill="#FFFFFF">Customer Key</text><text x="430" y="466" text-anchor="middle" font-size="9" font-weight="normal" font-style="normal" fill="#1F3864">Satisfies: SC-12 Cryptographic Key Management · SC-12(1) Availability · SC-17 PKI Certificates · AU-10 Non-repudiation</text></svg>
