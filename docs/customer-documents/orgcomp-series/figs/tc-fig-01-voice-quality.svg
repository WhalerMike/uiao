<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="gbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C00000"/>
      <stop offset="30%" stop-color="#C55A11"/>
      <stop offset="60%" stop-color="#2E75B6"/>
      <stop offset="100%" stop-color="#375623"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">Voice Quality: Physics With a Pass/Fail Threshold</text>
  <text x="600" y="76" text-anchor="middle" font-size="14" fill="#555">ITU-T G.114 &amp; G.107 E-Model — standards, not preferences</text>

  <!-- MOS Scale bar -->
  <text x="100" y="120" font-size="14" fill="#1F3864" font-weight="bold">Mean Opinion Score (MOS) Scale</text>
  <rect x="100" y="135" width="1000" height="40" rx="6" fill="url(#gbar)"/>
  <!-- MOS labels -->
  <text x="100" y="195" font-size="12" fill="#C00000" font-weight="bold">1.0</text>
  <text x="115" y="210" font-size="11" fill="#C00000">Bad</text>
  <line x1="300" y1="130" x2="300" y2="178" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="300" y="195" text-anchor="middle" font-size="12" fill="#C55A11" font-weight="bold">3.1</text>
  <text x="300" y="210" text-anchor="middle" font-size="11" fill="#C55A11">Abandon calls</text>
  <line x1="500" y1="130" x2="500" y2="178" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="500" y="195" text-anchor="middle" font-size="12" fill="#C55A11" font-weight="bold">3.6</text>
  <text x="500" y="210" text-anchor="middle" font-size="11" fill="#555">Fair / Complaints</text>
  <line x1="750" y1="130" x2="750" y2="178" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="750" y="195" text-anchor="middle" font-size="12" fill="#2E75B6" font-weight="bold">4.0</text>
  <text x="750" y="210" text-anchor="middle" font-size="11" fill="#2E75B6">Good — N8NN floor</text>
  <line x1="960" y1="130" x2="960" y2="178" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="960" y="195" text-anchor="middle" font-size="12" fill="#375623" font-weight="bold">4.3</text>
  <text x="960" y="210" text-anchor="middle" font-size="11" fill="#375623">Excellent</text>
  <text x="1100" y="195" text-anchor="middle" font-size="12" fill="#375623" font-weight="bold">5.0</text>
  <!-- N8NN target arrow -->
  <polygon points="750,125 744,108 756,108" fill="#2E75B6"/>
  <text x="750" y="103" text-anchor="middle" font-size="12" fill="#2E75B6" font-weight="bold">N8NN Target ≥ 4.0</text>

  <!-- G.114 Budget breakdown -->
  <text x="100" y="260" font-size="16" font-weight="bold" fill="#1F3864">G.114 One-Way Delay Budget: 150 ms Total</text>
  <!-- boxes -->
  <!-- Codec 20ms -->
  <rect x="100" y="280" width="133" height="70" rx="6" fill="#1F3864" stroke="#13223E" stroke-width="2"/>
  <text x="166" y="308" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Opus Codec</text>
  <text x="166" y="326" text-anchor="middle" font-size="20" fill="#C55A11" font-weight="bold">20 ms</text>
  <text x="166" y="342" text-anchor="middle" font-size="11" fill="#aaa">encode/decode</text>
  <!-- Jitter 50ms -->
  <rect x="243" y="280" width="333" height="70" rx="6" fill="#2E75B6" stroke="#1C4870" stroke-width="2"/>
  <text x="409" y="308" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Adaptive Jitter Buffer</text>
  <text x="409" y="326" text-anchor="middle" font-size="20" fill="white" font-weight="bold">50 ms</text>
  <text x="409" y="342" text-anchor="middle" font-size="11" fill="#cce">typical adaptive</text>
  <!-- Network 75ms remaining -->
  <rect x="586" y="280" width="500" height="70" rx="6" fill="#375623" stroke="#223515" stroke-width="2"/>
  <text x="836" y="308" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Network Budget Remaining</text>
  <text x="836" y="326" text-anchor="middle" font-size="26" fill="#C55A11" font-weight="bold">75 ms</text>
  <text x="836" y="342" text-anchor="middle" font-size="11" fill="#adc">one-way network target</text>

  <!-- Arrows between boxes -->
  <line x1="233" y1="315" x2="243" y2="315" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="576" y1="315" x2="586" y2="315" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Path scenarios -->
  <text x="100" y="400" font-size="16" font-weight="bold" fill="#1F3864">Real-World Path Latency (Network Budget vs. Actual)</text>
  <!-- Scenario rows -->
  <!-- Portland MPLS -->
  <rect x="100" y="418" width="900" height="44" rx="6" fill="#FFF5F5" stroke="#C00000" stroke-width="1.5"/>
  <text x="120" y="443" font-size="13" fill="#C00000" font-weight="bold">✗  Portland → MPLS → Washington → AWS us-east-1:</text>
  <text x="750" y="443" font-size="13" fill="#C00000" font-weight="bold">100–130 ms one-way    OVER BUDGET</text>
  <!-- Portland MPLS west -->
  <rect x="100" y="470" width="900" height="44" rx="6" fill="#FFF8F0" stroke="#C55A11" stroke-width="1.5"/>
  <text x="120" y="495" font-size="13" fill="#C55A11" font-weight="bold">⚠  Portland → MPLS → Washington → AWS us-west-2:</text>
  <text x="750" y="495" font-size="13" fill="#C55A11" font-weight="bold">80–110 ms one-way    AT LIMIT</text>
  <!-- Portland DIA -->
  <rect x="100" y="522" width="900" height="44" rx="6" fill="#F0FFF0" stroke="#375623" stroke-width="1.5"/>
  <text x="120" y="547" font-size="13" fill="#375623" font-weight="bold">✓  Portland → Local DIA → AWS us-west-2:</text>
  <text x="750" y="547" font-size="13" fill="#375623" font-weight="bold">5–15 ms one-way      COMPLIANT</text>

  <text x="600" y="614" text-anchor="middle" font-size="12" fill="#888">Source: ITU-T G.114 one-way delay standard · ITU-T G.107 E-model · AWS latency data</text>
</svg>
