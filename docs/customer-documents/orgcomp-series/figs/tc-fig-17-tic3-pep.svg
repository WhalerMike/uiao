<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1400" height="900" fill="#FFFFFF"/>
  <text x="90" y="52" font-size="14" font-weight="700" letter-spacing="2" fill="#1A9E8F">THE COMPLIANCE HALF — POLICY</text>
  <text x="90" y="98" font-size="32" font-weight="700" fill="#1F3A5F">TIC 3.0: the policy that makes local breakout lawful</text>

  <!-- Table -->
  <g>
    <!-- header row -->
    <rect x="90" y="140" width="1220" height="66" fill="#1F3A5F"/>
    <text x="112" y="180" font-size="16" font-weight="700" fill="#FFFFFF">TIC 3.0 use case</text>
    <text x="422" y="180" font-size="16" font-weight="700" fill="#FFFFFF">Agency population</text>
    <text x="732" y="180" font-size="16" font-weight="700" fill="#FFFFFF">Traffic path governed</text>
    <text x="1042" y="180" font-size="16" font-weight="700" fill="#FFFFFF">Where the PEP must be</text>

    <!-- column dividers (guides) -->
    <!-- row 1: Branch Office -->
    <rect x="90" y="206" width="1220" height="98" fill="#FFFFFF"/>
    <text x="112" y="240" font-size="15.5" font-weight="700" fill="#1F3A5F">Branch Office</text>
    <text x="112" y="262" font-size="15.5" font-weight="700" fill="#1F3A5F">(Use Case E)</text>
    <text x="422" y="240" font-size="14.5" fill="#33414F">Field office agents on Connect +</text>
    <text x="422" y="260" font-size="14.5" fill="#33414F">Teams Phone</text>
    <text x="732" y="240" font-size="14.5" fill="#33414F">Field office → local DIA → AWS</text>
    <text x="732" y="260" font-size="14.5" fill="#33414F">.com / M365 GCC</text>
    <text x="1042" y="240" font-size="14.5" fill="#33414F">At or near branch egress:</text>
    <text x="1042" y="260" font-size="14.5" fill="#33414F">SD-WAN edge + SASE services</text>

    <!-- row 2: Remote User -->
    <rect x="90" y="304" width="1220" height="98" fill="#F4F7FA"/>
    <text x="112" y="338" font-size="15.5" font-weight="700" fill="#1F3A5F">Remote User</text>
    <text x="422" y="348" font-size="14.5" fill="#33414F">Teleworking agents and staff</text>
    <text x="732" y="338" font-size="14.5" fill="#33414F">Home network → internet →</text>
    <text x="732" y="358" font-size="14.5" fill="#33414F">cloud voice platforms</text>
    <text x="1042" y="338" font-size="14.5" fill="#33414F">Cloud-delivered SASE PoP;</text>
    <text x="1042" y="358" font-size="14.5" fill="#33414F">ZTNA replacing VPN</text>

    <rect x="90" y="140" width="1220" height="262" fill="none" stroke="#D9E2EA" stroke-width="1.5"/>
    <line x1="90" y1="206" x2="1310" y2="206" stroke="#D9E2EA" stroke-width="1.5"/>
    <line x1="90" y1="304" x2="1310" y2="304" stroke="#D9E2EA" stroke-width="1.5"/>
    <line x1="400" y1="140" x2="400" y2="402" stroke="#D9E2EA" stroke-width="1.5"/>
    <line x1="710" y1="140" x2="710" y2="402" stroke="#D9E2EA" stroke-width="1.5"/>
    <line x1="1020" y1="140" x2="1020" y2="402" stroke="#D9E2EA" stroke-width="1.5"/>
  </g>

  <!-- Permissibility rule callout -->
  <rect x="90" y="440" width="1220" height="120" rx="12" fill="#EAF6F4"/>
  <text x="122" y="478" font-size="15.5" fill="#0E5C5C"><tspan font-weight="700">The permissibility rule: </tspan><tspan>TIC 3.0 (OMB M-19-26) replaced mandatory consolidation with a</tspan></text>
  <text x="122" y="502" font-size="15.5" fill="#33414F">use-case model. Both use cases permit traffic to leave without hairpinning through a TIC access</text>
  <text x="122" y="526" font-size="15.5" fill="#33414F">point. Neither permits it to leave ungoverned: the security-capabilities catalog must be satisfied</text>
  <text x="122" y="546" font-size="15.5" fill="#33414F">at the distributed PEP — and the SASE stack is that PEP.</text>

  <!-- Finding warning callout -->
  <rect x="90" y="580" width="1220" height="120" rx="12" fill="#FBEAE7"/>
  <text x="122" y="618" font-size="15.5" fill="#C0392B"><tspan font-weight="700">An ungoverned DIA circuit is not modernization; it is a finding. </tspan><tspan fill="#33414F">The bare circuit that fixes</tspan></text>
  <text x="122" y="642" font-size="15.5" fill="#33414F">G.114 simultaneously deletes the SC-7 boundary the MPLS-to-TIC path did provide. With the</text>
  <text x="122" y="666" font-size="15.5" fill="#33414F">SASE PEP in place, the same circuit is the TIC 3.0 target architecture. The difference is not the</text>
  <text x="122" y="686" font-size="15.5" fill="#33414F">circuit — it is the control stack riding on it.</text>

  <text x="90" y="748" font-size="13" fill="#8A97A3">Source: OrgComp Vol I Book 06 — Federal Telecommunications Modernization</text>
</svg>
