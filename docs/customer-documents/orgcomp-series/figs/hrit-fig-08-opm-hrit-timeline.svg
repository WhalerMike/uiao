<svg viewBox="0 0 1280 940" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="940" fill="#FFFFFF"/>

  <text x="70" y="52" font-size="13" font-weight="bold" letter-spacing="4" fill="#1E8C8C">INTRODUCTION — HOW IT GOT HERE</text>
  <text x="70" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E">Five decades of consolidation: the OPM HRIT timeline</text>

  <!-- Federal HR 2.0 era band behind milestones 7-10 -->
  <rect x="60" y="540" width="1160" height="256" rx="10" fill="#EAF1FB" stroke="#2E75B6" stroke-width="1"/>
  <text x="1200" y="566" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2E75B6">THE FEDERAL HR 2.0 ERA</text>
  <text x="1200" y="582" text-anchor="end" font-size="10" fill="#6B7A8D">memo &#8594; award &#8594; waves &#8594; one system</text>

  <!-- timeline spine -->
  <line x1="150" y1="150" x2="150" y2="768" stroke="#C9D4E0" stroke-width="3"/>

  <!-- 1972 -->
  <circle cx="150" cy="150" r="10" fill="#0D1B2E"/>
  <text x="190" y="147" font-size="16" font-weight="bold" fill="#0D1B2E">1972</text>
  <text x="250" y="147" font-size="16" font-weight="bold" fill="#0D1B2E">CPDF</text>
  <text x="190" y="168" font-size="13.5" fill="#33414F">The Central Personnel Data File — OPM's first government-wide personnel data system</text>

  <!-- 2002 -->
  <circle cx="150" cy="216" r="10" fill="#1E8C8C"/>
  <text x="190" y="213" font-size="16" font-weight="bold" fill="#1E8C8C">2002</text>
  <text x="250" y="213" font-size="16" font-weight="bold" fill="#0D1B2E">e-Gov era</text>
  <text x="190" y="234" font-size="13.5" fill="#33414F">e-Payroll consolidates 26 federal payroll providers to 4; eOPF begins digitizing the paper personnel folder</text>

  <!-- 2004 -->
  <circle cx="150" cy="282" r="10" fill="#1E8C8C"/>
  <text x="190" y="279" font-size="16" font-weight="bold" fill="#1E8C8C">2004</text>
  <text x="250" y="279" font-size="16" font-weight="bold" fill="#0D1B2E">HR Line of Business</text>
  <text x="190" y="300" font-size="13.5" fill="#33414F">OPM-led shared-services program; the federal HR business reference model; agency HR moves to shared service centers</text>

  <!-- ~2010 -->
  <circle cx="150" cy="348" r="10" fill="#D4A017"/>
  <text x="190" y="345" font-size="16" font-weight="bold" fill="#B8860B">~2010</text>
  <text x="262" y="345" font-size="16" font-weight="bold" fill="#0D1B2E">EHRI</text>
  <text x="190" y="366" font-size="13.5" fill="#33414F">Enterprise Human Resources Integration replaces CPDF — the government-wide HR data warehouse + electronic OPF</text>

  <!-- 2019 -->
  <circle cx="150" cy="414" r="10" fill="#D4A017"/>
  <text x="190" y="411" font-size="16" font-weight="bold" fill="#B8860B">2019</text>
  <text x="250" y="411" font-size="16" font-weight="bold" fill="#0D1B2E">HR QSMO</text>
  <text x="190" y="432" font-size="13.5" fill="#33414F">OMB M-19-16 designates OPM the HR Quality Services Management Office — standards owner + storefront</text>

  <!-- 2021 -->
  <circle cx="150" cy="480" r="10" fill="#C0392B"/>
  <text x="190" y="477" font-size="16" font-weight="bold" fill="#C0392B">2021</text>
  <text x="250" y="477" font-size="16" font-weight="bold" fill="#0D1B2E">QSMO marketplace</text>
  <text x="190" y="498" font-size="13.5" fill="#33414F">The vetted HR IT catalog opens; agencies steered to standards-aligned shared solutions</text>

  <!-- 2025 (HR 2.0 era) -->
  <circle cx="150" cy="576" r="10" fill="#0D1B2E"/>
  <text x="190" y="573" font-size="16" font-weight="bold" fill="#0D1B2E">2025</text>
  <text x="250" y="573" font-size="16" font-weight="bold" fill="#0D1B2E">Federal HR 2.0</text>
  <text x="190" y="594" font-size="13.5" fill="#33414F">The joint OMB/OPM memorandum (December 10) directs one government-wide Core HCM platform; agencies pause their own Core HCM work</text>

  <!-- 2026 -->
  <circle cx="150" cy="642" r="10" fill="#1E8C8C"/>
  <text x="190" y="639" font-size="16" font-weight="bold" fill="#1E8C8C">2026</text>
  <text x="250" y="639" font-size="16" font-weight="bold" fill="#0D1B2E">Core HCM award</text>
  <text x="190" y="660" font-size="13.5" fill="#33414F">Oracle Fusion Cloud HCM wins (June 11) — the system-of-record feed this book builds on; Wave 1 agency transitions begin</text>

  <!-- 2027 -->
  <circle cx="150" cy="708" r="10" fill="#D4A017"/>
  <text x="190" y="705" font-size="16" font-weight="bold" fill="#B8860B">2027</text>
  <text x="250" y="705" font-size="16" font-weight="bold" fill="#0D1B2E">Wave transitions</text>
  <text x="190" y="726" font-size="13.5" fill="#33414F">Wave 2 completes in FY 2027; each agency's onboarding runs ~8 months with interconnections live around month 5</text>

  <!-- 2028 -->
  <circle cx="150" cy="768" r="10" fill="#0D1B2E"/>
  <text x="190" y="765" font-size="16" font-weight="bold" fill="#0D1B2E">2028</text>
  <text x="250" y="765" font-size="16" font-weight="bold" fill="#0D1B2E">One system</text>
  <text x="190" y="786" font-size="13.5" fill="#33414F">Government-wide adoption goal (FY 2028); eOPF and EHRI become redundant and are decommissioned</text>

  <!-- caveat box -->
  <rect x="70" y="822" width="1140" height="54" rx="10" fill="#F4F6F9" stroke="#C9D4E0" stroke-width="1"/>
  <text x="640" y="844" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5A5A5A">Program-status caveat: the memo (Dec 10, 2025) and the Core HCM award (Jun 11, 2026) are on the record;</text>
  <text x="640" y="864" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5A5A5A">the 2027–2028 rows are the announced schedule — verify current Federal HR 2.0 status at engagement time.</text>

  <!-- footer -->
  <line x1="70" y1="896" x2="1210" y2="896" stroke="#E3E8EF" stroke-width="1"/>
  <text x="70" y="920" font-size="12.5" fill="#5A5A5A">Vol I Book 04 — OPM HRIT and the Identity &amp; Organizational SSOT &#183; FedRAMP Moderate &#183; Date Code 2026-07-23 06:46 ET</text>
</svg>
