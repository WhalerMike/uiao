<svg viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1100" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="0" y="0" width="1100" height="48" fill="#1F3864"/>
  <text x="550" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Hybrid DNS Resolution Flow — Query Routing Across All Cloud Boundaries</text>
  <text x="550" y="43" text-anchor="middle" font-size="10" fill="#D5E8F0">DNSSEC Validation · Conditional Forwarding · RPZ Threat Blocking · FedRAMP SC-20 / SC-21</text>

  <!-- ── QUERY ORIGIN (left) ── -->
  <rect x="20" y="60" width="160" height="340" rx="8" fill="#EBF3FF" stroke="#1F3864" stroke-width="1.8"/>
  <text x="100" y="79" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3864">Query Origins</text>
  <!-- Clients -->
  <rect x="30" y="86" width="140" height="44" rx="5" fill="#D5E8F0" stroke="#1F3864" stroke-width="1"/>
  <text x="100" y="104" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F3864">On-Prem Client</text>
  <text x="100" y="118" text-anchor="middle" font-size="8" fill="#595959">DNS: 10.0.0.10 (InfoBlox VIP)</text>
  <text x="100" y="126" text-anchor="middle" font-size="7.5" fill="#595959">DHCP-assigned resolver</text>
  <rect x="30" y="138" width="140" height="44" rx="5" fill="#D5E8F0" stroke="#2E75B6" stroke-width="1"/>
  <text x="100" y="156" text-anchor="middle" font-size="9" font-weight="bold" fill="#2E75B6">Azure VM / AKS Pod</text>
  <text x="100" y="170" text-anchor="middle" font-size="8" fill="#595959">DNS: 172.16.0.10 (InfoBlox Azure)</text>
  <text x="100" y="178" text-anchor="middle" font-size="7.5" fill="#595959">VNet DNS server setting</text>
  <rect x="30" y="190" width="140" height="44" rx="5" fill="#FCE4D6" stroke="#C55A11" stroke-width="1"/>
  <text x="100" y="208" text-anchor="middle" font-size="9" font-weight="bold" fill="#C55A11">AWS EC2 / Lambda</text>
  <text x="100" y="222" text-anchor="middle" font-size="8" fill="#595959">DNS: 172.20.0.10 (InfoBlox AWS)</text>
  <text x="100" y="230" text-anchor="middle" font-size="7.5" fill="#595959">Route 53 Resolver rule</text>
  <rect x="30" y="242" width="140" height="44" rx="5" fill="#F5F0FA" stroke="#7030A0" stroke-width="1"/>
  <text x="100" y="260" text-anchor="middle" font-size="9" font-weight="bold" fill="#7030A0">OCI Compute / HRIT Client</text>
  <text x="100" y="274" text-anchor="middle" font-size="8" fill="#595959">DNS: 172.24.0.10 (InfoBlox OCI)</text>
  <text x="100" y="282" text-anchor="middle" font-size="7.5" fill="#595959">VCN DHCP option 6</text>
  <rect x="30" y="294" width="140" height="44" rx="5" fill="#E2EFDA" stroke="#375623" stroke-width="1"/>
  <text x="100" y="312" text-anchor="middle" font-size="9" font-weight="bold" fill="#375623">Remote Worker (VPN)</text>
  <text x="100" y="326" text-anchor="middle" font-size="8" fill="#595959">Split DNS: internal → InfoBlox</text>
  <text x="100" y="334" text-anchor="middle" font-size="7.5" fill="#595959">External → CISA Protective DNS</text>
  <!-- Arrows from clients to resolver -->
  <line x1="180" y1="108" x2="220" y2="240" stroke="#1F3864" stroke-width="1.2" opacity="0.5"/>
  <line x1="180" y1="160" x2="220" y2="240" stroke="#2E75B6" stroke-width="1.2" opacity="0.5"/>
  <line x1="180" y1="212" x2="220" y2="240" stroke="#C55A11" stroke-width="1.2" opacity="0.5"/>
  <line x1="180" y1="264" x2="220" y2="240" stroke="#7030A0" stroke-width="1.2" opacity="0.5"/>
  <line x1="180" y1="316" x2="220" y2="240" stroke="#375623" stroke-width="1.2" opacity="0.5"/>

  <!-- ── RPZ CHECK (step 1) ── -->
  <rect x="220" y="180" width="150" height="120" rx="8" fill="#C00000" opacity="0.9"/>
  <text x="295" y="202" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">① RPZ Check</text>
  <text x="295" y="218" text-anchor="middle" font-size="8.5" fill="#FFFFFF">CISA threat feed</text>
  <text x="295" y="232" text-anchor="middle" font-size="8.5" fill="#FFFFFF">Commercial TI feed</text>
  <text x="295" y="246" text-anchor="middle" font-size="8.5" fill="#FFFFFF">RPZ-QNAME matching</text>
  <text x="295" y="262" text-anchor="middle" font-size="8" fill="#FCE4D6">BLOCK → NXDOMAIN</text>
  <text x="295" y="276" text-anchor="middle" font-size="8" fill="#FCE4D6">SIEM alert generated</text>
  <text x="295" y="290" text-anchor="middle" font-size="7.5" fill="#FCE4D6">logged: AU-2 event</text>
  <!-- RPZ block arrow (down to blocked) -->
  <rect x="232" y="318" width="126" height="28" rx="4" fill="#C00000"/>
  <text x="295" y="337" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">✗ BLOCKED</text>
  <line x1="295" y1="300" x2="295" y2="318" stroke="#C00000" stroke-width="1.5"/>
  <polygon points="291,314 295,318 299,314" fill="#C00000"/>

  <!-- Arrow from RPZ to DNSSEC (pass through) -->
  <line x1="370" y1="240" x2="410" y2="240" stroke="#1F3864" stroke-width="2"/>
  <polygon points="406,236 410,240 406,244" fill="#1F3864"/>
  <text x="390" y="235" text-anchor="middle" font-size="8" fill="#375623">PASS</text>

  <!-- ── DNSSEC VALIDATION (step 2) ── -->
  <rect x="410" y="170" width="155" height="140" rx="8" fill="#1F3864"/>
  <text x="487" y="193" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">② DNSSEC Validate</text>
  <text x="487" y="210" text-anchor="middle" font-size="8.5" fill="#D5E8F0">Check signature (RRSIG)</text>
  <text x="487" y="225" text-anchor="middle" font-size="8.5" fill="#D5E8F0">Verify key (DNSKEY)</text>
  <text x="487" y="240" text-anchor="middle" font-size="8.5" fill="#D5E8F0">Validate DS chain</text>
  <text x="487" y="255" text-anchor="middle" font-size="8.5" fill="#D5E8F0">Check NSEC/NSEC3</text>
  <text x="487" y="272" text-anchor="middle" font-size="8" fill="#FCE4D6">BOGUS → SERVFAIL</text>
  <text x="487" y="287" text-anchor="middle" font-size="8" fill="#FCE4D6">Alert: spoofing attempt</text>
  <text x="487" y="300" text-anchor="middle" font-size="7.5" fill="#D5E8F0">Satisfies SC-20(1)</text>
  <!-- BOGUS arrow down -->
  <line x1="487" y1="310" x2="487" y2="334" stroke="#C00000" stroke-width="1.5"/>
  <polygon points="483,330 487,334 491,330" fill="#C00000"/>
  <rect x="437" y="334" width="100" height="24" rx="4" fill="#C00000"/>
  <text x="487" y="351" text-anchor="middle" font-size="8" fill="#FFFFFF">✗ BOGUS — SERVFAIL</text>

  <!-- Arrow from DNSSEC to Routing Decision -->
  <line x1="565" y1="240" x2="610" y2="240" stroke="#1F3864" stroke-width="2"/>
  <polygon points="606,236 610,240 606,244" fill="#1F3864"/>
  <text x="587" y="235" text-anchor="middle" font-size="8" fill="#375623">SECURE</text>

  <!-- ── ROUTING DECISION (step 3) ── -->
  <!-- Diamond -->
  <polygon points="690,160 770,240 690,320 610,240" fill="#EBF3FF" stroke="#1F3864" stroke-width="2"/>
  <text x="690" y="232" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3864">③ Route</text>
  <text x="690" y="248" text-anchor="middle" font-size="9" fill="#1F3864">Decision</text>
  <text x="690" y="264" text-anchor="middle" font-size="8" fill="#595959">Domain?</text>

  <!-- ── DESTINATION BRANCHES ── -->

  <!-- Branch A: agency.gov → AD DNS -->
  <line x1="690" y1="160" x2="690" y2="80" stroke="#1F3864" stroke-width="1.5"/>
  <line x1="690" y1="80" x2="800" y2="80" stroke="#1F3864" stroke-width="1.5"/>
  <polygon points="796,76 800,80 796,84" fill="#1F3864"/>
  <text x="740" y="72" text-anchor="middle" font-size="8" fill="#1F3864">agency.gov</text>
  <rect x="800" y="58" width="200" height="52" rx="5" fill="#EBF3FF" stroke="#1F3864" stroke-width="1.5"/>
  <text x="900" y="76" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F3864">A) AD DNS (authoritative)</text>
  <text x="900" y="90" text-anchor="middle" font-size="8" fill="#595959">InfoBlox Grid Member → on-prem DCs</text>
  <text x="900" y="102" text-anchor="middle" font-size="7.5" fill="#375623">DNSSEC-signed zone · sub-second response</text>

  <!-- Branch B: privatelink.* → Azure -->
  <line x1="690" y1="160" x2="690" y2="128" stroke="#2E75B6" stroke-width="1.5"/>
  <line x1="690" y1="128" x2="800" y2="128" stroke="#2E75B6" stroke-width="1.5"/>
  <polygon points="796,124 800,128 796,132" fill="#2E75B6"/>
  <text x="740" y="122" text-anchor="middle" font-size="8" fill="#2E75B6">privatelink.*</text>
  <rect x="800" y="110" width="200" height="52" rx="5" fill="#EBF3FF" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="900" y="128" text-anchor="middle" font-size="9" font-weight="bold" fill="#2E75B6">B) Azure Private DNS Zones</text>
  <text x="900" y="142" text-anchor="middle" font-size="8" fill="#595959">Azure DNS Private Resolver (inbound EP)</text>
  <text x="900" y="154" text-anchor="middle" font-size="7.5" fill="#595959">Returns private VNet IP for PE endpoint</text>

  <!-- Branch C: *.compute.internal → AWS -->
  <line x1="770" y1="240" x2="800" y2="240" stroke="#C55A11" stroke-width="1.5"/>
  <polygon points="796,236 800,240 796,244" fill="#C55A11"/>
  <text x="783" y="233" text-anchor="middle" font-size="8" fill="#C55A11">*.compute</text>
  <rect x="800" y="218" width="200" height="52" rx="5" fill="#FFF8F0" stroke="#C55A11" stroke-width="1.5"/>
  <text x="900" y="236" text-anchor="middle" font-size="9" font-weight="bold" fill="#C55A11">C) Route 53 Private Zone</text>
  <text x="900" y="250" text-anchor="middle" font-size="8" fill="#595959">R53 Resolver Inbound Endpoint (AWS)</text>
  <text x="900" y="262" text-anchor="middle" font-size="7.5" fill="#595959">EC2 compute.internal names resolved</text>

  <!-- Branch D: OPM HRIT FQDNs → OCI -->
  <line x1="690" y1="320" x2="690" y2="358" stroke="#7030A0" stroke-width="1.5"/>
  <line x1="690" y1="358" x2="800" y2="358" stroke="#7030A0" stroke-width="1.5"/>
  <polygon points="796,354 800,358 796,362" fill="#7030A0"/>
  <text x="740" y="352" text-anchor="middle" font-size="8" fill="#7030A0">OPM HRIT FQDN</text>
  <rect x="800" y="336" width="200" height="52" rx="5" fill="#F5F0FA" stroke="#7030A0" stroke-width="1.5"/>
  <text x="900" y="354" text-anchor="middle" font-size="9" font-weight="bold" fill="#7030A0">D) OCI VCN DNS Resolver</text>
  <text x="900" y="368" text-anchor="middle" font-size="8" fill="#595959">InfoBlox conditional fwd → OCI path</text>
  <text x="900" y="380" text-anchor="middle" font-size="7.5" fill="#595959">FastConnect tunnel · OPM-issued response</text>

  <!-- Branch E: External → CISA DNS -->
  <line x1="690" y1="320" x2="690" y2="416" stroke="#375623" stroke-width="1.5"/>
  <line x1="690" y1="416" x2="800" y2="416" stroke="#375623" stroke-width="1.5"/>
  <polygon points="796,412 800,416 796,420" fill="#375623"/>
  <text x="740" y="410" text-anchor="middle" font-size="8" fill="#375623">External FQDN</text>
  <rect x="800" y="398" width="200" height="52" rx="5" fill="#E2EFDA" stroke="#375623" stroke-width="1.5"/>
  <text x="900" y="416" text-anchor="middle" font-size="9" font-weight="bold" fill="#375623">E) CISA Protective DNS</text>
  <text x="900" y="430" text-anchor="middle" font-size="8" fill="#595959">InfoBlox fwds to CISA gov resolvers</text>
  <text x="900" y="442" text-anchor="middle" font-size="7.5" fill="#595959">Additional RPZ layer at CISA boundary</text>

  <!-- ── RESPONSE RETURN ── -->
  <!-- All responses converge back to client -->
  <line x1="800" y1="84" x2="770" y2="540" stroke="#1F3864" stroke-width="1" stroke-dasharray="4,2" opacity="0.4"/>
  <line x1="800" y1="136" x2="770" y2="540" stroke="#2E75B6" stroke-width="1" stroke-dasharray="4,2" opacity="0.4"/>
  <line x1="800" y1="244" x2="770" y2="540" stroke="#C55A11" stroke-width="1" stroke-dasharray="4,2" opacity="0.4"/>
  <line x1="800" y1="362" x2="770" y2="540" stroke="#7030A0" stroke-width="1" stroke-dasharray="4,2" opacity="0.4"/>
  <line x1="800" y1="424" x2="770" y2="540" stroke="#375623" stroke-width="1" stroke-dasharray="4,2" opacity="0.4"/>

  <rect x="560" y="510" width="380" height="52" rx="8" fill="#1F3864"/>
  <text x="750" y="530" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">④ Response Returned to Client</text>
  <text x="750" y="546" text-anchor="middle" font-size="9" fill="#D5E8F0">DNSSEC-validated answer · RTT: &lt;5ms intra-cloud, &lt;20ms cross-cloud</text>
  <text x="750" y="558" text-anchor="middle" font-size="8" fill="#D5E8F0">Query logged: InfoBlox → syslog → SIEM (SC-20 / AU-12 evidence)</text>

  <!-- ── AUDIT LOG STRIP ── -->
  <rect x="20" y="430" width="420" height="130" rx="8" fill="#F2F2F2" stroke="#CCCCCC" stroke-width="1"/>
  <text x="230" y="450" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3864">Audit Log Entry (every query — AU-12)</text>
  <rect x="30" y="458" width="400" height="92" rx="4" fill="#1F3864"/>
  <text x="40" y="476" font-size="8" fill="#2E75B6">timestamp=</text><text x="100" y="476" font-size="8" fill="#FFFFFF">2026-06-29T14:32:11.042Z</text>
  <text x="40" y="490" font-size="8" fill="#2E75B6">client_ip=</text><text x="95" y="490" font-size="8" fill="#FFFFFF">10.0.42.87</text>
  <text x="40" y="504" font-size="8" fill="#2E75B6">qname=</text><text x="88" y="504" font-size="8" fill="#FFFFFF">hrit-api.opm.gov.internal</text>
  <text x="40" y="518" font-size="8" fill="#2E75B6">qtype=</text><text x="88" y="518" font-size="8" fill="#FFFFFF">A</text>
  <text x="40" y="532" font-size="8" fill="#2E75B6">path=</text><text x="82" y="532" font-size="8" fill="#FFFFFF">InfoBlox-OnPrem → conditional-fwd → OCI-Landing-VCN</text>
  <text x="40" y="546" font-size="8" fill="#2E75B6">response=</text><text x="97" y="546" font-size="8" fill="#FFFFFF">172.24.100.45   DNSSEC=SECURE   RTT=18ms</text>

  <!-- ── LEGEND ── -->
  <rect x="20" y="580" width="1060" height="90" rx="6" fill="#F2F2F2" stroke="#CCCCCC" stroke-width="1"/>
  <text x="550" y="598" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3864">Query Routing Legend &amp; FedRAMP Control Mapping</text>
  <rect x="36" y="608" width="12" height="12" fill="#C00000"/>
  <text x="54" y="619" font-size="8.5" fill="#1F3864">RPZ BLOCK (SC-21)</text>
  <rect x="180" y="608" width="12" height="12" fill="#1F3864"/>
  <text x="198" y="619" font-size="8.5" fill="#1F3864">DNSSEC BOGUS (SC-20)</text>
  <rect x="360" y="608" width="12" height="12" fill="#EBF3FF" stroke="#1F3864" stroke-width="1"/>
  <text x="378" y="619" font-size="8.5" fill="#1F3864">agency.gov path (A)</text>
  <rect x="500" y="608" width="12" height="12" fill="#EBF3FF" stroke="#2E75B6" stroke-width="1"/>
  <text x="518" y="619" font-size="8.5" fill="#2E75B6">Azure Private Link path (B)</text>
  <rect x="670" y="608" width="12" height="12" fill="#FFF8F0" stroke="#C55A11" stroke-width="1"/>
  <text x="688" y="619" font-size="8.5" fill="#C55A11">AWS Route 53 path (C)</text>
  <rect x="820" y="608" width="12" height="12" fill="#F5F0FA" stroke="#7030A0" stroke-width="1"/>
  <text x="838" y="619" font-size="8.5" fill="#7030A0">OPM HRIT / OCI path (D)</text>
  <rect x="990" y="608" width="12" height="12" fill="#E2EFDA" stroke="#375623" stroke-width="1"/>
  <text x="1008" y="619" font-size="8.5" fill="#375623">External / CISA (E)</text>
  <text x="36" y="641" font-size="8.5" fill="#595959">All queries: InfoBlox recursive resolver → RPZ check → DNSSEC validation → conditional forwarding → response</text>
  <text x="36" y="657" font-size="8.5" fill="#595959">Every query event logged: timestamp · client IP · QNAME · QTYPE · resolution path · DNSSEC status · RTT → satisfies AU-2(a), AU-12, SC-20, SC-21, SA-9</text>

  <!-- Bottom strip -->
  <rect x="0" y="700" width="1100" height="20" fill="#1F3864"/>
  <text x="550" y="714" text-anchor="middle" font-size="8" fill="#FFFFFF">UNCLASSIFIED // FOUO — Hybrid DNS Resolution Flow — InfoBlox DDI — FedRAMP Moderate</text>
</svg>
