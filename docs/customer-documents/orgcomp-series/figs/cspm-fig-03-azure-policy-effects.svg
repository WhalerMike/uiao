<svg viewBox="0 0 1060 560" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;">
<rect width="1060" height="560" fill="#FFFFFF"/>

<!-- Title -->
<rect x="0" y="0" width="1060" height="40" fill="#1F3864"/>
<text x="530" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Azure Policy Effect Types — Decision Tree and Federal Use Cases</text>
<text x="530" y="32" text-anchor="middle" font-size="9" fill="#BDD7EE">Resource Create/Modify Event → Policy Assignment Evaluation → Effect applied · FedRAMP Moderate enforcement strategy</text>

<!-- Top node: Resource event -->
<rect x="385" y="50" width="290" height="44" rx="8" fill="#1F3864"/>
<text x="530" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Resource Create or Modify Event</text>
<text x="530" y="84" text-anchor="middle" font-size="9" fill="#BDD7EE">ARM API receives PUT / PATCH request</text>

<!-- Evaluation node -->
<rect x="410" y="114" width="240" height="36" rx="8" fill="#1F7391"/>
<text x="530" y="129" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Azure Policy Assignment Evaluation</text>
<text x="530" y="143" text-anchor="middle" font-size="8" fill="#C5E8F0">Scope: Management Group Agency-MG · All subscriptions</text>

<!-- Arrow top to eval -->
<line x1="530" y1="94" x2="530" y2="114" stroke="#595959" stroke-width="2" marker-end="url(#darr)"/>

<!-- Six branches from eval node - spread across 1060 -->
<!-- Branch positions: x = 80, 240, 400, 560, 720, 880 (center of each branch) -->
<line x1="530" y1="150" x2="80" y2="180" stroke="#595959" stroke-width="1.5"/>
<line x1="530" y1="150" x2="242" y2="180" stroke="#595959" stroke-width="1.5"/>
<line x1="530" y1="150" x2="403" y2="180" stroke="#595959" stroke-width="1.5"/>
<line x1="530" y1="150" x2="590" y2="180" stroke="#595959" stroke-width="1.5"/>
<line x1="530" y1="150" x2="760" y2="180" stroke="#595959" stroke-width="1.5"/>
<line x1="530" y1="150" x2="940" y2="180" stroke="#595959" stroke-width="1.5"/>

<!-- DISABLED -->
<rect x="22" y="180" width="116" height="130" rx="6" fill="#595959"/>
<text x="80" y="198" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">DISABLED</text>
<line x1="80" y1="202" x2="80" y2="208" stroke="#FFFFFF" stroke-width="1"/>
<text x="80" y="220" text-anchor="middle" font-size="8" fill="#E0E0E0">Policy is inactive</text>
<text x="80" y="233" text-anchor="middle" font-size="8" fill="#E0E0E0">No evaluation</text>
<text x="80" y="246" text-anchor="middle" font-size="8" fill="#E0E0E0">Resource created</text>
<text x="80" y="259" text-anchor="middle" font-size="8" fill="#E0E0E0">normally</text>
<rect x="30" y="270" width="100" height="32" rx="4" fill="#FFFFFF" opacity="0.15"/>
<text x="80" y="281" text-anchor="middle" font-size="7.5" fill="#C0C0C0">Use: Policy in</text>
<text x="80" y="293" text-anchor="middle" font-size="7.5" fill="#C0C0C0">development / test</text>
<text x="80" y="307" text-anchor="middle" font-size="8" font-weight="bold" fill="#A0A0A0">Strength: None</text>

<!-- AUDIT -->
<rect x="183" y="180" width="118" height="130" rx="6" fill="#2E75B6"/>
<text x="242" y="198" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">AUDIT</text>
<text x="242" y="220" text-anchor="middle" font-size="8" fill="#D9EEF9">Resource created</text>
<text x="242" y="233" text-anchor="middle" font-size="8" fill="#D9EEF9">Non-compliance</text>
<text x="242" y="246" text-anchor="middle" font-size="8" fill="#D9EEF9">logged in Activity</text>
<text x="242" y="259" text-anchor="middle" font-size="8" fill="#D9EEF9">Log + Defender rec.</text>
<rect x="191" y="270" width="102" height="32" rx="4" fill="#FFFFFF" opacity="0.15"/>
<text x="242" y="281" text-anchor="middle" font-size="7.5" fill="#BDD7EE">Use: New policy</text>
<text x="242" y="293" text-anchor="middle" font-size="7.5" fill="#BDD7EE">rollout; measure</text>
<text x="242" y="307" text-anchor="middle" font-size="8" font-weight="bold" fill="#A0CAFF">Strength: Log Only</text>

<!-- DENY -->
<rect x="344" y="180" width="118" height="130" rx="6" fill="#C00000"/>
<text x="403" y="198" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">DENY</text>
<text x="403" y="220" text-anchor="middle" font-size="8" fill="#FFD0D0">Resource creation</text>
<text x="403" y="233" text-anchor="middle" font-size="8" fill="#FFD0D0">BLOCKED by ARM</text>
<text x="403" y="246" text-anchor="middle" font-size="8" fill="#FFD0D0">Error returned to</text>
<text x="403" y="259" text-anchor="middle" font-size="8" fill="#FFD0D0">requester</text>
<rect x="352" y="270" width="102" height="32" rx="4" fill="#FFFFFF" opacity="0.15"/>
<text x="403" y="281" text-anchor="middle" font-size="7.5" fill="#FFD0D0">Use: No-exception</text>
<text x="403" y="293" text-anchor="middle" font-size="7.5" fill="#FFD0D0">rules: public storage</text>
<text x="403" y="307" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFD0D0">Strength: Block</text>

<!-- AUDITIFNOTEXISTS -->
<rect x="528" y="180" width="124" height="130" rx="6" fill="#C55A11"/>
<text x="590" y="198" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">AUDIT IF NOT</text>
<text x="590" y="210" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">EXISTS</text>
<text x="590" y="229" text-anchor="middle" font-size="8" fill="#FCE4C8">Resource created</text>
<text x="590" y="242" text-anchor="middle" font-size="8" fill="#FCE4C8">Check for related</text>
<text x="590" y="255" text-anchor="middle" font-size="8" fill="#FCE4C8">resource absence</text>
<text x="590" y="268" text-anchor="middle" font-size="8" fill="#FCE4C8">→ log if missing</text>
<rect x="536" y="276" width="108" height="26" rx="4" fill="#FFFFFF" opacity="0.15"/>
<text x="590" y="288" text-anchor="middle" font-size="7.5" fill="#FCE4C8">Use: Require diag.</text>
<text x="590" y="300" text-anchor="middle" font-size="7.5" fill="#FCE4C8">log, NSG on subnet</text>
<text x="590" y="307" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFD0A0">Strength: Log+Alert</text>

<!-- DEPLOYIFNOTEXISTS -->
<rect x="698" y="180" width="124" height="130" rx="6" fill="#375623"/>
<text x="760" y="198" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">DEPLOY IF NOT</text>
<text x="760" y="210" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">EXISTS</text>
<text x="760" y="229" text-anchor="middle" font-size="8" fill="#D1E8C4">Resource created</text>
<text x="760" y="242" text-anchor="middle" font-size="8" fill="#D1E8C4">If related resource</text>
<text x="760" y="255" text-anchor="middle" font-size="8" fill="#D1E8C4">absent → auto-deploy</text>
<text x="760" y="268" text-anchor="middle" font-size="8" fill="#D1E8C4">via managed identity</text>
<rect x="706" y="276" width="108" height="26" rx="4" fill="#FFFFFF" opacity="0.15"/>
<text x="760" y="288" text-anchor="middle" font-size="7.5" fill="#D1E8C4">Use: Auto-install AMA</text>
<text x="760" y="300" text-anchor="middle" font-size="7.5" fill="#D1E8C4">enable Defender plan</text>
<text x="760" y="307" text-anchor="middle" font-size="8" font-weight="bold" fill="#B8DCA8">Strength: Auto-Rem.</text>

<!-- MODIFY -->
<rect x="878" y="180" width="124" height="130" rx="6" fill="#1F7391"/>
<text x="940" y="198" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">MODIFY</text>
<text x="940" y="220" text-anchor="middle" font-size="8" fill="#C5E8F0">Intercepts ARM write</text>
<text x="940" y="233" text-anchor="middle" font-size="8" fill="#C5E8F0">Adds/replaces prop</text>
<text x="940" y="246" text-anchor="middle" font-size="8" fill="#C5E8F0">on the resource itself</text>
<text x="940" y="259" text-anchor="middle" font-size="8" fill="#C5E8F0">before write completes</text>
<rect x="886" y="270" width="108" height="32" rx="4" fill="#FFFFFF" opacity="0.15"/>
<text x="940" y="281" text-anchor="middle" font-size="7.5" fill="#C5E8F0">Use: Enforce tags,</text>
<text x="940" y="293" text-anchor="middle" font-size="7.5" fill="#C5E8F0">TLS min version</text>
<text x="940" y="307" text-anchor="middle" font-size="8" font-weight="bold" fill="#A0D8E8">Strength: Modify-R.</text>

<!-- Federal Use Case Examples -->
<rect x="10" y="325" width="1040" height="195" rx="6" fill="#F2F2F2" stroke="#595959" stroke-width="1"/>
<text x="530" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F3864">Federal Context: Agency GCC Moderate Policy Assignments by Effect Type</text>

<!-- 6 use case columns -->
<!-- Disabled column -->
<rect x="18" y="352" width="155" height="158" rx="5" fill="#FFFFFF" stroke="#595959" stroke-width="0.5"/>
<rect x="18" y="352" width="155" height="22" rx="5" fill="#595959"/>
<text x="95" y="367" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">DISABLED Examples</text>
<text x="26" y="386" font-size="7.5" fill="#595959">· Proposed new policy under</text>
<text x="26" y="398" font-size="7.5" fill="#595959">  review by ISSO</text>
<text x="26" y="412" font-size="7.5" fill="#595959">· Policy in dev environment</text>
<text x="26" y="424" font-size="7.5" fill="#595959">  test phase</text>
<text x="26" y="438" font-size="7.5" fill="#595959">· Time-boxed waiver period</text>
<text x="26" y="452" font-size="7.5" fill="#595959">  (set expiry date)</text>
<text x="26" y="468" font-size="7.5" fill="#595959">· Legacy system migration</text>
<text x="26" y="500" font-size="7.5" font-weight="bold" fill="#595959">Controls: None active</text>

<!-- Audit column -->
<rect x="181" y="352" width="155" height="158" rx="5" fill="#FFFFFF" stroke="#2E75B6" stroke-width="0.5"/>
<rect x="181" y="352" width="155" height="22" rx="5" fill="#2E75B6"/>
<text x="258" y="367" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">AUDIT Examples</text>
<text x="189" y="386" font-size="7.5" fill="#595959">· New tag requirement during</text>
<text x="189" y="398" font-size="7.5" fill="#595959">  30-day rollout window</text>
<text x="189" y="412" font-size="7.5" fill="#595959">· Log Analytics extension</text>
<text x="189" y="424" font-size="7.5" fill="#595959">  during AMA migration</text>
<text x="189" y="438" font-size="7.5" fill="#595959">· Track non-GovCloud regions</text>
<text x="189" y="452" font-size="7.5" fill="#595959">  before enforcing Deny</text>
<text x="189" y="468" font-size="7.5" fill="#595959">· Measure impact before Deny</text>
<text x="189" y="500" font-size="7.5" font-weight="bold" fill="#2E75B6">Controls: CM-2 (measure)</text>

<!-- Deny column -->
<rect x="344" y="352" width="155" height="158" rx="5" fill="#FFFFFF" stroke="#C00000" stroke-width="0.5"/>
<rect x="344" y="352" width="155" height="22" rx="5" fill="#C00000"/>
<text x="421" y="367" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">DENY Examples</text>
<text x="352" y="386" font-size="7.5" fill="#595959">· Block public storage accts</text>
<text x="352" y="398" font-size="7.5" fill="#595959">· Require encryption at host</text>
<text x="352" y="412" font-size="7.5" fill="#595959">· Block non-GovCloud regions</text>
<text x="352" y="424" font-size="7.5" fill="#595959">· Deny VMs without tags</text>
<text x="352" y="438" font-size="7.5" fill="#595959">· Block HTTP-only endpoints</text>
<text x="352" y="452" font-size="7.5" fill="#595959">· No public IP on non-DMZ VMs</text>
<text x="352" y="468" font-size="7.5" fill="#595959">· Require approved VM SKUs</text>
<text x="352" y="500" font-size="7.5" font-weight="bold" fill="#C00000">Controls: CM-2, CM-6, SC-7</text>

<!-- AuditIfNotExists column -->
<rect x="507" y="352" width="155" height="158" rx="5" fill="#FFFFFF" stroke="#C55A11" stroke-width="0.5"/>
<rect x="507" y="352" width="155" height="22" rx="5" fill="#C55A11"/>
<text x="584" y="367" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">AUDITIFNOTEXISTS</text>
<text x="515" y="386" font-size="7.5" fill="#595959">· Require diagnostic settings</text>
<text x="515" y="398" font-size="7.5" fill="#595959">  on Key Vaults, SQL servers</text>
<text x="515" y="412" font-size="7.5" fill="#595959">· Require NSG on subnet</text>
<text x="515" y="424" font-size="7.5" fill="#595959">· MDE installed on VMs</text>
<text x="515" y="438" font-size="7.5" fill="#595959">· DDoS protection enabled</text>
<text x="515" y="452" font-size="7.5" fill="#595959">· Defender plan on subscription</text>
<text x="515" y="468" font-size="7.5" fill="#595959">· Network watcher enabled</text>
<text x="515" y="500" font-size="7.5" font-weight="bold" fill="#C55A11">Controls: AU-2, CA-7, RA-5</text>

<!-- DeployIfNotExists column -->
<rect x="670" y="352" width="155" height="158" rx="5" fill="#FFFFFF" stroke="#375623" stroke-width="0.5"/>
<rect x="670" y="352" width="155" height="22" rx="5" fill="#375623"/>
<text x="747" y="367" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">DEPLOYIFNOTEXISTS</text>
<text x="678" y="386" font-size="7.5" fill="#595959">· Auto-deploy AMA to VMs</text>
<text x="678" y="398" font-size="7.5" fill="#595959">· Auto-enable Defender plans</text>
<text x="678" y="412" font-size="7.5" fill="#595959">· Auto-create diagnostic setting</text>
<text x="678" y="424" font-size="7.5" fill="#595959">· Deploy log profile for subs</text>
<text x="678" y="438" font-size="7.5" fill="#595959">· Auto-enable SQL auditing</text>
<text x="678" y="452" font-size="7.5" fill="#595959">· Deploy private endpoint</text>
<text x="678" y="468" font-size="7.5" fill="#595959">· Enable HTTPS on storage</text>
<text x="678" y="500" font-size="7.5" font-weight="bold" fill="#375623">Controls: AU-12, CM-6, SI-2</text>

<!-- Modify column -->
<rect x="833" y="352" width="207" height="158" rx="5" fill="#FFFFFF" stroke="#1F7391" stroke-width="0.5"/>
<rect x="833" y="352" width="207" height="22" rx="5" fill="#1F7391"/>
<text x="936" y="367" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">MODIFY Examples</text>
<text x="841" y="386" font-size="7.5" fill="#595959">· Set system/owner/env/class tags</text>
<text x="841" y="398" font-size="7.5" fill="#595959">  on all resource creates</text>
<text x="841" y="412" font-size="7.5" fill="#595959">· Enforce TLS 1.2 minimum on</text>
<text x="841" y="424" font-size="7.5" fill="#595959">  storage accounts at write time</text>
<text x="841" y="438" font-size="7.5" fill="#595959">· Set HTTPS-only on App Service</text>
<text x="841" y="452" font-size="7.5" fill="#595959">· Add retention policy to diag logs</text>
<text x="841" y="468" font-size="7.5" fill="#595959">· Set soft-delete on Key Vault</text>
<text x="841" y="500" font-size="7.5" font-weight="bold" fill="#1F7391">Controls: CM-6, CM-2, CM-8</text>

<defs>
  <marker id="darr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#595959"/>
  </marker>
</defs>
</svg>
