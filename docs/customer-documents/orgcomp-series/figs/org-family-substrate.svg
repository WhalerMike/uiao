<svg viewBox="0 0 1600 900" width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="800" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#0D1B2E">The Org Family</text>
  <text x="800" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5A6B7B">One governance substrate &#183; three operational expressions &#183; adoptable together or entirely independently</text>

  <!-- OrgPath -->
  <rect x="120" y="190" width="400" height="270" rx="12" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="3"/>
  <path d="M132,190 h376 a12,12 0 0 1 12,12 v66 h-400 v-66 a12,12 0 0 1 12,-12 z" fill="#1E8C8C"/>
  <text x="320" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#D9F0EE">GOVERNANCE</text>
  <text x="320" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">OrgPath</text>
  <text x="320" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243248">Canon as the source of truth &#8212;</text>
  <text x="320" y="328" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243248">schemas, registries, and policies where</text>
  <text x="320" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243248">every claim traces to an anchored origin.</text>
  <text x="320" y="398" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5A6B7B">No backfilling. No orphan claims.</text>
  <text x="320" y="424" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5A6B7B">Addressing: OrgTree &#183; OrgPath &#183; LocPath</text>

  <!-- OrgComp -->
  <rect x="600" y="190" width="400" height="270" rx="12" fill="#FFFFFF" stroke="#B27210" stroke-width="3"/>
  <path d="M612,190 h376 a12,12 0 0 1 12,12 v66 h-400 v-66 a12,12 0 0 1 12,-12 z" fill="#B27210"/>
  <text x="800" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#F6E3C5">COMPLIANCE</text>
  <text x="800" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">OrgComp</text>
  <text x="800" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243248">Federal Organizational Compliance &#8212;</text>
  <text x="800" y="328" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243248">ten volumes, 58 books, architecture to</text>
  <text x="800" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243248">authorization under FedRAMP Moderate.</text>
  <text x="800" y="398" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5A6B7B">Every control closure generated from the</text>
  <text x="800" y="424" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5A6B7B">compliance spine &#8212; never hand-edited.</text>

  <!-- OrgMod -->
  <rect x="1080" y="190" width="400" height="270" rx="12" fill="#FFFFFF" stroke="#4A6A8C" stroke-width="3"/>
  <path d="M1092,190 h376 a12,12 0 0 1 12,12 v66 h-400 v-66 a12,12 0 0 1 12,-12 z" fill="#4A6A8C"/>
  <text x="1280" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#D6E0EA">MODERNIZATION</text>
  <text x="1280" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">OrgMod</text>
  <text x="1280" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243248">Organizational Modernization &#8212;</text>
  <text x="1280" y="328" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243248">migration without rip-and-replace across</text>
  <text x="1280" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243248">directory, device, PKI, RADIUS, and DDI.</text>
  <text x="1280" y="398" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5A6B7B">AD &#8594; Entra ID is a leading path,</text>
  <text x="1280" y="424" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5A6B7B">not the only journey.</text>

  <!-- Connectors down to substrate -->
  <line x1="320" y1="460" x2="320" y2="560" stroke="#6B7A8D" stroke-width="3"/>
  <line x1="1280" y1="460" x2="1280" y2="560" stroke="#6B7A8D" stroke-width="3"/>
  <line x1="800" y1="530" x2="800" y2="560" stroke="#6B7A8D" stroke-width="3"/>

  <!-- OrgComp's contract seam -->
  <rect x="620" y="472" width="360" height="58" rx="8" fill="#F4F7FA" stroke="#1A9E8F" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="800" y="496" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#12766B">Evidence &amp; Authorization Contract</text>
  <text x="800" y="518" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5A6B7B">open seam &#8212; any conformant engine can satisfy it</text>

  <!-- Substrate band -->
  <rect x="120" y="560" width="1360" height="130" rx="12" fill="#0D1B2E"/>
  <text x="800" y="614" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">One Governance Substrate</text>
  <text x="800" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#A9C0DC">identity &#183; addressing &#183; evidence &#183; policy-bearing control planes &#8212; every claim traces to an anchored origin</text>

  <!-- Independence note -->
  <rect x="120" y="740" width="1360" height="70" rx="8" fill="#F4F7FA" stroke="#DFE5EC" stroke-width="1.5"/>
  <text x="800" y="770" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F">Adopt together, or each on its own.</text>
  <text x="800" y="796" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A6B7B">The expressions share one substrate but hold no hard dependency on each other &#8212; OrgComp stands alone on its open contract; OrgPath and OrgMod each deliver value independently.</text>
</svg>
