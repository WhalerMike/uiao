<svg viewBox="0 0 1600 900" width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="800" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#0D1B2E">The Org Family</text>
  <text x="800" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5A6B7B">One governance substrate &#183; four operational expressions &#183; adoptable together or entirely independently</text>

  <!-- OrgPath -->
  <rect x="120" y="190" width="310" height="270" rx="12" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="3"/>
  <path d="M132,190 h286 a12,12 0 0 1 12,12 v66 h-310 v-66 a12,12 0 0 1 12,-12 z" fill="#1E8C8C"/>
  <text x="275" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#D9F0EE">GOVERNANCE</text>
  <text x="275" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">OrgPath</text>
  <text x="275" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">Canon as the source of truth &#8212;</text>
  <text x="275" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">schemas, registries, and policies</text>
  <text x="275" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">where every claim traces to an</text>
  <text x="275" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">anchored origin.</text>
  <text x="275" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5A6B7B">No backfilling. No orphan claims.</text>
  <text x="275" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5A6B7B">OrgTree &#183; OrgPath &#183; LocPath</text>

  <!-- OrgComp -->
  <rect x="470" y="190" width="310" height="270" rx="12" fill="#FFFFFF" stroke="#B27210" stroke-width="3"/>
  <path d="M482,190 h286 a12,12 0 0 1 12,12 v66 h-310 v-66 a12,12 0 0 1 12,-12 z" fill="#B27210"/>
  <text x="625" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#F6E3C5">COMPLIANCE</text>
  <text x="625" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">OrgComp</text>
  <text x="625" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">Federal Organizational Compliance</text>
  <text x="625" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">&#8212; eleven volumes, 60 books,</text>
  <text x="625" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">architecture to authorization</text>
  <text x="625" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">under FedRAMP Moderate.</text>
  <text x="625" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5A6B7B">Every control closure generated</text>
  <text x="625" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5A6B7B">from the spine, never hand-edited.</text>

  <!-- OrgMod -->
  <rect x="820" y="190" width="310" height="270" rx="12" fill="#FFFFFF" stroke="#4A6A8C" stroke-width="3"/>
  <path d="M832,190 h286 a12,12 0 0 1 12,12 v66 h-310 v-66 a12,12 0 0 1 12,-12 z" fill="#4A6A8C"/>
  <text x="975" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#D6E0EA">MODERNIZATION</text>
  <text x="975" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">OrgMod</text>
  <text x="975" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">Organizational Modernization &#8212;</text>
  <text x="975" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">migration without rip-and-replace</text>
  <text x="975" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">across directory, device, PKI,</text>
  <text x="975" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">RADIUS, and DDI.</text>
  <text x="975" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5A6B7B">AD &#8594; Entra ID is a leading path,</text>
  <text x="975" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5A6B7B">not the only journey.</text>

  <!-- OrgLink -->
  <rect x="1170" y="190" width="310" height="270" rx="12" fill="#FFFFFF" stroke="#1E3A66" stroke-width="3"/>
  <path d="M1182,190 h286 a12,12 0 0 1 12,12 v66 h-310 v-66 a12,12 0 0 1 12,-12 z" fill="#1E3A66"/>
  <text x="1325" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#C8D6EA">INTERCONNECTION</text>
  <text x="1325" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">OrgLink</text>
  <text x="1325" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">External Interconnection &#8212; every</text>
  <text x="1325" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">agreement, flow, and authority</text>
  <text x="1325" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">stance with an outside party,</text>
  <text x="1325" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243248">governed as a Link.</text>
  <text x="1325" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5A6B7B">ISA &#183; MOU &#183; CMA &#183; BAA &#183; DUA &#8212;</text>
  <text x="1325" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5A6B7B">metadata, never payload data.</text>

  <!-- Connectors down to substrate -->
  <line x1="275" y1="460" x2="275" y2="560" stroke="#6B7A8D" stroke-width="3"/>
  <line x1="975" y1="460" x2="975" y2="560" stroke="#6B7A8D" stroke-width="3"/>
  <line x1="1325" y1="460" x2="1325" y2="560" stroke="#6B7A8D" stroke-width="3"/>
  <line x1="625" y1="460" x2="625" y2="472" stroke="#6B7A8D" stroke-width="3"/>
  <line x1="625" y1="530" x2="625" y2="560" stroke="#6B7A8D" stroke-width="3"/>

  <!-- OrgComp's contract seam -->
  <rect x="445" y="472" width="360" height="58" rx="8" fill="#F4F7FA" stroke="#1A9E8F" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="625" y="496" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#12766B">Evidence &amp; Authorization Contract</text>
  <text x="625" y="518" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5A6B7B">open seam &#8212; any conformant engine can satisfy it</text>

  <!-- Substrate band -->
  <rect x="120" y="560" width="1360" height="130" rx="12" fill="#0D1B2E"/>
  <text x="800" y="614" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">One Governance Substrate</text>
  <text x="800" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#A9C0DC">identity &#183; addressing &#183; evidence &#183; policy-bearing control planes &#8212; every claim traces to an anchored origin</text>

  <!-- Independence note -->
  <rect x="120" y="740" width="1360" height="70" rx="8" fill="#F4F7FA" stroke="#DFE5EC" stroke-width="1.5"/>
  <text x="800" y="770" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F">Adopt together, or each on its own.</text>
  <text x="800" y="796" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5A6B7B">The expressions share one substrate but hold no hard dependency on each other &#8212; OrgComp stands alone on its open contract; OrgPath, OrgMod, and OrgLink each deliver value independently.</text>
</svg>
