<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="70" y="48" font-size="13" font-weight="bold" letter-spacing="4" fill="#1E8C8C">WHERE AUDIT FINDINGS GO TO DIE</text>
  <text x="70" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E">Deprovisioning is an HR event: the six-step leaver sequence</text>

  <!-- row 1 -->
  <rect x="70" y="118" width="360" height="140" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
  <circle cx="106" cy="152" r="16" fill="#0D1B2E"/><text x="106" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="132" y="158" font-size="15" font-weight="bold" fill="#0D1B2E">Disable the account</text>
  <text x="90" y="200" font-size="12.5" fill="#5A6B7C">the sign-in gate closes first</text>

  <rect x="460" y="118" width="360" height="140" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
  <circle cx="496" cy="152" r="16" fill="#1E8C8C"/><text x="496" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="522" y="158" font-size="15" font-weight="bold" fill="#0D1B2E">Revoke sessions + refresh tokens</text>
  <text x="480" y="200" font-size="12.5" fill="#5A6B7C">takes effect in token-lifetime minutes,</text>
  <text x="480" y="218" font-size="12.5" fill="#5A6B7C">not at next sign-in</text>

  <rect x="850" y="118" width="360" height="140" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
  <circle cx="886" cy="152" r="16" fill="#D4A017"/><text x="886" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="912" y="158" font-size="15" font-weight="bold" fill="#0D1B2E">Verify</text>
  <text x="870" y="200" font-size="12.5" fill="#5A6B7C">read back the revocation state — an</text>
  <text x="870" y="218" font-size="12.5" fill="#5A6B7C">unconfirmed step didn't happen, as far</text>
  <text x="870" y="236" font-size="12.5" fill="#5A6B7C">as evidence is concerned</text>

  <!-- row 2 -->
  <rect x="70" y="278" width="360" height="140" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
  <circle cx="106" cy="312" r="16" fill="#C0392B"/><text x="106" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="132" y="318" font-size="15" font-weight="bold" fill="#0D1B2E">Remove memberships + packages</text>
  <text x="90" y="360" font-size="12.5" fill="#5A6B7C">entitlements end even where an</text>
  <text x="90" y="378" font-size="12.5" fill="#5A6B7C">application caches identity</text>

  <rect x="460" y="278" width="360" height="140" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
  <circle cx="496" cy="312" r="16" fill="#0D1B2E"/><text x="496" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="522" y="318" font-size="15" font-weight="bold" fill="#0D1B2E">Revoke credentials</text>
  <text x="480" y="360" font-size="12.5" fill="#5A6B7C">certificates via Book 03; the device's</text>
  <text x="480" y="378" font-size="12.5" fill="#5A6B7C">port admission via Book 02</text>

  <rect x="850" y="278" width="360" height="140" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
  <circle cx="886" cy="312" r="16" fill="#1E8C8C"/><text x="886" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">6</text>
  <text x="912" y="318" font-size="15" font-weight="bold" fill="#0D1B2E">Disposition data</text>
  <text x="870" y="360" font-size="12.5" fill="#5A6B7C">mailbox, file ownership, retention and</text>
  <text x="870" y="378" font-size="12.5" fill="#5A6B7C">litigation holds — per policy, not per memory</text>

  <!-- evidence callout -->
  <rect x="70" y="442" width="1140" height="92" rx="10" fill="#E8F4F1" stroke="#1E8C8C" stroke-width="1"/>
  <text x="94" y="472" font-size="14.5" fill="#33414F"><tspan font-weight="bold" fill="#1E8C8C">Each step emits a timestamped evidence record.</tspan> The distance between the HR effective date and the last revocation</text>
  <text x="94" y="494" font-size="14.5" fill="#33414F">timestamp becomes a measured, reportable ConMon metric instead of an unknowable. Emergency terminations take a</text>
  <text x="94" y="516" font-size="14.5" fill="#33414F">defined manual entry into the SAME sequence.</text>

  <!-- contrast callout -->
  <rect x="70" y="554" width="1140" height="82" rx="10" fill="#EAF1FB" stroke="#C9D4E0" stroke-width="1"/>
  <text x="94" y="586" font-size="14.5" font-weight="bold" fill="#0D1B2E">The network cannot see a termination. The SIEM sees absence — indistinguishable from leave. The review is up to</text>
  <text x="94" y="608" font-size="14.5" font-weight="bold" fill="#0D1B2E">90 days late. Only one system records the separation as a fact with a date.</text>

  <line x1="70" y1="668" x2="1210" y2="668" stroke="#E3E8EF" stroke-width="1"/>
  <text x="70" y="694" font-size="12" fill="#5A5A5A">Vol I Book 04 — OPM HRIT and the Identity &amp; Organizational SSOT &#183; FedRAMP Moderate &#183; Date Code 2026-07-24 10:08 ET</text>
</svg>
