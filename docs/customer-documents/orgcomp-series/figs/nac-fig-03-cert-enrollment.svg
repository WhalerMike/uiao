<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="mNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0D1B2E"/></marker>
    <marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1E8C8C"/></marker>
    <marker id="mGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5A5A5A"/></marker>
  </defs>

  <text x="640" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#0D1B2E">Certificate Enrollment — Intune SCEP to Machine Certificate</text>
  <text x="640" y="70" text-anchor="middle" font-size="17" fill="#6B7A8D">Device identity certificate provisioned at enrollment — the private key never leaves the TPM</text>

  <!-- Participant headers -->
  <rect x="50" y="100" width="190" height="60" rx="8" fill="#0D1B2E"/>
  <text x="145" y="126" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Device</text>
  <text x="145" y="148" text-anchor="middle" font-size="14" fill="#EAF1FB">supplicant</text>

  <rect x="300" y="100" width="190" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="395" y="136" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Intune</text>

  <rect x="550" y="100" width="190" height="60" rx="8" fill="#1E3A66"/>
  <text x="645" y="126" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">SCEP Connector</text>
  <text x="645" y="148" text-anchor="middle" font-size="14" fill="#EAF1FB">NDES</text>

  <rect x="800" y="100" width="190" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="895" y="126" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Certificate</text>
  <text x="895" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Authority</text>

  <rect x="1050" y="100" width="190" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1145" y="136" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Key Vault</text>

  <!-- Lifelines -->
  <line x1="145" y1="160" x2="145" y2="672" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="395" y1="160" x2="395" y2="672" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="645" y1="160" x2="645" y2="672" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="895" y1="160" x2="895" y2="672" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="1145" y1="160" x2="1145" y2="672" stroke="#6B7A8D" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- 1 Device -> Intune -->
  <line x1="145" y1="205" x2="389" y2="205" stroke="#0D1B2E" stroke-width="2" marker-end="url(#mNavy)"/>
  <text x="270" y="196" text-anchor="middle" font-size="17" fill="#33414F">1. Enroll via Autopilot / MDM</text>

  <!-- 2 Intune -> Device -->
  <line x1="395" y1="253" x2="151" y2="253" stroke="#0D1B2E" stroke-width="2" marker-end="url(#mNavy)"/>
  <text x="270" y="244" text-anchor="middle" font-size="17" fill="#33414F">2. Push SCEP certificate profile</text>

  <!-- 3 self note -->
  <rect x="55" y="284" width="400" height="36" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="255" y="307" text-anchor="middle" font-size="16" fill="#33414F">3. Generate key pair in TPM — RSA-2048 / ECDSA-P256</text>

  <!-- 4 Device -> NDES -->
  <line x1="145" y1="360" x2="639" y2="360" stroke="#0D1B2E" stroke-width="2" marker-end="url(#mNavy)"/>
  <text x="392" y="351" text-anchor="middle" font-size="17" fill="#33414F">4. SCEP request + Intune enrollment token</text>

  <!-- 5a NDES -> Intune -->
  <line x1="645" y1="408" x2="401" y2="408" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#mGrey)"/>
  <text x="520" y="399" text-anchor="middle" font-size="17" fill="#33414F">5a. Validate enrollment token</text>

  <!-- 5b NDES -> CA -->
  <line x1="645" y1="456" x2="889" y2="456" stroke="#0D1B2E" stroke-width="2" marker-end="url(#mNavy)"/>
  <text x="770" y="447" text-anchor="middle" font-size="17" fill="#33414F">5b. Forward CSR to issuing CA</text>

  <!-- 6 CA -> NDES -->
  <line x1="895" y1="504" x2="651" y2="504" stroke="#1E8C8C" stroke-width="2" marker-end="url(#mTeal)"/>
  <text x="770" y="495" text-anchor="middle" font-size="17" fill="#33414F">6. Issue certificate — device UPN as SAN</text>

  <!-- 7 NDES -> Device -->
  <line x1="645" y1="552" x2="151" y2="552" stroke="#1E8C8C" stroke-width="2" marker-end="url(#mTeal)"/>
  <text x="395" y="543" text-anchor="middle" font-size="17" fill="#33414F">7. Deliver certificate via SCEP response</text>

  <!-- 8 self note -->
  <rect x="55" y="580" width="400" height="36" rx="6" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="255" y="603" text-anchor="middle" font-size="16" fill="#33414F">8. Install in Computer certificate store</text>

  <!-- 9 Device -> RADIUS -->
  <rect x="22" y="628" width="98" height="46" rx="6" fill="#0D1B2E"/>
  <text x="71" y="648" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">RADIUS</text>
  <text x="71" y="666" text-anchor="middle" font-size="13" fill="#EAF1FB">NPS</text>
  <line x1="145" y1="651" x2="126" y2="651" stroke="#0D1B2E" stroke-width="2" marker-end="url(#mNavy)"/>
  <text x="158" y="645" font-size="16" fill="#33414F">9. Present certificate at next 802.1X authentication event</text>
</svg>
