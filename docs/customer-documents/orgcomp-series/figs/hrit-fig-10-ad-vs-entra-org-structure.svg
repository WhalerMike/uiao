<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="70" y="48" font-size="13" font-weight="bold" letter-spacing="4" fill="#1E8C8C">THE COMPARISON THAT DECIDES THE TARGET</text>
  <text x="70" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E">Absorbing org &amp; reporting structure: AD vs. Entra ID</text>

  <!-- table header -->
  <rect x="70" y="120" width="220" height="48" fill="#0D1B2E"/>
  <rect x="290" y="120" width="450" height="48" fill="#0D1B2E"/>
  <rect x="740" y="120" width="470" height="48" fill="#0D1B2E"/>
  <text x="86" y="150" font-size="15" font-weight="bold" fill="#FFFFFF">Dimension</text>
  <text x="306" y="150" font-size="15" font-weight="bold" fill="#FFFFFF">Active Directory</text>
  <text x="756" y="150" font-size="15" font-weight="bold" fill="#FFFFFF">Entra ID</text>

  <!-- rows: alternating white / #F4F6F9 on Dimension+AD, Entra col tinted #E8F4F1/#DFEEE9 -->
  <!-- row 1 -->
  <rect x="70" y="168" width="670" height="62" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
  <rect x="740" y="168" width="470" height="62" fill="#E8F4F1" stroke="#E3E8EF" stroke-width="1"/>
  <text x="86" y="204" font-size="13.5" font-weight="bold" fill="#0D1B2E">Structural container</text>
  <text x="306" y="204" font-size="13" fill="#33414F">OU tree — structure as PLACE; GPO reads position</text>
  <text x="756" y="196" font-size="13" fill="#33414F">None — structure as ATTRIBUTES; policy reads</text>
  <text x="756" y="214" font-size="13" fill="#33414F">claims and groups</text>

  <!-- row 2 -->
  <rect x="70" y="230" width="670" height="62" fill="#F4F6F9" stroke="#E3E8EF" stroke-width="1"/>
  <rect x="740" y="230" width="470" height="62" fill="#DFEEE9" stroke="#E3E8EF" stroke-width="1"/>
  <text x="86" y="266" font-size="13.5" font-weight="bold" fill="#0D1B2E">Reporting line</text>
  <text x="306" y="266" font-size="13" fill="#33414F">manager DN reference — Exchange, address book</text>
  <text x="756" y="258" font-size="13" fill="#33414F">manager relationship — org chart in Teams/Outlook,</text>
  <text x="756" y="276" font-size="13" fill="#33414F">approval routing</text>

  <!-- row 3 -->
  <rect x="70" y="292" width="670" height="62" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
  <rect x="740" y="292" width="470" height="62" fill="#E8F4F1" stroke="#E3E8EF" stroke-width="1"/>
  <text x="86" y="328" font-size="13.5" font-weight="bold" fill="#0D1B2E">Org placement</text>
  <text x="306" y="328" font-size="13" fill="#33414F">OU computed at provisioning (parentDistinguishedName)</text>
  <text x="756" y="320" font-size="13" fill="#33414F">employeeOrgData (division, costCenter) +</text>
  <text x="756" y="338" font-size="13" fill="#33414F">department, stamped</text>

  <!-- row 4 -->
  <rect x="70" y="354" width="670" height="62" fill="#F4F6F9" stroke="#E3E8EF" stroke-width="1"/>
  <rect x="740" y="354" width="470" height="62" fill="#DFEEE9" stroke="#E3E8EF" stroke-width="1"/>
  <text x="86" y="390" font-size="13.5" font-weight="bold" fill="#0D1B2E">Membership</text>
  <text x="306" y="390" font-size="13" fill="#33414F">Static groups, nesting, manual or scripted</text>
  <text x="756" y="382" font-size="13" fill="#33414F">Dynamic membership rules — computed,</text>
  <text x="756" y="400" font-size="13" fill="#33414F">continuously evaluated</text>

  <!-- row 5 -->
  <rect x="70" y="416" width="670" height="62" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1"/>
  <rect x="740" y="416" width="470" height="62" fill="#E8F4F1" stroke="#E3E8EF" stroke-width="1"/>
  <text x="86" y="452" font-size="13.5" font-weight="bold" fill="#0D1B2E">Delegated admin</text>
  <text x="306" y="452" font-size="13" fill="#33414F">OU ACL delegation</text>
  <text x="756" y="452" font-size="13" fill="#33414F">Administrative units, attribute-scoped</text>

  <!-- row 6 -->
  <rect x="70" y="478" width="670" height="62" fill="#F4F6F9" stroke="#E3E8EF" stroke-width="1"/>
  <rect x="740" y="478" width="470" height="62" fill="#DFEEE9" stroke="#E3E8EF" stroke-width="1"/>
  <text x="86" y="514" font-size="13.5" font-weight="bold" fill="#0D1B2E">Reorg cost</text>
  <text x="306" y="514" font-size="13" fill="#33414F">OU restructure + GPO re-link — a migration project</text>
  <text x="756" y="514" font-size="13" fill="#33414F">Attribute re-stamp + rule re-evaluation — a data change</text>

  <!-- callout -->
  <rect x="70" y="566" width="1140" height="76" rx="10" fill="#EAF1FB" stroke="#C9D4E0" stroke-width="1"/>
  <text x="94" y="598" font-size="14.5" fill="#33414F"><tspan font-weight="bold" fill="#0D1B2E">Both absorb the structure; only one absorbs it as data.</tspan> Microsoft's own platform direction agrees with the series</text>
  <text x="94" y="620" font-size="14.5" fill="#33414F">doctrine: overlay the drifted OU estate with attributes, and retire it.</text>

  <line x1="70" y1="668" x2="1210" y2="668" stroke="#E3E8EF" stroke-width="1"/>
  <text x="70" y="694" font-size="12" fill="#5A5A5A">Vol I Book 04 — OPM HRIT and the Identity &amp; Organizational SSOT &#183; FedRAMP Moderate &#183; Date Code 2026-07-24 10:08 ET</text>
</svg>
