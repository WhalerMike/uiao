<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="1200" height="660" fill="#FFFFFF"/>
  <defs>
    <filter id="sh"><feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.18"/></filter>
  </defs>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">DIA Enables · SASE Achieves</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#555">The NIST controls that govern voice traffic on the DIA path — and what provides them</text>

  <!-- DIA pipe (center) -->
  <rect x="480" y="120" width="240" height="420" rx="10" fill="#F2F6FC" stroke="#2E75B6" stroke-width="2"/>
  <text x="600" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E75B6">DIA Pipe</text>
  <text x="600" y="166" text-anchor="middle" font-size="12" fill="#555">provides connectivity</text>
  <text x="600" y="186" text-anchor="middle" font-size="12" fill="#555">eliminates hairpin</text>
  <text x="600" y="214" text-anchor="middle" font-size="12" fill="#888">✓ solves G.114 latency</text>
  <text x="600" y="234" text-anchor="middle" font-size="12" fill="#C00000">✗ no application identity</text>
  <text x="600" y="254" text-anchor="middle" font-size="12" fill="#C00000">✗ no user context</text>
  <text x="600" y="274" text-anchor="middle" font-size="12" fill="#C00000">✗ no malware inspect</text>
  <text x="600" y="294" text-anchor="middle" font-size="12" fill="#C00000">✗ no encrypt at network</text>
  <text x="600" y="314" text-anchor="middle" font-size="12" fill="#C00000">✗ no audit records</text>

  <!-- SASE layer chips on left -->
  <!-- SC-8 IPsec -->
  <rect x="60" y="128" width="380" height="64" rx="8" fill="#1F3864" filter="url(#sh)"/>
  <text x="250" y="150" text-anchor="middle" font-size="13" fill="#C55A11" font-weight="bold">SD-WAN IPsec Tunnel</text>
  <text x="250" y="168" text-anchor="middle" font-size="11" fill="white">SC-8 Transmission Confidentiality — network-layer encryption</text>
  <text x="250" y="185" text-anchor="middle" font-size="11" fill="#aaa">satisfies confidentiality + integrity at transport layer</text>
  <line x1="440" y1="160" x2="480" y2="200" stroke="#1F3864" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- SI-3 SWG -->
  <rect x="60" y="210" width="380" height="64" rx="8" fill="#2E75B6" filter="url(#sh)"/>
  <text x="250" y="232" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Secure Web Gateway (SWG)</text>
  <text x="250" y="250" text-anchor="middle" font-size="11" fill="white">SI-3 Malware Protection — SC-7 Boundary Protection</text>
  <text x="250" y="267" text-anchor="middle" font-size="11" fill="#cce">SSL inspection · malware scan · application-layer boundary</text>
  <line x1="440" y1="242" x2="480" y2="260" stroke="#2E75B6" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- AC-4 CASB -->
  <rect x="60" y="292" width="380" height="64" rx="8" fill="#375623" filter="url(#sh)"/>
  <text x="250" y="314" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Cloud Access Security Broker (CASB)</text>
  <text x="250" y="332" text-anchor="middle" font-size="11" fill="white">AC-4 Information Flow Enforcement</text>
  <text x="250" y="349" text-anchor="middle" font-size="11" fill="#adc">blocks unauthorized apps on port 443 · data exfil detection</text>
  <line x1="440" y1="324" x2="480" y2="320" stroke="#375623" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- ZTNA -->
  <rect x="60" y="374" width="380" height="64" rx="8" fill="#7030A0" filter="url(#sh)"/>
  <text x="250" y="396" text-anchor="middle" font-size="13" fill="white" font-weight="bold">ZTNA / Identity-Aware Proxy</text>
  <text x="250" y="414" text-anchor="middle" font-size="11" fill="white">replaces VPN · per-app per-session access control</text>
  <text x="250" y="431" text-anchor="middle" font-size="11" fill="#ddc">user + device + posture verified before each session</text>
  <line x1="440" y1="406" x2="480" y2="370" stroke="#7030A0" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- AU-12 / SI-4 / CA-7 on right -->
  <rect x="760" y="128" width="380" height="64" rx="8" fill="#C55A11" filter="url(#sh)"/>
  <text x="950" y="150" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Application-Layer Logging</text>
  <text x="950" y="168" text-anchor="middle" font-size="11" fill="white">AU-12 Audit Records — user, device, app, action, data type</text>
  <text x="950" y="185" text-anchor="middle" font-size="11" fill="#FFD0A0">not just source IP and port — full transaction context</text>
  <line x1="720" y1="160" x2="760" y2="200" stroke="#C55A11" stroke-width="2" stroke-dasharray="4,3"/>

  <rect x="760" y="210" width="380" height="64" rx="8" fill="#1F3864" filter="url(#sh)"/>
  <text x="950" y="232" text-anchor="middle" font-size="13" fill="#C55A11" font-weight="bold">Behavioral Analytics (SI-4)</text>
  <text x="950" y="250" text-anchor="middle" font-size="11" fill="white">anomaly detection · application-layer telemetry</text>
  <text x="950" y="267" text-anchor="middle" font-size="11" fill="#aaa">who, what device, what app, what data, normal pattern?</text>
  <line x1="720" y1="242" x2="760" y2="260" stroke="#1F3864" stroke-width="2" stroke-dasharray="4,3"/>

  <rect x="760" y="292" width="380" height="64" rx="8" fill="#2E75B6" filter="url(#sh)"/>
  <text x="950" y="314" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Continuous Monitoring (CA-7)</text>
  <text x="950" y="332" text-anchor="middle" font-size="11" fill="white">FedRAMP 20x KSIs — machine-readable evidence</text>
  <text x="950" y="349" text-anchor="middle" font-size="11" fill="#cce">per-session: identity verified · device compliant · access authorized</text>
  <line x1="720" y1="324" x2="760" y2="320" stroke="#2E75B6" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Summary box -->
  <rect x="200" y="480" width="800" height="60" rx="8" fill="#EBF3FF" stroke="#1F3864" stroke-width="1.5"/>
  <text x="600" y="505" text-anchor="middle" font-size="14" fill="#1F3864" font-weight="bold">DIA solves G.114 latency · SASE satisfies AC-4, SC-7, SC-8, SI-3, SI-4, AU-12, CA-7</text>
  <text x="600" y="527" text-anchor="middle" font-size="12" fill="#555">A field office with DIA but no SASE has better latency and identical compliance gaps</text>

  <text x="600" y="624" text-anchor="middle" font-size="12" fill="#888">NIST SP 800-53 Rev 5 control references · TIC 3.0 Use Case E · FedRAMP 20x KSI requirements</text>
</svg>
