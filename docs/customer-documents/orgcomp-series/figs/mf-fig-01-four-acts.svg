<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <defs>
    </defs>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">Forty Years of Federal IT Architecture</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#555">From brutal single source of truth — to distributed chaos — to the way forward</text>

  <!-- Timeline spine -->
  <line x1="80" y1="340" x2="1120" y2="340" stroke="#DDD" stroke-width="3"/>

  <!-- ACT 0: Mainframe -->
  <rect x="60" y="120" width="190" height="190" rx="12" fill="#1F3864" stroke="#13223E" stroke-width="2"/>
  <text x="155" y="150" text-anchor="middle" font-size="14" fill="#C55A11" font-weight="bold">PROLOGUE</text>
  <text x="155" y="170" text-anchor="middle" font-size="16" fill="white" font-weight="bold">Mainframe</text>
  <text x="155" y="190" text-anchor="middle" font-size="11" fill="#aaa">1940s–1990</text>
  <text x="155" y="215" text-anchor="middle" font-size="11" fill="#ddd">One machine</text>
  <text x="155" y="233" text-anchor="middle" font-size="11" fill="#ddd">One source of truth</text>
  <text x="155" y="251" text-anchor="middle" font-size="11" fill="#ddd">Terminals → keystrokes</text>
  <text x="155" y="275" text-anchor="middle" font-size="11" fill="#C55A11">✓ Truth enforcer</text>
  <text x="155" y="293" text-anchor="middle" font-size="11" fill="#C55A11">in one box</text>
  <circle cx="155" cy="340" r="10" fill="#1F3864"/>

  <!-- ACT 1: Decentralization -->
  <rect x="290" y="120" width="190" height="190" rx="12" fill="#2E75B6" stroke="#1C4870" stroke-width="2"/>
  <text x="385" y="150" text-anchor="middle" font-size="14" fill="white" font-weight="bold">ACT 1</text>
  <text x="385" y="170" text-anchor="middle" font-size="15" fill="white" font-weight="bold">Decentralization</text>
  <text x="385" y="190" text-anchor="middle" font-size="11" fill="#acd">1988–2000</text>
  <text x="385" y="215" text-anchor="middle" font-size="11" fill="#ddd">Regional SQL Servers</text>
  <text x="385" y="233" text-anchor="middle" font-size="11" fill="#ddd">12 regional offices</text>
  <text x="385" y="251" text-anchor="middle" font-size="11" fill="#ddd">Local flexibility gained</text>
  <text x="385" y="275" text-anchor="middle" font-size="12" fill="#C55A11" font-weight="bold">Original sin:</text>
  <text x="385" y="293" text-anchor="middle" font-size="11" fill="#FFD0A0">distributed truth</text>
  <circle cx="385" cy="340" r="10" fill="#2E75B6"/>

  <!-- ACT 2: Security era -->
  <rect x="520" y="120" width="190" height="190" rx="12" fill="#C55A11" stroke="#7A370A" stroke-width="2"/>
  <text x="615" y="150" text-anchor="middle" font-size="14" fill="white" font-weight="bold">ACT 2</text>
  <text x="615" y="170" text-anchor="middle" font-size="15" fill="white" font-weight="bold">Security Era</text>
  <text x="615" y="190" text-anchor="middle" font-size="11" fill="#FFD0A0">2010–2020</text>
  <text x="615" y="215" text-anchor="middle" font-size="11" fill="#ddd">Firewalls stacked</text>
  <text x="615" y="233" text-anchor="middle" font-size="11" fill="#ddd">Proxies inline</text>
  <text x="615" y="251" text-anchor="middle" font-size="11" fill="#ddd">Kerberos breaks</text>
  <text x="615" y="275" text-anchor="middle" font-size="12" fill="#FFD0A0" font-weight="bold">Compliance metric:</text>
  <text x="615" y="293" text-anchor="middle" font-size="11" fill="#FFD0A0">scans ≠ truth</text>
  <circle cx="615" cy="340" r="10" fill="#C55A11"/>

  <!-- ACT 3: Breaking point -->
  <rect x="750" y="120" width="190" height="190" rx="12" fill="#C00000" stroke="#770000" stroke-width="2"/>
  <text x="845" y="150" text-anchor="middle" font-size="14" fill="white" font-weight="bold">ACT 3</text>
  <text x="845" y="170" text-anchor="middle" font-size="15" fill="white" font-weight="bold">Breaking Point</text>
  <text x="845" y="190" text-anchor="middle" font-size="11" fill="#FFB0B0">2020–2026</text>
  <text x="845" y="215" text-anchor="middle" font-size="11" fill="#ddd">M365 cloud forced</text>
  <text x="845" y="233" text-anchor="middle" font-size="11" fill="#ddd">4 environments now</text>
  <text x="845" y="251" text-anchor="middle" font-size="11" fill="#ddd">12 AD domains linger</text>
  <text x="845" y="275" text-anchor="middle" font-size="12" fill="#FFB0B0" font-weight="bold">Duplicate payments</text>
  <text x="845" y="293" text-anchor="middle" font-size="11" fill="#FFB0B0">reconciliation fails</text>
  <circle cx="845" cy="340" r="10" fill="#C00000"/>

  <!-- ACT 4: Way forward -->
  <rect x="960" y="100" width="210" height="210" rx="12" fill="#375623" stroke="#223515" stroke-width="2"/>
  <text x="1065" y="132" text-anchor="middle" font-size="14" fill="white" font-weight="bold">ACT 4</text>
  <text x="1065" y="152" text-anchor="middle" font-size="15" fill="white" font-weight="bold">Way Forward</text>
  <text x="1065" y="172" text-anchor="middle" font-size="11" fill="#afc">Now</text>
  <text x="1065" y="197" text-anchor="middle" font-size="11" fill="#ddd">Single source of truth</text>
  <text x="1065" y="215" text-anchor="middle" font-size="11" fill="#ddd">Application-aware network</text>
  <text x="1065" y="233" text-anchor="middle" font-size="11" fill="#ddd">Token-based identity</text>
  <text x="1065" y="251" text-anchor="middle" font-size="11" fill="#ddd">Active governance</text>
  <text x="1065" y="275" text-anchor="middle" font-size="12" fill="#C55A11" font-weight="bold">ZT + FedRAMP 20x</text>
  <text x="1065" y="293" text-anchor="middle" font-size="11" fill="#afc">NIST SP 800-207</text>
  <circle cx="1065" cy="340" r="12" fill="#375623" stroke="white" stroke-width="2"/>

  <!-- Below-timeline labels -->
  <text x="155" y="370" text-anchor="middle" font-size="12" fill="#1F3864" font-weight="bold">Brutal Truth</text>
  <text x="385" y="370" text-anchor="middle" font-size="12" fill="#2E75B6" font-weight="bold">Distributed</text>
  <text x="615" y="370" text-anchor="middle" font-size="12" fill="#C55A11" font-weight="bold">Session Breaks</text>
  <text x="845" y="370" text-anchor="middle" font-size="12" fill="#C00000" font-weight="bold">Siloed Truth</text>
  <text x="1065" y="370" text-anchor="middle" font-size="12" fill="#375623" font-weight="bold">Rebuilt Truth</text>

  <!-- The one sentence callout -->
  <rect x="100" y="430" width="1000" height="70" rx="10" fill="#EBF3FF" stroke="#1F3864" stroke-width="2"/>
  <text x="600" y="458" text-anchor="middle" font-size="14" fill="#1F3864" font-weight="bold">The one sentence the whole story turns on:</text>
  <text x="600" y="482" text-anchor="middle" font-size="13" fill="#1F3864">Active Directory conflated the directory (truth) with the domain controller (in-path enforcer).</text>
  <text x="600" y="500" text-anchor="middle" font-size="12" fill="#555">NIST SP 800-207 + OMB M-22-09 require separating these roles. Act 4 is that separation.</text>

  <!-- 4-environment icons at bottom -->
  <text x="200" y="560" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3864">VMware On-Prem</text>
  <text x="440" y="560" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E75B6">Azure / M365</text>
  <text x="680" y="560" text-anchor="middle" font-size="13" font-weight="bold" fill="#C55A11">AWS GovCloud</text>
  <text x="920" y="560" text-anchor="middle" font-size="13" font-weight="bold" fill="#7030A0">Oracle OCI (OPM HRIT)</text>
  <text x="600" y="586" text-anchor="middle" font-size="12" fill="#888">12 regional AD domains — designed for one environment — now spanning four</text>
  <text x="600" y="606" text-anchor="middle" font-size="11" fill="#888">Source: NIST SP 800-207 Zero Trust Architecture · OMB M-22-09 · EO 14028</text>
</svg>
