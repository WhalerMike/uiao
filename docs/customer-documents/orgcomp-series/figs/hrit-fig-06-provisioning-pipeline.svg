<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="p6-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#1E8C8C"/></marker>
  </defs>
  <text x="70" y="48" font-size="13" font-weight="bold" letter-spacing="4" fill="#1E8C8C">THE PIPE</text>
  <text x="70" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E">HR-driven provisioning: one entry point, one provenance stream</text>

  <!-- pipeline boxes -->
  <rect x="70" y="126" width="256" height="150" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
  <circle cx="94" cy="152" r="7" fill="#0D1B2E"/>
  <text x="110" y="158" font-size="15.5" font-weight="bold" fill="#0D1B2E">HR system of record</text>
  <text x="90" y="196" font-size="12.5" fill="#5A6B7C">Oracle HCM Cloud —</text>
  <text x="90" y="214" font-size="12.5" fill="#5A6B7C">effective-dated events</text>

  <line x1="326" y1="201" x2="368" y2="201" stroke="#1E8C8C" stroke-width="3" marker-end="url(#p6-teal)"/>

  <rect x="370" y="126" width="256" height="150" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
  <circle cx="394" cy="152" r="7" fill="#1E8C8C"/>
  <text x="410" y="158" font-size="15.5" font-weight="bold" fill="#0D1B2E">Integration middleware</text>
  <text x="390" y="196" font-size="12.5" fill="#5A6B7C">normalizes any HCM export to</text>
  <text x="390" y="214" font-size="12.5" fill="#5A6B7C">canonical SCIM 2.0; emits</text>
  <text x="390" y="232" font-size="12.5" fill="#5A6B7C">provenance per event</text>

  <line x1="626" y1="201" x2="668" y2="201" stroke="#1E8C8C" stroke-width="3" marker-end="url(#p6-teal)"/>

  <rect x="670" y="126" width="256" height="150" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
  <circle cx="694" cy="152" r="7" fill="#D4A017"/>
  <text x="710" y="158" font-size="15.5" font-weight="bold" fill="#0D1B2E">Graph bulkUpload API</text>
  <text x="690" y="196" font-size="12.5" fill="#5A6B7C">HTTPS, accepted async (HTTP</text>
  <text x="690" y="214" font-size="12.5" fill="#5A6B7C">202), near-real-time processing</text>

  <line x1="926" y1="201" x2="968" y2="201" stroke="#1E8C8C" stroke-width="3" marker-end="url(#p6-teal)"/>

  <rect x="970" y="126" width="240" height="150" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
  <circle cx="994" cy="152" r="7" fill="#C0392B"/>
  <text x="1010" y="158" font-size="15.5" font-weight="bold" fill="#0D1B2E">Entra provisioning</text>
  <text x="990" y="196" font-size="12.5" fill="#5A6B7C">accounts, attributes,</text>
  <text x="990" y="214" font-size="12.5" fill="#5A6B7C">lifecycle workflows</text>

  <!-- callouts -->
  <rect x="70" y="310" width="1140" height="94" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
  <text x="94" y="342" font-size="14.5" fill="#33414F"><tspan font-weight="bold" fill="#0D1B2E">Source-agnostic by design</tspan> — The middleware normalizes ANY HCM's export; the bulkUpload call is identical regardless</text>
  <text x="94" y="364" font-size="14.5" fill="#33414F">of source. The SSOT is a role, filled by whichever system holds business authority — if the source changes, the adapter</text>
  <text x="94" y="386" font-size="14.5" fill="#33414F">changes; the doctrine does not.</text>

  <rect x="70" y="422" width="1140" height="76" rx="10" fill="#EAF1FB" stroke="#C9D4E0" stroke-width="1"/>
  <text x="94" y="454" font-size="14.5" fill="#33414F"><tspan font-weight="bold" fill="#0D1B2E">One door to instrument</tspan> — All inbound identity writes flow through the single provisioning surface, with a provenance</text>
  <text x="94" y="476" font-size="14.5" fill="#33414F">record per event emitted BEFORE the Graph call returns — what makes lineage (SI-12) and drift detection tractable.</text>

  <rect x="70" y="516" width="1140" height="76" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
  <text x="94" y="548" font-size="14.5" fill="#33414F"><tspan font-weight="bold" fill="#0D1B2E">An engineered envelope</tspan> — Verified operating numbers: 40 calls per 5-second window; 2,000 (P1/P2) or 6,000</text>
  <text x="94" y="570" font-size="14.5" fill="#33414F">(Governance) calls/day; 50 operations per batch; three provisioning agents where AD writeback persists.</text>

  <line x1="70" y1="668" x2="1210" y2="668" stroke="#E3E8EF" stroke-width="1"/>
  <text x="70" y="694" font-size="12" fill="#5A5A5A">Vol I Book 04 — OPM HRIT and the Identity &amp; Organizational SSOT &#183; FedRAMP Moderate &#183; Date Code 2026-07-24 10:08 ET</text>
</svg>
