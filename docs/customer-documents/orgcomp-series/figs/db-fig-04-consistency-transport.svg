<svg viewBox="0 0 1040 406" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;"><rect width="1040" height="406" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs><text x="520" y="28" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1F3864">Consistency Class to Transport Class — The Design Rule</text><text x="520" y="46" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">Align the data consistency class with the network transport class — mismatch is expensive</text><rect x="40" y="66" width="238" height="26" rx="0" fill="#1F3864"/><text x="159" y="83" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#FFFFFF">Consistency Class</text><rect x="280" y="66" width="238" height="26" rx="0" fill="#1F3864"/><text x="399" y="83" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#FFFFFF">Use Case</text><rect x="520" y="66" width="238" height="26" rx="0" fill="#1F3864"/><text x="639" y="83" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#FFFFFF">Transport Class</text><rect x="760" y="66" width="238" height="26" rx="0" fill="#1F3864"/><text x="879" y="83" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#FFFFFF">Latency Implication</text><rect x="40" y="94" width="958" height="38" rx="0" fill="#FFFFFF" stroke="#F2F2F2" stroke-width="1"/><text x="159" y="117" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Strong / Serializable</text><text x="399" y="117" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Authoritative writes</text><text x="639" y="117" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#1F3864">LEAN — intra-region only</text><text x="879" y="117" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">sub-ms, nearly free</text><rect x="40" y="134" width="958" height="38" rx="0" fill="#F2F2F2" stroke="#F2F2F2" stroke-width="1"/><text x="159" y="157" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Synchronous replication</text><text x="399" y="157" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Quorum durability</text><text x="639" y="157" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#1F3864">LEAN — within region</text><text x="879" y="157" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">RTT x quorum members</text><rect x="40" y="174" width="958" height="38" rx="0" fill="#FFFFFF" stroke="#F2F2F2" stroke-width="1"/><text x="159" y="197" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Async replication</text><text x="399" y="197" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Disaster recovery</text><text x="639" y="197" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#2E75B6">FAT — bulk, cross-region</text><text x="879" y="197" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">no round-trip cost</text><rect x="40" y="214" width="958" height="38" rx="0" fill="#F2F2F2" stroke="#F2F2F2" stroke-width="1"/><text x="159" y="237" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Bounded staleness</text><text x="399" y="237" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Read replica</text><text x="639" y="237" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#2E75B6">FAT — bulk</text><text x="879" y="237" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">configured lag window</text><rect x="40" y="254" width="958" height="38" rx="0" fill="#FFFFFF" stroke="#F2F2F2" stroke-width="1"/><text x="159" y="277" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Causal / CRDT</text><text x="399" y="277" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Multi-writer merge</text><text x="639" y="277" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#C55A11">FAT — bulk, no RTT</text><text x="879" y="277" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">deterministic merge</text><rect x="40" y="294" width="958" height="38" rx="0" fill="#F2F2F2" stroke="#F2F2F2" stroke-width="1"/><text x="159" y="317" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Eventual</text><text x="399" y="317" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">Analytics</text><text x="639" y="317" text-anchor="middle" font-size="10" font-weight="bold" font-style="normal" fill="#C55A11">FAT — bulk</text><text x="879" y="317" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal" fill="#1F3864">lowest cost, highest throughput</text><rect x="60" y="340" width="880" height="46" rx="6" fill="#EBF3FB" stroke="#2E75B6" stroke-width="1"/><text x="500" y="359" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal" fill="#1F3864">Key rule: strong consistency intra-region (sub-ms, nearly free)</text><text x="500" y="373" text-anchor="middle" font-size="11" font-weight="normal" font-style="normal" fill="#2E75B6">Across regions: stop spending round trips. Use async, bounded staleness, or CRDTs.</text></svg>
