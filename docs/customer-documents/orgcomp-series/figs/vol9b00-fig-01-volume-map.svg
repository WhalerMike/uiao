  <text x="800" y="861" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1F3A5F">Same coordination discipline as Vol VII, applied to the work a service desk does every day. FedRAMP Moderate &amp; Microsoft GCC Moderate only.</text>
