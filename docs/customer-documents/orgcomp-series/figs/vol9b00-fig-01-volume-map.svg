  <text x="224.0" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">
  <tspan x="224.0" dy="0.0">Teams Telephony</tspan>
  <tspan x="224.0" dy="24.6">Catalog</tspan>
