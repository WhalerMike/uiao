  <text x="800" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#1F3A5F">Volume IX — ServiceNow Day-2 Operations</text>
  <text x="800" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5A6B7B">Extending the Vol VII coordination layer to the governed day-2 catalog (FedRAMP Moderate · GCC Moderate)</text>
