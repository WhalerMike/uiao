  <rect x="433" y="510" width="1118" height="300" rx="10" fill="#F4F7FA" stroke="#1A9E8F" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="992" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1A9E8F">Routine operations that evidence themselves</text>
  <text x="992" y="636" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#2A2A2A">
  <tspan x="992" dy="0.0">Every catalog action is a change/approval record (CM-3 / AU-2)</tspan>
  <tspan x="992" dy="27.3">reconciled to the CM-8 join key and fed to Vol VII Book 04</tspan>
  <tspan x="992" dy="27.3">attestation. Actuation is Microsoft Graph through the</tspan>
  <tspan x="992" dy="27.3">in-boundary MID Server — never standing tenant admin (AC-6).</tspan>
  </text>
