  <text x="608.0" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">
  <tspan x="608.0" dy="0.0">Helpdesk &amp; ITSM</tspan>
  </text>
  <text x="608.0" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#2A2A2A">
  <tspan x="608.0" dy="0.0">JML, password/MFA reset,</tspan>
  <tspan x="608.0" dy="26.4">unlock, group/license, guest</tspan>
  <tspan x="608.0" dy="26.4">invite — Graph via in-boundary</tspan>
