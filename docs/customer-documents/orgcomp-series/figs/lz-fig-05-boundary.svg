<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <defs>
    <radialGradient id="inside" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </radialGradient>
    <radialGradient id="outside" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFEBEE"/>
      <stop offset="100%" stop-color="#FFCDD2"/>
    </radialGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A8FD6"/>
      <stop offset="100%" stop-color="#1F3864"/>
    </linearGradient>
    <clipPath id="innerclip">
      <ellipse cx="480" cy="370" rx="390" ry="265"/>
    </clipPath>
  </defs>

  <rect width="1200" height="680" fill="#F0F4FF"/>
  <text x="600" y="36" text-anchor="middle" fill="#1F3864" font-size="22" font-weight="bold">InfoBlox DDI as the FedRAMP Authorization Boundary Enforcement Layer</text>
  <text x="600" y="58" text-anchor="middle" fill="#2E75B6" font-size="14">DNS is the gateway — every workload that calls outbound passes through InfoBlox RPZ first</text>

  <!-- OUTSIDE zone (right) -->
  <rect x="610" y="78" width="560" height="572" rx="20" fill="url(#outside)" stroke="#C00000" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="890" y="104" text-anchor="middle" fill="#C00000" font-size="16" font-weight="bold">⚠  OUTSIDE FedRAMP BOUNDARY</text>

  <!-- Outside entities -->
  <g font-size="12">
    <!-- Commercial M365 -->
    <g>
      <rect x="636" y="120" width="200" height="60" rx="10" fill="white" stroke="#C00000" stroke-width="2"/>
    </g>
    <text x="736" y="144" text-anchor="middle" fill="#C00000" font-size="13" font-weight="bold">Commercial Microsoft 365</text>
    <text x="736" y="160" text-anchor="middle" fill="#555" font-size="11">outlook.office.com (non-GCC)</text>
    <text x="736" y="174" text-anchor="middle" fill="#C00000" font-size="11" font-weight="bold">⛔ FedRAMP boundary violation</text>

    <!-- Unauthorized SaaS -->
    <g>
      <rect x="858" y="120" width="200" height="60" rx="10" fill="white" stroke="#C55A11" stroke-width="2"/>
    </g>
    <text x="958" y="144" text-anchor="middle" fill="#C55A11" font-size="13" font-weight="bold">Unauthorized SaaS</text>
    <text x="958" y="160" text-anchor="middle" fill="#555" font-size="11">Dropbox, Slack, non-FedRAMP</text>
    <text x="958" y="174" text-anchor="middle" fill="#C00000" font-size="11" font-weight="bold">⛔ Policy violation</text>

    <!-- Malware C2 -->
    <g>
      <rect x="636" y="220" width="200" height="60" rx="10" fill="white" stroke="#C00000" stroke-width="2"/>
    </g>
    <text x="736" y="244" text-anchor="middle" fill="#C00000" font-size="13" font-weight="bold">Malware C2 / Phishing</text>
    <text x="736" y="260" text-anchor="middle" fill="#555" font-size="11">TIDE + CISA threat IOCs</text>
    <text x="736" y="274" text-anchor="middle" fill="#C00000" font-size="11" font-weight="bold">⛔ RPZ blocks resolution</text>

    <!-- DNS Exfiltration -->
    <g>
      <rect x="858" y="220" width="200" height="60" rx="10" fill="white" stroke="#C55A11" stroke-width="2"/>
    </g>
    <text x="958" y="244" text-anchor="middle" fill="#C55A11" font-size="13" font-weight="bold">DNS Exfiltration</text>
    <text x="958" y="260" text-anchor="middle" fill="#555" font-size="11">Data tunneled over DNS</text>
    <text x="958" y="274" text-anchor="middle" fill="#C00000" font-size="11" font-weight="bold">⛔ Query-rate detection</text>
  </g>

  <!-- INSIDE zone (left) -->
  <rect x="30" y="78" width="560" height="572" rx="20" fill="url(#inside)" stroke="#375623" stroke-width="2"/>
  <text x="310" y="104" text-anchor="middle" fill="#1B4D1B" font-size="16" font-weight="bold">✓  INSIDE FedRAMP BOUNDARY</text>

  <!-- Inside entities -->
  <g>
    <rect x="54" y="120" width="200" height="60" rx="10" fill="white" stroke="#375623" stroke-width="2"/>
  </g>
  <text x="154" y="144" text-anchor="middle" fill="#1B4D1B" font-size="12" font-weight="bold">M365 GCC Moderate</text>
  <text x="154" y="160" text-anchor="middle" fill="#555" font-size="11">*.gcc.teams.microsoft.com</text>
  <text x="154" y="174" text-anchor="middle" fill="#375623" font-size="11">✓ RPZ passthrough allowed</text>

  <g>
    <rect x="272" y="120" width="200" height="60" rx="10" fill="white" stroke="#0066B3" stroke-width="2"/>
  </g>
  <text x="372" y="144" text-anchor="middle" fill="#0066B3" font-size="12" font-weight="bold">Azure Government</text>
  <text x="372" y="160" text-anchor="middle" fill="#555" font-size="11">*.usgovcloudapp.net</text>
  <text x="372" y="174" text-anchor="middle" fill="#375623" font-size="11">✓ Private Link DNS in-boundary</text>

  <g>
    <rect x="54" y="220" width="200" height="60" rx="10" fill="white" stroke="#C55A11" stroke-width="2"/>
  </g>
  <text x="154" y="244" text-anchor="middle" fill="#C55A11" font-size="12" font-weight="bold">AWS GovCloud</text>
  <text x="154" y="260" text-anchor="middle" fill="#555" font-size="11">*.us-gov-west-1.amazonaws.com</text>
  <text x="154" y="274" text-anchor="middle" fill="#375623" font-size="11">✓ VPC DNS resolves in-boundary</text>

  <g>
    <rect x="272" y="220" width="200" height="60" rx="10" fill="white" stroke="#1F3864" stroke-width="2"/>
  </g>
  <text x="372" y="244" text-anchor="middle" fill="#1F3864" font-size="12" font-weight="bold">On-Prem VMware VCF</text>
  <text x="372" y="260" text-anchor="middle" fill="#555" font-size="11">agency.gov internal zones</text>
  <text x="372" y="274" text-anchor="middle" fill="#375623" font-size="11">✓ Grid DNSSEC signed</text>

  <!-- InfoBlox IPAM as IP inventory -->
  <g>
    <rect x="54" y="330" width="420" height="80" rx="12" fill="#1F3864" stroke="#13223E" stroke-width="2"/>
  </g>
  <text x="264" y="357" text-anchor="middle" fill="white" font-size="14" font-weight="bold">InfoBlox IPAM = Boundary IP Inventory</text>
  <text x="264" y="376" text-anchor="middle" fill="white" font-size="12" opacity="0.9">Every IP allocated by InfoBlox = in-boundary by definition</text>
  <text x="264" y="394" text-anchor="middle" fill="white" font-size="12" opacity="0.85">CM-8 export = SSP Appendix J · No manual inventory needed</text>

  <!-- Certificate binding -->
  <g>
    <rect x="54" y="430" width="200" height="90" rx="10" fill="white" stroke="#7030A0" stroke-width="2"/>
  </g>
  <text x="154" y="452" text-anchor="middle" fill="#7030A0" font-size="12" font-weight="bold">Certificate Binding</text>
  <text x="154" y="468" text-anchor="middle" fill="#333" font-size="11">Every IP host record</text>
  <text x="154" y="484" text-anchor="middle" fill="#333" font-size="11">carries a bound cert</text>
  <text x="154" y="500" text-anchor="middle" fill="#375623" font-size="11">IA-5(2) · IA-9 satisfied</text>

  <!-- Audit logging -->
  <g>
    <rect x="272" y="430" width="200" height="90" rx="10" fill="white" stroke="#375623" stroke-width="2"/>
  </g>
  <text x="372" y="452" text-anchor="middle" fill="#375623" font-size="12" font-weight="bold">DNS Audit Logging</text>
  <text x="372" y="468" text-anchor="middle" fill="#333" font-size="11">All queries logged</text>
  <text x="372" y="484" text-anchor="middle" fill="#333" font-size="11">SIEM via Sentinel</text>
  <text x="372" y="500" text-anchor="middle" fill="#375623" font-size="11">AU-12 · IR-4 satisfied</text>

  <!-- GATEWAY / WALL CENTER -->
  <g>
    <rect x="568" y="270" width="64" height="200" rx="8" fill="url(#wall)"/>
  </g>
  <text x="600" y="340" text-anchor="middle" fill="white" font-size="11" font-weight="bold" writing-mode="tb-rl" transform="rotate(180,600,370)">InfoBlox RPZ</text>
  <!-- Gate symbol -->
  <rect x="582" y="346" width="36" height="48" rx="4" fill="white" opacity="0.2"/>
  <rect x="596" y="346" width="2" height="48" fill="white" opacity="0.5"/>
  <circle cx="584" cy="372" r="4" fill="white" opacity="0.7"/>

  <!-- DNS query arrows -->
  <!-- Allowed arrow -->
  <path d="M 420 385 Q 520 385 568 385" stroke="#375623" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <path d="M 568 395 Q 520 395 420 395" stroke="#375623" stroke-width="2" stroke-dasharray="5,3" fill="none"/>
  <text x="494" y="378" text-anchor="middle" fill="#375623" font-size="11" font-weight="bold">DNS query</text>
  <text x="494" y="407" text-anchor="middle" fill="#375623" font-size="11">ALLOWED ✓</text>

  <!-- Blocked arrow -->
  <path d="M 632 350 Q 680 350 858 350" stroke="#C00000" stroke-width="2.5" stroke-dasharray="4,3" fill="none"/>
  <text x="745" y="344" text-anchor="middle" fill="#C00000" font-size="11" font-weight="bold">BLOCKED ⛔</text>
  <!-- X on the line -->
  <text x="660" y="354" fill="#C00000" font-size="18" font-weight="bold">✕</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#375623"/>
    </marker>
  </defs>

  <!-- NIST control badges at bottom -->
  <g font-size="11" font-weight="bold">
    <rect x="54" y="542" width="84" height="28" rx="6" fill="#1F3864" stroke="#13223E" stroke-width="2"/>
    <text x="96" y="561" text-anchor="middle" fill="white">SC-20/21</text>
    <rect x="148" y="542" width="60" height="28" rx="6" fill="#1F3864" stroke="#13223E" stroke-width="2"/>
    <text x="178" y="561" text-anchor="middle" fill="white">SC-7</text>
    <rect x="218" y="542" width="60" height="28" rx="6" fill="#1F3864" stroke="#13223E" stroke-width="2"/>
    <text x="248" y="561" text-anchor="middle" fill="white">CM-8</text>
    <rect x="288" y="542" width="80" height="28" rx="6" fill="#1F3864" stroke="#13223E" stroke-width="2"/>
    <text x="328" y="561" text-anchor="middle" fill="white">IA-5(2)</text>
    <rect x="378" y="542" width="80" height="28" rx="6" fill="#1F3864" stroke="#13223E" stroke-width="2"/>
    <text x="418" y="561" text-anchor="middle" fill="white">AU-12</text>
    <rect x="468" y="542" width="60" height="28" rx="6" fill="#1F3864" stroke="#13223E" stroke-width="2"/>
    <text x="498" y="561" text-anchor="middle" fill="white">IR-4</text>
  </g>
  <text x="310" y="608" text-anchor="middle" fill="#1F3864" font-size="12">NIST SP 800-53 Rev 5 controls satisfied by InfoBlox boundary enforcement</text>
</svg>
