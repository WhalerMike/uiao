<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="1200" height="620" fill="#FFFFFF"/>
  <defs>
    <marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1F3864"/>
    </marker>
  </defs>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">Teams Phone: E911 Compliance + GCC Boundary</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#555">Kari's Law 2018 · Ray Baum's Act 2018 · 47 CFR Part 9 — not optional, must validate before go-live</text>

  <!-- Teams GCC box -->
  <rect x="360" y="100" width="480" height="110" rx="12" fill="#375623" stroke="#223515" stroke-width="2"/>
  <text x="600" y="128" text-anchor="middle" font-size="16" fill="white" font-weight="bold">Microsoft Teams Phone — GCC Moderate</text>
  <text x="600" y="150" text-anchor="middle" font-size="12" fill="#afc">Call signaling · Voicemail · Call history · User policy</text>
  <text x="600" y="170" text-anchor="middle" font-size="12" fill="#afc">Recordings → GCC-boundary-compliant storage</text>
  <text x="600" y="190" text-anchor="middle" font-size="11" fill="#ddd">FedRAMP Moderate ATO (Microsoft 365 GCC)</text>

  <!-- SBC boundary crosser -->
  <rect x="430" y="250" width="340" height="70" rx="10" fill="#2E75B6" stroke="#1C4870" stroke-width="2"/>
  <text x="600" y="275" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Session Border Controller (SBC)</text>
  <text x="600" y="295" text-anchor="middle" font-size="12" fill="white">GCC boundary interface — SSP SA-9 + SC-7 required</text>
  <text x="600" y="311" text-anchor="middle" font-size="11" fill="#C0E0FF">On-prem at DC · or cloud-hosted (must hold FedRAMP Moderate ATO)</text>

  <!-- PSTN -->
  <rect x="480" y="370" width="240" height="60" rx="10" fill="#888" stroke="#545454" stroke-width="2"/>
  <text x="600" y="395" text-anchor="middle" font-size="13" fill="white" font-weight="bold">PSTN</text>
  <text x="600" y="413" text-anchor="middle" font-size="11" fill="#ddd">Public Switched Telephone Network</text>

  <!-- E911 flow (left) -->
  <rect x="60" y="260" width="320" height="180" rx="12" fill="#C00000" stroke="#770000" stroke-width="2"/>
  <text x="220" y="288" text-anchor="middle" font-size="14" fill="white" font-weight="bold">E911 Requirements</text>
  <text x="220" y="312" text-anchor="middle" font-size="12" fill="#FFD0D0" font-weight="bold">Kari's Law (2018):</text>
  <text x="220" y="330" text-anchor="middle" font-size="11" fill="white">Direct 911 dial — no prefix required</text>
  <text x="220" y="348" text-anchor="middle" font-size="11" fill="white">Notification to security desk on dial</text>
  <text x="220" y="370" text-anchor="middle" font-size="12" fill="#FFD0D0" font-weight="bold">Ray Baum's Act (2018):</text>
  <text x="220" y="388" text-anchor="middle" font-size="11" fill="white">Dispatchable location — floor/room/workstation</text>
  <text x="220" y="406" text-anchor="middle" font-size="11" fill="white">LIS + ELIN config per location + remote worker</text>
  <text x="220" y="424" text-anchor="middle" font-size="11" fill="#FFB0B0">Test each location before go-live · Document results</text>

  <!-- PSAP -->
  <circle cx="1090" cy="400" r="70" fill="#C55A11"/>
  <text x="1090" y="390" text-anchor="middle" font-size="12" fill="white" font-weight="bold">PSAP</text>
  <text x="1090" y="408" text-anchor="middle" font-size="11" fill="white">Public Safety</text>
  <text x="1090" y="424" text-anchor="middle" font-size="11" fill="white">Answering Point</text>

  <!-- LIS -->
  <rect x="840" y="260" width="220" height="100" rx="10" fill="#7030A0" stroke="#451D63" stroke-width="2"/>
  <text x="950" y="285" text-anchor="middle" font-size="13" fill="white" font-weight="bold">LIS / ELIN</text>
  <text x="950" y="305" text-anchor="middle" font-size="11" fill="white">Location Information Service</text>
  <text x="950" y="323" text-anchor="middle" font-size="11" fill="#ddc">maps device → dispatchable</text>
  <text x="950" y="341" text-anchor="middle" font-size="11" fill="#ddc">location at each office</text>

  <!-- Arrows -->
  <line x1="380" y1="320" x2="430" y2="300" stroke="#1F3864" stroke-width="2" marker-end="url(#arrf)"/>
  <line x1="600" y1="320" x2="600" y2="370" stroke="#1F3864" stroke-width="2" marker-end="url(#arrf)"/>
  <line x1="840" y1="310" x2="770" y2="310" stroke="#7030A0" stroke-width="2" marker-end="url(#arrf)"/>
  <line x1="1060" y1="380" x2="1020" y2="420" stroke="#C55A11" stroke-width="2" marker-end="url(#arrf)"/>
  <line x1="720" y1="395" x2="840" y2="395" stroke="#888" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="780" y="390" text-anchor="middle" font-size="10" fill="#555">911 call</text>

  <!-- Number porting note -->
  <rect x="60" y="480" width="500" height="60" rx="8" fill="#EBF3FF" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="310" y="505" text-anchor="middle" font-size="13" fill="#1F3864" font-weight="bold">Legacy PBX Migration: Port in geographic tranches</text>
  <text x="310" y="525" text-anchor="middle" font-size="11" fill="#555">Parallel operation during cutover · Hunt groups → Teams Call Queues · Fax lines handled separately</text>

  <!-- GCC boundary note -->
  <rect x="630" y="480" width="510" height="60" rx="8" fill="#F0FFF0" stroke="#375623" stroke-width="1.5"/>
  <text x="885" y="505" text-anchor="middle" font-size="13" fill="#375623" font-weight="bold">Recording Compliance</text>
  <text x="885" y="525" text-anchor="middle" font-size="11" fill="#555">Teams recording → GCC-boundary storage · Third-party compliance recording must be GCC-verified</text>

  <text x="600" y="590" text-anchor="middle" font-size="12" fill="#888">47 CFR §9.4 · 47 CFR Part 9 · FCC rules · NENA i3 standard · NIST SP 800-53 Rev 5 SA-9 / SC-7</text>
</svg>
