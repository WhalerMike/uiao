<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="1200" height="680" fill="#FFFFFF"/>
  <defs>
    <radialGradient id="hub3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E75B6"/>
      <stop offset="100%" stop-color="#1F3864"/>
    </radialGradient>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2E75B6"/>
    </marker>
  </defs>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">One SD-WAN Investment: Two Voice Platforms</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#555">Amazon Connect + Teams Phone — identical network requirements, single solution</text>

  <!-- Central SD-WAN hub -->
  <circle cx="600" cy="350" r="110" fill="url(#hub3)"/>
  <text x="600" y="332" text-anchor="middle" font-size="16" fill="white" font-weight="bold">SD-WAN</text>
  <text x="600" y="352" text-anchor="middle" font-size="13" fill="#acd">Local Breakout</text>
  <text x="600" y="370" text-anchor="middle" font-size="13" fill="#acd">DSCP EF Steering</text>
  <text x="600" y="388" text-anchor="middle" font-size="13" fill="#acd">Active-Active Multipath</text>
  <text x="600" y="405" text-anchor="middle" font-size="11" fill="#88aacc">FEC on lossy paths</text>

  <!-- Amazon Connect node (top-left) -->
  <rect x="60" y="90" width="240" height="160" rx="12" fill="#1F3864" stroke="#13223E" stroke-width="2"/>
  <text x="180" y="120" text-anchor="middle" font-size="15" fill="white" font-weight="bold">Amazon Connect</text>
  <text x="180" y="140" text-anchor="middle" font-size="12" fill="#C55A11">AWS .com (authorized exception)</text>
  <text x="180" y="162" text-anchor="middle" font-size="11" fill="#aaa">• N8NN national contact center</text>
  <text x="180" y="178" text-anchor="middle" font-size="11" fill="#aaa">• WebRTC softphone browser</text>
  <text x="180" y="194" text-anchor="middle" font-size="11" fill="#aaa">• Contact Lens AI analytics</text>
  <text x="180" y="212" text-anchor="middle" font-size="11" fill="#aaa">• Amazon Q agent assist</text>
  <text x="180" y="232" text-anchor="middle" font-size="13" fill="#C55A11" font-weight="bold">DSCP EF · RTP/SRTP · ≤75 ms</text>

  <!-- Teams Phone node (top-right) -->
  <rect x="900" y="90" width="240" height="160" rx="12" fill="#375623" stroke="#223515" stroke-width="2"/>
  <text x="1020" y="120" text-anchor="middle" font-size="15" fill="white" font-weight="bold">Teams Phone</text>
  <text x="1020" y="140" text-anchor="middle" font-size="12" fill="#afc">GCC Moderate</text>
  <text x="1020" y="162" text-anchor="middle" font-size="11" fill="#ddd">• Legacy PBX replacement</text>
  <text x="1020" y="178" text-anchor="middle" font-size="11" fill="#ddd">• Unified voice + meetings</text>
  <text x="1020" y="194" text-anchor="middle" font-size="11" fill="#ddd">• Direct Routing SBC / Calling Plans</text>
  <text x="1020" y="212" text-anchor="middle" font-size="11" fill="#ddd">• E911 / Kari's Law compliant</text>
  <text x="1020" y="232" text-anchor="middle" font-size="13" fill="#afc" font-weight="bold">DSCP EF · RTP/SRTP · ≤75 ms</text>

  <!-- Hybrid Agent node (bottom-center) -->
  <rect x="440" y="530" width="320" height="100" rx="12" fill="#7030A0" stroke="#451D63" stroke-width="2"/>
  <text x="600" y="558" text-anchor="middle" font-size="15" fill="white" font-weight="bold">Hybrid Agent Workstation</text>
  <text x="600" y="578" text-anchor="middle" font-size="12" fill="#dda">Connect call + Teams call simultaneous</text>
  <text x="600" y="596" text-anchor="middle" font-size="12" fill="#dda">2 × DSCP EF streams = ~200 Kbps reserved</text>
  <text x="600" y="614" text-anchor="middle" font-size="11" fill="#cca">Headset + browser config required</text>

  <!-- Citizen node (far left) -->
  <circle cx="80" cy="380" r="60" fill="#C55A11"/>
  <text x="80" y="373" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Citizen</text>
  <text x="80" y="391" text-anchor="middle" font-size="12" fill="white">N8NN</text>
  <text x="80" y="408" text-anchor="middle" font-size="11" fill="#FFD0A0">toll-free</text>

  <!-- PSTN node (far right) -->
  <circle cx="1120" cy="380" r="60" fill="#2E75B6"/>
  <text x="1120" y="373" text-anchor="middle" font-size="13" fill="white" font-weight="bold">PSTN</text>
  <text x="1120" y="391" text-anchor="middle" font-size="12" fill="white">SBC</text>
  <text x="1120" y="408" text-anchor="middle" font-size="11" fill="#C0E0FF">Direct Routing</text>

  <!-- Connect lines -->
  <line x1="300" y1="180" x2="490" y2="310" stroke="#C55A11" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arr3)"/>
  <line x1="900" y1="180" x2="710" y2="310" stroke="#375623" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arr3)"/>
  <line x1="600" y1="460" x2="600" y2="530" stroke="#7030A0" stroke-width="2.5" marker-end="url(#arr3)"/>
  <line x1="140" y1="380" x2="180" y2="320" stroke="#C55A11" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="1060" y1="380" x2="1020" y2="320" stroke="#2E75B6" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- Network requirement equality callout -->
  <rect x="350" y="270" width="500" height="36" rx="6" fill="#EBF3FF" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="600" y="293" text-anchor="middle" font-size="13" fill="#1F3864" font-weight="bold">Both require: &lt;75 ms network · &lt;30 ms jitter · &lt;1% loss · DSCP EF</text>

  <text x="600" y="656" text-anchor="middle" font-size="12" fill="#888">One SD-WAN deployment at each field office serves both platforms simultaneously — no duplication of investment</text>
</svg>
