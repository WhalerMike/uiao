<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <defs>
    </defs>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">Packet-Layer vs. Application-Aware Networking</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#555">What the network sees — and the policy question that changes everything</text>

  <!-- LEFT: Old packet view -->
  <rect x="20" y="90" width="555" height="490" rx="12" fill="#FFF5F5" stroke="#C00000" stroke-width="2"/>
  <text x="297" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#C00000">Packet-Layer Network</text>
  <text x="297" y="138" text-anchor="middle" font-size="12" fill="#555">"Current federal standard"</text>

  <!-- Packet icon -->
  <rect x="110" y="160" width="175" height="100" rx="8" fill="#F2F2F2" stroke="#888" stroke-width="1.5"/>
  <text x="197" y="188" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">What the firewall sees:</text>
  <text x="197" y="208" text-anchor="middle" font-size="12" fill="#1F3864">Source: 10.2.0.47</text>
  <text x="197" y="226" text-anchor="middle" font-size="12" fill="#1F3864">Dest: 52.108.8.0</text>
  <text x="197" y="244" text-anchor="middle" font-size="12" fill="#1F3864">Port: 443 / TCP</text>

  <text x="297" y="290" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">Policy question:</text>
  <rect x="80" y="300" width="430" height="50" rx="6" fill="#FFF0F0" stroke="#C00000" stroke-width="1"/>
  <text x="295" y="326" text-anchor="middle" font-size="14" fill="#C00000" font-weight="bold">"Should this IP reach this port?"</text>
  <text x="295" y="342" text-anchor="middle" font-size="11" fill="#888">Answer: IF source in 10.2.0.0/24 AND port 443 → ALLOW</text>

  <!-- What it CANNOT answer -->
  <text x="297" y="380" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">Cannot answer:</text>
  <text x="297" y="402" text-anchor="middle" font-size="12" fill="#C00000">✗ Who is the user?</text>
  <text x="297" y="422" text-anchor="middle" font-size="12" fill="#C00000">✗ Is the device managed and compliant?</text>
  <text x="297" y="442" text-anchor="middle" font-size="12" fill="#C00000">✗ Which application? (both show port 443)</text>
  <text x="297" y="462" text-anchor="middle" font-size="12" fill="#C00000">✗ Is this authorized by role?</text>
  <text x="297" y="482" text-anchor="middle" font-size="12" fill="#C00000">✗ Is behavioral pattern normal?</text>
  <text x="297" y="502" text-anchor="middle" font-size="12" fill="#C00000">✗ What data is being accessed?</text>
  <text x="297" y="524" text-anchor="middle" font-size="11" fill="#888">Cannot satisfy AC-4 · SC-7 · SI-4 · AU-12 · CA-7</text>

  <!-- RIGHT: AAN view -->
  <rect x="625" y="90" width="555" height="490" rx="12" fill="#F0FFF0" stroke="#375623" stroke-width="2"/>
  <text x="902" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#375623">Application-Aware Network</text>
  <text x="902" y="138" text-anchor="middle" font-size="12" fill="#555">"Zero Trust + FedRAMP 20x target"</text>

  <!-- Transaction icon -->
  <rect x="650" y="155" width="505" height="130" rx="8" fill="#F2F2F2" stroke="#375623" stroke-width="1.5"/>
  <text x="902" y="178" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">What the AAN sees:</text>
  <text x="902" y="198" text-anchor="middle" font-size="11" fill="#1F3864">User: <tspan fill="#375623" font-weight="bold">john.doe@agency.gov (Entra verified)</tspan></text>
  <text x="902" y="218" text-anchor="middle" font-size="11" fill="#1F3864">Device: <tspan fill="#375623" font-weight="bold">managed gov laptop, compliant posture</tspan></text>
  <text x="902" y="238" text-anchor="middle" font-size="11" fill="#1F3864">App: <tspan fill="#375623" font-weight="bold">Microsoft Teams (not personal cloud storage)</tspan></text>
  <text x="902" y="258" text-anchor="middle" font-size="11" fill="#1F3864">Data: <tspan fill="#375623" font-weight="bold">SharePoint doc, Internal classification</tspan></text>
  <text x="902" y="278" text-anchor="middle" font-size="11" fill="#1F3864">Context: <tspan fill="#375623" font-weight="bold">normal work hours, office location</tspan></text>

  <text x="902" y="320" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">Policy question:</text>
  <rect x="640" y="328" width="525" height="65" rx="6" fill="#E0F0E0" stroke="#375623" stroke-width="1"/>
  <text x="902" y="348" text-anchor="middle" font-size="13" fill="#375623" font-weight="bold">"Should this user, on this device, from this location,</text>
  <text x="902" y="368" text-anchor="middle" font-size="13" fill="#375623" font-weight="bold">using this app, access this specific data right now?"</text>
  <text x="902" y="384" text-anchor="middle" font-size="10" fill="#888">The question that maps to mission, compliance, and program integrity</text>

  <!-- What it CAN answer -->
  <text x="902" y="420" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">Can answer AND enforce:</text>
  <text x="902" y="442" text-anchor="middle" font-size="12" fill="#375623">✓ Allow Teams, block personal Dropbox — same port 443</text>
  <text x="902" y="462" text-anchor="middle" font-size="12" fill="#375623">✓ Per-user, per-device, per-app, per-session policy</text>
  <text x="902" y="482" text-anchor="middle" font-size="12" fill="#375623">✓ Full audit trail: user, device, app, action, data, time</text>
  <text x="902" y="502" text-anchor="middle" font-size="12" fill="#375623">✓ Behavioral anomaly detection</text>
  <text x="902" y="522" text-anchor="middle" font-size="11" fill="#375623">✓ Satisfies AC-4 · SC-7 · SI-4 · AU-12 · CA-7</text>

  <text x="600" y="606" text-anchor="middle" font-size="12" fill="#888">AAN = SD-WAN (transport layer) + SASE (delivery architecture) · NIST SP 800-207 · OMB M-22-09 §4 · TIC 3.0 Branch Office / Remote User</text>
</svg>
