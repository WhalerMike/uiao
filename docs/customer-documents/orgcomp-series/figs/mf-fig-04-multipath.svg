<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1F3864"/>
    </marker>
  </defs>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">SD-WAN Active-Active Multipath</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#4A5A6A">Continuous measurement · per-DSCP steering · FEC · active-active — not just a DIA pipe</text>

  <!-- Branch SD-WAN edge -->
  <rect x="60" y="270" width="180" height="100" rx="10" fill="#1F3864" stroke="#0F1F35" stroke-width="2"/>
  <text x="150" y="302" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Branch</text>
  <text x="150" y="320" text-anchor="middle" font-size="12" fill="#DCE4EC">SD-WAN Edge</text>
  <text x="150" y="340" text-anchor="middle" font-size="11" fill="#FFFFFF">sequence #</text>
  <text x="150" y="356" text-anchor="middle" font-size="11" fill="#FFFFFF">distribute packets</text>

  <!-- 4 paths -->
  <!-- MPLS -->
  <rect x="380" y="110" width="180" height="80" rx="8" fill="#1F3864" stroke="#0F1F35" stroke-width="2"/>
  <text x="470" y="138" text-anchor="middle" font-size="13" fill="white" font-weight="bold">MPLS</text>
  <text x="470" y="156" text-anchor="middle" font-size="11" fill="#DCE4EC">Private circuit</text>
  <text x="470" y="174" text-anchor="middle" font-size="11" fill="#FFFFFF">22 ms · 0% loss · low jitter</text>
  <!-- DIA -->
  <rect x="380" y="230" width="180" height="80" rx="8" fill="#2E75B6" stroke="#1B4E7A" stroke-width="2"/>
  <text x="470" y="258" text-anchor="middle" font-size="13" fill="white" font-weight="bold">DIA Broadband</text>
  <text x="470" y="276" text-anchor="middle" font-size="11" fill="white">Local internet</text>
  <text x="470" y="294" text-anchor="middle" font-size="11" fill="#FFFFFF">21 ms · 0.1% loss</text>
  <!-- 5G -->
  <rect x="380" y="350" width="180" height="80" rx="8" fill="#375623" stroke="#1F3114" stroke-width="2"/>
  <text x="470" y="378" text-anchor="middle" font-size="13" fill="white" font-weight="bold">5G MEC</text>
  <text x="470" y="396" text-anchor="middle" font-size="11" fill="white">Local breakout</text>
  <text x="470" y="414" text-anchor="middle" font-size="11" fill="#FFFFFF">8 ms · 0.3% loss</text>
  <!-- LEO -->
  <rect x="380" y="470" width="180" height="80" rx="8" fill="#7030A0" stroke="#4A1F6B" stroke-width="2"/>
  <text x="470" y="498" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Starlink LEO</text>
  <text x="470" y="516" text-anchor="middle" font-size="11" fill="white">Vacuum path</text>
  <text x="470" y="534" text-anchor="middle" font-size="11" fill="#FFFFFF">28 ms · 0.4% loss</text>

  <!-- Arrows branch → paths -->
  <line x1="240" y1="300" x2="380" y2="150" stroke="#1F3864" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="240" y1="310" x2="380" y2="270" stroke="#2E75B6" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="240" y1="320" x2="380" y2="390" stroke="#375623" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="240" y1="330" x2="380" y2="490" stroke="#7030A0" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Resequencing buffer -->
  <rect x="700" y="240" width="200" height="160" rx="10" fill="#C55A11" stroke="#8A3D0C" stroke-width="2"/>
  <text x="800" y="268" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Resequencing</text>
  <text x="800" y="286" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Buffer</text>
  <text x="800" y="312" text-anchor="middle" font-size="11" fill="#FFFFFF">holds early arrivals</text>
  <text x="800" y="330" text-anchor="middle" font-size="11" fill="#FFFFFF">delivers in-order</text>
  <text x="800" y="350" text-anchor="middle" font-size="11" fill="#FFFFFF">app sees 1 stream</text>
  <text x="800" y="370" text-anchor="middle" font-size="11" fill="#FFFFFF">with no gaps</text>
  <text x="800" y="390" text-anchor="middle" font-size="11" fill="white" font-weight="bold">FEC fills lost pkts</text>

  <!-- Arrows paths → buffer -->
  <line x1="560" y1="150" x2="700" y2="310" stroke="#1F3864" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="560" y1="270" x2="700" y2="320" stroke="#2E75B6" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="560" y1="390" x2="700" y2="350" stroke="#375623" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="560" y1="510" x2="700" y2="380" stroke="#7030A0" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Application -->
  <rect x="1000" y="270" width="160" height="118" rx="10" fill="#375623" stroke="#1F3114" stroke-width="2"/>
  <text x="1080" y="302" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Application</text>
  <text x="1080" y="322" text-anchor="middle" font-size="11" fill="white">sees one ordered</text>
  <text x="1080" y="340" text-anchor="middle" font-size="11" fill="white">byte stream</text>
  <text x="1080" y="358" text-anchor="middle" font-size="11" fill="#FFFFFF">no awareness of</text>
  <text x="1080" y="374" text-anchor="middle" font-size="11" fill="#FFFFFF">4 physical paths</text>
  <line x1="900" y1="320" x2="1000" y2="320" stroke="#375623" stroke-width="2.5" marker-end="url(#arr4)"/>

  <!-- Aggregate bandwidth callout -->
  <rect x="630" y="470" width="380" height="80" rx="8" fill="#EBF3FF" stroke="#2E75B6" stroke-width="2"/>
  <text x="820" y="498" text-anchor="middle" font-size="13" fill="#1F3864" font-weight="bold">Effective Aggregate Bandwidth</text>
  <text x="820" y="518" text-anchor="middle" font-size="12" fill="#1F3864">50 + 100 + 20 + 40 Mbps → ~160–190 Mbps bonded</text>
  <text x="820" y="536" text-anchor="middle" font-size="11" fill="#4A5A6A">75–90% bonding efficiency · active-active, not load-balanced</text>

  <!-- DIA-only failure note -->
  <rect x="60" y="490" width="280" height="80" rx="8" fill="#FFF5F5" stroke="#C00000" stroke-width="2"/>
  <text x="200" y="518" text-anchor="middle" font-size="13" fill="#C00000" font-weight="bold">Active-Passive (DIA only)</text>
  <text x="200" y="538" text-anchor="middle" font-size="11" fill="#4A5A6A">Path fails → 30–90 sec switchover</text>
  <text x="200" y="558" text-anchor="middle" font-size="11" fill="#4A5A6A">Kerberos times out · users call helpdesk</text>

  <text x="600" y="608" text-anchor="middle" font-size="12" fill="#4A5A6A">SD-WAN sub-second path measurement · per-DSCP steering (Teams audio EF, video AF41, sharing AF21) · IEEE 1588 PTP clock sync</text>
</svg>
