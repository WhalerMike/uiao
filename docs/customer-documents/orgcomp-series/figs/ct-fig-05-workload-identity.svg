<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrTeal" markerWidth="9" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#C0392B"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="640" y="42" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#0D1B2E" text-anchor="middle">The Workload Identity Progression</text>
  <text x="640" y="72" font-family="Arial, sans-serif" font-size="17" fill="#6B7A8D" text-anchor="middle">From stored passwords to federated attestation — each stage removes a class of stored secret</text>

  <!-- ===== Stage headers ===== -->
  <rect x="40" y="100" width="280" height="44" rx="6" fill="#0D1B2E"/>
  <text x="180" y="128" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1 — Service Account</text>
  <rect x="350" y="100" width="280" height="44" rx="6" fill="#0D1B2E"/>
  <text x="490" y="128" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2 — Service Principal</text>
  <rect x="660" y="100" width="280" height="44" rx="6" fill="#0D1B2E"/>
  <text x="800" y="128" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3 — Managed Identity</text>
  <rect x="970" y="100" width="280" height="44" rx="6" fill="#0D1B2E"/>
  <text x="1110" y="120" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4 — Workload Identity</text>
  <text x="1110" y="139" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Federation</text>

  <!-- stage-to-stage arrows -->
  <line x1="324" y1="122" x2="346" y2="122" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>
  <line x1="634" y1="122" x2="656" y2="122" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>
  <line x1="944" y1="122" x2="966" y2="122" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>

  <!-- ===== Stage 1: password in configuration ===== -->
  <rect x="60" y="170" width="240" height="120" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="180" y="198" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Application</text>
  <rect x="72" y="212" width="216" height="64" rx="5" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="180" y="236" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A" text-anchor="middle">connection string:</text>
  <text x="180" y="262" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#C0392B" text-anchor="middle">Password=P@ssw0rd!</text>

  <rect x="60" y="356" width="110" height="64" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="115" y="394" font-family="Arial, sans-serif" font-size="16" fill="#0D1B2E" text-anchor="middle">Scripts</text>
  <rect x="190" y="356" width="110" height="64" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="245" y="394" font-family="Arial, sans-serif" font-size="16" fill="#0D1B2E" text-anchor="middle">Repositories</text>

  <line x1="112" y1="294" x2="104" y2="350" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line x1="248" y1="294" x2="256" y2="350" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="180" y="330" font-family="Arial, sans-serif" font-size="16" fill="#C0392B" text-anchor="middle">password copied</text>

  <!-- ===== Stage 2: client secret + repository warning ===== -->
  <rect x="370" y="170" width="240" height="120" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="490" y="198" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Service Principal</text>
  <rect x="382" y="212" width="216" height="64" rx="5" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="490" y="238" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle">client secret</text>
  <text x="490" y="262" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A" text-anchor="middle">held by the application</text>

  <line x1="490" y1="292" x2="490" y2="350" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrRed)"/>
  <rect x="370" y="356" width="240" height="64" rx="6" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="490" y="394" font-family="Arial, sans-serif" font-size="16" fill="#0D1B2E" text-anchor="middle">Code Repository</text>
  <polygon points="395,348 425,348 410,321" fill="#D4A017"/>
  <text x="410" y="343" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="506" y="340" font-family="Arial, sans-serif" font-size="16" fill="#C0392B">leaked secret risk</text>

  <!-- ===== Stage 3: managed identity ===== -->
  <rect x="680" y="170" width="240" height="120" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="800" y="198" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Application</text>
  <rect x="722" y="216" width="156" height="36" rx="5" fill="none" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="800" y="240" font-family="Arial, sans-serif" font-size="16" fill="#1E8C8C" text-anchor="middle">no secret held</text>
  <text x="800" y="276" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#1E8C8C" text-anchor="middle">no credential in its custody</text>

  <rect x="665" y="380" width="270" height="100" rx="8" fill="#0D1B2E"/>
  <text x="800" y="410" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Cloud Platform</text>
  <text x="800" y="436" font-family="Arial, sans-serif" font-size="16" fill="#EAF1FB" text-anchor="middle">attests the workload, then</text>
  <text x="800" y="458" font-family="Arial, sans-serif" font-size="16" fill="#EAF1FB" text-anchor="middle">issues short-lived tokens</text>

  <line x1="800" y1="376" x2="800" y2="298" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>
  <text x="812" y="330" font-family="Arial, sans-serif" font-size="16" fill="#1E8C8C">short-lived token</text>
  <text x="812" y="352" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D">(foundation layer)</text>

  <!-- ===== Stage 4: workload identity federation ===== -->
  <rect x="980" y="170" width="125" height="110" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1042" y="212" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Platform A</text>
  <text x="1042" y="238" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D" text-anchor="middle">workload</text>
  <rect x="1145" y="170" width="125" height="110" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1207" y="212" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Platform B</text>
  <text x="1207" y="238" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D" text-anchor="middle">resource</text>

  <line x1="1125" y1="158" x2="1125" y2="292" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="7,6"/>
  <line x1="1125" y1="322" x2="1125" y2="475" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="7,6"/>
  <text x="1125" y="496" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5A" text-anchor="middle">trust boundary</text>

  <line x1="1105" y1="255" x2="1141" y2="255" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrTeal)"/>
  <text x="1110" y="312" font-family="Arial, sans-serif" font-size="16" fill="#33414F" text-anchor="middle">platforms exchange OIDC tokens</text>

  <!-- signed trust-policy document icon -->
  <rect x="985" y="336" width="90" height="110" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <polygon points="1051,336 1075,360 1075,336" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <line x1="1000" y1="378" x2="1060" y2="378" stroke="#E3E8EF" stroke-width="2"/>
  <line x1="1000" y1="396" x2="1060" y2="396" stroke="#E3E8EF" stroke-width="2"/>
  <line x1="1000" y1="414" x2="1060" y2="414" stroke="#E3E8EF" stroke-width="2"/>
  <circle cx="1052" cy="428" r="11" fill="#1E8C8C"/>
  <path d="M1046,428 l4,5 l9,-10" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="1030" y="470" font-family="Arial, sans-serif" font-size="16" fill="#33414F" text-anchor="middle">signed trust policy</text>

  <text x="1180" y="380" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#1E8C8C" text-anchor="middle">no secret ever</text>
  <text x="1180" y="402" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#1E8C8C" text-anchor="middle">crosses the</text>
  <text x="1180" y="424" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#1E8C8C" text-anchor="middle">boundary</text>

  <!-- ===== Progress bar: what still exists to steal ===== -->
  <text x="40" y="556" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D">What still exists to steal:</text>
  <rect x="40" y="568" width="280" height="48" rx="6" fill="#C0392B"/>
  <text x="180" y="598" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">secret everywhere</text>
  <rect x="350" y="568" width="280" height="48" rx="6" fill="#D4A017"/>
  <text x="490" y="598" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">secret somewhere</text>
  <rect x="660" y="568" width="280" height="48" rx="6" fill="#1E8C8C"/>
  <text x="800" y="598" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">secret nowhere</text>
  <rect x="970" y="568" width="280" height="48" rx="6" fill="#1E8C8C"/>
  <text x="1110" y="598" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">secret nowhere on either side</text>

  <!-- bottom note -->
  <text x="640" y="668" font-family="Arial, sans-serif" font-size="17" font-style="italic" fill="#6B7A8D" text-anchor="middle">Short-lived, automatically issued, attested credentials bound to the workload's verified identity —</text>
  <text x="640" y="692" font-family="Arial, sans-serif" font-size="17" font-style="italic" fill="#6B7A8D" text-anchor="middle">there is no secret to leak because there is no secret.</text>
</svg>
