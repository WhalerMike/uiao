<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="arw-teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#1A9E8F"/></marker>
  </defs>

  <text x="800" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#1F3A5F">Teams Telephony Catalog &amp; Teams SCuBA Drift (Vol IX Book 04)</text>
  <text x="800" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5A6B7B">Governed telephony operations + Teams secure-baseline drift into the Vol VII loop</text>
  <text x="49" y="150" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5" fill="#1F3A5F">PART 1 — GOVERNED TELEPHONY CATALOG (CHANGE-CONTROLLED)</text>
  <rect x="49" y="172" width="359" height="150" rx="9" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <text x="228.5" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F">
  <tspan x="228.5" dy="0.0">Number assign / release</tspan>
  </text>
  <text x="228.5" y="239.85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="228.5" dy="0.0">Reconciled to the number inventory</tspan>
  </text>
  <rect x="430" y="172" width="359" height="150" rx="9" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <text x="609.5" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F">
  <tspan x="609.5" dy="0.0">Calling policy / dial plan</tspan>
  </text>
  <text x="609.5" y="239.85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="609.5" dy="0.0">Least-privilege calling scope</tspan>
  </text>
  <rect x="811" y="172" width="359" height="150" rx="9" fill="#FFFFFF" stroke="#D4860B" stroke-width="2"/>
  <text x="990.5" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#8A6210">
  <tspan x="990.5" dy="0.0">E911 address validation</tspan>
  </text>
  <text x="990.5" y="239.85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="990.5" dy="0.0">Validated on assignment — life-safety gate</tspan>
  </text>
  <rect x="1192" y="172" width="359" height="150" rx="9" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <text x="1371.5" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F">
  <tspan x="1371.5" dy="0.0">Voice-routing / SBC</tspan>
  </text>
  <text x="1371.5" y="239.85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#2A2A2A">
  <tspan x="1371.5" dy="0.0">Boundary-affecting; SoD-gated</tspan>
  </text>
  <text x="49" y="402" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5" fill="#1F3A5F">PART 2 — TEAMS SCUBA DRIFT (EXTENDS THE VOL VII M365 LOOP)</text>
  <rect x="49" y="424" width="620" height="150" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M59,424 h600 a10,10 0 0 1 10,10 v68 h-620 v-68 a10,10 0 0 1 10,-10 z" fill="#1F3A5F"/>
  <text x="359.0" y="451" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">CM-6</text>
  <text x="359.0" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="359.0" dy="0.0">Teams SCuBA baseline drift</tspan>
  </text>
  <text x="359.0" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#2A2A2A">
  <tspan x="359.0" dy="0.0">A new Teams secure-baseline fail becomes a typed</tspan>
  <tspan x="359.0" dy="24.7">ServiceNow Change/Incident against the Teams service CI</tspan>
  </text>
  <line x1="669" y1="499" x2="820" y2="499" stroke="#1A9E8F" stroke-width="3" marker-end="url(#arw-teal)"/>
  <rect x="820" y="424" width="731" height="150" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M830,424 h711 a10,10 0 0 1 10,10 v68 h-731 v-68 a10,10 0 0 1 10,-10 z" fill="#1A9E8F"/>
  <text x="1185.5" y="451" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#A9C0DC">REUSE</text>
  <text x="1185.5" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">
  <tspan x="1185.5" dy="0.0">Vol VII Book 02 M365 loop</tspan>
  </text>
  <text x="1185.5" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#2A2A2A">
  <tspan x="1185.5" dy="0.0">test → detect drift → raise → actuate native → close with</tspan>
  <tspan x="1185.5" dy="24.7">evidence — one loop, one more surface</tspan>
  </text>
  <rect x="49" y="626" width="1502" height="150" rx="10" fill="#F4F7FA" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="800" y="668" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1A9E8F">E911 is a gate, not a form field</text>
  <text x="800" y="706" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#2A2A2A">
  <tspan x="800" dy="0.0">A phone whose registered emergency address is wrong sends responders to the wrong place.</tspan>
  <tspan x="800" dy="27.3">The catalog validates the emergency address at assignment time. All telephony changes are</tspan>
  <tspan x="800" dy="27.3">change-controlled and audited (CM-3 / AU-2).</tspan>
  </text>
    <rect x="49" y="828" width="1502" height="54" rx="8" fill="#F4F7FA" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="800" y="861" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1F3A5F">Telephony architecture is Vol I Book 06; this book governs its operation. FedRAMP Moderate &amp; Microsoft GCC Moderate only.</text>
</svg>
