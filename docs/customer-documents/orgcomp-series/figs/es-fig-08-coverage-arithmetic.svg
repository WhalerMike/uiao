, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">024</text><rect x="921" y="372" width="48" height="54" rx="5" fill="#8A929B"/><text x="945.0" y="404.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">025</text><rect x="982" y="372" width="48" height="54" rx="5" fill="#8A929B"/><text x="1006.0" y="404.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">026</text><rect x="1043" y="372" width="48" height="54" rx="5" fill="#8A929B"/><text x="1067.0" y="404.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">027</text><rect x="1104" y="372" width="48" height="54" rx="5" fill="#8A929B"/><text x="1128.0" y="404.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">028</text><rect x="1165" y="372" width="48" height="54" rx="5" fill="#8A929B"/><text x="1189.0" y="404.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">029</text><path d="M67,438 L67,445 L420,445 L420,438" fill="none" stroke="#6B7A8D" stroke-width="1.5"/><text x="243.5" y="464" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#33414F">SCR — supply chain</text><text x="243.5" y="482" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7A8D">SBOM·VDR·VEX · slot-06</text><text x="243.5" y="499" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7A8D">Vol IV Bks 02–03</text><path d="M433,438 L433,445 L725,445 L725,438" fill="none" stroke="#6B7A8D" stroke-width="1.5"/><text x="579.0" y="464" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#33414F">PIY — privacy</text><text x="579.0" y="482" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7A8D">data-flow maps · slot-05</text><text x="579.0" y="499" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7A8D">Vol IV Bk 04</text><path d="M738,438 L738,445 L786,445 L786,438" fill="none" stroke="#6B7A8D" stroke-width="1.5"/><text x="762.0" y="464" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#33414F">CED-RAT</text><text x="762.0" y="482" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7A8D">training · slot-08</text><text x="762.0" y="499" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7A8D">Vol IV Bk 05</text><path d="M799,438 L799,445 L1213,445 L1213,438" fill="none" stroke="#6B7A8D" stroke-width="1.5"/><text x="1006.0" y="464" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#33414F">CED / INR / RPL — incident &amp; continuity</text><text x="1006.0" y="482" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7A8D">playbooks + DR · slots 04 &amp; 07</text><text x="1006.0" y="499" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7A8D">Vol III Bk 06 · Vol IV Bk 01</text><text x="640" y="548" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" letter-spacing="1.5">STEP 3 OF 3 — THE BOTTOM LINE</text><rect x="90" y="562" width="1100" height="56" rx="10" fill="#EAF1FB" stroke="#D4A017" stroke-width="4"/><text x="640" y="599" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#0D1B2E">A conformance tool measures drift from an intended state — it cannot author one.</text><text x="640" y="648" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#6B7A8D">Run against an environment with no architecture, it measures drift from nothing. Remove the substrate and the 19 slot-bound rules become unevaluable.</text><text x="64" y="700" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A94A0">OrgComp — Executive Summary · CSI Team Draft — Internal, Not for Public Distribution · Date Code 2026-07-13 ET</text><text x="1216" y="700" text-anchor="end" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A94A0">16</text></svg>
