<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif;background:#FFFFFF;"><rect width="1280" height="720" fill="#FFFFFF"/><text x="64" y="74" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#0D1B2E">The Coverage Arithmetic — 10 of 29</text><text x="64" y="110" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#6B7A8D">The 29 FedRAMP 20x CR26 KSI rules, by what closes them — all verdicts self-assessed pending 3PAO validation</text><text x="120" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="bold" fill="#1E8C8C">10</text><text x="180" y="208" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#33414F">of 29 KSI rules attestable</text><text x="180" y="230" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#33414F">by conformance tooling alone</text><text x="180" y="256" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#6B7A8D">M365 GCC tenant configuration —</text><text x="180" y="276" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#6B7A8D">ScubaGear + ScubaDrift dispositions</text><text x="700" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="bold" fill="#8A929B">19</text><text x="760" y="208" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#33414F">of 29 evaluable only because</text><text x="760" y="230" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#33414F">the architecture exists</text><text x="760" y="256" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#6B7A8D">Bound to evidence slots</text><text x="760" y="276" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#6B7A8D">built by Vols I–IV</text><rect x="64" y="288" width="100" height="58" rx="6" fill="#1E8C8C"/><text x="114.0" y="324.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">001</text><rect x="181" y="288" width="100" height="58" rx="6" fill="#1E8C8C"/><text x="231.0" y="324.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">002</text><rect x="298" y="288" width="100" height="58" rx="6" fill="#1E8C8C"/><text x="348.0" y="324.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">003</text><rect x="415" y="288" width="100" height="58" rx="6" fill="#1E8C8C"/><text x="465.0" y="324.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">004</text><rect x="532" y="288" width="100" height="58" rx="6" fill="#1E8C8C"/><text x="582.0" y="324.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">005</text><rect x="649" y="288" width="100" height="58" rx="6" fill="#1E8C8C"/><text x="699.0" y="324.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">006</text><rect x="766" y="288" width="100" height="58" rx="6" fill="#1E8C8C"/><text x="816.0" y="324.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue'