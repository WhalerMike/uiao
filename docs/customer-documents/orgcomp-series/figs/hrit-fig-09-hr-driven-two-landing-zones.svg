<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="p9-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#1E8C8C"/></marker>
    <marker id="p9-navy" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#0D1B2E"/></marker>
  </defs>
  <text x="70" y="48" font-size="13" font-weight="bold" letter-spacing="4" fill="#1E8C8C">MICROSOFT'S NAME FOR THIS PATTERN</text>
  <text x="70" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#0D1B2E">&#8220;HR-driven provisioning&#8221;: one feed, two landing zones</text>

  <!-- HR source -->
  <rect x="70" y="160" width="300" height="140" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
  <text x="94" y="196" font-size="16" font-weight="bold" fill="#0D1B2E">HR system of record</text>
  <text x="94" y="222" font-size="12.5" fill="#5A6B7C">connectors (Workday, SuccessFactors)</text>
  <text x="94" y="240" font-size="12.5" fill="#5A6B7C">or API-driven (Graph bulkUpload,</text>
  <text x="94" y="258" font-size="12.5" fill="#5A6B7C">SCIM 2.0)</text>

  <line x1="370" y1="230" x2="438" y2="230" stroke="#1E8C8C" stroke-width="3" marker-end="url(#p9-teal)"/>

  <!-- Entra provisioning service -->
  <rect x="440" y="160" width="340" height="140" rx="10" fill="#0D1B2E"/>
  <text x="464" y="200" font-size="17" font-weight="bold" fill="#FFFFFF">Entra provisioning service</text>
  <text x="464" y="228" font-size="12.5" fill="#D7E3F0">scoping filters &#183; expression-based</text>
  <text x="464" y="246" font-size="12.5" fill="#D7E3F0">attribute mappings &#183; first-party, GA,</text>
  <text x="464" y="264" font-size="12.5" fill="#D7E3F0">documented</text>

  <!-- arrows to landing zones -->
  <line x1="780" y1="200" x2="866" y2="164" stroke="#1E8C8C" stroke-width="3" marker-end="url(#p9-teal)"/>
  <line x1="780" y1="262" x2="866" y2="330" stroke="#0D1B2E" stroke-width="3" marker-end="url(#p9-navy)"/>

  <!-- landing zone: Entra ID cloud -->
  <rect x="870" y="112" width="340" height="130" rx="10" fill="#E8F4F1" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="894" y="148" font-size="16" font-weight="bold" fill="#1E8C8C">Entra ID (cloud)</text>
  <text x="894" y="174" font-size="12.5" fill="#33414F">direct write: users, attributes, manager</text>
  <text x="894" y="192" font-size="12.5" fill="#33414F">relationship, employeeOrgData</text>

  <!-- landing zone: on-prem AD -->
  <rect x="870" y="292" width="340" height="140" rx="10" fill="#EAF1FB" stroke="#C9D4E0" stroke-width="1.5"/>
  <text x="894" y="328" font-size="16" font-weight="bold" fill="#0D1B2E">On-prem Active Directory</text>
  <text x="894" y="354" font-size="12.5" fill="#33414F">via Entra provisioning agents (3 for HA)</text>
  <text x="894" y="372" font-size="12.5" fill="#33414F">writing to AD DS — OU placement,</text>
  <text x="894" y="390" font-size="12.5" fill="#33414F">manager DN, enable/disable</text>

  <!-- why it matters callout -->
  <rect x="70" y="470" width="1140" height="160" rx="10" fill="#EAF1FB" stroke="#C9D4E0" stroke-width="1"/>
  <text x="94" y="504" font-size="14.5" fill="#33414F"><tspan font-weight="bold" fill="#0D1B2E">Why this matters for agency awareness:</tspan> the architecture this book describes is not custom middleware glue —</text>
  <text x="94" y="528" font-size="14.5" fill="#33414F">Microsoft ships it as a first-party, generally available feature family called HR-driven provisioning. The same HR feed can</text>
  <text x="94" y="552" font-size="14.5" fill="#33414F">land in cloud Entra ID, in on-premises Active Directory, or both simultaneously during directory coexistence. The two</text>
  <text x="94" y="576" font-size="14.5" fill="#33414F">landing zones absorb organizational structure very differently — the comparison that follows shows how.</text>

  <line x1="70" y1="668" x2="1210" y2="668" stroke="#E3E8EF" stroke-width="1"/>
  <text x="70" y="694" font-size="12" fill="#5A5A5A">Vol I Book 04 — OPM HRIT and the Identity &amp; Organizational SSOT &#183; FedRAMP Moderate &#183; Date Code 2026-07-24 10:08 ET</text>
</svg>
