<svg width="900" height="480" viewBox="0 0 900 480"
     xmlns="http://www.w3.org/2000/svg" style="background:#FFFFFF;font-family:Arial,sans-serif">

  <rect width="900" height="480" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="48" fill="#1F3864"/>
  <text x="450" y="22" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold">Mainframe Access Modernization: Token-Fronted RACF via Gateway and PassTicket</text>
  <text x="450" y="40" text-anchor="middle" fill="#F2F2F2" font-size="10">The translation happens at the boundary. CICS and IMS never learn what OAuth is.</text>

  <!-- LEFT: Native access -->
  <rect x="10" y="54" width="415" height="26" rx="4" fill="#C00000"/>
  <text x="217" y="72" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">Native Access (3270 / RACF / SAF)</text>

  <!-- Terminal icon -->
  <rect x="30" y="92" width="60" height="42" rx="4" fill="#1F3864" stroke="#2E75B6" stroke-width="2"/>
  <rect x="36" y="98" width="48" height="26" fill="#00CC00" opacity="0.75"/>
  <text x="60" y="147" text-anchor="middle" fill="#1F3864" font-size="9">3270 terminal</text>

  <!-- Arrow to region -->
  <line x1="95" y1="113" x2="150" y2="113" stroke="#1F3864" stroke-width="2"/>
  <polygon points="147,108 157,113 147,118" fill="#1F3864"/>

  <!-- CICS/IMS region -->
  <rect x="160" y="90" width="130" height="46" rx="6" fill="#1F3864" stroke="#0F1F35" stroke-width="2"/>
  <text x="225" y="110" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">CICS / IMS region</text>
  <text x="225" y="125" text-anchor="middle" fill="#DCE4EC" font-size="9">RACF identity resolved</text>

  <text x="120" y="160" text-anchor="middle" fill="#1F3864" font-size="10" font-style="italic">Session- and region-bound</text>

  <!-- Failure modes list -->
  <rect x="20" y="180" width="395" height="195" rx="6" fill="#F2F2F2" stroke="#C00000" stroke-width="1.5"/>
  <text x="217" y="203" text-anchor="middle" fill="#C00000" font-size="11" font-weight="bold">Constraints</text>

  <text x="35" y="225" fill="#C00000" font-size="12">&#x2715;</text>
  <text x="52" y="225" fill="#1F3864" font-size="11">No native OAuth 2.0 / OIDC support</text>

  <text x="35" y="247" fill="#C00000" font-size="12">&#x2715;</text>
  <text x="52" y="247" fill="#1F3864" font-size="11">Identity tied to an active RACF session</text>

  <text x="35" y="269" fill="#C00000" font-size="12">&#x2715;</text>
  <text x="52" y="269" fill="#1F3864" font-size="11">Pseudo-conversational transactions hold</text>
  <text x="52" y="283" fill="#1F3864" font-size="11">state across multiple screen round-trips</text>

  <text x="35" y="305" fill="#C00000" font-size="12">&#x2715;</text>
  <text x="52" y="305" fill="#1F3864" font-size="11">A shared technical ID at the gateway would</text>
  <text x="52" y="319" fill="#1F3864" font-size="11">erase the real end user from the audit trail</text>

  <text x="35" y="341" fill="#C00000" font-size="12">&#x2715;</text>
  <text x="52" y="341" fill="#1F3864" font-size="11">Refactoring conversational state is a</text>
  <text x="52" y="355" fill="#1F3864" font-size="11">prerequisite &#x2014; not a side effect &#x2014; of tokens</text>

  <!-- CENTER arrow -->
  <rect x="428" y="150" width="44" height="60" rx="6" fill="#C55A11"/>
  <polygon points="428,180 472,180 450,202" fill="#C55A11"/>
  <text x="450" y="222" text-anchor="middle" fill="#1F3864" font-size="8" font-weight="bold">Gateway</text>
  <text x="450" y="234" text-anchor="middle" fill="#1F3864" font-size="8" font-weight="bold">Boundary</text>

  <!-- RIGHT: Token-fronted -->
  <rect x="475" y="54" width="415" height="26" rx="4" fill="#375623"/>
  <text x="682" y="72" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">Token-Fronted Access (API Gateway / z/OS Connect)</text>

  <!-- Token icon -->
  <rect x="500" y="88" width="90" height="56" rx="6" fill="#1F3864" stroke="#375623" stroke-width="2"/>
  <polygon points="500,88 590,88 545,116" fill="#2E75B6" opacity="0.6"/>
  <text x="545" y="132" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">OAuth</text>

  <line x1="595" y1="113" x2="640" y2="113" stroke="#375623" stroke-width="2"/>
  <polygon points="637,108 647,113 637,118" fill="#375623"/>

  <!-- Gateway box -->
  <rect x="650" y="88" width="130" height="56" rx="6" fill="#375623" stroke="#1F3114" stroke-width="2"/>
  <text x="715" y="108" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">z/OS Connect</text>
  <text x="715" y="122" text-anchor="middle" fill="#DFF0DF" font-size="8">Validates token &#x2192;</text>
  <text x="715" y="134" text-anchor="middle" fill="#DFF0DF" font-size="8">derives PassTicket</text>

  <text x="682" y="162" text-anchor="middle" fill="#1F3864" font-size="10" font-style="italic">Stateless per call &#x2014; for supported transactions</text>

  <!-- Bridge panel -->
  <rect x="665" y="176" width="215" height="90" rx="6" fill="#F2F2F2" stroke="#375623" stroke-width="1.5"/>
  <text x="772" y="196" text-anchor="middle" fill="#375623" font-size="10" font-weight="bold">What Bridges to RACF</text>
  <text x="680" y="212" fill="#1F3864" font-size="10">&#x25B8; PassTicket (one-time, no static pw)</text>
  <text x="680" y="228" fill="#1F3864" font-size="10">&#x25B8; Identity Propagation (RACF ICRX)</text>
  <text x="680" y="244" fill="#1F3864" font-size="10">&#x25B8; Real user preserved in SMF audit</text>
  <text x="680" y="260" fill="#1F3864" font-size="10">&#x25B8; CICS/IMS internals unchanged</text>

  <!-- Benefits list -->
  <rect x="485" y="283" width="395" height="92" rx="6" fill="#F2F2F2" stroke="#375623" stroke-width="1.5"/>
  <text x="682" y="303" text-anchor="middle" fill="#375623" font-size="11" font-weight="bold">Recommendation</text>

  <text x="500" y="322" fill="#375623" font-size="12">&#x2713;</text>
  <text x="517" y="322" fill="#1F3864" font-size="11">Sequence by transaction type: discrete, atomic,</text>
  <text x="517" y="336" fill="#1F3864" font-size="11">read-mostly calls first</text>

  <text x="500" y="354" fill="#375623" font-size="12">&#x2713;</text>
  <text x="517" y="354" fill="#1F3864" font-size="11">Conversational transactions: refactor toward</text>
  <text x="517" y="368" fill="#1F3864" font-size="11">statelessness before token-fronting (Principle 5)</text>

  <!-- Bottom callout -->
  <rect x="20" y="392" width="860" height="70" rx="8" fill="#EBF3FF" stroke="#1F3864" stroke-width="2"/>
  <text x="450" y="415" text-anchor="middle" fill="#1F3864" font-weight="bold" font-size="12">The same move as Principle 3, one layer further back</text>
  <text x="450" y="437" text-anchor="middle" fill="#1F3864" font-size="10">A signed, verifiable token assertion replaces a session-bound handshake &#x2014; at the mainframe</text>
  <text x="450" y="453" text-anchor="middle" fill="#1F3864" font-size="10">boundary instead of the network edge. Validate PassTicket/ICRX configuration against your z/OS estate first.</text>

</svg>
