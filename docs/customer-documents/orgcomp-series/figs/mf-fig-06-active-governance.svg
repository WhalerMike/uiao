<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <defs>
    </defs>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">Active Governance: Control Plane Over Data Planes</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#555">The actuation ladder · federal ceiling · gated actuation as the AO-signable posture</text>

  <!-- Governance Control Plane (top) -->
  <rect x="300" y="100" width="600" height="80" rx="12" fill="#1F3864" stroke="#13223E" stroke-width="2"/>
  <text x="600" y="132" text-anchor="middle" font-size="16" fill="white" font-weight="bold">Governance Control Plane</text>
  <text x="600" y="154" text-anchor="middle" font-size="12" fill="#aaa">holds desired state · observes actual state · classifies drift · reconciles toward intent</text>
  <text x="600" y="170" text-anchor="middle" font-size="11" fill="#8888aa">NEVER becomes the in-path enforcer — that was AD's fatal conflation</text>

  <!-- Data planes below -->
  <text x="600" y="215" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">Data Planes (runtime — governed, not replaced)</text>
  <rect x="60" y="230" width="180" height="65" rx="8" fill="#2E75B6" stroke="#1C4870" stroke-width="2"/>
  <text x="150" y="257" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Entra ID</text>
  <text x="150" y="275" text-anchor="middle" font-size="10" fill="#acd">authenticates at runtime</text>
  <rect x="270" y="230" width="180" height="65" rx="8" fill="#375623" stroke="#223515" stroke-width="2"/>
  <text x="360" y="257" text-anchor="middle" font-size="12" fill="white" font-weight="bold">SD-WAN/SASE</text>
  <text x="360" y="275" text-anchor="middle" font-size="10" fill="#adc">routes + enforces at network</text>
  <rect x="480" y="230" width="180" height="65" rx="8" fill="#C55A11" stroke="#7A370A" stroke-width="2"/>
  <text x="570" y="257" text-anchor="middle" font-size="12" fill="white" font-weight="bold">InfoBlox DDI</text>
  <text x="570" y="275" text-anchor="middle" font-size="10" fill="#FFD0A0">resolves names + inventory</text>
  <rect x="690" y="230" width="180" height="65" rx="8" fill="#7030A0" stroke="#451D63" stroke-width="2"/>
  <text x="780" y="257" text-anchor="middle" font-size="12" fill="white" font-weight="bold">MDM/EDR</text>
  <text x="780" y="275" text-anchor="middle" font-size="10" fill="#ddc">device posture assessment</text>
  <rect x="900" y="230" width="180" height="65" rx="8" fill="#C00000" stroke="#770000" stroke-width="2"/>
  <text x="990" y="257" text-anchor="middle" font-size="12" fill="white" font-weight="bold">SIEM</text>
  <text x="990" y="275" text-anchor="middle" font-size="10" fill="#FFB0B0">logs + monitors + detects</text>

  <!-- Arrows: control plane → data planes -->
  <line x1="450" y1="180" x2="150" y2="230" stroke="#1F3864" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="480" y1="180" x2="360" y2="230" stroke="#1F3864" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="570" y1="180" x2="570" y2="230" stroke="#1F3864" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="660" y1="180" x2="780" y2="230" stroke="#1F3864" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="750" y1="180" x2="990" y2="230" stroke="#1F3864" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Actuation ladder -->
  <text x="600" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3864">Actuation Ladder — CISA ZT Maturity Progression</text>

  <!-- Ladder rows -->
  <rect x="60" y="360" width="1080" height="46" rx="5" fill="#F2F2F2" stroke="#DDD"/>
  <text x="180" y="381" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">Traditional</text>
  <text x="180" y="396" text-anchor="middle" font-size="10" fill="#888">Record + observe only</text>
  <text x="600" y="388" text-anchor="middle" font-size="11" fill="#555">Desired state documented · actual state collected manually · no automation</text>

  <rect x="60" y="414" width="1080" height="46" rx="5" fill="#EBF3FF" stroke="#2E75B6" stroke-width="1"/>
  <text x="180" y="435" text-anchor="middle" font-size="11" fill="#2E75B6" font-weight="bold">Initial</text>
  <text x="180" y="450" text-anchor="middle" font-size="10" fill="#2E75B6">Observe + advise</text>
  <text x="600" y="442" text-anchor="middle" font-size="11" fill="#1F3864">Automated drift detection · corrective actions surfaced to operators · no automated writes</text>

  <rect x="60" y="468" width="1080" height="56" rx="5" fill="#375623" stroke="#223515" stroke-width="2"/>
  <text x="180" y="489" text-anchor="middle" font-size="12" fill="white" font-weight="bold">ADVANCED</text>
  <text x="180" y="508" text-anchor="middle" font-size="11" fill="#afc">Gated actuation</text>
  <text x="180" y="522" text-anchor="middle" font-size="10" fill="#afc">Federal ceiling</text>
  <text x="600" y="492" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Governance generates corrective action → human approves → dry-run → production execute</text>
  <text x="600" y="514" text-anchor="middle" font-size="11" fill="#afc">Federal ConMon standard posture · AO-signable · high-blast-radius operations ALWAYS gated</text>
  <!-- Star indicator -->
  <text x="1070" y="498" text-anchor="middle" font-size="20" fill="#C55A11">★</text>
  <text x="1070" y="516" text-anchor="middle" font-size="10" fill="#afc">target now</text>

  <rect x="60" y="532" width="1080" height="46" rx="5" fill="#7030A0" stroke="#451D63" stroke-width="2"/>
  <text x="180" y="553" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Optimal</text>
  <text x="180" y="568" text-anchor="middle" font-size="10" fill="#ddc">Autonomous (guardrails)</text>
  <text x="600" y="560" text-anchor="middle" font-size="11" fill="white">Low-blast-radius ops closed automatically · high-blast-radius permanently gated</text>

  <!-- FedRAMP 20x note -->
  <rect x="200" y="595" width="800" height="30" rx="6" fill="#EBF3FF" stroke="#1F3864" stroke-width="1"/>
  <text x="600" y="615" text-anchor="middle" font-size="12" fill="#1F3864" font-weight="bold">FedRAMP 20x: continuous · automated · machine-readable evidence — not assembled manually for annual assessments</text>
</svg>
