  <text x="280" y="290" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#1F3864">via Graph API</text>
  <text x="280" y="306" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#1F3864">Kills all active</text>
  <text x="280" y="322" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#1F3864">refresh tokens</text>
  <text x="280" y="337" text-anchor="middle" font-family="Arial" font-size="8" fill="#1F7391" font-style="italic">~15 sec execution</text>

