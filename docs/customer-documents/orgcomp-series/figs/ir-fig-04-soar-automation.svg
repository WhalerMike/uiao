  <text x="116" y="322" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#1F3864">on next auth attempt</text>
  <text x="116" y="337" text-anchor="middle" font-family="Arial" font-size="8" fill="#1F7391" font-style="italic">~10 sec execution</text>

