  <text x="350" y="542" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="bold" fill="#FFFFFF">AUDIT TRAIL — Every Logic App Execution Logged</text>
  <text x="60" y="562" font-family="Arial" font-size="9.5" fill="#F2F2F2">• Sentinel comment added to incident: actions taken, timestamps, approver identity</text>
  <text x="60" y="578" font-family="Arial" font-size="9.5" fill="#F2F2F2">• Logic App run history: 90 days in Log Analytics workspace (AU-11)</text>
  <text x="60" y="593" font-family="Arial" font-size="9.5" fill="#F2F2F2">• ServiceNow ticket updated at each step with Logic App run ID</text>

  <!-- Footer -->
