  <text x="444" y="306" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#1F3864">Intune API →</text>
  <text x="444" y="322" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#1F3864">CA block triggered</text>
  <text x="444" y="337" text-anchor="middle" font-family="Arial" font-size="8" fill="#1F7391" font-style="italic">~20 sec execution</text>

