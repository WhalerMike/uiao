  <rect x="42" y="609" width="14" height="14" fill="#1F7391" rx="2"/>
  <text x="62" y="620" font-family="Arial" font-size="9" fill="#595959">Fully automated (no approval)</text>
  <rect x="220" y="609" width="14" height="14" fill="#C55A11" rx="2"/>
  <text x="240" y="620" font-family="Arial" font-size="9" fill="#595959">Human-in-the-loop required</text>
  <text x="430" y="620" font-family="Arial" font-size="9" fill="#595959">Azure Government boundary | FedRAMP Moderate | Controls: IR-4, IR-6, AU-11</text>
