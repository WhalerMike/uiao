  <!-- Box 1 -->
  <rect x="40" y="234" width="152" height="110" rx="6" fill="#DEEAF1" stroke="#1F7391" stroke-width="2"/>
  <rect x="40" y="234" width="152" height="28" rx="6" fill="#1F7391"/>
  <rect x="40" y="250" width="152" height="12" fill="#1F7391"/>
  <text x="116" y="252" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="bold" fill="#FFFFFF">① Disable Entra Account</text>
  <text x="116" y="276" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#1F3864">Set accountEnabled:</text>
  <text x="116" y="290" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#1F3864">false via Graph API</text>
