  <text x="795" y="469" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">4hr timeout →</text>
  <text x="795" y="484" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">escalate to CISO</text>

