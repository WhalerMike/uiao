  <text x="450" y="96" text-anchor="middle" font-family="Arial" font-size="10" fill="#FFFFFF">High-severity Identity Alert fired</text>
  <text x="450" y="108" text-anchor="middle" font-family="Arial" font-size="9" fill="#FFFFFF">(confidence ≥ 85, entity-enriched)</text>

  <line x1="450" y1="110" x2="450" y2="132" stroke="#1F3864" stroke-width="2" marker-end="url(#arr)"/>

