  <line x1="795" y1="494" x2="795" y2="540" stroke="#C55A11" stroke-width="1.5" marker-end="url(#arro)"/>
  <rect x="720" y="540" width="150" height="52" rx="6" fill="#1F3864" stroke="#1F3864"/>
  <text x="795" y="561" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="bold" fill="#FFFFFF">Destructive Action</text>
  <text x="795" y="576" text-anchor="middle" font-family="Arial" font-size="9" fill="#FFFFFF">Executed or Rejected</text>
  <text x="795" y="591" text-anchor="middle" font-family="Arial" font-size="8.5" fill="#D6A228">Logged in Sentinel</text>

  <!-- Audit trail box -->
