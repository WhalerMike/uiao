<svg width="900" height="480" viewBox="0 0 900 480"
     xmlns="http://www.w3.org/2000/svg" style="background:#FFFFFF;font-family:Arial,sans-serif">

  <rect width="900" height="480" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="48" fill="#1F3864"/>
  <text x="450" y="31" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="bold">Session vs. Token Identity: The Architecture Shift Zero Trust Requires</text>

  <!-- LEFT: Session-Based -->
  <rect x="10" y="54" width="415" height="26" rx="4" fill="#C00000"/>
  <text x="217" y="72" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">Session-Based Identity (Active Directory / Kerberos)</text>

  <!-- VPN tunnel icon -->
  <rect x="30" y="88" width="180" height="60" rx="25" fill="#1F3864" stroke="#2E75B6" stroke-width="3"/>
  <text x="120" y="104" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">VPN Tunnel</text>
  <!-- Kerberos ticket inside -->
  <rect x="45" y="114" width="150" height="26" rx="5" fill="#2E75B6" opacity="0.7"/>
  <text x="120" y="131" text-anchor="middle" fill="#FFFFFF" font-size="9">Kerberos Ticket</text>
  <text x="120" y="166" text-anchor="middle" fill="#1F3864" font-size="10" font-style="italic">Stateful channel required</text>

  <!-- Failure modes list -->
  <rect x="20" y="175" width="395" height="200" rx="6" fill="#F2F2F2" stroke="#C00000" stroke-width="1.5"/>
  <text x="217" y="198" text-anchor="middle" fill="#C00000" font-size="11" font-weight="bold">Failure Modes</text>

  <text x="35" y="220" fill="#C00000" font-size="12">&#x2715;</text>
  <text x="52" y="220" fill="#1F3864" font-size="11">Breaks when WAN path changes</text>

  <text x="35" y="242" fill="#C00000" font-size="12">&#x2715;</text>
  <text x="52" y="242" fill="#1F3864" font-size="11">Times out at 5ms RTT limit</text>

  <text x="35" y="264" fill="#C00000" font-size="12">&#x2715;</text>
  <text x="52" y="264" fill="#1F3864" font-size="11">Opaque to audit logs</text>

  <text x="35" y="286" fill="#C00000" font-size="12">&#x2715;</text>
  <text x="52" y="286" fill="#1F3864" font-size="11">Fails across cloud boundaries</text>

  <text x="35" y="308" fill="#C00000" font-size="12">&#x2715;</text>
  <text x="52" y="308" fill="#1F3864" font-size="11">Compromised endpoint = full</text>
  <text x="52" y="322" fill="#1F3864" font-size="11">network trust (lateral movement)</text>

  <text x="35" y="344" fill="#C00000" font-size="12">&#x2715;</text>
  <text x="52" y="344" fill="#1F3864" font-size="11">NTLM: BOD 25-01 mandates elimination</text>
  <text x="52" y="358" fill="#1F3864" font-size="11">by Sept 2025</text>

  <!-- CENTER arrow -->
  <rect x="428" y="218" width="44" height="60" rx="6" fill="#C55A11"/>
  <polygon points="428,248 472,248 450,270" fill="#C55A11"/>
  <text x="450" y="290" text-anchor="middle" fill="#1F3864" font-size="8" font-weight="bold">Modernization</text>
  <text x="450" y="302" text-anchor="middle" fill="#1F3864" font-size="8" font-weight="bold">Path</text>
  <text x="450" y="314" text-anchor="middle" fill="#1F3864" font-size="8">BOD 25-01</text>
  <text x="450" y="326" text-anchor="middle" fill="#1F3864" font-size="8">OMB M-22-09</text>

  <!-- RIGHT: Token-Based -->
  <rect x="475" y="54" width="415" height="26" rx="4" fill="#375623"/>
  <text x="682" y="72" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold">Token-Based Identity (OAuth 2.0 / OIDC / Entra ID)</text>

  <!-- JWT envelope icon -->
  <rect x="550" y="88" width="100" height="60" rx="6" fill="#1F3864" stroke="#375623" stroke-width="2"/>
  <!-- envelope flap -->
  <polygon points="550,88 650,88 600,118" fill="#2E75B6" opacity="0.6"/>
  <!-- lock icon -->
  <rect x="582" y="110" width="36" height="28" rx="4" fill="#C55A11"/>
  <rect x="590" y="104" width="20" height="12" rx="10" fill="none" stroke="#C55A11" stroke-width="3"/>
  <text x="600" y="128" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">JWT</text>
  <text x="585" y="162" text-anchor="middle" fill="#1F3864" font-size="9" font-style="italic">Travels HTTPS &#xB7; any path</text>

  <!-- Claims panel -->
  <rect x="665" y="88" width="215" height="90" rx="6" fill="#F2F2F2" stroke="#375623" stroke-width="1.5"/>
  <text x="772" y="108" text-anchor="middle" fill="#375623" font-size="10" font-weight="bold">Token Claims</text>
  <text x="680" y="124" fill="#1F3864" font-size="10">&#x25B8; User identity</text>
  <text x="680" y="140" fill="#1F3864" font-size="10">&#x25B8; Device compliance</text>
  <text x="680" y="156" fill="#1F3864" font-size="10">&#x25B8; Authorization scope</text>
  <text x="680" y="172" fill="#1F3864" font-size="10">&#x25B8; Cryptographic signature</text>

  <!-- Benefits list -->
  <rect x="485" y="195" width="395" height="220" rx="6" fill="#F2F2F2" stroke="#375623" stroke-width="1.5"/>
  <text x="682" y="218" text-anchor="middle" fill="#375623" font-size="11" font-weight="bold">Benefits</text>

  <text x="500" y="240" fill="#375623" font-size="12">&#x2713;</text>
  <text x="517" y="240" fill="#1F3864" font-size="11">Works across any cloud boundary</text>

  <text x="500" y="262" fill="#375623" font-size="12">&#x2713;</text>
  <text x="517" y="262" fill="#1F3864" font-size="11">Stateless &#x2014; no DC roundtrip needed</text>

  <text x="500" y="284" fill="#375623" font-size="12">&#x2713;</text>
  <text x="517" y="284" fill="#1F3864" font-size="11">Full audit telemetry in every token</text>

  <text x="500" y="306" fill="#375623" font-size="12">&#x2713;</text>
  <text x="517" y="306" fill="#1F3864" font-size="11">Per-app minimum privilege enforced</text>

  <text x="500" y="328" fill="#375623" font-size="12">&#x2713;</text>
  <text x="517" y="328" fill="#1F3864" font-size="11">Compromised endpoint = bounded</text>
  <text x="517" y="342" fill="#1F3864" font-size="11">blast radius (not full network)</text>

  <text x="500" y="366" fill="#375623" font-size="12">&#x2713;</text>
  <text x="517" y="366" fill="#1F3864" font-size="11">Compliant: BOD 25-01, OMB M-22-09,</text>
  <text x="517" y="380" fill="#1F3864" font-size="11">CISA Zero Trust Maturity Model</text>

  <text x="500" y="400" fill="#375623" font-size="12">&#x2713;</text>
  <text x="517" y="400" fill="#1F3864" font-size="11">FedRAMP 20x KSI-ready evidence stream</text>

</svg>
