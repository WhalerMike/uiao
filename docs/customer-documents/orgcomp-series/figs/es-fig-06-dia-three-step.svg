<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif;background:#FFFFFF;"><rect width="1280" height="720" fill="#FFFFFF"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8A929B"/></marker></defs><text x="64" y="78" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" font-style="normal" fill="#0D1B2E">DIA Is a Pipe — The Three-Step Argument</text><text x="64" y="116" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="normal" font-style="normal" fill="#6B7A8D">Direct Internet Access solves the latency problem; the governance stack satisfies the controls</text><rect x="90" y="175" width="430" height="180" rx="12" fill="#F4F6F8" stroke="#C9D2DC" stroke-width="1.5"/><text x="305.0" y="209" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" font-style="normal" fill="#6E7681">The stack that satisfies the controls</text><rect x="110" y="227" width="390" height="34" rx="5" fill="#9CCBC6"/><text x="305.0" y="249" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#FFFFFF">SD-WAN — IPsec overlay (SC-8)</text><rect x="110" y="269" width="390" height="34" rx="5" fill="#9CCBC6"/><text x="305.0" y="291" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#FFFFFF">SASE — SWG · CASB · FWaaS (SC-7, AC-4, SI-3)</text><rect x="110" y="311" width="390" height="34" rx="5" fill="#9CCBC6"/><text x="305.0" y="333" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#FFFFFF">TIC 3.0 — distributed enforcement point</text><line x1="305.0" y1="355" x2="305.0" y2="450" stroke="#8A929B" stroke-width="2" marker-end="url(#ar)"/><text x="317.0" y="425" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#6B7A8D">governs the pipe</text><rect x="70" y="470" width="170" height="92" rx="10" fill="#0D1B2E"/><text x="155.0" y="512" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#FFFFFF">Field office</text><text x="155.0" y="536" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#C9D2DC">western site</text><rect x="300" y="470.0" width="480" height="92.0" fill="#EAF1FB" stroke="#C9D2DC" stroke-width="1.5"/><ellipse cx="780" cy="516.0" rx="22" ry="46.0" fill="#EAF1FB" stroke="#C9D2DC" stroke-width="1.5"/><ellipse cx="300" cy="516.0" rx="22" ry="46.0" fill="#DCE6F4" stroke="#C9D2DC" stroke-width="1.5"/><text x="550.0" y="512.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#0D1B2E">DIA — Direct Internet Access</text><text x="550.0" y="538.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#33414F">a pipe: solves latency, nothing else</text><ellipse cx="900" cy="516.0" rx="82" ry="50.0" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.5"/><text x="900" y="522.0" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#0D1B2E">Internet</text><circle cx="590" cy="190" r="20" fill="#8A929B"/><text x="590" y="197" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#FFFFFF">1</text><text x="624" y="184" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#6E7681">What DIA solves: exactly one thing</text><text x="624" y="208" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#6B7A8D">The geographic hairpin. ITU-T G.114's 150 ms</text><text x="624" y="230" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#6B7A8D">budget is physics; local breakout is the only fix.</text><circle cx="590" cy="286" r="20" fill="#8A929B"/><text x="590" y="293" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#FFFFFF">2</text><text x="624" y="280" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#6E7681">What DIA satisfies: no protection control</text><text x="624" y="304" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#6B7A8D">Flow enforcement, boundary, confidentiality,</text><text x="624" y="326" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#6B7A8D">inspection, audit — all satisfied by the stack.</text><rect x="572" y="348" width="660" height="82" rx="10" fill="none" stroke="#D4A017" stroke-width="3.5"/><circle cx="590" cy="382" r="20" fill="#C0392B"/><text x="590" y="389" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#FFFFFF">3</text><text x="624" y="376" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#C0392B">What bare DIA breaks: the boundary</text><text x="624" y="400" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#6B7A8D">A field office on ungoverned DIA has lost SC-7</text><text x="624" y="422" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#6B7A8D">protection relative to the MPLS hairpin.</text><rect x="90" y="600" width="1100" height="70" rx="10" fill="#F7E2DE"/><text x="120" y="634" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" font-style="normal" fill="#C0392B">STEP 3 OF 3 — Ungoverned DIA is a step backward.</text><text x="120" y="660" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="normal" font-style="normal" fill="#C0392B">From the assessor's chair, bare DIA is not modernization — it is a compliance regression with better latency.</text><text x="64" y="704" text-anchor="start" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#8A94A0">OrgComp — Executive Summary · CSI Team Draft — Internal, Not for Public Distribution · Date Code 2026-07-13 ET</text><text x="1216" y="704" text-anchor="end" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#8A94A0">10</text></svg>
