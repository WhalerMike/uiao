<svg viewBox="0 0 1200 710" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="1200" height="710" fill="#FFFFFF"/>
  <defs>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#1A9E8F"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#C0392B"/></marker>
  </defs>
  <text x="600" y="42" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F3A5F">Asymmetric Routing — Broken With Perfect Latency</text>
  <text x="600" y="68" text-anchor="middle" font-size="14" fill="#4A5A6A">The second session killer: the handshake fails even at sub-millisecond latency — and the overlay removes it structurally</text>

  <!-- Client -->
  <rect x="60" y="220" width="180" height="90" rx="10" fill="#1F3A5F"/>
  <text x="150" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Client</text>
  <text x="150" y="282" text-anchor="middle" font-size="12" fill="#DCE4EC">SYN out</text>

  <!-- Firewall A -->
  <rect x="400" y="110" width="230" height="90" rx="10" fill="#FFFFFF" stroke="#1A9E8F" stroke-width="2.5"/>
  <text x="515" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#0E5C5C">Stateful firewall A</text>
  <text x="515" y="172" text-anchor="middle" font-size="12" fill="#333">session entry created — OK</text>

  <!-- Server -->
  <rect x="880" y="220" width="200" height="90" rx="10" fill="#1F3A5F"/>
  <text x="980" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Server</text>
  <text x="980" y="282" text-anchor="middle" font-size="12" fill="#DCE4EC">SYN-ACK back</text>

  <!-- Firewall B -->
  <rect x="400" y="330" width="230" height="100" rx="10" fill="#FBEEEC" stroke="#C0392B" stroke-width="2.5"/>
  <text x="515" y="364" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">Stateful firewall B</text>
  <text x="515" y="388" text-anchor="middle" font-size="12" fill="#A02020">sees SYN-ACK, no session entry</text>
  <text x="515" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">DROPPED</text>

  <!-- outbound path -->
  <path d="M 240 250 L 400 165" stroke="#1A9E8F" stroke-width="3" fill="none" marker-end="url(#arrG)"/>
  <path d="M 630 155 L 880 240" stroke="#1A9E8F" stroke-width="3" fill="none" marker-end="url(#arrG)"/>
  <text x="300" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#0E5C5C">outbound path</text>

  <!-- return path -->
  <path d="M 880 290 L 630 370" stroke="#C0392B" stroke-width="3" stroke-dasharray="10,6" fill="none" marker-end="url(#arrR)"/>
  <path d="M 400 385 L 240 295" stroke="#C0392B" stroke-width="3" stroke-dasharray="10,6" fill="none" marker-end="url(#arrR)" opacity="0.35"/>
  <text x="800" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#C0392B">return path — different route</text>
  <text x="300" y="352" text-anchor="middle" font-size="11" fill="#A02020">never reaches the client</text>

  <!-- SD-WAN fix panel -->
  <rect x="790" y="470" width="350" height="130" rx="10" fill="#EAF6F4" stroke="#1A9E8F" stroke-width="2.5"/>
  <text x="965" y="500" text-anchor="middle" font-size="14" font-weight="bold" fill="#0E5C5C">The SD-WAN fix</text>
  <text x="965" y="524" text-anchor="middle" font-size="12" fill="#333">The overlay tunnel is ONE logical connection —</text>
  <text x="965" y="544" text-anchor="middle" font-size="12" fill="#333">both directions enter and exit the same edge device.</text>
  <text x="965" y="564" text-anchor="middle" font-size="12" font-weight="bold" fill="#0E5C5C">Asymmetry below the tunnel is structurally removed.</text>

  <!-- compound killers box -->
  <rect x="60" y="470" width="650" height="130" rx="10" fill="#F4F7FA" stroke="#1F3A5F" stroke-width="2.5"/>
  <text x="80" y="500" font-size="13" font-weight="bold" fill="#1F3A5F">Independent killers that compound.</text>
  <text x="80" y="524" font-size="12" fill="#333">Latency kills sessions by exceeding protocol timeouts. Asymmetric routing kills them by preventing the</text>
  <text x="80" y="544" font-size="12" fill="#333">TCP three-way handshake from completing at all — even with perfect sub-millisecond latency on both paths:</text>
  <text x="80" y="564" font-size="12" fill="#333">the stateful device on the return path sees a SYN-ACK with no session entry and drops it as unsolicited.</text>
  <text x="80" y="584" font-size="12" font-weight="bold" fill="#C0392B">In environments where both conditions exist simultaneously — the federal standard — they compound.</text>

  <text x="600" y="672" text-anchor="middle" font-size="12" fill="#4A5A6A">Source: OrgComp Vol I Book 05 — Network Modernization · Date Code 2026-07-28</text>
</svg>
