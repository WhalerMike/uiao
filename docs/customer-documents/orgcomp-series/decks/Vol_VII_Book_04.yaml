# AAN deck spec — Vol VII Book 04 (Control Attestation, Evidence & KSI).
# Scope: FedRAMP Moderate & Microsoft GCC Moderate only. Never cite High.
deck:
  title: "Control Attestation, Evidence & KSI"
  subtitle: "Vol VII Book 04 — from tracked task to assessed control: IRM control tests, POA&M, and the OSCAL/KSI feed"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOLUME VII"
  date_code: "2026-07-12 15:00 ET"
  journey:
    - "Map"
    - "Test"
    - "Gap"
    - "Emit"
  sources:
    oscal: "https://pages.nist.gov/OSCAL/"
    servicenow_irm: "https://www.servicenow.com/products/integrated-risk-management.html"

slides:
  - type: title
    notes: >
      Book 04 is the output stage of the coordination layer. Books 02 and 03 turn M365 and Azure
      control state into tracked work; this book turns the rolled-up result into assessed control state
      — the ServiceNow IRM/GRC control tests, POA&M items, and the OSCAL and FedRAMP 20x KSI evidence
      feed that Vol IV Book 06 and Vol VI Book 07 carry into the ATO package. The journey is Map, Test,
      Gap, Emit. GCC-Moderate boundary throughout.
    vendor_sources: ["oscal"]

  - type: section
    kicker: "PART ONE"
    title: "A closed task is hygiene; an assessed control is what an AO signs"
    callout: "Between the two sits attestation: the periodic test, the evidence it passed, the POA&M for what did not, and the machine-readable roll-up."
    callout_accent: navy
    notes: >
      Motivate the attestation stage. A continuous authorization runs on assessed control state, not on
      a once-a-year scramble. This book is the join between the coordination layer and the series'
      existing evidence spine — it feeds that spine, it does not replace it.

  - type: content
    kicker: "THE ATTESTATION MODEL"
    title: "Task stream to assessed control"
    layout: grid
    cards:
      - title: "Map (spine SSOT)"
        body: "Each control knows which M365/Azure tests attest it — a projection of orgcomp-compliance-spine.yml, not an independent authority."
        accent: navy
      - title: "Test (CA-2)"
        body: "A scheduled IRM control test reads the actioned posture roll-up and renders pass/fail/partial with evidence attached."
        accent: teal
      - title: "Gap (CA-5)"
        body: "Any fail or partial becomes a POA&M item — owner, milestone, closure evidence — linked to the remediation task that will close it."
        accent: amber
      - title: "Emit (CA-7)"
        body: "Assessed state and POA&M export as OSCAL and KSI evidence into the ConMon package."
        accent: navy
    callout:
      text: "The spine is the SSOT for the control-to-evidence binding; the IRM control map is a projection of it."
      accent: navy
    notes: >
      The four cards are the pipeline. Card two is why attestation here means something: the control
      test reads actioned posture — drift that became a task that became closure — so a passing control
      is backed by an owned, evidenced trail, not a point-in-time screenshot. That is the difference
      between CA-2 as an annual event and CA-2 as a standing indicator. Card one is the truth-vs-projection
      discipline again: if IRM and the spine disagree, the spine wins.
    vendor_sources: ["host repo: docs/customer-documents/orgcomp-series/orgcomp-compliance-spine.yml"]

  - type: build-sequence
    kicker: "THE ATTESTATION PIPELINE"
    title: "From binding to authorization package"
    notes: "Fallback notes if a step omits its own."
    steps:
      - label: "Map"
        sub: "control to tests"
        accent: navy
        detail: >
          The IRM control map binds each control to the M365/Azure tests and tasks that evidence it —
          a projection of the compliance spine.
        notes: "Step one: the binding, sourced from the spine SSOT so the attestation cannot diverge from the series map."
      - label: "Test"
        sub: "pass / fail / partial"
        accent: teal
        detail: >
          The scheduled control test reads the actioned posture roll-up plus spot evidence and renders
          an assessed result with the underlying evidence attached.
        notes: "Step two: assessed control state, backed by the actioned trail, not a hoped-for portal setting."
      - label: "Gap"
        sub: "POA&M"
        accent: amber
        detail: >
          Every fail or partial becomes a POA&M issue with a single owner, a milestone, and a required
          closure-evidence type, linked back to the Books 02–03 task that will close it.
        notes: "Step three: CA-5 as a living record joined to the operational work, not a quarterly spreadsheet reconciliation."
      - label: "Emit"
        sub: "OSCAL + KSI"
        accent: teal
        detail: >
          Assessed control state and POA&M export as OSCAL assessment-results and POA&M models, and each
          result maps to its KSI theme and emits into the KSI pipeline.
        notes: >
          Step four keeps ServiceNow the workflow hub, not the evidence lake: it contributes the
          workflow-and-attestation record into the evidence fabric via the same contract every native
          stack emits to. Coordination feeds truth; it does not become it.
    vendor_sources: ["oscal"]

  - type: table
    kicker: "AUTHORITIES CLOSED HERE"
    title: "The attestation closures"
    headers: ["Control", "Title", "Coordination mechanism"]
    rows:
      - cells: ["CA-2", "Control Assessments", "IRM control tests produce assessed control state"]
        accent: teal
      - cells: ["CA-5", "Plan of Action & Milestones", "POA&M as IRM issues with owner, milestone, evidence"]
      - cells: ["CA-7", "Continuous Monitoring", "Posture roll-up emitted as OSCAL/KSI into ConMon"]
        accent: teal
    callout:
      text: "An unattested control is a claim, not a control — these close it with an owned test, an owned gap, and a machine-readable emit."
      accent: amber
    notes: >
      Mirror the spine's generated rows. The honest limit to voice: an attestation is only as strong as
      the test behind it; test depth is co-owned with Vol VI Book 08. And the authoritative OSCAL SSP
      and the KSI score live downstream (Vol IV Book 06, Vol VI Book 07) — this book emits into them and
      must not fork a second authorization narrative. FedRAMP Moderate.
    vendor_sources: ["host repo: docs/customer-documents/orgcomp-series/orgcomp-compliance-spine.yml"]

  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "Assessed, evidenced, and in the package"
    layout: columns
    cards:
      - title: "Assessed"
        body: "Controls are tested against live actioned posture — CA-2 as a standing indicator."
        accent: teal
        status: "This book"
      - title: "Tracked"
        body: "Gaps are owned POA&M items joined to the operational tasks that close them."
        accent: navy
        status: "CA-5"
      - title: "Emitted"
        body: "OSCAL and KSI evidence flow to Vol IV Book 06 and Vol VI Book 07 for the ATO package."
        accent: navy
        status: "Vol IV / VI"
    callout:
      text: "Next: the deployable scoped app that carries the whole loop (Book 05)."
      accent: navy
    notes: >
      Close on continuous authorization as a discipline, not a feature: the emit is only continuous if
      the tests run on cadence and the POA&M is worked. Hand off to Book 05, the app that makes the loop
      real and importable.
