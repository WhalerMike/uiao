# AAN deck spec — Vol IX Book 02 (Landing Zone Front Door).
# Scope: FedRAMP Moderate & Microsoft GCC Moderate only. Never cite High.
deck:
  title: "Landing Zone Front Door"
  subtitle: "Vol IX Book 02 — the catalog request that drives change-controlled IaC and reconciles every allocation to the naming plane"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOLUME IX"
  date_code: "2026-07-12 15:00 ET"
  journey:
    - "Request"
    - "Approve"
    - "Apply"
    - "Reconcile"
  sources:
    tf_cpg: "https://www.servicenow.com/docs/bundle/zurich-it-operations-management/page/product/cloud-provisioning-governance/concept/cpg-landing-page.html"

slides:
  - type: title
    notes: >
      Book 02 puts a governed front door on landing-zone infrastructure-as-code. The IaC is a solved
      problem in this series (Vol VI Book 01); what is missing is the governed request that drives it —
      a module anyone can apply from a laptop is not change control, and an address block allocated
      outside the naming plane is a CM-8 gap the moment it exists. The journey is Request, Approve,
      Apply, Reconcile. GCC Moderate throughout.

  - type: section
    kicker: "PART ONE"
    title: "IaC without a front door is not change control"
    callout: "A Terraform module anyone can apply is a click-path with no approval trail — and an allocation that never reaches IPAM/DDI is shadow inventory the moment it exists."
    callout_accent: navy
    notes: >
      Motivate the front door. Volume VI proves landing zones expressed as reviewable source close
      CM-2/CM-3/CM-6. This book makes the invocation of that source governed — an approved, SoD-gated,
      evidenced provisioning event reconciled to the naming plane. The IaC is necessary; the governed
      front door is what makes it assessable.

  - type: build-sequence
    kicker: "THE PROVISIONING LOOP"
    title: "Catalog request to reconciled landing zone"
    notes: "Fallback notes if a step omits its own."
    steps:
      - label: "Request"
        sub: "typed variables"
        accent: navy
        detail: >
          A catalog item captures the landing-zone parameters (environment, size, address needs) as
          typed variables, not free text.
        notes: "Step one: the request is structured input the pipeline can act on, not a prose ticket."
      - label: "Approve / SoD"
        sub: "requester != approver"
        accent: teal
        detail: >
          The request routes through approval with separation of duties, and the CPG Terraform
          Connector runs a speculative plan the approver reviews before any state changes.
        notes: "Step two: the approver reads a real speculative plan, not a promise — fail fast on a bad change (CM-3/CM-5)."
      - label: "Apply"
        sub: "reviewed = deployed"
        accent: amber
        detail: >
          On approval, the change-controlled pipeline applies the reviewed source idempotently —
          deployed state equals reviewed source (CM-2).
        notes: "Step three: idempotent apply of reviewed source; the pipeline is the actuator, and the change record is real."
      - label: "Reconcile"
        sub: "to IPAM/DDI (CM-8)"
        accent: teal
        detail: >
          The address/subnet allocation is written to and reconciled with the authoritative IPAM/DDI
          record, then the validation gate closes the request with evidence.
        notes: >
          Step four is load-bearing: no landing zone stands up outside the naming plane. An allocation
          that never reaches IPAM/DDI is a CM-8 / BOD 23-01 finding; reconciliation is part of
          provisioning, not later clean-up.
    vendor_sources: ["tf_cpg"]

  - type: table
    kicker: "AUTHORITIES CLOSED HERE"
    title: "The landing-zone closures"
    headers: ["Control", "Title", "Mechanism"]
    rows:
      - cells: ["CM-2", "Baseline Configuration", "Catalog request drives change-controlled IaC — deployed = reviewed"]
        accent: teal
      - cells: ["CM-3", "Configuration Change Control", "Approval → speculative plan → apply → gate → close"]
      - cells: ["CM-8", "System Component Inventory", "Address/subnet reconciled to authoritative IPAM/DDI at provisioning time"]
        accent: teal
    callout:
      text: "This is the DDI ServiceNow app generalized — same connectors, same in-boundary MID, broader module scope."
      accent: navy
    notes: >
      Mirror the generated rows. Emphasize the reuse: the DDI app (Vol VIII Book 07) already implements
      this exact loop for DNS-backed subnet provisioning; this book extends the same records to full
      landing-zone provisioning. FedRAMP Moderate.
    vendor_sources: ["host repo: infoblox-ddi-book/servicenow-app/"]

  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "Provisioning that is governed and reconciled"
    layout: columns
    cards:
      - title: "Governed"
        body: "Every landing zone stood up through an approved, SoD-gated, evidenced provisioning event."
        accent: teal
        status: "This book"
      - title: "Reconciled"
        body: "No allocation outside the naming plane — CM-8 holds at provisioning time."
        accent: navy
        status: "CM-8"
      - title: "Composes"
        body: "Provision governed here; monitor drift after apply with Vol VII Book 03 (Azure Policy)."
        accent: navy
        status: "Vol VII"
    callout:
      text: "Next: app-registration governance (Book 03) — the workload-identity lifecycle."
      accent: navy
    notes: >
      Close on composition: the front door governs provisioning; drift after apply is a Vol VII Book 03
      concern, and the two compose. Reconciliation depends on the IPAM/DDI backend chosen in the
      Volume VIII / InfoBlox decision. Hand off to Book 03.
