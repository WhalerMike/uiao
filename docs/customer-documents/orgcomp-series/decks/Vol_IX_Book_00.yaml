# AAN deck spec — Vol IX Book 00 (ServiceNow Day-2 Operations Overview).
# Scope: FedRAMP Moderate & Microsoft GCC Moderate only. Never cite High.
deck:
  title: "ServiceNow Day-2 Operations"
  subtitle: "Volume IX overview — extending the coordination layer to the governed day-2 catalog (FedRAMP Moderate · Microsoft GCC Moderate)"
  series_kicker: "FEDERAL APPLICATION-AWARE NETWORKING · VOLUME IX"
  date_code: "2026-07-19 17:05 ET"
  journey:
    - "Govern"
    - "Approve"
    - "Actuate"
    - "Evidence"
  sources:
    ms_graph: "https://learn.microsoft.com/graph/"

slides:
  - type: title
    notes: >
      Opening frame for Volume IX. Volume VII proved ServiceNow can operate compliance drift as
      owned, evidenced work; Volume IX extends the same coordination layer to the highest-volume work
      a federal cloud team does — day-2 operations: onboarding a user, resetting an authenticator,
      standing up a subscription, registering an app, assigning a phone number. State the scope up
      front: FedRAMP Moderate and Microsoft GCC Moderate only. The four-word journey — Govern,
      Approve, Actuate, Evidence — is the contract every catalog item honors.
    vendor_sources: ["host repo: docs/customer-documents/orgcomp-series/servicenow-day2/"]

  - type: section
    kicker: "PART ONE"
    title: "The help desk is a control surface"
    callout: "The highest-frequency changes to the estate are day-2 requests — and if they are not governed, approved, least-privilege, and evidenced, they are the largest continuous source of control erosion an assessor finds."
    callout_accent: navy
    notes: >
      Motivate the volume. A service desk performs hundreds of identity and configuration changes a
      week. Done as portal clicks by a standing-admin operator, each is ungoverned and unevidenced,
      least-privilege only by hope. Multiplied across a week that dwarfs the drift Volume VII chases.
      This volume makes routine operations produce compliance evidence instead of eroding it.

  - type: content
    kicker: "THE DAY-2 DISCIPLINE"
    title: "Four rules for every catalog item"
    layout: grid
    cards:
      - title: "Typed & control-mapped"
        body: "No day-2 action is a portal click; it is a catalog item bound in the spine to the NIST control it satisfies."
        accent: navy
      - title: "The gate the control requires"
        body: "Password reset is identity-verified; a CA exception needs a security approver; a privileged group is time-bound."
        accent: teal
      - title: "Graph via the in-boundary MID"
        body: "Scoped, logged, individually-approved write — never standing tenant admin over the estate it serves (AC-6)."
        accent: amber
      - title: "Audited & reconciled"
        body: "Every action a change record (CM-3 / AU-2) reconciled to the CM-8 join key, feeding Vol VII Book 04 attestation."
        accent: navy
    callout:
      text: "Same coordination discipline as Vol VII, applied to the work a service desk does every day."
      accent: navy
    notes: >
      The load-bearing slide. Card three is the guardrail an assessor probes: the connector holds
      least-privilege write through the in-boundary MID, never blanket tenant admin. Card four is what
      turns routine operations into evidence rather than erosion — the same audited, CM-8-reconciled
      record Volume VII produces for drift.
    vendor_sources: ["ms_graph"]

  - type: table
    kicker: "THE VOLUME"
    title: "Six books across the day-2 surface"
    headers: ["Book", "Focus", "Lane / issue"]
    rows:
      - cells: ["IX-01", "Helpdesk & ITSM — JML, resets, group/license, guest", "Lane C · #1139"]
        accent: teal
      - cells: ["IX-02", "Landing Zone front door — catalog to IaC to CMDB", "Lane D"]
      - cells: ["IX-03", "App Registration governance — machine JML", "Lane E · #1140"]
        accent: teal
      - cells: ["IX-04", "Teams Telephony catalog + Teams SCuBA drift", "§4 · #1141"]
      - cells: ["IX-05", "SaaS integration governance — Entra gallery as an SA-9 event (Lane F)", "Operate"]
      - cells: ["IX-06", "Identity & Access Governance — event-driven JML, certification campaigns, IAM evidence (gated)", "Phase 2 · #1221"]
        accent: teal
    callout:
      text: "Helpdesk, landing zone, app registrations, telephony — one discipline, four surfaces."
      accent: navy
    notes: >
      The volume map as a table, each book tied to a roadmap lane and its tracking issue. All four
      surfaces run the same request → approve → actuate-via-MID → evidence contract; the difference is
      only the surface and the controls each closes.

  - type: closing
    kicker: "WHERE THIS LEAVES US"
    title: "Routine operations that evidence themselves"
    layout: columns
    cards:
      - title: "Governed"
        body: "Every operator request is typed, control-mapped, and approved by the gate the control requires."
        accent: teal
        status: "This volume"
      - title: "Least-privilege"
        body: "Graph via the in-boundary MID; no standing tenant admin ever granted by a helpdesk click."
        accent: navy
        status: "Guardrail"
      - title: "Evidenced"
        body: "Every action reconciled to CM-8 and fed to Vol VII Book 04 attestation."
        accent: navy
        status: "Book 04"
    callout:
      text: "Next: the helpdesk catalog (Book 01) — the highest-volume surface, made governed."
      accent: navy
    notes: >
      Close on the through-line: this volume stops the highest-frequency operations from quietly
      dismantling the controls the architecture already claims. Hand off to Book 01.
