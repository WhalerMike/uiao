<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>

<!-- Title -->
<text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start">UIAO Truth Fabric — Claim Intake Pipeline</text>
<text x="60" y="92" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#6B7A8D" text-anchor="start">From adapter-signed Canonical Claim to authoritative canonical state</text>

<!-- Inbound source arrow + label -->
<text x="60" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#5A5A5A" text-anchor="start">signed Canonical Claims</text>
<text x="60" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#5A5A5A" text-anchor="start">from adapters</text>
<line x1="60" y1="252" x2="148" y2="252" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- Node 1: Claim Ingress API -->
<rect x="160" y="208" width="180" height="92" rx="10" fill="#0D1B2E"/>
<text x="250" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Claim Ingress</text>
<text x="250" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">API</text>

<line x1="340" y1="254" x2="376" y2="254" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- Node 2: Schema Validator -->
<rect x="388" y="208" width="180" height="92" rx="10" fill="#0D1B2E"/>
<!-- gear icon -->
<g transform="translate(420,254)">
  <circle cx="0" cy="0" r="11" fill="none" stroke="#1E8C8C" stroke-width="2.5"/>
  <circle cx="0" cy="0" r="4" fill="#1E8C8C"/>
  <g stroke="#1E8C8C" stroke-width="2.5" stroke-linecap="round">
    <line x1="0" y1="-15" x2="0" y2="-19"/>
    <line x1="0" y1="15" x2="0" y2="19"/>
    <line x1="-15" y1="0" x2="-19" y2="0"/>
    <line x1="15" y1="0" x2="19" y2="0"/>
    <line x1="-10.6" y1="-10.6" x2="-13.4" y2="-13.4"/>
    <line x1="10.6" y1="10.6" x2="13.4" y2="13.4"/>
    <line x1="-10.6" y1="10.6" x2="-13.4" y2="13.4"/>
    <line x1="10.6" y1="-10.6" x2="13.4" y2="-13.4"/>
  </g>
</g>
<text x="492" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Schema</text>
<text x="492" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Validator</text>

<!-- accept / reject branch label -->
<text x="616" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#5A5A5A" text-anchor="middle">accept / reject</text>
<line x1="568" y1="254" x2="664" y2="254" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- Node 3: Signature Verifier -->
<rect x="676" y="208" width="180" height="92" rx="10" fill="#0D1B2E"/>
<!-- key/lock icon -->
<g transform="translate(708,254)">
  <rect x="-12" y="-2" width="24" height="20" rx="3" fill="none" stroke="#1E8C8C" stroke-width="2.5"/>
  <path d="M -8,-2 L -8,-9 A 8 8 0 0 1 8,-9 L 8,-2" fill="none" stroke="#1E8C8C" stroke-width="2.5"/>
  <circle cx="0" cy="7" r="3" fill="#1E8C8C"/>
</g>
<text x="772" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Signature</text>
<text x="772" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Verifier</text>

<line x1="856" y1="254" x2="892" y2="254" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- Node 4: Identity Anchoring Engine -->
<rect x="904" y="208" width="196" height="92" rx="10" fill="#0D1B2E"/>
<!-- anchor icon -->
<g transform="translate(938,254)" stroke="#1E8C8C" stroke-width="2.5" fill="none" stroke-linecap="round">
  <circle cx="0" cy="-14" r="4"/>
  <line x1="0" y1="-10" x2="0" y2="16"/>
  <line x1="-9" y1="-4" x2="9" y2="-4"/>
  <path d="M -13,6 A 13 13 0 0 0 13,6"/>
  <line x1="-13" y1="6" x2="-17" y2="2"/>
  <line x1="13" y1="6" x2="17" y2="2"/>
</g>
<text x="1010" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Identity</text>
<text x="1010" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Anchoring</text>
<text x="1010" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Engine</text>

<!-- Arrow down from node 4 to Canonical State Store -->
<line x1="1002" y1="300" x2="1002" y2="372" stroke="#1E8C8C" stroke-width="3"/>
<line x1="1002" y1="372" x2="700" y2="372" stroke="#1E8C8C" stroke-width="3"/>
<line x1="700" y1="372" x2="700" y2="408" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<text x="850" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#5A5A5A" text-anchor="middle">anchored claims</text>

<!-- Node 5: Canonical State Store (emphasized cylinder) -->
<g>
  <!-- cylinder body -->
  <path d="M 560,448 L 560,592 A 140 26 0 0 0 840,592 L 840,448" fill="#2E75B6" stroke="#0D1B2E" stroke-width="2.5"/>
  <ellipse cx="700" cy="448" rx="140" ry="26" fill="#2E75B6" stroke="#0D1B2E" stroke-width="2.5"/>
  <ellipse cx="700" cy="448" rx="140" ry="26" fill="#3D86C7"/>
  <ellipse cx="700" cy="448" rx="140" ry="26" fill="none" stroke="#0D1B2E" stroke-width="2.5"/>
</g>
<text x="700" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Canonical</text>
<text x="700" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">State Store</text>
<text x="700" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">authoritative store — accepted claims</text>
<text x="700" y="574" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">+ Canonical Identity Records</text>

<!-- Branch to Node 6: Control Mapping Engine (left) -->
<line x1="560" y1="520" x2="468" y2="520" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<rect x="270" y="476" width="186" height="88" rx="10" fill="#0D1B2E"/>
<text x="363" y="508" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Control</text>
<text x="363" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Mapping</text>
<text x="363" y="552" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Engine</text>
<!-- outbound Compliance Attestations -->
<line x1="270" y1="520" x2="182" y2="520" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<text x="170" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-style="italic" fill="#5A5A5A" text-anchor="end">Compliance</text>
<text x="170" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-style="italic" fill="#5A5A5A" text-anchor="end">Attestations</text>

<!-- Branch to Node 7: Drift Fabric Interface (right, off-canvas) -->
<line x1="840" y1="520" x2="932" y2="520" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<rect x="944" y="476" width="186" height="88" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="1037" y="508" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Drift Fabric</text>
<text x="1037" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Interface</text>
<!-- outbound to unseen Drift Fabric -->
<line x1="1130" y1="520" x2="1232" y2="520" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<text x="1130" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-style="italic" fill="#5A5A5A" text-anchor="middle">canonical state for</text>
<text x="1130" y="610" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-style="italic" fill="#5A5A5A" text-anchor="middle">drift queries →</text>

</svg>
