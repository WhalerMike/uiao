<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
  <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E75B6"/></marker>
</defs>

<!-- Title (wrapped, >46 chars) -->
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">UIAO Evidence Fabric — Write Pipeline</text>
<text x="60" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">and Storage Tiers</text>

<!-- ============ INBOUND ARROW ============ -->
<text x="60" y="184" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#5A5A5A" text-anchor="start">adapter-signed governance events</text>
<line x1="60" y1="232" x2="118" y2="232" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- ============ PIPELINE ROW (4 navy nodes) ============ -->
<!-- 1. Event Ingress -->
<rect x="124" y="196" width="190" height="92" rx="10" fill="#0D1B2E"/>
<text x="219" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Event Ingress</text>
<text x="219" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">entry node</text>

<!-- edge 1->2 with dedup -->
<line x1="314" y1="242" x2="386" y2="242" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<text x="350" y="226" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-style="italic" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">dedup</text>

<!-- 2. Signature Verifier -->
<rect x="392" y="196" width="200" height="92" rx="10" fill="#0D1B2E"/>
<text x="492" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Signature Verifier</text>
<text x="492" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">validates signature</text>
<text x="492" y="274" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">dedup by event_id</text>

<!-- edge 2->3 -->
<line x1="592" y1="242" x2="660" y2="242" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- 3. Evidence Fabric Countersigner -->
<rect x="666" y="196" width="226" height="92" rx="10" fill="#0D1B2E"/>
<!-- chain-link icon -->
<g stroke="#1E8C8C" stroke-width="2.5" fill="none">
  <rect x="690" y="232" width="22" height="14" rx="7"/>
  <rect x="704" y="232" width="22" height="14" rx="7"/>
</g>
<text x="788" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Evidence Fabric</text>
<text x="788" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Countersigner</text>
<text x="779" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">adds countersignature</text>

<!-- edge 3->4 -->
<line x1="892" y1="242" x2="960" y2="242" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- 4. Hash Chain Writer with linked-hexagon detail -->
<rect x="966" y="196" width="210" height="92" rx="10" fill="#0D1B2E"/>
<!-- linked hexagons pictogram -->
<g stroke="#1E8C8C" stroke-width="2" fill="none">
  <path d="M992,242 l6,-10 l12,0 l6,10 l-6,10 l-12,0 z"/>
  <line x1="1016" y1="242" x2="1026" y2="242"/>
  <path d="M1026,242 l6,-10 l12,0 l6,10 l-6,10 l-12,0 z"/>
</g>
<text x="1090" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Hash Chain Writer</text>
<text x="1071" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">appends content hash</text>
<text x="1071" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">and chain link</text>

<!-- ============ FORK INTO TWO STORAGE CYLINDERS ============ -->
<!-- fork connector from Hash Chain Writer down then split -->
<line x1="1071" y1="288" x2="1071" y2="330" stroke="#2E75B6" stroke-width="3"/>
<line x1="845" y1="330" x2="1071" y2="330" stroke="#2E75B6" stroke-width="3"/>
<line x1="845" y1="330" x2="845" y2="372" stroke="#2E75B6" stroke-width="3" marker-end="url(#ar-blue)"/>
<line x1="1071" y1="330" x2="1071" y2="372" stroke="#2E75B6" stroke-width="3" marker-end="url(#ar-blue)"/>

<!-- Active Storage cylinder (left, larger) -->
<!-- body -->
<path d="M765,400 a80,20 0 0 0 160,0 l0,150 a80,20 0 0 1 -160,0 z" fill="#2E75B6"/>
<!-- top ellipse -->
<ellipse cx="845" cy="400" rx="80" ry="20" fill="#2E75B6" stroke="#1E3A66" stroke-width="1.5"/>
<ellipse cx="845" cy="400" rx="80" ry="20" fill="none" stroke="#1E3A66" stroke-width="1.5"/>
<text x="845" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Active Storage</text>
<text x="845" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">primary tier</text>
<text x="845" y="524" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">≤ 90 days</text>

<!-- Archive Storage cylinder (right, smaller) -->
<path d="M1010,418 a62,16 0 0 0 124,0 l0,118 a62,16 0 0 1 -124,0 z" fill="#2E75B6"/>
<ellipse cx="1072" cy="418" rx="62" ry="16" fill="#2E75B6" stroke="#1E3A66" stroke-width="1.5"/>
<ellipse cx="1072" cy="418" rx="62" ry="16" fill="none" stroke="#1E3A66" stroke-width="1.5"/>
<text x="1072" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Archive Storage</text>
<text x="1072" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">secondary tier</text>
<text x="1072" y="524" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3–7 year retention</text>

<!-- ============ READ ARROWS DOWN INTO CORRELATION ENGINE ============ -->
<!-- from Active Storage down to engine -->
<line x1="845" y1="572" x2="845" y2="610" stroke="#1E8C8C" stroke-width="3"/>
<line x1="845" y1="610" x2="900" y2="610" stroke="#1E8C8C" stroke-width="3"/>
<line x1="900" y1="610" x2="900" y2="612" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<!-- from Archive Storage down to engine -->
<line x1="1072" y1="556" x2="1072" y2="610" stroke="#1E8C8C" stroke-width="3"/>
<line x1="1072" y1="610" x2="1010" y2="610" stroke="#1E8C8C" stroke-width="3"/>
<line x1="1010" y1="610" x2="1010" y2="612" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- Correlation Engine (below both cylinders, centered under the pair) -->
<rect x="780" y="616" width="356" height="76" rx="10" fill="#1E8C8C"/>
<text x="958" y="646" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Correlation Engine</text>
<text x="958" y="672" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">reads both storage tiers</text>

<!-- outbound query arrow on right edge of Correlation Engine -->
<line x1="1136" y1="654" x2="1234" y2="654" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<text x="1232" y="624" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-style="italic" fill="#5A5A5A" text-anchor="end">correlation</text>
<text x="1232" y="640" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-style="italic" fill="#5A5A5A" text-anchor="end">&amp; diff queries</text>

<!-- section labels -->
<text x="60" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2E75B6" text-anchor="start">TWO-TIER STORAGE</text>
<line x1="60" y1="420" x2="200" y2="420" stroke="#2E75B6" stroke-width="2"/>
</svg>
