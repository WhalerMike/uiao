<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
  <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>

<!-- Title -->
<text x="60" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">UIAO Drift Fabric &#8212; Detection Pipeline</text>

<!-- Governance Plane (upper-right escalation target) -->
<rect x="980" y="120" width="240" height="96" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2.5"/>
<text x="1100" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Governance Plane</text>
<text x="1100" y="184" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">HIGH / CRITICAL escalation</text>

<!-- Inbound: off-canvas Truth Fabric -->
<rect x="40" y="350" width="118" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2" stroke-dasharray="6 5"/>
<text x="99" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Truth</text>
<text x="99" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Fabric</text>
<text x="99" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">(off-canvas)</text>

<!-- inbound arrow + label -->
<line x1="158" y1="410" x2="216" y2="410" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<text x="187" y="383" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">canonical</text>
<text x="187" y="397" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">state records</text>

<!-- Node 1: Truth Fabric State Reader -->
<rect x="220" y="346" width="186" height="128" rx="10" fill="#0D1B2E"/>
<text x="313" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Truth Fabric</text>
<text x="313" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">State Reader</text>
<text x="313" y="436" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">read canonical</text>
<text x="313" y="452" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">state</text>

<!-- arrow 1 -> 2 -->
<line x1="406" y1="410" x2="442" y2="410" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- Node 2: Drift Comparator -->
<rect x="446" y="346" width="186" height="128" rx="10" fill="#0D1B2E"/>
<text x="539" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Drift Comparator</text>
<!-- overlapping documents pictogram with delta -->
<rect x="494" y="398" width="34" height="44" rx="3" fill="#1E3A66" stroke="#C7D4E6" stroke-width="1.5"/>
<rect x="510" y="406" width="34" height="44" rx="3" fill="#1E8C8C" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="566" y="428" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central">&#916;</text>
<text x="539" y="464" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">observed vs. canonical</text>

<!-- arrow 2 -> 3 -->
<line x1="632" y1="410" x2="668" y2="410" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- Node 3: Drift Classifier (larger, central) -->
<rect x="672" y="330" width="208" height="160" rx="10" fill="#0D1B2E"/>
<text x="776" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Drift Classifier</text>
<text x="776" y="392" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">type: DT-01 .. DT-05</text>
<text x="776" y="412" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">severity assignment</text>
<!-- severity legend chips beneath the node -->
<rect x="684" y="430" width="86" height="22" rx="4" fill="#1E8C8C"/>
<text x="727" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">LOW</text>
<rect x="780" y="430" width="86" height="22" rx="4" fill="#1E8C8C"/>
<text x="823" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">MODERATE</text>
<rect x="684" y="458" width="86" height="22" rx="4" fill="#D4A017"/>
<text x="727" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">HIGH</text>
<rect x="780" y="458" width="86" height="22" rx="4" fill="#D4A017"/>
<text x="823" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">CRITICAL</text>

<!-- arrow 3 -> 4 -->
<line x1="880" y1="410" x2="916" y2="410" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- Node 4: Evidence Fabric Writer -->
<rect x="920" y="346" width="186" height="128" rx="10" fill="#2E75B6"/>
<text x="1013" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Evidence Fabric</text>
<text x="1013" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Writer</text>
<text x="1013" y="436" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">immutable Drift</text>
<text x="1013" y="452" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#EAF1FB" text-anchor="middle" dominant-baseline="central">Records</text>

<!-- outbound: Drift Records -> off-canvas Evidence Fabric -->
<line x1="1106" y1="410" x2="1228" y2="410" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<text x="1175" y="389" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">Drift Records &#8594;</text>
<text x="1175" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#6B7A8D" text-anchor="middle" dominant-baseline="central">to Evidence Fabric</text>

<!-- Reconciliation Trigger node (amber escalation branch) -->
<rect x="672" y="556" width="208" height="96" rx="10" fill="#0D1B2E" stroke="#D4A017" stroke-width="3"/>
<text x="776" y="588" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Reconciliation Trigger</text>
<text x="776" y="616" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#FBEED2" text-anchor="middle" dominant-baseline="central">HIGH / CRITICAL only</text>

<!-- arrow: Classifier -> Reconciliation Trigger (downward from bottom-center, amber) -->
<line x1="776" y1="490" x2="776" y2="552" stroke="#D4A017" stroke-width="3" marker-end="url(#ar-amber)"/>
<text x="794" y="514" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#D4A017" text-anchor="start" dominant-baseline="central">escalate</text>
<text x="794" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#D4A017" text-anchor="start" dominant-baseline="central">HIGH / CRITICAL</text>

<!-- arrow: Reconciliation Trigger -> Governance Plane (upward, amber) -->
<path d="M880,604 L1100,604 L1100,220" stroke="#D4A017" stroke-width="3" fill="none" marker-end="url(#ar-amber)"/>
<text x="1118" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#D4A017" text-anchor="start" dominant-baseline="central">trigger</text>
<text x="1118" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#D4A017" text-anchor="start" dominant-baseline="central">reconciliation</text>

<!-- pipeline band label -->
<text x="60" y="690" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#6B7A8D" text-anchor="start">Teal pipeline = nominal flow &#183; Amber = HIGH / CRITICAL escalation</text>
</svg>
