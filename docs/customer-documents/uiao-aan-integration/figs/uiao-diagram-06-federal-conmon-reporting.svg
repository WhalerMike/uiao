<svg viewBox="0 0 1180 800" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif;background:#FFFFFF;">
<rect width="1180" height="800" fill="#FFFFFF"/>
<defs>
  <marker id="an" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1F3A5F"/></marker>
</defs>

<text x="40" y="44" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#1F3A5F">Federal Continuous-Monitoring Reporting — the Fan-Out</text>
<text x="40" y="70" font-size="15" fill="#1A9E8F">One agency ConMon core; many destinations, each with its own recipient, cadence, format, and encryption.</text>

<!-- timing legend -->
<g font-size="11">
  <rect x="40" y="86" width="16" height="14" rx="3" fill="#C0392B"/><text x="62" y="98" fill="#1E293B">Event (hard clock)</text>
  <rect x="210" y="86" width="16" height="14" rx="3" fill="#1A9E8F"/><text x="232" y="98" fill="#1E293B">Near-real-time / streaming</text>
  <rect x="450" y="86" width="16" height="14" rx="3" fill="#EDF3F9" stroke="#1F3A5F"/><text x="472" y="98" fill="#1E293B">Periodic (monthly / quarterly)</text>
</g>

<!-- core -->
<rect x="48" y="250" width="270" height="230" rx="10" fill="#1F3A5F"/>
<text x="183" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Agency ConMon core</text>
<line x1="72" y1="296" x2="294" y2="296" stroke="#5B6B7C" stroke-width="1"/>
<g font-size="12" fill="#C9D4E0">
  <text x="72" y="322">• OSCAL Assessment Results (AR)</text>
  <text x="72" y="350">• POA&amp;M</text>
  <text x="72" y="378">• Asset · config · vulnerability</text>
  <text x="72" y="406">• Security / flow telemetry</text>
  <text x="72" y="434">• SBOM · KSI evidence</text>
</g>
<text x="183" y="462" text-anchor="middle" font-size="10.5" fill="#8FA6C0">read-only emit (L1–L2)</text>

<!-- bus -->
<line x1="318" y1="365" x2="430" y2="365" stroke="#1F3A5F" stroke-width="2.5"/>
<line x1="430" y1="150" x2="430" y2="655" stroke="#1F3A5F" stroke-width="3"/>
<text x="404" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#5B6B7C">reporting bus</text>

<!-- destination row helper: 7 rows -->
<!-- Row 1: AO -->
<g>
  <line x1="430" y1="182" x2="470" y2="182" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>
  <rect x="472" y="150" width="500" height="64" rx="8" fill="#EDF3F9" stroke="#1F3A5F" stroke-width="1.2"/>
  <text x="486" y="178" font-size="13.5" font-weight="bold" fill="#1F3A5F">Authorizing Official  (CA-7, internal)</text>
  <text x="486" y="199" font-size="11" fill="#1E293B">OSCAL AR + POA&amp;M · monthly brief · dashboard</text>
  <rect x="978" y="164" width="158" height="36" rx="18" fill="#EDF3F9" stroke="#1F3A5F"/>
  <text x="1057" y="187" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1F3A5F">Monthly</text>
</g>
<!-- Row 2: CDM -->
<g>
  <line x1="430" y1="253" x2="470" y2="253" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>
  <rect x="472" y="221" width="500" height="64" rx="8" fill="#E6F5F2" stroke="#1A9E8F" stroke-width="1.2"/>
  <text x="486" y="249" font-size="13.5" font-weight="bold" fill="#1F3A5F">CDM Agency Dashboard → CISA Federal Dashboard</text>
  <text x="486" y="270" font-size="11" fill="#1E293B">asset · config · vuln · identity (BOD 23-01, KEV) · object-level</text>
  <rect x="978" y="235" width="158" height="36" rx="18" fill="#E6F5F2" stroke="#1A9E8F"/>
  <text x="1057" y="258" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1A9E8F">≤ 72 hours</text>
</g>
<!-- Row 3: CyberScope -->
<g>
  <line x1="430" y1="324" x2="470" y2="324" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>
  <rect x="472" y="292" width="500" height="64" rx="8" fill="#EDF3F9" stroke="#1F3A5F" stroke-width="1.2"/>
  <text x="486" y="320" font-size="13.5" font-weight="bold" fill="#1F3A5F">CyberScope → OMB  (FISMA)</text>
  <text x="486" y="341" font-size="11" fill="#1E293B">CIO / IG / SAOP metrics · live feed or XML upload</text>
  <rect x="978" y="306" width="158" height="36" rx="18" fill="#EDF3F9" stroke="#1F3A5F"/>
  <text x="1057" y="329" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1F3A5F">Quarterly + annual</text>
</g>
<!-- Row 4: CLAW -->
<g>
  <line x1="430" y1="395" x2="470" y2="395" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>
  <rect x="472" y="363" width="500" height="64" rx="8" fill="#E6F5F2" stroke="#1A9E8F" stroke-width="1.2"/>
  <text x="486" y="391" font-size="13.5" font-weight="bold" fill="#1F3A5F">CISA NCPS → CLAW  (TIC 3.0 telemetry)</text>
  <text x="486" y="412" font-size="11" fill="#1E293B">security logs + EINSTEIN data · push model (S3 / Dataflow)</text>
  <rect x="978" y="377" width="158" height="36" rx="18" fill="#E6F5F2" stroke="#1A9E8F"/>
  <text x="1057" y="400" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1A9E8F">≈ 15 min</text>
</g>
<!-- Row 5: Incident -->
<g>
  <line x1="430" y1="466" x2="470" y2="466" stroke="#C0392B" stroke-width="2.5" marker-end="url(#an)"/>
  <rect x="472" y="434" width="500" height="64" rx="8" fill="#F9EAE8" stroke="#C0392B" stroke-width="1.5"/>
  <text x="486" y="462" font-size="13.5" font-weight="bold" fill="#C0392B">CISA  (incident reporting)</text>
  <text x="486" y="483" font-size="11" fill="#1E293B">incident details · major-incident determination (+ OMB)</text>
  <rect x="978" y="448" width="158" height="36" rx="18" fill="#F9EAE8" stroke="#C0392B"/>
  <text x="1057" y="471" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#C0392B">≤ 1 hour</text>
</g>
<!-- Row 6: FedRAMP 20x -->
<g>
  <line x1="430" y1="537" x2="470" y2="537" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>
  <rect x="472" y="505" width="500" height="64" rx="8" fill="#E6F5F2" stroke="#1A9E8F" stroke-width="1.2"/>
  <text x="486" y="533" font-size="13.5" font-weight="bold" fill="#1F3A5F">FedRAMP 20x repository  (M-24-15)</text>
  <text x="486" y="554" font-size="11" fill="#1E293B">machine-readable KSI evidence · OSCAL/JSON via API</text>
  <rect x="978" y="519" width="158" height="36" rx="18" fill="#E6F5F2" stroke="#1A9E8F"/>
  <text x="1057" y="542" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1A9E8F">API · ≤ 3 days</text>
</g>
<!-- Row 7: SBOM -->
<g>
  <line x1="430" y1="608" x2="470" y2="608" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#an)"/>
  <rect x="472" y="576" width="500" height="64" rx="8" fill="#EDF3F9" stroke="#1F3A5F" stroke-width="1.2"/>
  <text x="486" y="604" font-size="13.5" font-weight="bold" fill="#1F3A5F">CISA SBOM inbox  (BOD 26-04)</text>
  <text x="486" y="625" font-size="11" fill="#1E293B">CycloneDX 1.6 SBOM + OpenVEX statements</text>
  <rect x="978" y="590" width="158" height="36" rx="18" fill="#EDF3F9" stroke="#1F3A5F"/>
  <text x="1057" y="613" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1F3A5F">By Dec 7, 2026</text>
</g>

<!-- encryption band -->
<rect x="48" y="686" width="1088" height="86" rx="10" fill="#FBF3E4" stroke="#D4860B" stroke-width="1.5"/>
<text x="72" y="714" font-size="14" font-weight="bold" fill="#8A6210">Encryption — every feed, in transit and at rest</text>
<g font-size="12" fill="#1E293B">
  <text x="72" y="740">In transit: TLS 1.2+ over FIPS 140-validated modules  ·  CLAW mandates FIPS 140-2 in transit and at rest</text>
  <text x="72" y="762">At rest: FIPS 140-validated (AES-256) · FIPS 140-2 certs → NIST Historical List Sep 21, 2026 → use FIPS 140-3</text>
</g>
</svg>
