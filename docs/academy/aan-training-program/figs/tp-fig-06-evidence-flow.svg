<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Evidence flow: book artifact to slot mapping to KSI evaluation to OSCAL assessment results">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30" fill="#0D1B2E">From Book Artifact to Assessment Results</text>
  <text x="640" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D">The mechanical connection between the AAN corpus and the conformance tooling — the pipeline both capstones exercise</text>

  <!-- Stage 1: book artifact -->
  <rect x="60" y="180" width="260" height="150" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="190" y="218" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#0D1B2E">Book artifact</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#33414F">
    <text x="190" y="246" text-anchor="middle">what a lab or implementation</text>
    <text x="190" y="266" text-anchor="middle">produces: IPAM export, PIM</text>
    <text x="190" y="286" text-anchor="middle">audit trail, fired-rule chain,</text>
    <text x="190" y="306" text-anchor="middle">SBOM / VDR, tabletop AAR</text>
  </g>

  <line x1="320" y1="255" x2="380" y2="255" stroke="#1E8C8C" stroke-width="4"/>
  <polygon points="380,255 364,246 364,264" fill="#1E8C8C"/>

  <!-- Stage 2: slot mapping -->
  <rect x="380" y="180" width="260" height="150" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="510" y="218" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#0D1B2E">Slot mapping</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#33414F">
    <text x="510" y="246" text-anchor="middle">one of seven YAML bindings</text>
    <text x="510" y="266" text-anchor="middle">declaring which artifacts close</text>
    <text x="510" y="286" text-anchor="middle">which controls, per KSI category</text>
  </g>
  <text x="510" y="315" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">slot-01 … slot-07 YAML</text>

  <line x1="640" y1="255" x2="700" y2="255" stroke="#1E8C8C" stroke-width="4"/>
  <polygon points="700,255 684,246 684,264" fill="#1E8C8C"/>

  <!-- Stage 3: evaluation -->
  <rect x="700" y="180" width="260" height="150" rx="10" fill="#0D1B2E"/>
  <text x="830" y="218" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#FFFFFF">KSI evaluation</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#EAF1FB">
    <text x="830" y="246" text-anchor="middle">rules score the bound evidence</text>
    <text x="830" y="266" text-anchor="middle">per KSI category</text>
  </g>
  <text x="830" y="300" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#D7F2EE">uiao ksi evaluate</text>

  <line x1="960" y1="255" x2="1020" y2="255" stroke="#1E8C8C" stroke-width="4"/>
  <polygon points="1020,255 1004,246 1004,264" fill="#1E8C8C"/>

  <!-- Stage 4: AR -->
  <rect x="1020" y="180" width="200" height="150" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="3"/>
  <text x="1120" y="218" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#0D1B2E">OSCAL AR</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#33414F">
    <text x="1120" y="246" text-anchor="middle">per-KSI verdicts</text>
    <text x="1120" y="266" text-anchor="middle">satisfied ·</text>
    <text x="1120" y="286" text-anchor="middle">not-satisfied ·</text>
    <text x="1120" y="306" text-anchor="middle">not-evaluated</text>
  </g>
  <text x="1120" y="360" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1E8C8C">uiao oscal ksi-ar</text>

  <!-- Verdict legend -->
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="180" y="430" width="24" height="24" rx="4" fill="#1E8C8C"/>
    <text x="216" y="448" fill="#33414F">satisfied — evidence bound and rule active</text>
    <rect x="180" y="470" width="24" height="24" rx="4" fill="#C0392B"/>
    <text x="216" y="488" fill="#33414F">not-satisfied — evidence bound, rule fails</text>
    <rect x="180" y="510" width="24" height="24" rx="4" fill="#D4A017"/>
    <text x="216" y="528" fill="#33414F">not-evaluated — rule still scaffold (state the gap and its deadline)</text>
  </g>

  <rect x="700" y="430" width="520" height="110" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="2"/>
  <text x="960" y="462" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#0D1B2E">Why both capstones end here</text>
  <text x="960" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#33414F">Track A reads this output (the seven-slot walk); Track B changes it</text>
  <text x="960" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#33414F">(your artifact moves your slot's verdict). Same file, two literacies.</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6B7A8D">This adapter relationship is the only connection between the AAN companion material and UIAO.</text>
</svg>
