<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Track A matrix: which books feed each of the seven evidence slots">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30" fill="#0D1B2E">Track A — Books Feeding Each Evidence Slot</text>
  <text x="640" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D">Modules A1–A7 are the seven slot mappings; Book 00 is the A0 orientation</text>

  <!-- Column headers -->
  <g font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#0D1B2E">
    <text x="130" y="130" text-anchor="middle">Slot / Module</text>
    <text x="480" y="130" text-anchor="middle">Feeding books</text>
    <text x="880" y="130" text-anchor="middle">KSI category</text>
    <text x="1120" y="130" text-anchor="middle">NIST anchor</text>
  </g>
  <line x1="50" y1="142" x2="1230" y2="142" stroke="#E3E8EF" stroke-width="2"/>

  <!-- Rows -->
  <g font-family="Arial, sans-serif" font-size="15" fill="#33414F">
    <rect x="50" y="156" width="160" height="52" rx="6" fill="#0D1B2E"/>
    <text x="130" y="187" text-anchor="middle" fill="#FFFFFF">A1  Identity</text>
    <text x="480" y="187" text-anchor="middle">03 · 04 · 07   (05 procedural)</text>
    <text x="880" y="187" text-anchor="middle" font-family="Consolas, monospace">KSI-IAM</text>
    <text x="1120" y="187" text-anchor="middle" font-family="Consolas, monospace">IA-2 / AC-2</text>

    <rect x="50" y="224" width="160" height="52" rx="6" fill="#0D1B2E"/>
    <text x="130" y="255" text-anchor="middle" fill="#FFFFFF">A2  Addressing</text>
    <text x="480" y="255" text-anchor="middle">01</text>
    <text x="880" y="255" text-anchor="middle" font-family="Consolas, monospace">KSI-PIY</text>
    <text x="1120" y="255" text-anchor="middle" font-family="Consolas, monospace">CM-8 / AC-4</text>

    <rect x="50" y="292" width="160" height="52" rx="6" fill="#0D1B2E"/>
    <text x="130" y="323" text-anchor="middle" fill="#FFFFFF">A3  Network</text>
    <text x="480" y="323" text-anchor="middle">02 · 06</text>
    <text x="880" y="323" text-anchor="middle" font-family="Consolas, monospace">KSI-CNA</text>
    <text x="1120" y="323" text-anchor="middle" font-family="Consolas, monospace">SC-8 / CA-7</text>

    <rect x="50" y="360" width="160" height="52" rx="6" fill="#0D1B2E"/>
    <text x="130" y="391" text-anchor="middle" fill="#FFFFFF">A4  Telemetry</text>
    <text x="480" y="391" text-anchor="middle">08 · 09 · 10</text>
    <text x="880" y="391" text-anchor="middle" font-family="Consolas, monospace">KSI-MLA</text>
    <text x="1120" y="391" text-anchor="middle" font-family="Consolas, monospace">CA-7 / SI-4</text>

    <rect x="50" y="428" width="160" height="52" rx="6" fill="#0D1B2E"/>
    <text x="130" y="459" text-anchor="middle" fill="#FFFFFF">A5  Endpoint</text>
    <text x="480" y="459" text-anchor="middle">07 · 08 · 14</text>
    <text x="880" y="459" text-anchor="middle" font-family="Consolas, monospace">KSI-PIY</text>
    <text x="1120" y="459" text-anchor="middle" font-family="Consolas, monospace">CM-8 / IA-3</text>

    <rect x="50" y="496" width="160" height="52" rx="6" fill="#0D1B2E"/>
    <text x="130" y="527" text-anchor="middle" fill="#FFFFFF">A6  Sec / Change</text>
    <text x="480" y="527" text-anchor="middle">08 · 10 · 12 · 13</text>
    <text x="880" y="527" text-anchor="middle" font-family="Consolas, monospace">KSI-CMT</text>
    <text x="1120" y="527" text-anchor="middle" font-family="Consolas, monospace">CM-2 / AC-4</text>

    <rect x="50" y="564" width="160" height="52" rx="6" fill="#0D1B2E"/>
    <text x="130" y="595" text-anchor="middle" fill="#FFFFFF">A7  Continuity</text>
    <text x="480" y="595" text-anchor="middle">11</text>
    <text x="880" y="595" text-anchor="middle" font-family="Consolas, monospace">KSI-RPL</text>
    <text x="1120" y="595" text-anchor="middle" font-family="Consolas, monospace">CP-2 / CP-4</text>
  </g>

  <rect x="50" y="640" width="1180" height="44" rx="6" fill="#FBEED2" stroke="#D4A017"/>
  <text x="640" y="667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">Slot 6 gate: KSI-011–014 stay scaffold until the Book 12 SBOM / VDR / VER pipeline ships — BOD 26-04 deadline December 7, 2026</text>
</svg>
