<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Track A matrix: which books feed each of the eight evidence slots">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="50" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30" fill="#0D1B2E">Track A — Books Feeding Each Evidence Slot</text>
  <text x="640" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D">Modules A1–A8 are the eight slot mappings; Book 00 is the A0 orientation</text>

  <!-- Column headers -->
  <g font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#0D1B2E">
    <text x="130" y="118" text-anchor="middle">Slot / Module</text>
    <text x="480" y="118" text-anchor="middle">Feeding books</text>
    <text x="880" y="118" text-anchor="middle">KSI category</text>
    <text x="1120" y="118" text-anchor="middle">NIST anchor</text>
  </g>
  <line x1="50" y1="130" x2="1230" y2="130" stroke="#E3E8EF" stroke-width="2"/>

  <!-- Rows (pitch 60) -->
  <g font-family="Arial, sans-serif" font-size="15" fill="#33414F">
    <rect x="50" y="142" width="160" height="46" rx="6" fill="#0D1B2E"/>
    <text x="130" y="170" text-anchor="middle" fill="#FFFFFF">A1  Identity</text>
    <text x="480" y="170" text-anchor="middle">03 · 04 · 07   (05 procedural)</text>
    <text x="880" y="170" text-anchor="middle" font-family="Consolas, monospace">KSI-IAM</text>
    <text x="1120" y="170" text-anchor="middle" font-family="Consolas, monospace">IA-2 / AC-2</text>

    <rect x="50" y="202" width="160" height="46" rx="6" fill="#0D1B2E"/>
    <text x="130" y="230" text-anchor="middle" fill="#FFFFFF">A2  Addressing</text>
    <text x="480" y="230" text-anchor="middle">01</text>
    <text x="880" y="230" text-anchor="middle" font-family="Consolas, monospace">KSI-PIY</text>
    <text x="1120" y="230" text-anchor="middle" font-family="Consolas, monospace">CM-8 / AC-4</text>

    <rect x="50" y="262" width="160" height="46" rx="6" fill="#0D1B2E"/>
    <text x="130" y="290" text-anchor="middle" fill="#FFFFFF">A3  Network</text>
    <text x="480" y="290" text-anchor="middle">02 · 06</text>
    <text x="880" y="290" text-anchor="middle" font-family="Consolas, monospace">KSI-CNA</text>
    <text x="1120" y="290" text-anchor="middle" font-family="Consolas, monospace">SC-8 / CA-7</text>

    <rect x="50" y="322" width="160" height="46" rx="6" fill="#0D1B2E"/>
    <text x="130" y="350" text-anchor="middle" fill="#FFFFFF">A4  Telemetry</text>
    <text x="480" y="350" text-anchor="middle">08 · 09 · 10</text>
    <text x="880" y="350" text-anchor="middle" font-family="Consolas, monospace">KSI-MLA</text>
    <text x="1120" y="350" text-anchor="middle" font-family="Consolas, monospace">CA-7 / SI-4</text>

    <rect x="50" y="382" width="160" height="46" rx="6" fill="#0D1B2E"/>
    <text x="130" y="410" text-anchor="middle" fill="#FFFFFF">A5  Endpoint</text>
    <text x="480" y="410" text-anchor="middle">07 · 08 · 14</text>
    <text x="880" y="410" text-anchor="middle" font-family="Consolas, monospace">KSI-PIY</text>
    <text x="1120" y="410" text-anchor="middle" font-family="Consolas, monospace">CM-8 / IA-3</text>

    <rect x="50" y="442" width="160" height="46" rx="6" fill="#0D1B2E"/>
    <text x="130" y="470" text-anchor="middle" fill="#FFFFFF">A6  Sec / Change</text>
    <text x="480" y="470" text-anchor="middle">08 · 10 · 12 · 13</text>
    <text x="880" y="470" text-anchor="middle" font-family="Consolas, monospace">KSI-CMT</text>
    <text x="1120" y="470" text-anchor="middle" font-family="Consolas, monospace">CM-2 / AC-4</text>

    <rect x="50" y="502" width="160" height="46" rx="6" fill="#0D1B2E"/>
    <text x="130" y="530" text-anchor="middle" fill="#FFFFFF">A7  Continuity</text>
    <text x="480" y="530" text-anchor="middle">11</text>
    <text x="880" y="530" text-anchor="middle" font-family="Consolas, monospace">KSI-RPL</text>
    <text x="1120" y="530" text-anchor="middle" font-family="Consolas, monospace">CP-2 / CP-4</text>

    <rect x="50" y="562" width="160" height="46" rx="6" fill="#0D1B2E"/>
    <text x="130" y="590" text-anchor="middle" fill="#FFFFFF">A8  Training</text>
    <text x="480" y="590" text-anchor="middle">15   (16 assembles the package)</text>
    <text x="880" y="590" text-anchor="middle" font-family="Consolas, monospace">KSI-CED</text>
    <text x="1120" y="590" text-anchor="middle" font-family="Consolas, monospace">AT-2 / AT-3 / AT-4</text>
  </g>

  <rect x="50" y="632" width="1180" height="44" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
  <text x="640" y="659" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">With slot 8 active, all 29 FedRAMP 20x CR26 KSIs are evaluable; the BOD 26-04 VDR/VER submission cadence (Dec 7, 2026) is operated per Book 16 — advisory pending formal PMO/AO review</text>
</svg>
