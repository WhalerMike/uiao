<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Track A rubric ladder: levels zero through three with the pass bar">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30" fill="#0D1B2E">Track A Rubric — The Four-Level Scale</text>
  <text x="640" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D">Every slot is scored on the same ladder; the capstone passes on the bar below</text>

  <!-- Ladder steps (ascending left to right) -->
  <rect x="70" y="470" width="260" height="120" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="200" y="505" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#C0392B">0  Missing</text>
  <text x="200" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">Slot not addressed, or no reference</text>
  <text x="200" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">to the books or the mapping YAML</text>

  <rect x="370" y="380" width="260" height="120" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
  <text x="500" y="415" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#33414F">1  Named</text>
  <text x="500" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">Books and KSI category right,</text>
  <text x="500" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">controls or evidence flow wrong</text>

  <rect x="670" y="290" width="260" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="800" y="325" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#0D1B2E">2  Traced</text>
  <text x="800" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">book → NIST anchor → KSI →</text>
  <text x="800" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">evidence source, correct and complete</text>

  <rect x="970" y="200" width="260" height="120" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="3"/>
  <text x="1100" y="235" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#1E8C8C">3  Assessor-ready</text>
  <text x="1100" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">Level 2 + real ksi-ar verdict +</text>
  <text x="1100" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">honest gap with its deadline</text>

  <!-- Ascending arrows -->
  <line x1="330" y1="520" x2="370" y2="450" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="370,450 353,455 366,468" fill="#1E8C8C"/>
  <line x1="630" y1="430" x2="670" y2="360" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="670,360 653,365 666,378" fill="#1E8C8C"/>
  <line x1="930" y1="340" x2="970" y2="270" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="970,270 953,275 966,288" fill="#1E8C8C"/>

  <!-- Pass bar -->
  <rect x="70" y="630" width="1160" height="56" rx="10" fill="#0D1B2E"/>
  <text x="650" y="658" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#FFFFFF">PASS BAR</text>
  <text x="650" y="678" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#EAF1FB">all seven slots at level 2 or higher · at least three slots at level 3 · 4 / 4 common checks (real ksi-ar attached, no invented controls, gaps honest, deadlines named)</text>

  <text x="200" y="140" font-family="Arial, sans-serif" font-size="14" fill="#6B7A8D">Common-check reminders:</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#33414F">
    <text x="200" y="164">• attach the ksi-ar output, do not just describe it</text>
    <text x="200" y="186">• every control ID must appear in the mapping or the book</text>
    <text x="200" y="208">• scaffold rules are gaps, never "satisfied"</text>
    <text x="200" y="230">• each gap names its forcing deadline</text>
  </g>
</svg>
