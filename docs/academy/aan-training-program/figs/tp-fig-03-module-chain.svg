<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Track B module dependency chain: B1 to B2 to B3 to B4 in sequence, B5 through B7 parallel after B2, B8 capping the track">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30" fill="#0D1B2E">Track B — Module Sequencing</text>
  <text x="640" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6B7A8D">Addressing → admission and identity → transport → data placement; B5–B7 parallel after B2; B8 caps the track</text>

  <!-- Dependency chain B1 -> B2 -> B3 -> B4 -->
  <rect x="40" y="105" width="275" height="105" rx="10" fill="#0D1B2E"/>
  <text x="177" y="140" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#FFFFFF">B1  Landing zone / DDI</text>
  <text x="177" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#EAF1FB">Book 01 — IPAM · DNS · DHCP · PKI</text>
  <text x="177" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#D7F2EE">slot 2 evidence</text>

  <line x1="315" y1="157" x2="355" y2="157" stroke="#1E8C8C" stroke-width="4"/>
  <polygon points="355,157 341,149 341,165" fill="#1E8C8C"/>

  <rect x="355" y="105" width="275" height="105" rx="10" fill="#0D1B2E"/>
  <text x="492" y="140" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#FFFFFF">B2  Access / identity</text>
  <text x="492" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#EAF1FB">Books 02–04 — 802.1X · PKI · SSOT</text>
  <text x="492" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#D7F2EE">slot 1 (02 pending)</text>

  <line x1="630" y1="157" x2="670" y2="157" stroke="#1E8C8C" stroke-width="4"/>
  <polygon points="670,157 656,149 656,165" fill="#1E8C8C"/>

  <rect x="670" y="105" width="275" height="105" rx="10" fill="#0D1B2E"/>
  <text x="807" y="140" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#FFFFFF">B3  Network / Telecom</text>
  <text x="807" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#EAF1FB">Books 05–06 — SD-WAN · SASE · voice</text>
  <text x="807" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#D7F2EE">slot 3 evidence</text>

  <line x1="945" y1="157" x2="985" y2="157" stroke="#1E8C8C" stroke-width="4"/>
  <polygon points="985,157 971,149 971,165" fill="#1E8C8C"/>

  <rect x="985" y="105" width="275" height="105" rx="10" fill="#0D1B2E"/>
  <text x="1122" y="140" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#FFFFFF">B4  Data platform</text>
  <text x="1122" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#EAF1FB">Books 07–09 — SQL auth · physics</text>
  <text x="1122" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#D7F2EE">slot 1 evidence</text>

  <!-- Parallel fan from B2 -->
  <line x1="492" y1="210" x2="492" y2="270" stroke="#1E8C8C" stroke-width="3"/>
  <line x1="220" y1="270" x2="1040" y2="270" stroke="#1E8C8C" stroke-width="3"/>
  <line x1="220" y1="270" x2="220" y2="315" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="220,315 211,299 229,299" fill="#1E8C8C"/>
  <line x1="630" y1="270" x2="630" y2="315" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="630,315 621,299 639,299" fill="#1E8C8C"/>
  <line x1="1040" y1="270" x2="1040" y2="315" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="1040,315 1031,299 1049,299" fill="#1E8C8C"/>
  <text x="560" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1E8C8C">parallel after B2</text>

  <rect x="70" y="315" width="300" height="125" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="220" y="350" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#0D1B2E">B5  Privileged access</text>
  <text x="220" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">Book 10 — PIM · PAW · break-glass</text>
  <text x="220" y="399" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">slots 1 + 5</text>
  <text x="220" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7A8D">lab: PIM tenant</text>

  <rect x="480" y="315" width="300" height="125" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="630" y="350" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#0D1B2E">B6  Detect and protect</text>
  <text x="630" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">Books 11–13 — Defender · Purview · Sentinel</text>
  <text x="630" y="399" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">slots 4 + 5 + 6</text>
  <text x="630" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7A8D">labs: Sentinel · Purview</text>

  <rect x="890" y="315" width="300" height="125" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1040" y="350" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#0D1B2E">B7  Resilience / governance</text>
  <text x="1040" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">Books 14–17 — BC · SBOM · PM · PII</text>
  <text x="1040" y="399" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">slots 6 + 7</text>
  <text x="1040" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7A8D">labs: SBOM CI · tabletop</text>

  <!-- B8 caps the track -->
  <line x1="630" y1="440" x2="630" y2="475" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="630,475 621,459 639,459" fill="#1E8C8C"/>
  <rect x="240" y="475" width="800" height="80" rx="10" fill="#0D1B2E"/>
  <text x="640" y="507" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#FFFFFF">B8  Authorize and operate — caps the track</text>
  <text x="640" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#EAF1FB">Books 18–19 — training record (slot 8) · OSCAL AP/AR/POA&amp;M bundle · ConMon calendar · BOD 26-04</text>

  <!-- Rule of the track -->
  <rect x="70" y="580" width="1120" height="62" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="630" y="606" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#0D1B2E">The rule of the track</text>
  <text x="630" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">A module is done when the thing works AND the conformance adapter can see it — every lab ends by landing evidence.</text>

  <text x="640" y="678" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6B7A8D">Pairing guide: B1–A2 · B2–A1/A5 · B3–A1/A3 · B4–A1 · B5–A1/A5 · B6–A4/A6 · B7–A6/A7 · B8–A8 and the capstone</text>
</svg>
