<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Track B module dependency chain: B1 to B2 to B3 in sequence, B4 through B6 parallel after B2">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30" fill="#0D1B2E">Track B — Module Sequencing</text>
  <text x="640" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D">Addressing before transport before data placement; B4–B6 parallel after B2</text>

  <!-- Dependency chain B1 -> B2 -> B3 -->
  <rect x="70" y="140" width="300" height="110" rx="10" fill="#0D1B2E"/>
  <text x="220" y="180" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#FFFFFF">B1  Landing zone / DDI</text>
  <text x="220" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#EAF1FB">Book 01 — IPAM · DNS · DHCP · PKI</text>
  <text x="220" y="230" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#D7F2EE">slot 2 evidence</text>

  <line x1="370" y1="195" x2="480" y2="195" stroke="#1E8C8C" stroke-width="4"/>
  <polygon points="480,195 464,186 464,204" fill="#1E8C8C"/>

  <rect x="480" y="140" width="300" height="110" rx="10" fill="#0D1B2E"/>
  <text x="630" y="180" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#FFFFFF">B2  Network / Telecom</text>
  <text x="630" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#EAF1FB">Books 02–03 — SD-WAN · SASE · voice</text>
  <text x="630" y="230" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#D7F2EE">slot 3 evidence</text>

  <line x1="780" y1="195" x2="890" y2="195" stroke="#1E8C8C" stroke-width="4"/>
  <polygon points="890,195 874,186 874,204" fill="#1E8C8C"/>

  <rect x="890" y="140" width="300" height="110" rx="10" fill="#0D1B2E"/>
  <text x="1040" y="180" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#FFFFFF">B3  Data platform</text>
  <text x="1040" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#EAF1FB">Books 04–06 — SQL auth · physics</text>
  <text x="1040" y="230" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#D7F2EE">slot 1 evidence</text>

  <!-- Parallel fan from B2 -->
  <line x1="630" y1="250" x2="630" y2="310" stroke="#1E8C8C" stroke-width="3"/>
  <line x1="220" y1="310" x2="1040" y2="310" stroke="#1E8C8C" stroke-width="3"/>
  <line x1="220" y1="310" x2="220" y2="360" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="220,360 211,344 229,344" fill="#1E8C8C"/>
  <line x1="630" y1="310" x2="630" y2="360" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="630,360 621,344 639,344" fill="#1E8C8C"/>
  <line x1="1040" y1="310" x2="1040" y2="360" stroke="#1E8C8C" stroke-width="3"/>
  <polygon points="1040,360 1031,344 1049,344" fill="#1E8C8C"/>
  <text x="640" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1E8C8C">parallel after B2</text>

  <rect x="70" y="360" width="300" height="130" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="220" y="398" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#0D1B2E">B4  Privileged access</text>
  <text x="220" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">Book 07 — PIM · PAW · break-glass</text>
  <text x="220" y="448" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">slots 1 + 5</text>
  <text x="220" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7A8D">lab: PIM tenant</text>

  <rect x="480" y="360" width="300" height="130" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="630" y="398" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#0D1B2E">B5  Detect and protect</text>
  <text x="630" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">Books 08–10 — Defender · Purview · Sentinel</text>
  <text x="630" y="448" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">slots 4 + 5 + 6</text>
  <text x="630" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7A8D">labs: Sentinel · Purview</text>

  <rect x="890" y="360" width="300" height="130" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1040" y="398" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#0D1B2E">B6  Resilience / governance</text>
  <text x="1040" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33414F">Books 11–14 — BC · SBOM · PM · PII</text>
  <text x="1040" y="448" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">slots 6 + 7</text>
  <text x="1040" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7A8D">labs: SBOM CI · tabletop</text>

  <!-- Rule of the track -->
  <rect x="70" y="530" width="1120" height="70" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="630" y="560" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#0D1B2E">The rule of the track</text>
  <text x="630" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#33414F">A module is done when the thing works AND the conformance adapter can see it — every lab ends by landing evidence.</text>

  <text x="640" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6B7A8D">Pairing guide: B1–A2 · B2–A1/A3 · B3–A1 · B4–A1/A5 · B5–A4/A6 · B6–A6/A7 · B7 (Books 15–16, authorize and operate) caps the track – pairs with A8 and the capstone</text>
</svg>
