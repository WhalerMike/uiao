<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="AAN Training Program map: twenty books feed eight evidence slots, taught by two tracks">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30" fill="#0D1B2E">AAN Training Program — Corpus, Evidence, Tracks</text>
  <text x="640" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D">20 books produce artifacts; 8 slot mappings bind them; two tracks teach them</text>

  <!-- Books column -->
  <rect x="60" y="110" width="300" height="500" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="210" y="140" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#0D1B2E">20-Book Corpus</text>
  <text x="210" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6B7A8D">Book 00 – Book 19</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#33414F">
    <text x="78" y="186">00  Executive Summary</text>
    <text x="78" y="205">01  Landing Zone / IPAM / DDI</text>
    <text x="78" y="224">02  Network Access Control (802.1X)</text>
    <text x="78" y="243">03  Certificates / Tokens / Crypto ID</text>
    <text x="78" y="262">04  HRIT Identity &amp; Org SSOT</text>
    <text x="78" y="281">05  Network Modernization</text>
    <text x="78" y="300">06  Telecom Modernization</text>
    <text x="78" y="319">07  SQL Authentication</text>
    <text x="78" y="338">08  SQL Implementation</text>
    <text x="78" y="357">09  DB Consolidation / Physics</text>
    <text x="78" y="376">10  Privileged Access</text>
    <text x="78" y="395">11  Vulnerability Management</text>
    <text x="78" y="414">12  Data Protection (Purview)</text>
    <text x="78" y="433">13  SIEM / XDR Detection</text>
    <text x="78" y="452">14  Business Continuity</text>
    <text x="78" y="471">15  Supply Chain (SBOM)</text>
    <text x="78" y="490">16  Program Management</text>
    <text x="78" y="509">17  PII Transparency</text>
    <text x="78" y="528">18  Training and Awareness</text>
    <text x="78" y="547">19  Authorization / ConMon</text>
  </g>
  <text x="210" y="580" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">evidence generation layer</text>

  <!-- Arrow books -> slots -->
  <line x1="360" y1="360" x2="470" y2="360" stroke="#1E8C8C" stroke-width="4"/>
  <polygon points="470,360 454,351 454,369" fill="#1E8C8C"/>
  <text x="415" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1E8C8C">artifacts</text>

  <!-- Slots column -->
  <rect x="470" y="110" width="330" height="500" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="635" y="140" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#0D1B2E">8 Evidence Slots</text>
  <text x="635" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6B7A8D">fedramp_aan_catalog mappings</text>
  <g font-family="Arial, sans-serif" font-size="13.5" fill="#33414F">
    <rect x="495" y="176" width="280" height="44" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
    <text x="510" y="194">1  Identity</text>
    <text x="510" y="212" font-family="Consolas, monospace" font-size="11.5" fill="#6B7A8D">KSI-IAM · IA-2 / AC-2</text>
    <rect x="495" y="228" width="280" height="44" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
    <text x="510" y="246">2  Addressing</text>
    <text x="510" y="264" font-family="Consolas, monospace" font-size="11.5" fill="#6B7A8D">KSI-PIY · CM-8 / AC-4</text>
    <rect x="495" y="280" width="280" height="44" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
    <text x="510" y="298">3  Network</text>
    <text x="510" y="316" font-family="Consolas, monospace" font-size="11.5" fill="#6B7A8D">KSI-CNA · SC-8 / CA-7</text>
    <rect x="495" y="332" width="280" height="44" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
    <text x="510" y="350">4  Telemetry</text>
    <text x="510" y="368" font-family="Consolas, monospace" font-size="11.5" fill="#6B7A8D">KSI-MLA · CA-7 / SI-4</text>
    <rect x="495" y="384" width="280" height="44" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
    <text x="510" y="402">5  Endpoint</text>
    <text x="510" y="420" font-family="Consolas, monospace" font-size="11.5" fill="#6B7A8D">KSI-PIY · CM-8 / IA-3</text>
    <rect x="495" y="436" width="280" height="44" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
    <text x="510" y="454">6  Security / Change</text>
    <text x="510" y="472" font-family="Consolas, monospace" font-size="11.5" fill="#6B7A8D">KSI-CMT · CM-2 / AC-4</text>
    <rect x="495" y="488" width="280" height="44" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
    <text x="510" y="506">7  Continuity</text>
    <text x="510" y="524" font-family="Consolas, monospace" font-size="11.5" fill="#6B7A8D">KSI-RPL · CP-2 / CP-4</text>
    <rect x="495" y="540" width="280" height="44" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
    <text x="510" y="558">8  Training</text>
    <text x="510" y="576" font-family="Consolas, monospace" font-size="11.5" fill="#6B7A8D">KSI-CED · AT-2 / AT-3 / AT-4</text>
  </g>

  <!-- Arrow slots -> tracks -->
  <line x1="800" y1="360" x2="910" y2="360" stroke="#1E8C8C" stroke-width="4"/>
  <polygon points="910,360 894,351 894,369" fill="#1E8C8C"/>
  <text x="855" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1E8C8C">curriculum</text>

  <!-- Tracks column -->
  <rect x="910" y="150" width="310" height="180" rx="10" fill="#0D1B2E"/>
  <text x="1065" y="185" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#FFFFFF">Track A — Compliance</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#EAF1FB">
    <text x="1065" y="215" text-anchor="middle">9 modules: orientation + 8 slots</text>
    <text x="1065" y="240" text-anchor="middle">book → control → KSI → evidence</text>
    <text x="1065" y="265" text-anchor="middle">capstone: eight-slot walk</text>
  </g>
  <text x="1065" y="305" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#D7F2EE">uiao oscal ksi-ar</text>

  <rect x="910" y="380" width="310" height="180" rx="10" fill="#0D1B2E"/>
  <text x="1065" y="415" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#FFFFFF">Track B — Implementation</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#EAF1FB">
    <text x="1065" y="445" text-anchor="middle">8 modules by book cluster</text>
    <text x="1065" y="470" text-anchor="middle">build it, then land the evidence</text>
    <text x="1065" y="495" text-anchor="middle">capstone: one module, complete</text>
  </g>
  <text x="1065" y="535" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#D7F2EE">labs: fixture / tenant / eval</text>

  <text x="640" y="668" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6B7A8D">Companion material for the federal AAN book series — not part of UIAO; the conformance adapter consumes the books' evidence.</text>
</svg>
