<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="AAN Training Program map: fifteen books feed seven evidence slots, taught by two tracks">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30" fill="#0D1B2E">AAN Training Program — Corpus, Evidence, Tracks</text>
  <text x="640" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D">15 books produce artifacts; 7 slot mappings bind them; two tracks teach them</text>

  <!-- Books column -->
  <rect x="60" y="120" width="300" height="470" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="210" y="152" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#0D1B2E">15-Book Corpus</text>
  <text x="210" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6B7A8D">Book 00 – Book 14</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#33414F">
    <text x="80" y="205">00  Executive Summary</text>
    <text x="80" y="228">01  Landing Zone / IPAM / DDI</text>
    <text x="80" y="251">02  Network Modernization</text>
    <text x="80" y="274">03  Telecom Modernization</text>
    <text x="80" y="297">04  SQL Authentication</text>
    <text x="80" y="320">05  SQL Implementation</text>
    <text x="80" y="343">06  DB Consolidation / Physics</text>
    <text x="80" y="366">07  Privileged Access</text>
    <text x="80" y="389">08  Vulnerability Management</text>
    <text x="80" y="412">09  Data Protection (Purview)</text>
    <text x="80" y="435">10  SIEM / XDR Detection</text>
    <text x="80" y="458">11  Business Continuity</text>
    <text x="80" y="481">12  Supply Chain (SBOM)</text>
    <text x="80" y="504">13  Program Management</text>
    <text x="80" y="527">14  PII Transparency</text>
  </g>
  <text x="210" y="568" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">evidence generation layer</text>

  <!-- Arrow books -> slots -->
  <line x1="360" y1="355" x2="470" y2="355" stroke="#1E8C8C" stroke-width="4"/>
  <polygon points="470,355 454,346 454,364" fill="#1E8C8C"/>
  <text x="415" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1E8C8C">artifacts</text>

  <!-- Slots column -->
  <rect x="470" y="120" width="330" height="470" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
  <text x="635" y="152" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#0D1B2E">7 Evidence Slots</text>
  <text x="635" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6B7A8D">fedramp_aan_catalog mappings</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#33414F">
    <rect x="495" y="196" width="280" height="46" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
    <text x="510" y="215">1  Identity</text>
    <text x="510" y="233" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">KSI-IAM · IA-2 / AC-2</text>
    <rect x="495" y="250" width="280" height="46" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
    <text x="510" y="269">2  Addressing</text>
    <text x="510" y="287" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">KSI-PIY · CM-8 / AC-4</text>
    <rect x="495" y="304" width="280" height="46" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
    <text x="510" y="323">3  Network</text>
    <text x="510" y="341" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">KSI-CNA · SC-8 / CA-7</text>
    <rect x="495" y="358" width="280" height="46" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
    <text x="510" y="377">4  Telemetry</text>
    <text x="510" y="395" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">KSI-MLA · CA-7 / SI-4</text>
    <rect x="495" y="412" width="280" height="46" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
    <text x="510" y="431">5  Endpoint</text>
    <text x="510" y="449" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">KSI-PIY · CM-8 / IA-3</text>
    <rect x="495" y="466" width="280" height="46" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
    <text x="510" y="485">6  Security / Change</text>
    <text x="510" y="503" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">KSI-CMT · CM-2 / AC-4</text>
    <rect x="495" y="520" width="280" height="46" rx="6" fill="#D7F2EE" stroke="#1E8C8C"/>
    <text x="510" y="539">7  Continuity</text>
    <text x="510" y="557" font-family="Consolas, monospace" font-size="12" fill="#6B7A8D">KSI-RPL · CP-2 / CP-4</text>
  </g>

  <!-- Arrow slots -> tracks -->
  <line x1="800" y1="355" x2="910" y2="355" stroke="#1E8C8C" stroke-width="4"/>
  <polygon points="910,355 894,346 894,364" fill="#1E8C8C"/>
  <text x="855" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1E8C8C">curriculum</text>

  <!-- Tracks column -->
  <rect x="910" y="150" width="310" height="180" rx="10" fill="#0D1B2E"/>
  <text x="1065" y="185" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#FFFFFF">Track A — Compliance</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#EAF1FB">
    <text x="1065" y="215" text-anchor="middle">8 modules: orientation + 7 slots</text>
    <text x="1065" y="240" text-anchor="middle">book → control → KSI → evidence</text>
    <text x="1065" y="265" text-anchor="middle">capstone: seven-slot walk</text>
  </g>
  <text x="1065" y="305" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#D7F2EE">uiao oscal ksi-ar</text>

  <rect x="910" y="380" width="310" height="180" rx="10" fill="#0D1B2E"/>
  <text x="1065" y="415" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#FFFFFF">Track B — Implementation</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#EAF1FB">
    <text x="1065" y="445" text-anchor="middle">6 modules by book cluster</text>
    <text x="1065" y="470" text-anchor="middle">build it, then land the evidence</text>
    <text x="1065" y="495" text-anchor="middle">capstone: one module, complete</text>
  </g>
  <text x="1065" y="535" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#D7F2EE">labs: fixture / tenant / eval</text>

  <text x="640" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6B7A8D">Companion material for the federal AAN book series — not part of UIAO; the conformance adapter consumes the books' evidence.</text>
</svg>
