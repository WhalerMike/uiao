<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Lab environment tiers: fixture, trial tenant, and product eval, with the four safety rules">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30" fill="#0D1B2E">Lab Environments — Three Tiers, Four Safety Rules</text>
  <text x="640" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6B7A8D">Every Track B lab runs in one of these tiers and ends by binding evidence</text>

  <!-- Tier F -->
  <rect x="70" y="120" width="360" height="240" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="250" y="158" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#0D1B2E">Tier F — Fixture</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#33414F">
    <text x="250" y="190" text-anchor="middle">Needs: this repo + Python</text>
    <text x="250" y="215" text-anchor="middle">No cloud footprint at all</text>
    <text x="250" y="248" text-anchor="middle">Use for: evidence-binding</text>
    <text x="250" y="270" text-anchor="middle">mechanics — slot YAML through</text>
  </g>
  <text x="250" y="296" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1E8C8C">uiao oscal ksi-ar</text>
  <text x="250" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6B7A8D">labs: DDI fixture · KEV exercise</text>

  <!-- Tier T -->
  <rect x="460" y="120" width="360" height="240" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="158" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#0D1B2E">Tier T — Trial tenant</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#33414F">
    <text x="640" y="190" text-anchor="middle">Needs: M365 developer/trial tenant</text>
    <text x="640" y="215" text-anchor="middle">plus an Azure trial subscription</text>
    <text x="640" y="248" text-anchor="middle">Use for: PIM · Sentinel · Purview —</text>
    <text x="640" y="270" text-anchor="middle">full product behavior with a</text>
    <text x="640" y="292" text-anchor="middle">disposable blast radius</text>
  </g>
  <text x="640" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6B7A8D">labs: PIM · Sentinel · Purview</text>

  <!-- Tier P -->
  <rect x="850" y="120" width="360" height="240" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1030" y="158" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#0D1B2E">Tier P — Product eval</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#33414F">
    <text x="1030" y="190" text-anchor="middle">Needs: vendor evaluation</text>
    <text x="1030" y="215" text-anchor="middle">(Infoblox / BlueCat) or</text>
    <text x="1030" y="237" text-anchor="middle">containerized DNS / DHCP</text>
    <text x="1030" y="270" text-anchor="middle">Use for: split-horizon and</text>
    <text x="1030" y="292" text-anchor="middle">atomic-provisioning exercises</text>
  </g>
  <text x="1030" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6B7A8D">labs: DDI (Book 01)</text>

  <!-- Safety rules -->
  <rect x="70" y="400" width="1140" height="220" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="640" y="436" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#C0392B">Safety rules — read before any lab</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#33414F">
    <text x="110" y="472">1.  Never a production tenant — every lab assumes a disposable tenant or subscription you can delete.</text>
    <text x="110" y="504">2.  Report-only first — Conditional Access and DLP policies start in report-only / simulation mode.</text>
    <text x="110" y="536">3.  Break-glass before lockdown — the PIM lab creates its excluded emergency account first.</text>
    <text x="110" y="568">4.  Teardown is part of the lab — run the teardown block; orphaned trial resources become shadow IT.</text>
  </g>
  <text x="640" y="602" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6B7A8D">The same discipline the books mandate for production, practiced from the first lab.</text>

  <text x="640" y="668" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6B7A8D">Common final step in every tier: land the artifact where a slot mapping can bind it, then regenerate the verdicts.</text>
</svg>
