<text x="622" y="395" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">P3</text>
<text x="568" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Orphan Drift</text>

<!-- Phantom Drift P3 -->
