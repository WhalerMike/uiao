<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E75B6"/></marker>
  <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
</defs>

<!-- Title -->
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Drift Detection Engine — six-phase control loop</text>

<!-- ===================== TOP ROW: SIX-PHASE LOOP ===================== -->
<!-- Box geometry: width 130, height 74, top y=200. x: 60,210,360,510,660,810. Loop ends x=940 -->

<!-- Return arc: from Verify (top) over the top back to Snapshot (top) -->
<path d="M 875 200 C 875 150, 875 144, 800 144 L 150 144 C 95 144, 95 150, 95 200" fill="none" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>
<text x="485" y="136" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#1E8C8C" text-anchor="middle">re-scan</text>

<!-- 1. Snapshot -->
<rect x="60" y="200" width="130" height="74" rx="10" fill="#0D1B2E"/>
<rect x="74" y="216" width="20" height="16" rx="2" fill="none" stroke="#1E8C8C" stroke-width="2"/>
<circle cx="84" cy="224" r="4" fill="none" stroke="#1E8C8C" stroke-width="2"/>
<rect x="82" y="212" width="6" height="4" rx="1" fill="#1E8C8C"/>
<text x="128" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Snapshot</text>
<text x="125" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Microsoft Graph pull</text>

<line x1="190" y1="237" x2="210" y2="237" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>

<!-- 2. Compare -->
<rect x="210" y="200" width="130" height="74" rx="10" fill="#0D1B2E"/>
<path d="M 224 217 L 238 217 M 224 224 L 234 224 M 224 231 L 238 231" stroke="#1E8C8C" stroke-width="2"/>
<text x="282" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Compare</text>
<text x="275" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">diff vs. baseline</text>

<line x1="340" y1="237" x2="360" y2="237" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>

<!-- 3. Classify -->
<rect x="360" y="200" width="130" height="74" rx="10" fill="#0D1B2E"/>
<path d="M 374 215 L 392 215 L 385 223 L 385 233 L 381 233 L 381 223 Z" fill="#1E8C8C"/>
<text x="432" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Classify</text>
<text x="425" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">sort categories</text>

<line x1="490" y1="237" x2="510" y2="237" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>

<!-- 4. Alert -->
<rect x="510" y="200" width="130" height="74" rx="10" fill="#0D1B2E"/>
<path d="M 522 230 C 522 220, 526 216, 532 216 C 538 216, 542 220, 542 230 Z" fill="none" stroke="#1E8C8C" stroke-width="2"/>
<line x1="520" y1="230" x2="544" y2="230" stroke="#1E8C8C" stroke-width="2"/>
<circle cx="532" cy="234" r="2" fill="#1E8C8C"/>
<text x="586" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Alert</text>
<text x="585" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">raise DriftFinding</text>

<line x1="640" y1="237" x2="660" y2="237" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>

<!-- 5. Remediate -->
<rect x="660" y="200" width="130" height="74" rx="10" fill="#0D1B2E"/>
<path d="M 674 232 L 684 222 M 682 216 a 7 7 0 1 0 8 8 L 684 222" fill="none" stroke="#1E8C8C" stroke-width="2"/>
<text x="732" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Remediate</text>
<text x="725" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Execution Substrate</text>

<line x1="790" y1="237" x2="810" y2="237" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>

<!-- 6. Verify -->
<rect x="810" y="200" width="130" height="74" rx="10" fill="#0D1B2E"/>
<path d="M 824 226 L 829 232 L 840 219" fill="none" stroke="#1E8C8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="884" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Verify</text>
<text x="881" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">confirm convergence</text>

<!-- ===================== FAN-OUT: FIVE DRIFT CATEGORY TILES ===================== -->
<text x="60" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="start">DRIFT CATEGORIES</text>

<!-- Fan-out arrows from Classify bottom (cx=425, y=274) to each tile top -->
<line x1="425" y1="274" x2="125" y2="372" stroke="#1E8C8C" stroke-width="1.5" marker-end="url(#ar-teal)"/>
<line x1="425" y1="274" x2="275" y2="372" stroke="#1E8C8C" stroke-width="1.5" marker-end="url(#ar-teal)"/>
<line x1="425" y1="274" x2="425" y2="372" stroke="#1E8C8C" stroke-width="1.5" marker-end="url(#ar-teal)"/>
<line x1="425" y1="274" x2="575" y2="372" stroke="#1E8C8C" stroke-width="1.5" marker-end="url(#ar-teal)"/>
