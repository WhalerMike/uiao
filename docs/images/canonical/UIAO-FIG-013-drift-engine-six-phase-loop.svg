<path d="M 620 274 C 640 300, 980 290, 1000 322" fill="none" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>
<text x="855" y="296" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1E8C8C" text-anchor="middle">DriftFinding</text>

