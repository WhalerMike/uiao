<text x="718" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Phantom Drift</text>

<!-- ===================== EVIDENCE FABRIC HANDOFF (mid-blue) ===================== -->
<!-- mid-blue arrow from Alert bottom-right, routed right of the Phantom tile down to cylinder -->
<path d="M 632 274 C 720 320, 870 360, 875 540" fill="none" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#ar-blue)"/>
<text x="745" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#2E75B6" text-anchor="start">hash-chained, immutable</text>

<!-- Evidence Fabric cylinder (top ellipse at y=558) -->
<path d="M 815 558 a 60 12 0 0 1 120 0 v 48 a 60 12 0 0 1 -120 0 Z" fill="#2E75B6"/>
