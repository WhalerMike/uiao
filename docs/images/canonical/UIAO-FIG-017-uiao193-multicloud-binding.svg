<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO_193 OrgPath multi-cloud binding profiles (ADR-093 blueprint).
       navy = universal codebook · teal = binding-profile contract · ice = per-target storage. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="60" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">UIAO_193 — OrgPath Multi-Cloud Binding Profiles</text>
  <text x="60" y="94" font-size="19" fill="#5A5A5A">The facet model is universal; its storage is a profile. One codebook; a per-target map to each platform's native locator.</text>

  <!-- Universal codebook -->
  <rect x="60" y="280" width="230" height="150" rx="12" fill="#0D1B2E"/>
  <text x="175" y="322" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">15-facet</text>
  <text x="175" y="350" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Codebook</text>
  <text x="175" y="380" text-anchor="middle" font-size="14" fill="#D7F2EE">UIAO_151 · universal</text>
  <text x="175" y="404" text-anchor="middle" font-size="13" fill="#D7F2EE">what facets mean</text>

  <!-- Binding profile contract -->
  <rect x="340" y="290" width="210" height="130" rx="12" fill="#0D1B2E" stroke="#1E8C8C" stroke-width="4"/>
  <text x="445" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Binding Profile</text>
  <text x="445" y="360" text-anchor="middle" font-size="13" fill="#D7F2EE">facet → native locator</text>
  <text x="445" y="382" text-anchor="middle" font-size="13" fill="#D7F2EE">read / write mechanics</text>
  <text x="445" y="404" text-anchor="middle" font-size="12" fill="#D7F2EE">normative schema (ADR-098)</text>

  <line x1="290" y1="355" x2="336" y2="355" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <!-- trunk fanning into the target grid -->
  <line x1="550" y1="355" x2="612" y2="355" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <text x="640" y="150" font-size="15" font-weight="bold" fill="#6B7A8D">PER-TARGET STORAGE (native locator)</text>

  <!-- 3x3 target grid -->
  <!-- Row 1 -->
  <rect x="628" y="166" width="186" height="76" rx="9" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="3"/>
  <text x="721" y="194" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">microsoft-entra</text>
  <text x="721" y="214" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#33414F">onPremisesExtension</text>
  <text x="721" y="228" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#33414F">Attribute1..15  (reference)</text>

  <rect x="824" y="166" width="186" height="76" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="917" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">aws</text>
  <text x="917" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#33414F">resource tags / IAM</text>

  <rect x="1020" y="166" width="186" height="76" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1113" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">gcp</text>
  <text x="1113" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#33414F">resource labels</text>

  <!-- Row 2 -->
  <rect x="628" y="262" width="186" height="76" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="721" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">okta</text>
  <text x="721" y="316" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#33414F">profile attributes</text>

  <rect x="824" y="262" width="186" height="76" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="917" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">ldap</text>
  <text x="917" y="316" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#33414F">directory attributes</text>

  <rect x="1020" y="262" width="186" height="76" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1113" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">vmware</text>
  <text x="1113" y="316" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#33414F">three-plane tags</text>

  <!-- Row 3 -->
  <rect x="628" y="358" width="186" height="76" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="721" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">pingone</text>
  <text x="721" y="412" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#33414F">IdP attrs (ADR-099)</text>

  <rect x="824" y="358" width="186" height="76" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="917" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">keycloak</text>
  <text x="917" y="412" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#33414F">IdP attrs (ADR-099)</text>

  <rect x="1020" y="358" width="186" height="76" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1113" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">auth0</text>
  <text x="1113" y="412" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#33414F">IdP attrs (ADR-099)</text>

  <!-- legend + ZT band -->
  <rect x="628" y="358" width="0" height="0"/>
  <line x1="60" y1="500" x2="1220" y2="500" stroke="#E3E8EF" stroke-width="1.5"/>
  <rect x="60" y="522" width="20" height="20" rx="4" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="3"/>
  <text x="90" y="532" dominant-baseline="central" font-size="14" fill="#33414F">reference profile (the ADR-078 slot table)</text>
  <rect x="430" y="522" width="20" height="20" rx="4" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="460" y="532" dominant-baseline="central" font-size="14" fill="#33414F">proposed until its transport ships</text>

  <rect x="60" y="566" width="1146" height="118" rx="10" fill="#D7F2EE"/>
  <text x="84" y="598" font-size="17" font-weight="bold" fill="#0D1B2E">Zero Trust — OrgPath facets are the cross-vendor policy subject</text>
  <text x="84" y="626" font-size="14" fill="#33414F">Facet predicates project onto each vendor's native enforcement construct; least privilege + conditional access resolve from facet values;</text>
  <text x="84" y="648" font-size="14" fill="#33414F">drift is a continuous-verification signal. Mapped to the CISA Zero Trust Maturity Model pillars — the facet model never forks per vendor.</text>
</svg>
