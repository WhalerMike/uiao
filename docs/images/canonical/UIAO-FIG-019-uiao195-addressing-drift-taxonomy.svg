<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO_195 addressing-plane drift taxonomy (ADR-093 blueprint).
       navy = planes / shared primitive · ice = observability tiers · teal = flow into the gate. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="60" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">UIAO_195 — Addressing-Plane Drift Taxonomy</text>
  <text x="60" y="94" font-size="19" fill="#5A5A5A">Two coordinate planes, one drift gate. Both emit Finding objects through the shared drift_core primitive.</text>

  <!-- two planes -->
  <rect x="60" y="132" width="560" height="96" rx="11" fill="#0D1B2E"/>
  <text x="340" y="166" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Identity plane — OrgPath (UIAO_151)</text>
  <text x="340" y="194" text-anchor="middle" font-size="14" fill="#D7F2EE">who / what an object is;</text>
  <text x="340" y="214" text-anchor="middle" font-size="14" fill="#D7F2EE">where it sits organisationally</text>

  <rect x="660" y="132" width="560" height="96" rx="11" fill="#0D1B2E"/>
  <text x="940" y="166" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Addressing plane — DNS namespace (UIAO_195)</text>
  <text x="940" y="194" text-anchor="middle" font-size="14" fill="#D7F2EE">where it is reachable;</text>
  <text x="940" y="214" text-anchor="middle" font-size="14" fill="#D7F2EE">under whose naming authority</text>

  <!-- twelve drift classes, two observability tiers (addressing plane) -->
  <text x="660" y="266" font-size="15" font-weight="bold" fill="#6B7A8D">TWELVE DRIFT CLASSES — BY OBSERVABILITY TIER</text>
  <rect x="660" y="280" width="272" height="92" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="796" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Satisfiable</text>
  <text x="796" y="330" text-anchor="middle" font-size="13" fill="#33414F">zone-read + manifest</text>
  <text x="796" y="350" text-anchor="middle" font-size="13" fill="#33414F">+ resource list</text>
  <rect x="948" y="280" width="272" height="92" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1084" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Deferred</text>
  <text x="1084" y="330" text-anchor="middle" font-size="13" fill="#33414F">require live</text>
  <text x="1084" y="350" text-anchor="middle" font-size="13" fill="#33414F">observation</text>

  <!-- shared drift_core gate -->
  <rect x="440" y="430" width="400" height="96" rx="12" fill="#0D1B2E" stroke="#1E8C8C" stroke-width="4"/>
  <text x="640" y="466" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">drift_core  (ADR-108)</text>
  <text x="640" y="494" text-anchor="middle" font-size="14" fill="#D7F2EE">shared gate — identical semantics on both planes</text>
  <text x="640" y="514" text-anchor="middle" font-size="13" fill="#D7F2EE">emits Finding objects</text>

  <!-- converging arrows into the gate -->
  <path d="M340,228 L340,400 L516,400 L516,426" fill="none" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M940,372 L940,400 L764,400 L764,426" fill="none" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Finding output -->
  <rect x="540" y="556" width="200" height="52" rx="9" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="640" y="582" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#0D1B2E">Finding objects</text>
  <line x1="640" y1="526" x2="640" y2="552" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- five-class mapping strip -->
  <text x="60" y="470" font-size="15" font-weight="bold" fill="#6B7A8D">MAPS TO THE</text>
  <text x="60" y="490" font-size="15" font-weight="bold" fill="#6B7A8D">ORGPATH FIVE-CLASS</text>
  <text x="60" y="510" font-size="15" font-weight="bold" fill="#6B7A8D">TAXONOMY</text>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#0D1B2E">
    <rect x="60"  y="556" width="86" height="52" rx="7" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/><text x="103" y="578">DRIFT-</text><text x="103" y="594">SCHEMA</text>
    <rect x="156" y="556" width="86" height="52" rx="7" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/><text x="199" y="578">DRIFT-</text><text x="199" y="594">SEMANTIC</text>
    <rect x="252" y="556" width="86" height="52" rx="7" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/><text x="295" y="578">DRIFT-</text><text x="295" y="594">PROVEN.</text>
    <rect x="348" y="556" width="86" height="52" rx="7" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/><text x="391" y="578">DRIFT-</text><text x="391" y="594">AUTHZ</text>
    <rect x="444" y="556" width="86" height="52" rx="7" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.5"/><text x="487" y="578">DRIFT-</text><text x="487" y="594">IDENTITY</text>
  </g>

  <text x="60" y="660" font-size="14" fill="#6B7A8D">SSOT projection: the addressing plane resolves naming authority to a single canonical owner; AppRef is the proposed third node (design note, §6).</text>
</svg>
