<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- GCC invisible boundary + UIAO solution (ADR-093 blueprint).
       teal ✓ = portal claims · red ✗ = actually blocked · navy = UIAO components. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>
  <text x="60" y="50" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#0D1B2E">The GCC-Moderate Invisible Boundary — and how UIAO resolves it</text>

  <!-- Top: the paradox -->
  <rect x="60" y="70" width="1160" height="216" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="640" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0392B">INVISIBLE BOUNDARY (current state)</text>
  <line x1="640" y1="112" x2="640" y2="278" stroke="#C0392B" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="90" y="134" font-size="14" font-weight="bold" fill="#0D1B2E">M365 GCC-Moderate portal shows</text>
  <text x="670" y="134" font-size="14" font-weight="bold" fill="#0D1B2E">What actually functions</text>
  <g font-size="14">
    <text x="90" y="164" fill="#1E8C8C">✓ Endpoint Analytics</text><text x="670" y="164" fill="#C0392B">✗ Empty — telemetry blocked</text>
    <text x="90" y="190" fill="#1E8C8C">✓ Device Health Attestation</text><text x="670" y="190" fill="#C0392B">✗ Planning phase — unavailable</text>
    <text x="90" y="216" fill="#1E8C8C">✓ Locations / Network Fence</text><text x="670" y="216" fill="#C0392B">✗ Explicitly unavailable</text>
    <text x="90" y="242" fill="#1E8C8C">✓ ARC Server Monitoring</text><text x="670" y="242" fill="#C0392B">✗ Monitor endpoints blocked</text>
    <text x="90" y="268" fill="#1E8C8C">✓ Expedited Updates</text><text x="670" y="268" fill="#C0392B">✗ Planning phase</text>
  </g>

  <line x1="640" y1="286" x2="640" y2="324" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#arrow-teal)"/>
  <text x="660" y="312" font-size="14" font-weight="bold" fill="#1E8C8C">UIAO resolves each gap</text>

  <!-- Bottom: 4-component solution -->
  <rect x="60" y="330" width="1160" height="370" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="358" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">UIAO SOLUTION ARCHITECTURE</text>

  <g>
    <rect x="90" y="378" width="540" height="140" rx="10" fill="#0D1B2E"/>
    <text x="112" y="408" font-size="16" font-weight="bold" fill="#FFFFFF">1 · Boundary Probe</text>
    <g font-size="13.5" fill="#D7F2EE"><text x="112" y="434">Detects every gap, tests functionally</text><text x="112" y="458">Emits DRIFT-BOUNDARY findings</text><text x="112" y="482">Weekly schedule</text></g>

    <rect x="650" y="378" width="540" height="140" rx="10" fill="#0D1B2E"/>
    <text x="672" y="408" font-size="16" font-weight="bold" fill="#FFFFFF">2 · In-Boundary Telemetry</text>
    <g font-size="13.5" fill="#D7F2EE"><text x="672" y="434">WMI/CIM device health · Graph mgmt plane</text><text x="672" y="458">Replaces blocked DiagTrack pipeline</text><text x="672" y="482">Satisfies NIST 800-137 ConMon</text></g>

    <rect x="90" y="538" width="540" height="140" rx="10" fill="#0D1B2E"/>
    <text x="112" y="568" font-size="16" font-weight="bold" fill="#FFFFFF">3 · Gap Registry</text>
    <g font-size="13.5" fill="#D7F2EE"><text x="112" y="594">Machine-generated, NIST-control mapped</text><text x="112" y="618">ATO artifact</text><text x="112" y="642">SSP evidence base</text></g>

    <rect x="650" y="538" width="540" height="140" rx="10" fill="#0D1B2E" stroke="#1E8C8C" stroke-width="3"/>
    <text x="672" y="568" font-size="16" font-weight="bold" fill="#FFFFFF">4 · OrgPath Device Targeting</text>
    <g font-size="13.5" fill="#D7F2EE"><text x="672" y="594">Replaces blocked Locations feature</text><text x="672" y="618">OrgPath on device objects · dynamic groups</text><text x="672" y="642">Org-hierarchy policy targeting</text></g>
  </g>
</svg>
