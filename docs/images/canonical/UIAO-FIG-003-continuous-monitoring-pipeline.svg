<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1080" height="1080" fill="#FFFFFF"/>
<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  <marker id="ar-teal-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>

<!-- Title -->
<text x="60" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" fill="#0D1B2E" text-anchor="start">Continuous Monitoring Pipeline</text>
<text x="62" y="120" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#6B7A8D" text-anchor="start">Tenant configuration evaluated against FedRAMP Moderate, drift surfaced within minutes</text>

<!-- ===================== VERTICAL FLOW ===================== -->
<!-- Stage geometry: x=170, width=590, centered group. Stage centerline x=465. -->
<!-- Stage tops: 170, 320, 470, 620, 770. Height 110, gap 40 (arrows). -->

<!-- 1. Monitored environment -->
<rect x="170" y="170" width="590" height="110" rx="14" fill="#0D1B2E"/>
<text x="465" y="212" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Microsoft 365 / Azure tenant</text>
<text x="465" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">the monitored environment</text>

<!-- arrow 1 -> 2 -->
<line x1="465" y1="280" x2="465" y2="318" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- 2. Configuration collectors -->
<rect x="170" y="320" width="590" height="110" rx="14" fill="#0D1B2E"/>
<text x="465" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Configuration collectors</text>
<text x="465" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">pull current state via Microsoft Graph</text>

<!-- arrow 2 -> 3 -->
<line x1="465" y1="430" x2="465" y2="468" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- 3. Evaluation engine -->
<rect x="170" y="470" width="590" height="130" rx="14" fill="#0D1B2E"/>
<text x="465" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Evaluation engine</text>
<!-- control chip (ice) -->
<rect x="220" y="532" width="490" height="48" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<text x="465" y="557" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central"><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="bold">323</tspan> FedRAMP Moderate Rev 5 controls</text>

<!-- arrow 3 -> 4 -->
<line x1="465" y1="600" x2="465" y2="638" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- 4. Drift detection -->
<rect x="170" y="640" width="590" height="130" rx="14" fill="#0D1B2E"/>
<text x="465" y="680" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Drift detection</text>
<!-- amber accent chip: within minutes -->
<rect x="305" y="702" width="320" height="48" rx="10" fill="#0D1B2E" stroke="#D4A017" stroke-width="2.5"/>
<text x="465" y="727" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#D4A017" text-anchor="middle" dominant-baseline="central">within minutes</text>

<!-- arrow 4 -> 5 -->
<line x1="465" y1="770" x2="465" y2="808" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

<!-- 5. Signed evidence + posture dashboard -->
<rect x="170" y="810" width="590" height="110" rx="14" fill="#0D1B2E"/>
<text x="465" y="852" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Signed evidence +</text>
<text x="465" y="886" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">posture dashboard</text>

<!-- ===================== CONTINUOUS LOOP (right side, dashed teal) ===================== -->
<!-- From stage 5 bottom-right, down/right, up the right margin, back to stage 1 top-right -->
<path d="M 760 865
         C 870 865, 900 865, 900 800
         L 900 290
         C 900 225, 870 225, 760 225"
      fill="none" stroke="#1E8C8C" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ar-teal-loop)"/>
<!-- loop label, stacked, vertical region on the right -->
<text x="930" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-style="italic" fill="#1E8C8C" text-anchor="middle" transform="rotate(90 930 500)"><tspan font-style="italic">re-evaluates continuously</tspan></text>

<!-- ===================== FOOTER ===================== -->
<text x="60" y="1040" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#6B7A8D" text-anchor="start">UIAO-FIG-003</text>
</svg>
