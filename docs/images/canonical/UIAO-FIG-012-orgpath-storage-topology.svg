<text x="310" y="197" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">Workday · SAP HR · HRIS</text>

<!-- HR -> pipeline arrow -->
<line x1="310" y1="222" x2="310" y2="298" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#ar-teal)"/>
