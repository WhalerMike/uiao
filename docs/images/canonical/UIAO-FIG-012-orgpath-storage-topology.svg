<circle cx="386" cy="416" r="12" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.5"/>
<line x1="377.5" y1="407.5" x2="394.5" y2="424.5" stroke="#C0392B" stroke-width="2.5"/>
