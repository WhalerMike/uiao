<rect x="166" y="442" width="168" height="14" rx="2" fill="#EAF1FB" stroke="#1F5687" stroke-width="0.75"/>
<text x="250" y="449" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Device · extensionAttribute1</text>
<rect x="166" y="459" width="168" height="14" rx="2" fill="#EAF1FB" stroke="#1F5687" stroke-width="0.75"/>
