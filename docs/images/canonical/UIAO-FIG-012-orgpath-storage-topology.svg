<text x="980" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">DOWNSTREAM GOVERNANCE CONSUMERS</text>

