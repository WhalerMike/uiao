<text x="62" y="371" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#5A5A5A" text-anchor="middle" transform="rotate(-90 62 371)">ASSIGNMENT LAYER</text>
<text x="62" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#5A5A5A" text-anchor="middle" transform="rotate(-90 62 592)">VOCABULARY LAYER</text>

