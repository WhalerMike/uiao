<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- AD subtree delegation (inherited) vs Entra flat AUs (explicit) (ADR-093 blueprint). -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  </defs>
  <text x="60" y="58" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#0D1B2E">Subtree Delegation vs Flat Administrative Units</text>
  <text x="60" y="90" font-size="18" fill="#5A5A5A">A role assigned once in AD flows down the subtree; in Entra each AU must be assigned the role again.</text>

  <line x1="640" y1="120" x2="640" y2="680" stroke="#E3E8EF" stroke-width="2"/>
  <text x="350" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Active Directory — subtree delegation</text>
  <text x="940" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Entra ID — flat Administrative Units</text>

  <!-- AD chain -->
  <rect x="250" y="180" width="200" height="60" rx="9" fill="#0D1B2E"/><text x="350" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Agency Root</text>
  <line x1="350" y1="240" x2="350" y2="290" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="250" y="294" width="200" height="68" rx="9" fill="#0D1B2E" stroke="#1E8C8C" stroke-width="3"/><text x="350" y="322" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">West Region</text><text x="350" y="345" text-anchor="middle" font-size="12" fill="#D7F2EE">role assigned here</text>
  <line x1="350" y1="362" x2="350" y2="412" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="470" y="392" font-size="13" fill="#1E8C8C">covers all children</text>
  <rect x="250" y="416" width="200" height="60" rx="9" fill="#0D1B2E"/><text x="350" y="452" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">West Finance</text>
  <rect x="250" y="510" width="200" height="50" rx="9" fill="#D7F2EE"/><text x="350" y="535" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0D1B2E">ONE assignment, inherited</text>

  <!-- Entra flat -->
  <rect x="840" y="200" width="200" height="64" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="940" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">West Region</text><text x="940" y="248" text-anchor="middle" font-size="12" fill="#33414F">role assigned explicitly</text>
  <rect x="840" y="300" width="200" height="64" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="940" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">West Finance</text><text x="940" y="348" text-anchor="middle" font-size="12" fill="#C0392B">role must be assigned again</text>
  <text x="940" y="404" text-anchor="middle" font-size="13" fill="#C0392B">no structural relationship — no role flow</text>
  <rect x="840" y="510" width="200" height="50" rx="9" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/><text x="940" y="535" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#C0392B">N assignments, one per AU</text>
</svg>
