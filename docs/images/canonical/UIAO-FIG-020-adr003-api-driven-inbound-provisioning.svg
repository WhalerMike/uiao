<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- ADR-003 API-driven inbound provisioning architecture (ADR-093 blueprint).
       navy = source/authority · ice+navy border = cloud/Microsoft · teal border = UIAO integration layer
       · red = coexistence/legacy writeback · teal arrows = data flow. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <text x="60" y="60" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">ADR-003 — API-Driven Inbound Provisioning</text>
  <text x="60" y="94" font-size="19" fill="#5A5A5A">HR-agnostic: any HR source → middleware that computes OrgPath → Entra ID provisioning. AD writeback is coexistence-only.</text>

  <!-- HR System (source) -->
  <rect x="60" y="200" width="250" height="200" rx="12" fill="#0D1B2E"/>
  <text x="185" y="246" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">HR System</text>
  <text x="185" y="284" text-anchor="middle" font-size="15" fill="#D7F2EE">Workday OR Oracle</text>
  <text x="185" y="306" text-anchor="middle" font-size="15" fill="#D7F2EE">OR any source</text>
  <text x="185" y="346" text-anchor="middle" font-size="13" fill="#A9B8CA">(HR-system-agnostic —</text>
  <text x="185" y="366" text-anchor="middle" font-size="13" fill="#A9B8CA">native connector or adapter)</text>

  <!-- Middleware Layer (UIAO integration — teal border) -->
  <rect x="380" y="180" width="330" height="240" rx="12" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="4"/>
  <text x="545" y="218" text-anchor="middle" font-size="19" font-weight="bold" fill="#0D1B2E">Middleware Layer</text>
  <text x="545" y="240" text-anchor="middle" font-size="14" fill="#33414F">Azure Functions / Logic Apps</text>
  <g font-size="15" fill="#0D1B2E">
    <text x="408" y="282">• Schema normalization</text>
    <text x="408" y="312">• OrgPath calculation</text>
    <text x="408" y="342">• Validation</text>
    <text x="408" y="372">• Provenance logging</text>
  </g>

  <!-- Entra ID Provisioning Service (cloud) -->
  <rect x="780" y="180" width="330" height="240" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="945" y="218" text-anchor="middle" font-size="19" font-weight="bold" fill="#0D1B2E">Entra ID</text>
  <text x="945" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Provisioning Service</text>
  <g font-size="15" fill="#33414F">
    <text x="808" y="282">• Attribute mapping</text>
    <text x="808" y="312">• JML workflows</text>
    <text x="808" y="342">• Group assignment</text>
    <text x="808" y="372">• License assignment</text>
  </g>

  <!-- flow arrows -->
  <line x1="310" y1="300" x2="376" y2="300" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#arrow-teal)"/>
  <line x1="710" y1="300" x2="776" y2="300" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#arrow-teal)"/>

  <!-- Provisioning Agent (coexistence-only, legacy writeback — red) -->
  <path d="M945,420 L945,486" fill="none" stroke="#C0392B" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
  <rect x="780" y="490" width="330" height="150" rx="12" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="945" y="528" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Provisioning Agent</text>
  <text x="945" y="552" text-anchor="middle" font-size="14" fill="#33414F">On-prem · HA (2+ agents)</text>
  <text x="945" y="582" text-anchor="middle" font-size="15" fill="#33414F">• AD writeback</text>
  <rect x="828" y="600" width="234" height="28" rx="14" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="945" y="614" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#C0392B">coexistence only — transitional</text>

  <!-- left annotation: OrgPath origin -->
  <line x1="545" y1="420" x2="545" y2="470" stroke="#1E8C8C" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="380" y="470" width="330" height="74" rx="10" fill="#D7F2EE"/>
  <text x="545" y="500" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D1B2E">OrgPath is computed here</text>
  <text x="545" y="522" text-anchor="middle" font-size="13" fill="#33414F">— independent of the HR source system —</text>
  <text x="545" y="538" text-anchor="middle" font-size="12" fill="#6B7A8D">so a future HR change never re-opens the provisioning contract</text>
</svg>
