<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO_135 AD -> Entra ID transformation inventory (ADR-093 blueprint).
       navy = legacy AD · ice+navy border = modern Entra/cloud · teal = transform arrow. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="60" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">UIAO_135 — AD → Entra ID Transformation Inventory</text>
  <text x="60" y="94" font-size="19" fill="#5A5A5A">Seventeen transformations across four categories — each a legacy Active Directory construct recast as a modern cloud-native control.</text>

  <!-- column headers -->
  <text x="430" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">ACTIVE DIRECTORY  (legacy)</text>
  <text x="940" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E8C8C">ENTRA ID / CLOUD  (modern)</text>

  <!-- ===== Lane template: category | legacy(navy) | arrow | modern(ice) ===== -->
  <!-- Lane 1: Structural -->
  <text x="60" y="186" font-size="15" font-weight="bold" fill="#6B7A8D">STRUCTURAL</text>
  <rect x="260" y="150" width="340" height="78" rx="9" fill="#0D1B2E"/>
  <text x="430" y="180" text-anchor="middle" font-size="15" fill="#FFFFFF">X.500 OU tree</text>
  <text x="430" y="204" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#D7F2EE">OU=IT,OU=Baltimore,OU=East</text>
  <line x1="604" y1="189" x2="696" y2="189" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="700" y="150" width="460" height="78" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="930" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">OrgPath attribute path</text>
  <text x="930" y="204" text-anchor="middle" font-size="13" fill="#33414F">Dynamic Groups · Administrative Units</text>

  <!-- Lane 2: Identity Object -->
  <text x="60" y="284" font-size="15" font-weight="bold" fill="#6B7A8D">IDENTITY</text>
  <text x="60" y="302" font-size="15" font-weight="bold" fill="#6B7A8D">OBJECT</text>
  <rect x="260" y="250" width="340" height="78" rx="9" fill="#0D1B2E"/>
  <text x="430" y="280" text-anchor="middle" font-size="15" fill="#FFFFFF">Users · domain-joined PCs</text>
  <text x="430" y="304" text-anchor="middle" font-size="13" fill="#D7F2EE">service accounts · SQL Windows auth</text>
  <line x1="604" y1="289" x2="696" y2="289" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="700" y="250" width="460" height="78" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="930" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Entra users · Entra/Arc devices</text>
  <text x="930" y="304" text-anchor="middle" font-size="13" fill="#33414F">CBA / passwordless · workload identities</text>

  <!-- Lane 3: Policy -->
  <text x="60" y="386" font-size="15" font-weight="bold" fill="#6B7A8D">POLICY</text>
  <rect x="260" y="350" width="340" height="78" rx="9" fill="#0D1B2E"/>
  <text x="430" y="380" text-anchor="middle" font-size="15" fill="#FFFFFF">GPOs linked to OUs</text>
  <text x="430" y="404" text-anchor="middle" font-size="13" fill="#D7F2EE">security filtering · loopback</text>
  <line x1="604" y1="389" x2="696" y2="389" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="700" y="350" width="460" height="78" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="930" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Intune Settings Catalog · Scope Tags</text>
  <text x="930" y="404" text-anchor="middle" font-size="13" fill="#33414F">Conditional Access · continuous enforcement</text>

  <!-- Lane 4: Governance & Lifecycle -->
  <text x="60" y="486" font-size="15" font-weight="bold" fill="#6B7A8D">GOVERNANCE</text>
  <text x="60" y="504" font-size="15" font-weight="bold" fill="#6B7A8D">&amp; LIFECYCLE</text>
  <rect x="260" y="450" width="340" height="78" rx="9" fill="#0D1B2E"/>
  <text x="430" y="480" text-anchor="middle" font-size="15" fill="#FFFFFF">Manual provisioning</text>
  <text x="430" y="504" text-anchor="middle" font-size="13" fill="#D7F2EE">periodic audits · ticket governance</text>
  <line x1="604" y1="489" x2="696" y2="489" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="700" y="450" width="460" height="78" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="930" y="480" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">HR-driven JML · OSCAL baselines</text>
  <text x="930" y="504" text-anchor="middle" font-size="13" fill="#33414F">drift detection · provenance chain</text>

  <!-- coverage legend -->
  <line x1="60" y1="566" x2="1220" y2="566" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="60" y="600" font-size="15" font-weight="bold" fill="#33414F">Coverage:</text>
  <circle cx="190" cy="595" r="7" fill="#1E8C8C"/>
  <text x="204" y="600" dominant-baseline="central" font-size="14" fill="#33414F">well-defined (ADR-backed)</text>
  <circle cx="470" cy="595" r="7" fill="#D4A017"/>
  <text x="484" y="600" dominant-baseline="central" font-size="14" fill="#33414F">partially defined — needs canonical spec</text>
  <circle cx="820" cy="595" r="7" fill="#C0392B"/>
  <text x="834" y="600" dominant-baseline="central" font-size="14" fill="#33414F">gap — not yet defined</text>
  <text x="60" y="648" font-size="14" fill="#6B7A8D">Open gaps: AD Sites/Subnets → Named Locations · ADCS → Cloud PKI/CBA · Kerberos/NTLM elimination · LDAP-app migration.</text>
</svg>
