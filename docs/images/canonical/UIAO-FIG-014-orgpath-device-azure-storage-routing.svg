<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
  <marker id="ar-grey-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#5A5A5A"/></marker>
</defs>

<!-- Title -->
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">OrgPath storage routing for devices and Azure resources</text>

<!-- ============ TOP: Shared validator codebook tile ============ -->
<rect x="500" y="118" width="280" height="74" rx="10" fill="#0D1B2E"/>
<!-- folder/git pictogram -->
<path d="M524 142 h16 l5 6 h17 a3 3 0 0 1 3 3 v17 a3 3 0 0 1 -3 3 h-38 a3 3 0 0 1 -3 -3 v-23 a3 3 0 0 1 3 -3 z" fill="none" stroke="#1E8C8C" stroke-width="2"/>
<circle cx="552" cy="162" r="3" fill="#1E8C8C"/>
<text x="600" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Codebook</text>
<text x="600" y="172" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#C7D4E6" text-anchor="middle" dominant-baseline="central">UIAO_151</text>

<!-- validates arrows from codebook down to each cylinder -->
<path d="M700 192 C 820 250, 980 250, 1058 318" fill="none" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<path d="M620 192 C 760 360, 980 470, 1058 522" fill="none" stroke="#1E8C8C" stroke-width="2" marker-end="url(#ar-teal)"/>
<text x="900" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">validates</text>
<text x="820" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-style="italic" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">validates</text>

<!-- ============ LEFT COLUMN: Computer Disposition Matrix ============ -->
<rect x="60" y="300" width="232" height="120" rx="10" fill="#0D1B2E"/>
<!-- branching pictogram -->
<g stroke="#1E8C8C" stroke-width="2" fill="none">
  <circle cx="92" cy="360" r="5"/>
  <path d="M97 360 h14"/>
  <path d="M111 360 v-18 h12"/>
  <path d="M111 360 v18 h12"/>
  <circle cx="127" cy="342" r="4" fill="#1E8C8C"/>
  <circle cx="127" cy="378" r="4" fill="#1E8C8C"/>
</g>
<text x="190" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Computer</text>
<text x="190" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Disposition Matrix</text>

<!-- fan-out arrows to upper transport (Graph) -->
<path d="M292 330 C 380 300, 440 280, 532 256" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="395" y="278" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">ENTRA-DEVICE</text>

<!-- fan-out arrows to lower transport (ARM) x3 -->
<path d="M292 360 C 390 420, 450 470, 532 488" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="392" y="438" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">ARC-SERVER</text>

<path d="M292 384 C 380 470, 450 500, 532 502" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="370" y="495" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">STAY-AD-DEPENDENCY</text>

<path d="M292 404 C 360 540, 440 520, 532 516" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="358" y="556" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">MANAGED-IDENTITY-CANDIDATE</text>

<!-- combined no-write arrow -->
<path d="M190 420 v 152" fill="none" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<text x="210" y="470" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="bold" fill="#1E8C8C" text-anchor="start" dominant-baseline="central">STAY-AD-DC</text>
<text x="210" y="490" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="bold" fill="#1E8C8C" text-anchor="start" dominant-baseline="central">DECOMMISSION</text>
<!-- no-entry pictogram -->
<circle cx="190" cy="600" r="18" fill="#FFFFFF" stroke="#C0392B" stroke-width="3"/>
<line x1="178" y1="588" x2="202" y2="612" stroke="#C0392B" stroke-width="3"/>
<text x="222" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" font-weight="bold" fill="#C0392B" text-anchor="start" dominant-baseline="central">no write</text>

<!-- ============ MIDDLE COLUMN: Two write transports ============ -->
<!-- Microsoft Graph (top) -->
<rect x="532" y="230" width="262" height="106" rx="10" fill="#0D1B2E"/>
<!-- Graph node-edge pictogram -->
<g stroke="#1E8C8C" stroke-width="2" fill="none">
  <line x1="558" y1="262" x2="578" y2="278"/>
  <line x1="578" y1="278" x2="566" y2="300"/>
  <circle cx="556" cy="260" r="4" fill="#1E8C8C"/>
  <circle cx="580" cy="278" r="4" fill="#1E8C8C"/>
  <circle cx="564" cy="302" r="4" fill="#1E8C8C"/>
</g>
<text x="612" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">Microsoft Graph</text>
<text x="612" y="300" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#C7D4E6" text-anchor="start" dominant-baseline="central">PATCH /devices/{object_id}</text>

<!-- Azure Resource Manager (bottom) -->
<rect x="532" y="466" width="262" height="106" rx="10" fill="#0D1B2E"/>
<!-- ARM stacked-layers pictogram -->
<g stroke="#1E8C8C" stroke-width="2" fill="none">
  <path d="M553 500 l12 -7 l12 7 l-12 7 z"/>
  <path d="M553 512 l12 7 l12 -7"/>
  <path d="M553 524 l12 7 l12 -7"/>
</g>
<text x="600" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">Azure Resource</text>
<text x="600" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">Manager</text>
<text x="553" y="556" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#C7D4E6" text-anchor="start" dominant-baseline="central">PATCH api-version=2023-03-15-preview</text>

<!-- transport -> cylinder arrows -->
<line x1="794" y1="283" x2="1012" y2="320" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>
<line x1="794" y1="519" x2="1012" y2="524" stroke="#1E8C8C" stroke-width="2.2" marker-end="url(#ar-teal)"/>

<!-- ============ RIGHT COLUMN: Two storage cylinders ============ -->
<!-- Entra Device cylinder (top) -->
<g>
  <path d="M1022 312 v76 a58 16 0 0 0 116 0 v-76" fill="#2E75B6" stroke="#1E5A8C" stroke-width="1.5"/>
  <ellipse cx="1080" cy="312" rx="58" ry="16" fill="#2E75B6" stroke="#1E5A8C" stroke-width="1.5"/>
  <text x="1080" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Entra Device</text>
</g>
<text x="1080" y="412" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">extensionAttribute1</text>

<!-- Arc Machine cylinder (bottom) -->
<g>
  <path d="M1022 516 v76 a58 16 0 0 0 116 0 v-76" fill="#2E75B6" stroke="#1E5A8C" stroke-width="1.5"/>
  <ellipse cx="1080" cy="516" rx="58" ry="16" fill="#2E75B6" stroke="#1E5A8C" stroke-width="1.5"/>
  <text x="1080" y="554" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Arc Machine</text>
</g>
<text x="1080" y="616" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#33414F" text-anchor="middle" dominant-baseline="central">ARM tag: OrgPath</text>

<!-- double-arrow between cylinders: validates against same codebook -->
<line x1="1080" y1="430" x2="1080" y2="478" stroke="#1E8C8C" stroke-width="2" marker-start="url(#ar-grey-start)" marker-end="url(#ar-teal)"/>
<rect x="930" y="438" width="156" height="0" />
<text x="1015" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">validates against</text>
<text x="1015" y="463" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">same codebook</text>

<!-- ============ BOTTOM-RIGHT: inheritance / derived boxes ============ -->
<rect x="900" y="652" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.2"/>
<text x="980" y="677" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">Intune scope tag</text>
<path d="M1010 652 C 1030 480, 1060 470, 1075 422" fill="none" stroke="#5A5A5A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar-grey)"/>
<text x="1118" y="640" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">derives from</text>

<rect x="1100" y="652" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.2"/>
<text x="1180" y="671" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">Azure Policy</text>
<text x="1180" y="687" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">targeting</text>
<path d="M1160 652 C 1150 630, 1110 610, 1100 612" fill="none" stroke="#5A5A5A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar-grey)"/>
<text x="1200" y="624" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">reads</text>
</svg>
