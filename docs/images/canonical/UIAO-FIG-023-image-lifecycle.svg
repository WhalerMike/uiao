<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Figure lifecycle: draft -> current -> deprecated (ADR-093 blueprint). -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>
  <text x="60" y="64" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">Figure Registry Lifecycle</text>
  <text x="60" y="98" font-size="19" fill="#5A5A5A">A registered image moves draft → current → deprecated; each transition is a reviewed PR.</text>

  <!-- three states -->
  <rect x="120" y="270" width="220" height="100" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="230" y="320" text-anchor="middle" font-size="20" font-weight="bold" fill="#0D1B2E">draft</text>
  <text x="230" y="346" text-anchor="middle" font-size="13" fill="#33414F">prompt exists, no PNG</text>

  <rect x="530" y="270" width="220" height="100" rx="12" fill="#0D1B2E"/>
  <text x="640" y="320" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">current</text>
  <text x="640" y="346" text-anchor="middle" font-size="13" fill="#D7F2EE">rendered + approved</text>

  <rect x="940" y="270" width="220" height="100" rx="12" fill="#EAF1FB" stroke="#5A5A5A" stroke-width="2"/>
  <text x="1050" y="320" text-anchor="middle" font-size="20" font-weight="bold" fill="#5A5A5A">deprecated</text>
  <text x="1050" y="346" text-anchor="middle" font-size="13" fill="#5A5A5A">superseded, retained</text>

  <!-- PR transitions -->
  <line x1="340" y1="320" x2="526" y2="320" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#arrow-teal)"/>
  <text x="433" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8C8C">PR review</text>
  <line x1="750" y1="320" x2="936" y2="320" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#arrow-teal)"/>
  <text x="843" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8C8C">PR review</text>

  <!-- rejected -> deleted (from draft) -->
  <path d="M230,370 L230,470 L640,470" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
  <text x="250" y="500" font-size="14" fill="#C0392B">rejected → deleted from branch</text>

  <!-- version bump self-loop on current -->
  <path d="M690,270 C720,210 560,210 590,270" fill="none" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="640" y="200" text-anchor="middle" font-size="13" fill="#33414F">version bump — same ID, new version</text>

  <line x1="60" y1="556" x2="1220" y2="556" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="60" y="592" font-size="15" fill="#33414F">Status lives in the image registry: <tspan font-family="Consolas, monospace" fill="#0D1B2E">draft</tspan> means the prompt exists but the PNG isn't rendered; <tspan font-family="Consolas, monospace" fill="#0D1B2E">current</tspan> means rendered and approved.</text>
</svg>
