<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO_194 LocPath codebook (ADR-093 blueprint).
       navy = governed levels/primary · teal = path connectors · ice = observational / classification. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <text x="60" y="60" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">UIAO_194 — LocPath Codebook</text>
  <text x="60" y="94" font-size="19" fill="#5A5A5A">LocPath is the OrgPath counterpart for place — a governed, hierarchical, path-based address for physical location.</text>

  <!-- six-level hierarchy -->
  <text x="60" y="142" font-size="15" font-weight="bold" fill="#6B7A8D">HIERARCHY  (Country → Region → Site → Building → Floor → Space)</text>
  <!-- boxes -->
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="60"   y="156" width="170" height="60" rx="9" fill="#0D1B2E"/><text x="145"  y="190" fill="#FFFFFF">Country</text>
    <rect x="256"  y="156" width="170" height="60" rx="9" fill="#0D1B2E"/><text x="341"  y="190" fill="#FFFFFF">Region</text>
    <rect x="452"  y="156" width="170" height="60" rx="9" fill="#0D1B2E" stroke="#1E8C8C" stroke-width="4"/><text x="537" y="190" fill="#FFFFFF">Site</text>
    <rect x="648"  y="156" width="170" height="60" rx="9" fill="#0D1B2E"/><text x="733"  y="190" fill="#FFFFFF">Building</text>
    <rect x="844"  y="156" width="170" height="60" rx="9" fill="#0D1B2E"/><text x="929"  y="190" fill="#FFFFFF">Floor</text>
    <rect x="1040" y="156" width="170" height="60" rx="9" fill="#0D1B2E"/><text x="1125" y="190" fill="#FFFFFF">Space</text>
  </g>
  <g stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)">
    <line x1="230" y1="186" x2="252" y2="186"/>
    <line x1="426" y1="186" x2="448" y2="186"/>
    <line x1="622" y1="186" x2="644" y2="186"/>
    <line x1="818" y1="186" x2="840" y2="186"/>
    <line x1="1014" y1="186" x2="1036" y2="186"/>
  </g>
  <!-- sample path -->
  <text x="60" y="252" font-family="Consolas, monospace" font-size="16" fill="#0D1B2E">/US / EAST / BALT-DC1 / BLDG-A / FL-03 / RM-3120</text>

  <!-- classification surfaces hang off Site -->
  <text x="60" y="300" font-size="15" font-weight="bold" fill="#6B7A8D">CLASSIFICATION SURFACES  (primarily at Site)</text>
  <rect x="60"  y="314" width="360" height="64" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="240" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">E911 dispatchable location</text>
  <text x="240" y="362" text-anchor="middle" font-size="13" fill="#33414F">Building / Floor / Space</text>
  <rect x="440" y="314" width="360" height="64" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="620" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Network / TIC 3.0</text>
  <text x="620" y="362" text-anchor="middle" font-size="13" fill="#33414F">trust-zone &amp; ingress classification</text>
  <rect x="820" y="314" width="390" height="64" rx="9" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1015" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D1B2E">Telemetry / service boundaries</text>
  <text x="1015" y="362" text-anchor="middle" font-size="13" fill="#33414F">log scope &amp; service-edge mapping</text>

  <!-- two-layer model -->
  <text x="60" y="426" font-size="15" font-weight="bold" fill="#6B7A8D">TWO-LAYER LOCATION MODEL</text>
  <rect x="60" y="440" width="560" height="86" rx="10" fill="#0D1B2E"/>
  <text x="340" y="472" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Primary LocPath — governed</text>
  <text x="340" y="498" text-anchor="middle" font-size="14" fill="#D7F2EE">the SSOT assignment: where a site/space/person belongs</text>
  <rect x="650" y="440" width="560" height="86" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="930" y="472" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Dynamic Location Context — observational</text>
  <text x="930" y="498" text-anchor="middle" font-size="14" fill="#33414F">observed presence; never overwrites the governed value</text>

  <!-- matrix footer -->
  <rect x="60" y="560" width="1150" height="120" rx="10" fill="#D7F2EE"/>
  <text x="84" y="594" font-size="17" font-weight="bold" fill="#0D1B2E">Matrix governance with OrgPath</text>
  <text x="84" y="624" font-size="14" fill="#33414F">LocPath (physical place) and OrgPath (organizational placement) are orthogonal addressing dimensions — LocPath is a second</text>
  <text x="84" y="646" font-size="14" fill="#33414F">dimension, not a sixteenth facet. Matrix governance binds the two so policy can target by where-in-org and where-in-space together.</text>
  <text x="84" y="668" font-size="13" fill="#6B7A8D">Scope: identity-governance-relevant location only (Moderate / Commercial). Facilities ops, network orchestration, and call routing are out of scope.</text>
</svg>
