<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Git server (UIAO-GIT01) network interfaces (ADR-093 blueprint). -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>
  <text x="60" y="52" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#0D1B2E">UIAO-GIT01 — Network Interfaces</text>
  <text x="60" y="82" font-size="17" fill="#5A5A5A">Every inbound and outbound flow on the platform git server (WS2025), with its caller.</text>

  <!-- source actors (left) -->
  <g font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="end">
    <text x="210" y="135">Operators</text>
    <text x="210" y="165">Operators</text>
    <text x="210" y="195">Operators</text>
    <text x="210" y="235">Forest</text>
    <text x="210" y="265">Tenant</text>
    <text x="210" y="295">Arc plane</text>
    <text x="210" y="325">Backup</text>
    <text x="210" y="355">ConMon</text>
    <text x="210" y="385">GitHub</text>
  </g>
  <g stroke="#1E8C8C" stroke-width="2" marker-end="url(#arrow-teal)">
    <line x1="220" y1="130" x2="294" y2="130"/><line x1="220" y1="160" x2="294" y2="160"/><line x1="220" y1="190" x2="294" y2="190"/>
    <line x1="220" y1="230" x2="294" y2="230"/><line x1="220" y1="260" x2="294" y2="260"/><line x1="220" y1="290" x2="294" y2="290"/>
    <line x1="220" y1="320" x2="294" y2="320"/><line x1="220" y1="350" x2="294" y2="350"/><line x1="220" y1="380" x2="294" y2="380"/>
  </g>

  <!-- server box -->
  <rect x="300" y="106" width="920" height="312" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <g font-family="Consolas, monospace" font-size="14.5" fill="#0D1B2E">
    <text x="320" y="135">TCP/443 HTTPS  ── IIS ── 127.0.0.1:3000 ── Gitea   (HSTS, X-Frame DENY, nosniff)</text>
    <text x="320" y="165">TCP/2222 SSH (Gitea built-in SSH server)</text>
    <text x="320" y="195">TCP/5986 WinRM (Tier-0 admin subnet allowlist)</text>
  </g>
  <line x1="320" y1="212" x2="1200" y2="212" stroke="#E3E8EF" stroke-width="1.5"/>
  <g font-family="Consolas, monospace" font-size="14.5" fill="#33414F">
    <text x="320" y="235">TCP/636 LDAPS (outbound — Gitea binds to dc01)</text>
    <text x="320" y="265">HTTPS → login.microsoftonline.com / graph.*</text>
    <text x="320" y="295">HTTPS → *.his.arc.azure.com / *.guestconfig.*</text>
    <text x="320" y="325">HTTPS → *.blob.core.windows.net (RG-scoped)</text>
    <text x="320" y="355">HTTPS → *.ods.opinsights.azure.com (Log Analytics)</text>
    <text x="320" y="385">HTTPS → api.github.com (pull-mirror, every 15 min)</text>
  </g>

  <!-- storage + governance footer -->
  <rect x="300" y="440" width="450" height="120" rx="10" fill="#0D1B2E"/>
  <text x="322" y="470" font-size="15" font-weight="bold" fill="#FFFFFF">Storage</text>
  <g font-family="Consolas, monospace" font-size="14" fill="#D7F2EE"><text x="322" y="500">D:\GitRepos\  ── bare repos (NTFS, gMSA-owned)</text><text x="322" y="528">D:\Gitea\     ── binary, app.ini, lfs, hooks</text></g>

  <rect x="770" y="440" width="450" height="120" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="792" y="470" font-size="15" font-weight="bold" fill="#0D1B2E">Governance</text>
  <g font-family="Consolas, monospace" font-size="14" fill="#0D1B2E"><text x="792" y="500">OrgPath: NCR / IT / InfraOps (ea1-3, ea15)</text><text x="792" y="528">AU: AU-NCR-IT-InfraOps (Tier-3, restricted)</text></g>
</svg>
