<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1080" height="1080" fill="#FFFFFF"/>
<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>

<!-- Title -->
<text x="60" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" fill="#0D1B2E" text-anchor="start">Getting Started with UIAO</text>
<text x="62" y="126" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#6B7A8D" text-anchor="start">A four-step engagement path from sponsorship to agency-wide coverage</text>

<!-- ===================== STEP PATH =====================
     Card geometry: x=130, width=820, height=140, left number-badge column.
     Card tops: 168, 348, 528, 708. Gap 40 (connector arrows). -->

<!-- Connector spine: badge centerline x=200 -->

<!-- STEP 1 -->
<rect x="130" y="168" width="820" height="140" rx="16" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<!-- number badge -->
<rect x="130" y="168" width="140" height="140" rx="16" fill="#0D1B2E"/>
<rect x="252" y="168" width="18" height="140" fill="#0D1B2E"/>
<text x="200" y="241" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
<text x="300" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">Executive sponsorship</text>
<text x="300" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#33414F" text-anchor="start" dominant-baseline="central">Secure an agency owner and a clear adoption mandate.</text>

<!-- arrow 1 -> 2 -->
<line x1="200" y1="308" x2="200" y2="346" stroke="#1E8C8C" stroke-width="4" marker-end="url(#ar-teal)"/>

<!-- STEP 2 -->
<rect x="130" y="348" width="820" height="140" rx="16" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<rect x="130" y="348" width="140" height="140" rx="16" fill="#0D1B2E"/>
<rect x="252" y="348" width="18" height="140" fill="#0D1B2E"/>
<text x="200" y="421" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
<text x="300" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">Pilot prerequisites</text>
<text x="300" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#33414F" text-anchor="start" dominant-baseline="central">Scoped GCC-Moderate tenant; read access via Microsoft Graph.</text>

<!-- arrow 2 -> 3 -->
<line x1="200" y1="488" x2="200" y2="526" stroke="#1E8C8C" stroke-width="4" marker-end="url(#ar-teal)"/>

<!-- STEP 3 -->
<rect x="130" y="528" width="820" height="140" rx="16" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<rect x="130" y="528" width="140" height="140" rx="16" fill="#0D1B2E"/>
<rect x="252" y="528" width="18" height="140" fill="#0D1B2E"/>
<text x="200" y="601" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
<text x="300" y="582" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">Deploy &amp; observe</text>
<text x="300" y="622" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#33414F" text-anchor="start" dominant-baseline="central">Continuous monitoring goes live; drift surfaces in minutes.</text>

<!-- arrow 3 -> 4 -->
<line x1="200" y1="668" x2="200" y2="706" stroke="#1E8C8C" stroke-width="4" marker-end="url(#ar-teal)"/>

<!-- STEP 4 -->
<rect x="130" y="708" width="820" height="140" rx="16" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
<rect x="130" y="708" width="140" height="140" rx="16" fill="#0D1B2E"/>
<rect x="252" y="708" width="18" height="140" fill="#0D1B2E"/>
<text x="200" y="781" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
<text x="300" y="762" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0D1B2E" text-anchor="start" dominant-baseline="central">Scale across the agency</text>
<text x="300" y="802" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#33414F" text-anchor="start" dominant-baseline="central">Expand coverage; automate evidence and remediation.</text>

<!-- ===================== TEAL CALL-TO-ACTION FOOTER BAND ===================== -->
<rect x="130" y="912" width="820" height="96" rx="16" fill="#1E8C8C"/>
<text x="540" y="952" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#D7F2EE" text-anchor="middle" dominant-baseline="central" letter-spacing="3">NEXT STEP</text>
<text x="540" y="983" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Begin a scoped pilot</text>

<!-- ===================== FOOTER ID ===================== -->
<text x="60" y="1052" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#6B7A8D" text-anchor="start">UIAO-FIG-008</text>
</svg>
