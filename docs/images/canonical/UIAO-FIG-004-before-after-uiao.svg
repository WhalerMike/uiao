<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO-FIG-004 "Before and After UIAO" (ADR-093 house style). White bg; navy/teal/red palette. -->
  <defs>
    <marker id="tealArrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- white background -->
  <rect x="0" y="0" width="1080" height="1080" fill="#FFFFFF"/>

  <!-- title -->
  <text x="540" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="#0D1B2E">Before and After UIAO</text>
  <text x="540" y="162" text-anchor="middle" font-size="24" fill="#6B7A8D">Compliance operations: from manual and periodic to continuous and signed</text>

  <!-- vertical divider -->
  <line x1="540" y1="232" x2="540" y2="1010" stroke="#E3E8EF" stroke-width="2"/>

  <!-- ===== LEFT COLUMN: BEFORE ===== -->
  <!-- column header -->
  <rect x="70" y="232" width="420" height="74" rx="12" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="280" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#C0392B">BEFORE</text>

  <!-- row 1 -->
  <rect x="70" y="346" width="420" height="140" rx="12" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <circle cx="118" cy="416" r="7" fill="#C0392B"/>
  <text x="146" y="424" font-size="27" font-weight="bold" fill="#33414F">Manual remediation</text>

  <!-- row 2 -->
  <rect x="70" y="506" width="420" height="140" rx="12" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <circle cx="118" cy="576" r="7" fill="#C0392B"/>
  <text x="146" y="584" font-size="27" font-weight="bold" fill="#33414F">Periodic re-audit cycles</text>

  <!-- row 3 -->
  <rect x="70" y="666" width="420" height="140" rx="12" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <circle cx="118" cy="736" r="7" fill="#C0392B"/>
  <text x="146" y="744" font-size="27" font-weight="bold" fill="#33414F">Point-in-time snapshots</text>

  <!-- row 4 -->
  <rect x="70" y="826" width="420" height="140" rx="12" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <circle cx="118" cy="896" r="7" fill="#C0392B"/>
  <text x="146" y="904" font-size="27" font-weight="bold" fill="#33414F">Screenshot evidence</text>

  <!-- ===== RIGHT COLUMN: AFTER UIAO ===== -->
  <!-- column header -->
  <rect x="590" y="232" width="420" height="74" rx="12" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="800" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#1E8C8C">AFTER UIAO</text>

  <!-- row 1 -->
  <rect x="590" y="346" width="420" height="140" rx="12" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <circle cx="638" cy="416" r="7" fill="#1E8C8C"/>
  <text x="666" y="424" font-size="27" font-weight="bold" fill="#33414F">Real-time drift detection</text>

  <!-- row 2 -->
  <rect x="590" y="506" width="420" height="140" rx="12" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <circle cx="638" cy="576" r="7" fill="#1E8C8C"/>
  <text x="666" y="566" font-size="27" font-weight="bold" fill="#33414F">Automated evidence</text>
  <text x="666" y="600" font-size="27" font-weight="bold" fill="#33414F">generation</text>

  <!-- row 3 -->
  <rect x="590" y="666" width="420" height="140" rx="12" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <circle cx="638" cy="736" r="7" fill="#1E8C8C"/>
  <text x="666" y="744" font-size="27" font-weight="bold" fill="#33414F">Continuous posture</text>

  <!-- row 4 -->
  <rect x="590" y="826" width="420" height="140" rx="12" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <circle cx="638" cy="896" r="7" fill="#1E8C8C"/>
  <text x="666" y="904" font-size="27" font-weight="bold" fill="#33414F">Signed provenance chain</text>

  <!-- ===== center teal arrow ===== -->
  <circle cx="540" cy="576" r="46" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="3"/>
  <line x1="512" y1="576" x2="560" y2="576" stroke="#1E8C8C" stroke-width="7" marker-end="url(#tealArrow)"/>
</svg>
