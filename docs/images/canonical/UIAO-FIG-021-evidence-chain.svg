<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Evidence chain pipeline (ADR-093 blueprint). navy stages · teal arrows · grey sub-captions. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>
  <text x="60" y="64" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">The Evidence Chain</text>
  <text x="60" y="98" font-size="19" fill="#5A5A5A">Telemetry becomes auditor-ready output through four sealed, provenance-anchored stages.</text>

  <!-- 4 stages -->
  <g>
    <rect x="70" y="250" width="240" height="150" rx="12" fill="#0D1B2E"/>
    <text x="190" y="300" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Telemetry</text>
    <text x="190" y="326" text-anchor="middle" font-size="16" fill="#FFFFFF">event capture</text>
    <text x="190" y="436" text-anchor="middle" font-size="13" fill="#6B7A8D">adapter boundary</text>

    <rect x="370" y="250" width="240" height="150" rx="12" fill="#0D1B2E"/>
    <text x="490" y="300" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Canonical claim</text>
    <text x="490" y="326" text-anchor="middle" font-size="16" fill="#FFFFFF">normalization</text>
    <text x="490" y="436" text-anchor="middle" font-size="13" fill="#6B7A8D">ProvenanceProfile (UIAO_PP_001 v1.0)</text>

    <rect x="670" y="250" width="240" height="150" rx="12" fill="#0D1B2E"/>
    <text x="790" y="300" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Evidence bundle</text>
    <text x="790" y="326" text-anchor="middle" font-size="16" fill="#FFFFFF">assembly + seal</text>
    <text x="790" y="436" text-anchor="middle" font-size="13" fill="#6B7A8D">ADR-016 lifecycle + bundle schema</text>

    <rect x="970" y="250" width="240" height="150" rx="12" fill="#0D1B2E" stroke="#1E8C8C" stroke-width="4"/>
    <text x="1090" y="300" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">OSCAL artifact</text>
    <text x="1090" y="326" text-anchor="middle" font-size="16" fill="#FFFFFF">emission</text>
    <text x="1090" y="436" text-anchor="middle" font-size="13" fill="#6B7A8D">SSP · POA&amp;M · KSI · Component Def</text>
  </g>
  <g stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#arrow-teal)">
    <line x1="310" y1="325" x2="366" y2="325"/>
    <line x1="610" y1="325" x2="666" y2="325"/>
    <line x1="910" y1="325" x2="966" y2="325"/>
  </g>
  <line x1="60" y1="480" x2="1220" y2="480" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="60" y="516" font-size="15" fill="#33414F">Every stage cites the canon document ID and version it derives from — the chain is provenance-anchored end to end, so any artifact resolves back to the telemetry that produced it.</text>
</svg>
