<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Hybrid DNS resolution (ADR-093 blueprint). navy on-prem · ice cloud · teal flow · IPAM SSOT. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>
  <text x="60" y="56" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#0D1B2E">Hybrid DNS Resolution</text>
  <text x="60" y="88" font-size="18" fill="#5A5A5A">On-prem and cloud namespaces resolve through the Azure DNS Private Resolver; IPAM is the single source of truth.</text>

  <text x="170" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#6B7A8D">ON-PREM NAMESPACE</text>
  <text x="640" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#6B7A8D">HYBRID PATH</text>
  <text x="1090" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#6B7A8D">CLOUD NAMESPACE</text>

  <!-- On-prem -->
  <rect x="60" y="156" width="220" height="130" rx="10" fill="#0D1B2E"/>
  <g font-family="Consolas, monospace" font-size="15" fill="#FFFFFF"><text x="82" y="192">UIAO-GIT01.corp</text><text x="82" y="222">fileserver.corp</text><text x="82" y="252">printer.corp</text></g>

  <!-- Private Resolver -->
  <rect x="450" y="146" width="380" height="150" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="178" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Azure DNS Private Resolver</text>
  <text x="640" y="214" text-anchor="middle" font-size="15" fill="#33414F">inbound endpoint</text>
  <text x="640" y="240" text-anchor="middle" font-size="15" fill="#33414F">⇕</text>
  <text x="640" y="266" text-anchor="middle" font-size="15" fill="#33414F">outbound endpoint</text>

  <!-- Cloud namespace -->
  <rect x="1000" y="156" width="220" height="130" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <g font-family="Consolas, monospace" font-size="14" fill="#33414F"><text x="1022" y="200">privatelink.</text><text x="1022" y="224">blob.core.</text><text x="1022" y="248">windows.net</text></g>

  <!-- arrows top row -->
  <line x1="280" y1="221" x2="446" y2="221" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="363" y="210" text-anchor="middle" font-size="13" fill="#1E8C8C">conditional forwarder</text>
  <line x1="834" y1="221" x2="996" y2="221" stroke="#1E8C8C" stroke-width="3" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>

  <!-- down to private DNS zone -->
  <line x1="640" y1="296" x2="640" y2="346" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="450" y="348" width="380" height="110" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="382" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">Azure Private DNS Zone</text>
  <text x="640" y="410" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#0D1B2E">uiao.internal</text>
  <text x="640" y="434" text-anchor="middle" font-size="14" fill="#5A5A5A">(authoritative)</text>

  <!-- down to IPAM SSOT -->
  <line x1="640" y1="458" x2="640" y2="508" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="470" y="510" width="340" height="100" rx="10" fill="#0D1B2E" stroke="#1E8C8C" stroke-width="4"/>
  <text x="640" y="546" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">IPAM (DM_010)</text>
  <text x="640" y="576" text-anchor="middle" font-size="15" fill="#D7F2EE">single source of truth</text>
</svg>
