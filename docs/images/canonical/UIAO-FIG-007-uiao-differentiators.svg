<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO-FIG-007 "How UIAO Is Different" (ADR-093 house style).
       Square 1:1. White bg; navy title, red conventional chips, teal UIAO chips.
       Pure SVG, no foreignObject. Three stacked contrast rows. -->
  <defs>
    <marker id="tealArrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- white background -->
  <rect x="0" y="0" width="1080" height="1080" fill="#FFFFFF"/>

  <!-- title -->
  <text x="540" y="116" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#0D1B2E">How UIAO Is Different</text>
  <text x="540" y="160" text-anchor="middle" font-size="24" fill="#6B7A8D">Three ways UIAO goes beyond a conventional compliance dashboard</text>
  <line x1="60" y1="196" x2="1020" y2="196" stroke="#E3E8EF" stroke-width="2"/>

  <!-- legend -->
  <rect x="338" y="218" width="24" height="24" rx="5" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="372" y="236" font-size="20" fill="#5A5A5A">Conventional dashboard</text>
  <rect x="638" y="218" width="24" height="24" rx="5" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="672" y="236" font-size="20" fill="#5A5A5A">The UIAO approach</text>

  <!-- ===================== ROW 1 ===================== -->
  <rect x="60" y="276" width="960" height="234" rx="18" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="2"/>
  <!-- number badge -->
  <circle cx="132" cy="393" r="40" fill="#0D1B2E"/>
  <text x="132" y="393" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#FFFFFF">1</text>
  <!-- differentiator -->
  <text x="196" y="328" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#0D1B2E">Continuous, not point-in-time</text>
  <!-- conventional chip -->
  <rect x="196" y="356" width="340" height="124" rx="12" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="216" y="392" font-size="18" font-weight="bold" fill="#C0392B">CONVENTIONAL</text>
  <text x="216" y="428" font-size="25" font-weight="bold" fill="#33414F">Periodic dashboard</text>
  <text x="216" y="460" font-size="25" font-weight="bold" fill="#33414F">snapshot</text>
  <!-- arrow -->
  <line x1="552" y1="418" x2="600" y2="418" stroke="#1E8C8C" stroke-width="6" marker-end="url(#tealArrow)"/>
  <!-- UIAO chip -->
  <rect x="616" y="356" width="384" height="124" rx="12" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="636" y="392" font-size="18" font-weight="bold" fill="#1E8C8C">UIAO</text>
  <text x="636" y="428" font-size="25" font-weight="bold" fill="#33414F">Evaluated constantly,</text>
  <text x="636" y="460" font-size="25" font-weight="bold" fill="#33414F">drift in minutes</text>

  <!-- ===================== ROW 2 ===================== -->
  <rect x="60" y="538" width="960" height="234" rx="18" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="2"/>
  <circle cx="132" cy="655" r="40" fill="#0D1B2E"/>
  <text x="132" y="655" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="196" y="590" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#0D1B2E">Provenance-backed, not screenshots</text>
  <rect x="196" y="618" width="340" height="124" rx="12" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="216" y="654" font-size="18" font-weight="bold" fill="#C0392B">CONVENTIONAL</text>
  <text x="216" y="690" font-size="25" font-weight="bold" fill="#33414F">Manual screenshot</text>
  <text x="216" y="722" font-size="25" font-weight="bold" fill="#33414F">evidence</text>
  <line x1="552" y1="680" x2="600" y2="680" stroke="#1E8C8C" stroke-width="6" marker-end="url(#tealArrow)"/>
  <rect x="616" y="618" width="384" height="124" rx="12" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="636" y="654" font-size="18" font-weight="bold" fill="#1E8C8C">UIAO</text>
  <text x="636" y="690" font-size="25" font-weight="bold" fill="#33414F">Cryptographically signed</text>
  <text x="636" y="722" font-size="25" font-weight="bold" fill="#33414F">evidence chain</text>

  <!-- ===================== ROW 3 ===================== -->
  <rect x="60" y="800" width="960" height="234" rx="18" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="2"/>
  <circle cx="132" cy="917" r="40" fill="#0D1B2E"/>
  <text x="132" y="917" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="196" y="852" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#0D1B2E">Governs, not just reports</text>
  <rect x="196" y="880" width="340" height="124" rx="12" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <text x="216" y="916" font-size="18" font-weight="bold" fill="#C0392B">CONVENTIONAL</text>
  <text x="216" y="952" font-size="25" font-weight="bold" fill="#33414F">Status display</text>
  <text x="216" y="984" font-size="25" font-weight="bold" fill="#33414F">only</text>
  <line x1="552" y1="942" x2="600" y2="942" stroke="#1E8C8C" stroke-width="6" marker-end="url(#tealArrow)"/>
  <rect x="616" y="880" width="384" height="124" rx="12" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="636" y="916" font-size="18" font-weight="bold" fill="#1E8C8C">UIAO</text>
  <text x="636" y="952" font-size="25" font-weight="bold" fill="#33414F">Closed-loop detection</text>
  <text x="636" y="984" font-size="25" font-weight="bold" fill="#33414F">+ remediation</text>
</svg>
