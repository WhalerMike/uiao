<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO-FIG-001 — UIAO Governance OS, overview / title card (ADR-093 house style).
       White background; navy/teal/amber palette; pure SVG, no foreignObject. -->
  <rect x="0" y="0" width="1080" height="1080" fill="#FFFFFF"/>

  <!-- thin frame -->
  <rect x="50" y="50" width="980" height="980" rx="20" fill="none" stroke="#E3E8EF" stroke-width="2"/>

  <!-- top accent bar -->
  <rect x="50" y="50" width="980" height="10" rx="5" fill="#1E8C8C"/>

  <!-- ============ HERO EMBLEM ============ -->
  <!-- concentric teal orbit rings around a navy hexagon shield -->
  <g>
    <circle cx="540" cy="240" r="118" fill="none" stroke="#1E8C8C" stroke-width="2" opacity="0.35"/>
    <circle cx="540" cy="240" r="100" fill="none" stroke="#1E8C8C" stroke-width="3" opacity="0.6"/>
    <!-- orbit node accents -->
    <circle cx="540" cy="140" r="7" fill="#1E8C8C"/>
    <circle cx="640" cy="240" r="7" fill="#1E8C8C"/>
    <circle cx="540" cy="340" r="7" fill="#1E8C8C"/>
    <circle cx="440" cy="240" r="7" fill="#1E8C8C"/>

    <!-- navy hexagon -->
    <polygon points="540,162 607,201 607,279 540,318 473,279 473,201"
             fill="#0D1B2E" stroke="#1E3A66" stroke-width="2"/>
    <!-- inner teal ring inside hex -->
    <circle cx="540" cy="240" r="44" fill="none" stroke="#1E8C8C" stroke-width="3"/>
    <circle cx="540" cy="240" r="14" fill="#1E8C8C"/>
  </g>

  <!-- ============ HERO TITLE ============ -->
  <text x="540" y="430" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
        font-size="116" fill="#0D1B2E" letter-spacing="6">UIAO</text>

  <text x="540" y="500" text-anchor="middle" dominant-baseline="central"
        font-size="30" fill="#33414F" letter-spacing="1">Unified Identity &amp; Access Orchestration</text>

  <!-- positioning line on a teal underline -->
  <line x1="270" y1="538" x2="810" y2="538" stroke="#E3E8EF" stroke-width="1"/>
  <text x="540" y="572" text-anchor="middle" dominant-baseline="central"
        font-size="26" font-weight="bold" fill="#1E8C8C">The Governance OS for Microsoft 365 — GCC-Moderate</text>

  <!-- ============ FOUR VALUE PILLARS ============ -->
  <!-- grid: 2 columns x 2 rows. cards 430 wide, 168 tall. -->
  <!-- col x: 90 and 560 ; row y: 638 and 826 -->

  <!-- Card 1 — Continuous compliance -->
  <g>
    <rect x="90" y="638" width="430" height="168" rx="14" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <rect x="90" y="638" width="8" height="168" rx="4" fill="#1E8C8C"/>
    <text x="124" y="690" dominant-baseline="central" font-size="28" font-weight="bold" fill="#0D1B2E">Continuous compliance</text>
    <text x="124" y="734" dominant-baseline="central" font-size="21" fill="#33414F">Posture checked constantly,</text>
    <text x="124" y="762" dominant-baseline="central" font-size="21" fill="#33414F">not quarterly</text>
  </g>

  <!-- Card 2 — Provenance-backed evidence -->
  <g>
    <rect x="560" y="638" width="430" height="168" rx="14" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <rect x="560" y="638" width="8" height="168" rx="4" fill="#1E8C8C"/>
    <text x="594" y="690" dominant-baseline="central" font-size="28" font-weight="bold" fill="#0D1B2E">Provenance-backed evidence</text>
    <text x="594" y="734" dominant-baseline="central" font-size="21" fill="#33414F">Cryptographically signed,</text>
    <text x="594" y="762" dominant-baseline="central" font-size="21" fill="#33414F">audit-ready</text>
  </g>

  <!-- Card 3 — OrgPath substrate -->
  <g>
    <rect x="90" y="826" width="430" height="168" rx="14" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <rect x="90" y="826" width="8" height="168" rx="4" fill="#1E8C8C"/>
    <text x="124" y="878" dominant-baseline="central" font-size="28" font-weight="bold" fill="#0D1B2E">OrgPath substrate</text>
    <text x="124" y="922" dominant-baseline="central" font-size="21" fill="#33414F">One organizational model</text>
    <text x="124" y="950" dominant-baseline="central" font-size="21" fill="#33414F">across every tool</text>
  </g>

  <!-- Card 4 — Drift detected in minutes -->
  <g>
    <rect x="560" y="826" width="430" height="168" rx="14" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
    <rect x="560" y="826" width="8" height="168" rx="4" fill="#D4A017"/>
    <text x="594" y="878" dominant-baseline="central" font-size="28" font-weight="bold" fill="#0D1B2E">Drift detected in minutes</text>
    <text x="594" y="922" dominant-baseline="central" font-size="21" fill="#33414F">Not discovered</text>
    <text x="594" y="950" dominant-baseline="central" font-size="21" fill="#33414F">at audit time</text>
  </g>
</svg>
