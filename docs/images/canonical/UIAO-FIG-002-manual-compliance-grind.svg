<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1080" height="1080" rx="0" fill="#FFFFFF"/>
<defs>
  <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>

<!-- ===================== TITLE ===================== -->
<text x="540" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="bold" fill="#0D1B2E" text-anchor="middle">The Manual Compliance Grind</text>
<text x="540" y="142" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#6B7A8D" text-anchor="middle">Current state — evidence assembled by hand, true only for a moment</text>

<!-- thin red rule under title -->
<line x1="340" y1="166" x2="740" y2="166" stroke="#C0392B" stroke-width="3"/>

<!-- ===================== THE PILE: OVERLAPPING ARTIFACT CARDS ===================== -->
<!-- Each card: rounded rect, navy fill, white label, a couple rotated for a "pile" feel. -->
<!-- Pile occupies the central band ~y=220..720 -->

<!-- Card: Shared drive folder (back, slightly rotated left) -->
<g transform="rotate(-7 300 360)">
  <rect x="180" y="300" width="240" height="120" rx="12" fill="#0D1B2E"/>
  <rect x="180" y="300" width="240" height="120" rx="12" fill="none" stroke="#1E3A66" stroke-width="2"/>
  <!-- folder glyph -->
  <path d="M 206 332 h 30 l 8 10 h 30 v 36 h -68 z" fill="none" stroke="#6B7A8D" stroke-width="2.5"/>
  <text x="300" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Shared drive folder</text>
</g>

<!-- Card: PDF export (back-right, slightly rotated right) -->
<g transform="rotate(8 760 350)">
  <rect x="640" y="290" width="230" height="120" rx="12" fill="#0D1B2E"/>
  <rect x="640" y="290" width="230" height="120" rx="12" fill="none" stroke="#1E3A66" stroke-width="2"/>
  <!-- doc glyph -->
  <path d="M 666 322 h 26 l 12 12 v 36 h -38 z" fill="none" stroke="#6B7A8D" stroke-width="2.5"/>
  <path d="M 692 322 v 12 h 12" fill="none" stroke="#6B7A8D" stroke-width="2.5"/>
  <text x="765" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PDF export</text>
</g>

<!-- Card: Email memo (mid-left) -->
<g transform="rotate(4 320 500)">
  <rect x="200" y="440" width="240" height="120" rx="12" fill="#0D1B2E"/>
  <rect x="200" y="440" width="240" height="120" rx="12" fill="none" stroke="#1E3A66" stroke-width="2"/>
  <!-- envelope glyph -->
  <rect x="226" y="470" width="46" height="32" rx="2" fill="none" stroke="#6B7A8D" stroke-width="2.5"/>
  <path d="M 226 472 L 249 488 L 272 472" fill="none" stroke="#6B7A8D" stroke-width="2.5"/>
  <text x="320" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Email memo</text>
</g>

<!-- Card: Screenshot (mid-right) -->
<g transform="rotate(-5 760 510)">
  <rect x="640" y="450" width="230" height="120" rx="12" fill="#0D1B2E"/>
  <rect x="640" y="450" width="230" height="120" rx="12" fill="none" stroke="#1E3A66" stroke-width="2"/>
  <!-- screen glyph -->
  <rect x="664" y="478" width="48" height="34" rx="2" fill="none" stroke="#6B7A8D" stroke-width="2.5"/>
  <line x1="680" y1="512" x2="696" y2="512" stroke="#6B7A8D" stroke-width="2.5"/>
  <line x1="688" y1="512" x2="688" y2="520" stroke="#6B7A8D" stroke-width="2.5"/>
  <text x="765" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Screenshot</text>
</g>

<!-- Card: Spreadsheet (front-left, on top of pile) -->
<g transform="rotate(-3 360 640)">
  <rect x="230" y="580" width="260" height="120" rx="12" fill="#0D1B2E"/>
  <rect x="230" y="580" width="260" height="120" rx="12" fill="none" stroke="#1E3A66" stroke-width="2"/>
  <!-- grid glyph -->
  <rect x="256" y="610" width="48" height="34" rx="2" fill="none" stroke="#6B7A8D" stroke-width="2.5"/>
  <line x1="256" y1="621" x2="304" y2="621" stroke="#6B7A8D" stroke-width="2"/>
  <line x1="256" y1="633" x2="304" y2="633" stroke="#6B7A8D" stroke-width="2"/>
  <line x1="272" y1="610" x2="272" y2="644" stroke="#6B7A8D" stroke-width="2"/>
  <line x1="288" y1="610" x2="288" y2="644" stroke="#6B7A8D" stroke-width="2"/>
  <text x="372" y="672" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Spreadsheet</text>
</g>

<!-- Card: Stapled evidence packet (front-right, on top of pile) -->
<g transform="rotate(6 720 650)">
  <rect x="585" y="588" width="270" height="124" rx="12" fill="#0D1B2E"/>
  <rect x="585" y="588" width="270" height="124" rx="12" fill="none" stroke="#1E3A66" stroke-width="2"/>
  <!-- stacked-pages + staple glyph -->
  <rect x="615" y="624" width="36" height="46" rx="2" fill="none" stroke="#6B7A8D" stroke-width="2.5"/>
  <rect x="623" y="616" width="36" height="46" rx="2" fill="#0D1B2E" stroke="#6B7A8D" stroke-width="2.5"/>
  <line x1="630" y1="624" x2="642" y2="624" stroke="#C0392B" stroke-width="3"/>
  <text x="745" y="640" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Stapled evidence</text>
  <text x="745" y="666" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">packet</text>
</g>

<!-- ===================== RED WARNING TAGS SCATTERED ON THE PILE ===================== -->
<!-- Tag style: red-tint fill, red border, small red x, red label -->

<!-- stale (top-center) -->
<g transform="rotate(-9 540 270)">
  <rect x="468" y="248" width="144" height="44" rx="22" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <path d="M 488 262 L 500 274 M 500 262 L 488 274" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
  <text x="556" y="277" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#C0392B" text-anchor="middle">stale</text>
</g>

<!-- point-in-time (mid-center) -->
<g transform="rotate(5 540 470)">
  <rect x="450" y="448" width="216" height="44" rx="22" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <path d="M 470 462 L 482 474 M 482 462 L 470 474" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
  <text x="571" y="477" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#C0392B" text-anchor="middle">point-in-time</text>
</g>

<!-- no provenance (lower-left) -->
<g transform="rotate(-6 360 745)">
  <rect x="252" y="724" width="216" height="44" rx="22" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <path d="M 272 738 L 284 750 M 284 738 L 272 750" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
  <text x="373" y="753" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#C0392B" text-anchor="middle">no provenance</text>
</g>

<!-- coverage gaps (lower-right) -->
<g transform="rotate(7 740 760)">
  <rect x="636" y="738" width="208" height="44" rx="22" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/>
  <path d="M 656 752 L 668 764 M 668 752 L 656 764" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
  <text x="754" y="767" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#C0392B" text-anchor="middle">coverage gaps</text>
</g>

<!-- ===================== TIME PRESSURE: CLOCK + LABEL ===================== -->
<!-- Clock at lower-left, red, with "quarterly scramble" -->
<g transform="translate(170 850)">
  <circle cx="60" cy="60" r="52" fill="#FFFFFF" stroke="#C0392B" stroke-width="5"/>
  <!-- tick marks -->
  <line x1="60" y1="14" x2="60" y2="24" stroke="#C0392B" stroke-width="3"/>
  <line x1="60" y1="96" x2="60" y2="106" stroke="#C0392B" stroke-width="3"/>
  <line x1="14" y1="60" x2="24" y2="60" stroke="#C0392B" stroke-width="3"/>
  <line x1="96" y1="60" x2="106" y2="60" stroke="#C0392B" stroke-width="3"/>
  <!-- hands at a "rushed" angle -->
  <line x1="60" y1="60" x2="60" y2="28" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="90" y2="72" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/>
  <circle cx="60" cy="60" r="6" fill="#C0392B"/>
  <!-- motion/urgency ticks -->
  <path d="M 122 36 a 30 30 0 0 1 10 24" fill="none" stroke="#C0392B" stroke-width="3" marker-end="url(#ar-red)"/>
</g>
<text x="320" y="888" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#C0392B" text-anchor="start">quarterly scramble</text>
<text x="320" y="922" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#6B7A8D" text-anchor="start">deadline-driven, never current between cycles</text>

<!-- ===================== BOTTOM STRIP ===================== -->
<rect x="50" y="982" width="980" height="58" rx="10" fill="#C0392B"/>
<text x="540" y="1020" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Fragmented &#183; manual &#183; point-in-time &#183; re-proven every audit</text>
</svg>
