<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1080" height="1080" rx="0" fill="#FFFFFF"/>
<defs>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>

<!-- Title -->
<text x="540" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Immutable Provenance Chain</text>
<text x="540" y="132" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#6B7A8D" text-anchor="middle">Each evidence record is hash-linked to the one before it</text>

<!-- ===================== BLOCK GEOMETRY =====================
     width 410, height 252, rx 16. Two rows, zig-zag connectors.
     Block 1: x=70  y=190   (top-left)
     Block 2: x=600 y=190   (top-right)
     Block 3: x=70  y=512   (bottom-left)
     Block 4: x=600 y=512   (bottom-right)
-->

<!-- ===================== CONNECTORS (teal "prev-hash") ===================== -->
<!-- 1 -> 2 : straight across the top row -->
<line x1="480" y1="316" x2="600" y2="316" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<text x="540" y="304" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1E8C8C" text-anchor="middle">prev-hash</text>

<!-- 2 -> 3 : serpentine drop from block 2 down and across to block 3 -->
<path d="M 805 442 C 805 478, 805 482, 730 482 L 345 482 C 275 482, 275 486, 275 512" fill="none" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<text x="540" y="474" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1E8C8C" text-anchor="middle">prev-hash</text>

<!-- 3 -> 4 : straight across the bottom row -->
<line x1="480" y1="638" x2="600" y2="638" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
<text x="540" y="626" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1E8C8C" text-anchor="middle">prev-hash</text>

