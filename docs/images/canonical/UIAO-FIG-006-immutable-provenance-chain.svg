<text x="430" y="227" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
<line x1="98" y1="250" x2="452" y2="250" stroke="#1E3A66" stroke-width="1.5"/>
