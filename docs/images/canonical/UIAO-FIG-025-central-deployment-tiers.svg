<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- AI-identity-governance central deployment, four tiers (ADR-093 blueprint). -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>
  <text x="60" y="52" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#0D1B2E">Central Deployment — Four-Tier Cascade</text>

  <!-- Tier 0 -->
  <rect x="220" y="78" width="840" height="116" rx="10" fill="#0D1B2E"/>
  <text x="244" y="106" font-size="17" font-weight="bold" fill="#FFFFFF">Tier 0 — OFCIO central scan</text>
  <g font-size="13.5" fill="#D7F2EE"><text x="244" y="132">Scanner runs against public OMB CSV</text><text x="244" y="154">Output: 1,346 findings across all 56 agencies</text><text x="244" y="176">Time &lt; 2 minutes; annual cadence + ad-hoc on demand</text></g>
  <line x1="640" y1="194" x2="640" y2="224" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="656" y="214" font-size="12.5" fill="#5A5A5A">structured findings per agency</text>

  <!-- Tier 1 -->
  <rect x="220" y="226" width="840" height="116" rx="10" fill="#1E3A66"/>
  <text x="244" y="254" font-size="17" font-weight="bold" fill="#FFFFFF">Tier 1 — Agency CISO notification</text>
  <g font-size="13.5" fill="#D7F2EE"><text x="244" y="280">Each agency receives its scoped finding set</text><text x="244" y="302">P1 (agentic AI without ATO) → 72-hour action</text><text x="244" y="324">P2 (ATO gap · unowned · PII/no PIA) → 30-day</text></g>
  <line x1="640" y1="342" x2="640" y2="372" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="656" y="362" font-size="12.5" fill="#5A5A5A">per-bureau remediation assignments</text>

  <!-- Tier 2 -->
  <rect x="220" y="374" width="840" height="116" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="244" y="402" font-size="17" font-weight="bold" fill="#0D1B2E">Tier 2 — Agency remediation tooling</text>
  <g font-size="13.5" fill="#33414F"><text x="244" y="428">Agency assigns credential owners; updates inventory</text><text x="244" y="450">Existing IGA tooling governs credential lifecycle</text><text x="244" y="472">UIAO OrgPath binding is optional at this tier</text></g>
  <line x1="640" y1="490" x2="640" y2="520" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="656" y="510" font-size="12.5" fill="#5A5A5A">full governance binding (optional)</text>

  <!-- Tier 3 (target — teal border) -->
  <rect x="220" y="522" width="840" height="116" rx="10" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="4"/>
  <text x="244" y="550" font-size="17" font-weight="bold" fill="#0D1B2E">Tier 3 — Agency UIAO deployment <tspan font-size="13" fill="#1E8C8C">(target architecture)</tspan></text>
  <g font-size="13.5" fill="#33414F"><text x="244" y="576">OrgPath stamps; drift engine continuous monitoring</text><text x="244" y="598">JML lifecycle events driven by annual vintage diff</text><text x="244" y="620">SailPoint machine-identity adapter (phase-planning)</text></g>

  <text x="640" y="676" text-anchor="middle" font-size="13" fill="#6B7A8D">One central scan cascades to scoped agency action, optional remediation tooling, and full UIAO governance at the target tier.</text>
</svg>
