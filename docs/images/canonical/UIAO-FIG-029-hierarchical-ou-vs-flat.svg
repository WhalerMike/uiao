<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Hierarchical OUs (inherited policy) vs the flat Entra directory (ADR-093 blueprint). -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="60" y="58" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#0D1B2E">Hierarchical OUs vs the Flat Directory</text>
  <text x="60" y="90" font-size="18" fill="#5A5A5A">AD policy inherits down the OU tree; in Entra every object sits at one level — no parent-child, no inheritance.</text>

  <line x1="640" y1="120" x2="640" y2="660" stroke="#E3E8EF" stroke-width="2"/>
  <text x="350" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Active Directory (hierarchical)</text>
  <text x="940" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Entra ID (flat)</text>

  <!-- AD tree -->
  <g font-family="Consolas, monospace" font-size="16" fill="#0D1B2E">
    <text x="150" y="200">domain</text>
    <text x="170" y="246">└── OU=Washington</text>
    <text x="210" y="292">├── OU=Finance</text>
    <text x="250" y="338">└── user  <tspan fill="#1E8C8C">(inherits policy)</tspan></text>
    <text x="210" y="384">└── OU=HR</text>
    <text x="250" y="430">└── user  <tspan fill="#1E8C8C">(inherits policy)</tspan></text>
  </g>
  <rect x="150" y="480" width="380" height="50" rx="9" fill="#D7F2EE"/><text x="340" y="505" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#0D1B2E">policy flows down the tree</text>

  <!-- Entra flat box -->
  <rect x="760" y="200" width="380" height="230" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <g font-family="Consolas, monospace" font-size="15" fill="#33414F">
    <text x="784" y="240">user  user  user  user  group</text>
    <text x="784" y="270">group  device  device  sp  user</text>
    <text x="784" y="300">group  user  device  sp  group ...</text>
  </g>
  <text x="950" y="350" text-anchor="middle" font-size="14" fill="#C0392B">all at one level —</text>
  <text x="950" y="374" text-anchor="middle" font-size="14" fill="#C0392B">no OUs, no parent-child,</text>
  <text x="950" y="398" text-anchor="middle" font-size="14" fill="#C0392B">no inheritance</text>
  <rect x="760" y="480" width="380" height="50" rx="9" fill="#F7E2DE" stroke="#C0392B" stroke-width="1.5"/><text x="950" y="505" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#C0392B">policy must be targeted explicitly</text>
</svg>
