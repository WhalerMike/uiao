<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO_014 GPO Modernization pipeline (ADR-093 blueprint register).
       Palette: navy #0D1B2E (UIAO-owned/build) · ice #EAF1FB + navy border
       (Microsoft/cloud dependency) · teal #1E8C8C (UIAO differentiator + connectors)
       · red #C0392B (loss/residual) · grey #5A5A5A. White background. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>

  <!-- Title + caption -->
  <text x="60" y="62" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#0D1B2E">UIAO_014 — GPO Modernization Pipeline</text>
  <text x="60" y="96" font-size="19" fill="#5A5A5A">Parse → Consume → Join. Each stage emits one schema-defined output; the next stage consumes only that output.</text>

  <!-- ============ Stage 1 inputs (on-disk GPO artifacts) ============ -->
  <text x="60" y="150" font-size="15" font-weight="bold" fill="#6B7A8D">ON-DISK GPO ARTIFACTS</text>
  <rect x="60" y="166" width="232" height="40" rx="6" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.5"/>
  <text x="176" y="186" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="16" fill="#33414F">GPO backup XML</text>
  <rect x="60" y="214" width="232" height="40" rx="6" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.5"/>
  <text x="176" y="234" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="16" fill="#33414F">registry.pol</text>
  <rect x="60" y="262" width="232" height="40" rx="6" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.5"/>
  <text x="176" y="282" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="16" fill="#33414F">SYSVOL scope</text>

  <!-- ============ Stage 2 input (Microsoft GPA) ============ -->
  <text x="60" y="470" font-size="15" font-weight="bold" fill="#6B7A8D">MICROSOFT SURFACE (LIVE TENANT)</text>
  <rect x="60" y="486" width="232" height="64" rx="6" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="176" y="510" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#0D1B2E">Group Policy Analytics</text>
  <text x="176" y="532" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="13" fill="#33414F">Graph beta</text>

  <!-- input arrows -->
  <line x1="292" y1="234" x2="354" y2="220" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <line x1="292" y1="518" x2="354" y2="500" stroke="#1E8C8C" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- ============ Stage 1: Parse (navy = UIAO-owned / build) ============ -->
  <rect x="360" y="150" width="250" height="150" rx="12" fill="#0D1B2E"/>
  <text x="485" y="190" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">Stage 1 — Parse</text>
  <text x="485" y="220" text-anchor="middle" font-size="15" fill="#D7F2EE">offline · no tenant · no Graph</text>
  <rect x="412" y="244" width="146" height="34" rx="17" fill="#1E8C8C"/>
  <text x="485" y="261" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">BUILD</text>

  <!-- ============ Stage 2: Consume (ice = Microsoft dependency) ============ -->
  <rect x="360" y="430" width="250" height="150" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="485" y="470" text-anchor="middle" font-size="22" font-weight="bold" fill="#0D1B2E">Stage 2 — Consume</text>
  <text x="485" y="500" text-anchor="middle" font-size="15" fill="#33414F">live tenant · annotates the IR</text>
  <rect x="404" y="524" width="162" height="34" rx="17" fill="#FFFFFF" stroke="#6B7A8D" stroke-width="1.5"/>
  <text x="485" y="541" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#33414F">CONSUME</text>

  <!-- ============ Stage 3: Join (teal border = UIAO differentiator) ============ -->
  <rect x="730" y="290" width="250" height="150" rx="12" fill="#0D1B2E" stroke="#1E8C8C" stroke-width="4"/>
  <text x="855" y="330" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">Stage 3 — Join</text>
  <text x="855" y="360" text-anchor="middle" font-size="15" fill="#D7F2EE">pure over IR + OrgPath</text>
  <rect x="772" y="384" width="166" height="34" rx="17" fill="#1E8C8C"/>
  <text x="855" y="401" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">DIFFERENTIATE</text>

  <!-- Parse -> Join : GPO-IR -->
  <path d="M610,225 L668,225 L668,330 L726,330" fill="none" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="624" y="206" width="92" height="30" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="670" y="221" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="14" fill="#0D1B2E">GPO-IR</text>

  <!-- Consume -> Join : Crosswalk Result -->
  <path d="M610,505 L668,505 L668,400 L726,400" fill="none" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="612" y="490" width="118" height="30" rx="6" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.5"/>
  <text x="671" y="505" text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="13" fill="#0D1B2E">Crosswalk Result</text>

  <!-- ============ Output: Migration Plan ============ -->
  <rect x="1040" y="300" width="180" height="130" rx="12" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/>
  <text x="1130" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#0D1B2E">Migration Plan</text>
  <text x="1130" y="358" text-anchor="middle" font-size="13" fill="#33414F">cohort-bound</text>
  <text x="1130" y="378" text-anchor="middle" font-size="13" fill="#33414F">topologically sequenced</text>
  <text x="1130" y="398" text-anchor="middle" font-size="13" fill="#33414F">drift-classified</text>
  <line x1="980" y1="365" x2="1034" y2="365" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- ============ Residual / drift footnote ============ -->
  <line x1="60" y1="638" x2="1220" y2="638" stroke="#E3E8EF" stroke-width="1.5"/>
  <circle cx="70" cy="666" r="5" fill="#C0392B"/>
  <text x="86" y="666" dominant-baseline="central" font-size="15" fill="#33414F">Unsupported settings are a first-class outcome — routed to the residual-GPO backlog, never silently dropped.</text>
  <circle cx="70" cy="692" r="5" fill="#D4A017"/>
  <text x="86" y="692" dominant-baseline="central" font-size="15" fill="#33414F">A half-migrated GPO surfaces as a DRIFT- finding (ADR-040 five-class taxonomy), not a blind spot.</text>
</svg>
