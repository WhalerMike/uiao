<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO-FIG-005 "Three Compliance Layers UIAO Evaluates" (ADR-093 house style).
       Square 1:1. White bg; navy band fills, ice + navy border, teal brace/eval label.
       Pure SVG, no foreignObject. -->
  <rect x="0" y="0" width="1080" height="1080" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="bold" fill="#0D1B2E">Three Compliance Layers</text>
  <text x="60" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="bold" fill="#0D1B2E">UIAO Evaluates</text>
  <line x1="60" y1="208" x2="780" y2="208" stroke="#E3E8EF" stroke-width="2"/>

  <!-- ===================== Layer 1 ===================== -->
  <rect x="60" y="270" width="780" height="190" rx="16" fill="#0D1B2E"/>
  <!-- layer chip -->
  <rect x="92" y="300" width="118" height="44" rx="10" fill="#1E8C8C"/>
  <text x="151" y="322" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">LAYER 1</text>
  <text x="92" y="395" font-size="36" font-weight="bold" fill="#FFFFFF">FedRAMP Moderate Rev 5</text>
  <text x="92" y="438" font-size="26" fill="#EAF1FB">Baseline of <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="bold" fill="#FFFFFF">323</tspan> security controls</text>

  <!-- ===================== Layer 2 ===================== -->
  <rect x="60" y="490" width="780" height="190" rx="16" fill="#0D1B2E"/>
  <rect x="92" y="520" width="118" height="44" rx="10" fill="#1E8C8C"/>
  <text x="151" y="542" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">LAYER 2</text>
  <text x="92" y="615" font-size="36" font-weight="bold" fill="#FFFFFF">CISA SCuBA Benchmarks</text>
  <text x="92" y="658" font-size="26" fill="#EAF1FB">Plus BOD 25-01 directives</text>

  <!-- ===================== Layer 3 ===================== -->
  <rect x="60" y="710" width="780" height="190" rx="16" fill="#0D1B2E"/>
  <rect x="92" y="740" width="118" height="44" rx="10" fill="#1E8C8C"/>
  <text x="151" y="762" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">LAYER 3</text>
  <text x="92" y="835" font-size="36" font-weight="bold" fill="#FFFFFF">Agency-Specific Policies</text>
  <text x="92" y="878" font-size="26" fill="#EAF1FB">Organizational rules and overlays</text>

  <!-- ===================== Right-side brace spanning all three ===================== -->
  <!-- vertical bracket from top of Layer 1 to bottom of Layer 3 -->
  <path d="M 880 270
           Q 902 270 902 292
           L 902 575
           Q 902 585 916 585
           Q 902 585 902 595
           L 902 878
           Q 902 900 880 900"
        fill="none" stroke="#1E8C8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- teal eval label, stacked vertical to the right of the brace -->
  <text x="952" y="430" font-size="34" font-weight="bold" fill="#1E8C8C">UIAO</text>
  <text x="952" y="478" font-size="34" font-weight="bold" fill="#1E8C8C">evaluates</text>
  <text x="952" y="526" font-size="34" font-weight="bold" fill="#1E8C8C">all three</text>
  <text x="952" y="574" font-size="34" font-weight="bold" fill="#1E8C8C">layers</text>
  <text x="952" y="640" font-size="26" fill="#5A5A5A">continuously,</text>
  <text x="952" y="676" font-size="26" fill="#5A5A5A">in one</text>
  <text x="952" y="712" font-size="26" fill="#5A5A5A">assessment.</text>
</svg>
