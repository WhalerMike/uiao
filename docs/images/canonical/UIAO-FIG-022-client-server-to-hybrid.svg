<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Client-Server -> UIAO Platform -> Hybrid-Cloud (ADR-093 blueprint).
       navy = legacy source · teal border = the transformer · ice = cloud target. -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>
  <text x="60" y="58" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#0D1B2E">Client-Server → UIAO Platform → Hybrid-Cloud</text>
  <text x="60" y="90" font-size="18" fill="#5A5A5A">The platform server reads the legacy source and writes the cloud target — Analysis → Plan → Deliver.</text>

  <!-- Column 1: Client-Server (legacy source) -->
  <rect x="60" y="120" width="350" height="510" rx="12" fill="#0D1B2E"/>
  <text x="235" y="156" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">CLIENT-SERVER</text>
  <text x="235" y="180" text-anchor="middle" font-size="14" fill="#A9B8CA">the source</text>
  <g font-size="16" fill="#FFFFFF">
    <text x="90" y="232">AD Forest</text>
    <text x="90" y="272">GPO</text>
    <text x="90" y="312">AD-Integrated DNS</text>
    <text x="90" y="352">AD DHCP</text>
    <text x="90" y="392">Kerberos SPNs</text>
    <text x="90" y="432">ADCS</text>
    <text x="90" y="472">Domain-joined PCs</text>
  </g>

  <!-- Column 2: Platform (transformer) -->
  <rect x="465" y="120" width="350" height="510" rx="12" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="4"/>
  <text x="640" y="156" text-anchor="middle" font-size="19" font-weight="bold" fill="#0D1B2E">UIAO PLATFORM SERVER</text>
  <text x="640" y="180" text-anchor="middle" font-size="14" fill="#1E8C8C">the transformer</text>
  <g font-size="16" fill="#0D1B2E">
    <text x="495" y="240">WS2025 + IIS + Gitea</text>
    <text x="495" y="284">Kerberos + Enterprise PKI</text>
    <text x="495" y="328">PowerShell + Python + API</text>
  </g>
  <rect x="495" y="356" width="290" height="44" rx="8" fill="#0D1B2E"/>
  <text x="640" y="378" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Analysis → Plan → Deliver</text>

  <!-- Column 3: Hybrid-Cloud (target) -->
  <rect x="870" y="120" width="350" height="510" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="1045" y="156" text-anchor="middle" font-size="19" font-weight="bold" fill="#0D1B2E">HYBRID-CLOUD</text>
  <text x="1045" y="180" text-anchor="middle" font-size="14" fill="#5A5A5A">the target</text>
  <g font-size="16" fill="#33414F">
    <text x="900" y="232">Entra ID + Intune + Arc</text>
    <text x="900" y="272">IPAM + DNS + DHCP</text>
    <text x="900" y="312">SASE + Zero Trust + MFA</text>
    <text x="900" y="352">Conditional Access</text>
    <text x="900" y="392">Certificate-Based Auth</text>
  </g>

  <!-- arrows -->
  <line x1="410" y1="300" x2="461" y2="300" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="435" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">read</text>
  <text x="435" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">only</text>
  <line x1="815" y1="300" x2="866" y2="300" stroke="#1E8C8C" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="840" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">write</text>
</svg>
