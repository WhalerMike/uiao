<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Windows Server deployment: IIS -> HttpPlatformHandler -> Python/Uvicorn (ADR-093 blueprint). -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
  </defs>
  <text x="60" y="56" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#0D1B2E">Windows Server Deployment — IIS → Python</text>
  <text x="60" y="86" font-size="17" fill="#5A5A5A">IIS terminates TLS and Windows auth, then hands off over loopback to the Uvicorn-hosted FastAPI app.</text>

  <text x="640" y="124" text-anchor="middle" font-size="15" fill="#5A5A5A">Internet / Intranet</text>
  <line x1="640" y1="132" x2="640" y2="166" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="668" y="156" font-size="13" font-weight="bold" fill="#1E8C8C">HTTPS :443</text>

  <!-- IIS + Python stack -->
  <rect x="360" y="170" width="560" height="300" rx="12" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="640" y="200" text-anchor="middle" font-size="17" font-weight="bold" fill="#0D1B2E">IIS 10 — Windows Server 2022/2025/2026</text>
  <g font-size="14" fill="#33414F"><text x="390" y="228">Site: UIAO-API</text><text x="390" y="250">Windows Auth (Kerberos / Negotiate)</text><text x="390" y="272">TLS termination (enterprise CA cert)</text></g>
  <text x="390" y="304" font-size="14" font-weight="bold" fill="#0D1B2E">HttpPlatformHandler</text>
  <line x1="640" y1="312" x2="640" y2="346" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="668" y="336" font-size="13" fill="#1E8C8C">loopback HTTP_PLATFORM_PORT</text>
  <rect x="390" y="350" width="500" height="100" rx="10" fill="#0D1B2E"/>
  <text x="640" y="382" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Python 3.13 / Uvicorn</text>
  <text x="640" y="408" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#D7F2EE">app: uiao.api.app:app</text>
  <text x="640" y="430" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#A9B8CA">bound: 127.0.0.1:${HTTP_PLATFORM_PORT}</text>

  <!-- downstream -->
  <line x1="500" y1="470" x2="500" y2="520" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="500" y="508" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">LDAPS :636</text>
  <rect x="330" y="524" width="340" height="80" rx="10" fill="#0D1B2E"/><text x="500" y="558" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Active Directory</text><text x="500" y="582" text-anchor="middle" font-size="13" fill="#D7F2EE">Domain Controller</text>

  <line x1="780" y1="470" x2="780" y2="520" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="780" y="508" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8C8C">HTTPS (MSAL)</text>
  <rect x="610" y="524" width="340" height="80" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="780" y="558" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D1B2E">Microsoft Entra ID</text><text x="780" y="582" text-anchor="middle" font-size="13" fill="#33414F">Graph / ARM endpoints</text>
</svg>
