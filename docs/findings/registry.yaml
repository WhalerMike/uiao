# Findings registry
#
# Thin enumeration of every UIAO governance finding under docs/findings/.
# Format defined in docs/findings/README.qmd "Registry" section.
#
# Append-only with respect to historical entries. When a finding moves
# status, update the corresponding row's status and updated_at fields,
# and append a row to the finding document's own status-tracking table.
# This file is the cross-finding index; the finding documents themselves
# are the source of truth for content and history.
#
# ---------------------------------------------------------------------------
# TWO SERIES, DISJOINT NAMESPACES (established 2026-07-09).
#
#   FINDING-NNN      GCC-Moderate telemetry/boundary series — capability gaps
#                    at the FedRAMP GCC-Moderate authorization boundary.
#   FINDING-PGM-NNN  FedRAMP program/mandate series — framework movement,
#                    RFC readiness, and federal directive obligations.
#
# The two series were originally authored into one FINDING-NNN namespace and
# collided on ids 002/003/004. Resolved 2026-07-09 by moving the three
# program/mandate docs to the FINDING-PGM-* prefix; all inbound citations
# across canon (ADRs, specs, KSI rules, tests, customer guides) were swept in
# the same change. Historical records (CHANGELOG, CONTRIBUTING examples, inbox
# roadmap drafts) retain the pre-split ids by design — they document what was
# true at authoring time.
# ---------------------------------------------------------------------------

