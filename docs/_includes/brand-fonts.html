<!--
  brand-fonts.html

  Site-wide Google Fonts preconnect + load for the UIAO brand typefaces
  (DM Serif Display headings, DM Sans body, IBM Plex Mono code). Injected
  on every HTML page via docs/_quarto.yml -> format.html.include-in-header
  so theme-brand.scss can reference the families. The landing pages also
  pull these via _includes/landing-styles.html; the duplicate <link> is
  de-duplicated by the browser and is harmless.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
