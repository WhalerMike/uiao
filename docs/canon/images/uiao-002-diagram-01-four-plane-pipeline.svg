</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">SCuBA Pipeline — Four Sequential Planes</text><rect x="40" y="170" width="176" height="150" rx="8" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><rect x="40" y="170" width="10" height="150" rx="0" fill="#5A5A5A"/><text x="68" y="204" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="start">SOURCE</text><text x="68" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="start">ScubaGear</text><text x="68" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="start">executes against</text><text x="68" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="start">an M365 tenant</text><rect x="40" y="332" width="176" height="40" rx="8" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2"/><text x="128" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">GCC-Moderate boundary</text><line x1="220" y1="265" x2="258" y2="265" stroke="#5A5A5A" stroke-width="3" marker-end="url(#ar-grey)"/><rect x="262" y="170" width="174" height="190" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><rect x="262" y="170" width="174" height="12" rx="0" fill="#1E3A66"/><text x="349" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Plane 1</text><text x="349" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#1E3A66" text-anchor="middle" dominant-baseline="central">SCuBA → IR</text><text x="349" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#33414F" text-anchor="middle" dominant-baseline="central">transform</text><line x1="437" y1="265" x2="453" y2="265" stroke="#5A5A5A" stroke-width="3" marker-end="url(#ar-grey)"/><rect x="454" y="170" width="174" height="190" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><rect x="454" y="170" width="174" height="12" rx="0" fill="#1E8C8C"/><text x="541" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Plane 2</text><text x="541" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">IR → KSI</text><text x="541" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#33414F" text-anchor="middle" dominant-baseline="central">evaluate</text><line x1="629" y1="265" x2="645" y2="265" stroke="#5A5A5A" stroke-width="3" marker-end="url(#ar-grey)"/><rect x="646" y="170" width="174" height="190" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><rect x="646" y="170" width="174" height="12" rx="0" fill="#5A5A5A"/><text x="733" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Plane 3</text><text x="733" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">KSI → Evidence</text><text x="733" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#33414F" text-anchor="middle" dominant-baseline="central">build + sign</text><line x1="821" y1="265" x2="837" y2="265" stroke="#5A5A5A" stroke-width="3" marker-end="url(#ar-grey)"/><rect x="838" y="170" width="174" height="190" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/><rect x="838" y="170" width="174" height="12" rx="0" fill="#0D1B2E"/><text x="925" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Plane 4</text><text x="925" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Evidence → OSCAL</text><text x="925" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#33414F" text-anchor="middle" dominant-baseline="central">generate</text><line x1="1016" y1="265" x2="1070" y2="265" stroke="#0D1B2E" stroke-width="3" marker-end="url(#ar-grey)"/><rect x="1076" y="164" width="150" height="44" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="1151" y="186" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">SSP</text><rect x="1076" y="220" width="150" height="44" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="1151" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">POA&amp;M</text><rect x="1076" y="276" width="150" height="44" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="1151" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">SAR</text><rect x="1076" y="332" width="150" height="44" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/><text x="1151" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Auditor Bundle</text><rect x="262" y="386" width="750" height="46" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.4"/><text x="637" y="409" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Certificate-anchored provenance chain — continuous beneath all four planes</text><text x="40" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="start">Each plane is independently testable, deterministic, and produces artifacts that feed the next. No data leaves the tenant boundary.</text>
</svg>
