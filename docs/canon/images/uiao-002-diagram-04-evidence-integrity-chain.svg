<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
<defs>
 <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
 <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
 <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4A017"/></marker>
 <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
</defs>
<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Evidence Integrity Chain</text><rect x="360" y="150" width="560" height="70" rx="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.8"/><text x="384" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="start">ScubaGear JSON</text><text x="384" y="204" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#33414F" text-anchor="start">raw assessment input</text><line x1="640" y1="222" x2="640" y2="240" stroke="#5A5A5A" stroke-width="3" marker-end="url(#ar-grey)"/><rect x="360" y="242" width="560" height="70" rx="8" fill="#FFFFFF" stroke="#1E3A66" stroke-width="1.8"/><text x="384" y="272" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="start">Plane 1 — IR envelope</text><text x="384" y="296" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#33414F" text-anchor="start">+ content hash</text><line x1="640" y1="314" x2="640" y2="332" stroke="#5A5A5A" stroke-width="3" marker-end="url(#ar-grey)"/><rect x="360" y="334" width="560" height="70" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/><text x="384" y="364" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="start">Plane 2 — control mapping</text><text x="384" y="388" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#33414F" text-anchor="start">+ pass / fail / warn evaluation</text><line x1="640" y1="406" x2="640" y2="424" stroke="#5A5A5A" stroke-width="3" marker-end="url(#ar-grey)"/><rect x="360" y="426" width="560" height="70" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="1.8"/><text x="384" y="456" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="start">Plane 3 — evidence bundle</text><text x="384" y="480" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#33414F" text-anchor="start">+ HMAC-SHA256 signature + stable hash</text><line x1="640" y1="498" x2="640" y2="516" stroke="#5A5A5A" stroke-width="3" marker-end="url(#ar-grey)"/><rect x="360" y="518" width="560" height="70" rx="8" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.8"/><text x="384" y="548" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="start">Plane 4 — OSCAL 1.1.2</text><text x="384" y="572" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#33414F" text-anchor="start">+ schema validation + lineage traces</text><line x1="320" y1="586" x2="320" y2="152" stroke="#1E8C8C" stroke-width="3.5" marker-end="url(#ar-grey)"/><text transform="rotate(-90 304 369)" x="304" y="369" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Any auditor can trace any OSCAL statement back to the source scan</text>
</svg>
