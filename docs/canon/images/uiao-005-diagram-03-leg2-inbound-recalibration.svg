<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
 <rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
 <defs>
  <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
  <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 </defs>

 <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#0D1B2E" text-anchor="start">Leg 2 — Inbound: Policy Updates → Governance → Recalibration</text>

 <!-- Source: cisagov publish surfaces -->
 <rect x="40" y="120" width="300" height="120" rx="10" fill="#0D1B2E" stroke="#0D1B2E" stroke-width="1.8"/>
 <text x="190" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CISA publishes updates</text>
 <text x="190" y="176" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#CDE0F5" text-anchor="middle">cisagov/ScubaGear GitHub Releases</text>
 <text x="190" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#CDE0F5" text-anchor="middle">SCuBA Baselines page</text>
 <text x="190" y="216" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#CDE0F5" text-anchor="middle">BOD 25-01 implementation guidance</text>
 <text x="190" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" font-style="italic" fill="#9DB4D4" text-anchor="middle">no webhook, no pub/sub, no push to agencies</text>

 <!-- without-UIAO callout (amber = escalation/risk) -->
 <rect x="40" y="270" width="300" height="118" rx="10" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/>
 <text x="190" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Without UIAO-core</text>
 <text x="190" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">the inbound signal is invisible.</text>
 <text x="190" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">A human must notice the release</text>
 <text x="190" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">and act. If they don't, agencies</text>
 <text x="190" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">run stale baselines for weeks.</text>

 <!-- arrow source -> 2a -->
 <line x1="340" y1="180" x2="408" y2="180" stroke="#0D1B2E" stroke-width="3" marker-end="url(#ar-navy)"/>

 <!-- Step boxes 2a..2e across -->
 <!-- 2a -->
 <rect x="410" y="120" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
 <rect x="410" y="120" width="200" height="12" rx="0" fill="#1E8C8C"/>
 <text x="510" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Step 2a</text>
 <text x="510" y="178" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Upstream Policy Watcher</text>
 <text x="510" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">webhook (real-time) or</text>
 <text x="510" y="217" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">scheduled poll (~6 h)</text>
 <!-- 2b -->
 <rect x="660" y="120" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
 <rect x="660" y="120" width="200" height="12" rx="0" fill="#1E8C8C"/>
 <text x="760" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Step 2b</text>
 <text x="760" y="178" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Governance Event</text>
 <text x="760" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">new baseline: N new Shall,</text>
 <text x="760" y="217" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">M modified, K deprecated</text>
 <!-- 2c -->
 <rect x="910" y="120" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
 <rect x="910" y="120" width="200" height="12" rx="0" fill="#1E8C8C"/>
 <text x="1010" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Step 2c</text>
 <text x="1010" y="178" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Agency Prompt</text>
 <text x="1010" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">dashboard flag, email,</text>
 <text x="1010" y="217" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">ticketing + recommended action</text>

 <!-- top-row connectors 2a->2b->2c -->
 <line x1="611" y1="180" x2="658" y2="180" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
 <line x1="861" y1="180" x2="908" y2="180" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

 <!-- 2c -> 2d down connector -->
 <path d="M 1010 240 L 1010 290 L 1010 318" fill="none" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

 <!-- 2d -->
 <rect x="910" y="320" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
 <rect x="910" y="320" width="200" height="12" rx="0" fill="#1E8C8C"/>
 <text x="1010" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Step 2d</text>
 <text x="1010" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Update Trigger</text>
 <text x="1010" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">GitHub Actions workflow:</text>
 <text x="1010" y="417" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">automatic or human-gated</text>

 <!-- 2d -> 2e left connector -->
 <line x1="908" y1="380" x2="861" y2="380" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

 <!-- 2e -->
 <rect x="660" y="320" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
 <rect x="660" y="320" width="200" height="12" rx="0" fill="#1E8C8C"/>
 <text x="760" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Step 2e</text>
 <text x="760" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Recalibrated Assessment</text>
 <text x="760" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">re-run vs new baseline;</text>
 <text x="760" y="417" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">new Shall violations surface</text>

 <!-- 2e -> Leg 1 (teal) -->
 <line x1="658" y1="380" x2="510" y2="380" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

 <!-- Leg 1 closes-loop box -->
 <rect x="280" y="320" width="225" height="120" rx="10" fill="#D7F2EE" stroke="#1E8C8C" stroke-width="2.2"/>
 <text x="392" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Results flow through</text>
 <text x="392" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Leg 1</text>
 <text x="392" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">posture re-evaluated against</text>
 <text x="392" y="419" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33414F" text-anchor="middle">the latest mandatory controls</text>

 <!-- closed-loop return arrow (navy) Leg 1 box -> back up to source/2a -->
 <path d="M 392 320 L 392 270 L 392 100 L 510 100 L 510 118" fill="none" stroke="#0D1B2E" stroke-width="3" stroke-dasharray="2 0" marker-end="url(#ar-navy)"/>
 <text x="451" y="92" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle">The loop closes — a new CISA baseline triggers an updated, governed assessment</text>

 <!-- Legend / caption -->
 <rect x="40" y="500" width="1070" height="150" rx="10" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.4"/>
 <text x="64" y="532" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="start">Key architectural insight</text>
 <text x="64" y="562" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#33414F" text-anchor="start">BOD 25-01 requires agencies to implement all future updates to mandatory SCuBA policies — a standing obligation, not a one-time event.</text>
 <text x="64" y="586" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#33414F" text-anchor="start">CISA publishes through pull-only surfaces; there is no live push channel. UIAO-core converts that silent signal into a governed prompt and a</text>
 <text x="64" y="610" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#33414F" text-anchor="start">recalibration trigger, so absorbing a new baseline no longer depends on human vigilance.</text>
 <text x="64" y="638" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="start">No other component in the SCuBA ecosystem watches the inbound direction.</text>
</svg>
