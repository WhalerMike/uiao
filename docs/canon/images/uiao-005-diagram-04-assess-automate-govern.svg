<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
 <rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
 <defs>
  <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
 </defs>

 <text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#0D1B2E" text-anchor="start">SCuBA assesses. ScubaConnect automates. UIAO governs.</text>
 <text x="60" y="90" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-style="italic" fill="#6B7A8D" text-anchor="start">Three layers over the same data path — each adds what the layer below it does not provide.</text>

 <!-- Layer 1: SCuBA (assess) -->
 <rect x="90" y="130" width="1100" height="150" rx="12" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="2"/>
 <rect x="90" y="130" width="14" height="150" rx="0" fill="#5A5A5A"/>
 <text x="140" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#0D1B2E" text-anchor="start">SCuBA</text>
 <text x="140" y="208" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#5A5A5A" text-anchor="start">Assesses</text>
 <text x="360" y="170" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="start">CISA's assessment logic: ScubaGear (Microsoft 365) and ScubaGoggles (Google Workspace),</text>
 <text x="360" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="start">evaluating configuration against Rego policy baselines and producing JSON / CSV / HTML results.</text>
 <text x="360" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#C0392B" text-anchor="start">Produces data, not meaning.</text>
 <text x="360" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#5A5A5A" text-anchor="start">It assesses posture; it does not govern it.</text>

 <!-- down arrow -->
 <line x1="640" y1="282" x2="640" y2="312" stroke="#5A5A5A" stroke-width="3" marker-end="url(#ar-grey)"/>

 <!-- Layer 2: ScubaConnect (automate) -->
 <rect x="90" y="314" width="1100" height="150" rx="12" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2.2"/>
 <rect x="90" y="314" width="14" height="150" rx="0" fill="#1E8C8C"/>
 <text x="140" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#0D1B2E" text-anchor="start">ScubaConnect</text>
 <text x="140" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1E8C8C" text-anchor="start">Automates</text>
 <text x="360" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="start">Replaces interactive, human-dependent runs with non-interactive, certificate-authenticated</text>
 <text x="360" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#33414F" text-anchor="start">workflows orchestrated through GitHub Actions, and feeds official results to CISA's CDM Dashboard.</text>
 <text x="360" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#C0392B" text-anchor="start">Automates execution, not governance.</text>
 <text x="360" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#5A5A5A" text-anchor="start">It watches one direction; it produces no governed, versioned artifacts.</text>

 <!-- down arrow -->
 <line x1="640" y1="466" x2="640" y2="496" stroke="#5A5A5A" stroke-width="3" marker-end="url(#ar-grey)"/>

 <!-- Layer 3: UIAO-core (govern) -->
 <rect x="90" y="498" width="1100" height="160" rx="12" fill="#0D1B2E" stroke="#0D1B2E" stroke-width="2.2"/>
 <rect x="90" y="498" width="14" height="160" rx="0" fill="#1E8C8C"/>
 <text x="140" y="548" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="start">UIAO-core</text>
 <text x="140" y="578" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#7FD3CB" text-anchor="start">Governs</text>
 <text x="360" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF1FB" text-anchor="start">A two-way governance envelope wrapping the whole SCuBA data path — never inline, always in parallel.</text>
 <text x="360" y="562" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF1FB" text-anchor="start">Outbound (Leg 1): results → governed, versioned artifacts with drift detection and violation alerting.</text>
 <text x="360" y="584" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF1FB" text-anchor="start">Inbound (Leg 2): upstream policy changes → governance events → assessment recalibration.</text>
 <text x="360" y="624" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#7FD3CB" text-anchor="start">Supplies the missing half: prompt + conversion, on two legs.</text>
 <text x="360" y="646" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#CDE0F5" text-anchor="start">Turns a compliance pipeline into a continuously governed, audit-ready governance feedback system.</text>

 <text x="640" y="700" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="middle">UIAO-core is not middleware and not a SCuBA plugin — it is the governance envelope around the entire data path.</text>
</svg>
