<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
 <rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
 <defs>
  <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
  <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  <marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1B2E"/></marker>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 </defs>

 <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#0D1B2E" text-anchor="start">Two-Way Governance Architecture — UIAO Around the SCuBA Data Path</text>

 <!-- Sacrosanct path (red) arcing over the top, bypassing UIAO -->
 <path d="M 210 300 L 210 108 L 1070 108 L 1070 200" fill="none" stroke="#C0392B" stroke-width="3.5" marker-end="url(#ar-red)"/>
 <text x="640" y="98" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#C0392B" text-anchor="middle">Sacrosanct CDM path — ScubaConnect → CISA. UIAO does not touch, intercept, modify, or delay it.</text>

 <!-- AGENCY box -->
 <rect x="60" y="150" width="300" height="410" rx="12" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.6"/>
 <rect x="60" y="150" width="300" height="34" rx="12" fill="#EAF1FB"/>
 <text x="210" y="172" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">AGENCY CLOUD ENVIRONMENT</text>
 <text x="210" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-style="italic" fill="#6B7A8D" text-anchor="middle">GCC-Moderate boundary</text>
 <rect x="90" y="222" width="240" height="56" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
 <text x="210" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">M365 Tenant</text>
 <rect x="90" y="300" width="240" height="74" rx="8" fill="#0D1B2E" stroke="#0D1B2E" stroke-width="1.8"/>
 <text x="210" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ScubaConnect</text>
 <text x="210" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#CDE0F5" text-anchor="middle" dominant-baseline="central">non-interactive, cert-authenticated</text>
 <text x="210" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#5A5A5A" text-anchor="middle">SCuBA assesses.</text>
 <text x="210" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#5A5A5A" text-anchor="middle">ScubaConnect automates.</text>

 <!-- UIAO Governance Envelope (center) -->
 <rect x="440" y="150" width="400" height="410" rx="12" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="2.4"/>
 <rect x="440" y="150" width="400" height="36" rx="12" fill="#D7F2EE"/>
 <text x="640" y="173" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">UIAO GOVERNANCE ENVELOPE</text>
 <rect x="470" y="206" width="340" height="58" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
 <text x="640" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Upstream Policy Watcher</text>
 <text x="640" y="249" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">watches cisagov/ScubaGear releases</text>
 <rect x="470" y="276" width="340" height="58" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
 <text x="640" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Governance Event Engine</text>
 <text x="640" y="319" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">raw data → typed governance artifacts</text>
 <rect x="470" y="346" width="340" height="58" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
 <text x="640" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Canonical Artifact Repository</text>
 <text x="640" y="389" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">versioned, immutable, never overwritten</text>
 <rect x="470" y="416" width="340" height="58" rx="8" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
 <text x="640" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Drift Detection Engine</text>
 <text x="640" y="459" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">delta vs prior runs → alert + remediation</text>
 <text x="640" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">UIAO governs.</text>

 <!-- CISA box -->
 <rect x="920" y="150" width="300" height="410" rx="12" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.6"/>
 <rect x="920" y="150" width="300" height="34" rx="12" fill="#EAF1FB"/>
 <text x="1070" y="172" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">CISA DOMAIN</text>
 <rect x="950" y="200" width="240" height="60" rx="8" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="1.8"/>
 <text x="1070" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">CDM Dashboard</text>
 <text x="1070" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#5A5A5A" text-anchor="middle" dominant-baseline="central">via CLAW / TALON</text>
 <rect x="950" y="300" width="240" height="74" rx="8" fill="#0D1B2E" stroke="#0D1B2E" stroke-width="1.8"/>
 <text x="1070" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">cisagov/ScubaGear</text>
 <text x="1070" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#CDE0F5" text-anchor="middle" dominant-baseline="central">GitHub Releases · Rego baselines</text>

 <!-- Leg 1 parallel feed (teal dashed): ScubaConnect -> UIAO -->
 <line x1="333" y1="337" x2="465" y2="305" stroke="#1E8C8C" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ar-teal)"/>
 <text x="398" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Leg 1</text>
 <text x="398" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#1E8C8C" text-anchor="middle">parallel feed</text>

 <!-- Leg 2 inbound (navy): cisagov -> UIAO Upstream Policy Watcher -->
 <line x1="947" y1="320" x2="815" y2="244" stroke="#0D1B2E" stroke-width="3" marker-end="url(#ar-navy)"/>
 <text x="882" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Leg 2</text>
 <text x="882" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#0D1B2E" text-anchor="middle">policy release</text>

 <!-- Leg 2 recalibration return (navy) along the bottom: UIAO -> ScubaConnect -->
 <path d="M 640 560 L 640 600 L 210 600 L 210 376" fill="none" stroke="#0D1B2E" stroke-width="3" marker-end="url(#ar-navy)"/>
 <text x="425" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Leg 2 — recalibration trigger: updated baseline re-runs the assessment (closes the loop)</text>

 <!-- Legend -->
 <line x1="60" y1="650" x2="100" y2="650" stroke="#C0392B" stroke-width="3.5"/>
 <text x="108" y="654" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start">Sacrosanct CDM path (untouched)</text>
 <line x1="370" y1="650" x2="410" y2="650" stroke="#1E8C8C" stroke-width="3" stroke-dasharray="7 5"/>
 <text x="418" y="654" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start">Leg 1 — outbound governance feed</text>
 <line x1="700" y1="650" x2="740" y2="650" stroke="#0D1B2E" stroke-width="3"/>
 <text x="748" y="654" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#33414F" text-anchor="start">Leg 2 — inbound policy updates + recalibration</text>

 <text x="60" y="688" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="start">No other component in the SCuBA ecosystem watches both directions. SCuBA assesses · ScubaConnect automates · UIAO governs.</text>
</svg>
