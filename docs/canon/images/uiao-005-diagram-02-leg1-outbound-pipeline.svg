<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
 <rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF"/>
 <defs>
  <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker>
  <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/></marker>
 </defs>

 <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="bold" fill="#0D1B2E" text-anchor="start">Leg 1 — Outbound: Assessment → Governance → Reporting</text>

 <!-- Sacrosanct CISA box (red) top right -->
 <rect x="876" y="86" width="364" height="74" rx="10" fill="#F7E2DE" stroke="#C0392B" stroke-width="2.2"/>
 <text x="1058" y="112" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#C0392B" text-anchor="middle">Step 1e — Sacrosanct path to CISA</text>
 <text x="1058" y="133" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#7B2218" text-anchor="middle">official results → CDM Dashboard via CLAW/TALON.</text>
 <text x="1058" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#7B2218" text-anchor="middle">UIAO does not touch, modify, or delay it.</text>

 <!-- Top row: shared assessment execution (Steps 1a-1d) -->
 <!-- 1a -->
 <rect x="40" y="190" width="245" height="116" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.8"/>
 <rect x="40" y="190" width="245" height="12" rx="0" fill="#1E8C8C"/>
 <text x="162" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Step 1a — Orchestration</text>
 <text x="162" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">GitHub Actions daily cron</text>
 <text x="162" y="270" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1E3A66" text-anchor="middle">0 6 * * * UTC</text>
 <text x="162" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#6B7A8D" text-anchor="middle">no human initiates</text>
 <!-- 1b -->
 <rect x="320" y="190" width="245" height="116" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.8"/>
 <rect x="320" y="190" width="245" height="12" rx="0" fill="#1E8C8C"/>
 <text x="442" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Step 1b — Non-Interactive Auth</text>
 <text x="442" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">Service Principal +</text>
 <text x="442" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">certificate authentication</text>
 <text x="442" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#6B7A8D" text-anchor="middle">no browser pop-up</text>
 <!-- 1c -->
 <rect x="600" y="190" width="245" height="116" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.8"/>
 <rect x="600" y="190" width="245" height="12" rx="0" fill="#1E8C8C"/>
 <text x="722" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Step 1c — Configuration Pull</text>
 <text x="722" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">Graph · Exchange Online ·</text>
 <text x="722" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">SharePoint Online</text>
 <text x="722" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#6B7A8D" text-anchor="middle">all SCuBA-covered products</text>
 <!-- 1d -->
 <rect x="880" y="190" width="245" height="116" rx="10" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="1.8"/>
 <rect x="880" y="190" width="245" height="12" rx="0" fill="#1E8C8C"/>
 <text x="1002" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Step 1d — ScubaGear Eval</text>
 <text x="1002" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">evaluate vs Rego baselines</text>
 <text x="1002" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">results: JSON · CSV · HTML</text>
 <text x="1002" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#6B7A8D" text-anchor="middle">M365 returns config + audit logs</text>

 <!-- top-row connectors -->
 <line x1="286" y1="248" x2="318" y2="248" stroke="#5A5A5A" stroke-width="3" marker-end="url(#ar-grey)"/>
 <line x1="566" y1="248" x2="598" y2="248" stroke="#5A5A5A" stroke-width="3" marker-end="url(#ar-grey)"/>
 <line x1="846" y1="248" x2="878" y2="248" stroke="#5A5A5A" stroke-width="3" marker-end="url(#ar-grey)"/>

 <!-- 1d branch up to sacrosanct (red) -->
 <line x1="1002" y1="190" x2="1002" y2="164" stroke="#C0392B" stroke-width="3.5" marker-end="url(#ar-red)"/>

 <!-- 1d branch down (teal) parallel feed to UIAO row -->
 <path d="M 1002 306 L 1002 348 L 162 348 L 162 392" fill="none" stroke="#1E8C8C" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ar-teal)"/>
 <text x="582" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1E8C8C" text-anchor="middle">Step 1f — parallel, read-only, non-blocking copy of the same results → UIAO-core</text>

 <!-- UIAO governance band header -->
 <rect x="40" y="392" width="1085" height="30" rx="8" fill="#D7F2EE"/>
 <text x="582" y="407" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">UIAO Governance Envelope — converts results into governed, versioned, audit-ready artifacts</text>

 <!-- Bottom row: UIAO governance (Steps 1g-1j) -->
 <!-- 1g -->
 <rect x="40" y="440" width="255" height="150" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
 <text x="167" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Step 1g — Event Conversion</text>
 <text x="167" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">Governance Event Engine</text>
 <text x="167" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">typed, timestamped event:</text>
 <text x="167" y="538" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">what passed, what failed,</text>
 <text x="167" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">against which baseline version</text>
 <!-- 1h -->
 <rect x="320" y="440" width="255" height="150" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
 <text x="447" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Step 1h — Canonical Storage</text>
 <text x="447" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">Canonical Artifact Repository</text>
 <text x="447" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">one immutable artifact per run</text>
 <text x="447" y="538" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">never overwritten —</text>
 <text x="447" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">a complete compliance history</text>
 <!-- 1i -->
 <rect x="600" y="440" width="255" height="150" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
 <text x="727" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Step 1i — Drift Detection</text>
 <text x="727" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">Drift Detection Engine</text>
 <text x="727" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">compares vs prior runs:</text>
 <text x="727" y="538" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">improvements + regressions</text>
 <text x="727" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">flagged as delta items</text>
 <!-- 1j -->
 <rect x="880" y="440" width="255" height="150" rx="10" fill="#FFFFFF" stroke="#1E8C8C" stroke-width="1.8"/>
 <text x="1007" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D1B2E" text-anchor="middle">Step 1j — Alert + Remediate</text>
 <text x="1007" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">mandatory "Shall" violation →</text>
 <text x="1007" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">Agency Dashboard alert +</text>
 <text x="1007" y="538" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">remediation ticket with control,</text>
 <text x="1007" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#33414F" text-anchor="middle">expected value, baseline version</text>

 <!-- bottom-row connectors -->
 <line x1="296" y1="515" x2="318" y2="515" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
 <line x1="576" y1="515" x2="598" y2="515" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>
 <line x1="856" y1="515" x2="878" y2="515" stroke="#1E8C8C" stroke-width="3" marker-end="url(#ar-teal)"/>

 <text x="60" y="640" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#6B7A8D" text-anchor="start">UIAO intercepts the results in parallel — never inline — and converts them into governed, versioned, actionable compliance artifacts.</text>
</svg>
