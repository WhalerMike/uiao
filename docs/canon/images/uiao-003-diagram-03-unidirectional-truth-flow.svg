<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#0D1B2E" text-anchor="start">Cross-Adapter Unidirectional Truth Flow</text><rect x="50" y="250" width="130" height="120" rx="12" fill="#0D1B2E"/><text x="115" y="300.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">SSOT</text><text x="115" y="319.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">truth</text><rect x="240" y="250" width="170" height="120" rx="10" fill="#EAF1FB" stroke="#1E3A66" stroke-width="2"/><rect x="240" y="250" width="170" height="12" rx="0" fill="#1E3A66"/><text x="325" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Identity</text><line x1="184" y1="290" x2="236" y2="290" stroke="#0D1B2E" stroke-width="2.6" marker-end="url(#ar-grey)"/><rect x="434" y="250" width="170" height="120" rx="10" fill="#EAF1FB" stroke="#1E8C8C" stroke-width="2"/><rect x="434" y="250" width="170" height="12" rx="0" fill="#1E8C8C"/><text x="519" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Telemetry</text><line x1="414" y1="290" x2="430" y2="290" stroke="#0D1B2E" stroke-width="2.6" marker-end="url(#ar-grey)"/><rect x="628" y="250" width="170" height="120" rx="10" fill="#EAF1FB" stroke="#5B2D8E" stroke-width="2"/><rect x="628" y="250" width="170" height="12" rx="0" fill="#5B2D8E"/><text x="713" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Policy</text><line x1="608" y1="290" x2="624" y2="290" stroke="#0D1B2E" stroke-width="2.6" marker-end="url(#ar-grey)"/><rect x="822" y="250" width="170" height="120" rx="10" fill="#EAF1FB" stroke="#5A5A5A" stroke-width="2"/><rect x="822" y="250" width="170" height="12" rx="0" fill="#5A5A5A"/><text x="907" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Enforcement</text><line x1="802" y1="290" x2="818" y2="290" stroke="#0D1B2E" stroke-width="2.6" marker-end="url(#ar-grey)"/><rect x="1016" y="250" width="170" height="120" rx="10" fill="#EAF1FB" stroke="#D4A017" stroke-width="2"/><rect x="1016" y="250" width="170" height="12" rx="0" fill="#D4A017"/><text x="1101" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">Integration</text><line x1="996" y1="290" x2="1012" y2="290" stroke="#0D1B2E" stroke-width="2.6" marker-end="url(#ar-grey)"/><path d="M 1166 370 Q 650.5 560 175 370" fill="none" stroke="#1E8C8C" stroke-width="2.6" stroke-dasharray="2 0" marker-end="url(#ar-teal)"/><text x="650.5" y="548" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1E8C8C" text-anchor="middle" dominant-baseline="central">returns only as certificate-anchored provenance records</text><line x1="810" y1="175" x2="810" y2="246" stroke="#C0392B" stroke-width="2.4" marker-end="url(#ar-red)"/><rect x="715" y="140" width="190" height="34" rx="8" fill="#F7E2DE" stroke="#C0392B" stroke-width="2"/><text x="810" y="157" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle" dominant-baseline="central">drift signal</text><line x1="1101" y1="175" x2="1101" y2="246" stroke="#D4A017" stroke-width="2.4" marker-end="url(#ar-amber)"/><rect x="1006" y="140" width="190" height="34" rx="8" fill="#FBEED2" stroke="#D4A017" stroke-width="2"/><text x="1101" y="157" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0D1B2E" text-anchor="middle" dominant-baseline="central">change intent</text><text x="50" y="692" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-style="italic" fill="#6B7A8D" text-anchor="start">Truth flows outward from the SSOT through the classes; no class rewrites another's output. Drift is an externally visible assurance signal.</text>
