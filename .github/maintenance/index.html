<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UIAO — Under development</title>
<meta name="description" content="The UIAO documentation site is temporarily under development. Please check back soon.">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0D1B2E;
    --navy2:   #142338;
    --teal:    #1E8C8C;
    --teal-lt: #27BEBE;
    --amber-lt:#E8A020;
    --ink:     #243248;
    --muted:   #5a6878;
    --paper-2: #f5f7fa;
    --line:    rgba(255,255,255,0.12);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(39,190,190,0.18), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(232,160,32,0.12), transparent 55%),
      var(--navy);
    color: #eef2f7;
    font-family: 'DM Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 640px;
    width: 100%;
    text-align: center;
  }
  .badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .72rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--teal-lt);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: .4rem 1rem;
    margin-bottom: 2rem;
  }
  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .9rem;
    letter-spacing: .3em;
    color: #9fb3c8;
    margin-bottom: 1.4rem;
  }
  h1 {
    font-family: 'DM Serif Display', Georgia, serif;
    font-weight: 400;
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    line-height: 1.12;
    color: #ffffff;
    margin-bottom: 1.2rem;
  }
  h1 .accent { color: var(--teal-lt); }
  p {
    color: #c7d2de;
    font-size: 1.05rem;
    margin: 0 auto 1rem;
    max-width: 48ch;
  }
  .rule {
    width: 64px;
    height: 3px;
    border-radius: 3px;
    margin: 2rem auto 1.6rem;
    background: linear-gradient(90deg, var(--teal-lt), var(--amber-lt));
  }
  .muted {
    color: #8ea0b3;
    font-size: .9rem;
  }
  footer {
    margin-top: 2.4rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .72rem;
    letter-spacing: .12em;
    color: #6f829a;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">UIAO</div>
    <span class="badge">Under construction</span>
    <h1>This site is <span class="accent">under&nbsp;construction</span>.</h1>
    <div class="rule"></div>
    <p>The UIAO documentation is being rebuilt. Pages are temporarily offline while we update the published site.</p>
    <p class="muted">Please check back soon.</p>
    <footer>Unified Identity-Addressing-Overlay Architecture</footer>
  </main>
</body>
</html>
