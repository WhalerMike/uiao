name: Substrate Drift

# Always runs on PRs (no path filter) so the required check always reports;
# the substrate walker is cheap and reads fixed canon/substrate paths.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/uiao/canon/substrate-manifest.yaml'
      - 'src/uiao/canon/workspace-contract.yaml'
      - 'src/uiao/canon/document-registry.yaml'
      # The registry walk runs in both directions now, so any canon document
      # that declares a `document_id` can move the result — not just the
      # registry file itself.
      - 'src/uiao/canon/**/*.md'
      - 'src/uiao/canon/**/*.yaml'
      - 'src/uiao/schemas/substrate-manifest/**'
      - 'src/uiao/schemas/workspace-contract/**'
      - 'src/uiao/substrate/**'
      - 'src/uiao/canon/link-registry.yaml'
      - 'scripts/scan_link_gaps.py'
      - '.github/workflows/substrate-drift.yml'

jobs:
  substrate-drift:
    name: Check substrate for DRIFT-SCHEMA + DRIFT-PROVENANCE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install minimal deps
        run: pip install --quiet pyyaml pydantic

      - name: Run substrate walker
        env:
          PYTHONPATH: src
          UIAO_WORKSPACE_ROOT: ${{ github.workspace }}
        run: |
          # pipefail is required: without it the pipeline's exit status
          # is tee's (always 0) and the gate below can never fire. That
          # exact bug shipped with the original any-finding gate — it
          # reported findings in the log while the job stayed green,
          # letting a ~32-finding P2/P3 advisory baseline accumulate
          # undetected.
          set -o pipefail
          python - <<'EOF' | tee substrate-report.json
          import json, sys
          from uiao.substrate.walker import walk_substrate

          report = walk_substrate()
          print(json.dumps(report.as_dict(), indent=2))
          # Gate on P1 + P2 findings. The inherited P2 baseline was
          # burned down (dangling citations fixed; historical-record
          # ADRs 060/062 documented as walker exemptions), so any new
          # P2 is genuinely new drift and fails CI. P3 stays advisory:
          # the link registry's intentional unrecorded-agreement
          # markers (UIAO_145 / ADR-132 Phase 2 migration debt) are P3
          # by design and are tracked by scan_link_gaps.py instead.
          sys.exit(1 if any(f["severity"] in ("P1", "P2") for f in report.as_dict()["findings"]) else 0)
          EOF

      # Advisory: reports link-governance gaps (unrecorded agreements,
      # unanchored artifacts, past-due reviews, overlay/pack mismatches)
      # per UIAO_145 §7 / ADR-132 Phase 2. Never fails the job — the
      # registry intentionally carries declared migration debt; flip to
      # --strict when the Phase 2 migration completes.
      - name: Link-gap scan (advisory)
        run: python scripts/scan_link_gaps.py

      - name: Upload substrate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: substrate-report
          path: substrate-report.json
          retention-days: 30
