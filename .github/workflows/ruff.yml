name: Ruff

# Always runs on PRs (no path filter) so the required check always reports;
# ruff is cheap, so it lints every PR rather than skipping conditionally.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/uiao/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*.py'
      - 'deploy/**/*.py'
      - 'diagrams/**/*.py'
      - 'pyproject.toml'

jobs:
  ruff:
    name: Lint src/uiao with ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        # Pinned on purpose: unpinned latest broke every PR when ruff 0.16.0
        # shipped new default rules (2026-07-24). Bump deliberately, with the
        # rule-fix sweep in the same PR — never by surprise. Keep in step with
        # the ruff-pre-commit rev in .pre-commit-config.yaml.
        run: pip install --quiet ruff==0.16.0

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format (diff-only check)
        run: ruff format --check .
