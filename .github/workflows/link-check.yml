name: Link Check

# Always triggers on PRs so the required check always reports; lychee only runs
# when Markdown / Quarto / link-config changed (else the job skips its work to a
# green result). The weekly schedule + manual dispatch always run in full.
# See .github/actions/pr-relevant.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.qmd'
      - '.lycheeignore'
  schedule:
    # Weekly catch-all to detect upstream link rot even when no MD/QMD
    # changed in the repo itself.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  link-check:
    name: Check markdown + quarto links
    runs-on: ubuntu-latest
    # Blocking. Baseline is clean (0 errors with the current
    # `.lycheeignore`); any new genuinely broken link should be fixed
    # in-PR or, if the URL is a CI-side false positive (e.g. cloud-IP
    # geo-gating), added to `.lycheeignore` in the same PR with an
    # explanatory comment.
    #
    # `--base` is deliberately NOT passed. lychee resolves a relative
    # markdown link against the input file's own directory, which is what a
    # source-tree check needs; `--base` resolves every relative link against
    # the workspace root instead, so `[x](adr-043-….md)` cited from inside
    # src/uiao/canon/adr/ looks for /adr-043-….md and fails. With the old
    # blanket `^file://` ignore that mis-resolution was invisible — it
    # produced 2,942 phantom errors that were all suppressed before anyone
    # saw them. Do not re-add it.
    #
    # `--accept` carries 403 and 406 because both are vendor sites refusing the
    # crawler rather than reporting a dead link: 403 is an outright bot block
    # (learn.microsoft.com does this to cloud-runner IPs), and 406 Not
    # Acceptable is a content-negotiation refusal of lychee's request headers
    # (elastic.co started doing this on 2026-08-28, turning every PR in the
    # repo red for a live page). Neither status is evidence of link rot, so
    # accepting them repo-wide beats accumulating per-URL `.lycheeignore`
    # entries that each need their own justification. A genuinely dead link
    # answers 404/410, which is still a failure.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: changes
        uses: ./.github/actions/pr-relevant
        with:
          pattern: '(\.md$|\.qmd$|^\.lychee\.toml$|^\.lycheeignore$|^\.github/workflows/link-check\.yml$|^\.github/actions/pr-relevant/)'

      - name: Materialize SVG-derived PNG stand-ins
        # lychee resolves relative image links against the checkout, but
        # SVG-derived PNGs are untracked build artifacts (ADR-093 — rendered
        # by quarto.yml at site-build time, see derived-binary-gate.yml).
        # Link checking only needs the paths to EXIST, so create empty
        # stand-ins for every tracked SVG's sibling PNG instead of paying a
        # full rasterize on each PR.
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          git ls-files -- '*.svg' | while IFS= read -r s; do
            p="${s%.svg}.png"
            [ -e "$p" ] || : > "$p"
          done

      # The `servicenow-day2/servicenow-day2/figs/` exclude below suppresses a
      # resolution artifact, not a broken link. Quarto's `{{< include >}}`
      # splices a fragment into the including document, so a relative path
      # inside the fragment resolves against the INCLUDER's directory, not the
      # fragment's own -- verified against quarto 1.10.18, which emits the
      # fragment's path string into `<img src>` verbatim. The day-2 kit
      # fragments live in orgcomp-series/servicenow-day2/ and are included from
      # wrappers in orgcomp-series/, so their figure refs must read
      # `servicenow-day2/figs/...` to render at all. lychee checks each file
      # standalone and resolves that against the fragment's own directory,
      # looking for a doubled `servicenow-day2/servicenow-day2/figs/...` that
      # cannot exist.
      #
      # That doubled segment is reachable only through the mis-resolution, so
      # the exclude hides the artifact and nothing real: the same figures cited
      # from the wrappers resolve correctly and stay checked. Figure existence
      # is enforced more strictly than lychee could manage anyway by
      # tests/test_day2_kit_figure_paths.py, which demands a committed .svg
      # source per reference -- lychee only ever sees the zero-byte PNG
      # stand-ins materialized above. tests/test_link_check_excludes.py pins
      # the exclude narrow so it cannot be widened into a real suppression.
      - name: Run lychee link checker
        if: steps.changes.outputs.relevant == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            --accept 200,206,403,406,429,503
            --exclude '^https?://(www\.)?onedrive\.com(/|$)'
            --exclude '^https?://onedrive\.live\.com(/|$)'
            --exclude '^https?://download\.microsoft\.com/download/'
            --exclude '^https?://(www\.)?aamva\.org/'
            --exclude-path docs/site
            --exclude-path docs/_site
            --exclude-path docs/docx
            --exclude-path docs/publications
            --exclude-path inbox/wiki
            --exclude-path 'docs/customer-documents/orgcomp-series/OrgComp-Training-Program'
            --exclude 'servicenow-day2/servicenow-day2/figs/'
            --exclude '^https://example\.com'
            --exclude '^https://your-tenant'
            --exclude '^https://uiao\.gov/'
            --exclude '^http://localhost'
            --exclude '^http://127\.0\.0\.1'
            --exclude 'github\.com/WhalerMike/uiao-docs/'
            --exclude '^https://github\.com/WhalerMike/uiao/blob/'
            --exclude '^https://claude\.ai/'
            --exclude '^https://github\.com/WhalerMike/[^/]+/settings/'
            --exclude '^https://www\.plantuml\.com/plantuml/(png|svg)/'
            '**/*.md'
            '**/*.qmd'
          fail: true
          output: /tmp/lychee-report.md

      - name: Upload link-check report
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: link-check-report
          path: /tmp/lychee-report.md
          retention-days: 30
