name: Sitemap Drift

# Regenerates docs/data/sitemap-tree.md from the navbar + sidebar in
# docs/_quarto.yml and fails the PR if the committed file diverges. This
# guarantees the whole-site sitemap included by docs/sitemap.qmd cannot
# fall behind the navigation: add/rename/remove a sidebar entry, or change
# a page's frontmatter title, and the committed tree must be regenerated.
#
# Mirrors the anti-drift posture of document-index-status.yml.
#
# To resolve a failing run, run locally and commit the updated file:
#     python scripts/generate_sitemap.py \
#         --output docs/data/sitemap-tree.md

on:
  pull_request:
    paths:
      - 'docs/_quarto.yml'
      - 'docs/**/*.qmd'
      - 'docs/data/sitemap-tree.md'
      - 'scripts/generate_sitemap.py'
      - '.github/workflows/sitemap-drift.yml'
  push:
    branches: [main]
    paths:
      - 'docs/_quarto.yml'
      - 'docs/**/*.qmd'
      - 'docs/data/sitemap-tree.md'
      - 'scripts/generate_sitemap.py'

jobs:
  sitemap-drift:
    name: Regenerate sitemap tree and check for drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: pip install --quiet pyyaml

      - name: Regenerate sitemap tree
        run: |
          python scripts/generate_sitemap.py \
              --output docs/data/sitemap-tree.md

      - name: Fail on drift
        run: |
          if ! git diff --exit-code docs/data/sitemap-tree.md; then
            echo "::error::docs/data/sitemap-tree.md is stale."
            echo "Regenerate locally and commit:"
            echo "  python scripts/generate_sitemap.py \\"
            echo "      --output docs/data/sitemap-tree.md"
            exit 1
          fi

      - name: Upload regenerated artifact on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sitemap-tree-regenerated
          path: docs/data/sitemap-tree.md
