name: Tier-1 ServiceNow

# Weekly heartbeat + manual dispatch (repo-review round 3: a dispatch-only
# gate that never runs gives false assurance). Without SERVICENOW_* secrets
# the tier-1 tests skip cleanly, so the weekly run still proves the
# harness. Move to nightly once secrets are populated.
# See tests/integration/README.md.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '45 6 * * 1'

permissions:
  contents: read

jobs:
  tier1:
    name: Tier-1 ServiceNow PDI
    runs-on: ubuntu-latest
    env:
      SERVICENOW_PDI_INSTANCE: ${{ secrets.SERVICENOW_PDI_INSTANCE }}
      SERVICENOW_PDI_USER: ${{ secrets.SERVICENOW_PDI_USER }}
      SERVICENOW_PDI_PASSWORD: ${{ secrets.SERVICENOW_PDI_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Report secret presence
        run: |
          if [ -z "$SERVICENOW_PDI_INSTANCE" ]; then
            echo "SERVICENOW_PDI_* secrets not set; tier-1 tests will skip cleanly."
          else
            echo "ServiceNow PDI secrets present; tier-1 tests will run live."
          fi

      - name: Run tier-1
        run: pytest tests/integration/tier1/test_service_now_tier1.py -v --no-header
