name: Tier-1 CyberArk

# Weekly heartbeat + manual dispatch (repo-review round 3: a dispatch-only
# gate that never runs gives false assurance). Without CYBERARK_* secrets
# the tier-1 tests skip cleanly, so the weekly run still proves the
# harness (install, collection, imports). Move to daily once secrets are
# populated. See tests/integration/README.md.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read

jobs:
  tier1:
    name: Tier-1 CyberArk Privilege Cloud
    runs-on: ubuntu-latest
    env:
      CYBERARK_TENANT: ${{ secrets.CYBERARK_TENANT }}
      CYBERARK_CLIENT_ID: ${{ secrets.CYBERARK_CLIENT_ID }}
      CYBERARK_CLIENT_SECRET: ${{ secrets.CYBERARK_CLIENT_SECRET }}
      CYBERARK_TEST_SAFE: ${{ secrets.CYBERARK_TEST_SAFE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Report secret presence
        run: |
          if [ -z "$CYBERARK_TENANT" ]; then
            echo "CYBERARK_* secrets not set; tier-1 tests will skip cleanly."
          else
            echo "CyberArk secrets present; tier-1 tests will run live."
          fi

      - name: Run tier-1
        run: pytest tests/integration/tier1/test_cyberark_tier1.py -v --no-header
