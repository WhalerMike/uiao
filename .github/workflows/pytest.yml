name: Pytest

# Always triggers on PRs so the required checks always report; the test jobs
# only run when package code / tests / packaging changed (else each job skips
# its work to a green result). See .github/actions/pr-relevant.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/uiao/**'
      - 'tests/**'
      - 'pyproject.toml'

permissions:
  contents: read
  pull-requests: read

jobs:
  substrate:
    name: Substrate walker tests (fast, minimal deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: changes
        uses: ./.github/actions/pr-relevant
        with:
          pattern: '(^src/uiao/|^tests/|^pyproject\.toml$|^\.github/workflows/pytest\.yml$|^\.github/actions/pr-relevant/)'

      - name: Set up Python
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install minimal deps
        if: steps.changes.outputs.relevant == 'true'
        run: pip install --quiet pytest pyyaml typer rich pydantic

      - name: Run substrate walker tests
        if: steps.changes.outputs.relevant == 'true'
        env:
          PYTHONPATH: src
        run: pytest tests/test_substrate_walker.py -q

  full:
    name: Full pytest suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: changes
        uses: ./.github/actions/pr-relevant
        with:
          pattern: '(^src/uiao/|^tests/|^pyproject\.toml$|^\.github/workflows/pytest\.yml$|^\.github/actions/pr-relevant/)'

      - name: Set up Python
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package with api extras
        if: steps.changes.outputs.relevant == 'true'
        run: |
          pip install --quiet -e ".[api]"
          pip install --quiet pytest

      - name: Run full pytest
        if: steps.changes.outputs.relevant == 'true'
        run: pytest -q --tb=short
