name: Dependabot Auto-merge

# Repo-review round 3: dependency PRs were being hand-merged weekly
# (recurring toil). This enables GitHub auto-merge (squash) on
# dependabot's own PRs for PATCH and MINOR updates only — the PR still
# waits for every required check to pass before merging; auto-merge just
# removes the human click. MAJOR updates are left open for review.
#
# Requires the repository setting "Allow auto-merge" (enabled 2026-07-20).

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Enable auto-merge for patch/minor dependency bumps
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge (squash) for patch/minor
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave major updates for human review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "Major update — auto-merge intentionally not enabled."
