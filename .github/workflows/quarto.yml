      - name: Set up Quarto (pinned, resilient install)
        # Version is pinned via QUARTO_VERSION at the top of this file — see the
        # rationale there. Downloads with retries so a transient release-CDN 502
        # does not skip a shard and the deploy (the failure in run 27093643913).
        run: |
          set -euo pipefail
          deb="quarto-${QUARTO_VERSION}-linux-amd64.deb"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 5 \
            -o "/tmp/${deb}" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/${deb}"
          sudo dpkg -i "/tmp/${deb}"
          installed="$(quarto --version)"
          echo "Quarto ${installed}"
          [ "${installed}" = "${QUARTO_VERSION}" ] || {
            echo "::error::Quarto version mismatch — pinned ${QUARTO_VERSION}, got ${installed}"
            exit 1
          }

      - name: Set up Python (SVG rasterizer)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rasterize SVG figures to PNG (ADR-093)
        # See the HTML job: sibling PNGs are untracked build artifacts and
        # must exist before the render resolves figure references.
        run: |
          set -euo pipefail
          python -m pip install --quiet cairosvg Pillow pyyaml
          bash scripts/ci_render_untracked_figures.sh

      - name: Render orgcomp-series Markdown
        working-directory: docs
        run: |
          set -euo pipefail
          mapfile -t all < <(find customer-documents/orgcomp-series -name '*.qmd' | sort)
          echo "OrgComp Markdown files: ${#all[@]}"
          for f in "${all[@]}"; do
            quarto render "$f" --to gfm --no-execute-daemon
          done

      - name: Upload orgcomp-series Markdown artifact
        uses: actions/upload-artifact@v7
        with:
          name: orgcomp-md
          path: docs/_site/customer-documents/orgcomp-series/**/*.md
          retention-days: 1
          if-no-files-found: error

  assemble:
    name: Assemble combined site
    needs: [render_html, render_docx, render_docx_canon, render_docx_adr, render_docx_schemas, render_docx_academy, render_docx_findings, render_md_orgcomp]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # softprops/action-gh-release: publish/update downloads-latest
    steps:
      - name: Download HTML site
        uses: actions/download-artifact@v8
        with:
          name: site-html
          path: _site

      - name: Download DOCX shards
        uses: actions/download-artifact@v8
        with:
          pattern: site-docx-*
          path: _docx
          merge-multiple: true

      - name: Merge DOCX outputs into site
        # _docx mirrors `docs/_site/customer-documents/` (the LCD of the
        # artifact path), so copying `_docx/.` onto `_site/customer-documents/`
        # lays each .docx beside its companion .html — including the
        # nested reference-architecture/ subtree, which is already part
        # of the customer-documents tree post-ADR-083.
        run: |
          set -euo pipefail
          if [ -d _docx ]; then
            mkdir -p _site/customer-documents
            cp -a _docx/. _site/customer-documents/
          fi
          find _site -name '*.docx' | wc -l \
            | xargs -I{} echo "Merged {} DOCX files into site"

      - name: Download canon DOCX
        uses: actions/download-artifact@v8
        with:
          name: canon-docx
          path: _docx_canon

      - name: Merge canon DOCX into site
        # _docx_canon mirrors `docs/_site/canon/` (the LCD of its artifact
        # path), so copying onto `_site/canon/` lays each canon .docx beside
        # its companion .html. Independent of the customer-documents merge
        # above.
        run: |
          set -euo pipefail
          if [ -d _docx_canon ]; then
            mkdir -p _site/canon
            cp -a _docx_canon/. _site/canon/
          fi

      - name: Download ADR DOCX
        uses: actions/download-artifact@v8
        with:
          name: adr-docx
          path: _docx_adr

      - name: Merge ADR DOCX into site
        # _docx_adr mirrors `docs/_site/adr/` (the LCD of its artifact path),
        # so copying onto `_site/adr/` lays each ADR .docx beside its
        # companion .html. Independent of the merges above.
        run: |
          set -euo pipefail
          if [ -d _docx_adr ]; then
            mkdir -p _site/adr
            cp -a _docx_adr/. _site/adr/
          fi

      - name: Download schemas DOCX
        uses: actions/download-artifact@v8
        with:
          name: schemas-docx
          path: _docx_schemas

      - name: Merge schemas DOCX into site
        # _docx_schemas mirrors `docs/_site/reference/schemas/` (the LCD of
        # its artifact path), so copying onto `_site/reference/schemas/` lays
        # each schema .docx beside its companion .html. Independent of the
        # merges above.
        run: |
          set -euo pipefail
          if [ -d _docx_schemas ]; then
            mkdir -p _site/reference/schemas
            cp -a _docx_schemas/. _site/reference/schemas/
          fi

      - name: Download academy DOCX
        uses: actions/download-artifact@v8
        with:
          name: academy-docx
          path: _docx_academy

      - name: Merge academy DOCX into site
        # _docx_academy mirrors `docs/_site/academy/` (the LCD of its artifact
        # path), so copying onto `_site/academy/` lays each academy .docx
        # beside its companion .html. Independent of the merges above.
        run: |
          set -euo pipefail
          if [ -d _docx_academy ]; then
            mkdir -p _site/academy
            cp -a _docx_academy/. _site/academy/
          fi

      - name: Download findings DOCX
        uses: actions/download-artifact@v8
        with:
          name: findings-docx
          path: _docx_findings

      - name: Merge findings DOCX into site
        # _docx_findings mirrors `docs/_site/findings/` (the LCD of its
        # artifact path), so copying onto `_site/findings/` lays each finding
        # .docx beside its companion .html. Independent of the merges above.
        run: |
          set -euo pipefail
          if [ -d _docx_findings ]; then
            mkdir -p _site/findings
            cp -a _docx_findings/. _site/findings/
          fi

      - name: Download orgcomp-series Markdown
        uses: actions/download-artifact@v8
        with:
          name: orgcomp-md
          path: _md_orgcomp

      - name: Merge orgcomp-series Markdown into site
        # _md_orgcomp mirrors `docs/_site/customer-documents/orgcomp-series/`
        # (the LCD of its artifact path), so copying onto
        # `_site/customer-documents/orgcomp-series/` lays each rendered .md
        # beside its companion .docx/.html — same filename stem, different
        # extension, so there is no collision with the DOCX merge above.
        run: |
          set -euo pipefail
          if [ -d _md_orgcomp ]; then
            mkdir -p _site/customer-documents/orgcomp-series
            cp -a _md_orgcomp/. _site/customer-documents/orgcomp-series/
          fi
          find _site/customer-documents/orgcomp-series -maxdepth 1 -name '*.md' | wc -l \
            | xargs -I{} echo "Merged {} orgcomp-series Markdown files into site"

      # Per-section .docx bundles: concatenate every page-level .docx in
      # each top-level customer-documents section into one downloadable
      # `<section>-bundle.docx` alongside the per-page renders. The
      # bundler runs from the assemble job because that's where the
      # rendered .docx files are available; doing it earlier would race
      # the render_docx matrix.
      - name: Checkout (bundler script + maintenance page + ScubaDrift source)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/bundle_section_docx.py
            scripts/build_scubadrift_download.py
            scripts/build_orgcomp_download.py
            scripts/build_orgcomp_markdown_download.py
            scripts/build_day2_kit_download.py
            tools/scubadrift
            .github/maintenance
            docs/_quarto.yml
            docs/customer-documents/orgcomp-series
            infoblox-ddi-book
            index.html
            assets/diagrams
          sparse-checkout-cone-mode: false
          path: _repo

      - name: Set up Python for bundler
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install bundler dependencies
        # cairosvg rasterizes the ScubaDrift figure SVGs for its .docx.
        run: pip install --quiet python-docx docxcompose cairosvg

      - name: Build per-section .docx bundles
        # Non-fatal: a section with no rendered .docx (e.g., only stubs)
        # reports a WARN and the build continues. The script returns 0
        # in --all mode regardless. Per ADR-083, the canon modernization
        # pages moved into customer-documents at reference-architecture/,
        # so they are now picked up by --all as a regular section (no
        # more --canon-modernization flag needed).
        run: |
          python _repo/scripts/bundle_section_docx.py \
              --site-root _site/customer-documents \
              --all
          # Canon section bundle: concatenate every canon page .docx into
          # _site/canon/canon-bundle.docx. Non-fatal (|| true) so a bundle
          # hiccup never blocks the site deploy, mirroring the --all posture.
          python _repo/scripts/bundle_section_docx.py \
              --site-root _site \
              --section canon \
            || echo "::warning::canon .docx bundle step failed (non-fatal)"
          # ADR section bundle: concatenate every ADR page .docx into
          # _site/adr/adr-bundle.docx. Non-fatal, same posture as canon.
          python _repo/scripts/bundle_section_docx.py \
              --site-root _site \
              --section adr \
            || echo "::warning::adr .docx bundle step failed (non-fatal)"
          # Schemas section bundle: concatenate every schema page .docx into
          # _site/reference/schemas/schemas-bundle.docx. Non-fatal, same posture.
          python _repo/scripts/bundle_section_docx.py \
              --site-root _site \
              --section reference/schemas \
            || echo "::warning::schemas .docx bundle step failed (non-fatal)"
          # Academy section bundle: concatenate every academy page .docx into
          # _site/academy/academy-bundle.docx. Non-fatal, same posture.
          python _repo/scripts/bundle_section_docx.py \
              --site-root _site \
              --section academy \
            || echo "::warning::academy .docx bundle step failed (non-fatal)"
          # Findings section bundle: concatenate every finding page .docx into
          # _site/findings/findings-bundle.docx. Non-fatal, same posture.
          python _repo/scripts/bundle_section_docx.py \
              --site-root _site \
              --section findings \
            || echo "::warning::findings .docx bundle step failed (non-fatal)"
          find _site -maxdepth 4 -name '*-bundle.docx' \
            | wc -l \
            | xargs -I{} echo "Built {} section bundle(s)"

      - name: Pack all section bundles into one downloadable zip
        # One-click "Download all DOCX bundles" for the Download page: collect
        # every <section>-bundle.docx just produced (anywhere under _site) and
        # archive them into _site/download/uiao-all-docx-bundles.zip. Paths are
        # kept relative to _site so same-named Book bundles in different sections
        # (e.g. orgpath-narrative/Book_01 vs sql-server-narrative-standalone/
        # Book_01) don't collide. Regenerated on every deploy, so the zip always
        # mirrors the current set of section bundles.
        run: |
          set -euo pipefail
          mkdir -p _site/download
          mapfile -t bundles < <(cd _site && find . -name '*-bundle.docx' | sort)
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "No section bundles found — skipping all-bundles zip."
          else
            ( cd _site && zip -q -X download/uiao-all-docx-bundles.zip "${bundles[@]}" )
            size=$(du -h _site/download/uiao-all-docx-bundles.zip | cut -f1)
            echo "Packed ${#bundles[@]} section bundle(s) into uiao-all-docx-bundles.zip ($size)"
          fi

      - name: Build ScubaDrift standalone download set
        # 2b (no committed binary): generate the ScubaDrift standalone zip + the
        # rendered ScubaDrift-Documentation.docx from committed source
        # (tools/scubadrift) into _site/download/ for the Downloads page. Skipped
        # while the site is in maintenance mode — nothing is served then, so there
        # is nothing to build. Runs only when the full site is live. Non-fatal.
        if: env.MAINTENANCE_MODE != 'true'
        run: |
          python _repo/scripts/build_scubadrift_download.py --out _site/download \
            || echo "::warning::ScubaDrift download build failed (non-fatal)"

      - name: Build Federal AAN series download kit
        # Same no-committed-binary posture as ScubaDrift. Assembles the FEDERAL kit
        # into _site/download/ on every deploy: the book .docx come from the freshly
        # rendered _site (Quarto resolved {{< meta >}} to the federal values and
        # dropped the FOUO banner — raw Pandoc would ship neither), the .pptx decks
        # and operator kits come from the sparse-checked source (_repo). The stale
        # committed OrgComp_Federal_Series_Complete_*.zip was removed; this replaces it,
        # fresh and edition-correct. Non-fatal, and skipped in maintenance mode.
        if: env.MAINTENANCE_MODE != 'true'
        run: |
          python _repo/scripts/build_orgcomp_download.py \
              --site-root _site \
              --src-root _repo \
              --out _site/download \
              --date-code "$(date -u +%Y-%m-%d)" \
            || echo "::warning::Federal AAN kit build failed (non-fatal)"

      - name: Build standalone Day-2 kit download
        # The day-2 kit as its own zip (orgcomp-day2-kit-latest.zip) — source +
        # the rendered kit .docx — so an implementation team has a stable URL
        # instead of the kit only inside the 48 MB federal bundle. Also emits
        # the two markdown-only doc zips (docs, no source, no Word) for AI
        # import. Non-fatal, skipped in maintenance mode.
        if: env.MAINTENANCE_MODE != 'true'
        run: |
          python _repo/scripts/build_day2_kit_download.py \
              --site-root _site \
              --src-root _repo \
              --out _site/download \
              --date-code "$(date -u +%Y-%m-%d)" \
            || echo "::warning::Day-2 kit build failed (non-fatal)"

      - name: Build OrgComp markdown-only kit (AI-friendly export)
        # Same book set as the federal series kit above, packaged as plain
        # Markdown from the render_md_orgcomp job's output instead of Word/
        # PowerPoint — for pasting into an AI tool or uploading to an AI
        # "project". Non-fatal, skipped in maintenance mode.
        if: env.MAINTENANCE_MODE != 'true'
        run: |
          python _repo/scripts/build_orgcomp_markdown_download.py \
              --site-root _site \
              --src-root _repo \
              --out _site/download \
              --date-code "$(date -u +%Y-%m-%d)" \
            || echo "::warning::OrgComp markdown kit build failed (non-fatal)"

      - name: Stage per-book and per-section .docx bundles for GitHub Release
        # Every *-bundle.docx built above (the "Build per-section .docx
        # bundles" step's --all sweep, plus canon/adr/schemas/academy/
        # findings) is a concatenation of .docx pages that already ship
        # individually -- pure duplication, and the single largest
        # contributor to the Pages artifact (~421 MB across 83 files,
        # measured on run 31640209577 / issue #1420). Stage them into a
        # release-asset-only directory instead of shipping in _site.
        # Release assets are a flat namespace, so `Book_NN-bundle.docx`
        # names -- which repeat across orgpath-narrative, sql-server-
        # narrative, and sql-server-narrative-standalone -- get their
        # parent section name prefixed to stay unique; every other bundle
        # name is already unique sitewide and passes through unchanged.
        # -iname (not -name) so this also picks up the OrgComp Vol_<N>-
        # <Theme>-Bundle.docx files (capital B, built earlier by
        # build_orgcomp_download.py) -- those names are already unique
        # too, just spelled with a capital letter. Runs even in
        # maintenance mode / on PR previews (cheap local copy, publishes
        # nothing by itself); the actual publish and Pages-strip steps
        # below stay gated as before.
        run: |
          set -euo pipefail
          mkdir -p _release_bundles
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              Book_*-bundle.docx)
                parent="$(basename "$(dirname "$f")")"
                cp "$f" "_release_bundles/${parent}-${base}"
                ;;
              *)
                cp "$f" "_release_bundles/${base}"
                ;;
            esac
          done < <(find _site -iname '*-bundle.docx' -print0)
          count=$(find _release_bundles -type f | wc -l)
          echo "Staged ${count} bundle file(s) for GitHub Release."

      - name: Publish download kits to GitHub Releases (not the Pages artifact)
        # The kit zips/docx just built into _site/download/ are the single
        # largest contributor to the Pages artifact (~1.1 GB of the ~2.8 GB
        # total that tripped GitHub's 1 GB Pages guidance on 2026-08-06) --
        # and every one of them is a self-contained download, not part of
        # the browsable site itself. Ship them as assets on a single rolling
        # release instead: same "rebuilt from source on every deploy"
        # semantics the Download page already documents, but off the Pages
        # artifact entirely. softprops/action-gh-release is idempotent
        # against a fixed tag -- re-running replaces same-named assets in
        # place rather than creating a new release each deploy, so
        # `downloads-latest` stays a single release, not one per push.
        # Gated the same way the kit-build steps above are (skipped in
        # maintenance mode, when _site/download/ is never populated) and
        # only on the paths that actually deploy (push to main / manual
        # dispatch) so a PR preview build never touches the real release.
        #
        # `files:` is scoped to *.zip and the one standalone .docx -- NOT a
        # bare `_site/download/*` glob. Quarto renders docs/download/
        # index.qmd to _site/download/index.html in the same directory the
        # kit-build scripts write into; a bare `*` glob swept that page's
        # own HTML into the release too (caught after the fact as a stray
        # `index.html` release asset on the first run of this step).
        if: env.MAINTENANCE_MODE != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: downloads-latest
          name: "Download Kits — latest"
          body: |
            Rebuilt from source on every deploy to `main` — not a versioned
            release. See the [Downloads page](https://whalermike.github.io/uiao/download/)
            for what each file contains and how to verify a download.
          make_latest: false
          files: |
            _site/download/*.zip
            _site/download/ScubaDrift-Documentation.docx
            _release_bundles/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove published download kits and .docx bundles from the Pages artifact
        # Now that the same files are on the downloads-latest release,
        # strip them from _site before the Pages upload so they are not
        # shipped twice. Deliberately scoped to *.zip, the one standalone
        # .docx, and *-bundle.docx / *-Bundle.docx -- the same sets the
        # release-publish step above uploads, NOT the whole _site/download/
        # directory. That directory is also where Quarto renders
        # docs/download/index.qmd to index.html; an earlier
        # `rm -rf _site/download` deleted the Downloads page itself along
        # with the kits, 404-ing /download/ on the live site until that
        # fix. find with -delete on a pattern that matches nothing is a
        # no-op, so this stays safe if a kit-build or staging step above
        # failed non-fatally.
        if: env.MAINTENANCE_MODE != 'true'
        run: |
          find _site/download -maxdepth 1 -name '*.zip' -delete
          rm -f _site/download/ScubaDrift-Documentation.docx
          find _site -iname '*-bundle.docx' -delete

      - name: Publish the marketing landing page
        # The repo-root index.html (a hand-styled marketing/overview page,
        # distinct from the Quarto-rendered docs homepage this job already
        # produces at _site/index.html) previously lived only in the repo —
        # nothing copied it into the Pages artifact, so it was never actually
        # reachable on the live site. Publish it at /landing/ instead of
        # overwriting the real docs homepage. Its <img> reference to
        # assets/diagrams/*.svg is a relative path, so the SVG has to land
        # at the matching relative location under _site/landing/.
        if: env.MAINTENANCE_MODE != 'true'
        run: |
          set -euo pipefail
          mkdir -p _site/landing/assets/diagrams
          cp _repo/index.html _site/landing/index.html
          cp _repo/assets/diagrams/*.svg _site/landing/assets/diagrams/

      - name: Override site with maintenance page
        # MAINTENANCE SWITCH (see workflow-level `env.MAINTENANCE_MODE`).
        # When ON, discard the freshly rendered `_site` and replace the WHOLE
        # site with the "Under construction" placeholder. index.html and 404.html
        # are byte-identical, so GitHub Pages serves the placeholder for the site
        # root (/uiao/) AND every other URL via the catch-all 404 — nothing,
        # including /download/, is served publicly. Downloads are distributed via
        # the GitHub repo (Releases + tools/scubadrift source) instead.
        # To restore the full site: set MAINTENANCE_MODE to "false" (or delete
        # this step). Nothing else in the pipeline changes.
        if: env.MAINTENANCE_MODE == 'true'
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp _repo/.github/maintenance/index.html _site/index.html
          cp _repo/.github/maintenance/404.html _site/404.html
          echo "Maintenance mode ON — full site replaced with the Under-construction placeholder."

      - name: Upload Pages artifact
        # Deploy on push to main (normal) OR workflow_dispatch on main
        # (manual redeploy lever — needed e.g. when a CI-only fix lands
        # but the docs/** path filter blocks the implicit push deploy).
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: quarto-site-pr-${{ github.event.pull_request.number }}
          path: _site
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
