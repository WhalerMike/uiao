name: Quarto

on:
  # Render runs only on merge to main (which also deploys), plus manual
  # dispatch — deliberately NOT on pull_request, so the heavy HTML + DOCX
  # render runs once per change instead of twice. Fast pre-merge link
  # validation is still provided by link-check.yml on pull_request.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/bundle_section_docx.py'
      - '.github/workflows/quarto.yml'
  workflow_dispatch:

# Only allow one concurrent deploy per branch; cancel in-progress on new push
concurrency:
  group: quarto-${{ github.ref }}
  cancel-in-progress: false

# Pipeline shape:
#   render_html  ─┐
#                 ├─► assemble ─► deploy (main only)
#   render_docx ──┘   (merges site-html + site-docx-* into one _site)
#
# render_html is the full-site HTML render (project-aware, ~unchanged).
# render_docx is sharded across 4 runners; each shard renders a disjoint
# subset of customer-documents/*.qmd to DOCX. Each runner has its own
# .quarto cache, so there is no shared-state race (the reason single-job
# xargs parallelism was reverted in #365). assemble downloads both and
# stitches the .docx outputs into the HTML site before the Pages deploy.
#
# To change shard count, update both `matrix.shard` and `SHARD_TOTAL`
# in render_docx — GitHub Actions does not allow env vars in matrix
# declarations, so the count is duplicated.

jobs:
  render_html:
    name: Render HTML site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Quarto (resilient install)
        # Replaces quarto-dev/quarto-actions/setup@v2 with a download that
        # survives transient GitHub release-CDN 502s — the failure that skipped
        # a DOCX shard and the Pages deploy (run 27093643913). Resolves the
        # latest quarto-cli release, then installs the .deb with retries
        # (curl --retry-all-errors covers HTTP 5xx) plus an outer backoff loop.
        run: |
          set -euo pipefail
          resolve_latest() {
            curl -fsSLI -o /dev/null -w '%{url_effective}' \
              https://github.com/quarto-dev/quarto-cli/releases/latest \
              | sed 's#.*/tag/v##'
          }
          ver=""; for n in 1 2 3 4 5; do ver="$(resolve_latest || true)"; [ -n "$ver" ] && break; sleep $((n * 5)); done
          [ -n "$ver" ] || { echo "::error::could not resolve latest Quarto version"; exit 1; }
          echo "Quarto $ver"
          deb="quarto-${ver}-linux-amd64.deb"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 5 \
            -o "/tmp/${deb}" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${ver}/${deb}"
          sudo dpkg -i "/tmp/${deb}"
          quarto --version

      - name: Render HTML site
        working-directory: docs
        # Site-wide HTML render. PDF outputs are skipped (TinyTeX would inflate
        # CI runtime without current demand — see docs/customer-documents/
        # export pipeline notes). DOCX is produced by render_docx (matrix).
        run: quarto render --to html

      - name: Upload HTML site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-html
          path: docs/_site
          retention-days: 1
          if-no-files-found: error

  render_docx:
    name: Render DOCX shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Quarto (resilient install)
        # See the HTML job for rationale: retry the release download so a
        # transient CDN 502 on one shard no longer skips the whole deploy.
        run: |
          set -euo pipefail
          resolve_latest() {
            curl -fsSLI -o /dev/null -w '%{url_effective}' \
              https://github.com/quarto-dev/quarto-cli/releases/latest \
              | sed 's#.*/tag/v##'
          }
          ver=""; for n in 1 2 3 4 5; do ver="$(resolve_latest || true)"; [ -n "$ver" ] && break; sleep $((n * 5)); done
          [ -n "$ver" ] || { echo "::error::could not resolve latest Quarto version"; exit 1; }
          echo "Quarto $ver"
          deb="quarto-${ver}-linux-amd64.deb"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 5 \
            -o "/tmp/${deb}" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${ver}/${deb}"
          sudo dpkg -i "/tmp/${deb}"
          quarto --version

      - name: Render DOCX shard
        working-directory: docs
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 4
        # Deterministic round-robin sharding: sort the file list, then take
        # files where (index % SHARD_TOTAL) + 1 == SHARD_INDEX. Sorting keeps
        # shard membership stable across runs; round-robin spreads heavy
        # subtrees (e.g. adapter-specs/) evenly rather than letting one
        # shard inherit a giant directory.
        run: |
          set -euo pipefail
          # Render DOCX for the entire customer-documents tree, including
          # the canon-side reference-architecture/ subtree (moved here from
          # the former top-level /modernization/ per ADR-083 Phase 1). The
          # shard logic is path-agnostic — sorting + round-robin spreads
          # the combined file set evenly across shards.
          mapfile -t all < <(find customer-documents -name '*.qmd' | sort)
          echo "Total files: ${#all[@]}; this shard: ${SHARD_INDEX}/${SHARD_TOTAL}"
          for i in "${!all[@]}"; do
            if (( (i % SHARD_TOTAL) + 1 == SHARD_INDEX )); then
              quarto render "${all[$i]}" --to docx --no-execute-daemon
            fi
          done

      - name: Upload DOCX shard artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-docx-${{ matrix.shard }}
          # Single path keeps the artifact root predictably at
          # `docs/_site/customer-documents/` (the longest common directory
          # of all matched files). The merge step relies on this — it
          # copies _docx into _site/customer-documents/ so files land
          # beside their companion .html.
          path: docs/_site/customer-documents/**/*.docx
          retention-days: 1
          if-no-files-found: error

  assemble:
    name: Assemble combined site
    needs: [render_html, render_docx]
    runs-on: ubuntu-latest
    steps:
      - name: Download HTML site
        uses: actions/download-artifact@v8
        with:
          name: site-html
          path: _site

      - name: Download DOCX shards
        uses: actions/download-artifact@v8
        with:
          pattern: site-docx-*
          path: _docx
          merge-multiple: true

      - name: Merge DOCX outputs into site
        # _docx mirrors `docs/_site/customer-documents/` (the LCD of the
        # artifact path), so copying `_docx/.` onto `_site/customer-documents/`
        # lays each .docx beside its companion .html — including the
        # nested reference-architecture/ subtree, which is already part
        # of the customer-documents tree post-ADR-083.
        run: |
          set -euo pipefail
          if [ -d _docx ]; then
            mkdir -p _site/customer-documents
            cp -a _docx/. _site/customer-documents/
          fi
          find _site -name '*.docx' | wc -l \
            | xargs -I{} echo "Merged {} DOCX files into site"

      # Per-section .docx bundles: concatenate every page-level .docx in
      # each top-level customer-documents section into one downloadable
      # `<section>-bundle.docx` alongside the per-page renders. The
      # bundler runs from the assemble job because that's where the
      # rendered .docx files are available; doing it earlier would race
      # the render_docx matrix.
      - name: Checkout (bundler script only)
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/bundle_section_docx.py
          sparse-checkout-cone-mode: false
          path: _repo

      - name: Set up Python for bundler
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install bundler dependencies
        run: pip install --quiet python-docx docxcompose

      - name: Build per-section .docx bundles
        # Non-fatal: a section with no rendered .docx (e.g., only stubs)
        # reports a WARN and the build continues. The script returns 0
        # in --all mode regardless. Per ADR-083, the canon modernization
        # pages moved into customer-documents at reference-architecture/,
        # so they are now picked up by --all as a regular section (no
        # more --canon-modernization flag needed).
        run: |
          python _repo/scripts/bundle_section_docx.py \
              --site-root _site/customer-documents \
              --all
          find _site -maxdepth 3 -name '*-bundle.docx' \
            | wc -l \
            | xargs -I{} echo "Built {} section bundle(s)"

      - name: Upload Pages artifact
        # Deploy on push to main (normal) OR workflow_dispatch on main
        # (manual redeploy lever — needed e.g. when a CI-only fix lands
        # but the docs/** path filter blocks the implicit push deploy).
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: quarto-site-pr-${{ github.event.pull_request.number }}
          path: _site
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
