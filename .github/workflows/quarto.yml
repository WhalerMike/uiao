      - name: Upload canon DOCX artifact
        uses: actions/upload-artifact@v7
        with:
          # Name deliberately does NOT match `site-docx-*` so the assemble
          # job's `pattern: site-docx-*` merge does not pull canon docx into
          # the customer-documents tree.
          name: canon-docx
          path: docs/_site/canon/**/*.docx
