name: Quarto

on:
  # Render runs only on merge to main (which also deploys), plus manual
  # dispatch — deliberately NOT on pull_request, so the heavy HTML + DOCX
  # render runs once per change instead of twice. Fast pre-merge link
  # validation is still provided by link-check.yml on pull_request.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/bundle_section_docx.py'
      - 'scripts/build_scubadrift_download.py'
      - 'scripts/build_orgcomp_download.py'
      - 'scripts/build_day2_kit_download.py'
      - 'tools/scubadrift/**'
      - '.github/workflows/quarto.yml'
  workflow_dispatch:

# Only allow one concurrent deploy per branch; cancel in-progress on new push
concurrency:
  group: quarto-${{ github.ref }}
  cancel-in-progress: false

env:
  # MAINTENANCE SWITCH — single point of control for the public site.
  # When "true", the deploy publishes a single "Under development"
  # placeholder (`.github/maintenance/index.html` + `404.html`) instead of
  # the rendered Quarto site, so every URL under /uiao/ shows the placeholder.
  # The full render still runs (CI validation is preserved); only the
  # published `_site` is swapped — see the "Override site with maintenance
  # page" step in the `assemble` job.
  # To restore normal publishing of the real docs site: set this to "false".
  MAINTENANCE_MODE: "false"

# Pipeline shape:
#   render_html  ─┐
#                 ├─► assemble ─► deploy (main only)
#   render_docx ──┘   (merges site-html + site-docx-* into one _site)
#
# render_html is the full-site HTML render (project-aware, ~unchanged).
# render_docx is sharded across 4 runners; each shard renders a disjoint
# subset of customer-documents/*.qmd to DOCX. Each runner has its own
# .quarto cache, so there is no shared-state race (the reason single-job
# xargs parallelism was reverted in #365). assemble downloads both and
# stitches the .docx outputs into the HTML site before the Pages deploy.
#
# To change shard count, update both `matrix.shard` and `SHARD_TOTAL`
# in render_docx — GitHub Actions does not allow env vars in matrix
# declarations, so the count is duplicated.

jobs:
  render_html:
    name: Render HTML site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Quarto (resilient install)
        # Replaces quarto-dev/quarto-actions/setup@v2 with a download that
        # survives transient GitHub release-CDN 502s — the failure that skipped
        # a DOCX shard and the Pages deploy (run 27093643913). Resolves the
        # latest quarto-cli release, then installs the .deb with retries
        # (curl --retry-all-errors covers HTTP 5xx) plus an outer backoff loop.
        run: |
          set -euo pipefail
          resolve_latest() {
            curl -fsSLI -o /dev/null -w '%{url_effective}' \
              https://github.com/quarto-dev/quarto-cli/releases/latest \
              | sed 's#.*/tag/v##'
          }
          ver=""; for n in 1 2 3 4 5; do ver="$(resolve_latest || true)"; [ -n "$ver" ] && break; sleep $((n * 5)); done
          [ -n "$ver" ] || { echo "::error::could not resolve latest Quarto version"; exit 1; }
          echo "Quarto $ver"
          deb="quarto-${ver}-linux-amd64.deb"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 5 \
            -o "/tmp/${deb}" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${ver}/${deb}"
          sudo dpkg -i "/tmp/${deb}"
          quarto --version

      - name: Set up Python (SVG rasterizer)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rasterize SVG figures to PNG (ADR-093)
        # Committed SVGs are the figure sources; the sibling PNGs the docs
        # reference are untracked build artifacts (derived-binary-gate.yml
        # keeps them out of the tree). Render them here so figure references
        # resolve in the Quarto output. Scoped to figures whose PNG is NOT
        # tracked — the tracked ones are the allowlisted exceptions whose
        # SVGs cairosvg cannot render (see the helper script's header); what
        # ships for those is the committed PNG.
        run: |
          set -euo pipefail
          python -m pip install --quiet cairosvg Pillow pyyaml
          bash scripts/ci_render_untracked_figures.sh

      - name: Render HTML site
        working-directory: docs
        # Site-wide HTML render. PDF outputs are skipped (TinyTeX would inflate
        # CI runtime without current demand — see docs/customer-documents/
        # export pipeline notes). DOCX is produced by render_docx (matrix).
        run: quarto render --to html

      - name: Upload HTML site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-html
          path: docs/_site
          retention-days: 1
          if-no-files-found: error

  render_docx:
    name: Render DOCX shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Quarto (resilient install)
        # See the HTML job for rationale: retry the release download so a
        # transient CDN 502 on one shard no longer skips the whole deploy.
        run: |
          set -euo pipefail
          resolve_latest() {
            curl -fsSLI -o /dev/null -w '%{url_effective}' \
              https://github.com/quarto-dev/quarto-cli/releases/latest \
              | sed 's#.*/tag/v##'
          }
          ver=""; for n in 1 2 3 4 5; do ver="$(resolve_latest || true)"; [ -n "$ver" ] && break; sleep $((n * 5)); done
          [ -n "$ver" ] || { echo "::error::could not resolve latest Quarto version"; exit 1; }
          echo "Quarto $ver"
          deb="quarto-${ver}-linux-amd64.deb"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 5 \
            -o "/tmp/${deb}" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${ver}/${deb}"
          sudo dpkg -i "/tmp/${deb}"
          quarto --version

      - name: Set up Python (SVG rasterizer)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rasterize SVG figures to PNG (ADR-093)
        # See the HTML job: sibling PNGs are untracked build artifacts and
        # must exist before the DOCX render embeds them.
        run: |
          set -euo pipefail
          python -m pip install --quiet cairosvg Pillow pyyaml
          bash scripts/ci_render_untracked_figures.sh

      - name: Render DOCX shard
        working-directory: docs
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 4
        # Deterministic round-robin sharding: sort the file list, then take
        # files where (index % SHARD_TOTAL) + 1 == SHARD_INDEX. Sorting keeps
        # shard membership stable across runs; round-robin spreads heavy
        # subtrees (e.g. adapter-specs/) evenly rather than letting one
        # shard inherit a giant directory.
        run: |
          set -euo pipefail
          # Render DOCX for the entire customer-documents tree, including
          # the canon-side reference-architecture/ subtree (moved here from
          # the former top-level /modernization/ per ADR-083 Phase 1). The
          # shard logic is path-agnostic — sorting + round-robin spreads
          # the combined file set evenly across shards.
          mapfile -t all < <(find customer-documents -name '*.qmd' | sort)
          echo "Total files: ${#all[@]}; this shard: ${SHARD_INDEX}/${SHARD_TOTAL}"
          for i in "${!all[@]}"; do
            if (( (i % SHARD_TOTAL) + 1 == SHARD_INDEX )); then
              quarto render "${all[$i]}" --to docx --no-execute-daemon
            fi
          done

      - name: Upload DOCX shard artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-docx-${{ matrix.shard }}
          # Single path keeps the artifact root predictably at
          # `docs/_site/customer-documents/` (the longest common directory
          # of all matched files). The merge step relies on this — it
          # copies _docx into _site/customer-documents/ so files land
          # beside their companion .html.
          path: docs/_site/customer-documents/**/*.docx
          retention-days: 1
          if-no-files-found: error

  render_docx_canon:
    # Additive, parallel to render_docx: renders the canon/ section to DOCX
    # so each Canonical UIAO Specification is downloadable as its own Word
    # file and can be concatenated into canon-bundle.docx by the assemble
    # job. Kept as a separate job (not folded into the render_docx matrix)
    # so the 707-file customer-documents flow — its sharding, artifact
    # path, and merge logic — stays byte-for-byte unchanged. Canon is ~23
    # include-style wrapper pages, small enough to render unsharded.
    name: Render DOCX — canon section
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Quarto (resilient install)
        # Same resilient install as the HTML / DOCX-shard jobs.
        run: |
          set -euo pipefail
          resolve_latest() {
            curl -fsSLI -o /dev/null -w '%{url_effective}' \
              https://github.com/quarto-dev/quarto-cli/releases/latest \
              | sed 's#.*/tag/v##'
          }
          ver=""; for n in 1 2 3 4 5; do ver="$(resolve_latest || true)"; [ -n "$ver" ] && break; sleep $((n * 5)); done
          [ -n "$ver" ] || { echo "::error::could not resolve latest Quarto version"; exit 1; }
          echo "Quarto $ver"
          deb="quarto-${ver}-linux-amd64.deb"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 5 \
            -o "/tmp/${deb}" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${ver}/${deb}"
          sudo dpkg -i "/tmp/${deb}"
          quarto --version

      - name: Set up Python (SVG rasterizer)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rasterize SVG figures to PNG (ADR-093)
        # See the HTML job: sibling PNGs are untracked build artifacts and
        # must exist before the DOCX render embeds them.
        run: |
          set -euo pipefail
          python -m pip install --quiet cairosvg Pillow pyyaml
          bash scripts/ci_render_untracked_figures.sh

      - name: Render canon DOCX
        working-directory: docs
        run: |
          set -euo pipefail
          mapfile -t all < <(find canon -name '*.qmd' | sort)
          echo "Canon DOCX files: ${#all[@]}"
          for f in "${all[@]}"; do
            quarto render "$f" --to docx --no-execute-daemon
          done

      - name: Upload canon DOCX artifact
        uses: actions/upload-artifact@v7
        with:
          # Name deliberately does NOT match `site-docx-*` so the assemble
          # job's `pattern: site-docx-*` merge does not pull canon docx into
          # the customer-documents tree.
          name: canon-docx
          path: docs/_site/canon/**/*.docx
          retention-days: 1
          if-no-files-found: error

  render_docx_adr:
    # Additive, parallel to render_docx / render_docx_canon: renders the
    # adr/ section to DOCX so each ADR is downloadable as its own Word file
    # and can be concatenated into adr-bundle.docx by the assemble job.
    # Separate job (not folded into the customer-documents matrix) so that
    # flow stays byte-for-byte unchanged. ADRs are ~124 include-style
    # wrapper pages, rendered unsharded like the canon section.
    name: Render DOCX — ADR section
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Quarto (resilient install)
        # Same resilient install as the HTML / DOCX-shard jobs.
        run: |
          set -euo pipefail
          resolve_latest() {
            curl -fsSLI -o /dev/null -w '%{url_effective}' \
              https://github.com/quarto-dev/quarto-cli/releases/latest \
              | sed 's#.*/tag/v##'
          }
          ver=""; for n in 1 2 3 4 5; do ver="$(resolve_latest || true)"; [ -n "$ver" ] && break; sleep $((n * 5)); done
          [ -n "$ver" ] || { echo "::error::could not resolve latest Quarto version"; exit 1; }
          echo "Quarto $ver"
          deb="quarto-${ver}-linux-amd64.deb"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 5 \
            -o "/tmp/${deb}" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${ver}/${deb}"
          sudo dpkg -i "/tmp/${deb}"
          quarto --version

      - name: Set up Python (SVG rasterizer)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rasterize SVG figures to PNG (ADR-093)
        # See the HTML job: sibling PNGs are untracked build artifacts and
        # must exist before the DOCX render embeds them.
        run: |
          set -euo pipefail
          python -m pip install --quiet cairosvg Pillow pyyaml
          bash scripts/ci_render_untracked_figures.sh

      - name: Render ADR DOCX
        working-directory: docs
        run: |
          set -euo pipefail
          mapfile -t all < <(find adr -name '*.qmd' | sort)
          echo "ADR DOCX files: ${#all[@]}"
          for f in "${all[@]}"; do
            quarto render "$f" --to docx --no-execute-daemon
          done

      - name: Upload ADR DOCX artifact
        uses: actions/upload-artifact@v7
        with:
          # Name deliberately does NOT match `site-docx-*` so the assemble
          # job's `pattern: site-docx-*` merge does not pull ADR docx into
          # the customer-documents tree.
          name: adr-docx
          path: docs/_site/adr/**/*.docx
          retention-days: 1
          if-no-files-found: error

  render_docx_schemas:
    # Additive, parallel to the other render_docx_* jobs: renders the
    # reference/schemas/ section to DOCX so each JSON Schema reference page
    # is downloadable as its own Word file and can be concatenated into
    # schemas-bundle.docx by the assemble job. Separate job so the
    # customer-documents flow stays byte-for-byte unchanged. ~37 generated
    # wrapper pages, rendered unsharded like canon and adr.
    name: Render DOCX — schemas section
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Quarto (resilient install)
        # Same resilient install as the HTML / DOCX-shard jobs.
        run: |
          set -euo pipefail
          resolve_latest() {
            curl -fsSLI -o /dev/null -w '%{url_effective}' \
              https://github.com/quarto-dev/quarto-cli/releases/latest \
              | sed 's#.*/tag/v##'
          }
          ver=""; for n in 1 2 3 4 5; do ver="$(resolve_latest || true)"; [ -n "$ver" ] && break; sleep $((n * 5)); done
          [ -n "$ver" ] || { echo "::error::could not resolve latest Quarto version"; exit 1; }
          echo "Quarto $ver"
          deb="quarto-${ver}-linux-amd64.deb"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 5 \
            -o "/tmp/${deb}" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${ver}/${deb}"
          sudo dpkg -i "/tmp/${deb}"
          quarto --version

      - name: Set up Python (SVG rasterizer)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rasterize SVG figures to PNG (ADR-093)
        # See the HTML job: sibling PNGs are untracked build artifacts and
        # must exist before the DOCX render embeds them.
        run: |
          set -euo pipefail
          python -m pip install --quiet cairosvg Pillow pyyaml
          bash scripts/ci_render_untracked_figures.sh

      - name: Render schemas DOCX
        working-directory: docs
        run: |
          set -euo pipefail
          mapfile -t all < <(find reference/schemas -name '*.qmd' | sort)
          echo "Schema DOCX files: ${#all[@]}"
          for f in "${all[@]}"; do
            quarto render "$f" --to docx --no-execute-daemon
          done

      - name: Upload schemas DOCX artifact
        uses: actions/upload-artifact@v7
        with:
          # Name deliberately does NOT match `site-docx-*` so the assemble
          # job's `pattern: site-docx-*` merge does not pull schema docx into
          # the customer-documents tree.
          name: schemas-docx
          path: docs/_site/reference/schemas/**/*.docx
          retention-days: 1
          if-no-files-found: error

  render_docx_academy:
    # Additive, parallel to the other render_docx_* jobs: renders the
    # academy/ section to DOCX so each learner-facing module is downloadable
    # as its own Word file and can be concatenated into academy-bundle.docx
    # by the assemble job. Separate job so the customer-documents flow stays
    # byte-for-byte unchanged. ~8 authored pages, rendered unsharded.
    name: Render DOCX — academy section
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Quarto (resilient install)
        # Same resilient install as the HTML / DOCX-shard jobs.
        run: |
          set -euo pipefail
          resolve_latest() {
            curl -fsSLI -o /dev/null -w '%{url_effective}' \
              https://github.com/quarto-dev/quarto-cli/releases/latest \
              | sed 's#.*/tag/v##'
          }
          ver=""; for n in 1 2 3 4 5; do ver="$(resolve_latest || true)"; [ -n "$ver" ] && break; sleep $((n * 5)); done
          [ -n "$ver" ] || { echo "::error::could not resolve latest Quarto version"; exit 1; }
          echo "Quarto $ver"
          deb="quarto-${ver}-linux-amd64.deb"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 5 \
            -o "/tmp/${deb}" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${ver}/${deb}"
          sudo dpkg -i "/tmp/${deb}"
          quarto --version

      - name: Set up Python (SVG rasterizer)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rasterize SVG figures to PNG (ADR-093)
        # See the HTML job: sibling PNGs are untracked build artifacts and
        # must exist before the DOCX render embeds them.
        run: |
          set -euo pipefail
          python -m pip install --quiet cairosvg Pillow pyyaml
          bash scripts/ci_render_untracked_figures.sh

      - name: Render academy DOCX
        working-directory: docs
        run: |
          set -euo pipefail
          mapfile -t all < <(find academy -name '*.qmd' | sort)
          echo "Academy DOCX files: ${#all[@]}"
          for f in "${all[@]}"; do
            quarto render "$f" --to docx --no-execute-daemon
          done

      - name: Upload academy DOCX artifact
        uses: actions/upload-artifact@v7
        with:
          # Name deliberately does NOT match `site-docx-*` so the assemble
          # job's `pattern: site-docx-*` merge does not pull academy docx into
          # the customer-documents tree.
          name: academy-docx
          path: docs/_site/academy/**/*.docx
          retention-days: 1
          if-no-files-found: error

  render_docx_findings:
    # Additive, parallel to the other render_docx_* jobs: renders the
    # findings/ section to DOCX so each governance finding is downloadable
    # as its own Word file and can be concatenated into findings-bundle.docx
    # by the assemble job. Separate job so the customer-documents flow stays
    # byte-for-byte unchanged. ~14 pages, rendered unsharded.
    name: Render DOCX — findings section
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Quarto (resilient install)
        # Same resilient install as the HTML / DOCX-shard jobs.
        run: |
          set -euo pipefail
          resolve_latest() {
            curl -fsSLI -o /dev/null -w '%{url_effective}' \
              https://github.com/quarto-dev/quarto-cli/releases/latest \
              | sed 's#.*/tag/v##'
          }
          ver=""; for n in 1 2 3 4 5; do ver="$(resolve_latest || true)"; [ -n "$ver" ] && break; sleep $((n * 5)); done
          [ -n "$ver" ] || { echo "::error::could not resolve latest Quarto version"; exit 1; }
          echo "Quarto $ver"
          deb="quarto-${ver}-linux-amd64.deb"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 5 \
            -o "/tmp/${deb}" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${ver}/${deb}"
          sudo dpkg -i "/tmp/${deb}"
          quarto --version

      - name: Set up Python (SVG rasterizer)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rasterize SVG figures to PNG (ADR-093)
        # See the HTML job: sibling PNGs are untracked build artifacts and
        # must exist before the DOCX render embeds them.
        run: |
          set -euo pipefail
          python -m pip install --quiet cairosvg Pillow pyyaml
          bash scripts/ci_render_untracked_figures.sh

      - name: Render findings DOCX
        working-directory: docs
        run: |
          set -euo pipefail
          mapfile -t all < <(find findings -name '*.qmd' | sort)
          echo "Findings DOCX files: ${#all[@]}"
          for f in "${all[@]}"; do
            quarto render "$f" --to docx --no-execute-daemon
          done

      - name: Upload findings DOCX artifact
        uses: actions/upload-artifact@v7
        with:
          # Name deliberately does NOT match `site-docx-*` so the assemble
          # job's `pattern: site-docx-*` merge does not pull findings docx into
          # the customer-documents tree.
          name: findings-docx
          path: docs/_site/findings/**/*.docx
          retention-days: 1
          if-no-files-found: error

  assemble:
    name: Assemble combined site
    needs: [render_html, render_docx, render_docx_canon, render_docx_adr, render_docx_schemas, render_docx_academy, render_docx_findings]
    runs-on: ubuntu-latest
    steps:
      - name: Download HTML site
        uses: actions/download-artifact@v8
        with:
          name: site-html
          path: _site

      - name: Download DOCX shards
        uses: actions/download-artifact@v8
        with:
          pattern: site-docx-*
          path: _docx
          merge-multiple: true

      - name: Merge DOCX outputs into site
        # _docx mirrors `docs/_site/customer-documents/` (the LCD of the
        # artifact path), so copying `_docx/.` onto `_site/customer-documents/`
        # lays each .docx beside its companion .html — including the
        # nested reference-architecture/ subtree, which is already part
        # of the customer-documents tree post-ADR-083.
        run: |
          set -euo pipefail
          if [ -d _docx ]; then
            mkdir -p _site/customer-documents
            cp -a _docx/. _site/customer-documents/
          fi
          find _site -name '*.docx' | wc -l \
            | xargs -I{} echo "Merged {} DOCX files into site"

      - name: Download canon DOCX
        uses: actions/download-artifact@v8
        with:
          name: canon-docx
          path: _docx_canon

      - name: Merge canon DOCX into site
        # _docx_canon mirrors `docs/_site/canon/` (the LCD of its artifact
        # path), so copying onto `_site/canon/` lays each canon .docx beside
        # its companion .html. Independent of the customer-documents merge
        # above.
        run: |
          set -euo pipefail
          if [ -d _docx_canon ]; then
            mkdir -p _site/canon
            cp -a _docx_canon/. _site/canon/
          fi

      - name: Download ADR DOCX
        uses: actions/download-artifact@v8
        with:
          name: adr-docx
          path: _docx_adr

      - name: Merge ADR DOCX into site
        # _docx_adr mirrors `docs/_site/adr/` (the LCD of its artifact path),
        # so copying onto `_site/adr/` lays each ADR .docx beside its
        # companion .html. Independent of the merges above.
        run: |
          set -euo pipefail
          if [ -d _docx_adr ]; then
            mkdir -p _site/adr
            cp -a _docx_adr/. _site/adr/
          fi

      - name: Download schemas DOCX
        uses: actions/download-artifact@v8
        with:
          name: schemas-docx
          path: _docx_schemas

      - name: Merge schemas DOCX into site
        # _docx_schemas mirrors `docs/_site/reference/schemas/` (the LCD of
        # its artifact path), so copying onto `_site/reference/schemas/` lays
        # each schema .docx beside its companion .html. Independent of the
        # merges above.
        run: |
          set -euo pipefail
          if [ -d _docx_schemas ]; then
            mkdir -p _site/reference/schemas
            cp -a _docx_schemas/. _site/reference/schemas/
          fi

      - name: Download academy DOCX
        uses: actions/download-artifact@v8
        with:
          name: academy-docx
          path: _docx_academy

      - name: Merge academy DOCX into site
        # _docx_academy mirrors `docs/_site/academy/` (the LCD of its artifact
        # path), so copying onto `_site/academy/` lays each academy .docx
        # beside its companion .html. Independent of the merges above.
        run: |
          set -euo pipefail
          if [ -d _docx_academy ]; then
            mkdir -p _site/academy
            cp -a _docx_academy/. _site/academy/
          fi

      - name: Download findings DOCX
        uses: actions/download-artifact@v8
        with:
          name: findings-docx
          path: _docx_findings

      - name: Merge findings DOCX into site
        # _docx_findings mirrors `docs/_site/findings/` (the LCD of its
        # artifact path), so copying onto `_site/findings/` lays each finding
        # .docx beside its companion .html. Independent of the merges above.
        run: |
          set -euo pipefail
          if [ -d _docx_findings ]; then
            mkdir -p _site/findings
            cp -a _docx_findings/. _site/findings/
          fi

      # Per-section .docx bundles: concatenate every page-level .docx in
      # each top-level customer-documents section into one downloadable
      # `<section>-bundle.docx` alongside the per-page renders. The
      # bundler runs from the assemble job because that's where the
      # rendered .docx files are available; doing it earlier would race
      # the render_docx matrix.
      - name: Checkout (bundler script + maintenance page + ScubaDrift source)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/bundle_section_docx.py
            scripts/build_scubadrift_download.py
            scripts/build_orgcomp_download.py
            scripts/build_day2_kit_download.py
            tools/scubadrift
            .github/maintenance
            docs/customer-documents/orgcomp-series
            infoblox-ddi-book
          sparse-checkout-cone-mode: false
          path: _repo

      - name: Set up Python for bundler
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install bundler dependencies
        # cairosvg rasterizes the ScubaDrift figure SVGs for its .docx.
        run: pip install --quiet python-docx docxcompose cairosvg

      - name: Build per-section .docx bundles
        # Non-fatal: a section with no rendered .docx (e.g., only stubs)
        # reports a WARN and the build continues. The script returns 0
        # in --all mode regardless. Per ADR-083, the canon modernization
        # pages moved into customer-documents at reference-architecture/,
        # so they are now picked up by --all as a regular section (no
        # more --canon-modernization flag needed).
        run: |
          python _repo/scripts/bundle_section_docx.py \
              --site-root _site/customer-documents \
              --all
          # Canon section bundle: concatenate every canon page .docx into
          # _site/canon/canon-bundle.docx. Non-fatal (|| true) so a bundle
          # hiccup never blocks the site deploy, mirroring the --all posture.
          python _repo/scripts/bundle_section_docx.py \
              --site-root _site \
              --section canon \
            || echo "::warning::canon .docx bundle step failed (non-fatal)"
          # ADR section bundle: concatenate every ADR page .docx into
          # _site/adr/adr-bundle.docx. Non-fatal, same posture as canon.
          python _repo/scripts/bundle_section_docx.py \
              --site-root _site \
              --section adr \
            || echo "::warning::adr .docx bundle step failed (non-fatal)"
          # Schemas section bundle: concatenate every schema page .docx into
          # _site/reference/schemas/schemas-bundle.docx. Non-fatal, same posture.
          python _repo/scripts/bundle_section_docx.py \
              --site-root _site \
              --section reference/schemas \
            || echo "::warning::schemas .docx bundle step failed (non-fatal)"
          # Academy section bundle: concatenate every academy page .docx into
          # _site/academy/academy-bundle.docx. Non-fatal, same posture.
          python _repo/scripts/bundle_section_docx.py \
              --site-root _site \
              --section academy \
            || echo "::warning::academy .docx bundle step failed (non-fatal)"
          # Findings section bundle: concatenate every finding page .docx into
          # _site/findings/findings-bundle.docx. Non-fatal, same posture.
          python _repo/scripts/bundle_section_docx.py \
              --site-root _site \
              --section findings \
            || echo "::warning::findings .docx bundle step failed (non-fatal)"
          find _site -maxdepth 4 -name '*-bundle.docx' \
            | wc -l \
            | xargs -I{} echo "Built {} section bundle(s)"

      - name: Pack all section bundles into one downloadable zip
        # One-click "Download all DOCX bundles" for the Download page: collect
        # every <section>-bundle.docx just produced (anywhere under _site) and
        # archive them into _site/download/uiao-all-docx-bundles.zip. Paths are
        # kept relative to _site so same-named Book bundles in different sections
        # (e.g. orgpath-narrative/Book_01 vs sql-server-narrative-standalone/
        # Book_01) don't collide. Regenerated on every deploy, so the zip always
        # mirrors the current set of section bundles.
        run: |
          set -euo pipefail
          mkdir -p _site/download
          mapfile -t bundles < <(cd _site && find . -name '*-bundle.docx' | sort)
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "No section bundles found — skipping all-bundles zip."
          else
            ( cd _site && zip -q -X download/uiao-all-docx-bundles.zip "${bundles[@]}" )
            size=$(du -h _site/download/uiao-all-docx-bundles.zip | cut -f1)
            echo "Packed ${#bundles[@]} section bundle(s) into uiao-all-docx-bundles.zip ($size)"
          fi

      - name: Build ScubaDrift standalone download set
        # 2b (no committed binary): generate the ScubaDrift standalone zip + the
        # rendered ScubaDrift-Documentation.docx from committed source
        # (tools/scubadrift) into _site/download/ for the Downloads page. Skipped
        # while the site is in maintenance mode — nothing is served then, so there
        # is nothing to build. Runs only when the full site is live. Non-fatal.
        if: env.MAINTENANCE_MODE != 'true'
        run: |
          python _repo/scripts/build_scubadrift_download.py --out _site/download \
            || echo "::warning::ScubaDrift download build failed (non-fatal)"

      - name: Build Federal AAN series download kit
        # Same no-committed-binary posture as ScubaDrift. Assembles the FEDERAL kit
        # into _site/download/ on every deploy: the book .docx come from the freshly
        # rendered _site (Quarto resolved {{< meta >}} to the federal values and
        # dropped the FOUO banner — raw Pandoc would ship neither), the .pptx decks
        # and operator kits come from the sparse-checked source (_repo). The stale
        # committed OrgComp_Federal_Series_Complete_*.zip was removed; this replaces it,
        # fresh and edition-correct. Non-fatal, and skipped in maintenance mode.
        if: env.MAINTENANCE_MODE != 'true'
        run: |
          python _repo/scripts/build_orgcomp_download.py \
              --site-root _site \
              --src-root _repo \
              --out _site/download \
              --date-code "$(date -u +%Y-%m-%d)" \
            || echo "::warning::Federal AAN kit build failed (non-fatal)"

      - name: Build standalone Day-2 kit download
        # The day-2 kit as its own zip (orgcomp-day2-kit-latest.zip) — source +
        # the rendered kit .docx — so an implementation team has a stable URL
        # instead of the kit only inside the 48 MB federal bundle. Non-fatal,
        # skipped in maintenance mode.
        if: env.MAINTENANCE_MODE != 'true'
        run: |
          python _repo/scripts/build_day2_kit_download.py \
              --site-root _site \
              --src-root _repo \
              --out _site/download \
              --date-code "$(date -u +%Y-%m-%d)" \
            || echo "::warning::Day-2 kit build failed (non-fatal)"

      - name: Override site with maintenance page
        # MAINTENANCE SWITCH (see workflow-level `env.MAINTENANCE_MODE`).
        # When ON, discard the freshly rendered `_site` and replace the WHOLE
        # site with the "Under construction" placeholder. index.html and 404.html
        # are byte-identical, so GitHub Pages serves the placeholder for the site
        # root (/uiao/) AND every other URL via the catch-all 404 — nothing,
        # including /download/, is served publicly. Downloads are distributed via
        # the GitHub repo (Releases + tools/scubadrift source) instead.
        # To restore the full site: set MAINTENANCE_MODE to "false" (or delete
        # this step). Nothing else in the pipeline changes.
        if: env.MAINTENANCE_MODE == 'true'
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp _repo/.github/maintenance/index.html _site/index.html
          cp _repo/.github/maintenance/404.html _site/404.html
          echo "Maintenance mode ON — full site replaced with the Under-construction placeholder."

      - name: Upload Pages artifact
        # Deploy on push to main (normal) OR workflow_dispatch on main
        # (manual redeploy lever — needed e.g. when a CI-only fix lands
        # but the docs/** path filter blocks the implicit push deploy).
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: quarto-site-pr-${{ github.event.pull_request.number }}
          path: _site
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
