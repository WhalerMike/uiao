  render_md_orgcomp:
    # Additive, parallel to render_docx: renders the orgcomp-series section to
    # plain GitHub-Flavored Markdown (in addition to DOCX) so the series can
    # ship as an AI-friendly markdown-only download alongside the Word kit —
    # LLM context windows and AI "project" uploads take Markdown far more
    # cleanly than .docx. Scoped to orgcomp-series only (not the whole
    # customer-documents tree) — that is the only section the markdown kit
    # covers. Rendering via Quarto (not converting the rendered HTML) matters
    # because ``--to gfm`` still resolves ``{{< meta agency.* >}}`` shortcodes
    # and the profile-conditional FOUO banner the same way ``--to docx``
    # does, and produces plain content with no site-navigation chrome (gfm
    # is not a website format, so Quarto emits just the document, no navbar/
    # sidebar/TOC panel to strip afterward).
