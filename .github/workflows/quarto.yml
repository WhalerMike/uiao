name: Quarto

on:
  # Render runs only on merge to main (which also deploys), plus manual
  # dispatch — deliberately NOT on pull_request, so the heavy HTML + DOCX
  # render runs once per change instead of twice. Fast pre-merge link
  # validation is still provided by link-check.yml on pull_request.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/bundle_section_docx.py'
      - 'scripts/build_scubadrift_download.py'
      - 'scripts/build_orgcomp_download.py'
      - 'scripts/build_orgcomp_markdown_download.py'
      - 'scripts/build_day2_kit_download.py'
      - 'tools/scubadrift/**'
      - '.github/workflows/quarto.yml'
  workflow_dispatch:

# Only allow one concurrent deploy per branch; cancel in-progress on new push
concurrency:
  group: quarto-${{ github.ref }}
  cancel-in-progress: false

env:
  # MAINTENANCE SWITCH — single point of control for the public site.
  # When "true", the deploy publishes a single "Under development"
  # placeholder (`.github/maintenance/index.html` + `404.html`) instead of
  # the rendered Quarto site, so every URL under /uiao/ shows the placeholder.
  # The full render still runs (CI validation is preserved); only the
  # published `_site` is swapped — see the "Override site with maintenance
  # page" step in the `assemble` job.
  # To restore normal publishing of the real docs site: set this to "false".
  MAINTENANCE_MODE: "false"

  # QUARTO VERSION PIN — this workflow used to resolve "latest" at run time.
  # That made the published site a function of whatever upstream released that
  # morning: a Quarto change could alter the render, or break the deploy,
  # with no commit in this repo and nothing to bisect. The render runs only on
  # push to main (see `on:` above) and is not a pull-request gate, so such a
  # break lands unattended — which is exactly how the 2026-08-21 outage went
  # five days unnoticed.
  #
  # 1.10.18 is the version this corpus is known to render green.
  # To upgrade: bump this, run the workflow via workflow_dispatch on a branch,
  # and merge only once that render is green.
  QUARTO_VERSION: "1.10.18"

# Pipeline shape:
#   render_html  ─┐
#                 ├─► assemble ─► deploy (main only)
#   render_docx ──┘   (merges site-html + site-docx-* into one _site)
#
# render_html is the full-site HTML render (project-aware, ~unchanged).
# render_docx is sharded across 4 runners; each shard renders a disjoint
# subset of customer-documents/*.qmd to DOCX. Each runner has its own
# .quarto cache, so there is no shared-state race (the reason single-job
# xargs parallelism was reverted in #365). assemble downloads both and
# stitches the .docx outputs into the HTML site before the Pages deploy.
#
# To change shard count, update both `matrix.shard` and `SHARD_TOTAL`
# in render_docx — GitHub Actions does not allow env vars in matrix
# declarations, so the count is duplicated.

jobs:
  render_html:
    name: Render HTML site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Quarto (pinned, resilient install)
        # Version is pinned via QUARTO_VERSION at the top of this file — see the
        # rationale there. Downloads with retries so a transient release-CDN 502
        # does not skip a shard and the deploy (the failure in run 27093643913).
        run: |
          set -euo pipefail
          deb="quarto-${QUARTO_VERSION}-linux-amd64.deb"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 5 \
            -o "/tmp/${deb}" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/${deb}"
          sudo dpkg -i "/tmp/${deb}"
          installed="$(quarto --version)"
          echo "Quarto ${installed}"
          [ "${installed}" = "${QUARTO_VERSION}" ] || {
            echo "::error::Quarto version mismatch — pinned ${QUARTO_VERSION}, got ${installed}"
            exit 1
          }

      - name: Set up Python (SVG rasterizer)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rasterize SVG figures to PNG (ADR-093)
        # Committed SVGs are the figure sources; the sibling PNGs the docs
        # reference are untracked build artifacts (derived-binary-gate.yml
        # keeps them out of the tree). Render them here so figure references
        # resolve in the Quarto output. Scoped to figures whose PNG is NOT
        # tracked — the tracked ones are the allowlisted exceptions whose
        # SVGs cairosvg cannot render (see the helper script's header); what
        # ships for those is the committed PNG.
        run: |
          set -euo pipefail
          # `jupyter` is defensive, not decorative. The full-site HTML render
          # and DOCX shard 4 — and only those two — have died mid-run on:
          #   "Starting python3 kernel... Broken pipe (os error 32)"
          #   "Jupyter is not available in this Python installation."
          # (runs 32593369617 on 2026-08-22, 32869453758 on 2026-08-25; both
          # predate the change that surfaced them, and both killed the Pages
          # deploy and the customer-document .docx bundles with them.)
          #
          # The trigger is not understood. No document under docs/ carries an
          # executable cell — no ```{python}/{r}/{julia}/{ojs} fence, no
          # `engine:`/`jupyter:` key, no .ipynb, no {{< embed >}} — so on
          # content alone nothing should ever request a kernel. python3 also
          # works earlier in the very same job (the SVG rasterizer step runs
          # it for ~3 min), and the failure lands ~20-25 min in, on the two
          # longest, widest-scope jobs, while every narrower section render
          # passes. That shape is as consistent with runner resource pressure
          # as with a real kernel request.
          #
          # So this is a cheap guard, not a root-cause fix: installing jupyter
          # costs seconds and lets the render survive a kernel request whatever
          # provokes one. If the render still dies here, the cause is NOT a
          # missing dependency and the next step is runner diagnostics (memory
          # and disk during the render step), not more packages. Carried only
          # by the two job types that actually fail; section renders stay lean.
          python -m pip install --quiet cairosvg Pillow pyyaml jupyter
          bash scripts/ci_render_untracked_figures.sh

      - name: Render HTML site
        working-directory: docs
        # Site-wide HTML render. PDF outputs are skipped (TinyTeX would inflate
        # CI runtime without current demand — see docs/customer-documents/
        # export pipeline notes). DOCX is produced by render_docx (matrix).
        run: quarto render --to html

      - name: Upload HTML site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-html
          path: docs/_site
          retention-days: 1
          if-no-files-found: error

  render_docx:
    name: Render DOCX shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Quarto (pinned, resilient install)
        # Version is pinned via QUARTO_VERSION at the top of this file — see the
        # rationale there. Downloads with retries so a transient release-CDN 502
        # does not skip a shard and the deploy (the failure in run 27093643913).
        run: |
          set -euo pipefail
          deb="quarto-${QUARTO_VERSION}-linux-amd64.deb"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 5 \
            -o "/tmp/${deb}" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/${deb}"
          sudo dpkg -i "/tmp/${deb}"
          installed="$(quarto --version)"
          echo "Quarto ${installed}"
          [ "${installed}" = "${QUARTO_VERSION}" ] || {
            echo "::error::Quarto version mismatch — pinned ${QUARTO_VERSION}, got ${installed}"
            exit 1
          }

      - name: Set up Python (SVG rasterizer)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rasterize SVG figures to PNG (ADR-093)
        # See the HTML job: sibling PNGs are untracked build artifacts and
        # must exist before the DOCX render embeds them.
        run: |
          set -euo pipefail
          # `jupyter` is defensive, not decorative. The full-site HTML render
          # and DOCX shard 4 — and only those two — have died mid-run on:
          #   "Starting python3 kernel... Broken pipe (os error 32)"
          #   "Jupyter is not available in this Python installation."
          # (runs 32593369617 on 2026-08-22, 32869453758 on 2026-08-25; both
          # predate the change that surfaced them, and both killed the Pages
          # deploy and the customer-document .docx bundles with them.)
          #
          # The trigger is not understood. No document under docs/ carries an
          # executable cell — no ```{python}/{r}/{julia}/{ojs} fence, no
          # `engine:`/`jupyter:` key, no .ipynb, no {{< embed >}} — so on
          # content alone nothing should ever request a kernel. python3 also
          # works earlier in the very same job (the SVG rasterizer step runs
          # it for ~3 min), and the failure lands ~20-25 min in, on the two
          # longest, widest-scope jobs, while every narrower section render
          # passes. That shape is as consistent with runner resource pressure
          # as with a real kernel request.
          #
          # So this is a cheap guard, not a root-cause fix: installing jupyter
          # costs seconds and lets the render survive a kernel request whatever
          # provokes one. If the render still dies here, the cause is NOT a
          # missing dependency and the next step is runner diagnostics (memory
          # and disk during the render step), not more packages. Carried only
          # by the two job types that actually fail; section renders stay lean.
          python -m pip install --quiet cairosvg Pillow pyyaml jupyter
          bash scripts/ci_render_untracked_figures.sh

      - name: Render DOCX shard
        working-directory: docs
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 4
        # Deterministic round-robin sharding: sort the file list, then take
        # files where (index % SHARD_TOTAL) + 1 == SHARD_INDEX. Sorting keeps
        # shard membership stable across runs; round-robin spreads heavy
        # subtrees (e.g. adapter-specs/) evenly rather than letting one
        # shard inherit a giant directory.
        run: |
          set -euo pipefail
          # Render DOCX for the entire customer-documents tree, including
          # the canon-side reference-architecture/ subtree (moved here from
          # the former top-level /modernization/ per ADR-083 Phase 1). The
          # shard logic is path-agnostic — sorting + round-robin spreads
          # the combined file set evenly across shards.
          mapfile -t all < <(find customer-documents -name '*.qmd' | sort)
          echo "Total files: ${#all[@]}; this shard: ${SHARD_INDEX}/${SHARD_TOTAL}"
          for i in "${!all[@]}"; do
            if (( (i % SHARD_TOTAL) + 1 == SHARD_INDEX )); then
              quarto render "${all[$i]}" --to docx --no-execute-daemon
            fi
          done

      - name: Upload DOCX shard artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-docx-${{ matrix.shard }}
          # Single path keeps the artifact root predictably at
          # `docs/_site/customer-documents/` (the longest common directory
          # of all matched files). The merge step relies on this — it
          # copies _docx into _site/customer-documents/ so files land
          # beside their companion .html.
          path: docs/_site/customer-documents/**/*.docx
          retention-days: 1
          if-no-files-found: error

  render_docx_canon:
    # Additive, parallel to render_docx: renders the canon/ section to DOCX
    # so each Canonical UIAO Specification is downloadable as its own Word
    # file and can be concatenated into canon-bundle.docx by the assemble
    # job. Kept as a separate job (not folded into the render_docx matrix)
    # so the 707-file customer-documents flow — its sharding, artifact
