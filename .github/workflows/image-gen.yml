name: Image generation pipeline

# Image pipeline workflow with three trigger modes:
#
# Figures are committed SVG, rasterized to PNG deterministically — ADR-093.
# (The Gemini "NanoBanana" raster generator was retired; no API key required.)
#
#   1. Manual render      (workflow_dispatch) — run scripts/render_svg_images.py
#      to rasterize committed *.svg -> PNG. Optional opt-in commit-back of PNGs +
#      sidecars + registry updates via Git LFS.
#
#   2. Auto dry-run       (push)              — on any push that touches a
#      committed .svg, IMAGE-PROMPTS.md, prompts.json, or the canonical image
#      registry, re-scan and rebuild the manifest. Never renders. Never costs
#      anything. Surfaces drift + missing canon refs as CI signal.
#
#   3. PR dry-run         (pull_request)      — same as #2 for PR review
#      visibility: reviewers see what placeholders the PR introduces
#      without paying for generation.
#
# Pipeline context and operator runbook:
#   https://whalermike.github.io/uiao/academy/document-generation-guide.html
#   https://whalermike.github.io/uiao/academy/image-pipeline-guide.html
#
# Run the manual dispatch from the GitHub Actions UI:
#   https://github.com/WhalerMike/uiao/actions/workflows/image-gen.yml

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (list SVGs that would render; no commit-back)"
        required: false
        default: false
        type: boolean
      commit_back:
        description: "Commit generated PNGs + sidecars + registry updates back to this ref (LFS)"
        required: false
        default: false
        type: boolean

  push:
    paths:
      - "**/*.svg"
      - "**/IMAGE-PROMPTS.md"
      - "docs/prompts.json"
      - "src/uiao/canon/image-registry.yaml"
      - "scripts/generate_images.py"
      - "scripts/render_svg_images.py"
      - ".github/workflows/image-gen.yml"

  pull_request:
    paths:
      - "**/*.svg"
      - "**/IMAGE-PROMPTS.md"
      - "docs/prompts.json"
      - "src/uiao/canon/image-registry.yaml"
      - "scripts/generate_images.py"
      - "scripts/render_svg_images.py"
      - ".github/workflows/image-gen.yml"

# Serialize real generation runs so two concurrent commit-back dispatches
# cannot step on each other (LFS push race). Dry-run triggers fall into
# the same group but are cheap, so cancellation is safe.
concurrency:
  group: image-gen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    # Auto triggers never call Gemini. Pure scan + manifest rebuild.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Scan placeholders + rebuild manifest (no API calls)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # so we can post a PR summary comment
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Scan + rebuild manifest
        run: python scripts/generate_images.py --dry-run --scan-only

      - name: Upload manifest as PR artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: image-manifest-pr-${{ github.event.pull_request.number }}
          path: docs/images/.image-manifest.json
          retention-days: 14

      - name: Summary
        run: |
          echo "### Image pipeline dry-run" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Gemini calls made. Manifest rebuilt from on-disk state.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f docs/images/.image-manifest.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python -c "import json,sys; m=json.load(open('docs/images/.image-manifest.json')); print(json.dumps(m.get('stats', {}), indent=2))" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  generate:
    # Manual dispatch path — rasterizes committed SVG figures to PNG (ADR-093).
    # No AI / no API key: deterministic SVG -> PNG via cairosvg.
    if: github.event_name == 'workflow_dispatch'
    name: Render committed SVG figures to PNG
    runs-on: ubuntu-latest
    # Writeable by default so commit-back can push. Manual dispatch is
    # gated by repo permissions; non-maintainers can't trigger this.
    # actions: write is required for the post-commit-back step that
    # dispatches quarto.yml — GITHUB_TOKEN-authored pushes do not trigger
    # downstream workflows by GitHub Actions design, so the dispatch is
    # explicit.
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # LFS fetch + write requires the token be carried on git operations.
          # actions/checkout wires this via its persisted credential.
          lfs: true
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # cairosvg = SVG -> PNG rasterizer; cairosvg needs libcairo at runtime.
          sudo apt-get update && sudo apt-get install -y libcairo2
          pip install cairosvg Pillow pyyaml

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Render committed SVG figures to PNG (ADR-093)
        # Deterministic SVG -> PNG. No API key. Walks committed *.svg, writes
        # sibling PNG + sidecar (generator=claude-svg-v1). Cache skips unchanged.
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/render_svg_images.py --dry-run
          else
            python scripts/render_svg_images.py
          fi

      - name: Rebuild image manifest (placeholder/canon scan)
        # Keeps docs/images/.image-manifest.json current for replace_placeholders.py.
        if: ${{ ! inputs.dry_run }}
        run: python scripts/generate_images.py --dry-run --scan-only

      - name: Replace placeholders with Quarto figure refs in .qmd / .md
        # Swap [IMAGE-NN: ...] placeholders for full Quarto figure syntax:
        # ![cap](path){#fig-id fig-alt="..." width="..."}.
        if: ${{ ! inputs.dry_run }}
        run: python scripts/replace_placeholders.py

      - name: Upload images as workflow artifact
        if: ${{ ! inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: generated-images-run-${{ github.run_number }}
          # Capture BOTH legacy global location and doc-local locations.
          # Most pipeline output goes to docs/customer-documents/<series>/images/
          # (one images/ folder per source doc); a smaller set goes to docs/images/.
          path: |
            docs/images/
            docs/customer-documents/**/images/
          retention-days: 30
          if-no-files-found: warn

      - name: Commit-back (LFS push)
        # Only runs when the operator opted in AND we actually generated
        # something. Commits PNG + .png.json + .image-manifest.json +
        # any used_by updates in image-registry.yaml.
        id: commit_back
        if: ${{ ! inputs.dry_run && inputs.commit_back }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage LFS-scoped binaries, sidecars, registry, and any .qmd/.md
          # files modified by replace_placeholders.py (placeholder swap-outs
          # in scanned doc sources). The manifest is gitignored (rebuilt on
          # every run; not source).
          #
          # IMPORTANT: pathspecs are added one-at-a-time. `git add A B C`
          # aborts the entire operation on the first pathspec that matches
          # nothing — historically that left the staged set empty even when
          # PNGs were generated (run 25744508863 was the first to surface this).
          # Per-pathspec invocation with `|| true` isolates each failure.
          #
          # Image pathspecs intentionally pair a `docs/**/images/*.png` glob
          # (any doc-local images/ folder anywhere under docs/, e.g.
          # docs/customer-documents/reference-architecture/images/, docs/academy/images/, …) with a
          # `docs/images/**/*.png` glob (the legacy canonical/global tree
          # rooted at docs/images/). Earlier revisions only listed
          # docs/customer-documents/**/images/*.png + docs/images/**/*.png,
          # which silently dropped PNGs generated for any other docs/ section
          # — run 189 (modernization landing page, three figures) was the
          # first to surface the gap. The broader docs/**/images/*.png pattern
          # is a strict superset of customer-documents/**.
          for pathspec in \
            "docs/**/images/*.png" \
            "docs/**/images/*.png.json" \
            "docs/images/**/*.png" \
            "docs/images/**/*.png.json" \
            "docs/**/*.qmd" \
            "docs/**/*.md" \
            "src/uiao/canon/specs/**/*.md" \
            "src/uiao/canon/adr/**/*.md" \
            "src/uiao/canon/image-registry.yaml"; do
            git add "$pathspec" 2>/dev/null || true
          done

          if git diff --cached --quiet; then
            echo "No changes to commit. Pipeline produced no new or modified image artifacts."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git commit \
            -m "chore(images): automated commit-back from image-gen run ${{ github.run_number }}" \
            -m "Regenerated images, sidecars, manifest, and rewrote [IMAGE-NN:] placeholders into Quarto figure syntax in their host .qmd / .md files. Registry used_by updates (if any) reflect canon-ref placeholders that appeared since the last run. No API keys or secrets in this commit." \
            -m "$RUN_URL"

          # Push via LFS so binaries land in LFS storage.
          git push origin "HEAD:${{ github.ref }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch Quarto render+deploy
        # GitHub Actions deliberately does NOT trigger downstream workflows
        # from commits authored by GITHUB_TOKEN — a loop-prevention safeguard.
        # That means the commit-back step's push to main, which mutates
        # docs/**, never wakes quarto.yml on its own, so the site keeps
        # serving the pre-image-gen render. This step closes the loop with an
        # explicit workflow_dispatch. Only fires on main pushes that actually
        # produced a commit; quarto.yml's deploy job is gated on
        # workflow_dispatch from main and will redeploy Pages.
        if: ${{ ! inputs.dry_run && inputs.commit_back && steps.commit_back.outputs.pushed == 'true' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run quarto.yml --ref main

      - name: Summary
        if: ${{ ! inputs.dry_run }}
        run: |
          echo "### Image generation complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: **generated-images-run-${{ github.run_number }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.commit_back }}" = "true" ]; then
            echo "Commit-back: **enabled** — binaries pushed to \`${{ github.ref_name }}\` via LFS." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Commit-back: **disabled** (artifact retention 30d)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
