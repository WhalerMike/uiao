name: ADR Reference Integrity

# Three guards, one script.
#
# 1. Fails when any ADR-NNN reference in canon, docs, or the root agent files has
#    no matching src/uiao/canon/adr/adr-NNN-*.md — a typo or a hallucinated
#    decision record. Tests don't cover prose, so this is the gate that keeps a
#    confident-but-wrong canon citation from merging silently.
# 2. Fails when a full adr-NNN-slug.ext filename cited anywhere in those files
#    does not match a real ADR filename. Guard 1 only asserts the number, which
#    survives a renumbering while the slug does not — so a citation left pointing
#    at adr-047-fedramp-20x-integration.md passed guard 1 for months even though
#    that decision is ADR-106 and ADR-047 is Continuous Monitoring Program.
# 3. Fails when the ADR relationship graph (supersedes / superseded_by / amends
#    frontmatter) has an edge that doesn't resolve, names itself, or is recorded
#    from one end only. Presence gaps are advisory until the backfill completes
#    (issue #1427).
#
# Both resolve cleanly today, so this guards against regressions only.
#
# To resolve a failing run: fix the reference, add the missing ADR, record the
# missing inverse edge, or — for an intended placeholder — append
# 'adr-ref-allow' to the line. Run locally:
#     python scripts/check_adr_references.py

# Always runs on PRs (no path filter) so the required check always reports;
# the guard scans a fixed canon/docs file set in seconds.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/uiao/canon/adr/**'
      - 'src/uiao/canon/**/*.md'
      - 'docs/**/*.md'
      - 'docs/**/*.qmd'
      - 'AGENTS.md'
      - 'AGENTS-public-surface.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      # CHANGELOG.md was outside this filter until the filename guard landed,
      # which is exactly why its v0.6.0 entry cited a deleted ADR-058 file.
      - 'CHANGELOG.md'
      - 'scripts/check_adr_references.py'
      - 'tests/test_adr_relationship_graph.py'

jobs:
  adr-reference-integrity:
    name: Check ADR references resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run ADR-reference + filename + relationship guards
        run: python scripts/check_adr_references.py
