name: AAN Authorities Drift

# Each Federal AAN book's "Authorities Closed Here" table is GENERATED from the
# single compliance spine (docs/customer-documents/orgcomp-series/orgcomp-compliance-spine.yml)
# by render_authorities_table.py. This gate fails when a committed per-book
# partial diverges from what the spine now produces — the same regen-and-diff
# pattern the repo uses for other derived tables.
#
# It closes the silent-drift gap called out in the AAN series constructive
# critique (Concern 4): before this gate, the authorities partials could — and
# did — fall out of sync with the spine SSOT (stale KSI theme codes) with no
# check to catch it.
#
# To resolve a failing run, regenerate the partials from the spine:
#     cd "docs/customer-documents/orgcomp-series"
#     python render_authorities_table.py --emit-dir authorities

on:
  pull_request:
    paths:
      - 'docs/customer-documents/orgcomp-series/orgcomp-compliance-spine.yml'
      - 'docs/customer-documents/orgcomp-series/**'
      - 'docs/customer-documents/orgcomp-series/authorities/**'
      - 'docs/customer-documents/orgcomp-series/render_authorities_table.py'
      - 'docs/customer-documents/orgcomp-series/render_cr26_reconciliation.py'
      - 'docs/customer-documents/orgcomp-series/validate_day2_control_maps.py'
      - 'docs/customer-documents/orgcomp-series/servicenow-day2/**'
      - 'docs/customer-documents/orgcomp-series/OrgComp_CR26_Reconciliation.md'
      - 'docs/customer-documents/orgcomp-series/render_claim_evidence_test.py'
      - 'docs/customer-documents/orgcomp-series/OrgComp_Claim_Evidence_Test_Matrix.md'
      - 'docs/customer-documents/orgcomp-series/render_crosswalk.py'
      - 'docs/customer-documents/orgcomp-series/OrgComp_Spine_Crosswalk.md'
      - 'docs/customer-documents/orgcomp-series/check_crosswalk_superset.py'
      - 'docs/customer-documents/orgcomp-series/check_control_closed_counts.py'
      - 'docs/customer-documents/orgcomp-series/check_vendor_authorization_sources.py'
      - 'docs/customer-documents/orgcomp-series/check_prose_counts.py'
      - 'docs/customer-documents/orgcomp-series/render_book_catalog.py'
      - 'docs/customer-documents/orgcomp-series/Vol_IX_Book_05_OrgComp_SaaS_Integration_Governance.qmd'
      - 'docs/customer-documents/orgcomp-series/Vol_0_Book_00_OrgComp_Executive_Summary.qmd'
      - 'docs/customer-documents/orgcomp-series/Vol_0_Book_00a_OrgComp_Executive_Brief.qmd'
      - 'docs/customer-documents/orgcomp-series/Vol_0_Book_02_OrgComp_Control_Crosswalk.qmd'
      - 'src/uiao/ksi/rules/**'
      - 'src/uiao/canon/compliance/reference/fedramp-cr26/**'
      - '.github/workflows/orgcomp-authorities-drift.yml'
  push:
    branches: [main]
    paths:
      - 'docs/customer-documents/orgcomp-series/orgcomp-compliance-spine.yml'
      - 'docs/customer-documents/orgcomp-series/**'
      - 'docs/customer-documents/orgcomp-series/authorities/**'
      - 'docs/customer-documents/orgcomp-series/render_authorities_table.py'
      - 'docs/customer-documents/orgcomp-series/render_cr26_reconciliation.py'
      - 'docs/customer-documents/orgcomp-series/validate_day2_control_maps.py'
      - 'docs/customer-documents/orgcomp-series/servicenow-day2/**'
      - 'docs/customer-documents/orgcomp-series/OrgComp_CR26_Reconciliation.md'
      - 'docs/customer-documents/orgcomp-series/render_claim_evidence_test.py'
      - 'docs/customer-documents/orgcomp-series/OrgComp_Claim_Evidence_Test_Matrix.md'
      - 'docs/customer-documents/orgcomp-series/render_crosswalk.py'
      - 'docs/customer-documents/orgcomp-series/OrgComp_Spine_Crosswalk.md'
      - 'src/uiao/ksi/rules/**'
      - 'src/uiao/canon/compliance/reference/fedramp-cr26/**'
      - '.github/workflows/orgcomp-authorities-drift.yml'

jobs:
  orgcomp-authorities-drift:
    name: Check AAN authorities tables against the compliance spine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run authorities-table drift gate
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python render_authorities_table.py --check authorities

      - name: Run inline authorities control->KSI drift gate
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python render_authorities_table.py --check-inline

  aan-cr26-reconciliation-drift:
    name: Check AAN CR26 reconciliation against the rules and CR26 catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run CR26 reconciliation drift gate
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python render_cr26_reconciliation.py --check

  aan-day2-control-maps:
    name: Validate AAN Day-2 control maps against the spine + CR26 catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate day-2 control maps
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python validate_day2_control_maps.py
      - name: Run day-2 actuator coverage gate
        working-directory: 'docs/customer-documents/orgcomp-series/servicenow-day2'
        run: python check_actuator_coverage.py
      - name: Run Lane C catalog contract check
        working-directory: 'docs/customer-documents/orgcomp-series/servicenow-day2/catalog'
        run: python contract_check.py

  aan-claim-evidence-test:
    name: Check AAN claim-evidence-test matrix against the spine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run claim-evidence-test matrix drift gate
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python render_claim_evidence_test.py --check

  aan-crosswalk-drift:
    name: Check AAN spine-derived crosswalk against the compliance spine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run spine-derived crosswalk drift gate
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python render_crosswalk.py --check
      - name: Run crosswalk/designation superset gate
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python check_crosswalk_superset.py
      - name: "Run 'Controls closed: N' enumeration gate"
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python check_control_closed_counts.py
      - name: Run vendor-authorization source gate
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python check_vendor_authorization_sources.py

      # Book 06's catalog tables project the Lane F control map; generated, not typed.
      - name: Run Book 06 catalog drift gate
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python render_book_catalog.py --check

      # The generated tables are gated; the books' hand-written prose quotes the
      # same spine counts and was not. See check_prose_counts.py.
      - name: Run prose spine-count drift gate
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python check_prose_counts.py --strict

      # ---- Content-correctness gate suite ----
      # These also run as pre-commit hooks; wired here so CI enforces them for
      # contributors without pre-commit and for direct pushes. (The explicit
      # steps were dropped from #1180 in a CRLF re-commit; restored here.)
      - name: Install content-gate deps (docx/pptx readers)
        run: pip install python-docx python-pptx

      - name: Federal-deadline claims vs authority registry
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python check_authority_deadlines.py

      - name: Control ids/titles vs NIST Rev 5 catalog
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python check_control_citations.py

      - name: CR26 indicator ids + 29/46 conflation
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python check_cr26_indicators.py

      - name: Scope ratchet (no new FedRAMP-High) + crossref integrity
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python check_series_rules.py

      - name: Engine neutrality (no UIAO in the published corpus; ratchet)
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python check_engine_neutrality.py

      - name: Tracked-derivative Date Codes
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python check_derivative_freshness.py

      - name: Implementation-coverage matrix drift
        working-directory: 'docs/customer-documents/orgcomp-series'
        run: python render_impl_coverage.py --check
