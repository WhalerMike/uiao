name: Identity Governance Gate

on:
  schedule:
    # Run nightly at 02:00 UTC — after HRIT extract is expected to land
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      hrit_path:
        description: "Path to current HRIT snapshot JSON"
        required: false
        default: "evidence/identity/hrit-current.json"
      services_path:
        description: "Path to service identity snapshot JSON"
        required: false
        default: "evidence/identity/services-current.json"

# Prevent concurrent governance runs — each run must complete before the next.
concurrency:
  group: identity-governance-gate
  cancel-in-progress: false

jobs:
  governance-gate:
    name: Identity Governance Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Write permission for uploading evidence artifacts as a release asset
      # or committing the gate-report.json back to the evidence branch.
      # Uncomment when an evidence-persistence workflow is wired up.
      # contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uiao
        run: pip install -e ".[directory]" --quiet

      - name: Run identity governance pipeline
        id: pipeline
        # The pipeline reads fixture JSON when live HRIT/service snapshots
        # are not available.  In production (workflow_dispatch), replace
        # --hrit and --services with paths to the actual extracts from your
        # HRIT system and service identity catalog.
        #
        # The nightly *schedule* has no live HRIT extract, so it falls back
        # to demonstration fixtures that intentionally contain orphaned
        # accounts (E002 is Terminated yet owns two service principals).
        # Those P1 findings prove detection works and are uploaded as
        # evidence, but they must NOT fail the scheduled job — otherwise
        # main is perpetually red on demonstration data.  We therefore pass
        # --no-fail on schedule.  Operator runs via workflow_dispatch against
        # real snapshots keep the hard gate so genuine P1 findings fail
        # visibly.
        #
        # Exit code semantics:
        #   0 — gate passed (no P1 findings, or --no-fail)
        #   1 — gate failed (P1 findings present; job fails visibly)
        #   2 — configuration error (missing input files)
        env:
          # UTF-8 so rich's "→" summary line does not crash on non-UTF8 locales
          PYTHONIOENCODING: "utf-8"
          NO_FAIL: ${{ github.event_name == 'schedule' && '--no-fail' || '' }}
        run: |
          uiao identity run \
            --hrit "${{ github.event.inputs.hrit_path || 'tests/fixtures/hrit/hrit-sample.json' }}" \
            --services "${{ github.event.inputs.services_path || 'tests/fixtures/identity/services-sample.json' }}" \
            --out evidence/identity/ \
            $NO_FAIL
        # Allow step to produce its exit code without masking it
        continue-on-error: false

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: identity-governance-evidence-${{ github.run_number }}
          path: evidence/identity/
          retention-days: 90
          if-no-files-found: warn

      - name: Gate check — fail job on P1 findings
        # Explicit second gate step so the job failure message is unambiguous
        # in the GitHub Actions summary.  The pipeline step already exits 1
        # on P1; this step reinforces the message.
        #
        # Skipped on the nightly schedule, which runs against demonstration
        # fixtures whose intentional P1 findings would always fail the gate.
        # The real gate runs on workflow_dispatch against live snapshots.
        if: github.event_name != 'schedule'
        run: |
          uiao identity gate --evidence evidence/identity/
