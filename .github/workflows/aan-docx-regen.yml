# Regenerates the Federal AAN series .docx derivatives whenever the books'
# Quarto/markdown sources change on a working branch. The .qmd/.md files are
# the source of truth; the .docx are build artifacts (same doctrine as ADR-093
# SVG-to-PNG). Never runs on main: derived files arrive on main only via
# reviewed PRs from working branches.
#
# NOTE — the complete-series ZIP is intentionally NOT built here. The single
# canonical kit is the datecoded AAN_Federal_Series_Complete_<DATE>ET.zip, a
# full distribution bundle (docx + .pptx briefing decks + governance docx). The
# .pptx decks are rendered on Windows via PowerPoint COM and cannot be produced
# on this Linux runner, so the kit is assembled locally per the authoring spec
# (Federal_AAN_Series_Authoring_Spec.md §1: Date Code in filename, one per
# location, delete previous). This job only refreshes the .docx it consumes.
name: AAN docx regen

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - "inbox/Application Aware Networking/*.qmd"
      - "inbox/Application Aware Networking/federal-aan-conmon-gap-roadmap.md"
      - ".github/workflows/aan-docx-regen.yml"

permissions:
  contents: write

concurrency:
  group: aan-docx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Quarto (resilient install)
        # Same resilient installer as quarto.yml — survives release-CDN 502s.
        run: |
          set -euo pipefail
          resolve_latest() {
            curl -fsSLI -o /dev/null -w '%{url_effective}' \
              https://github.com/quarto-dev/quarto-cli/releases/latest \
              | sed 's#.*/tag/v##'
          }
          ver=""; for n in 1 2 3 4 5; do ver="$(resolve_latest || true)"; [ -n "$ver" ] && break; sleep $((n * 5)); done
          [ -n "$ver" ] || { echo "::error::could not resolve latest Quarto version"; exit 1; }
          echo "Quarto $ver"
          deb="quarto-${ver}-linux-amd64.deb"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 5 \
            -o "/tmp/${deb}" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${ver}/${deb}"
          sudo dpkg -i "/tmp/${deb}"
          quarto --version

      - name: Render series to docx
        working-directory: inbox/Application Aware Networking
        run: |
          set -euo pipefail
          fail=0
          for f in Book_*.qmd federal-aan-conmon-gap-roadmap.md; do
            echo "::group::render $f"
            if ! quarto render "$f" --to docx --no-execute-daemon; then
              echo "::error::render failed: $f"; fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"

      - name: Commit regenerated derivatives
        run: |
          set -euo pipefail
          git add "inbox/Application Aware Networking"/*.docx
          if git diff --cached --quiet; then
            echo "derivatives already current — nothing to commit"
            exit 0
          fi
          git -c user.name="Claude" -c user.email="noreply@anthropic.com" \
            commit -m "docs: inbox/AAN — regenerate docx derivatives [aan-docx-regen]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
