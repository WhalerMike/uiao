name: Infoblox DDI Book Checks

# Book-scoped CI for infoblox-ddi-book/ — validates the volume's own IaC and
# scripts, which the repo's other CI does not cover (see
# infoblox-ddi-book/REVIEW-AND-IMPROVEMENTS.md §2.1). Only runs when the book
# changes. Two tiers:
#   * BLOCKING  — bash -n, node --check, the catalog↔module contract check, and
#     `terraform validate` of the five hardened per-platform MODULES.
#   * ADVISORY  — shellcheck, tflint, and `terraform fmt` + example-module
#     validate start non-blocking (continue-on-error) while those remain starter
#     skeletons; promote as each hardens (REVIEW §2.2/§2.3).
on:
  pull_request:
    paths:
      - 'infoblox-ddi-book/**'
      - '.github/workflows/infoblox-ddi-book-checks.yml'
  push:
    branches: [main]
    paths:
      - 'infoblox-ddi-book/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: Shell + JS static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # BLOCKING — every *.sh must parse (this caught the stray </content>
      # tags that had corrupted the gcp-lz-automation scripts).
      - name: bash -n (syntax) — blocking
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if bash -n "$f"; then echo "ok   $f"; else echo "FAIL $f"; fail=1; fi
          done < <(find infoblox-ddi-book -name '*.sh' | sort)
          exit $fail

      # BLOCKING — Script Includes must parse under Node.
      - name: node --check (Script Includes) — blocking
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if node --check "$f"; then echo "ok   $f"; else echo "FAIL $f"; fail=1; fi
          done < <(find infoblox-ddi-book/servicenow-app -name '*.js' | sort)
          exit $fail

      # BLOCKING — each platform's catalog variable set must collect every REQUIRED
      # module variable (form field or MID-resolved), so the requester-facing form
      # and the Terraform modules cannot silently drift (REVIEW §2.1/§2.4).
      - name: Catalog↔module contract check — blocking
        run: python3 infoblox-ddi-book/servicenow-app/catalog/contract_check.py

      # ADVISORY — shellcheck warnings are informational until scripts harden.
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck — advisory (non-blocking)
        continue-on-error: true
        run: |
          find infoblox-ddi-book -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=warning --external-sources || true

  terraform-modules:
    name: Terraform validate (modules) — blocking
    runs-on: ubuntu-latest
    # BLOCKING — the five per-platform MODULE roots are hardened enough to validate
    # cleanly (they all report "Success! The configuration is valid"). Example
    # modules (which intentionally omit secret args) stay in the advisory job below.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: terraform validate (each of the 5 module roots)
        run: |
          set -euo pipefail
          fail=0
          for pkg in azure-alz aws-lz gcp-lz oci-lz vmware-lz; do
            d="infoblox-ddi-book/${pkg}-automation/terraform"
            echo "::group::validate $d"
            if terraform -chdir="$d" init -backend=false -input=false -no-color \
               && terraform -chdir="$d" validate -no-color; then
              echo "ok $d"
            else
              echo "FAIL $d"; fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  terraform-advisory:
    name: Terraform fmt + tflint + examples (advisory)
    runs-on: ubuntu-latest
    # ADVISORY — formatting, lint, and the example modules (placeholder SKUs,
    # intentionally-absent secret args) report status without blocking. Promote
    # each as it hardens (REVIEW §2.2/§2.3).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: terraform fmt -check (recursive)
        continue-on-error: true
        run: terraform fmt -check -recursive infoblox-ddi-book

      - name: tflint (each module root)
        continue-on-error: true
        run: |
          set -uo pipefail
          for pkg in azure-alz aws-lz gcp-lz oci-lz vmware-lz; do
            d="infoblox-ddi-book/${pkg}-automation/terraform"
            echo "::group::tflint $d"
            tflint --chdir="$d" --no-color || echo "tflint findings in $d (advisory)"
            echo "::endgroup::"
          done

      - name: terraform validate (example modules)
        continue-on-error: true
        run: |
          set -uo pipefail
          while IFS= read -r d; do
            echo "::group::validate $d"
            terraform -chdir="$d" init -backend=false -input=false -no-color || echo "init issue in $d (skeleton)"
            terraform -chdir="$d" validate -no-color || echo "validate issue in $d (skeleton)"
            echo "::endgroup::"
          done < <(find infoblox-ddi-book -path '*/examples/*' -name '*.tf' -exec dirname {} \; | sort -u)
