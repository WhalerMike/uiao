[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uiao"
description = "UIAO — Unified Identity-Addressing-Overlay Architecture"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "WhalerMike" }]
keywords = ["fedramp", "oscal", "compliance", "ksi", "scuba", "zero-trust"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dynamic = ["version"]
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1.4",
  "jsonschema>=4.21",
  "markdown>=3.4",
  "python-frontmatter>=1.0",
  "python-docx>=0.8.11",
  "docxtpl>=0.16",
  "python-pptx>=0.6.21",
  "openpyxl>=3.1",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "lxml>=5.0",
  "compliance-trestle>=4.0",
  "compliance-trestle-fedramp>=0.2",
  "python-hcl2>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
  "types-requests",
  # Type stubs added in mypy burn-down Phase 1 (issue #279):
  "types-openpyxl",     # stubs for openpyxl — used by uiao.generators.{briefing,charts,docs}
  # NOTE: types-python-docx does NOT exist on PyPI as of 2026-05-01
  # despite issue #279's claim. python-docx-using modules (briefing,
  # rich_docx) keep their per-file overrides for now.
  # NOTE: compliance_trestle.* was removed from [[tool.mypy.overrides]]
  # (issue #279): the module is no longer imported anywhere mypy sees,
  # so the per-module entry was flagged as unused by warn_unused_configs.
]
# Runtime deps for the uiao.api FastAPI service (entrypoint at
# deploy/windows-server/run.py) and the gcc-boundary-probe adapter,
# which imports httpx. Optional because uiao.cli does not load uiao.api;
# most users of the CLI do not need the API dependencies installed.
api = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.29",
  "msal>=1.28",
]
# Windows Service wrapper for the UIAO governance API (uiao.service).
# Registers UIAOService in the Windows SCM (Services.msc / sc.exe).
# Windows-only; install alongside [api]: pip install "uiao[api,service]"
service = [
  "uiao[api]",
  "pywin32>=306; sys_platform == 'win32'",
]
# Runtime deps for the multi-tenant Azure SaaS plane (uiao.saas, ADR-096).
# Entrypoint: uiao.saas.asgi:app on Azure Container Apps. Builds on [api]
# (FastAPI/uvicorn/MSAL) and adds: durable Postgres tenant registry
# (SQLAlchemy async + asyncpg), inbound JWT signature verification (PyJWT),
# and the Azure SDK surfaces the per-tenant control plane stamps against
# (managed identity, Key Vault, Blob). Isolated as an extra so the blocking
# CI test job (which installs only .[api]) never needs these — uiao.saas
# lazy-imports the Postgres repository and JWKS verifier.
saas = [
  "uiao[api]",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pyjwt[crypto]>=2.8",
  "azure-identity>=1.16",
  "azure-keyvault-secrets>=4.8",
  "azure-storage-blob>=12.19",
]
# Runtime deps for the multi-tenant AWS SaaS plane (uiao.saas on AWS, ADR-117).
# The AWS analogue of [saas]: ECS Fargate runs uiao.saas.asgi:app against an RDS
# Postgres tenant registry (SQLAlchemy async + asyncpg), with passwordless RDS
# IAM auth + per-tenant S3 / Secrets Manager stamps via boto3. Same isolation
# doctrine — uiao.saas lazy-imports the boto3 surfaces, so the blocking CI test
# job (.[api] only) never needs these. The CDK IaC under deploy/aws/ has its own
# deploy-time requirements (deploy/aws/requirements.txt); aws-cdk-lib is not a
# runtime dependency.
aws = [
  "uiao[api]",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pyjwt[crypto]>=2.8",
  "boto3>=1.34",
]
# Visual-asset pipeline deps (ADR-093 — figures are committed SVG, rasterized):
#   - cairosvg: primary SVG -> PNG rasterizer for scripts/render_svg_images.py.
#   - playwright: fallback rasterizer (Chromium) for SVGs using <foreignObject>
#     or web fonts; also used as a CLI by docs/.github/workflows render steps
#     (`python -m playwright install chromium`).
#   NOTE: google-genai (Gemini "NanoBanana") was removed per ADR-093 — image
#   generation no longer calls a raster model. Pillow (PNG tEXt provenance) is
#   pulled in by the CI workflow.
visuals = [
  "cairosvg>=2.7",
  "playwright>=1.40",
]
# PlantUML fallback rendering via public plantuml.com server.
# `plantweb` is the Python SDK; invoked by src/uiao/generators/mermaid.py
# when UIAO_PLANTUML_JAR is not set and local java is unavailable. Kept
# declared even though no Python import site references it today — the
# config at src/uiao/config.py references this path, and the generator
# lookup is dynamic via plantweb's CLI shim.
plantuml = [
  "plantweb>=0.8",
]
# Kerberos (GSSAPI) SASL bind for the Active Governance Directory (ADR-101).
# `gssapi` (python-gssapi, over MIT krb5 / Heimdal) is lazy-imported by
# uiao.directory.sasl.GssapiMechanism so the core AGD stays pure-stdlib and the
# blocking CI test job never needs a Kerberos stack. Gate-only ticket
# validation: the AGD accepts the client's service ticket with its own keytab;
# it never issues tickets or holds user secrets.
kerberos = [
  "gssapi>=1.8",
]

[project.urls]
Homepage = "https://github.com/WhalerMike/uiao"
Repository = "https://github.com/WhalerMike/uiao"
Issues = "https://github.com/WhalerMike/uiao/issues"

[project.scripts]
uiao = "uiao.cli.app:app"
uiao-service = "uiao.service.windows_service:main"

[tool.setuptools.dynamic]
version = { attr = "uiao.__version__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["uiao*"]
namespaces = true

# Ship canon YAML / schemas / rules / KSI as package data so runtime
# code can access them via importlib.resources.
[tool.setuptools.package-data]
"uiao.adapters" = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.md"]
"uiao.canon" = ["**/*.yaml", "**/*.yml", "**/*.md", "**/*.json"]
"uiao.schemas" = ["**/*.json", "**/*.yaml", "**/*.yml"]
"uiao.rules" = ["**/*.yaml", "**/*.yml", "**/*.md"]
"uiao.ksi" = ["**/*.yaml", "**/*.yml", "**/*.json"]
# Web console templates + static assets (served by uiao.api.web.console).
"uiao.api.web" = ["templates/*.html", "static/*.css", "static/*.js"]
# OrgPath AD→facet mapping example (tenant-copyable; not canon).
"uiao.modernization.orgtree" = ["*.example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short"
norecursedirs = [".*", "build", "dist", "node_modules", "*.egg-info", "venv", ".venv"]

[tool.ruff]
target-version = "py310"
line-length = 120
# inbox/ is the scratch surface (per AGENTS.md): agent-authored drafts,
# nothing here is canon, so it isn't held to production code-quality
# standards. The same exclude was attempted in commit 7f0072bc but lost
# during squash-merge of PR #277 — restoring it here.
exclude = ["inbox"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402", "UP006", "UP035", "UP045", "SIM102", "SIM103", "SIM110", "SIM118", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["I001"]
"src/uiao/abstractions/**" = ["I001"]
"scripts/**" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["uiao"]
known-third-party = ["pytest", "yaml"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
warn_return_any = true
exclude = [
    "^scripts/",
    "^tests/",
]

[[tool.mypy.overrides]]
module = ["trestle.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "numpy.*", "docxtpl.*", "pptx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docx.*", "jinja2.*"]
ignore_missing_imports = true

# Generators that do heavy python-docx / python-pptx / matplotlib work.
# Those third-party libs ship no usable type stubs, so attribute access
# on `Document` / `Presentation` / `Figure` narrows to `Any` / `Optional[Any]`
# and mypy raises whole families of shape errors (attr-defined, valid-type,
# arg-type, assignment, index, operator, call-arg, union-attr). Runtime
# behavior is covered by the pytest suite. Suppress the shape-error codes
# per-file rather than spray `cast()` or `# type: ignore` across every line;
# the full list is in `disable_error_code` below. Flip back on if upstream
# stubs appear.
[[tool.mypy.overrides]]
module = [
    "uiao.generators.briefing",
    "uiao.generators.pptx",
    "uiao.generators.rich_docx",
]
disable_error_code = ["attr-defined", "arg-type", "assignment", "index", "operator", "call-arg", "union-attr", "valid-type"]

# Legacy-surfaces override block (issue #279 phase 3): historically held
# 7 modules with dense stub-gap / duck-typed patterns. Burned down to 0
# across PRs #481, #494, #507, #509, #510, and the conformance_check
# graduation that retired the last entry. The block is intentionally
# omitted now — the global config alone applies to every src/uiao file.

# Docx/pptx/matplotlib-heavy generators: add disallow_untyped_defs /
# warn_return_any relaxation alongside the existing shape-error
# suppressions. Same rationale — stub-less third-party libs drive the
# untyped pattern, not untyped code.
[[tool.mypy.overrides]]
module = [
    "uiao.generators.briefing",
    "uiao.generators.pptx",
    "uiao.generators.rich_docx",
]
disallow_untyped_defs = false
warn_return_any = false

# OSCAL evidence emitters (OrgTree + KYC) construct compliance-trestle
# pydantic-v1 models via keyword arguments. Trestle ships no usable mypy
# stubs; pydantic v1 accepts both the Python snake_case attr name and the
# hyphenated OSCAL alias at construction time (runtime-verified), but mypy
# raises call-arg / arg-type on every constructor call. Suppress those two
# codes; all other checks (untyped defs, return-any, attr-defined) remain
# active.
#
# Belt-and-suspenders: kept alongside the inline `# type: ignore` markers
# at each trestle constructor call. Inline ignores narrow the scope so this
# module-wide override can be removed when trestle ships proper stubs.
[[tool.mypy.overrides]]
module = ["uiao.oscal.orgtree_evidence", "uiao.oscal.kyc_evidence"]
disable_error_code = ["call-arg", "arg-type"]
