KSI_ID: KSI-029
Title: Recovery Capability Testing
Description: >-
  Scaffold for CR26 KSI-RPL-TRC ("Testing Recovery Capabilities"): the
  capability to recover from incidents and contingencies aligned with defined
  recovery objectives is persistently tested. Part 11 (Business Continuity)
  provides the CP-4 tabletop exercise framework with test plan, execution
  record metrics table, and signed AAR with lessons-learned section. Part 10
  (SIEM/XDR) provides IR-3 annual incident response test documentation.
  CP-4(1) coordinates CP and IR testing: the annual tabletop exercise validates
  that recovery procedures achieve defined RTO/RPO within the test scenario.
  Evaluability pending slot-07 Part 11 binding (ADR-111).
