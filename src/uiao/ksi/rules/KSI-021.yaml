KSI_ID: KSI-021
Title: Privileged Access via Defined Paths
Description: >-
  Scaffold for CR26 KSI-PIY-RVD ("Resolving via Defined paths"): all
  privileged access to production systems routes through a defined,
  monitored, identity-anchored path — specifically Privileged Access
  Workstations (PAW) with Entra PIM just-in-time activation. No out-of-band
  privileged access paths exist after PAW deployment. Not yet evaluable as
  an automated KSI signal — evaluation engine wiring for PAW session telemetry
  is pending (ADR-111). Evidence exists: Part 7 (PAM) provides IA-11/AC-11/
  AC-12 via Entra PIM + PAW; slot-05 binding carries confidence: high.
Status: active
Theme: KSI-PIY
Source:
  Substrate_Signal: endpoint.paw-session-evidence
  Data_Type: Event
  Note: >-
    Evidence is the Entra PIM activation log (role, justification,
    timestamp, duration) cross-referenced to PAW device compliance state.
    Field binding finalizes when PAW session events are ingested as
    structured substrate signals by the evaluation engine.
Evaluation:
  Logic: "IF slot_binding(KSI-PIY-RVD, confidence=high) THEN PASS ELSE FAIL"
Severity:
  PASS: Low
  FAIL: High
Mappings:
  NIST_800-53: IA-11, AC-11, AC-12, AC-6(5)
  FedRAMP: IA-11
  CR26: KSI-PIY-RVD
Provenance:
  Ruleset_Version: "1.0"
  Adapter_Version: "1.0"
  Authoring_Doc: UIAO_137
  Decision: ADR-111
