KSI_ID: KSI-015
Title: Supply Chain Risk Mitigation
Description: >-
  Scaffold for CR26 KSI-SCR-MIT ("Mitigating Supply Chain Risk"): the
  organization identifies, assesses, and mitigates risks to the CSO arising
  from suppliers, third-party developers, and system integrators. Not yet
  evaluable — evidence contract pending integration of the Part 13 SCRM
  Governance Charter (PM-30) and Part 12 SBOM/VDR acquisition-policy
  evidence into the substrate evaluation engine (ADR-111).
  Closes part of the KSI-SCR zero-coverage gap named in UIAO_137 §5.
