KSI_ID: KSI-015
Title: Supply Chain Risk Mitigation
Description: >-
  CR26 KSI-SCR-MIT ("Mitigating Supply Chain Risk"): the organization
  persistently identifies, reviews, and mitigates risks to the CSO arising
  from suppliers, third-party developers, and system integrators. Evidence
  contract satisfied by slot-06-security-evidence.yaml (ADR-111 phase 5,
  2026-07-04): Part 12 SBOM/VDR/VEX covers identify (SR-2 acquisition
  strategy + SR-3 supply chain controls + SLSA provenance), review (Grype
  CI blocking gate), and mitigate (BOD 26-04 D1–D5 remediation SLAs);
  Part 13 SCRM Governance Charter provides the PM-30 organizational
  framework. Satisfies the KSI-SCR theme for UIAO_137 §5.
