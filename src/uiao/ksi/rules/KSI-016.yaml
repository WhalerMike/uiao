KSI_ID: KSI-016
Title: Supply Chain Monitoring
Description: >-
  CR26 KSI-SCR-MON ("Monitoring Supply Chain"): the organization automatically
  monitors third-party software for upstream vulnerabilities using mechanisms
  that may include contractual notification requirements or active monitoring
  services. Evidence contract satisfied by slot-06-security-evidence.yaml
  (ADR-111 phase 5, 2026-07-04): Part 12 provides both CR26-specified
  mechanisms — PSIRT/MSRC/Infoblox portal subscriptions (contractual
  notification, SR-8) and Grype CI gate scanning SBOM diffs on every pull
  request (active monitoring service, SR-6); Part 10 Sentinel provides the
  CA-7 continuous monitoring overlay via SBOM custom data connector and KQL
  analytics tracking VEX assertion age. Satisfies the KSI-SCR theme for
  UIAO_137 §5.
Status: active
Theme: KSI-SCR
Source:
  Substrate_Signal: governance.scrm-monitoring
  Data_Type: Array
  Note: >-
    Evidence is PSIRT/MSRC subscription records (SR-8, Part 12) and Grype
    CI scan gate results (SR-6, Part 12), with Sentinel SBOM dashboard
    (CA-7, Part 10) as the continuous monitoring overlay. Slot-06 binding
    carries confidence: high — CR26 explicitly names contractual notification
    as a qualifying mechanism; PSIRT subscriptions directly satisfy this.
Evaluation:
  Logic: "IF slot_binding(KSI-SCR-MON, confidence=high) THEN PASS ELSE FAIL"
Severity:
  PASS: Low
  FAIL: High
Mappings:
  NIST_800-53: SR-6, SR-8, CA-7
  FedRAMP: SR-6
  CR26: KSI-SCR-MON
