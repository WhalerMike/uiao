KSI_ID: KSI-019
Title: Endpoint Inventory State Recording
Description: >-
  Scaffold for CR26 KSI-PIY-RIS ("Recording Inventory State"): all changes
  to the managed endpoint inventory are logged with author, timestamp, and
  before/after state in a tamper-resistant record store. Not yet evaluable
  as an automated KSI signal — evaluation engine wiring for Defender VM
  inventory-change telemetry is pending (ADR-111). Evidence exists: Part 8
  (Defender Vulnerability Management) provides RA-5 continuous scanning with
  change tracking; slot-05 binding carries confidence: high.
Status: active
Theme: KSI-PIY
Source:
  Substrate_Signal: endpoint.inventory-change-log
  Data_Type: Event
  Note: >-
    Evidence is the Defender VM device inventory change log (onboard /
    offboard / reconfigure events with timestamps). Field binding finalizes
    when inventory-change events are ingested as structured substrate
    signals by the evaluation engine.
Evaluation:
  Logic: "IF slot_binding(KSI-PIY-RIS, confidence=high) THEN PASS ELSE FAIL"
Severity:
  PASS: Low
  FAIL: High
Mappings:
  NIST_800-53: CM-8, RA-5, RA-5(2)
  FedRAMP: CM-8
  CR26: KSI-PIY-RIS
Provenance:
  Ruleset_Version: "1.0"
  Adapter_Version: "1.0"
  Authoring_Doc: UIAO_137
  Decision: ADR-111
