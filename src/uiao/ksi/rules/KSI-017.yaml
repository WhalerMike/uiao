KSI_ID: KSI-017
Title: Endpoint Inventory Visibility
Description: >-
  Scaffold for CR26 KSI-PIY-GIV ("Getting Inventory Visibility"): the CSO
  maintains a continuously updated, authoritative inventory of all managed
  endpoint devices visible from the control plane. Not yet evaluable as an
  automated KSI signal — evaluation engine wiring for Defender VM device
  inventory telemetry is pending (ADR-111). Evidence exists: Part 8
  (Defender Vulnerability Management) provides RA-5(5) authenticated
  scanning across all managed devices; the slot-05 binding carries
  confidence: high.
Status: scaffold
Theme: KSI-PIY
Source:
  Substrate_Signal: endpoint.inventory-visibility
  Data_Type: Boolean
  Note: >-
    Evidence is the Defender VM authenticated device scan result set
    (RA-5(5)) and the CM-7 prohibited-software inventory report. Field
    binding finalizes when Defender VM telemetry is ingested as a
    structured substrate signal by the evaluation engine.
Evaluation:
  Logic: "PENDING — scaffold; binds to Defender VM authenticated scan coverage (RA-5(5)) once endpoint telemetry substrate signal is wired."
Severity:
  PASS: Low
  FAIL: High
Mappings:
  NIST_800-53: CM-8, RA-5, RA-5(5)
  FedRAMP: CM-8
  CR26: KSI-PIY-GIV
Provenance:
