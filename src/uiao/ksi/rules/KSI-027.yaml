KSI_ID: KSI-027
Title: Recovery Plan Alignment with Objectives
Description: >-
  Scaffold for CR26 KSI-RPL-ARP ("Aligning Recovery Plan"): the alignment of
  recovery plans with defined recovery objectives is persistently reviewed.
  Part 11 (Business Continuity) provides the full NIST SP 800-34 Contingency
  Plan (CP-2) with BIA-anchored RTO/RPO, recovery priorities, activation
  procedures, recovery procedures, and annual maintenance review. Parts 2
  (SD-WAN dual-underlay = CP-7/CP-8) and 6 (SQL AG async DR replica = CP-6)
  contribute technical recovery infrastructure evidence aligned to plan
  objectives. Evaluability pending slot-07 Part 11 binding (ADR-111).
