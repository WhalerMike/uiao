KSI_ID: KSI-012
Title: Immutable Redeployment over Direct Modification
Description: >-
  Scaffold for CR26 KSI-CMT-RMV ("Redeploying vs Modifying"): changes to
  machine-based information resources are executed through redeployment of
  version-controlled resources rather than direct modification wherever
  reasonable. Not yet evaluable — evidence contract pending CR26 VDR/VER
  finalization (ADR-111, FINDING-PGM-003). Closes part of the KSI-CMT
  zero-coverage gap named in UIAO_137 §4.
Status: active
Theme: KSI-CMT
Source:
  Substrate_Signal: governance.deployment-provenance
  Data_Type: Array
  Note: >-
    Evidence is substrate-native deployment provenance (version-controlled
    redeploy vs in-place mutation), not ScubaGear. Field binding finalizes
    when the CR26 FRR/VER evidence contract publishes.
Evaluation:
  Logic: "IF slot_binding(KSI-CMT-RMV, confidence=high) THEN PASS ELSE FAIL"
Severity:
  PASS: Low
  FAIL: Moderate
Mappings:
  NIST_800-53: CM-2, SA-10
  FedRAMP: CM-2
  CR26: KSI-CMT-RMV
Provenance:
