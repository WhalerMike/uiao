KSI_ID: KSI-025
Title: Past Incident Pattern Review
Description: >-
  Scaffold for CR26 KSI-INR-RPI ("Reviewing Past Incidents"): past incidents
  are persistently reviewed for patterns or vulnerabilities not previously
  apparent or identified. Part 10 (Sentinel) provides IR-4/IR-5 continuous
  incident monitoring: Sentinel workbooks for incident pattern analysis and
  KQL threat-hunting queries identify trends across the closed-incident corpus.
  Sentinel threat intelligence integration (TI feed) satisfies IR-5 by
  correlating past incidents against emerging threat actor TTPs. Part 10 is
  already bound in slot-04 for KSI-MLA; this rule extends the same evidence
  to KSI-INR. Evaluability pending evaluation-engine wiring (ADR-111).
Status: active
Theme: KSI-INR
Source:
  Substrate_Signal: siem.incident-pattern-analysis
  Data_Type: Event
  Note: >-
    Evidence is the Sentinel incident workbook trend report (IR-5) and the
    KQL hunting query library targeting past-incident pattern detection.
    Slot-04 already captures Part 10 evidence; this rule maps it to KSI-INR-RPI.
Evaluation:
  Logic: "IF slot_binding(KSI-INR-RPI, confidence=high) THEN PASS ELSE FAIL"
Severity:
  PASS: Low
  FAIL: Moderate
Mappings:
  NIST_800-53: IR-3, IR-4, "IR-4(1)", IR-5, IR-8
  FedRAMP: IR-5
  CR26: KSI-INR-RPI
Provenance:
  Ruleset_Version: "1.0"
  Adapter_Version: "1.0"
  Authoring_Doc: UIAO_137
  Decision: ADR-111
