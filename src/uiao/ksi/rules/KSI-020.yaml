Source:
  Substrate_Signal: endpoint.privileged-path-definition
  Data_Type: Policy
  Note: >-
    Evidence will be the machine-readable privileged-path policy document
    (listing all permitted administrative access paths and their enforcement
    mechanism). Field binding finalizes when Part 14 PII data flow map
    artifacts are ingested as structured substrate signals.
Evaluation:
  Logic: "PENDING — scaffold; binds to privileged-path policy and Part 14 PII data flow map once evidence contract lands."
