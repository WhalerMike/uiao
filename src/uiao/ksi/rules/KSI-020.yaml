KSI_ID: KSI-020
Title: Privileged Path Definition and Enforcement
Description: >-
  Scaffold for CR26 KSI-PIY-RSD ("Resolving via Software-Defined paths"):
  all privileged access routes through defined, identity-anchored paths that
  are software-defined and continuously monitored; no out-of-band privileged
  access paths are permitted. Not yet evaluable — evidence contract pending.
  KSI-PIY-RSD is not yet covered by any high-confidence AAN slot binding;
  Part 14 (PII processing) will provide the data-residency path-definition
  evidence that closes the software-defined path gap for PII data flows.
Status: scaffold
