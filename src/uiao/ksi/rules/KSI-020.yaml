KSI_ID: KSI-020
Title: SDLC Security Review
Description: >-
  CR26 KSI-PIY-RSD ("Reviewing Security in the SDLC"): security and privacy
  are built into the SDLC aligned with CISA Secure By Design principles and
  persistently reviewed. Evidence contract satisfied by slot-05-endpoint-
  evidence.yaml (ADR-111 phase 5, 2026-07-04): Part 12 (SBOM/VDR/VEX)
  provides SA-15 (development process standards) via Grype CI gate blocking
  critical CVEs on every pull request; SA-11 (developer testing) via
  automated SBOM generation and vulnerability scanning in CI; SA-8 (security
  engineering principles) via SLSA provenance and container signing; SR-3
  (supply chain controls) via Syft SBOM generation at build time. Part 8
  (Defender VM) extends SDLC security review to the endpoint plane —
  developer workstation posture scanning ensures the development environment
  meets security baselines. Together these establish a persistently reviewed,
  machine-verifiable SDLC security posture aligned with Secure By Design.
Status: active
Theme: KSI-PIY
Source:
  Substrate_Signal: endpoint.sdlc-security-review
  Data_Type: Policy
  Note: >-
    Evidence is the Grype CI gate scan records (SA-11/SA-15, Part 12) and
    SLSA provenance attestations (SA-8/SR-3, Part 12), with Defender VM
    developer workstation posture data (Part 8) as the endpoint plane signal.
    Slot-05 binding carries confidence: high (Parts 12 + 8).
Evaluation:
  Logic: "IF slot_binding(KSI-PIY-RSD, confidence=high) THEN PASS ELSE FAIL"
Severity:
  PASS: Low
  FAIL: High
