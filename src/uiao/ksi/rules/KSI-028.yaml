KSI_ID: KSI-028
Title: Recovery Objective Review
Description: >-
  Scaffold for CR26 KSI-RPL-RRO ("Reviewing Recovery Objectives"): the desired
  RTO and RPO are persistently reviewed for alignment with the provider's
  business needs and capabilities. Part 11 (Business Continuity) Section 7
  (Plan Maintenance) mandates annual BIA review for RTO/RPO re-validation.
  The BIA table with mission-owner signature requirement specifically satisfies
  "RTO and RPO persistently reviewed for alignment with business needs" —
  CP-2.3 documents that recovery objectives are re-derived from BIA results
  at least annually. Evaluability pending slot-07 Part 11 binding (ADR-111).
Status: active
