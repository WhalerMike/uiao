KSI_ID: KSI-022
Title: Cybersecurity Training Effectiveness Review
Description: >-
  Scaffold for CR26 KSI-CED-RAT ("Reviewing All Training"): the organization
  persistently reviews cybersecurity training effectiveness across four
  dimensions — general all-employee security awareness, role-specific training
  for high-risk roles, secure-delivery training for development and engineering
  staff, and IR/DR training for incident-response and recovery personnel.
  Not yet evaluable — the AT family evidence record (LMS completion evidence
  for AT-2, AT-3, AT-4 across all employee categories) is not yet bound as
  a machine-readable substrate signal. CP-3 (contingency training) via Part 11
  and PM-14 framework via Part 13 provide partial organizational evidence.
  Closes the KSI-CED zero-coverage gap named in UIAO_137 §5.
Status: scaffold
Theme: KSI-CED
Source:
  Substrate_Signal: governance.training-effectiveness-record
  Data_Type: Document
  Note: >-
    Evidence is the LMS training completion record demonstrating all four
    training dimensions are reviewed. CP-3 tabletop attendance (Part 11) and
    PM-14 T&T&M Plan (Part 13) provide partial organizational evidence pending
    an AT-2/AT-3/AT-4 machine-readable training-completion source.
Evaluation:
  Logic: "PENDING — scaffold; binds to LMS training completion and CP-3 tabletop attendance records once AT-family evidence contract is wired (ADR-111)."
