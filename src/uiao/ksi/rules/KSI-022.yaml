KSI_ID: KSI-022
Title: Cybersecurity Training Effectiveness Review
Description: >-
  CR26 KSI-CED-RAT ("Reviewing All Training"): the organization persistently
  reviews cybersecurity training effectiveness across four dimensions —
  (1) general all-employee security awareness (AT-2/AT-2(1)/AT-2(2)),
  (2) role-specific training for six high-risk tiers (AT-3/AT-3(3)/AT-3(5)),
  (3) secure-delivery training for development and engineering staff (SA-16),
  and (4) IR/DR training for incident-response and recovery personnel
  (IR-2/CP-3). Evidence is the machine-readable LMS training-effectiveness
  record (governance.training-effectiveness-record JSON schema) produced by
  Part 15 — Cybersecurity Awareness and Training Program. AT-4 retention
  records and CP-3 tabletop exercise attendance (Part 11) provide corroborating
  organizational evidence. Closes the KSI-CED zero-coverage gap named in
  UIAO_137 §5. Activated by Part 15 (Book 15) of the Federal AAN series.
Status: active
Theme: KSI-CED
Source:
  Substrate_Signal: governance.training-effectiveness-record
  Data_Type: Document
  Note: >-
    Evidence is the LMS training completion record (JSON schema defined in
    Part 15) demonstrating all four training dimensions are reviewed with
    ≥95% completion across all role tiers. AT-4 training records provide
    retention evidence. CP-3 tabletop attendance (Part 11) and PM-14 T&T&M
    Plan (Part 13) provide corroborating organizational evidence.
Evaluation:
  Logic: >-
    PASS when governance.training-effectiveness-record contains: overall_completion_pct
    >= 95, all six role_tiers present with tier_completion_pct >= 95, at least one
    cp3_tabletop_date within the last 12 months, and ir2_drill_date within the last
    12 months. FAIL if overall_completion_pct < 95 or any required dimension is absent.
Severity:
  PASS: Low
  FAIL: Moderate
Mappings:
  NIST_800-53: AT-2, AT-2(1), AT-2(2), AT-3, AT-3(3), AT-3(5), AT-4, CP-3, IR-2
  FedRAMP: AT-2
  CR26: KSI-CED-RAT
Provenance:
  Ruleset_Version: 0.2-active
  Adapter_Version: 0.2-active
