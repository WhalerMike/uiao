KSI_ID: KSI-018
Title: Endpoint Entity State Resolution
Description: >-
  Scaffold for CR26 KSI-PIY-RES ("Resolving Entity State"): the CSO can
  determine the current configuration and compliance posture of any managed
  endpoint on demand, including patch level, software inventory, and
  vulnerability state. Not yet evaluable as an automated KSI signal —
  evaluation engine wiring for Defender VM posture telemetry is pending
  (ADR-111). Evidence exists: Part 8 (Defender Vulnerability Management)
  provides continuous endpoint posture via CM-7(1) automated policy
  enforcement; slot-05 binding carries confidence: high.
Status: active
Theme: KSI-PIY
Source:
  Substrate_Signal: endpoint.entity-state
  Data_Type: Record
  Note: >-
    Evidence is the Defender VM endpoint posture record (compliance state,
    CVE exposure, software baseline delta). Field binding finalizes when
    posture telemetry is ingested as a structured substrate signal by the
    evaluation engine.
Evaluation:
  Logic: "IF slot_binding(KSI-PIY-RES, confidence=high) THEN PASS ELSE FAIL"
Severity:
  PASS: Low
  FAIL: High
Mappings:
  NIST_800-53: CM-7, CM-7(1), CM-8
  FedRAMP: CM-7
  CR26: KSI-PIY-RES
Provenance:
  Ruleset_Version: "1.0"
  Adapter_Version: "1.0"
  Authoring_Doc: UIAO_137
  Decision: ADR-111
