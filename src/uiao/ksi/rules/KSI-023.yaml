KSI_ID: KSI-023
Title: Incident After Action Report Generation
Description: >-
  Scaffold for CR26 KSI-INR-AAR ("Generating After Action Reports"): incident
  after action reports are generated and lessons learned are persistently
  incorporated. Part 10 (Sentinel) provides the structured incident handling
  pipeline (IR-4/IR-8) with closed-loop ticket records. Part 11 (Business
  Continuity) provides the CP-4 tabletop AAR template with mandatory sign-off
  and lessons-learned section. Evaluability pending slot-07 continuity evidence
  binding for the CP-4 tabletop AAR artifact (ADR-111).
Status: active
Theme: KSI-INR
Source:
  Substrate_Signal: siem.incident-closed-aar
  Data_Type: Event
  Note: >-
    Evidence is the Sentinel incident closed-event chain (IR-4) plus the
    CP-4 tabletop after action report (Part 11). Slot-04 already provides
    IR-4/IR-8 evidence; slot-07 adds the CP-4 tabletop AAR dimension.
Evaluation:
  Logic: "IF slot_binding(KSI-INR-AAR, confidence=high) THEN PASS ELSE FAIL"
Severity:
  PASS: Low
  FAIL: High
Mappings:
  NIST_800-53: IR-3, IR-4, "IR-4(1)", IR-8, CP-4
  FedRAMP: IR-4
  CR26: KSI-INR-AAR
Provenance:
