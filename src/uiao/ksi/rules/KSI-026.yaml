KSI_ID: KSI-026
Title: Backup Alignment with Recovery Objectives
Description: >-
  Scaffold for CR26 KSI-RPL-ABO ("Aligning Backups with Objectives"): the
  alignment of machine-based information resource backups with defined recovery
  objectives is persistently reviewed. Part 11 (Business Continuity) provides
  CP-9 backup strategy review and CP-2.3 BIA methodology that defines RTO/RPO
  and validates backup alignment. Parts 6 (SQL AG async DR replica = CP-6),
  10 (geo-redundant Log Analytics = CP-9 audit backups), and 1 (InfoBlox DDI
  Grid replication = DNS zone CP-6) contribute specific backup component
  evidence. Evaluability pending slot-07 Part 11 binding (ADR-111).
Status: scaffold
