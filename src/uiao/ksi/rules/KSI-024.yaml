KSI_ID: KSI-024
Title: Incident Response Procedure Effectiveness Review
Description: >-
  Scaffold for CR26 KSI-INR-RIR ("Reviewing Incident Response Procedures"):
  the effectiveness of documented incident response procedures is persistently
  reviewed. Part 10 (Sentinel) closes IR-4, IR-6, and IR-8 — the Sentinel
  SOAR playbook library and annual IR test (IR-8.1) provide a machine-readable
  IR procedure effectiveness review cycle. Part 10 is already bound in
  slot-04 for KSI-MLA; this rule extends the same evidence to KSI-INR.
  Evaluability pending evaluation-engine wiring (ADR-111).
Status: scaffold
Theme: KSI-INR
Source:
  Substrate_Signal: siem.playbook-review-cycle
  Data_Type: Event
  Note: >-
    Evidence is the Sentinel SOAR playbook review log (IR-4/IR-8.1) and the
    annual IR test record. Slot-04 already captures this via KSI-MLA bindings;
    this rule maps the same Parts 8/10 evidence to KSI-INR-RIR.
Evaluation:
  Logic: "PENDING — scaffold; binds to Sentinel playbook review cadence and annual IR test record once evaluation engine is wired (ADR-111)."
Severity:
  PASS: Low
  FAIL: High
Mappings:
