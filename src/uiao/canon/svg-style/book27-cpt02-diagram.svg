<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <!-- White background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F3A5F">OrgPath Position Drives Access Package Eligibility</text>

  <!-- ===== LEFT COLUMN: OrgPath facets ===== -->
  <!-- Bracket line (left vertical) -->
  <line x1="52" y1="80" x2="52" y2="370" stroke="#1F3A5F" stroke-width="2.5"/>
  <!-- Bracket top tick -->
  <line x1="52" y1="80" x2="62" y2="80" stroke="#1F3A5F" stroke-width="2.5"/>
  <!-- Bracket bottom tick -->
  <line x1="52" y1="370" x2="62" y2="370" stroke="#1F3A5F" stroke-width="2.5"/>

  <!-- Box 1: Department -->
  <rect x="68" y="68" width="178" height="42" rx="6" fill="#1F3A5F"/>
  <text x="157" y="94" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Department</text>

  <!-- Box 2: Division -->
  <rect x="68" y="122" width="178" height="42" rx="6" fill="#1F3A5F"/>
  <text x="157" y="148" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Division</text>

  <!-- Box 3: Role -->
  <rect x="68" y="176" width="178" height="42" rx="6" fill="#1F3A5F"/>
  <text x="157" y="202" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Role</text>

  <!-- Box 4: Tier -->
  <rect x="68" y="230" width="178" height="42" rx="6" fill="#1F3A5F"/>
  <text x="157" y="256" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Tier</text>

  <!-- Box 5: Security Clearance Level -->
  <rect x="68" y="284" width="178" height="42" rx="6" fill="#1F3A5F"/>
  <text x="157" y="310" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Security Clearance Level</text>

  <!-- Ellipsis to hint at 15 facets -->
  <text x="157" y="350" text-anchor="middle" font-size="14" fill="#1F3A5F">· · ·</text>

  <!-- Label below bracket -->
  <text x="157" y="398" text-anchor="middle" font-size="11.5" fill="#1F3A5F" font-style="italic">OrgPath position (15 facets, Model C)</text>

  <!-- ===== ARROW 1: OrgPath → Center column ===== -->
  <!-- Arrow shaft -->
  <line x1="250" y1="225" x2="316" y2="225" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <!-- Label above arrow -->
  <text x="283" y="214" text-anchor="middle" font-size="11" fill="#1A9E8F" font-weight="600">resolve eligibility</text>

  <!-- ===== CENTER COLUMN: three teal boxes ===== -->
  <!-- Box A: Catalog scope -->
  <rect x="320" y="100" width="218" height="52" rx="6" fill="#1A9E8F"/>
  <text x="429" y="122" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">Catalog scope —</text>
  <text x="429" y="138" text-anchor="middle" font-size="11.5" fill="#ffffff">which access packages are visible</text>

  <!-- Box B: Entitlement policy -->
  <rect x="320" y="176" width="218" height="66" rx="6" fill="#1A9E8F"/>
  <text x="429" y="199" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">Entitlement policy —</text>
  <text x="429" y="215" text-anchor="middle" font-size="11.5" fill="#ffffff">approval path, max duration,</text>
  <text x="429" y="231" text-anchor="middle" font-size="11.5" fill="#ffffff">justification required</text>

  <!-- Box C: Access review cycle -->
  <rect x="320" y="266" width="218" height="66" rx="6" fill="#1A9E8F"/>
  <text x="429" y="289" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">Access review cycle —</text>
  <text x="429" y="305" text-anchor="middle" font-size="11.5" fill="#ffffff">quarterly/annual,</text>
  <text x="429" y="321" text-anchor="middle" font-size="11.5" fill="#ffffff">who reviews</text>

  <!-- Vertical connector between center boxes -->
  <line x1="429" y1="152" x2="429" y2="176" stroke="#1A9E8F" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="429" y1="242" x2="429" y2="266" stroke="#1A9E8F" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== ARROW 2: Center column → Right box ===== -->
  <line x1="538" y1="225" x2="604" y2="225" stroke="#1A9E8F" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- ===== RIGHT BOX: Entra ID Governance ===== -->
  <rect x="608" y="178" width="210" height="92" rx="6" fill="#1F3A5F"/>
  <text x="713" y="210" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">Entra ID Governance</text>
  <text x="713" y="229" text-anchor="middle" font-size="12" fill="#ffffff">— access package</text>
  <text x="713" y="246" text-anchor="middle" font-size="12" fill="#ffffff">assignment</text>

  <!-- Annotation below right box -->
  <rect x="610" y="283" width="206" height="28" rx="5" fill="#f0f4f8" stroke="#1F3A5F" stroke-width="1"/>
  <text x="713" y="301" text-anchor="middle" font-size="11" fill="#1F3A5F" font-style="italic">Microsoft-native workforce surface</text>

  <!-- ===== ARROW MARKER ===== -->
  <defs>
    <marker id="arrowTeal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1A9E8F"/>
    </marker>
  </defs>

</svg>
