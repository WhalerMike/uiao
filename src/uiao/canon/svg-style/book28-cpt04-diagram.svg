<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:'Segoe UI',Arial,sans-serif;">

  <!-- White background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#1F3A5F">Credential Rotation Topology — CPM, Conjur, and UIAO DRIFT</text>

  <!-- ===== CENTRAL VAULT ===== -->
  <rect x="305" y="55" width="250" height="52" rx="6" fill="#1F3A5F"/>
  <text x="430" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">CyberArk Vault</text>
  <text x="430" y="96" text-anchor="middle" font-size="11" fill="#b0c4de">Central credential store</text>

  <!-- ===== LANE LABELS ===== -->
  <!-- Left lane label -->
  <rect x="50" y="135" width="160" height="28" rx="5" fill="#e8f0f8"/>
  <text x="130" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#1F3A5F">Human accounts</text>

  <!-- Center lane label -->
  <rect x="330" y="135" width="200" height="28" rx="5" fill="#e8f0f8"/>
  <text x="430" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#1F3A5F">Service accounts</text>

  <!-- Right lane label -->
  <rect x="640" y="135" width="180" height="28" rx="5" fill="#e8f0f8"/>
  <text x="730" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#1F3A5F">DevOps / workload secrets</text>

  <!-- ===== FAN-OUT ARROWS from vault to lane tops ===== -->
  <!-- Vault bottom center point: 430, 107 -->

  <!-- Left arrow: 430,107 → 130,163 -->
  <line x1="430" y1="107" x2="130" y2="163" stroke="#1F3A5F" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowNavy)"/>

  <!-- Center arrow: straight down -->
  <line x1="430" y1="107" x2="430" y2="163" stroke="#1F3A5F" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowNavy)"/>

  <!-- Right arrow: 430,107 → 730,163 -->
  <line x1="430" y1="107" x2="730" y2="163" stroke="#1F3A5F" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowNavy)"/>

  <!-- ===== LEFT LANE — Human accounts ===== -->
  <!-- Arrow down from lane label to Entra ID box -->
  <line x1="130" y1="163" x2="130" y2="210" stroke="#1A9E8F" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <!-- Entra ID box -->
  <rect x="30" y="210" width="200" height="52" rx="6" fill="#1A9E8F"/>
  <text x="130" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Entra ID</text>
  <text x="130" y="249" text-anchor="middle" font-size="11" fill="#d0f0ec">SSO / MFA / SSPR</text>

  <!-- Out-of-scope note -->
  <rect x="22" y="274" width="216" height="42" rx="5" fill="#f0f6ff" stroke="#1F3A5F" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="130" y="291" text-anchor="middle" font-size="10" fill="#1F3A5F" font-style="italic">Out of CPM scope;</text>
  <text x="130" y="307" text-anchor="middle" font-size="10" fill="#1F3A5F" font-style="italic">Entra lifecycle manages</text>

  <!-- ===== CENTER LANE — Service accounts ===== -->
  <!-- Arrow down to CPM box -->
  <line x1="430" y1="163" x2="430" y2="210" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <!-- CPM rotation engine box -->
  <rect x="310" y="210" width="240" height="52" rx="6" fill="#1F3A5F"/>
  <text x="430" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CPM rotation engine</text>
  <text x="430" y="249" text-anchor="middle" font-size="11" fill="#b0c4de">IA-5 credential mgmt control</text>

  <!-- Arrow down to automated rotation box -->
  <line x1="430" y1="262" x2="430" y2="294" stroke="#1A9E8F" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <!-- Automated rotation box -->
  <rect x="310" y="294" width="240" height="46" rx="6" fill="#1A9E8F"/>
  <text x="430" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Automated rotation</text>
  <text x="430" y="330" text-anchor="middle" font-size="11" fill="#d0f0ec">on policy cadence</text>

  <!-- Arrow down to drift alert -->
  <line x1="430" y1="340" x2="430" y2="365" stroke="#C0392B" stroke-width="2" marker-end="url(#arrowRed)"/>
  <!-- DRIFT alert box -->
  <rect x="310" y="365" width="240" height="38" rx="6" fill="#C0392B"/>
  <text x="430" y="381" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DRIFT-CPM-STALE fires</text>
  <text x="430" y="396" text-anchor="middle" font-size="10" fill="#fddede">if cadence missed</text>

  <!-- ===== RIGHT LANE — DevOps / workload secrets ===== -->
  <!-- Arrow down to Conjur box -->
  <line x1="730" y1="163" x2="730" y2="210" stroke="#1A9E8F" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <!-- Conjur box -->
  <rect x="628" y="210" width="204" height="52" rx="6" fill="#1A9E8F"/>
  <text x="730" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Conjur</text>
  <text x="730" y="249" text-anchor="middle" font-size="11" fill="#d0f0ec">Dynamic secrets · workload identity</text>

  <!-- Short-lived note -->
  <rect x="622" y="274" width="216" height="42" rx="5" fill="#f0f6ff" stroke="#1A9E8F" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="730" y="291" text-anchor="middle" font-size="10" fill="#1F3A5F" font-style="italic">Short-lived, app-bound</text>
  <text x="730" y="307" text-anchor="middle" font-size="10" fill="#1F3A5F" font-style="italic">credentials</text>

  <!-- ===== CONVERGENCE ARROWS TO DRIFT ENGINE ===== -->
  <!-- Left lane converge arrow: from below left note to DRIFT engine -->
  <line x1="130" y1="316" x2="130" y2="460" stroke="#D4A017" stroke-width="1.8" stroke-dasharray="5,3"/>
  <line x1="130" y1="460" x2="310" y2="460" stroke="#D4A017" stroke-width="1.8" marker-end="url(#arrowAmber)"/>

  <!-- Center lane converge arrow: from drift-cpm-stale to DRIFT engine -->
  <line x1="430" y1="403" x2="430" y2="438" stroke="#D4A017" stroke-width="1.8" marker-end="url(#arrowAmber)"/>

  <!-- Right lane converge arrow: from below right note to DRIFT engine -->
  <line x1="730" y1="316" x2="730" y2="460" stroke="#D4A017" stroke-width="1.8" stroke-dasharray="5,3"/>
  <line x1="730" y1="460" x2="550" y2="460" stroke="#D4A017" stroke-width="1.8" marker-end="url(#arrowAmber)"/>

  <!-- ===== UIAO DRIFT ENGINE ===== -->
  <rect x="310" y="438" width="240" height="52" rx="6" fill="#D4A017"/>
  <text x="430" y="459" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">UIAO DRIFT engine</text>
  <text x="430" y="477" text-anchor="middle" font-size="11" fill="#fff3cd">Reconciles credential posture across lanes</text>

  <!-- ===== LANE SEPARATOR LINES ===== -->
  <line x1="255" y1="130" x2="255" y2="490" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="605" y1="130" x2="605" y2="490" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- ===== ARROWHEAD MARKERS ===== -->
  <defs>
    <marker id="arrowNavy" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1F3A5F"/>
    </marker>
    <marker id="arrowTeal" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1A9E8F"/>
    </marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#D4A017"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#C0392B"/>
    </marker>
  </defs>

</svg>
