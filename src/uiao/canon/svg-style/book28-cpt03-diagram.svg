<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- White background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- ── TOP BAND: UIAO control plane ── -->
  <rect x="20" y="20" width="820" height="200" rx="6" fill="#1F3A5F"/>
  <text x="430" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1">UIAO CONTROL PLANE</text>

  <!-- Entra PIM JIT request box (left edge ingress) -->
  <rect x="30" y="68" width="120" height="48" rx="6" fill="#1F3A5F" stroke="#ffffff" stroke-width="1.5"/>
  <text x="90" y="87" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Entra PIM</text>
  <text x="90" y="101" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">JIT Request</text>
  <!-- arrow from Entra PIM into cyberark adapter -->
  <line x1="150" y1="92" x2="188" y2="92" stroke="#D4A017" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- cyberark adapter box -->
  <rect x="188" y="62" width="160" height="60" rx="6" fill="#1F3A5F" stroke="#D4A017" stroke-width="2"/>
  <text x="268" y="86" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">cyberark adapter</text>
  <text x="268" y="101" text-anchor="middle" font-size="10" fill="#D4A017">(active, phase-1)</text>

  <!-- arrow from cyberark adapter to OrgPath policies -->
  <line x1="348" y1="92" x2="388" y2="92" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- OrgPath activation policies box -->
  <rect x="388" y="62" width="164" height="60" rx="6" fill="#1A9E8F"/>
  <text x="470" y="86" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">OrgPath Activation</text>
  <text x="470" y="101" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Policies</text>

  <!-- arrow from OrgPath policies to DRIFT engine -->
  <line x1="552" y1="92" x2="592" y2="92" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- DRIFT engine box -->
  <rect x="592" y="62" width="140" height="60" rx="6" fill="#1A9E8F"/>
  <text x="662" y="89" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DRIFT Engine</text>

  <!-- DRIFT events exit box (right edge) -->
  <rect x="762" y="68" width="88" height="48" rx="6" fill="#C0392B"/>
  <text x="806" y="87" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">DRIFT Events</text>
  <text x="806" y="101" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Exit</text>
  <!-- arrow from DRIFT engine to DRIFT events exit -->
  <line x1="732" y1="92" x2="762" y2="92" stroke="#C0392B" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Feedback arrow from OrgPath back to cyberark adapter (curved, below) -->
  <path d="M 470 122 Q 470 148 268 148 Q 268 140 268 122" fill="none" stroke="#D4A017" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowAmber)"/>
  <text x="368" y="162" text-anchor="middle" font-size="9" fill="#D4A017">policy feedback</text>

  <!-- ── PROVIDER-INCORPORATION CONTRACT double arrow ── -->
  <!-- Double-headed arrow shaft -->
  <line x1="430" y1="232" x2="430" y2="298" stroke="#1A9E8F" stroke-width="3" marker-start="url(#arrowTealStart)" marker-end="url(#arrowTeal)"/>
  <!-- Label box behind text -->
  <rect x="245" y="251" width="370" height="28" rx="4" fill="#ffffff"/>
  <text x="430" y="269" text-anchor="middle" font-size="11" font-weight="700" fill="#1A9E8F">provider-incorporation contract (ADR-092)</text>

  <!-- ── BOTTOM BAND: CyberArk data plane ── -->
  <rect x="20" y="308" width="820" height="192" rx="6" fill="#1A9E8F"/>
  <text x="430" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1">CYBERARK DATA PLANE</text>

  <!-- Four equal boxes -->
  <!-- Box 1: Vault + Safe ACLs -->
  <rect x="36" y="348" width="185" height="132" rx="6" fill="#ffffff" opacity="0.15"/>
  <rect x="36" y="348" width="185" height="132" rx="6" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="128" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Vault + Safe ACLs</text>
  <text x="128" y="394" text-anchor="middle" font-size="11" fill="#D4A017" font-weight="600">(AC-6)</text>
  <text x="128" y="416" text-anchor="middle" font-size="9" fill="#ffffff">Account ownership</text>
  <text x="128" y="430" text-anchor="middle" font-size="9" fill="#ffffff">entitlement boundary</text>
  <text x="128" y="444" text-anchor="middle" font-size="9" fill="#ffffff">enforcement</text>

  <!-- Box 2: PSM session broker -->
  <rect x="231" y="348" width="185" height="132" rx="6" fill="#ffffff" opacity="0.15"/>
  <rect x="231" y="348" width="185" height="132" rx="6" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="323" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PSM Session Broker</text>
  <text x="323" y="394" text-anchor="middle" font-size="11" fill="#D4A017" font-weight="600">(AC-17)</text>
  <text x="323" y="416" text-anchor="middle" font-size="9" fill="#ffffff">Remote privileged</text>
  <text x="323" y="430" text-anchor="middle" font-size="9" fill="#ffffff">session proxy +</text>
  <text x="323" y="444" text-anchor="middle" font-size="9" fill="#ffffff">recording</text>

  <!-- Box 3: CPM rotation engine -->
  <rect x="426" y="348" width="185" height="132" rx="6" fill="#ffffff" opacity="0.15"/>
  <rect x="426" y="348" width="185" height="132" rx="6" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="518" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">CPM Rotation Engine</text>
  <text x="518" y="394" text-anchor="middle" font-size="11" fill="#D4A017" font-weight="600">(IA-5)</text>
  <text x="518" y="416" text-anchor="middle" font-size="9" fill="#ffffff">Credential lifecycle</text>
  <text x="518" y="430" text-anchor="middle" font-size="9" fill="#ffffff">policy-driven</text>
  <text x="518" y="444" text-anchor="middle" font-size="9" fill="#ffffff">rotation</text>

  <!-- Box 4: PTA analytics -->
  <rect x="621" y="348" width="199" height="132" rx="6" fill="#ffffff" opacity="0.15"/>
  <rect x="621" y="348" width="199" height="132" rx="6" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="720" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PTA Analytics</text>
  <text x="720" y="394" text-anchor="middle" font-size="11" fill="#D4A017" font-weight="600">(AU-3 / AU-12)</text>
  <text x="720" y="416" text-anchor="middle" font-size="9" fill="#ffffff">Threat + behavioral</text>
  <text x="720" y="430" text-anchor="middle" font-size="9" fill="#ffffff">audit telemetry</text>
  <text x="720" y="444" text-anchor="middle" font-size="9" fill="#ffffff">feed</text>

  <!-- ── Arrow markers ── -->
  <defs>
    <marker id="arrowWhite" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ffffff"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#D4A017"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#C0392B"/>
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1A9E8F"/>
    </marker>
    <marker id="arrowTealStart" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L8,3 z" fill="#1A9E8F"/>
    </marker>
  </defs>
</svg>
