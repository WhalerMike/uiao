<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:'Segoe UI',Arial,sans-serif;">
  <!-- Background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- User box -->
  <rect x="20" y="180" width="160" height="70" rx="6" fill="#1F3A5F"/>
  <text x="100" y="208" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">User</text>
  <text x="100" y="224" text-anchor="middle" fill="#ffffff" font-size="10">(OrgPath:</text>
  <text x="100" y="238" text-anchor="middle" fill="#ffffff" font-size="10">Tier-3 Network Engr)</text>

  <!-- Arrow: User -> PIM -->
  <line x1="180" y1="215" x2="228" y2="215" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrowNavy)"/>

  <!-- PIM box -->
  <rect x="230" y="180" width="160" height="70" rx="6" fill="#1F3A5F"/>
  <text x="310" y="205" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Entra PIM</text>
  <text x="310" y="221" text-anchor="middle" fill="#ffffff" font-size="10">eligible role</text>
  <text x="310" y="237" text-anchor="middle" fill="#ffffff" font-size="10">assignment</text>

  <!-- Arrow: PIM -> top branch (OrgPath diamond) -->
  <line x1="390" y1="200" x2="438" y2="155" stroke="#1A9E8F" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- Arrow: PIM -> bottom branch (CBA diamond) -->
  <line x1="390" y1="230" x2="438" y2="275" stroke="#1A9E8F" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- Top diamond: OrgPath activation policy -->
  <polygon points="510,115 570,155 510,195 450,155" fill="#ffffff" stroke="#1A9E8F" stroke-width="2"/>
  <text x="510" y="148" text-anchor="middle" fill="#1A9E8F" font-size="9" font-weight="bold">OrgPath activation</text>
  <text x="510" y="161" text-anchor="middle" fill="#1A9E8F" font-size="9" font-weight="bold">policy: position</text>
  <text x="510" y="174" text-anchor="middle" fill="#1A9E8F" font-size="9" font-weight="bold">in scope?</text>

  <!-- YES label top -->
  <text x="600" y="148" text-anchor="middle" fill="#1A9E8F" font-size="11" font-weight="bold">✓ YES</text>

  <!-- Arrow: top diamond -> converge point -->
  <line x1="570" y1="155" x2="638" y2="200" stroke="#1A9E8F" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- Bottom diamond: CBA gate -->
  <polygon points="510,235 570,275 510,315 450,275" fill="#ffffff" stroke="#1A9E8F" stroke-width="2"/>
  <text x="510" y="268" text-anchor="middle" fill="#1A9E8F" font-size="9" font-weight="bold">CBA gate</text>
  <text x="510" y="281" text-anchor="middle" fill="#1A9E8F" font-size="9" font-weight="bold">satisfied?</text>
  <text x="510" y="294" text-anchor="middle" fill="#1A9E8F" font-size="9" font-weight="bold">(ADR-068)</text>

  <!-- YES label bottom -->
  <text x="600" y="288" text-anchor="middle" fill="#1A9E8F" font-size="11" font-weight="bold">✓ YES</text>

  <!-- Arrow: bottom diamond -> converge point -->
  <line x1="570" y1="275" x2="638" y2="230" stroke="#1A9E8F" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- JIT elevation granted box -->
  <rect x="640" y="185" width="200" height="75" rx="6" fill="#1A9E8F"/>
  <text x="740" y="210" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">JIT elevation granted:</text>
  <text x="740" y="226" text-anchor="middle" fill="#ffffff" font-size="10">time-bounded, audited,</text>
  <text x="740" y="242" text-anchor="middle" fill="#ffffff" font-size="10">scoped to OrgPath position</text>

  <!-- Arrow: JIT box -> expiry box -->
  <line x1="740" y1="260" x2="740" y2="298" stroke="#C0392B" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Expiry / drift alert box -->
  <rect x="630" y="300" width="220" height="60" rx="6" fill="#C0392B"/>
  <text x="740" y="323" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">Role expires after TTL.</text>
  <text x="740" y="339" text-anchor="middle" fill="#ffffff" font-size="10">DRIFT-PRIV-NOCBA fires</text>
  <text x="740" y="355" text-anchor="middle" fill="#ffffff" font-size="10">if CBA skipped</text>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowNavy" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1F3A5F"/>
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1A9E8F"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#C0392B"/>
    </marker>
  </defs>
</svg>
