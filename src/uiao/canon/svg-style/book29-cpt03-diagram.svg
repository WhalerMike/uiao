<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <!-- White background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#1F3A5F">UIAO Control Plane Governing CrowdStrike Falcon Data Plane</text>

  <!-- Upper band: UIAO Control Plane -->
  <rect x="20" y="54" width="820" height="195" rx="6" fill="#E6F7F5" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="40" y="78" font-size="13" font-weight="700" fill="#1A9E8F">UIAO Control Plane</text>

  <!-- OrgPath Endpoint Profiles box -->
  <rect x="55" y="92" width="170" height="60" rx="6" fill="#1F3A5F"/>
  <text x="140" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">OrgPath</text>
  <text x="140" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Endpoint Profiles</text>

  <!-- Arrow OrgPath → Adapter -->
  <line x1="225" y1="122" x2="308" y2="122" stroke="#1F3A5F" stroke-width="2"/>
  <polygon points="308,117 320,122 308,127" fill="#1F3A5F"/>

  <!-- CrowdStrike Adapter box -->
  <rect x="320" y="92" width="170" height="60" rx="6" fill="#1F3A5F"/>
  <text x="405" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">CrowdStrike</text>
  <text x="405" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Adapter</text>

  <!-- reads Falcon APIs label -->
  <text x="405" y="168" text-anchor="middle" font-size="10" fill="#D4A017" font-style="italic">reads Falcon APIs</text>

  <!-- Arrow Adapter → Drift Engine -->
  <line x1="490" y1="122" x2="573" y2="122" stroke="#1F3A5F" stroke-width="2"/>
  <polygon points="573,117 585,122 573,127" fill="#1F3A5F"/>

  <!-- Drift Engine box -->
  <rect x="585" y="92" width="170" height="60" rx="6" fill="#1F3A5F"/>
  <text x="670" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Drift Engine</text>
  <text x="670" y="174" text-anchor="middle" font-size="10" fill="#1A9E8F" font-style="italic">reconciles desired vs actual</text>

  <!-- ADR-092 Boundary dashed line -->
  <line x1="20" y1="268" x2="840" y2="268" stroke="#C0392B" stroke-width="2" stroke-dasharray="8,5"/>
  <rect x="282" y="256" width="296" height="22" rx="4" fill="#ffffff"/>
  <text x="430" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#C0392B">ADR-092 Provider-Incorporation Boundary</text>

  <!-- Lower band: CrowdStrike Falcon Data Plane -->
  <rect x="20" y="285" width="820" height="215" rx="6" fill="#F5F5F5" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="40" y="308" font-size="13" font-weight="700" fill="#1F3A5F">CrowdStrike Falcon Data Plane</text>

  <!-- Falcon Console box -->
  <rect x="45" y="320" width="165" height="55" rx="6" fill="#1F3A5F"/>
  <text x="127" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Falcon Console</text>

  <!-- Sensor Policy Groups box -->
  <rect x="232" y="320" width="165" height="55" rx="6" fill="#1F3A5F"/>
  <text x="314" y="345" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Sensor Policy</text>
  <text x="314" y="361" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Groups</text>

  <!-- Prevention Policies box -->
  <rect x="419" y="320" width="165" height="55" rx="6" fill="#1F3A5F"/>
  <text x="501" y="345" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Prevention</text>
  <text x="501" y="361" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Policies</text>

  <!-- Endpoint Fleet box -->
  <rect x="606" y="320" width="165" height="55" rx="6" fill="#1F3A5F"/>
  <text x="688" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Endpoint Fleet</text>

  <!-- Upward arrow 1 -->
  <line x1="314" y1="320" x2="380" y2="218" stroke="#D4A017" stroke-width="1.8" stroke-dasharray="5,3"/>
  <polygon points="374,220 380,208 386,220" fill="#D4A017"/>
  <rect x="200" y="255" width="168" height="16" rx="3" fill="#ffffff"/>
  <text x="284" y="267" text-anchor="middle" font-size="9.5" fill="#D4A017">/policy-groups  /sensors</text>

  <!-- Upward arrow 2 -->
  <line x1="501" y1="320" x2="430" y2="218" stroke="#D4A017" stroke-width="1.8" stroke-dasharray="5,3"/>
  <polygon points="424,220 430,208 436,220" fill="#D4A017"/>
  <rect x="432" y="255" width="172" height="16" rx="3" fill="#ffffff"/>
  <text x="518" y="267" text-anchor="middle" font-size="9.5" fill="#D4A017">/prevention-policies  /hosts</text>

  <!-- Legend -->
  <rect x="30" y="450" width="800" height="52" rx="6" fill="#ffffff" stroke="#1F3A5F" stroke-width="1"/>
  <rect x="48" y="462" width="18" height="12" rx="2" fill="#1F3A5F"/>
  <text x="72" y="473" font-size="10" fill="#1F3A5F">Control / Data Plane Component</text>
  <line x1="230" y1="468" x2="268" y2="468" stroke="#1F3A5F" stroke-width="2"/>
  <polygon points="268,464 278,468 268,472" fill="#1F3A5F"/>
  <text x="284" y="473" font-size="10" fill="#1F3A5F">Data / Command Flow</text>
  <line x1="430" y1="468" x2="468" y2="468" stroke="#D4A017" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="468,464 478,468 468,472" fill="#D4A017"/>
  <text x="484" y="473" font-size="10" fill="#D4A017">Falcon API Call (read)</text>
  <line x1="630" y1="468" x2="668" y2="468" stroke="#C0392B" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="674" y="473" font-size="10" fill="#C0392B">ADR-092 Boundary</text>
  <text x="48" y="492" font-size="10" fill="#1A9E8F">Upper band = UIAO-owned reconciliation layer   |   Lower band = vendor-managed Falcon platform   |   Adapter is the sole crossing point</text>
</svg>
