<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- White background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#1F3A5F">Three-Layer Endpoint Posture Governance</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowNavy" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1F3A5F"/>
    </marker>
  </defs>

  <!-- OrgPath Profile tall rectangle (left side) -->
  <rect x="30" y="70" width="80" height="390" rx="6" fill="#1F3A5F"/>
  <text x="70" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" transform="rotate(-90,70,265)">OrgPath Profile</text>

  <!-- Bracket -->
  <line x1="118" y1="90" x2="118" y2="440" stroke="#1F3A5F" stroke-width="2.5"/>
  <line x1="110" y1="90" x2="118" y2="90" stroke="#1F3A5F" stroke-width="2.5"/>
  <line x1="110" y1="440" x2="118" y2="440" stroke="#1F3A5F" stroke-width="2.5"/>
  <line x1="118" y1="265" x2="148" y2="265" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#arrowNavy)"/>

  <!-- LAYER 1 (bottom visual = teal) Sensor Enrollment -->
  <rect x="155" y="350" width="490" height="100" rx="6" fill="#E6F6F5" stroke="#1A9E8F" stroke-width="2"/>
  <rect x="165" y="362" width="56" height="22" rx="4" fill="#1A9E8F"/>
  <text x="193" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Layer 1</text>
  <text x="240" y="378" font-size="13" font-weight="700" fill="#1A9E8F">Sensor Enrollment</text>
  <text x="175" y="402" font-size="11" fill="#1F3A5F">All managed endpoints enrolled in EDR sensor; posture</text>
  <text x="175" y="418" font-size="11" fill="#1F3A5F">baseline established and confirmed against OrgPath scope.</text>
  <text x="175" y="436" font-size="11" fill="#1F3A5F">Missing enrollment detected as a drift event.</text>

  <!-- DRIFT labels Layer 1 -->
  <rect x="658" y="358" width="190" height="26" rx="5" fill="#C0392B"/>
  <text x="753" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DRIFT-EDR-NOSENSOR</text>
  <rect x="658" y="392" width="190" height="26" rx="5" fill="#C0392B"/>
  <text x="753" y="410" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DRIFT-EDR-NOPOLICY</text>
  <line x1="645" y1="371" x2="658" y2="371" stroke="#C0392B" stroke-width="1.5"/>
  <line x1="645" y1="405" x2="658" y2="405" stroke="#C0392B" stroke-width="1.5"/>
  <line x1="645" y1="371" x2="645" y2="405" stroke="#C0392B" stroke-width="1.5"/>

  <!-- LAYER 2 (middle = navy) Detection and Prevention -->
  <rect x="155" y="228" width="490" height="110" rx="6" fill="#E8EDF4" stroke="#1F3A5F" stroke-width="2"/>
  <rect x="165" y="240" width="56" height="22" rx="4" fill="#1F3A5F"/>
  <text x="193" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Layer 2</text>
  <text x="240" y="256" font-size="13" font-weight="700" fill="#1F3A5F">Detection and Prevention Policy</text>
  <text x="175" y="280" font-size="11" fill="#1F3A5F">Correct policy profile assigned per OrgPath role and device class;</text>
  <text x="175" y="296" font-size="11" fill="#1F3A5F">prevention mode active where authorized. Policy assignment</text>
  <text x="175" y="312" font-size="11" fill="#1F3A5F">validated continuously against OrgPath Group membership.</text>

  <!-- DRIFT label Layer 2 -->
  <rect x="658" y="262" width="190" height="26" rx="5" fill="#D4A017"/>
  <text x="753" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DRIFT-EDR-WRONGPOLICY</text>
  <line x1="645" y1="275" x2="658" y2="275" stroke="#D4A017" stroke-width="1.5"/>

  <!-- LAYER 3 (top = amber) Vulnerability and Device Posture -->
  <rect x="155" y="90" width="490" height="126" rx="6" fill="#FDF6E3" stroke="#D4A017" stroke-width="2"/>
  <rect x="165" y="102" width="56" height="22" rx="4" fill="#D4A017"/>
  <text x="193" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Layer 3</text>
  <text x="240" y="118" font-size="13" font-weight="700" fill="#D4A017">Vulnerability and Device Posture</text>
  <text x="175" y="142" font-size="11" fill="#1F3A5F">Vulnerability scan results reconciled against OrgPath asset scope;</text>
  <text x="175" y="158" font-size="11" fill="#1F3A5F">critical findings surfaced as drift events. Device health attestation</text>
  <text x="175" y="174" font-size="11" fill="#1F3A5F">enforced; non-compliant posture blocks access via Conditional Access.</text>

  <!-- DRIFT labels Layer 3 -->
  <rect x="658" y="102" width="190" height="26" rx="5" fill="#C0392B"/>
  <text x="753" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DRIFT-EDR-VULN-CRITICAL</text>
  <rect x="658" y="136" width="190" height="26" rx="5" fill="#C0392B"/>
  <text x="753" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DRIFT-EDR-DEVICE-NOPOLICY</text>
  <line x1="645" y1="115" x2="658" y2="115" stroke="#C0392B" stroke-width="1.5"/>
  <line x1="645" y1="149" x2="658" y2="149" stroke="#C0392B" stroke-width="1.5"/>
  <line x1="645" y1="115" x2="645" y2="149" stroke="#C0392B" stroke-width="1.5"/>

  <!-- Stacking arrows between layers -->
  <line x1="400" y1="349" x2="400" y2="340" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <line x1="400" y1="227" x2="400" y2="218" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrowNavy)"/>

  <!-- Bottom legend -->
  <rect x="155" y="464" width="695" height="44" rx="6" fill="#F4F7FB" stroke="#1F3A5F" stroke-width="1"/>
  <text x="175" y="482" font-size="11" font-weight="700" fill="#1F3A5F">Legend: </text>
  <rect x="230" y="470" width="14" height="14" rx="3" fill="#1A9E8F"/>
  <text x="249" y="482" font-size="11" fill="#1F3A5F">Sensor Enrollment (Foundation)</text>
  <rect x="430" y="470" width="14" height="14" rx="3" fill="#1F3A5F"/>
  <text x="449" y="482" font-size="11" fill="#1F3A5F">Detection Policy</text>
  <rect x="558" y="470" width="14" height="14" rx="3" fill="#D4A017"/>
  <text x="577" y="482" font-size="11" fill="#1F3A5F">Vulnerability Posture</text>
  <rect x="706" y="470" width="14" height="14" rx="3" fill="#C0392B"/>
  <text x="725" y="482" font-size="11" fill="#1F3A5F">Drift Signal</text>
</svg>
