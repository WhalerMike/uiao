<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">EDR DRIFT Classes and L0–L4 Endpoint Actuation Ladder</text>

  <!-- Section dividers -->
  <line x1="287" y1="50" x2="287" y2="510" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="574" y1="50" x2="574" y2="510" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#888888"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#C0392B"/>
    </marker>
    <marker id="arrowGray2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#bbbbbb"/>
    </marker>
  </defs>

  <!-- LEFT THIRD: Device Lifecycle -->
  <text x="143" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3A5F">Device Lifecycle</text>

  <!-- Joiner -->
  <rect x="22" y="80" width="242" height="62" rx="6" fill="#1A9E8F"/>
  <text x="143" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Joiner</text>
  <text x="143" y="116" text-anchor="middle" font-size="10" fill="#ffffff">→ Enrollment → Policy Applied</text>
  <text x="143" y="132" text-anchor="middle" font-size="9" fill="#d0f0ec">Sensor deployed; Falcon group assigned</text>

  <line x1="143" y1="142" x2="143" y2="162" stroke="#888888" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Mover -->
  <rect x="22" y="162" width="242" height="62" rx="6" fill="#D4A017"/>
  <text x="143" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Mover</text>
  <text x="143" y="198" text-anchor="middle" font-size="10" fill="#ffffff">→ OrgPath Recompute → Policy Updated</text>
  <text x="143" y="214" text-anchor="middle" font-size="9" fill="#fff3cc">Group membership re-evaluated</text>

  <line x1="143" y1="224" x2="143" y2="244" stroke="#888888" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Leaver -->
  <rect x="22" y="244" width="242" height="62" rx="6" fill="#1F3A5F"/>
  <text x="143" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Leaver</text>
  <text x="143" y="280" text-anchor="middle" font-size="10" fill="#adc4e0">→ Enrollment Revoked</text>
  <text x="143" y="296" text-anchor="middle" font-size="9" fill="#7a9ec0">Sensor offboarded; Falcon group removed</text>

  <line x1="143" y1="306" x2="143" y2="336" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="165" y="325" font-size="9" fill="#C0392B">if revoke missed</text>

  <!-- DRIFT-ORPHAN box -->
  <rect x="22" y="336" width="242" height="58" rx="6" fill="#C0392B"/>
  <text x="143" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">DRIFT-ORPHAN-ENDPOINT</text>
  <text x="143" y="372" text-anchor="middle" font-size="10" fill="#ffd0cc">if revoke missed</text>
  <text x="143" y="386" text-anchor="middle" font-size="9" fill="#ffffff">CRITICAL — L3 gated action required</text>

  <text x="143" y="430" text-anchor="middle" font-size="10" fill="#666666" font-style="italic">Joiner/Mover/Leaver lifecycle</text>
  <text x="143" y="445" text-anchor="middle" font-size="10" fill="#666666" font-style="italic">drives EDR policy states</text>

  <!-- CENTER THIRD: DRIFT Class Table -->
  <text x="430" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3A5F">DRIFT Class Registry</text>

  <rect x="297" y="76" width="267" height="24" rx="4" fill="#1F3A5F"/>
  <text x="350" y="92" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">Class</text>
  <text x="487" y="92" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">Severity</text>
  <text x="545" y="92" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">L-Level</text>

  <rect x="297" y="100" width="267" height="24" fill="#F5F5F5"/>
  <text x="301" y="116" font-size="8.5" fill="#1F3A5F">DRIFT-EDR-NOPOLICY</text>
  <text x="487" y="116" text-anchor="middle" font-size="8.5" fill="#C0392B" font-weight="bold">HIGH</text>
  <text x="545" y="116" text-anchor="middle" font-size="8.5" fill="#1A9E8F" font-weight="bold">L2</text>

  <rect x="297" y="124" width="267" height="24" fill="#ffffff"/>
  <text x="301" y="140" font-size="8.5" fill="#1F3A5F">DRIFT-EDR-NOSENSOR</text>
  <text x="487" y="140" text-anchor="middle" font-size="8.5" fill="#C0392B" font-weight="bold">HIGH</text>
  <text x="545" y="140" text-anchor="middle" font-size="8.5" fill="#1A9E8F" font-weight="bold">L2</text>

  <rect x="297" y="148" width="267" height="24" fill="#F5F5F5"/>
  <text x="301" y="164" font-size="8.5" fill="#1F3A5F">DRIFT-EDR-WRONGPOLICY</text>
  <text x="487" y="164" text-anchor="middle" font-size="8.5" fill="#D4A017" font-weight="bold">MEDIUM</text>
  <text x="545" y="164" text-anchor="middle" font-size="8.5" fill="#1A9E8F" font-weight="bold">L2</text>

  <rect x="297" y="172" width="267" height="24" fill="#ffffff"/>
  <text x="301" y="188" font-size="8.5" fill="#1F3A5F">DRIFT-EDR-ALERT (Falcon)</text>
  <text x="487" y="188" text-anchor="middle" font-size="8.5" fill="#D4A017" font-weight="bold">—</text>
  <text x="545" y="188" text-anchor="middle" font-size="8.5" fill="#1F3A5F" font-weight="bold">L3</text>

  <rect x="297" y="196" width="267" height="24" fill="#F5F5F5"/>
  <text x="301" y="212" font-size="8.5" fill="#1F3A5F">DRIFT-EDR-VULN-CRITICAL</text>
  <text x="487" y="212" text-anchor="middle" font-size="8.5" fill="#C0392B" font-weight="bold">CRITICAL</text>
  <text x="545" y="212" text-anchor="middle" font-size="8.5" fill="#1F3A5F" font-weight="bold">L3</text>

  <rect x="297" y="220" width="267" height="24" fill="#ffffff"/>
  <text x="301" y="236" font-size="8.5" fill="#1F3A5F">DRIFT-EDR-DEVICE-NOPOLICY</text>
  <text x="487" y="236" text-anchor="middle" font-size="8.5" fill="#C0392B" font-weight="bold">HIGH</text>
  <text x="545" y="236" text-anchor="middle" font-size="8.5" fill="#1A9E8F" font-weight="bold">L2</text>

  <rect x="297" y="244" width="267" height="24" fill="#fde8e6"/>
  <text x="301" y="260" font-size="8.5" fill="#C0392B" font-weight="bold">DRIFT-ORPHAN-ENDPOINT</text>
  <text x="487" y="260" text-anchor="middle" font-size="8.5" fill="#C0392B" font-weight="bold">CRITICAL</text>
  <text x="545" y="260" text-anchor="middle" font-size="8.5" fill="#1F3A5F" font-weight="bold">L3</text>

  <rect x="297" y="76" width="267" height="192" rx="4" fill="none" stroke="#1F3A5F" stroke-width="1.2"/>
  <line x1="430" y1="76" x2="430" y2="268" stroke="#bbbbbb" stroke-width="0.7"/>
  <line x1="515" y1="76" x2="515" y2="268" stroke="#bbbbbb" stroke-width="0.7"/>

  <text x="430" y="285" text-anchor="middle" font-size="8.5" fill="#666666" font-style="italic">L2 = advisory remediation ticket</text>
  <text x="430" y="298" text-anchor="middle" font-size="8.5" fill="#666666" font-style="italic">L3 = gated action (human approval required)</text>

  <text x="430" y="370" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3A5F">Actuation Flow</text>
  <rect x="297" y="378" width="267" height="34" rx="6" fill="#F5F5F5" stroke="#cccccc" stroke-width="1"/>
  <text x="430" y="392" text-anchor="middle" font-size="9" fill="#1F3A5F">DRIFT engine → classify → route to L-level</text>
  <text x="430" y="406" text-anchor="middle" font-size="9" fill="#1A9E8F">→ ITSM ticket (L2) or approval gate (L3)</text>

  <!-- RIGHT THIRD: L0-L4 Staircase -->
  <text x="717" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3A5F">L0–L4 Actuation Ladder</text>

  <!-- L0 — inert -->
  <rect x="584" y="430" width="260" height="40" rx="6" fill="#e0e0e0"/>
  <text x="604" y="448" font-size="11" font-weight="bold" fill="#555555">L0</text>
  <text x="628" y="448" font-size="10" fill="#555555">Inert</text>
  <text x="604" y="462" font-size="9" fill="#888888">No automated response; observe only</text>

  <!-- L1 — observe -->
  <rect x="584" y="382" width="260" height="42" rx="6" fill="#d6d6d6"/>
  <text x="604" y="400" font-size="11" font-weight="bold" fill="#444444">L1</text>
  <text x="628" y="400" font-size="10" fill="#444444">Observe</text>
  <text x="604" y="415" font-size="9" fill="#666666">Log, alert, dashboard — no ticket</text>

  <!-- L2 — advise -->
  <rect x="584" y="330" width="260" height="46" rx="6" fill="#1A9E8F"/>
  <text x="604" y="350" font-size="11" font-weight="bold" fill="#ffffff">L2</text>
  <text x="628" y="350" font-size="10" fill="#ffffff">Advise</text>
  <text x="604" y="366" font-size="9" fill="#d0f0ec">ITSM ticket created; owner notified</text>
  <text x="604" y="378" font-size="8.5" fill="#d0f0ec">Default for HIGH / MEDIUM classes</text>

  <!-- L3 — gated action -->
  <rect x="584" y="272" width="260" height="52" rx="6" fill="#1F3A5F"/>
  <text x="604" y="293" font-size="11" font-weight="bold" fill="#ffffff">L3</text>
  <text x="628" y="293" font-size="10" fill="#ffffff">Gated Action</text>
  <text x="604" y="309" font-size="9" fill="#adc4e0">Human approval required before action</text>
  <text x="604" y="322" font-size="8.5" fill="#adc4e0">CRITICAL classes; Falcon alerts; orphans</text>

  <!-- Federal ceiling -->
  <line x1="580" y1="272" x2="848" y2="272" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="715" y="267" text-anchor="middle" font-size="9" fill="#C0392B" font-weight="bold">Federal ceiling (ADR-092)</text>

  <!-- L4 — autonomous -->
  <rect x="584" y="210" width="260" height="56" rx="6" fill="#D4A017"/>
  <text x="604" y="232" font-size="11" font-weight="bold" fill="#ffffff">L4</text>
  <text x="628" y="232" font-size="10" fill="#ffffff">Autonomous</text>
  <text x="604" y="248" font-size="9" fill="#fff3cc">Self-healing; no human approval</text>
  <text x="604" y="262" font-size="8.5" fill="#fff3cc">Above federal ceiling — not used in federal</text>

  <!-- Side bracket -->
  <line x1="580" y1="466" x2="580" y2="215" stroke="#bbbbbb" stroke-width="1.2" marker-end="url(#arrowGray2)"/>
  <text x="575" y="340" text-anchor="middle" font-size="9" fill="#888888" transform="rotate(-90,575,340)">increasing autonomy →</text>

  <!-- Caption -->
  <text x="430" y="505" text-anchor="middle" font-size="8.5" fill="#999999">Book_29 · CPT_06 · EDR DRIFT Classes and Actuation Ladder · UIAO ADR-092 / ADR-093</text>
</svg>
