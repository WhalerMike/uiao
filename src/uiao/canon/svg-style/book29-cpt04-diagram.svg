<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- White background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="#1F3A5F">Threat Detection to Governed Containment: L3 Gated Response</text>

  <!-- Subtitle -->
  <text x="430" y="140" text-anchor="middle" font-size="11" fill="#555555">CrowdStrike EDR alert normalized by adapter → Drift Engine L3 evaluation → human-gated ServiceNow ticket → Falcon containment</text>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1F3A5F"/>
    </marker>
    <marker id="arrteal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1A9E8F"/>
    </marker>
    <marker id="arramber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#D4A017"/>
    </marker>
  </defs>

  <!-- Step 1 — Falcon Detection Event (red) -->
  <rect x="20" y="160" width="120" height="80" rx="6" fill="#C0392B"/>
  <text x="80" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Falcon</text>
  <text x="80" y="207" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Detection</text>
  <text x="80" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Event</text>
  <text x="80" y="252" text-anchor="middle" font-size="9" fill="#C0392B">① Source</text>

  <!-- Arrow 1→2 -->
  <line x1="140" y1="200" x2="163" y2="200" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2 — SIEM Feed (navy) -->
  <rect x="164" y="160" width="110" height="80" rx="6" fill="#1F3A5F"/>
  <text x="219" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">SIEM</text>
  <text x="219" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Feed</text>
  <text x="219" y="252" text-anchor="middle" font-size="9" fill="#1F3A5F">② Ingest</text>

  <!-- Arrow 2→3 -->
  <line x1="274" y1="200" x2="300" y2="200" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3 — CrowdStrike Adapter (amber) -->
  <rect x="301" y="148" width="140" height="104" rx="6" fill="#D4A017"/>
  <text x="371" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">CrowdStrike</text>
  <text x="371" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Adapter</text>
  <text x="371" y="208" text-anchor="middle" font-size="9" fill="#ffffff">normalizes to</text>
  <text x="371" y="221" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">DRIFT-EDR-ALERT</text>
  <text x="371" y="264" text-anchor="middle" font-size="9" fill="#D4A017">③ Normalize</text>

  <!-- OrgPath Identity Lookup box (teal) -->
  <rect x="311" y="320" width="120" height="52" rx="6" fill="#1A9E8F"/>
  <text x="371" y="341" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">OrgPath</text>
  <text x="371" y="356" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Identity Lookup</text>

  <!-- Upward arrow from OrgPath to Step 3 -->
  <line x1="371" y1="320" x2="371" y2="253" stroke="#1A9E8F" stroke-width="2" marker-end="url(#arrteal)"/>

  <!-- Arrow 3→4 -->
  <line x1="441" y1="200" x2="458" y2="200" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4 — Drift Engine L3 (navy) -->
  <rect x="459" y="160" width="110" height="80" rx="6" fill="#1F3A5F"/>
  <text x="514" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Drift Engine</text>
  <text x="514" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">L3</text>
  <text x="514" y="252" text-anchor="middle" font-size="9" fill="#1F3A5F">④ Evaluate</text>

  <!-- Arrow 4→5 -->
  <line x1="569" y1="200" x2="596" y2="200" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 5 — ServiceNow Ticket (navy) -->
  <rect x="597" y="160" width="110" height="80" rx="6" fill="#1F3A5F"/>
  <text x="652" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">ServiceNow</text>
  <text x="652" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Ticket</text>
  <text x="652" y="252" text-anchor="middle" font-size="9" fill="#1F3A5F">⑤ Authorize</text>

  <!-- Arrow 5→6 with Human Approval label -->
  <line x1="707" y1="200" x2="724" y2="200" stroke="#D4A017" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arramber)"/>
  <text x="716" y="155" text-anchor="middle" font-size="9" font-weight="700" fill="#D4A017">Human Approval</text>
  <text x="716" y="167" text-anchor="middle" font-size="9" font-weight="700" fill="#D4A017">required</text>
  <line x1="716" y1="170" x2="716" y2="196" stroke="#D4A017" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- Step 6 — Falcon Network Containment (teal) -->
  <rect x="725" y="160" width="115" height="80" rx="6" fill="#1A9E8F"/>
  <text x="782" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Falcon Network</text>
  <text x="782" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Containment</text>
  <text x="782" y="252" text-anchor="middle" font-size="9" fill="#1A9E8F">⑥ Contain</text>

  <!-- Legend -->
  <rect x="20" y="430" width="820" height="70" rx="6" fill="#f7f9fc" stroke="#d0d8e4" stroke-width="1"/>
  <text x="40" y="452" font-size="11" font-weight="700" fill="#1F3A5F">Legend</text>
  <rect x="40" y="462" width="14" height="14" rx="3" fill="#C0392B"/>
  <text x="60" y="474" font-size="10" fill="#1F3A5F">Detection Source</text>
  <rect x="160" y="462" width="14" height="14" rx="3" fill="#1F3A5F"/>
  <text x="180" y="474" font-size="10" fill="#1F3A5F">UIAO Control Plane</text>
  <rect x="310" y="462" width="14" height="14" rx="3" fill="#D4A017"/>
  <text x="330" y="474" font-size="10" fill="#1F3A5F">Adapter / Gated Transition</text>
  <rect x="490" y="462" width="14" height="14" rx="3" fill="#1A9E8F"/>
  <text x="510" y="474" font-size="10" fill="#1F3A5F">Enforcement / Identity Enrichment</text>
  <line x1="680" y1="469" x2="710" y2="469" stroke="#D4A017" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="716" y="474" font-size="10" fill="#1F3A5F">Approval gate</text>
</svg>
