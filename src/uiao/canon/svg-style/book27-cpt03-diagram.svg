<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <!-- White background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#1F3A5F">NERM Boundary Exception — Commercial Carve-Out ADR-059</text>

  <!-- Outer UIAO boundary — drawn as two path segments to create the notch gap on the right edge -->
  <!-- Full rectangle outline minus the notch: top, left, bottom sides and right side with gap -->
  <!-- Outer rect: x=30 y=50 w=680 h=390, notch gap at right edge between y=195 and y=265 -->

  <!-- Top + right-top segment -->
  <path d="M 56,50 L 710,50 L 710,195" fill="none" stroke="#1F3A5F" stroke-width="3"/>
  <!-- Right-bottom + bottom + left segment -->
  <path d="M 710,265 L 710,440 L 30,440 L 30,50 L 56,50" fill="none" stroke="#1F3A5F" stroke-width="3"/>

  <!-- Top-left corner rounded cap for left edge top -->
  <path d="M 30,56 A 6,6 0 0 1 36,50" fill="none" stroke="#1F3A5F" stroke-width="3"/>

  <!-- Boundary label -->
  <text x="38" y="68" font-size="11" font-weight="600" fill="#1F3A5F">UIAO cloud boundary — GCC Moderate (M365 SaaS)</text>

  <!-- Teal workforce surface region -->
  <rect x="44" y="78" width="650" height="348" rx="6" fill="#1A9E8F"/>
  <text x="369" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Workforce surface — Entra ID, M365, HRIT</text>

  <!-- Inner content boxes inside teal region -->
  <!-- Entra ID box -->
  <rect x="64" y="140" width="180" height="70" rx="6" fill="#1F3A5F" opacity="0.85"/>
  <text x="154" y="171" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Entra ID</text>
  <text x="154" y="189" text-anchor="middle" font-size="10" fill="#ffffff">Identity Provider / SSOT</text>

  <!-- M365 box -->
  <rect x="264" y="140" width="180" height="70" rx="6" fill="#1F3A5F" opacity="0.85"/>
  <text x="354" y="171" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">M365 / GCC</text>
  <text x="354" y="189" text-anchor="middle" font-size="10" fill="#ffffff">Productivity &amp; Compliance</text>

  <!-- HRIT box -->
  <rect x="464" y="140" width="180" height="70" rx="6" fill="#1F3A5F" opacity="0.85"/>
  <text x="554" y="171" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">HRIT</text>
  <text x="554" y="189" text-anchor="middle" font-size="10" fill="#ffffff">HR Identity &amp; Org Structure</text>

  <!-- OrgPath/UIAO core -->
  <rect x="164" y="240" width="360" height="80" rx="6" fill="#1F3A5F" opacity="0.85"/>
  <text x="344" y="274" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">UIAO OrgPath / Identity Governance</text>
  <text x="344" y="292" text-anchor="middle" font-size="10" fill="#ffffff">Canonical workforce identity · OrgTree · ADR-035–040</text>

  <!-- SailPoint ISC placeholder (inside boundary, deferred) -->
  <rect x="164" y="342" width="360" height="60" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="344" y="368" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">SailPoint ISC (IIQ / IdentityNow)</text>
  <text x="344" y="385" text-anchor="middle" font-size="9" fill="#ffffff">Deferred — ISC family adapter plan (inbox/drafts)</text>

  <!-- Notch visual indicator on right side of boundary -->
  <!-- Short horizontal tick lines at notch edges -->
  <line x1="703" y1="195" x2="718" y2="195" stroke="#D4A017" stroke-width="2.5"/>
  <line x1="703" y1="265" x2="718" y2="265" stroke="#D4A017" stroke-width="2.5"/>
  <!-- Vertical amber gap line connecting tick marks -->
  <line x1="710" y1="195" x2="710" y2="265" stroke="#D4A017" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Amber label for commercial exception notch -->
  <text x="715" y="192" font-size="9.5" font-weight="600" fill="#D4A017">Commercial exception 2</text>
  <text x="715" y="206" font-size="9.5" font-weight="600" fill="#D4A017">(ADR-059)</text>

  <!-- Bi-directional arrow between notch and NERM box -->
  <!-- Arrow shaft -->
  <line x1="722" y1="230" x2="754" y2="230" stroke="#1F3A5F" stroke-width="2"/>
  <!-- Left arrowhead -->
  <polygon points="722,230 729,226 729,234" fill="#1F3A5F"/>
  <!-- Right arrowhead -->
  <polygon points="754,230 747,226 747,234" fill="#1F3A5F"/>

  <!-- Arrow label -->
  <text x="738" y="221" text-anchor="middle" font-size="8.5" fill="#1F3A5F" font-weight="600">SCIM 2.0 / ISC V3 REST</text>
  <text x="738" y="245" text-anchor="middle" font-size="8" fill="#1F3A5F">read-shaped · ssot-mutation: never</text>

  <!-- NERM box outside boundary -->
  <rect x="756" y="190" width="90" height="84" rx="6" fill="#D4A017"/>
  <text x="801" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">SailPoint</text>
  <text x="801" y="227" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">NERM</text>
  <text x="801" y="247" text-anchor="middle" font-size="9" fill="#ffffff">AWS GovCloud</text>
  <text x="801" y="261" text-anchor="middle" font-size="9" fill="#ffffff">FedRAMP Moderate</text>
  <text x="801" y="273" text-anchor="middle" font-size="9" fill="#ffffff">2025-03-04</text>

  <!-- Legend area -->
  <text x="30" y="462" font-size="10" font-weight="600" fill="#555555">Legend</text>

  <!-- Legend entry 1 — grey box, Amazon Connect -->
  <rect x="30" y="470" width="14" height="14" rx="3" fill="#888888"/>
  <text x="50" y="481" font-size="10" fill="#333333">Commercial exception 1 — Amazon Connect (pre-existing)</text>

  <!-- Legend entry 2 — amber box, NERM -->
  <rect x="390" y="470" width="14" height="14" rx="3" fill="#D4A017"/>
  <text x="410" y="481" font-size="10" fill="#333333">Commercial exception 2 — SailPoint NERM (ADR-059)</text>

</svg>
