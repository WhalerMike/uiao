<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">OrgPath to Endpoint Profile to Falcon Policy Assignment</text>

  <!-- OrgPath Position (left) -->
  <rect x="30" y="140" width="170" height="170" rx="6" fill="#1F3A5F"/>
  <text x="115" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">OrgPath Position</text>
  <line x1="55" y1="180" x2="175" y2="180" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="115" y="200" text-anchor="middle" font-size="11" fill="#ffffff">Department</text>
  <text x="115" y="220" text-anchor="middle" font-size="11" fill="#ffffff">Division</text>
  <text x="115" y="240" text-anchor="middle" font-size="11" fill="#ffffff">Tier</text>
  <text x="115" y="260" text-anchor="middle" font-size="11" fill="#ffffff">Clearance Level</text>
  <text x="115" y="290" text-anchor="middle" font-size="10" fill="#D4A017">(identity context)</text>

  <!-- Arrow: OrgPath → Derivation -->
  <line x1="200" y1="225" x2="278" y2="225" stroke="#1F3A5F" stroke-width="2"/>
  <polygon points="278,220 290,225 278,230" fill="#1F3A5F"/>

  <!-- Endpoint Profile Derivation (center) -->
  <rect x="290" y="160" width="180" height="130" rx="6" fill="#1A9E8F"/>
  <text x="380" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Endpoint Profile</text>
  <text x="380" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Derivation</text>
  <line x1="310" y1="215" x2="450" y2="215" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="380" y="234" text-anchor="middle" font-size="10" fill="#ffffff">maps OrgPath facets</text>
  <text x="380" y="250" text-anchor="middle" font-size="10" fill="#ffffff">to sensor config</text>
  <text x="380" y="266" text-anchor="middle" font-size="10" fill="#ffffff">requirements</text>

  <!-- Fork arrow top -->
  <line x1="470" y1="210" x2="520" y2="210" stroke="#1F3A5F" stroke-width="2"/>
  <line x1="520" y1="145" x2="520" y2="305" stroke="#1F3A5F" stroke-width="2"/>
  <line x1="520" y1="145" x2="578" y2="145" stroke="#1F3A5F" stroke-width="2"/>
  <polygon points="578,140 590,145 578,150" fill="#1F3A5F"/>

  <!-- Fork arrow bottom -->
  <line x1="520" y1="305" x2="578" y2="305" stroke="#1F3A5F" stroke-width="2"/>
  <polygon points="578,300 590,305 578,310" fill="#1F3A5F"/>

  <!-- Falcon Sensor Policy Group (top right) -->
  <rect x="590" y="100" width="200" height="90" rx="6" fill="#1A9E8F"/>
  <text x="690" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Falcon Sensor</text>
  <text x="690" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Policy Group</text>
  <line x1="610" y1="155" x2="770" y2="155" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="690" y="174" text-anchor="middle" font-size="10" fill="#ffffff">sensor deployment target</text>

  <!-- Prevention Policy (bottom right) -->
  <rect x="590" y="260" width="200" height="90" rx="6" fill="#1A9E8F"/>
  <text x="690" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Prevention Policy</text>
  <line x1="610" y1="304" x2="770" y2="304" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="690" y="322" text-anchor="middle" font-size="10" fill="#ffffff">detection / response rules</text>
  <text x="690" y="338" text-anchor="middle" font-size="10" fill="#ffffff">per profile tier</text>

  <!-- DRIFT-EDR-NOPOLICY red rect -->
  <rect x="220" y="400" width="240" height="75" rx="6" fill="#C0392B"/>
  <text x="340" y="423" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">DRIFT-EDR-NOPOLICY</text>
  <line x1="240" y1="430" x2="444" y2="430" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="340" y="447" text-anchor="middle" font-size="10" fill="#ffffff">fires when: no policy enrollment</text>
  <text x="340" y="462" text-anchor="middle" font-size="10" fill="#ffffff">severity: HIGH</text>

  <!-- Dashed arrow -->
  <line x1="340" y1="400" x2="340" y2="330" stroke="#C0392B" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="340" y1="330" x2="520" y2="330" stroke="#C0392B" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="515,325 527,330 515,335" fill="#C0392B"/>

  <!-- DRIFT-EDR-NOSENSOR red rect -->
  <rect x="560" y="400" width="240" height="75" rx="6" fill="#C0392B"/>
  <text x="680" y="423" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">DRIFT-EDR-NOSENSOR</text>
  <line x1="580" y1="430" x2="784" y2="430" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="680" y="447" text-anchor="middle" font-size="10" fill="#ffffff">fires when: no sensor heartbeat</text>
  <text x="680" y="462" text-anchor="middle" font-size="10" fill="#ffffff">severity: HIGH</text>

  <!-- Dashed arrow -->
  <line x1="680" y1="400" x2="680" y2="355" stroke="#C0392B" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="675,360 680,348 685,360" fill="#C0392B"/>
</svg>
