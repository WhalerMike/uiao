<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1F3A5F">What AD Provided — and What Migration Surfaces</text>

  <!-- ===== LEFT COLUMN: AD era (implicit) ===== -->
  <!-- Column header -->
  <rect x="30" y="56" width="220" height="34" rx="6" fill="#1F3A5F"/>
  <text x="140" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">AD era (implicit)</text>

  <!-- Box 1 -->
  <rect x="30" y="100" width="220" height="96" rx="6" fill="#1F3A5F"/>
  <text x="140" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Lifecycle authority</text>
  <foreignObject x="38" y="128" width="204" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',Arial,sans-serif;font-size:10px;color:#ffffff;line-height:1.4;">AD group membership as de-facto record of who is provisioned</div>
  </foreignObject>

  <!-- Box 2 -->
  <rect x="30" y="208" width="220" height="96" rx="6" fill="#1F3A5F"/>
  <text x="140" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Approval routing</text>
  <foreignObject x="38" y="236" width="204" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',Arial,sans-serif;font-size:10px;color:#ffffff;line-height:1.4;">Manager chain from AD Distinguished Name resolves approvers</div>
  </foreignObject>

  <!-- Box 3 -->
  <rect x="30" y="316" width="220" height="96" rx="6" fill="#1F3A5F"/>
  <text x="140" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Service account custody</text>
  <foreignObject x="38" y="344" width="204" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',Arial,sans-serif;font-size:10px;color:#ffffff;line-height:1.4;">Owner implied by OU placement and naming convention</div>
  </foreignObject>

  <!-- ===== RED ARROW: AD migration ===== -->
  <defs>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C0392B"/>
    </marker>
  </defs>
  <rect x="268" y="220" width="84" height="30" rx="4" fill="#C0392B"/>
  <text x="310" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">AD migration</text>
  <line x1="258" y1="235" x2="268" y2="235" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arrowhead-red)"/>
  <line x1="352" y1="235" x2="358" y2="235" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arrowhead-red)"/>
  <!-- Arrow shaft from left col -->
  <line x1="250" y1="235" x2="266" y2="235" stroke="#C0392B" stroke-width="2.5"/>
  <!-- Arrow shaft to center col -->
  <line x1="352" y1="235" x2="368" y2="235" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arrowhead-red)"/>

  <!-- Cleaner arrow: single line across with label box on top -->
  <!-- Replace above with a clean horizontal arrow -->

  <!-- ===== CENTER COLUMN: After migration (gaps) ===== -->
  <!-- Column header -->
  <rect x="370" y="56" width="220" height="34" rx="6" fill="#ffffff" stroke="#C0392B" stroke-width="2"/>
  <text x="480" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">After migration (gaps)</text>

  <!-- Gap Box 1 -->
  <rect x="370" y="100" width="220" height="96" rx="6" fill="#ffffff" stroke="#C0392B" stroke-width="1.5"/>
  <text x="480" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#D4A017">Who approves provisioning?</text>
  <text x="480" y="138" text-anchor="middle" font-size="10" fill="#333">No deterministic answer</text>

  <!-- Gap Box 2 -->
  <rect x="370" y="208" width="220" height="96" rx="6" fill="#ffffff" stroke="#C0392B" stroke-width="1.5"/>
  <text x="480" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#D4A017">Approval routing broken</text>
  <foreignObject x="378" y="236" width="204" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',Arial,sans-serif;font-size:10px;color:#333333;line-height:1.4;">Manager chain is Entra, but routing model was never rebuilt</div>
  </foreignObject>

  <!-- Gap Box 3 -->
  <rect x="370" y="316" width="220" height="96" rx="6" fill="#ffffff" stroke="#C0392B" stroke-width="1.5"/>
  <text x="480" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#D4A017">Service accounts running under</text>
  <text x="480" y="350" text-anchor="middle" font-size="11" font-weight="700" fill="#D4A017">departed owners</text>
  <text x="480" y="368" text-anchor="middle" font-size="10" fill="#333">No detector</text>

  <!-- ===== RIGHT COLUMN: UIAO closes each gap ===== -->
  <!-- Column header -->
  <rect x="610" y="56" width="220" height="34" rx="6" fill="#1A9E8F"/>
  <text x="720" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">UIAO closes each gap</text>

  <!-- UIAO Box 1 -->
  <rect x="610" y="100" width="220" height="96" rx="6" fill="#1A9E8F"/>
  <text x="720" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">HRIT as lifecycle authority</text>
  <text x="720" y="138" text-anchor="middle" font-size="10" fill="#ffffff">JML pipeline from HR diffs</text>

  <!-- UIAO Box 2 -->
  <rect x="610" y="208" width="220" height="96" rx="6" fill="#1A9E8F"/>
  <text x="720" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">OrgPath routing layer</text>
  <foreignObject x="618" y="236" width="204" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',Arial,sans-serif;font-size:10px;color:#ffffff;line-height:1.4;">15-facet position resolves governing authority</div>
  </foreignObject>

  <!-- UIAO Box 3 -->
  <rect x="610" y="316" width="220" height="96" rx="6" fill="#1A9E8F"/>
  <text x="720" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Service identity orphan detector</text>
  <foreignObject x="618" y="344" width="204" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',Arial,sans-serif;font-size:10px;color:#ffffff;line-height:1.4;">DRIFT-ORPHAN-NHAM on LEAVER events</div>
  </foreignObject>

  <!-- ===== DASHED CONNECTOR LINES ===== -->
  <defs>
    <marker id="arrowhead-grey" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#999"/>
    </marker>
    <marker id="arrowhead-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1A9E8F"/>
    </marker>
  </defs>

  <!-- Row 1: left box1 → center gap1 -->
  <line x1="250" y1="148" x2="368" y2="148" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-grey)"/>
  <!-- Row 1: center gap1 → right uiao1 -->
  <line x1="590" y1="148" x2="608" y2="148" stroke="#1A9E8F" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-teal)"/>

  <!-- Row 2: left box2 → center gap2 -->
  <line x1="250" y1="256" x2="368" y2="256" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-grey)"/>
  <!-- Row 2: center gap2 → right uiao2 -->
  <line x1="590" y1="256" x2="608" y2="256" stroke="#1A9E8F" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-teal)"/>

  <!-- Row 3: left box3 → center gap3 -->
  <line x1="250" y1="364" x2="368" y2="364" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-grey)"/>
  <!-- Row 3: center gap3 → right uiao3 -->
  <line x1="590" y1="364" x2="608" y2="364" stroke="#1A9E8F" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-teal)"/>

  <!-- ===== RED MIGRATION ARROW (clean, spanning row 2 area) ===== -->
  <!-- Drawn over the connectors as a banner arrow, positioned between col headers and boxes -->
  <!-- Using a path arrow at y=90 area between cols -->
  <!-- Redraw: a single bold arrow from left col right edge to center col left edge, labeled -->
  <!-- Positioned at mid-height of diagram body, offset above the dashed lines -->

  <!-- Remove the earlier messy lines by drawing a cleaner version -->
  <!-- Arrow body -->
  <line x1="252" y1="430" x2="366" y2="430" stroke="#C0392B" stroke-width="3" marker-end="url(#arrowhead-red2)"/>
  <defs>
    <marker id="arrowhead-red2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C0392B"/>
    </marker>
  </defs>
  <rect x="262" y="418" width="96" height="20" rx="3" fill="#C0392B"/>
  <text x="310" y="432" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">AD migration</text>

  <!-- Footer note -->
  <text x="430" y="500" text-anchor="middle" font-size="9" fill="#555">Dashed lines trace each implicit AD function through the gap it exposes to the UIAO resolution that closes it.</text>
</svg>
