<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <!-- White background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3A5F">L0–L4 Actuation Ladder — Identity Governance</text>

  <!-- Staircase bands: stacked bottom to top, each wider left-to-right -->
  <!-- Layout: y starts at 50 (top of stack area), bands go downward in SVG coords
       L4 at top (y=50), L3, L2, L1, L0 at bottom
       Staircase: each higher level extends further right, or we clip left side to suggest steps
       Full width = 860. We use left margin stepping: L0 narrowest margin offset, L4 widest.
       Actually description says "progressively wider left-to-right to suggest rising staircase"
       meaning L0 at bottom is narrowest, L4 at top is widest — staircase effect via left indent.
       L0 left=160, L1 left=120, L2 left=80, L3 left=40, L4 left=0; all right=860
  -->

  <!-- Band heights (top-to-bottom in SVG): L4=80, L3=90, L2=85, L1=80, L0=55 -->
  <!-- Total band height = 80+90+85+80+55 = 390 -->
  <!-- Stack starts at y=50, ends at y=440 -->

  <!-- L4 (top): y=50, h=80, left=0, amber fill, red dashed border -->
  <rect x="0" y="50" width="860" height="80" fill="#D4A017" rx="4"/>
  <rect x="0" y="50" width="860" height="80" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="8,4" rx="4"/>
  <!-- L4 label -->
  <text x="30" y="86" font-size="18" font-weight="bold" fill="#ffffff">L4</text>
  <!-- L4 content -->
  <text x="90" y="79" font-size="12" fill="#ffffff" font-weight="bold">Autonomous</text>
  <text x="90" y="97" font-size="11" fill="#ffffff">Not adopted for federal deployments. Human ceiling applies.</text>
  <text x="90" y="113" font-size="11" fill="#ffffff">Requires explicit ADR override.</text>

  <!-- L3 (second from top): y=130, h=90, left=40, navy fill -->
  <rect x="40" y="130" width="820" height="90" fill="#1F3A5F" rx="4"/>
  <!-- L3 label -->
  <text x="70" y="171" font-size="18" font-weight="bold" fill="#ffffff">L3</text>
  <!-- L3 content -->
  <text x="130" y="158" font-size="12" fill="#ffffff" font-weight="bold">Gated</text>
  <text x="130" y="176" font-size="11" fill="#ffffff">ServiceNow live: GOV-JOINER / GOV-MOVER / GOV-LEAVER / GOV-ORPHAN tickets in production.</text>
  <text x="130" y="194" font-size="11" fill="#ffffff">Human approval gates all actions. requires_confirmation=True enforced.</text>

  <!-- L2 (middle): y=220, h=85, left=80, teal fill -->
  <rect x="80" y="220" width="780" height="85" fill="#1A9E8F" rx="4"/>
  <!-- L2 label -->
  <text x="110" y="259" font-size="18" font-weight="bold" fill="#ffffff">L2</text>
  <!-- L2 content -->
  <text x="170" y="248" font-size="12" fill="#ffffff" font-weight="bold">Advise</text>
  <text x="170" y="266" font-size="11" fill="#ffffff">Action lists emitted per JML event. OrgPath resolved. Routing computed.</text>
  <text x="170" y="284" font-size="11" fill="#ffffff">ServiceNow dry-run only.</text>

  <!-- L1 (second from bottom): y=305, h=80, left=120, teal fill -->
  <rect x="120" y="305" width="740" height="80" fill="#1A9E8F" rx="4"/>
  <!-- L1 label -->
  <text x="150" y="341" font-size="18" font-weight="bold" fill="#ffffff">L1</text>
  <!-- L1 content -->
  <text x="210" y="330" font-size="12" fill="#ffffff" font-weight="bold">Observe (AGD)</text>
  <text x="210" y="348" font-size="11" fill="#ffffff">HRIT snapshots ingested. JML events detected and logged. No tickets created.</text>

  <!-- L0 (bottom): y=385, h=55, left=160, light grey fill, dark text -->
  <rect x="160" y="385" width="700" height="55" fill="#E8E8E8" rx="4"/>
  <!-- L0 label -->
  <text x="190" y="417" font-size="18" font-weight="bold" fill="#444444">L0</text>
  <!-- L0 content -->
  <text x="250" y="410" font-size="12" fill="#444444" font-weight="bold">Inert</text>
  <text x="250" y="428" font-size="11" fill="#444444">No pipeline running. Identity lifecycle is ad hoc.</text>

  <!-- Federal default ceiling: vertical red dashed line at right edge of L3 (x=860, between L3 and L4) -->
  <!-- The right edge of L3 band is x=860 (x+width=40+820=860). Place the line at x=859 spanning L3 height -->
  <!-- Actually place it slightly inside canvas, spanning the gap between L3 top and L4 bottom -->
  <line x1="858" y1="130" x2="858" y2="220" stroke="#C0392B" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- Label "Federal default ceiling" rotated, near the line -->
  <text x="845" y="178" font-size="10" fill="#C0392B" text-anchor="middle" transform="rotate(-90 845 178)">Federal default ceiling</text>

  <!-- Footer note -->
  <text x="430" y="462" text-anchor="middle" font-size="11" fill="#888888">UIAO federal deployments default to L3. L4 requires explicit ADR override per ADR-092.</text>

  <!-- Step indicator arrows on left side to reinforce staircase direction -->
  <text x="10" y="300" font-size="22" fill="#1F3A5F" opacity="0.4">↑</text>
  <text x="10" y="460" font-size="10" fill="#888888" text-anchor="middle">↑ actuation</text>
</svg>
