<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="520" fill="#ffffff" rx="0"/>
  <!-- Title -->
  <text x="430" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="#1F3A5F">Endpoint Governance: From GPO to OrgPath-Derived Falcon Policy</text>

  <!-- Column 1: AD GPO Era (navy) -->
  <rect x="40" y="60" width="220" height="38" fill="#1F3A5F" rx="6"/>
  <text x="150" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">AD GPO Era</text>

  <!-- OU Membership -->
  <rect x="55" y="118" width="190" height="58" fill="#F5F5F5" rx="6" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="150" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#1F3A5F">OU Membership</text>
  <text x="150" y="161" text-anchor="middle" font-size="10" fill="#1F3A5F">Device placed in AD OU</text>

  <!-- Arrow -->
  <line x1="150" y1="176" x2="150" y2="198" stroke="#1F3A5F" stroke-width="2"/>
  <polygon points="144,196 156,196 150,206" fill="#1F3A5F"/>

  <!-- GPO Assignment -->
  <rect x="55" y="208" width="190" height="58" fill="#F5F5F5" rx="6" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="150" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#1F3A5F">GPO Assignment</text>
  <text x="150" y="251" text-anchor="middle" font-size="10" fill="#1F3A5F">Policy linked to OU hierarchy</text>

  <!-- Arrow -->
  <line x1="150" y1="266" x2="150" y2="288" stroke="#1F3A5F" stroke-width="2"/>
  <polygon points="144,286 156,286 150,296" fill="#1F3A5F"/>

  <!-- Endpoint Security Baseline -->
  <rect x="55" y="298" width="190" height="58" fill="#F5F5F5" rx="6" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="150" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#1F3A5F">Endpoint Security Baseline</text>
  <text x="150" y="341" text-anchor="middle" font-size="10" fill="#1F3A5F">Enforced via domain GPO</text>

  <!-- Col 1 note -->
  <rect x="55" y="378" width="190" height="46" fill="#1F3A5F" rx="6" opacity="0.1"/>
  <text x="150" y="397" text-anchor="middle" font-size="10" fill="#1F3A5F">Domain membership = implicit</text>
  <text x="150" y="413" text-anchor="middle" font-size="10" fill="#1F3A5F">org-structure anchor</text>

  <!-- Column 2: Migration Gap (red) -->
  <rect x="320" y="60" width="220" height="38" fill="#C0392B" rx="6"/>
  <text x="430" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Migration Gap</text>

  <!-- No Domain Trust -->
  <rect x="335" y="118" width="190" height="72" fill="#ffffff" rx="6" stroke="#C0392B" stroke-width="2"/>
  <text x="430" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">No Domain Trust</text>
  <text x="430" y="158" text-anchor="middle" font-size="10" fill="#C0392B">Cloud-joined devices lack</text>
  <text x="430" y="173" text-anchor="middle" font-size="10" fill="#C0392B">AD domain membership</text>

  <!-- No OU Anchor -->
  <rect x="335" y="214" width="190" height="72" fill="#ffffff" rx="6" stroke="#C0392B" stroke-width="2"/>
  <text x="430" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">No OU Anchor</text>
  <text x="430" y="254" text-anchor="middle" font-size="10" fill="#C0392B">Org-structure context lost;</text>
  <text x="430" y="269" text-anchor="middle" font-size="10" fill="#C0392B">OU hierarchy unavailable</text>

  <!-- No GPO Enforcement -->
  <rect x="335" y="310" width="190" height="72" fill="#ffffff" rx="6" stroke="#C0392B" stroke-width="2"/>
  <text x="430" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">No GPO Enforcement</text>
  <text x="430" y="350" text-anchor="middle" font-size="10" fill="#C0392B">Security baselines silently</text>
  <text x="430" y="365" text-anchor="middle" font-size="10" fill="#C0392B">unenforced post-migration</text>

  <!-- Gap label -->
  <rect x="335" y="404" width="190" height="42" fill="#C0392B" rx="6" opacity="0.1"/>
  <text x="430" y="422" text-anchor="middle" font-size="10" fill="#C0392B">Governance continuity broken</text>
  <text x="430" y="437" text-anchor="middle" font-size="10" fill="#C0392B">at cloud migration boundary</text>

  <!-- Column 3: UIAO Resolution (teal) -->
  <rect x="600" y="60" width="220" height="38" fill="#1A9E8F" rx="6"/>
  <text x="710" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">UIAO Resolution</text>

  <!-- OrgPath Position -->
  <rect x="615" y="118" width="190" height="58" fill="#F5F5F5" rx="6" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="710" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#1A9E8F">OrgPath Position</text>
  <text x="710" y="161" text-anchor="middle" font-size="10" fill="#1A9E8F">Device org-context from HRIT</text>

  <!-- Arrow -->
  <line x1="710" y1="176" x2="710" y2="198" stroke="#1A9E8F" stroke-width="2"/>
  <polygon points="704,196 716,196 710,206" fill="#1A9E8F"/>

  <!-- Falcon Sensor Policy -->
  <rect x="615" y="208" width="190" height="58" fill="#F5F5F5" rx="6" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="710" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#1A9E8F">Falcon Sensor Policy</text>
  <text x="710" y="251" text-anchor="middle" font-size="10" fill="#1A9E8F">Derived from OrgPath tags</text>

  <!-- Arrow -->
  <line x1="710" y1="266" x2="710" y2="288" stroke="#1A9E8F" stroke-width="2"/>
  <polygon points="704,286 716,286 710,296" fill="#1A9E8F"/>

  <!-- Endpoint -->
  <rect x="615" y="298" width="190" height="58" fill="#F5F5F5" rx="6" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="710" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#1A9E8F">Endpoint</text>
  <text x="710" y="341" text-anchor="middle" font-size="10" fill="#1A9E8F">Governed without domain trust</text>

  <!-- Col 3 note -->
  <rect x="615" y="378" width="190" height="46" fill="#1A9E8F" rx="6" opacity="0.1"/>
  <text x="710" y="397" text-anchor="middle" font-size="10" fill="#1A9E8F">OrgPath replaces OU as the</text>
  <text x="710" y="413" text-anchor="middle" font-size="10" fill="#1A9E8F">policy-routing substrate</text>

  <!-- Horizontal flow arrows -->
  <line x1="265" y1="260" x2="318" y2="260" stroke="#D4A017" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="314,254 326,260 314,266" fill="#D4A017"/>
  <line x1="545" y1="260" x2="598" y2="260" stroke="#D4A017" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="594,254 606,260 594,266" fill="#D4A017"/>

  <!-- Bottom legend -->
  <rect x="40" y="470" width="780" height="36" fill="#F5F5F5" rx="6"/>
  <circle cx="68" cy="488" r="6" fill="#1F3A5F"/>
  <text x="82" y="492" font-size="10" fill="#1F3A5F">AD GPO model</text>
  <circle cx="190" cy="488" r="6" fill="#C0392B"/>
  <text x="204" y="492" font-size="10" fill="#C0392B">Cloud migration gap</text>
  <circle cx="330" cy="488" r="6" fill="#1A9E8F"/>
  <text x="344" y="492" font-size="10" fill="#1A9E8F">OrgPath-derived enforcement</text>
  <line x1="490" y1="488" x2="516" y2="488" stroke="#D4A017" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="524" y="492" font-size="10" fill="#D4A017">Governance transition path</text>
</svg>
