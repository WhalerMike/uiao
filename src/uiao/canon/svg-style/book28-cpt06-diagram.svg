<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#1F3A5F">L0–L4 Actuation Ladder — PAM Governance (ADR-092)</text>
  <text x="430" y="50" text-anchor="middle" font-size="11" fill="#555555">Ascending response posture: observe → alert → ticket → block → autonomous remediation</text>

  <!-- Step dimensions: each step is 20px taller than previous, 130px wide, baseline at y=390 -->
  <!-- L0: x=40, top=310, h=80 -->
  <!-- L1: x=180, top=270, h=120 -->
  <!-- L2: x=320, top=230, h=160 -->
  <!-- L3: x=460, top=190, h=200 -->
  <!-- L4: x=600, top=150, h=240 -->

  <!-- Step L0 (navy) -->
  <rect x="40" y="310" width="130" height="80" rx="6" fill="#1F3A5F"/>
  <text x="105" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">L0</text>
  <text x="105" y="350" text-anchor="middle" font-size="10" fill="#ffffff">Observe</text>
  <text x="105" y="364" text-anchor="middle" font-size="9" fill="#ccddee">DRIFT event recorded</text>
  <text x="105" y="377" text-anchor="middle" font-size="9" fill="#ccddee">in audit stream</text>

  <!-- Step L1 (teal) -->
  <rect x="180" y="270" width="130" height="120" rx="6" fill="#1A9E8F"/>
  <text x="245" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">L1</text>
  <text x="245" y="310" text-anchor="middle" font-size="10" fill="#ffffff">Alert</text>
  <text x="245" y="325" text-anchor="middle" font-size="9" fill="#d0f4f0">DRIFT-CPM-STALE,</text>
  <text x="245" y="338" text-anchor="middle" font-size="9" fill="#d0f4f0">DRIFT-PRIV-SCOPE:</text>
  <text x="245" y="351" text-anchor="middle" font-size="9" fill="#d0f4f0">notify account</text>
  <text x="245" y="364" text-anchor="middle" font-size="9" fill="#d0f4f0">owner</text>

  <!-- Step L2 (teal) -->
  <rect x="320" y="230" width="130" height="160" rx="6" fill="#1A9E8F"/>
  <text x="385" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">L2</text>
  <text x="385" y="270" text-anchor="middle" font-size="10" fill="#ffffff">Ticket</text>
  <text x="385" y="285" text-anchor="middle" font-size="9" fill="#d0f4f0">ServiceNow</text>
  <text x="385" y="298" text-anchor="middle" font-size="9" fill="#d0f4f0">GOV-PRIV</text>
  <text x="385" y="311" text-anchor="middle" font-size="9" fill="#d0f4f0">auto-opened;</text>
  <text x="385" y="324" text-anchor="middle" font-size="9" fill="#d0f4f0">72h SLA</text>

  <!-- Step L3 (amber) -->
  <rect x="460" y="190" width="130" height="200" rx="6" fill="#D4A017"/>
  <text x="525" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">L3</text>
  <text x="525" y="230" text-anchor="middle" font-size="10" fill="#ffffff">Block / Quarantine</text>
  <text x="525" y="246" text-anchor="middle" font-size="9" fill="#fff8e0">PIM suspended;</text>
  <text x="525" y="259" text-anchor="middle" font-size="9" fill="#fff8e0">vault safe locked</text>
  <!-- Federal ceiling badge -->
  <rect x="473" y="272" width="104" height="18" rx="4" fill="#ffffff" opacity="0.25"/>
  <text x="525" y="285" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Federal default ceiling</text>

  <!-- Step L4 (red, dashed border) -->
  <rect x="600" y="150" width="130" height="240" rx="6" fill="#C0392B" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="665" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">L4</text>
  <text x="665" y="190" text-anchor="middle" font-size="10" fill="#ffffff">Autonomous</text>
  <text x="665" y="203" text-anchor="middle" font-size="10" fill="#ffffff">Remediation</text>
  <text x="665" y="220" text-anchor="middle" font-size="9" fill="#ffd5d0">account disabled;</text>
  <text x="665" y="233" text-anchor="middle" font-size="9" fill="#ffd5d0">CPM forced</text>
  <!-- ADR override badge -->
  <rect x="613" y="248" width="104" height="18" rx="4" fill="#ffffff" opacity="0.25"/>
  <text x="665" y="261" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">ADR override required</text>

  <!-- Staircase baseline connector -->
  <line x1="40" y1="390" x2="730" y2="390" stroke="#cccccc" stroke-width="1.5"/>

  <!-- Step riser connectors (subtle lines showing staircase) -->
  <line x1="170" y1="310" x2="180" y2="310" stroke="#aaaaaa" stroke-width="1"/>
  <line x1="310" y1="270" x2="320" y2="270" stroke="#aaaaaa" stroke-width="1"/>
  <line x1="450" y1="230" x2="460" y2="230" stroke="#aaaaaa" stroke-width="1"/>
  <line x1="590" y1="190" x2="600" y2="190" stroke="#aaaaaa" stroke-width="1"/>

  <!-- Vertical dashed amber line between L3 and L4 -->
  <line x1="597" y1="135" x2="597" y2="395" stroke="#D4A017" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Federal ceiling label on the line -->
  <rect x="507" y="118" width="178" height="20" rx="4" fill="#fff8e0" stroke="#D4A017" stroke-width="1"/>
  <text x="596" y="132" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8a6200">Federal default ceiling (ADR-092)</text>

  <!-- DRIFT class default band -->
  <rect x="20" y="408" width="820" height="86" rx="6" fill="#f4f6fa" stroke="#cccccc" stroke-width="1"/>
  <text x="430" y="424" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1F3A5F">DRIFT Class Default Actuation Levels</text>

  <!-- DRIFT entries -->
  <!-- Row 1 -->
  <rect x="32" y="432" width="148" height="22" rx="4" fill="#C0392B" opacity="0.12"/>
  <text x="106" y="447" text-anchor="middle" font-size="9" font-weight="700" fill="#C0392B">DRIFT-PSM-BYPASS → L3</text>

  <rect x="192" y="432" width="148" height="22" rx="4" fill="#D4A017" opacity="0.15"/>
  <text x="266" y="447" text-anchor="middle" font-size="9" font-weight="700" fill="#8a6200">DRIFT-PTA-ALERT → L3</text>

  <rect x="352" y="432" width="148" height="22" rx="4" fill="#1A9E8F" opacity="0.12"/>
  <text x="426" y="447" text-anchor="middle" font-size="9" font-weight="700" fill="#117065">DRIFT-PRIV-NOCBA → L2</text>

  <rect x="512" y="432" width="148" height="22" rx="4" fill="#1A9E8F" opacity="0.12"/>
  <text x="586" y="447" text-anchor="middle" font-size="9" font-weight="700" fill="#117065">DRIFT-CPM-STALE → L1</text>

  <rect x="672" y="432" width="156" height="22" rx="4" fill="#1A9E8F" opacity="0.12"/>
  <text x="750" y="447" text-anchor="middle" font-size="9" font-weight="700" fill="#117065">DRIFT-ORPHAN-PRIV → L2</text>

  <!-- Row 2 annotation -->
  <text x="430" y="480" text-anchor="middle" font-size="9" fill="#777777">All levels are defaults; individual DRIFT-class overrides require ADR amendment. L4 is always opt-in.</text>

  <!-- Step level labels below baseline -->
  <text x="105" y="404" text-anchor="middle" font-size="9" fill="#888888">L0</text>
  <text x="245" y="404" text-anchor="middle" font-size="9" fill="#888888">L1</text>
  <text x="385" y="404" text-anchor="middle" font-size="9" fill="#888888">L2</text>
  <text x="525" y="404" text-anchor="middle" font-size="9" fill="#888888">L3</text>
  <text x="665" y="404" text-anchor="middle" font-size="9" fill="#888888">L4</text>
</svg>
