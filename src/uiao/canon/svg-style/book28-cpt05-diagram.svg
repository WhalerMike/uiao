<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- White background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Privileged user box (top center) -->
  <rect x="280" y="20" width="300" height="56" rx="6" fill="#1F3A5F"/>
  <text x="430" y="44" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Privileged user</text>
  <text x="430" y="62" text-anchor="middle" fill="#a8c4e0" font-size="11">(PIM-elevated, OrgPath-scoped)</text>

  <!-- Arrow down from user to PSM broker -->
  <line x1="430" y1="76" x2="430" y2="128" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <text x="445" y="107" fill="#1F3A5F" font-size="10">All privileged remote access (AC-17)</text>

  <!-- PSM session broker box -->
  <rect x="280" y="128" width="300" height="48" rx="6" fill="#1F3A5F"/>
  <text x="430" y="149" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">PSM session broker</text>
  <text x="430" y="166" text-anchor="middle" fill="#a8c4e0" font-size="10">CyberArk / BeyondTrust gateway</text>

  <!-- Arrow down-left from PSM to Session recording -->
  <line x1="380" y1="176" x2="190" y2="238" stroke="#1A9E8F" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- Arrow down-right from PSM to PTA analytics -->
  <line x1="480" y1="176" x2="670" y2="238" stroke="#1A9E8F" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- Session recording archive box (left) -->
  <rect x="60" y="238" width="260" height="62" rx="6" fill="#1A9E8F"/>
  <text x="190" y="260" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Session recording archive</text>
  <text x="190" y="276" text-anchor="middle" fill="#d0f0ec" font-size="10">keystroke + video, 365-day retention</text>
  <text x="190" y="290" text-anchor="middle" fill="#d0f0ec" font-size="10">(AU-3)</text>

  <!-- PTA behavioral analytics box (right) -->
  <rect x="540" y="238" width="260" height="62" rx="6" fill="#1A9E8F"/>
  <text x="670" y="260" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">PTA behavioral analytics</text>
  <text x="670" y="276" text-anchor="middle" fill="#d0f0ec" font-size="10">Anomaly detection, lateral movement</text>
  <text x="670" y="290" text-anchor="middle" fill="#d0f0ec" font-size="10">(AU-12)</text>

  <!-- Arrow from session recording down to SIEM -->
  <line x1="190" y1="300" x2="340" y2="360" stroke="#D4A017" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Arrow from PTA analytics down to SIEM -->
  <line x1="670" y1="300" x2="520" y2="360" stroke="#D4A017" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- SIEM feed box (amber, center) -->
  <rect x="255" y="360" width="350" height="48" rx="6" fill="#D4A017"/>
  <text x="430" y="381" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">SIEM feed — Splunk / Microsoft Sentinel</text>
  <text x="430" y="398" text-anchor="middle" fill="#fff8e6" font-size="10">Correlated alert stream</text>

  <!-- Arrow down from SIEM to DRIFT engine -->
  <line x1="430" y1="408" x2="430" y2="450" stroke="#1A9E8F" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- UIAO DRIFT engine box (teal, center) -->
  <rect x="220" y="450" width="420" height="52" rx="6" fill="#1A9E8F"/>
  <text x="430" y="472" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">UIAO DRIFT engine</text>
  <text x="430" y="490" text-anchor="middle" fill="#d0f0ec" font-size="10">PTA alert → DRIFT-PTA-ALERT P1</text>

  <!-- Bypass box (red, bottom-left) -->
  <rect x="24" y="415" width="196" height="72" rx="6" fill="#C0392B"/>
  <text x="122" y="437" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Direct RDP/SSH</text>
  <text x="122" y="452" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">without PSM</text>
  <text x="122" y="468" text-anchor="middle" fill="#ffd5ce" font-size="10">→ DRIFT-PSM-BYPASS P0</text>
  <!-- Crossed-out circle indicator -->
  <circle cx="122" cy="484" r="7" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="116" y1="478" x2="128" y2="490" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Dashed line from bypass box toward PSM area with X marker -->
  <line x1="220" y1="451" x2="282" y2="420" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- X mark near PSM -->
  <line x1="268" y1="406" x2="280" y2="418" stroke="#C0392B" stroke-width="2.5"/>
  <line x1="280" y1="406" x2="268" y2="418" stroke="#C0392B" stroke-width="2.5"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowNavy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1F3A5F"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1A9E8F"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D4A017"/>
    </marker>
  </defs>
</svg>
