<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <!-- UIAO 16:9 figure template (ADR-093). Palette: src/uiao/canon/svg-style/palette.json
       navy #0D1B2E · teal #1E8C8C · amber #D4A017 (severity only) · red #C0392B (loss)
       ice #EAF1FB (cloud boxes, navy border) · grey #5A5A5A · white background -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title (Georgia/serif, navy) -->
  <text x="60" y="84" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#0D1B2E">Figure title goes here</text>

  <!-- Example node (navy box, white centered label) -->
  <rect x="60" y="160" width="360" height="120" rx="10" fill="#0D1B2E"/>
  <text x="240" y="220" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#FFFFFF">Node label</text>

  <!-- Example cloud box (ice fill, navy border) -->
  <rect x="520" y="160" width="360" height="120" rx="10" fill="#EAF1FB" stroke="#0D1B2E" stroke-width="2"/>
  <text x="700" y="220" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#0D1B2E">Cloud box</text>

  <!-- Example connector (teal arrow) -->
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8C8C"/>
    </marker>
  </defs>
  <line x1="420" y1="220" x2="515" y2="220" stroke="#1E8C8C" stroke-width="3" marker-end="url(#arrow-teal)"/>
</svg>
