<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" style="font-family:'Segoe UI',Segoe,Arial,sans-serif;background:#ffffff;">
  <!-- Background -->
  <rect width="860" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1F3A5F">Book 28 · Chapter 1 — The PAM Gap</text>
  <text x="430" y="54" text-anchor="middle" font-size="12" fill="#555">AD-era implicit PAM → migration gaps → UIAO resolution</text>

  <!-- ═══════════════ LEFT COLUMN ═══════════════ -->
  <!-- Header -->
  <rect x="20" y="72" width="220" height="34" rx="6" fill="#1F3A5F"/>
  <text x="130" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">AD era (implicit)</text>

  <!-- Box L1 -->
  <rect x="20" y="118" width="220" height="74" rx="6" fill="#EBF0F7" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="130" y="141" text-anchor="middle" font-size="11" font-weight="600" fill="#1F3A5F">Shared domain admin</text>
  <text x="130" y="157" text-anchor="middle" font-size="11" font-weight="600" fill="#1F3A5F">credentials</text>
  <text x="130" y="175" text-anchor="middle" font-size="10" fill="#333">password known by multiple admins</text>

  <!-- Box L2 -->
  <rect x="20" y="210" width="220" height="74" rx="6" fill="#EBF0F7" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="130" y="233" text-anchor="middle" font-size="11" font-weight="600" fill="#1F3A5F">Elevation by group</text>
  <text x="130" y="249" text-anchor="middle" font-size="11" font-weight="600" fill="#1F3A5F">membership</text>
  <text x="130" y="267" text-anchor="middle" font-size="10" fill="#333">DA/EA groups grew by accretion,</text>
  <text x="130" y="279" text-anchor="middle" font-size="10" fill="#333">no time-bound</text>

  <!-- Box L3 -->
  <rect x="20" y="302" width="220" height="74" rx="6" fill="#EBF0F7" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="130" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="#1F3A5F">Service account</text>
  <text x="130" y="341" text-anchor="middle" font-size="11" font-weight="600" fill="#1F3A5F">rotation</text>
  <text x="130" y="359" text-anchor="middle" font-size="10" fill="#333">on manual calendar, if remembered</text>

  <!-- ═══════════════ CENTER COLUMN ═══════════════ -->
  <!-- Header -->
  <rect x="320" y="72" width="220" height="34" rx="6" fill="#D4A017"/>
  <text x="430" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">After migration (gaps)</text>

  <!-- Box C1 -->
  <rect x="320" y="118" width="220" height="74" rx="6" fill="#FDF5E6" stroke="#C0392B" stroke-width="2"/>
  <text x="430" y="141" text-anchor="middle" font-size="11" font-weight="600" fill="#C0392B">No vault</text>
  <text x="430" y="157" text-anchor="middle" font-size="10" fill="#333">credentials in spreadsheets</text>

  <!-- Box C2 -->
  <rect x="320" y="210" width="220" height="74" rx="6" fill="#FDF5E6" stroke="#C0392B" stroke-width="2"/>
  <text x="430" y="233" text-anchor="middle" font-size="11" font-weight="600" fill="#C0392B">No JIT elevation</text>
  <text x="430" y="249" text-anchor="middle" font-size="10" fill="#333">Global Admin assigned statically</text>

  <!-- Box C3 -->
  <rect x="320" y="302" width="220" height="74" rx="6" fill="#FDF5E6" stroke="#C0392B" stroke-width="2"/>
  <text x="430" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="#C0392B">CPM not wired</text>
  <text x="430" y="341" text-anchor="middle" font-size="10" fill="#333">rotation policy orphaned</text>

  <!-- ═══════════════ RIGHT COLUMN ═══════════════ -->
  <!-- Header -->
  <rect x="620" y="72" width="220" height="34" rx="6" fill="#1A9E8F"/>
  <text x="730" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">UIAO closes each gap</text>

  <!-- Box R1 -->
  <rect x="620" y="118" width="220" height="74" rx="6" fill="#E6F7F5" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="730" y="141" text-anchor="middle" font-size="11" font-weight="600" fill="#1A9E8F">CyberArk vault + safe ACLs</text>
  <text x="730" y="157" text-anchor="middle" font-size="10" fill="#333">(AC-6)</text>

  <!-- Box R2 -->
  <rect x="620" y="210" width="220" height="74" rx="6" fill="#E6F7F5" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="730" y="233" text-anchor="middle" font-size="11" font-weight="600" fill="#1A9E8F">Entra PIM JIT</text>
  <text x="730" y="249" text-anchor="middle" font-size="10" fill="#333">with OrgPath activation scope</text>

  <!-- Box R3 -->
  <rect x="620" y="302" width="220" height="74" rx="6" fill="#E6F7F5" stroke="#1A9E8F" stroke-width="1.5"/>
  <text x="730" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="#1A9E8F">CPM automated rotation</text>
  <text x="730" y="341" text-anchor="middle" font-size="10" fill="#333">as DRIFT class</text>

  <!-- ═══════════════ AD MIGRATION ARROW ═══════════════ -->
  <!-- Wide red arrow spanning left→center, placed below boxes -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C0392B"/>
    </marker>
  </defs>
  <rect x="90" y="406" width="280" height="36" rx="6" fill="#C0392B"/>
  <text x="230" y="429" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">▶  AD migration</text>
  <!-- Arrow line from rect to center col -->
  <line x1="370" y1="424" x2="318" y2="424" stroke="#C0392B" stroke-width="3" marker-end="url(#arrowRed)"/>

  <!-- ═══════════════ DASHED CONNECTING LINES ═══════════════ -->
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>

  <!-- Row 1: L1 center-right → C1 center-left, then C1 center-right → R1 center-left -->
  <line x1="240" y1="155" x2="320" y2="155" stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <line x1="540" y1="155" x2="620" y2="155" stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>

  <!-- Row 2: L2 → C2 → R2 -->
  <line x1="240" y1="247" x2="320" y2="247" stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <line x1="540" y1="247" x2="620" y2="247" stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>

  <!-- Row 3: L3 → C3 → R3 -->
  <line x1="240" y1="339" x2="320" y2="339" stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <line x1="540" y1="339" x2="620" y2="339" stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>

  <!-- ═══════════════ FOOTER ═══════════════ -->
  <text x="430" y="498" text-anchor="middle" font-size="10" fill="#888">UIAO · Book 28 · Identity Governance and PAM · Chapter 1 · The PAM Gap</text>
</svg>
