    ssot-mutation: never
    certificate-anchored: false
    object-identity-only: true
    ztmm-pillars:
      - identity
    references:
      - ADR-112
      - UIAO_196
      - ADR-059
      - ADR-054
      - ADR-040
    notes: >-
      L1 (observe only) scanner for federal AI identity governance per
      M-25-21 / EO 13960. Ingests the OMB Annual AI Use Case Inventory
      CSV and produces six drift finding types (ADR-112 §4, UIAO_196 §4):
      ai-agentic-ungoverned (P1), ai-shadow (P1), ai-ato-gap (P2),
      ai-no-orgpath (P2), ai-unowned (P2), ai-pii-no-pia (P2).
      Ships as open-source Python (uiao.governance.ai_inventory.scanner)
      and standalone PowerShell (Invoke-AIInventoryScan.ps1) — no managed
      service or external control plane required. OrgPath-governed path
      binds scanner output to the drift engine and ADR-054 ATO reciprocity
      when UIAO is deployed. Shadow AI detection requires known_registry_ids
      from sailpoint-machine-identity or IdM export.
      Operational guide:
      docs/customer-documents/operational-guides/ai-identity-governance/index.qmd.
      Book reference: docs/customer-documents/orgpath-narrative/Book_21.qmd.
      Activation: per-adapter ADR + governance-board decision.
