  # ──────────────────────────────────────────────────────────────────
  # FedRAMP AAN Evidence Catalog — slot binding
  # Binds Federal Application-Aware Networking (AAN) evidence artifacts to NIST
  # SP 800-53 Rev 5 controls and FedRAMP 20x KSI categories across surface slots
  # 1–7. Implemented at src/uiao/adapters/fedramp_aan_catalog/ (per-slot mapping
  # YAMLs under mappings/). The canonical concept anchor is ADR-066.
  # NOTE: the AAN series itself is EXTERNAL companion content for the federal
  # vertical (a ten-volume, ~66-book series), not UIAO canon — canon does not
  # depend on inbox/ paths; the corpus is the (external) evidence source this
  # adapter consumes, referenced here for provenance only.
  # ──────────────────────────────────────────────────────────────────

