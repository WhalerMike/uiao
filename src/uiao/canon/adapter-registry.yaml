# yaml-language-server: $schema=../schemas/adapter-registry/adapter-registry.schema.json
#
# UIAO Conformance Adapter Registry
# =================================
# Operational axis: `conformance` — read-only assessors that observe the state
# of a governed target and produce normalized findings without mutating the
# target. See ARCHITECTURE.md §3.2, §3.5, §16.4 and CONMON.md §3.
#
# Doctrinal axis (UIAO_003 §4.2–§4.7): five canonical classes — Identity,
# Telemetry, Policy, Enforcement, Integration. The `integration` class was
# added per resolved ODA-15 (2026-04-15) to cover change-making adapters;
# it is used by the paired modernization registry and is therefore NOT
# exercised by any entry in this conformance registry. Mapping below
# reflects the dominant mission role each conformance adapter plays:
#   * scubagear          → policy     (evaluates M365 state against SCuBA
#                                      OPA/Rego baseline policies)
#   * vuln-scan          → telemetry  (observes vulnerability state; produces
#                                      normalized timestamped records)
#   * stig-compliance    → policy     (evaluates config against STIG baselines)
#   * patch-state        → telemetry  (observes patch state; produces records)
#
# Four slots total in Phase 1. Only `scubagear` is active; the three remaining
# slots are reserved names for Phase 2+ expansion per ARCHITECTURE.md §3.5.
#
# Canon invariants enforced on every entry:
#   * gcc-boundary: gcc-moderate
#   * ssot-mutation: never
#   * certificate-anchored: true, except hr-duty-station-locpath (library
#     resolver with no adapter-owned transport yet — see its notes; same
#     basis as the ADR-098 identity adapters in the pair registry)
#   * object-identity-only: true
#
# Pair registry: canon/modernization-registry.yaml (modernization class)
# Schema:        schemas/adapter-registry/adapter-registry.schema.json
# Program:       CONMON.md (Continuous Monitoring Program)

schema-version: "1.0.0"
registry-class: conformance
updated: "2026-07-03"

adapters:

  - id: scubagear
    name: CISA ScubaGear (M365 SCuBA Assessor)
    class: conformance
    mission-class: policy
    status: active
    phase: phase-1
    vendor: CISA
    license: CC0-1.0
    runtime: powershell-7.4
    runtime-version: "1.5.1"
    runner-class: github-hosted
    tenancy: per-customer
    policy-engine: opa-rego
    policy-pin: main
    scope:
      - aad
      - defender
      - exo
      - powerbi
      - powerplatform
      - sharepoint
      - teams
    outputs:
      - findings.json
      - metadata.json
      - scubagear-report.html
      - scubagear-report.json
    triggers:
      - workflow_dispatch
      - repository_dispatch
      - schedule
    evidence-class: interval
    retention-years: 3
    freshness-window-hours: 168
    controls:
      - CA-2
      - CA-5
      - CA-7
      - CM-6
      - CM-8
      - RA-5
    automation-domain:
      - configuration-management
    gcc-boundary: gcc-moderate
    ssot-mutation: never
    certificate-anchored: true
    trust-anchor:
      subject: "CN=DigiCert Global Root G2, OU=www.digicert.com, O=DigiCert Inc, C=US"
    object-identity-only: true
    ztmm-pillars:
      - identity
      - applications-and-workloads
      - data
    references:
      - UIAO-CANON-002
      - UIAO-CANON-003
      - ADR-025
      - ADR-043
      - UIAO_132
      - https://github.com/cisagov/ScubaGear
      - https://github.com/FedRAMP/community/discussions/130
    notes: >-
      Paired with modernization adapter `scuba` (canon/modernization-registry.yaml)
      which applies the baseline that ScubaGear assesses. Pin policy: track main
      + monthly pin bump as Routine Recurring Change per CONMON.md §6.


      fedramp-rfc-0026 (advisory; promotion to schema pending RFC ratification,
      per ADR-043 D4 / UIAO_132 §5):
        requirement: RV5-CA07-VLN (service config scan) and RV5-CA07-CCM (SCuBA-baseline evidence at drop)
        pathway: pathway-2-traditional
        planned-pathway: pathway-1-modernized
        pathway-transition-trigger: Publication of the VDR Balance Improvement Release
        adr: ADR-043
        drift-continuity: scubagear is point-in-time; continuity materialized
          by the Drift Engine (UIAO_110) as DRIFT-POLICY findings between runs
          per UIAO_132 §4 (BOD 25-01 answer).
    implementation:
      python_module: src/uiao/adapters/scubagear_adapter.py
      tests: tests/test_scubagear_adapter.py

