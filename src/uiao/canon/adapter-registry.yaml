    gcc-boundary: gcc-moderate
    ssot-mutation: never
    certificate-anchored: true
    trust-anchor:
      subject: "CN=DigiCert Global Root G2, OU=www.digicert.com, O=DigiCert Inc, C=US"
    object-identity-only: true
    ztmm-pillars:
      - devices
      - applications-and-workloads
    references:
      - ADR-120
      - https://learn.microsoft.com/mem/intune/configuration/group-policy-analytics
    notes: >-
      Read-mostly Graph adapter over the Intune `groupPolicyMigrationReports`
      surface. Pairs with the offline Phase-1 GPO parser
      (`uiao.adapters.modernization.active_directory.gpo_analytics`): the parser
      owns the gpreport.xml inventory + a coarse type-based portability
      heuristic; this adapter supplies Microsoft's authoritative per-setting
      `isMdmSupported` verdict, which `apply_mdm_verdicts` joins onto the
      inventory. We CONSUME Microsoft's GPO→CSP crosswalk; we do not rebuild it
      (ADR-120). The `createMigrationReport` action writes a transient analysis
      object, so the Graph permission is DeviceManagementConfiguration.ReadWrite.All;
      no governed customer object is mutated (ssot-mutation: never).
    implementation:
      python_module: src/uiao/adapters/intune_gpo_analytics.py
      tests: tests/test_intune_gpo_analytics.py

