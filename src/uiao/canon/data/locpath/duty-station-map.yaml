# yaml-language-server: $schema=../../../schemas/locpath/duty-station-map.schema.json
#
# UIAO LocPath Reference Duty-Station Map
# =======================================
# Canonical source: src/uiao/canon/UIAO_194_LocPath_Codebook.md
# Binding ADR:      src/uiao/canon/adr/adr-102-locpath-location-addressing.md
# Schema:           src/uiao/schemas/locpath/duty-station-map.schema.json (v1.0.0)
# Pair registry:    src/uiao/canon/data/locpath/location-registry.yaml
#
# This file is the executable form of the UIAO_194 duty-station ->
# LocPath mapping table for the reference location registry — the
# canonical worked example, NOT deployment data. It exists so the HR
# duty-station assignment adapter (uiao.modernization.locpath.hr_assign)
# and its tests have a governed, schema-validated mapping to exercise.
# Agency maps are loaded from their own paths with the same contract
# and status `active`, paired with the agency's location registry.
#
# Per ADR-102 §D3 (extending ADR-088), the HR system of record is the
# authoritative source for a person's assigned place; this map is the
# governed translation from the HR locationCode vocabulary to canonical
# LocPath. Every target must resolve in the paired registry at Site
# level or deeper (ADR-102 §D1). Boundary: Moderate/Commercial only.

schema_version: "1.0.0"
document_id: UIAO_194
map_id: reference
display_name: "UIAO Reference Duty-Station Map (UIAO_194 worked example)"
status: reference
description: >-
  Executable form of the UIAO_194 worked example's duty-station
  vocabulary: the HQ campus codes an HR system of record would carry in
  Spec2-D1.1 locationCode, mapped to the reference location registry.
updated: "2026-06-11"

entries:
  - locationCode: HQ
    locPath: /USA/MD/ANNAPOLIS-HQ
    description: "Headquarters campus — site-level assignment"
  - locationCode: HQ-B3
    locPath: /USA/MD/ANNAPOLIS-HQ/BLDG-3
    description: "Headquarters Building 3 (the UIAO_194 worked-example duty station)"
  - locationCode: HQ-B3-210
    locPath: /USA/MD/ANNAPOLIS-HQ/BLDG-3/FL-2/RM-210
    description: "Headquarters Building 3, Room 210 — space-level assignment"
