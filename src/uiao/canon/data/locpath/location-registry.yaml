# yaml-language-server: $schema=../../../schemas/locpath/location-registry.schema.json
#
# UIAO LocPath Reference Location Registry
# ========================================
# Canonical source: src/uiao/canon/UIAO_194_LocPath_Codebook.md
# Binding ADR:      src/uiao/canon/adr/adr-102-locpath-location-addressing.md
# Envelope schema:  src/uiao/schemas/locpath/location-registry.schema.json (v1.0.0)
# Node schema:      src/uiao/schemas/locpath/location.schema.json
#
# This file is the executable form of the UIAO_194 worked example — the
# canonical reference registry, NOT deployment data. It exists so the
# loader (uiao.modernization.locpath), the drift engine, and adapter
# tests have a governed, schema-validated location hierarchy to exercise.
# Agency location registries are loaded from their own paths with the
# same envelope + node contract and status `active`.
#
# UIAO_194 is the narrative canon; this YAML is the executable SSOT for
# the reference hierarchy. When they disagree, ADR process governs
# reconciliation — never edit this file without a governed PR.
#
# All values are illustrative (fictional agency campus, per UIAO_194
# §Worked example). Boundary: Moderate/Commercial only (ADR-102).

schema_version: "1.0.0"
document_id: UIAO_194
registry_id: reference
display_name: "UIAO Reference Location Registry (UIAO_194 worked example)"
status: reference
description: >-
  Executable form of the UIAO_194 worked example: one fictional
  headquarters campus expressed at every hierarchy level
  (Country -> Region -> Site -> Building -> Floor -> Space), with the
  Site carrying the network/TIC 3.0 and telemetry/service-boundary
  classification blocks and the deeper nodes carrying E911
  dispatchable-location attributes.
updated: "2026-06-11"

nodes:
  - locPathId: "9b1c5a40-22e4-4a31-8b51-000000000001"
    locPath: /USA
    displayName: "United States"
    level: Country
    status: Active
    lastUpdated: "2026-06-11T00:00:00Z"
    sourceSystem: reference-example

  - locPathId: "9b1c5a40-22e4-4a31-8b51-000000000002"
    locPath: /USA/MD
    displayName: "Maryland"
    level: Region
    status: Active
    lastUpdated: "2026-06-11T00:00:00Z"
    sourceSystem: reference-example

  # Site is the minimum governance unit (ADR-102 §D1): DIA approval,
  # telemetry boundary, and SD-WAN classification resolve here.
  - locPathId: "9b1c5a40-22e4-4a31-8b51-000000000003"
    locPath: /USA/MD/ANNAPOLIS-HQ
    displayName: "Headquarters Campus, Annapolis"
    level: Site
    status: Active
    lastUpdated: "2026-06-11T00:00:00Z"
    sourceSystem: reference-example
    e911:
      civicAddress: "100 Main Street, Annapolis, MD 21401"
    network:
      diaApproved: true
      sdwanBreakoutType: Local
      ticCapabilityTier: Tier-1
      legacyMplsStatus: Decommissioning
    boundaries:
      telemetryBoundary: GCCAllowed
      serviceAccessBoundary: Full
      boundaryEnforcementLevel: Monitored

  - locPathId: "9b1c5a40-22e4-4a31-8b51-000000000004"
    locPath: /USA/MD/ANNAPOLIS-HQ/BLDG-3
    displayName: "Headquarters Building 3"
    level: Building
    status: Active
    lastUpdated: "2026-06-11T00:00:00Z"
    sourceSystem: reference-example
    e911:
      civicAddress: "100 Main Street, Annapolis, MD 21401"
      locationDescription: "Building 3"

  - locPathId: "9b1c5a40-22e4-4a31-8b51-000000000005"
    locPath: /USA/MD/ANNAPOLIS-HQ/BLDG-3/FL-2
    displayName: "Headquarters Building 3, Floor 2"
    level: Floor
    status: Active
    lastUpdated: "2026-06-11T00:00:00Z"
    sourceSystem: reference-example
    e911:
      civicAddress: "100 Main Street, Annapolis, MD 21401"
      floor: "2"
      locationDescription: "Building 3, 2nd Floor"

  - locPathId: "9b1c5a40-22e4-4a31-8b51-000000000006"
    locPath: /USA/MD/ANNAPOLIS-HQ/BLDG-3/FL-2/RM-210
    displayName: "Headquarters Building 3, Room 210"
    level: Space
    status: Active
    lastUpdated: "2026-06-11T00:00:00Z"
    sourceSystem: reference-example
    e911:
      # MLTS/UCaaS presence: 911 can be dialed from this room, so a
      # complete § 9.16 dispatchable location is governed here (ADR-104
      # E911 Compliance Layer). civicAddress inherits from the Site; floor
      # and room are carried locally.
      dispatchableLocationRequired: true
      civicAddress: "100 Main Street, Annapolis, MD 21401"
      floor: "2"
      room: "RM-210"
      locationDescription: "Building 3, West Wing, 2nd Floor, Room 210"
