# yaml-language-server: $schema=../../../../schemas/orgpath/binding-profile.schema.json
#
# UIAO OrgPath Binding Profile — ldap
# ===================================
# Canonical source: src/uiao/canon/UIAO_193_OrgPath_MultiCloud_Binding.md §ldap
# Binding ADR:      src/uiao/canon/adr/adr-098-orgpath-vendor-neutral-binding-profiles.md

schema_version: "1.0.0"
document_id: UIAO_193
profile_id: ldap
display_name: "Generic LDAP — schema-extension auxiliary objectClass"
status: proposed
boundary: commercial
planes: [identity]
endpoint_resolution: "directory host/port from operator config (commercial/on-prem only)"
notes: >-
  Default binding mode is schema-extension: a governed auxiliary
  objectClass (uiaoOrgPath) exposing one attribute per facet, named
  uiaoOrgPath<Facet>. For directories where schema extension is not
  permitted, the reserved-attribute mode maps facets onto unused standard
  attributes via a tenant locator-override table (operator configuration,
  not a canon change), with priority overflow when fewer attributes are
  available than facets. Red Hat IdM (FreeIPA / 389 Directory Server) is
  served by this profile in schema-extension mode.

facet_bindings:
  - { facet: region,          locator: uiaoOrgPathRegion,         locator_kind: attribute, writable: true }
  - { facet: department,      locator: uiaoOrgPathDepartment,     locator_kind: attribute, writable: true }
  - { facet: division,        locator: uiaoOrgPathDivision,       locator_kind: attribute, writable: true }
  - { facet: role,            locator: uiaoOrgPathRole,           locator_kind: attribute, writable: true }
  - { facet: cost_center,     locator: uiaoOrgPathCostCenter,     locator_kind: attribute, writable: true }
  - { facet: classification,  locator: uiaoOrgPathClassification, locator_kind: attribute, writable: true }
  - { facet: hire_date,       locator: uiaoOrgPathHireDate,       locator_kind: attribute, writable: true }
  - { facet: term_date,       locator: uiaoOrgPathTermDate,       locator_kind: attribute, writable: true }
  - { facet: clearance_level, locator: uiaoOrgPathClearanceLevel, locator_kind: attribute, writable: true }
  - { facet: account_type,    locator: uiaoOrgPathAccountType,    locator_kind: attribute, writable: true }
