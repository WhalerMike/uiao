# yaml-language-server: $schema=../../../../schemas/orgpath/binding-profile.schema.json
#
# UIAO OrgPath Binding Profile — keycloak
# =======================================
# Canonical source: src/uiao/canon/UIAO_193_OrgPath_MultiCloud_Binding.md §keycloak
# Binding ADR:      src/uiao/canon/adr/adr-099-orgpath-idp-binding-profile-expansion.md
#                   (amends adr-098-orgpath-vendor-neutral-binding-profiles.md)

schema_version: "1.0.0"
document_id: UIAO_193
profile_id: keycloak
display_name: "Keycloak / Red Hat build of Keycloak — user attributes"
status: proposed
boundary: commercial
planes: [identity]
endpoint_resolution: "Keycloak realm admin REST endpoint from operator config (resolved, never hardcoded)"
notes: >-
  The open-source counterpart to the okta profile. Keycloak user attributes
  are arbitrary key/values, so all named facets bind natively with no
  overflow. Attribute keys are named for the facets (snake_case). Protocol
  mappers carry facets into OIDC/SAML tokens per UIAO_193 §Facet carriage;
  this profile governs user-attribute storage only.

facet_bindings:
  - { facet: region,          locator: region,          locator_kind: custom_attribute, writable: true }
  - { facet: department,      locator: department,      locator_kind: custom_attribute, writable: true }
  - { facet: division,        locator: division,        locator_kind: custom_attribute, writable: true }
  - { facet: role,            locator: role,            locator_kind: custom_attribute, writable: true }
  - { facet: cost_center,     locator: cost_center,     locator_kind: custom_attribute, writable: true }
  - { facet: classification,  locator: classification,  locator_kind: custom_attribute, writable: true }
  - { facet: hire_date,       locator: hire_date,       locator_kind: custom_attribute, writable: true }
  - { facet: term_date,       locator: term_date,       locator_kind: custom_attribute, writable: true }
  - { facet: clearance_level, locator: clearance_level, locator_kind: custom_attribute, writable: true }
  - { facet: account_type,    locator: account_type,    locator_kind: custom_attribute, writable: true }
