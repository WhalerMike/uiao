# OrgTree Administrative Unit Registry — Model C (ADR-037 / ADR-084)
#
# Starter registry of canonical Entra AUs, each composed from per-facet
# predicates. Per UIAO_154 v3.0 every UIAO-managed AU is Restricted
# Management — Global Administrators cannot manage AU members without
# an explicit AU-scoped role assignment.
schema_version: "1.0.0"
registry_version: "1.0.0"
generated_date: "2026-05-26T00:00:00Z"

units:
  - name: AU-Department-IT
    description: IT department AU
    restricted_management: true
    composition:
      predicates:
        - { facet: department, op: -eq, value: IT }
    scoped_roles:
      - { role: User Administrator, delegate: IT Division Lead }
      - { role: Groups Administrator, delegate: IT Operations Manager }

  - name: AU-Department-HR
    description: HR department AU
    restricted_management: true
    composition:
      predicates:
        - { facet: department, op: -eq, value: HR }
    scoped_roles:
      - { role: User Administrator, delegate: HR Director }

  - name: AU-IT-CyberOps
    description: IT/CyberOps division AU for helpdesk + group management
    restricted_management: true
    composition:
      predicates:
        - { facet: department, op: -eq, value: IT }
        - { facet: division, op: -eq, value: CyberOps }
    scoped_roles:
      - { role: Helpdesk Administrator, delegate: CyberOps Manager }
      - { role: Groups Administrator, delegate: CyberOps Lead Engineer }

  - name: AU-NCR-Privileged
    description: NCR privileged accounts AU for PAM operators
    restricted_management: true
    composition:
      predicates:
        - { facet: region, op: -eq, value: NCR }
        - { facet: account_type, op: -eq, value: Privileged }
    scoped_roles:
      - { role: Authentication Administrator, delegate: NCR PAM Steward }
      - { role: Conditional Access Administrator, delegate: NCR Identity Architect }

  - name: AU-Cleared-TopSecret-Plus
    description: TS / TS-SCI cleared personnel AU for personnel security office
    restricted_management: true
    composition:
      predicates:
        - { facet: clearance_level, op: -in, value: [TopSecret, TS_SCI] }
    scoped_roles:
      - { role: User Administrator, delegate: Personnel Security Office }
      - { role: Conditional Access Administrator, delegate: Personnel Security Office }
