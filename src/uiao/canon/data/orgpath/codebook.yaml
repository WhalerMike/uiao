# yaml-language-server: $schema=../../../schemas/orgpath/codebook.schema.json
#
# UIAO OrgPath Codebook — Model C (15-facet multi-attribute)
# ==========================================================
# Canonical source: src/uiao/canon/UIAO_151_OrgPath_Codebook.md
# Binding ADR:      src/uiao/canon/adr/adr-078-orgpath-attribute-schema-15-facet.md
# Schema:           src/uiao/schemas/orgpath/codebook.schema.json (v2.0.0)
# Supersedes:       Model A composite-hyphen path (single attribute). See
#                   ADR-078 §Decision for the rationale. Per ADR-078's
#                   no-grandfathering update (2026-05-23), the prior
#                   Model A codebook is not preserved as a legacy file —
#                   UIAO has no production adopters at ratification time.
#
# This file is the executable canon the drift engine, OrgPath assignment
# adapter, and Entra device adapter consume at runtime. UIAO_151 is the
# narrative canon; this YAML is the SSOT. When they disagree, ADR
# process governs reconciliation — never edit this file without a
# governed PR.
#
# Boundary: GCC-Moderate. Each facet value lives in a single
# `onPremisesExtensionAttribute` slot (1-15) on the Entra ID directory
# object. Dynamic group rules, Administrative Unit memberships, and
# Conditional Access policies compose facet values via boolean
# operators rather than text-parsing a composite string.

schema_version: "2.0.0"
document_id: UIAO_151
parent_canon: UIAO_007
model: "C"
adoption_tier_min: 3
updated: "2026-05-23"

# Each facet is a semantic field bound to exactly one
# onPremisesExtensionAttribute slot. The 10 named facets below are
# canonical and MUST NOT have their slot assignments changed without a
# superseding ADR. Slots 11-15 are reserved for tenant-specific
# extensions; tenants declare facet semantics for those via a governed
# PR before populating values.
#
# Projection subset (ADR-121): `projected: false` keeps a facet's
# semantics (HR-SSOT / reporting / JML lifecycle) WITHOUT stamping it to
# a scarce directory slot. Only projected facets are written per object,
# so "attributes written per object" = the projected count, not the
# defined count. Default is `projected: true` (omitted on projected
# facets). Currently projected (6): region, department, division,
# classification, clearance_level, account_type. Not projected (4): role,
# cost_center, hire_date, term_date. The 15 extensionAttribute slots are a
# shared, tenant-wide resource; projecting fewer leaves slots free for
# other tooling and avoids the hybrid-synced read-only-in-cloud trap on
# users. To go to a 4-facet projection, demote division and
# clearance_level too — but that drops the cleared-only and
# division-scoped policies in the shipped libraries, a capability
# decision (see ADR-121 §Consequences).
#
# Facet kinds:
#   - enumerated: a closed list of valid values, each with a
#     description. The drift engine rejects any value not in the
#     enumeration as DRIFT-SEMANTIC (value drift).
#   - typed: an open set of values constrained only by a `value_type`
#     (date, string) and optional `value_pattern` regex. Lifecycle date
#     facets (HireDate, TermDate) use this kind because dates cannot be
#     enumerated.
#   - reserved: no semantic declared yet. Tenants opting in must add
#     a per-tenant facet declaration via a governed PR.

facets:

  region:
    attribute: extensionAttribute1
    description: >-
      Geographic or cloud region where the principal is administratively
      anchored. Determines region-scoped Conditional Access targeting and
      regional dynamic group membership.
    kind: enumerated
    enumeration:
      - { value: NCR,      description: National Capital Region }
      - { value: EASTUS,   description: Eastern United States }
      - { value: WESTUS,   description: Western United States }
      - { value: CENTRAL,  description: Central United States }
      - { value: EMEA,     description: Europe / Middle East / Africa }
      - { value: APAC,     description: Asia-Pacific }
      - { value: LATAM,    description: Latin America }

  department:
    attribute: extensionAttribute2
    description: >-
      Top-level organizational department. Drives department-scoped
      Administrative Unit delegation and persona Conditional Access
      policies.
    kind: enumerated
    enumeration:
      - { value: IT,           description: Information Technology }
      - { value: HR,           description: Human Resources }
      - { value: Finance,      description: Finance }
      - { value: Legal,        description: Legal / Compliance }
      - { value: Engineering,  description: Engineering }
      - { value: Operations,   description: Operations }
      - { value: Sales,        description: Sales / Marketing }
      - { value: Executive,    description: Executive / Leadership }

  division:
    attribute: extensionAttribute3
    description: >-
      Sub-department division. Refines the Department facet for finer-
      grained dynamic groups and AU scoping (e.g., IT/CyberOps vs
      IT/InfraOps).
    kind: enumerated
    enumeration:
      - { value: CyberOps,  description: Cybersecurity Operations }
      - { value: InfraOps,  description: Infrastructure Operations }
      - { value: AppDev,    description: Application Development }
      - { value: GRC,       description: "Governance, Risk, and Compliance" }
      - { value: Service,   description: Service Desk / Support }
      - { value: Data,      description: Data / Analytics }
      - { value: Cloud,     description: Cloud Engineering }
      - { value: Identity,  description: Identity and Access }

  role:
    attribute: extensionAttribute4
    # Not projected (ADR-121): no shipped dynamic-group / policy-target / AU
    # rule targets role today. Kept as a defined facet (HR-SSOT / reporting);
    # re-project via a governed PR when a rule needs it.
    projected: false
    description: >-
      Principal's functional role. Used by Conditional Access policies
      that target role tiers (e.g., privileged action requires Director
      role plus Privileged AccountType).
    kind: enumerated
    enumeration:
      - { value: Analyst,    description: Analyst / Individual Contributor }
      - { value: Engineer,   description: Engineer }
      - { value: Architect,  description: Architect }
      - { value: Manager,    description: Manager }
      - { value: Director,   description: Director }
      - { value: VP,         description: Vice President }
      - { value: CISO,       description: Chief Information Security Officer }
      - { value: CIO,        description: Chief Information Officer }
      - { value: CTO,        description: Chief Technology Officer }

  cost_center:
    attribute: extensionAttribute5
    # Not projected (ADR-121): chargeback/reporting data, not a directory
    # targeting key — belongs in the HR source of truth, not a scarce slot.
    projected: false
    description: >-
      Cost center code used for chargeback reporting and license
      assignment governance. Tenant-specific prefix; the codebook ships
      starter codes and tenants extend via governed PRs.
    kind: enumerated
    enumeration:
      - { value: CC-4100, description: IT — Infrastructure }
      - { value: CC-4200, description: IT — Security }
      - { value: CC-4300, description: IT — Application Development }
      - { value: CC-5100, description: HR — Talent Acquisition }
      - { value: CC-5200, description: HR — Benefits }
      - { value: CC-6100, description: Finance — Accounts Payable }
      - { value: CC-6200, description: Finance — Accounts Receivable }
      - { value: CC-7100, description: Legal — Compliance }
      - { value: CC-8100, description: Operations — Facilities }
      - { value: CC-8300, description: Operations — Logistics }
      - { value: CC-9100, description: Executive }

  classification:
    attribute: extensionAttribute6
    description: >-
      Workforce classification. Drives persona-based Conditional Access
      policies, license-tier eligibility, and lifecycle-workflow choice
      (Employee joiner vs Contractor joiner).
    kind: enumerated
    enumeration:
      - { value: Employee,    description: Full-time employee }
      - { value: PartTime,    description: Part-time employee }
      - { value: Contractor,  description: Contractor / vendor }
      - { value: Intern,      description: Intern }
      - { value: Executive,   description: Executive }
      - { value: Volunteer,   description: Volunteer }

  hire_date:
    attribute: extensionAttribute7
    # Not projected (ADR-121): a lifecycle date consumed by joiner/mover/leaver
    # (JML) automation, not a dynamic-group equality key. Kept defined; the
    # date lives with the JML workflow, not a directory slot.
    projected: false
    description: >-
      ISO 8601 date the principal entered the organization. Drives
      joiner-lifecycle automation (group memberships, license grants,
      training assignments scheduled relative to HireDate).
    kind: typed
    value_type: date
    value_pattern: "^\\d{4}-\\d{2}-\\d{2}$"

  term_date:
    attribute: extensionAttribute8
    # Not projected (ADR-121): leaver lifecycle date — JML automation input,
    # not a dynamic-group key. Kept defined; lives with the JML workflow.
    projected: false
    description: >-
      ISO 8601 date the principal will exit (or did exit) the
      organization. Empty string for active employees. Drives leaver-
      lifecycle automation (access revocation, mailbox conversion,
      device wipe scheduled relative to TermDate).
    kind: typed
    value_type: date
    value_pattern: "^(\\d{4}-\\d{2}-\\d{2})?$"
    allow_empty: true

  clearance_level:
    attribute: extensionAttribute9
    description: >-
      Personnel security clearance level. Gates application access for
      cleared-only workloads via Conditional Access composition
      (clearance + role + region).
    kind: enumerated
    enumeration:
      - { value: None,         description: No clearance required / not applicable }
      - { value: PublicTrust,  description: Public Trust }
      - { value: Secret,       description: Secret }
      - { value: TopSecret,    description: Top Secret }
      - { value: TS_SCI,       description: Top Secret / Sensitive Compartmented Information }

  account_type:
    attribute: extensionAttribute10
    description: >-
      Account category. Distinguishes standard user accounts from
      privileged-access workstations, service principals, and shared
      mailboxes for PIM-eligibility and dynamic group composition.
    kind: enumerated
    enumeration:
      - { value: Standard,       description: Standard user account }
      - { value: Privileged,     description: Privileged account (PIM-eligible) }
      - { value: Service,        description: Service account / non-human }
      - { value: SharedMailbox,  description: Shared mailbox identity }
      - { value: Guest,          description: External guest (B2B) }
      - { value: Vendor,         description: Vendor / external party }

  reserved_11:
    attribute: extensionAttribute11
    description: >-
      Reserved for tenant-specific extension. Declare facet semantics
      (rename this entry, set kind + enumeration / typed) via a
      governed PR before populating values in the tenant.
    kind: reserved

  reserved_12:
    attribute: extensionAttribute12
    description: >-
      Reserved for tenant-specific extension. See reserved_11.
    kind: reserved

  reserved_13:
    attribute: extensionAttribute13
    description: >-
      Reserved for tenant-specific extension. See reserved_11.
    kind: reserved

  reserved_14:
    attribute: extensionAttribute14
    description: >-
      Reserved for tenant-specific extension. See reserved_11.
    kind: reserved

  reserved_15:
    attribute: extensionAttribute15
    description: >-
      Reserved for tenant-specific extension. See reserved_11.
    kind: reserved

# Deprecated values, per-facet. A principal carrying a deprecated value
# generates DRIFT-SEMANTIC findings; `replaced_by` is the governed
# successor the drift engine proposes during remediation. Schema permits
# the section to be absent or empty.
deprecated: {}
