- id: UIAO-FIG-012
  slug: orgpath-storage-topology
  title: OrgPath Storage Topology — HR, Entra ID, and the Codebook
  description: 'Architecture diagram that answers "where does OrgPath data live?" by showing the three storage layers and the one-directional data flow between them: the HR system (authority) feeds a provisioning pipeline that writes extensionAttribute1 on every Entra ID principal (assignment), while a Git-versioned Codebook (vocabulary) is read by the Drift Engine to validate every assigned value. Downstream governance consumers — Dynamic Groups, Administrative Units, Conditional Access, Licensing — read the assignment from Entra ID.'
