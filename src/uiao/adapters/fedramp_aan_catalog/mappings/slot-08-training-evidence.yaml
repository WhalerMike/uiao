# AAN Evidence Binding — Surface Slot 8: Training and Education Control Plane
#
# Maps Federal AAN Part 15 artifacts to NIST SP 800-53 Rev 5 controls
# and FedRAMP 20x KSI-CED rule (KSI-CED-RAT).
#
# Part 15 is the final Federal AAN book. It closes the last scaffold KSI
# (KSI-022 / KSI-CED-RAT) by delivering: role-based training matrices for
# six high-risk tiers, general all-employee awareness program, secure-delivery
# training, IR/DR drill documentation, and the machine-readable LMS
# training-effectiveness-record JSON schema (governance.training-effectiveness-record)
# that the Conformance Adapter evaluates.
#
# After this slot, all 29 CR26 KSIs are evaluable at high confidence.
#
# Governing roadmap: docs/customer-documents/orgcomp-series/federal-orgcomp-conmon-gap-roadmap.md
# Phase 3 target (November 2026): KSI-022 (KSI-CED-RAT) → active, high confidence

version: "0.1.0"
status: active
slot: training
slot_id: 8
generated_at: "2026-07-04"
ksi_category: KSI-CED
nist_anchor: "AT-2 / AT-3 / AT-4"

# -----------------------------------------------------------------------
# AAN artifact references for this slot
# -----------------------------------------------------------------------

artifacts:
  - id: aan-part-15
    title: "Cybersecurity Awareness and Training Program"
    path: "docs/customer-documents/orgcomp-series/Vol_IV_Book_05_OrgComp_Cybersecurity_Training_Awareness.qmd"
    aan_part: 15
    series: Federal AAN
    controls_closed:
      - AT-2
      - "AT-2(1)"
      - "AT-2(2)"
      - AT-3
      - "AT-3(3)"
      - "AT-3(5)"
      - AT-4
      - CP-3
      - IR-2

# -----------------------------------------------------------------------
# Evidence bindings: KSI rule → artifact(s) that satisfy it
# -----------------------------------------------------------------------

bindings:

  # KSI-CED-RAT: Full four-dimension training program from Part 15.
  #
  # The four required dimensions per CR26 KSI-CED-RAT:
  #   1. General all-employee security awareness (AT-2/AT-2(1)/AT-2(2))
  #   2. Role-specific training for six high-risk tiers (AT-3/AT-3(3)/AT-3(5))
  #   3. Secure-delivery training for dev/eng staff (AT-3(3)/SA-16)
  #   4. IR/DR training for incident-response and recovery personnel (IR-2/CP-3)
  #
  # Machine-readable evidence: governance.training-effectiveness-record JSON schema
  # exported from the LMS via Microsoft Viva Learning Graph API (AT-4 retention
  # records) and evaluated against >=95% completion threshold per role tier.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-CED
    cr26_controls: [KSI-CED-RAT]
    nist_controls: [AT-2, "AT-2(1)", "AT-2(2)", AT-3, "AT-3(3)", "AT-3(5)", AT-4, CP-3, IR-2]
    artifact_refs: [aan-part-15]
    confidence: high
    rationale: >-
      Part 15 delivers the complete four-dimension training program required by
      KSI-CED-RAT. Dimension 1 (general awareness): AT-2/AT-2(1) annual refresher
      with phishing simulation (AT-2(2)) — all employees; evidence is LMS enrollment
      record with >=95% completion. Dimension 2 (role-specific): AT-3 role-based
      training matrices for six high-risk tiers (sysadmins, privileged access users,
      developers, IR responders, data stewards, executives) with AT-3(3) for
      development staff (OWASP Top 10/SAST integration) and AT-3(5) for leadership
      (CISA ransomware guidance); evidence is tier-level completion percentage from
      LMS. Dimension 3 (secure delivery): AT-3(3) SAST/DAST training for
      developers; SA-16 developer documentation and training requirement. Dimension 4
      (IR/DR): IR-2 tabletop drill attendance records; CP-3 contingency training
      via Part 11 tabletop exercise calendar extended in Part 15. Machine-readable
      evidence contract: governance.training-effectiveness-record JSON schema
      (exported from Viva Learning Graph API) with six role_tier entries, each
      carrying tier_completion_pct, last_completion_date, and ir2_drill_date.
      KSI-CED-RAT is satisfied when overall_completion_pct >= 95 and all required
      dimensions are present with evidence within the past 12 months.
