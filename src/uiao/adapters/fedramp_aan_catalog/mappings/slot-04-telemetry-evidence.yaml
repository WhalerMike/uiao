# -----------------------------------------------------------------------
# Evidence bindings: KSI rule → artifact(s) that satisfy it
# -----------------------------------------------------------------------

bindings:

  - ksi_rule: KSI-005
    ksi_title: "Mailbox Auditing Enabled"
    cr26_ksi_theme: KSI-MLA
    cr26_controls: [KSI-MLA-LET, KSI-MLA-RVL]
    nist_controls: [AU-2, AU-12]
    artifact_refs: [aan-part-10]
    confidence: high
    rationale: >-
      Part 10 (Sentinel SIEM) establishes mailbox audit log ingestion into
      Microsoft Sentinel with automated KQL analytic rules. AU-2 (audit events)
      and AU-12 (audit record generation) are satisfied by Sentinel's unified
      audit pipeline. MLA-LET (Logging Event Types) and MLA-RVL (Reviewing
      Logs) are both addressed.

  - ksi_rule: KSI-010
    ksi_title: "Data Loss Prevention Enforcement"
    cr26_ksi_theme: KSI-SVC
    cr26_controls: [KSI-SVC-RUD]
    nist_controls: [MP-4, SC-28]
    artifact_refs: [aan-part-09]
    confidence: high
    rationale: >-
      Part 9 (Purview) establishes DLP policies with sensitivity labels and
      automatic classification enforcing MP-4 (media access restriction) and
      SC-28 (protection of information at rest via CMK via Key Vault). SVC-RUD
      (Removing Unwanted Data) is satisfied by Purview DLP policy enforcement
      blocking unauthorized exfiltration paths.

  # KSI-MLA theme: the primary theme for this slot.
  # Parts 8–10 together provide the full telemetry evidence fabric.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-MLA
    cr26_controls: [KSI-MLA-LET, KSI-MLA-RVL]
    nist_controls: ["AU-6", "AU-6(1)", "AU-6(3)", AU-7, AU-8, AU-11, AU-10]
    artifact_refs: [aan-part-10, aan-part-09]
    confidence: high
    rationale: >-
      Part 10 (Sentinel) provides the full audit review capability: AU-6 audit
      review via Sentinel workbooks and scheduled analytics, AU-7 audit
      reduction/reporting via Sentinel summarization rules, AU-8 timestamp
      protection via Sentinel's immutable log ingestion, and AU-11 audit
      retention enforced at 7-year NARA standard via Log Analytics workspace
      retention + archive tiers. Part 9 adds AU-10 (non-repudiation) through
      Key Vault-backed audit signing. MLA-LET and MLA-RVL are both satisfied.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-MLA
    cr26_controls: [KSI-MLA-EVC, KSI-MLA-OSM]
    nist_controls: ["SI-4", "SI-4(2)", "SI-4(4)", "SI-4(5)", IR-4, IR-6, IR-8]
    artifact_refs: [aan-part-10]
    confidence: high
    rationale: >-
      Part 10 establishes the XDR / Detection Engineering layer: Sentinel SIEM
      with Defender XDR integration providing SI-4 information system monitoring
      with automated response playbooks. SI-4(2) (automated tools for real-time
      analysis), SI-4(4) (inbound/outbound communications traffic monitoring),
      and SI-4(5) (system-generated alerts) are all documented. IR-4 (incident
      handling), IR-6 (incident reporting), and IR-8 (incident response plan)
      are satisfied by the Sentinel SOAR playbook library. MLA-EVC (Evaluating
      via Correlation) and MLA-OSM (Observing System Monitoring) are the
      governing CR26 controls.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-MLA
    cr26_controls: [KSI-MLA-ALA]
    nist_controls: ["RA-5", "RA-5(2)", "RA-5(5)", "SI-2", "SI-2(2)", SI-5, CM-7, "CM-7(1)"]
    artifact_refs: [aan-part-08]
    confidence: high
    rationale: >-
      Part 8 (Defender Vulnerability Management + KEV) provides RA-5 continuous
      vulnerability scanning with RA-5(2) scheduled updates and RA-5(5)
      privileged-access authenticated scanning. SI-2 flaw remediation is driven
      by the CISA Known Exploited Vulnerabilities (KEV) catalog integration,
      with SI-2(2) automated flaw remediation for critical KEV entries. SI-5
      security alerts via Defender vulnerability notifications. CM-7 and
      CM-7(1) least functionality enforcement via software inventory and
      prohibited software scanning. MLA-ALA (Analyzing and Acting on Alerts)
      is the governing CR26 control, satisfied by the Defender VM → Sentinel
      → Teams notification → ticket integration pipeline.

  # KSI-INR theme: Parts 8 and 10 already close IR-4/IR-6/IR-8 for KSI-MLA;
  # this binding extends the same evidence to the three INR controls.
  # AAR generation (KSI-INR-AAR) is complemented by CP-4 in slot-07.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-INR
    cr26_controls: [KSI-INR-AAR]
    nist_controls: [IR-4, "IR-4(1)", IR-8, "IR-8(1)"]
    artifact_refs: [aan-part-10]
    confidence: high
    rationale: >-
      Part 10 (Sentinel) provides structured incident handling (IR-4) with a
      full closed-loop ticket lifecycle: triage → investigation → containment →
      eradication → recovery → closure. IR-8 incident response plan includes
      a mandatory AAR requirement as Artifact 7 — every declared incident
      produces a signed AAR ingested into Sentinel as a structured closure event.
      KSI-INR-AAR (Generating After Action Reports) is satisfied by the
      Sentinel closed-incident record with the IR-8 plan's AAR artifact requirement.
      Complements slot-07 (Part 11 CP-4 tabletop AAR) which covers the
      DR/contingency exercise dimension.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-INR
    cr26_controls: [KSI-INR-RIR]
    nist_controls: [IR-4, IR-6, "IR-6(1)", IR-7, "IR-7(1)", IR-8, "IR-8(1)", "SI-4(5)"]
    artifact_refs: [aan-part-10]
    confidence: high
    rationale: >-
      Part 10 (Sentinel) provides persistent IR procedure effectiveness review
      through multiple mechanisms: IR-4 automated incident classification and
      escalation via SOAR playbooks with review metrics; IR-6 reporting chain
      with 1-hour US-CERT SLA tracked in Sentinel; IR-7 IR assistance documented
      in the IR plan; IR-8.1 annual IR test producing a procedure-effectiveness
      finding log. SI-4(5) system-generated security alerts feed into the
      playbook review cycle. KSI-INR-RIR (Reviewing IR Procedures) is satisfied
      by the annual Sentinel playbook effectiveness review and IR test output.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-INR
    cr26_controls: [KSI-INR-RPI]
    nist_controls: [IR-3, IR-4, "IR-4(1)", IR-5, IR-8]
    artifact_refs: [aan-part-10, aan-part-08]
    confidence: high
    rationale: >-
      Part 10 (Sentinel) provides IR-5 incident monitoring via the threat
      intelligence integration (TAXII/STIX feeds) — past incidents are
      correlated against current threat actor TTPs using KQL hunting queries
      and Sentinel workbooks for incident trend analysis. IR-4(1) automated
      incident handling feeds a closed-incident corpus that Sentinel analytics
      continuously mine for patterns. Part 8 (Defender VM) contributes IR-3
      annual IR test coverage: the Defender VM annual test exercises the IR plan
      against a realistic vulnerability exploitation scenario. KSI-INR-RPI
      (Reviewing Past Incidents) is satisfied by the Sentinel incident pattern
      workbook and the Defender/Sentinel correlated hunting-query library.

  # KSI-SVC contributions from vulnerability and data protection planes

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-SVC
    cr26_controls: [KSI-SVC-VCM, KSI-SVC-VRI]
    nist_controls: [SC-12, SC-13, SC-17, SC-28, MP-2, MP-3, MP-5]
    artifact_refs: [aan-part-09]
    confidence: high
    rationale: >-
      Part 9 (Purview + Key Vault CMK) addresses cryptographic service integrity
      via Azure Key Vault customer-managed keys for all at-rest encryption,
      satisfying SC-12 (cryptographic key establishment), SC-13 (cryptographic
      protection), SC-17 (PKI certificates), and SC-28 (protection of information
      at rest). MP-2, MP-3, and MP-5 (media access, marking, and sanitization)
      are addressed through Purview sensitivity labels and information protection
      policies. SVC-VCM (Validating Communications) is satisfied by TLS
      enforcement on all Purview endpoints; SVC-VRI (Validating Risk Information)
      is satisfied by Purview Insider Risk Management integration.
