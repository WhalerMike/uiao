# -----------------------------------------------------------------------
# Evidence bindings: KSI rule → artifact(s) that satisfy it
# -----------------------------------------------------------------------

bindings:

  - ksi_rule: KSI-001
    ksi_title: "Multi-Factor Authentication Enforcement"
    cr26_ksi_theme: KSI-IAM
    cr26_controls: [KSI-IAM-APM, KSI-IAM-SNU]
    nist_controls: [IA-2, "IA-2(1)", "IA-2(11)"]
    artifact_refs: [aan-part-03, aan-part-04]
    confidence: high
    rationale: >-
      Part 3 (Entra ID/ZTNA) establishes phishing-resistant MFA via FIDO2/PIV
      per M-24-15 requirements; Part 4 extends MFA to SQL Server authentication
      paths via Entra-integrated modern auth. Together they satisfy APM
      (passwordless/modern auth) and SNU (non-user service account auth).

  - ksi_rule: KSI-002
    ksi_title: "Legacy Authentication Disabled"
    cr26_ksi_theme: KSI-IAM
    cr26_controls: [KSI-IAM-APM]
    nist_controls: [AC-17, IA-5]
    artifact_refs: [aan-part-03, aan-part-04]
    confidence: high
    rationale: >-
      Part 3 documents Conditional Access policies blocking legacy auth protocols
      (Basic Auth, NTLM) across Entra ID. Part 4 disables SQL Server mixed-mode
      auth in favor of Entra-only Windows Auth. Both close the negative side of
      APM (eliminating the legacy-auth attack surface).

  - ksi_rule: KSI-003
    ksi_title: "Global Administrator Count"
    cr26_ksi_theme: KSI-IAM
    cr26_controls: [KSI-IAM-ELP, KSI-IAM-AAM]
    nist_controls: ["AC-2(1)", AC-6]
    artifact_refs: [aan-part-03, aan-part-07]
    confidence: high
    rationale: >-
      Part 3 establishes Entra PIM just-in-time activation for Global Admin roles,
      bounding the persistent GA count to near-zero. Part 7 extends this to all
      privileged roles via PAW architecture and Entra PIM role-activation policies.
      ELP (Least Privilege) is directly satisfied; AAM (Account Management) is
      satisfied through lifecycle evidence in Entra audit logs.

  - ksi_rule: KSI-009
    ksi_title: "Conditional Access Enforcement"
    cr26_ksi_theme: KSI-IAM
    cr26_controls: [KSI-IAM-ELP, KSI-IAM-JIT, KSI-IAM-SUS]
    nist_controls: [AC-3, AC-17]
    artifact_refs: [aan-part-03, aan-part-07]
    confidence: high
    rationale: >-
      Part 3 architects Conditional Access policies enforcing Zero Trust across
      identity, device, location, and risk signals per TIC 3.0 / M-24-15.
      Part 7 adds JIT access activation via PIM as the just-in-time CA layer.
      ELP, JIT, and SUS (suspicious-activity response) are all exercised.

  # Direct KSI-IAM theme contributions where no local KSI-NNN rule exists yet.
  # Bound at theme level per the Phase 0 blocker resolution requirement.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-IAM
    cr26_controls: [KSI-IAM-AAM]
    nist_controls: [AC-2, "AC-2(1)", AC-5, AC-11, AC-12, IA-11]
    artifact_refs: [aan-part-03, aan-part-07]
    confidence: high
    rationale: >-
      Part 3 Joiner/Mover/Leaver automation via Entra ID Governance and lifecycle
      workflows closes AC-2 account management. Part 7 PAW architecture closes
      AC-5 (separation of duties) and AC-11/12 (session lock/termination).
      IA-11 (re-authentication) is addressed through CAE (Continuous Access
      Evaluation) documented in Part 3. AAM (Automating Account Management) is
      the governing CR26 control.
