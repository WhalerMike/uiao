# -----------------------------------------------------------------------
# Evidence bindings: KSI rule → artifact(s) that satisfy it
# -----------------------------------------------------------------------

bindings:

  # KSI-CMT theme: the primary theme for this slot.
  # Part 12 provides the VER evidence contract that enables KSI-011–014.
  # Parts 8 and 10 provide the continuous monitoring substrate.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-CMT
    cr26_controls: [KSI-CMT-LMC]
    nist_controls: [CM-3, AU-6, "AU-6(1)", "AU-6(3)"]
    artifact_refs: [aan-part-12, aan-part-10]
    confidence: high
    rationale: >-
      Part 12 (SBOM pipeline) produces structured SBOM diff artifacts on every
      commit — every dependency change is logged with author, timestamp, and
      before/after SHA256 hash. These diffs are ingested into Microsoft Sentinel
      (Part 10) as structured change events via the SBOM custom data connector.
      CM-3 (configuration change control) is satisfied by the SBOM manifest as
      a machine-readable change log. AU-6 audit review is satisfied by Sentinel
      KQL analytic rules that alert on unexpected dependency additions.
      KSI-CMT-LMC (Logging and Monitoring Changes) is the governing CR26 control.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-CMT
    cr26_controls: [KSI-CMT-RMV]
    nist_controls: [CM-2, SA-10]
    artifact_refs: [aan-part-12]
    confidence: high
    rationale: >-
      Part 12 implements SLSA Level 2 provenance attestation for all production
      artifacts. Every deployed artifact is built from a versioned, signed source —
      in-place modification of production components is architecturally prevented
      by the immutable container image model. SA-10 (developer security testing)
      is satisfied by Grype scan gates that block promotion of artifacts with new
      critical CVEs. CM-2 (baseline configuration) is satisfied by the SBOM
      manifest as the machine-readable software baseline. KSI-CMT-RMV
      (Redeploying vs Modifying) is directly satisfied: redeploy from known-good
      SBOM is the only permitted change mechanism.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-CMT
    cr26_controls: [KSI-CMT-RVP]
    nist_controls: [CM-3, CA-7]
    artifact_refs: [aan-part-12, aan-part-10]
    confidence: high
    rationale: >-
      Part 12 establishes a 90-day VEX assertion review cycle — all VEX
      statements must be reviewed or reaffirmed every quarter, with a signed
      dated review record. This review is the change-procedure effectiveness
      audit. Part 10 (Sentinel) provides CA-7 continuous monitoring: the Sentinel
      SBOM dashboard tracks VEX assertion age and alerts when assertions exceed
      the 90-day review window. KSI-CMT-RVP (Reviewing Change Procedures) is
      satisfied by the VEX review cycle and Sentinel age-tracking analytic.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-CMT
    cr26_controls: [KSI-CMT-VTD]
    nist_controls: ["CM-3(2)", SA-11]
    artifact_refs: [aan-part-12]
    confidence: high
    rationale: >-
      Part 12 integrates Grype vulnerability scanning as a blocking CI gate —
      every pull request is scanned and merge is blocked if a new critical CVE
      appears in the SBOM diff. CM-3(2) (automated testing of security
      configurations) is satisfied by the automated Grype scan gate. SA-11
      (developer security testing) is satisfied by the pre-merge SBOM/VDR
      validation pipeline. KSI-CMT-VTD (Validating Throughout Deployment)
      is the governing CR26 control: validation runs at every stage of the
      deployment pipeline, not just at release.

  # KSI-SCR (Supply Chain Risk) theme contributions from Part 12

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-SVC
    cr26_controls: [KSI-SVC-VRI]
    nist_controls: [SR-1, SR-2, SR-3, SR-5, SR-6, SR-8, SR-10, SR-11]
    artifact_refs: [aan-part-12]
    confidence: high
    rationale: >-
      Part 12 (SBOM/VDR/VEX) closes the full SR family: SR-1 (policy) via the
      SCRM governance charter; SR-2 (plan) via the SBOM pipeline + vendor matrix;
      SR-3 (controls/processes) via acquisition policy requiring supplier SBOMs;
      SR-5 (acquisition tools) via Syft/Grype integration; SR-6 (supplier
      assessments) via the vendor disclosure matrix + PSIRT subscriptions;
      SR-8 (notification agreements) via MSRC/PSIRT/Infoblox security portal
      registrations; SR-10 (inspection) via SLSA provenance + container signing;
      SR-11 (authenticity) via Cosign GPG-signed SBOM manifests. KSI-SVC-VRI
      (Validating Risk Information) is the governing CR26 control satisfied by
      the machine-readable VDR/VEX evidence chain.

  # KSI-SCR (Supply Chain Risk) theme — satisfied by Parts 12 + 13 + 10.
  # Both MIT and MON upgraded from confidence:low to confidence:high after
  # evidence review (2026-07-04): CR26 requirements are satisfied by the
  # existing SBOM pipeline + SCRM charter; internal telemetry wiring was
  # an over-requirement beyond the actual control language.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-SCR
    cr26_controls: [KSI-SCR-MIT]
    nist_controls: [SR-2, SR-3, PM-30]
    artifact_refs: [aan-part-12, aan-part-13]
    confidence: high
    rationale: >-
      KSI-SCR-MIT (Mitigating Supply Chain Risk) requires persistently
      identifying, reviewing, and mitigating supply chain risks. Part 12
      SBOM/VDR/VEX covers all three verbs: SR-2 acquisition strategy
      (SBOM requirement in procurement = identify); SR-3 supply chain controls
      (SLSA provenance + container signing = identify + review); Grype CI
      blocking gate (critical CVE blocking = mitigate); BOD 26-04 D1–D5
      remediation SLAs (structured mitigation timelines). Part 13 SCRM
      Governance Charter provides the PM-30 organizational evidence:
      boundary documentation, risk appetite statement, and board-level SCRM
      commitment that frames the mitigation governance. Together these
      satisfy the full identify-review-mitigate cycle required by CR26.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-SCR
    cr26_controls: [KSI-SCR-MON]
    nist_controls: [SR-6, SR-8, CA-7]
    artifact_refs: [aan-part-12, aan-part-10]
    confidence: high
    rationale: >-
      KSI-SCR-MON (Monitoring Supply Chain Risk) requires automatic monitoring
      of third party software for upstream vulnerabilities "using mechanisms
      that may include contractual notification requirements or active monitoring
      services." Part 12 provides both mechanisms: PSIRT/MSRC/Infoblox security
      portal subscriptions satisfy SR-8 (contractual notification agreements);
      Grype CI gate scanning SBOM diffs on every pull request satisfies SR-6
      (active monitoring service detecting new upstream CVEs). Part 10 Sentinel
      provides the CA-7 continuous monitoring overlay via SBOM custom data
      connector and KQL analytics tracking VEX assertion age. The CR26 language
      explicitly names "contractual notification" as a qualifying mechanism —
      PSIRT subscriptions directly satisfy this without requiring a full
      telemetry pipeline integration.

  # KSI-MLA contributions from detection engineering (change-monitoring layer)

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-MLA
    cr26_controls: [KSI-MLA-EVC, KSI-MLA-OSM]
    nist_controls: ["SI-4", "SI-4(2)", "SI-4(4)", IR-4, IR-8]
    artifact_refs: [aan-part-10, aan-part-08]
    confidence: high
    rationale: >-
      Part 10 (Sentinel + Defender XDR) provides the security monitoring
      substrate: SI-4 information system monitoring with real-time alert
      correlation; SI-4(2) automated analysis of inbound/outbound traffic;
      SI-4(4) network communications monitoring. Part 8 extends this to the
      vulnerability plane via Defender VM → Sentinel alert pipeline. IR-4
      (incident handling) and IR-8 (incident response plan) are satisfied by
      the Sentinel SOAR playbook library. KSI-MLA-EVC (Evaluating via
      Correlation) and KSI-MLA-OSM (Observing System Monitoring) are the
      governing CR26 controls.
