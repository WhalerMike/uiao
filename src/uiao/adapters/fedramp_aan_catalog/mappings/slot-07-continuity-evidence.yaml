# AAN Evidence Binding — Surface Slot 7: Continuity Control Plane
#
# Maps Federal AAN Part 11 artifacts to NIST SP 800-53 Rev 5 controls
# and FedRAMP 20x KSI-RPL, KSI-INR, and KSI-CED rules.
#
# Part 11 is the only authored AAN book not previously bound in slots 1–6.
# It closes the full CP family (CP-2 through CP-10), which anchors all four
# KSI-RPL controls, plus CP-4/IR-3 evidence for KSI-INR-AAR and KSI-INR-TRC,
# and CP-3 contingency training for KSI-CED-RAT.
#
# Governing roadmap: docs/customer-documents/federal-aan-series/federal-aan-conmon-gap-roadmap.md
# Phase 4 target: KSI-RPL, KSI-INR, and KSI-CED coverage via Part 11 binding

