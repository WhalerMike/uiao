# -----------------------------------------------------------------------
# Evidence bindings: KSI rule → artifact(s) that satisfy it
# -----------------------------------------------------------------------

bindings:

  # KSI-RPL theme: all four controls anchored to Part 11 CP family.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-RPL
    cr26_controls: [KSI-RPL-ABO]
    nist_controls: [CP-6, "CP-6(1)", CP-9, "CP-9(1)", CP-10, "CP-10(2)", "CP-2(3)"]
    artifact_refs: [aan-part-11]
    confidence: high
    rationale: >-
      Part 11 Business Continuity provides the CP-9 backup strategy review and
      CP-2.3 BIA methodology that defines RTO/RPO and validates that information
      resource backups align with recovery objectives. CP-6 (alternate storage site)
      and CP-6(1) (separation from primary) are documented with specific Azure
      secondary region designations and data-replication architecture. CP-9(1) backup
      restore testing is included in the annual contingency plan test schedule.
      KSI-RPL-ABO (Aligning Backups with Objectives) is satisfied when backup
      alignment is reviewed against BIA-derived RTO/RPO at least annually.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-RPL
    cr26_controls: [KSI-RPL-ARP]
    nist_controls: [CP-2, "CP-2(1)", "CP-2(3)", "CP-4(1)", CP-6, "CP-6(1)", CP-7, "CP-7(1)", "CP-7(2)", "CP-7(3)", CP-8, "CP-8(1)", CP-10]
    artifact_refs: [aan-part-11]
    confidence: high
    rationale: >-
      Part 11 provides a complete NIST SP 800-34 Contingency Plan (CP-2) with
      BIA-anchored RTO/RPO values, recovery priorities, activation/notification
      procedures, recovery procedures for each system tier, reconstitution steps,
      and an annual maintenance schedule (Section 7). CP-7 (alternate processing
      site), CP-8 (telecom services), and CP-6 (alternate storage) are addressed
      with specific Azure region and SD-WAN failover references. CP-4(1) coordinates
      CP and IR testing. KSI-RPL-ARP (Aligning Recovery Plan) is satisfied when
      the written plan is reviewed annually and updated to reflect current RTO/RPO.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-RPL
    cr26_controls: [KSI-RPL-RRO]
    nist_controls: ["CP-2(3)", CP-10]
    artifact_refs: [aan-part-11]
    confidence: high
    rationale: >-
      Part 11 Section 7 (Plan Maintenance) mandates annual BIA review for
      RTO/RPO re-validation with mission-owner signature. This directly satisfies
      "RTO and RPO persistently reviewed for alignment with provider business needs
      and capabilities." CP-2.3 documents that recovery objectives are re-derived
      from BIA results annually; CP-10 reconstitution objective review is included
      in the annual tabletop exercise debrief. KSI-RPL-RRO (Reviewing Recovery
      Objectives) is the governing CR26 control.

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-RPL
    cr26_controls: [KSI-RPL-TRC]
    nist_controls: ["CP-2(1)", "CP-2(3)", CP-4, "CP-4(1)", "CP-6(1)", "CP-9(1)", CP-10, IR-3, "IR-3(2)"]
    artifact_refs: [aan-part-11]
    confidence: high
    rationale: >-
      Part 11 provides a complete CP-4 tabletop exercise framework: structured
      test plan, execution record metrics table (participant count, scenario
      coverage, open findings), and a mandatory signed AAR with lessons-learned
      disposition list. CP-4(1) coordinates contingency plan testing with IR plan
      testing. CP-9(1) backup restore testing is included in the exercise scope.
      IR-3 annual IR test is documented with Part 11 referencing Part 10 SOAR
      playbooks as the procedural basis. KSI-RPL-TRC (Testing Recovery
      Capabilities) is satisfied when the annual tabletop produces a signed AAR
      demonstrating recovery within defined RTO/RPO.

  # KSI-INR-AAR: CP-4 tabletop AAR dimension (complement to slot-04 IR-4/IR-8)

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-INR
    cr26_controls: [KSI-INR-AAR]
    nist_controls: [CP-4, "CP-4(1)", IR-3, "IR-3(2)"]
    artifact_refs: [aan-part-11]
    confidence: high
    rationale: >-
      Part 11 CP-4 tabletop exercise produces a signed AAR document (Section 5
      of the testing template) that directly satisfies KSI-INR-AAR "after action
      reports are generated and lessons learned are incorporated." The AAR template
      includes mandatory fields: incident timeline reconstruction, root-cause
      classification, lessons-learned action items, responsible parties, and
      disposition status. CP-4(1) ensures the AAR covers both CP and IR plan
      execution. This binding complements slot-04 which provides the Sentinel
      IR-4/IR-8 automated incident handling dimension.

  # KSI-CED-RAT: CP-3 contingency training dimension (partial; AT family pending)

  - cr26_theme_binding: true
    cr26_ksi_theme: KSI-CED
    cr26_controls: [KSI-CED-RAT]
    nist_controls: [CP-3, IR-2, "IR-2(3)", PM-14]
    artifact_refs: [aan-part-11]
    confidence: low
    rationale: >-
      Part 11 provides CP-3 contingency training evidence: the annual tabletop
      exercise constitutes IR/DR staff training with attendance records satisfying
      the "IR and DR personnel training" dimension of KSI-CED-RAT. IR-2 incident
      response training is documented with Part 10 IR-8 plan as the training
      curriculum basis. PM-14 (Testing, Training and Monitoring) framework from
      Part 13 provides the organizational training-program structure. Confidence
      low — KSI-CED-RAT requires all four training dimensions (general, role-specific,
      dev/eng, IR/DR); the AT-2/AT-3/AT-4 LMS completion evidence for general
      all-employee and role-specific training is not yet machine-readable.
