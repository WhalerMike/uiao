# GovRAMP Reciprocity Binding — Surface Slot 1: Identity Control Plane
#
# GovRAMP (formerly StateRAMP) assesses against the SAME NIST 800-53 Rev 5
# baseline the federal pack evidences, and its reciprocity intake accepts
# FedRAMP-derived artifacts. This file therefore records a CROSSWALK, not a
# re-interpretation (ADR-133 D1): which substrate evidence on this slot
# transfers to a GovRAMP review, anchored to the Rev 5 controls both
# programs share.
#
# Slot canonical definition: src/uiao/canon/data/control-planes.yml (id: identity)
# Vertical: state-local (non-federal). Status: active (see __init__.py).


version: "0.1.0"
status: active
vertical: state-local
slot: identity
slot_id: 1
generated_at: "2026-07-25"
standard: "GovRAMP (formerly StateRAMP) — NIST SP 800-53 Rev 5 baseline, reciprocity intake"
govramp_anchor: "IA-2 / AC-2 / AC-6"
substrate_source: "control-planes.yml#identity — Identity Provider sign-in and risk logs, ICAM governance"
reciprocity_basis: "UIAO_140 single-ATO reciprocity model — one authoritative evidence base, N consuming acceptance regimes (src/uiao/canon/specs/single-ato-reciprocity-model.md)"

bindings:
  - rev5_control: IA-2
    substrate_capability: "Identity Provider MFA / Authentication Strength + Zero Trust policy engine"
    evidence_source: "Sign-in logs, Conditional Access outcomes, authentication-strength decisions"
    confidence: high
    rationale: >-
      GovRAMP assesses the same Rev 5 IA-2 requirement FedRAMP does; the
      identical sign-in and risk telemetry transfers through the
      reciprocity intake unchanged.

  - rev5_control: AC-2
    substrate_capability: "ICAM governance — Joiner/Mover/Leaver automation, access reviews"
    evidence_source: "Identity governance lifecycle workflows and access-review attestations"
    confidence: high
    rationale: >-
      Account-management evidence in the FedRAMP-derived package satisfies
      the same AC-2 line in a GovRAMP review; no re-collection, only re-
      presentation.

  - rev5_control: AC-6
    substrate_capability: "Privileged Identity Management just-in-time activation + role-based access"
    evidence_source: "PIM role-activation logs, access-review outcomes, leaver de-provisioning evidence"
    confidence: high
    rationale: >-
      Least-privilege evidence transfers as-is; GovRAMP's Rev 5 baseline
      draws on the identical control text.

out_of_scope:
  note: >-
    GovRAMP program-administration steps (membership, fee schedule, PMO
    interactions, 3PAO engagement logistics) are engagement process, not
    substrate evidence, and are not claimed here. Adoption is state-by-
    state procurement policy, not a mandate (ADR-133 D5).
