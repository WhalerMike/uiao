# GovRAMP Reciprocity Binding — Surface Slot 4: Telemetry Control Plane
#
# GovRAMP (formerly StateRAMP) assesses against the SAME NIST 800-53 Rev 5
# baseline the federal pack evidences, and its reciprocity intake accepts
# FedRAMP-derived artifacts. This file therefore records a CROSSWALK, not a
# re-interpretation (ADR-133 D1): which substrate evidence on this slot
# transfers to a GovRAMP review, anchored to the Rev 5 controls both
# programs share.
#
# Slot canonical definition: src/uiao/canon/data/control-planes.yml (id: telemetry)
# Vertical: state-local (non-federal). Status: active (see __init__.py).


version: "0.1.0"
status: active
vertical: state-local
slot: telemetry
slot_id: 4
generated_at: "2026-07-25"
standard: "GovRAMP (formerly StateRAMP) — NIST SP 800-53 Rev 5 baseline, reciprocity intake"
govramp_anchor: "AU-6 / SI-4 / CM-6"
substrate_source: "control-planes.yml#telemetry — monitoring, audit-review, and configuration-detection telemetry"
reciprocity_basis: "UIAO_140 single-ATO reciprocity model — one authoritative evidence base, N consuming acceptance regimes (src/uiao/canon/specs/single-ato-reciprocity-model.md)"

bindings:
  - rev5_control: AU-6
    substrate_capability: "Audit review/analysis pipeline (SIEM-integrated ConMon processing)"
    evidence_source: "ConMon processed findings and review artifacts"
    confidence: high
    rationale: >-
      The ConMon evidence stream GovRAMP's continuous-monitoring
      expectations consume is the same stream the federal ConMon program
      consumes.

  - rev5_control: SI-4
    substrate_capability: "System monitoring via the substrate's drift and event processing"
    evidence_source: "Drift findings, event-processor outputs, dashboard artifacts"
    confidence: high
    rationale: >-
      Monitoring evidence transfers through reciprocity; GovRAMP's Rev 5
      SI-4 is textually the FedRAMP control.

  - rev5_control: CM-6
    substrate_capability: "Configuration-settings conformance (secure-baseline scans)"
    evidence_source: "Baseline conformance scan outputs (e.g. SCuBA-derived findings)"
    confidence: high
    rationale: >-
      Baseline scan artifacts are program-neutral; only the submission
      envelope differs.

out_of_scope:
  note: >-
    GovRAMP program-administration steps (membership, fee schedule, PMO
    interactions, 3PAO engagement logistics) are engagement process, not
    substrate evidence, and are not claimed here. Adoption is state-by-
    state procurement policy, not a mandate (ADR-133 D5).
