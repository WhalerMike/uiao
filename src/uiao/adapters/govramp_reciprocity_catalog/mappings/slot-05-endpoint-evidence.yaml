# GovRAMP Reciprocity Binding — Surface Slot 5: Endpoint Control Plane
#
# GovRAMP (formerly StateRAMP) assesses against the SAME NIST 800-53 Rev 5
# baseline the federal pack evidences, and its reciprocity intake accepts
# FedRAMP-derived artifacts. This file therefore records a CROSSWALK, not a
# re-interpretation (ADR-133 D1): which substrate evidence on this slot
# transfers to a GovRAMP review, anchored to the Rev 5 controls both
# programs share.
#
# Slot canonical definition: src/uiao/canon/data/control-planes.yml (id: endpoint)
# Vertical: state-local (non-federal). Status: active (see __init__.py).


version: "0.1.0"
status: active
vertical: state-local
slot: endpoint
slot_id: 5
generated_at: "2026-07-25"
standard: "GovRAMP (formerly StateRAMP) — NIST SP 800-53 Rev 5 baseline, reciprocity intake"
govramp_anchor: "CM-2 / CM-7 / SI-7"
substrate_source: "control-planes.yml#endpoint — device management, baseline, and software-integrity telemetry"
reciprocity_basis: "UIAO_140 single-ATO reciprocity model — one authoritative evidence base, N consuming acceptance regimes (src/uiao/canon/specs/single-ato-reciprocity-model.md)"

bindings:
  - rev5_control: CM-2
    substrate_capability: "Managed device baselines (MDM-enforced configuration profiles)"
    evidence_source: "Device compliance and baseline-assignment exports"
    confidence: high
    rationale: >-
      Baseline-configuration evidence is identical under either program's
      Rev 5 assessment.

  - rev5_control: CM-7
    substrate_capability: "Least-functionality enforcement (application control policy)"
    evidence_source: "Application-control policy state and exception register"
    confidence: high
    rationale: >-
      Least-functionality artifacts transfer unchanged through the
      reciprocity intake.

  - rev5_control: SI-7
    substrate_capability: "Software/firmware integrity verification on managed endpoints"
    evidence_source: "Integrity-monitoring reports from the endpoint plane"
    confidence: high
    rationale: >-
      Integrity evidence is control-text-identical across the programs.

out_of_scope:
  note: >-
    GovRAMP program-administration steps (membership, fee schedule, PMO
    interactions, 3PAO engagement logistics) are engagement process, not
    substrate evidence, and are not claimed here. Adoption is state-by-
    state procurement policy, not a mandate (ADR-133 D5).
