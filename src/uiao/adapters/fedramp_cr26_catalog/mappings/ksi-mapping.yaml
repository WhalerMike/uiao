# Local KSI rules ↔ FedRAMP CR26 KSI catalog mapping.
#
# Machine-readable companion to UIAO_137; consumed by the
# `fedramp-cr26-catalog` conformance adapter (ADR-061 D3).
#
# Two files must stay in lockstep:
#   - src/uiao/canon/specs/fedramp-cr26-ksi-mapping.md (human-readable)
#   - this file (machine-readable)
#
# The mapping is valid only against the snapshot SHA pinned below;
# the adapter emits DRIFT-PROVENANCE if a referenced CR26 ID does
# not resolve in the snapshot at that SHA.
#
# Authority posture per ADR-061 D1: the local rule and its UIAO_NNN
# row remain authoritative; CR26 IDs cited here are navigational aids.

version: "0.1.0"
status: draft
generated_at: "2026-05-10"
snapshot_sha: "c31eb04c082d6d578a26a00de9a482707ab7a00c"
catalog_uuid: "092dc25a-18ca-51d9-ab85-744e5435405e"
catalog_version: "0.1.0"
governing_doc: UIAO_137
adr: ADR-061

# ---------------------------------------------------------------------
# Forward mapping: local KSI rule → CR26 controls.
# Confidence: `high` = local rule's NIST mapping aligns directly with
# the CR26 control's intent. `medium` = necessary-but-not-sufficient.
# `low` = scaffold mapping; the local rule exists but its evidence
# binding is not yet finalized (see `Status: scaffold` in the rule file).
# ---------------------------------------------------------------------

mappings:

  - local_rule: KSI-001
    local_title: "Multi-Factor Authentication Enforcement"
    local_nist: [IA-2, "IA-2(1)", "IA-2(11)"]
    cr26_controls: [KSI-IAM-APM, KSI-IAM-SNU]
    confidence: high
    rationale: >-
      APM (passwordless / modern auth) is MFA's CR26 expression;
      SNU covers non-user (service) accounts that must authenticate
      without interactive MFA.

  - local_rule: KSI-002
    local_title: "Legacy Authentication Disabled"
    local_nist: [AC-17, IA-5]
    cr26_controls: [KSI-IAM-APM]
    confidence: high
    rationale: >-
      Disabling legacy is the negative side of enforcing modern auth.

  - local_rule: KSI-003
    local_title: "Global Administrator Count"
    local_nist: ["AC-2(1)", AC-6]
    cr26_controls: [KSI-IAM-ELP, KSI-IAM-AAM]
    confidence: high
    rationale: >-
      ELP (Least Privilege) is the direct match; AAM (Automating
      Account Management) covers the lifecycle that keeps the count
      bounded.

  - local_rule: KSI-004
    local_title: "External Forwarding Restrictions"
    local_nist: [SC-7, SC-8]
    cr26_controls: [KSI-SVC-SNT, KSI-SVC-RUD]
    confidence: medium
    rationale: >-
      SNT (Securing Network Traffic) covers the egress boundary;
      RUD (Removing Unwanted Data) covers data-leak intent.

  - local_rule: KSI-005
    local_title: "Mailbox Auditing Enabled"
    local_nist: [AU-2, AU-12]
    cr26_controls: [KSI-MLA-LET, KSI-MLA-RVL]
    confidence: high
    rationale: >-
      LET (Logging Event Types) is the emission side; RVL (Reviewing
      Logs) is the review side. AU-2/AU-12 cover both.

  - local_rule: KSI-006
    local_title: "External Sharing Restrictions"
    local_nist: [AC-3, AC-21]
    cr26_controls: [KSI-IAM-ELP, KSI-SVC-RUD]
    confidence: medium
    rationale: >-
      ELP covers the access-control side; RUD covers the
      data-egress side.

  - local_rule: KSI-007
    local_title: "Safe Links Protection"
    local_nist: [SI-3, SI-4]
    cr26_controls: [KSI-SVC-VCM, KSI-CNA-RNT]
    confidence: medium
    rationale: >-
      VCM (Validating Communications) is the URL-validation control;
      RNT (Restricting Network Traffic) covers the egress-block side
      when a link is bad.

  - local_rule: KSI-008
    local_title: "Safe Attachments Protection"
    local_nist: [SI-3, SI-4]
    cr26_controls: [KSI-SVC-VCM, KSI-CNA-MAT]
    confidence: medium
    rationale: >-
      VCM covers attachment scanning; MAT (Minimizing Attack Surface)
      covers reducing the live-payload paths.

  - local_rule: KSI-009
    local_title: "Conditional Access Enforcement"
    local_nist: [AC-3, AC-17]
    cr26_controls: [KSI-IAM-ELP, KSI-IAM-JIT, KSI-IAM-SUS]
    confidence: high
    rationale: >-
      CA is the policy-enforcement layer for least privilege,
      just-in-time access, and suspicious-activity response.

  - local_rule: KSI-010
    local_title: "Data Loss Prevention Enforcement"
    local_nist: [MP-4, SC-28]
    cr26_controls: [KSI-SVC-RUD]
    confidence: high
    rationale: >-
      RUD (Removing Unwanted Data) is the direct CR26 expression of DLP.

  # KSI-PIY (Inventory) — ADR-111 / UIAO_137 §6.
  # Rules KSI-017..021 cover KSI-PIY (2026-07-03); all five active (2026-07-04).
  # KSI-017..019, 021: confidence high — slot-05 bindings (Parts 7, 8).
  # KSI-020 (RSD): confidence high — slot-05 binding (Parts 12, 8) active (2026-07-04).
  - local_rule: KSI-017
    local_title: "Endpoint Inventory Visibility"
    local_nist: [CM-8, RA-5, "RA-5(5)"]
    cr26_controls: [KSI-PIY-GIV]
    confidence: high
    rationale: >-
      GIV (Getting Inventory Visibility) requires continuous, authoritative
      visibility into all managed endpoint devices. Part 8 (Defender VM)
      provides RA-5(5) authenticated scanning across all managed devices,
      continuously populating the endpoint component inventory. Evidence
      contract satisfied by slot-05-endpoint-evidence.yaml (confidence: high).

  - local_rule: KSI-018
    local_title: "Endpoint Entity State Resolution"
    local_nist: [CM-7, "CM-7(1)", CM-8]
    cr26_controls: [KSI-PIY-RES]
    confidence: high
    rationale: >-
      RES (Resolving Entity State) requires on-demand determination of any
      endpoint's current configuration and compliance posture. Part 8 (Defender
      VM) provides continuous endpoint posture via CM-7(1) automated policy
      enforcement — patch level, software inventory, and vulnerability state.
      Evidence contract satisfied by slot-05-endpoint-evidence.yaml (confidence: high).

  - local_rule: KSI-019
    local_title: "Endpoint Inventory State Recording"
    local_nist: [CM-8, RA-5, "RA-5(2)"]
    cr26_controls: [KSI-PIY-RIS]
    confidence: high
    rationale: >-
      RIS (Recording Inventory State) requires all changes to the managed
      endpoint inventory be logged with author, timestamp, and before/after
      state in a tamper-resistant record store. Part 8 (Defender VM) provides
      RA-5 continuous scanning with device onboard/offboard/reconfigure change
      tracking. Evidence contract satisfied by slot-05-endpoint-evidence.yaml
      (confidence: high).

  - local_rule: KSI-020
    local_title: "SDLC Security Review"
    local_nist: [SA-11, SA-15, SA-8, SR-3]
    cr26_controls: [KSI-PIY-RSD]
    confidence: high
    rationale: >-
      RSD (Reviewing Security in the SDLC) requires security and privacy built
      into the SDLC aligned with CISA Secure By Design and persistently reviewed.
      Part 12 SBOM/VDR/VEX satisfies SA-15 (Grype CI gate), SA-11 (automated
      SBOM scanning), SA-8 (SLSA provenance + container signing), SR-3 (Syft at
      build time). Part 8 (Defender VM) extends SDLC review to the endpoint
      plane. Evidence contract satisfied by slot-05-endpoint-evidence.yaml
      (confidence: high, Parts 12 + 8, 2026-07-04).

  - local_rule: KSI-021
    local_title: "Privileged Access via Defined Paths"
    local_nist: [IA-11, AC-11, AC-12, "AC-6(5)"]
    cr26_controls: [KSI-PIY-RVD]
    confidence: high
    rationale: >-
      RVD (Resolving via Defined paths) requires all privileged access to
      route through a defined, monitored, identity-anchored path. Part 7 (PAM)
      establishes Entra PIM just-in-time activation + PAW architecture as the
      only authorized privileged access path. IA-11 re-authentication enforced
      by PIM activation timeouts; AC-11/AC-12 enforced by PAW Group Policy and
      CAE. Evidence contract satisfied by slot-05-endpoint-evidence.yaml
      (confidence: high).

  # KSI-CED (Cybersecurity Education) — ADR-111 / UIAO_137 §6.
  # Active rule KSI-022 activates KSI-CED-RAT coverage (2026-07-04).
  # Confidence high: Book_15 AT family LMS evidence bound in slot-08-training-evidence.yaml.
  - local_rule: KSI-022
    local_title: "Cybersecurity Training Effectiveness Review"
    local_nist: [AT-2, "AT-2(1)", "AT-2(2)", AT-3, "AT-3(3)", "AT-3(5)", AT-4, CP-3, IR-2]
    cr26_controls: [KSI-CED-RAT]
    confidence: high
    rationale: >-
      RAT (Reviewing All Training) requires persistent review across four training
      dimensions. Book_15 (Part 15) delivers: role-based training matrices for six
      high-risk tiers (AT-3/AT-3(3)/AT-3(5)), general all-employee awareness
      (AT-2/AT-2(1)/AT-2(2)), secure-delivery training (SA-16), and IR/DR training
      (IR-2/CP-3). Machine-readable evidence is the LMS training-effectiveness-record
      JSON schema (governance.training-effectiveness-record) with >=95% completion
      threshold across all role tiers. AT-4 retention records and CP-3 tabletop
      attendance (Part 11) provide corroborating evidence. Confidence high —
      AT-family evidence contract bound in slot-08-training-evidence.yaml.

  # KSI-INR (Incident Response) — ADR-111 / UIAO_137 §6.
  # Scaffold rules KSI-023..025 seed KSI-INR coverage (2026-07-04).
  # Confidence high: Parts 8/10 already close IR-4/IR-6/IR-8 in slot-04;
  # slot-07 Part 11 adds CP-4 tabletop AAR dimension for KSI-INR-AAR.
  - local_rule: KSI-023
    local_title: "Incident After Action Report Generation"
    local_nist: [IR-3, IR-4, "IR-4(1)", IR-8, CP-4]
    cr26_controls: [KSI-INR-AAR]
    confidence: high
    rationale: >-
      AAR (After Action Reports) requires AARs generated and lessons learned
      incorporated. Part 10 Sentinel provides IR-4/IR-8 closed-loop incident
      records with mandatory AAR artifact (IR-8 Artifact 7). Part 11 CP-4
      tabletop exercise produces signed AARs with lessons-learned disposition.
      Evidence contract satisfied by slot-04 (IR-4/IR-8) and slot-07 (CP-4).

  - local_rule: KSI-024
    local_title: "Incident Response Procedure Effectiveness Review"
    local_nist: [IR-4, IR-6, "IR-6(1)", "IR-6(3)", IR-7, "IR-7(1)", IR-8, "IR-8(1)", "SI-4(5)"]
    cr26_controls: [KSI-INR-RIR]
    confidence: high
    rationale: >-
      RIR (Reviewing IR Procedures) requires persistent IR effectiveness review.
      Part 10 Sentinel SOAR playbooks provide IR-4 automated incident handling
      with playbook review metrics; IR-6 reporting chain (1-hour US-CERT SLA);
      IR-8.1 annual IR test producing a procedure-effectiveness finding log.
      Evidence contract satisfied by slot-04 (Parts 8/10 IR-4/IR-6/IR-8).

  - local_rule: KSI-025
    local_title: "Past Incident Pattern Review"
    local_nist: [IR-3, IR-4, "IR-4(1)", IR-5, IR-8]
    cr26_controls: [KSI-INR-RPI]
    confidence: high
    rationale: >-
      RPI (Reviewing Past Incidents) requires review for patterns and
      previously-unidentified vulnerabilities. Part 10 Sentinel provides
      IR-5 continuous monitoring via TAXII/STIX TI feeds correlating past
      incidents against current TTPs; KQL hunting queries mine the closed-incident
      corpus for patterns. Evidence contract satisfied by slot-04 (Parts 8/10).

  # KSI-RPL (Recovery Planning) — ADR-111 / UIAO_137 §6.
  # Scaffold rules KSI-026..029 seed KSI-RPL coverage (2026-07-04).
  # Confidence high: Part 11 closes the full CP family for all four RPL controls.
  # Part 11 is newly bound in slot-07-continuity-evidence.yaml.
  - local_rule: KSI-026
    local_title: "Backup Alignment with Recovery Objectives"
    local_nist: ["CM-2(3)", CP-6, CP-9, CP-10, "CP-10(2)", SI-12]
    cr26_controls: [KSI-RPL-ABO]
    confidence: high
    rationale: >-
      ABO (Aligning Backups with Objectives) requires backup alignment with
      defined RTO/RPO. Part 11 provides CP-9 backup review anchored to BIA-derived
      RTO/RPO (CP-2.3). Parts 6 (SQL AG async replica = CP-6) and 10 (geo-redundant
      Log Analytics = CP-9 audit backups) contribute specific backup component
      evidence. Evidence contract satisfied by slot-07 (Part 11 CP-9/CP-2.3).

  - local_rule: KSI-027
    local_title: "Recovery Plan Alignment with Objectives"
    local_nist: [CP-2, "CP-2(1)", "CP-2(3)", "CP-4(1)", CP-6, "CP-6(1)", "CP-6(3)", CP-7, "CP-7(1)", "CP-7(2)", "CP-7(3)", CP-8, "CP-8(1)", "CP-8(2)", CP-10, "CP-10(2)"]
    cr26_controls: [KSI-RPL-ARP]
    confidence: high
    rationale: >-
      ARP (Aligning Recovery Plan) requires recovery plan alignment with
      objectives. Part 11 provides the NIST SP 800-34 CP-2 Contingency Plan
      with BIA-anchored RTO/RPO, recovery procedures (CP-6/CP-7/CP-8 technical
      components), and annual maintenance review schedule. Parts 2 (SD-WAN
      dual-underlay = CP-7/CP-8) and 6 (SQL AG = CP-6) corroborate technical
      components. Evidence contract satisfied by slot-07 (Part 11 CP-2).

  - local_rule: KSI-028
    local_title: "Recovery Objective Review"
    local_nist: ["CP-2(3)", CP-10]
    cr26_controls: [KSI-RPL-RRO]
    confidence: high
    rationale: >-
      RRO (Reviewing Recovery Objectives) requires persistent RTO/RPO review.
      Part 11 Section 7 mandates annual BIA review with mission-owner sign-off
      for RTO/RPO re-validation — CP-2.3 requires objectives derived from BIA.
      Evidence contract satisfied by slot-07 (Part 11 BIA annual review record).

  - local_rule: KSI-029
    local_title: "Recovery Capability Testing"
    local_nist: ["CP-2(1)", "CP-2(3)", CP-4, "CP-4(1)", "CP-6(1)", "CP-9(1)", CP-10, IR-3, "IR-3(2)"]
    cr26_controls: [KSI-RPL-TRC]
    confidence: high
    rationale: >-
      TRC (Testing Recovery Capabilities) requires persistent testing against
      defined objectives. Part 11 provides CP-4 tabletop exercise framework:
      test plan, execution metrics, and signed AAR with lessons-learned disposition.
      CP-9(1) backup restore testing is included in the annual scope. IR-3 annual
      IR test (Part 10) complements the CP test. Evidence contract satisfied by
      slot-07 (Part 11 CP-4/CP-9(1)).

  # KSI-SCR (Supply Chain Risk) — ADR-111 / UIAO_137 §5.
  # Active rules KSI-015..016 cover KSI-SCR (2026-07-04).
  # Confidence high: evidence contracts satisfied by slot-06-security-evidence.yaml
  # (Parts 12+13 for MIT; Parts 12+10 for MON; ADR-111 phase 5).
  - local_rule: KSI-015
    local_title: "Supply Chain Risk Mitigation"
    local_nist: [SR-2, SR-3, PM-30]
    cr26_controls: [KSI-SCR-MIT]
    confidence: high
    rationale: >-
      MIT (Mitigating Supply Chain Risk) requires persistently identifying,
      reviewing, and mitigating supply chain risks. Part 12 SBOM/VDR/VEX
      covers all three verbs: SR-2 acquisition strategy (SBOM procurement
      requirement = identify); SR-3 supply chain controls (SLSA provenance +
      Grype CI blocking gate = review + mitigate); BOD 26-04 D1–D5 SLAs
      (structured mitigation timelines). Part 13 SCRM Governance Charter
      provides PM-30 organizational evidence (risk appetite + board-level
      commitment). Evidence contract satisfied by slot-06-security-evidence.yaml
      (confidence: high, Parts 12 + 13, 2026-07-04).

  - local_rule: KSI-016
    local_title: "Supply Chain Monitoring"
    local_nist: [SR-6, SR-8, CA-7]
    cr26_controls: [KSI-SCR-MON]
    confidence: high
    rationale: >-
      MON (Monitoring Supply Chain) requires automatic monitoring using
      "mechanisms that may include contractual notification requirements or
      active monitoring services." Part 12 provides both: PSIRT/MSRC/Infoblox
      portal subscriptions (SR-8 contractual notification) and Grype CI gate
      scanning SBOM diffs on every pull request (SR-6 active monitoring).
      Part 10 Sentinel provides CA-7 continuous monitoring overlay via SBOM
      custom data connector. CR26 explicitly names contractual notification
      as qualifying — PSIRT subscriptions directly satisfy without requiring
      a full telemetry pipeline. Evidence contract satisfied by
      slot-06-security-evidence.yaml (confidence: high, Parts 12 + 10,
      2026-07-04).

  # KSI-CMT (Change Management) — ADR-111 / FINDING-PGM-003 §4.
  # VER evidence contract fulfilled by Part 12 (SBOM/VDR/VEX pipeline)
  # bound to Conformance Adapter slot-06-security-evidence.yaml (2026-07-03).
  # Confidence upgraded from low → high on all four rules.
  - local_rule: KSI-011
    local_title: "Change Logging and Monitoring"
    local_nist: [CM-3, AU-6]
    cr26_controls: [KSI-CMT-LMC]
    confidence: high
    rationale: >-
      LMC (Logging Changes) requires modifications to be logged and monitored.
      Part 12 SBOM pipeline produces structured SBOM diffs on every commit —
      every dependency change logged with author, timestamp, and before/after
      SHA256 hash. Diffs ingested into Sentinel (Part 10) as change events.
      VER evidence contract satisfied by slot-06-security-evidence.yaml.

  - local_rule: KSI-012
    local_title: "Immutable Redeployment over Direct Modification"
    local_nist: [CM-2, SA-10]
    cr26_controls: [KSI-CMT-RMV]
    confidence: high
    rationale: >-
      RMV (Redeploying vs Modifying) favors version-controlled redeploy over
      in-place mutation. Part 12 implements SLSA Level 2 provenance attestation:
      every production artifact built from versioned, signed source; in-place
      modification architecturally prevented by immutable container model.
      VER evidence contract satisfied by slot-06-security-evidence.yaml.

  - local_rule: KSI-013
    local_title: "Change-Procedure Effectiveness Review"
    local_nist: [CM-3, CA-7]
    cr26_controls: [KSI-CMT-RVP]
    confidence: high
    rationale: >-
      RVP (Reviewing Change Procedures) requires persistent review of
      change-management effectiveness. Part 12 establishes a 90-day VEX
      assertion review cycle with signed dated review records as the
      change-procedure effectiveness audit. Sentinel SBOM dashboard (Part 10)
      tracks VEX assertion age and alerts when reviews exceed the 90-day window.
      VER evidence contract satisfied by slot-06-security-evidence.yaml.

  - local_rule: KSI-014
    local_title: "Automated Validation Throughout Deployment"
    local_nist: ["CM-3(2)", SA-11]
    cr26_controls: [KSI-CMT-VTD]
    confidence: high
    rationale: >-
      VTD (Validating Throughout Deployment) requires automated testing and
      validation across deployment. Part 12 integrates Grype vulnerability
      scanning as a blocking CI gate on every pull request — merge blocked
      if a new critical CVE appears in the SBOM diff. Validation runs at
      every stage of the deployment pipeline, not just at release.
      VER evidence contract satisfied by slot-06-security-evidence.yaml.

