# SOC 2 TSC Evidence Binding — Surface Slot 3: Network Control Plane
#
# Federal reads this slot as NIST SC-8/CA-7 + KSI-CNA; a SOC 2 auditor reads
# the SD-WAN/SASE segmentation and overlay encryption as CC6.6 boundary
# protection and CC6.7 transmission protection.
#
# Slot canonical definition: src/uiao/canon/data/control-planes.yml (id: network)
# Vertical: commercial-regulated (non-federal). Status: proposed.

version: "0.1.0"
status: proposed
vertical: commercial-regulated
slot: network
slot_id: 3
generated_at: "2026-07-13"
standard: "AICPA SOC 2 — Trust Services Criteria (2017/2022)"
tsc_anchor: "CC6.6 / CC6.7"
substrate_source: "control-planes.yml#network — SD-WAN policy engine, SASE inspection, WAN-edge enforcement"

criteria:
  - id: CC6.6
    title: "Logical access measures protecting against threats from sources outside the system boundary"
  - id: CC6.7
    title: "Restriction of transmission, movement, and removal of information (encryption in transit)"

bindings:
  - tsc_criterion: CC6.6
    substrate_capability: "SASE inline inspection + SD-WAN identity-anchored segmentation at WAN edges"
    evidence_source: "SD-WAN policy distribution logs, SASE inspection telemetry, segmentation policy state"
    confidence: high
    rationale: >-
      Boundary protection against external threats is the SASE/SD-WAN
      enforcement the federal vertical maps to SC-7; the same policy-enforcement
      telemetry satisfies CC6.6 for a commercial boundary.

  - tsc_criterion: CC6.7
    substrate_capability: "IPsec/GRE overlay maintained by WAN-edge devices (encryption in transit)"
    evidence_source: "Tunnel health telemetry, overlay cipher configuration"
    confidence: high
    rationale: >-
      Restricting information in transit to encrypted overlays is the SC-8
      transmission-confidentiality control at the network plane; the same
      overlay encryption satisfies CC6.7.

out_of_scope:
  note: >-
    Physical media transport (CC6.7's removable-media aspect) is a data-handling
    process control, not a network-plane concern, and is not claimed here.
