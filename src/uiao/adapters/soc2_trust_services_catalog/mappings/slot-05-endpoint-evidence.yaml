# SOC 2 TSC Evidence Binding — Surface Slot 5: Endpoint Control Plane
#
# Federal reads this slot as NIST CM-8/IA-3 + KSI-PIY; a SOC 2 auditor reads
# endpoint management + EDR as CC6.8 (prevent/detect unauthorized software) and
# CC7.1 (configuration baseline).
#
# Slot canonical definition: src/uiao/canon/data/control-planes.yml (id: endpoint)
# Vertical: commercial-regulated (non-federal). Status: proposed.

version: "0.1.0"
status: proposed
vertical: commercial-regulated
slot: endpoint
slot_id: 5
generated_at: "2026-07-13"
standard: "AICPA SOC 2 — Trust Services Criteria (2017/2022)"
tsc_anchor: "CC6.8 / CC7.1"
substrate_source: "control-planes.yml#endpoint — endpoint management compliance state, EDR posture, device identity"

criteria:
  - id: CC6.8
    title: "Controls to prevent or detect and act upon the introduction of unauthorized or malicious software"
  - id: CC7.1
    title: "Configuration baseline and detection of unauthorized configuration change (endpoint scope)"

bindings:
  - tsc_criterion: CC6.8
    substrate_capability: "Application control + EDR runtime detection on identity-anchored devices"
    evidence_source: "Endpoint detection posture signals, application-control policy state"
    confidence: high
    rationale: >-
      Preventing/detecting unauthorized software is the application-control and
      EDR capability of the endpoint plane — the same posture evidence the
      federal vertical maps to endpoint controls satisfies CC6.8.

  - tsc_criterion: CC7.1
    substrate_capability: "Endpoint management configuration baselines + OS hardening + monthly patch cadence"
    evidence_source: "Endpoint compliance-state reports, baseline conformance re-checks"
    confidence: high
    rationale: >-
      The endpoint half of CC7.1 (config baseline + drift) is the endpoint
      management compliance state and scheduled baseline re-checks — device
      identity anchored by TPM-backed certificates as in the federal vertical.

out_of_scope:
  note: >-
    Mobile-device physical loss/theft handling is a data-handling process
    control layered on top and is not claimed here.
