# SOC 2 TSC Evidence Binding — Surface Slot 6: Security Control Plane
#
# Federal reads this slot as NIST CM-2/AC-4 + KSI-CMT; a SOC 2 auditor reads
# the incident-response and change-management enforcement as CC7.4 (respond to
# incidents) and CC8.1 (change management).
#
# Slot canonical definition: src/uiao/canon/data/control-planes.yml (id: security)
# Vertical: commercial-regulated (non-federal). Status: scaffold.

version: "0.1.0"
status: scaffold
vertical: commercial-regulated
slot: security
slot_id: 6
generated_at: "2026-07-13"
standard: "AICPA SOC 2 — Trust Services Criteria (2017/2022)"
tsc_anchor: "CC7.4 / CC8.1"
substrate_source: "control-planes.yml#security — Zero Trust enforcement, automated response, policy-as-code baselines"

criteria:
  - id: CC7.4
    title: "The entity responds to identified security incidents by executing a defined response program"
  - id: CC8.1
    title: "Change management — changes to infrastructure, data, software, and procedures are authorized, tested, and approved before deployment"

bindings:
  - tsc_criterion: CC7.4
    substrate_capability: "Automated containment / session revocation / device quarantine / network isolation"
    evidence_source: "Response-action logs from the security plane (SOAR / policy engine)"
    confidence: high
    rationale: >-
      Incident response is the security plane's automated-response repertoire
      driven by correlated telemetry — the same enforcement the federal vertical
      exercises for incident handling satisfies CC7.4.

  - tsc_criterion: CC8.1
    substrate_capability: "Policy-as-code baselines (GitHub YAML) + change-gated deployment"
    evidence_source: "Version-controlled baseline diffs, approved change records, deployment gates"
    confidence: high
    rationale: >-
      Authorized/tested/approved change is the policy-as-code model the federal
      vertical maps to CM-2/KSI-CMT: every compliance-affecting change carries a
      reviewable record before actuation. The same change-management telemetry
      satisfies CC8.1.

out_of_scope:
  note: >-
    Vendor/third-party risk management (CC9.2) and formal risk-mitigation
    programs (CC9.1) are entity-level process controls not bound to a technical
    surface slot; they are not claimed here.
