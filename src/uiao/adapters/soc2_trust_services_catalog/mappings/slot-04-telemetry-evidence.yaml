# SOC 2 TSC Evidence Binding — Surface Slot 4: Telemetry Control Plane
#
# Federal reads this slot as NIST CA-7/SI-4 + KSI-MLA; a SOC 2 auditor reads
# the SIEM correlation and drift detection as CC7.1-CC7.3 (detect config
# changes, monitor anomalies, evaluate security events). This is SOC 2's
# "system operations" core, and it is exactly the substrate's telemetry-as-control.
#
# Slot canonical definition: src/uiao/canon/data/control-planes.yml (id: telemetry)
# Vertical: commercial-regulated (non-federal). Status: active.

version: "0.1.0"
status: active
vertical: commercial-regulated
slot: telemetry
slot_id: 4
generated_at: "2026-07-13"
standard: "AICPA SOC 2 — Trust Services Criteria (2017/2022)"
tsc_anchor: "CC7.1 / CC7.2 / CC7.3"
substrate_source: "control-planes.yml#telemetry — SIEM correlation, drift detection, cross-domain evidence"

criteria:
  - id: CC7.1
    title: "Detection/monitoring procedures identify changes to configurations that introduce vulnerabilities"
  - id: CC7.2
    title: "Monitoring of system components for anomalies indicative of malicious acts or errors"
  - id: CC7.3
    title: "Evaluation of security events to determine whether they could impair the achievement of objectives"

bindings:
  - tsc_criterion: CC7.1
    substrate_capability: "Drift detection across identity/addressing/network/endpoint against canon baselines"
    evidence_source: "Drift-detection findings, configuration-change events"
    confidence: high
    rationale: >-
      Configuration-change detection is the drift taxonomy the substrate runs
      continuously — the same CA-7/SI-4 continuous-monitoring signal the federal
      vertical relies on satisfies CC7.1.

  - tsc_criterion: CC7.2
    substrate_capability: "SIEM correlation of endpoint/network/cloud/identity telemetry; anomaly detection"
    evidence_source: "Correlated SIEM alerts, anomaly-detection outputs"
    confidence: high
    rationale: >-
      Anomaly monitoring across components is the correlated-telemetry mandate
      ("no signal trusted unless correlated") — the SI-4 system-monitoring
      capability satisfies CC7.2.

  - tsc_criterion: CC7.3
    substrate_capability: "Event triage feeding closed-loop automation and the security plane"
    evidence_source: "Event-evaluation records, escalation/automation transcripts"
    confidence: medium
    rationale: >-
      Security-event evaluation is the triage stage between detection (here) and
      response (slot 6, CC7.4). The substrate produces the correlated evidence;
      the disposition workflow is the consuming layer.

out_of_scope:
  note: >-
    Availability/performance SLA monitoring (TSC Availability category A1) is a
    separate trust category and is not claimed by this Common-Criteria scaffold.
