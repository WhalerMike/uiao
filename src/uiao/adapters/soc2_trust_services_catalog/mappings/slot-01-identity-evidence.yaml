# SOC 2 TSC Evidence Binding — Surface Slot 1: Identity Control Plane
#
# The SAME slot the federal pack reads as NIST IA-2/AC-2 + FedRAMP KSI-IAM,
# a SOC 2 auditor reads as the CC6.1-CC6.3 logical-access criteria. The
# substrate evidence (Identity Provider sign-in/risk logs, ICAM governance,
# Zero Trust policy decisions) is identical; only the crosswalk differs.
#
# Slot canonical definition: src/uiao/canon/data/control-planes.yml (id: identity)
# Vertical: commercial-regulated (non-federal). Status: proposed (see __init__.py).

version: "0.1.0"
status: proposed
vertical: commercial-regulated
slot: identity
slot_id: 1
generated_at: "2026-07-13"
standard: "AICPA SOC 2 — Trust Services Criteria (2017/2022)"
tsc_anchor: "CC6.1 / CC6.2 / CC6.3"
substrate_source: "control-planes.yml#identity — Identity Provider sign-in and risk logs, ICAM governance"

criteria:
  - id: CC6.1
    title: "Logical access security — identification and authentication over protected assets"
  - id: CC6.2
    title: "Registration and authorization of new internal and external users before credential issuance"
  - id: CC6.3
    title: "Role-based authorization; access modified/removed on change of role or separation"

bindings:
  - tsc_criterion: CC6.1
    substrate_capability: "Identity Provider MFA / Authentication Strength + Zero Trust policy engine (identity + device + risk)"
    evidence_source: "Sign-in logs, Conditional Access outcomes, authentication-strength decisions"
    confidence: high
    rationale: >-
      The identity control plane enforces phishing-resistant MFA and continuous
      access evaluation as the logical-access gate. The same sign-in and risk
      telemetry that a federal reviewer maps to IA-2 satisfies CC6.1's
      identification-and-authentication requirement over protected assets.

  - tsc_criterion: CC6.2
    substrate_capability: "ICAM governance — Joiner/Mover/Leaver automation, access reviews, credentialing"
    evidence_source: "Identity governance lifecycle workflows and access-review attestations"
    confidence: high
    rationale: >-
      Registration/authorization before credential issuance is the joiner path
      of the JML lifecycle the substrate already governs (and now gates via the
      HR-quarantine step). The same lifecycle evidence a federal reviewer maps to
      AC-2 satisfies CC6.2.

  - tsc_criterion: CC6.3
    substrate_capability: "Privileged Identity Management (PIM) + role-based access + access reviews"
    evidence_source: "PIM role-activation logs, access-review outcomes, leaver de-provisioning evidence"
    confidence: high
    rationale: >-
      Role-based authorization and removal-on-separation are closed by PIM
      just-in-time activation and the leaver path of JML — the same controls a
      federal reviewer maps to AC-6 least privilege.

out_of_scope:
  note: >-
    SOC 2 CC1-CC5 (control environment, communication, risk assessment,
    monitoring, control activities) are entity-level process controls that do
    not bind to the identity surface slot and are not claimed here.
