# SOC 2 TSC Evidence Binding — Surface Slot 2: Addressing Control Plane
#
# Federal reads this slot as NIST CM-8/AC-4 + KSI-PIY; a SOC 2 auditor reads
# the deterministic IPAM/DDI inventory as the CC6.1 system-boundary and CC7.1
# asset-inventory evidence. Same authoritative addressing truth, different label.
#
# Slot canonical definition: src/uiao/canon/data/control-planes.yml (id: addressing)
# Vertical: commercial-regulated (non-federal). Status: proposed.

version: "0.1.0"
status: proposed
vertical: commercial-regulated
slot: addressing
slot_id: 2
generated_at: "2026-07-13"
standard: "AICPA SOC 2 — Trust Services Criteria (2017/2022)"
tsc_anchor: "CC6.1 (system boundary) / CC7.1 (asset inventory)"
substrate_source: "control-planes.yml#addressing — IPAM Platform, DNS/DHCP evidence, cloud IPAM reconciliation"

criteria:
  - id: CC6.1
    title: "Logical access — the entity identifies and manages the inventory of information assets that make up its system boundary"
  - id: CC7.1
    title: "Detection/monitoring — a configuration/asset baseline against which changes are detected"

bindings:
  - tsc_criterion: CC6.1
    substrate_capability: "IPAM as authoritative address/subnet inventory; no manual IP assignment permitted"
    evidence_source: "IPAM allocation records, subnet ownership, cloud-subnet reconciliation reports"
    confidence: high
    rationale: >-
      A defensible system boundary requires an authoritative asset inventory;
      the addressing plane enumerates every host by construction (the same
      CM-8 join-key truth the federal vertical relies on). You cannot draw a
      boundary around assets you cannot enumerate.

  - tsc_criterion: CC7.1
    substrate_capability: "Deterministic IPAM baseline + daily cloud reconciliation (conflicts trigger alerts)"
    evidence_source: "Reconciliation diffs, conflict/remediation alerts"
    confidence: medium
    rationale: >-
      The IPAM baseline plus daily reconciliation provides the known-good asset
      state against which unauthorized additions are detected — the addressing
      half of CC7.1. Configuration-drift detection for endpoints/services is
      carried by slots 4-5.

out_of_scope:
  note: >-
    Physical asset custody and facilities controls are not modeled by the
    addressing plane and are not claimed here.
