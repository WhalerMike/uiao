# Pre-commit hooks for UIAO monorepo.
#
# Install with:   pre-commit install
# Run all files:  pre-commit run --all-files
#
# Goal: every blocking CI gate on main also fires locally before push.
#   - ruff check + ruff format  → mirrors .github/workflows/ruff.yml
#   - mypy src/uiao              → mirrors .github/workflows/mypy.yml
#   - check-metaschema           → fast subset of schema-validation.yml
#   - substrate drift            → mirrors .github/workflows/substrate-drift.yml
#   - sitemap drift              → mirrors .github/workflows/sitemap-drift.yml
#   - document-index drift       → mirrors .github/workflows/document-index-status.yml
#   - metadata validator         → mirrors .github/workflows/metadata-validator.yml
#
# Post-ADR-032 paths: all Python lives under src/uiao/, tests/, scripts/,
# deploy/, diagrams/; schemas under src/uiao/schemas/. Legacy impl/ and
# core/ paths are retired (see ADR-032 / ADR-044).

repos:
  # --------------------------------------------------------------------
  # Baseline hygiene — whitespace, line endings, JSON/YAML/TOML parse
  # --------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # AAN generated artifacts own their own trailing-newline format (the
        # render_*.py generators emit it and drift-gate it). Letting the generic
        # fixer also rewrite it makes the two tools fight: the fixer strips the
        # generator's double trailing newline, which then trips the drift gate.
        exclude: |
          (?x)^inbox/Application\ Aware\ Networking/(
            authorities/.*\.md
            |OrgComp_Spine_Crosswalk\.md
            |OrgComp_Claim_Evidence_Test_Matrix\.md
            |OrgComp_CR26_Reconciliation\.md
            |OrgComp_Implementation_Coverage\.md
          )$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=4096]
        # The AAN deliverable kit is a whitelisted binary (see inbox/.gitignore);
        # it is intentionally tracked and exceeds the 4 MB guard. Exempt only the
        # kit zip so the guard still catches every other oversized file.
        exclude: '^docs/customer-documents/orgcomp-series/OrgComp_Federal_Series_Complete.*\.zip$'
      - id: mixed-line-ending
        args: [--fix=lf]

  # --------------------------------------------------------------------
  # Python: ruff check + format (mirrors .github/workflows/ruff.yml)
  # --------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src/uiao|tests|scripts|deploy|diagrams)/.*\.py$
      - id: ruff-format
        files: ^(src/uiao|tests|scripts|deploy|diagrams)/.*\.py$

  # --------------------------------------------------------------------
  # Python: mypy strict (mirrors .github/workflows/mypy.yml)
  #
  # Runs against src/uiao/ only; tests/ and scripts/ are mypy-excluded
  # at the pyproject.toml level. Uses the project's own type stubs and
  # config.
  # --------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (src/uiao, strict)
        files: ^src/uiao/.*\.py$
        args: [--ignore-missing-imports, --config-file=pyproject.toml]
        additional_dependencies:
          - pydantic>=2.8
          - pydantic-settings>=2.0
          - types-PyYAML
          - types-requests
          - types-redis
          - typer>=0.12

  # --------------------------------------------------------------------
  # Schema metaschema check (fast subset of schema-validation.yml)
  # --------------------------------------------------------------------
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.29.3
    hooks:
      - id: check-metaschema
        files: ^src/uiao/schemas/.*\.schema\.json$

  # --------------------------------------------------------------------
  # Local hooks — wire the uiao CLI and canon validators for pre-push
  # enforcement of substrate integrity + canon frontmatter.
  # --------------------------------------------------------------------
  - repo: local
    hooks:
      # Blocks accidental commit of files that should have been
      # gitignored (docs/_site/, docs/exports/**/*.pptx, etc.).
      - id: block-tracked-build-artifacts
        name: Block tracked build artifacts
        entry: scripts/check_staged_build_artifacts.sh
        language: system
        pass_filenames: false

      # Substrate drift — mirrors .github/workflows/substrate-drift.yml.
      # Runs only when canon / schemas / substrate code / docs are staged.
      - id: substrate-drift
        name: uiao substrate drift (matches CI — any finding blocks)
        entry: uiao substrate drift
        language: system
        pass_filenames: false
        files: ^(src/uiao/canon|src/uiao/schemas|src/uiao/substrate|docs)/

      # Metadata validator — mirrors the inline body of
      # .github/workflows/metadata-validator.yml.
      - id: metadata-validator
        name: Validate canon document frontmatter
        entry: python scripts/validate_canon_frontmatter.py
        language: system
        pass_filenames: false
        files: ^src/uiao/canon/.*\.md$

      # Publication-gap scanner — mirrors
      # .github/workflows/publication-gap.yml. Per ADR-072 the scanner runs
      # two passes: (1) every canon doc whose publish_to_site is true (or
      # defaults to true via the path-pattern rules in
      # scripts/scan_publication_gaps.py) must have a corresponding .qmd
      # entry in docs/_quarto.yml; and (2) every .qmd on disk matching
      # REGISTRATION_REQUIRED_GLOBS (orgpath-narrative Book_*.qmd today)
      # must be referenced in docs/_quarto.yml — catching pages authored
      # directly under docs/ that were never wired into the sidebar. Runs
      # in --strict mode (read-only; does not write report files).
      - id: publication-gap
        name: Scan for canon docs / site pages missing from the published site
        entry: python scripts/scan_publication_gaps.py --strict
        language: system
        pass_filenames: false
        files: ^(src/uiao/canon/|src/uiao/modernization/|src/uiao/schemas/|docs/_quarto\.yml|docs/.*\.qmd|scripts/scan_publication_gaps\.py)

      # Sitemap drift — mirrors .github/workflows/sitemap-drift.yml.
      # Regenerates docs/data/sitemap-tree.md from the sidebar + .qmd tree;
      # pre-commit fails if the committed file drifts. Closes the gap that
      # let the ADR renumber land a stale sitemap on main (#928).
      - id: sitemap-drift
        name: Regenerate sitemap tree (matches sitemap-drift.yml)
        entry: python scripts/generate_sitemap.py --output docs/data/sitemap-tree.md
        language: system
        pass_filenames: false
        files: ^(docs/_quarto\.yml|docs/.*\.qmd|docs/data/sitemap-tree\.md|scripts/generate_sitemap\.py)$

      # Document-index drift — mirrors .github/workflows/document-index-status.yml.
      # Regenerates docs/data/document-index-tables.md from the
      # customer-documents tree; pre-commit fails if the committed file drifts.
      # Closes the gap that let the platform pages land a stale table on main (#938).
      - id: document-index-drift
        name: Regenerate document-index tables (matches document-index-status.yml)
        entry: python scripts/generate_document_index.py --output docs/data/document-index-tables.md
        language: system
        pass_filenames: false
        files: ^(docs/customer-documents/.*\.qmd|docs/data/document-index-tables\.md|scripts/generate_document_index\.py)$

      # Repo-review round 2: alt-text was the one fully manual drift surface.
      # Debt was zero across 1,100 figure refs when this landed; the gate pins
      # it there (matches the step in customer-docs-status.yml).
      - id: figure-alt-presence
        name: Every customer-document figure carries alt text
        entry: python scripts/check_figure_alt_presence.py
        language: system
        pass_filenames: false
        files: ^(docs/customer-documents/.*\.qmd|scripts/check_figure_alt_presence\.py)$

      # Rebuild-coverage drift — B.1.3 §6.1 fix-coverage matrix is generated
      # from the per-row `rebuild:` block in gcc-moderate-telemetry-gaps.yaml.
      # Regenerates the marked region in B.1.3; pre-commit fails if it drifts,
      # so the verdict table can never diverge from the YAML source of truth.
      - id: rebuild-coverage-drift
        name: Regenerate B.1.3 fix-coverage matrix (from gcc-moderate-telemetry-gaps.yaml)
        entry: python scripts/generate_rebuild_coverage.py
        language: system
        pass_filenames: false
        files: ^(src/uiao/canon/data/gcc-moderate-telemetry-gaps\.yaml|docs/customer-documents/orgcomp-series/boundary/B1-3-rebuilding-boundary-blocked-analytics\.qmd|scripts/generate_rebuild_coverage\.py)$

      # AAN authorities-table drift — each Federal AAN book's "Authorities Closed
      # Here" partial is generated from orgcomp-compliance-spine.yml by
      # render_authorities_table.py. This gate fails when a committed partial
      # diverges from what the spine now produces, so the crosswalk's source
      # tables can never silently drift from the SSOT (AAN critique Concern 4).
      # Matches .github/workflows/orgcomp-authorities-drift.yml.
      - id: orgcomp-authorities-drift
        name: AAN authorities-table drift (render_authorities_table.py --check)
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python render_authorities_table.py --check authorities'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(orgcomp-compliance-spine\.yml|authorities/.*\.md|render_authorities_table\.py)$

      # Inline authorities tables copied into the .qmd (same marker comment) are
      # hand-maintained and were NOT covered by --check — which let a control->KSI
      # mapping drift (CM-8 mislabelled KSI-CMT instead of KSI-PIY, PR #1192).
      # --check-inline validates each inline row's Control -> KSI against the spine.
      - id: aan-authorities-inline-drift
        name: AAN inline authorities control->KSI drift (render_authorities_table.py --check-inline)
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python render_authorities_table.py --check-inline'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(orgcomp-compliance-spine\.yml|Vol_.*\.qmd|render_authorities_table\.py)$

      # AAN CR26 reconciliation drift — OrgComp_CR26_Reconciliation.md is generated by
      # render_cr26_reconciliation.py from the 29 internal KSI rule YAMLs and the
      # in-repo FedRAMP CR26 OSCAL catalog. This gate fails when the committed
      # diff diverges from what those sources now produce, so the ADR-111 -> CR26
      # coverage claim can never silently drift (AAN critique Priority 2).
      # Matches .github/workflows/orgcomp-authorities-drift.yml.
      - id: aan-cr26-reconciliation-drift
        name: AAN CR26 reconciliation drift (render_cr26_reconciliation.py --check)
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python render_cr26_reconciliation.py --check'
        language: system
        pass_filenames: false
        files: ^(docs/customer-documents/orgcomp-series/(render_cr26_reconciliation\.py|OrgComp_CR26_Reconciliation\.md)|src/uiao/ksi/rules/.*\.yaml|src/uiao/canon/compliance/reference/fedramp-cr26/.*)$

      # AAN day-2 control-map validation — the Vol IX servicenow-day2 control
      # maps declare themselves a 'projection of orgcomp-compliance-spine.yml,
      # CI-validated against it'. This gate makes that claim true: it checks
      # every catalog item's slot against the spine, its KSI theme against the
      # CR26 catalog, the boundary, and schema completeness.
      # Matches .github/workflows/orgcomp-authorities-drift.yml.
      # A control map is a claim; this asserts code actually actuates it. Every
      # item names a method that exists, or declares why it cannot (the backlog).
      - id: aan-day2-actuator-coverage
        name: "AAN day-2 actuator coverage (check_actuator_coverage.py)"
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series/servicenow-day2" && python check_actuator_coverage.py'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(servicenow-day2/(check_actuator_coverage\.py|.*-control-map\.json|script-includes/.*\.js)|x_fed_compliance/(data/control-map\.json|script-includes/.*\.js))$

      # ADR-092 s4: the federal production ceiling is L3 — a human approves before
      # anything changes the estate. `approval: automated` on an estate write is an
      # L4 claim and needs a Governance-Plane decision behind it. Four such items
      # once existed with none, justified by an "L4 note" that did not exist. Every
      # automated item must now declare "estate_write": false (it changes nothing —
      # reading is not actuating) or an "l4_adr" that resolves on disk.
      # NOTE: this cannot check L4 conditions 2-5 (blast radius, rollback, dry-run
      # record, halt_on_critical) — those need human judgment. It makes the claim
      # explicit and attributable, not true.
      # A book's declared reference-doc must be the one the build actually passes.
      # Every book said `lz-reference.docx` while the render scripts passed
      # `orgcomp-reference.docx` on the CLI. Pandoc ignores Quarto's nested
      # format.docx.reference-doc key, so the CLI won and the declaration was
      # decorative — and wrong. Harmless until Quarto renders these books, at which
      # point the front matter wins and silently drops the AAN callout/FouoBanner
      # styles (lz-reference lacks them; aan-reference is lz plus exactly those).
      # The text would survive, so it would have looked fine.
      - id: aan-reference-doc-truth
        name: "AAN books declare the reference doc the build actually uses"
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python check_reference_doc_truth.py'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(check_reference_doc_truth\.py|Vol_.*_Book_.*\.qmd|render_all_docx\.sh|build_distribution_kit\.sh)$

      # Quarto CLAIMS `::: {.callout-*}` and rewrites those divs in its own pipeline
      # before any user filter runs — measured: rendering an AAN book with Quarto
      # dropped every house style and produced its own red-bordered widget, and
      # attaching the filter did not help (byte-identical output; the filter never
      # sees a div Quarto already took). The `aan-*` names take the divs back. This
      # keeps them taken: no Quarto-owned classes, the filter is declared, every
      # class is mapped. A regression looks fine under Pandoc — the CLI passes the
      # filter — so it would only surface once the site renders it.
      # The series is being made generic to the federal government so it can publish
      # without the "INTERNAL" framing. Authorship is the most visible agency
      # identity in a book — front matter, .docx title block, deck — and 50 of 58
      # were bylined to a specific agency team. Covers authorship ONLY; agency
      # identity in prose, figures and domains is a larger surface handled
      # separately, so passing this does NOT mean a book is generic.
      # A ServiceNow scope is `x_<company>_<app>`, so the agency name was baked into
      # 244 references across six depths: directory name, Script Include headers,
      # ~41 gs.getProperty() calls, 14 cross-scope constructors, <sys_scope> in the
      # ATF XML, and six Python gates hardcoding the path. Now x_fed_day2_ops /
      # x_fed_compliance. This needs a gate rather than a one-time sweep because a
      # scope string is a pure identifier nothing validates: a PARTIAL rename does
      # not fail at lint, it fails at runtime when a cross-scope constructor cannot
      # resolve. Nothing here executes ServiceNow, so a half-rename would sit in the
      # repo looking correct. The closed sweep register is exempt — see the script.
      # Every other AAN gate globs Vol_*_Book_*.qmd and reports on what it finds;
      # none asserts how many books there SHOULD be. So a book that moves, is
      # renamed, or is deleted fails nothing — every gate just measures a smaller
      # corpus and says OK. That is the same silent-denominator failure that let
      # check_actuator_coverage report 96% for a real 84%, and it is the specific
      # risk of the pending move to docs/ (21 tools glob their own directory).
      # Both directions: every registered book exists, every book on disk is
      # registered.
      - id: aan-book-registry
        name: "AAN book registry and disk agree (the corpus cannot silently shrink)"
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python check_book_registry.py'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(check_book_registry\.py|orgcomp-compliance-spine\.yml|Vol_.*_Book_.*\.qmd)$

      - id: aan-scope-naming
        name: "AAN ServiceNow scopes carry no agency identity"
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python check_scope_naming.py'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/

      - id: aan-engine-neutrality
        name: "AAN corpus names no governance engine (UIAO ratchet)"
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python check_engine_neutrality.py'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/

      - id: aan-generic-authorship
        name: "AAN books are not bylined to a specific agency or internal team"
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python check_generic_authorship.py'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(check_generic_authorship\.py|Vol_.*_Book_.*\.qmd)$

      - id: aan-callout-classes
        name: "AAN owns its callout classes (Quarto must not claim them)"
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python check_callout_classes.py'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(check_callout_classes\.py|Vol_.*_Book_.*\.qmd|orgcomp-callouts\.lua)$

      - id: aan-day2-l3-ceiling
        name: "AAN day-2 L3 ceiling — no undeclared autonomous estate writes"
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series/servicenow-day2" && python check_l3_ceiling.py'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(servicenow-day2/(check_l3_ceiling\.py|.*-control-map\.json)|x_fed_compliance/data/control-map\.json)$

      # Lane C "the form is the contract": the catalog variable set must supply
      # every parameter EntraHelpdeskClient/Gate actually read, and a secret
      # (tempPassword) must be MID-resolved, never a form field (IA-5).
      - id: aan-day2-catalog-contract
        name: "AAN day-2 catalog<->Script-Include contract (contract_check.py)"
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series/servicenow-day2/catalog" && python contract_check.py'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/servicenow-day2/(catalog/.*|script-includes/.*\.js|helpdesk-control-map\.json)$

      - id: aan-day2-control-maps
        name: AAN day-2 control-map validation (validate_day2_control_maps.py)
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python validate_day2_control_maps.py'
        language: system
        pass_filenames: false
        files: ^(docs/customer-documents/orgcomp-series/(validate_day2_control_maps\.py|orgcomp-compliance-spine\.yml|servicenow-day2/.*)|src/uiao/canon/compliance/reference/fedramp-cr26/.*)$

      # AAN claim -> evidence -> test matrix — generated from the spine closures;
      # fails when the committed matrix drifts from what the spine now produces,
      # so the traceability view (and its honest 15/65 coverage numbers) stays
      # current (AAN critique v2 Concern 4).
      - id: aan-claim-evidence-test
        name: AAN claim-evidence-test matrix drift (render_claim_evidence_test.py --check)
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python render_claim_evidence_test.py --check'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(render_claim_evidence_test\.py|OrgComp_Claim_Evidence_Test_Matrix\.md|orgcomp-compliance-spine\.yml)$

      # AAN spine-derived control crosswalk — the machine-derived slice of the
      # series master crosswalk, rendered from the spine closures. Fails when the
      # committed crosswalk drifts from what the spine now produces, so the
      # generated slice (and its honest 15/66-book coverage) tracks the spine as
      # it is back-filled (AAN critique: crosswalk generator + drift gate).
      # Matches .github/workflows/orgcomp-authorities-drift.yml.
      - id: aan-crosswalk-drift
        name: AAN spine-derived crosswalk drift (render_crosswalk.py --check)
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python render_crosswalk.py --check'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(render_crosswalk\.py|OrgComp_Spine_Crosswalk\.md|orgcomp-compliance-spine\.yml|Vol_0_Book_02_OrgComp_Control_Crosswalk\.qmd)$

      # The crosswalk-drift gate above only proves the *generated slice* is
      # self-consistent — it never checks the hand-maintained master table
      # actually contains every spine closure. That gap let AC-2(3)/AC-2(4)/
      # SA-9(2) and four books go un-indexed while every gate stayed green.
      # This asserts spine ⊆ master (control-level) + designation completeness.
      - id: aan-crosswalk-superset
        name: AAN crosswalk/designation superset of spine (check_crosswalk_superset.py)
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python check_crosswalk_superset.py'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(check_crosswalk_superset\.py|render_crosswalk\.py|orgcomp-compliance-spine\.yml|Vol_0_Book_02_OrgComp_Control_Crosswalk\.qmd|Vol_0_Book_00_OrgComp_Executive_Summary\.qmd)$

      # "Controls closed: N (enumeration)" headlines are hand-authored — the
      # number and its list drift apart (Book 01 read 16 for an 18-item list).
      # This asserts N equals the comma-group count of its own enumeration.
      - id: aan-control-closed-counts
        name: "AAN 'Controls closed: N' matches its enumeration (check_control_closed_counts.py)"
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python check_control_closed_counts.py'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(check_control_closed_counts\.py|.*\.qmd)$

      # Vendor FedRAMP/GCC authorization facts are external — the one drift class
      # a spine gate can't cover. Enforce the series' own citation convention
      # instead: a "Yes — FedRAMP/GCC <level>" cell must carry a Marketplace
      # source (FR#### / fedramp.gov), like the supply-chain table's Infoblox row.
      - id: aan-vendor-auth-sources
        name: "AAN vendor FedRAMP/GCC authorization cells carry a Marketplace source"
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python check_vendor_authorization_sources.py'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(check_vendor_authorization_sources\.py|.*\.qmd)$

      # Vol VII Book 06's catalog tables are a projection of the Lane F control
      # map. They were hand-written once (2026-07-14) — the same defect as the
      # Vol 0 Book 02 master table: correct on the day, silently wrong the first
      # time the map changes. Now generated from the map's phase/summary fields.
      - id: aan-book-catalog
        name: AAN Book 06 catalog drift (render_book_catalog.py --check)
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python render_book_catalog.py --check'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(render_book_catalog\.py|servicenow-day2/saas-control-map\.json|Vol_IX_Book_05_OrgComp_SaaS_Integration_Governance\.qmd)$

      # The generated tables above are gated; the books' PROSE quotes the same
      # numbers by hand ("68 closures across 17 of 67 books") and was not. Adding
      # one book silently falsified four such sentences across three Vol 0 books
      # on 2026-07-14. This asserts each matched count against the spine.
      - id: aan-prose-counts
        name: AAN prose spine-count drift (check_prose_counts.py --strict)
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python check_prose_counts.py --strict'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(check_prose_counts\.py|orgcomp-compliance-spine\.yml|OrgComp_Claim_Evidence_Test_Matrix\.md|Vol_0_Book_0(0|0a|2)_OrgComp_.*\.qmd)$

      # Content-correctness gate suite (2026-07-14): federal deadlines vs the
      # authority registry; control ids/titles vs the vendored NIST Rev 5
      # catalog; the no-FedRAMP-High ratchet + crossref integrity; tracked
      # derivative Date Codes; the ServiceNow implementation-coverage matrix.
      - id: orgcomp-authority-deadlines
        name: AAN federal-deadline claims vs authority registry
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python check_authority_deadlines.py'
        language: system
        pass_filenames: false
        files: ^docs/customer-documents/orgcomp-series/(check_authority_deadlines\.py|orgcomp-authority-deadlines\.yml|Vol_.*\.qmd|decks/.*\.yaml|specs/.*\.yaml|federal-orgcomp-conmon-gap-roadmap\.md)$
      - id: aan-control-citations
        name: AAN control ids/titles vs NIST Rev 5 catalog
        entry: bash -c 'cd "docs/customer-documents/orgcomp-series" && python check_control_citations.py'
